<script>
const CHAPTER_DATA = {"chapter": {"key": "preinternet", "title": "Avant internet", "sourceUrl": "https://luminara.tech/#/scene?s=3&c=preinternet", "centralIdea": "L'information devient un pouvoir", "centerX": 500, "centerY": 445, "ring": 300, "lede": "Comment l'information devient un pouvoir : de la rareté et des signaux à la société en réseau.", "lang": "fr"}, "lenses": [{"id": "chronology", "label": "Chronologie", "accent": "#7dd3fc", "description": "L'ordre des événements et le passage de la rareté de l'information aux flux de données."}, {"id": "power", "label": "Pouvoir", "accent": "#f87171", "description": "Qui contrôle l'information : institutions, protocoles, réseaux ou plateformes."}, {"id": "technology", "label": "Technologies", "accent": "#34d399", "description": "Inventions et protocoles : signal, hypertexte, paquets, TCP/IP, Web."}, {"id": "media", "label": "Médias", "accent": "#fbbf24", "description": "Comment le support de transmission transforme la perception, les comportements et l'organisation de la société."}, {"id": "privacy", "label": "Confidentialité", "accent": "#c084fc", "description": "La cryptographie comme protection contre la surveillance et le contrôle."}], "nodes": [{"id": "scarcity", "sceneIndex": 0, "x": 500.0, "y": 145.0, "type": "power", "title": "L'information comme rareté", "shortTitle": "Rareté", "insight": "Avant internet, l'information était physiquement coûteuse et centralisée; cela en faisait un outil de pouvoir pour ceux qui possédaient l'équipement.", "body": "## Un monde où les mots coûtaient de l'argent\n\nTu lis ceci sur un écran. Quelque part dans un centre de données, un serveur t'a envoyé ce texte en quelques millisecondes, et cela ne t'a rien coûté. Cela semble aller de soi, comme l'électricité ou l'eau courante. Mais cela n'a pas toujours été le cas. Et comprendre comment c'était « avant » n'est pas une simple curiosité historique, c'est la clé pour comprendre pourquoi l'internet moderne est construit exactement ainsi. Et pourquoi c'est un problème.\n\nIl y a seulement soixante-dix ans, envoyer un message de Kyiv à New York coûtait de l'argent, prenait des jours et était contrôlé par ceux qui possédaient le matériel: les États, les entreprises de télégraphe, les rédactions de journaux. L'information était une rareté, exactement comme le pétrole ou les céréales. Et comme toute rareté, c'était du pouvoir. Celui qui contrôlait la transmission de l'information contrôlait la réalité.\n\nImagine une imprimerie du milieu du XXe siècle. D'énormes machines métalliques, des caractères en plomb, l'odeur de l'encre et de l'huile. Pour faire parvenir une idée à un million de personnes, il fallait imprimer physiquement un million d'exemplaires d'un journal, les charger dans des camions et les distribuer aux kiosques dans tout le pays. Chaque exemplaire coûtait de l'argent. Chaque kilomètre de livraison coûtait de l'argent. Une faute de frappe dans le tirage, et c'était de l'argent jeté par la fenêtre, une réputation abîmée. C'était un mécanisme immense, lourd et lent.\n\nLa radio et la télévision semblaient être une révolution: le signal se propage à la vitesse de la lumière, pas besoin de camions. Mais elles avaient une limite fondamentale: un émetteur, des millions de récepteurs. Seule la personne qui avait la tour pouvait parler. Le reste de l'humanité écoutait. Impossible de décrocher et de répondre. Impossible de contester. Impossible d'ajouter sa propre voix.\n\nVoilà à quoi ressemblait le monde de l'information avant internet: centralisé, coûteux, à sens unique. Quelques sources diffusaient vers beaucoup. L'information coulait strictement de haut en bas, de ceux qui avaient l'équipement vers ceux qui n'en avaient pas. Ce n'était ni un hasard ni une intention malveillante: c'était la réalité physique des technologies de l'époque.\n\n> L'information n'était pas seulement une ressource, c'était l'architecture du pouvoir. Celui qui possédait le canal de transmission possédait la réalité.\n\nC'est précisément pour cela que les premières personnes qui ont compris qu'on pouvait changer cette architecture ont saisi quelque chose de révolutionnaire. Pas seulement que « les données pouvaient être transmises plus vite ». Mais que « la structure même du pouvoir sur l'information pouvait être brisée ». Et elles ont commencé à y travailler bien avant l'apparition du premier navigateur.", "tags": ["pouvoir", "rareté", "médias"], "lensWeight": {"chronology": 5, "power": 5, "technology": 1, "media": 4, "privacy": 1}, "angDeg": -90.0, "sources": [{"title": "Claude Shannon — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Vannevar Bush — As We May Think (1945)", "url": ""}, {"title": "Daniel Bell — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Alvin Toffler — The Third Wave (1980)", "url": ""}, {"title": "Marshall McLuhan — Understanding Media (1964)", "url": ""}, {"title": "Nicholas Negroponte — Being Digital (1995)", "url": ""}, {"title": "Douglas Rushkoff — Media Virus! (1994)", "url": ""}, {"title": "Stewart Brand — Information Wants to Be Free (1984)", "url": ""}, {"title": "Eric Hughes — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Manuel Castells — The Information Age (1996–1998)", "url": ""}], "era": "avant 1948"}, {"id": "shannon", "sceneIndex": 1, "x": 692.8, "y": 215.2, "type": "technology", "title": "Shannon : l'information est devenue physique", "shortTitle": "Shannon", "insight": "Shannon a montré que l'information peut être mesurée et transmise comme une grandeur physique; cela a posé la base mathématique de tout le monde numérique.", "body": "## L'homme qui a mesuré la pensée\n\nEn 1948, le mathématicien américain Claude Shannon publia un article au titre technique et austère, \"A Mathematical Theory of Communication\". Peu de gens l'ont lu à l'époque. Peu de gens le lisent encore aujourd'hui. Pourtant, il a changé le monde plus que la plupart des livres lus par tout le monde.\n\nShannon a démontré quelque chose qui semblait impossible : n'importe quel message — un mot, un son, une image, un nombre, une odeur décrite avec des mots — peut être mesuré avec précision, compressé et transmis par n'importe quel canal de communication. Il a appelé l'unité de mesure \"bit\", de binary digit. Zéro ou un. Il y a un signal ou il n'y en a pas. Tout l'univers de l'information n'est qu'une combinaison de zéros et de uns.\n\nAvant Shannon, l'information était quelque chose de flou et de subjectif. Certains mots étaient \"plus importants\" que d'autres. Certaines images étaient \"plus parlantes\". Certains messages étaient \"plus riches\". Après Shannon, l'information est devenue une grandeur physique, aussi réelle et mesurable que la masse ou la température. Le monde a cessé de se diviser uniquement entre la matière et l'énergie. Une troisième chose est apparue: l'information. Et cette troisième chose s'est révélée tout aussi fondamentale que les deux premières.\n\n## Une flamme de bougie à travers l'océan\n\nPour comprendre ce que Shannon a fait, imagine cette tâche: transmettre la flamme d'une bougie de Kyiv à Tokyo. Tu peux transporter la bougie elle-même, mais c'est lent, coûteux, et la flamme s'éteindra en route. C'est le transfert de matière, et il est limité par les lois physiques.\n\nMais tu peux décrire la flamme: sa couleur, sa hauteur, sa température, sa forme, la composition chimique de la cire. Envoyer cette description à la vitesse de la lumière par un fil. Et une autre personne à Tokyo allumera exactement la même flamme. C'est le transfert d'information, et il ne connaît pas de limites physiques.\n\nShannon a montré que cette seconde méthode pouvait être rendue absolument précise, fiable et évolutive. Que tout signal peut être encodé en bits, transmis sans distorsion puis reconstruit de l'autre côté. Tout le monde numérique repose là-dessus: du courrier électronique au streaming 4K, des applications de messagerie à la blockchain.\n\nChaque fois que tu envoies un message sur Telegram, Shannon est à l'œuvre. Chaque fois qu'une transaction sur la blockchain est transmise entre les nœuds du réseau, Shannon est à l'œuvre. Il a créé le fondement mathématique sur lequel repose tout le numérique.\n\n> Shannon n'a pas inventé Internet. Il a prouvé qu'Internet était possible, que l'information peut être transmise avec précision, comme une grandeur physique.\n\nLe paradoxe, c'est que Shannon lui-même a travaillé chez Bell Laboratories, le plus grand monopole téléphonique du monde. Sa découverte a fini par détruire le monopole de son employeur. Lorsque l'information peut être transmise par n'importe quel canal, cela signifie qu'aucun canal ne peut rester éternellement un monopole.", "tags": ["signal", "codage", "mesure"], "lensWeight": {"chronology": 4, "power": 2, "technology": 5, "media": 2, "privacy": 2}, "angDeg": -50.0, "sources": [{"title": "Claude Shannon — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Vannevar Bush — As We May Think (1945)", "url": ""}, {"title": "Daniel Bell — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Alvin Toffler — The Third Wave (1980)", "url": ""}, {"title": "Marshall McLuhan — Understanding Media (1964)", "url": ""}, {"title": "Nicholas Negroponte — Being Digital (1995)", "url": ""}, {"title": "Douglas Rushkoff — Media Virus! (1994)", "url": ""}, {"title": "Stewart Brand — Information Wants to Be Free (1984)", "url": ""}, {"title": "Eric Hughes — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Manuel Castells — The Information Age (1996–1998)", "url": ""}], "era": "1948"}, {"id": "memex", "sceneIndex": 2, "x": 795.4, "y": 392.9, "type": "media", "title": "Le Memex de Bush: un rêve en avance sur son temps", "shortTitle": "Memex", "insight": "En 1945, Vannevar Bush a décrit l'hypertexte et les connaissances reliées, 46 ans avant le Web. Les bonnes idées ne meurent pas; elles attendent leurs technologies.", "body": "## L’hypertexte quarante ans avant Internet\n\nEn 1945, deux ans avant l’apparition du premier ordinateur pleinement opérationnel et quarante-six ans avant le World Wide Web, le scientifique américain Vannevar Bush rédigea un essai intitulé « As We May Think ». Il fut publié dans The Atlantic, non pas dans une revue scientifique, mais dans un magazine grand public destiné à un large lectorat. Bush voulait être lu par tout le monde, et pas seulement par ses collègues scientifiques.\n\nIl décrivit un appareil qu’il appela « memex », de memory extender, un prolongateur de mémoire. C’était une bibliothèque personnelle de tout le savoir humain, où n’importe quel document est relié à n’importe quel autre par le sens. Vous lisez un article sur Napoléon, et d’un seul geste vous passez à la carte de ses campagnes. De la carte, aux lettres de ses généraux. Des lettres, à l’analyse de sa tactique par des historiens militaires du XXe siècle. Vous ne cherchez pas dans un catalogue alphabétique, vous ne feuilletez pas des rayonnages: vous suivez la chaîne de la pensée, comme la pensée elle-même.\n\nC’était de l’hypertexte. Quarante ans avant que le mot ne soit officiellement inventé. Quarante-six ans avant que Tim Berners-Lee ne mette cette idée en œuvre sous la forme du World Wide Web.\n\n## Pourquoi le rêve est resté dans un tiroir\n\nBush voyait l’avenir avec une clarté totale: le savoir devait être relié, accessible à tous et appartenir à tous. Un seul problème subsistait: les technologies n’existaient pas encore. En 1945, les ordinateurs occupaient des pièces entières, coûtaient autant que des avions et ne savaient que calculer. Pas d’écrans, pas de souris, pas de réseaux. Bush décrivit l’appareil en termes de microfilms et de leviers mécaniques, parce que c’était tout ce qu’il avait sous la main pour faire une analogie.\n\nSon rêve resta dans un tiroir pendant près d’un demi-siècle. Mais il ne fut pas oublié. On le lut, on le cita, on le transmit de main en main. Ted Nelson forgea en 1965 le mot « hypertext », directement inspiré par Bush. Douglas Engelbart créa la souris d’ordinateur et un système de documents hypertextuels, lui aussi sous l’influence de Bush.\n\nLorsque Tim Berners-Lee rédigea en 1989 sa proposition pour créer le Web au CERN, il renvoya directement à l’essai de Bush comme idée d’origine. Quarante-quatre ans après sa publication, le rêve reçut enfin les outils nécessaires à sa réalisation.\n\nCette histoire n’a d’importance non comme curiosité historique. Elle montre quelque chose de fondamental: la bonne idée ne meurt pas. Elle attend son moment. Parfois pendant des décennies. Aujourd’hui, nous vivons un moment similaire: les idées d’un internet décentralisé, où les utilisateurs possèdent leurs données, existaient bien avant la blockchain. Les technologies ont simplement fini par rattraper la vision.\n\n> Bush a décrit le World Wide Web quarante-six ans avant son invention. Non pas parce qu’il était un prophète, mais parce qu’il avait compris ce que l’esprit humain attend des outils de connaissance.\n\nParadoxalement, en 1945, Bush pensait aux liens entre les idées, alors qu’au final nous avons obtenu un internet où les liens entre les personnes se sont révélés plus importants que les liens entre les idées. C’est une différence importante, et nous y reviendrons dans les chapitres suivants.", "tags": ["hypertexte", "connaissance", "associations"], "lensWeight": {"chronology": 4, "power": 2, "technology": 4, "media": 5, "privacy": 1}, "angDeg": -10.0, "sources": [{"title": "Claude Shannon — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Vannevar Bush — As We May Think (1945)", "url": ""}, {"title": "Daniel Bell — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Alvin Toffler — The Third Wave (1980)", "url": ""}, {"title": "Marshall McLuhan — Understanding Media (1964)", "url": ""}, {"title": "Nicholas Negroponte — Being Digital (1995)", "url": ""}, {"title": "Douglas Rushkoff — Media Virus! (1994)", "url": ""}, {"title": "Stewart Brand — Information Wants to Be Free (1984)", "url": ""}, {"title": "Eric Hughes — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Manuel Castells — The Information Age (1996–1998)", "url": ""}], "era": "1945"}, {"id": "arpanet", "sceneIndex": 3, "x": 759.8, "y": 595.0, "type": "technology", "title": "ARPANET : Internet est né de la peur", "shortTitle": "ARPANET", "insight": "ARPANET a été créé comme un système de communication militaire sans point de défaillance unique, et cette architecture décentralisée est devenue le fondement de tout Internet.", "body": "## Le satellite qui a changé l'architecture du monde\n\nL'histoire d'Internet ne commence ni dans la Silicon Valley ni dans les amphithéâtres universitaires. Elle commence au Pentagone, en pleine guerre froide, dans un moment de peur géopolitique aiguë.\n\nLe 4 octobre 1957, l'Union soviétique a lancé le premier satellite artificiel de la Terre. Une petite sphère métallique de 58 centimètres de diamètre, pesant 83 kilos, survolait la Terre en émettant des bips, et le monde entier l'entendait. Pour les militaires américains, ce n'était pas seulement le triomphe technologique d'un rival. C'était un signal d'alarme: l'ennemi contrôle l'orbite. S'ils peuvent lancer un satellite, ils peuvent lancer un missile à tête nucléaire et atteindre n'importe quel point de la planète.\n\nUn an plus tard, les États-Unis ont créé DARPA, la Defense Advanced Research Projects Agency. Sa mission était de créer un système de communication militaire impossible à détruire d'un seul coup. Les réseaux téléphoniques traditionnels étaient catastrophiquement vulnérables: là où il y a un central téléphonique, il y a un point de défaillance. Une bombe sur le Pentagone, et la communication avec toute l'armée est perdue.\n\n## Un réseau sans centre, l'idée qui a tout changé\n\nLes ingénieurs de DARPA ont imaginé une solution radicalement différente. Et si on supprimait complètement le centre? Faire de chaque nœud du réseau un élément égal. Si l'un tombe en panne, le message trouve automatiquement un autre chemin. Comme l'eau dans des tuyaux: si un tuyau est bouché, l'eau trouve un détour.\n\nIls ont appelé cette idée ARPANET. En 1969, elle a fonctionné pour la première fois: quatre universités, UCLA, Stanford, UC Santa Barbara et Utah, ont échangé des données par une ligne téléphonique. Le premier message qu'ils ont essayé d'envoyer était le mot \"login\". Le système a planté après la lettre \"o\". Le premier mot transmis sur le proto-Internet était \"lo\", ce qui en anglais signifie \"regarde\". Une poésie accidentelle.\n\nPersonne n'imaginait alors que cela deviendrait le socle de l'Internet civil mondial. Les militaires voulaient une communication fiable en cas de guerre nucléaire. Ils ont créé quelque chose de plus vaste: une architecture dans laquelle le pouvoir ne peut pas, structurellement, se concentrer en un seul point. Un réseau distribué est, par nature, résistant à la centralisation.\n\nDu moins, c'était l'idée. La réalité s'est révélée plus complexe, et nous en parlerons dans les chapitres suivants.\n\n> Internet a été créé comme un système de communication militaire résistant à une frappe nucléaire. Au final, il s'est révélé résistant à toute centralisation du pouvoir, et c'est devenu sa principale propriété politique.\n\nEn 1974, Vinton Cerf et Robert Kahn ont résolu le problème suivant: différents ordinateurs parlaient différentes langues. Le réseau de Stanford ne comprenait pas celui du MIT. Ils ont créé TCP/IP, un protocole universel, un langage commun pour transmettre des données entre n'importe quels réseaux. Les données sont découpées en petits paquets, chacun trouve son propre chemin, et à l'autre bout, elles sont réassemblées. Comme si tu découpais une lettre en morceaux, envoyais chaque morceau avec un coursier différent, et qu'ils se réassemblaient quand même dans le bon ordre chez le destinataire. Ce même protocole reste aujourd'hui le fondement d'Internet, cinquante ans après sa création.", "tags": ["paquets", "DARPA", "TCP/IP", "décentralisation"], "lensWeight": {"chronology": 5, "power": 5, "technology": 5, "media": 2, "privacy": 3}, "angDeg": 30.0, "sources": [{"title": "Claude Shannon — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Vannevar Bush — As We May Think (1945)", "url": ""}, {"title": "Daniel Bell — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Alvin Toffler — The Third Wave (1980)", "url": ""}, {"title": "Marshall McLuhan — Understanding Media (1964)", "url": ""}, {"title": "Nicholas Negroponte — Being Digital (1995)", "url": ""}, {"title": "Douglas Rushkoff — Media Virus! (1994)", "url": ""}, {"title": "Stewart Brand — Information Wants to Be Free (1984)", "url": ""}, {"title": "Eric Hughes — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Manuel Castells — The Information Age (1996–1998)", "url": ""}], "era": "1969"}, {"id": "open-web", "sceneIndex": 4, "x": 602.6, "y": 726.9, "type": "technology", "title": "Berners-Lee: la décision de tout offrir gratuitement", "shortTitle": "Web ouvert", "insight": "Berners-Lee a offert le Web gratuitement, non par altruisme, mais parce qu'il a compris qu'un protocole ouvert est le seul qui puisse devenir mondial.", "body": "## Une proposition marquée \"vague, mais excitante\"\n\nEn 1989, un jeune programmeur britannique nommé Tim Berners-Lee travaillait au CERN, l'Organisation européenne pour la recherche nucléaire à Genève. C'est le plus grand institut scientifique du monde: des milliers de scientifiques venus de dizaines de pays travaillent sur les mêmes expériences, mais perdent sans cesse des documents, oublient le contexte, et passent des mois à essayer de comprendre ce qui avait déjà été fait avant eux.\n\nBerners-Lee a rédigé une proposition interne pour la direction. L'idée: créer un système dans lequel tous les documents seraient reliés par des liens et accessibles depuis n'importe quel ordinateur du réseau. Son supérieur, Mike Sendall, a écrit trois mots dans la marge: \"Vague, mais excitant\". C'était la critique la plus modeste jamais faite à une invention qui allait changer le monde.\n\nEn trois ans, Berners-Lee a créé trois éléments sur lesquels repose tout l'internet moderne: HTML, le langage de balisage des documents; HTTP, le protocole de leur transfert; et URL, le système d'adressage. Ensemble, ils ont formé le World Wide Web. Les documents sont stockés sur des serveurs, ont des adresses, sont reliés par des liens et s'ouvrent via un navigateur. Simple, élégant, universel.\n\n## La décision qui a défini une époque\n\nMais la décision clé n'était pas technique. Elle était éthique.\n\nBerners-Lee aurait pu breveter son invention. Les juristes du CERN le lui ont proposé. Si chaque site avait payé des redevances pour utiliser HTTP, Berners-Lee serait devenu l'homme le plus riche de la planète. À la place, il a insisté pour offrir la technologie à l'humanité gratuitement, sans restrictions, sans licences, sans conditions.\n\n\"Si le Web avait été breveté ou placé sous le contrôle d'une seule entreprise, il n'aurait pas existé\", expliqua-t-il plus tard. Ce n'était pas de l'altruisme pour l'altruisme lui-même. C'était une stratégie: sans barrières seulement, le réseau pouvait atteindre une échelle mondiale. Ce n'est que si chacun peut créer un site sans autorisation que le réseau devient vraiment ouvert.\n\nEn 1993, des étudiants du Centre national pour les applications de supercalcul des États-Unis ont lancé le navigateur Mosaic, le premier à afficher du texte et des images ensemble sur un seul écran. Jusqu'alors, internet était un monde de texte. Mosaic l'a rendu visuel. Et compréhensible pour une personne ordinaire qui n'avait jamais appris la programmation.\n\nLa même année, le nombre de sites web a dépassé les cinq cents. Aujourd'hui cela paraît drôle, mais à l'époque c'était une explosion. Deux ans plus tard, ils étaient déjà deux cent mille. La course avait commencé.\n\n> Berners-Lee a offert Web gratuitement et, ce faisant, l'a rendu mondial. S'il l'avait breveté, nous paierions encore des redevances pour chaque lien.\n\nCette histoire sur Berners-Lee n'est pas seulement un fait biographique. C'est une leçon sur la nature des réseaux: les protocoles ouverts croissent plus vite que les fermés, parce que n'importe qui peut bâtir dessus. C'est précisément pour cela que la blockchain Ethereum est ouverte. C'est précisément pour cela que TON est un protocole ouvert. En 1991, Berners-Lee a posé un principe qui détermine encore quelles technologies gagnent.", "tags": ["Web", "protocole", "ouverture"], "lensWeight": {"chronology": 5, "power": 4, "technology": 5, "media": 4, "privacy": 2}, "angDeg": 70.0, "sources": [{"title": "Claude Shannon — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Vannevar Bush — As We May Think (1945)", "url": ""}, {"title": "Daniel Bell — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Alvin Toffler — The Third Wave (1980)", "url": ""}, {"title": "Marshall McLuhan — Understanding Media (1964)", "url": ""}, {"title": "Nicholas Negroponte — Being Digital (1995)", "url": ""}, {"title": "Douglas Rushkoff — Media Virus! (1994)", "url": ""}, {"title": "Stewart Brand — Information Wants to Be Free (1984)", "url": ""}, {"title": "Eric Hughes — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Manuel Castells — The Information Age (1996–1998)", "url": ""}], "era": "1991"}, {"id": "atoms-to-bits", "sceneIndex": 5, "x": 397.4, "y": 726.9, "type": "economy", "title": "Des atomes aux bits : un changement de logique économique", "shortTitle": "Atomes → bits", "insight": "Le passage \"des atomes aux bits\" n’est pas seulement une question de technologie ; c’est un changement de logique économique, de l’échelle du même à la singularité de chaque interaction.", "body": "## Toffler l’a vu en 1980\n\nLorsque Alvin Toffler publie La Troisième Vague en 1980, les ordinateurs personnels existaient à peine. Il n’y avait pas d’internet. Il n’y avait pas de téléphones mobiles. Et pourtant, il décrit une transformation économique qui ne se déploiera pleinement que quarante ans plus tard.\n\nToffler décrit trois ères de la civilisation humaine. La première vague est agraire : la terre et la récolte comme valeur principale. La deuxième vague est industrielle : la chaîne de montage, la standardisation, la production de masse. Une usine produit mille réfrigérateurs identiques, et c’est précisément parce qu’ils sont identiques que c’est efficace. Plus le nombre d’unités produites augmente, plus le coût de chacune diminue. L’échelle, c’est la victoire de l’économie industrielle.\n\nLa troisième vague est informationnelle. Et ici, la logique s’inverse complètement. Dans l’économie de l’information, copier ne coûte rien. Un programme peut se comporter différemment avec un milliard d’utilisateurs en même temps, et ce n’est pas un bug, mais son principal avantage. La valeur ne se crée pas en reproduisant le même, mais par la singularité de chaque interaction.\n\n## Nicholas Negroponte et la formule la plus simple\n\nEn 1995, le directeur du MIT Media Lab, Nicholas Negroponte, l’a résumé dans une formule devenue célèbre : \"des atomes aux bits\".\n\nLes atomes, c’est le monde physique. Pour produire un réfrigérateur, il faut du métal, du plastique, de l’électronique, de la main-d’œuvre et une usine. Pour le livrer à l’acheteur, il faut un camion, un entrepôt et un magasin. Chaque copie coûte de l’argent. Le tirage est limité par les ressources. Si vous voulez vendre un million de réfrigérateurs, vous devez en produire un million.\n\nLes bits, c’est le monde numérique. Pour créer un programme, il faut un développeur et un ordinateur. Pour le livrer à un milliard d’utilisateurs, il faut un serveur et une connexion internet. La copie est pratiquement gratuite. La livraison est instantanée. Le tirage est infini. Si vous voulez vendre un milliard de copies d’un programme, vous n’avez pas besoin de fabriquer un milliard de programmes. Une copie se réplique un milliard de fois.\n\nCe n’est pas seulement une différence technologique. C’est un changement de logique économique fondamentale. Toute l’économie du XXe siècle reposait sur la logique des atomes : rareté, échelle, standardisation. L’économie du XXIe siècle repose sur la logique des bits : abondance, personnalisation, effets de réseau.\n\n> L’économie industrielle gagnait de l’argent grâce à l’échelle du même. L’économie de l’information gagne de l’argent grâce à la singularité de chaque interaction. Ce sont des logiques opposées.\n\nQuand on comprend cette différence, beaucoup de choses dans le monde moderne commencent à s’expliquer. Pourquoi Google est-il gratuit ? Parce que copier les résultats de recherche ne coûte rien, et la monétisation passe par la publicité. Pourquoi Spotify paie-t-il si peu les musiciens ? Parce que le coût marginal d’un stream tend vers zéro. Pourquoi les cryptomonnaies sont-elles possibles ? Parce que les actifs numériques peuvent être transférés sans support physique. Tout cela découle d’un même principe que Negroponte a formulé en trois mots.", "tags": ["économie", "bits", "échelle"], "lensWeight": {"chronology": 4, "power": 4, "technology": 3, "media": 3, "privacy": 1}, "angDeg": 110.0, "sources": [{"title": "Claude Shannon — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Vannevar Bush — As We May Think (1945)", "url": ""}, {"title": "Daniel Bell — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Alvin Toffler — The Third Wave (1980)", "url": ""}, {"title": "Marshall McLuhan — Understanding Media (1964)", "url": ""}, {"title": "Nicholas Negroponte — Being Digital (1995)", "url": ""}, {"title": "Douglas Rushkoff — Media Virus! (1994)", "url": ""}, {"title": "Stewart Brand — Information Wants to Be Free (1984)", "url": ""}, {"title": "Eric Hughes — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Manuel Castells — The Information Age (1996–1998)", "url": ""}], "era": "1995"}, {"id": "media-effects", "sceneIndex": 6, "x": 240.2, "y": 595.0, "type": "media", "title": "McLuhan et les virus de Rushkoff : les médias nous changent", "shortTitle": "Médias", "insight": "McLuhan et Rushkoff ont compris que l'essentiel n'est pas l'information, mais le milieu par lequel elle passe. Les médias nous changent indépendamment du contenu, à travers une structure que nous ne voyons pas.", "body": "## Le support compte plus que le message\n\nMarshall McLuhan était un penseur encombrant. En 1964, il a écrit une formule d'abord prise pour une absurdité, puis pour une métaphore, et seulement plus tard comprise comme une description technique exacte de la réalité : « Le médium est le message ».\n\nQue voulait-il dire ? Quand la télévision de masse est apparue dans les années 1950, tout le monde débattait du contenu : bonnes ou mauvaises émissions, éducatives ou divertissantes, propagande ou art. McLuhan disait : c'est une question secondaire. La télévision elle-même - comme milieu, comme technologie, comme mode de perception - avait déjà changé la société, indépendamment de ce qui y était montré.\n\nPour la première fois dans l'histoire, la télévision a synchronisé des millions de personnes : les mêmes informations au même moment, dans les mêmes mots, dans toutes les maisons du pays en même temps. Elle a créé ce que McLuhan a appelé le « village global » - un monde où chacun vit le même événement au même moment. Avant la télévision, les habitants de villes différentes vivaient dans des réalités informationnelles différentes. Après, ils vivaient dans une seule.\n\n## La métaphore biologique de Rushkoff\n\nEn 1994, le théoricien américain des médias Douglas Rushkoff a ajouté à l'idée de McLuhan une métaphore biologique, et elle s'est révélée encore plus juste. Dans le livre *Media Virus!*, il a décrit le mécanisme qu'on appelle aujourd'hui le contenu viral, dix ans avant YouTube et vingt ans avant TikTok.\n\nLes idées se propagent comme des virus. Non parce qu'elles sont vraies. Non parce qu'elles sont utiles. Mais parce qu'elles touchent une vulnérabilité psychologique du public - ce qui pousse les gens à les relayer : la peur, l'indignation, l'enthousiasme, la reconnaissance, la colère, la tendresse. L'émotion est le mécanisme de réplication d'une idée.\n\nRushkoff a montré qu'un contenu qui déclenche une forte émotion se diffuse indépendamment de sa vérité ou de son utilité. Une nouvelle scandaleuse circule plus vite qu'une nouvelle vraie. Une histoire effrayante se répand plus vite qu'une histoire ennuyeuse. Ce n'est ni un hasard ni une manipulation - c'est une caractéristique structurelle du milieu médiatique. Un virus ne choisit pas son hôte selon le critère de « bonne ou mauvaise personne ». Il choisit selon le critère de « vulnérable ou non ».\n\nBien avant les algorithmes de TikTok, précisément optimisés pour cela, Rushkoff a décrit le principe sur lequel ils reposent. L'algorithme n'a pas créé la viralité. Il a simplement appris à l'amplifier.\n\n> McLuhan avertissait : ce qui compte n'est pas l'émission, mais le téléviseur. Rushkoff précisait : ce qui compte n'est pas l'idée, mais l'émotion qu'elle suscite. Ensemble, ils ont décrit l'architecture des réseaux sociaux modernes trente ans avant leur apparition.\n\nQuand internet est apparu, la première question portait à nouveau sur le contenu : qu'allait-on y lire et y regarder ? McLuhan aurait dit : mauvaise question. La bonne est : que fait à l'être humain le milieu même dans lequel il passe de plus en plus de temps ? Cette question est devenue cruciale avec l'apparition des réseaux sociaux. Malheureusement, elle a été posée trop tard.", "tags": ["médias", "comportement", "perception"], "lensWeight": {"chronology": 3, "power": 3, "technology": 1, "media": 5, "privacy": 2}, "angDeg": 150.0, "sources": [{"title": "Claude Shannon — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Vannevar Bush — As We May Think (1945)", "url": ""}, {"title": "Daniel Bell — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Alvin Toffler — The Third Wave (1980)", "url": ""}, {"title": "Marshall McLuhan — Understanding Media (1964)", "url": ""}, {"title": "Nicholas Negroponte — Being Digital (1995)", "url": ""}, {"title": "Douglas Rushkoff — Media Virus! (1994)", "url": ""}, {"title": "Stewart Brand — Information Wants to Be Free (1984)", "url": ""}, {"title": "Eric Hughes — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Manuel Castells — The Information Age (1996–1998)", "url": ""}], "era": "1964–1990"}, {"id": "cypherpunks", "sceneIndex": 7, "x": 204.6, "y": 392.9, "type": "privacy", "title": "Hughes et les cypherpunks : la vie privée, c’est des mathématiques", "shortTitle": "Cypherpunks", "insight": "En 1993, Hughes a prévu la crise de la vie privée et a exigé une protection mathématique - son manifeste est devenu le fondement idéologique de Bitcoin et de tout Web3.", "body": "## La voix qui a averti à l'avance\n\nEn 1993, alors que la plupart des gens entendaient pour la première fois le mot « internet », le mathématicien et cryptographe Eric Hughes a rédigé un document de trois pages. Il s'intitulait « A Cypherpunk's Manifesto » et a été publié sur la liste de diffusion d'une petite communauté de personnes qui travaillaient sur la cryptographie et réfléchissaient aux conséquences de l'apparition d'un réseau public.\n\nÀ l'époque, internet commençait tout juste à devenir accessible au grand public. Les premiers navigateurs venaient à peine d'apparaître. Personne ne pensait encore à la vie privée en ligne - les gens se réjouissaient simplement des nouvelles possibilités : on pouvait correspondre avec des personnes à l'autre bout de la planète ! On pouvait lire les informations en temps réel ! On pouvait trouver n'importe quelle information !\n\nHughes voyait les choses autrement. Son argument était simple et imparable : un internet ouvert signifie que chacune de vos actions en ligne est potentiellement visible par tout le monde - fournisseurs d'accès, États, entreprises. Ce n'est pas une vulnérabilité accidentelle. C'est une caractéristique architecturale d'un système qui, volontairement ou non, a été conçu exactement ainsi. Et la seule façon de protéger la vie privée dans ces conditions n'est pas de demander la permission aux fournisseurs et aux États, mais d'utiliser les mathématiques. La cryptographie. Des mathématiques qu'aucune loi ne peut casser.\n\n## Une prophétie devenue littéralement réalité\n\nHughes écrivait en 1993 : « La vie privée dans une société ouverte exige des systèmes de transaction anonymes. » Cela ressemblait à de la science-fiction. La plupart des lecteurs haussaient les épaules : « Je n'ai rien à cacher. » Pourquoi une personne ordinaire aurait-elle besoin de transactions anonymes ?\n\nTrente ans plus tard, nous vivons dans un monde où les entreprises en savent plus sur les utilisateurs que leurs proches. Où les fuites de données font partie des nouvelles quotidiennes. Où chaque achat par carte, chaque requête de recherche, chaque déplacement avec un téléphone allumé est enregistré et conservé. Hughes n'était pas paranoïaque. Il pensait simplement plusieurs coups à l'avance.\n\nLes cypherpunks - une petite communauté rassemblée autour de cette idée au début des années 1990 - ont fini par poser les bases idéologiques de Bitcoin. En 2008, Satoshi Nakamoto a publié la description de Bitcoin précisément sur la liste de diffusion des cypherpunks. C'était une réponse directe à la question de Hughes : voici votre système de transaction anonyme, construit sur les mathématiques et non sur la confiance envers un intermédiaire.\n\nEn 1984, Stewart Brand a prononcé la phrase devenue un manifeste de l'internet ouvert : « L'information veut être libre. » Il parlait de la nature de l'information - elle ne diminue pas quand on la copie, donc les barrières artificielles vont à l'encontre de sa nature. Hughes a complété cette idée de l'autre côté : la liberté de l'information sans vie privée n'est pas la liberté, mais de la transparence pour ceux qui observent.\n\n> Brand a dit : l'information veut être libre. Hughes a répondu : et la vie privée veut être protégée par les mathématiques. Ensemble, ils ont décrit les deux pôles de la liberté numérique.\n\nCes deux principes - l'ouverture et la vie privée - se contredisent en quelque sorte. Et la tension entre eux définit encore les grands débats sur ce que devrait être internet. Comment rendre le savoir accessible à tous tout en protégeant les données personnelles de chacun ? Cette question n'est pas encore résolue. Et c'est précisément ce que Web3 essaie de résoudre.", "tags": ["cryptographie", "confidentialité", "surveillance"], "lensWeight": {"chronology": 3, "power": 4, "technology": 4, "media": 2, "privacy": 5}, "angDeg": 190.0, "sources": [{"title": "Claude Shannon — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Vannevar Bush — As We May Think (1945)", "url": ""}, {"title": "Daniel Bell — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Alvin Toffler — The Third Wave (1980)", "url": ""}, {"title": "Marshall McLuhan — Understanding Media (1964)", "url": ""}, {"title": "Nicholas Negroponte — Being Digital (1995)", "url": ""}, {"title": "Douglas Rushkoff — Media Virus! (1994)", "url": ""}, {"title": "Stewart Brand — Information Wants to Be Free (1984)", "url": ""}, {"title": "Eric Hughes — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Manuel Castells — The Information Age (1996–1998)", "url": ""}], "era": "1993"}, {"id": "castells", "sceneIndex": 8, "x": 307.2, "y": 215.2, "type": "power", "title": "Castells : le pouvoir a basculé vers les flux", "shortTitle": "Flux", "insight": "Castells a montré que le pouvoir est passé du contrôle des lieux au contrôle des flux de données et d’attention, ce qui l’a rendu invisible et difficile à contester.", "body": "## La révolution que personne n’a remarquée\n\nAu milieu des années 1990, le sociologue espagnol Manuel Castells observait une transformation qui se déroulait au grand jour - et a écrit un ouvrage en trois volumes sur ce que la plupart des gens ne voyaient pas. La révolution de l’information avait déjà eu lieu. Simplement, les gens la cherchaient au mauvais endroit.\n\nIls attendaient des voitures volantes et des robots dans la cuisine. Ils attendaient l’avenir fantastique promis par les magazines de vulgarisation scientifique des années 1960. Mais la révolution se jouait dans les salles de serveurs des banques, dans les centres logistiques des grandes entreprises mondiales, dans les flux financiers entre les continents. Dans les années 1990, l’argent avait déjà cessé d’être physique : il était devenu des flux de données entre serveurs. La production avait cessé d’être locale : elle était devenue un réseau mondial de fournisseurs, où la conception est faite en Californie, les pièces fabriquées en Chine, l’assemblage au Vietnam, et la vente partout. Le pouvoir ne se mesurait plus au territoire.\n\n## L’espace des lieux face à l’espace des flux\n\nCastells a introduit une distinction qui aide à comprendre le monde moderne. L’ancien pouvoir contrôlait « l’espace des lieux » : usines, ports, frontières, territoires. Des points physiques que l’on peut occuper, défendre, tenir. Le nouveau pouvoir contrôle « l’espace des flux » : données, capital, attention, information.\n\nCe sont des formes de pouvoir fondamentalement différentes. Le pouvoir territorial se voit sur une carte : voici la frontière, voici l’armée, voici le château. Le pouvoir sur les flux est invisible. Où se situe le pouvoir de Google ? Nulle part et partout à la fois. Où se situe le pouvoir de Facebook ? Dans l’algorithme qui détermine ce que voient des milliards de personnes. Où se situe le pouvoir de Bitcoin ? Dans un réseau distribué qui n’a pas de lieu physique.\n\nCastells a montré que celui qui contrôle les flux contrôle le monde. Et cette observation s’est révélée terriblement juste. Cinq ou six entreprises technologiques contrôlent la majeure partie des flux d’information de la planète. Elles ne possèdent pas de territoires. Elles possèdent des algorithmes qui déterminent ce que les gens voient, lisent, achètent et en quoi ils croient.\n\nDaniel Bell avait déjà prévu, en 1973, la transition vers une société post-industrielle où la ressource principale est l’information et où les institutions principales ne sont pas les usines, mais les universités et les laboratoires de recherche. Dans les années 1990, Castells a vu que cela s’était produit, mais le pouvoir sur l’information s’était concentré dans un tout autre lieu que les universités.\n\n> L’ancien pouvoir contrôlait les lieux. Le nouveau pouvoir contrôle les flux. Et les flux sont bien plus difficiles à contester que le territoire.\n\nC’est la question fondamentale qui traverse tout le cours : comment le pouvoir s’organise-t-il dans un monde où l’information est la ressource principale ? Qui le contrôle ? Comment se concentre-t-il ? Et que se passe-t-il quand quelques entreprises s’emparent du contrôle de la majeure partie des flux d’information de la planète ? Les chapitres suivants parlent de cela.", "tags": ["flux", "société", "pouvoir"], "lensWeight": {"chronology": 4, "power": 5, "technology": 2, "media": 4, "privacy": 3}, "angDeg": 230.0, "sources": [{"title": "Claude Shannon — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Vannevar Bush — As We May Think (1945)", "url": ""}, {"title": "Daniel Bell — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Alvin Toffler — The Third Wave (1980)", "url": ""}, {"title": "Marshall McLuhan — Understanding Media (1964)", "url": ""}, {"title": "Nicholas Negroponte — Being Digital (1995)", "url": ""}, {"title": "Douglas Rushkoff — Media Virus! (1994)", "url": ""}, {"title": "Stewart Brand — Information Wants to Be Free (1984)", "url": ""}, {"title": "Eric Hughes — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Manuel Castells — The Information Age (1996–1998)", "url": ""}], "era": "1996"}], "edges": [{"from": "scarcity", "to": "shannon", "label": "de la rareté à la mesure", "lenses": ["chronology", "technology"]}, {"from": "shannon", "to": "arpanet", "label": "le signal devient réseau", "lenses": ["chronology", "technology"]}, {"from": "memex", "to": "open-web", "label": "l'hypertexte devient le Web", "lenses": ["chronology", "media", "technology"]}, {"from": "arpanet", "to": "open-web", "label": "résilience et ouverture", "lenses": ["chronology", "power", "technology"]}, {"from": "open-web", "to": "atoms-to-bits", "label": "l'ouverture accélère la copie", "lenses": ["power", "technology"]}, {"from": "atoms-to-bits", "to": "castells", "label": "l'économie devient des flux", "lenses": ["power", "media"]}, {"from": "media-effects", "to": "castells", "label": "les médias façonnent la société en réseau", "lenses": ["media", "power"]}, {"from": "arpanet", "to": "cypherpunks", "label": "le réseau exige une protection", "lenses": ["privacy", "technology", "power"]}, {"from": "cypherpunks", "to": "castells", "label": "la vie privée dans les flux", "lenses": ["privacy", "power"]}, {"from": "scarcity", "to": "castells", "label": "du contrôle d'accès au contrôle des flux", "lenses": ["power"]}], "ui": {"eyebrow": "Luminara · Fondements", "sectionLenses": "Prismes d'interprétation", "sectionScenes": "Scènes du chapitre", "detailLabel": "Détail", "detailEmpty": "Choisis un nœud sur la carte : la thèse, l'idée clé, les sources et les idées liées apparaîtront ici. Les prismes en haut changent ce qui est mis en avant et recolorent le centre.", "related": "Idées liées", "sources": "Sources", "readScene": "Lire la scène", "centerLabel": "Idée centrale", "progress": "Exploré", "progressOf": "sur", " <body>
<main class="app-shell">
  <section class="control-rail">
    <div><p class="eyebrow">Luminara · Fondements</p><h1 id="app-title">Avant internet</h1></div>

    <svg class="system-map" viewBox="0 0 1000 890" role="img" preserveAspectRatio="xMidYMid meet"><title id="map-title">Avant internet</title><desc id="map-desc">L'information devient un pouvoir</desc></svg>
    <div class="empty-state" hidden></div>
  </section>

<dialog class="scene-dialog"></dialog>
<script>
const state={lens:"chronology",selected:null,visited:new Set(),entered:false};
const byId=id=>CHAPTER_DATA.nodes.find(n=>n.id===id);
const SVGNS="http://www.w3.org/2000/svg";
const el=(t,a)=>{const e=document.createElementNS(SVGNS,t);for(const k in(a||{}))e.setAttribute(k,a[k]);return e;};
function typeColor(t){return{power:"#c0392b",technology:"#1f7a5a",media:"#b7791f",privacy:"#6b4fa0",economy:"#a04a7a"}[t]||"#b7791f";}
function typeLabel(t){const u=CHAPTER_DATA.ui;return{power:u.typePower,technology:u.typeTechnology,media:u.typeMedia,privacy:u.typePrivacy,economy:u.typeEconomy}[t]||"";}
function lensById(id){return CHAPTER_DATA.lenses.find(l=>l.id===id);}
function edgeActive(e){return e.lenses.includes(state.lens);}
function nodeWeight(n){return(n.lensWeight&&n.lensWeight[state.lens])||0;}
const CX=CHAPTER_DATA.chapter.centerX||500, CY=CHAPTER_DATA.chapter.centerY||445, RING=CHAPTER_DATA.chapter.ring||300;

function buildLenses(){
  const w=document.querySelector(".lens-group");w.innerHTML="";
  CHAPTER_DATA.lenses.forEach(l=>{const b=document.createElement("button");b.className="lens-btn";b.type="button";
    b.setAttribute("aria-pressed",String(l.id===state.lens));b.style.setProperty("--dot",l.accent);
    b.innerHTML=`<span class="lens-dot"></span>${l.label}`;b.addEventListener("click",()=>setLens(l.id));w.appendChild(b);});
}
function setLens(id){state.lens=id;const l=lensById(id);
  const d=document.querySelector(".lens-desc");if(d)d.textContent=l?l.description:"";
  document.querySelectorAll(".lens-btn").forEach((b,i)=>b.setAttribute("aria-pressed",String(CHAPTER_DATA.lenses[i].id===id)));
  renderAll();}

function curve(a,b){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;const dx=mx-CX,dy=my-CY,len=Math.hypot(dx,dy)||1;const bow=26;
  return `M ${a.x} ${a.y} Q ${mx+(dx/len)*bow} ${my+(dy/len)*bow} ${b.x} ${b.y}`;}

function defs(){
  const d=el("defs");
  const mk=(id,color)=>{const m=el("marker",{id,viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"});
    const p=el("path",{d:"M0 0 L10 5 L0 10 z",fill:color});m.appendChild(p);return m;};
  d.appendChild(mk("arrow-active", lensById(state.lens)?lensById(state.lens).accent:"#b7791f"));
  return d;
}

function renderMap(){
  const svg=document.querySelector(".system-map");if(!svg)return;
  [...svg.querySelectorAll("defs,g,.ring,.ring-tick,.era-label,.spoke")].forEach(n=>n.remove());
  svg.appendChild(defs());
  // rings
  const gDeco=el("g",{});
  [RING*0.55,RING].forEach(r=>gDeco.appendChild(el("circle",{class:"ring",cx:CX,cy:CY,r})));
  svg.appendChild(gDeco);
  // spokes + chronology era labels around outer ring
  const gSpoke=el("g",{});
  CHAPTER_DATA.nodes.forEach(n=>{
    gSpoke.appendChild(el("line",{class:"spoke",x1:CX,y1:CY,x2:n.x,y2:n.y}));
  });
  svg.appendChild(gSpoke);

  // edges (with directional arrows on active)
  const gE=el("g",{});
  CHAPTER_DATA.edges.forEach(e=>{const a=byId(e.from),b=byId(e.to);if(!a||!b)return;
    const active=edgeActive(e);const g=el("g",{class:"edge"+(active?" active":"")});
    if(active)g.style.setProperty("--dot",lensById(state.lens).accent);
    const d=curve(a,b);const p=el("path",{d});
    // approximate length for draw animation
    const len=Math.round(Math.hypot(b.x-a.x,b.y-a.y)*1.15);
    p.style.setProperty("--len",len);
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const lb=el("text",{class:"edge-label",x:mx,y:my-5,"text-anchor":"middle"});lb.textContent=e.label;
    g.appendChild(p);g.appendChild(lb);gE.appendChild(g);});
  svg.appendChild(gE);

  // center (breathing, lens-tinted ring)
  const gC=el("g",{});
  gC.style.setProperty("--dot", lensById(state.lens)?lensById(state.lens).accent:"#b7791f");
  gC.appendChild(el("circle",{class:"center-halo",cx:CX,cy:CY,r:78}));
  gC.appendChild(el("circle",{class:"center-ring",cx:CX,cy:CY,r:72}));
  gC.appendChild(el("circle",{class:"center-disc",cx:CX,cy:CY,r:66}));
  const t2=el("text",{class:"center-t2",x:CX,y:CY-20});t2.textContent=CHAPTER_DATA.ui.centerLabel;gC.appendChild(t2);
  wrapText(gC,CHAPTER_DATA.chapter.centralIdea,CX,CY+2,120,"center-t1",17);
  svg.appendChild(gC);

  // nodes with smart outward labels + era
  const gN=el("g",{});
  CHAPTER_DATA.nodes.forEach((n,i)=>{
    const g=el("g",{class:"node"+(state.selected===n.id?" selected":""),tabindex:"0",role:"button","aria-label":`${n.sceneIndex+1}. ${n.title} (${n.era||""})`});
    g.style.setProperty("--dot",typeColor(n.type));
    g.style.setProperty("--ox",n.x+"px");g.style.setProperty("--oy",n.y+"px");
    if(!state.entered) g.style.setProperty("--delay",(0.15+i*0.06)+"s"); else g.style.animation="none",g.style.opacity="1";
    if(state.selected){const linked=CHAPTER_DATA.edges.some(e=>(e.from===state.selected&&e.to===n.id)||(e.to===state.selected&&e.from===n.id));
      if(n.id!==state.selected&&!linked)g.classList.add("dim");}
    else if(nodeWeight(n)<=1){g.classList.add("dim");}
    g.appendChild(el("circle",{class:"halo",cx:n.x,cy:n.y,r:34}));
    g.appendChild(el("circle",{class:"disc",cx:n.x,cy:n.y,r:26}));
    const num=el("text",{class:"num",x:n.x,y:n.y});num.textContent=String(n.sceneIndex+1);g.appendChild(num);

    // smart label placement: outward along the radius from center
    const dx=n.x-CX,dy=n.y-CY,len=Math.hypot(dx,dy)||1;
    const ux=dx/len,uy=dy/len;
    const lx=n.x+ux*40, ly=n.y+uy*40;
    // anchor by horizontal side
    const anchor = ux>0.25?"start":(ux<-0.25?"end":"middle");
    const era=el("text",{class:"era",x:lx,y:ly-13,"text-anchor":anchor});era.textContent=n.era||"";g.appendChild(era);
    const kick=el("text",{class:"kicker",x:lx,y:ly-1,"text-anchor":anchor});kick.textContent=typeLabel(n.type);g.appendChild(kick);
    wrapTextAnchored(g,n.shortTitle,lx,ly+13,150,"cap",13,anchor);

    g.addEventListener("click",()=>selectNode(n.id));
    g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();selectNode(n.id);}});
    gN.appendChild(g);
  });
  svg.appendChild(gN);
  state.entered=true;
}
function wrapText(parent,text,x,y,maxw,cls,fs){wrapTextAnchored(parent,text,x,y,maxw,cls,fs,"middle");}
function wrapTextAnchored(parent,text,x,y,maxw,cls,fs,anchor){
  const words=String(text).split(/\s+/);const lines=[];let line="";
  const approx=s=>s.length*(fs*0.56);
  words.forEach(w=>{const t=line?line+" "+w:w;if(approx(t)>maxw&&line){lines.push(line);line=w;}else line=t;});
  if(line)lines.push(line);const total=(lines.length-1)*(fs+2);
  lines.forEach((ln,i)=>{const t=el("text",{class:cls,x,y:y-total/2+i*(fs+2),"text-anchor":anchor});t.textContent=ln;parent.appendChild(t);});
}

function renderNodeList(){const nav=document.querySelector(".node-list");if(!nav)return;nav.innerHTML="";
  CHAPTER_DATA.nodes.slice().sort((a,b)=>a.sceneIndex-b.sceneIndex).forEach(n=>{
    const b=document.createElement("button");b.type="button";b.setAttribute("aria-current",String(state.selected===n.id));b.style.setProperty("--dot",typeColor(n.type));
    b.innerHTML=`<span class="node-idx">${String(n.sceneIndex+1).padStart(2,"0")}</span><span>${n.shortTitle}</span>`;
    b.addEventListener("click",()=>selectNode(n.id));nav.appendChild(b);});}
function renderProgress(){const box=document.querySelector(".progress-box");if(!box)return;
  const total=CHAPTER_DATA.nodes.length,seen=state.visited.size;
  box.innerHTML=`${CHAPTER_DATA.ui.progress} ${seen} ${CHAPTER_DATA.ui.progressOf} ${total}<div class="progress-bar"><div class="progress-fill" style="width:${Math.round(seen/total*100)}%"></div></div>`;}
function firstSentence(txt){return String(txt).replace(/^##[^\n]*\n+/,"").split(/(?<=[.!?])\s/)[0]||"";}
function renderDetail(){const p=document.querySelector(".detail-panel");if(!p)return;
  if(!state.selected){p.innerHTML=`<p class="eyebrow">${CHAPTER_DATA.ui.detailLabel}</p><p class="detail-empty">${CHAPTER_DATA.ui.detailEmpty}</p>`;return;}
  const n=byId(state.selected);const c=typeColor(n.type);
  const related=CHAPTER_DATA.edges.filter(e=>e.from===n.id||e.to===n.id).map(e=>({node:byId(e.from===n.id?e.to:e.from),label:e.label})).filter(x=>x.node);
  const srcs=(n.sources||[]).slice(0,10);
  p.innerHTML=`<p class="detail-kicker" style="--dot:${c}">${CHAPTER_DATA.ui.scene} ${n.sceneIndex+1} · ${typeLabel(n.type)}${n.era?" · "+n.era:""}</p>
    <h3 class="detail-title">${n.title}</h3>
    <p class="detail-thesis">${firstSentence(n.body)}</p>
    <p class="detail-insight" style="--dot:${c}">${n.insight}</p>
    <div class="chips">${(n.tags||[]).map(t=>`<span class="chip">${t}</span>`).join("")}</div>
    <div class="related"><h4>${CHAPTER_DATA.ui.related}</h4><div class="related-list">
      ${related.map(r=>`<button type="button" data-go="${r.node.id}">${r.node.shortTitle} · <span style="color:var(--muted)">${r.label}</span></button>`).join("")}</div></div>
    ${srcs.length?`<div class="sources-block"><h4>${CHAPTER_DATA.ui.sources} (${srcs.length})</h4><ol>${srcs.map(s=>`<li>${s.url?`<a href="${s.url}" target="_blank" rel="noreferrer">${s.title}</a>`:s.title}</li>`).join("")}</ol></div>`:""}
    <div class="panel-actions"><button class="btn primary" type="button" data-full="${n.id}">${CHAPTER_DATA.ui.readScene}</button>
      ${n.id==="arpanet"?'<button class="btn" type="button" data-arpa="1">${CHAPTER_DATA.ui.arpaDemo}</button>':""}</div>`;
  p.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>selectNode(b.getAttribute("data-go"))));
  p.querySelector("[data-full]").addEventListener("click",()=>renderFullScene(n.id));
  const ad=p.querySelector("[data-arpa]");if(ad)ad.addEventListener("click",()=>renderFullScene("arpanet",true));}
function selectNode(id){state.selected=id;state.visited.add(id);renderAll();}

function mdToHtml(md){return String(md).split(/\n{2,}/).map(b=>{b=b.trim();if(!b)return"";
  if(b.startsWith("## "))return`<h2>${b.slice(3)}</h2>`;return`<p>${b.replace(/\*([^*]+)\*/g,"<em>$1</em>")}</p>`;}).join("");}
function renderFullScene(id,openArpa){const n=byId(id);if(!n)return;const dlg=document.querySelector(".scene-dialog");const isArpa=n.id==="arpanet";const c=typeColor(n.type);const srcs=(n.sources||[]);
  dlg.innerHTML=`<div class="dialog-inner"><button class="dialog-close" aria-label="${CHAPTER_DATA.ui.close}" type="button">×</button>
    <p class="detail-kicker" style="--dot:${c}">${CHAPTER_DATA.ui.scene} ${n.sceneIndex+1} · ${typeLabel(n.type)}${n.era?" · "+n.era:""}</p>
    <h3>${n.title}</h3><div class="dialog-body">${mdToHtml(n.body)}</div>
    <p class="detail-insight" style="--dot:${c}">${n.insight}</p>${isArpa?arpaMarkup():""}
    ${srcs.length?`<div class="sources-block"><h4>${CHAPTER_DATA.ui.sources}</h4><ol>${srcs.map(s=>`<li>${s.url?`<a href="${s.url}" target="_blank" rel="noreferrer">${s.title}</a>`:s.title}</li>`).join("")}</ol></div>`:""}
    <div class="panel-actions"><a class="btn" href="${CHAPTER_DATA.chapter.sourceUrl}" target="_blank" rel="noreferrer">${CHAPTER_DATA.ui.openInLuminara}</a>
      <button class="btn primary" type="button" data-close>${CHAPTER_DATA.ui.close}</button></div></div>`;
  const close=()=>dlg.close();dlg.querySelector(".dialog-close").addEventListener("click",close);dlg.querySelector("[data-close]").addEventListener("click",close);
  if(typeof dlg.showModal==="function")dlg.showModal();else dlg.setAttribute("open","");
  if(isArpa){wireArpanet(dlg);if(openArpa)setTimeout(()=>runArpanetPacketDemo(dlg),300);}}
function arpaMarkup(){return `<div class="arpa-wrap"><h4>${CHAPTER_DATA.ui.arpaTitle}</h4>
  <svg class="arpa-svg arpa-net" viewBox="0 0 460 160" role="img" aria-label="${CHAPTER_DATA.ui.arpaAria}"></svg>
  <p class="arpa-note">${CHAPTER_DATA.ui.arpaNote}</p>
  <div class="panel-actions"><button class="btn primary" type="button" data-send>${CHAPTER_DATA.ui.arpaSend}</button>
    <button class="btn" type="button" data-fail>${CHAPTER_DATA.ui.arpaFail}</button><button class="btn" type="button" data-reset>${CHAPTER_DATA.ui.arpaReset}</button></div></div>`;}
const ARPA={hosts:{A:{x:40,y:80,label:"A"},B:{x:170,y:38,label:"B"},C:{x:170,y:122,label:"C"},D:{x:300,y:80,label:"D"},E:{x:420,y:80,label:"E"}},
  links:[["A","B"],["A","C"],["B","D"],["C","D"],["D","E"]],down:new Set(),
  route(){const P=[["A","B","D","E"],["A","C","D","E"]];for(const p of P)if(p.every(h=>!this.down.has(h)))return p;return null;}};
function drawArpa(svg){svg.innerHTML="";const mk=(t,a)=>{const e=document.createElementNS(SVGNS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  ARPA.links.forEach(([f,t])=>{const A=ARPA.hosts[f],B=ARPA.hosts[t];svg.appendChild(mk("line",{x1:A.x,y1:A.y,x2:B.x,y2:B.y}));});
  Object.entries(ARPA.hosts).forEach(([id,h])=>{svg.appendChild(mk("circle",{cx:h.x,cy:h.y,r:16,class:ARPA.down.has(id)?"down":"host"}));const t=mk("text",{x:h.x,y:h.y+4});t.textContent=h.label;svg.appendChild(t);});}
function wireArpanet(dlg){const svg=dlg.querySelector(".arpa-net");ARPA.down=new Set();drawArpa(svg);
  dlg.querySelector("[data-send]").addEventListener("click",()=>runArpanetPacketDemo(dlg));
  dlg.querySelector("[data-fail]").addEventListener("click",()=>{ARPA.down.add("B");drawArpa(svg);dlg.querySelector(".arpa-note").textContent=(CHAPTER_DATA.ui.arpaFailNote||"Node B down; routes via C.");});
  dlg.querySelector("[data-reset]").addEventListener("click",()=>{ARPA.down=new Set();drawArpa(svg);dlg.querySelector(".arpa-note").textContent=(CHAPTER_DATA.ui.arpaResetNote||"Network restored.");});}
function runArpanetPacketDemo(dlg){dlg=dlg||document.querySelector(".scene-dialog");const svg=dlg.querySelector(".arpa-net");if(!svg)return;drawArpa(svg);
  const path=ARPA.route();const note=dlg.querySelector(".arpa-note");if(!path){if(note)note.textContent=CHAPTER_DATA.ui.arpaNoRoute;return;}
  for(let i=0;i<path.length-1;i++){const A=ARPA.hosts[path[i]],B=ARPA.hosts[path[i+1]];
    [...svg.querySelectorAll("line")].forEach(ln=>{const s=(+ln.getAttribute("x1")===A.x&&+ln.getAttribute("y1")===A.y&&+ln.getAttribute("x2")===B.x&&+ln.getAttribute("y2")===B.y)||(+ln.getAttribute("x1")===B.x&&+ln.getAttribute("y1")===B.y&&+ln.getAttribute("x2")===A.x&&+ln.getAttribute("y2")===A.y);if(s)ln.classList.add("path-active");});}
  if(note)note.textContent=CHAPTER_DATA.ui.arpaRouting+": "+path.join(" → ");
  const pkt=document.createElementNS(SVGNS,"circle");pkt.setAttribute("r","5");pkt.setAttribute("class","packet");svg.appendChild(pkt);
  let seg=0,t=0;function step(){if(seg>=path.length-1){pkt.remove();if(note)note.textContent+="  ✓ "+CHAPTER_DATA.ui.arpaDelivered;return;}
    const A=ARPA.hosts[path[seg]],B=ARPA.hosts[path[seg+1]];t+=0.04;pkt.setAttribute("cx",A.x+(B.x-A.x)*t);pkt.setAttribute("cy",A.y+(B.y-A.y)*t);if(t>=1){t=0;seg++;}requestAnimationFrame(step);}
  requestAnimationFrame(step);}
function renderAll(){renderMap();renderNodeList();renderDetail();renderProgress();}
async function boot(){buildLenses();setLens(state.lens);}
document.addEventListener("DOMContentLoaded",()=>{try{boot();}catch(e){renderEmptyState(CHAPTER_DATA.ui.initError+": "+e.message);}});
</script>
</body></html>
