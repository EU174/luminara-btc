  --accent: oklch(55% 0.319 295); --accent-2: oklch(55% 0.232 205); --accent-3: oklch(62% 0.232 60); --accent-4: oklch(55% 0.232 155);

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}

.stars{background-image:radial-gradient(1px 1px at 20% 30%,var(--star),transparent),radial-gradient(1px 1px at 70% 60%,var(--star),transparent),radial-gradient(1.5px 1.5px at 40% 80%,var(--star),transparent),radial-gradient(1px 1px at 85% 20%,var(--star),transparent),radial-gradient(1px 1px at 55% 45%,var(--star),transparent),radial-gradient(1px 1px at 10% 70%,var(--star),transparent);background-repeat:repeat;background-size:600px 600px;opacity:.7;animation:drift 120s linear infinite}
.stars2{background-image:radial-gradient(1px 1px at 30% 50%,var(--star),transparent),radial-gradient(1px 1px at 80% 40%,var(--star),transparent),radial-gradient(1px 1px at 60% 75%,var(--star),transparent);background-repeat:repeat;background-size:400px 400px;opacity:.45;animation:drift 80s linear infinite reverse}
@keyframes drift{to{background-position:600px 600px}}

body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 700px at 50% 42%,var(--neb1),transparent 70%),radial-gradient(1200px 900px at 80% 10%,var(--neb2),transparent 60%)}

.app-shell{position:relative;z-index:1;display:grid;grid-template-columns:300px minmax(0,1fr) 340px;height:100vh;width:100vw}

.node-list button:hover{background:var(--bg-surface)}
.node-list button[aria-current="true"]{background:var(--bg-elev);color:var(--text);box-shadow:0 0 0 1px var(--dot) inset}
.node-idx{color:var(--text-muted);font-variant-numeric:tabular-nums;font-size:12.5px;min-width:16px;font-family:var(--sans)}

.system-map{width:100%;display:block}
.ring{fill:none;stroke:var(--line-soft);stroke-width:1;opacity:.6}
.spoke{stroke:var(--line-soft);stroke-width:1;opacity:.5}
.edge path{fill:none;stroke:var(--text-dim);stroke-width:1.3;transition:.25s;opacity:.45;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1s ease forwards}

.related-list button:hover{border-color:var(--dot);color:var(--text)}

.sources-block a:hover{border-bottom-color:var(--accent)}
.src-type{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-left:4px}
.panel-actions{display:flex;gap:8px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.btn{cursor:pointer;border-radius:9px;padding:9px 13px;font-size:13px;border:1px solid var(--line);background:var(--bg-surface);color:var(--text);font-weight:500}

.dialog-close{position:absolute;top:14px;right:18px;cursor:pointer;background:transparent;border:none;color:var(--text-muted);font-size:24px}
.dialog-body{margin:14px 0;color:var(--text);font-size:15.5px;line-height:1.72;font-family:var(--serif)}

.map-stage{position:relative;overflow:hidden;display:flex;flex-direction:column}

<script>
const CHAPTER_DATA = {"chapter": {"key": "web1", "title": "Читающий интернет", "lede": "Как открытость создала интернет — и как та же открытость позволила его закрыть.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=web1", "centralIdea": "Открытость создала интернет — и позволила его закрыть", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Хронология", "accent": "#7dd3fc", "description": "1965 → 2004: от слова «гипертекст» Нельсона до первых фильтр-пузырей."}, {"id": "openness", "label": "Открытость", "accent": "#34d399", "description": "Гипертекст, отданный даром, хакерская этика и свобода знания как фундамент Web."}, {"id": "community", "label": "Сообщество", "accent": "#c084fc", "description": "Первые виртуальные сообщества: можно ли дружить онлайн и почему это хрупко."}, {"id": "media", "label": "Медиа", "accent": "#fbbf24", "description": "«Ты читаешь, они публикуют»: демократия потребления без права производства."}, {"id": "control", "label": "Контроль", "accent": "#f87171", "description": "Где рождается невидимый посредник — алгоритм, решающий за тебя."}], "nodes": [{"id": "nelson", "sceneIndex": 0, "type": "technology", "shortTitle": "Гипертекст", "era": "1965→1991", "lensWeight": {"chronology": 5, "openness": 5, "community": 2, "media": 3, "control": 1}, "title": "Нельсон и мечта о гипертексте", "insight": "Нельсон придумал гипертекст в 1965-м, Бернерс-Ли реализовал его в 1991-м и отдал всем бесплатно — это решение определило природу открытого интернета.", "thesis": "Нельсон придумал гипертекст в 1965-м, Бернерс-Ли реализовал его в 1991-м и отдал всем бесплатно — это решение определило природу открытого интернета.", "body": "## Слово, которое изменило мир\n\nВ 1965 году молодой американский программист Тед Нельсон придумал слово, которое изменит мир — хотя тогда об этом никто не знал. Слово было «гипертекст». Нельсон не просто придумал термин — он описал совершенно новый способ организации знания.\n\nПредставь обычную библиотеку. Тысячи книг стоят на полках в алфавитном или тематическом порядке. Ты хочешь разобраться в теории относительности — берёшь книгу Эйнштейна, читаешь. Встречаешь ссылку на работу Лоренца — идёшь искать её в каталоге, ищешь на полке, возвращаешься. Потом ссылка на Пуанкаре — снова в каталог. Знание существует, но оно разрезано на куски и разложено по ящикам. Связи между идеями живут только в голове читателя.\n\nНельсон представлял себе библиотеку, устроенную принципиально иначе — как живая сеть связей. Читаешь статью о Копернике — и одним движением переходишь к тексту, который он цитировал. Потом к критике его теории современниками. Потом к карте звёздного неба его эпохи. Не линейно, страница за страницей, а по смыслу — следуя самой мысли, как она течёт в голове исследователя.\n\nОн назвал этот проект Xanadu — в честь мифического дворца Кубла-хана, места бесконечной красоты и знания. Нельсон посвятил Xanadu всю свою жизнь. Проект так и не был завершён. Но идея оказалась бессмертной.\n\n## Идея, которую подхватил другой человек\n\nXanadu провалился как продукт — но победил как концепция. В 1989 году британский программист Тим Бернерс-Ли, работавший в ядерном центре ЦЕРН в Женеве, написал внутреннюю заявку для руководства. Суть: создать систему, где все документы связаны ссылками и доступны с любого компьютера в сети.\n\nЕго начальник Майк Сендалл написал на полях три слова: «Туманно, но интересно». Это была самая скромная рецензия на изобретение, которое изменит всё.\n\nЗа три года Бернерс-Ли написал HTML, HTTP и URL — три технологии, на которых стоит весь современный веб. Документы хранятся на серверах, имеют адреса, связаны ссылками и открываются через браузер. Мечта Нельсона о гипертексте наконец получила простую техническую реализацию.\n\nНо самое важное решение было не техническим. Бернерс-Ли мог запатентовать Web и стать богатейшим человеком планеты. Вместо этого он отдал всё бесплатно, без лицензий, без условий. «Если бы Web был запатентован, его бы не существовало», — объяснил он в книге «Weaving the Web». Открытость была стратегией, а не альтруизмом: только без барьеров сеть могла вырасти до глобального масштаба.\n\n> Нельсон придумал гипертекст в 1965-м. Бернерс-Ли реализовал его в 1991-м и отдал всем бесплатно. Между идеей и её воплощением прошло двадцать шесть лет — и одно принципиальное решение.\n\nВ 1993 году появился браузер Mosaic — первый, который показывал текст и картинки вместе. Интернет стал визуальным и понятным без технического образования. В том же году количество сайтов перевалило за пятьсот. Через два года — двести тысяч. Гонка началась.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["web", "history", "hypertext", "open-source"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "read", "sceneIndex": 1, "type": "media", "shortTitle": "Ты читаешь", "era": "1991→2004", "lensWeight": {"chronology": 5, "openness": 3, "community": 2, "media": 5, "control": 2}, "title": "Читающий интернет: ты читаешь, они публикуют", "insight": "Web1 был демократией потребления без посредников-алгоритмов — и это его главное достоинство, которое мы осознали только потеряв.", "thesis": "Web1 был демократией потребления без посредников-алгоритмов — и это его главное достоинство, которое мы осознали только потеряв.", "body": "## Что такое Web1 — и почему это важно понять\n\nWeb1 — это интернет примерно с 1991 по 2004 год. Если описать его одной фразой: ты читаешь, они публикуют.\n\nСайты были статичными страницами. Компания, университет, редакция или энтузиаст создавал контент и размещал его в сети. Все остальные приходили и читали. Никаких комментариев. Никаких лайков. Никакой возможности ответить или добавить своё. Интернет был огромной библиотекой, которая обновлялась медленно и неравномерно.\n\nНа первый взгляд это звучит как ограничение. Но у этой модели была своя красота, которую мы потеряли и теперь тоскуем по ней: между тобой и информацией не было никакого посредника. Никакого алгоритма, который решал бы, что тебе показать. Ты вводил адрес — и получал страницу. Именно ту, которую хотел. Не «персонализированную версию» страницы. Не «контент, похожий на то, что ты смотрел раньше». Просто страницу.\n\nПоиск выглядел иначе. Ранний Yahoo — один из первых популярных каталогов сайтов — составлялся вручную живыми людьми. Редакторы просматривали сайты и распределяли их по категориям. Это был медленный, несовершенный, человеческий процесс. Но в нём не было скрытых мотивов. Ни один алгоритм не пытался удержать тебя на сайте дольше, чем нужно. Не было монетизации внимания. Не было таргетированной рекламы.\n\n## Информационные потоки были прозрачными\n\nЭту особенность Web1 легко недооценить — пока не сравнишь с тем, что пришло после. Информационные потоки были простыми и видимыми. Ты знал, откуда берётся информация. Ты мог оценить источник. Ты решал сам, что читать и сколько времени тратить.\n\nДж. К. Р. Ликлайдер ещё в 1960 году мечтал о «Galactic Network» — глобальной сети, где люди из любой точки мира могут получить доступ к данным и программам. В его видении компьютер и человек образуют симбиоз: машина берёт на себя рутинную обработку информации, человек — творческое мышление. Вместе они способны на то, на что ни один из них не способен поодиночке.\n\nWeb1 реализовал эту мечту в самой простой форме. Компьютер как доступ к знанию. Человек как тот, кто решает, что с этим знанием делать. Никаких посредников между ними.\n\nДэвид Вайнбергер в 2002 году описал философское измерение этого в книге «Small Pieces Loosely Joined». В физическом мире пространство — это ограничение: документ может лежать только в одном месте, книга принадлежит только одному разделу. В Web документ может быть связан одновременно с тысячью других документов. Одна страница существует в бесконечном числе контекстов. Это «гиперссылочное мышление» — способность видеть связи там, где раньше были стены.\n\n> Web1 был демократией потребления: любой мог читать что угодно. Но не демократией производства: публиковать могли только те, у кого были технические знания.\n\nЭто ограничение и стало причиной следующего шага. Миллионы людей читали — и хотели говорить. Хотели добавить своё. Ответить. Создать. И когда технологии наконец позволили это сделать просто — интернет изменился навсегда.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["web", "history", "information", "media"], "x": 759.8, "y": 295.0, "angDeg": -30.0}, {"id": "ethic", "sceneIndex": 2, "type": "technology", "shortTitle": "Хакерская этика", "era": "1984→", "lensWeight": {"chronology": 3, "openness": 5, "community": 4, "media": 1, "control": 2}, "title": "Хакерская этика: открытость как добродетель", "insight": "Хакерская этика — открытость, децентрализация, свобода знания — создала открытый интернет. Именно эта открытость потом позволила платформам его закрыть.", "thesis": "Хакерская этика — открытость, децентрализация, свобода знания — создала открытый интернет. Именно эта открытость потом позволила платформам его закрыть.", "body": "## Люди, которые строили интернет бесплатно\n\nЧтобы понять дух Web1, нужно понять людей, которые его создавали. Это были не предприниматели в поисках бизнес-модели. Это были хакеры — в изначальном смысле слова, а не в криминальном. Люди, которые разбирают системы, чтобы понять, как они работают, улучшить их и поделиться результатом.\n\nСтивен Леви в книге «Hackers: Heroes of the Computer Revolution» описал культуру, сформировавшуюся в MIT и Стэнфорде в 1960–70-е. Это была настоящая субкультура со своей этикой и ценностями. Информация должна быть свободной — потому что знание, в отличие от физических вещей, не убывает при копировании. Децентрализация лучше централизации — потому что никто не должен иметь власть над тем, к чему имеют доступ все. Оценивай людей по их коду, а не по дипломам — потому что в цифровом мире важно то, что ты создаёшь, а не кто ты по паспорту.\n\nЭта этика звучит наивно в эпоху многомиллиардных технологических компаний. Но именно она определила архитектуру раннего интернета. Именно потому что первые строители сети верили в открытость, мы получили открытые протоколы, бесплатные браузеры и доступный для всех веб.\n\n## Столлман и движение свободного ПО\n\nРичард Столлман довёл хакерскую этику до философского предела. В 1985 году он написал «GNU Манифест» — программный документ движения свободного программного обеспечения.\n\nЕго аргумент был простым: программный код — это знание. Знание не может быть ничьей собственностью, потому что его копирование не лишает оригинал ничего. Если ты поделился со мной идеей — у тебя она не исчезла. У нас обоих она теперь есть. Значит, ограничивать распространение знания через авторские права на код — это искусственное и несправедливое действие, противоречащее природе информации.\n\nСтоллман не просто написал манифест — он начал строить альтернативу. GNU — операционная система, полностью составленная из свободного программного обеспечения. В 1991 году финский студент Линус Торвальдс добавил к ней ядро Linux — и получилась операционная система, которую сегодня используют большинство серверов в мире, все смартфоны на Android и суперкомпьютеры.\n\nИз той же философии выросли Apache (серверное ПО, на котором работала большая часть раннего интернета), Mozilla Firefox, Wikipedia. Всё это — продукты культуры, где делиться важнее, чем владеть. Где создавать и отдавать — это не слабость, а принцип.\n\nТо, что сегодня называют «open source», — это не просто модель разработки. Это идеологическое наследие хакерской этики 1960-х, которое до сих пор определяет значительную часть технологической инфраструктуры мира.\n\n> Хакерская этика создала интернет открытым не потому что так было выгоднее, а потому что так было правильно. Это разные мотивации — и они создают разные результаты.\n\nПарадокс в том, что именно эта открытость сделала возможным появление компаний, которые потом закрыли интернет. Google стоит на открытых протоколах Web. Facebook стоит на открытом интернете. Они использовали открытую инфраструктуру — и построили на ней закрытые платформы. Хакерская этика создала мир, который потом сыграл по другим правилам.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["open-source", "history", "web", "community"], "x": 759.8, "y": 595.0, "angDeg": 30.0}, {"id": "community", "sceneIndex": 3, "type": "privacy", "shortTitle": "Сообщества", "era": "1993", "lensWeight": {"chronology": 4, "openness": 3, "community": 5, "media": 2, "control": 1}, "title": "Первые сообщества: можно ли дружить онлайн?", "insight": "Рейнгольд доказал: онлайн-сообщества настоящие. Но они хрупки — работают в малом масштабе и разрушаются при росте без общих норм.", "thesis": "Рейнгольд доказал: онлайн-сообщества настоящие. Но они хрупки — работают в малом масштабе и разрушаются при росте без общих норм.", "body": "## Вопрос, который казался странным\n\nВ 1993 году журналист и исследователь Говард Рейнгольд опубликовал книгу «The Virtual Community» — первое серьёзное исследование того, что происходит с людьми, когда они начинают общаться в сети. Вопрос, который он поставил, тогда казался странным: может ли в интернете возникнуть настоящее человеческое сообщество?\n\nЭто сейчас кажется очевидным — конечно может, мы все в этом живём. Но в 1993 году это было неочевидно совсем. Общество было уверено, что живое общение незаменимо, что сеть — это суррогат, что настоящих отношений без физического присутствия не бывает.\n\nРейнгольд изучал WELL — Whole Earth 'Lectronic Link, одну из первых онлайн-сетей, существовавшую ещё до браузера. Участники общались через текстовые терминалы: набираешь текст, нажимаешь Enter, ждёшь ответа. Никаких фотографий, никакого видео, никаких эмодзи. Только слова на чёрном экране.\n\nИ тем не менее Рейнгольд видел нечто поразительное: участники WELL поддерживали друг друга в трудные моменты — болезни, потери, кризисы. Делились знаниями с незнакомыми людьми, которых никогда не видели. Выстраивали репутацию и доверие через годы взаимодействия. Сеть создавала новый тип близости — без географии, без физического пространства.\n\n## Хрупкость и масштаб\n\nОтвет Рейнгольда был осторожно оптимистичным: да, настоящие сообщества в сети возможны. Но он также заметил кое-что важное о природе этих сообществ — они хрупки.\n\nСообщество WELL работало, пока участников было немного — несколько тысяч человек, которые знали друг друга хотя бы по нику. Были общие нормы поведения, неписаные правила, чувство принадлежности. Когда сообщество росло — качество взаимодействия менялось. Слишком много незнакомцев разрушали атмосферу доверия.\n\nЭто наблюдение предвосхищало проблему, которая стала критической два десятилетия спустя: как масштабировать сообщество, сохраняя его качество? Как Facebook с двумя миллиардами пользователей может быть «сообществом», если большинство участников никогда не встретятся и не имеют никаких общих норм?\n\nКевин Келли в книге «Out of Control» (1994) описал интернет как живую систему — децентрализованную, без центрального управления, эволюционирующую из взаимодействия миллионов участников. Это звучало как хорошая новость. Но Келли пропустил одно следствие своей же логики: живые системы эволюционируют в сторону выживания наиболее приспособленных — а не в сторону справедливости или человеческого тепла.\n\nКогда в интернет пришли компании с огромными ресурсами — они оказались «наиболее приспособленными». И система начала эволюционировать в их сторону.\n\n> Рейнгольд доказал: настоящие сообщества в сети возможны. Но он также показал их хрупкость: сообщество работает, пока оно маленькое и у него есть общие нормы.\n\nЭто наблюдение актуально до сих пор. Лучшие онлайн-сообщества — небольшие, с чёткой идентичностью и правилами. Большие платформы убивают сообщества, превращая их в аудитории. Именно поэтому Web3 делает ставку на токены и DAO — инструменты, которые создают формальные механизмы для поддержания норм в масштабе.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["community", "social-graph", "web", "history"], "x": 500.0, "y": 745.0, "angDeg": 90.0}, {"id": "verdict", "sceneIndex": 4, "type": "power", "shortTitle": "Итог Web1", "era": "≈2000", "lensWeight": {"chronology": 4, "openness": 4, "community": 3, "media": 4, "control": 3}, "title": "Что Web1 выполнил — и где споткнулся", "insight": "Web1 демократизировал потребление информации, но не производство — и это противоречие породило Web2 с его платформами для всех.", "thesis": "Web1 демократизировал потребление информации, но не производство — и это противоречие породило Web2 с его платформами для всех.", "body": "## Реальные достижения, которые легко забыть\n\nК концу 1990-х Web1 сделал несколько вещей, которые двадцать лет назад казались невозможными. Легко забыть об этом, потому что сейчас всё это само собой разумеется. Но стоит остановиться и оценить масштаб.\n\nВеб демократизировал доступ к информации в беспрецедентном масштабе. Если у тебя есть компьютер и подключение — ты можешь прочитать статью из университетской библиотеки Гарварда. Найти медицинскую информацию, которую раньше знали только врачи. Прочитать новости из любой страны мира в режиме реального времени. Получить инструкцию по ремонту чего угодно. Для этого не нужны деньги, связи или специальное образование — только доступ в интернет.\n\nВеб уничтожил географию знания. Учёный в Киеве читает тот же научный препринт, что учёный в Кембридже — одновременно, через минуты после публикации. До интернета это было невозможно физически: препринт нужно было напечатать, отправить почтой, ждать неделями. Это ускорило науку, образование, журналистику.\n\nВеб создал новые сообщества, которые раньше не могли существовать. Люди с редкими интересами нашли друг друга: любители малоизвестного жанра музыки из разных стран. Пациенты с редкими заболеваниями, которых в одном городе может быть десять человек. Программисты конкретного языка, готовые помочь бесплатно незнакомцу на другом конце планеты. Раньше они были невидимы — для общества и друг для друга. Веб сделал их сообществом.\n\n## Где Web1 споткнулся\n\nНо у Web1 было фундаментальное ограничение, которое определило всё, что произошло дальше. Читать мог любой. Публиковать — нет.\n\nЧтобы создать сайт в 1996 году, нужно было знать HTML, разбираться в хостинге и FTP, понимать доменные имена. Для программиста — небольшой барьер. Для школьного учителя, домохозяйки или пенсионера — непреодолимый. Интернет был демократией потребления, но не демократией производства. Миллионы читали. Тысячи писали.\n\nЭто создавало скрытое противоречие. Web1 обещал горизонтальный, открытый интернет без привратников. Но на практике привратники никуда не делись — просто изменили профессию. Вместо редакторов газет — веб-разработчики. Вместо телевизионных продюсеров — владельцы серверов. Голос по-прежнему принадлежал тем, у кого были технические знания.\n\nЭли Паризер зафиксировал ещё одну проблему, проявившуюся чуть позже. Как только поисковые алгоритмы начали учитывать историю запросов — информационное пространство перестало быть общим. Каждый начинал видеть свою версию интернета. Паризер назвал это «фильтровым пузырём». Web1 обещал: все имеют доступ ко всей информации. На практике: алгоритм решает, какая информация твоя.\n\n> Web1 был невероятным достижением. Но он оставил нерешённым главный вопрос: как дать голос всем, а не только тем, у кого есть технические знания?\n\nОтвет на этот вопрос пришёл в виде Web2 — платформ, которые убрали технический барьер и дали голос каждому. Но у этого ответа оказалась скрытая цена, которую никто не читал в пользовательском соглашении.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["web", "history", "information", "media"], "x": 240.2, "y": 595.0, "angDeg": 150.0}, {"id": "filter", "sceneIndex": 5, "type": "power", "shortTitle": "Фильтр-пузырь", "era": "нач. 2000-х", "lensWeight": {"chronology": 5, "openness": 1, "community": 1, "media": 4, "control": 5}, "title": "Фильтровый пузырь: когда алгоритм решает за тебя", "insight": "Фильтровый пузырь начался не с Facebook — а с первых персонализированных поисковых алгоритмов. Удобство персонализации разрушает общее информационное пространство.", "thesis": "Фильтровый пузырь начался не с Facebook — а с первых персонализированных поисковых алгоритмов. Удобство персонализации разрушает общее информационное пространство.", "body": "## Невидимый посредник\n\nВ начале 2000-х произошло кое-что, чего почти никто не заметил в момент появления. Google начал учитывать историю поиска при формировании результатов. Если ты часто ищешь новости определённой политической направленности — Google начинает показывать тебе больше таких новостей. Если ты кликаешь на определённый тип контента — алгоритм запоминает это и корректирует выдачу.\n\nЗвучит удобно. И в краткосрочной перспективе — действительно удобнее. Ты получаешь то, что, по мнению алгоритма, тебе понравится. Меньше нерелевантного, больше интересного.\n\nНо Эли Паризер в своём исследовании «The Filter Bubble» зафиксировал скрытую цену этого удобства. Он провёл простой эксперимент: попросил нескольких своих друзей одновременно погуглить слово «Египет» — это было в разгар Арабской весны в 2011 году. Результаты были разительно разными. Один получил новости о революции и протестах. Другой — туристические советы и достопримечательности. Третий — деловые новости об экономике страны.\n\nОдно и то же слово. Одно и то же время. Совершенно разная реальность.\n\n## Что теряется в пузыре\n\nЭто не просто неудобство. Это фундаментальное изменение того, что такое «общее информационное пространство».\n\nДемократия предполагает, что граждане имеют хотя бы базовый общий набор фактов. Они могут не соглашаться в ценностях и приоритетах — но они должны соглашаться в реальности. Что произошло то-то и то-то. Что существует такая-то проблема. Что вот эта цифра — факт.\n\nФильтровый пузырь разрушает это общее пространство. Алгоритм показывает каждому то, что вызывает наибольшее вовлечение — то есть то, что подтверждает уже существующие убеждения и усиливает уже существующие эмоции. В результате люди, живущие в одном городе, могут иметь принципиально разные картины реальности. Не потому что они глупые или злонамеренные — а потому что алгоритм буквально показывал им разный мир.\n\nВажно понять: это началось уже в эпоху Web1, с первыми персонализированными поисковыми выдачами. Социальные сети просто довели этот механизм до предела.\n\nWeb1 обещал: все имеют равный доступ ко всей информации. Это было правдой — технически. Но алгоритм решал, какая информация «твоя». И это оказалось важнее технической равнодоступности.\n\n> Web1 создал общее информационное пространство. Первые алгоритмы персонализации начали его разрушать — ещё до появления социальных сетей.\n\nПаризер написал об этом в 2011 году — уже в эпоху Web2. Но корни проблемы уходят в Web1. Как только у алгоритма появляется цель «показывать тебе то, что тебе понравится» — он неизбежно начинает сужать твоё информационное пространство. Сначала незаметно. Потом — принципиально. Это не баг, это архитектурное следствие самой идеи персонализации.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["algorithms", "information", "media", "web"], "x": 240.2, "y": 295.0, "angDeg": 210.0}], "edges": [{"from": "nelson", "to": "read", "label": "мечта стала витриной", "lenses": ["chronology", "openness", "media"]}, {"from": "nelson", "to": "ethic", "label": "идея нуждалась в людях", "lenses": ["openness"]}, {"from": "ethic", "to": "read", "label": "открытость сделала веб доступным", "lenses": ["openness", "media"]}, {"from": "ethic", "to": "community", "label": "этика собрала первые сообщества", "lenses": ["openness", "community"]}, {"from": "read", "to": "community", "label": "у читателей появился голос", "lenses": ["community", "media"]}, {"from": "read", "to": "verdict", "label": "потребление демократизировано", "lenses": ["media", "chronology"]}, {"from": "community", "to": "verdict", "label": "связи оказались хрупки", "lenses": ["community"]}, {"from": "verdict", "to": "filter", "label": "нет производства — нужен посредник", "lenses": ["chronology", "control", "media"]}, {"from": "ethic", "to": "filter", "label": "открытость позволила её закрыть", "lenses": ["control", "openness"]}, {"from": "nelson", "to": "filter", "label": "от свободной ссылки к ранжированию", "lenses": ["control"]}]};;

  if(!empty||!svg)return;empty.hidden=false;svg.setAttribute("hidden","");

<script>
// --- theme from URL (?theme=light|dark & ?accent=oklch/hex) — mirrors app ---
(function(){
  try{
    var p=new URLSearchParams(location.search);
    var theme=p.get("theme"); var accent=p.get("accent");
    if(theme==="light") document.documentElement.setAttribute("data-theme","light");
    else if(theme==="dark") document.documentElement.removeAttribute("data-theme");
    if(accent){ document.documentElement.style.setProperty("--accent", decodeURIComponent(accent)); }
    // sun ink: readable on core
    document.documentElement.style.setProperty("--sun-ink", theme==="light" ? "#fff" : "#fff");
  }catch(e){}
})();
// live updates from parent (optional): postMessage {theme, accent}
window.addEventListener("message",function(ev){
  var m=ev.data||{};
  if(m.theme==="light") document.documentElement.setAttribute("data-theme","light");
  if(m.theme==="dark") document.documentElement.removeAttribute("data-theme");
  if(m.accent) document.documentElement.style.setProperty("--accent", m.accent);
  if(typeof renderAll==="function") renderAll();
});

const state={lens:"chronology",selected:null,visited:new Set(),entered:false};
const byId=id=>CHAPTER_DATA.nodes.find(n=>n.id===id);
const SVGNS="http://www.w3.org/2000/svg";
const el=(t,a)=>{const e=document.createElementNS(SVGNS,t);for(const k in(a||{}))e.setAttribute(k,a[k]);return e;};
function typeColor(t){return{power:"var(--power)",technology:"var(--technology)",media:"var(--media)",privacy:"var(--privacy)",economy:"var(--economy)"}[t]||"var(--accent)";}
function typeLabel(t){var U=window.__UI_LOC||{};var k="type_"+t;if(U[k])return U[k];return{power:"Власть",technology:"Технологии",media:"Медиа",privacy:"Приватность",economy:"Экономика"}[t]||"Идея";}
function lensById(id){return CHAPTER_DATA.lenses.find(l=>l.id===id);}
function edgeActive(e){return e.lenses.includes(state.lens);}
function nodeWeight(n){return(n.lensWeight&&n.lensWeight[state.lens])||0;}
const CX=CHAPTER_DATA.chapter.centerX||500, CY=CHAPTER_DATA.chapter.centerY||445, RING=CHAPTER_DATA.chapter.ring||300;

function buildLenses(){
  const w=document.querySelector(".lens-group");w.innerHTML="";
  CHAPTER_DATA.lenses.forEach(l=>{const b=document.createElement("button");b.className="lens-btn";b.type="button";
    b.setAttribute("aria-pressed",String(l.id===state.lens));b.style.setProperty("--dot",l.accent);
    b.innerHTML=`<span class="lens-dot"></span>${l.label}`;b.addEventListener("click",()=>setLens(l.id));w.appendChild(b);});
}
function setLens(id){state.lens=id;const l=lensById(id);
  const d=document.querySelector(".lens-desc");if(d)d.textContent=l?l.description:"";
  document.querySelectorAll(".lens-btn").forEach((b,i)=>b.setAttribute("aria-pressed",String(CHAPTER_DATA.lenses[i].id===id)));
  renderAll();}

function curve(a,b){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;const dx=mx-CX,dy=my-CY,len=Math.hypot(dx,dy)||1;const bow=26;
  return `M ${a.x} ${a.y} Q ${mx+(dx/len)*bow} ${my+(dy/len)*bow} ${b.x} ${b.y}`;}

function defs(){
  const d=el("defs");
  const mk=(id,color)=>{color=lensById(state.lens)?lensById(state.lens).accent:"#888";const m=el("marker",{id,viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"});
    const p=el("path",{d:"M0 0 L10 5 L0 10 z",fill:color});m.appendChild(p);return m;};
  d.appendChild(mk("arrow-active", "var(--dot-fallback)"));
  var sg=el("radialGradient",{id:"sunGrad",cx:"50%",cy:"42%",r:"60%"});
  var css=getComputedStyle(document.documentElement);
  sg.appendChild(el("stop",{offset:"0%","stop-color":css.getPropertyValue("--bg-elev")||"#20264a"}));
  sg.appendChild(el("stop",{offset:"100%","stop-color":css.getPropertyValue("--bg")||"#0c1230"}));
  d.appendChild(sg);
  return d;
}

function renderMap(){
  const svg=document.querySelector(".system-map");if(!svg)return;
  [...svg.querySelectorAll("defs,g,.ring,.ring-tick,.era-label,.spoke")].forEach(n=>n.remove());
  svg.appendChild(defs());
  // rings
  const gDeco=el("g",{});
  [RING*0.55,RING].forEach(r=>gDeco.appendChild(el("circle",{class:"ring",cx:CX,cy:CY,r})));
  svg.appendChild(gDeco);
  // spokes + chronology era labels around outer ring
  const gSpoke=el("g",{});
  CHAPTER_DATA.nodes.forEach(n=>{
    gSpoke.appendChild(el("line",{class:"spoke",x1:CX,y1:CY,x2:n.x,y2:n.y}));
  });
  svg.appendChild(gSpoke);

  // edges (with directional arrows on active)
  const gE=el("g",{});
  CHAPTER_DATA.edges.forEach(e=>{const a=byId(e.from),b=byId(e.to);if(!a||!b)return;
    const active=edgeActive(e);const g=el("g",{class:"edge"+(active?" active":"")});
    if(active)g.style.setProperty("--dot",lensById(state.lens).accent);
    const d=curve(a,b);const p=el("path",{d});
    // approximate length for draw animation
    const len=Math.round(Math.hypot(b.x-a.x,b.y-a.y)*1.15);
    p.style.setProperty("--len",len);
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const lb=el("text",{class:"edge-label",x:mx,y:my-5,"text-anchor":"middle"});lb.textContent=e.label;
    g.appendChild(p);g.appendChild(lb);gE.appendChild(g);});
  svg.appendChild(gE);

  // center (breathing, lens-tinted ring)
  const gC=el("g",{});
  gC.style.setProperty("--dot", lensById(state.lens)?lensById(state.lens).accent:"#b7791f");
  gC.appendChild(el("circle",{class:"sun-glow",cx:CX,cy:CY,r:100}));
  gC.appendChild(el("circle",{class:"sun-ring",cx:CX,cy:CY,r:82}));
  gC.appendChild(el("circle",{class:"sun-core",cx:CX,cy:CY,r:70}));/*no sublabel*/
  
  wrapText(gC,CHAPTER_DATA.chapter.centralIdea,CX,CY+2,120,"sun-t1",17);
  svg.appendChild(gC);

  // nodes with smart outward labels + era
  const gN=el("g",{});
  CHAPTER_DATA.nodes.forEach((n,i)=>{
    const g=el("g",{class:"node"+(state.selected===n.id?" selected":""),tabindex:"0",role:"button","aria-label":`${n.sceneIndex+1}. ${n.title} (${n.era||""})`});
    g.style.setProperty("--dot",typeColor(n.type));
    g.style.setProperty("--ox",n.x+"px");g.style.setProperty("--oy",n.y+"px");
    if(!state.entered) g.style.setProperty("--delay",(0.15+i*0.06)+"s"); else g.style.animation="none",g.style.opacity="1";
    if(state.selected){const linked=CHAPTER_DATA.edges.some(e=>(e.from===state.selected&&e.to===n.id)||(e.to===state.selected&&e.from===n.id));
      if(n.id!==state.selected&&!linked)g.classList.add("dim");}
    else if(nodeWeight(n)<=1){g.classList.add("dim");}
    g.appendChild(el("circle",{class:"planet-glow",cx:n.x,cy:n.y,r:34}));
    var pl=el("circle",{class:"planet",cx:n.x,cy:n.y,r:26});pl.style.fill="color-mix(in oklch, "+typeColor(n.type)+" 20%, var(--bg-elev))";g.appendChild(pl);
    const num=el("text",{class:"num",x:n.x,y:n.y});num.textContent=String(n.sceneIndex+1);g.appendChild(num);

    // smart label placement: outward along the radius from center
    const dx=n.x-CX,dy=n.y-CY,len=Math.hypot(dx,dy)||1;
    const ux=dx/len,uy=dy/len;
    const lx=n.x+ux*46, ly=n.y+uy*46;
    // anchor by horizontal side
    const anchor = ux>0.25?"start":(ux<-0.25?"end":"middle");
    const era=el("text",{class:"era",x:lx,y:ly-30,"text-anchor":anchor});era.textContent=n.era||"";g.appendChild(era);
    const kick=el("text",{class:"kicker",x:lx,y:ly-14,"text-anchor":anchor});kick.textContent=typeLabel(n.type);g.appendChild(kick);
    wrapTextAnchored(g,n.shortTitle,lx,ly+20,180,"cap",18,anchor);

    g.addEventListener("click",()=>selectNode(n.id));
    g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();selectNode(n.id);}});
    gN.appendChild(g);
  });
  svg.appendChild(gN);
  state.entered=true;
}
function wrapText(parent,text,x,y,maxw,cls,fs){wrapTextAnchored(parent,text,x,y,maxw,cls,fs,"middle");}
function wrapTextAnchored(parent,text,x,y,maxw,cls,fs,anchor){
  const words=String(text).split(/\s+/);const lines=[];let line="";
  const approx=s=>s.length*(fs*0.56);
  words.forEach(w=>{const t=line?line+" "+w:w;if(approx(t)>maxw&&line){lines.push(line);line=w;}else line=t;});
  if(line)lines.push(line);const total=(lines.length-1)*(fs+2);
  lines.forEach((ln,i)=>{const t=el("text",{class:cls,x,y:y-total/2+i*(fs+2),"text-anchor":anchor});t.textContent=ln;parent.appendChild(t);});
}

    ${srcs.length?`<div class="sources-block"><h4>Источники (${srcs.length})</h4><ol>${srcs.map(s=>`<li>${s.url?`<a href="${s.url}" target="_blank" rel="noreferrer">${s.title}</a>`:s.title}${s.linkType==="gbooks"?`<span class="src-type">Google Books</span>`:(s.linkType==="direct"?`<span class="src-type">ссылка</span>`:"")}</li>`).join("")}</ol></div>`:""}

  p.querySelector("[data-full]").addEventListener("click",()=>renderFullScene(n.id));
  const ad=p.querySelector("[data-arpa]");if(ad)ad.addEventListener("click",()=>renderFullScene("arpanet",true));}
function selectNode(id){state.selected=id;state.visited.add(id);renderAll();}

function mdToHtml(md){return String(md).split(/\n{2,}/).map(b=>{b=b.trim();if(!b)return"";
  if(b.startsWith("## "))return`<h2>${b.slice(3)}</h2>`;return`<p>${b.replace(/\*([^*]+)\*/g,"<em>$1</em>")}</p>`;}).join("");}

const CHAPTER_I18N = {"ru": {"chapter": {"key": "web1", "title": "Читающий интернет", "lede": "Как открытость создала интернет — и как та же открытость позволила его закрыть.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=web1", "centralIdea": "Открытость создала интернет — и позволила его закрыть", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Хронология", "accent": "#7dd3fc", "description": "1965 → 2004: от слова «гипертекст» Нельсона до первых фильтр-пузырей."}, {"id": "openness", "label": "Открытость", "accent": "#34d399", "description": "Гипертекст, отданный даром, хакерская этика и свобода знания как фундамент Web."}, {"id": "community", "label": "Сообщество", "accent": "#c084fc", "description": "Первые виртуальные сообщества: можно ли дружить онлайн и почему это хрупко."}, {"id": "media", "label": "Медиа", "accent": "#fbbf24", "description": "«Ты читаешь, они публикуют»: демократия потребления без права производства."}, {"id": "control", "label": "Контроль", "accent": "#f87171", "description": "Где рождается невидимый посредник — алгоритм, решающий за тебя."}], "nodes": [{"id": "nelson", "sceneIndex": 0, "type": "technology", "shortTitle": "Гипертекст", "era": "1965→1991", "lensWeight": {"chronology": 5, "openness": 5, "community": 2, "media": 3, "control": 1}, "title": "Нельсон и мечта о гипертексте", "insight": "Нельсон придумал гипертекст в 1965-м, Бернерс-Ли реализовал его в 1991-м и отдал всем бесплатно — это решение определило природу открытого интернета.", "thesis": "Нельсон придумал гипертекст в 1965-м, Бернерс-Ли реализовал его в 1991-м и отдал всем бесплатно — это решение определило природу открытого интернета.", "body": "## Слово, которое изменило мир\n\nВ 1965 году молодой американский программист Тед Нельсон придумал слово, которое изменит мир — хотя тогда об этом никто не знал. Слово было «гипертекст». Нельсон не просто придумал термин — он описал совершенно новый способ организации знания.\n\nПредставь обычную библиотеку. Тысячи книг стоят на полках в алфавитном или тематическом порядке. Ты хочешь разобраться в теории относительности — берёшь книгу Эйнштейна, читаешь. Встречаешь ссылку на работу Лоренца — идёшь искать её в каталоге, ищешь на полке, возвращаешься. Потом ссылка на Пуанкаре — снова в каталог. Знание существует, но оно разрезано на куски и разложено по ящикам. Связи между идеями живут только в голове читателя.\n\nНельсон представлял себе библиотеку, устроенную принципиально иначе — как живая сеть связей. Читаешь статью о Копернике — и одним движением переходишь к тексту, который он цитировал. Потом к критике его теории современниками. Потом к карте звёздного неба его эпохи. Не линейно, страница за страницей, а по смыслу — следуя самой мысли, как она течёт в голове исследователя.\n\nОн назвал этот проект Xanadu — в честь мифического дворца Кубла-хана, места бесконечной красоты и знания. Нельсон посвятил Xanadu всю свою жизнь. Проект так и не был завершён. Но идея оказалась бессмертной.\n\n## Идея, которую подхватил другой человек\n\nXanadu провалился как продукт — но победил как концепция. В 1989 году британский программист Тим Бернерс-Ли, работавший в ядерном центре ЦЕРН в Женеве, написал внутреннюю заявку для руководства. Суть: создать систему, где все документы связаны ссылками и доступны с любого компьютера в сети.\n\nЕго начальник Майк Сендалл написал на полях три слова: «Туманно, но интересно». Это была самая скромная рецензия на изобретение, которое изменит всё.\n\nЗа три года Бернерс-Ли написал HTML, HTTP и URL — три технологии, на которых стоит весь современный веб. Документы хранятся на серверах, имеют адреса, связаны ссылками и открываются через браузер. Мечта Нельсона о гипертексте наконец получила простую техническую реализацию.\n\nНо самое важное решение было не техническим. Бернерс-Ли мог запатентовать Web и стать богатейшим человеком планеты. Вместо этого он отдал всё бесплатно, без лицензий, без условий. «Если бы Web был запатентован, его бы не существовало», — объяснил он в книге «Weaving the Web». Открытость была стратегией, а не альтруизмом: только без барьеров сеть могла вырасти до глобального масштаба.\n\n> Нельсон придумал гипертекст в 1965-м. Бернерс-Ли реализовал его в 1991-м и отдал всем бесплатно. Между идеей и её воплощением прошло двадцать шесть лет — и одно принципиальное решение.\n\nВ 1993 году появился браузер Mosaic — первый, который показывал текст и картинки вместе. Интернет стал визуальным и понятным без технического образования. В том же году количество сайтов перевалило за пятьсот. Через два года — двести тысяч. Гонка началась.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["web", "history", "hypertext", "open-source"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "read", "sceneIndex": 1, "type": "media", "shortTitle": "Ты читаешь", "era": "1991→2004", "lensWeight": {"chronology": 5, "openness": 3, "community": 2, "media": 5, "control": 2}, "title": "Читающий интернет: ты читаешь, они публикуют", "insight": "Web1 был демократией потребления без посредников-алгоритмов — и это его главное достоинство, которое мы осознали только потеряв.", "thesis": "Web1 был демократией потребления без посредников-алгоритмов — и это его главное достоинство, которое мы осознали только потеряв.", "body": "## Что такое Web1 — и почему это важно понять\n\nWeb1 — это интернет примерно с 1991 по 2004 год. Если описать его одной фразой: ты читаешь, они публикуют.\n\nСайты были статичными страницами. Компания, университет, редакция или энтузиаст создавал контент и размещал его в сети. Все остальные приходили и читали. Никаких комментариев. Никаких лайков. Никакой возможности ответить или добавить своё. Интернет был огромной библиотекой, которая обновлялась медленно и неравномерно.\n\nНа первый взгляд это звучит как ограничение. Но у этой модели была своя красота, которую мы потеряли и теперь тоскуем по ней: между тобой и информацией не было никакого посредника. Никакого алгоритма, который решал бы, что тебе показать. Ты вводил адрес — и получал страницу. Именно ту, которую хотел. Не «персонализированную версию» страницы. Не «контент, похожий на то, что ты смотрел раньше». Просто страницу.\n\nПоиск выглядел иначе. Ранний Yahoo — один из первых популярных каталогов сайтов — составлялся вручную живыми людьми. Редакторы просматривали сайты и распределяли их по категориям. Это был медленный, несовершенный, человеческий процесс. Но в нём не было скрытых мотивов. Ни один алгоритм не пытался удержать тебя на сайте дольше, чем нужно. Не было монетизации внимания. Не было таргетированной рекламы.\n\n## Информационные потоки были прозрачными\n\nЭту особенность Web1 легко недооценить — пока не сравнишь с тем, что пришло после. Информационные потоки были простыми и видимыми. Ты знал, откуда берётся информация. Ты мог оценить источник. Ты решал сам, что читать и сколько времени тратить.\n\nДж. К. Р. Ликлайдер ещё в 1960 году мечтал о «Galactic Network» — глобальной сети, где люди из любой точки мира могут получить доступ к данным и программам. В его видении компьютер и человек образуют симбиоз: машина берёт на себя рутинную обработку информации, человек — творческое мышление. Вместе они способны на то, на что ни один из них не способен поодиночке.\n\nWeb1 реализовал эту мечту в самой простой форме. Компьютер как доступ к знанию. Человек как тот, кто решает, что с этим знанием делать. Никаких посредников между ними.\n\nДэвид Вайнбергер в 2002 году описал философское измерение этого в книге «Small Pieces Loosely Joined». В физическом мире пространство — это ограничение: документ может лежать только в одном месте, книга принадлежит только одному разделу. В Web документ может быть связан одновременно с тысячью других документов. Одна страница существует в бесконечном числе контекстов. Это «гиперссылочное мышление» — способность видеть связи там, где раньше были стены.\n\n> Web1 был демократией потребления: любой мог читать что угодно. Но не демократией производства: публиковать могли только те, у кого были технические знания.\n\nЭто ограничение и стало причиной следующего шага. Миллионы людей читали — и хотели говорить. Хотели добавить своё. Ответить. Создать. И когда технологии наконец позволили это сделать просто — интернет изменился навсегда.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["web", "history", "information", "media"], "x": 759.8, "y": 295.0, "angDeg": -30.0}, {"id": "ethic", "sceneIndex": 2, "type": "technology", "shortTitle": "Хакерская этика", "era": "1984→", "lensWeight": {"chronology": 3, "openness": 5, "community": 4, "media": 1, "control": 2}, "title": "Хакерская этика: открытость как добродетель", "insight": "Хакерская этика — открытость, децентрализация, свобода знания — создала открытый интернет. Именно эта открытость потом позволила платформам его закрыть.", "thesis": "Хакерская этика — открытость, децентрализация, свобода знания — создала открытый интернет. Именно эта открытость потом позволила платформам его закрыть.", "body": "## Люди, которые строили интернет бесплатно\n\nЧтобы понять дух Web1, нужно понять людей, которые его создавали. Это были не предприниматели в поисках бизнес-модели. Это были хакеры — в изначальном смысле слова, а не в криминальном. Люди, которые разбирают системы, чтобы понять, как они работают, улучшить их и поделиться результатом.\n\nСтивен Леви в книге «Hackers: Heroes of the Computer Revolution» описал культуру, сформировавшуюся в MIT и Стэнфорде в 1960–70-е. Это была настоящая субкультура со своей этикой и ценностями. Информация должна быть свободной — потому что знание, в отличие от физических вещей, не убывает при копировании. Децентрализация лучше централизации — потому что никто не должен иметь власть над тем, к чему имеют доступ все. Оценивай людей по их коду, а не по дипломам — потому что в цифровом мире важно то, что ты создаёшь, а не кто ты по паспорту.\n\nЭта этика звучит наивно в эпоху многомиллиардных технологических компаний. Но именно она определила архитектуру раннего интернета. Именно потому что первые строители сети верили в открытость, мы получили открытые протоколы, бесплатные браузеры и доступный для всех веб.\n\n## Столлман и движение свободного ПО\n\nРичард Столлман довёл хакерскую этику до философского предела. В 1985 году он написал «GNU Манифест» — программный документ движения свободного программного обеспечения.\n\nЕго аргумент был простым: программный код — это знание. Знание не может быть ничьей собственностью, потому что его копирование не лишает оригинал ничего. Если ты поделился со мной идеей — у тебя она не исчезла. У нас обоих она теперь есть. Значит, ограничивать распространение знания через авторские права на код — это искусственное и несправедливое действие, противоречащее природе информации.\n\nСтоллман не просто написал манифест — он начал строить альтернативу. GNU — операционная система, полностью составленная из свободного программного обеспечения. В 1991 году финский студент Линус Торвальдс добавил к ней ядро Linux — и получилась операционная система, которую сегодня используют большинство серверов в мире, все смартфоны на Android и суперкомпьютеры.\n\nИз той же философии выросли Apache (серверное ПО, на котором работала большая часть раннего интернета), Mozilla Firefox, Wikipedia. Всё это — продукты культуры, где делиться важнее, чем владеть. Где создавать и отдавать — это не слабость, а принцип.\n\nТо, что сегодня называют «open source», — это не просто модель разработки. Это идеологическое наследие хакерской этики 1960-х, которое до сих пор определяет значительную часть технологической инфраструктуры мира.\n\n> Хакерская этика создала интернет открытым не потому что так было выгоднее, а потому что так было правильно. Это разные мотивации — и они создают разные результаты.\n\nПарадокс в том, что именно эта открытость сделала возможным появление компаний, которые потом закрыли интернет. Google стоит на открытых протоколах Web. Facebook стоит на открытом интернете. Они использовали открытую инфраструктуру — и построили на ней закрытые платформы. Хакерская этика создала мир, который потом сыграл по другим правилам.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["open-source", "history", "web", "community"], "x": 759.8, "y": 595.0, "angDeg": 30.0}, {"id": "community", "sceneIndex": 3, "type": "privacy", "shortTitle": "Сообщества", "era": "1993", "lensWeight": {"chronology": 4, "openness": 3, "community": 5, "media": 2, "control": 1}, "title": "Первые сообщества: можно ли дружить онлайн?", "insight": "Рейнгольд доказал: онлайн-сообщества настоящие. Но они хрупки — работают в малом масштабе и разрушаются при росте без общих норм.", "thesis": "Рейнгольд доказал: онлайн-сообщества настоящие. Но они хрупки — работают в малом масштабе и разрушаются при росте без общих норм.", "body": "## Вопрос, который казался странным\n\nВ 1993 году журналист и исследователь Говард Рейнгольд опубликовал книгу «The Virtual Community» — первое серьёзное исследование того, что происходит с людьми, когда они начинают общаться в сети. Вопрос, который он поставил, тогда казался странным: может ли в интернете возникнуть настоящее человеческое сообщество?\n\nЭто сейчас кажется очевидным — конечно может, мы все в этом живём. Но в 1993 году это было неочевидно совсем. Общество было уверено, что живое общение незаменимо, что сеть — это суррогат, что настоящих отношений без физического присутствия не бывает.\n\nРейнгольд изучал WELL — Whole Earth 'Lectronic Link, одну из первых онлайн-сетей, существовавшую ещё до браузера. Участники общались через текстовые терминалы: набираешь текст, нажимаешь Enter, ждёшь ответа. Никаких фотографий, никакого видео, никаких эмодзи. Только слова на чёрном экране.\n\nИ тем не менее Рейнгольд видел нечто поразительное: участники WELL поддерживали друг друга в трудные моменты — болезни, потери, кризисы. Делились знаниями с незнакомыми людьми, которых никогда не видели. Выстраивали репутацию и доверие через годы взаимодействия. Сеть создавала новый тип близости — без географии, без физического пространства.\n\n## Хрупкость и масштаб\n\nОтвет Рейнгольда был осторожно оптимистичным: да, настоящие сообщества в сети возможны. Но он также заметил кое-что важное о природе этих сообществ — они хрупки.\n\nСообщество WELL работало, пока участников было немного — несколько тысяч человек, которые знали друг друга хотя бы по нику. Были общие нормы поведения, неписаные правила, чувство принадлежности. Когда сообщество росло — качество взаимодействия менялось. Слишком много незнакомцев разрушали атмосферу доверия.\n\nЭто наблюдение предвосхищало проблему, которая стала критической два десятилетия спустя: как масштабировать сообщество, сохраняя его качество? Как Facebook с двумя миллиардами пользователей может быть «сообществом», если большинство участников никогда не встретятся и не имеют никаких общих норм?\n\nКевин Келли в книге «Out of Control» (1994) описал интернет как живую систему — децентрализованную, без центрального управления, эволюционирующую из взаимодействия миллионов участников. Это звучало как хорошая новость. Но Келли пропустил одно следствие своей же логики: живые системы эволюционируют в сторону выживания наиболее приспособленных — а не в сторону справедливости или человеческого тепла.\n\nКогда в интернет пришли компании с огромными ресурсами — они оказались «наиболее приспособленными». И система начала эволюционировать в их сторону.\n\n> Рейнгольд доказал: настоящие сообщества в сети возможны. Но он также показал их хрупкость: сообщество работает, пока оно маленькое и у него есть общие нормы.\n\nЭто наблюдение актуально до сих пор. Лучшие онлайн-сообщества — небольшие, с чёткой идентичностью и правилами. Большие платформы убивают сообщества, превращая их в аудитории. Именно поэтому Web3 делает ставку на токены и DAO — инструменты, которые создают формальные механизмы для поддержания норм в масштабе.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20
