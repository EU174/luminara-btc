"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["спільнота", "соціальний граф", "Web", "історія"], "x": 500.0, "y": 745.0, "angDeg": 90.0}, {"id": "verdict", "sceneIndex": 4, "type": "power", "shortTitle": "Підсумок Web1", "era": "≈2000", "lensWeight": {"chronology": 4, "openness": 4, "community": 3, "media": 4, "control": 3}, "title": "Що Web1 виконав — і де спіткнувся", "insight": "Web1 демократизував споживання інформації, але не її виробництво — і ця суперечність породила Web2 з його платформами для всіх.", "thesis": "Web1 демократизував споживання інформації, але не її виробництво — і ця суперечність породила Web2 з його платформами для всіх.", "body": "## Реальні досягнення, про які легко забути\n\nДо кінця 1990-х Web1 зробив кілька речей, які двадцять років до того здавалися неможливими. Про це легко забути, бо сьогодні все це сприймається як належне. Але варто зупинитися й оцінити масштаб.\n\nВеб демократизував доступ до інформації в безпрецедентному масштабі. Якщо в тебе є компʼютер і підключення — ти можеш прочитати статтю з університетської бібліотеки Гарварда. Знайти медичну інформацію, яку раніше знали тільки лікарі. Читати новини з будь-якої країни світу в режимі реального часу. Отримати інструкцію з ремонту майже будь-чого. Для цього не потрібні гроші, звʼязки чи спеціальна освіта — лише доступ до інтернету.\n\nВеб знищив географію знання. Учений у Києві читає той самий науковий препринт, що й учений у Кембриджі — одночасно, за хвилини після публікації. До інтернету це було фізично неможливо: препринт треба було надрукувати, надіслати поштою, чекати тижнями. Це прискорило науку, освіту, журналістику.\n\nВеб створив нові спільноти, які раніше не могли існувати. Люди з рідкісними інтересами знайшли одне одного: любителі маловідомого музичного жанру з різних країн. Пацієнти з рідкісними захворюваннями, яких в одному місті може бути десять людей. Програмісти конкретної мови, готові безкоштовно допомогти незнайомцю на іншому кінці планети. Раніше вони були невидимими — для суспільства й одне для одного. Веб зробив їх спільнотою.\n\n## Де Web1 спіткнувся\n\nАле Web1 мав фундаментальне обмеження, яке визначило все, що сталося далі. Читати міг будь-хто. Публікувати — ні.\n\nЩоб створити сайт у 1996 році, треба було знати HTML, розбиратися в хостингу й FTP, розуміти доменні імена. Для програміста — невеликий барʼєр. Для шкільного вчителя, домогосподарки чи пенсіонера — непереборний. Інтернет був демократією споживання, але не демократією виробництва. Мільйони читали. Тисячі писали.\n\nЦе створювало приховану суперечність. Web1 обіцяв горизонтальний, відкритий інтернет без воротарів. Але на практиці воротарі нікуди не зникли — просто змінили професію. Замість редакторів газет — веброзробники. Замість телевізійних продюсерів — власники серверів. Голос і далі належав тим, хто мав технічні знання.\n\nЕлі Парізер зафіксував ще одну проблему, що проявилася трохи пізніше. Щойно пошукові алгоритми почали враховувати історію запитів, інформаційний простір перестав бути спільним. Кожен почав бачити свою версію інтернету. Парізер назвав це «фільтровою бульбашкою». Web1 обіцяв: усі мають доступ до всієї інформації. На практиці: алгоритм вирішує, яка інформація твоя.\n\n> Web1 був неймовірним досягненням. Але він залишив нерозвʼязаним головне питання: як дати голос усім, а не лише тим, хто має технічні знання?\n\nВідповідь на це питання прийшла у вигляді Web2 — платформ, які прибрали технічний барʼєр і дали голос кожному. Але в цієї відповіді виявилася прихована ціна, яку ніхто не читав у користувацькій угоді.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["Web", "історія", "інформація", "медіа"], "x": 240.2, "y": 595.0, "angDeg": 150.0}, {"id": "filter", "sceneIndex": 5, "type": "power", "shortTitle": "Фільтр-бульбашка", "era": "поч. 2000-х", "lensWeight": {"chronology": 5, "openness": 1, "community": 1, "media": 4, "control": 5}, "title": "Фільтрова бульбашка: коли алгоритм вирішує за тебе", "insight": "Фільтрова бульбашка почалася не з Facebook — а з перших персоналізованих пошукових алгоритмів. Зручність персоналізації руйнує спільний інформаційний простір.", "thesis": "Фільтрова бульбашка почалася не з Facebook — а з перших персоналізованих пошукових алгоритмів. Зручність персоналізації руйнує спільний інформаційний простір.", "body": "## Невидимий посередник\n\nНа початку 2000-х сталося дещо, чого майже ніхто не помітив у момент появи. Google почав враховувати історію пошуку під час формування результатів. Якщо ти часто шукаєш новини певного політичного спрямування — Google починає показувати тобі більше таких новин. Якщо ти клікаєш на певний тип контенту — алгоритм запамʼятовує це й коригує видачу.\n\nЗвучить зручно. І в короткостроковій перспективі — справді зручніше. Ти отримуєш те, що, на думку алгоритму, тобі сподобається. Менше нерелевантного, більше цікавого.\n\nАле Елі Парізер у своєму дослідженні *The Filter Bubble* зафіксував приховану ціну цієї зручності. Він провів простий експеримент: попросив кількох своїх друзів одночасно погуглити слово «Єгипет» — це було в розпал Арабської весни у 2011 році. Результати були разюче різними. Один отримав новини про революцію й протести. Інший — туристичні поради та памʼятки. Третій — ділові новини про економіку країни.\n\nОдне й те саме слово. Один і той самий час. Абсолютно різна реальність.\n\n## Що втрачається в бульбашці\n\nЦе не просто незручність. Це фундаментальна зміна того, що таке «спільний інформаційний простір».\n\nДемократія передбачає, що громадяни мають хоча б базовий спільний набір фактів. Вони можуть не погоджуватися в цінностях і пріоритетах — але вони мають погоджуватися щодо реальності. Що сталося те-то й те-то. Що існує така-то проблема. Що ось ця цифра — факт.\n\nФільтрова бульбашка руйнує цей спільний простір. Алгоритм показує кожному те, що викликає найбільше залучення — тобто те, що підтверджує вже наявні переконання й посилює вже наявні емоції. У результаті люди, які живуть в одному місті, можуть мати принципово різні картини реальності. Не тому, що вони дурні чи зловмисні, — а тому, що алгоритм буквально показував їм різний світ.\n\nВажливо зрозуміти: це почалося вже в епоху Web1, з першими персоналізованими пошуковими видачами. Соціальні мережі просто довели цей механізм до межі.\n\nWeb1 обіцяв: усі мають рівний доступ до всієї інформації. Це було правдою — технічно. Але алгоритм вирішував, яка інформація «твоя». І це виявилося важливішим за технічну рівнодоступність.\n\n> Web1 створив спільний інформаційний простір. Перші алгоритми персоналізації почали його руйнувати — ще до появи соціальних мереж.\n\nПарізер написав про це у 2011 році — вже в епоху Web2. Але корені проблеми сягають Web1. Щойно в алгоритму зʼявляється мета «показувати тобі те, що тобі сподобається», він неминуче починає звужувати твій інформаційний простір. Спершу непомітно. Потім — принципово. Це не баг, це архітектурний наслідок самої ідеї персоналізації.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["алгоритми", "інформація", "медіа", "Web"], "x": 240.2, "y": 295.0, "angDeg": 210.0}], "edges": [{"from": "nelson", "to": "read", "label": "мрія стала вітриною", "lenses": ["chronology", "openness", "media"]}, {"from": "nelson", "to": "ethic", "label": "ідея потребувала людей", "lenses": ["openness"]}, {"from": "ethic", "to": "read", "label": "відкритість зробила веб доступним", "lenses": ["openness", "media"]}, {"from": "ethic", "to": "community", "label": "етика зібрала перші спільноти", "lenses": ["openness", "community"]}, {"from": "read", "to": "community", "label": "у читачів зʼявився голос", "lenses": ["community", "media"]}, {"from": "read", "to": "verdict", "label": "споживання демократизовано", "lenses": ["media", "chronology"]}, {"from": "community", "to": "verdict", "label": "звʼязки виявилися крихкими", "lenses": ["community"]}, {"from": "verdict", "to": "filter", "label": "немає виробництва — потрібен посередник", "lenses": ["chronology", "control", "media"]}, {"from": "ethic", "to": "filter", "label": "відкритість дозволила її закрити", "lenses": ["control", "openness"]}, {"from": "nelson", "to": "filter", "label": "від вільного посилання до ранжування", "lenses": ["control"]}]}, "kk": {"chapter": {"key": "web1", "title": "Оқитын интернет", "lede": "Ашықтық интернетті қалай құрды және сол ашықтық оны жабуға қалай мүмкіндік берді.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=web1", "centralIdea": "Ашықтық интернетті құрды және оны жабуға мүмкіндік берді", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Хронология", "accent": "#7dd3fc", "description": "1965 → 2004: Нельсонның «гипермәтін» сөзінен алғашқы фильтр-көпіршіктерге дейін."}, {"id": "openness", "label": "Ашықтық", "accent": "#34d399", "description": "Тегін берілген гипермәтін, хакерлік этика және білім еркіндігі Web негізі ретінде."}, {"id": "community", "label": "Қауымдастық", "accent": "#c084fc", "description": "Алғашқы виртуалды қауымдастықтар: онлайн достық мүмкін бе және неге ол нәзік."}, {"id": "media", "label": "Медиа", "accent": "#fbbf24", "description": "«Сен оқисың, олар жариялайды»: өндіріс құқығынсыз тұтыну демократиясы."}, {"id": "control", "label": "Бақылау", "accent": "#f87171", "description": "Көрінбейтін делдал қайда туады — сен үшін шешетін алгоритм."}], "nodes": [{"id": "nelson", "sceneIndex": 0, "type": "technology", "shortTitle": "Гипермәтін", "era": "1965→1991", "lensWeight": {"chronology": 5, "openness": 5, "community": 2, "media": 3, "control": 1}, "title": "Нельсон және гипермәтін туралы арман", "insight": "Нельсон гипермәтінді 1965 жылы ойлап тапты, Бернерс-Ли оны 1991 жылы іске асырып, бәріне тегін берді — осы шешім ашық интернеттің табиғатын айқындады.", "thesis": "Нельсон гипермәтінді 1965 жылы ойлап тапты, Бернерс-Ли оны 1991 жылы іске асырып, бәріне тегін берді — осы шешім ашық интернеттің табиғатын айқындады.", "body": "## Әлемді өзгерткен сөз\n\n1965 жылы жас америкалық бағдарламашы Тед Нельсон әлемді өзгертетін сөз ойлап тапты, бірақ ол кезде мұны ешкім білмеді. Бұл сөз «гипермәтін» еді. Нельсон жай ғана термин ойлап тапқан жоқ, ол білімді ұйымдастырудың мүлде жаңа тәсілін сипаттады.\n\nКәдімгі кітапхананы елестет. Мыңдаған кітап сөрелерде әліпбилік немесе тақырыптық тәртіппен тұр. Сен салыстырмалылық теориясын түсінгің келеді, Эйнштейннің кітабын алып оқисың. Лоренцтің еңбегіне сілтемені кездестіресің, оны каталогтан іздейсің, сөреден табасың, қайта ораласың. Сосын Пуанкареге сілтеме шығады, тағы да каталогқа барасың. Білім бар, бірақ ол бөліктерге бөлініп, жәшіктерге салынған. Идеялар арасындағы байланыстар тек оқырманның басында ғана өмір сүреді.\n\nНельсон кітапхананы мүлде басқа түрде, байланыстардың тірі желісі ретінде елестетті. Коперник туралы мақаланы оқисың да, бір қимылмен ол дәйексөз келтірген мәтінге өтесің. Содан кейін оның теориясын замандастары қалай сынағанына өтесің. Одан соң оның дәуіріндегі жұлдызды аспан картасына өтесің. Сызықты түрде, беттен бетке емес, мағына бойынша, зерттеушінің ойында ағып жатқан ойдың өзіне ілесіп.\n\nОл бұл жобаны Xanadu деп атады, Кублай ханның мифтік сарайының, шексіз сұлулық пен білім мекенінің құрметіне. Нельсон бүкіл өмірін Xanadu-ға арнады. Жоба аяқталмай қалды. Бірақ идея өлмес болып шықты.\n\n## Басқа адам іліп әкеткен идея\n\nXanadu өнім ретінде сәтсіздікке ұшырады, бірақ тұжырымдама ретінде жеңді. 1989 жылы Женевадағы CERN ядролық орталығында жұмыс істеген британдық бағдарламашы Тим Бернерс-Ли басшылыққа ішкі өтінім жазды. Мәні: барлық құжаттар сілтемелермен байланысқан және желідегі кез келген компьютерден қолжетімді болатын жүйе жасау.\n\nОның бастығы Майк Сендалл шетіне үш сөз жазды: «Бұлыңғыр, бірақ қызық». Бұл бәрін өзгертетін өнертабысқа берілген ең қарапайым пікір еді.\n\nҮш жыл ішінде Бернерс-Ли HTML, HTTP және URL жазды — қазіргі бүкіл веб сүйенетін үш технология. Құжаттар серверлерде сақталады, мекенжайлары бар, сілтемелермен байланысқан және браузер арқылы ашылады. Нельсонның гипермәтін туралы арманы ақыры қарапайым техникалық іске асуға ие болды.\n\nБірақ ең маңызды шешім техникалық емес еді. Бернерс-Ли Web-ті патенттеп, планетадағы ең бай адамға айнала алар еді. Оның орнына ол бәрін тегін, лицензиясыз, шартсыз берді. «Егер Web патенттелген болса, ол болмас еді», — деп түсіндірді ол «Weaving the Web» кітабында. Ашықтық альтруизм емес, стратегия болды: тек кедергілерсіз ғана желі жаһандық ауқымға дейін өсе алды.\n\n> Нельсон гипермәтінді 1965 жылы ойлап тапты. Бернерс-Ли оны 1991 жылы іске асырып, бәріне тегін берді. Идея мен оның жүзеге асуының арасында жиырма алты жыл және бір принципті шешім жатты.\n\n1993 жылы Mosaic браузері пайда болды — мәтін мен суреттерді бірге көрсеткен алғашқы браузер. Интернет визуалды әрі техникалық білімсіз де түсінікті болды. Сол жылы сайттар саны бес жүзден асты. Екі жылдан кейін екі жүз мыңға жетті. Жарыс басталды.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["Web", "тарих", "гипермәтін", "ашық код"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "read", "sceneIndex": 1, "type": "media", "shortTitle": "Сен оқисың", "era": "1991→2004", "lensWeight": {"chronology": 5, "openness": 3, "community": 2, "media": 5, "control": 2}, "title": "Оқитын интернет: сен оқисың, олар жариялайды", "insight": "Web1 алгоритм-делдалдарсыз тұтыну демократиясы болды — бұл оның басты артықшылығы, оны біз тек жоғалтқаннан кейін түсіндік.", "thesis": "Web1 алгоритм-делдалдарсыз тұтыну демократиясы болды — бұл оның басты артықшылығы, оны біз тек жоғалтқаннан кейін түсіндік.", "body": "## Web1 деген не және оны түсіну неге маңызды\n\nWeb1 — шамамен 1991 жылдан 2004 жылға дейінгі интернет. Оны бір сөйлеммен сипаттасақ: сен оқисың, олар жариялайды.\n\nСайттар статикалық беттер болды. Компания, университет, редакция немесе энтузиаст контент жасап, оны желіге орналастыратын. Қалғандардың бәрі келіп оқитын. Пікірлер жоқ. Лайктар жоқ. Жауап беру немесе өзіңдікін қосу мүмкіндігі жоқ. Интернет баяу әрі біркелкі емес жаңарып тұратын үлкен кітапхана еді.\n\nБір қарағанда бұл шектеу сияқты естіледі. Бірақ бұл модельдің біз жоғалтып алып, қазір сағынып жүрген өз сұлулығы бар еді: сен мен ақпараттың арасында ешқандай делдал болмады. Саған нені көрсету керегін шешетін алгоритм болған жоқ. Сен мекенжайды енгіздің де, бетті алдың. Дәл өзің қалаған бетті. Беттің «жекелендірілген нұсқасын» емес. «Бұрын көргеніңе ұқсас контентті» емес. Жай ғана бетті.\n\nІздеу де басқаша көрінетін. Ерте Yahoo — сайттардың алғашқы танымал каталогтарының бірі — тірі адамдардың қолымен жасалатын. Редакторлар сайттарды қарап шығып, оларды санаттарға бөлетін. Бұл баяу, жетілмеген, адами процесс еді. Бірақ онда жасырын ниет болған жоқ. Ешбір алгоритм сені сайтта қажеттен ұзақ ұстауға тырыспады. Назарды монетизациялау болған жоқ. Нысаналы жарнама болған жоқ.\n\n## Ақпарат ағындары ашық болды\n\nWeb1-дің бұл ерекшелігін кейін келген нәрсемен салыстырмайынша бағаламау оңай. Ақпарат ағындары қарапайым әрі көрінетін еді. Сен ақпараттың қайдан келетінін білдің. Дереккөзді бағалай алдың. Нені оқу және қанша уақыт жұмсау керегін өзің шештің.\n\nДж. К. Р. Ликлайдер 1960 жылдың өзінде «Galactic Network» туралы армандады — әлемнің кез келген нүктесіндегі адамдар деректер мен бағдарламаларға қол жеткізе алатын жаһандық желі. Оның көзқарасында компьютер мен адам симбиоз құрады: машина ақпаратты күнделікті өңдеуді өз мойнына алады, адам шығармашылық ойлаумен айналысады. Бірге олар әрқайсысы жеке өзі істей алмайтын нәрсеге қабілетті болады.\n\nWeb1 бұл арманды ең қарапайым түрде жүзеге асырды. Компьютер білімге қол жеткізу құралы ретінде. Адам сол біліммен не істеуді шешетін тұлға ретінде. Олардың арасында ешқандай делдал жоқ.\n\nДэвид Вайнбергер 2002 жылы «Small Pieces Loosely Joined» кітабында мұның философиялық өлшемін сипаттады. Физикалық әлемде кеңістік — шектеу: құжат тек бір жерде жата алады, кітап тек бір бөлімге тиесілі болады. Web-те құжат бір мезетте мың басқа құжатпен байланыса алады. Бір бет шексіз көп контексте өмір сүреді. Бұл «гиперсілтемелік ойлау» — бұрын қабырғалар тұрған жерде байланыстарды көру қабілеті.\n\n> Web1 тұтыну демократиясы болды: кез келген адам кез келген нәрсені оқи алды. Бірақ ол өндіріс демократиясы болған жоқ: тек техникалық білімі барлар ғана жариялай алды.\n\nОсы шектеу келесі қадамның себебіне айналды. Миллиондаған адам оқыды және сөйлегісі келді. Өзінікін қосқысы келді. Жауап бергісі келді. Жасағысы келді. Технологиялар ақыры мұны оңай етуге мүмкіндік бергенде, интернет мәңгі өзгерді.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["Web", "тарих", "ақпарат", "медиа"], "x": 759.8, "y": 295.0, "angDeg": -30.0}, {"id": "ethic", "sceneIndex": 2, "type": "technology", "shortTitle": "Хакерлік этика", "era": "1984→", "lensWeight": {"chronology": 3, "openness": 5, "community": 4, "media": 1, "control": 2}, "title": "Хакерлік этика: ашықтық ізгілік ретінде", "insight": "Хакерлік этика — ашықтық, орталықсыздандыру, білім еркіндігі — ашық интернетті құрды. Кейін дәл осы ашықтық платформаларға оны жабуға мүмкіндік берді.", "thesis": "Хакерлік этика — ашықтық, орталықсыздандыру, білім еркіндігі — ашық интернетті құрды. Кейін дәл осы ашықтық платформаларға оны жабуға мүмкіндік берді.", "body": "## Интернетті тегін құрған адамдар\n\nWeb1 рухын түсіну үшін оны жасаған адамдарды түсіну керек. Олар бизнес-модель іздеген кәсіпкерлер емес еді. Олар хакерлер болатын, сөздің бастапқы мағынасында, қылмыстық мағынасында емес. Жүйелердің қалай жұмыс істейтінін түсіну, оларды жақсарту және нәтижесімен бөлісу үшін оларды бөлшектеп қарайтын адамдар.\n\nСтивен Леви «Hackers: Heroes of the Computer Revolution» кітабында 1960–70-жылдары MIT пен Стэнфордта қалыптасқан мәдениетті сипаттады. Бұл өз этикасы мен құндылықтары бар нағыз субмәдениет еді. Ақпарат еркін болуы керек, өйткені білім физикалық заттардан айырмашылығы көшірілгенде азаймайды. Орталықсыздандыру орталықтандырудан жақсы, өйткені бәрі қол жеткізетін нәрсеге ешкім билік жүргізбеуі керек. Адамдарды дипломына емес, кодына қарап бағала, өйткені цифрлық әлемде сенің кім екенің емес, не жасайтының маңызды.\n\nБұл этика көпмиллиардтық технологиялық компаниялар дәуірінде аңғал естіледі. Бірақ дәл осы этика ерте интернеттің архитектурасын анықтады. Желінің алғашқы құрылысшылары ашықтыққа сенгендіктен, біз ашық протоколдарға, тегін браузерлерге және бәріне қолжетімді вебке ие болдық.\n\n## Столлман және еркін БҚ қозғалысы\n\nРичард Столлман хакерлік этиканы философиялық шегіне жеткізді. 1985 жылы ол еркін бағдарламалық қамтамасыз ету қозғалысының бағдарламалық құжаты — «GNU Манифестін» жазды.\n\nОның уәжі қарапайым еді: бағдарламалық код — білім. Білім ешкімнің меншігі бола алмайды, өйткені оны көшіру түпнұсқадан ештеңе алып қоймайды. Егер сен менімен идея бөліссең, ол сенде жоғалып кетпейді. Енді ол екеумізде де бар. Демек, кодқа авторлық құқық арқылы білімнің таралуын шектеу — ақпараттың табиғатына қайшы келетін жасанды әрі әділетсіз әрекет.\n\nСтоллман жай ғана манифест жазған жоқ, ол балама құра бастады. GNU — толықтай еркін бағдарламалық қамтамасыз етуден құралған операциялық жүйе. 1991 жылы фин студенті Линус Торвальдс оған Linux ядросын қосты, сөйтіп бүгінде әлемдегі серверлердің көпшілігі, Android-тағы барлық смартфондар және суперкомпьютерлер қолданатын операциялық жүйе пайда болды.\n\nСол философиядан Apache (ерте интернеттің үлкен бөлігі жұмыс істеген серверлік БҚ), Mozilla Firefox, Wikipedia өсіп шықты. Мұның бәрі — иеленуден гөрі бөлісу маңызды болатын мәдениеттің өнімдері. Жасау және беру әлсіздік емес, принцип саналатын мәдениеттің өнімдері.\n\nБүгінде «open source» деп аталатын нәрсе жай ғана әзірлеу моделі емес. Бұл — әлемнің технологиялық инфрақұрылымының едәуір бөлігін әлі де айқындайтын 1960-жылдардағы хакерлік этиканың идеологиялық мұрасы.\n\n> Хакерлік этика интернетті ашық етті, өйткені бұл тиімдірек болғандықтан емес, дұрыс болғандықтан. Бұлар әртүрлі мотивациялар және олар әртүрлі нәтижелер тудырады.\n\nПарадокс мынада: дәл осы ашықтық кейін интернетті жапқан компаниялардың пайда болуына мүмкіндік берді. Google Web-тің ашық протоколдарына сүйенеді. Facebook ашық интернетке сүйенеді. Олар ашық инфрақұрылымды пайдаланып, оның үстіне жабық платформалар құрды. Хакерлік этика кейін басқа ережелермен ойнаған әлемді жасады.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["ашық код", "тарих", "Web", "қауымдастық"], "x": 759.8, "y": 595.0, "angDeg": 30.0}, {"id": "community", "sceneIndex": 3, "type": "privacy", "shortTitle": "Қауымдастықтар", "era": "1993", "lensWeight": {"chronology": 4, "openness": 3, "community": 5, "media": 2, "control": 1}, "title": "Алғашқы қауымдастықтар: онлайнда дос болуға бола ма?", "insight": "Рейнгольд дәлелдеді: онлайн-қауымдастықтар шынайы. Бірақ олар нәзік — шағын ауқымда жұмыс істейді де, ортақ нормаларсыз өскенде ыдырайды.", "thesis": "Рейнгольд дәлелдеді: онлайн-қауымдастықтар шынайы. Бірақ олар нәзік — шағын ауқымда жұмыс істейді де, ортақ нормаларсыз өскенде ыдырайды.", "body": "## Бір кезде оғаш көрінген сұрақ\n\n1993 жылы журналист әрі зерттеуші Говард Рейнгольд *The Virtual Community* кітабын жариялады — бұл адамдар желіде сөйлесе бастағанда олармен не болатынын зерттеген алғашқы салмақты еңбек еді. Ол қойған сұрақ сол кезде оғаш көрінетін: интернетте шынайы адамдық қауымдастық пайда бола ала ма?\n\nҚазір бұл анық сияқты — әрине, бола алады, бәріміз соның ішінде өмір сүріп жатырмыз. Бірақ 1993 жылы бұл мүлде анық емес еді. Қоғам тірі қарым-қатынасты ештеңе алмастыра алмайды, желі — тек жасанды алмастырғыш, физикалық қатысусыз шынайы қарым-қатынас болмайды деп сенетін.\n\nРейнгольд WELL — Whole Earth 'Lectronic Link жүйесін зерттеді, бұл браузерден бұрын-ақ болған алғашқы онлайн-желілердің бірі еді. Қатысушылар мәтіндік терминалдар арқылы сөйлесті: мәтін тересің, Enter басасың, жауап күтесің. Фотосурет те жоқ, видео да жоқ, эмодзи де жоқ. Қара экрандағы сөздер ғана.\n\nСоған қарамастан Рейнгольд таңғаларлық нәрсені көрді: WELL қатысушылары қиын сәттерде — ауру, жоғалту, дағдарыс кезінде — бір-біріне қолдау көрсетті. Ешқашан көрмеген бейтаныс адамдармен білім бөлісті. Жылдар бойғы өзара әрекет арқылы бедел мен сенім қалыптастырды. Желі жақындықтың жаңа түрін жасады — географиясыз, физикалық кеңістіксіз.\n\n## Нәзіктік және ауқым\n\nРейнгольдтың жауабы сақ оптимизмге толы болды: иә, желідегі шынайы қауымдастықтар мүмкін. Бірақ ол осы қауымдастықтардың табиғаты туралы маңызды нәрсені де байқады — олар нәзік.\n\nWELL қауымдастығы қатысушылар аз болған кезде жұмыс істеді — бір-бірін кемінде ник арқылы танитын бірнеше мың адам. Ортақ мінез-құлық нормалары, жазылмаған ережелер, тиесілік сезімі болды. Қауымдастық өскен сайын өзара әрекеттің сапасы өзгерді. Тым көп бейтаныс адам сенім атмосферасын бұзды.\n\nБұл бақылау екі онжылдықтан кейін шешуші болған мәселені алдын ала көрсетті: қауымдастықтың сапасын сақтай отырып, оны қалай ауқымдауға болады? Екі миллиард пайдаланушысы бар Facebook қалай «қауымдастық» бола алады, егер қатысушылардың көбі ешқашан кездеспесе және олардың ортақ нормалары болмаса?\n\nКевин Келли *Out of Control* (1994) кітабында интернетті тірі жүйе ретінде сипаттады — орталықтандырылмаған, орталық басқаруы жоқ, миллиондаған қатысушының өзара әрекетінен эволюцияланатын жүйе. Бұл жақсы жаңалық сияқты естілді. Бірақ Келли өз логикасының бір салдарын байқамай қалды: тірі жүйелер әділдікке немесе адамдық жылылыққа қарай емес, ең бейімделгендердің аман қалуына қарай эволюцияланады.\n\nИнтернетке орасан ресурстары бар компаниялар келгенде, дәл солар «ең бейімделгендер» болып шықты. Жүйе солардың бағытына қарай эволюциялана бастады.\n\n> Рейнгольд дәлелдеді: желідегі шынайы қауымдастықтар мүмкін. Бірақ ол олардың нәзіктігін де көрсетті: қауымдастық шағын болып, ортақ нормалары бар кезде ғана жұмыс істейді.\n\nБұл бақылау әлі күнге дейін өзекті. Ең жақсы онлайн-қауымдастықтар — шағын, айқын бірегейлігі мен ережелері бар қауымдастықтар. Үлкен платформалар қауымдастықтарды аудиторияға айналдырып, оларды жояды. Дәл сондықтан Web3 токендер мен DAO-ға сүйенеді — олар ауқымда нормаларды сақтауға арналған формалды механизмдер жасайтын құралдар.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%  "control": 3}, "title": "Web1 нені орындады — және қай жерде сүрінді", "insight": "Web1 ақпаратты тұтынуды демократияландырды, бірақ оны өндіруді емес — осы қайшылық бәріне арналған платформалары бар Web2-ні тудырды.", "thesis": "Web1 ақпаратты тұтынуды демократияландырды, бірақ оны өндіруді емес — осы қайшылық бәріне арналған платформалары бар Web2-ні тудырды.", "body": "## Ұмытып кету оңай нақты жетістіктер\n\n1990-жылдардың соңына қарай Web1 жиырма жыл бұрын мүмкін емес болып көрінген бірнеше нәрсені жүзеге асырды. Мұны ұмыту оңай, өйткені қазір мұның бәрі өзінен-өзі түсінікті сияқты. Бірақ тоқтап, ауқымын бағалаған жөн.\n\nВеб ақпаратқа қолжетімділікті бұрын-соңды болмаған ауқымда демократияландырды. Егер сенде компьютер мен байланыс болса, Гарвардтың университет кітапханасындағы мақаланы оқи аласың. Бұрын тек дәрігерлер білетін медициналық ақпаратты таба аласың. Әлемнің кез келген елінен жаңалықтарды нақты уақытта оқи аласың. Кез келген дерлік нәрсені жөндеу жөніндегі нұсқаулықты ала аласың. Бұл үшін ақша, байланыс немесе арнайы білім қажет емес — тек интернетке қолжетімділік керек.\n\nВеб білімнің географиясын жойды. Киевтегі ғалым Кембридждегі ғалым оқитын сол ғылыми препринтті бір уақытта — жарияланғаннан бірнеше минут өткен соң оқиды. Интернетке дейін бұл физикалық тұрғыдан мүмкін емес еді: препринтті басып шығару, пошта арқылы жіберу, апталап күту керек болатын. Бұл ғылымды, білім беруді, журналистиканы жеделдетті.\n\nВеб бұрын өмір сүре алмайтын жаңа қауымдастықтарды құрды. Сирек қызығушылықтары бар адамдар бір-бірін тапты: әртүрлі елдердегі аз танымал музыка жанрының әуесқойлары. Бір қалада он адам ғана болуы мүмкін сирек аурулары бар пациенттер. Жер шарының екінші шетіндегі бейтаныс адамға тегін көмектесуге дайын нақты бір тілдің бағдарламашылары. Бұрын олар қоғам үшін де, бір-бірі үшін де көрінбейтін еді. Веб оларды қауымдастыққа айналдырды.\n\n## Web1 қай жерде сүрінді\n\nБірақ Web1-де кейін болғанның бәрін айқындаған іргелі шектеу болды. Оқи алатын кез келген адам еді. Ал жариялай алу — бөлек мәселе.\n\n1996 жылы сайт жасау үшін HTML білу, хостинг пен FTP-ді түсіну, домен атауларын ұғыну керек еді. Бағдарламашы үшін бұл шағын кедергі болатын. Мектеп мұғалімі, үй шаруасындағы адам немесе зейнеткер үшін — еңсерілмейтін кедергі. Интернет тұтыну демократиясы болды, бірақ өндіріс демократиясы болған жоқ. Миллиондар оқыды. Мыңдар жазды.\n\nБұл жасырын қайшылық туғызды. Web1 қақпашыларсыз, көлденең әрі ашық интернетті уәде етті. Бірақ іс жүзінде қақпашылар ешқайда кеткен жоқ — тек мамандығын өзгертті. Газет редакторларының орнына веб-әзірлеушілер келді. Телевизиялық продюсерлердің орнына сервер иелері келді. Дауыс әлі де техникалық білімі барларға тиесілі болды.\n\nЭли Паризер сәл кейінірек көрінген тағы бір мәселені тіркеді. Іздеу алгоритмдері сұраулар тарихын ескере бастаған сәттен бастап ақпараттық кеңістік ортақ болудан қалды. Әркім интернеттің өз нұсқасын көре бастады. Паризер мұны «сүзгі көпіршігі» деп атады. Web1 былай деп уәде берді: бәрі барлық ақпаратқа қол жеткізе алады. Іс жүзінде: қай ақпарат «сенікі» екенін алгоритм шешеді.\n\n> Web1 керемет жетістік болды. Бірақ ол басты сұрақты шешілмеген күйде қалдырды: дауысты техникалық білімі барларға ғана емес, бәріне қалай береміз?\n\nБұл сұрақтың жауабы Web2 түрінде келді — техникалық кедергіні алып тастап, әркімге дауыс берген платформалар түрінде. Бірақ бұл жауаптың қолданушы келісімінде ешкім оқымаған жасырын құны болды.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType" %D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["Web", "тарих", "ақпарат", "медиа"], "x": 240.2, "y": 595.0, "angDeg": 150.0}, {"id": "filter", "sceneIndex": 5, "type": "power", "shortTitle": "Фильтр-көпіршік", "era": "2000-жылдардың басы", "lensWeight": {"chronology": 5, "openness": 1, "community": 1, "media": 4, "control": 5}, "title": "Сүзгі көпіршігі: алгоритм сенің орныңа шешкенде", "insight": "Сүзгі көпіршігі Facebook-тен емес — алғашқы жекелендірілген іздеу алгоритмдерінен басталды. Жекелендірудің ыңғайлылығы ортақ ақпараттық кеңістікті бұзады.", "thesis": "Сүзгі көпіршігі Facebook-тен емес — алғашқы жекелендірілген іздеу алгоритмдерінен басталды. Жекелендірудің ыңғайлылығы ортақ ақпараттық кеңістікті бұзады.", "body": "## Көрінбейтін делдал\n\n2000-жылдардың басында пайда болған сәтінде ешкім дерлік байқамаған бір нәрсе болды. Google нәтижелерді қалыптастырғанда іздеу тарихын ескере бастады. Егер сен белгілі бір саяси бағыттағы жаңалықтарды жиі іздесең, Google саған сондай жаңалықтарды көбірек көрсете бастайды. Егер белгілі бір контент түрін бассаң, алгоритм мұны есте сақтап, выдачаны түзетеді.\n\nБұл ыңғайлы естіледі. Қысқа мерзімде шынымен де ыңғайлырақ. Сен алгоритмнің ойынша өзіңе ұнайтын нәрсені аласың. Қатысы жоқ нәрсе азаяды, қызықты нәрсе көбейеді.\n\nБірақ Эли Паризер өзінің *The Filter Bubble* зерттеуінде осы ыңғайлылықтың жасырын құнын тіркеді. Ол қарапайым эксперимент жүргізді: бірнеше досынан «Египет» сөзін бір уақытта Google-дан іздеуді сұрады — бұл 2011 жылы Араб көктемінің қызған шағы еді. Нәтижелер таңғаларлықтай әртүрлі болды. Біреуі революция мен наразылықтар туралы жаңалықтар алды. Екіншісі — туристік кеңестер мен көрікті жерлерді. Үшіншісі — ел экономикасы туралы іскерлік жаңалықтарды.\n\nБір сөз. Бір уақыт. Мүлде басқа шындық.\n\n## Көпіршікте не жоғалады\n\nБұл жай ғана қолайсыздық емес. Бұл «ортақ ақпараттық кеңістік» дегеннің не екенін түбегейлі өзгерту.\n\nДемократия азаматтарда кем дегенде базалық ортақ фактілер жиынтығы бар деп ұйғарады. Олар құндылықтар мен басымдықтарда келіспеуі мүмкін — бірақ шындық жөнінде келісуі тиіс. Мынау мен анау болды. Мынадай мәселе бар. Мына сан — факт.\n\nСүзгі көпіршігі осы ортақ кеңістікті бұзады. Алгоритм әркімге ең көп вовлечение тудыратын нәрсені көрсетеді — яғни бұрыннан бар сенімдерді растайтын және бұрыннан бар эмоцияларды күшейтетін нәрсені. Нәтижесінде бір қалада тұратын адамдардың шындық туралы картиналары түбегейлі әртүрлі болуы мүмкін. Олар ақымақ немесе жаман ниетті болғандықтан емес — алгоритм оларға сөзбе-сөз әртүрлі әлем көрсеткендіктен.\n\nМынаны түсіну маңызды: бұл Web1 дәуірінде-ақ, алғашқы жекелендірілген іздеу нәтижелерімен басталды. Әлеуметтік желілер бұл механизмді тек шегіне жеткізді.\n\nWeb1 былай уәде етті: бәрі барлық ақпаратқа тең қол жеткізе алады. Бұл рас еді — техникалық тұрғыдан. Бірақ қай ақпарат «сенікі» екенін алгоритм шешті. Бұл техникалық тең қолжетімділіктен маңыздырақ болып шықты.\n\n> Web1 ортақ ақпараттық кеңістік құрды. Алғашқы жекелендіру алгоритмдері оны бұза бастады — әлеуметтік желілер пайда болғанға дейін-ақ.\n\nПаризер бұл туралы 2011 жылы — Web2 дәуірінде жазды. Бірақ мәселенің тамыры Web1-ге кетеді. Алгоритмде «саған ұнайтын нәрсені көрсету» мақсаты пайда болған сәттен бастап, ол сенің ақпараттық кеңістігіңді сөзсіз тарылта бастайды. Әуелі байқатпай. Кейін — түбегейлі. Бұл баг емес, бұл жекелендіру идеясының өзінен шығатын архитектуралық салдар.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8
