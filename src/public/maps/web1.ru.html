eces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["алгоритмдер", "ақпарат", "медиа", "Web"], "x": 240.2, "y": 295.0, "angDeg": 210.0}], "edges": [{"from": "nelson", "to": "read", "label": "арман витринаға айналды", "lenses": ["chronology", "openness", "media"]}, {"from": "nelson", "to": "ethic", "label": "идеяға адамдар керек болды", "lenses": ["openness"]}, {"from": "ethic", "to": "read", "label": "ашықтық вебті қолжетімді етті", "lenses": ["openness", "media"]}, {"from": "ethic", "to": "community", "label": "этика алғашқы қауымдастықтарды жинады", "lenses": ["openness", "community"]}, {"from": "read", "to": "community", "label": "оқырмандарда дауыс пайда болды", "lenses": ["community", "media"]}, {"from": "read", "to": "verdict", "label": "тұтыну демократияланды", "lenses": ["media", "chronology"]}, {"from": "community", "to": "verdict", "label": "байланыстар нәзік болып шықты", "lenses": ["community"]}, {"from": "verdict", "to": "filter", "label": "өндіріс жоқ — делдал керек", "lenses": ["chronology", "control", "media"]}, {"from": "ethic", "to": "filter", "label": "ашықтық оны жабуға мүмкіндік берді", "lenses": ["control", "openness"]}, {"from": "nelson", "to": "filter", "label": "еркін сілтемеден ранжирлеуге", "lenses": ["control"]}]}, "uz": {"chapter": {"key": "web1", "title": "Oʻquvchi internet", "lede": "Ochiqlik internetni qanday yaratdi va ayni ochiqlik uni yopishga qanday imkon berdi.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=web1", "centralIdea": "Ochiqlik internetni yaratdi va uni yopishga imkon berdi", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Xronologiya", "accent": "#7dd3fc", "description": "1965 → 2004: Nelsonning “gipermatn” soʻzidan ilk filtr pufaklarigacha."}, {"id": "openness", "label": "Ochiqlik", "accent": "#34d399", "description": "Bepul berilgan gipermatn, xakerlik etikasi va bilim erkinligi Web poydevori sifatida."}, {"id": "community", "label": "Hamjamiyat", "accent": "#c084fc", "description": "Ilk virtual hamjamiyatlar: onlayn doʻstlashish mumkinmi va nega bu moʻrt."}, {"id": "media", "label": "Media", "accent": "#fbbf24", "description": "“Sen oʻqiysan, ular nashr qiladi”: ishlab chiqarish huquqisiz isteʼmol demokratiyasi."}, {"id": "control", "label": "Nazorat", "accent": "#f87171", "description": "Koʻrinmas vositachi qayerda tugʻiladi — sening oʻrningga qaror qiladigan algoritm."}], "nodes": [{"id": "nelson", "sceneIndex": 0, "type": "technology", "shortTitle": "Gipermatn", "era": "1965→1991", "lensWeight": {"chronology": 5, "openness": 5, "community": 2, "media": 3, "control": 1}, "title": "Nelson va gipermatn orzusi", "insight": "Nelson gipermatnni 1965-yilda o'ylab topdi, Berners-Lee uni 1991-yilda amalga oshirdi va hammaga bepul berdi — aynan shu qaror ochiq internet tabiatini belgiladi.", "thesis": "Nelson gipermatnni 1965-yilda o'ylab topdi, Berners-Lee uni 1991-yilda amalga oshirdi va hammaga bepul berdi — aynan shu qaror ochiq internet tabiatini belgiladi.", "body": "## Dunyoni o'zgartirgan so'z\n\n1965-yilda yosh amerikalik dasturchi Ted Nelson dunyoni o'zgartiradigan so'zni o'ylab topdi, garchi o'sha paytda buni hech kim bilmagan edi. Bu so'z \"gipermatn\" edi. Nelson shunchaki atama o'ylab topmadi, u bilimni tashkil qilishning butunlay yangi usulini tasvirladi.\n\nOddiy kutubxonani tasavvur qil. Minglab kitoblar javonlarda alifbo yoki mavzu tartibida turadi. Sen nisbiylik nazariyasini tushunmoqchisan, Eynshteynning kitobini olib o'qiysan. Lorens ishiga havolani uchratasan, uni katalogdan qidirgani borasan, javondan topasan, qaytasan. Keyin Puankarega havola chiqadi, yana katalogga qaytasan. Bilim mavjud, lekin u bo'laklarga kesilgan va qutilarga joylangan. G'oyalar orasidagi bog'lanishlar faqat o'quvchining boshida yashaydi.\n\nNelson kutubxonani tamoman boshqacha, aloqalarning tirik tarmog'i sifatida tasavvur qilgan. Kopernik haqidagi maqolani o'qiysan va bir harakat bilan u iqtibos keltirgan matnga o'tasan. Keyin uning nazariyasiga zamondoshlari bergan tanqidga o'tasan. So'ng uning davridagi yulduzli osmon xaritasiga o'tasan. Chiziqli tarzda, sahifama-sahifa emas, balki ma'no bo'yicha, tadqiqotchining boshida fikr qanday oqsa, o'sha fikrning o'ziga ergashib.\n\nU bu loyihani Xanadu deb atadi, Kubla-xonning afsonaviy saroyi, cheksiz go'zallik va bilim maskani sharafiga. Nelson butun hayotini Xanadu-ga bag'ishladi. Loyiha yakunlanmadi. Ammo g'oya o'lmas bo'lib chiqdi.\n\n## Boshqa odam ilib ketgan g'oya\n\nXanadu mahsulot sifatida muvaffaqiyatsizlikka uchradi, lekin konsepsiya sifatida g'alaba qozondi. 1989-yilda Jenevadagi CERN yadro markazida ishlagan britaniyalik dasturchi Tim Berners-Lee rahbariyat uchun ichki taklif yozdi. Mazmuni: barcha hujjatlar havolalar bilan bog'langan va tarmoqdagi istalgan kompyuterdan ochiq bo'lgan tizim yaratish.\n\nUning boshlig'i Mike Sendall hoshiyaga uch so'z yozdi: \"Noaniq, lekin qiziqarli.\" Bu hammasini o'zgartiradigan ixtiroga berilgan eng kamtarona taqriz edi.\n\nUch yil ichida Berners-Lee HTML, HTTP va URL-ni yozdi, zamonaviy butun web tayanadigan uch texnologiyani. Hujjatlar serverlarda saqlanadi, manzillarga ega, havolalar bilan bog'langan va brauzer orqali ochiladi. Nelsonning gipermatn haqidagi orzusi nihoyat oddiy texnik amalga oshishga ega bo'ldi.\n\nAmmo eng muhim qaror texnik emas edi. Berners-Lee Web-ni patentlab, sayyoradagi eng boy odamga aylanishi mumkin edi. Buning o'rniga u hammasini bepul, litsenziyalarsiz, shartlarsiz berdi. \"Agar Web patentlanganida, u mavjud bo'lmas edi\", deb tushuntirgan u \"Weaving the Web\" kitobida. Ochiqlik altruizm emas, strategiya edi: faqat to'siqlarsiz tarmoq global miqyosgacha o'sa olardi.\n\n> Nelson gipermatnni 1965-yilda o'ylab topdi. Berners-Lee uni 1991-yilda amalga oshirdi va hammaga bepul berdi. G'oya bilan uning ro'yobga chiqishi orasida yigirma olti yil va bitta prinsipial qaror bor edi.\n\n1993-yilda Mosaic brauzeri paydo bo'ldi, matn va rasmlarni birga ko'rsatgan birinchi brauzer. Internet vizual bo'ldi va texnik ta'limsiz ham tushunarli bo'ldi. O'sha yili saytlar soni besh yuzdan oshdi. Ikki yildan keyin ikki yuz mingga yetdi. Poyga boshlandi.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["web", "tarix", "gipermatn", "ochiq kod"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "read", "sceneIndex": 1, "type": "media", "shortTitle": "Sen oʻqiysan", "era": "1991→2004", "lensWeight": {"chronology": 5, "openness": 3, "community": 2, "media": 5, "control": 2}, "title": "O'qiladigan internet: sen o'qiysan, ular nashr qiladi", "insight": "Web1 algoritmik vositachilarsiz iste'mol demokratiyasi edi — bu uning eng katta fazilati, biz uni faqat yo'qotganimizdan keyin angladik.", "thesis": "Web1 algoritmik vositachilarsiz iste'mol demokratiyasi edi — bu uning eng katta fazilati, biz uni faqat yo'qotganimizdan keyin angladik.", "body": "## Web1 nima va nega buni tushunish muhim\n\nWeb1 — taxminan 1991-yildan 2004-yilgacha bo'lgan internet. Uni bir ibora bilan tasvirlasak: sen o'qiysan, ular nashr qiladi.\n\nSaytlar statik sahifalar edi. Kompaniya, universitet, tahririyat yoki entuziast kontent yaratib, uni tarmoqqa joylashtirardi. Qolganlarning hammasi kelib o'qirdi. Izohlar yo'q. Layklar yo'q. Javob berish yoki o'zingnikini qo'shish imkoniyati yo'q. Internet sekin va notekis yangilanadigan ulkan kutubxona edi.\n\nBir qarashda bu cheklovdek eshitiladi. Ammo bu modelning biz yo'qotgan va endi sog'inayotgan o'z go'zalligi bor edi: sen bilan axborot o'rtasida hech qanday vositachi yo'q edi. Senga nimani ko'rsatishni hal qiladigan algoritm yo'q edi. Sen manzilni kiritarding va sahifani olarding. Aynan o'zing xohlagan sahifani. Sahifaning \"shaxsiylashtirilgan versiyasi\"ni emas. \"Avval ko'rgan narsangga o'xshash kontent\"ni emas. Shunchaki sahifani.\n\nQidiruv boshqacha ko'rinardi. Ilk Yahoo, saytlarning birinchi ommabop kataloglaridan biri, tirik odamlar tomonidan qo'lda tuzilardi. Muharrirlar saytlarni ko'rib chiqib, ularni toifalarga ajratardi. Bu sekin, nomukammal, insoniy jarayon edi. Ammo unda yashirin motivlar yo'q edi. Hech bir algoritm seni saytda kerak bo'lganidan uzoqroq ushlab turishga urinmasdi. E'tiborni monetizatsiya qilish yo'q edi. Target reklamasi yo'q edi.\n\n## Axborot oqimlari shaffof edi\n\nWeb1-ning bu xususiyatini undan keyin kelgan narsa bilan solishtirmaguncha past baholash oson. Axborot oqimlari sodda va ko'rinadigan edi. Sen axborot qayerdan kelayotganini bilarding. Manbani baholay olarding. Nimani o'qish va qancha vaqt sarflashni o'zing hal qilarding.\n\nJ. C. R. Licklider 1960-yildayoq \"Galactic Network\" haqida orzu qilgan edi: dunyoning istalgan nuqtasidagi odamlar ma'lumotlar va dasturlarga kira oladigan global tarmoq. Uning tasavvurida kompyuter va inson simbioz hosil qiladi: mashina axborotni odatiy qayta ishlashni o'z zimmasiga oladi, inson esa ijodiy fikrlashni. Birgalikda ular hech biri yakka holda qila olmaydigan ishga qodir bo'ladi.\n\nWeb1 bu orzuni eng sodda shaklda amalga oshirdi. Kompyuter bilimga kirish sifatida. Inson esa bu bilim bilan nima qilishni hal qiladigan tomon sifatida. Ularning orasida hech qanday vositachi yo'q.\n\nDavid Weinberger 2002-yilda \"Small Pieces Loosely Joined\" kitobida buning falsafiy o'lchamini tasvirladi. Jismoniy dunyoda makon — cheklov: hujjat faqat bitta joyda yotishi mumkin, kitob faqat bitta bo'limga tegishli bo'ladi. Web-da hujjat bir vaqtning o'zida minglab boshqa hujjatlar bilan bog'lanishi mumkin. Bitta sahifa cheksiz ko'p kontekstlarda mavjud bo'ladi. Bu \"giperhavolali tafakkur\" — ilgari devorlar bo'lgan joyda bog'lanishlarni ko'ra olish qobiliyati.\n\n> Web1 iste'mol demokratiyasi edi: har kim istalgan narsani o'qishi mumkin edi. Ammo u ishlab chiqarish demokratiyasi emas edi: faqat texnik bilimga ega bo'lganlar nashr qila olardi.\n\nAynan shu cheklov keyingi qadamga sabab bo'ldi. Millionlab odamlar o'qirdi va gapirishni xohlardi. O'zinikini qo'shishni xohlardi. Javob berishni. Yaratishni. Texnologiyalar nihoyat buni oddiy qilganida, internet abadiy o'zgardi.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["web", "tarix", "axborot", "media"], "x": 759.8, "y": 295.0, "angDeg": -30.0}, {"id": "ethic", "sceneIndex": 2, "type": "technology", "shortTitle": "Xakerlik etikasi", "era": "1984→", "lensWeight": {"chronology": 3, "openness": 5, "community": 4, "media": 1, "control": 2}, "title": "Xakerlik etikasi: ochiqlik fazilat sifatida", "insight": "Xakerlik etikasi — ochiqlik, markazsizlashuv, bilim erkinligi — ochiq internetni yaratdi. Keyin aynan shu ochiqlik platformalarga uni yopishga imkon berdi.", "thesis": "Xakerlik etikasi — ochiqlik, markazsizlashuv, bilim erkinligi — ochiq internetni yaratdi. Keyin aynan shu ochiqlik platformalarga uni yopishga imkon berdi.", "body": "## Internetni bepul qurgan odamlar\n\nWeb1 ruhini tushunish uchun uni yaratgan odamlarni tushunish kerak. Ular biznes-model izlayotgan tadbirkorlar emas edi. Ular xakerlar edi, so'zning asl ma'nosida, jinoiy ma'nosida emas. Tizimlar qanday ishlashini tushunish, ularni yaxshilash va natija bilan bo'lishish uchun ularni qismlarga ajratadigan odamlar.\n\nSteven Levy \"Hackers: Heroes of the Computer Revolution\" kitobida 1960–70-yillarda MIT va Stanfordda shakllangan madaniyatni tasvirlagan. Bu o'z etikasi va qadriyatlariga ega haqiqiy submadaniyat edi. Axborot erkin bo'lishi kerak, chunki bilim, jismoniy narsalardan farqli o'laroq, ko'chirilganda kamaymaydi. Markazsizlashuv markazlashuvdan yaxshiroq, chunki hamma kira oladigan narsa ustidan hech kim hokimiyatga ega bo'lmasligi kerak. Odamlarni diplomiga qarab emas, kodiga qarab bahola, chunki raqamli dunyoda sen pasport bo'yicha kimliging emas, nima yaratishing muhim.\n\nBu etika ko'p milliard dollarlik texnologik kompaniyalar davrida sodda eshitiladi. Ammo aynan u ilk internet arxitekturasini belgiladi. Aynan tarmoqning birinchi quruvchilari ochiqlikka ishongani uchun biz ochiq protokollar, bepul brauzerlar va hamma uchun ochiq web-ga ega bo'ldik.\n\n## Stallman va erkin DT harakati\n\nRichard Stallman xakerlik etikasini falsafiy chegarasigacha olib bordi. 1985-yilda u erkin dasturiy ta'minot harakatining dasturiy hujjati — \"GNU Manifesto\"ni yozdi.\n\nUning dalili oddiy edi: dastur kodi — bu bilim. Bilim hech kimning mulki bo'la olmaydi, chunki uni ko'chirish asl nusxadan hech narsani olib qo'ymaydi. Agar sen men bilan g'oyani bo'lishsang, u senda yo'qolib qolmaydi. Endi u ikkalamizda ham bor. Demak, kodga mualliflik huquqi orqali bilim tarqalishini cheklash — axborot tabiatiga zid sun'iy va adolatsiz harakat.\n\nStallman shunchaki manifest yozmadi, u muqobilni qura boshladi. GNU — to'liq erkin dasturiy ta'minotdan tuzilgan operatsion tizim. 1991-yilda fin talabasi Linus Torvalds unga Linux yadrosini qo'shdi va bugun dunyodagi serverlarning ko'pchiligi, Android-dagi barcha smartfonlar va superkompyuterlar ishlatadigan operatsion tizim paydo bo'ldi.\n\nXuddi shu falsafiyadan Apache (ilk internetning katta qismi ishlagan server DT), Mozilla Firefox, Wikipedia o'sib chiqdi. Bularning barchasi bo'lishish egalik qilishdan muhimroq bo'lgan madaniyat mahsulotlari. Yaratish va berish zaiflik emas, prinsip bo'lgan madaniyat mahsulotlari.\n\nBugun \"open source\" deb ataladigan narsa shunchaki ishlab chiqish modeli emas. Bu 1960-yillar xakerlik etikasining ideologik merosi bo'lib, u hanuz dunyo texnologik infratuzilmasining katta qismini belgilaydi.\n\n> Xakerlik etikasi internetni ochiq qildi, chunki bu foydaliroq bo'lgani uchun emas, to'g'ri bo'lgani uchun. Bular turli motivatsiyalar va ular turli natijalar yaratadi.\n\nParadoks shundaki, aynan shu ochiqlik keyin internetni yopgan kompaniyalar paydo bo'lishiga imkon berdi. Google Web-ning ochiq protokollariga tayanadi. Facebook ochiq internetga tayanadi. Ular ochiq infratuzilmadan foydalandi va uning ustiga yopiq platformalar qurdi. Xakerlik etikasi keyin boshqa qoidalar bilan o'ynagan dunyoni yaratdi.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["ochiq kod", "tarix", "web", "hamjamiyat"], "x": 759.8, "y": 595.0, "angDeg": 30.0}, {"id": "community", "sceneIndex": 3, "type": "privacy", "shortTitle": "Hamjamiyatlar", "era": "1993", "lensWeight": {"chronology": 4, "openness": 3, "community": 5, "media": 2, "control": 1}, "title": "Ilk hamjamiyatlar: onlaynda doʻstlashish mumkinmi?", "insight": "Rheingold isbotladi: onlayn hamjamiyatlar haqiqiy. Ammo ular moʻrt — kichik miqyosda ishlaydi va umumiy meʼyorlarsiz oʻsganda yemiriladi.", "thesis": "Rheingold isbotladi: onlayn hamjamiyatlar haqiqiy. Ammo ular moʻrt — kichik miqyosda ishlaydi va umumiy meʼyorlarsiz oʻsganda yemiriladi.", "body": "## Gʻalati tuyulgan savol\n\n1993 yilda jurnalist va tadqiqotchi Howard Rheingold *The Virtual Community* kitobini eʼlon qildi — bu odamlar tarmoqda muloqot qila boshlaganda ular bilan nima yuz berishini oʻrgangan birinchi jiddiy tadqiqot edi. U qoʻygan savol oʻsha paytda gʻalati tuyulardi: internetda haqiqiy insoniy hamjamiyat paydo boʻlishi mumkinmi?\n\nBugun bu ayon koʻrinadi — albatta mumkin, hammamiz shu muhitda yashayapmiz. Ammo 1993 yilda bu umuman ayon emas edi. Jamiyat jonli muloqotning oʻrnini hech narsa bosa olmaydi, tarmoq — surrogat, jismoniy hozirliksiz haqiqiy munosabat boʻlmaydi, deb ishonardi.\n\nRheingold WELL — Whole Earth 'Lectronic Link tizimini oʻrgandi, bu brauzerdan ham oldin mavjud boʻlgan ilk onlayn tarmoqlardan biri edi. Ishtirokchilar matnli terminallar orqali muloqot qilardi: matn terasan, Enter bosasan, javob kutasan. Hech qanday surat, hech qanday video, hech qanday emoji yoʻq. Qora ekrandagi soʻzlargina bor.\n\nShunga qaramay, Rheingold hayratlanarli narsani koʻrdi: WELL ishtirokchilari ogʻir paytlarda — kasallik, yoʻqotish, inqirozlarda — bir-birini qoʻllab-quvvatlardi. Hech qachon koʻrmagan notanish odamlar bilan bilim ulashardi. Yillar davom etgan oʻzaro aloqalar orqali obroʻ va ishonch qurardi. Tarmoq yaqinlikning yangi turini yaratdi — geografiyasiz, jismoniy makonsiz.\n\n## Moʻrtlik va miqyos\n\nRheingoldning javobi ehtiyotkorona optimistik edi: ha, tarmoqda haqiqiy hamjamiyatlar boʻlishi mumkin. Ammo u bu hamjamiyatlarning tabiati haqida muhim narsani ham payqadi — ular moʻrt.\n\nWELL hamjamiyati ishtirokchilar kam boʻlganida ishlardi — bir-birini hech boʻlmasa nik orqali taniydigan bir necha ming kishi. Umumiy xulq meʼyorlari, yozilmagan qoidalar, mansublik hissi bor edi. Hamjamiyat oʻsgan sari oʻzaro aloqaning sifati oʻzgardi. Notanishlar haddan tashqari koʻpayganda ishonch muhiti yemirildi.\n\nBu kuzatuv ikki oʻn yil oʻtib keskinlashgan muammoni oldindan koʻrsatdi: hamjamiyat sifatini saqlagan holda uni qanday miqyoslash mumkin? Ikki milliard foydalanuvchisi bor Facebook qanday qilib “hamjamiyat” boʻla oladi, agar ishtirokchilarning aksariyati hech qachon uchrashmasa va ularda umumiy meʼyorlar boʻlmasa?\n\nKevin Kelly *Out of Control* (1994) kitobida internetni tirik tizim sifatida tasvirladi — markazlashmagan, markaziy boshqaruvsiz, millionlab ishtirokchilarning oʻzaro taʼsiridan evolyutsiyalanadigan tizim. Bu yaxshi xabar kabi eshitilardi. Ammo Kelly oʻz mantiqining bitta oqibatini oʻtkazib yubordi: tirik tizimlar adolat yoki insoniy iliqlik tomonga emas, eng moslashganlarning omon qolishi tomonga evolyutsiyalanadi.\n\nInternetga ulkan resurslarga ega kompaniyalar kirib kelganda, aynan ular “eng moslashganlar” boʻlib chiqdi. Va tizim ular tomonga evolyutsiyalana boshladi.\n\n> Rheingold isbotladi: tarmoqda haqiqiy hamjamiyatlar boʻlishi mumkin. Ammo u ularning moʻrtligini ham koʻrsatdi: hamjamiyat kichik boʻlsa va umumiy meʼyorlarga ega boʻlsa ishlaydi.\n\nBu kuzatuv hanuz dolzarb. Eng yaxshi onlayn hamjamiyatlar — kichik, aniq identitet va qoidalarga ega hamjamiyatlar. Katta platformalar hamjamiyatlarni auditoriyaga aylantirib, ularni oʻldiradi. Aynan shuning uchun Web3 tokenlar va DAOga tayanadi — ular miqyosda meʼyorlarni saqlash uchun formal mexanizmlar yaratadigan vositalardir.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["hamjamiyat", "ijtimoiy graf", "web", "tarix"], "x": 500.0, "y": 745.0, "angDeg": 90.0}, {"id": "verdict", "sceneIndex": 4, "type": "power", "shortTitle": "Web1 yakuni", "era": "≈2000", "lensWeight": {"chronology": 4, "openness": 4, "community": 3, "media": 4, "control": 3}, "title": "Web1 nimani bajardi — va qayerda qoqildi", "insight": "Web1 axborot isteʼmolini demokratlashtirdi, ammo uni ishlab chiqarishni emas — va shu ziddiyat hamma uchun platformalari bilan Web2ni tugʻdirdi.", "thesis": "Web1 axborot isteʼmolini demokratlashtirdi, ammo uni ishlab chiqarishni emas — va shu ziddiyat hamma uchun platformalari bilan Web2ni tugʻdirdi.", "body": "## Unutish oson boʻlgan haqiqiy yutuqlar\n\n1990-yillar oxiriga kelib Web1 yigirma yil avval imkonsiz tuyulgan bir nechta ishni amalga oshirdi. Buni unutish oson, chunki bugun bularning barchasi oʻz-oʻzidan ravshan koʻrinadi. Ammo toʻxtab, miqyosni baholashga arziydi.\n\nVeb axborotga kirishni misli koʻrilmagan miqyosda demokratlashtirdi. Agar senda kompyuter va ulanish boʻlsa, Harvard universiteti kutubxonasidagi maqolani oʻqiy olasan. Ilgari faqat shifokorlar bilgan tibbiy maʼlumotni topa olasan. Dunyoning istalgan mamlakatidan yangiliklarni real vaqtda oʻqiy olasan. Deyarli istalgan narsani taʼmirlash boʻyicha yoʻriqnoma olasan. Buning uchun pul, aloqalar yoki maxsus taʼlim kerak emas — faqat internetga kirish yetarli.\n\nVeb bilim geografiyasini yoʻq qildi. Kiyevdagi olim Kembrijdagi olim oʻqiyotgan oʻsha ilmiy preprintni bir vaqtning oʻzida — eʼlondan bir necha daqiqa oʻtib oʻqiydi. Internetgacha bu jismonan imkonsiz edi: preprintni bosib chiqarish, pochta orqali yuborish, haftalab kutish kerak boʻlardi. Bu ilm-fan, taʼlim va jurnalistikani tezlashtirdi.\n\nVeb ilgari mavjud boʻla olmaydigan yangi hamjamiyatlarni yaratdi. Kamyob qiziqishlarga ega odamlar bir-birini topdi: turli mamlakatlardagi kam tanilgan musiqa janri muxlislari. Bir shaharda oʻn kishi boʻlishi mumkin boʻlgan kamyob kasalliklarga chalingan bemorlar. Sayyoraning narigi chetidagi notanish odamga bepul yordam berishga tayyor muayyan til dasturchilari. Ilgari ular jamiyat uchun ham, bir-biri uchun ham koʻrinmas edi. Veb ularni hamjamiyatga aylantirdi.\n\n## Web1 qayerda qoqildi\n\nAmmo Web1da keyin yuz bergan hamma narsani belgilab bergan fundamental cheklov bor edi. Oʻqish har kimning qoʻlidan kelardi. Nashr qilish esa — yoʻq.\n\n1996 yilda sayt yaratish uchun HTMLni bilish, hosting va FTPni tushunish, domen nomlarini anglash kerak edi. Dasturchi uchun bu kichik toʻsiq edi. Maktab oʻqituvchisi, uy bekasi yoki pensioner uchun esa — yengib boʻlmas toʻsiq. Internet isteʼmol demokratiyasi edi, ammo ishlab chiqarish demokratiyasi emas edi. Millionlar oʻqirdi. Minglar yozardi.\n\nBu yashirin ziddiyat yaratdi. Web1 darvozabonlarsiz, gorizontal va ochiq internetni vaʼda qilgan edi. Ammo amalda darvozabonlar yoʻqolmadi — ular shunchaki kasbini oʻzgartirdi. Gazeta muharrirlari oʻrniga veb-dasturchilar keldi. Televizion prodyuserlar oʻrniga server egalari keldi. Ovoz hamon texnik bilimga ega boʻlganlarga tegishli edi.\n\nEli Pariser biroz keyinroq namoyon boʻlgan yana bir muammoni qayd etdi. Qidiruv algoritmlari soʻrovlar tarixini hisobga ola boshlashi bilan axborot makoni umumiy boʻlmay qoldi. Har kim internetning oʻz versiyasini koʻra boshladi. Pariser buni “filter bubble” deb atadi. Web1 shunday vaʼda bergan edi: hamma barcha axborotga kirish imkoniga ega. Amalda esa: qaysi axborot “seniki” ekanini algoritm hal qiladi.\n\n> Web1 nihoyatda katta yutuq edi. Ammo u asosiy savolni yechimsiz qoldirdi: ovozni faqat texnik bilimga ega boʻlganlarga emas, hammaga qanday berish mumkin?\n\nBu savolga javob Web2 koʻrinishida keldi — texnik toʻsiqni olib tashlagan va har kimga ovoz bergan platformalar sifatida. Ammo bu javobning foydalanuvchi kelishuvida hech kim oʻqimagan yashirin narxi bor edi.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["web", "tarix", "axborot", "media"], "x": 240.2, "y": 595.0, "angDeg": 150.0}, {"id": "filter", "sceneIndex": 5, "type": "power", "shortTitle": "Filtr pufagi", "era": "2000-yillar boshi", "lensWeight": {"chronology": 5, "openness": 1, "community": 1, "media": 4, "control": 5}, "title": "Filter bubble: algoritm sening oʻrningga qaror qilganda", "insight": "Filter bubble Facebookdan boshlanmagan — u ilk shaxsiylashtirilgan qidiruv algoritmlaridan boshlangan. Shaxsiylashtirish qulayligi umumiy axborot makonini buzadi.", "thesis": "Filter bubble Facebookdan boshlanmagan — u ilk shaxsiylashtirilgan qidiruv algoritmlaridan boshlangan. Shaxsiylashtirish qulayligi umumiy axborot makonini buzadi.", "body": "## Koʻrinmas vositachi\n\n2000-yillar boshida paydo boʻlgan paytda deyarli hech kim sezmagan bir narsa yuz berdi. Google natijalarni shakllantirishda qidiruv tarixini hisobga ola boshladi. Agar sen muayyan siyosiy yoʻnalishdagi yangiliklarni tez-tez qidirsang, Google senga shunday yangiliklarni koʻproq koʻrsata boshlaydi. Agar muayyan turdagi kontentga bossang, algoritm buni eslab qoladi va natijalarni moslaydi.\n\nBu qulay eshitiladi. Qisqa muddatda esa — haqiqatan ham qulayroq. Sen algoritm fikricha senga yoqadigan narsani olasan. Keraksiz narsa kamroq, qiziqarli narsa koʻproq.\n\nAmmo Eli Pariser oʻzining *The Filter Bubble* tadqiqotida bu qulaylikning yashirin narxini qayd etdi. U oddiy tajriba oʻtkazdi: bir nechta doʻstidan bir vaqtda “Egypt” soʻzini Google orqali qidirishni soʻradi — bu 2011 yilda Arab bahori avjiga chiqqan payt edi. Natijalar keskin farq qildi. Biri inqilob va noroziliklar haqidagi yangiliklarni oldi. Boshqasi — sayohat maslahatlari va diqqatga sazovor joylarni. Uchinchisi — mamlakat iqtisodiyoti haqidagi biznes yangiliklarini.\n\nBitta soʻz. Bitta vaqt. Butunlay boshqa reallik.\n\n## Pufak ichida nima yoʻqoladi\n\nBu shunchaki noqulaylik emas. Bu “umumiy axborot makoni” degan tushunchaning tubdan oʻzgarishi.\n\nDemokratiya fuqarolarda hech boʻlmasa bazaviy umumiy faktlar toʻplami borligini nazarda tutadi. Ular qadriyatlar va ustuvorliklarda kelishmasligi mumkin — ammo reallik borasida kelishishi kerak. Falon va falon narsa yuz berdi. Falon muammo mavjud. Mana bu raqam — fakt.\n\nFilter bubble shu umumiy makonni buzadi. Algoritm har bir kishiga eng koʻp jalb qilish keltiradigan narsani koʻrsatadi — yaʼni mavjud eʼtiqodlarni tasdiqlaydigan va mavjud hissiyotlarni kuchaytiradigan narsani. Natijada bir shaharda yashaydigan odamlar reallik haqida prinsipial jihatdan turli manzaralarga ega boʻlishi mumkin. Ular ahmoq yoki yomon niyatli boʻlgani uchun emas — algoritm ularga tom maʼnoda turli dunyolarni koʻrsatgani uchun.\n\nMuhim jihatni tushunish kerak: bu Web1 davridayoq, ilk shaxsiylashtirilgan qidiruv natijalari bilan boshlangan. Ijtimoiy tarmoqlar bu mexanizmni shunchaki oxirgi chegarasigacha olib bordi.\n\nWeb1 shunday vaʼda bergan edi: hamma barcha axborotga teng kirish imkoniga ega. Bu rost edi — texnik jihatdan. Ammo qaysi axborot “seniki” ekanini algoritm hal qilardi. Va bu texnik teng kirishdan muhimroq boʻlib chiqdi.\n\n> Web1 umumiy axborot makonini yaratdi. Ilk shaxsiylashtirish algoritmlari uni buzishni boshladi — ijtimoiy tarmoqlar paydo boʻlishidan oldinroq.\n\nPariser bu haqda 2011 yilda — allaqachon Web2 davrida yozgan. Ammo muammoning ildizlari Web1ga borib taqaladi. Algoritmda “senga yoqadigan narsani koʻrsatish” maqsadi paydo boʻlishi bilan u muqarrar ravishda sening axborot makoningni toraytira boshlaydi. Avval sezilmasdan. Keyin esa — prinsipial ravishda. Bu bug emas, bu shaxsiylashtirish gʻoyasining oʻzidan kelib chiqadigan arxitektura oqibati.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google. ", "media"]}, {"from": "nelson", "to": "ethic", "label": "gʼoyaga odamlar kerak edi", "lenses": ["openness"]}, {"from": "ethic", "to": "read", "label": "ochiqlik webni ochiq qildi", "lenses": ["openness", "media"]}, {"from": "ethic", "to": "community", "label": "etika ilk hamjamiyatlarni jamladi", "lenses": ["openness", "community"]}, {"from": "read", "to": "community", "label": "oʼquvchilar ovozga ega boʼldi", "lenses": ["community", "media"]}, {"from": "read", "to": "verdict", "label": "isteʼmol demokratlashdi", "lenses": ["media", "chronology"]}, {"from": "community", "to": "verdict", "label": "aloqalar moʼrt boʼlib chiqdi", "lenses": ["community"]}, {"from": "verdict", "to": "filter", "label": "ishlab chiqarish yoʼq — vositachi kerak", "lenses": ["chronology", "control", "media"]}, {"from": "ethic", "to": "filter", "label": "ochiqlik uni yopishga imkon berdi", "lenses": ["control", "openness"]}, {"from": "nelson", "to": "filter", "label": "erkin havoladan reytinglashga", "lenses": ["control"]}]}, "es": {"chapter": {"key": "web1", "title": "El internet lector", "lede": "Cómo la apertura creó internet y cómo esa misma apertura permitió cerrarlo.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=web1", "centralIdea": "La apertura creó internet y permitió cerrarlo", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Cronología", "accent": "#7dd3fc", "description": "1965 → 2004: de la palabra “hipertexto” de Nelson a las primeras burbujas de filtro."}, {"id": "openness", "label": "Apertura", "accent": "#34d399", "description": "Hipertexto entregado gratis, ética hacker y libertad del conocimiento como base de la Web."}, {"id": "community", "label": "Comunidad", "accent": "#c084fc", "description": "Las primeras comunidades virtuales: si se puede ser amigo en línea y por qué es frágil."}, {"id": "media", "label": "Medios", "accent": "#fbbf24", "description": "“Tú lees, ellos publican”: democracia del consumo sin derecho a producir."}, {"id": "control", "label": "Control", "accent": "#f87171", "description": "Dónde nace el intermediario invisible: el algoritmo que decide por ti."}], "nodes": [{"id": "nelson", "sceneIndex": 0, "type": "technology", "shortTitle": "Hipertexto", "era": "1965→1991", "lensWeight": {"chronology": 5, "openness": 5, "community": 2, "media": 3, "control": 1}, "title": "Nelson y el sueño del hipertexto", "insight": "Nelson inventó el hipertexto en 1965, Berners-Lee lo implementó en 1991 y lo entregó gratis a todos: esa decisión definió la naturaleza del internet abierto.", "thesis": "Nelson inventó el hipertexto en 1965, Berners-Lee lo implementó en 1991 y lo entregó gratis a todos: esa decisión definió la naturaleza del internet abierto.", "body": "## La palabra que cambió el mundo\n\nEn 1965, un joven programador estadounidense llamado Ted Nelson acuñó una palabra que cambiaría el mundo, aunque en ese momento nadie lo sabía. La palabra era \"hipertexto\". Nelson no se limitó a inventar un término: describió una forma completamente nueva de organizar el conocimiento.\n\nImagina una biblioteca común. Miles de libros están en estanterías en orden alfabético o temático. Quieres entender la teoría de la relatividad, así que tomas el libro de Einstein y lees. Encuentras una referencia al trabajo de Lorentz, así que vas a buscarlo en el catálogo, lo encuentras en la estantería y regresas. Luego aparece una referencia a Poincaré, y otra vez al catálogo. El conocimiento existe, pero está dividido en fragmentos y repartido en cajas. Los vínculos entre ideas viven solo en la cabeza del lector.\n\nNelson imaginó una biblioteca organizada de una forma radicalmente distinta: como una red viva de conexiones. Lees un artículo sobre Copérnico y, con un solo movimiento, pasas al texto que él citó. Luego a la crítica de su teoría por parte de sus contemporáneos. Luego a un mapa del cielo estrellado de su época. No de forma lineal, página tras página, sino por significado, siguiendo el propio pensamiento mientras fluye por la mente de un investigador.\n\nLlamó a este proyecto Xanadu, en honor al mítico palacio de Kubla Khan, un lugar de belleza y conocimiento infinitos. Nelson dedicó toda su vida a Xanadu. El proyecto nunca se terminó. Pero la idea resultó inmortal.\n\n## La idea que retomó otra persona\n\nXanadu fracasó como producto, pero triunfó como concepto. En 1989, el programador británico Tim Berners-Lee, que trabajaba en el centro de investigación nuclear CERN en Ginebra, escribió una propuesta interna para la dirección. La idea era crear un sistema en el que todos los documentos estuvieran vinculados mediante enlaces y fueran accesibles desde cualquier computadora de la red.\n\nSu jefe, Mike Sendall, escribió tres palabras en el margen: \"Vago, pero interesante\". Fue la reseña más modesta para una invención que lo cambiaría todo.\n\nEn tres años, Berners-Lee escribió HTML, HTTP y URL, las tres tecnologías sobre las que se sostiene toda la Web moderna. Los documentos se almacenan en servidores, tienen direcciones, están conectados por enlaces y se abren mediante un navegador. El sueño de Nelson sobre el hipertexto por fin obtuvo una implementación técnica sencilla.\n\nPero la decisión más importante no fue técnica. Berners-Lee pudo haber patentado la Web y convertirse en la persona más rica del planeta. En cambio, lo entregó todo gratis, sin licencias y sin condiciones. \"Si la Web hubiera sido patentada, no habría existido\", explicó en el libro \"Weaving the Web\". La apertura fue una estrategia, no altruismo: solo sin barreras la red podía crecer hasta una escala global.\n\n> Nelson inventó el hipertexto en 1965. Berners-Lee lo implementó en 1991 y lo entregó gratis a todos. Entre la idea y su realización pasaron veintiséis años, y una decisión de principio.\n\nEn 1993 apareció el navegador Mosaic, el primero que mostraba texto e imágenes juntos. Internet se volvió visual y comprensible sin educación técnica. Ese mismo año, la cantidad de sitios superó los quinientos. Dos años después, eran doscientos mil. La carrera había comenzado.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["web", "historia", "hipertexto", "código abierto"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "read", "sceneIndex": 1, "type": "media", "shortTitle": "Tú lees", "era": "1991→2004", "lensWeight": {"chronology": 5, "openness": 3, "community": 2, "media": 5, "control": 2}, "title": "El internet lector: tú lees, ellos publican", "insight": "Web1 era una democracia del consumo sin intermediarios algorítmicos, y esa es su mayor virtud, la que entendimos solo después de perderla.", "thesis": "Web1 era una democracia del consumo sin intermediarios algorítmicos, y esa es su mayor virtud, la que entendimos solo después de perderla.", "body": "## Qué es Web1 y por qué importa entenderlo\n\nWeb1 es internet aproximadamente entre 1991 y 2004. Si lo describes en una sola frase: tú lees, ellos publican.\n\nLos sitios eran páginas estáticas. Una empresa, universidad, redacción o entusiasta creaba contenido y lo colocaba en la red. Todos los demás llegaban y lo leían. Sin comentarios. Sin likes. Sin posibilidad de responder o añadir lo propio. Internet era una enorme biblioteca que se actualizaba despacio y de manera irregular.\n\nA primera vista, eso suena a una limitación. Pero este modelo tenía su propia belleza, una que perdimos y ahora extrañamos: no había intermediario entre tú y la información. Ningún algoritmo decidía qué mostrarte. Escribías una dirección y obtenías una página. La exacta que querías. No una \"versión personalizada\" de la página. No \"contenido parecido a lo que viste antes\". Simplemente la página.\n\nLa búsqueda también se veía distinta. El primer Yahoo, uno de los primeros directorios de sitios populares, se compilaba a mano por personas reales. Los editores revisaban los sitios y los distribuían por categorías. Era un proceso lento, imperfecto y humano. Pero no tenía motivos ocultos. Ningún algoritmo intentaba mantenerte en el sitio más tiempo del necesario. No había monetización de la atención. No había publicidad segmentada.\n\n## Los flujos de información eran transparentes\n\nEsta característica de Web1 es fácil de subestimar hasta que la comparas con lo que vino después. Los flujos de información eran simples y visibles. Sabías de dónde venía la información. Podías evaluar la fuente. Decidías por tu cuenta qué leer y cuánto tiempo dedicar.\n\nJ. C. R. Licklider ya soñaba en 1960 con la \"Galactic Network\": una red global donde personas de cualquier parte del mundo pudieran acceder a datos y programas. En su visión, la computadora y el ser humano forman una simbiosis: la máquina asume el procesamiento rutinario de la información, el humano, el pensamiento creativo. Juntos son capaces de lo que ninguno puede hacer por separado.\n\nWeb1 hizo realidad ese sueño en su forma más simple. La computadora como acceso al conocimiento. El ser humano como quien decide qué hacer con ese conocimiento. Sin intermediarios entre ambos.\n\nEn 2002, David Weinberger describió la dimensión filosófica de esto en el libro \"Small Pieces Loosely Joined\". En el mundo físico, el espacio es una limitación: un documento puede estar solo en un lugar, un libro pertenece solo a una sección. En la Web, un documento puede estar conectado al mismo tiempo con mil otros documentos. Una sola página existe en un número infinito de contextos. Esto es el \"pensamiento hipertextual\": la capacidad de ver conexiones donde antes había muros.\n\n> Web1 era una democracia del consumo: cualquiera podía leer lo que quisiera. Pero no era una democracia de producción: solo podían publicar quienes tenían conocimientos técnicos.\n\nEsa limitación se convirtió en la razón del siguiente paso. Millones de personas leían y querían hablar. Querían añadir lo suyo. Responder. Crear. Y cuando la tecnología por fin hizo eso fácil, internet cambió para siempre.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["web", "historia", "información", "medios"], "x": 759.8, "y": 295.0, "angDeg": -30.0}, {"id": "ethic", "sceneIndex": 2, "type": "technology", "shortTitle": "Ética hacker", "era": "1984→", "lensWeight": {"chronology": 3, "openness": 5, "community": 4, "media": 1, "control": 2}, "title": "La ética hacker: la apertura como virtud", "insight": "La ética hacker, basada en la apertura, la descentralización y la libertad del conocimiento, creó un internet abierto. Esa misma apertura luego permitió que las plataformas lo cerraran.", "thesis": "La ética hacker, basada en la apertura, la descentralización y la libertad del conocimiento, creó un internet abierto. Esa misma apertura luego permitió que las plataformas lo cerraran.", "body": "## Las personas que construyeron Internet gratis\n\nPara entender el espíritu de Web1, hay que entender a las personas que lo crearon. No eran emprendedores en busca de un modelo de negocio. Eran hackers, en el sentido original de la palabra, no en el criminal. Personas que desarmaban sistemas para entender cómo funcionan, mejorarlos y compartir el resultado.\n\nEn el libro \"Hackers: Heroes of the Computer Revolution\", Steven Levy describió la cultura que se formó en MIT y Stanford en los años 1960 y 1970. Era una subcultura real, con su propia ética y sus propios valores. La información debe ser libre, porque el conocimiento, a diferencia de las cosas materiales, no disminuye cuando se copia. La descentralización es mejor que la centralización, porque nadie debería tener poder sobre aquello a lo que todos tienen acceso. Juzga a las personas por su código, no por sus diplomas, porque en el mundo digital importa lo que creas, no quién eres en los papeles.\n\nEsta ética suena ingenua en la era de las empresas tecnológicas multimillonarias. Pero fue precisamente esa ética la que definió la arquitectura del internet temprano. Precisamente porque los primeros constructores de la red creían en la apertura, obtuvimos protocolos abiertos, navegadores gratis y una web accesible para todos.\n\n## Stallman y el movimiento del software libre\n\nRichard Stallman llevó la ética hacker hasta su límite filosófico. En 1985 escribió el \"GNU Manifesto\", el documento programático del movimiento del software libre.\n\nSu argumento era simple: el código de programa es conocimiento. El conocimiento no puede ser propiedad de nadie, porque copiarlo no le quita nada al original. Si compartes una idea conmigo, no desaparece de ti. Ahora la tenemos los dos. Entonces, limitar la difusión del conocimiento mediante derechos de autor sobre el código es un acto artificial e injusto que contradice la naturaleza de la información.\n\nStallman no solo escribió un manifiesto: empezó a construir una alternativa. GNU es un sistema operativo compuesto por completo de software libre. En 1991, el estudiante finlandés Linus Torvalds le añadió el núcleo Linux, y así surgió el sistema operativo que hoy usan la mayoría de los servidores del mundo, todos los teléfonos Android y las supercomputadoras.\n\nDe esa misma filosofía surgieron Apache, el software de servidor que impulsó gran parte del internet temprano, Mozilla Firefox y Wikipedia. Todo eso son productos de una cultura en la que compartir importa más que poseer. Donde crear y entregar no es debilidad, sino principio.\n\nLo que hoy se llama \"open source\" no es simplemente un modelo de desarrollo. Es la herencia ideológica de la ética hacker de los años 60, que todavía define una parte significativa de la infraestructura tecnológica del mundo.\n\n> La ética hacker hizo que Internet fuera abierta no porque fuera más rentable, sino porque era lo correcto. Son motivaciones distintas, y producen resultados distintos.\n\nLa paradoja es que esa misma apertura hizo posible que aparecieran empresas que luego cerraron Internet. Google se apoya en los protocolos abiertos de la Web. Facebook se apoya en el internet abierto. Usaron una infraestructura abierta y construyeron sobre ella plataformas cerradas. La ética hacker creó un mundo que luego empezó a jugar con otras reglas.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["código abierto", "historia", "web", "comunidad"], "x": 759.8, "y": 595.0, "angDeg": 30.0}, {"id": "community", "sceneIndex": 3, "type": "privacy", "shortTitle": "Comunidades", "era": "1993", "lensWeight": {"chronology": 4, "openness": 3, "community": 5, "media": 2, "control": 1}, "title": "Primeras comunidades: ¿se puede ser amigo en línea?", "insight": "Rheingold demostró que las comunidades en línea son reales. Pero son frágiles: funcionan a pequeña escala y se desmoronan cuando crecen sin normas compartidas.", "thesis": "Rheingold demostró que las comunidades en línea son reales. Pero son frágiles: funcionan a pequeña escala y se desmoronan cuando crecen sin normas compartidas.", "body": "## Una pregunta que parecía extraña\n\nEn 1993, el periodista e investigador Howard Rheingold publicó *The Virtual Community*, el primer estudio serio de lo que les ocurre a las personas cuando empiezan a comunicarse en línea. La pregunta que planteó parecía extraña en aquel momento: ¿puede surgir una comunidad humana real en internet?\n\nHoy parece obvio: claro que sí; todos vivimos dentro de ella. Pero en 1993 no lo era en absoluto. La sociedad estaba convencida de que la comunicación presencial era irremplazable, de que la red era un sustituto y de que no podían existir relaciones reales sin presencia física.\n\nRheingold estudió WELL — Whole Earth 'Lectronic Link, una de las primeras redes en línea, que existía incluso antes del navegador. Los participantes se comunicaban a través de terminales de texto: escribías texto, pulsabas Enter y esperabas una respuesta. Sin fotos, sin video, sin emoji. Solo palabras en una pantalla negra.\n\nY aun así Rheingold vio algo llamativo: los participantes de WELL se apoyaban unos a otros en momentos difíciles — enfermedades, pérdidas, crisis. Compartían conocimientos con desconocidos a quienes nunca habían visto. Construían reputación y confianza a lo largo de años de interacción. La red creó un nuevo tipo de cercanía, sin geografía y sin espacio físico.\n\n## Fragilidad y escala\n\nLa respuesta de Rheingold fue cautelosamente optimista: sí, las comunidades reales en línea son posibles. Pero también observó algo importante sobre la naturaleza de esas comunidades: son frágiles.\n\nLa comunidad de WELL funcionaba mientras había relativamente pocos participantes — unos pocos miles de personas que se conocían al menos por su apodo. Había normas compartidas de comportamiento, reglas no escritas y sentido de pertenencia. A medida que la comunidad crecía, la calidad de la interacción cambiaba. Demasiados desconocidos destruían el ambiente de confianza.\n\nEsta observación anticipó un problema que se volvió crítico dos décadas después: ¿cómo escalar una comunidad sin perder su calidad? ¿Cómo puede Facebook, con dos mil millones de usuarios, ser una “comunidad” si la mayoría de los participantes nunca se conocerá y no comparte normas comunes?\n\nEn *Out of Control* (1994), Kevin Kelly describió internet como un sistema vivo: descentralizado, sin control central y en evolución a partir de la interacción de millones de participantes. Sonaba como una buena noticia. Pero Kelly pasó por alto una consecuencia de su propia lógica: los sistemas vivos evolucionan hacia la supervivencia de los mejor adaptados, no hacia la justicia ni hacia la calidez humana.\n\nCuando las empresas con enormes recursos llegaron a internet, resultaron ser las “mejor adaptadas”. Y el sistema empezó a evolucionar en su dirección.\n\n> Rheingold demostró que las comunidades reales en línea son posibles. Pero también mostró su fragilidad: una comunidad funciona mientras es pequeña y tiene normas compartidas.\n\nEsta observación sigue siendo relevante hoy. Las mejores comunidades en línea son pequeñas, con una identidad y reglas claras. Las grandes plataformas matan las comunidades al convertirlas en audiencias. Precisamente por eso Web3 apuesta por los tokens y DAO, herramientas que crean mecanismos formales para mantener las normas a escala.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["comunidad", "grafo social", "web", "historia"], "x": 500.0, "y": 745.0, "angDeg": 90.0}, {"id": "verdict", "sceneIndex": 4, "type": "power", "shortTitle": "Balance de Web1", "era": "≈2000", "lensWeight": {"chronology": 4, "openness": 4, "community": 3, "media": 4, "control": 3}, "title": "Lo que logró Web1 y dónde tropezó", "insight": "Web1 democratizó el consumo de información, pero no su producción, y esa contradicción dio lugar a Web2 con sus plataformas para todos.", "thesis": "Web1 democratizó el consumo de información, pero no su producción, y esa contradicción dio lugar a Web2 con sus plataformas para todos.", "body": "## Logros reales que es fácil olvidar\n\nA fines de los años noventa, Web1 hizo varias cosas que veinte años antes parecían imposibles. Es fácil olvidarlo porque hoy todo eso se da por sentado. Pero vale la pena detenerse y apreciar la escala.\n\nLa web democratizó el acceso a la información a una escala sin precedentes. Si tienes una computadora y conexión, puedes leer un artículo de la biblioteca universitaria de Harvard. Encontrar información médica que antes solo conocían los médicos. Leer noticias de cualquier país del mundo en tiempo real. Obtener instrucciones para reparar casi cualquier cosa. Para eso no necesitas dinero, contactos ni educación especial: solo acceso a internet.\n\nLa web destruyó la geografía del conocimiento. Un científico en Kyiv lee el mismo preprint científico que un científico en Cambridge, al mismo tiempo, minutos después de su publicación. Antes de internet, eso era físicamente imposible: el preprint había que imprimirlo, enviarlo por correo y esperar semanas. Eso aceleró la ciencia, la educación y el periodismo.\n\nLa web creó nuevas comunidades que antes no podían existir. Personas con intereses poco comunes se encontraron entre sí: aficionados a un género musical poco conocido de distintos países. Pacientes con enfermedades raras, de los que quizá haya diez en una misma ciudad. Programadores de un lenguaje concreto, dispuestos a ayudar gratis a un desconocido al otro lado del planeta. Antes eran invisibles, para la sociedad y entre sí. La web los convirtió en comunidad.\n\n## Dónde tropezó Web1\n\nPero Web1 tenía una limitación fundamental que definió todo lo que vino después. Cualquiera podía leer. Publicar era otra cosa.\n\nPara crear un sitio web en 1996, había que saber HTML, entender hosting y FTP, y comprender los nombres de dominio. Para un programador, era una barrera pequeña. Para una maestra, una ama de casa o una jubilada, era insalvable. Internet era una democracia del consumo, pero no de la producción. Millones leían. Miles escribían.\n\nEso creó una contradicción oculta. Web1 prometía un internet horizontal, abierto y sin intermediarios. Pero en la práctica los intermediarios no desaparecieron: solo cambiaron de oficio. En lugar de editores de prensa, había desarrolladores web. En lugar de productores de televisión, propietarios de servidores. La voz seguía perteneciendo a quienes tenían conocimientos técnicos.\n\nEli Pariser registró otro problema que apareció un poco después. En cuanto los algoritmos de búsqueda empezaron a tener en cuenta el historial de consultas, el espacio informativo dejó de ser compartido. Cada persona empezó a ver su propia versión de internet. Pariser llamó a eso \"burbuja de filtros\". Web1 prometía: todos tienen acceso a toda la información. En la práctica: el algoritmo decide qué información es la tuya.\n\n> Web1 fue un logro increíble. Pero dejó sin resolver la pregunta principal: ¿cómo damos voz a todos, no solo a quienes tienen conocimientos técnicos?\n\nLa respuesta a esa pregunta llegó en forma de Web2, plataformas que eliminaron la barrera técnica y dieron voz a todos. Pero esa respuesta tenía un costo oculto que nadie leyó en el acuerdo de usuario.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["web", "historia", "información", "medios"], "x": 240.2, "y": 595.0, "angDeg": 150.0}, {"id": "filter", "sceneIndex": 5, "type": "power", "shortTitle": "Burbuja de filtro", "era": "principios de los 2000", "lensWeight": {"chronology": 5, "openness": 1, "community": 1, "media": 4, "control": 5}, "title": "La burbuja de filtros: cuando el algoritmo decide por ti", "insight": "La burbuja de filtros no empezó con Facebook, sino con los primeros algoritmos de búsqueda personalizados. La comodidad de la personalización destruye el espacio informativo compartido.", "thesis": "La burbuja de filtros no empezó con Facebook, sino con los primeros algoritmos de búsqueda personalizados. La comodidad de la personalización destruye el espacio informativo compartido.", "body": "## El intermediario invisible\n\nA principios de los 2000 ocurrió algo que casi nadie notó en el momento en que apareció. Google empezó a tomar en cuenta el historial de búsqueda al dar forma a los resultados. Si buscas con frecuencia noticias de cierta inclinación política, Google empieza a mostrarte más noticias de ese tipo. Si haces clic en cierto tipo de contenido, el algoritmo lo recuerda y ajusta los resultados.\n\nSuena conveniente. Y a corto plazo, de hecho es más conveniente. Recibes lo que el algoritmo cree que te gustará. Menos material irrelevante, más material interesante.\n\nPero Eli Pariser, en su estudio *The Filter Bubble*, registró el costo oculto de esa comodidad. Hizo un experimento simple: les pidió a varios de sus amigos que buscaran en Google la palabra “Egipto” al mismo tiempo; esto fue en el punto álgido de la Primavera Árabe en 2011. Los resultados fueron marcadamente distintos. Una persona recibió noticias sobre la revolución y las protestas. Otra, consejos de viaje y lugares de interés. Una tercera, noticias de negocios sobre la economía del país.\n\nLa misma palabra. El mismo momento. Una realidad completamente distinta.\n\n## Lo que se pierde dentro de la burbuja\n\nEsto no es solo una incomodidad. Es un cambio fundamental en lo que significa un “espacio informativo compartido”.\n\nLa democracia supone que los ciudadanos tienen al menos un conjunto básico de hechos en común. Pueden no coincidir en valores y prioridades, pero deben coincidir en la realidad. Que pasó esto y aquello. Que existe tal problema. Que este número es un hecho.\n\nLa burbuja de filtros destruye ese espacio compartido. El algoritmo le muestra a cada persona lo que genera más interacción, es decir, lo que confirma las creencias ya existentes y refuerza las emociones ya existentes. Como resultado, personas que viven en la misma ciudad pueden tener imágenes de la realidad radicalmente distintas. No porque sean estúpidas o malintencionadas, sino porque el algoritmo literalmente les mostró mundos distintos.\n\nEs importante entenderlo: esto ya había comenzado en la era de Web1, con los primeros resultados de búsqueda personalizados. Las redes sociales simplemente llevaron este mecanismo al límite.\n\nWeb1 prometía: todos tienen acceso igual a toda la información. Era cierto, técnicamente. Pero el algoritmo decidía qué información era “tuya”. Y resultó que eso importaba más que la igualdad técnica de acceso.\n\n> Web1 creó un espacio informativo compartido. Los primeros algoritmos de personalización empezaron a destruirlo, incluso antes de que aparecieran las redes sociales.\n\nPariser escribió sobre esto en 2011, ya en la era de Web2. Pero las raíces del problema se remontan a Web1. En cuanto un algoritmo tiene como objetivo “mostrarte lo que te gustará”, inevitablemente empieza a estrechar tu espacio informativo. Primero, de manera invisible. Luego, de forma fundamental. Esto no es un fallo; es una consecuencia arquitectónica de la propia idea de la personalización.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%
