20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["algoritmos", "información", "medios", "web"], "x": 240.2, "y": 295.0, "angDeg": 210.0}], "edges": [{"from": "nelson", "to": "read", "label": "el sueño se convirtió en escaparate", "lenses": ["chronology", "openness", "media"]}, {"from": "nelson", "to": "ethic", "label": "la idea necesitaba personas", "lenses": ["openness"]}, {"from": "ethic", "to": "read", "label": "la apertura hizo accesible la web", "lenses": ["openness", "media"]}, {"from": "ethic", "to": "community", "label": "la ética reunió las primeras comunidades", "lenses": ["openness", "community"]}, {"from": "read", "to": "community", "label": "los lectores ganaron voz", "lenses": ["community", "media"]}, {"from": "read", "to": "verdict", "label": "el consumo se democratizó", "lenses": ["media", "chronology"]}, {"from": "community", "to": "verdict", "label": "los vínculos resultaron frágiles", "lenses": ["community"]}, {"from": "verdict", "to": "filter", "label": "sin producción, hace falta un intermediario", "lenses": ["chronology", "control", "media"]}, {"from": "ethic", "to": "filter", "label": "la apertura permitió cerrarla", "lenses": ["control", "openness"]}, {"from": "nelson", "to": "filter", "label": "del enlace libre al ranking", "lenses": ["control"]}]}, "fr": {"chapter": {"key": "web1", "title": "L’internet lecteur", "lede": "Comment l’ouverture a créé internet, et comment cette même ouverture a permis de le refermer.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=web1", "centralIdea": "L’ouverture a créé internet et a permis de le refermer", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Chronologie", "accent": "#7dd3fc", "description": "1965 → 2004 : du mot « hypertexte » de Nelson aux premières bulles de filtres."}, {"id": "openness", "label": "Ouverture", "accent": "#34d399", "description": "Hypertexte offert gratuitement, éthique hacker et liberté du savoir comme fondement du Web."}, {"id": "community", "label": "Communauté", "accent": "#c084fc", "description": "Les premières communautés virtuelles : peut-on être amis en ligne et pourquoi est-ce fragile ?"}, {"id": "media", "label": "Médias", "accent": "#fbbf24", "description": "« Tu lis, ils publient » : démocratie de la consommation sans droit de produire."}, {"id": "control", "label": "Contrôle", "accent": "#f87171", "description": "Où naît l’intermédiaire invisible : l’algorithme qui décide à ta place."}], "nodes": [{"id": "nelson", "sceneIndex": 0, "type": "technology", "shortTitle": "Hypertexte", "era": "1965→1991", "lensWeight": {"chronology": 5, "openness": 5, "community": 2, "media": 3, "control": 1}, "title": "Nelson et le rêve de l'hypertexte", "insight": "Nelson a inventé l'hypertexte en 1965, Berners-Lee l'a mis en œuvre en 1991 et l'a offert gratuitement à tous : cette décision a défini la nature de l'internet ouvert.", "thesis": "Nelson a inventé l'hypertexte en 1965, Berners-Lee l'a mis en œuvre en 1991 et l'a offert gratuitement à tous : cette décision a défini la nature de l'internet ouvert.", "body": "## Le mot qui a changé le monde\n\nEn 1965, un jeune programmeur américain nommé Ted Nelson a forgé un mot qui allait changer le monde, même si personne ne le savait alors. Ce mot était « hypertexte ». Nelson ne s’est pas contenté d’inventer un terme : il a décrit une manière totalement nouvelle d’organiser le savoir.\n\nImagine une bibliothèque ordinaire. Des milliers de livres sont alignés sur des étagères dans un ordre alphabétique ou thématique. Tu veux comprendre la théorie de la relativité, alors tu prends le livre d’Einstein et tu lis. Tu tombes sur une référence au travail de Lorentz, tu vas le chercher dans le catalogue, tu le trouves sur l’étagère, et tu reviens. Puis apparaît une référence à Poincaré, et retour au catalogue. Le savoir existe, mais il est découpé en morceaux et rangé dans des cases. Les liens entre les idées ne vivent que dans la tête du lecteur.\n\nNelson imaginait une bibliothèque organisée d’une manière radicalement différente, comme un réseau vivant de liens. Tu lis un article sur Copernic et, d’un seul geste, tu passes au texte qu’il citait. Puis à la critique de sa théorie par ses contemporains. Puis à une carte du ciel étoilé de son époque. Non pas de façon linéaire, page après page, mais par le sens, en suivant la pensée elle-même telle qu’elle circule dans l’esprit d’un chercheur.\n\nIl a appelé ce projet Xanadu, en référence au palais mythique de Kubla Khan, lieu d’une beauté et d’un savoir infinis. Nelson a consacré toute sa vie à Xanadu. Le projet n’a jamais été achevé. Mais l’idée s’est révélée immortelle.\n\n## L’idée reprise par un autre\n\nXanadu a échoué en tant que produit, mais a gagné en tant que concept. En 1989, le programmeur britannique Tim Berners-Lee, qui travaillait au centre de recherche nucléaire CERN à Genève, a rédigé une proposition interne pour la direction. L’idée était de créer un système où tous les documents seraient reliés par des liens et accessibles depuis n’importe quel ordinateur du réseau.\n\nSon supérieur, Mike Sendall, a écrit trois mots dans la marge : « Flou, mais intéressant ». C’était la critique la plus modeste d’une invention qui allait tout changer.\n\nEn trois ans, Berners-Lee a écrit HTML, HTTP et URL, les trois technologies sur lesquelles repose tout le Web moderne. Les documents sont stockés sur des serveurs, ont des adresses, sont reliés par des liens et s’ouvrent dans un navigateur. Le rêve de Nelson d’un hypertexte a enfin reçu une mise en œuvre technique simple.\n\nMais la décision la plus importante n’était pas technique. Berners-Lee aurait pu déposer un brevet sur le Web et devenir la personne la plus riche de la planète. À la place, il a tout offert gratuitement, sans licences, sans conditions. « Si le Web avait été breveté, il n’existerait pas », a-t-il expliqué dans le livre « Weaving the Web ». L’ouverture était une stratégie, pas de l’altruisme : sans barrières, le réseau ne pouvait atteindre une échelle mondiale.\n\n> Nelson a inventé l’hypertexte en 1965. Berners-Lee l’a mis en œuvre en 1991 et l’a offert gratuitement à tous. Vingt-six ans se sont écoulés entre l’idée et sa réalisation, et une décision de principe.\n\nEn 1993 est apparu le navigateur Mosaic, le premier à afficher texte et images ensemble. Internet est devenu visuel et compréhensible sans formation technique. La même année, le nombre de sites a dépassé les cinq cents. Deux ans plus tard, ils étaient deux cent mille. La course avait commencé.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["web", "histoire", "hypertexte", "open source"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "read", "sceneIndex": 1, "type": "media", "shortTitle": "Tu lis", "era": "1991→2004", "lensWeight": {"chronology": 5, "openness": 3, "community": 2, "media": 5, "control": 2}, "title": "L’internet de lecture : tu lis, ils publient", "insight": "Web1 était une démocratie de la consommation sans intermédiaires algorithmiques, et c’est sa plus grande vertu, celle que nous n’avons comprise qu’après l’avoir perdue.", "thesis": "Web1 était une démocratie de la consommation sans intermédiaires algorithmiques, et c’est sa plus grande vertu, celle que nous n’avons comprise qu’après l’avoir perdue.", "body": "## Ce qu’est Web1 et pourquoi il faut le comprendre\n\nWeb1, c’est internet grosso modo de 1991 à 2004. Si on le décrit en une phrase : tu lis, ils publient.\n\nLes sites étaient des pages statiques. Une entreprise, une université, une rédaction ou un passionné créait du contenu et le mettait en ligne. Tous les autres venaient le lire. Pas de commentaires. Pas de likes. Pas de possibilité de répondre ou d’ajouter sa propre contribution. Internet était une immense bibliothèque, mise à jour lentement et de manière inégale.\n\nÀ première vue, cela ressemble à une limite. Mais ce modèle avait sa propre beauté, celle que nous avons perdue et qui nous manque maintenant : il n’y avait aucun intermédiaire entre toi et l’information. Aucun algorithme pour décider quoi te montrer. Tu tapais une adresse et tu obtenais une page. Exactement celle que tu voulais. Pas une « version personnalisée » de la page. Pas du « contenu similaire à ce que tu avais vu auparavant ». Juste la page.\n\nLa recherche fonctionnait autrement elle aussi. Le premier Yahoo, l’un des premiers annuaires de sites populaires, était compilé à la main par de vraies personnes. Des éditeurs examinaient les sites et les répartissaient par catégories. C’était un processus lent, imparfait et humain. Mais il n’avait pas d’arrière-pensées. Aucun algorithme n’essayait de te garder sur le site plus longtemps que nécessaire. Il n’y avait pas de monétisation de l’attention. Pas de publicité ciblée.\n\n## Les flux d’information étaient transparents\n\nCette caractéristique de Web1 est facile à sous-estimer jusqu’à ce qu’on la compare à ce qui est venu ensuite. Les flux d’information étaient simples et visibles. Tu savais d’où venait l’information. Tu pouvais évaluer la source. Tu décidais toi-même quoi lire et combien de temps y consacrer.\n\nDès 1960, J. C. R. Licklider rêvait d’un « Galactic Network » : un réseau mondial où les gens, partout dans le monde, pourraient accéder aux données et aux programmes. Dans sa vision, l’ordinateur et l’être humain forment une symbiose : la machine prend en charge le traitement routinier de l’information, l’humain, la pensée créative. Ensemble, ils sont capables de ce qu’aucun des deux ne peut faire seul.\n\nWeb1 a réalisé ce rêve dans sa forme la plus simple. L’ordinateur comme accès au savoir. L’être humain comme celui qui décide quoi faire de ce savoir. Aucun intermédiaire entre les deux.\n\nEn 2002, David Weinberger a décrit la dimension philosophique de cela dans le livre « Small Pieces Loosely Joined ». Dans le monde physique, l’espace est une contrainte : un document ne peut se trouver qu’à un seul endroit, un livre n’appartient qu’à une seule section. Sur le Web, un document peut être relié à mille autres documents en même temps. Une seule page existe dans un nombre infini de contextes. C’est la « pensée hyperliée » : la capacité de voir des liens là où il y avait autrefois des murs.\n\n> Web1 était une démocratie de la consommation : n’importe qui pouvait lire n’importe quoi. Mais ce n’était pas une démocratie de la production : seuls ceux qui avaient des connaissances techniques pouvaient publier.\n\nCette limite est devenue la raison de l’étape suivante. Des millions de personnes lisaient et voulaient parler. Voulaient ajouter leur propre voix. Répondre. Créer. Et quand la technologie a enfin rendu cela simple, internet a changé pour toujours.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["web", "histoire", "information", "médias"], "x": 759.8, "y": 295.0, "angDeg": -30.0}, {"id": "ethic", "sceneIndex": 2, "type": "technology", "shortTitle": "Éthique hacker", "era": "1984→", "lensWeight": {"chronology": 3, "openness": 5, "community": 4, "media": 1, "control": 2}, "title": "L'éthique hacker : l'ouverture comme vertu", "insight": "L'éthique hacker, fondée sur l'ouverture, la décentralisation et la liberté du savoir, a créé un Internet ouvert. C'est cette même ouverture qui a ensuite permis aux plateformes de le refermer.", "thesis": "L'éthique hacker, fondée sur l'ouverture, la décentralisation et la liberté du savoir, a créé un Internet ouvert. C'est cette même ouverture qui a ensuite permis aux plateformes de le refermer.", "body": "## Les personnes qui ont construit Internet gratuitement\n\nPour comprendre l'esprit de Web1, il faut comprendre les personnes qui l'ont créé. Ce n'étaient pas des entrepreneurs à la recherche d'un modèle économique. C'étaient des hackers, au sens originel du terme, et non au sens criminel. Des gens qui démontent des systèmes pour comprendre comment ils fonctionnent, les améliorer et partager le résultat.\n\nDans son livre \"Hackers: Heroes of the Computer Revolution\", Steven Levy a décrit la culture qui s'est formée au MIT et à Stanford dans les années 1960 et 1970. C'était une vraie sous-culture, avec sa propre éthique et ses propres valeurs. L'information doit être libre, parce que le savoir, contrairement aux choses matérielles, ne diminue pas lorsqu'on le copie. La décentralisation vaut mieux que la centralisation, parce que personne ne devrait avoir de pouvoir sur ce à quoi tout le monde a accès. Jugez les gens à leur code, pas à leurs diplômes, parce que dans le monde numérique, ce qui compte, c'est ce que vous créez, et non qui vous êtes sur le papier.\n\nCette éthique paraît naïve à l'ère des entreprises technologiques valorisées à plusieurs milliards. Mais c'est précisément elle qui a défini l'architecture des premiers temps d'Internet. Justement parce que les premiers bâtisseurs du réseau croyaient à l'ouverture, nous avons obtenu des protocoles ouverts, des navigateurs gratuits et un Web accessible à tous.\n\n## Stallman et le mouvement du logiciel libre\n\nRichard Stallman a poussé l'éthique hacker à sa limite philosophique. En 1985, il a écrit le \"GNU Manifesto\", le document programmatique du mouvement du logiciel libre.\n\nSon argument était simple : le code informatique est du savoir. Le savoir ne peut pas appartenir à quelqu'un, parce que le copier ne retire rien à l'original. Si vous partagez une idée avec moi, elle ne disparaît pas de votre côté. Nous l'avons maintenant tous les deux. Limiter la diffusion du savoir par le droit d'auteur sur le code est donc un geste artificiel et injuste, contraire à la nature de l'information.\n\nStallman n'a pas seulement écrit un manifeste ; il a commencé à construire une alternative. GNU est un système d'exploitation composé entièrement de logiciel libre. En 1991, l'étudiant finlandais Linus Torvalds lui a ajouté le noyau Linux, et cela a donné le système d'exploitation qu'utilisent aujourd'hui la plupart des serveurs du monde, tous les smartphones Android et les superordinateurs.\n\nDe cette même philosophie sont nés Apache, le logiciel serveur qui a fait fonctionner une grande partie des débuts d'Internet, Mozilla Firefox et Wikipedia. Tout cela est le produit d'une culture où partager compte plus que posséder. Où créer et donner n'est pas une faiblesse, mais un principe.\n\nCe qu'on appelle aujourd'hui \"open source\" n'est pas simplement un modèle de développement. C'est l'héritage idéologique de l'éthique hacker des années 1960, qui continue de définir une part importante de l'infrastructure technologique mondiale.\n\n> L'éthique hacker a rendu Internet ouvert non pas parce que c'était plus rentable, mais parce que c'était juste. Ce sont des motivations différentes, et elles produisent des résultats différents.\n\nLe paradoxe, c'est que cette ouverture même a rendu possible l'émergence d'entreprises qui ont ensuite refermé Internet. Google s'appuie sur les protocoles ouverts du Web. Facebook s'appuie sur l'Internet ouvert. Ils ont utilisé une infrastructure ouverte et ont construit dessus des plateformes fermées. L'éthique hacker a créé un monde qui a ensuite commencé à jouer selon d'autres règles.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["open source", "histoire", "web", "communauté"], "x": 759.8, "y": 595.0, "angDeg": 30.0}, {"id": "community", "sceneIndex": 3, "type": "privacy", "shortTitle": "Communautés", "era": "1993", "lensWeight": {"chronology": 4, "openness": 3, "community": 5, "media": 2, "control": 1}, "title": "Premières communautés : peut-on être amis en ligne ?", "insight": "Rheingold a prouvé que les communautés en ligne sont réelles. Mais elles sont fragiles : elles fonctionnent à petite échelle et se défont lorsqu'elles grandissent sans normes partagées.", "thesis": "Rheingold a prouvé que les communautés en ligne sont réelles. Mais elles sont fragiles : elles fonctionnent à petite échelle et se défont lorsqu'elles grandissent sans normes partagées.", "body": "## Une question qui paraissait étrange\n\nEn 1993, le journaliste et chercheur Howard Rheingold a publié *The Virtual Community*, la première étude sérieuse sur ce qui arrive aux gens lorsqu'ils commencent à communiquer en ligne. La question qu'il posait semblait étrange à l'époque : une véritable communauté humaine peut-elle émerger sur internet ?\n\nAujourd'hui, cela paraît évident - bien sûr que oui, nous vivons tous à l'intérieur. Mais en 1993, rien de tout cela n'était évident. La société était convaincue que la communication en présence physique était irremplaçable, que le réseau n'était qu'un substitut et qu'aucune vraie relation ne pouvait exister sans présence physique.\n\nRheingold a étudié WELL — Whole Earth 'Lectronic Link, l'un des tout premiers réseaux en ligne, qui existait même avant le navigateur. Les participants communiquaient par terminaux textuels : on tape du texte, on appuie sur Entrée, on attend une réponse. Pas de photos, pas de vidéo, pas d'emojis. Seulement des mots sur un écran noir.\n\nEt pourtant, Rheingold a vu quelque chose de frappant : les participants de WELL se soutenaient dans les moments difficiles — maladie, perte, crises. Ils partageaient leurs connaissances avec des inconnus qu'ils n'avaient jamais vus. Ils construisaient leur réputation et la confiance au fil des années d'échanges. Le réseau créait un nouveau type de proximité, sans géographie, sans espace physique.\n\n## Fragilité et échelle\n\nLa réponse de Rheingold était prudemment optimiste : oui, de vraies communautés en ligne sont possibles. Mais il a aussi remarqué quelque chose d'important sur la nature de ces communautés : elles sont fragiles.\n\nLa communauté WELL fonctionnait tant qu'il y avait relativement peu de participants — quelques milliers de personnes qui se connaissaient au moins par leur pseudonyme. Il y avait des normes de comportement partagées, des règles non écrites, un sentiment d'appartenance. À mesure que la communauté grandissait, la qualité des interactions changeait. Trop d'inconnus détruisaient l'atmosphère de confiance.\n\nCette observation anticipait un problème devenu critique deux décennies plus tard : comment faire grandir une communauté tout en préservant sa qualité ? Comment Facebook, avec deux milliards d'utilisateurs, peut-il être une « communauté » si la plupart des participants ne se rencontreront jamais et ne partagent aucune norme commune ?\n\nDans *Out of Control* (1994), Kevin Kelly décrivait internet comme un système vivant — décentralisé, sans contrôle central, évoluant à partir des interactions de millions de participants. Cela semblait être une bonne nouvelle. Mais Kelly a manqué une conséquence de sa propre logique : les systèmes vivants évoluent vers la survie des mieux adaptés, et non vers la justice ou la chaleur humaine.\n\nLorsque des entreprises disposant d'énormes ressources sont arrivées sur internet, ce sont elles qui se sont révélées être les « mieux adaptées ». Et le système a commencé à évoluer dans leur direction.\n\n> Rheingold a prouvé que de vraies communautés en ligne sont possibles. Mais il a aussi montré leur fragilité : une communauté fonctionne tant qu'elle est petite et qu'elle partage des normes.\n\nCette observation reste pertinente aujourd'hui. Les meilleures communautés en ligne sont petites, avec une identité et des règles claires. Les grandes plateformes tuent les communautés en les transformant en audiences. C'est précisément pour cela que Web3 mise sur les tokens et les DAO - des outils qui créent des mécanismes formels pour maintenir des normes à grande échelle.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["communauté", "graphe social", "web", "histoire"], "x": 500.0, "y": 745.0, "angDeg": 90.0}, {"id": "verdict", "sceneIndex": 4, "type": "power", "shortTitle": "Bilan de Web1", "era": "≈2000", "lensWeight": {"chronology": 4, "openness": 4, "community": 3, "media": 4, "control": 3}, "title": "Ce que Web1 a accompli et où il a trébuché", "insight": "Web1 a démocratisé la consommation d’information, mais pas sa production, et cette contradiction a donné naissance à Web2 avec ses plateformes pour tout le monde.", "thesis": "Web1 a démocratisé la consommation d’information, mais pas sa production, et cette contradiction a donné naissance à Web2 avec ses plateformes pour tout le monde.", "body": "## Des réussites réelles qu’on oublie facilement\n\nÀ la fin des années 1990, Web1 avait accompli plusieurs choses qui semblaient impossibles vingt ans plus tôt. On l’oublie facilement, parce qu’aujourd’hui tout cela paraît aller de soi. Mais il vaut la peine de s’arrêter et d’en mesurer l’ampleur.\n\nLe web a démocratisé l’accès à l’information à une échelle sans précédent. Si tu as un ordinateur et une connexion, tu peux lire un article de la bibliothèque universitaire de Harvard. Trouver des informations médicales que seuls les médecins connaissaient auparavant. Lire en temps réel les nouvelles de n’importe quel pays du monde. Obtenir des instructions pour réparer à peu près n’importe quoi. Pour cela, pas besoin d’argent, de relations ou d’une formation spéciale, seulement d’un accès à internet.\n\nLe web a détruit la géographie du savoir. Un scientifique à Kyiv lit le même preprint scientifique qu’un scientifique à Cambridge, au même moment, quelques minutes après sa publication. Avant internet, c’était physiquement impossible: il fallait imprimer le preprint, l’envoyer par la poste et attendre des semaines. Cela a accéléré la science, l’éducation et le journalisme.\n\nLe web a créé de nouvelles communautés qui n’auraient pas pu exister auparavant. Des personnes aux intérêts rares se sont trouvées: des passionnés d’un genre musical peu connu, venus de pays différents. Des patients atteints de maladies rares, dont il peut n’y avoir que dix dans une même ville. Des programmeurs d’un langage précis, prêts à aider gratuitement un inconnu à l’autre bout de la planète. Avant, ils étaient invisibles, pour la société comme les uns pour les autres. Le web en a fait une communauté.\n\n## Là où Web1 a trébuché\n\nMais Web1 avait une limite fondamentale qui a tout déterminé par la suite. Tout le monde pouvait lire. Publier, c’était autre chose.\n\nPour créer un site en 1996, il fallait connaître HTML, comprendre l’hébergement et le FTP, et maîtriser les noms de domaine. Pour un programmeur, c’était un petit obstacle. Pour une enseignante, une femme au foyer ou un retraité, c’était insurmontable. Internet était une démocratie de la consommation, mais pas de la production. Des millions lisaient. Des milliers écrivaient.\n\nCela a créé une contradiction cachée. Web1 promettait un internet horizontal, ouvert, sans gardiens d’entrée. Mais dans les faits, les gardiens n’ont pas disparu, ils ont simplement changé de métier. Au lieu des rédacteurs de journaux, il y avait des développeurs web. Au lieu des producteurs de télévision, des propriétaires de serveurs. La voix appartenait toujours à ceux qui avaient des connaissances techniques.\n\nEli Pariser a mis en évidence un autre problème apparu un peu plus tard. Dès que les algorithmes de recherche ont commencé à prendre en compte l’historique des requêtes, l’espace informationnel a cessé d’être partagé. Chacun a commencé à voir sa propre version d’internet. Pariser a appelé cela la \"bulle de filtres\". Web1 promettait: tout le monde a accès à toute l’information. En pratique: l’algorithme décide quelle information est la tienne.\n\n> Web1 a été une réussite incroyable. Mais il a laissé sans réponse la question centrale: comment donner une voix à tout le monde, et pas seulement à ceux qui ont des connaissances techniques?\n\nLa réponse à cette question est arrivée sous la forme de Web2, des plateformes qui ont supprimé la barrière technique et donné une voix à chacun. Mais cette réponse avait un prix caché que personne n’a lu dans les conditions d’utilisation.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["web", "histoire", "information", "médias"], "x": 240.2, "y": 595.0, "angDeg": 150.0}, {"id": "filter", "sceneIndex": 5, "type": "power", "shortTitle": "Bulle de filtres", "era": "début des années 2000", "lensWeight": {"chronology": 5, "openness": 1, "community": 1, "media": 4, "control": 5}, "title": "La bulle de filtres : quand l’algorithme décide pour toi", "insight": "La bulle de filtres n’a pas commencé avec Facebook, mais avec les premiers algorithmes de recherche personnalisée. La commodité de la personnalisation détruit l’espace d’information partagé.", "thesis": "La bulle de filtres n’a pas commencé avec Facebook, mais avec les premiers algorithmes de recherche personnalisée. La commodité de la personnalisation détruit l’espace d’information partagé.", "body": "## L’intermédiaire invisible\n\nAu début des années 2000, il s’est produit quelque chose que presque personne n’a remarqué au moment où c’est apparu. Google a commencé à prendre en compte l’historique de recherche pour façonner les résultats. Si tu recherches souvent des actualités d’une certaine orientation politique, Google commence à t’en montrer davantage. Si tu cliques sur un certain type de contenu, l’algorithme s’en souvient et ajuste les résultats.\n\nCela semble pratique. Et à court terme, c’est vraiment plus pratique. Tu obtiens ce que l’algorithme pense que tu aimeras. Moins d’éléments hors sujet, plus de choses intéressantes.\n\nMais, dans son étude *The Filter Bubble*, Eli Pariser a mis en évidence le coût caché de cette commodité. Il a mené une expérience simple : il a demandé à plusieurs de ses amis de chercher en même temps le mot « Égypte » sur Google — c’était au plus fort du Printemps arabe en 2011. Les résultats étaient radicalement différents. L’un a reçu des informations sur la révolution et les manifestations. Un autre, des conseils de voyage et des sites à voir. Un troisième, des informations économiques sur le pays.\n\nLe même mot. Le même moment. Une réalité complètement différente.\n\n## Ce qui se perd dans la bulle\n\nCe n’est pas qu’un simple inconvénient. C’est une transformation fondamentale de ce que signifie un « espace d’information partagé ».\n\nLa démocratie suppose que les citoyens disposent au moins d’un socle commun de faits. Ils peuvent ne pas être d’accord sur les valeurs et les priorités, mais ils doivent s’accorder sur la réalité. Que ceci ou cela s’est produit. Qu’un tel problème existe. Que tel chiffre est un fait.\n\nLa bulle de filtres détruit cet espace commun. L’algorithme montre à chacun ce qui suscite le plus d’engagement, c’est-à-dire ce qui confirme les croyances déjà présentes et renforce les émotions déjà présentes. Résultat : des personnes vivant dans la même ville peuvent avoir des visions de la réalité fondamentalement différentes. Non pas parce qu’elles sont stupides ou malveillantes, mais parce que l’algorithme leur a littéralement montré des mondes différents.\n\nIl faut bien comprendre ceci : cela a commencé dès l’époque de Web1, avec les premiers résultats de recherche personnalisés. Les réseaux sociaux n’ont fait que pousser ce mécanisme à son extrême.\n\nWeb1 promettait ceci : tout le monde a un accès égal à toute l’information. C’était vrai, techniquement. Mais l’algorithme décidait quelle information était « la tienne ». Et cela s’est révélé plus important que l’égalité technique d’accès.\n\n> Web1 a créé un espace d’information partagé. Les premiers algorithmes de personnalisation ont commencé à le détruire, avant même l’apparition des réseaux sociaux.\n\nPariser a écrit à ce sujet en 2011, déjà à l’époque de Web2. Mais les racines du problème remontent à Web1. Dès qu’un algorithme a pour objectif de « te montrer ce qui va te plaire », il commence inévitablement à rétrécir ton espace informationnel. D’abord, de façon invisible. Puis, en profondeur. Ce n’est pas un bug, c’est une conséquence architecturale de l’idée même de personnalisation.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["algorithmes", "information", "médias", "web"], "x": 240.2, "y": 295.0, "angDeg": 210.0}], "edges": [{"from": "nelson", "to": "read", "label": "le rêve est deve edia", "label": "Մեդիա", "accent": "#fbbf24", "description": "«Դու կարդում ես, նրանք հրապարակում են»․ սպառման ժողովրդավարություն առանց արտադրելու իրավունքի։"}, {"id": "control", "label": "Վերահսկում", "accent": "#f87171", "description": "Որտեղ է ծնվում անտեսանելի միջնորդը՝ ալգորիթմը, որը որոշում է քո փոխարեն։"}], "nodes": [{"id": "nelson", "sceneIndex": 0, "type": "technology", "shortTitle": "Հիպերտեքստ", "era": "1965→1991", "lensWeight": {"chronology": 5, "openness": 5, "community": 2, "media": 3, "control": 1}, "title": "Նելսոնը և հիպերտեքստի երազանքը", "insight": "Նելսոնը 1965-ին հորինեց հիպերտեքստը, Բերներս-Լին այն իրականացրեց 1991-ին և անվճար տվեց բոլորին — հենց այդ որոշումն էլ ձևավորեց բաց ինտերնետի բնույթը։", "thesis": "Նելսոնը 1965-ին հորինեց հիպերտեքստը, Բերներս-Լին այն իրականացրեց 1991-ին և անվճար տվեց բոլորին — հենց այդ որոշումն էլ ձևավորեց բաց ինտերնետի բնույթը։", "body": "## Աշխարհը փոխած բառը\n\n1965 թվականին երիտասարդ ամերիկացի ծրագրավորող Թեդ Նելսոնը մտահղացավ մի բառ, որը փոխելու էր աշխարհը, թեև այն ժամանակ ոչ ոք դրա մասին չգիտեր։ Այդ բառը «հիպերտեքստ» էր։ Նելսոնը պարզապես տերմին չհորինեց. նա նկարագրեց գիտելիքի կազմակերպման բոլորովին նոր ձև։\n\nՊատկերացրու սովորական գրադարան։ Հազարավոր գրքեր դարակներում կանգնած են այբբենական կամ թեմատիկ կարգով։ Դու ուզում ես հասկանալ հարաբերականության տեսությունը, վերցնում ես Էյնշտեյնի գիրքն ու կարդում։ Հանդիպում ես Լորենցի աշխատանքի հղումի, գնում ես որոնելու այն կատալոգում, գտնում դարակի վրա և վերադառնում։ Հետո հայտնվում է հղում Պուանկարեի վրա, և նորից կատալոգ։ Գիտելիքը գոյություն ունի, բայց այն կտրված է մասերի ու դասավորված արկղերի մեջ։ Գաղափարների միջև կապերը ապրում են միայն ընթերցողի գլխում։\n\nՆելսոնը պատկերացնում էր բոլորովին այլ կերպ կազմակերպված գրադարան՝ որպես կապերի կենդանի ցանց։ Դու կարդում ես Կոպեռնիկոսի մասին հոդված և մի շարժումով անցնում այն տեքստին, որը նա մեջբերել էր։ Հետո՝ իր տեսության նկատմամբ ժամանակակիցների քննադատությանը։ Հետո՝ իր դարաշրջանի աստղազարդ երկնքի քարտեզին։ Ոչ թե գծային, էջ առ էջ, այլ ըստ իմաստի՝ հետևելով հենց մտքին, ինչպես այն հոսում է հետազոտողի գլխում։\n\nՆա այդ նախագիծը անվանեց Xanadu՝ ի պատիվ Կուբլայ-խանի առասպելական պալատի, անվերջ գեղեցկության և գիտելիքի վայրի։ Նելսոնը իր ողջ կյանքը նվիրեց Xanadu-ին։ Նախագիծը այդպես էլ չավարտվեց։ Բայց գաղափարը անմահ դուրս եկավ։\n\n## Մեկ ուրիշը վերցրած գաղափարը\n\nXanadu-ն ձախողվեց որպես արտադրանք, բայց հաղթեց որպես հայեցակարգ։ 1989 թվականին Ժնևում գտնվող CERN միջուկային հետազոտական կենտրոնում աշխատող բրիտանացի ծրագրավորող Թիմ Բերներս-Լին ղեկավարությանը ներկայացրեց ներքին առաջարկ։ Էությունը սա էր՝ ստեղծել համակարգ, որտեղ բոլոր փաստաթղթերը կապվում են հղումներով և հասանելի են ցանցի ցանկացած համակարգչից։\n\nՆրա ղեկավարը՝ Մայք Սենդալը, լուսանցքում գրեց երեք բառ՝ «Անորոշ է, բայց հետաքրքիր»։ Սա ամենահամեստ գնահատականն էր մի գյուտի մասին, որը փոխելու էր ամեն ինչ։\n\nԵրեք տարվա ընթացքում Բերներս-Լին գրեց HTML-ը, HTTP-ն և URL-ը՝ այն երեք տեխնոլոգիաները, որոնց վրա հենվում է ամբողջ ժամանակակից Web-ը։ Փաստաթղթերը պահվում են սերվերներում, ունեն հասցեներ, կապվում են հղումներով և բացվում բրաուզերի միջոցով։ Նելսոնի հիպերտեքստի երազանքը վերջապես ստացավ պարզ տեխնիկական իրագործում։\n\nԲայց ամենակարևոր որոշումը տեխնիկական չէր։ Բերներս-Լին կարող էր Web-ը արտոնագրել և դառնալ մոլորակի ամենահարուստ մարդը։ Փոխարենը նա ամեն ինչ տվեց անվճար, առանց լիցենզիաների, առանց պայմանների։ «Եթե Web-ը արտոնագրված լիներ, այն չէր գոյանա», — բացատրեց նա «Weaving the Web» գրքում։ Բաց լինելը ռազմավարություն էր, ոչ թե ալտրուիզմ. միայն առանց խոչընդոտների ցանցը կարող էր աճել մինչև համաշխարհային մասշտաբ։\n\n> Նելսոնը հիպերտեքստը հորինեց 1965 թվականին։ Բերներս-Լին այն իրականացրեց 1991 թվականին և անվճար տվեց բոլորին։ Գաղափարի և դրա իրագործման միջև անցավ քսանվեց տարի և մեկ սկզբունքային որոշում։\n\n1993 թվականին հայտնվեց Mosaic բրաուզերը՝ առաջինը, որը միասին էր ցույց տալիս տեքստն ու պատկերները։ Ինտերնետը դարձավ վիզուալ և հասկանալի առանց տեխնիկական կրթության։ Նույն թվականին կայքերի թիվը անցավ հինգ հարյուրից։ Երկու տարի անց՝ երկու հարյուր հազարից։ Մրցավազքը սկ եցկությունը, որը մենք կորցրել ենք և հիմա կարոտում ենք․ քո և տեղեկատվության միջև ոչ մի միջնորդ չկար։ Ոչ մի ալգորիթմ, որը կորոշեր, թե ինչ ցույց տալ քեզ։ Դու հասցեն էիր մուտքագրում և ստանում էջը։ Հենց այն էջը, որը ցանկանում էիր։ Ոչ թե էջի «անձնավորված տարբերակը»։ Ոչ թե «այնպիսի բովանդակություն, ինչպիսին այն է, ինչ նախապես դիտել ես»։ Պարզապես էջը։\n\nՈրոնումը այլ տեսք ուներ։ Վաղ Yahoo-ն՝ կայքերի առաջին հանրաճանաչ կատալոգներից մեկը, ձեռքով էր կազմվում կենդանի մարդկանց կողմից։ Խմբագիրները դիտարկում էին կայքերը և դասակարգում դրանք ըստ կատեգորիաների։ Դա դանդաղ, անկատար, մարդկային գործընթաց էր։ Բայց դրա մեջ թաքնված շարժառիթներ չկային։ Ոչ մի ալգորիթմ չէր փորձում քեզ կայքում պահել ավելի երկար, քան անհրաժեշտ է։ Ուշադրության մոնետիզացում չկար։ Թիրախավորված գովազդ չկար։\n\n## Տեղեկատվական հոսքերը թափանցիկ էին\n\nWeb1-ի այս առանձնահատկությունը հեշտ է թերագնահատել, մինչև չհամեմատես այն հետո եկածի հետ։ Տեղեկատվական հոսքերը պարզ ու տեսանելի էին։ Դու գիտեիր, թե որտեղից է գալիս տեղեկատվությունը։ Դու կարող էիր գնահատել աղբյուրը։ Դու ինքդ էիր որոշում, թե ինչ կարդալ և որքան ժամանակ հատկացնել։\n\nՋ. Ց. Ռ. Լիկլայդերը դեռ 1960-ին երազում էր «Galactic Network»-ի մասին՝ համաշխարհային ցանցի, որտեղ աշխարհի ցանկացած կետից մարդիկ կարող էին մուտք գործել տվյալների և ծրագրերի։ Նրա տեսլականում համակարգիչն ու մարդը սիմբիոզ են կազմում. մեքենան իր վրա է վերցնում տեղեկատվության սովորական մշակումը, մարդը՝ ստեղծագործական մտածողությունը։ Միասին նրանք կարող են այն, ինչ նրանցից ոչ մեկը առանձին չի կարող անել։\n\nWeb1-ը այս երազանքը իրականացրեց ամենապարզ ձևով։ Համակարգիչը որպես գիտելիքի հասանելիություն։ Մարդը որպես նա, ով որոշում է, թե այդ գիտելիքի հետ ինչ անել։ Նրանց միջև ոչ մի միջնորդ չկա։\n\nԴեյվիդ Վայնբերգերը 2002 թվականին «Small Pieces Loosely Joined» գրքում նկարագրեց դրա փիլիսոփայական չափումը։ Ֆիզիկական աշխարհում տարածքը սահմանափակում է․ փաստաթուղթը կարող է լինել միայն մեկ տեղում, գիրքը պատկանում է միայն մեկ բաժնի։ Web-ում փաստաթուղթը միաժամանակ կարող է կապված լինել հազարավոր այլ փաստաթղթերի հետ։ Մեկ էջը գոյություն ունի անսահման թվով համատեքստերում։ Սա «հիպերհղումային մտածողություն» է՝ կապեր տեսնելու ունակությունը այնտեղ, որտեղ առաջ պատեր էին։\n\n> Web1-ը սպառման ժողովրդավարություն էր․ ցանկացած մարդ կարող էր ցանկացած բան կարդալ։ Բայց արտադրության ժողովրդավարություն չէր․ հրապարակել կարող էին միայն նրանք, ովքեր տեխնիկական գիտելիք ունեին։\n\nԱյս սահմանափակումն էլ դարձավ հաջորդ քայլի պատճառը։ Միլիոնավոր մարդիկ կարդում էին և ուզում էին խոսել։ Ուզում էին իրենցը ավելացնել։ Պատասխանել։ Ստեղծել։ Եվ երբ տեխնոլոգիաները վերջապես դա հեշտ արեցին, ինտերնետը փոխվեց ընդմիշտ։", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/sea  փակել այն։", "body": "## Web1-ը անվճար կառուցած մարդիկ\n\nWeb1-ի ոգին հասկանալու համար պետք է հասկանալ այն մարդկանց, որոնք այն ստեղծեցին։ Նրանք ոչ թե գործարարներ էին, որ բիզնես-մոդել էին որոնում։ Նրանք հաքերներ էին բառի սկզբնական իմաստով, ոչ թե քրեական։ Մարդիկ, որոնք համակարգերը քանդում են՝ հասկանալու, թե ինչպես են դրանք աշխատում, ինչպես բարելավել դրանք և արդյունքը կիսել մյուսների հետ։\n\nSteven Levy-ն իր \"Hackers: Heroes of the Computer Revolution\" գրքում նկարագրել է այն մշակույթը, որը ձևավորվեց MIT-ում և Stanford-ում 1960-ականներին ու 70-ականներին։ Դա իսկական ենթամշակույթ էր՝ իր էթիկայով և արժեքներով։ Տեղեկատվությունը պետք է ազատ լինի, որովհետև գիտելիքը, ի տարբերություն նյութական իրերի, չի պակասում, երբ պատճենվում է։ Կենտրոնազերծումն ավելի լավ է, քան կենտրոնացումը, որովհետև ոչ ոք չպետք է իշխանություն ունենա այն բանի վրա, ինչին բոլորն են հասանելի։ Մարդկանց դատիր ըստ նրանց կոդի, ոչ թե դիպլոմների, որովհետև թվային աշխարհում կարևոր է ոչ թե ով ես դու փաստաթղթերով, այլ ինչ ես ստեղծում։\n\nԱյս էթիկան միամիտ է հնչում միլիարդավոր դոլարների տեխնոլոգիական ընկերությունների դարաշրջանում։ Բայց հենց այդ էթիկան որոշեց վաղ ինտերնետի ճարտարապետությունը։ Հենց այն պատճառով, որ ցանցի առաջին կառուցողները հավատում էին բացությանը, մենք ստացանք բաց պրոտոկոլներ, անվճար բրաուզերներ և բոլորի համար հասանելի Web։\n\n## Ստոլմանը և ազատ ծրագրային ապահովման շարժումը\n\nRichard Stallman-ը հաքերային էթիկան հասցրեց դրա փիլիսոփայական սահմանին։ 1985 թվականին նա գրեց \"GNU Manifesto\"-ն՝ ազատ ծրագրային ապահովման շարժման ծրագրային փաստաթուղթը։\n\nՆրա փաստարկը պարզ էր․ ծրագրի կոդը գիտելիք է։ Գիտելիքը չի կարող որևէ մեկի սեփականությունը լինել, որովհետև այն պատճենելը ոչինչ չի խլում բնօրինակից։ Եթե դու ինձ հետ մի գաղափար ես կիսում, այն քեզ մոտ չի անհետանում։ Այժմ այն երկուսիս մոտ էլ կա։ Ուրեմն կոդի վրա հեղինակային իրավունքով գիտելիքի տարածումը սահմանափակելը արհեստական ու անարդար գործողություն է, որը հակասում է տեղեկատվության բնույթին։\n\nStallman-ը պարզապես մանիֆեստ չգրեց, այլ սկսեց այլընտրանք կառուցել։ GNU-ն օպերացիոն համակարգ է, որը ամբողջությամբ կազմված է ազատ ծրագրային ապահովումից։ 1991 թվականին ֆին ուսանող Linus Torvalds-ը դրան ավելացրեց Linux միջուկը, և ստացվեց օպերացիոն համակարգ, որն այսօր օգտագործում են աշխարհի սերվերների մեծ մասը, Android-ով բոլոր սմարթֆոնները և սուպերհամակարգիչները։\n\nՆույն փիլիսոփայությունից ծնվեցին Apache-ը, այն սերվերային ծրագրակազմը, որի վրա աշխատում էր վաղ ինտերնետի մեծ մասը, Mozilla Firefox-ը և Wikipedia-ն։ Այս ամենը մի մշակույթի արտադրանք է, որտեղ կիսվելն ավելի կարևոր է, քան տիրապետելը։ Որտեղ ստեղծելն ու փոխանցելը ոչ թե թուլություն է, այլ սկզբունք։\n\nԱյն, ինչ այսօր կոչվում է \"open source\", պարզապես զարգացման մոդել չէ։ Դա 1960-ականների հաքերային էթիկայի գաղափարական ժառանգությունն է, որը մինչ այսօր որոշում է աշխարհի տեխնոլոգիական ենթակառուցվածքի զգալի մասը։\n\n> Հաքերային էթիկան ինտերնետը բաց դարձրեց ոչ թե այն պատճառով, որ դա ավելի շահավետ էր, այլ որովհետև դա ճիշտ էր։ Սրանք տարբեր մոտիվացիաներ են, և դրանք տարբեր արդյունքներ են ստեղծում։\n\nՊարադոքսն այն է, որ հենց այդ բացությունը հնարավոր դարձրեց այն ընկերությունների ի հայտ գալը, որոնք հետո փակեցին ինտերնետը։ Google-ը կանգնած է Web-ի բաց պրոտոկոլների վրա։ Facebook-ը կանգնած է բաց ինտերնետի վրա։ Նրանք օգտագործեցին բաց ենթակառուցվածքը և դրա վրա կառուցեցին փակ հարթակներ։ Հաքերային էթիկան ստեղծեց մի աշխարհ, որը հետո սկսեց խաղալ այլ կանոններով։", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/se Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["բաց կոդ", "պատմություն", "Web", "համայնք"], "x": 759.8, "y": 595.0, "angDeg": 30.0}, {"id": "community", "sceneIndex": 3, "type": "privacy", "shortTitle": "Համայնքներ", "era": "1993", "lensWeight": {"chronology": 4, "openness": 3, "community": 5, "media": 2, "control": 1}, "title": "Առաջին համայնքները. հնարավո՞ր է առցանց ընկերանալ։", "insight": "Ռեյնգոլդը ապացուցեց, որ առցանց համայնքները իրական են։ Բայց դրանք փխրուն են՝ փոքր մասշտաբով են գործում և ընդհանուր նորմերի բացակայության դեպքում աճելիս քանդվում են։", "thesis": "Ռեյնգոլդը ապացուցեց, որ առցանց համայնքները իրական են։ Բայց դրանք փխրուն են՝ փոքր մասշտաբով են գործում և ընդհանուր նորմերի բացակայության դեպքում աճելիս քանդվում են։", "body": "## Տարօրինակ թվացող հարցը\n\n1993 թվականին լրագրող և հետազոտող Հովարդ Ռեյնգոլդը հրապարակեց *The Virtual Community* գիրքը՝ առաջին լուրջ ուսումնասիրությունը այն մասին, թե ինչ է պատահում մարդկանց հետ, երբ նրանք սկսում են հաղորդակցվել ցանցում։ Նրա բարձրացրած հարցը այն ժամանակ տարօրինակ էր թվում. կարո՞ղ է ինտերնետում իրական մարդկային համայնք առաջանալ։\n\nԱյսօր դա ակնհայտ է թվում՝ իհարկե կարող է, մենք բոլորս հենց դրա մեջ ենք ապրում։ Բայց 1993 թվականին դա բոլորովին ակնհայտ չէր։ Հասարակությունը համոզված էր, որ կենդանի հաղորդակցությունը անփոխարինելի է, որ ցանցը փոխարինող է, և որ ֆիզիկական ներկայության բացակայության դեպքում իրական հարաբերություններ չեն լինում։\n\nՌեյնգոլդը ուսումնասիրում էր WELL-ը — Whole Earth 'Lectronic Link-ը, առաջին առցանց ցանցերից մեկը, որը գոյություն ուներ դեռ բրաուզերից առաջ։ Մասնակիցները հաղորդակցվում էին տեքստային տերմինալների միջոցով. տեքստ ես մուտքագրում, սեղմում ես Enter, սպասում ես պատասխանի։ Ոչ մի լուսանկար, ոչ մի տեսանյութ, ոչ մի էմոջի։ Միայն բառեր՝ սև էկրանին։\n\nԵվ այնուամենայնիվ Ռեյնգոլդը տեսավ մի ապշեցուցիչ բան. WELL-ի մասնակիցները դժվար պահերին աջակցում էին միմյանց՝ հիվանդություն, կորուստ, ճգնաժամեր։ Գիտելիք էին կիսում անծանոթ մարդկանց հետ, որոնց երբեք չէին տեսել։ Տարիների փոխազդեցության ընթացքում կառուցում էին հեղինակություն և վստահություն։ Ցանցը ստեղծում էր մտերմության նոր տեսակ՝ առանց աշխարհագրության, առանց ֆիզիկական տարածության։\n\n## Փխրունություն և մասշտաբ\n\nՌեյնգոլդի պատասխանը զգուշավոր լավատեսական էր. այո, ցանցում իրական համայնքները հնարավոր են։ Բայց նա նաև կարևոր բան նկատեց այդ համայնքների բնույթի մասին՝ դրանք փխրուն են։\n\nWELL համայնքը գործում էր այնքան ժամանակ, քանի դեռ մասնակիցները համեմատաբար քիչ էին՝ մի քանի հազար մարդ, որոնք միմյանց ճանաչում էին գոնե մականունով։ Կային վարքագծի ընդհանուր նորմեր, չգրված կանոններ, պատկանելիության զգացում։ Երբ համայնքը մեծանում էր, փոխազդեցության որակը փոխվում էր։ Շատ օտար մարդիկ քանդում էին վստահության մթնոլորտը։\n\nԱյս դիտարկումը կանխազգացրեց մի խնդիր, որը երկու տասնամյակ անց դարձավ քննադատական. ինչպես մասշտաբավորել համայնքը՝ պահպանելով դրա որակը։ Ինչպե՞ս կարող է Facebook-ը, երկու միլիարդ օգտատերերով, լինել «համայնք», եթե մասնակիցների մեծ մասը երբեք չի հանդիպի և չունի որևէ ընդհանուր նորմ։\n\nՔևին Քելլին *Out of Control* (1994) գրքում ինտերնետը նկարագրեց որպես կենդանի համակարգ՝ ապակենտրոնացված, առանց կենտրոնական կառավարման, ձևավորվող միլիոնավոր մասնակիցների փոխազդեցությունից։ Դա լավ նորություն էր թվում։ Բայց Քելլին բաց թողեց իր սեփական տրամաբանության մեկ հետևանքը. կենդանի համակարգերը զարգանում են դեպի ամենահարմարեցվածների գոյատևումը, ոչ թե դեպի արդարություն կամ մարդկային ջերմություն։\n\nԵրբ հսկայական ռեսուրսներով ընկերությունները եկան ինտերնետ, հենց նրանք էլ դուրս եկան որպես «ամենահարմարեցվածները»։ Եվ համակարգը սկսեց զարգանալ նրանց ուղղությամբ։\n\n> Ռեյնգոլդը ապացուցեց. ցանցում իրական համայնքները հնարավոր են։ Բայց նա նաև ցույց տվեց դրանց փխրունությունը. համայնքը գործում է, քանի դեռ փոքր է և ունի ընդհանուր նորմեր։\n\nԱյս դիտարկումը մինչ օրս արդիական է։ Լավագույն առցանց համայնքները փոքր են, հստակ ինքնությամբ և կանոններով։ Խոշոր հարթակները ոչնչացնում են համայնքները՝ դրանք դարձնելով լսարաններ։ Հենց այդ պատճառով Web3-ը իր հույսը դնում է թոքենների և DAO-ների վրա՝ գործիքներ, որոնք ստեղծում են ձևական մեխանիզմն m/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["համայնք", "սոցիալական գրաֆ", "Web", "պատմություն"], "x": 500.0, "y": 745.0, "angDeg": 90.0}, {"id": "verdict", "sceneIndex": 4, "type": "power", "shortTitle": "Web1-ի արդյունքը", "era": "≈2000", "lensWeight": {"chronology": 4, "openness": 4, "community": 3, "media": 4, "control": 3}, "title": "Ինչի հասավ Web1-ը և որտեղ սայթաքեց", "insight": "Web1-ը ժողովրդավարացրեց տեղեկատվության սպառումը, բայց ոչ դրա արտադրությունը, և հենց այդ հակասությունն էլ ծնեց Web2-ը՝ իր բոլորի համար նախատեսված հարթակներով։", "thesis": "Web1-ը ժողովրդավարացրեց տեղեկատվության սպառումը, բայց ոչ դրա արտադրությունը, և հենց այդ հակասությունն էլ ծնեց Web2-ը՝ իր բոլորի համար նախատեսված հարթակներով։", "body": "## Հեշտ մոռացվող իրական ձեռքբերումներ\n\n1990-ականների վերջում Web1-ը արեց մի քանի բան, որոնք քսան տարի առաջ անհնար էին թվում։ Սա հեշտ է մոռանալ, որովհետև այսօր այդ ամենը բնական է թվում։ Բայց արժե կանգ առնել ու գնահատել մասշտաբը։\n\nՎեբը տեղեկատվության հասանելիությունը ժողովրդավարացրեց աննախադեպ մասշտաբով։ Եթե ունես համակարգիչ և կապ, կարող ես կարդալ Հարվարդի համալսարանի գրադարանի հոդվածը։ Գտնել բժշկական տեղեկություն, որը նախկինում միայն բժիշկներին էր հայտնի։ Իրական ժամանակում կարդալ աշխարհի ցանկացած երկրի նորությունները։ Ստանալ գրեթե ցանկացած բանի վերանորոգման հրահանգներ։ Դրա համար պետք չեն գումար, կապեր կամ հատուկ կրթություն, միայն ինտերնետ հասանելիություն։\n\nՎեբը ոչնչացրեց գիտելիքի աշխարհագրությունը։ Կիևում գտնվող գիտնականը կարդում է նույն գիտական preprint-ը, ինչ Քեմբրիջում գտնվող գիտնականը՝ միաժամանակ, հրապարակումից րոպեներ անց։ Ինտերնետից առաջ դա ֆիզիկապես անհնար էր. preprint-ը պետք էր տպել, փոստով ուղարկել, շաբաթներով սպասել։ Դա արագացրեց գիտությունը, կրթությունը, լրագրությունը։\n\nՎեբը ստեղծեց նոր համայնքներ, որոնք նախկինում չէին կարող գոյություն ունենալ։ Մարդիկ, որոնք հազվագյուտ հետաքրքրություններ ունեն, գտան իրար. տարբեր երկրներից քիչ հայտնի երաժշտական ժանրի սիրահարներ։ Հազվագյուտ հիվանդություններով հիվանդներ, որոնցից մեկ քաղաքում գուցե միայն տասը մարդ լինի։ Որոշակի լեզվի ծրագրավորողներ, պատրաստ օգնել անվճար մոլորակի մյուս ծայրում գտնվող անծանոթին։ Նախկինում նրանք անտեսանելի էին՝ թե՛ հասարակության, թե՛ միմյանց համար։ Վեբը նրանց դարձրեց համայնք։\n\n## Որտեղ Web1-ը սայթաքեց\n\nԲայց Web1-ը ուներ հիմնարար սահմանափակում, որը որոշեց այն ամենը, ինչ տեղի ունեցավ հետո։ Կարդալ կարող էր ցանկացածը։ Հրապարակելը՝ ոչ։\n\n1996-ին կայք ստեղծելու համար պետք էր իմանալ HTML, հասկանալ հոսթինգը և FTP-ն, և տիրապետել դոմենային անուններին։ Ծրագրավորողի համար սա փոքր խոչընդոտ էր։ Դպրոցական ուսուցչի, տնային տնտեսուհու կամ թոշակառուի համար՝ անհաղթահարելի։ Ինտերնետը սպառման ժողովրդավարություն էր, բայց ոչ արտադրության ժողովրդավարություն։ Միլիոնները կարդում էին։ Հազարները գրում էին։\n\nՍա ստեղծեց թաքնված հակասություն։ Web1-ը խոստանում էր հորիզոնական, բաց ինտերնետ՝ առանց դարպասապահների։ Բայց գործնականում դարպասապահները ոչ թե անհետացան, այլ պարզապես փոխեցին մասնագիտությունը։ Թերթերի խմբագիրների փոխարեն կային վեբ-մշակողներ։ Հեռուստատեսային պրոդյուսերների փոխարեն՝ սերվերների սեփականատերեր։ Ձայնը շարունակում էր պատկանել նրանց, ովքեր տեխնիկական գիտելիքներ ունեին։\n\nԷլի Փարիզերը արձանագրեց ևս մեկ խնդիր, որը մի փոքր ավելի ուշ ի հայտ եկավ։ Երբ որոնման ալգորիթմները սկսեցին հաշվի առնել հարցումների պատմությունը, տեղեկատվական տարածքը այլևս ընդհանուր չեղավ։ Յուրաքանչյուրը սկսեց տեսնել ինտերնետի իր տարբերակը։ Փարիզերը դա անվանեց «ֆիլտրերի պղպջակ»։ Web1-ը խոստանում էր. բոլորը մուտք ունեն ամբողջ տեղեկատվությանը։ Գործնականում՝ ալգորիթմն է որոշում, թե որ տեղեկատվությունն է քոնը։\n\n> Web1-ը անհավատալի ձեռքբերում էր։ Բայց այն անպատասխան թողեց գլխավոր հարցը՝ ինչպե՞ս ենք ձայն տալիս բոլորին, ոչ միայն նրանց, ովքեր տեխնիկական գիտելիքներ ունեն։\n\nԱյս հարցի պատասխանը եկավ Web2-ի տեսքով՝ հարթակներ, որոնք հեռացրին տեխնիկական խոչընդոտը և ձայն տվեցին յուրաքանչյուրին։ Բայց այդ պատասխանը ուներ թաքնված գին, որը ոչ ոք չէր կարդացել օգտագործողի համաձայնագրում։", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosi ւնը քանդում է ընդհանուր տեղեկատվական տարածքը։", "body": "## Անտեսանելի միջնորդը\n\n2000-ականների սկզբին տեղի ունեցավ մի բան, որը գրեթե ոչ ոք չնկատեց այն պահին, երբ այն ի հայտ եկավ։ Google-ը սկսեց որոնման պատմությունը հաշվի առնել արդյունքները ձևավորելիս։ Եթե հաճախ որոնում ես որոշակի քաղաքական ուղղվածության լուրեր, Google-ը սկսում է քեզ ավելի շատ նման լուրեր ցույց տալ։ Եթե սեղմում ես որոշակի տեսակի բովանդակության վրա, ալգորիթմը դա հիշում է և հարմարեցնում արդյունքները։\n\nՍա հարմար է թվում։ Եվ կարճաժամկետում՝ իսկապես ավելի հարմար է։ Դու ստանում ես այն, ինչը, ըստ ալգորիթմի, քեզ դուր կգա։ Ավելի քիչ անկապ նյութ, ավելի շատ հետաքրքիր բաներ։\n\nԲայց Էլի Փարիզերը իր *The Filter Bubble* ուսումնասիրության մեջ արձանագրեց այս հարմարության թաքնված գինը։ Նա պարզ փորձ կատարեց. խնդրեց իր մի քանի ընկերների միաժամանակ Google-ում որոնել «Եգիպտոս» բառը. դա տեղի էր ունենում 2011 թվականի Արաբական գարնան գագաթնակետին։ Արդյունքները կտրուկ տարբեր էին։ Մեկը ստացավ հեղափոխության և բողոքի ակցիաների մասին լուրեր։ Մյուսը՝ ճանապարհորդական խորհուրդներ և տեսարժան վայրեր։ Երրորդը՝ երկրի տնտեսության մասին գործարար լուրեր։\n\nՆույն բառը։ Նույն ժամանակը։ Բոլորովին այլ իրականություն։\n\n## Ինչն է կորչում փուչիկի մեջ\n\nՍա պարզապես անհարմարություն չէ։ Սա «ընդհանուր տեղեկատվական տարածք» հասկացության հիմնարար փոփոխություն է։\n\nԺողովրդավարությունը ենթադրում է, որ քաղաքացիները ունեն առնվազն հիմնական ընդհանուր փաստերի հավաքածու։ Նրանք կարող են չհամաձայնվել արժեքների և առաջնահերթությունների շուրջ, բայց պետք է համաձայն լինեն իրականության վերաբերյալ։ Որ սա ու այն է տեղի ունեցել։ Որ այսինչ խնդիրը գոյություն ունի։ Որ այս թիվը փաստ է։\n\nՖիլտրային փուչիկը քանդում է այդ ընդհանուր տարածքը։ Ալգորիթմը յուրաքանչյուրին ցույց է տալիս այն, ինչը ամենաշատ ներգրավվածություն է առաջացնում, այսինքն՝ այն, ինչը հաստատում է արդեն գոյություն ունեցող համոզմունքները և ուժեղացնում արդեն գոյություն ունեցող զգացմունքները։ Արդյունքում նույն քաղաքում ապրող մարդիկ կարող են ունենալ իրականության արմատապես տարբեր պատկերներ։ Ոչ թե որովհետև նրանք հիմար են կամ չարամիտ, այլ որովհետև ալգորիթմը բառացիորեն նրանց տարբեր աշխարհներ է ցույց տվել։\n\nԿարևոր է հասկանալ սա. դա սկսվել էր արդեն Web1-ի դարաշրջանում, առաջին անհատականացված որոնման արդյունքներով։ Սոցիալական ցանցերը պարզապես այս մեխանիզմը հասցրին իր սահմանին։\n\nWeb1-ը խոստանում էր. բոլորն ունեն հավասար հասանելիություն ամբողջ տեղեկատվությանը։ Դա ճիշտ էր տեխնիկապես։ Բայց ալգորիթմը որոշում էր, թե որ տեղեկատվությունն է «քոնը»։ Եվ դա պարզվեց ավելի կարևոր, քան տեխնիկական հավասար հասանելիությունը։\n\n> Web1-ը ստեղծեց ընդհանուր տեղեկատվական տարածք։ Անհատականացման առաջին ալգորիթմները սկսեցին այն քանդել՝ դեռևս սոցիալական ցանցերի ի հայտ գալուց առաջ։\n\nՓարիզերը դրա մասին գրել է 2011 թվականին՝ արդեն Web2-ի դարաշրջանում։ Բայց խնդրի արմատները գնում են դեպի Web1։ Երբ ալգորիթմն ունի «ցույց տալ քեզ այն, ինչ քեզ դուր կգա» նպատակ, այն անխուսափելիորեն սկսում է նեղացնել քո տեղեկատվական տարածքը։ Սկզբում՝ աննկատ։ Հետո՝ հիմնարար կերպով։ Սա bug չէ, այլ անհատականացման գաղափարի հենց ինքնին բխող ճարտարապետական հետևանք։", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D const LANGS = ["ru", "en", "uk", "kk", "uz", "es", "fr", "hy"];
const LANG_LABELS = {"ru": "RU", "en": "EN", "uk": "UK", "kk": "KK", "uz": "UZ", "es": "ES", "fr": "FR", "hy": "HY"};
let CURRENT_LANG = 'ru';
function pickLang(l){ return LANGS.indexOf(l)>=0 ? l : 'ru'; }
function applyLang(l){
  l = pickLang(l); CURRENT_LANG = l;
  const src = CHAPTER_I18N[l];
  // подменяем содержимое рабочего CHAPTER_DATA
  CHAPTER_DATA.chapter.title = src.chapter.title;
  CHAPTER_DATA.chapter.lede = src.chapter.lede;
  CHAPTER_DATA.chapter.centralIdea = src.chapter.centralIdea;
  CHAPTER_DATA.lenses.forEach((ls,i)=>{ ls.label=src.lenses[i].label; ls.description=src.lenses[i].description; });
  CHAPTER_DATA.nodes.forEach((n,i)=>{ const s=src.nodes[i];
    n.shortTitle=s.shortTitle; n.era=s.era; n.title=s.title; n.insight=s.insight;
    n.thesis=s.thesis; n.body=s.body; n.tags=s.tags; });
  CHAPTER_DATA.edges.forEach((e,i)=>{ e.label=src.edges[i].label; });
  // UI-строки
  const _U = UI_I18N[l] || UI_I18N.ru; const _R = UI_I18N.ru || {};
  const U = {}; Object.keys(_R).forEach(k=>{ U[k] = (_U[k] && String(_U[k]).trim()) ? _U[k] : _R[k]; });
  document.documentElement.lang = l;
  const t=document.getElementById('app-title'); if(t) t.textContent=src.chapter.title;
  const ld=document.querySelector('.chapter-lede'); if(ld) ld.textContent=src.chapter.lede;
  document.querySelectorAll('[data-ui]').forEach(el=>{ const k=el.getAttribute('data-ui'); if(U[k]) el.textContent=U[k]; });
  // локализованный typeLabel + перестройка линз (иначе останутся на языке сборки)
  window.__UI_LOC = U;
  try{ buildLenses(); setLens(state.lens); }catch(e){}
  // перерисовать карту/деталь/прогресс
  try{ renderAll(); }catch(e){}
  // отметить активную кнопку языка
  document.querySelectorAll('.lang-btn').forEach(b=>b.setAttribute('aria-pressed', b.getAttribute('data-lang')===l ? 'true':'false'));
}
function buildLangSwitcher(){
  const rail=document.querySelector('.rail'); if(!rail) return;
  const wrap=document.createElement('div'); wrap.className='lang-switch';
  LANGS.forEach(l=>{ const b=document.createElement('button'); b.className='lang-btn'; b.type='button';
    b.setAttribute('data-lang',l); b.textContent=LANG_LABELS[l];
    b.addEventListener('click',()=>applyLang(l)); wrap.appendChild(b); });
  rail.insertBefore(wrap, rail.firstChild);
}


window.addEventListener("message",function(ev){try{var d=ev.data||{};if(d.lang){applyLang(d.lang);}}catch(e){}});
async function boot(){buildLangSwitcher();var _q=new URLSearchParams(location.search).get("lang");var _h=(location.hash.match(/[?&]lang=([a-z]{2})/)||[])[1];var _lp=_q||_h;if(_lp)CURRENT_LANG=pickLang(_lp);buildLenses();setLens(state.lens);applyLang(CURRENT_LANG);}
document.addEventListener("DOMContentLoaded",()=>{try{boot();}catch(e){renderEmptyState("Ошибка инициализации: "+e.message);}});
</script>
