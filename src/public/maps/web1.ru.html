Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["community", "social-graph", "web", "history"], "x": 500.0, "y": 745.0, "angDeg": 90.0}, {"id": "verdict", "sceneIndex": 4, "type": "power", "shortTitle": "Итог Web1", "era": "≈2000", "lensWeight": {"chronology": 4, "openness": 4, "community": 3, "media": 4, "control": 3}, "title": "Что Web1 выполнил — и где споткнулся", "insight": "Web1 демократизировал потребление информации, но не производство — и это противоречие породило Web2 с его платформами для всех.", "thesis": "Web1 демократизировал потребление информации, но не производство — и это противоречие породило Web2 с его платформами для всех.", "body": "## Реальные достижения, которые легко забыть\n\nК концу 1990-х Web1 сделал несколько вещей, которые двадцать лет назад казались невозможными. Легко забыть об этом, потому что сейчас всё это само собой разумеется. Но стоит остановиться и оценить масштаб.\n\nВеб демократизировал доступ к информации в беспрецедентном масштабе. Если у тебя есть компьютер и подключение — ты можешь прочитать статью из университетской библиотеки Гарварда. Найти медицинскую информацию, которую раньше знали только врачи. Прочитать новости из любой страны мира в режиме реального времени. Получить инструкцию по ремонту чего угодно. Для этого не нужны деньги, связи или специальное образование — только доступ в интернет.\n\nВеб уничтожил географию знания. Учёный в Киеве читает тот же научный препринт, что учёный в Кембридже — одновременно, через минуты после публикации. До интернета это было невозможно физически: препринт нужно было напечатать, отправить почтой, ждать неделями. Это ускорило науку, образование, журналистику.\n\nВеб создал новые сообщества, которые раньше не могли существовать. Люди с редкими интересами нашли друг друга: любители малоизвестного жанра музыки из разных стран. Пациенты с редкими заболеваниями, которых в одном городе может быть десять человек. Программисты конкретного языка, готовые помочь бесплатно незнакомцу на другом конце планеты. Раньше они были невидимы — для общества и друг для друга. Веб сделал их сообществом.\n\n## Где Web1 споткнулся\n\nНо у Web1 было фундаментальное ограничение, которое определило всё, что произошло дальше. Читать мог любой. Публиковать — нет.\n\nЧтобы создать сайт в 1996 году, нужно было знать HTML, разбираться в хостинге и FTP, понимать доменные имена. Для программиста — небольшой барьер. Для школьного учителя, домохозяйки или пенсионера — непреодолимый. Интернет был демократией потребления, но не демократией производства. Миллионы читали. Тысячи писали.\n\nЭто создавало скрытое противоречие. Web1 обещал горизонтальный, открытый интернет без привратников. Но на практике привратники никуда не делись — просто изменили профессию. Вместо редакторов газет — веб-разработчики. Вместо телевизионных продюсеров — владельцы серверов. Голос по-прежнему принадлежал тем, у кого были технические знания.\n\nЭли Паризер зафиксировал ещё одну проблему, проявившуюся чуть позже. Как только поисковые алгоритмы начали учитывать историю запросов — информационное пространство перестало быть общим. Каждый начинал видеть свою версию интернета. Паризер назвал это «фильтровым пузырём». Web1 обещал: все имеют доступ ко всей информации. На практике: алгоритм решает, какая информация твоя.\n\n> Web1 был невероятным достижением. Но он оставил нерешённым главный вопрос: как дать голос всем, а не только тем, у кого есть технические знания?\n\nОтвет на этот вопрос пришёл в виде Web2 — платформ, которые убрали технический барьер и дали голос каждому. Но у этого ответа оказалась скрытая цена, которую никто не читал в пользовательском соглашении.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["web", "history", "information", "media"], "x": 240.2, "y": 595.0, "angDeg": 150.0}, {"id": "filter", "sceneIndex": 5, "type": "power", "shortTitle": "Фильтр-пузырь", "era": "нач. 2000-х", "lensWeight": {"chronology": 5, "openness": 1, "community": 1, "media": 4, "control": 5}, "title": "Фильтровый пузырь: когда алгоритм решает за тебя", "insight": "Фильтровый пузырь начался не с Facebook — а с первых персонализированных поисковых алгоритмов. Удобство персонализации разрушает общее информационное пространство.", "thesis": "Фильтровый пузырь начался не с Facebook — а с первых персонализированных поисковых алгоритмов. Удобство персонализации разрушает общее информационное пространство.", "body": "## Невидимый посредник\n\nВ начале 2000-х произошло кое-что, чего почти никто не заметил в момент появления. Google начал учитывать историю поиска при формировании результатов. Если ты часто ищешь новости определённой политической направленности — Google начинает показывать тебе больше таких новостей. Если ты кликаешь на определённый тип контента — алгоритм запоминает это и корректирует выдачу.\n\nЗвучит удобно. И в краткосрочной перспективе — действительно удобнее. Ты получаешь то, что, по мнению алгоритма, тебе понравится. Меньше нерелевантного, больше интересного.\n\nНо Эли Паризер в своём исследовании «The Filter Bubble» зафиксировал скрытую цену этого удобства. Он провёл простой эксперимент: попросил нескольких своих друзей одновременно погуглить слово «Египет» — это было в разгар Арабской весны в 2011 году. Результаты были разительно разными. Один получил новости о революции и протестах. Другой — туристические советы и достопримечательности. Третий — деловые новости об экономике страны.\n\nОдно и то же слово. Одно и то же время. Совершенно разная реальность.\n\n## Что теряется в пузыре\n\nЭто не просто неудобство. Это фундаментальное изменение того, что такое «общее информационное пространство».\n\nДемократия предполагает, что граждане имеют хотя бы базовый общий набор фактов. Они могут не соглашаться в ценностях и приоритетах — но они должны соглашаться в реальности. Что произошло то-то и то-то. Что существует такая-то проблема. Что вот эта цифра — факт.\n\nФильтровый пузырь разрушает это общее пространство. Алгоритм показывает каждому то, что вызывает наибольшее вовлечение — то есть то, что подтверждает уже существующие убеждения и усиливает уже существующие эмоции. В результате люди, живущие в одном городе, могут иметь принципиально разные картины реальности. Не потому что они глупые или злонамеренные — а потому что алгоритм буквально показывал им разный мир.\n\nВажно понять: это началось уже в эпоху Web1, с первыми персонализированными поисковыми выдачами. Социальные сети просто довели этот механизм до предела.\n\nWeb1 обещал: все имеют равный доступ ко всей информации. Это было правдой — технически. Но алгоритм решал, какая информация «твоя». И это оказалось важнее технической равнодоступности.\n\n> Web1 создал общее информационное пространство. Первые алгоритмы персонализации начали его разрушать — ещё до появления социальных сетей.\n\nПаризер написал об этом в 2011 году — уже в эпоху Web2. Но корни проблемы уходят в Web1. Как только у алгоритма появляется цель «показывать тебе то, что тебе понравится» — он неизбежно начинает сужать твоё информационное пространство. Сначала незаметно. Потом — принципиально. Это не баг, это архитектурное следствие самой идеи персонализации.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["algorithms", "information", "media", "web"], "x": 240.2, "y": 295.0, "angDeg": 210.0}], "edges": [{"from": "nelson", "to": "read", "label": "мечта стала витриной", "lenses": ["chronology", "openness", "media"]}, {"from": "nelson", "to": "ethic", "label": "идея нуждалась в людях", "lenses": ["openness"]}, {"from": "ethic", "to": "read", "label": "открытость сделала веб доступным", "lenses": ["openness", "media"]}, {"from": "ethic", "to": "community", "label": "этика собрала первые сообщества", "lenses": ["openness", "community"]}, {"from": "read", "to": "community", "label": "у читателей появился голос", "lenses": ["community", "media"]}, {"from": "read", "to": "verdict", "label": "потребление демократизировано", "lenses": ["media", "chronology"]}, {"from": "community", "to": "verdict", "label": "связи оказались хрупки", "lenses": ["community"]}, {"from": "verdict", "to": "filter", "label": "нет производства — нужен посредник", "lenses": ["chronology", "control", "media"]}, {"from": "ethic", "to": "filter", "label": "открытость позволила её закрыть", "lenses": ["control", "openness"]}, {"from": "nelson", "to": "filter", "label": "от свободной ссылки к ранжированию", "lenses": ["control"]}]}, "en": {"chapter": {"key": "web1", "title": "The reading internet", "lede": "How openness created the internet, and how that same openness made it possible to close it.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=web1", "centralIdea": "Openness created the internet, and made it possible to close it", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Chronology", "accent": "#7dd3fc", "description": "1965 → 2004: from Nelson’s word “hypertext” to the first filter bubbles."}, {"id": "openness", "label": "Openness", "accent": "#34d399", "description": "Hypertext given away for free, hacker ethics, and freedom of knowledge as the foundation of the Web."}, {"id": "community", "label": "Community", "accent": "#c084fc", "description": "The first virtual communities: whether online friendship is possible and why it is fragile."}, {"id": "media", "label": "Media", "accent": "#fbbf24", "description": "“You read, they publish”: democracy of consumption without the right to produce."}, {"id": "control", "label": "Control", "accent": "#f87171", "description": "Where the invisible intermediary is born: the algorithm that decides for you."}], "nodes": [{"id": "nelson", "sceneIndex": 0, "type": "technology", "shortTitle": "Hypertext", "era": "1965→1991", "lensWeight": {"chronology": 5, "openness": 5, "community": 2, "media": 3, "control": 1}, "title": "Nelson and the Dream of Hypertext", "insight": "Nelson invented hypertext in 1965, Berners-Lee implemented it in 1991 and gave it to everyone for free; that decision defined the nature of the open internet.", "thesis": "Nelson invented hypertext in 1965, Berners-Lee implemented it in 1991 and gave it to everyone for free; that decision defined the nature of the open internet.", "body": "## The Word That Changed the World\n\nIn 1965, a young American programmer named Ted Nelson coined a word that would change the world, although no one knew it at the time. The word was \"hypertext.\" Nelson did not simply invent a term; he described a completely new way of organizing knowledge.\n\nImagine an ordinary library. Thousands of books stand on shelves in alphabetical or thematic order. You want to understand the theory of relativity, so you take Einstein's book and read it. You encounter a reference to Lorentz's work, so you go look for it in the catalog, find it on the shelf, and come back. Then there is a reference to Poincare, and it is back to the catalog again. The knowledge exists, but it is cut into pieces and sorted into boxes. The connections between ideas live only in the reader's head.\n\nNelson imagined a library arranged in a fundamentally different way: as a living network of connections. You read an article about Copernicus and, with a single movement, move to the text he quoted. Then to criticism of his theory by his contemporaries. Then to a map of the starry sky from his era. Not linearly, page after page, but by meaning, following thought itself as it flows through a researcher's mind.\n\nHe called this project Xanadu, after the mythical palace of Kublai Khan, a place of endless beauty and knowledge. Nelson devoted his entire life to Xanadu. The project was never completed. But the idea proved immortal.\n\n## The Idea Another Person Picked Up\n\nXanadu failed as a product, but won as a concept. In 1989, the British programmer Tim Berners-Lee, who worked at the CERN nuclear research center in Geneva, wrote an internal proposal for management. The essence was to create a system where all documents were linked and accessible from any computer on the network.\n\nHis boss, Mike Sendall, wrote three words in the margin: \"Vague, but exciting.\" It was the most modest review of an invention that would change everything.\n\nOver three years, Berners-Lee wrote HTML, HTTP, and URL, the three technologies on which the entire modern web stands. Documents are stored on servers, have addresses, are connected by links, and open through a browser. Nelson's dream of hypertext finally received a simple technical implementation.\n\nBut the most important decision was not technical. Berners-Lee could have patented the Web and become the richest person on the planet. Instead, he gave everything away for free, without licenses, without conditions. \"If the technology had been proprietary, and in my total control, it would probably not have taken off,\" he explained in the book \"Weaving the Web.\" Openness was a strategy, not altruism: only without barriers could the network grow to global scale.\n\n> Nelson invented hypertext in 1965. Berners-Lee implemented it in 1991 and gave it to everyone for free. Twenty-six years passed between the idea and its realization, and one principled decision.\n\nIn 1993, the Mosaic browser appeared: the first to show text and images together. The internet became visual and understandable without technical education. That same year, the number of websites passed five hundred. Two years later, it was two hundred thousand. The race had begun.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["web", "history", "hypertext", "open source"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "read", "sceneIndex": 1, "type": "media", "shortTitle": "You read", "era": "1991→2004", "lensWeight": {"chronology": 5, "openness": 3, "community": 2, "media": 5, "control": 2}, "title": "The Reading Internet: You Read, They Publish", "insight": "Web1 was a democracy of consumption without algorithmic intermediaries, and that is its greatest virtue, one we understood only after losing it.", "thesis": "Web1 was a democracy of consumption without algorithmic intermediaries, and that is its greatest virtue, one we understood only after losing it.", "body": "## What Web1 Is, and Why It Matters to Understand It\n\nWeb1 is the internet from roughly 1991 to 2004. If you describe it in one phrase: you read, they publish.\n\nSites were static pages. A company, university, editorial office, or enthusiast created content and placed it on the network. Everyone else came and read it. No comments. No likes. No ability to reply or add your own. The internet was a huge library that updated slowly and unevenly.\n\nAt first glance, that sounds like a limitation. But this model had its own beauty, one we lost and now miss: there was no intermediary between you and information. No algorithm deciding what to show you. You typed an address and got a page. The exact one you wanted. Not a \"personalized version\" of the page. Not \"content similar to what you watched before.\" Just the page.\n\nSearch looked different too. Early Yahoo, one of the first popular catalogs of sites, was compiled manually by living people. Editors reviewed sites and distributed them into categories. It was a slow, imperfect, human process. But it had no hidden motives. No algorithm tried to keep you on the site longer than necessary. There was no monetization of attention. There was no targeted advertising.\n\n## Information Flows Were Transparent\n\nThis feature of Web1 is easy to underestimate until you compare it with what came after. Information flows were simple and visible. You knew where information came from. You could evaluate the source. You decided for yourself what to read and how much time to spend.\n\nJ. C. R. Licklider dreamed of a \"Galactic Network\" back in 1960: a global network where people from anywhere in the world could access data and programs. In his vision, the computer and the human form a symbiosis: the machine takes on routine information processing, while the human handles creative thinking. Together they are capable of what neither could do alone.\n\nWeb1 realized this dream in its simplest form. The computer as access to knowledge. The human as the one who decides what to do with that knowledge. No intermediaries between them.\n\nIn 2002, David Weinberger described the philosophical dimension of this in the book \"Small Pieces Loosely Joined.\" In the physical world, space is a constraint: a document can lie in only one place, a book belongs to only one section. On the Web, a document can be connected to a thousand other documents at the same time. One page exists in an infinite number of contexts. This is \"hyperlink thinking\": the ability to see connections where there used to be walls.\n\n> Web1 was a democracy of consumption: anyone could read anything. But it was not a democracy of production: only those with technical knowledge could publish.\n\nThis limitation became the reason for the next step. Millions of people read, and wanted to speak. They wanted to add their own. To respond. To create. And when technology finally made that simple, the internet changed forever.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["web", "history", "information", "media"], "x": 759.8, "y": 295.0, "angDeg": -30.0}, {"id": "ethic", "sceneIndex": 2, "type": "technology", "shortTitle": "Hacker ethics", "era": "1984→", "lensWeight": {"chronology": 3, "openness": 5, "community": 4, "media": 1, "control": 2}, "title": "Hacker Ethics: Openness as a Virtue", "insight": "Hacker ethics — openness, decentralization, freedom of knowledge — created the open internet. That very openness later allowed platforms to close it.", "thesis": "Hacker ethics — openness, decentralization, freedom of knowledge — created the open internet. That very openness later allowed platforms to close it.", "body": "## The People Who Built the Internet for Free\n\nTo understand the spirit of Web1, you need to understand the people who created it. They were not entrepreneurs searching for a business model. They were hackers, in the original sense of the word, not the criminal one. People who take systems apart to understand how they work, improve them, and share the result.\n\nIn the book \"Hackers: Heroes of the Computer Revolution,\" Steven Levy described the culture that took shape at MIT and Stanford in the 1960s and 70s. It was a real subculture with its own ethics and values. Information should be free, because knowledge, unlike physical things, does not diminish when copied. Decentralization is better than centralization, because no one should have power over what everyone has access to. Judge people by their code, not by their diplomas, because in the digital world what matters is what you create, not who you are on paper.\n\nThis ethic sounds naive in the era of multibillion-dollar technology companies. But it was precisely this ethic that defined the architecture of the early internet. Precisely because the first builders of the network believed in openness, we got open protocols, free browsers, and a web accessible to everyone.\n\n## Stallman and the Free Software Movement\n\nRichard Stallman pushed hacker ethics to its philosophical limit. In 1985, he wrote the \"GNU Manifesto,\" the programmatic document of the free software movement.\n\nHis argument was simple: program code is knowledge. Knowledge cannot be anyone's property, because copying it takes nothing away from the original. If you share an idea with me, it does not disappear from you. Now both of us have it. So limiting the spread of knowledge through copyright on code is an artificial and unjust act that contradicts the nature of information.\n\nStallman did not just write a manifesto; he began building an alternative. GNU is an operating system made entirely of free software. In 1991, the Finnish student Linus Torvalds added the Linux kernel to it, producing the operating system used today by most servers in the world, all Android smartphones, and supercomputers.\n\nFrom the same philosophy grew Apache, the server software that powered much of the early internet, Mozilla Firefox, and Wikipedia. All of these are products of a culture where sharing matters more than owning. Where creating and giving away is not weakness, but principle.\n\nWhat is now called \"open source\" is not simply a development model. It is the ideological legacy of the hacker ethics of the 1960s, which still defines a significant part of the world's technological infrastructure.\n\n> Hacker ethics made the internet open not because it was more profitable, but because it was right. These are different motivations, and they create different results.\n\nThe paradox is that this very openness made it possible for companies to emerge that later closed the internet. Google stands on the open protocols of the Web. Facebook stands on the open internet. They used open infrastructure and built closed platforms on top of it. Hacker ethics created a world that later played by different rules.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["open source", "history", "web", "community"], "x": 759.8, "y": 595.0, "angDeg": 30.0}, {"id": "community", "sceneIndex": 3, "type": "privacy", "shortTitle": "Communities", "era": "1993", "lensWeight": {"chronology": 4, "openness": 3, "community": 5, "media": 2, "control": 1}, "title": "First communities: can you be friends online?", "insight": "Rheingold proved that online communities are real. But they are fragile — they work at small scale and break down when they grow without shared norms.", "thesis": "Rheingold proved that online communities are real. But they are fragile — they work at small scale and break down when they grow without shared norms.", "body": "## A question that seemed strange\n\nIn 1993, journalist and researcher Howard Rheingold published *The Virtual Community* — the first serious study of what happens to people when they begin communicating online. The question he asked seemed strange at the time: can a real human community emerge on the internet?\n\nToday it seems obvious — of course it can; we all live inside it. But in 1993 it was not obvious at all. Society was convinced that live communication was irreplaceable, that the network was a substitute, and that real relationships could not exist without physical presence.\n\nRheingold studied WELL — Whole Earth 'Lectronic Link, one of the first online networks, which existed even before the browser. Participants communicated through text terminals: you type text, press Enter, and wait for a reply. No photos, no video, no emoji. Only words on a black screen.\n\nAnd yet Rheingold saw something striking: WELL participants supported one another in difficult moments — illness, loss, crises. They shared knowledge with strangers they had never seen. They built reputation and trust over years of interaction. The network created a new kind of closeness — without geography, without physical space.\n\n## Fragility and scale\n\nRheingold's answer was cautiously optimistic: yes, real communities online are possible. But he also noticed something important about the nature of these communities — they are fragile.\n\nThe WELL community worked while there were relatively few participants — a few thousand people who knew one another at least by nickname. There were shared norms of behavior, unwritten rules, a sense of belonging. As the community grew, the quality of interaction changed. Too many strangers destroyed the atmosphere of trust.\n\nThis observation anticipated a problem that became critical two decades later: how do you scale a community while preserving its quality? How can Facebook, with two billion users, be a “community” if most participants will never meet and share no common norms?\n\nIn *Out of Control* (1994), Kevin Kelly described the internet as a living system — decentralized, without central control, evolving through the interaction of millions of participants. That sounded like good news. But Kelly missed one consequence of his own logic: living systems evolve toward the survival of the best adapted — not toward justice or human warmth.\n\nWhen companies with enormous resources entered the internet, they turned out to be the “best adapted.” And the system began to evolve in their direction.\n\n> Rheingold proved that real communities online are possible. But he also showed their fragility: a community works while it is small and has shared norms.\n\nThis observation is still relevant today. The best online communities are small, with a clear identity and rules. Large platforms kill communities by turning them into audiences. That is exactly why Web3 places its bet on tokens and DAO — tools that create formal mechanisms for maintaining norms at scale.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["community", "social graph", "web", "history"], "x": 500.0, "y": 745.0, "angDeg": 90.0}, {"id": "verdict", "sceneIndex": 4, "type": "power", "shortTitle": "Web1 outcome", "era": "≈2000", "lensWeight": {"chronology": 4, "openness": 4, "community": 3, "media": 4, "control": 3}, "title": "What Web1 achieved — and where it stumbled", "insight": "Web1 democratized the consumption of information, but not its production — and this contradiction gave rise to Web2 with its platforms for everyone.", "thesis": "Web1 democratized the consumption of information, but not its production — and this contradiction gave rise to Web2 with its platforms for everyone.", "body": "## Real achievements that are easy to forget\n\nBy the end of the 1990s, Web1 had done several things that had seemed impossible twenty years earlier. It is easy to forget this because today all of it feels self-evident. But it is worth pausing and appreciating the scale.\n\nThe web democratized access to information on an unprecedented scale. If you have a computer and a connection, you can read an article from Harvard's university library. Find medical information that previously only doctors knew. Read news from any country in the world in real time. Get instructions for repairing almost anything. You do not need money, connections, or special education for this — only internet access.\n\nThe web destroyed the geography of knowledge. A scientist in Kyiv reads the same scientific preprint as a scientist in Cambridge — at the same time, minutes after publication. Before the internet, this was physically impossible: a preprint had to be printed, mailed, and waited for weeks. This accelerated science, education, journalism.\n\nThe web created new communities that could not have existed before. People with rare interests found one another: fans of an obscure music genre from different countries. Patients with rare diseases, of whom there might be ten in a single city. Programmers of a particular language ready to help a stranger on the other side of the planet for free. Before, they were invisible — to society and to one another. The web made them a community.\n\n## Where Web1 stumbled\n\nBut Web1 had a fundamental limitation that shaped everything that happened next. Anyone could read. Publishing was another matter.\n\nTo create a website in 1996, you had to know HTML, understand hosting and FTP, and grasp domain names. For a programmer, this was a small barrier. For a schoolteacher, a homemaker, or a pensioner, it was insurmountable. The internet was a democracy of consumption, but not a democracy of production. Millions read. Thousands wrote.\n\nThis created a hidden contradiction. Web1 promised a horizontal, open internet without gatekeepers. But in practice the gatekeepers did not disappear — they simply changed professions. Instead of newspaper editors, there were web developers. Instead of television producers, server owners. The voice still belonged to those who had technical knowledge.\n\nEli Pariser captured another problem that appeared a little later. As soon as search algorithms began taking query history into account, the information space stopped being shared. Each person began to see their own version of the internet. Pariser called this the “filter bubble.” Web1 promised: everyone has access to all information. In practice: the algorithm decides which information is yours.\n\n> Web1 was an incredible achievement. But it left the main question unresolved: how do we give a voice to everyone, not only to those with technical knowledge?\n\nThe answer to this question arrived in the form of Web2 — platforms that removed the technical barrier and gave everyone a voice. But that answer came with a hidden price that no one read in the user agreement.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["web", "history", "information", "media"], "x": 240.2, "y": 595.0, "angDeg": 150.0}, {"id": "filter", "sceneIndex": 5, "type": "power", "shortTitle": "Filter bubble", "era": "early 2000s", "lensWeight": {"chronology": 5, "openness": 1, "community": 1, "media": 4, "control": 5}, "title": "The filter bubble: when the algorithm decides for you", "insight": "The filter bubble did not begin with Facebook — it began with the first personalized search algorithms. The convenience of personalization destroys the shared information space.", "thesis": "The filter bubble did not begin with Facebook — it began with the first personalized search algorithms. The convenience of personalization destroys the shared information space.", "body": "## The invisible intermediary\n\nIn the early 2000s, something happened that almost no one noticed at the moment it appeared. Google began using search history when shaping results. If you often search for news of a particular political leaning, Google starts showing you more of that news. If you click on a certain type of content, the algorithm remembers this and adjusts the results.\n\nIt sounds convenient. And in the short term, it really is more convenient. You get what the algorithm thinks you will like. Less irrelevant material, more interesting material.\n\nBut in his study *The Filter Bubble*, Eli Pariser recorded the hidden price of this convenience. He ran a simple experiment: he asked several of his friends to google the word “Egypt” at the same time — this was at the height of the Arab Spring in 2011. The results were strikingly different. One person got news about revolution and protests. Another got travel tips and sights. A third got business news about the country's economy.\n\nThe same word. The same time. Completely different reality.\n\n## What is lost inside the bubble\n\nThis is not just an inconvenience. It is a fundamental change in what a “shared information space” means.\n\nDemocracy assumes that citizens have at least a basic shared set of facts. They may disagree on values and priorities — but they must agree on reality. That this and that happened. That such and such a problem exists. That this number is a fact.\n\nThe filter bubble destroys this shared space. The algorithm shows each person what generates the most engagement — that is, what confirms existing beliefs and strengthens existing emotions. As a result, people living in the same city can have fundamentally different pictures of reality. Not because they are stupid or malicious — but because the algorithm literally showed them different worlds.\n\nIt is important to understand: this began already in the Web1 era, with the first personalized search results. Social networks simply pushed this mechanism to its limit.\n\nWeb1 promised: everyone has equal access to all information. This was true — technically. But the algorithm decided which information was “yours.” And that turned out to matter more than technical equal access.\n\n> Web1 created a shared information space. The first personalization algorithms began to destroy it — even before social networks appeared.\n\nPariser wrote about this in 2011 — already in the Web2 era. But the roots of the problem go back to Web1. As soon as an algorithm has the goal of “showing you what you will like,” it inevitably begins to narrow your information space. At first, invisibly. Then, fundamentally. This is not a bug; it is an architectural consequence of the very idea of personalization.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["algorithms", "information", "media", "web"], "x": 240.2, "y": 295.0, "angDeg": 210.0}], "edges": [{"from": "nelson", "to": "read", "label": "the dream became a showcase", "lenses": ["chronology", "openness", "media"]}, {"from": "nelson", "to": "ethic", "label": "the idea needed people", "lenses": ["openness"]}, {"from": "ethic", "to": "read", "label": "openness made the web accessible", "lenses": ["openness", "media"]}, {"from": "ethic", "to": "community", "label": "ethics gathered the first communities", "lenses": ["openness", "community"]}, {"from": "read", "to": "community", "label": "readers gained a voice", "lenses": ["community", "media"]}, {"from": "read", "to": "verdict", "label": "consumption is democratized", "lenses": ["media", "chronology"]}, {"from": "community", "to": "verdict", "label": "connections proved fragile", "lenses": ["community"]}, {"from": "verdict", "to": "filter", "label": "no production means an intermediary is needed", "lenses": ["chronology", "control", "media"]}, {"from": "ethic", "to": "filter", "label": "openness made it possible to close it", "lenses": ["control", "openness"]}, {"from": "nelson", "to": "filter", "label": "from free linking to ranking", "lenses": ["control"]}]}, "uk": {"chapter": {"key": "web1", "title": "Читаючий інтернет", "lede": "Як відкритість створила інтернет — і як та сама відкритість дозволила його закрити.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=web1", "centralIdea": "Відкритість створила інтернет — і дозволила його закрити", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Хронологія", "accent": "#7dd3fc", "description": "1965 → 2004: від слова «гіпертекст» Нельсона до перших фільтр-бульбашок."}, {"id": "openness", "label": "Відкритість", "accent": "#34d399", "description": "Гіпертекст, відданий даром, хакерська етика й свобода знання як фундамент Web."}, {"id": "community", "label": "Спільнота", "accent": "#c084fc", "description": "Перші віртуальні спільноти: чи можна дружити онлайн і чому це крихко."}, {"id": "media", "label": "Медіа", "accent": "#fbbf24", "description": "«Ти читаєш, вони публікують»: демократія споживання без права виробництва."}, {"id": "control", "label": "Контроль", "accent": "#f87171", "description": "Де народжується невидимий посередник — алгоритм, що вирішує за тебе."}], "nodes": [{"id": "nelson", "sceneIndex": 0, "type": "technology", "shortTitle": "Гіпертекст", "era": "1965→1991", "lensWeight": {"chronology": 5, "openness": 5, "community": 2, "media": 3, "control": 1}, "title": "Нельсон і мрія про гіпертекст", "insight": "Нельсон придумав гіпертекст у 1965-му, Бернерс-Лі реалізував його у 1991-му й віддав усім безкоштовно — це рішення визначило природу відкритого інтернету.", "thesis": "Нельсон придумав гіпертекст у 1965-му, Бернерс-Лі реалізував його у 1991-му й віддав усім безкоштовно — це рішення визначило природу відкритого інтернету.", "body": "## Слово, яке змінило світ\n\nУ 1965 році молодий американський програміст Тед Нельсон придумав слово, яке змінить світ, хоча тоді про це ніхто не знав. Це слово було «гіпертекст». Нельсон не просто вигадав термін, а описав цілком новий спосіб організації знання.\n\nУяви звичайну бібліотеку. Тисячі книжок стоять на полицях в алфавітному або тематичному порядку. Ти хочеш розібратися в теорії відносності, береш книжку Ейнштейна й читаєш. Натрапляєш на посилання на працю Лоренца, ідеш шукати її в каталозі, знаходиш на полиці, повертаєшся. Потім посилання на Пуанкаре, і знову до каталогу. Знання існує, але воно розрізане на шматки й розкладене по шухлядах. Зв'язки між ідеями живуть лише в голові читача.\n\nНельсон уявляв бібліотеку, влаштовану принципово інакше, як живу мережу зв'язків. Читаєш статтю про Коперника і одним рухом переходиш до тексту, який він цитував. Потім до критики його теорії сучасниками. Потім до карти зоряного неба його епохи. Не лінійно, сторінка за сторінкою, а за змістом, слідуючи самій думці, як вона тече в голові дослідника.\n\nВін назвав цей проєкт Xanadu, на честь міфічного палацу Кубла-хана, місця нескінченної краси й знання. Нельсон присвятив Xanadu все своє життя. Проєкт так і не був завершений. Але ідея виявилася безсмертною.\n\n## Ідея, яку підхопила інша людина\n\nXanadu провалився як продукт, але переміг як концепція. У 1989 році британський програміст Тім Бернерс-Лі, який працював у ядерному центрі CERN у Женеві, написав внутрішню заявку для керівництва. Суть: створити систему, де всі документи пов'язані посиланнями й доступні з будь-якого комп'ютера в мережі.\n\nЙого начальник Майк Сендалл написав на полях три слова: «Туманно, але цікаво». Це була найскромніша рецензія на винахід, який змінить усе.\n\nЗа три роки Бернерс-Лі написав HTML, HTTP і URL — три технології, на яких стоїть увесь сучасний веб. Документи зберігаються на серверах, мають адреси, пов'язані посиланнями й відкриваються через браузер. Мрія Нельсона про гіпертекст нарешті отримала просту технічну реалізацію.\n\nАле найважливіше рішення було не технічним. Бернерс-Лі міг запатентувати Web і стати найбагатшою людиною планети. Натомість він віддав усе безкоштовно, без ліцензій, без умов. «Якби Web був запатентований, його б не існувало», — пояснив він у книжці «Weaving the Web». Відкритість була стратегією, а не альтруїзмом: лише без бар'єрів мережа могла вирости до глобального масштабу.\n\n> Нельсон придумав гіпертекст у 1965-му. Бернерс-Лі реалізував його у 1991-му й віддав усім безкоштовно. Між ідеєю та її втіленням минуло двадцять шість років — і одне принципове рішення.\n\nУ 1993 році з'явився браузер Mosaic — перший, який показував текст і картинки разом. Інтернет став візуальним і зрозумілим без технічної освіти. Того ж року кількість сайтів перевалила за п'ятсот. Через два роки — двісті тисяч. Перегони почалися.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["Web", "історія", "гіпертекст", "відкритий код"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "read", "sceneIndex": 1, "type": "media", "shortTitle": "Ти читаєш", "era": "1991→2004", "lensWeight": {"chronology": 5, "openness": 3, "community": 2, "media": 5, "control": 2}, "title": "Інтернет для читання: ти читаєш, вони публікують", "insight": "Web1 був демократією споживання без посередників-алгоритмів — і це його головна перевага, яку ми усвідомили лише втративши.", "thesis": "Web1 був демократією споживання без посередників-алгоритмів — і це його головна перевага, яку ми усвідомили лише втративши.", "body": "## Що таке Web1 — і чому це важливо зрозуміти\n\nWeb1 — це інтернет приблизно з 1991 по 2004 рік. Якщо описати його однією фразою: ти читаєш, вони публікують.\n\nСайти були статичними сторінками. Компанія, університет, редакція або ентузіаст створювали контент і розміщували його в мережі. Усі інші приходили й читали. Жодних коментарів. Жодних лайків. Жодної можливості відповісти або додати своє. Інтернет був величезною бібліотекою, яка оновлювалася повільно й нерівномірно.\n\nНа перший погляд це звучить як обмеження. Але в цієї моделі була своя краса, яку ми втратили й тепер за нею сумуємо: між тобою та інформацією не було жодного посередника. Жодного алгоритму, який вирішував би, що тобі показати. Ти вводив адресу й отримував сторінку. Саме ту, яку хотів. Не «персоналізовану версію» сторінки. Не «контент, схожий на те, що ти дивився раніше». Просто сторінку.\n\nПошук виглядав інакше. Ранній Yahoo — один із перших популярних каталогів сайтів — складався вручну живими людьми. Редактори переглядали сайти й розподіляли їх за категоріями. Це був повільний, недосконалий, людський процес. Але в ньому не було прихованих мотивів. Жоден алгоритм не намагався втримати тебе на сайті довше, ніж потрібно. Не було монетизації уваги. Не було таргетованої реклами.\n\n## Інформаційні потоки були прозорими\n\nЦю особливість Web1 легко недооцінити, доки не порівняєш із тим, що прийшло після. Інформаційні потоки були простими й видимими. Ти знав, звідки береться інформація. Ти міг оцінити джерело. Ти сам вирішував, що читати і скільки часу витрачати.\n\nДж. К. Р. Ліклайдер ще у 1960 році мріяв про «Galactic Network» — глобальну мережу, де люди з будь-якої точки світу можуть отримати доступ до даних і програм. У його баченні комп'ютер і людина утворюють симбіоз: машина бере на себе рутинну обробку інформації, людина — творче мислення. Разом вони здатні на те, на що жоден із них не здатен поодинці.\n\nWeb1 реалізував цю мрію в найпростішій формі. Комп'ютер як доступ до знання. Людина як той, хто вирішує, що з цим знанням робити. Жодних посередників між ними.\n\nДевід Вайнбергер у 2002 році описав філософський вимір цього в книжці «Small Pieces Loosely Joined». У фізичному світі простір — це обмеження: документ може лежати лише в одному місці, книжка належить лише одному розділу. У Web документ може бути пов'язаний одночасно з тисячею інших документів. Одна сторінка існує в нескінченній кількості контекстів. Це «гіперпосилальне мислення» — здатність бачити зв'язки там, де раніше були стіни.\n\n> Web1 був демократією споживання: будь-хто міг читати що завгодно. Але не демократією виробництва: публікувати могли лише ті, хто мав технічні знання.\n\nЦе обмеження і стало причиною наступного кроку. Мільйони людей читали — і хотіли говорити. Хотіли додати своє. Відповісти. Створити. І коли технології нарешті дали змогу зробити це просто, інтернет змінився назавжди.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["Web", "історія", "інформація", "медіа"], "x": 759.8, "y": 295.0, "angDeg": -30.0}, {"id": "ethic", "sceneIndex": 2, "type": "technology", "shortTitle": "Хакерська етика", "era": "1984→", "lensWeight": {"chronology": 3, "openness": 5, "community": 4, "media": 1, "control": 2}, "title": "Хакерська етика: відкритість як чеснота", "insight": "Хакерська етика — відкритість, децентралізація, свобода знання — створила відкритий інтернет. Саме ця відкритість потім дозволила платформам його закрити.", "thesis": "Хакерська етика — відкритість, децентралізація, свобода знання — створила відкритий інтернет. Саме ця відкритість потім дозволила платформам його закрити.", "body": "## Люди, які будували інтернет безкоштовно\n\nЩоб зрозуміти дух Web1, потрібно зрозуміти людей, які його створювали. Це були не підприємці в пошуках бізнес-моделі. Це були хакери — у первісному значенні слова, а не в кримінальному. Люди, які розбирають системи, щоб зрозуміти, як вони працюють, поліпшити їх і поділитися результатом.\n\nСтівен Леві в книжці «Hackers: Heroes of the Computer Revolution» описав культуру, що сформувалася в MIT і Стенфорді в 1960–70-х. Це була справжня субкультура зі своєю етикою й цінностями. Інформація має бути вільною, бо знання, на відміну від фізичних речей, не зменшується під час копіювання. Децентралізація краща за централізацію, бо ніхто не повинен мати владу над тим, до чого мають доступ усі. Оцінюй людей за їхнім кодом, а не за дипломами, бо в цифровому світі важливо те, що ти створюєш, а не хто ти за паспортом.\n\nЦя етика звучить наївно в епоху багатомільярдних технологічних компаній. Але саме вона визначила архітектуру раннього інтернету. Саме тому, що перші будівничі мережі вірили у відкритість, ми отримали відкриті протоколи, безкоштовні браузери й доступний для всіх веб.\n\n## Столлман і рух вільного ПЗ\n\nРічард Столлман довів хакерську етику до філософської межі. У 1985 році він написав «GNU Маніфест» — програмний документ руху вільного програмного забезпечення.\n\nЙого аргумент був простим: програмний код — це знання. Знання не може бути чиєюсь власністю, бо його копіювання нічого не забирає в оригіналу. Якщо ти поділився зі мною ідеєю, у тебе вона не зникла. Тепер вона є в нас обох. Отже, обмежувати поширення знання через авторські права на код — це штучна й несправедлива дія, що суперечить природі інформації.\n\nСтоллман не просто написав маніфест — він почав будувати альтернативу. GNU — операційна система, повністю складена з вільного програмного забезпечення. У 1991 році фінський студент Лінус Торвальдс додав до неї ядро Linux — і вийшла операційна система, яку сьогодні використовують більшість серверів у світі, усі смартфони на Android і суперкомп'ютери.\n\nЗ тієї самої філософії виросли Apache (серверне ПЗ, на якому працювала значна частина раннього інтернету), Mozilla Firefox, Wikipedia. Усе це — продукти культури, де ділитися важливіше, ніж володіти. Де створювати й віддавати — це не слабкість, а принцип.\n\nТе, що сьогодні називають «open source», — це не просто модель розробки. Це ідеологічна спадщина хакерської етики 1960-х, яка досі визначає значну частину технологічної інфраструктури світу.\n\n> Хакерська етика створила інтернет відкритим не тому, що так було вигідніше, а тому, що так було правильно. Це різні мотивації — і вони створюють різні результати.\n\nПарадокс у тому, що саме ця відкритість уможливила появу компаній, які потім закрили інтернет. Google стоїть на відкритих протоколах Web. Facebook стоїть на відкритому інтернеті. Вони використали відкриту інфраструктуру й побудували на ній закриті платформи. Хакерська етика створила світ, який потім почав грати за іншими правилами.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {"title": "Тед Нельсон — Complex Information Processing (1965)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B5%D0%B4%20%D0%9D%D0%B5%D0%BB%D1%8C%D1%81%D0%BE%D0%BD%20%E2%80%94%20Complex%20Information%20Processing%20%281965%29", "linkType": "gbooks"}, {"title": "Дж. К. Р. Ликлайдер — Man-Computer Symbiosis (1960)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6.%20%D0%9A.%20%D0%A0.%20%D0%9B%D0%B8%D0%BA%D0%BB%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20Man-Computer%20Symbiosis%20%281960%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}, {"title": "Тим Бернерс-Ли — Information Management: A Proposal (1989)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Information%20Management%3A%20A%20Proposal%20%281989%29", "linkType": "gbooks"}, {"title": "Ричард Столлман — The GNU Manifesto (1985)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B8%D1%87%D0%B0%D1%80%D0%B4%20%D0%A1%D1%82%D0%BE%D0%BB%D0%BB%D0%BC%D0%B0%D0%BD%20%E2%80%94%20The%20GNU%20Manifesto%20%281985%29", "linkType": "gbooks"}, {"title": "Дэвид Вайнбергер — Small Pieces Loosely Joined (2002)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%92%D0%B0%D0%B9%D0%BD%D0%B1%D0%B5%D1%80%D0%B3%D0%B5%D1%80%20%E2%80%94%20Small%20Pieces%20Loosely%20Joined%20%282002%29", "linkType": "gbooks"}], "tags": ["відкритий код", "історія", "Web", "спільнота"], "x": 759.8, "y": 595.0, "angDeg": 30.0}, {"id": "community", "sceneIndex": 3, "type": "privacy", "shortTitle": "Спільноти", "era": "1993", "lensWeight": {"chronology": 4, "openness": 3, "community": 5, "media": 2, "control": 1}, "title": "Перші спільноти: чи можна дружити онлайн?", "insight": "Рейнгольд довів: онлайн-спільноти справжні. Але вони крихкі — працюють у малому масштабі й руйнуються під час зростання без спільних норм.", "thesis": "Рейнгольд довів: онлайн-спільноти справжні. Але вони крихкі — працюють у малому масштабі й руйнуються під час зростання без спільних норм.", "body": "## Питання, яке здавалося дивним\n\nУ 1993 році журналіст і дослідник Говард Рейнгольд опублікував книжку *The Virtual Community* — перше серйозне дослідження того, що відбувається з людьми, коли вони починають спілкуватися в мережі. Питання, яке він поставив, тоді здавалося дивним: чи може в інтернеті виникнути справжня людська спільнота?\n\nСьогодні це здається очевидним — звісно, може, ми всі в цьому живемо. Але в 1993 році це було зовсім не очевидно. Суспільство було переконане, що живе спілкування незамінне, що мережа — це сурогат, що справжніх стосунків без фізичної присутності не буває.\n\nРейнгольд вивчав WELL — Whole Earth 'Lectronic Link, одну з перших онлайн-мереж, що існувала ще до браузера. Учасники спілкувалися через текстові термінали: набираєш текст, натискаєш Enter, чекаєш відповіді. Жодних фотографій, жодного відео, жодних емодзі. Тільки слова на чорному екрані.\n\nІ все ж Рейнгольд побачив дещо вражаюче: учасники WELL підтримували одне одного у важкі моменти — хвороби, втрати, кризи. Ділилися знаннями з незнайомими людьми, яких ніколи не бачили. Вибудовували репутацію й довіру через роки взаємодії. Мережа створювала новий тип близькості — без географії, без фізичного простору.\n\n## Крихкість і масштаб\n\nВідповідь Рейнгольда була обережно оптимістичною: так, справжні спільноти в мережі можливі. Але він також помітив дещо важливе про природу цих спільнот — вони крихкі.\n\nСпільнота WELL працювала, доки учасників було небагато — кілька тисяч людей, які знали одне одного хоча б за ніком. Існували спільні норми поведінки, неписані правила, відчуття належності. Коли спільнота зростала, якість взаємодії змінювалася. Забагато незнайомців руйнували атмосферу довіри.\n\nЦе спостереження передбачило проблему, яка стала критичною через два десятиліття: як масштабувати спільноту, зберігаючи її якість? Як Facebook із двома мільярдами користувачів може бути «спільнотою», якщо більшість учасників ніколи не зустрінуться й не мають жодних спільних норм?\n\nКевін Келлі у книжці *Out of Control* (1994) описав інтернет як живу систему — децентралізовану, без центрального управління, таку, що еволюціонує через взаємодію мільйонів учасників. Це звучало як добра новина. Але Келлі пропустив один наслідок власної логіки: живі системи еволюціонують у бік виживання найпристосованіших — а не в бік справедливості чи людського тепла.\n\nКоли в інтернет прийшли компанії з величезними ресурсами, саме вони виявилися «найпристосованішими». І система почала еволюціонувати в їхній бік.\n\n> Рейнгольд довів: справжні спільноти в мережі можливі. Але він також показав їхню крихкість: спільнота працює, доки вона мала й має спільні норми.\n\nЦе спостереження актуальне й досі. Найкращі онлайн-спільноти — невеликі, з чіткою ідентичністю та правилами. Великі платформи вбивають спільноти, перетворюючи їх на аудиторії. Саме тому Web3 робить ставку на токени й DAO — інструменти, які створюють формальні механізми для підтримання норм у масштабі.", "sources": [{"title": "Тим Бернерс-Ли — Weaving the Web (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%20%E2%80%94%20Weaving%20the%20Web%20%281999%29", "linkType": "gbooks"}, {"title": "Стивен Леви — Hackers: Heroes of the Computer Revolution (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D0%B8%D0%B2%D0%B5%D0%BD%20%D0%9B%D0%B5%D0%B2%D0%B8%20%E2%80%94%20Hackers%3A%20Heroes%20of%20the%20Computer%20Revolution%20%281984%29", "linkType": "gbooks"}, {"title": "Говард Рейнгольд — The Virtual Community (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%BE%D0%B2%D0%B0%D1%80%D0%B4%20%D0%A0%D0%B5%D0%B9%D0%BD%D0%B3%D0%BE%D0%BB%D1%8C%D0%B4%20%E2%80%94%20The%20Virtual%20Community%20%281993%29", "linkType": "gbooks"}, {"title": "Кевин Келли — Out of Control (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20Out%20of%20Control%20%281994%29", "linkType": "gbooks"}, {
