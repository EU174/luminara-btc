le d’un même principe que Negroponte a formulé en trois mots.", "tags": ["économie", "bits", "échelle"], "lensWeight": {"chronology": 4, "power": 4, "technology": 3, "media": 3, "privacy": 1}, "angDeg": 110.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1995"}, {"id": "media-effects", "sceneIndex": 6, "x": 240.2, "y": 595.0, "type": "media", "title": "McLuhan et les virus de Rushkoff : les médias nous changent", "shortTitle": "Médias", "thesis": "Ce qui compte, ce n’est pas seulement l’information, mais aussi le médium qui reconfigure les comportements.", "insight": "McLuhan et Rushkoff ont compris que l'essentiel n'est pas l'information, mais le milieu par lequel elle passe. Les médias nous changent indépendamment du contenu, à travers une structure que nous ne voyons pas.", "body": "## Le support compte plus que le message\n\nMarshall McLuhan était un penseur encombrant. En 1964, il a écrit une formule d'abord prise pour une absurdité, puis pour une métaphore, et seulement plus tard comprise comme une description technique exacte de la réalité : « Le médium est le message ».\n\nQue voulait-il dire ? Quand la télévision de masse est apparue dans les années 1950, tout le monde débattait du contenu : bonnes ou mauvaises émissions, éducatives ou divertissantes, propagande ou art. McLuhan disait : c'est une question secondaire. La télévision elle-même - comme milieu, comme technologie, comme mode de perception - avait déjà changé la société, indépendamment de ce qui y était montré.\n\nPour la première fois dans l'histoire, la télévision a synchronisé des millions de personnes : les mêmes informations au même moment, dans les mêmes mots, dans toutes les maisons du pays en même temps. Elle a créé ce que McLuhan a appelé le « village global » - un monde où chacun vit le même événement au même moment. Avant la télévision, les habitants de villes différentes vivaient dans des réalités informationnelles différentes. Après, ils vivaient dans une seule.\n\n## La métaphore biologique de Rushkoff\n\nEn 1994, le théoricien américain des médias Douglas Rushkoff a ajouté à l'idée de McLuhan une métaphore biologique, et elle s'est révélée encore plus juste. Dans le livre *Media Virus!*, il a décrit le mécanisme qu'on appelle aujourd'hui le contenu viral, dix ans avant YouTube et vingt ans avant TikTok.\n\nLes idées se propagent comme des virus. Non parce qu'elles sont vraies. Non parce qu'elles sont utiles. Mais parce qu'elles touchent une vulnérabilité psychologique du public - ce qui pousse les gens à les relayer : la peur, l'indignation, l'enthousiasme, la reconnaissance, la colère, la tendresse. L'émotion est le mécanisme de réplication d'une idée.\n\nRushkoff a montré qu'un contenu qui déclenche une forte émotion se diffuse indépendamment de sa vérité ou de son utilité. Une nouvelle scandaleuse circule plus vite qu'une nouvelle vraie. Une histoire effrayante se répand plus vite qu'une histoire ennuyeuse. Ce n'est ni un hasard ni une manipulation - c'est une caractéristique structurelle du milieu médiatique. Un virus ne choisit pas son hôte selon le critère de « bonne ou mauvaise personne ». Il choisit selon le critère de « vulnérable ou non ».\n\nBien avant les algorithmes de TikTok, précisément optimisés pour cela, Rushkoff a décrit le principe sur lequel ils reposent. L'algorithme n'a pas créé la viralité. Il a simplement appris à l'amplifier.\n\n> McLuhan avertissait : ce qui compte n'est pas l'émission, mais le téléviseur. Rushkoff précisait : ce qui compte n'est pas l'idée, mais l'émotion qu'elle suscite. Ensemble, ils ont décrit l'architecture des réseaux sociaux modernes trente ans avant leur apparition.\n\nQuand internet est apparu, la première question portait à nouveau sur le contenu : qu'allait-on y lire et y regarder ? McLuhan aurait dit : mauvaise question. La bonne est : que fait à l'être humain le milieu même dans lequel il passe de plus en plus de temps ? Cette question est devenue cruciale avec l'apparition des réseaux sociaux. Malheureusement, elle a été posée trop tard.", "tags": ["médias", "comportement", "perception"], "lensWeight": {"chronology": 3, "power": 3, "technology": 1, "media": 5, "privacy": 2}, "angDeg": 150.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1964→années 1990"}, {"id": "cypherpunks", "sceneIndex": 7, "x": 204.6, "y": 392.9, "type": "privacy", "title": "Hughes et les cypherpunks : la vie privée, c’est des mathématiques", "shortTitle": "Cypherpunks", "thesis": "La vie privée dans l’environnement numérique exige de la cryptographie, pas des promesses institutionnelles.", "insight": "En 1993, Hughes a prévu la crise de la vie privée et a exigé une protection mathématique - son manifeste est devenu le fondement idéologique de Bitcoin et de tout Web3.", "body": "## La voix qui a averti à l'avance\n\nEn 1993, alors que la plupart des gens entendaient pour la première fois le mot « internet », le mathématicien et cryptographe Eric Hughes a rédigé un document de trois pages. Il s'intitulait « A Cypherpunk's Manifesto » et a été publié sur la liste de diffusion d'une petite communauté de personnes qui travaillaient sur la cryptographie et réfléchissaient aux conséquences de l'apparition d'un réseau public.\n\nÀ l'époque, internet commençait tout juste à devenir accessible au grand public. Les premiers navigateurs venaient à peine d'apparaître. Personne ne pensait encore à la vie privée en ligne - les gens se réjouissaient simplement des nouvelles possibilités : on pouvait correspondre avec des personnes à l'autre bout de la planète ! On pouvait lire les informations en temps réel ! On pouvait trouver n'importe quelle information !\n\nHughes voyait les choses autrement. Son argument était simple et imparable : un internet ouvert signifie que chacune de vos actions en ligne est potentiellement visible par tout le monde - fournisseurs d'accès, États, entreprises. Ce n'est pas une vulnérabilité accidentelle. C'est une caractéristique architecturale d'un système qui, volontairement ou non, a été conçu exactement ainsi. Et la seule façon de protéger la vie privée dans ces conditions n'est pas de demander la permission aux fournisseurs et aux États, mais d'utiliser les mathématiques. La cryptographie. Des mathématiques qu'aucune loi ne peut casser.\n\n## Une prophétie devenue littéralement réalité\n\nHughes écrivait en 1993 : « La vie privée dans une société ouverte exige des systèmes de transaction anonymes. » Cela ressemblait à de la science-fiction. La plupart des lecteurs haussaient les épaules : « Je n'ai rien à cacher. » Pourquoi une personne ordinaire aurait-elle besoin de transactions anonymes ?\n\nTrente ans plus tard, nous vivons dans un monde où les entreprises en savent plus sur les utilisateurs que leurs proches. Où les fuites de données font partie des nouvelles quotidiennes. Où chaque achat par carte, chaque requête de recherche, chaque déplacement avec un téléphone allumé est enregistré et conservé. Hughes n'était pas paranoïaque. Il pensait simplement plusieurs coups à l'avance.\n\nLes cypherpunks - une petite communauté rassemblée autour de cette idée au début des années 1990 - ont fini par poser les bases idéologiques de Bitcoin. En 2008, Satoshi Nakamoto a publié la description de Bitcoin précisément sur la liste de diffusion des cypherpunks. C'était une réponse directe à la question de Hughes : voici votre système de transaction anonyme, construit sur les mathématiques et non sur la confiance envers un intermédiaire.\n\nEn 1984, Stewart Brand a prononcé la phrase devenue un manifeste de l'internet ouvert : « L'information veut être libre. » Il parlait de la nature de l'information - elle ne diminue pas quand on la copie, donc les barrières artificielles vont à l'encontre de sa nature. Hughes a complété cette idée de l'autre côté : la liberté de l'information sans vie privée n'est pas la liberté, mais de la transparence pour ceux qui observent.\n\n> Brand a dit : l'information veut être libre. Hughes a répondu : et la vie privée veut être protégée par les mathématiques. Ensemble, ils ont décrit les deux pôles de la liberté numérique.\n\nCes deux principes - l'ouverture et la vie privée - se contredisent en quelque sorte. Et la tension entre eux définit encore les grands débats sur ce que devrait être internet. Comment rendre le savoir accessible à tous tout en protégeant les données personnelles de chacun ? Cette question n'est pas encore résolue. Et c'est précisément ce que Web3 essaie de résoudre.", "tags": ["cryptographie", "vie privée", "surveillance"], "lensWeight": {"chronology": 3, "power": 4, "technology": 4, "media": 2, "privacy": 5}, "angDeg": 190.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1993"}, {"id": "castells", "sceneIndex": 8, "x": 307.2, "y": 215.2, "type": "power", "title": "Castells : le pouvoir a basculé vers les flux", "shortTitle": "Flux", "thesis": "Le pouvoir s’est déplacé du contrôle des lieux au contrôle des flux de données.", "insight": "Castells a montré que le pouvoir est passé du contrôle des lieux au contrôle des flux de données et d’attention, ce qui l’a rendu invisible et difficile à contester.", "body": "## La révolution que personne n’a remarquée\n\nAu milieu des années 1990, le sociologue espagnol Manuel Castells observait une transformation qui se déroulait au grand jour - et a écrit un ouvrage en trois volumes sur ce que la plupart des gens ne voyaient pas. La révolution de l’information avait déjà eu lieu. Simplement, les gens la cherchaient au mauvais endroit.\n\nIls attendaient des voitures volantes et des robots dans la cuisine. Ils attendaient l’avenir fantastique promis par les magazines de vulgarisation scientifique des années 1960. Mais la révolution se jouait dans les salles de serveurs des banques, dans les centres logistiques des grandes entreprises mondiales, dans les flux financiers entre les continents. Dans les années 1990, l’argent avait déjà cessé d’être physique : il était devenu des flux de données entre serveurs. La production avait cessé d’être locale : elle était devenue un réseau mondial de fournisseurs, où la conception est faite en Californie, les pièces fabriquées en Chine, l’assemblage au Vietnam, et la vente partout. Le pouvoir ne se mesurait plus au territoire.\n\n## L’espace des lieux face à l’espace des flux\n\nCastells a introduit une distinction qui aide à comprendre le monde moderne. L’ancien pouvoir contrôlait « l’espace des lieux » : usines, ports, frontières, territoires. Des points physiques que l’on peut occuper, défendre, tenir. Le nouveau pouvoir contrôle « l’espace des flux » : données, capital, attention, information.\n\nCe sont des formes de pouvoir fondamentalement différentes. Le pouvoir territorial se voit sur une carte : voici la frontière, voici l’armée, voici le château. Le pouvoir sur les flux est invisible. Où se situe le pouvoir de Google ? Nulle part et partout à la fois. Où se situe le pouvoir de Facebook ? Dans l’algorithme qui détermine ce que voient des milliards de personnes. Où se situe le pouvoir de Bitcoin ? Dans un réseau distribué qui n’a pas de lieu physique.\n\nCastells a montré que celui qui contrôle les flux contrôle le monde. Et cette observation s’est révélée terriblement juste. Cinq ou six entreprises technologiques contrôlent la majeure partie des flux d’information de la planète. Elles ne possèdent pas de territoires. Elles possèdent des algorithmes qui déterminent ce que les gens voient, lisent, achètent et en quoi ils croient.\n\nDaniel Bell avait déjà prévu, en 1973, la transition vers une société post-industrielle où la ressource principale est l’information et où les institutions principales ne sont pas les usines, mais les universités et les laboratoires de recherche. Dans les années 1990, Castells a vu que cela s’était produit, mais le pouvoir sur l’information s’était concentré dans un tout autre lieu que les universités.\n\n> L’ancien pouvoir contrôlait les lieux. Le nouveau pouvoir contrôle les flux. Et les flux sont bien plus difficiles à contester que le territoire.\n\nC’est la question fondamentale qui traverse tout le cours : comment le pouvoir s’organise-t-il dans un monde où l’information est la ressource principale ? Qui le contrôle ? Comment se concentre-t-il ? Et que se passe-t-il quand quelques entreprises s’emparent du contrôle de la majeure partie des flux d’information de la planète ? Les chapitres suivants parlent de cela.", "tags": ["flux", "société", "pouvoir"], "lensWeight": {"chronology": 4, "power": 5, "technology": 2, "media": 4, "privacy": 3}, "angDeg": 230.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/searc nt": "#34d399", "description": "Գյուտեր և արձանագրություններ․ ազդանշան, հիպերտեքստ, փաթեթներ, TCP/IP, Web։"}, {"id": "media", "label": "Մեդիա", "accent": "#fbbf24", "description": "Ինչպես փոխանցման միջավայրը փոխում է ընկալումը, վարքը և հասարակության կազմակերպումը։"}, {"id": "privacy", "label": "Գաղտնիություն", "accent": "#c084fc", "description": "Կրիպտոգրաֆիան որպես պաշտպանություն դիտարկումից և վերահսկումից։"}], "nodes": [{"id": "scarcity", "sceneIndex": 0, "x": 500.0, "y": 145.0, "type": "power", "title": "Տեղեկատվությունը որպես սակավություն", "shortTitle": "Սակավություն", "thesis": "Ինտերնետից առաջ տեղեկատվությունը ֆիզիկապես թանկ, դանդաղ և կենտրոնացված էր։", "insight": "Ինտերնետից առաջ տեղեկատվությունը ֆիզիկապես թանկ և կենտրոնացված էր, և դա այն դարձնում էր իշխանության գործիք՝ նրանց համար, ովքեր ունեին սարքավորումներ։", "body": "## Աշխարհը, որտեղ բառերը փող էին արժեում\n\nԴու սա կարդում ես էկրանին։ Ինչ-որ տեղ տվյալների կենտրոնում սերվերը այս տեքստը քեզ ուղարկել է միլիվայրկյանների ընթացքում, և դա քեզ ոչինչ չի արժեցել։ Դա ինքնին հասկանալի է թվում, ինչպես էլեկտրականությունը կամ ջրամատակարարումը։ Բայց միշտ այդպես չի եղել։ Եվ հասկանալը, թե ինչպես էր «մինչև» ժամանակներում, պարզապես պատմական հետաքրքրասիրություն չէ, այլ բանալի է հասկանալու համար, թե ինչու է ժամանակակից ինտերնետը կառուցված հենց այսպես։ Եվ ինչու դա խնդիր է։\n\nԸնդամենը յոթանասուն տարի առաջ Կիևից Նյու Յորք հաղորդագրություն ուղարկելը փող էր արժեում, օրեր էր տևում և վերահսկվում էր նրանց կողմից, ովքեր ունեին սարքավորումներ՝ պետությունների, հեռագրային ընկերությունների, թերթերի խմբագրությունների։ Տեղեկատվությունը սակավություն էր՝ ճիշտ այնպես, ինչպես նավթը կամ հացահատիկը։ Եվ ինչպես ցանկացած սակավություն, այն իշխանություն էր։ Նա, ով վերահսկում էր տեղեկատվության փոխանցումը, վերահսկում էր իրականությունը։\n\nՊատկերացրու XX դարի կեսերի տպարան։ Հսկայական մետաղական մեքենաներ, կապարե տառեր, ներկի ու յուղի հոտ։ Մի գաղափարը մեկ միլիոն մարդու հասցնելու համար պետք էր ֆիզիկապես տպել թերթի մեկ միլիոն օրինակ, բեռնել դրանք բեռնատարների վրա և տարածել երկրի ողջ կրպակներով։ Յուրաքանչյուր օրինակ փող էր արժեում։ Առաքման յուրաքանչյուր կիլոմետր փող էր արժեում։ Տպաքանակում մեկ տառասխալ՝ փողը դեն է նետված, հեղինակությունը՝ վնասված։ Դա հսկայական, ծանր, դանդաղ մեխանիզմ էր։\n\nՌադիոն և հեռուստատեսությունը հեղափոխություն էին թվում՝ ազդանշանը տարածվում է լույսի արագությամբ, բեռնատարներ պետք չեն։ Բայց դրանցում կար հիմնարար սահմանափակում՝ մեկ հաղորդիչ, միլիոնավոր ընդունիչներ։ Միայն նա կարող էր խոսել, ով ուներ աշտարակը։ Մնացած ողջ մարդկությունը լսում էր։ Հնարավոր չէր լսափողը վերցնել ու պատասխանել։ Հնարավոր չէր առարկել։ Հնարավոր չէր ավելացնել քո սեփական ձայնը։\n\nԱհա թե ինչպիսին էր տեղեկատվության աշխարհը մինչև ինտերնետը՝ կենտրոնացված, թանկ, միակողմանի։ Մի քանի աղբյուրներ հաղորդում էին շատերին։ Տեղեկատվությունը հոսում էր խիստ վերևից ներքև՝ սարքավորում ունեցողներից դեպի նրանց, ովքեր չունեին։ Սա ոչ թե պատահականություն էր, ոչ էլ չար մտադրություն՝ դա այդ ժամանակի տեխնոլոգիաների ֆիզիկական իրականությունն էր։\n\n> Տեղեկատվությունը պարզապես ռեսուրս չէր՝ այն իշխանության ճարտարապետությունն էր։ Ով տնօրինում էր փոխանցման ալիքը, նա էլ տնօրինում էր իրականությունը։\n\nՀենց այդ պատճառով առաջին մարդիկ, ովքեր հասկացան, որ այդ ճարտարապետությունը կարելի է փոխել, հասկացան հեղափոխական մի բան։ Ոչ միայն, որ «տվյալները կարելի է ավելի արագ փոխանցել»։ Այլ որ «տեղեկատվության նկատմամբ իշխանության հենց կառուցվածքը կարելի է կոտրել»։ Եվ նրանք սկսեցին աշխատել դրա վրա՝ առաջին բրաուզերի հայտնվելուց շատ առաջ։", "tags": ["իշխանություն", "սակավություն", "մեդիա"], "lensWeight": {"chronology": 5, "power": 5, "technology": 1, "media": 4, "privacy": 1}, "angDeg": -90.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm Եվ այդ երրորդը ոչ պակաս հիմնարար դուրս եկավ, քան առաջին երկուսը։\n\n## Մոմի բոցը օվկիանոսի միջով\n\nՈրպեսզի հասկանաս, թե ինչ արեց Շենոնը, պատկերացրու այս խնդիրը՝ մոմի բոցը Կիևից Տոկիո փոխանցել։ Կարելի է հենց մոմը տեղափոխել, բայց դա դանդաղ է, թանկ, և բոցը ճանապարհին կմարի։ Դա նյութի փոխանցում է, և այն սահմանափակված է ֆիզիկական օրենքներով։\n\nԲայց կարելի է նկարագրել բոցը՝ նրա գույնը, բարձրությունը, ջերմաստիճանը, ձևը, մոմի քիմիական բաղադրությունը։ Այդ նկարագրությունը լույսի արագությամբ ուղարկել լարով։ Եվ Տոկիոյում մեկ ուրիշ մարդ կվառի հենց նույն բոցը։ Դա տեղեկատվության փոխանցում է, և այն չի ճանաչում ֆիզիկական սահմանափակումներ։\n\nՇենոնը ցույց տվեց, որ այս երկրորդ մեթոդը կարելի է դարձնել բացարձակ ճշգրիտ, հուսալի և մասշտաբավորվող։ Որ ցանկացած ազդանշան կարելի է կոդավորել բիթերի մեջ, փոխանցել առանց աղավաղման և մյուս կողմում վերականգնել։ Ամբողջ թվային աշխարհը հենց դրա վրա է կանգնած՝ էլեկտրոնային փոստից մինչև 4K streaming, հաղորդագրությունների հավելվածներից մինչև blockchain։\n\nԱմեն անգամ, երբ Telegram-ում հաղորդագրություն ես ուղարկում, աշխատում է Շենոնը։ Ամեն անգամ, երբ blockchain-ում գործարքը փոխանցվում է ցանցի հանգույցների միջև, աշխատում է Շենոնը։ Նա ստեղծեց մաթեմատիկական հիմքը, որի վրա կառուցված է ամբողջ թվային աշխարհը։\n\n> Շենոնը ինտերնետը չի հորինել։ Նա ապացուցեց, որ ինտերնետը հնարավոր է՝ որ տեղեկատվությունը կարելի է փոխանցել ճշգրիտ, ինչպես ֆիզիկական մեծություն։\n\nՊարադոքսն այն է, որ ինքը՝ Շենոնը, աշխատում էր Bell Laboratories-ում՝ աշխարհի ամենամեծ հեռախոսային մենաշնորհում։ Նրա հայտնագործությունն ի վերջո կործանեց իր գործատուի մենաշնորհը։ Երբ տեղեկատվությունը կարելի է փոխանցել ցանկացած ալիքով, նշանակում է, որ ոչ մի ալիք չի կարող հավերժ մենաշնորհատեր մնալ։", "tags": ["ազդանշան", "կոդավորում", "չափում"], "lensWeight": {"chronology": 4, "power": 2, "technology": 5, "media": 2, "privacy": 2}, "angDeg": -50.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A %20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1948"}, {"id": "memex", "sceneIndex": 2, "x": 795.4, "y": 392.9, "type": "media", "title": "Բուշի Memex-ը. ժամանակից առաջ ընկած երազանք", "shortTitle": "Memex", "thesis": "Կապված գիտելիքը Web-ից առաջ պատկերացվել էր որպես անձնական ասոցիացիաների մեքենա։", "insight": "1945 թվականին Վաննևար Բուշը նկարագրեց հիպերտեքստը և փոխկապակցված գիտելիքը՝ Web-ից 46 տարի առաջ։ Ճիշտ գաղափարները չեն մահանում, դրանք սպասում են իրենց տեխնոլոգիաներին։", "body": "## Հիպերտեքստը՝ ինտերնետից քառասուն տարի առաջ\n\nԴեռ 1945 թվականին՝ առաջին լիարժեք համակարգչի հայտնվելուց երկու տարի առաջ և World Wide Web-ից քառասունվեց տարի առաջ, ամերիկացի գիտնական Վանևար Բուշը գրեց «As We May Think» վերնագրով էսսեն։ Այն հրապարակվեց The Atlantic-ում՝ ոչ թե գիտական ամսագրում, այլ լայն լսարանի համար նախատեսված զանգվածային պարբերականում։ Բուշը ցանկանում էր, որ իրեն կարդան բոլորը, ոչ միայն գիտնական գործընկերները։\n\nՆա նկարագրեց մի սարք, որը կոչեց «memex»՝ memory extender-ից, հիշողության ընդլայնիչ։ Դա մարդկության բոլոր գիտելիքների անձնական գրադարանն էր, որտեղ ցանկացած փաստաթուղթ իր իմաստով կապվում է ցանկացած այլ փաստաթղթի հետ։ Դու կարդում ես Նապոլեոնի մասին հոդված, և մեկ շարժումով անցնում ես նրա արշավների քարտեզին։ Քարտեզից՝ նրա գեներալների նամակներին։ Նամակներից՝ XX դարի ռազմական պատմաբանների կողմից նրա մարտավարության վերլուծությանը։ Դու չես որոնում այբբենական կատալոգում, չես թերթում դարակները, այլ հետևում ես մտքի շղթային՝ ինչպես հենց միտքն է հետևում։\n\nՍա հիպերտեքստ էր։ Այն բառից քառասուն տարի առաջ, մինչև որ այն պաշտոնապես կմտածվեր։ Քառասունվեց տարի առաջ, մինչև Թիմ Բերներս-Լին այս գաղափարը իրականացներ World Wide Web-ի տեսքով։\n\n## Ինչու երազանքը մնաց գրասեղանի դարակում\n\nԲուշը ապագան տեսնում էր լիովին պարզ․ գիտելիքը պետք է կապակցված լինի, հասանելի լինի բոլորին և պատկանի բոլորին։ Միայն մեկ խնդիր կար՝ տեխնոլոգիաները դեռ գոյություն չունեին։ 1945 թվականին համակարգիչները զբաղեցնում էին ամբողջ սենյակներ, արժեին ինչպես ինքնաթիռներ և կարող էին միայն հաշվարկել։ Չկային էկրաններ, չկային մկներ, չկային ցանցեր։ Բուշը սարքը նկարագրեց միկրոֆիլմերի և մեխանիկական լծակների լեզվով, որովհետև դա էր միակ բանը, որը նա ուներ որպես համեմատություն։\n\nՆրա երազանքը գրասեղանի դարակում մնաց գրեթե կես դար։ Բայց այն չմոռացվեց։ Այն կարդում էին, մեջբերում էին, ձեռքից ձեռք փոխանցում։ Թեդ Նելսոնը 1965 թվականին հորինեց «hypertext» բառը՝ ուղղակիորեն ոգեշնչվելով Բուշից։ Դուգլաս Էնգելբարտը ստեղծեց համակարգչային մկնիկը և հիպերտեքստային փաստաթղթերի համակարգը՝ նույնպես Բուշի ազդեցության ներքո։\n\nԵրբ Թիմ Բերներս-Լին 1989 թվականին CERN-ում գրում էր Web ստեղծելու իր առաջարկը, նա ուղիղ հղում էր անում Բուշի էսսեին որպես սկզբնական գաղափարի։ Հրապարակումից քառասունչորս տարի անց երազանքը վերջապես ստացավ իրականացման գործիքները։\n\nԱյս պատմությունը կարևոր է ոչ թե որպես պատմական հետաքրքրություն։ Այն ցույց է տալիս մի հիմնարար բան․ ճիշտ գաղափարը չի մահանում։ Այն սպասում է իր պահին։ Երբեմն՝ տասնամյակներ շարունակ։ Այսօր մենք ապրում ենք նման մի պահ՝ ապակենտրոնացված ինտերնետի գաղափարները, որտեղ օգտատերերը տիրապետում են իրենց տվյալներին, գոյություն ունեին շատ առաջ՝ blockchain-ից։ Տեխնոլոգիաները պարզապես վերջապես հասան տեսլականին։\n\n> Բուշը նկարագրել էր World Wide Web-ը դրա ստեղծումից քառասունվեց տարի առաջ։ Ոչ թե որովհետև նա մարգարե էր, այլ որովհետև հասկանում էր, թե մարդկային միտքը ինչ է ուզում գիտելիքի գործիքներից։\n\nՊարադոքս  արձակեց Երկրի առաջին արհեստական արբանյակը։ 58 սանտիմետր տրամագծով, 83 կիլոգրամ քաշով փոքր մետաղական գունդը սլանում էր Երկրի վրայով ու ազդանշաններ արձակում, և ամբողջ աշխարհը դա լսում էր։ Ամերիկյան զինվորականների համար սա ոչ միայն մրցակցի տեխնոլոգիական հաղթանակն էր։ Սա ահազանգ էր. թշնամին վերահսկում է ուղեծիրը։ Եթե նրանք կարող են արբանյակ արձակել, կարող են նաև միջուկային մարտագլխիկով հրթիռ արձակել և հասնել մոլորակի ցանկացած կետի։\n\nՄեկ տարի անց ԱՄՆ-ը ստեղծեց DARPA-ն՝ Պաշտպանության առաջատար հետազոտական նախագծերի գործակալությունը։ Նրա առաջ կանգնած էր մեկ խնդիր՝ ստեղծել ռազմական կապի համակարգ, որը մեկ հարվածով հնարավոր չի լինի ոչնչացնել։ Սովորական հեռախոսային ցանցերը աղետալիորեն խոցելի էին. որտեղ կա կենտրոնական հեռախոսակայան, այնտեղ կա նաև խափանման կետ։ Պենտագոնի վրա ընկած մեկ ռումբ, և կապը ամբողջ բանակի հետ կորչում է։\n\n## Առանց կենտրոնի ցանցը՝ գաղափար, որ փոխեց ամեն ինչ\n\nDARPA-ի ինժեներները մտածեցին սկզբունքորեն այլ լուծում։ Իսկ եթե կենտրոնը ընդհանրապես հեռացնենք։ Ցանցի յուրաքանչյուր հանգույցը դարձնենք հավասարազոր։ Եթե մեկը խափանվում է, հաղորդագրությունը ավտոմատ գտնում է այլ երթուղի։ Ինչպես ջուրը խողովակներում. եթե մեկ խողովակ փակված է, ջուրը շրջանցող ճանապարհ է գտնում։\n\nԱյդ գաղափարը կոչվեց ARPANET։ 1969 թվականին այն առաջին անգամ աշխատեց. չորս համալսարաններ՝ UCLA, Stanford, UC Santa Barbara և Utah, տվյալներ փոխանակեցին հեռախոսագծով։ Առաջին հաղորդագրությունը, որը փորձում էին ուղարկել, \"login\" բառն էր։ Համակարգը խափանվեց \"o\" տառից հետո։ Պրոտո-ինտերնետով փոխանցված առաջին բառը \"lo\"-ն էր, որը անգլերենում նշանակում է «տես»։ Պատահական պոեզիա։\n\nԱյդ ժամանակ ոչ ոք չէր մտածում, որ սա կդառնա գլոբալ քաղաքացիական ինտերնետի հիմքը։ Զինվորականները ցանկանում էին հուսալի կապ՝ միջուկային պատերազմի դեպքում։ Նրանք ստեղծեցին ավելի մեծ մի բան՝ ճարտարապետություն, որտեղ իշխանությունը կառուցվածքայինորեն չի կարող կենտրոնանալ մեկ կետում։ Բաշխված ցանցը իր բնույթով դիմացկուն է կենտրոնացմանը։\n\nԳոնե այդպես էր մտածված։ Իրականությունը ավելի բարդ դուրս եկավ, և այդ մասին կխոսենք հաջորդ գլուխներում։\n\n> Ինտերնետը ստեղծվել է որպես ռազմական կապի համակարգ, որը դիմացկուն էր միջուկային հարվածին։ Ի վերջո այն դիմացկուն դուրս եկավ իշխանության ցանկացած կենտրոնացման նկատմամբ, և դա դարձավ նրա գլխավոր քաղաքական հատկությունը։\n\n1974 թվականին Վինթոն Սերֆը և Ռոբերտ Քանը լուծեցին հաջորդ խնդիրը. տարբեր համակարգիչներ տարբեր լեզուներով էին խոսում։ Stanford-ի ցանցը չէր հասկանում MIT-ի ցանցը։ Նրանք ստեղծեցին TCP/IP-ը՝ ունիվերսալ պրոտոկոլ, տվյալների փոխանցման համար ցանկացած ցանցերի միջև ընդհանուր լեզու։ Տվյալները բաժանվում են փոքր փաթեթների, յուրաքանչյուրն իր ճանապարհն է գտնում, իսկ մյուս ծայրում կրկին հավաքվում են։ Կարծես նամակը մասերի բաժանեիր, յուրաքանչյուր մասը ուղարկեիր առանձին սուրհանդակով, և դրանք, միևնույն է, հասցեատիրոջ մոտ ճիշտ հերթով նորից հավաքվեին։ Այս նույն պրոտոկոլն այսօր էլ ինտերնետի հիմքն է՝ ստեղծումից հիսուն տարի անց։", "tags": ["փաթեթներ", "DARPA", "TCP/IP", "ապակենտրոնացում"], "lensWeight": {"chronology": 5, "power": 5, "technology": 5, "media": 2, "privacy": 3}, "angDeg": 30.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1 Լի. ամեն ինչ անվճար տալու որոշումը", "shortTitle": "Բաց Web", "thesis": "Web-ը դարձավ զանգվածային, որովհետև հիմնական արձանագրությունը բաց էր բոլորի համար։", "insight": "Բերներս-Լին Web-ը անվճար տվեց ոչ թե ալտրուիզմից, այլ որովհետև հասկացավ, որ միայն բաց պրոտոկոլը կարող է գլոբալ դառնալ։", "body": "## «Մշուշոտ, բայց հետաքրքիր» նշումով հայտը\n\n1989 թվականին երիտասարդ բրիտանացի ծրագրավորող Թիմ Բերներս-Լին աշխատում էր CERN-ում՝ Ժնևի Եվրոպական միջուկային հետազոտությունների կենտրոնում։ Դա աշխարհի ամենամեծ գիտական ինստիտուտն է. տասնյակ երկրներից հազարավոր գիտնականներ աշխատում են նույն փորձերի վրա, բայց շարունակ կորցնում են փաստաթղթերը, մոռանում են համատեքստը, ամիսներ են ծախսում հասկանալու համար, թե ինչ է արվել իրենցից առաջ։\n\nԲերներս-Լին ղեկավարությանը ներքին հայտ գրեց։ Էությունն էր՝ ստեղծել համակարգ, որտեղ բոլոր փաստաթղթերը հղումներով կապված կլինեն և հասանելի կլինեն ցանցի ցանկացած համակարգչից։ Նրա ղեկավարը՝ Մայք Սենդալը, լուսանցքում գրեց երեք բառ. «Մշուշոտ, բայց հետաքրքիր»։ Սա աշխարհի վրա ազդեցություն թողած գյուտի ամենահամեստ կարծիքն էր։\n\nԵրեք տարվա ընթացքում Բերներս-Լին ստեղծեց երեք բան, որոնց վրա հիմնված է ամբողջ ժամանակակից ինտերնետը՝ HTML-ը՝ փաստաթղթերի նշագրման լեզուն, HTTP-ը՝ դրանց փոխանցման պրոտոկոլը, և URL-ը՝ հասցեավորման համակարգը։ Դրանք միասին ձևավորեցին World Wide Web-ը։ Փաստաթղթերը պահվում են սերվերներում, ունեն հասցեներ, կապված են հղումներով և բացվում են բրաուզեր ծրագրով։ Պարզ, նրբագեղ, ունիվերսալ։\n\n## Դարաշրջանը որոշած որոշումը\n\nԲայց առանցքային որոշումը տեխնիկական չէր։ Այն էթիկական էր։\n\nԲերներս-Լին կարող էր իր գյուտը արտոնագրել։ CERN-ի իրավաբանները դա առաջարկում էին։ Եթե յուրաքանչյուր կայք HTTP-ի օգտագործման համար ռոյալթի վճարեր, Բերներս-Լին կդառնար մոլորակի ամենահարուստ մարդը։ Փոխարենը նա պնդեց, որ տեխնոլոգիան մարդկությանը տրվի անվճար՝ առանց սահմանափակումների, առանց լիցենզիաների, առանց պայմանների։\n\n«Եթե Web-ը արտոնագրված լիներ կամ գտնվեր մեկ ընկերության վերահսկողության տակ, այն չէր գոյանա», — հետագայում բացատրեց նա։ Սա ալտրուիզմ չէր ալտրուիզմի համար։ Սա ռազմավարություն էր. միայն առանց արգելքների ցանցը կարող էր աճել մինչև գլոբալ մասշտաբ։ Միայն եթե յուրաքանչյուրը կարող է առանց թույլտվության կայք ստեղծել, ցանցը դառնում է իսկապես բաց։\n\n1993 թվականին ԱՄՆ Ազգային սուպերհաշվարկային կիրառությունների կենտրոնի ուսանողները թողարկեցին Mosaic բրաուզերը՝ առաջինը, որը նույն էկրանին միասին ցույց էր տալիս տեքստը և պատկերները։ Մինչ այդ ինտերնետը տեքստի աշխարհ էր։ Mosaic-ը այն տեսողական դարձրեց։ Եվ հասկանալի՝ սովորական մարդու համար, որը երբեք ծրագրավորում չէր սովորել։\n\nՆույն տարում վեբ-կայքերի թիվը անցավ հինգ հարյուրը։ Հիմա դա ծիծաղելի է հնչում, բայց այն ժամանակ դա պայթյուն էր։ Երկու տարի անց դրանք արդեն երկու հարյուր հազար էին։ Մրցավազքը սկսվել էր։\n\n> Բերներս-Լին Web-ը անվճար տվեց և այդպիսով այն գլոբալ դարձրեց։ Եթե նա այն արտոնագրեր, մենք մինչև հիմա ռոյալթի կվճարեինք յուրաքանչյուր հղման համար։\n\nԲերներս-Լիի մասին այս պատմությունը պարզապես կենսագրական փաստ չէ։ Դա ցանցերի բնույթի մասին դաս է. բաց պրոտոկոլները ավելի արագ են աճում, քան փակերը, որովհետև յուրաքանչյուր ոք կարող է դրանց վրա կառուցել։ Այդ պատճառով Ethereum բլոկչեյնը բաց է։ Այդ պատճառով TON-ը բաց պրոտոկոլ է։ 1991 թվականին Բերներս-Լին դրեց մի սկզբունք, որը մինչև այսօր որոշում է, թե որ տեխնոլոգիաներն են հաղթում.", "tags": ["Web", "արձանագրություն", "բացություն"], "lensWeight": {"chronology": 5, "power": 4, "technology": 5, "media": 4, "privacy": 2}, "angDeg": 70.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)" D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1991"}, {"id": "atoms-to-bits", "sceneIndex": 5, "x": 397.4, "y": 726.9, "type": "economy", "title": "Ատոմներից դեպի բիթեր. տնտեսական տրամաբանության փոփոխություն", "shortTitle": "Ատոմներ → բիթեր", "thesis": "Արժեքը սկսեց շարժվել տեղեկատվության պես՝ պատճենվող, ակնթարթային և գրեթե անվճար։", "insight": "«Ատոմներից դեպի բիթեր» անցումը պարզապես տեխնոլոգիա չէ. դա տնտեսական տրամաբանության փոփոխություն է՝ նույնի մասշտաբից դեպի յուրաքանչյուր փոխազդեցության եզակիություն։", "body": "## Թոֆլերը դա տեսավ 1980-ին\n\nԵրբ 1980 թվականին Էլվին Թոֆլերը հրապարակում էր «Երրորդ ալիքը», անձնական համակարգիչները գրեթե գոյություն չունեին։ Ինտերնետ չկար։ Բջջային հեռախոսներ չկային։ Եվ այնուամենայնիվ նա նկարագրեց տնտեսական վերափոխություն, որը լիովին բացվեց միայն քառասուն տարի անց։\n\nԹոֆլերը նկարագրեց մարդկային քաղաքակրթության երեք դարաշրջան։ Առաջին ալիքը ագրարային էր՝ հողն ու բերքը որպես հիմնական արժեք։ Երկրորդ ալիքը արդյունաբերական էր՝ փոխակրիչ, ստանդարտացում, զանգվածային արտադրություն։ Գործարանը արտադրում է հազար միանման սառնարան, և դա արդյունավետ է հենց այն պատճառով, որ դրանք միանման են։ Որքան շատ են արտադրանքի միավորները, այնքան ցածր է յուրաքանչյուրի ինքնարժեքը։ Մասշտաբը արդյունաբերական տնտեսության հաղթանակն է։\n\nԵրրորդ ալիքը տեղեկատվական է։ Եվ այստեղ տրամաբանությունը շրջվում է գլխիվայր։ Տեղեկատվական տնտեսությունում պատճենումը անվճար է։ Մի ծրագիր կարող է միաժամանակ այլ կերպ վարվել մեկ միլիարդ օգտատերերի հետ, և դա ոչ թե սխալ է, այլ նրա գլխավոր առավելությունը։ Արժեքը ստեղծվում է ոչ թե նույնի կրկնօրինակմամբ, այլ յուրաքանչյուր փոխազդեցության եզակիությամբ։\n\n## Նիկոլաս Նեգրոպոնտե և ամենապարզ բանաձևը\n\n1995 թվականին MIT Media Lab-ի տնօրեն Նիկոլաս Նեգրոպոնտեն դա ձևակերպեց մի արտահայտությամբ, որը դարձավ հայտնի. «ատոմներից դեպի բիթեր»։\n\nԱտոմները ֆիզիկական աշխարհն են։ Սառնարան արտադրելու համար պետք են մետաղ, պլաստիկ, էլեկտրոնիկա, աշխատուժ, գործարան։ Այն գնորդին հասցնելու համար պետք են բեռնատար, պահեստ, խանութ։ Յուրաքանչյուր պատճեն փող է արժենում։ Տպաքանակը սահմանափակվում է ռեսուրսներով։ Եթե ուզում ես վաճառել մեկ միլիոն սառնարան, պետք է արտադրես մեկ միլիոն սառնարան։\n\nԲիթերը թվային աշխարհն են։ Ծրագիր ստեղծելու համար պետք է մեկ մշակող և մեկ համակարգիչ։ Այն մեկ միլիարդ օգտատերերին հասցնելու համար պետք է սերվեր և ինտերնետ կապ։ Պատճենումը գործնականում անվճար է։ Հասցնելը՝ ակնթարթային։ Տպաքանակը՝ անսահման։ Եթե ուզում ես վաճառել ծրագրի մեկ միլիարդ պատճեն, պետք չէ մեկ միլիարդ ծրագիր արտադրել։ Մեկ պատճենը կրկնօրինակվում է մեկ միլիարդ անգամ։\n\nՍա պարզապես տեխնոլոգիական տարբերություն չէ։ Դա հիմնարար տնտեսական տրամաբանության փոփոխություն է։ XX դարի ամբողջ տնտեսությունը կառուցված էր ատոմների տրամաբանության վրա՝ սակավություն, մասշտաբ, ստանդարտացում։ XXI դարի տնտեսությունը կառուցվում է բիթերի տրամաբանության վրա՝ առատություն, անհատականացում, ցանցային էֆեկտներ։\n\n> Արդյունաբերական տնտեսությունը գումար էր վաստակում նույնի մասշտաբից։ Տեղեկատվական տնտեսությունը գումար է վաստակում յուրաքանչյուր փոխազդեցության եզակիությունից։ Սրանք հակադիր տրամաբանություններ են։\n\nԵրբ հասկանում ես այս տարբերությունը, ժամանակակից աշխարհի շատ բաներ սկսում են բացատրվել։ Ինչո՞ւ է Google-ը անվճար։ Որովհետև որոնման արդյունքների պատճենումը ոչինչ չի արժենում, իսկ դրամայնացումը գալիս է գովազդից։ Ինչո՞ւ է Spotify-ը երաժիշտներին գրոշներ վճարում։ Որովհետև մեկ ստրիմի սահմանային արժեքը մոտենում է զրոյի։ Ինչո՞ւ են կրիպտոարժույթները ընդհանրապես հնարավոր։ Որովհետև թվային ակտիվները կարելի է փոխանցել առանց ֆիզիկական կրիչի։ Այս ամենը մեկ սկզբունքի հետևանքներ են, որը Նեգրոպոնտեն ձևակերպեց երեք բառով։", "tags": ["տնտեսություն", "բիթեր", "մասշտաբ"], "lensWeight": {"chronology": 4, "power": 4, "technology": 3, "media": 3, "privacy": 1}, "angDeg": 110.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "h ստացույցը պատմության մեջ առաջին անգամ համաժամեցրեց միլիոնավոր մարդկանց՝ նույն նորությունները, նույն պահին, նույն բառերով՝ երկրի բոլոր տներում միաժամանակ։ Այն ստեղծեց այն, ինչ ՄաքԼուհանն անվանեց «գլոբալ գյուղ»՝ մի աշխարհ, որտեղ բոլորը նույն իրադարձությունը միաժամանակ են ապրում։ Հեռուստատեսությունից առաջ տարբեր քաղաքների մարդիկ ապրում էին տարբեր տեղեկատվական իրականություններում։ Հետո՝ մեկում։\n\n## Ռաշքոֆի կենսաբանական փոխաբերությունը\n\n1994 թվականին ամերիկացի մեդիա տեսաբան Դուգլաս Ռաշքոֆը ՄաքԼուհանի գաղափարին ավելացրեց կենսաբանական փոխաբերություն, և այն նույնիսկ ավելի ճշգրիտ դուրս եկավ։ *Media Virus!* գրքում նա նկարագրեց այն մեխանիզմը, որը այսօր անվանում են վարակիչ բովանդակություն՝ YouTube-ից տասը տարի, TikTok-ից քսան տարի առաջ։\n\nԳաղափարները տարածվում են վիրուսների նման։ Ոչ թե որովհետև դրանք ճշմարիտ են։ Ոչ թե որովհետև դրանք օգտակար են։ Այլ որովհետև դրանք հարվածում են լսարանի հոգեբանական խոցելիությանը՝ այն բանին, ինչը մարդկանց ստիպում է դրանք փոխանցել առաջ՝ վախ, վրդովմունք, ոգևորություն, ճանաչում, զայրույթ, քնքշություն։ Զգացումը գաղափարի կրկնապատկման մեխանիզմն է։\n\nՌաշքոֆը ցույց տվեց, որ ուժեղ զգացում առաջացնող բովանդակությունը տարածվում է՝ անկախ իր ճշմարտացիությունից կամ օգտակարությունից։ Սենսացիոն լուրը ավելի արագ է տարածվում, քան ճշմարիտը։ Վախեցնող պատմությունը՝ ավելի արագ, քան ձանձրալիը։ Սա ոչ պատահականություն է, ոչ էլ մանիպուլյացիա՝ դա մեդիա միջավայրի կառուցվածքային առանձնահատկություն է։ Վիրուսը տանտիրոջը չի ընտրում «լավ մարդ է, թե վատ» չափանիշով։ Այն ընտրում է «խոցելի է, թե ոչ» չափանիշով։\n\nTikTok-ի ալգորիթմներից շատ առաջ, որոնք հենց դրա համար են օպտիմիզացված, Ռաշքոֆը նկարագրել էր այն սկզբունքը, որի վրա դրանք կառուցված են։ Ալգորիթմը վարակիչությունը չի ստեղծել։ Այն պարզապես սովորել է այն ուժեղացնել։\n\n> ՄաքԼուհանը զգուշացնում էր․ կարևոր է ոչ թե հաղորդումը, այլ հեռուստացույցը։ Ռաշքոֆը ճշտում էր․ կարևոր է ոչ թե գաղափարը, այլ այն զգացումը, որ այն առաջացնում է։ Միասին նրանք նկարագրեցին ժամանակակից սոցիալական ցանցերի ճարտարապետությունը՝ դրանց հայտնվելուց երեսուն տարի առաջ։\n\nԵրբ հայտնվեց ինտերնետը, առաջին հարցը կրկին բովանդակության մասին էր՝ ինչ էին մարդիկ այնտեղ կարդալու և դիտելու։ ՄաքԼուհանը կասեր՝ սխալ հարց է։ Ճիշտ հարցը սա է՝ ի՞նչ է անում մարդուն այն միջավայրը, որի ներսում նա օրեցօր ավելի ու ավելի շատ ժամանակ է անցկացնում։ Այդ հարցը դարձավ վճռորոշ, երբ հայտնվեցին սոցիալական ցանցերը։ Ցավոք, այն շատ ուշ տրվեց։", "tags": ["մեդիա", "վարքագիծ", "ընկալում"], "lensWeight": {"chronology": 3, "power": 3, "technology": 1, "media": 5, "privacy": 2}, "angDeg": 150.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital ոգրաֆ Էրիկ Հյուզը երեք էջանոց մի փաստաթուղթ գրեց։ Այն կոչվում էր «A Cypherpunk's Manifesto» և հրապարակվել էր կրիպտոգրաֆիայով զբաղվող, հանրային ցանցի ի հայտ գալու հետևանքների մասին մտածող մարդկանց փոքր համայնքի փոստային ցուցակում։\n\nԱյդ ժամանակ ինտերնետը միայն նոր-նոր էր հասանելի դառնում սովորական մարդկանց։ Առաջին բրաուզերները նոր էին հայտնվել։ Ցանցում գաղտնիության մասին դեռ ոչ ոք չէր մտածում - մարդիկ պարզապես ուրախանում էին նոր հնարավորություններով․ կարելի էր նամակագրել մոլորակի մյուս ծայրի մարդկանց հետ։ Կարելի էր նորությունները կարդալ իրական ժամանակում։ Կարելի էր գտնել ցանկացած տեղեկատվություն։\n\nՀյուզը այլ կերպ էր մտածում։ Նրա փաստարկը պարզ ու պողպատե էր․ բաց ինտերնետը նշանակում է, որ ցանցում քո յուրաքանչյուր գործողությունը պոտենցիալ տեսանելի է բոլորին - մատակարարներին, պետություններին, կորպորացիաներին։ Սա պատահական խոցելիություն չէ։ Սա համակարգի ճարտարապետական հատկանիշ է, որը՝ դիտավորյալ, թե ոչ, ստեղծվել է հենց այսպես։ Եվ այդ պայմաններում գաղտնիությունը պաշտպանելու միակ ճանապարհը մատակարարներից ու պետություններից թույլտվություն խնդրելը չէ, այլ մաթեմատիկան օգտագործելը։ Կրիպտոգրաֆիան։ Այն մաթեմատիկան, որը ոչ մի օրենք չի կարող կոտրել։\n\n## Մի մարգարեություն, որ բառացիորեն իրականություն դարձավ\n\nՀյուզը 1993-ին գրել էր․ «Բաց հասարակությունում գաղտնիությունը պահանջում է անանուն գործարքային համակարգեր»։ Դա գիտաֆանտաստիկա էր թվում։ Ընթերցողների մեծ մասը ուսերն էր թոթվում․ «Ես թաքցնելու ոչինչ չունեմ»։ Սովորական մարդուն ինչու՞ էին պետք անանուն գործարքներ։\n\nԵրեսուն տարի անց մենք ապրում ենք մի աշխարհում, որտեղ կորպորացիաները օգտատերերի մասին ավելի շատ գիտեն, քան նրանց մտերիմները։ Որտեղ տվյալների արտահոսքերը դարձել են ամենօրյա լուրեր։ Որտեղ քարտով արված յուրաքանչյուր գնում, յուրաքանչյուր որոնման հարցում, միացված հեռախոսով կատարված յուրաքանչյուր տեղաշարժ գրանցվում ու պահվում է։ Հյուզը պարանոյիկ չէր։ Նա պարզապես մի քանի քայլ առաջ էր մտածում։\n\nՇիֆրոպանկերը՝ 1990-ականների սկզբին այս գաղափարի շուրջ համախմբված փոքր համայնքը, ի վերջո դարձան Bitcoin-ի գաղափարական հիմքը։ Սատոշի Նակամոտոն 2008 թվականին Bitcoin-ի նկարագրությունը հրապարակեց հենց շիֆրոպանկերի փոստային ցուցակում։ Դա Հյուզի հարցին ուղիղ պատասխան էր․ ահա ձեր անանուն գործարքային համակարգը, կառուցված ոչ թե միջնորդի հանդեպ վստահության, այլ մաթեմատիկայի վրա։\n\nՍտյուարտ Բրենդը դեռ 1984 թվականին արտաբերեց այն արտահայտությունը, որը դարձավ բաց ինտերնետի մանիֆեստը․ «Տեղեկատվությունը ցանկանում է ազատ լինել»։ Նա նկատի ուներ տեղեկատվության բնույթը․ պատճենահանվելիս այն չի նվազում, ուստի արհեստական խոչընդոտները հակասում են դրա բնույթին։ Հյուզը սա լրացրեց մյուս կողմից․ գաղտնիություն չունեցող տեղեկատվական ազատությունը ազատություն չէ, այլ թափանցիկություն այն մարդկանց համար, ովքեր դիտում են։\n\n> Բրենդն ասաց․ տեղեկատվությունը ցանկանում է ազատ լինել։ Հյուզը պատասխանեց․ իսկ գաղտնիությունը ցանկանում է պաշտպանված լինել մաթեմատիկայով։ Միասին նրանք նկարագրեցին թվային ազատության երկու բևեռները։\n\nԱյս երկու սկզբունքները՝ բացությունը և գաղտնիությունը, ինչ-որ իմաստով հակասում են միմյանց։ Եվ դրանց միջև եղած լարվածությունը մինչև այսօր որոշում է հիմնական վեճերը այն մասին, թե ինչպիսին պետք է լինի ինտերնետը։ Ինչպե՞ս գիտելիքը հասանելի դարձնել բոլորին՝ միաժամանակ պաշտպանելով յուրաքանչյուրի անձնական տվյալները։ Այս հարցը դեռ լուծված չէ։ Եվ հենց դա է փորձում լուծել Web3-ն.", "tags": ["գաղտնագրություն", "գաղտնիություն", "վերահսկում"], "lensWeight": {"chronology": 3, "power": 4, "technology": 4, "media": 2, "privacy": 5}, "angDeg": 190.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Indu bm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1993"}, {"id": "castells", "sceneIndex": 8, "x": 307.2, "y": 215.2, "type": "power", "title": "Կաստելս. իշխանությունը տեղափոխվեց հոսքերի կողմը", "shortTitle": "Հոսքեր", "thesis": "Իշխանությունը վայրերի վերահսկումից տեղափոխվեց տվյալների հոսքերի վերահսկմանը։", "insight": "Կաստելսը ցույց տվեց, որ իշխանությունը տեղերի վերահսկողությունից տեղափոխվեց տվյալների և ուշադրության հոսքերի վերահսկողության կողմը, և դա այն դարձրեց անտեսանելի ու դժվար վիճարկելի։", "body": "## Աննկատ մնացած հեղափոխությունը\n\n1990-ականների կեսերին իսպանացի սոցիոլոգ Մանուել Կաստելսը դիտարկում էր մի փոխակերպում, որ տեղի էր ունենում բոլորի աչքի առաջ, և այդ մասին, ինչը մարդկանց մեծ մասը չէր նկատում, գրեց եռահատոր աշխատություն։ Տեղեկատվական հեղափոխությունն արդեն տեղի էր ունեցել։ Պարզապես մարդիկ այն սխալ տեղում էին փնտրում։\n\nՆրանք սպասում էին թռչող մեքենաների ու խոհանոցում աշխատող ռոբոտների։ Սպասում էին 1960-ականների գիտահանրամատչելի ամսագրերի խոստացած ֆանտաստիկ ապագային։ Բայց հեղափոխությունը տեղի էր ունենում բանկերի սերվերային սրահներում, գլոբալ կորպորացիաների լոգիստիկ կենտրոններում, մայրցամաքների միջև ֆինանսական հոսքերում։ 1990-ականներին փողն արդեն դադարել էր լինել ֆիզիկական. այն դարձել էր սերվերների միջև տվյալների հոսք։ Արտադրությունը դադարել էր լինել տեղական. այն դարձել էր մատակարարների գլոբալ ցանց, որտեղ դիզայնը արվում է Կալիֆոռնիայում, մասերը արտադրվում են Չինաստանում, հավաքումը կատարվում է Վիետնամում, իսկ վաճառքը՝ ամենուր։ Իշխանությունն այլևս տարածքով չէր չափվում։\n\n## Տեղերի տարածք ընդդեմ հոսքերի տարածքի\n\nԿաստելսը ներմուծեց մի տարբերություն, որը օգնում է հասկանալ ժամանակակից աշխարհը։ Հին իշխանությունը վերահսկում էր «տեղերի տարածքը»՝ գործարաններ, նավահանգիստներ, սահմաններ, տարածքներ։ Ֆիզիկական կետեր, որոնք կարելի է զբաղեցնել, պաշտպանել, պահել։ Նոր իշխանությունը վերահսկում է «հոսքերի տարածքը»՝ տվյալներ, կապիտալ, ուշադրություն, տեղեկատվություն։\n\nՍրանք իշխանության սկզբունքորեն տարբեր տեսակներ են։ Տարածքային իշխանությունը կարելի է տեսնել քարտեզի վրա՝ ահա սահմանը, ահա բանակը, ահա ամրոցը։ Հոսքերի վրա իշխանությունն անտեսանելի է։ Որտե՞ղ է գտնվում Google-ի իշխանությունը։ Ոչ մի տեղում և ամենուր միաժամանակ։ Որտե՞ղ է գտնվում Facebook-ի իշխանությունը։ Այն ալգորիթմում, որը որոշում է, թե ինչ են տեսնում միլիարդավոր մարդիկ։ Որտե՞ղ է գտնվում Bitcoin-ի իշխանությունը։ Տարածված ցանցում, որը ֆիզիկական տեղակայություն չունի։\n\nԿաստելսը ցույց տվեց. ով վերահսկում է հոսքերը, նա էլ վերահսկում է աշխարհը։ Եվ այդ դիտարկումը սարսափեցնող ճշգրիտ դուրս եկավ։ Հինգ-վեց տեխնոլոգիական ընկերություն վերահսկում են մոլորակի տեղեկատվական հոսքերի մեծ մասը։ Նրանք տարածքներ չունեն։ Նրանք տիրապետում են ալգորիթմների, որոնք որոշում են, թե մարդիկ ինչ են տեսնում, կարդում, գնում և ինչին են հավատում։\n\nԴանիել Բելը դեռ 1973 թվականին կանխատեսել էր հետինդուստրիալ հասարակության անցումը, որտեղ գլխավոր ռեսուրսը տեղեկատվությունն է, իսկ գլխավոր ինստիտուտները ոչ թե գործարաններն են, այլ համալսարաններն ու հետազոտական լաբորատորիաները։ 1990-ականներին Կաստելսը տեսավ, որ դա արդեն տեղի է ունեցել, բայց տեղեկատվության վրա իշխանությունը կենտրոնացել էր համալսարաններից բոլորովին այլ տեղում։\n\n> Հին իշխանությունը վերահսկում էր տեղերը։ Նոր իշխանությունը վերահսկում է հոսքերը։ Իսկ հոսքերը շատ ավելի դժվար է վիճարկել, քան տարածքը։\n\nՍա է ամբողջ դասընթացով անցնող հիմնարար հարցը. ինչպե՞ս է կառուցված իշխանությունը մի աշխարհում, որտեղ տեղեկատվությունն է գլխավոր ռեսուրսը։ Ո՞վ է այն վերահսկում։ Ինչպե՞ս է այն կենտրոնանում։ Եվ ի՞նչ է տեղի ունենում, երբ մի քանի կորպորացիաներ գրավում են մոլորակի տեղեկատվական հոսքերի մեծ մասի վերահսկողությունը։ Հաջորդ գլուխները հենց դրա մասին են.", "tags": ["հոսքեր", "հասարակություն", "իշխանություն"], "lensWeight": {"chronology": 4, "power": 5, "technology": 2, "media": 4, "privacy": 3}, "angDeg": 230.0, "sources": [ const LANGS = ["ru", "en", "uk", "kk", "uz", "es", "fr", "hy"];
const LANG_LABELS = {"ru": "RU", "en": "EN", "uk": "UK", "kk": "KK", "uz": "UZ", "es": "ES", "fr": "FR", "hy": "HY"};
let CURRENT_LANG = 'ru';
function pickLang(l){ return LANGS.indexOf(l)>=0 ? l : 'ru'; }
function applyLang(l){
  l = pickLang(l); CURRENT_LANG = l;
  const src = CHAPTER_I18N[l];
  // подменяем содержимое рабочего CHAPTER_DATA
  CHAPTER_DATA.chapter.title = src.chapter.title;
  CHAPTER_DATA.chapter.lede = src.chapter.lede;
  CHAPTER_DATA.chapter.centralIdea = src.chapter.centralIdea;
  CHAPTER_DATA.lenses.forEach((ls,i)=>{ ls.label=src.lenses[i].label; ls.description=src.lenses[i].description; });
  CHAPTER_DATA.nodes.forEach((n,i)=>{ const s=src.nodes[i];
    n.shortTitle=s.shortTitle; n.era=s.era; n.title=s.title; n.insight=s.insight;
    n.thesis=s.thesis; n.body=s.body; n.tags=s.tags; });
  CHAPTER_DATA.edges.forEach((e,i)=>{ e.label=src.edges[i].label; });
  // UI-строки
  const _U = UI_I18N[l] || UI_I18N.ru; const _R = UI_I18N.ru || {};
  const U = {}; Object.keys(_R).forEach(k=>{ U[k] = (_U[k] && String(_U[k]).trim()) ? _U[k] : _R[k]; });
  document.documentElement.lang = l;
  const t=document.getElementById('app-title'); if(t) t.textContent=src.chapter.title;
  const ld=document.querySelector('.chapter-lede'); if(ld) ld.textContent=src.chapter.lede;
  document.querySelectorAll('[data-ui]').forEach(el=>{ const k=el.getAttribute('data-ui'); if(U[k]) el.textContent=U[k]; });
  // локализованный typeLabel + перестройка линз (иначе останутся на языке сборки)
  window.__UI_LOC = U;
  try{ buildLenses(); setLens(state.lens); }catch(e){}
  // перерисовать карту/деталь/прогресс
  try{ renderAll(); }catch(e){}
  // отметить активную кнопку языка
  document.querySelectorAll('.lang-btn').forEach(b=>b.setAttribute('aria-pressed', b.getAttribute('data-lang')===l ? 'true':'false'));
}
function buildLangSwitcher(){
  const rail=document.querySelector('.rail'); if(!rail) return;
  const wrap=document.createElement('div'); wrap.className='lang-switch';
  LANGS.forEach(l=>{ const b=document.createElement('button'); b.className='lang-btn'; b.type='button';
    b.setAttribute('data-lang',l); b.textContent=LANG_LABELS[l];
    b.addEventListener('click',()=>applyLang(l)); wrap.appendChild(b); });
  rail.insertBefore(wrap, rail.firstChild);
}


window.addEventListener("message",function(ev){try{var d=ev.data||{};if(d.lang){applyLang(d.lang);}}catch(e){}});
async function boot(){buildLangSwitcher();var _q=new URLSearchParams(location.search).get("lang");var _h=(location.hash.match(/[?&]lang=([a-z]{2})/)||[])[1];var _lp=_q||_h;if(_lp)CURRENT_LANG=pickLang(_lp);buildLenses();setLens(state.lens);applyLang(CURRENT_LANG);}
document.addEventListener("DOMContentLoaded",()=>{try{boot();}catch(e){renderEmptyState("Ошибка инициализации: "+e.message);}});
</script>
