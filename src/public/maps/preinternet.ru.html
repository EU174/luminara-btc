%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1996"}], "edges": [{"from": "scarcity", "to": "shannon", "label": "из дефицита к измерению", "lenses": ["chronology", "technology"]}, {"from": "shannon", "to": "arpanet", "label": "сигнал становится сетью", "lenses": ["chronology", "technology"]}, {"from": "memex", "to": "open-web", "label": "гипертекст становится Web", "lenses": ["chronology", "media", "technology"]}, {"from": "arpanet", "to": "open-web", "label": "устойчивость плюс открытость", "lenses": ["chronology", "power", "technology"]}, {"from": "open-web", "to": "atoms-to-bits", "label": "открытость ускоряет копирование", "lenses": ["power", "technology"]}, {"from": "atoms-to-bits", "to": "castells", "label": "экономика превращается в потоки", "lenses": ["power", "media"]}, {"from": "media-effects", "to": "castells", "label": "медиа формируют сетевое общество", "lenses": ["media", "power"]}, {"from": "arpanet", "to": "cypherpunks", "label": "сеть требует защиты", "lenses": ["privacy", "technology", "power"]}, {"from": "cypherpunks", "to": "castells", "label": "приватность внутри потоков", "lenses": ["privacy", "power"]}, {"from": "scarcity", "to": "castells", "label": "от контроля доступа к контролю потоков", "lenses": ["power"]}]}, "en": {"chapter": {"key": "preinternet", "title": "Before the internet", "sourceUrl": "https://luminara.tech/#/scene?s=3&c=preinternet", "centralIdea": "Information becomes power", "centerX": 500, "centerY": 445, "ring": 300, "lede": "How information becomes power — from scarcity and signals to network society."}, "lenses": [{"id": "chronology", "label": "Chronology", "accent": "#7dd3fc", "description": "The order of events and the shift from information scarcity to data flows."}, {"id": "power", "label": "Power", "accent": "#f87171", "description": "Who controls information: institutions, protocols, networks, or platforms."}, {"id": "technology", "label": "Technologies", "accent": "#34d399", "description": "Inventions and protocols: signal, hypertext, packets, TCP/IP, Web."}, {"id": "media", "label": "Media", "accent": "#fbbf24", "description": "How the medium of transmission changes perception, behavior, and the organization of society."}, {"id": "privacy", "label": "Privacy", "accent": "#c084fc", "description": "Cryptography as protection from surveillance and control."}], "nodes": [{"id": "scarcity", "sceneIndex": 0, "x": 500.0, "y": 145.0, "type": "power", "title": "Information as Scarcity", "shortTitle": "Scarcity", "thesis": "Before the internet, information was physically expensive, slow, and centralized.", "insight": "Before the internet, information was physically expensive and centralized — this made it a tool of power for those who had the equipment.", "body": "## A World Where Words Cost Money\n\nYou are reading this on a screen. Somewhere in a data center, a server sent you this text in milliseconds — and it cost you nothing. It feels self-evident, like electricity or running water. But it was not always this way. And understanding what it was like \"before\" is not historical curiosity, but the key to understanding why the modern internet is built exactly as it is. And why that is a problem.\n\nJust seventy years ago, sending a message from Kyiv to New York cost money, took days and was controlled by those who had the equipment: states, telegraph companies, newspaper editorial offices. Information was a scarcity — exactly like oil or grain. And like any scarcity, it was power. Whoever controlled the transmission of information controlled reality.\n\nImagine a printing house in the mid-twentieth century. Huge metal machines, lead type, the smell of ink and oil. To deliver one idea to a million people, you had to physically print a million copies of a newspaper, load them onto trucks, and distribute them to kiosks across the country. Every copy cost money. Every kilometer of delivery cost money. A typo in the print run meant money thrown away, reputation damaged. It was a huge, heavy, slow mechanism.\n\nRadio and television seemed like a revolution — the signal travels at the speed of light, no trucks needed. But they had a fundamental limitation: one transmitter, millions of receivers. Only the person with the tower could speak. The rest of humanity listened. You could not pick up the receiver and answer. You could not object. You could not add your own voice.\n\nThis is what the information world looked like before the internet: centralized, expensive, one-way. A few sources broadcast to many. Information flowed strictly from top to bottom — from those who had the equipment to those who did not. This was not an accident or malicious intent — it was the physical reality of the technologies of that time.\n\n> Information was not just a resource — it was the architecture of power. Whoever owned the channel of transmission owned reality.\n\nThat is why the first people who understood that this architecture could be changed understood something revolutionary. Not simply that \"data could be transmitted faster.\" But that \"the very structure of power over information can be broken.\" And they began working on it — long before the first browser appeared.", "tags": ["power", "scarcity", "media"], "lensWeight": {"chronology": 5, "power": 5, "technology": 1, "media": 4, "privacy": 1}, "angDeg": -90.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "before 1948"}, {"id": "shannon", "sceneIndex": 1, "x": 692.8, "y": 215.2, "type": "technology", "title": "Shannon: Information Became Physics", "shortTitle": "Shannon", "thesis": "Information could now be measured, encoded, and transmitted like a physical quantity.", "insight": "Shannon proved that information can be measured and transmitted as a physical quantity — this laid the mathematical foundation for the entire digital world.", "body": "## The Man Who Measured Thought\n\nIn 1948, the American mathematician Claude Shannon published a paper with the dry technical title \"A Mathematical Theory of Communication.\" Few people read it then. Few people read it now. But it changed the world more than most books everyone reads.\n\nShannon proved something that had seemed impossible: any message — a word, a sound, an image, a number, a smell described in words — can be precisely measured, compressed and transmitted through any communication channel. He called the unit of measurement a \"bit\" — from binary digit. Zero or one. Signal or no signal. The entire universe of information is combinations of zeros and ones.\n\nBefore Shannon, information was something vague and subjective. Some words were \"more important\" than others. Some images were \"more meaningful.\" Some messages were \"richer.\" After Shannon, information became a physical quantity, just as real and measurable as mass or temperature. The world stopped being divided only into matter and energy. A third thing appeared — information. And this third thing turned out to be no less fundamental than the first two.\n\n## A Candle Flame Across the Ocean\n\nTo understand what Shannon did, imagine this task: transmit the flame of a candle from Kyiv to Tokyo. You can carry the candle itself — but that is slow, expensive, and the flame will go out on the way. This is the transmission of matter, and it is limited by physical laws.\n\nBut you can describe the flame: its color, height, temperature, shape, the chemical composition of the wax. Send this description at the speed of light through a wire. And another person in Tokyo will light exactly the same flame. This is the transmission of information — and it does not know physical limitations.\n\nShannon showed that this second method can be made absolutely precise, reliable and scalable. That any signal can be encoded into bits, transmitted without distortion and reconstructed on the other side. The entire digital world stands on this: from email to 4K streaming, from messengers to blockchain.\n\nEvery time you send a message in Telegram — Shannon is at work. Every time a transaction in a blockchain is transmitted between network nodes — Shannon is at work. He created the mathematical foundation on which everything digital is built.\n\n> Shannon did not invent the internet. He proved that the internet was possible — that information can be transmitted precisely, like a physical quantity.\n\nThe paradox is that Shannon himself worked at Bell Laboratories — the largest telephone monopoly in the world. His discovery eventually destroyed his employer's monopoly. When information can be transmitted through any channel, it means no channel can remain a monopoly forever.", "tags": ["signal", "coding", "measurement"], "lensWeight": {"chronology": 4, "power": 2, "technology": 5, "media": 2, "privacy": 2}, "angDeg": -50.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1948"}, {"id": "memex", "sceneIndex": 2, "x": 795.4, "y": 392.9, "type": "media", "title": "Bush's Memex: A Dream Ahead of Its Time", "shortTitle": "Memex", "thesis": "Linked knowledge was imagined before the Web as a personal machine of associations.", "insight": "In 1945, Vannevar Bush described hypertext and connected knowledge — 46 years before the Web. The right ideas do not die; they wait for their technologies.", "body": "## Hypertext Forty Years Before the Internet\n\nBack in 1945 — two years before the first fully fledged computer appeared and forty-six years before the World Wide Web — the American scientist Vannevar Bush wrote an essay titled \"As We May Think.\" It was published in The Atlantic — not in a scientific journal, but in a mass publication for a broad audience. Bush wanted everyone to read him, not only fellow scientists.\n\nHe described a device he called \"memex\" — from memory extender. It was a personal library of all human knowledge, where any document is connected to any other by meaning. You read an article about Napoleon — and with one movement move to a map of his campaigns. From the map — to letters from his generals. From the letters — to an analysis of his tactics by twentieth-century military historians. You do not search an alphabetical catalog, you do not browse shelves — you follow the chain of thought, the way thought itself follows.\n\nThis was hypertext. Forty years before the word would be officially coined. Forty-six years before Tim Berners-Lee would implement this idea as the World Wide Web.\n\n## Why the Dream Sat in a Desk Drawer\n\nBush saw the future with complete clarity: knowledge should be connected, accessible to everyone and belong to all. There was only one problem — the technologies did not yet exist. In 1945, computers occupied entire rooms, cost as much as airplanes and could only calculate. No displays, no mice, no networks. Bush described the device in terms of microfilm and mechanical levers — because that was all he had available for analogy.\n\nHis dream sat in a desk drawer for almost half a century. But it was not forgotten. People read it, quoted it, passed it from hand to hand. Ted Nelson coined the word \"hypertext\" in 1965 — directly inspired by Bush. Douglas Engelbart created the computer mouse and a system of hypertext documents — also under Bush's influence.\n\nWhen Tim Berners-Lee wrote his proposal to create the Web at CERN in 1989, he directly referred to Bush's essay as the original idea. Forty-four years after publication, the dream finally received the tools for implementation.\n\nThis story matters not as a historical curiosity. It shows something fundamental: the right idea does not die. It waits for its moment. Sometimes for decades. Today we are living through a similar moment: ideas of a decentralized internet, where users own their data, existed long before blockchain. The technologies have simply finally caught up with the vision.\n\n> Bush described the World Wide Web forty-six years before its invention. Not because he was a prophet — but because he understood what the human mind wants from tools of knowledge.\n\nParadoxically, in 1945 Bush was thinking about links between ideas — while in the end we got an internet where links between people turned out to be more important than links between ideas. This is an important difference, and we will return to it in the following chapters.", "tags": ["hypertext", "knowledge", "associations"], "lensWeight": {"chronology": 4, "power": 2, "technology": 4, "media": 5, "privacy": 1}, "angDeg": -10.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1945"}, {"id": "arpanet", "sceneIndex": 3, "x": 759.8, "y": 595.0, "type": "technology", "title": "ARPANET: the internet was born from fear", "shortTitle": "ARPANET", "thesis": "Communication became resilient when the network lost its single point of failure.", "insight": "ARPANET was created as a military communications system with no single point of failure, and this decentralized architecture became the foundation of the entire internet.", "body": "## The satellite that changed the architecture of the world\n\nThe history of the internet does not begin in Silicon Valley or in university lecture halls. It begins in the Pentagon, at the height of the Cold War, in a moment of acute geopolitical fear.\n\nOn October 4, 1957, the Soviet Union launched the first artificial Earth satellite. A small metal sphere 58 centimeters in diameter, weighing 83 kilograms, flew above the Earth and beeped, and the whole world heard it. For the American military, this was not just a competitor's technological triumph. It was an alarm signal: the enemy controls orbit. If they can launch a satellite, they can launch a missile with a nuclear warhead and reach any point on the planet.\n\nA year later, the United States created DARPA, the Defense Advanced Research Projects Agency. Its task was to create a military communications system that could not be destroyed by a single strike. Traditional telephone networks were catastrophically vulnerable: where there is a central telephone exchange, there is a point of failure. One bomb on the Pentagon, and communication with the entire army is lost.\n\n## A network without a center, the idea that changed everything\n\nDARPA engineers came up with a fundamentally different solution. What if the center were removed entirely? Make every node in the network equal. If one fails, the message automatically finds another route. Like water in pipes: if one pipe is blocked, the water finds a detour.\n\nThis idea was called ARPANET. In 1969, it worked for the first time: four universities, UCLA, Stanford, UC Santa Barbara and Utah, exchanged data over a telephone line. The first message they tried to send was the word \"login\". The system crashed after the letter \"o\". The first word transmitted over the proto-internet was \"lo\", which in English means \"look\". Accidental poetry.\n\nNo one then thought this would become the foundation of the global civilian internet. The military wanted reliable communication in case of nuclear war. They created something larger: an architecture in which power structurally cannot concentrate in one point. A distributed network is, by its nature, resistant to centralization.\n\nAt least, that was the idea. Reality turned out to be more complicated, and we will talk about that in the next chapters.\n\n> The internet was created as a military communications system resistant to a nuclear strike. In the end, it proved resistant to any centralization of power, and this became its main political property.\n\nIn 1974, Vinton Cerf and Robert Kahn solved the next problem: different computers spoke different languages. Stanford's network did not understand MIT's network. They created TCP/IP, a universal protocol, a common language for transmitting data between any networks. Data is split into small packets, each finds its own path, and at the other end it is assembled back together. As if you cut a letter into pieces, sent each piece by a separate courier, and they still came together in the correct order at the recipient's end. This very protocol remains the foundation of the internet today, fifty years after it was created.", "tags": ["packets", "DARPA", "TCP/IP", "decentralization"], "lensWeight": {"chronology": 5, "power": 5, "technology": 5, "media": 2, "privacy": 3}, "angDeg": 30.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1969"}, {"id": "open-web", "sceneIndex": 4, "x": 602.6, "y": 726.9, "type": "technology", "title": "Berners-Lee: the decision to give everything away for free", "shortTitle": "Open Web", "thesis": "The Web became mass-scale because its base protocol was open to everyone.", "insight": "Berners-Lee gave the Web away for free, not out of altruism, but because he understood that only an open protocol can become global.", "body": "## A proposal marked \"vague, but exciting\"\n\nIn 1989, a young British programmer named Tim Berners-Lee was working at CERN, the European Organization for Nuclear Research in Geneva. It is the world's largest scientific institute: thousands of scientists from dozens of countries work on the same experiments, but constantly lose documents, forget context, and spend months figuring out what had already been done before them.\n\nBerners-Lee wrote an internal proposal for management. The idea: create a system where all documents are connected by links and accessible from any computer on the network. His boss, Mike Sendall, wrote three words in the margin: \"Vague, but exciting\". It was the most modest review of an invention that would change the world.\n\nOver three years, Berners-Lee created three things on which the entire modern internet stands: HTML, the language for marking up documents; HTTP, the protocol for transmitting them; and URL, the addressing system. Together they formed the World Wide Web. Documents are stored on servers, have addresses, are connected by links, and open through a browser program. Simple, elegant, universal.\n\n## The decision that defined an era\n\nBut the key decision was not technical. It was ethical.\n\nBerners-Lee could have patented his invention. CERN's lawyers suggested it. If every site had paid royalties for using HTTP, Berners-Lee would have become the richest person on the planet. Instead, he insisted on giving the technology to humanity for free, without restrictions, without licenses, without conditions.\n\n\"If the Web had been patented or controlled by one company, it would not have existed,\" he later explained. This was not altruism for altruism's sake. It was a strategy: only without barriers could the network grow to global scale. Only if anyone can create a site without permission will the network become truly open.\n\nIn 1993, students at the US National Center for Supercomputing Applications released the Mosaic browser, the first to show text and images together on one screen. Before that, the internet was a world of text. Mosaic made it visual. And understandable for an ordinary person who had never learned programming.\n\nThat same year, the number of websites passed five hundred. It sounds funny now, but at the time it was an explosion. Two years later, there were already two hundred thousand. The race had begun.\n\n> Berners-Lee gave the Web away for free, and by doing so made it global. If he had patented it, we would still be paying royalties for every link.\n\nThis story about Berners-Lee is not just a biographical fact. It is a lesson about the nature of networks: open protocols grow faster than closed ones because anyone can build on them. That is why the Ethereum blockchain is open. That is why TON is an open protocol. In 1991, Berners-Lee laid down a principle that still determines which technologies win.", "tags": ["Web", "protocol", "openness"], "lensWeight": {"chronology": 5, "power": 4, "technology": 5, "media": 4, "privacy": 2}, "angDeg": 70.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1991"}, {"id": "atoms-to-bits", "sceneIndex": 5, "x": 397.4, "y": 726.9, "type": "economy", "title": "From atoms to bits: a shift in economic logic", "shortTitle": "Atoms → bits", "thesis": "Value began to move like information: copyable, instant, and almost free.", "insight": "The shift \"from atoms to bits\" is not just technology; it is a change in economic logic, from the scale of sameness to the uniqueness of each interaction.", "body": "## Toffler saw it in 1980\n\nWhen Alvin Toffler published The Third Wave in 1980, personal computers barely existed. There was no internet. There were no mobile phones. And yet he described an economic transformation that would fully unfold only forty years later.\n\nToffler described three eras of human civilization. The first wave was agrarian: land and harvest as the main value. The second wave was industrial: the assembly line, standardization, mass production. A factory produces a thousand identical refrigerators, and it is efficient precisely because they are identical. The more units of product, the lower the cost of each one. Scale is the victory of the industrial economy.\n\nThe third wave is informational. And here the logic turns upside down. In the information economy, copying is free. One program can behave differently with a billion users at the same time, and this is not a bug, but its main advantage. Value is created not by replicating the identical, but by the uniqueness of each interaction.\n\n## Nicholas Negroponte and the simplest formula\n\nIn 1995, MIT Media Lab director Nicholas Negroponte expressed this in one phrase that became famous: \"from atoms to bits\".\n\nAtoms are the physical world. To produce a refrigerator, you need metal, plastic, electronics, labor, a factory. To deliver it to the buyer, you need a truck, a warehouse, a store. Every copy costs money. Distribution is limited by resources. If you want to sell a million refrigerators, you need to produce a million refrigerators.\n\nBits are the digital world. To create a program, you need one developer and one computer. To deliver it to a billion users, you need a server and an internet connection. Copying is practically free. Delivery is instant. Distribution is infinite. If you want to sell a billion copies of a program, you do not need to manufacture a billion programs. One copy replicates a billion times.\n\nThis is not just a technological difference. It is a shift in fundamental economic logic. The entire economy of the 20th century was built on the logic of atoms: scarcity, scale, standardization. The economy of the 21st century is built on the logic of bits: abundance, personalization, network effects.\n\n> The industrial economy earned money from the scale of sameness. The information economy earns money from the uniqueness of each interaction. These are opposite logics.\n\nOnce you understand this difference, much of the modern world starts to make sense. Why is Google free? Because copying search results costs nothing, and monetization comes through advertising. Why does Spotify pay musicians pennies? Because the marginal cost of one stream approaches zero. Why are cryptocurrencies possible at all? Because digital assets can be transferred without a physical medium. All of these are consequences of one principle that Negroponte formulated in three words.", "tags": ["economy", "bits", "scale"], "lensWeight": {"chronology": 4, "power": 4, "technology": 3, "media": 3, "privacy": 1}, "angDeg": 110.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1995"}, {"id": "media-effects", "sceneIndex": 6, "x": 240.2, "y": 595.0, "type": "media", "title": "McLuhan and Rushkoff's Viruses: Media Change Us", "shortTitle": "Media", "thesis": "What matters is not only information, but also the medium that reshapes behavior.", "insight": "McLuhan and Rushkoff understood that what matters is not information, but the environment through which it is transmitted. Media change us regardless of content - through a structure we do not notice.", "body": "## The medium matters more than the message\n\nMarshall McLuhan was an inconvenient thinker. In 1964, he wrote a phrase that was first dismissed as nonsense, then treated as a metaphor, and only later understood as a precise technical description of reality: \"The medium is the message.\"\n\nWhat did he mean? When mass television appeared in the 1950s, everyone argued about content: good programs or bad ones, educational or entertaining, propaganda or art. McLuhan said: that is a secondary question. Television itself - as an environment, as a technology, as a mode of perception - had already changed society, regardless of what exactly was being shown.\n\nFor the first time in history, television synchronized millions of people: the same news at the same time in the same words - in every home across the country at once. It created what McLuhan called the \"global village\" - a world where everyone experiences the same event at the same time. Before television, people in different cities lived in different informational realities. After it, they lived in one.\n\n## Rushkoff's biological metaphor\n\nIn 1994, the American media theorist Douglas Rushkoff added a biological metaphor to McLuhan's idea, and it turned out to be even more precise. In the book *Media Virus!*, he described the mechanism now called viral content - ten years before YouTube and twenty years before TikTok.\n\nIdeas spread like viruses. Not because they are true. Not because they are useful. But because they hit a psychological vulnerability in the audience - the thing that makes people pass them on: fear, outrage, delight, recognition, anger, tenderness. Emotion is the replication mechanism of an idea.\n\nRushkoff showed that content that triggers a strong emotion spreads regardless of its truth or usefulness. A scandalous story travels faster than a true one. A frightening story travels faster than a boring one. This is not an accident and not manipulation - it is an architectural feature of the media environment. A virus does not choose its host by the criterion of \"good person or bad person.\" It chooses by the criterion of \"vulnerable or not.\"\n\nLong before TikTok algorithms, which are optimized precisely for this, Rushkoff described the principle on which they are built. The algorithm did not create virality. It simply learned how to amplify it.\n\n> McLuhan warned: what matters is not the program, but the television set. Rushkoff clarified: what matters is not the idea, but the emotion it provokes. Together, they described the architecture of modern social networks thirty years before they appeared.\n\nWhen the internet appeared, the first question was again about content: what would people read and watch there? McLuhan would have said: wrong question. The right one is: what does the environment itself do to a person when they spend more and more time inside it? This question became critically important when social networks appeared. Unfortunately, it was asked too late.", "tags": ["media", "behavior", "perception"], "lensWeight": {"chronology": 3, "power": 3, "technology": 1, "media": 5, "privacy": 2}, "angDeg": 150.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1964→1990s"}, {"id": "cypherpunks", "sceneIndex": 7, "x": 204.6, "y": 392.9, "type": "privacy", "title": "Hughes and the Cypherpunks: Privacy Is Mathematics", "shortTitle": "Cypherpunks", "thesis": "Privacy in the digital environment requires cryptography, not promises from institutions.", "insight": "In 1993, Hughes predicted the privacy crisis and demanded mathematical protection - his manifesto became the ideological foundation of Bitcoin and all of Web3.", "body": "## The voice that warned in advance\n\nIn 1993, when most people were hearing the word \"internet\" for the first time, the mathematician and cryptographer Eric Hughes wrote a three-page document. It was called \"A Cypherpunk's Manifesto\" and was published on the mailing list of a small community of people who worked on cryptography and thought about the consequences of a public network appearing.\n\nAt the time, the internet was only just becoming available to ordinary people. The first browsers had only just appeared. No one was thinking yet about privacy online - people were simply excited by the new possibilities: you could correspond with people on the other side of the planet! You could read news in real time! You could find any information!\n\nHughes thought differently. His argument was simple and ironclad: an open internet means that every action you take online is potentially visible to everyone - providers, governments, corporations. This is not an accidental vulnerability. It is an architectural feature of a system that, intentionally or not, was built exactly this way. And the only way to protect privacy under these conditions is not to ask providers and governments for permission, but to use mathematics. Cryptography. Mathematics that no law can break.\n\n## A prophecy that came true literally\n\nHughes wrote in 1993: \"Privacy in an open society requires anonymous transaction systems.\" It sounded like science fiction. Most readers shrugged: \"I have nothing to hide.\" Why would an ordinary person need anonymous transactions?\n\nThirty years later, we live in a world where corporations know more about users than their loved ones do. Where data leaks have become daily news. Where every card purchase, every search query, every movement with a phone turned on is recorded and stored. Hughes was not paranoid. He was simply thinking several moves ahead.\n\nThe cypherpunks - a small community that gathered around this idea in the early 1990s - ultimately laid the ideological foundation for Bitcoin. In 2008, Satoshi Nakamoto published the description of Bitcoin specifically on the cypherpunk mailing list. It was a direct answer to Hughes's question: here is your anonymous transaction system, built on mathematics rather than trust in an intermediary.\n\nBack in 1984, Stewart Brand uttered the phrase that became a manifesto of the open internet: \"Information wants to be free.\" He meant the nature of information - it does not diminish when copied, so artificial barriers contradict its nature. Hughes completed this from the other side: freedom of information without privacy is not freedom; it is transparency for those who are watching.\n\n> Brand said: information wants to be free. Hughes answered: and privacy wants to be protected by mathematics. Together, they described the two poles of digital freedom.\n\nThese two principles - openness and privacy - in some sense contradict each other. And the tension between them still defines the main arguments about what the internet should be. How can knowledge be made accessible to everyone while each person's personal data is protected? This question has not yet been solved. And it is exactly what Web3 is trying to solve.", "tags": ["cryptography", "privacy", "surveillance"], "lensWeight": {"chronology": 3, "power": 4, "technology": 4, "media": 2, "privacy": 5}, "angDeg": 190.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1993"}, {"id": "castells", "sceneIndex": 8, "x": 307.2, "y": 215.2, "type": "power", "title": "Castells: Power Shifted to Flows", "shortTitle": "Flows", "thesis": "Power shifted from control over places to control over data flows.", "insight": "Castells showed that power shifted from control over places to control over flows of data and attention - and this made it invisible and hard to challenge.", "body": "## The revolution no one noticed\n\nBy the mid-1990s, the Spanish sociologist Manuel Castells was observing a transformation happening in plain sight - and wrote a three-volume work about what most people were not noticing. The information revolution had already happened. People were simply looking for it in the wrong place.\n\nThey were waiting for flying cars and robots in the kitchen. They were waiting for the fantastic future promised by popular science magazines of the 1960s. But the revolution was happening in bank server rooms, in the logistics centers of global corporations, in financial flows between continents. By the 1990s, money had already stopped being physical - it had become flows of data between servers. Production had stopped being local - it had become a global network of suppliers, where design is done in California, parts are made in China, assembly happens in Vietnam, and sales happen everywhere. Power was no longer measured by territory.\n\n## The space of places versus the space of flows\n\nCastells introduced a distinction that helps explain the modern world. Old power controlled the \"space of places\": factories, ports, borders, territories. Physical points that can be occupied, defended, held. New power controls the \"space of flows\": data, capital, attention, information.\n\nThese are fundamentally different kinds of power. Territorial power can be seen on a map - here is the border, here is the army, here is the castle. Power over flows is invisible. Where is Google's power located? Nowhere and everywhere at once. Where is Facebook's power located? In the algorithm that determines what billions of people see. Where is Bitcoin's power located? In a distributed network that has no physical location.\n\nCastells showed: whoever controls the flows controls the world. And this observation proved frighteningly accurate. Five or six technology companies control most of the planet's information flows. They do not own territories. They own algorithms that determine what people see, read, buy, and believe in.\n\nDaniel Bell had predicted back in 1973 the transition to a post-industrial society where the main resource is information and the main institutions are not factories, but universities and research laboratories. In the 1990s, Castells saw that this had happened - but power over information was concentrated somewhere very different from universities.\n\n> Old power controlled places. New power controls flows. And flows are much harder to challenge than territory.\n\nThis is the fundamental question that runs through the entire course: how is power organized in a world where information is the main resource? Who controls it? How does it concentrate? And what happens when a few corporations seize control over most of the planet's information flows? The next chapters are about this.", "tags": ["flows", "society", "power"], "lensWeight": {"chronology": 4, "power": 5, "technology": 2, "media": 4, "privacy": 3}, "angDeg": 230.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1996"}], "edges": [{"from": "scarcity", "to": "shannon", "label": "from scarcity to measurement", "lenses": ["chronology", "technology"]}, {"from": "shannon", "to": "arpanet", "label": "the signal becomes a network", "lenses": ["chronology", "technology"]}, {"from": "memex", "to": "open-web", "label": "hypertext becomes the Web", "lenses": ["chronology", "media", "technology"]}, {"from": "arpanet", "to": "open-web", "label": "resilience plus openness", "lenses": ["chronology", "power", "technology"]}, {"from": "open-web", "to": "atoms-to-bits", "label": "openness accelerates copying", "lenses": ["power", "technology"]}, {"from": "atoms-to-bits", "to": "castells", "label": "the economy turns into flows", "lenses": ["power", "media"]}, {"from": "media-effects", "to": "castells", "label": "media shape network society", "lenses": ["media", "power"]}, {"from": "arpanet", "to": "cypherpunks", "label": "the network requires protection", "lenses": ["privacy", "technology", "power"]}, {"from": "cypherpunks", "to": "castells", "label": "privacy inside the flows", "lenses": ["privacy", "power"]}, {"from": "scarcity", "to": "castells", "label": "from access control to flow control", "lenses": ["power"]}]}, "uk": {"chapter": {"key": "preinternet", "title": "До інтернету", "sourceUrl": "https://luminara.tech/#/scene?s=3&c=preinternet", "centralIdea": "Інформація стає владою", "centerX": 500, "centerY": 445, "ring": 300, "lede": "Як інформація стає владою — від дефіциту й сигналів до мережевого суспільства."}, "lenses": [{"id": "chronology", "label": "Хронологія", "accent": "#7dd3fc", "description": "Порядок подій і перехід від дефіциту інформації до потоків даних."}, {"id": "power", "label": "Влада", "accent": "#f87171", "description": "Хто контролює інформацію: інститути, протоколи, мережі чи платформи."}, {"id": "technology", "label": "Технології", "accent": "#34d399", "description": "Винаходи й протоколи: сигнал, гіпертекст, пакети, TCP/IP, Web."}, {"id": "media", "label": "Медіа", "accent": "#fbbf24", "description": "Як середовище передавання змінює сприйняття, поведінку й організацію суспільства."}, {"id": "privacy", "label": "Приватність", "accent": "#c084fc", "description": "Криптографія як захист від нагляду й контролю."}], "nodes": [{"id": "scarcity", "sceneIndex": 0, "x": 500.0, "y": 145.0, "type": "power", "title": "Інформація як дефіцит", "shortTitle": "Дефіцит", "thesis": "До інтернету інформація була фізично дорогою, повільною й централізованою.", "insight": "До інтернету інформація була фізично дорогою й централізованою — це робило її інструментом влади тих, у кого було обладнання.", "body": "## Світ, де слова коштували грошей\n\nТи читаєш це на екрані. Десь у дата-центрі сервер надіслав тобі цей текст за мілісекунди — і це не коштувало тобі нічого. Це здається само собою зрозумілим, як електрика чи водопровід. Але так було не завжди. І розуміння того, як було «до», — це не історична цікавість, а ключ до розуміння того, чому сучасний інтернет влаштований саме так. І чому це проблема.\n\nУсього сімдесят років тому передати повідомлення з Києва до Нью-Йорка коштувало грошей, займало дні й контролювалося тими, у кого було обладнання: державами, телеграфними компаніями, редакціями газет. Інформація була дефіцитом — точно таким самим, як нафта чи зерно. І як будь-який дефіцит, вона була владою. Той, хто контролював передавання інформації, контролював реальність.\n\nУяви собі друкарню середини XX століття. Величезні металеві машини, свинцеві літери, запах фарби й мастила. Щоб донести одну ідею до мільйона людей, потрібно було фізично надрукувати мільйон примірників газети, завантажити їх у вантажівки, розвезти по кіосках по всій країні. Кожна копія коштувала грошей. Кожен кілометр доставки коштував грошей. Друкарська помилка в накладі — гроші викинуті, репутація підірвана. Це був величезний, важкий, повільний механізм.\n\nРадіо й телебачення здавалися революцією — сигнал поширюється зі швидкістю світла, жодних вантажівок. Але в них було принципове обмеження: один передавач, мільйони приймачів. Говорити міг тільки той, у кого була вежа. Усе інше людство — слухало. Підняти слухавку й відповісти було не можна. Заперечити — не можна. Додати своє — не можна.\n\nТак виглядав інформаційний світ до інтернету: централізований, дорогий, односпрямований. Кілька джерел мовили на багатьох. Інформація текла строго згори вниз — від тих, у кого є обладнання, до тих, у кого його немає. Це не випадковість і не злий умисел — це була фізична реальність технологій того часу.\n\n> Інформація була не просто ресурсом — вона була архітектурою влади. Хто володів каналом передавання, той володів реальністю.\n\nСаме тому перші люди, які зрозуміли, що цю архітектуру можна змінити, зрозуміли щось революційне. Не просто «можна передавати дані швидше». А «сама структура влади над інформацією може бути зламана». І вони почали працювати над цим — задовго до того, як з'явився перший браузер.", "tags": ["влада", "дефіцит", "медіа"], "lensWeight": {"chronology": 5, "power": 5, "technology": 1, "media": 4, "privacy": 1}, "angDeg": -90.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "до 1948"}, {"id": "shannon", "sceneIndex": 1, "x": 692.8, "y": 215.2, "type": "technology", "title": "Шеннон: інформація стала фізикою", "shortTitle": "Шеннон", "thesis": "Інформацію стало можливо вимірювати, кодувати й передавати як фізичну величину.", "insight": "Шеннон довів, що інформацію можна вимірювати й передавати як фізичну величину — це заклало математичний фундамент усього цифрового світу.", "body": "## Людина, яка виміряла думку\n\nУ 1948 році американський математик Клод Шеннон опублікував роботу із сухою технічною назвою «Математична теорія комунікації». Тоді її мало хто читав. Зараз її теж мало хто читає. Але вона змінила світ більше, ніж більшість книжок, які читають усі.\n\nШеннон довів те, що здавалося неможливим: будь-яке повідомлення — слово, звук, образ, число, запах, описаний словами — можна точно виміряти, стиснути й передати будь-яким каналом зв'язку. Він назвав одиницю вимірювання «біт» — від binary digit, двійкова цифра. Нуль або одиниця. Є сигнал або немає. Увесь всесвіт інформації — це комбінації нулів і одиниць.\n\nДо Шеннона інформація була чимось туманним і суб'єктивним. Одні слова «важливіші» за інші. Одні образи «змістовніші». Одні повідомлення «багатші». Після Шеннона інформація стала фізичною величиною, такою ж реальною й вимірюваною, як маса чи температура. Світ перестав ділитися тільки на матерію й енергію. З'явилося третє — інформація. І це третє виявилося не менш фундаментальним, ніж перші два.\n\n## Полум'я свічки через океан\n\nЩоб зрозуміти, що зробив Шеннон, уяви таке завдання: передати полум'я свічки з Києва до Токіо. Можна везти саму свічку — але це повільно, дорого, і полум'я згасне в дорозі. Це передавання матерії, і воно обмежене фізичними законами.\n\nАле можна описати полум'я: його колір, висоту, температуру, форму, хімічний склад воску. Передати цей опис зі швидкістю світла дротом. І інша людина в Токіо запалить точно таке саме полум'я. Це передавання інформації — і воно не знає фізичних обмежень.\n\nШеннон показав, що цей другий спосіб можна зробити абсолютно точним, надійним і масштабованим. Що будь-який сигнал можна закодувати в біти, передати без спотворень і відновити з іншого боку. Саме на цьому стоїть увесь цифровий світ: від електронної пошти до стримінгу 4K, від месенджерів до блокчейну.\n\nЩоразу, коли ти надсилаєш повідомлення в Telegram, — працює Шеннон. Щоразу, коли транзакція в блокчейні передається між вузлами мережі, — працює Шеннон. Він створив математичний фундамент, на якому побудоване все цифрове.\n\n> Шеннон не винайшов інтернет. Він довів, що інтернет можливий — що інформацію можна передавати точно, як фізичну величину.\n\nПарадокс у тому, що сам Шеннон працював у Bell Laboratories — найбільшій телефонній монополії світу. Його відкриття зрештою зруйнувало монополію його роботодавця. Коли інформацію можна передавати будь-яким каналом — отже, жоден канал не може бути монополістом назавжди.", "tags": ["сигнал", "кодування", "вимірювання"], "lensWeight": {"chronology": 4, "power": 2, "technology": 5, "media": 2, "privacy": 2}, "angDeg": -50.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "
