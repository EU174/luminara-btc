0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1948"}, {"id": "memex", "sceneIndex": 2, "x": 795.4, "y": 392.9, "type": "media", "title": "Мемекс Буша: мрія, що випередила час", "shortTitle": "Memex", "thesis": "Повʼязані знання були уявлені до Web як персональна машина асоціацій.", "insight": "У 1945 році Ванневар Буш описав гіпертекст і пов'язані знання — за 46 років до Web. Правильні ідеї не вмирають, вони чекають своїх технологій.", "body": "## Гіпертекст за сорок років до інтернету\n\nЩе в 1945 році — за два роки до появи першого повноцінного комп'ютера і за сорок шість років до World Wide Web — американський учений Ванневар Буш написав есе з назвою «Як ми можемо мислити». Опубліковане воно було в The Atlantic — не в науковому журналі, а в масовому виданні для широкої аудиторії. Буш хотів, щоб його прочитали всі, а не лише колеги-науковці.\n\nВін описав пристрій, який назвав «мемекс» — від memory extender, розширювач пам'яті. Це була особиста бібліотека всіх знань людства, де будь-який документ пов'язаний із будь-яким іншим за змістом. Читаєш статтю про Наполеона — і одним рухом переходиш до карти його походів. Від карти — до листів його генералів. Від листів — до аналізу його тактики військовими істориками XX століття. Не шукаєш у каталозі за алфавітом, не гортаєш полиці — а йдеш ланцюжком думки, як іде сама думка.\n\nЦе був гіпертекст. За сорок років до того, як це слово придумають офіційно. За сорок шість років до того, як Тім Бернерс-Лі реалізує цю ідею у вигляді World Wide Web.\n\n## Чому мрія пролежала в шухляді столу\n\nБуш бачив майбутнє абсолютно ясно: знання мають бути пов'язані, доступні кожному й належати всім. Проблема була одна — технологій ще не існувало. У 1945 році комп'ютери займали цілі кімнати, коштували як літаки й могли тільки рахувати. Жодних дисплеїв, жодних мишей, жодних мереж. Буш описав пристрій у термінах мікрофільмів і механічних важелів — бо це було все, що він мав для аналогії.\n\nЙого мрія пролежала в шухляді столу майже пів століття. Але вона не була забута. Її читали, цитували, передавали з рук у руки. Тед Нельсон у 1965 році придумав слово «гіпертекст» — безпосередньо надихнувшись Бушем. Дуглас Енгельбарт створив комп'ютерну мишу й систему гіпертекстових документів — теж під впливом Буша.\n\nКоли Тім Бернерс-Лі у 1989 році писав свою заявку на створення Web у CERN, він прямо посилався на есе Буша як на вихідну ідею. Через сорок чотири роки після публікації мрія нарешті отримала інструменти для реалізації.\n\nЦя історія важлива не як історичний курйоз. Вона показує дещо принципове: правильна ідея не вмирає. Вона чекає свого моменту. Іноді — десятиліттями. Сьогодні ми переживаємо схожий момент: ідеї децентралізованого інтернету, де користувачі володіють своїми даними, існували задовго до блокчейну. Технології просто нарешті наздогнали бачення.\n\n> Буш описав World Wide Web за сорок шість років до його винайдення. Не тому, що був пророком — а тому, що зрозумів, чого людський розум хоче від інструментів знання.\n\nПарадоксально, але Буш у 1945 році думав про зв'язки між ідеями — а ми зрештою отримали інтернет, де зв'язки між людьми виявилися важливішими, ніж зв'язки між ідеями. Це важлива відмінність, до якої ми повернемося в наступних главах.", "tags": ["гіпертекст", "знання", "асоціації"], "lensWeight": {"chronology": 4, "power": 2, "technology": 4, "media": 5, "privacy": 1}, "angDeg": -10.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1945"}, {"id": "arpanet", "sceneIndex": 3, "x": 759.8, "y": 595.0, "type": "technology", "title": "ARPANET: інтернет народився зі страху", "shortTitle": "ARPANET", "thesis": "Звʼязок став стійким, коли мережа втратила єдину точку відмови.", "insight": "ARPANET створювався як військова система зв'язку без єдиної точки відмови — і саме ця децентралізована архітектура стала фундаментом усього інтернету.", "body": "## Супутник, який змінив архітектуру світу\n\nІсторія інтернету починається не в Кремнієвій долині й не в університетських аудиторіях. Вона починається в Пентагоні, у розпал холодної війни, у момент гострого геополітичного страху.\n\n4 жовтня 1957 року Радянський Союз запустив перший штучний супутник Землі. Маленька металева куля діаметром 58 сантиметрів, вагою 83 кілограми, летіла над Землею і пищала — і весь світ її чув. Для американських військових це був не просто технологічний тріумф конкурента. Це був сигнал тривоги: ворог контролює орбіту. Якщо вони можуть запустити супутник, вони можуть запустити ракету з ядерною боєголовкою — і дістати будь-яку точку планети.\n\nЧерез рік США створили DARPA — Агентство передових дослідницьких проєктів. Перед ним стояло завдання: створити систему військового зв'язку, яку неможливо знищити одним ударом. Традиційні телефонні мережі були катастрофічно вразливі: є центральна телефонна станція — є точка відмови. Одна бомба на Пентагон — і зв'язок з усією армією втрачено.\n\n## Мережа без центру — ідея, що змінила все\n\nІнженери DARPA придумали принципово інше рішення. А що як прибрати центр узагалі? Зробити кожен вузол мережі рівноправним. Якщо один виходить з ладу — повідомлення автоматично знаходить інший маршрут. Як вода в трубах: якщо одну трубу перекрито, вода знаходить обхідний шлях.\n\nЦю ідею назвали ARPANET. У 1969 році вона вперше запрацювала: чотири університети — UCLA, Стенфорд, UC Санта-Барбара та Юта — обмінялися даними телефонною лінією. Перше повідомлення, яке намагалися передати, було слово \"login\". Система впала після літери \"o\". Першим словом, переданим протоінтернетом, стало \"lo\" — що англійською означає \"дивись\". Випадкова поезія.\n\nТоді ніхто не думав, що це стане фундаментом глобального цивільного інтернету. Військові хотіли надійний зв'язок на випадок ядерної війни. Вони створили щось більше — архітектуру, у якій влада структурно не може зосередитися в одній точці. Розподілена мережа за своєю природою стійка до централізації.\n\nПринаймні так це задумувалося. Реальність виявилася складнішою — і про це ми поговоримо в наступних главах.\n\n> Інтернет створювався як військова система зв'язку, стійка до ядерного удару. У підсумку він виявився стійким до будь-якої централізації влади — і це стало його головною політичною властивістю.\n\nУ 1974 році Вінтон Серф і Роберт Кан розв'язали наступну проблему: різні комп'ютери говорили різними мовами. Мережа Стенфорда не розуміла мережу MIT. Вони створили TCP/IP — універсальний протокол, єдину мову для передавання даних між будь-якими мережами. Дані розбиваються на маленькі пакети, кожен знаходить свій шлях, на іншому кінці збирається назад. Наче ти розрізав лист на частини, відправив кожну окремим кур'єром — і вони все одно зібралися в правильному порядку в отримувача. Саме цей протокол лежить в основі інтернету сьогодні — через п'ятдесят років після створення.", "tags": ["пакети", "DARPA", "TCP/IP", "децентралізація"], "lensWeight": {"chronology": 5, "power": 5, "technology": 5, "media": 2, "privacy": 3}, "angDeg": 30.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1969"}, {"id": "open-web", "sceneIndex": 4, "x": 602.6, "y": 726.9, "type": "technology", "title": "Бернерс-Лі: рішення віддати все безкоштовно", "shortTitle": "Відкритий Web", "thesis": "Web став масовим, бо базовий протокол був відкритий для всіх.", "insight": "Бернерс-Лі віддав Web безкоштовно — не з альтруїзму, а тому що зрозумів: лише відкритий протокол може стати глобальним.", "body": "## Заявка з позначкою \"туманно, але цікаво\"\n\nУ 1989 році молодий британський програміст Тім Бернерс-Лі працював у CERN — Європейському центрі ядерних досліджень у Женеві. Це найбільший у світі науковий інститут: тисячі вчених із десятків країн працюють над одними експериментами, але постійно гублять документи, забувають контекст, витрачають місяці на те, щоб розібратися в тому, що вже було зроблено до них.\n\nБернерс-Лі написав внутрішню заявку для керівництва. Суть: створити систему, де всі документи пов'язані посиланнями й доступні з будь-якого комп'ютера в мережі. Його начальник Майк Сендалл написав на полях три слова: \"Туманно, але цікаво\". Це була найскромніша рецензія на винахід, який змінить світ.\n\nЗа три роки Бернерс-Лі створив три речі, на яких тримається весь сучасний інтернет: HTML — мову розмітки документів, HTTP — протокол їх передавання, і URL — систему адресації. Разом вони утворили World Wide Web. Документи зберігаються на серверах, мають адреси, пов'язані посиланнями й відкриваються через програму-браузер. Просто, елегантно, універсально.\n\n## Рішення, яке визначило епоху\n\nАле ключове рішення було не технічним. Воно було етичним.\n\nБернерс-Лі міг запатентувати свій винахід. Юристи CERN це пропонували. Якби кожен сайт платив роялті за використання HTTP, Бернерс-Лі став би найбагатшою людиною планети. Натомість він наполіг на тому, щоб віддати технологію людству безкоштовно — без обмежень, без ліцензій, без умов.\n\n\"Якби Web був запатентований або перебував під контролем однієї компанії, його б не існувало\", — пояснив він пізніше. Це не був альтруїзм заради альтруїзму. Це була стратегія: тільки без бар'єрів мережа могла вирости до глобального масштабу. Тільки якщо будь-хто може створити сайт без дозволу — мережа стане по-справжньому відкритою.\n\nУ 1993 році студенти Національного центру суперкомп'ютерних застосунків США випустили браузер Mosaic — перший, який показував текст і картинки разом на одному екрані. До цього інтернет був світом тексту. Mosaic зробив його візуальним. І зрозумілим для звичайної людини, яка ніколи не вчилася програмуванню.\n\nТого ж року кількість веб-сайтів перевалила за п'ятсот. Зараз це звучить смішно, але тоді це був вибух. Через два роки їх було вже двісті тисяч. Перегони почалися.\n\n> Бернерс-Лі віддав Web безкоштовно — і тим самим зробив його глобальним. Якби він його запатентував, ми б досі платили роялті за кожне посилання.\n\nЦя історія про Бернерса-Лі — не просто біографічний факт. Це урок про природу мереж: відкриті протоколи ростуть швидше за закриті, бо будь-хто може на них будувати. Саме тому блокчейн Ethereum відкритий. Саме тому TON — відкритий протокол. Бернерс-Лі у 1991 році заклав принцип, який досі визначає, які технології перемагають.", "tags": ["Web", "протокол", "відкритість"], "lensWeight": {"chronology": 5, "power": 4, "technology": 5, "media": 4, "privacy": 2}, "angDeg": 70.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB льності кожної взаємодії.", "body": "## Тоффлер бачив це у 1980-му\n\nКоли у 1980 році Елвін Тоффлер публікував \"Третю хвилю\", персональних комп'ютерів майже не існувало. Інтернету не було. Мобільних телефонів не було. І все ж він описав економічну трансформацію, яка повністю розгорнулася лише через сорок років.\n\nТоффлер описав три епохи людської цивілізації. Перша хвиля — аграрна: земля й урожай як головна цінність. Друга хвиля — промислова: конвеєр, стандартизація, тираж. Завод виробляє тисячу однакових холодильників — це ефективно саме тому, що вони однакові. Що більше одиниць продукту, то нижча собівартість кожної. Масштаб — це перемога індустріальної економіки.\n\nТретя хвиля — інформаційна. І тут логіка перевертається з ніг на голову. В інформаційній економіці копіювання безкоштовне. Одна програма може поводитися по-різному з мільярдом користувачів одночасно — і це не баг, а головна перевага. Цінність створюється не через тиражування однакового, а через унікальність кожної взаємодії.\n\n## Ніколас Негропонте і найпростіша формула\n\nУ 1995 році директор MIT Media Lab Ніколас Негропонте сформулював це однією фразою, що стала крилатою: \"від атомів до бітів\".\n\nАтоми — це фізичний світ. Щоб виробити холодильник, потрібні метал, пластик, електроніка, робочі руки, завод. Щоб доставити його покупцеві — вантажівка, склад, магазин. Кожна копія коштує грошей. Тираж обмежений ресурсами. Якщо ти хочеш продати мільйон холодильників — тобі потрібно виробити мільйон холодильників.\n\nБіти — це цифровий світ. Щоб створити програму, потрібен один розробник і один комп'ютер. Щоб доставити її мільярду користувачів — потрібен сервер та інтернет-з'єднання. Копіювання практично безкоштовне. Доставка миттєва. Тираж нескінченний. Якщо ти хочеш продати мільярд копій програми — тобі не потрібно виробляти мільярд програм. Одна копія реплікується мільярд разів.\n\nЦе не просто технологічна відмінність. Це зміна фундаментальної економічної логіки. Уся економіка XX століття була побудована на логіці атомів: дефіцит, масштаб, стандартизація. Економіка XXI століття будується на логіці бітів: достаток, персоналізація, мережеві ефекти.\n\n> Індустріальна економіка заробляла на масштабі однакового. Інформаційна економіка заробляє на унікальності кожної взаємодії. Це протилежні логіки.\n\nКоли розумієш цю відмінність — багато що в сучасному світі починає пояснюватися. Чому Google безкоштовний? Тому що копіювання пошукової видачі нічого не коштує — монетизація йде через рекламу. Чому Spotify платить музикантам копійки? Тому що гранична вартість одного стриму прямує до нуля. Чому криптовалюти взагалі можливі? Тому що цифрові активи можна передавати без фізичного носія. Усе це наслідки одного принципу, який Негропонте сформулював трьома словами.", "tags": ["економіка", "біти", "масштаб"], "lensWeight": {"chronology": 4, "power": 4, "technology": 3, "media": 3, "privacy": 1}, "angDeg": 110.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20 інформація, а й середовище, яке перебудовує поведінку.", "insight": "Маклюен і Рашкофф зрозуміли: важлива не інформація, а середовище її передавання. Медіа змінюють нас незалежно від змісту - через структуру, яку ми не помічаємо.", "body": "## Засіб передавання важливіший за повідомлення\n\nМаршалл Маклюен був незручним мислителем. У 1964 році він написав фразу, яку спочатку вважали нісенітницею, потім - метафорою, і лише згодом - точним технічним описом реальності: «Засіб передавання і є повідомлення».\n\nЩо він мав на увазі? Коли в 1950-х з'явилося масове телебачення, усі сперечалися про зміст: добрі програми чи погані, освітні чи розважальні, пропаганда чи мистецтво. Маклюен сказав: це другорядне питання. Саме телебачення - як середовище, як технологія, як спосіб сприйняття - вже змінило суспільство, незалежно від того, що саме показують.\n\nТелевізор уперше в історії синхронізував мільйони людей: ті самі новини в той самий час тими самими словами - в усіх домівках країни одночасно. Він створив те, що Маклюен назвав «глобальним селом» - світ, де всі одночасно переживають одну й ту саму подію. До телебачення люди в різних містах жили в різних інформаційних реальностях. Після нього - в одній.\n\n## Біологічна метафора Рашкоффа\n\nУ 1994 році американський теоретик медіа Дуглас Рашкофф додав до ідеї Маклюена біологічну метафору, яка виявилася ще точнішою. У книжці *Media Virus!* він описав механізм, який сьогодні називають вірусним контентом, - за десять років до YouTube і за двадцять до TikTok.\n\nІдеї поширюються як віруси. Не тому, що вони правдиві. Не тому, що вони корисні. А тому, що потрапляють у психологічну вразливість аудиторії - у те, що змушує людей передавати їх далі: страх, обурення, захват, упізнавання, гнів, розчулення. Емоція - це механізм реплікації ідеї.\n\nРашкофф показав: контент, який викликає сильну емоцію, поширюється незалежно від своєї правдивості чи корисності. Скандальна новина розлітається швидше за правдиву. Страшна історія - швидше за нудну. Це не випадковість і не маніпуляція - це архітектурна особливість медіасередовища. Вірус не обирає носія за критерієм «добра людина чи погана». Він обирає за критерієм «вразливий чи ні».\n\nЗадовго до алгоритмів TikTok, оптимізованих саме під це, Рашкофф описав принцип, на якому вони побудовані. Алгоритм не створив вірусність. Він просто навчився її посилювати.\n\n> Маклюен попереджав: важлива не програма, а телевізор. Рашкофф уточнив: важлива не ідея, а емоція, яку вона викликає. Разом вони описали архітектуру сучасних соціальних мереж за тридцять років до їх появи.\n\nКоли з'явився інтернет, перше питання знову було про зміст: що люди там читатимуть і дивитимуться? Маклюен сказав би: неправильне питання. Правильне - що робить із людиною саме середовище, у якому вона проводить дедалі більше часу? Це питання стало критично важливим, коли з'явилися соціальні мережі. На жаль, його поставили занадто пізно.", "tags": ["медіа", "поведінка", "сприйняття"], "lensWeight": {"chronology": 3, "power": 3, "technology": 1, "media": 5, "privacy": 2}, "angDeg": 150.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1964→1990-ті"}, {"id": "cypherpunks", "sceneIndex": 7, "x": 204.6, "y": 392.9, "type": "privacy", "title": "Г'юз і шифропанки: приватність - це математика", "shortTitle": "Шифропанки", "thesis": "Приватність у цифровому середовищі потребує криптографії, а не обіцянок інститутів.", "insight": "Г'юз у 1993 році передбачив кризу приватності й вимагав математичного захисту - його маніфест став ідеологічним фундаментом Bitcoin і всього Web3.", "body": "## Голос, який попереджав заздалегідь\n\nУ 1993 році, коли більшість людей уперше почули слово «інтернет», математик і криптограф Ерік Г'юз написав документ на три сторінки. Він називався «Маніфест шифропанка» і був опублікований у розсилці невеликої спільноти людей, які займалися криптографією й думали про наслідки появи публічної мережі.\n\nТоді інтернет лише ставав доступним звичайним людям. Перші браузери тільки з'явилися. Про приватність у мережі ще ніхто не думав - люди просто раділи новим можливостям: можна листуватися з людьми на іншому кінці планети! Можна читати новини в реальному часі! Можна знайти будь-яку інформацію!\n\nГ'юз думав інакше. Його аргумент був простим і залізним: відкритий інтернет означає, що кожна твоя дія в мережі потенційно видима всім - провайдерам, державам, корпораціям. Це не випадкова вразливість. Це архітектурна особливість системи, яку, навмисно чи ні, створили саме такою. І єдиний спосіб захистити приватність у таких умовах - не просити дозволу в провайдерів і держав, а використовувати математику. Криптографію. Математику, яку не може зламати жоден закон.\n\n## Пророцтво, яке збулося буквально\n\nГ'юз написав у 1993 році: «Приватність у відкритому суспільстві потребує анонімної системи транзакцій». Це звучало як фантастика. Більшість читачів знизували плечима: «Мені нічого приховувати». Навіщо анонімні транзакції звичайній людині?\n\nЧерез тридцять років ми живемо у світі, де корпорації знають про користувачів більше, ніж їхні близькі. Де витоки даних стали щоденними новинами. Де кожна покупка карткою, кожен пошуковий запит, кожне переміщення з увімкненим телефоном записується і зберігається. Г'юз не був параноїком. Він просто думав на кілька ходів уперед.\n\nШифропанки - невелика спільнота, що зібралася навколо цієї ідеї на початку 1990-х, - зрештою заклали ідеологічний фундамент для Bitcoin. Сатоші Накамото у 2008 році опублікував опис Bitcoin саме в розсилці шифропанків. Це була пряма відповідь на питання Г'юза: ось ваша анонімна система транзакцій, побудована на математиці, а не на довірі до посередника.\n\nСтюарт Бренд ще у 1984 році вимовив фразу, що стала маніфестом відкритого інтернету: «Інформація хоче бути вільною». Він мав на увазі природу інформації - вона не зменшується під час копіювання, тому штучні бар'єри суперечать її природі. Г'юз доповнив це з іншого боку: свобода інформації без приватності - це не свобода, а прозорість для тих, хто спостерігає.\n\n> Бренд сказав: інформація хоче бути вільною. Г'юз відповів: а приватність хоче бути захищеною математикою. Разом вони описали два полюси цифрової свободи.\n\nЦі два принципи - відкритість і приватність - у певному сенсі суперечать один одному. І напруга між ними досі визначає головні суперечки про те, яким має бути інтернет. Як зробити знання доступними всім - і водночас захистити особисті дані кожного? Це питання ще не розв'язане. І саме його намагається розв'язати Web3.", "tags": ["криптографія", "приватність", "спостереження"], "lensWeight": {"chronology": 3, "power": 4, "technology": 4, "media": 2, "privacy": 5}, "angDeg": 190.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1993"}, {"id": "castells", "sceneIndex": 8, "x": 307.2, "y": 215.2, "type": "power", "title": "Кастельс: влада перейшла до потоків", "shortTitle": "Потоки", "thesis": "Влада змістилася від контролю над місцями до контролю над потоками даних.", "insight": "Кастельс показав: влада перейшла від контролю над місцями до контролю над потоками даних і уваги - і це зробило її невидимою та майже неоспорюваною.", "body": "## Революція, якої не помітили\n\nДо середини 1990-х іспанський соціолог Мануель Кастельс спостерігав трансформацію, що відбувалася в усіх на очах, - і написав тритомну працю про те, чого більшість людей не помічала. Інформаційна революція вже відбулася. Просто люди шукали її не там.\n\nВони чекали на літаючі машини й роботів на кухні. Чекали фантастичного майбутнього з науково-популярних журналів 1960-х. А революція відбувалася в банківських серверних залах, у логістичних центрах глобальних корпорацій, у фінансових потоках між континентами. До 1990-х гроші вже перестали бути фізичними - вони стали потоками даних між серверами. Виробництво перестало бути локальним - воно стало глобальною мережею постачальників, де дизайн створюють у Каліфорнії, деталі виробляють у Китаї, збирають у В'єтнамі, а продають усюди. Влада перестала вимірюватися територією.\n\n## Простір місць проти простору потоків\n\nКастельс запровадив розрізнення, яке допомагає зрозуміти сучасний світ. Стара влада контролювала «простір місць»: заводи, порти, кордони, території. Фізичні точки, які можна зайняти, захистити, утримати. Нова влада контролює «простір потоків»: дані, капітал, увагу, інформацію.\n\nЦе принципово різні види влади. Територіальну владу можна побачити на мапі - ось кордон, ось армія, ось замок. Влада над потоками невидима. Де розташована влада Google? Ніде й усюди одночасно. Де розташована влада Facebook? В алгоритмі, який визначає, що бачать мільярди людей. Де розташована влада Bitcoin? У розподіленій мережі, яка не має фізичного місцезнаходження.\n\nКастельс показав: хто керує потоками, той керує світом. І це спостереження виявилося лякаюче точним. П'ять-шість технологічних компаній контролюють більшу частину інформаційних потоків планети. Вони не володіють територіями. Вони володіють алгоритмами, що визначають, що люди бачать, читають, купують і в що вірять.\n\nДеніел Белл ще у 1973 році передбачив перехід до постіндустріального суспільства, де головний ресурс - інформація, а головні інститути - не заводи, а університети й дослідницькі лабораторії. Кастельс у 1990-х побачив, що це сталося, - але влада над інформацією сконцентрувалася зовсім не в університетах.\n\n> Стара влада контролювала місця. Нова влада контролює потоки. А потоки значно складніше оскаржити, ніж територію.\n\nЦе і є фундаментальне питання, що проходить через увесь курс: як влаштована влада у світі, де інформація - головний ресурс? Хто її контролює? Як вона концентрується? І що відбувається, коли кілька корпорацій захоплюють контроль над більшою частиною інформаційних потоків планети? Наступні глави - про це.", "tags": ["потоки", "суспільство", "влада"], "lensWeight": {"chronology": 4, "power": 5, "technology": 2, "media": 4, "privacy": 3}, "angDeg": 230.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0% chronology", "label": "Хронология", "accent": "#7dd3fc", "description": "Оқиғалар реті және ақпарат тапшылығынан деректер ағынына өту."}, {"id": "power", "label": "Билік", "accent": "#f87171", "description": "Ақпаратты кім бақылайды: институттар, протоколдар, желілер ме, платформалар ма."}, {"id": "technology", "label": "Технологиялар", "accent": "#34d399", "description": "Өнертабыстар мен протоколдар: сигнал, гипермәтін, пакеттер, TCP/IP, Web."}, {"id": "media", "label": "Медиа", "accent": "#fbbf24", "description": "Тарату ортасы қабылдауды, мінез-құлықты және қоғамның ұйымдасуын қалай өзгертеді."}, {"id": "privacy", "label": "Құпиялылық", "accent": "#c084fc", "description": "Криптография бақылау мен қадағалаудан қорғаныс ретінде."}], "nodes": [{"id": "scarcity", "sceneIndex": 0, "x": 500.0, "y": 145.0, "type": "power", "title": "Ақпарат тапшылық ретінде", "shortTitle": "Тапшылық", "thesis": "Интернетке дейін ақпарат физикалық тұрғыдан қымбат, баяу және орталықтандырылған болды.", "insight": "Интернетке дейін ақпарат физикалық тұрғыдан қымбат әрі орталықтандырылған болды — бұл оны жабдығы барлардың билік құралына айналдырды.", "body": "## Сөз ақша тұрған әлем\n\nСен мұны экраннан оқып отырсың. Бір дата-орталықта сервер бұл мәтінді саған миллисекундтар ішінде жіберді — әрі бұл саған ештеңе тұрған жоқ. Бұл электр қуаты немесе су құбыры сияқты өзінен-өзі түсінікті көрінеді. Бірақ әрдайым бұлай болған емес. Ал «дейін» қалай болғанын түсіну — тарихи қызығушылық емес, қазіргі интернеттің неге дәл осылай құрылғанын түсінудің кілті. Және оның неге проблема екенін түсінудің кілті.\n\nБар болғаны жетпіс жыл бұрын Киевтен Нью-Йоркке хабарлама жіберу ақша тұратын, бірнеше күн алатын және жабдығы барлардың бақылауында болатын: мемлекеттердің, телеграф компанияларының, газет редакцияларының. Ақпарат тапшылық еді — дәл мұнай немесе астық сияқты. Ал кез келген тапшылық сияқты, ол билік еді. Ақпараттың берілуін бақылаған адам шындықты бақылаған.\n\nXX ғасырдың ортасындағы баспахананы елестет. Алып металл машиналар, қорғасын әріптер, бояу мен майдың иісі. Бір идеяны миллион адамға жеткізу үшін газеттің миллион данасын физикалық түрде басып шығарып, оларды жүк көліктеріне тиеп, бүкіл ел бойынша дүңгіршектерге тарату керек еді. Әр дана ақша тұратын. Жеткізудің әр шақырымы ақша тұратын. Таралымдағы қате — ақша желге ұшты, беделге нұқсан келді. Бұл алып, ауыр, баяу механизм еді.\n\nРадио мен теледидар революция сияқты көрінді — сигнал жарық жылдамдығымен таралады, ешқандай жүк көлігі қажет емес. Бірақ олардың қағидатты шектеуі болды: бір таратқыш, миллиондаған қабылдағыш. Тек мұнарасы бар адам ғана сөйлей алатын. Қалған бүкіл адамзат тыңдайтын. Тұтқаны көтеріп жауап беру мүмкін емес еді. Қарсы уәж айту — мүмкін емес. Өз сөзіңді қосу — мүмкін емес.\n\nИнтернетке дейінгі ақпараттық әлем осылай көрінді: орталықтандырылған, қымбат, бірбағытты. Бірнеше дереккөз көпшілікке хабар таратты. Ақпарат қатаң түрде жоғарыдан төмен қарай ақты — жабдығы барлардан жабдығы жоқтарға. Бұл кездейсоқтық та, жаман ниет те емес — сол уақыт технологияларының физикалық шындығы еді.\n\n> Ақпарат жай ғана ресурс емес еді — ол биліктің архитектурасы еді. Тарату арнасына иелік еткен адам шындыққа иелік етті.\n\nСондықтан осы архитектураны өзгертуге болатынын түсінген алғашқы адамдар революциялық нәрсені ұқты. Жай ғана «деректерді жылдамырақ беруге болады» дегенді емес. «Ақпарат үстіндегі биліктің өз құрылымын бұзуға болады» дегенді. Олар осының үстінде жұмыс істей бастады — алғашқы браузер пайда болғаннан әлдеқайда бұрын.", "tags": ["билік", "тапшылық", "медиа"], "lensWeight": {"chronology": 5, "power": 5, "technology": 1, "media": 4, "privacy": 1}, "angDeg": -90.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1948-ге дейін"}, {"id": "shannon", "sceneIndex": 1, "x": 692.8, "y": 215.2, "type": "technology", "title": "Шеннон: ақпарат физикаға айналды", "shortTitle": "Шеннон", "thesis": "Ақпаратты физикалық шама сияқты өлшеу, кодтау және жеткізу мүмкін болды.", "insight": "Шеннон ақпаратты физикалық шама ретінде өлшеп, беруге болатынын дәлелдеді — бұл бүкіл цифрлық әлемнің математикалық іргетасын қалады.", "body": "## Ойды өлшеген адам\n\n1948 жылы америкалық математик Клод Шеннон «Коммуникацияның математикалық теориясы» деген құрғақ техникалық атауы бар еңбегін жариялады. Оны сол кезде аз адам оқыды. Қазір де аз адам оқиды. Бірақ ол әлемді жұрттың бәрі оқитын кітаптардың көбінен көбірек өзгертті.\n\nШеннон мүмкін емес көрінген нәрсені дәлелдеді: кез келген хабарламаны — сөзді, дыбысты, бейнені, санды, сөзбен сипатталған иісті — дәл өлшеуге, сығуға және кез келген байланыс арнасы арқылы беруге болады. Ол өлшем бірлігін «бит» деп атады — binary digit, екілік цифр дегеннен. Нөл немесе бір. Сигнал бар немесе жоқ. Ақпараттың бүкіл ғаламы — нөлдер мен бірлердің комбинациялары.\n\nШеннонға дейін ақпарат бұлыңғыр әрі субъективті нәрсе еді. Кейбір сөздер басқаларынан «маңыздырақ». Кейбір бейнелер «мазмұндырақ». Кейбір хабарламалар «байырақ». Шенноннан кейін ақпарат масса немесе температура сияқты нақты әрі өлшенетін физикалық шамаға айналды. Әлем тек материя мен энергияға ғана бөлінуден қалды. Үшінші нәрсе пайда болды — ақпарат. Бұл үшінші нәрсе алғашқы екеуінен кем емес іргелі болып шықты.\n\n## Мұхит арқылы өткен шам жалыны\n\nШеннонның не істегенін түсіну үшін мынадай тапсырманы елестет: шамның жалынын Киевтен Токиоға жеткізу. Шамның өзін апаруға болады — бірақ бұл баяу, қымбат, әрі жалын жолда өшіп қалады. Бұл материяны жеткізу, ал ол физикалық заңдармен шектелген.\n\nБірақ жалынды сипаттауға болады: оның түсін, биіктігін, температурасын, пішінін, балауыздың химиялық құрамын. Осы сипаттаманы сым арқылы жарық жылдамдығымен жіберуге болады. Ал Токиодағы басқа адам дәл сондай жалынды жағады. Бұл ақпаратты жеткізу — және ол физикалық шектеулерді білмейді.\n\nШеннон осы екінші тәсілді абсолютті дәл, сенімді және масштабталатын етуге болатынын көрсетті. Кез келген сигналды биттерге кодтап, бұрмаланусыз жіберіп, арғы жақта қайта қалпына келтіруге болатынын дәлелдеді. Бүкіл цифрлық әлем осының үстінде тұр: электрондық поштадан 4K стримингке дейін, мессенджерлерден блокчейнге дейін.\n\nСен Telegram-да хабарлама жіберген сайын — Шеннон жұмыс істейді. Блокчейндегі транзакция желі түйіндері арасында берілген сайын — Шеннон жұмыс істейді. Ол бүкіл цифрлық әлем салынған математикалық іргетасты жасады.\n\n> Шеннон интернетті ойлап тапқан жоқ. Ол интернеттің мүмкін екенін дәлелдеді — ақпаратты физикалық шама сияқты дәл беруге болатынын көрсетті.\n\nПарадокс мынада: Шеннонның өзі Bell Laboratories-те — әлемдегі ең ірі телефон монополиясында жұмыс істеді. Оның жаңалығы ақырында өз жұмыс берушісінің монополиясын қиратты. Ақпаратты кез келген арна арқылы беруге болатын кезде, ешбір арна мәңгілік монополист бола алмайды.", "tags": ["сигнал", "кодтау", "өлшеу"], "lensWeight": {"chronology": 4, "power": 2, "technology": 5, "media": 2, "privacy": 2}, "angDeg": -50.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1948"}, {"id": "memex", "sceneIndex": 2, "x": 795.4, "y": 392.9, "type": "media", "title": "Буштың Memex-і: уақытынан озған арман", "shortTitle": "Memex", "thesis": "Байланысқан білім Web-ке дейін жеке ассоциациялар машинасы ретінде елестетілді.", "insight": "Ванневар Буш 1945 жылы гипермәтін мен байланысқан білімді сипаттады — Web-тен 46 жыл бұрын. Дұрыс идеялар өлмейді, олар өз технологияларын күтеді.", "body": "## Интернеттен қырық жыл бұрынғы гипермәтін\n\nӘлі 1945 жылы — алғашқы толыққанды компьютер пайда болудан екі жыл бұрын және World Wide Web-ке қырық алты жыл қалғанда — америкалық ғалым Ванневар Буш «Біз қалай ойлай аламыз» атты эссе жазды. Ол ғылыми журналда емес, кең аудиторияға арналған бұқаралық басылым The Atlantic-те жарияланды. Буш оны тек ғалым әріптестері емес, бәрі оқығанын қалады.\n\nОл «мемекс» деп атаған құрылғыны сипаттады — memory extender, жадты кеңейткіш дегеннен. Бұл адамзаттың барлық білімін қамтитын жеке кітапхана еді, онда кез келген құжат кез келген басқа құжатпен мағынасы арқылы байланысқан. Наполеон туралы мақала оқисың — бір қимылмен оның жорықтарының картасына өтесің. Картадан — оның генералдарының хаттарына. Хаттардан — XX ғасыр әскери тарихшыларының оның тактикасын талдауына. Әліпби бойынша каталогтан іздемейсің, сөрелерді ақтармайсың — ойдың өзі жүретіндей, ой тізбегімен ілесесің.\n\nБұл гипермәтін еді. Бұл сөз ресми түрде ойлап табылғаннан қырық жыл бұрын. Тим Бернерс-Ли бұл идеяны World Wide Web түрінде іске асырғаннан қырық алты жыл бұрын.\n\n## Неге арман үстел тартпасында жатты\n\nБуш болашақты мүлде анық көрді: білім байланысқан, әркімге қолжетімді және бәріне тиесілі болуы керек. Бір ғана проблема болды — технологиялар әлі жоқ еді. 1945 жылы компьютерлер тұтас бөлмелерді алып жататын, ұшақтай қымбат тұратын және тек есептей алатын. Дисплейлер де, тышқандар да, желілер де жоқ. Буш құрылғыны микрофильмдер мен механикалық иінтіректер арқылы сипаттады — өйткені аналогия үшін оның қолында бар нәрсе осы ғана еді.\n\nОның арманы жарты ғасырға жуық үстел тартпасында жатты. Бірақ ол ұмытылған жоқ. Оны оқыды, дәйексөз етті, қолдан-қолға берді. Тед Нельсон 1965 жылы «гипермәтін» сөзін ойлап тапты — Буштан тікелей шабыт алып. Дуглас Энгельбарт компьютер тінтуірін және гипермәтіндік құжаттар жүйесін жасады — ол да Буштың ықпалымен.\n\nТим Бернерс-Ли 1989 жылы CERN-де Web құруға арналған өтінімін жазғанда, ол Буштың эссесін бастапқы идея ретінде тікелей атады. Жарияланғаннан қырық төрт жыл өткен соң, арман ақыры іске асыратын құралдарға ие болды.\n\nБұл оқиға тарихи қызық ретінде емес, маңызды. Ол қағидатты нәрсені көрсетеді: дұрыс идея өлмейді. Ол өз сәтін күтеді. Кейде ондаған жылдар бойы. Бүгін біз ұқсас сәтті бастан өткеріп жатырмыз: пайдаланушылар өз деректеріне иелік ететін орталықсыздандырылған интернет идеялары блокчейннен әлдеқайда бұрын болған. Технологиялар жай ғана ақыры сол пайымға жетті.\n\n> Буш World Wide Web-ті оның ойлап табылуынан қырық алты жыл бұрын сипаттады. Пайғамбар болғандықтан емес — адам ақылы білім құралдарынан не қалайтынын түсінгендіктен.\n\nПарадокс мынада: Буш 1945 жылы идеялар арасындағы байланыстар туралы ойлады — ал біз ақырында идеялар арасындағы байланыстардан гөрі адамдар арасындағы байланыстар маңыздырақ болып шыққан интернет алдық. Бұл маңызды айырмашылық, біз оған келесі тарауларда қайта ораламыз.", "tags": ["гипермәтін", "білім", "ассоциациялар"], "lensWeight": {"chronology": 4, "power": 2, "technology": 4, "media": 5, "privacy": 1}, "angDeg": -10.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1945"}, {"id": "arpanet", "sceneIndex": 3, "x": 759.8, "y": 595.0, "type": "technology", "title": "ARPANET: интернет қорқыныштан туды", "shortTitle": "ARPANET", "thesis": "Байланыс желіде бір ғана істен шығу нүктесі жоғалғанда орнықты болды.", "insight": "ARPANET бірыңғай істен шығу нүктесі жоқ әскери байланыс жүйесі ретінде жасалды — дәл осы орталықсыздандырылған архитектура бүкіл интернеттің іргетасына айналды.", "body": "## Әлем архитектурасын өзгерткен спутник\n\nИнтернет тарихы Кремний алқабында да, университет аудиторияларында да басталмайды. Ол Пентагонда, қырғи-қабақ соғыстың қызған кезінде, өткір геосаяси қорқыныш сәтінде басталады.\n\n1957 жылғы 4 қазанда Кеңес Одағы Жердің алғашқы жасанды серігін ұшырды. Диаметрі 58 сантиметр, салмағы 83 килограмм болатын кішкентай металл шар Жердің үстімен ұшып, дыбыс шығарып тұрды — оны бүкіл әлем естіді. Америкалық әскерилер үшін бұл бәсекелестің жай ғана технологиялық триумфы емес еді. Бұл дабыл белгісі болды: жау орбитаны бақылап отыр. Егер олар серік ұшыра алса, ядролық оқтұмсығы бар зымыранды да ұшырып, планетаның кез келген нүктесіне жеткізе алады.\n\nБір жылдан кейін АҚШ DARPA — Перспективалық зерттеу жобалары агенттігін құрды. Оның алдында бір міндет тұрды: бір соққымен жойып жіберуге болмайтын әскери байланыс жүйесін жасау. Дәстүрлі телефон желілері апатты түрде осал еді: орталық телефон станциясы бар жерде істен шығу нүктесі де бар. Пентагонға түскен бір бомба — бүкіл әскермен байланыс жоғалады.\n\n## Орталығы жоқ желі — бәрін өзгерткен идея\n\nDARPA инженерлері түбегейлі басқа шешім ойлап тапты. Ал орталықты мүлде алып тастаса ше? Желінің әрбір түйінін тең құқықты ету. Біреуі істен шықса, хабарлама автоматты түрде басқа маршрут табады. Құбырдағы су сияқты: бір құбыр жабылса, су айналма жол табады.\n\nБұл идея ARPANET деп аталды. 1969 жылы ол алғаш рет жұмыс істеді: төрт университет — UCLA, Стэнфорд, UC Санта-Барбара және Юта — телефон желісі арқылы деректер алмасты. Жіберуге тырысқан алғашқы хабарлама \"login\" сөзі болды. Жүйе \"o\" әрпінен кейін істен шықты. Прото-интернет арқылы берілген алғашқы сөз \"lo\" болды — ағылшынша \"қара\" деген мағына береді. Кездейсоқ поэзия.\n\nОл кезде ешкім мұның жаһандық азаматтық интернеттің іргетасына айналатынын ойлаған жоқ. Әскерилер ядролық соғыс жағдайына арналған сенімді байланыс қалады. Олар бұдан да үлкен нәрсе жасады — билік құрылымдық түрде бір нүктеге шоғырлана алмайтын архитектура. Таратылған желі табиғаты бойынша орталықтандыруға төзімді.\n\nКем дегенде, бастапқы ой осындай еді. Шындық күрделірек болып шықты — бұл туралы келесі тарауларда сөйлесеміз.\n\n> Интернет ядролық соққыға төзімді әскери байланыс жүйесі ретінде жасалды. Ақырында ол биліктің кез келген орталықтануына төзімді болып шықты — бұл оның басты саяси қасиетіне айналды.\n\n1974 жылы Винтон Серф пен Роберт Кан келесі мәселені шешті: әртүрлі компьютерлер әртүрлі тілде сөйлейтін. Стэнфорд желісі MIT желісін түсінбейтін. Олар TCP/IP жасады — әмбебап протокол, кез келген желілер арасында дерек беруге арналған ортақ тіл. Деректер шағын пакеттерге бөлінеді, әрқайсысы өз жолын табады, ал екінші шетінде қайта жиналады. Хатты бөліктерге бөліп, әрқайсысын жеке курьермен жібергендей — сонда да олар алушыда дұрыс ретпен қайта жиналады. Дәл осы протокол интернеттің негізінде бүгін де жатыр — жасалғанына елу жыл өтсе де.", "tags": ["пакеттер", "DARPA", "TCP/IP", "орталықсыздандыру"], "lensWeight": {"chronology": 5, "power": 5, "technology": 5, "media": 2, "privacy": 3}, "angDeg": 30.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1969"}, {"id": "open-web", "sceneIndex": 4, "x": 602.6, "y": 726.9, "type": "technology", "title": "Бернерс-Ли: бәрін тегін беру шешімі", "shortTitle": "Ашық Web", "thesis": "Web жаппай таралды, өйткені базалық протокол бәріне ашық болды.", "insight": "Бернерс-Ли Web-ті тегін берді — альтруизмнен емес, тек ашық протокол ғана жаһандық бола алатынын түсінгендіктен.", "body": "## \"Бұлыңғыр, бірақ қызық\" деген белгі қойылған өтінім\n\n1989 жылы жас британдық бағдарламашы Тим Бернерс-Ли Женевадағы CERN — Еуропалық ядролық зерттеулер орталығында жұмыс істеді. Бұл әлемдегі ең ірі ғылыми институт: ондаған елден келген мыңдаған ғалым бір эксперименттермен айналысады, бірақ үнемі құжаттарды жоғалтады, контексті ұмытады, өздеріне дейін не жасалғанын түсіну үшін айлар жұмсайды.\n\nБернерс-Ли басшылыққа ішкі өтінім жазды. Мәні: барлық құжаттар сілтемелер арқылы байланысқан және желідегі кез келген компьютерден қолжетімді болатын жүйе құру. Оның басшысы Майк Сендалл шетіне үш сөз жазды: \"Бұлыңғыр, бірақ қызық\". Бұл әлемді өзгертетін өнертабысқа берілген ең қарапайым рецензия еді.\n\nҮш жыл ішінде Бернерс-Ли қазіргі бүкіл интернет сүйенетін үш нәрсені жасады: HTML — құжаттарды белгілеу тілі, HTTP — оларды беру протоколы, және URL — адрестеу жүйесі. Олар бірге World Wide Web құрды. Құжаттар серверлерде сақталады, адрестері бар, сілтемелермен байланысқан және браузер бағдарламасы арқылы ашылады. Қарапайым, әсем, әмбебап.\n\n## Дәуірді айқындаған шешім\n\nБірақ негізгі шешім техникалық емес еді. Ол этикалық шешім болды.\n\nБернерс-Ли өз өнертабысын патенттей алатын еді. CERN заңгерлері осыны ұсынды. Егер әрбір сайт HTTP қолданғаны үшін роялти төлесе, Бернерс-Ли планетадағы ең бай адамға айналар еді. Оның орнына ол технологияны адамзатқа тегін беруді талап етті — шектеусіз, лицензиясыз, шартсыз.\n\n\"Егер Web патенттелген немесе бір компанияның бақылауында болған болса, ол өмір сүрмес еді\", — деп кейін түсіндірді ол. Бұл альтруизм үшін жасалған альтруизм емес еді. Бұл стратегия болатын: желі тек кедергілерсіз ғана жаһандық ауқымға өсе алды. Кез келген адам рұқсатсыз сайт жасай алса ғана желі шын мәнінде ашық болады.\n\n1993 жылы АҚШ Ұлттық суперкомпьютерлік орталығының студенттері Mosaic браузерін шығарды — мәтін мен суреттерді бір экранда бірге көрсеткен алғашқы браузер. Бұған дейін интернет мәтін әлемі болатын. Mosaic оны визуалды етті. Бағдарламалауды ешқашан оқымаған қарапайым адамға түсінікті етті.\n\nСол жылы веб-сайттар саны бес жүзден асты. Қазір бұл күлкілі естіледі, бірақ ол кезде бұл жарылыс еді. Екі жылдан кейін олардың саны екі жүз мыңға жетті. Жарыс басталды.\n\n> Бернерс-Ли Web-ті тегін берді — сөйтіп оны жаһандық етті. Егер ол оны патенттегенде, біз әлі күнге дейін әрбір сілтеме үшін роялти төлер едік.\n\nБернерс-Ли туралы бұл оқиға жай ғана өмірбаяндық дерек емес. Бұл желілердің табиғаты туралы сабақ: ашық протоколдар жабық протоколдарға қарағанда тез өседі, өйткені кез келген адам олардың үстіне құра алады. Ethereum блокчейні дәл сондықтан ашық. TON дәл сондықтан ашық протокол. Бернерс-Ли 1991 жылы қандай технологиялар жеңетінін әлі күнге дейін айқындайтын қағиданы қалады.", "tags": ["Web", "протокол", "ашықтық"], "lensWeight": {"chronology": 5, "power": 4, "technology": 5, "media": 4, "privacy": 2}, "angDeg": 70.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F ігіне қарай.", "body": "## Тоффлер мұны 1980 жылы көрді\n\n1980 жылы Элвин Тоффлер \"Үшінші толқынды\" жариялаған кезде, дербес компьютерлер жоқтың қасы еді. Интернет болған жоқ. Ұялы телефондар болған жоқ. Соған қарамастан ол тек қырық жылдан кейін толық ашылған экономикалық трансформацияны сипаттады.\n\nТоффлер адамзат өркениетінің үш дәуірін сипаттады. Бірінші толқын — аграрлық: жер мен өнім басты құндылық ретінде. Екінші толқын — өнеркәсіптік: конвейер, стандарттау, тираж. Зауыт мың бірдей тоңазытқыш шығарады — бұл дәл олардың бірдей болғаны үшін тиімді. Өнім бірлігі көбейген сайын әрқайсысының өзіндік құны төмендейді. Ауқым — индустриялық экономиканың жеңісі.\n\nҮшінші толқын — ақпараттық. Мұнда логика түбегейлі төңкеріледі. Ақпараттық экономикада көшіру тегін. Бір бағдарлама бір уақытта миллиард пайдаланушымен әртүрлі әрекет ете алады — бұл баг емес, басты артықшылық. Құндылық бірдей нәрсені көбейту арқылы емес, әрбір өзара әрекеттесудің бірегейлігі арқылы жасалады.\n\n## Николас Негропонте және ең қарапайым формула\n\n1995 жылы MIT Media Lab директоры Николас Негропонте мұны қанатты сөзге айналған бір тіркеспен тұжырымдады: \"атомдардан биттерге\".\n\nАтомдар — физикалық әлем. Тоңазытқыш шығару үшін металл, пластик, электроника, жұмыс күші, зауыт керек. Оны сатып алушыға жеткізу үшін жүк көлігі, қойма, дүкен керек. Әр көшірме ақша тұрады. Тираж ресурстармен шектеледі. Бір миллион тоңазытқыш сатқың келсе, бір миллион тоңазытқыш өндіруің керек.\n\nБиттер — цифрлық әлем. Бағдарлама жасау үшін бір әзірлеуші және бір компьютер керек. Оны миллиард пайдаланушыға жеткізу үшін сервер мен интернет байланысы керек. Көшіру іс жүзінде тегін. Жеткізу лезде. Тираж шексіз. Бағдарламаның миллиард көшірмесін сатқың келсе, миллиард бағдарлама өндіруің қажет емес. Бір көшірме миллиард рет репликацияланады.\n\nБұл жай ғана технологиялық айырмашылық емес. Бұл іргелі экономикалық логиканың ауысуы. XX ғасырдың бүкіл экономикасы атомдар логикасына құрылды: тапшылық, ауқым, стандарттау. XXI ғасыр экономикасы биттер логикасына құрылады: молшылық, жекелендіру, желілік әсерлер.\n\n> Индустриялық экономика бірдей нәрсенің ауқымынан табыс тапты. Ақпараттық экономика әрбір өзара әрекеттесудің бірегейлігінен табыс табады. Бұл қарама-қарсы логикалар.\n\nОсы айырмашылықты түсінгенде, қазіргі әлемдегі көп нәрсе түсіндіріле бастайды. Неге Google тегін? Өйткені іздеу нәтижесін көшіру ештеңе тұрмайды — монетизация жарнама арқылы жүреді. Неге Spotify музыканттарға тиын-тебен төлейді? Өйткені бір стримнің шекті құны нөлге ұмтылады. Неге криптовалюталар мүлде мүмкін? Өйткені цифрлық активтерді физикалық тасымалдаушысыз беруге болады. Мұның бәрі Негропонте үш сөзбен тұжырымдаған бір қағиданың салдары.", "tags": ["экономика", "биттер", "масштаб"], "lensWeight": {"chronology": 4, "power": 4, "technology": 3, "media": 3, "privacy": 1}, "angDeg": 110.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1995"}, {"id": "media-effects", "sceneIndex": 6, "x": 240.2, "y": 595.0, "type": "media", "title": "Маклюэн және Рашкофф вирустары: медиа бізді өзгертеді", "shortTitle": "Медиа", "thesis": "Маңыздысы тек ақпарат емес, мінез-құлықты қайта құратын орта да.", "insight": "Маклюэн мен Рашкофф түсінді: маңыздысы ақпарат емес, оны жеткізетін орта. Медиа бізді мазмұнға тәуелсіз - біз байқамайтын құрылым арқылы өзгертеді.", "body": "## Жеткізу құралы хабарламадан маңыздырақ\n\nМаршалл Маклюэн қолайсыз ойшыл еді. 1964 жылы ол әуелі мағынасыздық деп қабылданған, кейін метафора саналған, ал содан соң ғана шындықтың дәл техникалық сипаттамасы ретінде түсінілген сөйлем жазды: «Жеткізу құралының өзі - хабарлама».\n\nОл нені меңзеді? 1950-жылдары бұқаралық теледидар пайда болғанда, бәрі мазмұн туралы дауласты: бағдарламалар жақсы ма, жаман ба, білім бере ме, көңіл көтере ме, насихат па, өнер ме. Маклюэн: бұл екінші кезектегі сұрақ деді. Теледидардың өзі - орта ретінде, технология ретінде, қабылдау тәсілі ретінде - нақты не көрсетілсе де, қоғамды өзгертіп қойды.\n\nТеледидар тарихта алғаш рет миллиондаған адамды синхрондады: бір жаңалық, бір уақытта, бір сөздермен - елдің барлық үйінде бір мезетте. Ол Маклюэн «жаһандық ауыл» деп атаған нәрсені - бәрі бір оқиғаны бір уақытта бастан кешіретін әлемді қалыптастырды. Теледидарға дейін әр қаладағы адамдар әртүрлі ақпараттық шындықта өмір сүрді. Одан кейін - бір шындықта.\n\n## Рашкоффтың биологиялық метафорасы\n\n1994 жылы америкалық медиа теоретигі Дуглас Рашкофф Маклюэн идеясына биологиялық метафора қосты, ол одан да дәлірек болып шықты. *Media Virus!* кітабында ол бүгінде вирустық контент деп аталатын механизмді сипаттады - YouTube-тен он жыл, TikTok-тан жиырма жыл бұрын.\n\nИдеялар вирус сияқты таралады. Олар шынайы болғандықтан емес. Пайдалы болғандықтан емес. Олар аудиторияның психологиялық осал тұсына - адамдарды әрі қарай таратуға итермелейтін нәрсеге дәл тигендіктен: қорқынышқа, наразылыққа, қуанышқа, танып-білу сезіміне, ашуға, елжіреуге. Эмоция - идеяның көбею механизмі.\n\nРашкофф көрсетті: күшті эмоция тудыратын контент өзінің шынайылығына немесе пайдалылығына тәуелсіз таралады. Даулы жаңалық шынайы жаңалықтан жылдамырақ тарайды. Қорқынышты оқиға іш пыстырарлық оқиғадан жылдамырақ тарайды. Бұл кездейсоқтық та, манипуляция да емес - бұл медиа ортаның архитектуралық ерекшелігі. Вирус иесін «жақсы адам ба, жаман адам ба» деген өлшеммен таңдамайды. Ол «осал ма, жоқ па» деген өлшеммен таңдайды.\n\nДәл осыған оңтайландырылған TikTok алгоритмдерінен әлдеқайда бұрын Рашкофф олардың негізінде жатқан қағиданы сипаттап берді. Алгоритм вирустылықты жасаған жоқ. Ол оны күшейтуді ғана үйренді.\n\n> Маклюэн ескерткен: маңыздысы бағдарлама емес, теледидар. Рашкофф нақтылады: маңыздысы идея емес, оның тудыратын эмоциясы. Екеуі бірге қазіргі әлеуметтік желілердің архитектурасын олар пайда болардан отыз жыл бұрын сипаттап берді.\n\nИнтернет пайда болғанда, алғашқы сұрақ қайтадан мазмұн туралы болды: адамдар онда не оқып, не көреді? Маклюэн: сұрақ дұрыс емес дер еді. Дұрысы - адам уақытының барған сайын көбін өткізетін ортаның өзі оған не істейді? Бұл сұрақ әлеуметтік желілер пайда болғанда аса маңызды болды. Өкінішке қарай, ол тым кеш қойылды.", "tags": ["медиа", "мінез-құлық", "қабылдау"], "lensWeight": {"chronology": 3, "power": 3, "technology": 1, "media": 5, "privacy": 2}, "angDeg": 150.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url" era": "1964→1990-шы жылдар"}, {"id": "cypherpunks", "sceneIndex": 7, "x": 204.6, "y": 392.9, "type": "privacy", "title": "Хьюз және шифрпанктер: приваттық - бұл математика", "shortTitle": "Шифропанктар", "thesis": "Цифрлық ортадағы құпиялылық институттардың уәдесін емес, криптографияны талап етеді.", "insight": "Хьюз 1993 жылы приваттық дағдарысын болжап, математикалық қорғанысты талап етті - оның манифесі Bitcoin мен бүкіл Web3-тің идеологиялық іргетасына айналды.", "body": "## Алдын ала ескерткен дауыс\n\n1993 жылы, көпшілік «интернет» деген сөзді алғаш ести бастаған кезде, математик әрі криптограф Эрик Хьюз үш беттен тұратын құжат жазды. Ол «Шифрпанк манифесі» деп аталды және криптографиямен айналысып, ашық желінің пайда болуы қандай салдарға әкелетінін ойлаған шағын қауымдастықтың тарату тізімінде жарияланды.\n\nОл кезде интернет қарапайым адамдарға енді ғана қолжетімді бола бастаған. Алғашқы браузерлер жаңа ғана пайда болған. Желіде приваттық туралы әлі ешкім ойлаған жоқ - адамдар жаңа мүмкіндіктерге жай ғана қуанды: планетаның арғы шетіндегі адамдармен хат алмасуға болады! Жаңалықтарды нақты уақытта оқуға болады! Кез келген ақпаратты табуға болады!\n\nХьюз басқаша ойлады. Оның уәжі қарапайым әрі берік еді: ашық интернет желідегі әр әрекетің ықтимал түрде бәріне - провайдерлерге, мемлекеттерге, корпорацияларға көрінеді дегенді білдіреді. Бұл кездейсоқ осалдық емес. Бұл жүйенің архитектуралық ерекшелігі: оны әдейі ме, жоқ па, дәл осылай құрған. Мұндай жағдайда приваттықты қорғаудың жалғыз жолы - провайдерлер мен мемлекеттерден рұқсат сұрау емес, математиканы қолдану. Криптографияны. Ешбір заң бұза алмайтын математиканы.\n\n## Сөзбе-сөз орындалған болжам\n\nХьюз 1993 жылы былай деп жазды: «Ашық қоғамдағы приваттық анонимді транзакциялар жүйесін талап етеді». Бұл ғылыми фантастика сияқты естілді. Оқырмандардың көбі иығын қиқаң еткізді: «Менің жасыратын ештеңем жоқ». Қарапайым адамға анонимді транзакциялар не үшін керек?\n\nОтыз жылдан кейін біз корпорациялар пайдаланушылар туралы олардың жақындарынан да көп білетін әлемде өмір сүріп жатырмыз. Дерек ағулары күнделікті жаңалыққа айналған әлемде. Карта арқылы жасалған әр сатып алу, әр іздеу сұрауы, қосулы телефонмен жасалған әр қозғалыс жазылып, сақталатын әлемде. Хьюз параноик болған жоқ. Ол жай ғана бірнеше жүріс ілгері ойлады.\n\nШифрпанктер - 1990-жылдардың басында осы идеяның айналасына жиналған шағын қауымдастық - ақырында Bitcoin үшін идеологиялық іргетас қалады. Сатоши Накамото 2008 жылы Bitcoin сипаттамасын дәл шифрпанктердің тарату тізімінде жариялады. Бұл Хьюз сұрағына тікелей жауап болды: міне, сендердің делдалға сенімге емес, математикаға құрылған анонимді транзакциялар жүйелерің.\n\nСтюарт Брэнд 1984 жылдың өзінде ашық интернеттің манифесіне айналған сөйлемді айтты: «Ақпарат еркін болғысы келеді». Ол ақпараттың табиғатын меңзеді - көшірілгенде ол азаймайды, сондықтан жасанды тосқауылдар оның табиғатына қайшы. Хьюз мұны басқа жағынан толықтырды: приваттықсыз ақпарат еркіндігі - еркіндік емес, бақылап отырғандар үшін мөлдірлік.\n\n> Брэнд айтты: ақпарат еркін болғысы келеді. Хьюз жауап берді: ал приваттық математикамен қорғалғысы келеді. Екеуі бірге цифрлық еркіндіктің екі полюсін сипаттады.\n\nБұл екі қағида - ашықтық пен приваттық - белгілі бір мағынада бір-біріне қайшы. Олардың арасындағы кернеу интернет қандай болуы керек деген негізгі дауларды әлі күнге дейін айқындайды. Білімді бәріне қолжетімді етіп, сонымен бірге әр адамның жеке деректерін қалай қорғауға болады? Бұл сұрақ әлі шешілген жоқ. Web3 дәл осыны шешуге тырысып жатыр.", "tags": ["криптография", "құпиялылық", "бақылау"], "lensWeight": {"chronology": 3, "power": 4, "technology": 4, "media": 2, "privacy": 5}, "angDeg": 190.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType
