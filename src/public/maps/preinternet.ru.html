<style>

}

  --bg-card: oklch(97% 0.007 285); --bg-tint: oklch(91% 0.014 285);
  --line: oklch(82% 0.017 285); --line-soft: oklch(88% 0.014 285); --line-strong: oklch(70% 0.026 285);
  --text: oklch(22% 0.043 285); --text-mid: oklch(40% 0.036 285); --text-muted: oklch(55% 0.041 285); --text-dim: oklch(68% 0.032 285);
  --accent: oklch(55% 0.319 295); --accent-2: oklch(55% 0.232 205); --accent-3: oklch(62% 0.232 60); --accent-4: oklch(55% 0.232 155);
  --power: oklch(58% 0.261 10); --technology: oklch(52% 0.232 155); --media: oklch(58% 0.200 90);
  --privacy: oklch(48% 0.290 290); --economy: oklch(54% 0.220 320);

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
.stars,.stars2{position:fixed;inset:0;pointer-events:none;z-index:0}
.stars{background-image:radial-gradient(1px 1px at 20% 30%,var(--star),transparent),radial-gradient(1px 1px at 70% 60%,var(--star),transparent),radial-gradient(1.5px 1.5px at 40% 80%,var(--star),transparent),radial-gradient(1px 1px at 85% 20%,var(--star),transparent),radial-gradient(1px 1px at 55% 45%,var(--star),transparent),radial-gradient(1px 1px at 10% 70%,var(--star),transparent);background-repeat:repeat;background-size:600px 600px;opacity:.7;animation:drift 120s linear infinite}
.stars2{background-image:radial-gradient(1px 1px at 30% 50%,var(--star),transparent),radial-gradient(1px 1px at 80% 40%,var(--star),transparent),radial-gradient(1px 1px at 60% 75%,var(--star),transparent);background-repeat:repeat;background-size:400px 400px;opacity:.45;animation:drift 80s linear infinite reverse}
@keyframes drift{to{background-position:600px 600px}}
[data-theme="light"] .stars,[data-theme="light"] .stars2{opacity:.25}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 700px at 50% 42%,var(--neb1),transparent 70%),radial-gradient(1200px 900px at 80% 10%,var(--neb2),transparent 60%)}

.app-shell{position:relative;z-index:1;display:grid;grid-template-columns:300px minmax(0,1fr) 340px;height:100vh;width:100vw}
.rail,.detail-panel{background:var(--glass);backdrop-filter:blur(10px);padding:22px;display:flex;flex-direction:column;gap:16px;overflow:auto}
.rail{border-right:1px solid var(--line)}
.detail-panel{border-left:1px solid var(--line);gap:14px}
.eyebrow{margin:0;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:600}
#app-title{margin:2px 0 0;font-family:var(--serif);font-size:29px;line-height:1.05;letter-spacing:-.01em;color:var(--text)}
.chapter-lede{margin:0;color:var(--text-mid);font-size:15.5px;font-family:var(--serif);font-style:italic;line-height:1.5}
.rail-rule{height:1px;background:linear-gradient(90deg,var(--line),transparent);margin:2px 0}
.section-h{margin:0;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted);font-weight:600}
.lens-group{display:flex;flex-wrap:wrap;gap:7px}
.lens-btn{cursor:pointer;border:1px solid var(--line);background:var(--bg-surface);color:var(--text-mid);padding:6px 11px;border-radius:999px;font-size:14.5px;transition:.15s;display:inline-flex;gap:7px;align-items:center;font-weight:500}
.lens-btn:hover{border-color:var(--dot);color:var(--text)}
.lens-btn[aria-pressed="true"]{border-color:var(--dot);color:var(--text);background:var(--bg-elev);box-shadow:0 0 12px -3px var(--dot),0 0 0 1px var(--dot) inset}
.lens-dot{width:9px;height:9px;border-radius:50%;background:var(--dot);box-shadow:0 0 8px var(--dot)}
.lens-desc{margin:0;color:var(--text-mid);font-size:14px;min-height:3.4em;line-height:1.5;font-family:var(--serif)}
.progress-box{font-size:13px;color:var(--text-muted)}
.progress-bar{height:5px;border-radius:5px;background:var(--bg-tint);overflow:hidden;margin-top:6px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:0;transition:width .35s;box-shadow:0 0 10px var(--accent)}
.node-list{display:flex;flex-direction:column;gap:2px;overflow:auto}
.node-list button{text-align:left;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--text-mid);padding:8px 9px;border-radius:9px;font-size:15px;display:flex;gap:10px;align-items:baseline;transition:.12s;font-family:var(--serif)}
.node-list button:hover{background:var(--bg-surface)}
.node-list button[aria-current="true"]{background:var(--bg-elev);color:var(--text);box-shadow:0 0 0 1px var(--dot) inset}
.node-idx{color:var(--text-muted);font-variant-numeric:tabular-nums;font-size:12.5px;min-width:16px;font-family:var(--sans)}

.map-stage{position:relative;overflow:hidden;display:flex}
.system-map{width:100%;display:block}
.ring{fill:none;stroke:var(--line-soft);stroke-width:1;opacity:.6}
.spoke{stroke:var(--line-soft);stroke-width:1;opacity:.5}
.edge path{fill:none;stroke:var(--text-dim);stroke-width:1.3;transition:.25s;opacity:.45;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1s ease forwards}
.edge.active path{stroke:var(--dot,var(--accent));stroke-width:2;opacity:.95;filter:drop-shadow(0 0 5px var(--dot));marker-end:url(#arrow-active)}
@keyframes draw{to{stroke-dashoffset:0}}
.edge-label{fill:var(--text-mid);font-size:15px;opacity:0;transition:.2s;font-family:var(--sans)}
.edge.active .edge-label{opacity:.9}
.sun-glow{fill:var(--accent);opacity:.16;filter:blur(6px);animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.12;r:96}50%{opacity:.26;r:112}}
.sun-core{fill:url(#sunGrad)}
.sun-ring{fill:none;stroke:var(--accent);stroke-width:1.5;opacity:.55}
.sun-t1{fill:var(--sun-ink);font-family:var(--serif);font-size:21px;font-weight:600;text-anchor:middle}
.sun-t2{fill:var(--accent);font-family:var(--sans);font-size:13px;letter-spacing:.22em;text-transform:uppercase;text-anchor:middle}

.node .cap{fill:var(--text);font-family:var(--serif);font-size:19px;font-weight:600}
.node .kicker{fill:var(--text-muted);font-family:var(--sans);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.node .era{fill:var(--dot);font-family:var(--sans);font-size:14px;font-weight:700}
.node.selected .planet{stroke-width:2.6;filter:drop-shadow(0 0 12px var(--dot))}
.node.selected .planet-glow{opacity:.4}
.node.dim{opacity:.34}
.detail-empty{color:var(--text-mid);font-size:15px;font-family:var(--serif);line-height:1.6}
.detail-kicker{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dot);margin:0;font-weight:600}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;color:var(--text-mid);background:var(--bg-surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.related h4,.sources-block h4{margin:8px 0 5px;font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.14em;font-weight:600}
.related-list{display:flex;flex-direction:column;gap:3px}
.related-list button{cursor:pointer;text-align:left;background:var(--bg-surface);border:1px solid var(--line);color:var(--text-mid);border-radius:8px;padding:7px 9px;font-size:14.5px;font-family:var(--serif)}
.related-list button:hover{border-color:var(--dot);color:var(--text)}
.sources-block ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.sources-block li{font-size:13.5px;color:var(--text-mid);line-height:1.4}
.sources-block a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--line-strong)}
.sources-block a:hover{border-bottom-color:var(--accent)}
.src-type{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-left:4px}
.panel-actions{display:flex;gap:8px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.btn{cursor:pointer;border-radius:9px;padding:9px 13px;font-size:13px;border:1px solid var(--line);background:var(--bg-surface);color:var(--text);font-weight:500}
.btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff}
[data-theme="light"] .btn.primary{color:#fff}
.btn:hover{filter:brightness(1.12)}
.empty-state{margin:auto;text-align:center;padding:30px;color:var(--text-mid);max-width:420px;font-family:var(--serif)}
.empty-state a{color:var(--accent)}
.scene-dialog{border:1px solid var(--line);background:var(--bg-card);color:var(--text);border-radius:16px;max-width:720px;width:calc(100vw - 40px);padding:0;box-shadow:0 30px 90px var(--scrim)}
.scene-dialog::backdrop{background:var(--scrim);backdrop-filter:blur(3px)}
.dialog-inner{padding:28px 32px}
.dialog-inner h3{margin:2px 0 0;font-family:var(--serif);font-size:26px;line-height:1.12;color:var(--text)}
.dialog-close{position:absolute;top:14px;right:18px;cursor:pointer;background:transparent;border:none;color:var(--text-muted);font-size:24px}
.dialog-body{margin:14px 0;color:var(--text);font-size:15.5px;line-height:1.72;font-family:var(--serif)}
.dialog-body h2{font-size:17px;font-family:var(--serif);margin:18px 0 6px;color:var(--text)}
.dialog-body p{margin:0 0 12px}
.map-stage{position:relative;overflow:hidden;display:flex;flex-direction:column}
.system-map{flex:1 1 auto;min-height:0}

<script>
const CHAPTER_DATA = {"chapter": {"key": "preinternet", "title": "До интернета", "sourceUrl": "https://luminara.tech/#/scene?s=3&c=preinternet", "centralIdea": "Информация становится властью", "centerX": 500, "centerY": 445, "ring": 300, "lede": "Как информация становится властью — от дефицита и сигналов до сетевого общества."}, "lenses": [{"id": "chronology", "label": "Хронология", "accent": "#7dd3fc", "description": "Порядок событий и переход от дефицита информации к потокам данных."}, {"id": "power", "label": "Власть", "accent": "#f87171", "description": "Кто контролирует информацию: институты, протоколы, сети или платформы."}, {"id": "technology", "label": "Технологии", "accent": "#34d399", "description": "Изобретения и протоколы: сигнал, гипертекст, пакеты, TCP/IP, Web."}, {"id": "media", "label": "Медиа", "accent": "#fbbf24", "description": "Как среда передачи меняет восприятие, поведение и организацию общества."}, {"id": "privacy", "label": "Приватность", "accent": "#c084fc", "description": "Криптография как защита от наблюдения и контроля."}], "nodes": [{"id": "scarcity", "sceneIndex": 0, "x": 500.0, "y": 145.0, "type": "power", "title": "Информация как дефицит", "shortTitle": "Дефицит", "thesis": "До интернета информация была физически дорогой, медленной и централизованной.", "insight": "До интернета информация была физически дорогой и централизованной — это делало её инструментом власти тех, у кого было оборудование.", "body": "## Мир, где слова стоили денег\n\nТы читаешь это на экране. Где-то в дата-центре сервер отправил тебе этот текст за миллисекунды — и это не стоило тебе ничего. Это кажется само собой разумеющимся, как электричество или водопровод. Но так было не всегда. И понимание того, как было «до» — это не историческая любопытность, а ключ к пониманию того, почему современный интернет устроен именно так. И почему это проблема.\n\nВсего семьдесят лет назад передать сообщение из Киева в Нью-Йорк стоило денег, занимало дни и контролировалось теми, у кого было оборудование: государствами, телеграфными компаниями, редакциями газет. Информация была дефицитом — точно таким же, как нефть или зерно. И как любой дефицит, она была властью. Тот, кто контролировал передачу информации, контролировал реальность.\n\nПредставь себе типографию середины XX века. Огромные металлические машины, свинцовые литеры, запах краски и масла. Чтобы донести одну идею до миллиона людей, нужно было физически напечатать миллион экземпляров газеты, загрузить их в грузовики, развезти по киоскам по всей стране. Каждая копия стоила денег. Каждый километр доставки стоил денег. Опечатка в тираже — деньги выброшены, репутация подорвана. Это был огромный, тяжёлый, медленный механизм.\n\nРадио и телевидение казались революцией — сигнал распространяется со скоростью света, никаких грузовиков. Но у них было принципиальное ограничение: один передатчик, миллионы приёмников. Говорить мог только тот, у кого была башня. Всё остальное человечество — слушало. Поднять трубку и ответить было нельзя. Возразить — нельзя. Добавить своё — нельзя.\n\nТак выглядел информационный мир до интернета: централизованный, дорогой, однонаправленный. Несколько источников вещали на многих. Информация текла строго сверху вниз — от тех, у кого есть оборудование, к тем, у кого его нет. Это не случайность и не злой умысел — это была физическая реальность технологий того времени.\n\n> Информация была не просто ресурсом — она была архитектурой власти. Кто владел каналом передачи, тот владел реальностью.\n\nИменно поэтому первые люди, которые поняли, что эту архитектуру можно изменить, поняли нечто революционное. Не просто «можно передавать данные быстрее». А «сама структура власти над информацией может быть сломана». И они начали работать над этим — задолго до того, как появился первый браузер.", "tags": ["власть", "дефицит", "медиа"], "lensWeight": {"chronology": 5, "power": 5, "technology": 1, "media": 4, "privacy": 1}, "angDeg": -90.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "до 1948"}, {"id": "shannon", "sceneIndex": 1, "x": 692.8, "y": 215.2, "type": "technology", "title": "Шеннон: информация стала физикой", "shortTitle": "Шеннон", "thesis": "Информацию стало возможно измерять, кодировать и передавать как физическую величину.", "insight": "Шеннон доказал, что информацию можно измерить и передавать как физическую величину — это заложило математический фундамент всего цифрового мира.", "body": "## Человек, который измерил мысль\n\nВ 1948 году американский математик Клод Шеннон опубликовал работу с сухим техническим названием «Математическая теория коммуникации». Её мало кто читал тогда. Её мало кто читает сейчас. Но она изменила мир больше, чем большинство книг, которые читают все.\n\nШеннон доказал нечто, казавшееся невозможным: любое сообщение — слово, звук, образ, число, запах, описанный словами — можно точно измерить, сжать и передать по любому каналу связи. Он назвал единицу измерения «бит» — от binary digit, двоичная цифра. Ноль или единица. Есть сигнал или нет. Вся вселенная информации — это комбинации нулей и единиц.\n\nДо Шеннона информация была чем-то туманным и субъективным. Одни слова «важнее» других. Одни образы «содержательнее». Одни сообщения «богаче». После Шеннона — информация стала физической величиной, такой же реальной и измеримой, как масса или температура. Мир перестал делиться только на материю и энергию. Появилось третье — информация. И это третье оказалось не менее фундаментальным, чем два первых.\n\n## Пламя свечи через океан\n\nЧтобы понять, что сделал Шеннон, представь такую задачу: передать пламя свечи из Киева в Токио. Можно везти саму свечу — но это медленно, дорого, и пламя погаснет в дороге. Это передача материи, и она ограничена физическими законами.\n\nНо можно описать пламя: его цвет, высоту, температуру, форму, химический состав воска. Передать это описание со скоростью света по проводу. И другой человек в Токио зажжёт точно такое же пламя. Это передача информации — и она не знает физических ограничений.\n\nШеннон показал, что этот второй способ можно сделать абсолютно точным, надёжным и масштабируемым. Что любой сигнал можно закодировать в биты, передать без искажений и восстановить с другой стороны. Именно на этом стоит весь цифровой мир: от электронной почты до стриминга 4K, от мессенджеров до блокчейна.\n\nКаждый раз, когда ты отправляешь сообщение в Telegram — работает Шеннон. Каждый раз, когда транзакция в блокчейне передаётся между узлами сети — работает Шеннон. Он создал математический фундамент, на котором построено всё цифровое.\n\n> Шеннон не изобрёл интернет. Он доказал, что интернет возможен — что информацию можно передавать точно, как физическую величину.\n\nПарадокс в том, что сам Шеннон работал в Bell Laboratories — крупнейшей телефонной монополии мира. Его открытие в итоге разрушило монополию его работодателя. Когда информацию можно передавать любым каналом — значит, никакой канал не может быть монополистом навсегда.", "tags": ["сигнал", "кодирование", "измерение"], "lensWeight": {"chronology": 4, "power": 2, "technology": 5, "media": 2, "privacy": 2}, "angDeg": -50.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1948"}, {"id": "memex", "sceneIndex": 2, "x": 795.4, "y": 392.9, "type": "media", "title": "Мемекс Буша: мечта, опередившая время", "shortTitle": "Memex", "thesis": "Связанные знания были воображены до Web как персональная машина ассоциаций.", "insight": "Ванневар Буш в 1945 году описал гипертекст и связанные знания — за 46 лет до Web. Правильные идеи не умирают, они ждут своих технологий.", "body": "## Гипертекст за сорок лет до интернета\n\nЕщё в 1945 году — за два года до появления первого полноценного компьютера и за сорок шесть лет до World Wide Web — американский учёный Ванневар Буш написал эссе с названием «Как мы можем мыслить». Опубликовано оно было в The Atlantic — не в научном журнале, а в массовом издании для широкой аудитории. Буш хотел, чтобы его прочитали все, а не только коллеги-учёные.\n\nОн описал устройство, которое назвал «мемекс» — от memory extender, расширитель памяти. Это была личная библиотека всех знаний человечества, где любой документ связан с любым другим по смыслу. Читаешь статью о Наполеоне — и одним движением переходишь к карте его походов. От карты — к письмам его генералов. От писем — к анализу его тактики военными историками XX века. Не ищешь в каталоге по алфавиту, не листаешь полки — а следуешь по цепочке мысли, как следует сама мысль.\n\nЭто был гипертекст. За сорок лет до того, как это слово придумают официально. За сорок шесть лет до того, как Тим Бернерс-Ли реализует эту идею в виде World Wide Web.\n\n## Почему мечта пролежала в ящике стола\n\nБуш видел будущее совершенно ясно: знания должны быть связаны, доступны каждому и принадлежать всем. Проблема была одна — технологий ещё не существовало. В 1945 году компьютеры занимали целые комнаты, стоили как самолёты и могли только считать. Никаких дисплеев, никаких мышей, никаких сетей. Буш описал устройство в терминах микрофильмов и механических рычагов — потому что это было всё, чем он располагал для аналогии.\n\nЕго мечта пролежала в ящике стола почти полвека. Но она не была забыта. Её читали, цитировали, передавали из рук в руки. Тед Нельсон в 1965 году придумал слово «гипертекст» — напрямую вдохновившись Бушем. Дуглас Энгельбарт создал компьютерную мышь и систему гипертекстовых документов — тоже под влиянием Буша.\n\nКогда Тим Бернерс-Ли в 1989 году писал свою заявку на создание Web в ЦЕРН, он прямо ссылался на эссе Буша как на исходную идею. Через сорок четыре года после публикации мечта наконец получила инструменты для реализации.\n\nЭта история важна не как историческая курьёзность. Она показывает кое-что принципиальное: правильная идея не умирает. Она ждёт своего момента. Иногда — десятилетиями. Сегодня мы переживаем похожий момент: идеи децентрализованного интернета, где пользователи владеют своими данными, существовали задолго до блокчейна. Технологии просто наконец догнали видение.\n\n> Буш описал World Wide Web за сорок шесть лет до его изобретения. Не потому что был пророком — а потому что понял, чего хочет человеческий разум от инструментов знания.\n\nПарадоксально, но Буш в 1945 году думал о связях между идеями — а мы в итоге получили интернет, где связи между людьми оказались важнее, чем связи между идеями. Это важное отличие, к которому мы вернёмся в следующих главах.", "tags": ["гипертекст", "знание", "ассоциации"], "lensWeight": {"chronology": 4, "power": 2, "technology": 4, "media": 5, "privacy": 1}, "angDeg": -10.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1945"}, {"id": "arpanet", "sceneIndex": 3, "x": 759.8, "y": 595.0, "type": "technology", "title": "ARPANET: интернет родился из страха", "shortTitle": "ARPANET", "thesis": "Связь стала устойчивой, когда сеть лишилась единого центра отказа.", "insight": "ARPANET создавался как военная система связи без единой точки отказа — и именно эта децентрализованная архитектура стала фундаментом всего интернета.", "body": "## Спутник, который изменил архитектуру мира\n\nИстория интернета начинается не в Силиконовой долине и не в университетских аудиториях. Она начинается в Пентагоне, в разгар холодной войны, в момент острого геополитического страха.\n\n4 октября 1957 года Советский Союз запустил первый искусственный спутник Земли. Маленький металлический шар диаметром 58 сантиметров, весивший 83 килограмма, летел над Землёй и пищал — и весь мир его слышал. Для американских военных это был не просто технологический триумф конкурента. Это был сигнал тревоги: враг контролирует орбиту. Если они могут запустить спутник, они могут запустить ракету с ядерной боеголовкой — и достать любую точку на планете.\n\nЧерез год США создали DARPA — Агентство перспективных исследовательских проектов. Перед ним стояла задача: создать систему военной связи, которую невозможно уничтожить одним ударом. Традиционные телефонные сети были катастрофически уязвимы: есть центральная телефонная станция — есть точка отказа. Одна бомба на Пентагон — и связь со всей армией потеряна.\n\n## Сеть без центра — идея, изменившая всё\n\nИнженеры DARPA придумали принципиально иное решение. Что если убрать центр вообще? Сделать каждый узел сети равноправным. Если один выходит из строя — сообщение автоматически находит другой маршрут. Как вода в трубах: если одна труба перекрыта, вода находит обходной путь.\n\nЭту идею назвали ARPANET. В 1969 году она впервые заработала: четыре университета — UCLA, Стэнфорд, UC Санта-Барбара и Юта — обменялись данными по телефонной линии. Первое сообщение, которое пытались передать, было слово «login». Система упала после буквы «o». Первое слово, переданное по прото-интернету, было «lo» — что по-английски означает «смотри». Случайная поэзия.\n\nНикто тогда не думал, что это станет фундаментом глобального гражданского интернета. Военные хотели надёжную связь на случай ядерной войны. Они создали нечто большее — архитектуру, в которой власть структурно не может сосредоточиться в одной точке. Распределённая сеть по своей природе устойчива к централизации.\n\nПо крайней мере, так задумывалось. Реальность оказалась сложнее — и об этом мы поговорим в следующих главах.\n\n> Интернет создавался как военная система связи, устойчивая к ядерному удару. В итоге он оказался устойчив к любой централизации власти — и это стало его главным политическим свойством.\n\nВ 1974 году Винтон Сёрф и Роберт Кан решили следующую проблему: разные компьютеры говорили на разных языках. Сеть Стэнфорда не понимала сеть MIT. Они создали TCP/IP — универсальный протокол, единый язык для передачи данных между любыми сетями. Данные разбиваются на маленькие пакеты, каждый находит свой путь, на другом конце собирается обратно. Как если бы ты разрезал письмо на части, отправил каждую отдельным курьером — и они всё равно собрались в правильном порядке у получателя. Именно этот протокол лежит в основе интернета сегодня — через пятьдесят лет после создания.", "tags": ["пакеты", "DARPA", "TCP/IP", "децентрализация"], "lensWeight": {"chronology": 5, "power": 5, "technology": 5, "media": 2, "privacy": 3}, "angDeg": 30.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1969"}, {"id": "open-web", "sceneIndex": 4, "x": 602.6, "y": 726.9, "type": "technology", "title": "Бернерс-Ли: решение отдать всё бесплатно", "shortTitle": "Открытый Web", "thesis": "Web стал массовым, потому что базовый протокол был открыт для всех.", "insight": "Бернерс-Ли отдал Web бесплатно — не из альтруизма, а потому что понял: только открытый протокол может стать глобальным.", "body": "## Заявка с пометкой «туманно, но интересно»\n\nВ 1989 году молодой британский программист Тим Бернерс-Ли работал в ЦЕРН — Европейском центре ядерных исследований в Женеве. Это крупнейший в мире научный институт: тысячи учёных из десятков стран работают над одними экспериментами, но постоянно теряют документы, забывают контекст, тратят месяцы на то, чтобы разобраться в том, что уже было сделано до них.\n\nБернерс-Ли написал внутреннюю заявку для руководства. Суть: создать систему, где все документы связаны ссылками и доступны с любого компьютера в сети. Его начальник Майк Сендалл написал на полях три слова: «Туманно, но интересно». Это была самая скромная рецензия на изобретение, которое изменит мир.\n\nЗа три года Бернерс-Ли создал три вещи, на которых стоит весь современный интернет: HTML — язык разметки документов, HTTP — протокол их передачи, и URL — систему адресации. Вместе они образовали World Wide Web. Документы хранятся на серверах, имеют адреса, связаны ссылками и открываются через программу-браузер. Просто, элегантно, универсально.\n\n## Решение, которое определило эпоху\n\nНо ключевое решение было не техническим. Оно было этическим.\n\nБернерс-Ли мог запатентовать своё изобретение. Юристы ЦЕРН предлагали это. Если бы каждый сайт платил роялти за использование HTTP, Бернерс-Ли стал бы богатейшим человеком планеты. Вместо этого он настоял на том, чтобы отдать технологию человечеству бесплатно — без ограничений, без лицензий, без условий.\n\n«Если бы Web был запатентован или находился под контролем одной компании, его бы не существовало», — объяснил он позже. Это не был альтруизм ради альтруизма. Это была стратегия: только без барьеров сеть могла вырасти до глобального масштаба. Только если любой может создать сайт без разрешения — сеть станет по-настоящему открытой.\n\nВ 1993 году студенты Национального суперкомпьютерного центра США выпустили браузер Mosaic — первый, который показывал текст и картинки вместе на одном экране. До этого интернет был миром текста. Mosaic сделал его визуальным. И понятным для обычного человека, который никогда не учился программированию.\n\nВ том же году количество веб-сайтов перевалило за пятьсот. Это звучит смешно сейчас, но тогда это был взрыв. Через два года их было уже двести тысяч. Гонка началась.\n\n> Бернерс-Ли отдал Web бесплатно — и тем самым сделал его глобальным. Если бы он его запатентовал, мы бы до сих пор платили роялти за каждую ссылку.\n\nЭта история про Бернерс-Ли — не просто биографический факт. Это урок о природе сетей: открытые протоколы растут быстрее закрытых, потому что любой может на них строить. Именно поэтому блокчейн Ethereum открытый. Именно поэтому TON — открытый протокол. Бернерс-Ли в 1991 году заложил принцип, который до сих пор определяет, какие технологии побеждают.", "tags": ["Web", "протокол", "открытость"], "lensWeight": {"chronology": 5, "power": 4, "technology": 5, "media": 4, "privacy": 2}, "angDeg": 70.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1991"}, {"id": "atoms-to-bits", "sceneIndex": 5, "x": 397.4, "y": 726.9, "type": "economy", "title": "От атомов к битам: смена экономической логики", "shortTitle": "Атомы → биты", "thesis": "Ценность начала двигаться как информация: копируемо, мгновенно и почти бесплатно.", "insight": "Переход «от атомов к битам» — это не просто технология, это смена экономической логики: от масштаба одинакового к уникальности каждого взаимодействия.", "body": "## Тоффлер видел это в 1980-м\n\nКогда в 1980 году Элвин Тоффлер публиковал «Третью волну», персональных компьютеров почти не существовало. Интернета не было. Мобильных телефонов не было. И тем не менее он описал экономическую трансформацию, которая полностью развернулась только через сорок лет.\n\nТоффлер описал три эпохи человеческой цивилизации. Первая волна — аграрная: земля и урожай как главная ценность. Вторая волна — промышленная: конвейер, стандартизация, тираж. Завод производит тысячу одинаковых холодильников — это эффективно именно потому, что они одинаковые. Чем больше единиц продукта, тем ниже себестоимость каждой. Масштаб — это победа индустриальной экономики.\n\nТретья волна — информационная. И здесь логика переворачивается с ног на голову. В информационной экономике копирование бесплатно. Одна программа может вести себя по-разному с миллиардом пользователей одновременно — и это не баг, а главное преимущество. Ценность создаётся не через тиражирование одинакового, а через уникальность каждого взаимодействия.\n\n## Николас Негропонте и простейшая формула\n\nВ 1995 году директор MIT Media Lab Николас Негропонте сформулировал это одной фразой, которая стала крылатой: «от атомов к битам».\n\nАтомы — это физический мир. Чтобы произвести холодильник, нужен металл, пластик, электроника, рабочие руки, завод. Чтобы доставить его покупателю — грузовик, склад, магазин. Каждая копия стоит денег. Тираж ограничен ресурсами. Если ты хочешь продать миллион холодильников — тебе нужно произвести миллион холодильников.\n\nБиты — это цифровой мир. Чтобы создать программу, нужен один разработчик и один компьютер. Чтобы доставить её миллиарду пользователей — нужен сервер и интернет-соединение. Копирование практически бесплатно. Доставка мгновенная. Тираж бесконечен. Если ты хочешь продать миллиард копий программы — тебе не нужно производить миллиард программ. Одна копия реплицируется миллиард раз.\n\nЭто не просто технологическое различие. Это смена фундаментальной экономической логики. Вся экономика XX века была построена на логике атомов: дефицит, масштаб, стандартизация. Экономика XXI века строится на логике битов: изобилие, персонализация, сетевые эффекты.\n\n> Индустриальная экономика зарабатывала на масштабе одинакового. Информационная экономика зарабатывает на уникальности каждого взаимодействия. Это противоположные логики.\n\nКогда понимаешь это различие — многое в современном мире начинает объясняться. Почему Google бесплатный? Потому что копирование поисковой выдачи ничего не стоит — монетизация идёт через рекламу. Почему Spotify платит музыкантам копейки? Потому что предельная стоимость одного стрима стремится к нулю. Почему криптовалюты вообще возможны? Потому что цифровые активы можно передавать без физического носителя. Всё это следствия одного принципа, который Негропонте сформулировал в трёх словах.", "tags": ["экономика", "биты", "масштаб"], "lensWeight": {"chronology": 4, "power": 4, "technology": 3, "media": 3, "privacy": 1}, "angDeg": 110.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1995"}, {"id": "media-effects", "sceneIndex": 6, "x": 240.2, "y": 595.0, "type": "media", "title": "Маклюэн и вирусы Рашкоффа: медиа меняют нас", "shortTitle": "Медиа", "thesis": "Важна не только информация, но и среда, которая перестраивает поведение.", "insight": "Маклюэн и Рашкофф поняли: важна не информация, а среда её передачи. Медиа меняют нас независимо от содержания — через структуру, которую мы не замечаем.", "body": "## Средство передачи важнее сообщения\n\nМаршалл Маклюэн был неудобным мыслителем. В 1964 году он написал фразу, которую сначала посчитали бессмыслицей, потом — метафорой, и только потом — точным техническим описанием реальности: «Средство передачи есть сообщение».\n\nЧто он имел в виду? Когда в 1950-е появилось массовое телевидение, все спорили о содержании: хорошие программы или плохие, образовательные или развлекательные, пропаганда или искусство. Маклюэн сказал: это второстепенный вопрос. Само телевидение — как среда, как технология, как способ восприятия — уже изменило общество, независимо от того, что именно показывают.\n\nТелевизор впервые в истории синхронизировал миллионы людей: одни и те же новости в одно и то же время в одних и тех же словах — во всех домах страны одновременно. Он создал то, что Маклюэн назвал «глобальной деревней» — мир, где все одновременно переживают одно и то же событие. До телевидения люди в разных городах жили в разных информационных реальностях. После — в одной.\n\n## Биологическая метафора Рашкоффа\n\nВ 1994 году американский медиатеоретик Дуглас Рашкофф добавил к идее Маклюэна биологическую метафору, которая оказалась ещё более точной. В книге «Media Virus!» он описал механизм, который сегодня называют вирусным контентом — за десять лет до YouTube и за двадцать до TikTok.\n\nИдеи распространяются как вирусы. Не потому что они правдивые. Не потому что они полезные. А потому что они попадают в психологическую уязвимость аудитории — в то, что заставляет людей передавать дальше: страх, возмущение, восторг, узнавание, гнев, умиление. Эмоция — это механизм репликации идеи.\n\nРашкофф показал: контент, который вызывает сильную эмоцию, распространяется независимо от своей истинности или полезности. Скандальная новость разлетается быстрее правдивой. Страшная история — быстрее скучной. Это не случайность и не манипуляция — это архитектурная особенность медиасреды. Вирус не выбирает хозяина по критерию «хороший человек или плохой». Он выбирает по критерию «уязвим или нет».\n\nЗадолго до алгоритмов TikTok, которые оптимизированы именно на это, Рашкофф описал принцип, на котором они построены. Алгоритм не создал вирусность. Он просто научился её усиливать.\n\n> Маклюэн предупреждал: важна не программа, а телевизор. Рашкофф уточнил: важна не идея, а эмоция, которую она вызывает. Вместе они описали архитектуру современных социальных сетей за тридцать лет до их появления.\n\nКогда появился интернет, первый вопрос снова был о содержании: что люди будут там читать и смотреть? Маклюэн бы сказал: неправильный вопрос. Правильный — что делает с человеком сама среда, в которой он проводит всё больше времени? Этот вопрос стал критически важным, когда появились социальные сети. К сожалению, его задали слишком поздно.", "tags": ["медиа", "поведение", "восприятие"], "lensWeight": {"chronology": 3, "power": 3, "technology": 1, "media": 5, "privacy": 2}, "angDeg": 150.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1964→1990-е"}, {"id": "cypherpunks", "sceneIndex": 7, "x": 204.6, "y": 392.9, "type": "privacy", "title": "Хьюз и шифропанки: приватность — это математика", "shortTitle": "Шифропанки", "thesis": "Приватность в цифровой среде требует криптографии, а не обещаний институтов.", "insight": "Хьюз в 1993 году предсказал кризис приватности и потребовал математической защиты — его манифест стал идеологическим фундаментом Bitcoin и всего Web3.", "body": "## Голос, который предупреждал заранее\n\nВ 1993 году, когда большинство людей впервые услышали слово «интернет», математик и криптограф Эрик Хьюз написал документ на три страницы. Он назывался «Манифест шифропанка» и был опубликован в рассылке небольшого сообщества людей, занимавшихся криптографией и думавших о последствиях появления публичной сети.\n\nВ то время интернет только становился доступным обычным людям. Первые браузеры только появились. Никто ещё не думал о приватности в сети — люди просто радовались новым возможностям: можно переписываться с людьми на другом конце планеты! Можно читать новости в реальном времени! Можно найти любую информацию!\n\nХьюз думал иначе. Его аргумент был простым и железным: открытый интернет означает, что каждое твоё действие в сети потенциально видно всем — провайдерам, государствам, корпорациям. Это не случайная уязвимость. Это архитектурная особенность системы, которую намеренно или нет, но создали именно такой. И единственный способ защитить приватность в таких условиях — не просить разрешения у провайдеров и государств, а использовать математику. Криптографию. Математику, которую не может сломать никакой закон.\n\n## Пророчество, которое сбылось буквально\n\nХьюз написал в 1993 году: «Приватность в открытом обществе требует анонимной системы транзакций». Это звучало как фантастика. Большинство читателей пожимали плечами: «Мне нечего скрывать». Зачем анонимные транзакции обычному человеку?\n\nЧерез тридцать лет мы живём в мире, где корпорации знают о пользователях больше, чем их близкие. Где утечки данных стали ежедневными новостями. Где каждая покупка по карте, каждый поисковый запрос, каждое перемещение с включённым телефоном записывается и хранится. Хьюз не был параноиком. Он просто думал на несколько ходов вперёд.\n\nШифропанки — небольшое сообщество, собравшееся вокруг этой идеи в начале 1990-х — в итоге заложили идеологический фундамент для Bitcoin. Сатоши Накамото в 2008 году опубликовал описание Bitcoin именно в рассылке шифропанков. Это был прямой ответ на вопрос Хьюза: вот ваша анонимная система транзакций, построенная на математике, а не на доверии к посреднику.\n\nСтюарт Брэнд ещё в 1984 году произнёс фразу, ставшую манифестом открытого интернета: «Информация хочет быть свободной». Он имел в виду природу информации — она не убывает при копировании, поэтому искусственные барьеры противоречат её природе. Хьюз дополнил это с другой стороны: свобода информации без приватности — это не свобода, это прозрачность для тех, кто наблюдает.\n\n> Брэнд сказал: информация хочет быть свободной. Хьюз ответил: а приватность хочет быть защищённой математикой. Вместе они описали два полюса цифровой свободы.\n\nЭти два принципа — открытость и приватность — в каком-то смысле противоречат друг другу. И напряжение между ними до сих пор определяет главные споры о том, каким должен быть интернет. Как сделать знания доступными всем — и при этом защитить личные данные каждого? Этот вопрос ещё не решён. И именно его пытается решить Web3.", "tags": ["криптография", "приватность", "наблюдение"], "lensWeight": {"chronology": 3, "power": 4, "technology": 4, "media": 2, "privacy": 5}, "angDeg": 190.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1993"}, {"id": "castells", "sceneIndex": 8, "x": 307.2, "y": 215.2, "type": "power", "title": "Кастельс: власть перешла к потокам", "shortTitle": "Потоки", "thesis": "Власть сместилась от контроля над местами к контролю над потоками данных.", "insight": "Кастельс показал: власть перешла от контроля над местами к контролю над потоками данных и внимания — и это сделало её невидимой и неоспоримой.", "body": "## Революция, которую не заметили\n\nК середине 1990-х испанский социолог Мануэль Кастельс наблюдал трансформацию, происходившую у всех на виду — и написал трёхтомный труд о том, что большинство людей не замечали. Информационная революция уже произошла. Просто люди искали её не там.\n\nОни ждали летающих машин и роботов на кухне. Они ждали фантастического будущего из научно-популярных журналов 1960-х. А революция происходила в банковских серверных залах, в логистических центрах глобальных корпораций, в финансовых потоках между континентами. К 1990-м деньги уже перестали быть физическими — они стали потоками данных между серверами. Производство перестало быть локальным — оно стало глобальной сетью поставщиков, где дизайн делается в Калифорнии, детали производятся в Китае, собираются во Вьетнаме, а продаются везде. Власть перестала измеряться территорией.\n\n## Пространство мест против пространства потоков\n\nКастельс ввёл различие, которое помогает понять современный мир. Старая власть контролировала «пространство мест»: заводы, порты, границы, территории. Физические точки, которые можно занять, защитить, удержать. Новая власть контролирует «пространство потоков»: данные, капитал, внимание, информацию.\n\nЭто принципиально разные виды власти. Территориальную власть можно увидеть на карте — вот граница, вот армия, вот замок. Власть над потоками невидима. Где находится власть Google? Нигде и везде одновременно. Где находится власть Facebook? В алгоритме, который определяет, что видят миллиарды людей. Где находится власть Bitcoin? В распределённой сети, которая не имеет физического местонахождения.\n\nКастельс показал: кто управляет потоками — тот управляет миром. И это наблюдение оказалось пугающе точным. Пять-шесть технологических компаний контролируют большую часть информационных потоков планеты. Они не владеют территориями. Они владеют алгоритмами, определяющими, что люди видят, читают, покупают, во что верят.\n\nДаниел Белл ещё в 1973 году предсказал переход к постиндустриальному обществу, где главный ресурс — информация, а главные институты — не заводы, а университеты и исследовательские лаборатории. Кастельс в 1990-х увидел, что это произошло — но власть над информацией сконцентрировалась совсем не в университетах.\n\n> Старая власть контролировала места. Новая власть контролирует потоки. И потоки гораздо сложнее оспорить, чем территорию.\n\nЭто и есть фундаментальный вопрос, который ведёт через весь курс: как устроена власть в мире, где информация — главный ресурс? Кто её контролирует? Как она концентрируется? И что происходит, когда несколько корпораций захватывают контроль над большей частью информационных потоков планеты? Следующие главы — об этом.", "tags": ["потоки", "общество", "власть"], "lensWeight": {"chronology": 4, "power": 5, "technology": 2, "media": 4, "privacy": 3}, "angDeg": 230.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1996"}], "edges": [{"from": "scarcity", "to": "shannon", "label": "из дефицита к измерению", "lenses": ["chronology", "technology"]}, {"from": "shannon", "to": "arpanet", "label": "сигнал становится сетью", "lenses": ["chronology", "technology"]}, {"from": "memex", "to": "open-web", "label": "гипертекст становится Web", "lenses": ["chronology", "media", "technology"]}, {"from": "arpanet", "to": "open-web", "label": "устойчивость плюс открытость", "lenses": ["chronology", "power", "technology"]}, {"from": "open-web", "to": "atoms-to-bits", "label": "открытость ускоряет копирование", "lenses": ["power", "technology"]}, {"from": "atoms-to-bits", "to": "castells", "label": "экономика превращается в потоки", "lenses": ["power", "media"]}, {"from": "media-effects", "to": "castells", "label": "медиа формируют сетевое общество", "lenses": ["media", "power"]}, {"from": "arpanet", "to": "cypherpunks", "label": "сеть требует защиты", "lenses": ["privacy", "technology", "power"]}, {"from": "cypherpunks", "to": "castells", "label": "приватность внутри потоков", "lenses": ["privacy", "power"]}, {"from": "scarcity", "to": "castells", "label": "от контроля доступа к контролю потоков", "lenses": ["power"]}]};;
function renderEmptyState(reason){const empty=document.querySelector(".empty-state"),svg=document.querySelector(".system-map");
  if(!empty||!svg)return;empty.hidden=false;svg.setAttribute("hidden","");
  empty.innerHTML=`<p>${reason}</p><a href="${CHAPTER_DATA.chapter.sourceUrl}" target="_blank" rel="noreferrer">Luminara</a>`;}
</script>

<body>
<div class="stars"></div><div class="stars2"></div>
<main class="app-shell">
  <section class="rail">
    <div><p class="eyebrow">Luminara · Atlas</p><h1 id="app-title">До интернета</h1></div>
    <p class="chapter-lede">Как информация становится властью — от дефицита и сигналов до сетевого общества.</p>
    <div class="rail-rule"></div>
    <div><p class="section-h" data-ui="section_lenses">Линзы интерпретации</p><div class="lens-group" style="margin-top:9px"></div><p class="lens-desc" style="margin-top:9px"></p></div>
    <div class="rail-rule"></div>
    <div class="progress-box"></div>

<script>
// --- theme from URL (?theme=light|dark & ?accent=oklch/hex) — mirrors app ---
(function(){
  try{
    var p=new URLSearchParams(location.search);
    var theme=p.get("theme"); var accent=p.get("accent");
    if(theme==="light") document.documentElement.setAttribute("data-theme","light");
    else if(theme==="dark") document.documentElement.removeAttribute("data-theme");
    if(accent){ document.documentElement.style.setProperty("--accent", decodeURIComponent(accent)); }
    // sun ink: readable on core
    document.documentElement.style.setProperty("--sun-ink", theme==="light" ? "#fff" : "#fff");
  }catch(e){}
})();
// live updates from parent (optional): postMessage {theme, accent}
window.addEventListener("message",function(ev){
  var m=ev.data||{};
  if(m.theme==="light") document.documentElement.setAttribute("data-theme","light");
  if(m.theme==="dark") document.documentElement.removeAttribute("data-theme");
  if(m.accent) document.documentElement.style.setProperty("--accent", m.accent);
  if(typeof renderAll==="function") renderAll();
});

const state={lens:"chronology",selected:null,visited:new Set(),entered:false};
const byId=id=>CHAPTER_DATA.nodes.find(n=>n.id===id);
const SVGNS="http://www.w3.org/2000/svg";
const el=(t,a)=>{const e=document.createElementNS(SVGNS,t);for(const k in(a||{}))e.setAttribute(k,a[k]);return e;};
function typeColor(t){return{power:"var(--power)",technology:"var(--technology)",media:"var(--media)",privacy:"var(--privacy)",economy:"var(--economy)"}[t]||"var(--accent)";}
function typeLabel(t){var U=window.__UI_LOC||{};var k="type_"+t;if(U[k])return U[k];return{power:"Власть",technology:"Технологии",media:"Медиа",privacy:"Приватность",economy:"Экономика"}[t]||"Идея";}
function lensById(id){return CHAPTER_DATA.lenses.find(l=>l.id===id);}
function edgeActive(e){return e.lenses.includes(state.lens);}
function nodeWeight(n){return(n.lensWeight&&n.lensWeight[state.lens])||0;}
const CX=CHAPTER_DATA.chapter.centerX||500, CY=CHAPTER_DATA.chapter.centerY||445, RING=CHAPTER_DATA.chapter.ring||300;

function buildLenses(){
  const w=document.querySelector(".lens-group");w.innerHTML="";
  CHAPTER_DATA.lenses.forEach(l=>{const b=document.createElement("button");b.className="lens-btn";b.type="button";
    b.setAttribute("aria-pressed",String(l.id===state.lens));b.style.setProperty("--dot",l.accent);
    b.innerHTML=`<span class="lens-dot"></span>${l.label}`;b.addEventListener("click",()=>setLens(l.id));w.appendChild(b);});
}
function setLens(id){state.lens=id;const l=lensById(id);
  const d=document.querySelector(".lens-desc");if(d)d.textContent=l?l.description:"";
  document.querySelectorAll(".lens-btn").forEach((b,i)=>b.setAttribute("aria-pressed",String(CHAPTER_DATA.lenses[i].id===id)));
  renderAll();}

function curve(a,b){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;const dx=mx-CX,dy=my-CY,len=Math.hypot(dx,dy)||1;const bow=26;
  return `M ${a.x} ${a.y} Q ${mx+(dx/len)*bow} ${my+(dy/len)*bow} ${b.x} ${b.y}`;}

function defs(){
  const d=el("defs");
  const mk=(id,color)=>{color=lensById(state.lens)?lensById(state.lens).accent:"#888";const m=el("marker",{id,viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"});
    const p=el("path",{d:"M0 0 L10 5 L0 10 z",fill:color});m.appendChild(p);return m;};
  d.appendChild(mk("arrow-active", "var(--dot-fallback)"));
  var sg=el("radialGradient",{id:"sunGrad",cx:"50%",cy:"42%",r:"60%"});
  var css=getComputedStyle(document.documentElement);
  sg.appendChild(el("stop",{offset:"0%","stop-color":css.getPropertyValue("--bg-elev")||"#20264a"}));
  sg.appendChild(el("stop",{offset:"100%","stop-color":css.getPropertyValue("--bg")||"#0c1230"}));
  d.appendChild(sg);
  return d;
}

function renderMap(){
  const svg=document.querySelector(".system-map");if(!svg)return;
  [...svg.querySelectorAll("defs,g,.ring,.ring-tick,.era-label,.spoke")].forEach(n=>n.remove());
  svg.appendChild(defs());
  // rings
  const gDeco=el("g",{});
  [RING*0.55,RING].forEach(r=>gDeco.appendChild(el("circle",{class:"ring",cx:CX,cy:CY,r})));
  svg.appendChild(gDeco);
  // spokes + chronology era labels around outer ring
  const gSpoke=el("g",{});
  CHAPTER_DATA.nodes.forEach(n=>{
    gSpoke.appendChild(el("line",{class:"spoke",x1:CX,y1:CY,x2:n.x,y2:n.y}));
  });
  svg.appendChild(gSpoke);

  // edges (with directional arrows on active)
  const gE=el("g",{});
  CHAPTER_DATA.edges.forEach(e=>{const a=byId(e.from),b=byId(e.to);if(!a||!b)return;
    const active=edgeActive(e);const g=el("g",{class:"edge"+(active?" active":"")});
    if(active)g.style.setProperty("--dot",lensById(state.lens).accent);
    const d=curve(a,b);const p=el("path",{d});
    // approximate length for draw animation
    const len=Math.round(Math.hypot(b.x-a.x,b.y-a.y)*1.15);
    p.style.setProperty("--len",len);
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const lb=el("text",{class:"edge-label",x:mx,y:my-5,"text-anchor":"middle"});lb.textContent=e.label;
    g.appendChild(p);g.appendChild(lb);gE.appendChild(g);});
  svg.appendChild(gE);

  // center (breathing, lens-tinted ring)
  const gC=el("g",{});
  gC.style.setProperty("--dot", lensById(state.lens)?lensById(state.lens).accent:"#b7791f");
  gC.appendChild(el("circle",{class:"sun-glow",cx:CX,cy:CY,r:100}));
  gC.appendChild(el("circle",{class:"sun-ring",cx:CX,cy:CY,r:82}));
  gC.appendChild(el("circle",{class:"sun-core",cx:CX,cy:CY,r:70}));/*no sublabel*/
  
  wrapText(gC,CHAPTER_DATA.chapter.centralIdea,CX,CY+2,120,"sun-t1",17);
  svg.appendChild(gC);

  // nodes with smart outward labels + era
  const gN=el("g",{});
  CHAPTER_DATA.nodes.forEach((n,i)=>{
    const g=el("g",{class:"node"+(state.selected===n.id?" selected":""),tabindex:"0",role:"button","aria-label":`${n.sceneIndex+1}. ${n.title} (${n.era||""})`});
    g.style.setProperty("--dot",typeColor(n.type));
    g.style.setProperty("--ox",n.x+"px");g.style.setProperty("--oy",n.y+"px");
    if(!state.entered) g.style.setProperty("--delay",(0.15+i*0.06)+"s"); else g.style.animation="none",g.style.opacity="1";
    if(state.selected){const linked=CHAPTER_DATA.edges.some(e=>(e.from===state.selected&&e.to===n.id)||(e.to===state.selected&&e.from===n.id));
      if(n.id!==state.selected&&!linked)g.classList.add("dim");}
    else if(nodeWeight(n)<=1){g.classList.add("dim");}
    g.appendChild(el("circle",{class:"planet-glow",cx:n.x,cy:n.y,r:34}));
    var pl=el("circle",{class:"planet",cx:n.x,cy:n.y,r:26});pl.style.fill="color-mix(in oklch, "+typeColor(n.type)+" 20%, var(--bg-elev))";g.appendChild(pl);
    const num=el("text",{class:"num",x:n.x,y:n.y});num.textContent=String(n.sceneIndex+1);g.appendChild(num);

    // smart label placement: outward along the radius from center
    const dx=n.x-CX,dy=n.y-CY,len=Math.hypot(dx,dy)||1;
    const ux=dx/len,uy=dy/len;
    const lx=n.x+ux*46, ly=n.y+uy*46;
    // anchor by horizontal side
    const anchor = ux>0.25?"start":(ux<-0.25?"end":"middle");
    const era=el("text",{class:"era",x:lx,y:ly-30,"text-anchor":anchor});era.textContent=n.era||"";g.appendChild(era);
    const kick=el("text",{class:"kicker",x:lx,y:ly-14,"text-anchor":anchor});kick.textContent=typeLabel(n.type);g.appendChild(kick);
    wrapTextAnchored(g,n.shortTitle,lx,ly+20,180,"cap",18,anchor);

    g.addEventListener("click",()=>selectNode(n.id));
    g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();selectNode(n.id);}});
    gN.appendChild(g);
  });
  svg.appendChild(gN);
  state.entered=true;
}
function wrapText(parent,text,x,y,maxw,cls,fs){wrapTextAnchored(parent,text,x,y,maxw,cls,fs,"middle");}
function wrapTextAnchored(parent,text,x,y,maxw,cls,fs,anchor){
  const words=String(text).split(/\s+/);const lines=[];let line="";
  const approx=s=>s.length*(fs*0.56);
  words.forEach(w=>{const t=line?line+" "+w:w;if(approx(t)>maxw&&line){lines.push(line);line=w;}else line=t;});
  if(line)lines.push(line);const total=(lines.length-1)*(fs+2);
  lines.forEach((ln,i)=>{const t=el("text",{class:cls,x,y:y-total/2+i*(fs+2),"text-anchor":anchor});t.textContent=ln;parent.appendChild(t);});
}
