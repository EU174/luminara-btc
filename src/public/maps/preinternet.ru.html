anifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1993"}, {"id": "castells", "sceneIndex": 8, "x": 307.2, "y": 215.2, "type": "power", "title": "Кастельс: билік ағындарға өтті", "shortTitle": "Ағындар", "thesis": "Билік орындарды бақылаудан деректер ағындарын бақылауға ауысты.", "insight": "Кастельс көрсетті: билік орындарды бақылаудан деректер мен назар ағындарын бақылауға өтті - бұл оны көрінбейтін әрі дау айту қиын етті.", "body": "## Байқалмай қалған революция\n\n1990-жылдардың ортасына қарай испан әлеуметтанушысы Мануэль Кастельс бәрінің көз алдында болып жатқан өзгерісті бақылап, көпшілік байқамаған нәрсе туралы үш томдық еңбек жазды. Ақпараттық революция әлдеқашан болып қойған еді. Тек адамдар оны басқа жерден іздеді.\n\nОлар ұшатын көліктерді және асүйдегі роботтарды күтті. Олар 1960-жылдардағы ғылыми-көпшілік журналдар уәде еткен фантастикалық болашақты күтті. Ал революция банктердің сервер бөлмелерінде, жаһандық корпорациялардың логистикалық орталықтарында, құрлықтар арасындағы қаржы ағындарында жүріп жатты. 1990-жылдарға қарай ақша физикалық болудан қалған - ол серверлер арасындағы дерек ағындарына айналды. Өндіріс жергілікті болудан қалды - ол дизайн Калифорнияда жасалатын, бөлшектер Қытайда өндірілетін, Вьетнамда құрастырылатын, ал барлық жерде сатылатын жеткізушілердің жаһандық желісіне айналды. Билік аумақпен өлшенуден қалды.\n\n## Орындар кеңістігі мен ағындар кеңістігі\n\nКастельс қазіргі әлемді түсінуге көмектесетін айырмашылық енгізді. Ескі билік «орындар кеңістігін» бақылаған: зауыттарды, порттарды, шекараларды, аумақтарды. Басып алуға, қорғауға, ұстап тұруға болатын физикалық нүктелерді. Жаңа билік «ағындар кеңістігін» бақылайды: деректерді, капиталды, назарды, ақпаратты.\n\nБұл биліктің түбегейлі бөлек түрлері. Аумақтық билікті картадан көруге болады - міне шекара, міне әскер, міне қамал. Ағындар үстіндегі билік көрінбейді. Google билігі қайда орналасқан? Еш жерде де, барлық жерде де бір мезетте. Facebook билігі қайда орналасқан? Миллиардтаған адамның не көретінін анықтайтын алгоритмде. Bitcoin билігі қайда орналасқан? Физикалық мекені жоқ таратылған желіде.\n\nКастельс көрсетті: ағындарды кім басқарса, әлемді сол басқарады. Бұл байқау қорқынышты дәл болып шықты. Бес-алты технологиялық компания планетадағы ақпараттық ағындардың көп бөлігін бақылайды. Олар аумақтарға иелік етпейді. Олар адамдардың не көретінін, не оқитынын, не сатып алатынын және неге сенетінін анықтайтын алгоритмдерге иелік етеді.\n\nДаниел Белл 1973 жылдың өзінде басты ресурс ақпарат болатын, ал басты институттар зауыттар емес, университеттер мен зерттеу зертханалары болатын постиндустриялық қоғамға өтуді болжаған. Кастельс 1990-жылдары мұның болғанын көрді - бірақ ақпарат үстіндегі билік университеттерде емес, мүлде басқа жерде шоғырланды.\n\n> Ескі билік орындарды бақылаған. Жаңа билік ағындарды бақылайды. Ал ағындарға дау айту аумаққа дау айтудан әлдеқайда қиын.\n\nБүкіл курс арқылы өтетін негізгі сұрақ осы: ақпарат басты ресурс болған әлемде билік қалай құрылған? Оны кім бақылайды? Ол қалай шоғырланады? Бірнеше корпорация планетадағы ақпараттық ағындардың басым бөлігін бақылауға алғанда не болады? Келесі тараулар - осы туралы.", "tags": ["ағындар", "қоғам", "билік"], "lensWeight": {"chronology": 4, "power": 5, "technology": 2, "media": 4, "privacy": 3}, "angDeg": 230.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm reinternet", "title": "Internetgacha", "sourceUrl": "https://luminara.tech/#/scene?s=3&c=preinternet", "centralIdea": "Axborot hokimiyatga aylanadi", "centerX": 500, "centerY": 445, "ring": 300, "lede": "Axborot qanday hokimiyatga aylanadi — tanqislik va signallardan tarmoq jamiyatigacha."}, "lenses": [{"id": "chronology", "label": "Xronologiya", "accent": "#7dd3fc", "description": "Voqealar tartibi va axborot tanqisligidan maʼlumotlar oqimlariga oʻtish."}, {"id": "power", "label": "Hokimiyat", "accent": "#f87171", "description": "Axborotni kim nazorat qiladi: institutlar, protokollar, tarmoqlar yoki platformalar."}, {"id": "technology", "label": "Texnologiyalar", "accent": "#34d399", "description": "Ixtirolar va protokollar: signal, gipermatn, paketlar, TCP/IP, Web."}, {"id": "media", "label": "Media", "accent": "#fbbf24", "description": "Uzatish muhiti idrok, xulq-atvor va jamiyat tashkilotini qanday oʻzgartiradi."}, {"id": "privacy", "label": "Maxfiylik", "accent": "#c084fc", "description": "Kriptografiya kuzatuv va nazoratdan himoya sifatida."}], "nodes": [{"id": "scarcity", "sceneIndex": 0, "x": 500.0, "y": 145.0, "type": "power", "title": "Axborot tanqislik sifatida", "shortTitle": "Tanqislik", "thesis": "Internetgacha axborot jismonan qimmat, sekin va markazlashgan edi.", "insight": "Internetgacha axborot jismonan qimmat va markazlashgan edi — bu uni uskunaga ega boʻlganlarning hokimiyat vositasiga aylantirardi.", "body": "## Soʻzlar pul turgan dunyo\n\nSen buni ekranda oʻqiyapsan. Qayerdadir data-markazda server bu matnni senga millisekundlar ichida yubordi — va bu senga hech narsa turmadi. Bu elektr yoki vodoprovod kabi oʻz-oʻzidan ayon tuyuladi. Ammo doim ham bunday boʻlmagan. «Oldin» qanday boʻlganini tushunish esa tarixiy qiziqish emas, balki zamonaviy internet nega aynan shunday tuzilganini tushunish kalitidir. Va nega bu muammo ekanini ham.\n\nAtigi yetmish yil avval Kiyevdan Nyu-Yorkka xabar yuborish pul turardi, kunlar olardi va uskunaga ega boʻlganlar tomonidan nazorat qilinardi: davlatlar, telegraf kompaniyalari, gazeta tahririyatlari. Axborot tanqislik edi — xuddi neft yoki don kabi. Har qanday tanqislik kabi, u hokimiyat edi. Axborot uzatilishini nazorat qilgan kishi reallikni nazorat qilardi.\n\nXX asr oʻrtalaridagi bosmaxonani tasavvur qil. Ulkan metall mashinalar, qoʻrgʻoshin harflar, boʻyoq va moy hidi. Bitta gʻoyani million odamga yetkazish uchun gazetaning million nusxasini jismonan bosib chiqarish, ularni yuk mashinalariga ortish va butun mamlakat boʻylab kiosklar tomon tarqatish kerak edi. Har bir nusxa pul turardi. Yetkazishning har bir kilometri pul turardi. Adaddagi xato — pul havoga sovurildi, obroʻga putur yetdi. Bu ulkan, ogʻir, sekin mexanizm edi.\n\nRadio va televideniye inqilobdek tuyulardi — signal yorugʻlik tezligida tarqaladi, yuk mashinalari kerak emas. Ammo ularda prinsipial cheklov bor edi: bitta uzatkich, millionlab qabul qilgichlar. Faqat minorasi bor odamgina gapira olardi. Qolgan butun insoniyat tinglardi. Goʻshakni koʻtarib javob berib boʻlmasdi. Eʼtiroz bildirib boʻlmasdi. Oʻz soʻzingni qoʻshib boʻlmasdi.\n\nInternetgacha boʻlgan axborot dunyosi shunday koʻrinardi: markazlashgan, qimmat, bir yoʻnalishli. Bir nechta manba koʻpchilikka efir uzatardi. Axborot qatʼiy yuqoridan pastga oqardi — uskunasi borlardan uskunasi yoʻqlarga. Bu tasodif ham, yomon niyat ham emas — oʻsha davr texnologiyalarining jismoniy realligi edi.\n\n> Axborot shunchaki resurs emas edi — u hokimiyat arxitekturasi edi. Uzatish kanaliga kim egalik qilsa, reallikka ham oʻsha egalik qilardi.\n\nAynan shuning uchun bu arxitekturani oʻzgartirish mumkinligini tushungan ilk odamlar inqilobiy narsani anglashdi. Shunchaki «maʼlumotlarni tezroq uzatish mumkin» deganini emas. Balki «axborot ustidan hokimiyatning oʻzi qurilgan tuzilmani sindirish mumkin» deganini. Va ular buning ustida ishlay boshlashdi — birinchi brauzer paydo boʻlishidan ancha oldin.", "tags": ["hokimiyat", "tanqislik", "media"], "lensWeight": {"chronology": 5, "power": 5, "technology": 1, "media": 4, "privacy": 1}, "angDeg": -90.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1948-yilgacha"}, {"id": "shannon", "sceneIndex": 1, "x": 692.8, "y": 215.2, "type": "technology", "title": "Shannon: axborot fizikaga aylandi", "shortTitle": "Shannon", "thesis": "Axborotni fizik kattalik kabi oʻlchash, kodlash va uzatish mumkin boʻldi.", "insight": "Shannon axborotni fizik kattalik sifatida oʻlchash va uzatish mumkinligini isbotladi — bu butun raqamli dunyoning matematik poydevorini qoʻydi.", "body": "## Fikrni oʻlchagan odam\n\n1948 yilda amerikalik matematik Claude Shannon quruq texnik nomli ishini eʼlon qildi: \"A Mathematical Theory of Communication.\" Uni oʻshanda kam odam oʻqigan. Hozir ham kam odam oʻqiydi. Ammo u hamma oʻqiydigan aksariyat kitoblardan koʻra dunyoni koʻproq oʻzgartirdi.\n\nShannon imkonsizdek tuyulgan narsani isbotladi: har qanday xabarni — soʻz, tovush, tasvir, son, soʻzlar bilan tasvirlangan hidni — aniq oʻlchash, siqish va istalgan aloqa kanali orqali uzatish mumkin. U oʻlchov birligini «bit» deb atadi — binary digit, ikkilik raqam soʻzlaridan. Nol yoki bir. Signal bor yoki yoʻq. Axborotning butun olami nollar va birlar kombinatsiyasidir.\n\nShannongacha axborot mavhum va subyektiv narsa edi. Ayrim soʻzlar boshqalaridan «muhimroq». Ayrim tasvirlar «mazmunliroq». Ayrim xabarlar «boyroq». Shannondan keyin axborot massa yoki harorat kabi real va oʻlchanadigan fizik kattalikka aylandi. Dunyo faqat materiya va energiyaga boʻlinishdan toʻxtadi. Uchinchi narsa paydo boʻldi — axborot. Va bu uchinchi narsa dastlabki ikkisidan kam fundamental emasligi maʼlum boʻldi.\n\n## Okean orqali sham alangasi\n\nShannon nima qilganini tushunish uchun shunday vazifani tasavvur qil: sham alangasini Kiyevdan Tokioga uzatish. Shamning oʻzini olib borish mumkin — lekin bu sekin, qimmat, va alanga yoʻlda oʻchib qoladi. Bu materiyani uzatish, va u fizik qonunlar bilan cheklangan.\n\nAmmo alangani tasvirlash mumkin: uning rangi, balandligi, harorati, shakli, mumning kimyoviy tarkibi. Bu tasvirni sim orqali yorugʻlik tezligida yuborish mumkin. Tokiodagi boshqa odam esa xuddi shunday alangani yoqadi. Bu axborotni uzatish — va u fizik cheklovlarni bilmaydi.\n\nShannon bu ikkinchi usulni mutlaqo aniq, ishonchli va masshtablanadigan qilish mumkinligini koʻrsatdi. Har qanday signalni bitlarga kodlash, buzilishsiz uzatish va narigi tomonda qayta tiklash mumkinligini isbotladi. Butun raqamli dunyo aynan shu asosda turadi: elektron pochtadan 4K striminggacha, messenjerlardan blockchainʼgacha.\n\nHar safar Telegramʼda xabar yuborganingda — Shannon ishlaydi. Har safar blockchainʼdagi tranzaksiya tarmoq tugunlari orasida uzatilganda — Shannon ishlaydi. U butun raqamli dunyo qurilgan matematik poydevorni yaratdi.\n\n> Shannon internetni ixtiro qilmagan. U internet mumkin ekanini isbotladi — axborotni fizik kattalik kabi aniq uzatish mumkinligini ko'rsatdi.\n\nParadoks shundaki, Shannonning oʻzi Bell Laboratoriesʼda — dunyodagi eng yirik telefon monopoliyasida ishlagan. Uning kashfiyoti oxir-oqibat ish beruvchisining monopoliyasini yemirdi. Axborotni istalgan kanal orqali uzatish mumkin boʻlsa, demak, hech bir kanal abadiy monopolist boʻla olmaydi.", "tags": ["signal", "kodlash", "oʻlchash"], "lensWeight": {"chronology": 4, "power": 2, "technology": 5, "media": 2, "privacy": 2}, "angDeg": -50.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1948"}, {"id": "memex", "sceneIndex": 2, "x": 795.4, "y": 392.9, "type": "media", "title": "Bushning Memexʼi: zamonidan ilgarilagan orzu", "shortTitle": "Memex", "thesis": "Bogʻlangan bilim Webdan oldin shaxsiy assotsiatsiyalar mashinasi sifatida tasavvur qilingan.", "insight": "Vannevar Bush 1945 yilda gipermatn va bogʻlangan bilimlarni tasvirlagan — Webʼdan 46 yil oldin. Toʻgʻri gʻoyalar oʻlmaydi, ular oʻz texnologiyalarini kutadi.", "body": "## Internetdan qirq yil oldingi gipermatn\n\nHali 1945 yilda — birinchi toʻlaqonli kompyuter paydo boʻlishidan ikki yil oldin va World Wide Webʼdan qirq olti yil avval — amerikalik olim Vannevar Bush «As We May Think» nomli esse yozdi. U ilmiy jurnalda emas, keng auditoriya uchun ommaviy nashr boʻlgan The Atlanticʼda chop etildi. Bush uni faqat hamkasb olimlar emas, hamma oʻqishini xohlardi.\n\nU «memex» deb atagan qurilmani tasvirladi — memory extender, xotira kengaytirgich degani. Bu insoniyatning barcha bilimlari jamlangan shaxsiy kutubxona edi, unda har qanday hujjat boshqa istalgan hujjat bilan maʼno orqali bogʻlangan. Napoleon haqida maqola oʻqiysan — va bir harakat bilan uning yurishlari xaritasiga oʻtasan. Xaritadan — generallarining maktublariga. Maktublardan — XX asr harbiy tarixchilarining uning taktikasini tahlil qilishiga. Alfavit boʻyicha katalogdan qidirmaysan, javonlarni varaqlamaysan — fikrning oʻzi qanday ergashsa, sen ham fikr zanjiri boʻylab borasan.\n\nBu gipermatn edi. Bu soʻz rasman oʻylab topilishidan qirq yil oldin. Tim Berners-Lee bu gʻoyani World Wide Web shaklida amalga oshirishidan qirq olti yil oldin.\n\n## Nega orzu stol tortmasida yotib qoldi\n\nBush kelajakni mutlaqo aniq koʻrgan: bilimlar bogʻlangan, hammaga ochiq va barchaga tegishli boʻlishi kerak. Faqat bitta muammo bor edi — texnologiyalar hali mavjud emasdi. 1945 yilda kompyuterlar butun xonalarni egallardi, samolyotdek qimmat turardi va faqat hisoblay olardi. Displeylar ham, sichqonchalar ham, tarmoqlar ham yoʻq edi. Bush qurilmani mikrofilmlar va mexanik richaglar tili bilan tasvirladi — chunki analogiya uchun uning qoʻlida bor narsa shular edi.\n\nUning orzusi deyarli yarim asr stol tortmasida yotdi. Ammo u unutilmadi. Uni oʻqishdi, iqtibos keltirishdi, qoʻldan qoʻlga uzatishdi. Ted Nelson 1965 yilda «hypertext» soʻzini oʻylab topdi — bevosita Bushdan ilhomlanib. Douglas Engelbart kompyuter sichqonchasini va gipermatnli hujjatlar tizimini yaratdi — u ham Bush taʼsiri ostida.\n\nTim Berners-Lee 1989 yilda CERNʼda Web yaratish boʻyicha taklifini yozganida, u Bushning essesiga boshlangʻich gʻoya sifatida bevosita tayangan. Nashrdan qirq toʻrt yil oʻtgach, orzu nihoyat amalga oshirish vositalariga ega boʻldi.\n\nBu hikoya tarixiy qiziq voqea sifatida emas, muhim. U prinsipial narsani koʻrsatadi: toʻgʻri gʻoya oʻlmaydi. U oʻz vaqtini kutadi. Baʼzan — oʻnlab yillar davomida. Bugun biz shunga oʻxshash lahzani boshdan kechiryapmiz: foydalanuvchilar oʻz maʼlumotlariga egalik qiladigan markazlashmagan internet gʻoyalari blockchainʼdan ancha oldin mavjud edi. Texnologiyalar shunchaki nihoyat tasavvurga yetib oldi.\n\n> Bush World Wide Webʼni uning ixtiro qilinishidan qirq olti yil oldin tasvirlagan. Paygʻambar boʻlgani uchun emas — inson aqli bilim vositalaridan nimani xohlashini tushungani uchun.\n\nParadoks shundaki, Bush 1945 yilda gʻoyalar orasidagi bogʻlanishlar haqida oʻylagan — biz esa oxir-oqibat gʻoyalar orasidagi bogʻlanishlardan koʻra odamlar orasidagi bogʻlanishlar muhimroq boʻlib chiqqan internetga ega boʻldik. Bu muhim farq, keyingi boblarda unga qaytamiz.", "tags": ["gipermatn", "bilim", "assotsiatsiyalar"], "lensWeight": {"chronology": 4, "power": 2, "technology": 4, "media": 5, "privacy": 1}, "angDeg": -10.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1945"}, {"id": "arpanet", "sceneIndex": 3, "x": 759.8, "y": 595.0, "type": "technology", "title": "ARPANET: internet qoʻrquvdan tugʻildi", "shortTitle": "ARPANET", "thesis": "Aloqa tarmoq yagona ishdan chiqish nuqtasidan xalos boʻlganda barqaror boʻldi.", "insight": "ARPANET yagona nosozlik nuqtasisiz harbiy aloqa tizimi sifatida yaratilgan — va aynan shu markazlashmagan arxitektura butun internetning poydevoriga aylandi.", "body": "## Dunyo arxitekturasini oʻzgartirgan sunʼiy yoʻldosh\n\nInternet tarixi Silikon vodiysida ham, universitet auditoriyalarida ham boshlanmaydi. U Pentagonda, sovuq urush avjida, keskin geosiyosiy qoʻrquv paytida boshlanadi.\n\n1957-yil 4-oktyabrda Sovet Ittifoqi Yerning birinchi sunʼiy yoʻldoshini uchirdi. Diametri 58 santimetr, ogʻirligi 83 kilogramm boʻlgan kichik metall shar Yer ustidan uchib, signal berib turdi — va uni butun dunyo eshitdi. Amerika harbiylari uchun bu raqibning shunchaki texnologik gʻalabasi emas edi. Bu xavotir signali edi: dushman orbitani nazorat qilmoqda. Agar ular sunʼiy yoʻldosh uchira olsa, yadroviy kallakli raketani ham uchirib, sayyoraning istalgan nuqtasiga yetkaza oladi.\n\nBir yil oʻtib AQSh DARPA — Ilgʻor tadqiqot loyihalari agentligini tuzdi. Uning oldida vazifa bor edi: bir zarba bilan yoʻq qilib boʻlmaydigan harbiy aloqa tizimini yaratish. Anʼanaviy telefon tarmoqlari halokatli darajada zaif edi: markaziy telefon stansiyasi bor ekan, nosozlik nuqtasi ham bor. Pentagonga bitta bomba tushsa — butun armiya bilan aloqa yoʻqoladi.\n\n## Markazsiz tarmoq — hammasini oʻzgartirgan gʻoya\n\nDARPA muhandislari tamoman boshqa yechim oʻylab topdi. Markazni umuman olib tashlasa-chi? Tarmoqdagi har bir tugunni teng huquqli qilish. Bittasi ishdan chiqsa, xabar avtomatik ravishda boshqa yoʻnalish topadi. Quvurlardagi suv kabi: bitta quvur yopilsa, suv aylanma yoʻl topadi.\n\nBu gʻoya ARPANET deb ataldi. 1969-yilda u ilk bor ishladi: toʻrtta universitet — UCLA, Stanford, UC Santa Barbara va Utah — telefon liniyasi orqali maʼlumot almashdi. Uzatishga uringan birinchi xabar \"login\" soʻzi edi. Tizim \"o\" harfidan keyin ishdan chiqdi. Proto-internet orqali uzatilgan birinchi soʻz \"lo\" boʻldi — inglizchada bu \"qarang\" degani. Tasodifiy poeziya.\n\nOʻshanda hech kim bu global fuqarolik internetining poydevoriga aylanishini oʻylamagan. Harbiylar yadroviy urush holati uchun ishonchli aloqa xohlashgan. Ular bundan kattaroq narsani yaratdi — hokimiyat tuzilmaviy jihatdan bitta nuqtada jamlana olmaydigan arxitekturani. Taqsimlangan tarmoq oʻz tabiatiga koʻra markazlashuvga chidamli.\n\nHech boʻlmaganda, reja shunday edi. Reallik esa murakkabroq boʻlib chiqdi — bu haqda keyingi boblarda gaplashamiz.\n\n> Internet yadroviy zarbaga chidamli harbiy aloqa tizimi sifatida yaratilgan. Yakunda u hokimiyatning har qanday markazlashuviga chidamli boʻlib chiqdi — va bu uning asosiy siyosiy xususiyatiga aylandi.\n\n1974-yilda Vinton Cerf va Robert Kahn keyingi muammoni hal qildi: turli kompyuterlar turli tillarda gaplashardi. Stanford tarmogʻi MIT tarmogʻini tushunmasdi. Ular TCP/IPni yaratdi — universal protokol, har qanday tarmoqlar oʻrtasida maʼlumot uzatish uchun yagona til. Maʼlumotlar kichik paketlarga boʻlinadi, har biri oʻz yoʻlini topadi, narigi uchida esa qayta yigʻiladi. Goʻyo xatni boʻlaklarga kesib, har birini alohida kuryer bilan yuborgandeksiz — ular baribir qabul qiluvchi tomonda toʻgʻri tartibda yigʻiladi. Bugun ham internet asosida aynan shu protokol yotadi — yaratilganidan ellik yil oʻtib.", "tags": ["paketlar", "DARPA", "TCP/IP", "markazsizlashuv"], "lensWeight": {"chronology": 5, "power": 5, "technology": 5, "media": 2, "privacy": 3}, "angDeg": 30.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://ww %BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1969"}, {"id": "open-web", "sceneIndex": 4, "x": 602.6, "y": 726.9, "type": "technology", "title": "Berners-Lee: hammasini bepul berish qarori", "shortTitle": "Ochiq Web", "thesis": "Web ommaviy boʻldi, chunki asosiy protokol hamma uchun ochiq edi.", "insight": "Berners-Lee Webni bepul berdi — altruizm tufayli emas, balki faqat ochiq protokol global boʻla olishini tushungani uchun.", "body": "## \"Noaniq, ammo qiziq\" degan belgi qoʻyilgan taklif\n\n1989-yilda yosh britaniyalik dasturchi Tim Berners-Lee Jenevadagi CERN — Yevropa yadroviy tadqiqotlar markazida ishlardi. Bu dunyodagi eng yirik ilmiy institut: oʻnlab mamlakatlardan kelgan minglab olimlar bir xil tajribalar ustida ishlaydi, lekin doim hujjatlarni yoʻqotadi, kontekstni unutadi, oʻzlaridan oldin nima qilinganini tushunish uchun oylar sarflaydi.\n\nBerners-Lee rahbariyat uchun ichki taklif yozdi. Mazmuni: barcha hujjatlar havolalar bilan bogʻlangan va tarmoqdagi istalgan kompyuterdan ochiladigan tizim yaratish. Uning boshligʻi Mike Sendall chetiga uch soʻz yozdi: \"Noaniq, ammo qiziq\". Bu dunyoni oʻzgartiradigan ixtiro haqidagi eng kamtarona taqriz edi.\n\nUch yil ichida Berners-Lee butun zamonaviy internet tayanadigan uch narsani yaratdi: HTML — hujjatlarni belgilash tili, HTTP — ularni uzatish protokoli, va URL — manzillash tizimi. Ular birgalikda World Wide Webni hosil qildi. Hujjatlar serverlarda saqlanadi, manzillarga ega, havolalar bilan bogʻlangan va brauzer dasturi orqali ochiladi. Oddiy, nafis, universal.\n\n## Davrni belgilab bergan qaror\n\nAmmo asosiy qaror texnik emas edi. U etik qaror edi.\n\nBerners-Lee oʻz ixtirosini patentlashi mumkin edi. CERN yuristlari shuni taklif qilgan. Agar har bir sayt HTTPdan foydalangani uchun royalti toʻlaganida, Berners-Lee sayyoradagi eng boy odamga aylangan boʻlardi. Buning oʻrniga u texnologiyani insoniyatga bepul berishni talab qildi — cheklovlarsiz, litsenziyalarsiz, shartlarsiz.\n\n\"Agar Web patentlangan yoki bitta kompaniya nazorati ostida boʻlganida, u mavjud boʻlmasdi\", — deb keyinroq tushuntirdi u. Bu altruizm uchun altruizm emas edi. Bu strategiya edi: tarmoq faqat toʻsiqlarsiz global miqyosgacha oʻsa olardi. Faqat har kim ruxsatsiz sayt yarata olsa, tarmoq chinakam ochiq boʻladi.\n\n1993-yilda AQSh Milliy superkompyuter markazi talabalari Mosaic brauzerini chiqardi — matn va rasmlarni bitta ekranda birga koʻrsatgan birinchi brauzer. Bungacha internet matn dunyosi edi. Mosaic uni vizual qildi. Dasturlashni hech qachon oʻrganmagan oddiy odam uchun ham tushunarli qildi.\n\nOʻsha yili veb-saytlar soni besh yuzdan oshdi. Hozir bu kulgili eshitiladi, lekin oʻshanda bu portlash edi. Ikki yil oʻtib ular allaqachon ikki yuz mingta edi. Poyga boshlandi.\n\n> Berners-Lee Webni bepul berdi — va shu orqali uni global qildi. Agar u uni patentlaganida, biz haligacha har bir havola uchun royalti toʻlardik.\n\nBerners-Lee haqidagi bu hikoya shunchaki biografik fakt emas. Bu tarmoqlar tabiati haqidagi saboq: ochiq protokollar yopiq protokollardan tezroq oʻsadi, chunki har kim ularning ustiga qurishi mumkin. Ethereum blokcheyni aynan shuning uchun ochiq. TON aynan shuning uchun ochiq protokol. Berners-Lee 1991-yilda qaysi texnologiyalar gʻalaba qozonishini hanuz belgilab beradigan tamoyilni qoʻydi.", "tags": ["Web", "protokol", "ochiqlik"], "lensWeight": {"chronology": 5, "power": 4, "technology": 5, "media": 4, "privacy": 2}, "angDeg": 70.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (19 =bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1991"}, {"id": "atoms-to-bits", "sceneIndex": 5, "x": 397.4, "y": 726.9, "type": "economy", "title": "Atomlardan bitlarga: iqtisodiy mantiq almashuvi", "shortTitle": "Atomlar → bitlar", "thesis": "Qiymat axborot kabi harakatlana boshladi: nusxalanadigan, darhol va deyarli bepul.", "insight": "\"Atomlardan bitlarga\" oʻtish shunchaki texnologiya emas, bu iqtisodiy mantiq almashuvi: bir xillik miqyosidan har bir oʻzaro taʼsirning noyobligiga oʻtish.", "body": "## Toffler buni 1980-yilda koʻrgan\n\n1980-yilda Alvin Toffler \"Uchinchi toʻlqin\"ni nashr qilganida, shaxsiy kompyuterlar deyarli yoʻq edi. Internet yoʻq edi. Mobil telefonlar yoʻq edi. Shunga qaramay u faqat qirq yil oʻtgach toʻliq yuzaga chiqqan iqtisodiy transformatsiyani tasvirlab berdi.\n\nToffler inson sivilizatsiyasining uch davrini tasvirladi. Birinchi toʻlqin — agrar: yer va hosil asosiy qiymat sifatida. Ikkinchi toʻlqin — sanoat: konveyer, standartlashtirish, tiraj. Zavod mingta bir xil muzlatkich ishlab chiqaradi — bu aynan ular bir xil boʻlgani uchun samarali. Mahsulot birliklari qancha koʻp boʻlsa, har birining tannarxi shuncha past boʻladi. Miqyos — industrial iqtisodiyotning gʻalabasi.\n\nUchinchi toʻlqin — axborot toʻlqini. Bu yerda mantiq ostin-ustun boʻladi. Axborot iqtisodiyotida nusxa olish bepul. Bitta dastur bir vaqtning oʻzida milliard foydalanuvchi bilan turlicha ishlashi mumkin — va bu bag emas, asosiy ustunlik. Qiymat bir xil narsani tirajlash orqali emas, har bir oʻzaro taʼsirning noyobligi orqali yaratiladi.\n\n## Nicholas Negroponte va eng sodda formula\n\n1995-yilda MIT Media Lab direktori Nicholas Negroponte buni mashhur iboraga aylangan bir jumla bilan ifodaladi: \"atomlardan bitlarga\".\n\nAtomlar — bu jismoniy dunyo. Muzlatkich ishlab chiqarish uchun metall, plastik, elektronika, ishchi qoʻllar, zavod kerak. Uni xaridorga yetkazish uchun yuk mashinasi, ombor, doʻkon kerak. Har bir nusxa pul turadi. Tiraj resurslar bilan cheklangan. Agar siz millionta muzlatkich sotmoqchi boʻlsangiz, millionta muzlatkich ishlab chiqarishingiz kerak.\n\nBitlar — bu raqamli dunyo. Dastur yaratish uchun bitta dasturchi va bitta kompyuter kerak. Uni milliard foydalanuvchiga yetkazish uchun server va internet ulanishi kerak. Nusxa olish deyarli bepul. Yetkazish bir zumda. Tiraj cheksiz. Agar siz dasturning milliard nusxasini sotmoqchi boʻlsangiz, milliardta dastur ishlab chiqarishingiz shart emas. Bitta nusxa milliard marta replikatsiya qilinadi.\n\nBu shunchaki texnologik farq emas. Bu fundamental iqtisodiy mantiqning almashuvi. XX asrning butun iqtisodiyoti atomlar mantiqiga qurilgan edi: tanqislik, miqyos, standartlashtirish. XXI asr iqtisodiyoti bitlar mantiqiga quriladi: moʻl-koʻllik, shaxsiylashtirish, tarmoq effektlari.\n\n> Industrial iqtisodiyot bir xillik miqyosidan pul topardi. Axborot iqtisodiyoti har bir oʻzaro taʼsirning noyobligidan pul topadi. Bular qarama-qarshi mantiqlar.\n\nBu farqni tushunganingizda, zamonaviy dunyodagi koʻp narsa izohlanishni boshlaydi. Nega Google bepul? Chunki qidiruv natijalarini nusxalash hech narsa turmaydi — monetizatsiya reklama orqali ketadi. Nega Spotify musiqachilarga juda oz pul toʻlaydi? Chunki bitta strimning chegaraviy qiymati nolga intiladi. Nega kriptovalyutalar umuman mumkin? Chunki raqamli aktivlarni jismoniy tashuvchisiz uzatish mumkin. Bularning barchasi Negroponte uch soʻzda ifodalagan bitta prinsipning oqibatlari.", "tags": ["iqtisodiyot", "bitlar", "miqyos"], "lensWeight": {"chronology": 4, "power": 4, "technology": 3, "media": 3, "privacy": 1}, "angDeg": 110.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1995"}, {"id": "media-effects", "sceneIndex": 6, "x": 240.2, "y": 595.0, "type": "media", "title": "Maklyuen va Rashkoff viruslari: media bizni o'zgartiradi", "shortTitle": "Media", "thesis": "Faqat axborot emas, xulq-atvorni qayta quradigan muhit ham muhim.", "insight": "Maklyuen va Rashkoff tushundi: muhim narsa axborot emas, uni uzatadigan muhitdir. Media bizni kontentdan qat'i nazar - biz sezmaydigan tuzilma orqali o'zgartiradi.", "body": "## Uzatish vositasi xabardan muhimroq\n\nMarshall Maklyuen noqulay mutafakkir edi. 1964-yilda u avval bema'nilik deb, keyin metafora deb qabul qilingan, faqat keyinroq esa reallikning aniq texnik tavsifi sifatida tushunilgan iborani yozdi: \"Uzatish vositasining o'zi xabardir\".\n\nU nimani nazarda tutgan edi? 1950-yillarda ommaviy televideniye paydo bo'lganda, hamma kontent haqida bahslashardi: dasturlar yaxshimi yoki yomonmi, ta'limiy yoki ko'ngilochar, targ'ibotmi yoki san'at. Maklyuen shunday dedi: bu ikkinchi darajali savol. Televideniyening o'zi - muhit sifatida, texnologiya sifatida, idrok usuli sifatida - aynan nima ko'rsatilishidan qat'i nazar, jamiyatni allaqachon o'zgartirib bo'lgan.\n\nTelevizor tarixda birinchi marta millionlab odamlarni sinxronlashtirdi: bir xil yangiliklar, bir xil vaqtda, bir xil so'zlar bilan - mamlakatdagi barcha uylarda bir paytda. U Maklyuen \"global qishloq\" deb atagan narsani yaratdi - hamma bir vaqtning o'zida bitta hodisani boshdan kechiradigan dunyoni. Televideniyegacha turli shaharlardagi odamlar turli axborot realliklarida yashardi. Undan keyin esa - bittasida.\n\n## Rashkoffning biologik metaforasi\n\n1994-yilda amerikalik media nazariyotchisi Duglas Rashkoff Maklyuen g'oyasiga biologik metafora qo'shdi va u yanada aniqroq bo'lib chiqdi. *Media Virus!* kitobida u bugun viral kontent deb ataladigan mexanizmni tasvirlagan - YouTube'dan o'n yil, TikTok'dan yigirma yil oldin.\n\nG'oyalar viruslar kabi tarqaladi. Ular haqiqat bo'lgani uchun emas. Foydali bo'lgani uchun emas. Balki auditoriyaning psixologik zaif nuqtasiga - odamlarni ularni davom ettirib uzatishga majbur qiladigan narsaga tekkani uchun: qo'rquv, g'azablanish, zavq, tanishlik hissi, jahl, ko'ngil erishi. Emotsiya - g'oyaning replikatsiya mexanizmi.\n\nRashkoff ko'rsatdi: kuchli emotsiya uyg'otadigan kontent o'zining haqiqatligi yoki foydaliligidan qat'i nazar tarqaladi. Shov-shuvli xabar haqiqat xabardan tezroq yoyiladi. Qo'rqinchli hikoya zerikarli hikoyadan tezroq tarqaladi. Bu tasodif ham, manipulyatsiya ham emas - bu media muhitining arxitekturaviy xususiyati. Virus mezbonni \"yaxshi odammi yoki yomon odammi\" mezoni bilan tanlamaydi. U \"zaifmi yoki yo'qmi\" mezoni bilan tanlaydi.\n\nAynan shunga optimallashtirilgan TikTok algoritmlaridan ancha oldin Rashkoff ular qurilgan tamoyilni tasvirlab bergan. Algoritm virallikni yaratmadi. U faqat uni kuchaytirishni o'rgandi.\n\n> Maklyuen ogohlantirgan: muhim narsa dastur emas, televizor. Rashkoff aniqlik kiritdi: muhim narsa g'oya emas, u uyg'otadigan emotsiya. Ular birgalikda zamonaviy ijtimoiy tarmoqlar arxitekturasini ular paydo bo'lishidan o'ttiz yil oldin tasvirlab berishdi.\n\nInternet paydo bo'lganda, birinchi savol yana kontent haqida bo'ldi: odamlar u yerda nimani o'qiydi va tomosha qiladi? Maklyuen aytgan bo'lardi: noto'g'ri savol. To'g'ri savol - odam tobora ko'proq vaqt o'tkazadigan muhitning o'zi unga nima qiladi? Bu savol ijtimoiy tarmoqlar paydo bo'lganda nihoyatda muhim bo'lib qoldi. Afsuski, u juda kech berildi.", "tags": ["media", "xulq-atvor", "idrok"], "lensWeight": {"chronology": 3, "power": 3, "technology": 1, "media": 5, "privacy": 2}, "angDeg": 150.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1964→1990-yillar"}, {"id": "cypherpunks", "sceneIndex": 7, "x": 204.6, "y": 392.9, "type": "privacy", "title": "Hughes va shifropanklar: maxfiylik - bu matematika", "shortTitle": "Shifrpanklar", "thesis": "Raqamli muhitdagi maxfiylik institutlar vaʼdasini emas, kriptografiyani talab qiladi.", "insight": "Hughes 1993-yilda maxfiylik inqirozini oldindan ko'rdi va matematik himoyani talab qildi - uning manifesti Bitcoin va butun Web3 uchun ideologik poydevorga aylandi.", "body": "## Oldindan ogohlantirgan ovoz\n\n1993-yilda, ko'pchilik \"internet\" so'zini ilk bor eshitayotgan paytda, matematik va kriptograf Eric Hughes uch sahifalik hujjat yozdi. U \"Shifropank manifesti\" deb atalgan va kriptografiya bilan shug'ullangan hamda ommaviy tarmoq paydo bo'lishining oqibatlari haqida o'ylagan kichik hamjamiyatning pochta ro'yxatida e'lon qilingan.\n\nO'sha vaqtda internet oddiy odamlar uchun endigina ochila boshlagan edi. Ilk brauzerlar endigina paydo bo'lgan. Tarmoqdagi maxfiylik haqida hali hech kim o'ylamasdi - odamlar shunchaki yangi imkoniyatlardan quvonardi: sayyoraning narigi chetidagi odamlar bilan yozishish mumkin! Yangiliklarni real vaqtda o'qish mumkin! Istalgan axborotni topish mumkin!\n\nHughes boshqacha o'ylardi. Uning dalili sodda va mustahkam edi: ochiq internet tarmoqdagi har bir harakating potensial ravishda hammaga - provayderlarga, davlatlarga, korporatsiyalarga ko'rinadi degani. Bu tasodifiy zaiflik emas. Bu ataylabmi yoki yo'qmi, aynan shunday yaratilgan tizimning arxitekturaviy xususiyati. Bunday sharoitda maxfiylikni himoya qilishning yagona yo'li provayderlar va davlatlardan ruxsat so'rash emas, balki matematikadan foydalanishdir. Kriptografiyadan. Hech qanday qonun buzolmaydigan matematikadan.\n\n## So'zma-so'z amalga oshgan bashorat\n\nHughes 1993-yilda shunday yozgan edi: \"Ochiq jamiyatdagi maxfiylik anonim tranzaksiyalar tizimini talab qiladi\". Bu fantastika kabi eshitilardi. O'quvchilarning ko'pchiligi yelka qisardi: \"Mening yashiradigan hech narsam yo'q\". Oddiy odamga anonim tranzaksiyalar nima uchun kerak?\n\nO'ttiz yil o'tib, biz korporatsiyalar foydalanuvchilar haqida ularning yaqinlaridan ham ko'proq biladigan dunyoda yashayapmiz. Ma'lumotlar sizishi kundalik yangilikka aylangan dunyoda. Karta orqali qilingan har bir xarid, har bir qidiruv so'rovi, telefoni yoqilgan holdagi har bir harakat yozib olinib, saqlanadigan dunyoda. Hughes paranoik emas edi. U shunchaki bir necha yurish oldinni o'ylagan.\n\nShifropanklar - 1990-yillar boshida shu g'oya atrofida to'plangan kichik hamjamiyat - oxir-oqibat Bitcoin uchun ideologik poydevor qo'ydi. Satoshi Nakamoto 2008-yilda Bitcoin tavsifini aynan shifropanklar pochta ro'yxatida e'lon qildi. Bu Hughes savoliga to'g'ridan-to'g'ri javob edi: mana sizga vositachiga ishonchga emas, matematikaga qurilgan anonim tranzaksiyalar tizimi.\n\nStewart Brand 1984-yildayoq ochiq internet manifestiga aylangan iborani aytgan edi: \"Axborot erkin bo'lishni xohlaydi\". U axborot tabiatini nazarda tutgan - u ko'chirilganda kamaymaydi, shuning uchun sun'iy to'siqlar uning tabiatiga zid. Hughes buni boshqa tomondan to'ldirdi: maxfiyliksiz axborot erkinligi erkinlik emas, kuzatayotganlar uchun shaffoflikdir.\n\n> Brand shunday dedi: axborot erkin bo'lishni xohlaydi. Hughes javob berdi: maxfiylik esa matematika bilan himoyalanishni xohlaydi. Ular birgalikda raqamli erkinlikning ikki qutbini tasvirlab berdi.\n\nBu ikki tamoyil - ochiqlik va maxfiylik - ma'lum ma'noda bir-biriga zid. Ular orasidagi taranglik internet qanday bo'lishi kerakligi haqidagi asosiy bahslarni hanuz belgilaydi. Bilimni hamma uchun ochiq qilib, shu bilan birga har bir insonning shaxsiy ma'lumotlarini qanday himoya qilish mumkin? Bu savol hali hal qilinmagan. Web3 aynan shuni hal qilishga urinmoqda.", "tags": ["kriptografiya", "maxfiylik", "kuzatuv"], "lensWeight": {"chronology": 3, "power": 4, "technology": 4, "media": 2, "privacy": 5}, "angDeg": 190.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1993"}, {"id": "castells", "sceneIndex": 8, "x": 307.2, "y": 215.2, "type": "power", "title": "Castells: hokimiyat oqimlarga o'tdi", "shortTitle": "Oqimlar", "thesis": "Hokimiyat joylarni nazorat qilishdan maʼlumotlar oqimlarini nazorat qilishga siljidi.", "insight": "Castells ko'rsatdi: hokimiyat joylarni nazorat qilishdan ma'lumotlar va e'tibor oqimlarini nazorat qilishga o'tdi - bu esa uni ko'rinmas va bahslashish qiyin holga keltirdi.", "body": "## E'tibordan chetda qolgan inqilob\n\n1990-yillar o'rtalariga kelib, ispan sotsiologi Manuel Castells hammaning ko'z o'ngida kechayotgan transformatsiyani kuzatdi va ko'pchilik sezmayotgan narsa haqida uch jildli asar yozdi. Axborot inqilobi allaqachon sodir bo'lgan edi. Odamlar uni shunchaki noto'g'ri joydan qidirayotgan edi.\n\nUlar uchar mashinalar va oshxonadagi robotlarni kutishardi. Ular 1960-yillardagi ilmiy-ommabop jurnallar va'da qilgan fantastik kelajakni kutishardi. Inqilob esa banklarning server xonalarida, global korporatsiyalarning logistika markazlarida, qit'alar orasidagi moliyaviy oqimlarda yuz berayotgan edi. 1990-yillarga kelib, pul jismoniy bo'lishdan to'xtagan - u serverlar orasidagi ma'lumotlar oqimiga aylangan edi. Ishlab chiqarish mahalliy bo'lishdan to'xtadi - u dizayn Kaliforniyada qilinadigan, qismlar Xitoyda ishlab chiqariladigan, Vetnamda yig'iladigan va hamma joyda sotiladigan yetkazib beruvchilarning global tarmog'iga aylandi. Hokimiyat hudud bilan o'lchanmay qo'ydi.\n\n## Joylar makoni va oqimlar makoni\n\nCastells zamonaviy dunyoni tushunishga yordam beradigan farqni kiritdi. Eski hokimiyat \"joylar makoni\"ni nazorat qilardi: zavodlar, portlar, chegaralar, hududlar. Egallash, himoya qilish, ushlab turish mumkin bo'lgan jismoniy nuqtalarni. Yangi hokimiyat \"oqimlar makoni\"ni nazorat qiladi: ma'lumotlar, kapital, e'tibor, axborotni.\n\nBular hokimiyatning tubdan boshqa-boshqa turlari. Hududiy hokimiyatni xaritada ko'rish mumkin - mana chegara, mana armiya, mana qal'a. Oqimlar ustidagi hokimiyat ko'rinmas. Google hokimiyati qayerda joylashgan? Hech qayerda va hamma joyda bir vaqtning o'zida. Facebook hokimiyati qayerda joylashgan? Milliardlab odamlar nimani ko'rishini belgilaydigan algoritmda. Bitcoin hokimiyati qayerda joylashgan? Jismoniy joylashuvi yo'q taqsimlangan tarmoqda.\n\nCastells ko'rsatdi: oqimlarni kim boshqarsa, dunyoni o'sha boshqaradi. Va bu kuzatuv qo'rqinchli darajada aniq bo'lib chiqdi. Besh-olti texnologik kompaniya sayyoradagi axborot oqimlarining katta qismini nazorat qiladi. Ular hududlarga egalik qilmaydi. Ular odamlar nimani ko'rishini, o'qishini, sotib olishini va nimaga ishonishini belgilaydigan algoritmlarga egalik qiladi.\n\nDaniel Bell 1973-yildayoq asosiy resurs axborot, asosiy institutlar esa zavodlar emas, universitetlar va tadqiqot laboratoriyalari bo'ladigan postindustrial jamiyatga o'tishni bashorat qilgan edi. Castells 1990-yillarda bu sodir bo'lganini ko'rdi - ammo axborot ustidagi hokimiyat umuman universitetlarda jamlanmagan edi.\n\n> Eski hokimiyat joylarni nazorat qilardi. Yangi hokimiyat oqimlarni nazorat qiladi. Oqimlarga qarshi chiqish esa hududga qarshi chiqishdan ancha qiyin.\n\nButun kurs bo'ylab o'tadigan fundamental savol ham shu: axborot asosiy resurs bo'lgan dunyoda hokimiyat qanday tuzilgan? Uni kim nazorat qiladi? U qanday jamlanadi? Bir nechta korporatsiya sayyoradagi axborot oqimlarining katta qismi ustidan nazoratni qo'lga olganda nima bo'ladi? Keyingi boblar - shu haqida.", "tags": ["oqimlar", "jamiyat", "hokimiyat"], "lensWeight": {"chronology": 4, "power": 5, "technology": 2, "media": 4, "privacy": 3}, "angDeg": 230.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1996"}], "edges": [{"from": "scarcity", "to": "shannon", "label": "tanqislikdan oʼlchashga", "lenses": ["chronology", "technology"]}, {"from": "shannon", "to": "arpanet", "label": "signal tarmoqqa aylanadi", "lenses": ["chronology", "technology"]}, {"from": "memex", "to": "open-web", "label": "gipermatn Webga aylanadi", "lenses": ["chronology", "media", "technology"]}, {"from": "arpanet", "to": "open-web", "label": "barqarorlik va ochiqlik", "lenses": ["chronology", "power", "technology"]}, {"from": "open-web", "to": "atoms-to-bits", "label": "ochiqlik nusxalashni tezlashtiradi", "lenses": ["power", "technology"]}, {"from": "atoms-to-bits", "to": "castells", "label": "iqtisodiyot oqimlarga aylanadi", "lenses": ["power", "media"]}, {"from": "media-effects", "to": "castells", "label": "media tarmoq jamiyatini shakllantiradi", "lenses": ["media", "power"]}, {"from": "arpanet", "to": "cypherpunks", "label": "tarmoq himoyani talab qiladi", "lenses": ["privacy", "technology", "power"]}, {"from": "cypherpunks", "to": "castells", "label": "oqimlar ichidagi maxfiylik", "lenses": ["privacy", "power"]}, {"from": "scarcity", "to": "castells", "label": "kirishni nazorat qilishdan oqimlarni nazorat qilishga", "lenses": ["power"]}]}, "es": {"chapter": {"key": "preinternet", "title": "Antes de internet", "sourceUrl": "https://luminara.tech/#/scene?s=3&c=preinternet", "centralIdea": "La información se convierte en poder", "centerX": 500, "centerY": 445, "ring": 300, "lede": "Cómo la información se convierte en poder: de la escasez y las señales a la sociedad en red."}, "lenses": [{"id": "chronology", "label": "Cronología", "accent": "#7dd3fc", "description": "El orden de los acontecimientos y el paso de la escasez de información a los flujos de datos."}, {"id": "power", "label": "Poder", "accent": "#f87171", "description": "Quién controla la información: instituciones, protocolos, redes o plataformas."}, {"id": "technology", "label": "Tecnologías", "accent": "#34d399", "description": "Inventos y protocolos: señal, hipertexto, paquetes, TCP/IP, Web."}, {"id": "media", "label": "Medios", "accent": "#fbbf24", "description": "Cómo el medio de transmisión cambia la percepción, el comportamiento y la organización social."}, {"id": "privacy", "label": "Privacidad", "accent": "#c084fc", "description": "La criptografía como protección frente a la vigilancia y el control."}], "nodes": [{"id": "scarcity", "sceneIndex": 0, "x": 500.0, "y": 145.0, "type": "power", "title": "La información como escasez", "shortTitle": "Escasez", "thesis": "Antes de internet, la información era físicamente cara, lenta y centralizada.", "insight": "Antes de internet, la información era físicamente cara y centralizada; eso la convirtió en una herramienta de poder para quienes tenían el equipo.", "body": "## Un mundo donde las palabras costaban dinero\n\nLees esto en una pantalla. En algún centro de datos, un servidor te envió este texto en milisegundos, y no te costó nada. Parece algo obvio, como la electricidad o el agua corriente. Pero no siempre fue así. Y entender cómo era \"antes\" no es una curiosidad histórica, sino la clave para entender por qué el internet moderno está construido exactamente de esta manera. Y por qué eso es un problema.\n\nHace apenas setenta años, enviar un mensaje de Kiev a Nueva York costaba dinero, llevaba días y estaba controlado por quienes tenían el equipo: los estados, las empresas de telégrafos, las redacciones de los periódicos. La información era una escasez, exactamente como el petróleo o el grano. Y como cualquier escasez, era poder. Quien controlaba la transmisión de la información controlaba la realidad.\n\nImagina una imprenta de mediados del siglo XX. Máquinas metálicas enormes, tipos de plomo, el olor de la tinta y el aceite. Para llevar una idea a un millón de personas, había que imprimir físicamente un millón de ejemplares de un periódico, cargarlos en camiones y repartirlos por los quioscos de todo el país. Cada copia costaba dinero. Cada kilómetro de reparto costaba dinero. Un error tipográfico en la tirada significaba dinero tirado a la basura y reputación dañada. Era un mecanismo enorme, pesado y lento.\n\nLa radio y la televisión parecían una revolución: la señal viaja a la velocidad de la luz, no hacen falta camiones. Pero tenían una limitación fundamental: un transmisor, millones de receptores. Solo podía hablar quien tenía la torre. El resto de la humanidad escuchaba. No podías levantar el auricular y responder. No podías objetar. No podías añadir tu propia voz.\n\nAsí se veía el mundo de la información antes de internet: centralizado, caro y unidireccional. Unas pocas fuentes emitían para muchos. La información fluía estrictamente de arriba hacia abajo: de quienes tenían el equipo a quienes no lo tenían. No fue una casualidad ni una mala intención; era la realidad física de las tecnologías de aquella época.\n\n> La información no era solo un recurso, era la arquitectura del poder. Quien poseía el canal de transmisión poseía la realidad.\n\nPor eso, las primeras personas que entendieron que esa arquitectura podía cambiar comprendieron algo revolucionario. No solo que \"los datos podían transmitirse más rápido\". Sino que \"la propia estructura del poder sobre la información podía romperse\". Y empezaron a trabajar en ello mucho antes de que apareciera el primer navegador.", "tags": ["poder", "escasez", "medios"], "lensWeight": {"chronology": 5, "power": 5, "technology": 1, "media": 4, "privacy": 1}, "angDeg": -90.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "antes de 1948"}, {"id": "shannon", "sceneIndex": 1, "x": 692.8, "y": 215.2, "type": "technology", "title": "Shannon: la información se volvió física", "shortTitle": "Shannon", "thesis": "La información pudo medirse, codificarse y transmitirse como una magnitud física.", "insight": "Shannon demostró que la información puede medirse y transmitirse como una magnitud física; eso sentó la base matemática de todo el mundo digital.", "body": "## El hombre que midió el pensamiento\n\nEn 1948, el matemático estadounidense Claude Shannon publicó un trabajo con el seco título técnico \"Una teoría matemática de la comunicación\". Poca gente lo leyó entonces. Poca gente lo lee ahora. Pero cambió el mundo más que la mayoría de los libros que todo el mundo lee.\n\nShannon demostró algo que parecía imposible: cualquier mensaje —una palabra, un sonido, una imagen, un número, un olor descrito con palabras— puede medirse con precisión, comprimirse y transmitirse por cualquier canal de comunicación. Llamó a la unidad de medida \"bit\", de binary digit. Cero o uno. Hay señal o no hay señal. Todo el universo de la información son combinaciones de ceros y unos.\n\nAntes de Shannon, la información era algo vago y subjetivo. Algunas palabras eran \"más importantes\" que otras. Algunas imágenes eran \"más significativas\". Algunos mensajes eran \"más ricos\". Después de Shannon, la información se volvió una magnitud física, tan real y medible como la masa o la temperatura. El mundo dejó de dividirse solo en materia y energía. Apareció una tercera cosa: la información. Y esa tercera cosa resultó no ser menos fundamental que las dos primeras.\n\n## Una llama de vela a través del océano\n\nPara entender lo que hizo Shannon, imagina esta tarea: transmitir la llama de una vela de Kiev a Tokio. Puedes llevar la vela misma, pero eso es lento, caro y la llama se apagará en el camino. Eso es transmitir materia, y está limitado por las leyes físicas.\n\nPero puedes describir la llama: su color, altura, temperatura, forma, la composición química de la cera. Enviar esa descripción a la velocidad de la luz por un cable. Y otra persona en Tokio encenderá exactamente la misma llama. Eso es transmitir información, y no conoce límites físicos.\n\nShannon mostró que este segundo método puede hacerse absolutamente preciso, confiable y escalable. Que cualquier señal puede codificarse en bits, transmitirse sin distorsión y reconstruirse al otro lado. Todo el mundo digital se sostiene sobre eso: del correo electrónico al streaming 4K, de las apps de mensajería al blockchain.\n\nCada vez que envías un mensaje en Telegram, Shannon está en acción. Cada vez que una transacción en el blockchain se transmite entre los nodos de la red, Shannon está en acción. Él creó el fundamento matemático sobre el que se construye todo lo digital.\n\n> Shannon no inventó Internet. Demostró que Internet era posible, que la información se puede transmitir con precisión, como una magnitud física.\n\nLa paradoja es que el propio Shannon trabajó en Bell Laboratories, el mayor monopolio telefónico del mundo. Su descubrimiento terminó destruyendo el monopolio de su empleador. Cuando la información puede transmitirse por cualquier canal, significa que ningún canal puede ser monopolio para siempre.", "tags": ["señal", "codificación", "medición"], "lensWeight": {"chronology": 4, "power": 2, "technology": 5, "media": 2, "privacy": 2}, "angDeg": -50.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1948"}, {"id": "memex", "sceneIndex": 2, "x": 795.4, "y": 392.9, "type": "media", "title": "El Memex de Bush: un sueño adelantado a su tiempo", "shortTitle": "Memex", "thesis": "El conocimiento enlazado fue imaginado antes de la Web como una máquina personal de asociaciones.", "insight": "En 1945, Vannevar Bush describió el hipertexto y el conocimiento conectado, 46 años antes de la Web. Las ideas correctas no mueren; esperan a sus tecnologías.", "body": "## Hipertexto cuarenta años antes de Internet\n\nEn 1945, dos años antes de que apareciera la primera computadora plenamente funcional y cuarenta y seis años antes de la World Wide Web, el científico estadounidense Vannevar Bush escribió un ensayo titulado «As We May Think». Se publicó en The Atlantic, no en una revista científica, sino en una publicación masiva para el público general. Bush quería que lo leyera todo el mundo, no solo sus colegas científicos.\n\nDescribió un dispositivo al que llamó «memex», de memory extender, un extensor de memoria. Era una biblioteca personal de todo el conocimiento humano, donde cualquier documento estaba conectado con cualquier otro por su significado. Lees un artículo sobre Napoleón y, con un solo movimiento, pasas al mapa de sus campañas. Del mapa, a las cartas de sus generales. De las cartas, al análisis de su táctica por parte de historiadores militares del siglo XX. No buscas en un catálogo alfabético, no hojeas estantes: sigues la cadena del pensamiento, como sigue el pensamiento mismo.\n\nEso era hipertexto. Cuarenta años antes de que la palabra se acuñara de forma oficial. Cuarenta y seis años antes de que Tim Berners-Lee implementara esa idea en forma de World Wide Web.\n\n## Por qué el sueño quedó guardado en un cajón\n\nBush veía el futuro con total claridad: el conocimiento debía estar conectado, ser accesible para todos y pertenecer a todos. Solo había un problema: la tecnología aún no existía. En 1945, las computadoras ocupaban habitaciones enteras, costaban como aviones y solo podían calcular. No había pantallas, no había ratones, no había redes. Bush describió el dispositivo en términos de microfilmes y palancas mecánicas, porque era todo lo que tenía a mano para establecer una analogía.\n\nSu sueño quedó guardado en un cajón durante casi medio siglo. Pero no fue olvidado. Se leyó, se citó, pasó de mano en mano. Ted Nelson acuñó la palabra «hypertext» en 1965, inspirado directamente por Bush. Douglas Engelbart creó el ratón de computadora y un sistema de documentos hipermediales, también bajo la influencia de Bush.\n\nCuando Tim Berners-Lee escribió su propuesta para crear la Web en CERN en 1989, citó directamente el ensayo de Bush como idea original. Cuarenta y cuatro años después de su publicación, el sueño por fin recibió las herramientas para hacerse realidad.\n\nEsta historia importa no como una curiosidad histórica. Muestra algo fundamental: la idea correcta no muere. Espera su momento. A veces, durante décadas. Hoy vivimos un momento similar: las ideas de una Internet descentralizada, donde los usuarios son dueños de sus datos, existían mucho antes de blockchain. La tecnología simplemente por fin alcanzó la visión.\n\n> Bush describió la World Wide Web cuarenta y seis años antes de su invención. No porque fuera un profeta, sino porque entendió qué quiere la mente humana de las herramientas del conocimiento.\n\nParadójicamente, en 1945 Bush pensaba en los vínculos entre ideas, y al final obtuvimos una Internet donde los vínculos entre personas resultaron más importantes que los vínculos entre ideas. Esa es una diferencia importante, y volveremos a ella en los siguientes capítulos.", "tags": ["hipertexto", "conocimiento", "asociaciones"], "lensWeight": {"chronology": 4, "power": 2, "technology": 4, "media": 5, "privacy": 1}, "angDeg": -10.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%
