BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1945"}, {"id": "arpanet", "sceneIndex": 3, "x": 759.8, "y": 595.0, "type": "technology", "title": "ARPANET: Internet nació del miedo", "shortTitle": "ARPANET", "thesis": "La comunicación se volvió resiliente cuando la red perdió su único punto de fallo.", "insight": "ARPANET se creó como un sistema militar de comunicaciones sin un único punto de falla, y esa arquitectura descentralizada se convirtió en la base de todo Internet.", "body": "## El satélite que cambió la arquitectura del mundo\n\nLa historia de Internet no empieza en Silicon Valley ni en las aulas universitarias. Empieza en el Pentágono, en plena Guerra Fría, en un momento de miedo geopolítico agudo.\n\nEl 4 de octubre de 1957, la Unión Soviética lanzó el primer satélite artificial de la Tierra. Una pequeña esfera de metal de 58 centímetros de diámetro y 83 kilogramos de peso volaba sobre la Tierra y emitía pitidos, y todo el mundo la escuchaba. Para los militares estadounidenses, esto no era solo el triunfo tecnológico de un rival. Era una señal de alarma: el enemigo controla la órbita. Si pueden lanzar un satélite, pueden lanzar un misil con una cabeza nuclear y alcanzar cualquier punto del planeta.\n\nUn año después, Estados Unidos creó DARPA, la Agencia de Proyectos de Investigación Avanzada de Defensa. Su tarea era crear un sistema de comunicaciones militares que no pudiera ser destruido con un solo golpe. Las redes telefónicas tradicionales eran catastróficamente vulnerables: donde hay una central telefónica, hay un punto de falla. Una bomba sobre el Pentágono, y se pierde la comunicación con todo el ejército.\n\n## Una red sin centro, la idea que lo cambió todo\n\nLos ingenieros de DARPA idearon una solución radicalmente distinta. ¿Y si quitamos el centro por completo? Hacer que cada nodo de la red tenga el mismo valor. Si uno falla, el mensaje encuentra automáticamente otra ruta. Como el agua en las tuberías: si una tubería se bloquea, el agua busca un desvío.\n\nA esa idea la llamaron ARPANET. En 1969 funcionó por primera vez: cuatro universidades —UCLA, Stanford, UC Santa Barbara y Utah— intercambiaron datos por una línea telefónica. El primer mensaje que intentaron enviar fue la palabra \"login\". El sistema se cayó después de la letra \"o\". La primera palabra transmitida por el protointernet fue \"lo\", que en inglés significa \"mira\". Poesía accidental.\n\nNadie pensó entonces que eso se convertiría en la base del Internet civil global. Los militares querían una comunicación confiable en caso de guerra nuclear. Crearon algo más grande: una arquitectura en la que el poder, estructuralmente, no puede concentrarse en un solo punto. Una red distribuida es, por naturaleza, resistente a la centralización.\n\nAl menos, así se lo imaginó. La realidad resultó más compleja, y de eso hablaremos en los próximos capítulos.\n\n> Internet se creó como un sistema de comunicaciones militar resistente a un ataque nuclear. Al final, resultó resistente a cualquier centralización del poder, y eso se convirtió en su principal rasgo político.\n\nEn 1974, Vinton Cerf y Robert Kahn resolvieron el siguiente problema: las distintas computadoras hablaban idiomas distintos. La red de Stanford no entendía la red del MIT. Crearon TCP/IP, un protocolo universal, un lenguaje común para transmitir datos entre cualquier red. Los datos se dividen en pequeños paquetes, cada uno encuentra su propio camino, y al otro lado se vuelven a reunir. Como si cortaras una carta en partes, enviaras cada una con un mensajero distinto y aun así se volvieran a ensamblar en el orden correcto para quien la recibe. Ese mismo protocolo sigue siendo la base de Internet hoy, cincuenta años después de su creación.", "tags": ["paquetes", "DARPA", "TCP/IP", "descentralización"], "lensWeight": {"chronology": 5, "power": 5, "technology": 5, "media": 2, "privacy": 3}, "angDeg": 30.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1969"}, {"id": "open-web", "sceneIndex": 4, "x": 602.6, "y": 726.9, "type": "technology", "title": "Berners-Lee: la decisión de regalarlo todo gratis", "shortTitle": "Web abierto", "thesis": "La Web se volvió masiva porque el protocolo base estaba abierto a todos.", "insight": "Berners-Lee entregó Web gratis, no por altruismo, sino porque entendió que solo un protocolo abierto puede volverse global.", "body": "## Una propuesta marcada como \"vaga, pero interesante\"\n\nEn 1989, un joven programador británico llamado Tim Berners-Lee trabajaba en el CERN, el Centro Europeo para la Investigación Nuclear en Ginebra. Es el mayor instituto científico del mundo: miles de científicos de decenas de países trabajan en los mismos experimentos, pero pierden documentos constantemente, olvidan el contexto y pasan meses tratando de entender qué se había hecho antes que ellos.\n\nBerners-Lee escribió una propuesta interna para la dirección. La idea: crear un sistema en el que todos los documentos estuvieran enlazados y fueran accesibles desde cualquier computadora de la red. Su jefe, Mike Sendall, escribió tres palabras en el margen: \"Vaga, pero interesante\". Fue la reseña más modesta de una invención que cambiaría el mundo.\n\nDurante tres años, Berners-Lee creó tres cosas sobre las que se sostiene todo el internet moderno: HTML, el lenguaje de marcado de documentos; HTTP, el protocolo para transmitirlos; y URL, el sistema de direccionamiento. Juntos formaron la World Wide Web. Los documentos se almacenan en servidores, tienen direcciones, están conectados por enlaces y se abren mediante un navegador. Simple, elegante, universal.\n\n## La decisión que definió una época\n\nPero la decisión clave no fue técnica. Fue ética.\n\nBerners-Lee podría haber patentado su invento. Los abogados del CERN se lo propusieron. Si cada sitio hubiera pagado regalías por usar HTTP, Berners-Lee se habría convertido en la persona más rica del planeta. En cambio, insistió en entregar la tecnología a la humanidad gratis, sin restricciones, sin licencias, sin condiciones.\n\n\"Si la Web hubiera sido patentada o hubiera estado bajo el control de una sola empresa, no habría existido\", explicó más tarde. No era altruismo por el altruismo mismo. Era una estrategia: solo sin barreras la red podía crecer hasta una escala global. Solo si cualquiera puede crear un sitio sin permiso, la red se vuelve realmente abierta.\n\nEn 1993, estudiantes del Centro Nacional de Aplicaciones de Supercomputación de EE. UU. lanzaron el navegador Mosaic, el primero que mostraba texto e imágenes juntos en una sola pantalla. Hasta entonces, internet era un mundo de texto. Mosaic lo volvió visual. Y comprensible para una persona común que nunca había aprendido programación.\n\nEse mismo año, el número de sitios web superó los quinientos. Hoy suena gracioso, pero en aquel momento fue una explosión. Dos años después ya eran doscientos mil. La carrera había comenzado.\n\n> Berners-Lee entregó Web gratis y, al hacerlo, lo volvió global. Si lo hubiera patentado, todavía estaríamos pagando regalías por cada enlace.\n\nEsta historia sobre Berners-Lee no es solo un dato biográfico. Es una lección sobre la naturaleza de las redes: los protocolos abiertos crecen más rápido que los cerrados, porque cualquiera puede construir sobre ellos. Por eso la blockchain Ethereum es abierta. Por eso TON es un protocolo abierto. En 1991, Berners-Lee sentó un principio que todavía determina qué tecnologías ganan.", "tags": ["Web", "protocolo", "apertura"], "lensWeight": {"chronology": 5, "power": 4, "technology": 5, "media": 4, "privacy": 2}, "angDeg": 70.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1991"}, {"id": "atoms-to-bits", "sceneIndex": 5, "x": 397.4, "y": 726.9, "type": "economy", "title": "De los átomos a los bits: un cambio en la lógica económica", "shortTitle": "Átomos → bits", "thesis": "El valor empezó a moverse como información: copiable, instantáneo y casi gratuito.", "insight": "El paso \"de los átomos a los bits\" no es solo tecnología; es un cambio de lógica económica, de la escala de lo mismo a la singularidad de cada interacción.", "body": "## Toffler lo vio en 1980\n\nCuando Alvin Toffler publicó El tercer ola en 1980, las computadoras personales casi no existían. No había internet. No había teléfonos móviles. Y aun así describió una transformación económica que solo se desplegaría por completo cuarenta años después.\n\nToffler describió tres eras de la civilización humana. La primera ola fue agraria: la tierra y la cosecha como valor principal. La segunda ola fue industrial: la línea de montaje, la estandarización, la producción en masa. Una fábrica produce mil refrigeradores idénticos, y eso es eficiente precisamente porque son idénticos. Cuantas más unidades de producto, menor es el costo de cada una. La escala es la victoria de la economía industrial.\n\nLa tercera ola es informacional. Y aquí la lógica se invierte por completo. En la economía de la información, copiar es gratis. Un programa puede comportarse de manera distinta con mil millones de usuarios al mismo tiempo, y eso no es un error, sino su principal ventaja. El valor no se crea replicando lo mismo, sino a partir de la singularidad de cada interacción.\n\n## Nicholas Negroponte y la fórmula más simple\n\nEn 1995, el director del MIT Media Lab, Nicholas Negroponte, lo resumió en una frase que se volvió célebre: \"de los átomos a los bits\".\n\nLos átomos son el mundo físico. Para producir un refrigerador, necesitas metal, plástico, electrónica, mano de obra y una fábrica. Para entregarlo al comprador, necesitas un camión, un almacén y una tienda. Cada copia cuesta dinero. La tirada está limitada por los recursos. Si quieres vender un millón de refrigeradores, necesitas producir un millón de refrigeradores.\n\nLos bits son el mundo digital. Para crear un programa, necesitas un desarrollador y una computadora. Para entregarlo a mil millones de usuarios, necesitas un servidor y una conexión a internet. Copiar es prácticamente gratis. La entrega es instantánea. La tirada es infinita. Si quieres vender mil millones de copias de un programa, no necesitas fabricar mil millones de programas. Una copia se replica mil millones de veces.\n\nEsto no es solo una diferencia tecnológica. Es un cambio de lógica económica fundamental. Toda la economía del siglo XX se construyó sobre la lógica de los átomos: escasez, escala, estandarización. La economía del siglo XXI se construye sobre la lógica de los bits: abundancia, personalización, efectos de red.\n\n> La economía industrial ganaba dinero con la escala de lo mismo. La economía de la información gana dinero con la singularidad de cada interacción. Son lógicas opuestas.\n\nCuando entiendes esta diferencia, muchas cosas del mundo actual empiezan a tener sentido. ¿Por qué Google es gratis? Porque copiar los resultados de búsqueda no cuesta nada, y la monetización llega a través de la publicidad. ¿Por qué Spotify les paga tan poco a los músicos? Porque el costo marginal de un stream tiende a cero. ¿Por qué las criptomonedas son posibles en absoluto? Porque los activos digitales pueden transferirse sin un soporte físico. Todo esto son consecuencias de un mismo principio que Negroponte formuló en tres palabras.", "tags": ["economía", "bits", "escala"], "lensWeight": {"chronology": 4, "power": 4, "technology": 3, "media": 3, "privacy": 1}, "angDeg": 110.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1995"}, {"id": "media-effects", "sceneIndex": 6, "x": 240.2, "y": 595.0, "type": "media", "title": "McLuhan y los virus de Rushkoff: los medios nos cambian", "shortTitle": "Medios", "thesis": "No solo importa la información, sino también el medio que reconfigura el comportamiento.", "insight": "McLuhan y Rushkoff entendieron que lo importante no es la información, sino el entorno por el que se transmite. Los medios nos cambian al margen del contenido, a través de una estructura que no vemos.", "body": "## El medio importa más que el mensaje\n\nMarshall McLuhan era un pensador incómodo. En 1964 escribió una frase que primero se tomó por absurdo, luego por metáfora y solo más tarde se entendió como una descripción técnica precisa de la realidad: «El medio es el mensaje».\n\n¿Qué quería decir? Cuando en los años 50 apareció la televisión masiva, todos discutían sobre el contenido: programas buenos o malos, educativos o de entretenimiento, propaganda o arte. McLuhan dijo: esa es una pregunta secundaria. La televisión misma -como entorno, como tecnología, como forma de percepción- ya había cambiado la sociedad, sin importar qué se mostrara exactamente.\n\nLa televisión sincronizó por primera vez en la historia a millones de personas: las mismas noticias al mismo tiempo y con las mismas palabras, en todos los hogares del país a la vez. Creó lo que McLuhan llamó la «aldea global»: un mundo en el que todos viven al mismo tiempo el mismo acontecimiento. Antes de la televisión, las personas de distintas ciudades vivían en realidades informativas distintas. Después, en una sola.\n\n## La metáfora biológica de Rushkoff\n\nEn 1994, el teórico de medios estadounidense Douglas Rushkoff añadió a la idea de McLuhan una metáfora biológica, y resultó ser aún más precisa. En el libro *Media Virus!*, describió el mecanismo que hoy se llama contenido viral, diez años antes de YouTube y veinte antes de TikTok.\n\nLas ideas se propagan como virus. No porque sean verdaderas. No porque sean útiles. Sino porque encuentran una vulnerabilidad psicológica en la audiencia: lo que hace que la gente las siga pasando adelante: miedo, indignación, entusiasmo, reconocimiento, ira, ternura. La emoción es el mecanismo de replicación de una idea.\n\nRushkoff mostró que el contenido que provoca una emoción intensa se difunde independientemente de si es verdadero o útil. Una noticia escandalosa se esparce más rápido que una verdadera. Una historia aterradora se difunde más rápido que una aburrida. Esto no es casualidad ni manipulación: es una característica arquitectónica del entorno mediático. Un virus no elige a su huésped según si es buena o mala persona. Lo elige según si es vulnerable o no.\n\nMucho antes de los algoritmos de TikTok, optimizados precisamente para eso, Rushkoff describió el principio sobre el que están construidos. El algoritmo no creó la viralidad. Solo aprendió a amplificarla.\n\n> McLuhan advirtió: lo que importa no es el programa, sino el televisor. Rushkoff aclaró: lo que importa no es la idea, sino la emoción que provoca. Juntos describieron la arquitectura de las redes sociales modernas treinta años antes de que aparecieran.\n\nCuando apareció internet, la primera pregunta volvió a ser sobre el contenido: ¿qué leería y vería la gente allí? McLuhan habría dicho: pregunta equivocada. La correcta es: ¿qué le hace al ser humano el entorno mismo en el que pasa cada vez más tiempo? Esa pregunta se volvió crítica cuando aparecieron las redes sociales. Por desgracia, se hizo demasiado tarde.", "tags": ["medios", "comportamiento", "percepción"], "lensWeight": {"chronology": 3, "power": 3, "technology": 1, "media": 5, "privacy": 2}, "angDeg": 150.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1964→años 1990"}, {"id": "cypherpunks", "sceneIndex": 7, "x": 204.6, "y": 392.9, "type": "privacy", "title": "Hughes y los cypherpunks: la privacidad es matemática", "shortTitle": "Cypherpunks", "thesis": "La privacidad en el entorno digital requiere criptografía, no promesas institucionales.", "insight": "En 1993, Hughes predijo la crisis de la privacidad y exigió protección matemática; su manifiesto se convirtió en la base ideológica de Bitcoin y de todo Web3.", "body": "## La voz que advirtió antes\n\nEn 1993, cuando la mayoría escuchaba por primera vez la palabra \"internet\", el matemático y criptógrafo Eric Hughes escribió un documento de tres páginas. Se titulaba \"A Cypherpunk's Manifesto\" y se publicó en la lista de correo de una pequeña comunidad de personas que trabajaban en criptografía y pensaban en las consecuencias de la aparición de una red pública.\n\nEn ese momento, internet apenas empezaba a estar disponible para la gente común. Apenas habían aparecido los primeros navegadores. Nadie pensaba todavía en la privacidad en línea - la gente simplemente celebraba las nuevas posibilidades: ¡podías escribirle a personas al otro lado del planeta! ¡Podías leer noticias en tiempo real! ¡Podías encontrar cualquier información!\n\nHughes pensaba distinto. Su argumento era simple e irrefutable: un internet abierto significa que cada una de tus acciones en línea es potencialmente visible para todos - proveedores, gobiernos, corporaciones. No es una vulnerabilidad accidental. Es una característica arquitectónica de un sistema que, con intención o no, fue construido justamente así. Y la única forma de proteger la privacidad en estas condiciones no es pedir permiso a proveedores y gobiernos, sino usar matemáticas. Criptografía. Matemáticas que ninguna ley puede romper.\n\n## Una profecía que se cumplió literalmente\n\nHughes escribió en 1993: \"La privacidad en una sociedad abierta requiere sistemas de transacciones anónimas.\" Sonaba a ciencia ficción. La mayoría de los lectores se encogía de hombros: \"No tengo nada que ocultar\". ¿Para qué necesitaría transacciones anónimas una persona común?\n\nTreinta años después, vivimos en un mundo donde las corporaciones saben más sobre los usuarios que sus seres queridos. Donde las filtraciones de datos se han vuelto noticia diaria. Donde cada compra con tarjeta, cada búsqueda, cada movimiento con el teléfono encendido queda registrado y almacenado. Hughes no era paranoico. Simplemente pensaba varios pasos adelante.\n\nLos cypherpunks - una pequeña comunidad que se reunió en torno a esta idea a principios de los años noventa - terminaron sentando las bases ideológicas de Bitcoin. En 2008, Satoshi Nakamoto publicó la descripción de Bitcoin precisamente en la lista de correo de los cypherpunks. Fue una respuesta directa a la pregunta de Hughes: aquí está tu sistema de transacciones anónimas, construido sobre matemáticas y no sobre la confianza en un intermediario.\n\nStewart Brand pronunció en 1984 la frase que se volvió un manifiesto de internet abierto: \"La información quiere ser libre\". Se refería a la naturaleza de la información: no disminuye cuando se copia, así que las barreras artificiales contradicen su naturaleza. Hughes completó la idea desde el otro lado: la libertad de la información sin privacidad no es libertad, sino transparencia para quienes observan.\n\n> Brand dijo: la información quiere ser libre. Hughes respondió: y la privacidad quiere ser protegida por las matemáticas. Juntos describieron los dos polos de la libertad digital.\n\nEstos dos principios - la apertura y la privacidad - en cierto sentido se contradicen. Y la tensión entre ambos sigue definiendo las grandes discusiones sobre cómo debería ser internet. ¿Cómo hacer que el conocimiento sea accesible para todos y, al mismo tiempo, proteger los datos personales de cada persona? Esa pregunta todavía no tiene respuesta. Y eso es precisamente lo que Web3 intenta resolver.", "tags": ["criptografía", "privacidad", "vigilancia"], "lensWeight": {"chronology": 3, "power": 4, "technology": 4, "media": 2, "privacy": 5}, "angDeg": 190.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1993"}, {"id": "castells", "sceneIndex": 8, "x": 307.2, "y": 215.2, "type": "power", "title": "Castells: el poder se desplazó a los flujos", "shortTitle": "Flujos", "thesis": "El poder pasó del control de los lugares al control de los flujos de datos.", "insight": "Castells mostró que el poder pasó del control de los lugares al control de los flujos de datos y atención, y eso lo volvió invisible y difícil de cuestionar.", "body": "## La revolución que nadie notó\n\nA mediados de los años 1990, el sociólogo español Manuel Castells observaba una transformación que ocurría a la vista de todos y escribió una obra en tres tomos sobre lo que la mayoría no estaba notando. La revolución de la información ya había ocurrido. Solo que la gente la buscaba en el lugar equivocado.\n\nEsperaban autos voladores y robots en la cocina. Esperaban el futuro fantástico prometido por las revistas de divulgación de los años 1960. Pero la revolución estaba ocurriendo en los centros de servidores de los bancos, en los centros logísticos de las corporaciones globales, en los flujos financieros entre continentes. Para los años 1990, el dinero ya había dejado de ser físico: se había convertido en flujos de datos entre servidores. La producción había dejado de ser local: se había convertido en una red global de proveedores, donde el diseño se hace en California, las piezas se fabrican en China, el ensamblaje ocurre en Vietnam y las ventas ocurren en todas partes. El poder ya no se medía por territorio.\n\n## El espacio de los lugares frente al espacio de los flujos\n\nCastells introdujo una distinción que ayuda a entender el mundo moderno. El poder antiguo controlaba el \"espacio de los lugares\": fábricas, puertos, fronteras, territorios. Puntos físicos que se pueden ocupar, defender y mantener. El poder nuevo controla el \"espacio de los flujos\": datos, capital, atención, información.\n\nSon tipos de poder profundamente distintos. El poder territorial se puede ver en un mapa: aquí está la frontera, aquí está el ejército, aquí está el castillo. El poder sobre los flujos es invisible. ¿Dónde está el poder de Google? En ninguna parte y en todas a la vez. ¿Dónde está el poder de Facebook? En el algoritmo que determina lo que ven miles de millones de personas. ¿Dónde está el poder de Bitcoin? En una red distribuida que no tiene ubicación física.\n\nCastells mostró: quien controla los flujos controla el mundo. Y esa observación resultó alarmantemente precisa. Cinco o seis empresas tecnológicas controlan la mayor parte de los flujos de información del planeta. No poseen territorios. Poseen algoritmos que determinan lo que la gente ve, lee, compra y en qué cree.\n\nDaniel Bell ya había predicho en 1973 la transición a una sociedad posindustrial, donde el recurso principal es la información y las instituciones principales no son las fábricas, sino las universidades y los laboratorios de investigación. Castells vio en los años 1990 que eso había ocurrido, pero el poder sobre la información se había concentrado en un lugar muy distinto de las universidades.\n\n> El poder antiguo controlaba los lugares. El poder nuevo controla los flujos. Y los flujos son mucho más difíciles de impugnar que el territorio.\n\nEsta es la pregunta fundamental que atraviesa todo el curso: ¿cómo se organiza el poder en un mundo donde la información es el recurso principal? ¿Quién lo controla? ¿Cómo se concentra? ¿Y qué ocurre cuando unas pocas corporaciones se hacen con el control de la mayor parte de los flujos de información del planeta? Los capítulos siguientes tratan de eso.", "tags": ["flujos", "sociedad", "poder"], "lensWeight": {"chronology": 4, "power": 5, "technology": 2, "media": 4, "privacy": 3}, "angDeg": 230.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1996"}], "edges": [{"from": "scarcity", "to": "shannon", "label": "de la escasez a la medición", "lenses": ["chronology", "technology"]}, {"from": "shannon", "to": "arpanet", "label": "la señal se convierte en red", "lenses": ["chronology", "technology"]}, {"from": "memex", "to": "open-web", "label": "el hipertexto se convierte en Web", "lenses": ["chronology", "media", "technology"]}, {"from": "arpanet", "to": "open-web", "label": "resiliencia más apertura", "lenses": ["chronology", "power", "technology"]}, {"from": "open-web", "to": "atoms-to-bits", "label": "la apertura acelera la copia", "lenses": ["power", "technology"]}, {"from": "atoms-to-bits", "to": "castells", "label": "la economía se convierte en flujos", "lenses": ["power", "media"]}, {"from": "media-effects", "to": "castells", "label": "los medios forman la sociedad en red", "lenses": ["media", "power"]}, {"from": "arpanet", "to": "cypherpunks", "label": "la red exige protección", "lenses": ["privacy", "technology", "power"]}, {"from": "cypherpunks", "to": "castells", "label": "privacidad dentro de los flujos", "lenses": ["privacy", "power"]}, {"from": "scarcity", "to": "castells", "label": "del control del acceso al control de los flujos", "lenses": ["power"]}]}, "fr": {"chapter": {"key": "preinternet", "title": "Avant internet", "sourceUrl": "https://luminara.tech/#/scene?s=3&c=preinternet", "centralIdea": "L’information devient pouvoir", "centerX": 500, "centerY": 445, "ring": 300, "lede": "Comment l’information devient pouvoir : de la rareté et des signaux à la société en réseau."}, "lenses": [{"id": "chronology", "label": "Chronologie", "accent": "#7dd3fc", "description": "L’ordre des événements et le passage de la rareté de l’information aux flux de données."}, {"id": "power", "label": "Pouvoir", "accent": "#f87171", "description": "Qui contrôle l’information : institutions, protocoles, réseaux ou plateformes."}, {"id": "technology", "label": "Technologies", "accent": "#34d399", "description": "Inventions et protocoles : signal, hypertexte, paquets, TCP/IP, Web."}, {"id": "media", "label": "Médias", "accent": "#fbbf24", "description": "Comment le média de transmission change la perception, le comportement et l’organisation sociale."}, {"id": "privacy", "label": "Vie privée", "accent": "#c084fc", "description": "La cryptographie comme protection contre la surveillance et le contrôle."}], "nodes": [{"id": "scarcity", "sceneIndex": 0, "x": 500.0, "y": 145.0, "type": "power", "title": "L'information comme rareté", "shortTitle": "Rareté", "thesis": "Avant internet, l’information était physiquement coûteuse, lente et centralisée.", "insight": "Avant internet, l'information était physiquement coûteuse et centralisée; cela en faisait un outil de pouvoir pour ceux qui possédaient l'équipement.", "body": "## Un monde où les mots coûtaient de l'argent\n\nTu lis ceci sur un écran. Quelque part dans un centre de données, un serveur t'a envoyé ce texte en quelques millisecondes, et cela ne t'a rien coûté. Cela semble aller de soi, comme l'électricité ou l'eau courante. Mais cela n'a pas toujours été le cas. Et comprendre comment c'était « avant » n'est pas une simple curiosité historique, c'est la clé pour comprendre pourquoi l'internet moderne est construit exactement ainsi. Et pourquoi c'est un problème.\n\nIl y a seulement soixante-dix ans, envoyer un message de Kyiv à New York coûtait de l'argent, prenait des jours et était contrôlé par ceux qui possédaient le matériel: les États, les entreprises de télégraphe, les rédactions de journaux. L'information était une rareté, exactement comme le pétrole ou les céréales. Et comme toute rareté, c'était du pouvoir. Celui qui contrôlait la transmission de l'information contrôlait la réalité.\n\nImagine une imprimerie du milieu du XXe siècle. D'énormes machines métalliques, des caractères en plomb, l'odeur de l'encre et de l'huile. Pour faire parvenir une idée à un million de personnes, il fallait imprimer physiquement un million d'exemplaires d'un journal, les charger dans des camions et les distribuer aux kiosques dans tout le pays. Chaque exemplaire coûtait de l'argent. Chaque kilomètre de livraison coûtait de l'argent. Une faute de frappe dans le tirage, et c'était de l'argent jeté par la fenêtre, une réputation abîmée. C'était un mécanisme immense, lourd et lent.\n\nLa radio et la télévision semblaient être une révolution: le signal se propage à la vitesse de la lumière, pas besoin de camions. Mais elles avaient une limite fondamentale: un émetteur, des millions de récepteurs. Seule la personne qui avait la tour pouvait parler. Le reste de l'humanité écoutait. Impossible de décrocher et de répondre. Impossible de contester. Impossible d'ajouter sa propre voix.\n\nVoilà à quoi ressemblait le monde de l'information avant internet: centralisé, coûteux, à sens unique. Quelques sources diffusaient vers beaucoup. L'information coulait strictement de haut en bas, de ceux qui avaient l'équipement vers ceux qui n'en avaient pas. Ce n'était ni un hasard ni une intention malveillante: c'était la réalité physique des technologies de l'époque.\n\n> L'information n'était pas seulement une ressource, c'était l'architecture du pouvoir. Celui qui possédait le canal de transmission possédait la réalité.\n\nC'est précisément pour cela que les premières personnes qui ont compris qu'on pouvait changer cette architecture ont saisi quelque chose de révolutionnaire. Pas seulement que « les données pouvaient être transmises plus vite ». Mais que « la structure même du pouvoir sur l'information pouvait être brisée ». Et elles ont commencé à y travailler bien avant l'apparition du premier navigateur.", "tags": ["pouvoir", "rareté", "médias"], "lensWeight": {"chronology": 5, "power": 5, "technology": 1, "media": 4, "privacy": 1}, "angDeg": -90.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "avant 1948"}, {"id": "shannon", "sceneIndex": 1, "x": 692.8, "y": 215.2, "type": "technology", "title": "Shannon : l'information est devenue physique", "shortTitle": "Shannon", "thesis": "L’information a pu être mesurée, codée et transmise comme une grandeur physique.", "insight": "Shannon a montré que l'information peut être mesurée et transmise comme une grandeur physique; cela a posé la base mathématique de tout le monde numérique.", "body": "## L'homme qui a mesuré la pensée\n\nEn 1948, le mathématicien américain Claude Shannon publia un article au titre technique et austère, \"A Mathematical Theory of Communication\". Peu de gens l'ont lu à l'époque. Peu de gens le lisent encore aujourd'hui. Pourtant, il a changé le monde plus que la plupart des livres lus par tout le monde.\n\nShannon a démontré quelque chose qui semblait impossible : n'importe quel message — un mot, un son, une image, un nombre, une odeur décrite avec des mots — peut être mesuré avec précision, compressé et transmis par n'importe quel canal de communication. Il a appelé l'unité de mesure \"bit\", de binary digit. Zéro ou un. Il y a un signal ou il n'y en a pas. Tout l'univers de l'information n'est qu'une combinaison de zéros et de uns.\n\nAvant Shannon, l'information était quelque chose de flou et de subjectif. Certains mots étaient \"plus importants\" que d'autres. Certaines images étaient \"plus parlantes\". Certains messages étaient \"plus riches\". Après Shannon, l'information est devenue une grandeur physique, aussi réelle et mesurable que la masse ou la température. Le monde a cessé de se diviser uniquement entre la matière et l'énergie. Une troisième chose est apparue: l'information. Et cette troisième chose s'est révélée tout aussi fondamentale que les deux premières.\n\n## Une flamme de bougie à travers l'océan\n\nPour comprendre ce que Shannon a fait, imagine cette tâche: transmettre la flamme d'une bougie de Kyiv à Tokyo. Tu peux transporter la bougie elle-même, mais c'est lent, coûteux, et la flamme s'éteindra en route. C'est le transfert de matière, et il est limité par les lois physiques.\n\nMais tu peux décrire la flamme: sa couleur, sa hauteur, sa température, sa forme, la composition chimique de la cire. Envoyer cette description à la vitesse de la lumière par un fil. Et une autre personne à Tokyo allumera exactement la même flamme. C'est le transfert d'information, et il ne connaît pas de limites physiques.\n\nShannon a montré que cette seconde méthode pouvait être rendue absolument précise, fiable et évolutive. Que tout signal peut être encodé en bits, transmis sans distorsion puis reconstruit de l'autre côté. Tout le monde numérique repose là-dessus: du courrier électronique au streaming 4K, des applications de messagerie à la blockchain.\n\nChaque fois que tu envoies un message sur Telegram, Shannon est à l'œuvre. Chaque fois qu'une transaction sur la blockchain est transmise entre les nœuds du réseau, Shannon est à l'œuvre. Il a créé le fondement mathématique sur lequel repose tout le numérique.\n\n> Shannon n'a pas inventé Internet. Il a prouvé qu'Internet était possible, que l'information peut être transmise avec précision, comme une grandeur physique.\n\nLe paradoxe, c'est que Shannon lui-même a travaillé chez Bell Laboratories, le plus grand monopole téléphonique du monde. Sa découverte a fini par détruire le monopole de son employeur. Lorsque l'information peut être transmise par n'importe quel canal, cela signifie qu'aucun canal ne peut rester éternellement un monopole.", "tags": ["signal", "codage", "mesure"], "lensWeight": {"chronology": 4, "power": 2, "technology": 5, "media": 2, "privacy": 2}, "angDeg": -50.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1948"}, {"id": "memex", "sceneIndex": 2, "x": 795.4, "y": 392.9, "type": "media", "title": "Le Memex de Bush: un rêve en avance sur son temps", "shortTitle": "Memex", "thesis": "Le savoir relié a été imaginé avant le Web comme une machine personnelle d’associations.", "insight": "En 1945, Vannevar Bush a décrit l'hypertexte et les connaissances reliées, 46 ans avant le Web. Les bonnes idées ne meurent pas; elles attendent leurs technologies.", "body": "## L’hypertexte quarante ans avant Internet\n\nEn 1945, deux ans avant l’apparition du premier ordinateur pleinement opérationnel et quarante-six ans avant le World Wide Web, le scientifique américain Vannevar Bush rédigea un essai intitulé « As We May Think ». Il fut publié dans The Atlantic, non pas dans une revue scientifique, mais dans un magazine grand public destiné à un large lectorat. Bush voulait être lu par tout le monde, et pas seulement par ses collègues scientifiques.\n\nIl décrivit un appareil qu’il appela « memex », de memory extender, un prolongateur de mémoire. C’était une bibliothèque personnelle de tout le savoir humain, où n’importe quel document est relié à n’importe quel autre par le sens. Vous lisez un article sur Napoléon, et d’un seul geste vous passez à la carte de ses campagnes. De la carte, aux lettres de ses généraux. Des lettres, à l’analyse de sa tactique par des historiens militaires du XXe siècle. Vous ne cherchez pas dans un catalogue alphabétique, vous ne feuilletez pas des rayonnages: vous suivez la chaîne de la pensée, comme la pensée elle-même.\n\nC’était de l’hypertexte. Quarante ans avant que le mot ne soit officiellement inventé. Quarante-six ans avant que Tim Berners-Lee ne mette cette idée en œuvre sous la forme du World Wide Web.\n\n## Pourquoi le rêve est resté dans un tiroir\n\nBush voyait l’avenir avec une clarté totale: le savoir devait être relié, accessible à tous et appartenir à tous. Un seul problème subsistait: les technologies n’existaient pas encore. En 1945, les ordinateurs occupaient des pièces entières, coûtaient autant que des avions et ne savaient que calculer. Pas d’écrans, pas de souris, pas de réseaux. Bush décrivit l’appareil en termes de microfilms et de leviers mécaniques, parce que c’était tout ce qu’il avait sous la main pour faire une analogie.\n\nSon rêve resta dans un tiroir pendant près d’un demi-siècle. Mais il ne fut pas oublié. On le lut, on le cita, on le transmit de main en main. Ted Nelson forgea en 1965 le mot « hypertext », directement inspiré par Bush. Douglas Engelbart créa la souris d’ordinateur et un système de documents hypertextuels, lui aussi sous l’influence de Bush.\n\nLorsque Tim Berners-Lee rédigea en 1989 sa proposition pour créer le Web au CERN, il renvoya directement à l’essai de Bush comme idée d’origine. Quarante-quatre ans après sa publication, le rêve reçut enfin les outils nécessaires à sa réalisation.\n\nCette histoire n’a d’importance non comme curiosité historique. Elle montre quelque chose de fondamental: la bonne idée ne meurt pas. Elle attend son moment. Parfois pendant des décennies. Aujourd’hui, nous vivons un moment similaire: les idées d’un internet décentralisé, où les utilisateurs possèdent leurs données, existaient bien avant la blockchain. Les technologies ont simplement fini par rattraper la vision.\n\n> Bush a décrit le World Wide Web quarante-six ans avant son invention. Non pas parce qu’il était un prophète, mais parce qu’il avait compris ce que l’esprit humain attend des outils de connaissance.\n\nParadoxalement, en 1945, Bush pensait aux liens entre les idées, alors qu’au final nous avons obtenu un internet où les liens entre les personnes se sont révélés plus importants que les liens entre les idées. C’est une différence importante, et nous y reviendrons dans les chapitres suivants.", "tags": ["hypertexte", "connaissance", "associations"], "lensWeight": {"chronology": 4, "power": 2, "technology": 4, "media": 5, "privacy": 1}, "angDeg": -10.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1945"}, {"id": "arpanet", "sceneIndex": 3, "x": 759.8, "y": 595.0, "type": "technology", "title": "ARPANET : Internet est né de la peur", "shortTitle": "ARPANET", "thesis": "La communication est devenue résiliente quand le réseau a perdu son point unique de défaillance.", "insight": "ARPANET a été créé comme un système de communication militaire sans point de défaillance unique, et cette architecture décentralisée est devenue le fondement de tout Internet.", "body": "## Le satellite qui a changé l'architecture du monde\n\nL'histoire d'Internet ne commence ni dans la Silicon Valley ni dans les amphithéâtres universitaires. Elle commence au Pentagone, en pleine guerre froide, dans un moment de peur géopolitique aiguë.\n\nLe 4 octobre 1957, l'Union soviétique a lancé le premier satellite artificiel de la Terre. Une petite sphère métallique de 58 centimètres de diamètre, pesant 83 kilos, survolait la Terre en émettant des bips, et le monde entier l'entendait. Pour les militaires américains, ce n'était pas seulement le triomphe technologique d'un rival. C'était un signal d'alarme: l'ennemi contrôle l'orbite. S'ils peuvent lancer un satellite, ils peuvent lancer un missile à tête nucléaire et atteindre n'importe quel point de la planète.\n\nUn an plus tard, les États-Unis ont créé DARPA, la Defense Advanced Research Projects Agency. Sa mission était de créer un système de communication militaire impossible à détruire d'un seul coup. Les réseaux téléphoniques traditionnels étaient catastrophiquement vulnérables: là où il y a un central téléphonique, il y a un point de défaillance. Une bombe sur le Pentagone, et la communication avec toute l'armée est perdue.\n\n## Un réseau sans centre, l'idée qui a tout changé\n\nLes ingénieurs de DARPA ont imaginé une solution radicalement différente. Et si on supprimait complètement le centre? Faire de chaque nœud du réseau un élément égal. Si l'un tombe en panne, le message trouve automatiquement un autre chemin. Comme l'eau dans des tuyaux: si un tuyau est bouché, l'eau trouve un détour.\n\nIls ont appelé cette idée ARPANET. En 1969, elle a fonctionné pour la première fois: quatre universités, UCLA, Stanford, UC Santa Barbara et Utah, ont échangé des données par une ligne téléphonique. Le premier message qu'ils ont essayé d'envoyer était le mot \"login\". Le système a planté après la lettre \"o\". Le premier mot transmis sur le proto-Internet était \"lo\", ce qui en anglais signifie \"regarde\". Une poésie accidentelle.\n\nPersonne n'imaginait alors que cela deviendrait le socle de l'Internet civil mondial. Les militaires voulaient une communication fiable en cas de guerre nucléaire. Ils ont créé quelque chose de plus vaste: une architecture dans laquelle le pouvoir ne peut pas, structurellement, se concentrer en un seul point. Un réseau distribué est, par nature, résistant à la centralisation.\n\nDu moins, c'était l'idée. La réalité s'est révélée plus complexe, et nous en parlerons dans les chapitres suivants.\n\n> Internet a été créé comme un système de communication militaire résistant à une frappe nucléaire. Au final, il s'est révélé résistant à toute centralisation du pouvoir, et c'est devenu sa principale propriété politique.\n\nEn 1974, Vinton Cerf et Robert Kahn ont résolu le problème suivant: différents ordinateurs parlaient différentes langues. Le réseau de Stanford ne comprenait pas celui du MIT. Ils ont créé TCP/IP, un protocole universel, un langage commun pour transmettre des données entre n'importe quels réseaux. Les données sont découpées en petits paquets, chacun trouve son propre chemin, et à l'autre bout, elles sont réassemblées. Comme si tu découpais une lettre en morceaux, envoyais chaque morceau avec un coursier différent, et qu'ils se réassemblaient quand même dans le bon ordre chez le destinataire. Ce même protocole reste aujourd'hui le fondement d'Internet, cinquante ans après sa création.", "tags": ["paquets", "DARPA", "TCP/IP", "décentralisation"], "lensWeight": {"chronology": 5, "power": 5, "technology": 5, "media": 2, "privacy": 3}, "angDeg": 30.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1969"}, {"id": "open-web", "sceneIndex": 4, "x": 602.6, "y": 726.9, "type": "technology", "title": "Berners-Lee: la décision de tout offrir gratuitement", "shortTitle": "Web ouvert", "thesis": "Le Web est devenu massif parce que son protocole de base était ouvert à tous.", "insight": "Berners-Lee a offert le Web gratuitement, non par altruisme, mais parce qu'il a compris qu'un protocole ouvert est le seul qui puisse devenir mondial.", "body": "## Une proposition marquée \"vague, mais excitante\"\n\nEn 1989, un jeune programmeur britannique nommé Tim Berners-Lee travaillait au CERN, l'Organisation européenne pour la recherche nucléaire à Genève. C'est le plus grand institut scientifique du monde: des milliers de scientifiques venus de dizaines de pays travaillent sur les mêmes expériences, mais perdent sans cesse des documents, oublient le contexte, et passent des mois à essayer de comprendre ce qui avait déjà été fait avant eux.\n\nBerners-Lee a rédigé une proposition interne pour la direction. L'idée: créer un système dans lequel tous les documents seraient reliés par des liens et accessibles depuis n'importe quel ordinateur du réseau. Son supérieur, Mike Sendall, a écrit trois mots dans la marge: \"Vague, mais excitant\". C'était la critique la plus modeste jamais faite à une invention qui allait changer le monde.\n\nEn trois ans, Berners-Lee a créé trois éléments sur lesquels repose tout l'internet moderne: HTML, le langage de balisage des documents; HTTP, le protocole de leur transfert; et URL, le système d'adressage. Ensemble, ils ont formé le World Wide Web. Les documents sont stockés sur des serveurs, ont des adresses, sont reliés par des liens et s'ouvrent via un navigateur. Simple, élégant, universel.\n\n## La décision qui a défini une époque\n\nMais la décision clé n'était pas technique. Elle était éthique.\n\nBerners-Lee aurait pu breveter son invention. Les juristes du CERN le lui ont proposé. Si chaque site avait payé des redevances pour utiliser HTTP, Berners-Lee serait devenu l'homme le plus riche de la planète. À la place, il a insisté pour offrir la technologie à l'humanité gratuitement, sans restrictions, sans licences, sans conditions.\n\n\"Si le Web avait été breveté ou placé sous le contrôle d'une seule entreprise, il n'aurait pas existé\", expliqua-t-il plus tard. Ce n'était pas de l'altruisme pour l'altruisme lui-même. C'était une stratégie: sans barrières seulement, le réseau pouvait atteindre une échelle mondiale. Ce n'est que si chacun peut créer un site sans autorisation que le réseau devient vraiment ouvert.\n\nEn 1993, des étudiants du Centre national pour les applications de supercalcul des États-Unis ont lancé le navigateur Mosaic, le premier à afficher du texte et des images ensemble sur un seul écran. Jusqu'alors, internet était un monde de texte. Mosaic l'a rendu visuel. Et compréhensible pour une personne ordinaire qui n'avait jamais appris la programmation.\n\nLa même année, le nombre de sites web a dépassé les cinq cents. Aujourd'hui cela paraît drôle, mais à l'époque c'était une explosion. Deux ans plus tard, ils étaient déjà deux cent mille. La course avait commencé.\n\n> Berners-Lee a offert Web gratuitement et, ce faisant, l'a rendu mondial. S'il l'avait breveté, nous paierions encore des redevances pour chaque lien.\n\nCette histoire sur Berners-Lee n'est pas seulement un fait biographique. C'est une leçon sur la nature des réseaux: les protocoles ouverts croissent plus vite que les fermés, parce que n'importe qui peut bâtir dessus. C'est précisément pour cela que la blockchain Ethereum est ouverte. C'est précisément pour cela que TON est un protocole ouvert. En 1991, Berners-Lee a posé un principe qui détermine encore quelles technologies gagnent.", "tags": ["Web", "protocole", "ouverture"], "lensWeight": {"chronology": 5, "power": 4, "technology": 5, "media": 4, "privacy": 2}, "angDeg": 70.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%BB%D0%BE%D0%B4%20%D0%A8%D0%B5%D0%BD%D0%BD%D0%BE%D0%BD%20%E2%80%94%20A%20Mathematical%20Theory%20of%20Communication%20%281948%29", "linkType": "gbooks"}, {"title": "Ванневар Буш — As We May Think (1945)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B0%D0%BD%D0%BD%D0%B5%D0%B2%D0%B0%D1%80%20%D0%91%D1%83%D1%88%20%E2%80%94%20As%20We%20May%20Think%20%281945%29", "linkType": "gbooks"}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B0%D0%BD%D0%B8%D0%B5%D0%BB%20%D0%91%D0%B5%D0%BB%D0%BB%20%E2%80%94%20The%20Coming%20of%20Post-Industrial%20Society%20%281973%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Маршалл Маклюэн — Понимание медиа (1964)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D1%88%D0%B0%D0%BB%D0%BB%20%D0%9C%D0%B0%D0%BA%D0%BB%D1%8E%D1%8D%D0%BD%20%E2%80%94%20%D0%9F%D0%BE%D0%BD%D0%B8%D0%BC%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%20%281964%29", "linkType": "gbooks"}, {"title": "Николас Негропонте — Being Digital (1995)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D1%81%20%D0%9D%D0%B5%D0%B3%D1%80%D0%BE%D0%BF%D0%BE%D0%BD%D1%82%D0%B5%20%E2%80%94%20Being%20Digital%20%281995%29", "linkType": "gbooks"}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%83%D0%B3%D0%BB%D0%B0%D1%81%20%D0%A0%D0%B0%D1%88%D0%BA%D0%BE%D1%84%D1%84%20%E2%80%94%20Media%20Virus%21%20%281994%29", "linkType": "gbooks"}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D1%82%D1%8E%D0%B0%D1%80%D1%82%20%D0%91%D1%80%D1%8D%D0%BD%D0%B4%20%E2%80%94%20Information%20Wants%20to%20Be%20Free%20%281984%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Информационная эпоха (1996–1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%98%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%BE%D0%BD%D0%BD%D0%B0%D1%8F%20%D1%8D%D0%BF%D0%BE%D1%85%D0%B0%20%281996%E2%80%931998%29", "linkType": "gbooks"}], "era": "1991"}, {"id": "atoms-to-bits", "sceneIndex": 5, "x": 397.4, "y": 726.9, "type": "economy", "title": "Des atomes aux bits : un changement de logique économique", "shortTitle": "Atomes → bits", "thesis": "La valeur a commencé à circuler comme l’information : copiable, instantanée et presque gratuite.", "insight": "Le passage \"des atomes aux bits\" n’est pas seulement une question de technologie ; c’est un changement de logique économique, de l’échelle du même à la singularité de chaque interaction.", "body": "## Toffler l’a vu en 1980\n\nLorsque Alvin Toffler publie La Troisième Vague en 1980, les ordinateurs personnels existaient à peine. Il n’y avait pas d’internet. Il n’y avait pas de téléphones mobiles. Et pourtant, il décrit une transformation économique qui ne se déploiera pleinement que quarante ans plus tard.\n\nToffler décrit trois ères de la civilisation humaine. La première vague est agraire : la terre et la récolte comme valeur principale. La deuxième vague est industrielle : la chaîne de montage, la standardisation, la production de masse. Une usine produit mille réfrigérateurs identiques, et c’est précisément parce qu’ils sont identiques que c’est efficace. Plus le nombre d’unités produites augmente, plus le coût de chacune diminue. L’échelle, c’est la victoire de l’économie industrielle.\n\nLa troisième vague est informationnelle. Et ici, la logique s’inverse complètement. Dans l’économie de l’information, copier ne coûte rien. Un programme peut se comporter différemment avec un milliard d’utilisateurs en même temps, et ce n’est pas un bug, mais son principal avantage. La valeur ne se crée pas en reproduisant le même, mais par la singularité de chaque interaction.\n\n## Nicholas Negroponte et la formule la plus simple\n\nEn 1995, le directeur du MIT Media Lab, Nicholas Negroponte, l’a résumé dans une formule devenue célèbre : \"des atomes aux bits\".\n\nLes atomes, c’est le monde physique. Pour produire un réfrigérateur, il faut du métal, du plastique, de l’électronique, de la main-d’œuvre et une usine. Pour le livrer à l’acheteur, il faut un camion, un entrepôt et un magasin. Chaque copie coûte de l’argent. Le tirage est limité par les ressources. Si vous voulez vendre un million de réfrigérateurs, vous devez en produire un million.\n\nLes bits, c’est le monde numérique. Pour créer un programme, il faut un développeur et un ordinateur. Pour le livrer à un milliard d’utilisateurs, il faut un serveur et une connexion internet. La copie est pratiquement gratuite. La livraison est instantanée. Le tirage est infini. Si vous voulez vendre un milliard de copies d’un programme, vous n’avez pas besoin de fabriquer un milliard de programmes. Une copie se réplique un milliard de fois.\n\nCe n’est pas seulement une différence technologique. C’est un changement de logique économique fondamentale. Toute l’économie du XXe siècle reposait sur la logique des atomes : rareté, échelle, standardisation. L’économie du XXIe siècle repose sur la logique des bits : abondance, personnalisation, effets de réseau.\n\n> L’économie industrielle gagnait de l’argent grâce à l’échelle du même. L’économie de l’information gagne de l’argent grâce à la singularité de chaque interaction. Ce sont des logiques opposées.\n\nQuand on comprend cette différence, beaucoup de choses dans le monde moderne commencent à s’expliquer. Pourquoi Google est-il gratuit ? Parce que copier les résultats de recherche ne coûte rien, et la monétisation passe par la publicité. Pourquoi Spotify paie-t-il si peu les musiciens ? Parce que le coût marginal d’un stream tend vers zéro. Pourquoi les cryptomonnaies sont-elles possibles ? Parce que les actifs numériques peuvent être transférés sans support physique. Tout cela décou
