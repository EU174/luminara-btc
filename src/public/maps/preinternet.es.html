<script>
const CHAPTER_DATA = {"chapter": {"key": "preinternet", "title": "Antes de internet", "sourceUrl": "https://luminara.tech/#/scene?s=3&c=preinternet", "centralIdea": "La información se convierte en poder", "centerX": 500, "centerY": 445, "ring": 300, "lede": "Cómo la información se convierte en poder: de la escasez y las señales a la sociedad en red.", "lang": "es"}, "lenses": [{"id": "chronology", "label": "Cronología", "accent": "#7dd3fc", "description": "El orden de los acontecimientos y el paso de la escasez de información a los flujos de datos."}, {"id": "power", "label": "Poder", "accent": "#f87171", "description": "Quién controla la información: instituciones, protocolos, redes o plataformas."}, {"id": "technology", "label": "Tecnologías", "accent": "#34d399", "description": "Inventos y protocolos: señal, hipertexto, paquetes, TCP/IP, Web."}, {"id": "media", "label": "Medios", "accent": "#fbbf24", "description": "Cómo el medio de transmisión cambia la percepción, el comportamiento y la organización de la sociedad."}, {"id": "privacy", "label": "Privacidad", "accent": "#c084fc", "description": "La criptografía como protección frente a la vigilancia y el control."}], "nodes": [{"id": "scarcity", "sceneIndex": 0, "x": 500.0, "y": 145.0, "type": "power", "title": "La información como escasez", "shortTitle": "Escasez", "insight": "Antes de internet, la información era físicamente cara y centralizada; eso la convirtió en una herramienta de poder para quienes tenían el equipo.", "body": "## Un mundo donde las palabras costaban dinero\n\nLees esto en una pantalla. En algún centro de datos, un servidor te envió este texto en milisegundos, y no te costó nada. Parece algo obvio, como la electricidad o el agua corriente. Pero no siempre fue así. Y entender cómo era \"antes\" no es una curiosidad histórica, sino la clave para entender por qué el internet moderno está construido exactamente de esta manera. Y por qué eso es un problema.\n\nHace apenas setenta años, enviar un mensaje de Kiev a Nueva York costaba dinero, llevaba días y estaba controlado por quienes tenían el equipo: los estados, las empresas de telégrafos, las redacciones de los periódicos. La información era una escasez, exactamente como el petróleo o el grano. Y como cualquier escasez, era poder. Quien controlaba la transmisión de la información controlaba la realidad.\n\nImagina una imprenta de mediados del siglo XX. Máquinas metálicas enormes, tipos de plomo, el olor de la tinta y el aceite. Para llevar una idea a un millón de personas, había que imprimir físicamente un millón de ejemplares de un periódico, cargarlos en camiones y repartirlos por los quioscos de todo el país. Cada copia costaba dinero. Cada kilómetro de reparto costaba dinero. Un error tipográfico en la tirada significaba dinero tirado a la basura y reputación dañada. Era un mecanismo enorme, pesado y lento.\n\nLa radio y la televisión parecían una revolución: la señal viaja a la velocidad de la luz, no hacen falta camiones. Pero tenían una limitación fundamental: un transmisor, millones de receptores. Solo podía hablar quien tenía la torre. El resto de la humanidad escuchaba. No podías levantar el auricular y responder. No podías objetar. No podías añadir tu propia voz.\n\nAsí se veía el mundo de la información antes de internet: centralizado, caro y unidireccional. Unas pocas fuentes emitían para muchos. La información fluía estrictamente de arriba hacia abajo: de quienes tenían el equipo a quienes no lo tenían. No fue una casualidad ni una mala intención; era la realidad física de las tecnologías de aquella época.\n\n> La información no era solo un recurso, era la arquitectura del poder. Quien poseía el canal de transmisión poseía la realidad.\n\nPor eso, las primeras personas que entendieron que esa arquitectura podía cambiar comprendieron algo revolucionario. No solo que \"los datos podían transmitirse más rápido\". Sino que \"la propia estructura del poder sobre la información podía romperse\". Y empezaron a trabajar en ello mucho antes de que apareciera el primer navegador.", "tags": ["poder", "escasez", "medios"], "lensWeight": {"chronology": 5, "power": 5, "technology": 1, "media": 4, "privacy": 1}, "angDeg": -90.0, "sources": [{"title": "Claude Shannon — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Vannevar Bush — As We May Think (1945)", "url": ""}, {"title": "Daniel Bell — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Alvin Toffler — The Third Wave (1980)", "url": ""}, {"title": "Marshall McLuhan — Understanding Media (1964)", "url": ""}, {"title": "Nicholas Negroponte — Being Digital (1995)", "url": ""}, {"title": "Douglas Rushkoff — Media Virus! (1994)", "url": ""}, {"title": "Stewart Brand — Information Wants to Be Free (1984)", "url": ""}, {"title": "Eric Hughes — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Manuel Castells — The Information Age (1996–1998)", "url": ""}], "era": "antes de 1948"}, {"id": "shannon", "sceneIndex": 1, "x": 692.8, "y": 215.2, "type": "technology", "title": "Shannon: la información se volvió física", "shortTitle": "Shannon", "insight": "Shannon demostró que la información puede medirse y transmitirse como una magnitud física; eso sentó la base matemática de todo el mundo digital.", "body": "## El hombre que midió el pensamiento\n\nEn 1948, el matemático estadounidense Claude Shannon publicó un trabajo con el seco título técnico \"Una teoría matemática de la comunicación\". Poca gente lo leyó entonces. Poca gente lo lee ahora. Pero cambió el mundo más que la mayoría de los libros que todo el mundo lee.\n\nShannon demostró algo que parecía imposible: cualquier mensaje —una palabra, un sonido, una imagen, un número, un olor descrito con palabras— puede medirse con precisión, comprimirse y transmitirse por cualquier canal de comunicación. Llamó a la unidad de medida \"bit\", de binary digit. Cero o uno. Hay señal o no hay señal. Todo el universo de la información son combinaciones de ceros y unos.\n\nAntes de Shannon, la información era algo vago y subjetivo. Algunas palabras eran \"más importantes\" que otras. Algunas imágenes eran \"más significativas\". Algunos mensajes eran \"más ricos\". Después de Shannon, la información se volvió una magnitud física, tan real y medible como la masa o la temperatura. El mundo dejó de dividirse solo en materia y energía. Apareció una tercera cosa: la información. Y esa tercera cosa resultó no ser menos fundamental que las dos primeras.\n\n## Una llama de vela a través del océano\n\nPara entender lo que hizo Shannon, imagina esta tarea: transmitir la llama de una vela de Kiev a Tokio. Puedes llevar la vela misma, pero eso es lento, caro y la llama se apagará en el camino. Eso es transmitir materia, y está limitado por las leyes físicas.\n\nPero puedes describir la llama: su color, altura, temperatura, forma, la composición química de la cera. Enviar esa descripción a la velocidad de la luz por un cable. Y otra persona en Tokio encenderá exactamente la misma llama. Eso es transmitir información, y no conoce límites físicos.\n\nShannon mostró que este segundo método puede hacerse absolutamente preciso, confiable y escalable. Que cualquier señal puede codificarse en bits, transmitirse sin distorsión y reconstruirse al otro lado. Todo el mundo digital se sostiene sobre eso: del correo electrónico al streaming 4K, de las apps de mensajería al blockchain.\n\nCada vez que envías un mensaje en Telegram, Shannon está en acción. Cada vez que una transacción en el blockchain se transmite entre los nodos de la red, Shannon está en acción. Él creó el fundamento matemático sobre el que se construye todo lo digital.\n\n> Shannon no inventó Internet. Demostró que Internet era posible, que la información se puede transmitir con precisión, como una magnitud física.\n\nLa paradoja es que el propio Shannon trabajó en Bell Laboratories, el mayor monopolio telefónico del mundo. Su descubrimiento terminó destruyendo el monopolio de su empleador. Cuando la información puede transmitirse por cualquier canal, significa que ningún canal puede ser monopolio para siempre.", "tags": ["señal", "codificación", "medición"], "lensWeight": {"chronology": 4, "power": 2, "technology": 5, "media": 2, "privacy": 2}, "angDeg": -50.0, "sources": [{"title": "Claude Shannon — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Vannevar Bush — As We May Think (1945)", "url": ""}, {"title": "Daniel Bell — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Alvin Toffler — The Third Wave (1980)", "url": ""}, {"title": "Marshall McLuhan — Understanding Media (1964)", "url": ""}, {"title": "Nicholas Negroponte — Being Digital (1995)", "url": ""}, {"title": "Douglas Rushkoff — Media Virus! (1994)", "url": ""}, {"title": "Stewart Brand — Information Wants to Be Free (1984)", "url": ""}, {"title": "Eric Hughes — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Manuel Castells — The Information Age (1996–1998)", "url": ""}], "era": "1948"}, {"id": "memex", "sceneIndex": 2, "x": 795.4, "y": 392.9, "type": "media", "title": "El Memex de Bush: un sueño adelantado a su tiempo", "shortTitle": "Memex", "insight": "En 1945, Vannevar Bush describió el hipertexto y el conocimiento conectado, 46 años antes de la Web. Las ideas correctas no mueren; esperan a sus tecnologías.", "body": "## Hipertexto cuarenta años antes de Internet\n\nEn 1945, dos años antes de que apareciera la primera computadora plenamente funcional y cuarenta y seis años antes de la World Wide Web, el científico estadounidense Vannevar Bush escribió un ensayo titulado «As We May Think». Se publicó en The Atlantic, no en una revista científica, sino en una publicación masiva para el público general. Bush quería que lo leyera todo el mundo, no solo sus colegas científicos.\n\nDescribió un dispositivo al que llamó «memex», de memory extender, un extensor de memoria. Era una biblioteca personal de todo el conocimiento humano, donde cualquier documento estaba conectado con cualquier otro por su significado. Lees un artículo sobre Napoleón y, con un solo movimiento, pasas al mapa de sus campañas. Del mapa, a las cartas de sus generales. De las cartas, al análisis de su táctica por parte de historiadores militares del siglo XX. No buscas en un catálogo alfabético, no hojeas estantes: sigues la cadena del pensamiento, como sigue el pensamiento mismo.\n\nEso era hipertexto. Cuarenta años antes de que la palabra se acuñara de forma oficial. Cuarenta y seis años antes de que Tim Berners-Lee implementara esa idea en forma de World Wide Web.\n\n## Por qué el sueño quedó guardado en un cajón\n\nBush veía el futuro con total claridad: el conocimiento debía estar conectado, ser accesible para todos y pertenecer a todos. Solo había un problema: la tecnología aún no existía. En 1945, las computadoras ocupaban habitaciones enteras, costaban como aviones y solo podían calcular. No había pantallas, no había ratones, no había redes. Bush describió el dispositivo en términos de microfilmes y palancas mecánicas, porque era todo lo que tenía a mano para establecer una analogía.\n\nSu sueño quedó guardado en un cajón durante casi medio siglo. Pero no fue olvidado. Se leyó, se citó, pasó de mano en mano. Ted Nelson acuñó la palabra «hypertext» en 1965, inspirado directamente por Bush. Douglas Engelbart creó el ratón de computadora y un sistema de documentos hipermediales, también bajo la influencia de Bush.\n\nCuando Tim Berners-Lee escribió su propuesta para crear la Web en CERN en 1989, citó directamente el ensayo de Bush como idea original. Cuarenta y cuatro años después de su publicación, el sueño por fin recibió las herramientas para hacerse realidad.\n\nEsta historia importa no como una curiosidad histórica. Muestra algo fundamental: la idea correcta no muere. Espera su momento. A veces, durante décadas. Hoy vivimos un momento similar: las ideas de una Internet descentralizada, donde los usuarios son dueños de sus datos, existían mucho antes de blockchain. La tecnología simplemente por fin alcanzó la visión.\n\n> Bush describió la World Wide Web cuarenta y seis años antes de su invención. No porque fuera un profeta, sino porque entendió qué quiere la mente humana de las herramientas del conocimiento.\n\nParadójicamente, en 1945 Bush pensaba en los vínculos entre ideas, y al final obtuvimos una Internet donde los vínculos entre personas resultaron más importantes que los vínculos entre ideas. Esa es una diferencia importante, y volveremos a ella en los siguientes capítulos.", "tags": ["hipertexto", "conocimiento", "asociaciones"], "lensWeight": {"chronology": 4, "power": 2, "technology": 4, "media": 5, "privacy": 1}, "angDeg": -10.0, "sources": [{"title": "Claude Shannon — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Vannevar Bush — As We May Think (1945)", "url": ""}, {"title": "Daniel Bell — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Alvin Toffler — The Third Wave (1980)", "url": ""}, {"title": "Marshall McLuhan — Understanding Media (1964)", "url": ""}, {"title": "Nicholas Negroponte — Being Digital (1995)", "url": ""}, {"title": "Douglas Rushkoff — Media Virus! (1994)", "url": ""}, {"title": "Stewart Brand — Information Wants to Be Free (1984)", "url": ""}, {"title": "Eric Hughes — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Manuel Castells — The Information Age (1996–1998)", "url": ""}], "era": "1945"}, {"id": "arpanet", "sceneIndex": 3, "x": 759.8, "y": 595.0, "type": "technology", "title": "ARPANET: Internet nació del miedo", "shortTitle": "ARPANET", "insight": "ARPANET se creó como un sistema militar de comunicaciones sin un único punto de falla, y esa arquitectura descentralizada se convirtió en la base de todo Internet.", "body": "## El satélite que cambió la arquitectura del mundo\n\nLa historia de Internet no empieza en Silicon Valley ni en las aulas universitarias. Empieza en el Pentágono, en plena Guerra Fría, en un momento de miedo geopolítico agudo.\n\nEl 4 de octubre de 1957, la Unión Soviética lanzó el primer satélite artificial de la Tierra. Una pequeña esfera de metal de 58 centímetros de diámetro y 83 kilogramos de peso volaba sobre la Tierra y emitía pitidos, y todo el mundo la escuchaba. Para los militares estadounidenses, esto no era solo el triunfo tecnológico de un rival. Era una señal de alarma: el enemigo controla la órbita. Si pueden lanzar un satélite, pueden lanzar un misil con una cabeza nuclear y alcanzar cualquier punto del planeta.\n\nUn año después, Estados Unidos creó DARPA, la Agencia de Proyectos de Investigación Avanzada de Defensa. Su tarea era crear un sistema de comunicaciones militares que no pudiera ser destruido con un solo golpe. Las redes telefónicas tradicionales eran catastróficamente vulnerables: donde hay una central telefónica, hay un punto de falla. Una bomba sobre el Pentágono, y se pierde la comunicación con todo el ejército.\n\n## Una red sin centro, la idea que lo cambió todo\n\nLos ingenieros de DARPA idearon una solución radicalmente distinta. ¿Y si quitamos el centro por completo? Hacer que cada nodo de la red tenga el mismo valor. Si uno falla, el mensaje encuentra automáticamente otra ruta. Como el agua en las tuberías: si una tubería se bloquea, el agua busca un desvío.\n\nA esa idea la llamaron ARPANET. En 1969 funcionó por primera vez: cuatro universidades —UCLA, Stanford, UC Santa Barbara y Utah— intercambiaron datos por una línea telefónica. El primer mensaje que intentaron enviar fue la palabra \"login\". El sistema se cayó después de la letra \"o\". La primera palabra transmitida por el protointernet fue \"lo\", que en inglés significa \"mira\". Poesía accidental.\n\nNadie pensó entonces que eso se convertiría en la base del Internet civil global. Los militares querían una comunicación confiable en caso de guerra nuclear. Crearon algo más grande: una arquitectura en la que el poder, estructuralmente, no puede concentrarse en un solo punto. Una red distribuida es, por naturaleza, resistente a la centralización.\n\nAl menos, así se lo imaginó. La realidad resultó más compleja, y de eso hablaremos en los próximos capítulos.\n\n> Internet se creó como un sistema de comunicaciones militar resistente a un ataque nuclear. Al final, resultó resistente a cualquier centralización del poder, y eso se convirtió en su principal rasgo político.\n\nEn 1974, Vinton Cerf y Robert Kahn resolvieron el siguiente problema: las distintas computadoras hablaban idiomas distintos. La red de Stanford no entendía la red del MIT. Crearon TCP/IP, un protocolo universal, un lenguaje común para transmitir datos entre cualquier red. Los datos se dividen en pequeños paquetes, cada uno encuentra su propio camino, y al otro lado se vuelven a reunir. Como si cortaras una carta en partes, enviaras cada una con un mensajero distinto y aun así se volvieran a ensamblar en el orden correcto para quien la recibe. Ese mismo protocolo sigue siendo la base de Internet hoy, cincuenta años después de su creación.", "tags": ["paquetes", "DARPA", "TCP/IP", "descentralización"], "lensWeight": {"chronology": 5, "power": 5, "technology": 5, "media": 2, "privacy": 3}, "angDeg": 30.0, "sources": [{"title": "Claude Shannon — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Vannevar Bush — As We May Think (1945)", "url": ""}, {"title": "Daniel Bell — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Alvin Toffler — The Third Wave (1980)", "url": ""}, {"title": "Marshall McLuhan — Understanding Media (1964)", "url": ""}, {"title": "Nicholas Negroponte — Being Digital (1995)", "url": ""}, {"title": "Douglas Rushkoff — Media Virus! (1994)", "url": ""}, {"title": "Stewart Brand — Information Wants to Be Free (1984)", "url": ""}, {"title": "Eric Hughes — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Manuel Castells — The Information Age (1996–1998)", "url": ""}], "era": "1969"}, {"id": "open-web", "sceneIndex": 4, "x": 602.6, "y": 726.9, "type": "technology", "title": "Berners-Lee: la decisión de regalarlo todo gratis", "shortTitle": "Web abierto", "insight": "Berners-Lee entregó Web gratis, no por altruismo, sino porque entendió que solo un protocolo abierto puede volverse global.", "body": "## Una propuesta marcada como \"vaga, pero interesante\"\n\nEn 1989, un joven programador británico llamado Tim Berners-Lee trabajaba en el CERN, el Centro Europeo para la Investigación Nuclear en Ginebra. Es el mayor instituto científico del mundo: miles de científicos de decenas de países trabajan en los mismos experimentos, pero pierden documentos constantemente, olvidan el contexto y pasan meses tratando de entender qué se había hecho antes que ellos.\n\nBerners-Lee escribió una propuesta interna para la dirección. La idea: crear un sistema en el que todos los documentos estuvieran enlazados y fueran accesibles desde cualquier computadora de la red. Su jefe, Mike Sendall, escribió tres palabras en el margen: \"Vaga, pero interesante\". Fue la reseña más modesta de una invención que cambiaría el mundo.\n\nDurante tres años, Berners-Lee creó tres cosas sobre las que se sostiene todo el internet moderno: HTML, el lenguaje de marcado de documentos; HTTP, el protocolo para transmitirlos; y URL, el sistema de direccionamiento. Juntos formaron la World Wide Web. Los documentos se almacenan en servidores, tienen direcciones, están conectados por enlaces y se abren mediante un navegador. Simple, elegante, universal.\n\n## La decisión que definió una época\n\nPero la decisión clave no fue técnica. Fue ética.\n\nBerners-Lee podría haber patentado su invento. Los abogados del CERN se lo propusieron. Si cada sitio hubiera pagado regalías por usar HTTP, Berners-Lee se habría convertido en la persona más rica del planeta. En cambio, insistió en entregar la tecnología a la humanidad gratis, sin restricciones, sin licencias, sin condiciones.\n\n\"Si la Web hubiera sido patentada o hubiera estado bajo el control de una sola empresa, no habría existido\", explicó más tarde. No era altruismo por el altruismo mismo. Era una estrategia: solo sin barreras la red podía crecer hasta una escala global. Solo si cualquiera puede crear un sitio sin permiso, la red se vuelve realmente abierta.\n\nEn 1993, estudiantes del Centro Nacional de Aplicaciones de Supercomputación de EE. UU. lanzaron el navegador Mosaic, el primero que mostraba texto e imágenes juntos en una sola pantalla. Hasta entonces, internet era un mundo de texto. Mosaic lo volvió visual. Y comprensible para una persona común que nunca había aprendido programación.\n\nEse mismo año, el número de sitios web superó los quinientos. Hoy suena gracioso, pero en aquel momento fue una explosión. Dos años después ya eran doscientos mil. La carrera había comenzado.\n\n> Berners-Lee entregó Web gratis y, al hacerlo, lo volvió global. Si lo hubiera patentado, todavía estaríamos pagando regalías por cada enlace.\n\nEsta historia sobre Berners-Lee no es solo un dato biográfico. Es una lección sobre la naturaleza de las redes: los protocolos abiertos crecen más rápido que los cerrados, porque cualquiera puede construir sobre ellos. Por eso la blockchain Ethereum es abierta. Por eso TON es un protocolo abierto. En 1991, Berners-Lee sentó un principio que todavía determina qué tecnologías ganan.", "tags": ["Web", "protocolo", "apertura"], "lensWeight": {"chronology": 5, "power": 4, "technology": 5, "media": 4, "privacy": 2}, "angDeg": 70.0, "sources": [{"title": "Claude Shannon — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Vannevar Bush — As We May Think (1945)", "url": ""}, {"title": "Daniel Bell — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Alvin Toffler — The Third Wave (1980)", "url": ""}, {"title": "Marshall McLuhan — Understanding Media (1964)", "url": ""}, {"title": "Nicholas Negroponte — Being Digital (1995)", "url": ""}, {"title": "Douglas Rushkoff — Media Virus! (1994)", "url": ""}, {"title": "Stewart Brand — Information Wants to Be Free (1984)", "url": ""}, {"title": "Eric Hughes — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Manuel Castells — The Information Age (1996–1998)", "url": ""}], "era": "1991"}, {"id": "atoms-to-bits", "sceneIndex": 5, "x": 397.4, "y": 726.9, "type": "economy", "title": "De los átomos a los bits: un cambio en la lógica económica", "shortTitle": "Átomos → bits", "insight": "El paso \"de los átomos a los bits\" no es solo tecnología; es un cambio de lógica económica, de la escala de lo mismo a la singularidad de cada interacción.", "body": "## Toffler lo vio en 1980\n\nCuando Alvin Toffler publicó El tercer ola en 1980, las computadoras personales casi no existían. No había internet. No había teléfonos móviles. Y aun así describió una transformación económica que solo se desplegaría por completo cuarenta años después.\n\nToffler describió tres eras de la civilización humana. La primera ola fue agraria: la tierra y la cosecha como valor principal. La segunda ola fue industrial: la línea de montaje, la estandarización, la producción en masa. Una fábrica produce mil refrigeradores idénticos, y eso es eficiente precisamente porque son idénticos. Cuantas más unidades de producto, menor es el costo de cada una. La escala es la victoria de la economía industrial.\n\nLa tercera ola es informacional. Y aquí la lógica se invierte por completo. En la economía de la información, copiar es gratis. Un programa puede comportarse de manera distinta con mil millones de usuarios al mismo tiempo, y eso no es un error, sino su principal ventaja. El valor no se crea replicando lo mismo, sino a partir de la singularidad de cada interacción.\n\n## Nicholas Negroponte y la fórmula más simple\n\nEn 1995, el director del MIT Media Lab, Nicholas Negroponte, lo resumió en una frase que se volvió célebre: \"de los átomos a los bits\".\n\nLos átomos son el mundo físico. Para producir un refrigerador, necesitas metal, plástico, electrónica, mano de obra y una fábrica. Para entregarlo al comprador, necesitas un camión, un almacén y una tienda. Cada copia cuesta dinero. La tirada está limitada por los recursos. Si quieres vender un millón de refrigeradores, necesitas producir un millón de refrigeradores.\n\nLos bits son el mundo digital. Para crear un programa, necesitas un desarrollador y una computadora. Para entregarlo a mil millones de usuarios, necesitas un servidor y una conexión a internet. Copiar es prácticamente gratis. La entrega es instantánea. La tirada es infinita. Si quieres vender mil millones de copias de un programa, no necesitas fabricar mil millones de programas. Una copia se replica mil millones de veces.\n\nEsto no es solo una diferencia tecnológica. Es un cambio de lógica económica fundamental. Toda la economía del siglo XX se construyó sobre la lógica de los átomos: escasez, escala, estandarización. La economía del siglo XXI se construye sobre la lógica de los bits: abundancia, personalización, efectos de red.\n\n> La economía industrial ganaba dinero con la escala de lo mismo. La economía de la información gana dinero con la singularidad de cada interacción. Son lógicas opuestas.\n\nCuando entiendes esta diferencia, muchas cosas del mundo actual empiezan a tener sentido. ¿Por qué Google es gratis? Porque copiar los resultados de búsqueda no cuesta nada, y la monetización llega a través de la publicidad. ¿Por qué Spotify les paga tan poco a los músicos? Porque el costo marginal de un stream tiende a cero. ¿Por qué las criptomonedas son posibles en absoluto? Porque los activos digitales pueden transferirse sin un soporte físico. Todo esto son consecuencias de un mismo principio que Negroponte formuló en tres palabras.", "tags": ["economía", "bits", "escala"], "lensWeight": {"chronology": 4, "power": 4, "technology": 3, "media": 3, "privacy": 1}, "angDeg": 110.0, "sources": [{"title": "Claude Shannon — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Vannevar Bush — As We May Think (1945)", "url": ""}, {"title": "Daniel Bell — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Alvin Toffler — The Third Wave (1980)", "url": ""}, {"title": "Marshall McLuhan — Understanding Media (1964)", "url": ""}, {"title": "Nicholas Negroponte — Being Digital (1995)", "url": ""}, {"title": "Douglas Rushkoff — Media Virus! (1994)", "url": ""}, {"title": "Stewart Brand — Information Wants to Be Free (1984)", "url": ""}, {"title": "Eric Hughes — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Manuel Castells — The Information Age (1996–1998)", "url": ""}], "era": "1995"}, {"id": "media-effects", "sceneIndex": 6, "x": 240.2, "y": 595.0, "type": "media", "title": "McLuhan y los virus de Rushkoff: los medios nos cambian", "shortTitle": "Medios", "insight": "McLuhan y Rushkoff entendieron que lo importante no es la información, sino el entorno por el que se transmite. Los medios nos cambian al margen del contenido, a través de una estructura que no vemos.", "body": "## El medio importa más que el mensaje\n\nMarshall McLuhan era un pensador incómodo. En 1964 escribió una frase que primero se tomó por absurdo, luego por metáfora y solo más tarde se entendió como una descripción técnica precisa de la realidad: «El medio es el mensaje».\n\n¿Qué quería decir? Cuando en los años 50 apareció la televisión masiva, todos discutían sobre el contenido: programas buenos o malos, educativos o de entretenimiento, propaganda o arte. McLuhan dijo: esa es una pregunta secundaria. La televisión misma -como entorno, como tecnología, como forma de percepción- ya había cambiado la sociedad, sin importar qué se mostrara exactamente.\n\nLa televisión sincronizó por primera vez en la historia a millones de personas: las mismas noticias al mismo tiempo y con las mismas palabras, en todos los hogares del país a la vez. Creó lo que McLuhan llamó la «aldea global»: un mundo en el que todos viven al mismo tiempo el mismo acontecimiento. Antes de la televisión, las personas de distintas ciudades vivían en realidades informativas distintas. Después, en una sola.\n\n## La metáfora biológica de Rushkoff\n\nEn 1994, el teórico de medios estadounidense Douglas Rushkoff añadió a la idea de McLuhan una metáfora biológica, y resultó ser aún más precisa. En el libro *Media Virus!*, describió el mecanismo que hoy se llama contenido viral, diez años antes de YouTube y veinte antes de TikTok.\n\nLas ideas se propagan como virus. No porque sean verdaderas. No porque sean útiles. Sino porque encuentran una vulnerabilidad psicológica en la audiencia: lo que hace que la gente las siga pasando adelante: miedo, indignación, entusiasmo, reconocimiento, ira, ternura. La emoción es el mecanismo de replicación de una idea.\n\nRushkoff mostró que el contenido que provoca una emoción intensa se difunde independientemente de si es verdadero o útil. Una noticia escandalosa se esparce más rápido que una verdadera. Una historia aterradora se difunde más rápido que una aburrida. Esto no es casualidad ni manipulación: es una característica arquitectónica del entorno mediático. Un virus no elige a su huésped según si es buena o mala persona. Lo elige según si es vulnerable o no.\n\nMucho antes de los algoritmos de TikTok, optimizados precisamente para eso, Rushkoff describió el principio sobre el que están construidos. El algoritmo no creó la viralidad. Solo aprendió a amplificarla.\n\n> McLuhan advirtió: lo que importa no es el programa, sino el televisor. Rushkoff aclaró: lo que importa no es la idea, sino la emoción que provoca. Juntos describieron la arquitectura de las redes sociales modernas treinta años antes de que aparecieran.\n\nCuando apareció internet, la primera pregunta volvió a ser sobre el contenido: ¿qué leería y vería la gente allí? McLuhan habría dicho: pregunta equivocada. La correcta es: ¿qué le hace al ser humano el entorno mismo en el que pasa cada vez más tiempo? Esa pregunta se volvió crítica cuando aparecieron las redes sociales. Por desgracia, se hizo demasiado tarde.", "tags": ["medios", "comportamiento", "percepción"], "lensWeight": {"chronology": 3, "power": 3, "technology": 1, "media": 5, "privacy": 2}, "angDeg": 150.0, "sources": [{"title": "Claude Shannon — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Vannevar Bush — As We May Think (1945)", "url": ""}, {"title": "Daniel Bell — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Alvin Toffler — The Third Wave (1980)", "url": ""}, {"title": "Marshall McLuhan — Understanding Media (1964)", "url": ""}, {"title": "Nicholas Negroponte — Being Digital (1995)", "url": ""}, {"title": "Douglas Rushkoff — Media Virus! (1994)", "url": ""}, {"title": "Stewart Brand — Information Wants to Be Free (1984)", "url": ""}, {"title": "Eric Hughes — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Manuel Castells — The Information Age (1996–1998)", "url": ""}], "era": "1964–1990s"}, {"id": "cypherpunks", "sceneIndex": 7, "x": 204.6, "y": 392.9, "type": "privacy", "title": "Hughes y los cypherpunks: la privacidad es matemática", "shortTitle": "Cypherpunks", "insight": "En 1993, Hughes predijo la crisis de la privacidad y exigió protección matemática; su manifiesto se convirtió en la base ideológica de Bitcoin y de todo Web3.", "body": "## La voz que advirtió antes\n\nEn 1993, cuando la mayoría escuchaba por primera vez la palabra \"internet\", el matemático y criptógrafo Eric Hughes escribió un documento de tres páginas. Se titulaba \"A Cypherpunk's Manifesto\" y se publicó en la lista de correo de una pequeña comunidad de personas que trabajaban en criptografía y pensaban en las consecuencias de la aparición de una red pública.\n\nEn ese momento, internet apenas empezaba a estar disponible para la gente común. Apenas habían aparecido los primeros navegadores. Nadie pensaba todavía en la privacidad en línea - la gente simplemente celebraba las nuevas posibilidades: ¡podías escribirle a personas al otro lado del planeta! ¡Podías leer noticias en tiempo real! ¡Podías encontrar cualquier información!\n\nHughes pensaba distinto. Su argumento era simple e irrefutable: un internet abierto significa que cada una de tus acciones en línea es potencialmente visible para todos - proveedores, gobiernos, corporaciones. No es una vulnerabilidad accidental. Es una característica arquitectónica de un sistema que, con intención o no, fue construido justamente así. Y la única forma de proteger la privacidad en estas condiciones no es pedir permiso a proveedores y gobiernos, sino usar matemáticas. Criptografía. Matemáticas que ninguna ley puede romper.\n\n## Una profecía que se cumplió literalmente\n\nHughes escribió en 1993: \"La privacidad en una sociedad abierta requiere sistemas de transacciones anónimas.\" Sonaba a ciencia ficción. La mayoría de los lectores se encogía de hombros: \"No tengo nada que ocultar\". ¿Para qué necesitaría transacciones anónimas una persona común?\n\nTreinta años después, vivimos en un mundo donde las corporaciones saben más sobre los usuarios que sus seres queridos. Donde las filtraciones de datos se han vuelto noticia diaria. Donde cada compra con tarjeta, cada búsqueda, cada movimiento con el teléfono encendido queda registrado y almacenado. Hughes no era paranoico. Simplemente pensaba varios pasos adelante.\n\nLos cypherpunks - una pequeña comunidad que se reunió en torno a esta idea a principios de los años noventa - terminaron sentando las bases ideológicas de Bitcoin. En 2008, Satoshi Nakamoto publicó la descripción de Bitcoin precisamente en la lista de correo de los cypherpunks. Fue una respuesta directa a la pregunta de Hughes: aquí está tu sistema de transacciones anónimas, construido sobre matemáticas y no sobre la confianza en un intermediario.\n\nStewart Brand pronunció en 1984 la frase que se volvió un manifiesto de internet abierto: \"La información quiere ser libre\". Se refería a la naturaleza de la información: no disminuye cuando se copia, así que las barreras artificiales contradicen su naturaleza. Hughes completó la idea desde el otro lado: la libertad de la información sin privacidad no es libertad, sino transparencia para quienes observan.\n\n> Brand dijo: la información quiere ser libre. Hughes respondió: y la privacidad quiere ser protegida por las matemáticas. Juntos describieron los dos polos de la libertad digital.\n\nEstos dos principios - la apertura y la privacidad - en cierto sentido se contradicen. Y la tensión entre ambos sigue definiendo las grandes discusiones sobre cómo debería ser internet. ¿Cómo hacer que el conocimiento sea accesible para todos y, al mismo tiempo, proteger los datos personales de cada persona? Esa pregunta todavía no tiene respuesta. Y eso es precisamente lo que Web3 intenta resolver.", "tags": ["criptografía", "privacidad", "vigilancia"], "lensWeight": {"chronology": 3, "power": 4, "technology": 4, "media": 2, "privacy": 5}, "angDeg": 190.0, "sources": [{"title": "Claude Shannon — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Vannevar Bush — As We May Think (1945)", "url": ""}, {"title": "Daniel Bell — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Alvin Toffler — The Third Wave (1980)", "url": ""}, {"title": "Marshall McLuhan — Understanding Media (1964)", "url": ""}, {"title": "Nicholas Negroponte — Being Digital (1995)", "url": ""}, {"title": "Douglas Rushkoff — Media Virus! (1994)", "url": ""}, {"title": "Stewart Brand — Information Wants to Be Free (1984)", "url": ""}, {"title": "Eric Hughes — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Manuel Castells — The Information Age (1996–1998)", "url": ""}], "era": "1993"}, {"id": "castells", "sceneIndex": 8, "x": 307.2, "y": 215.2, "type": "power", "title": "Castells: el poder se desplazó a los flujos", "shortTitle": "Flujos", "insight": "Castells mostró que el poder pasó del control de los lugares al control de los flujos de datos y atención, y eso lo volvió invisible y difícil de cuestionar.", "body": "## La revolución que nadie notó\n\nA mediados de los años 1990, el sociólogo español Manuel Castells observaba una transformación que ocurría a la vista de todos y escribió una obra en tres tomos sobre lo que la mayoría no estaba notando. La revolución de la información ya había ocurrido. Solo que la gente la buscaba en el lugar equivocado.\n\nEsperaban autos voladores y robots en la cocina. Esperaban el futuro fantástico prometido por las revistas de divulgación de los años 1960. Pero la revolución estaba ocurriendo en los centros de servidores de los bancos, en los centros logísticos de las corporaciones globales, en los flujos financieros entre continentes. Para los años 1990, el dinero ya había dejado de ser físico: se había convertido en flujos de datos entre servidores. La producción había dejado de ser local: se había convertido en una red global de proveedores, donde el diseño se hace en California, las piezas se fabrican en China, el ensamblaje ocurre en Vietnam y las ventas ocurren en todas partes. El poder ya no se medía por territorio.\n\n## El espacio de los lugares frente al espacio de los flujos\n\nCastells introdujo una distinción que ayuda a entender el mundo moderno. El poder antiguo controlaba el \"espacio de los lugares\": fábricas, puertos, fronteras, territorios. Puntos físicos que se pueden ocupar, defender y mantener. El poder nuevo controla el \"espacio de los flujos\": datos, capital, atención, información.\n\nSon tipos de poder profundamente distintos. El poder territorial se puede ver en un mapa: aquí está la frontera, aquí está el ejército, aquí está el castillo. El poder sobre los flujos es invisible. ¿Dónde está el poder de Google? En ninguna parte y en todas a la vez. ¿Dónde está el poder de Facebook? En el algoritmo que determina lo que ven miles de millones de personas. ¿Dónde está el poder de Bitcoin? En una red distribuida que no tiene ubicación física.\n\nCastells mostró: quien controla los flujos controla el mundo. Y esa observación resultó alarmantemente precisa. Cinco o seis empresas tecnológicas controlan la mayor parte de los flujos de información del planeta. No poseen territorios. Poseen algoritmos que determinan lo que la gente ve, lee, compra y en qué cree.\n\nDaniel Bell ya había predicho en 1973 la transición a una sociedad posindustrial, donde el recurso principal es la información y las instituciones principales no son las fábricas, sino las universidades y los laboratorios de investigación. Castells vio en los años 1990 que eso había ocurrido, pero el poder sobre la información se había concentrado en un lugar muy distinto de las universidades.\n\n> El poder antiguo controlaba los lugares. El poder nuevo controla los flujos. Y los flujos son mucho más difíciles de impugnar que el territorio.\n\nEsta es la pregunta fundamental que atraviesa todo el curso: ¿cómo se organiza el poder en un mundo donde la información es el recurso principal? ¿Quién lo controla? ¿Cómo se concentra? ¿Y qué ocurre cuando unas pocas corporaciones se hacen con el control de la mayor parte de los flujos de información del planeta? Los capítulos siguientes tratan de eso.", "tags": ["flujos", "sociedad", "poder"], "lensWeight": {"chronology": 4, "power": 5, "technology": 2, "media": 4, "privacy": 3}, "angDeg": 230.0, "sources": [{"title": "Claude Shannon — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Vannevar Bush — As We May Think (1945)", "url": ""}, {"title": "Daniel Bell — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Alvin Toffler — The Third Wave (1980)", "url": ""}, {"title": "Marshall McLuhan — Understanding Media (1964)", "url": ""}, {"title": "Nicholas Negroponte — Being Digital (1995)", "url": ""}, {"title": "Douglas Rushkoff — Media Virus! (1994)", "url": ""}, {"title": "Stewart Brand — Information Wants to Be Free (1984)", "url": ""}, {"title": "Eric Hughes — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Manuel Castells — The Information Age (1996–1998)", "url": ""}], "era": "1996"}], "edges": [{"from": "scarcity", "to": "shannon", "label": "de la escasez a la medición", "lenses": ["chronology", "technology"]}, {"from": "shannon", "to": "arpanet", "label": "la señal se vuelve red", "lenses": ["chronology", "technology"]}, {"from": "memex", "to": "open-web", "label": "el hipertexto se vuelve Web", "lenses": ["chronology", "media", "technology"]}, {"from": "arpanet", "to": "open-web", "label": "resiliencia más apertura", "lenses": ["chronology", "power", "technology"]}, {"from": "open-web", "to": "atoms-to-bits", "label": "la apertura acelera la copia", "lenses": ["power", "technology"]}, {"from": "atoms-to-bits", "to": "castells", "label": "la economía se vuelve flujos", "lenses": ["power", "media"]}, {"from": "media-effects", "to": "castells", "label": "los medios forman la sociedad red", "lenses": ["media", "power"]}, {"from": "arpanet", "to": "cypherpunks", "label": "la red necesita protección", "lenses": ["privacy", "technology", "power"]}, {"from": "cypherpunks", "to": "castells", "label": "privacidad dentro de los flujos", "lenses": ["privacy", "power"]}, {"from": "scarcity", "to": "castells", "label": "del control de acceso al control de flujos", "lenses": ["power"]}], "ui": {"eyebrow": "Luminara · Fundamentos", "sectionLenses": "Lentes de interpretación", "sectionScenes": "Escenas del capítulo", "detailLabel": "Detalle", "detailEmpty": "Elige un nodo del mapa: aquí aparecerán la tesis, la idea clave, las fuentes y las ideas relacionadas. Las lentes de arriba cambian lo que se resalta y vuelven a colorear el centro.", "related": "Ideas relacionadas", "sources": "Fuentes", "readScene": "Leer escena", "centerLabel": "Idea central", "progress": "Explorado", "progressOf": "de", "openInLuminara": "Abrir en Luminara", "close": "Cerrar", "arpaTitle": "Mini demo · enrutamiento de paquetes", "arpaNote": "Pulsa «Enviar paquete». Luego «Desactivar nodo»: el paquete encontrará otra ruta. En eso consiste una red sin un punto único de fallo.", "arpaSend": "Enviar paquete", "arpaFail": "Desactivar nodo", "arpaReset": "Restablecer", "arpaDemo": "Demo de ARPANET", "typePower": "Poder", "typeTechnology": "Tecnologías", "typeMedia": "Medios", "typePrivacy": "Privacidad", "typeEconomy": "Economía", "chapterTitle": "Antes de internet", "scene": "Escena", "arpaRouting": "El paquete va", "arpaNoRoute": "Sin ruta: demasiados nodos caídos.", "arpaDelivered": "entregado", "arpaAria": "Reenrutamiento de paquete ARPANET", "initError": "Error de inicialización"}};
function renderEmptyState(reason){const empty=document.querySelector(".empty-state"),svg=document.querySelector(".system-map");if(!empty||!svg)return;empty.hidden=false;svg.setAttribute("hidden","");empty.innerHTML=`<p>${reason}</p><a href="${CHAPTER_DATA.chapter.sourceUrl}" target="_blank" rel="noreferrer">Luminara</a>`;}
</script></head>
<body>
<main class="app-shell">
  <section class="control-rail">
    <div><p class="eyebrow">Luminara · Fundamentos</p><h1 id="app-title">Antes de internet</h1></div>
    <p class="chapter-lede">Cómo la información se convierte en poder: de la escasez y las señales a la sociedad en red.</p>
    <div class="rail-rule"></div>
    <div><p class="section-h">Lentes de interpretación</p><div class="lens-group" style="margin-top:9px"></div><p class="lens-desc" style="margin-top:9px"></p></div>
    <div class="rail-rule"></div>
    <div class="progress-box"></div>
    <div><p class="section-h">Escenas del capítulo</p><nav class="node-list" style="margin-top:6px"></nav></div>
  </section>
  <section class="map-stage">
    <svg class="system-map" viewBox="0 0 1000 890" role="img" preserveAspectRatio="xMidYMid meet"><title id="map-title">Antes de internet</title><desc id="map-desc">La información se convierte en poder</desc></svg>
    <div class="empty-state" hidden></div>
  </section>
  <aside class="detail-panel"></aside>
</main>
<dialog class="scene-dialog"></dialog>
<script>
const state={lens:"chronology",selected:null,visited:new Set(),entered:false};
const byId=id=>CHAPTER_DATA.nodes.find(n=>n.id===id);
const SVGNS="http://www.w3.org/2000/svg";
const el=(t,a)=>{const e=document.createElementNS(SVGNS,t);for(const k in(a||{}))e.setAttribute(k,a[k]);return e;};
function typeColor(t){return{power:"#c0392b",technology:"#1f7a5a",media:"#b7791f",privacy:"#6b4fa0",economy:"#a04a7a"}[t]||"#b7791f";}
function typeLabel(t){const u=CHAPTER_DATA.ui;return{power:u.typePower,technology:u.typeTechnology,media:u.typeMedia,privacy:u.typePrivacy,economy:u.typeEconomy}[t]||"";}
function lensById(id){return CHAPTER_DATA.lenses.find(l=>l.id===id);}
function edgeActive(e){return e.lenses.includes(state.lens);}
function nodeWeight(n){return(n.lensWeight&&n.lensWeight[state.lens])||0;}
const CX=CHAPTER_DATA.chapter.centerX||500, CY=CHAPTER_DATA.chapter.centerY||445, RING=CHAPTER_DATA.chapter.ring||300;

function buildLenses(){
  const w=document.querySelector(".lens-group");w.innerHTML="";
  CHAPTER_DATA.lenses.forEach(l=>{const b=document.createElement("button");b.className="lens-btn";b.type="button";
    b.setAttribute("aria-pressed",String(l.id===state.lens));b.style.setProperty("--dot",l.accent);
    b.innerHTML=`<span class="lens-dot"></span>${l.label}`;b.addEventListener("click",()=>setLens(l.id));w.appendChild(b);});
}
function setLens(id){state.lens=id;const l=lensById(id);
  const d=document.querySelector(".lens-desc");if(d)d.textContent=l?l.description:"";
  document.querySelectorAll(".lens-btn").forEach((b,i)=>b.setAttribute("aria-pressed",String(CHAPTER_DATA.lenses[i].id===id)));
  renderAll();}

function curve(a,b){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;const dx=mx-CX,dy=my-CY,len=Math.hypot(dx,dy)||1;const bow=26;
  return `M ${a.x} ${a.y} Q ${mx+(dx/len)*bow} ${my+(dy/len)*bow} ${b.x} ${b.y}`;}

function defs(){
  const d=el("defs");
  const mk=(id,color)=>{const m=el("marker",{id,viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"});
    const p=el("path",{d:"M0 0 L10 5 L0 10 z",fill:color});m.appendChild(p);return m;};
  d.appendChild(mk("arrow-active", lensById(state.lens)?lensById(state.lens).accent:"#b7791f"));
  return d;
}

function renderMap(){
  const svg=document.querySelector(".system-map");if(!svg)return;
  [...svg.querySelectorAll("defs,g,.ring,.ring-tick,.era-label,.spoke")].forEach(n=>n.remove());
  svg.appendChild(defs());
  // rings
  const gDeco=el("g",{});
  [RING*0.55,RING].forEach(r=>gDeco.appendChild(el("circle",{class:"ring",cx:CX,cy:CY,r})));
  svg.appendChild(gDeco);
  // spokes + chronology era labels around outer ring
  const gSpoke=el("g",{});
  CHAPTER_DATA.nodes.forEach(n=>{
    gSpoke.appendChild(el("line",{class:"spoke",x1:CX,y1:CY,x2:n.x,y2:n.y}));
  });
  svg.appendChild(gSpoke);

  // edges (with directional arrows on active)
  const gE=el("g",{});
  CHAPTER_DATA.edges.forEach(e=>{const a=byId(e.from),b=byId(e.to);if(!a||!b)return;
    const active=edgeActive(e);const g=el("g",{class:"edge"+(active?" active":"")});
    if(active)g.style.setProperty("--dot",lensById(state.lens).accent);
    const d=curve(a,b);const p=el("path",{d});
    // approximate length for draw animation
    const len=Math.round(Math.hypot(b.x-a.x,b.y-a.y)*1.15);
    p.style.setProperty("--len",len);
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const lb=el("text",{class:"edge-label",x:mx,y:my-5,"text-anchor":"middle"});lb.textContent=e.label;
    g.appendChild(p);g.appendChild(lb);gE.appendChild(g);});
  svg.appendChild(gE);

  // center (breathing, lens-tinted ring)
  const gC=el("g",{});
  gC.style.setProperty("--dot", lensById(state.lens)?lensById(state.lens).accent:"#b7791f");
  gC.appendChild(el("circle",{class:"center-halo",cx:CX,cy:CY,r:78}));
  gC.appendChild(el("circle",{class:"center-ring",cx:CX,cy:CY,r:72}));
  gC.appendChild(el("circle",{class:"center-disc",cx:CX,cy:CY,r:66}));
  const t2=el("text",{class:"center-t2",x:CX,y:CY-20});t2.textContent=CHAPTER_DATA.ui.centerLabel;gC.appendChild(t2);
  wrapText(gC,CHAPTER_DATA.chapter.centralIdea,CX,CY+2,120,"center-t1",17);
  svg.appendChild(gC);

  // nodes with smart outward labels + era
  const gN=el("g",{});
  CHAPTER_DATA.nodes.forEach((n,i)=>{
    const g=el("g",{class:"node"+(state.selected===n.id?" selected":""),tabindex:"0",role:"button","aria-label":`${n.sceneIndex+1}. ${n.title} (${n.era||""})`});
    g.style.setProperty("--dot",typeColor(n.type));
    g.style.setProperty("--ox",n.x+"px");g.style.setProperty("--oy",n.y+"px");
    if(!state.entered) g.style.setProperty("--delay",(0.15+i*0.06)+"s"); else g.style.animation="none",g.style.opacity="1";
    if(state.selected){const linked=CHAPTER_DATA.edges.some(e=>(e.from===state.selected&&e.to===n.id)||(e.to===state.selected&&e.from===n.id));
      if(n.id!==state.selected&&!linked)g.classList.add("dim");}
    else if(nodeWeight(n)<=1){g.classList.add("dim");}
    g.appendChild(el("circle",{class:"halo",cx:n.x,cy:n.y,r:34}));
    g.appendChild(el("circle",{class:"disc",cx:n.x,cy:n.y,r:26}));
    const num=el("text",{class:"num",x:n.x,y:n.y});num.textContent=String(n.sceneIndex+1);g.appendChild(num);

    // smart label placement: outward along the radius from center
    const dx=n.x-CX,dy=n.y-CY,len=Math.hypot(dx,dy)||1;
    const ux=dx/len,uy=dy/len;
    const lx=n.x+ux*40, ly=n.y+uy*40;
    // anchor by horizontal side
    const anchor = ux>0.25?"start":(ux<-0.25?"end":"middle");
    const era=el("text",{class:"era",x:lx,y:ly-13,"text-anchor":anchor});era.textContent=n.era||"";g.appendChild(era);
    const kick=el("text",{class:"kicker",x:lx,y:ly-1,"text-anchor":anchor});kick.textContent=typeLabel(n.type);g.appendChild(kick);
    wrapTextAnchored(g,n.shortTitle,lx,ly+13,150,"cap",13,anchor);

    g.addEventListener("click",()=>selectNode(n.id));
    g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();selectNode(n.id);}});
    gN.appendChild(g);
  });
  svg.appendChild(gN);
  state.entered=true;
}
function wrapText(parent,text,x,y,maxw,cls,fs){wrapTextAnchored(parent,text,x,y,maxw,cls,fs,"middle");}
function wrapTextAnchored(parent,text,x,y,maxw,cls,fs,anchor){
  const words=String(text).split(/\s+/);const lines=[];let line="";
  const approx=s=>s.length*(fs*0.56);
  words.forEach(w=>{const t=line?line+" "+w:w;if(approx(t)>maxw&&line){lines.push(line);line=w;}else line=t;});
  if(line)lines.push(line);const total=(lines.length-1)*(fs+2);
  lines.forEach((ln,i)=>{const t=el("text",{class:cls,x,y:y-total/2+i*(fs+2),"text-anchor":anchor});t.textContent=ln;parent.appendChild(t);});
}

function renderNodeList(){const nav=document.querySelector(".node-list");if(!nav)return;nav.innerHTML="";
  CHAPTER_DATA.nodes.slice().sort((a,b)=>a.sceneIndex-b.sceneIndex).forEach(n=>{
    const b=document.createElement("button");b.type="button";b.setAttribute("aria-current",String(state.selected===n.id));b.style.setProperty("--dot",typeColor(n.type));
    b.innerHTML=`<span class="node-idx">${String(n.sceneIndex+1).padStart(2,"0")}</span><span>${n.shortTitle}</span>`;
    b.addEventListener("click",()=>selectNode(n.id));nav.appendChild(b);});}
function renderProgress(){const box=document.querySelector(".progress-box");if(!box)return;
  const total=CHAPTER_DATA.nodes.length,seen=state.visited.size;
  box.innerHTML=`${CHAPTER_DATA.ui.progress} ${seen} ${CHAPTER_DATA.ui.progressOf} ${total}<div class="progress-bar"><div class="progress-fill" style="width:${Math.round(seen/total*100)}%"></div></div>`;}
function firstSentence(txt){return String(txt).replace(/^##[^\n]*\n+/,"").split(/(?<=[.!?])\s/)[0]||"";}
function renderDetail(){const p=document.querySelector(".detail-panel");if(!p)return;
  if(!state.selected){p.innerHTML=`<p class="eyebrow">${CHAPTER_DATA.ui.detailLabel}</p><p class="detail-empty">${CHAPTER_DATA.ui.detailEmpty}</p>`;return;}
  const n=byId(state.selected);const c=typeColor(n.type);
  const related=CHAPTER_DATA.edges.filter(e=>e.from===n.id||e.to===n.id).map(e=>({node:byId(e.from===n.id?e.to:e.from),label:e.label})).filter(x=>x.node);
  const srcs=(n.sources||[]).slice(0,10);
  p.innerHTML=`<p class="detail-kicker" style="--dot:${c}">${CHAPTER_DATA.ui.scene} ${n.sceneIndex+1} · ${typeLabel(n.type)}${n.era?" · "+n.era:""}</p>
    <h3 class="detail-title">${n.title}</h3>
    <p class="detail-thesis">${firstSentence(n.body)}</p>
    <p class="detail-insight" style="--dot:${c}">${n.insight}</p>
    <div class="chips">${(n.tags||[]).map(t=>`<span class="chip">${t}</span>`).join("")}</div>
    <div class="related"><h4>${CHAPTER_DATA.ui.related}</h4><div class="related-list">
      ${related.map(r=>`<button type="button" data-go="${r.node.id}">${r.node.shortTitle} · <span style="color:var(--muted)">${r.label}</span></button>`).join("")}</div></div>
    ${srcs.length?`<div class="sources-block"><h4>${CHAPTER_DATA.ui.sources} (${srcs.length})</h4><ol>${srcs.map(s=>`<li>${s.url?`<a href="${s.url}" target="_blank" rel="noreferrer">${s.title}</a>`:s.title}</li>`).join("")}</ol></div>`:""}
    <div class="panel-actions"><button class="btn primary" type="button" data-full="${n.id}">${CHAPTER_DATA.ui.readScene}</button>
      ${n.id==="arpanet"?'<button class="btn" type="button" data-arpa="1">${CHAPTER_DATA.ui.arpaDemo}</button>':""}</div>`;
  p.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>selectNode(b.getAttribute("data-go"))));
  p.querySelector("[data-full]").addEventListener("click",()=>renderFullScene(n.id));
  const ad=p.querySelector("[data-arpa]");if(ad)ad.addEventListener("click",()=>renderFullScene("arpanet",true));}
function selectNode(id){state.selected=id;state.visited.add(id);renderAll();}

function mdToHtml(md){return String(md).split(/\n{2,}/).map(b=>{b=b.trim();if(!b)return"";
  if(b.startsWith("## "))return`<h2>${b.slice(3)}</h2>`;return`<p>${b.replace(/\*([^*]+)\*/g,"<em>$1</em>")}</p>`;}).join("");}
function renderFullScene(id,openArpa){const n=byId(id);if(!n)return;const dlg=document.querySelector(".scene-dialog");const isArpa=n.id==="arpanet";const c=typeColor(n.type);const srcs=(n.sources||[]);
  dlg.innerHTML=`<div class="dialog-inner"><button class="dialog-close" aria-label="${CHAPTER_DATA.ui.close}" type="button">×</button>
    <p class="detail-kicker" style="--dot:${c}">${CHAPTER_DATA.ui.scene} ${n.sceneIndex+1} · ${typeLabel(n.type)}${n.era?" · "+n.era:""}</p>
    <h3>${n.title}</h3><div class="dialog-body">${mdToHtml(n.body)}</div>
    <p class="detail-insight" style="--dot:${c}">${n.insight}</p>${isArpa?arpaMarkup():""}
    ${srcs.length?`<div class="sources-block"><h4>${CHAPTER_DATA.ui.sources}</h4><ol>${srcs.map(s=>`<li>${s.url?`<a href="${s.url}" target="_blank" rel="noreferrer">${s.title}</a>`:s.title}</li>`).join("")}</ol></div>`:""}
    <div class="panel-actions"><a class="btn" href="${CHAPTER_DATA.chapter.sourceUrl}" target="_blank" rel="noreferrer">${CHAPTER_DATA.ui.openInLuminara}</a>
      <button class="btn primary" type="button" data-close>${CHAPTER_DATA.ui.close}</button></div></div>`;
  const close=()=>dlg.close();dlg.querySelector(".dialog-close").addEventListener("click",close);dlg.querySelector("[data-close]").addEventListener("click",close);
  if(typeof dlg.showModal==="function")dlg.showModal();else dlg.setAttribute("open","");
  if(isArpa){wireArpanet(dlg);if(openArpa)setTimeout(()=>runArpanetPacketDemo(dlg),300);}}
function arpaMarkup(){return `<div class="arpa-wrap"><h4>${CHAPTER_DATA.ui.arpaTitle}</h4>
  <svg class="arpa-svg arpa-net" viewBox="0 0 460 160" role="img" aria-label="${CHAPTER_DATA.ui.arpaAria}"></svg>
  <p class="arpa-note">${CHAPTER_DATA.ui.arpaNote}</p>
  <div class="panel-actions"><button class="btn primary" type="button" data-send>${CHAPTER_DATA.ui.arpaSend}</button>
    <button class="btn" type="button" data-fail>${CHAPTER_DATA.ui.arpaFail}</button><button class="btn" type="button" data-reset>${CHAPTER_DATA.ui.arpaReset}</button></div></div>`;}
const ARPA={hosts:{A:{x:40,y:80,label:"A"},B:{x:170,y:38,label:"B"},C:{x:170,y:122,label:"C"},D:{x:300,y:80,label:"D"},E:{x:420,y:80,label:"E"}},
  links:[["A","B"],["A","C"],["B","D"],["C","D"],["D","E"]],down:new Set(),
  route(){const P=[["A","B","D","E"],["A","C","D","E"]];for(const p of P)if(p.every(h=>!this.down.has(h)))return p;return null;}};
function drawArpa(svg){svg.innerHTML="";const mk=(t,a)=>{const e=document.createElementNS(SVGNS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  ARPA.links.forEach(([f,t])=>{const A=ARPA.hosts[f],B=ARPA.hosts[t];svg.appendChild(mk("line",{x1:A.x,y1:A.y,x2:B.x,y2:B.y}));});
  Object.entries(ARPA.hosts).forEach(([id,h])=>{svg.appendChild(mk("circle",{cx:h.x,cy:h.y,r:16,class:ARPA.down.has(id)?"down":"host"}));const t=mk("text",{x:h.x,y:h.y+4});t.textContent=h.label;svg.appendChild(t);});}
function wireArpanet(dlg){const svg=dlg.querySelector(".arpa-net");ARPA.down=new Set();drawArpa(svg);
  dlg.querySelector("[data-send]").addEventListener("click",()=>runArpanetPacketDemo(dlg));
  dlg.querySelector("[data-fail]").addEventListener("click",()=>{ARPA.down.add("B");drawArpa(svg);dlg.querySelector(".arpa-note").textContent=(CHAPTER_DATA.ui.arpaFailNote||"Node B down; routes via C.");});
  dlg.querySelector("[data-reset]").addEventListener("click",()=>{ARPA.down=new Set();drawArpa(svg);dlg.querySelector(".arpa-note").textContent=(CHAPTER_DATA.ui.arpaResetNote||"Network restored.");});}
function runArpanetPacketDemo(dlg){dlg=dlg||document.querySelector(".scene-dialog");const svg=dlg.querySelector(".arpa-net");if(!svg)return;drawArpa(svg);
  const path=ARPA.route();const note=dlg.querySelector(".arpa-note");if(!path){if(note)note.textContent=CHAPTER_DATA.ui.arpaNoRoute;return;}
  for(let i=0;i<path.length-1;i++){const A=ARPA.hosts[path[i]],B=ARPA.hosts[path[i+1]];
    [...svg.querySelectorAll("line")].forEach(ln=>{const s=(+ln.getAttribute("x1")===A.x&&+ln.getAttribute("y1")===A.y&&+ln.getAttribute("x2")===B.x&&+ln.getAttribute("y2")===B.y)||(+ln.getAttribute("x1")===B.x&&+ln.getAttribute("y1")===B.y&&+ln.getAttribute("x2")===A.x&&+ln.getAttribute("y2")===A.y);if(s)ln.classList.add("path-active");});}
  if(note)note.textContent=CHAPTER_DATA.ui.arpaRouting+": "+path.join(" → ");
  const pkt=document.createElementNS(SVGNS,"circle");pkt.setAttribute("r","5");pkt.setAttribute("class","packet");svg.appendChild(pkt);
  let seg=0,t=0;function step(){if(seg>=path.length-1){pkt.remove();if(note)note.textContent+="  ✓ "+CHAPTER_DATA.ui.arpaDelivered;return;}
    const A=ARPA.hosts[path[seg]],B=ARPA.hosts[path[seg+1]];t+=0.04;pkt.setAttribute("cx",A.x+(B.x-A.x)*t);pkt.setAttribute("cy",A.y+(B.y-A.y)*t);if(t>=1){t=0;seg++;}requestAnimationFrame(step);}
  requestAnimationFrame(step);}
function renderAll(){renderMap();renderNodeList();renderDetail();renderProgress();}
async function boot(){buildLenses();setLens(state.lens);}
document.addEventListener("DOMContentLoaded",()=>{try{boot();}catch(e){renderEmptyState(CHAPTER_DATA.ui.initError+": "+e.message);}});
</script>
</body></html>
