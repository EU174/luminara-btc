<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Интернетке дейін · Luminara</title><style>
:root{
  --paper:#f6f3ec; --paper2:#efe9dd; --ink:#1c2230; --ink2:#4a5468; --muted:#8a8172;
  --rule:#d9cfbc; --rule2:#e7dfce; --gold:#b7791f; --center:#1c2230;
  --power:#c0392b; --technology:#1f7a5a; --media:#b7791f; --privacy:#6b4fa0; --economy:#a04a7a;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
  --shadow:0 1px 0 rgba(0,0,0,.04),0 10px 30px rgba(60,50,30,.10);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1100px 620px at 50% -8%, #fbf8f1 0%, var(--paper) 60%),var(--paper);
  color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.app-shell{display:grid;grid-template-columns:288px minmax(0,1fr) 340px;gap:20px;padding:22px;min-height:100vh}
.control-rail,.detail-panel{background:linear-gradient(180deg,#fffdf8,var(--paper2));
  border:1px solid var(--rule);border-radius:14px;padding:20px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:16px;min-height:0}
.detail-panel{overflow:auto}
.eyebrow{margin:0;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
#app-title{margin:0;font-family:var(--serif);font-size:30px;line-height:1.05;letter-spacing:-.01em}
.chapter-lede{margin:0;color:var(--ink2);font-size:14px;font-family:var(--serif);font-style:italic;line-height:1.5}
.rail-rule{height:1px;background:linear-gradient(90deg,var(--rule),transparent);margin:2px 0}
.section-h{margin:0;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lens-group{display:flex;flex-wrap:wrap;gap:7px}
.lens-btn{cursor:pointer;border:1px solid var(--rule);background:#fffdf7;color:var(--ink2);
  padding:6px 11px;border-radius:8px;font-size:12.5px;transition:.15s;display:inline-flex;gap:7px;align-items:center;font-weight:500}
.lens-btn:hover{border-color:var(--muted);color:var(--ink)}
.lens-btn[aria-pressed="true"]{border-color:var(--dot);color:var(--ink);background:#fff;box-shadow:0 0 0 1px var(--dot) inset}
.lens-dot{width:9px;height:9px;border-radius:50%;background:var(--dot);display:inline-block}
.lens-desc{margin:0;color:var(--ink2);font-size:12.5px;min-height:3.2em;line-height:1.5;font-family:var(--serif)}
.progress-box{font-size:11.5px;color:var(--muted)}
.progress-bar{height:5px;border-radius:5px;background:var(--rule2);overflow:hidden;margin-top:6px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),#d6a94e);width:0;transition:width .35s}
.node-list{display:flex;flex-direction:column;gap:2px;overflow:auto}
.node-list button{text-align:left;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--ink2);
  padding:8px 9px;border-radius:9px;font-size:13px;display:flex;gap:10px;align-items:baseline;transition:.12s;font-family:var(--serif)}
.node-list button:hover{background:#fffdf6;border-color:var(--rule)}
.node-list button[aria-current="true"]{background:#fff;border-color:var(--dot);color:var(--ink)}
.node-idx{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11px;min-width:16px;font-family:var(--sans)}

.map-stage{position:relative;background:radial-gradient(680px 680px at 50% 46%, #fffdf8 0%, #f4efe4 72%, #efe7d7 100%);
  border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;min-height:600px;display:flex}
.system-map{width:100%;height:100%;display:block}

.ring{fill:none;stroke:var(--rule2);stroke-width:1}
.ring-tick{stroke:var(--rule);stroke-width:1}
.era-label{fill:var(--muted);font-size:10.5px;font-family:var(--sans);font-weight:600;letter-spacing:.03em}

.edge path{fill:none;stroke:var(--rule);stroke-width:1.4;transition:stroke .25s, opacity .25s;opacity:.5;
  stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .9s ease forwards}
.edge.active path{stroke:var(--dot,#b7791f);stroke-width:2;opacity:.92;marker-end:url(#arrow-active)}
@keyframes draw{to{stroke-dashoffset:0}}
.edge-label{fill:var(--muted);font-size:10px;opacity:0;transition:.2s;font-family:var(--sans)}
.edge.active .edge-label{opacity:.9}

.center-halo{fill:#fff;opacity:.6;transform-origin:center;transform-box:fill-box;animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.4;r:74}50%{opacity:.75;r:86}}
.center-ring{fill:none;stroke:var(--dot,#b7791f);stroke-width:2;opacity:.5;transition:stroke .3s}
.center-disc{fill:var(--center);stroke:#000;stroke-opacity:.06}
.center-t1{fill:#fff;font-family:var(--serif);font-size:15px;font-weight:600;text-anchor:middle}
.center-t2{fill:#e9c986;font-family:var(--sans);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;text-anchor:middle}
.spoke{stroke:var(--rule);stroke-width:1;stroke-dasharray:2 4;opacity:.45}

.node{cursor:pointer;opacity:0;animation:pop .5s ease forwards;animation-delay:var(--delay,0s)}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.node{transform-origin:var(--ox) var(--oy);transform-box:view-box}
.node .halo{fill:var(--dot);opacity:.10;transition:.2s}
.node .disc{fill:#fffdf8;stroke:var(--dot);stroke-width:2;transition:.2s;filter:drop-shadow(0 3px 6px rgba(60,50,30,.12))}
.node:hover .disc{stroke-width:2.6}
.node .num{fill:var(--dot);font-family:var(--serif);font-size:15px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.node .cap{fill:var(--ink);font-family:var(--serif);font-size:13px;font-weight:600}
.node .kicker{fill:var(--muted);font-family:var(--sans);font-size:9px;letter-spacing:.1em;text-transform:uppercase}
.node .era{fill:var(--dot);font-family:var(--sans);font-size:9.5px;font-weight:700}
.node.selected .disc{stroke-width:3;fill:#fff}
.node.selected .halo{opacity:.22}
.node.dim{opacity:.32}

.detail-empty{color:var(--ink2);font-size:13.5px;font-family:var(--serif);line-height:1.6}
.detail-kicker{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dot);margin:0;font-weight:600}
.detail-title{margin:5px 0 0;font-family:var(--serif);font-size:21px;line-height:1.15}
.detail-thesis{margin:0;color:var(--ink);font-size:14.5px;font-family:var(--serif);line-height:1.55}
.detail-insight{margin:0;padding:11px 13px;border-left:3px solid var(--dot);background:#fffdf6;border-radius:0 8px 8px 0;font-size:13.5px;font-family:var(--serif);font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11px;color:var(--ink2);background:#fffdf6;border:1px solid var(--rule);border-radius:999px;padding:3px 10px}
.related h4,.sources-block h4{margin:8px 0 5px;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.related-list{display:flex;flex-direction:column;gap:3px}
.related-list button{cursor:pointer;text-align:left;background:#fffdf6;border:1px solid var(--rule);color:var(--ink2);border-radius:8px;padding:7px 9px;font-size:12.5px;font-family:var(--serif)}
.related-list button:hover{border-color:var(--dot);color:var(--ink)}
.sources-block ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.sources-block li{font-size:11.5px;color:var(--ink2);line-height:1.4}
.sources-block a{color:var(--gold);text-decoration:none;border-bottom:1px solid var(--rule)}
.panel-actions{display:flex;gap:8px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.btn{cursor:pointer;border-radius:9px;padding:9px 13px;font-size:13px;border:1px solid var(--rule);background:#fffdf7;color:var(--ink);font-weight:500}
.btn.primary{background:var(--center);color:#fff;border-color:var(--center)}
.btn:hover{filter:brightness(.98)}.btn.primary:hover{filter:brightness(1.15)}
.empty-state{margin:auto;text-align:center;padding:30px;color:var(--ink2);max-width:420px;font-family:var(--serif)}
.empty-state a{color:var(--gold)}

.scene-dialog{border:1px solid var(--rule);background:linear-gradient(180deg,#fffdf8,var(--paper2));
  border-radius:16px;max-width:680px;width:calc(100vw - 40px);padding:0;box-shadow:0 30px 80px rgba(40,30,10,.3)}
.scene-dialog::backdrop{background:rgba(40,32,18,.34);backdrop-filter:blur(2px)}
.dialog-inner{padding:26px 30px}
.dialog-inner h3{margin:2px 0 0;font-family:var(--serif);font-size:26px;line-height:1.12}
.dialog-close{position:absolute;top:14px;right:18px;cursor:pointer;background:transparent;border:none;color:var(--muted);font-size:24px;line-height:1}
.dialog-body{margin:14px 0;color:var(--ink);font-size:15.5px;line-height:1.72;font-family:var(--serif)}
.dialog-body h2{font-size:17px;font-family:var(--serif);margin:18px 0 6px}
.dialog-body p{margin:0 0 12px}
.arpa-wrap{margin-top:14px;border:1px solid var(--rule);border-radius:12px;padding:16px;background:#fffdf6}
.arpa-wrap h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600}
.arpa-svg{width:100%;height:160px;display:block;background:#faf6ec;border-radius:8px;border:1px solid var(--rule2)}
.arpa-note{margin:9px 0 0;color:var(--ink2);font-size:12px;min-height:1.4em;font-family:var(--serif)}
.arpa-net line{stroke:var(--rule);stroke-width:2}
.arpa-net .path-active{stroke:var(--technology);stroke-width:3}
.arpa-net circle.host{fill:#fffdf8;stroke:var(--muted);stroke-width:2}
.arpa-net circle.down{fill:#f6e3e0;stroke:var(--power);stroke-width:2}
.arpa-net .packet{fill:var(--gold)}
.arpa-net text{fill:var(--ink2);font-size:11px;text-anchor:middle;font-family:var(--serif)}

@media (prefers-reduced-motion: reduce){
  .node,.edge path,.center-halo{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}
}
@media (max-width:1060px){
  .app-shell{grid-template-columns:1fr}
  .map-stage{min-height:64vh;order:-1}

}

  .app-shell{padding:12px;gap:12px}

}

<script>
const CHAPTER_DATA = {"chapter": {"key": "preinternet", "title": "Интернетке дейін", "sourceUrl": "https://luminara.tech/#/scene?s=3&c=preinternet", "centralIdea": "Ақпарат билікке айналады", "centerX": 500, "centerY": 445, "ring": 300, "lede": "Ақпарат қалай билікке айналады — тапшылық пен сигналдардан желілік қоғамға дейін.", "lang": "kk"}, "lenses": [{"id": "chronology", "label": "Хронология", "accent": "#7dd3fc", "description": "Оқиғалар реті және ақпарат тапшылығынан дерек ағындарына өту."}, {"id": "power", "label": "Билік", "accent": "#f87171", "description": "Ақпаратты кім бақылайды: институттар, протоколдар, желілер ме, әлде платформалар ма."}, {"id": "technology", "label": "Технологиялар", "accent": "#34d399", "description": "Өнертабыстар мен протоколдар: сигнал, гипермәтін, пакеттер, TCP/IP, Web."}, {"id": "media", "label": "Медиа", "accent": "#fbbf24", "description": "Тарату ортасы қабылдауды, мінез-құлықты және қоғамның ұйымдасуын қалай өзгертеді."}, {"id": "privacy", "label": "Құпиялық", "accent": "#c084fc", "description": "Криптография бақылау мен қадағалаудан қорғаныс ретінде."}], "nodes": [{"id": "scarcity", "sceneIndex": 0, "x": 500.0, "y": 145.0, "type": "power", "title": "Ақпарат тапшылық ретінде", "shortTitle": "Тапшылық", "insight": "Интернетке дейін ақпарат физикалық тұрғыдан қымбат әрі орталықтандырылған болды — бұл оны жабдығы барлардың билік құралына айналдырды.", "body": "## Сөз ақша тұрған әлем\n\nСен мұны экраннан оқып отырсың. Бір дата-орталықта сервер бұл мәтінді саған миллисекундтар ішінде жіберді — әрі бұл саған ештеңе тұрған жоқ. Бұл электр қуаты немесе су құбыры сияқты өзінен-өзі түсінікті көрінеді. Бірақ әрдайым бұлай болған емес. Ал «дейін» қалай болғанын түсіну — тарихи қызығушылық емес, қазіргі интернеттің неге дәл осылай құрылғанын түсінудің кілті. Және оның неге проблема екенін түсінудің кілті.\n\nБар болғаны жетпіс жыл бұрын Киевтен Нью-Йоркке хабарлама жіберу ақша тұратын, бірнеше күн алатын және жабдығы барлардың бақылауында болатын: мемлекеттердің, телеграф компанияларының, газет редакцияларының. Ақпарат тапшылық еді — дәл мұнай немесе астық сияқты. Ал кез келген тапшылық сияқты, ол билік еді. Ақпараттың берілуін бақылаған адам шындықты бақылаған.\n\nXX ғасырдың ортасындағы баспахананы елестет. Алып металл машиналар, қорғасын әріптер, бояу мен майдың иісі. Бір идеяны миллион адамға жеткізу үшін газеттің миллион данасын физикалық түрде басып шығарып, оларды жүк көліктеріне тиеп, бүкіл ел бойынша дүңгіршектерге тарату керек еді. Әр дана ақша тұратын. Жеткізудің әр шақырымы ақша тұратын. Таралымдағы қате — ақша желге ұшты, беделге нұқсан келді. Бұл алып, ауыр, баяу механизм еді.\n\nРадио мен теледидар революция сияқты көрінді — сигнал жарық жылдамдығымен таралады, ешқандай жүк көлігі қажет емес. Бірақ олардың қағидатты шектеуі болды: бір таратқыш, миллиондаған қабылдағыш. Тек мұнарасы бар адам ғана сөйлей алатын. Қалған бүкіл адамзат тыңдайтын. Тұтқаны көтеріп жауап беру мүмкін емес еді. Қарсы уәж айту — мүмкін емес. Өз сөзіңді қосу — мүмкін емес.\n\nИнтернетке дейінгі ақпараттық әлем осылай көрінді: орталықтандырылған, қымбат, бірбағытты. Бірнеше дереккөз көпшілікке хабар таратты. Ақпарат қатаң түрде жоғарыдан төмен қарай ақты — жабдығы барлардан жабдығы жоқтарға. Бұл кездейсоқтық та, жаман ниет те емес — сол уақыт технологияларының физикалық шындығы еді.\n\n> Ақпарат жай ғана ресурс емес еді — ол биліктің архитектурасы еді. Тарату арнасына иелік еткен адам шындыққа иелік етті.\n\nСондықтан осы архитектураны өзгертуге болатынын түсінген алғашқы адамдар революциялық нәрсені ұқты. Жай ғана «деректерді жылдамырақ беруге болады» дегенді емес. «Ақпарат үстіндегі биліктің өз құрылымын бұзуға болады» дегенді. Олар осының үстінде жұмыс істей бастады — алғашқы браузер пайда болғаннан әлдеқайда бұрын.", "tags": ["билік", "тапшылық", "медиа"], "lensWeight": {"chronology": 5, "power": 5, "technology": 1, "media": 4, "privacy": 1}, "angDeg": -90.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Ванневар Буш — As We May Think (1945)", "url": ""}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Элвин Тоффлер — The Third Wave (1980)", "url": ""}, {"title": "Маршалл Маклюэн — Understanding Media (1964)", "url": ""}, {"title": "Николас Негропонте — Being Digital (1995)", "url": ""}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": ""}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": ""}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Мануэль Кастельс — The Information Age (1996–1998)", "url": ""}], "era": "1948 дейін"}, {"id": "shannon", "sceneIndex": 1, "x": 692.8, "y": 215.2, "type": "technology", "title": "Шеннон: ақпарат физикаға айналды", "shortTitle": "Шеннон", "insight": "Шеннон ақпаратты физикалық шама ретінде өлшеп, беруге болатынын дәлелдеді — бұл бүкіл цифрлық әлемнің математикалық іргетасын қалады.", "body": "## Ойды өлшеген адам\n\n1948 жылы америкалық математик Клод Шеннон «Коммуникацияның математикалық теориясы» деген құрғақ техникалық атауы бар еңбегін жариялады. Оны сол кезде аз адам оқыды. Қазір де аз адам оқиды. Бірақ ол әлемді жұрттың бәрі оқитын кітаптардың көбінен көбірек өзгертті.\n\nШеннон мүмкін емес көрінген нәрсені дәлелдеді: кез келген хабарламаны — сөзді, дыбысты, бейнені, санды, сөзбен сипатталған иісті — дәл өлшеуге, сығуға және кез келген байланыс арнасы арқылы беруге болады. Ол өлшем бірлігін «бит» деп атады — binary digit, екілік цифр дегеннен. Нөл немесе бір. Сигнал бар немесе жоқ. Ақпараттың бүкіл ғаламы — нөлдер мен бірлердің комбинациялары.\n\nШеннонға дейін ақпарат бұлыңғыр әрі субъективті нәрсе еді. Кейбір сөздер басқаларынан «маңыздырақ». Кейбір бейнелер «мазмұндырақ». Кейбір хабарламалар «байырақ». Шенноннан кейін ақпарат масса немесе температура сияқты нақты әрі өлшенетін физикалық шамаға айналды. Әлем тек материя мен энергияға ғана бөлінуден қалды. Үшінші нәрсе пайда болды — ақпарат. Бұл үшінші нәрсе алғашқы екеуінен кем емес іргелі болып шықты.\n\n## Мұхит арқылы өткен шам жалыны\n\nШеннонның не істегенін түсіну үшін мынадай тапсырманы елестет: шамның жалынын Киевтен Токиоға жеткізу. Шамның өзін апаруға болады — бірақ бұл баяу, қымбат, әрі жалын жолда өшіп қалады. Бұл материяны жеткізу, ал ол физикалық заңдармен шектелген.\n\nБірақ жалынды сипаттауға болады: оның түсін, биіктігін, температурасын, пішінін, балауыздың химиялық құрамын. Осы сипаттаманы сым арқылы жарық жылдамдығымен жіберуге болады. Ал Токиодағы басқа адам дәл сондай жалынды жағады. Бұл ақпаратты жеткізу — және ол физикалық шектеулерді білмейді.\n\nШеннон осы екінші тәсілді абсолютті дәл, сенімді және масштабталатын етуге болатынын көрсетті. Кез келген сигналды биттерге кодтап, бұрмаланусыз жіберіп, арғы жақта қайта қалпына келтіруге болатынын дәлелдеді. Бүкіл цифрлық әлем осының үстінде тұр: электрондық поштадан 4K стримингке дейін, мессенджерлерден блокчейнге дейін.\n\nСен Telegram-да хабарлама жіберген сайын — Шеннон жұмыс істейді. Блокчейндегі транзакция желі түйіндері арасында берілген сайын — Шеннон жұмыс істейді. Ол бүкіл цифрлық әлем салынған математикалық іргетасты жасады.\n\n> Шеннон интернетті ойлап тапқан жоқ. Ол интернеттің мүмкін екенін дәлелдеді — ақпаратты физикалық шама сияқты дәл беруге болатынын көрсетті.\n\nПарадокс мынада: Шеннонның өзі Bell Laboratories-те — әлемдегі ең ірі телефон монополиясында жұмыс істеді. Оның жаңалығы ақырында өз жұмыс берушісінің монополиясын қиратты. Ақпаратты кез келген арна арқылы беруге болатын кезде, ешбір арна мәңгілік монополист бола алмайды.", "tags": ["сигнал", "кодтау", "өлшеу"], "lensWeight": {"chronology": 4, "power": 2, "technology": 5, "media": 2, "privacy": 2}, "angDeg": -50.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Ванневар Буш — As We May Think (1945)", "url": ""}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Элвин Тоффлер — The Third Wave (1980)", "url": ""}, {"title": "Маршалл Маклюэн — Understanding Media (1964)", "url": ""}, {"title": "Николас Негропонте — Being Digital (1995)", "url": ""}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": ""}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": ""}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Мануэль Кастельс — The Information Age (1996–1998)", "url": ""}], "era": "1948"}, {"id": "memex", "sceneIndex": 2, "x": 795.4, "y": 392.9, "type": "media", "title": "Буштың Memex-і: уақытынан озған арман", "shortTitle": "Memex", "insight": "Ванневар Буш 1945 жылы гипермәтін мен байланысқан білімді сипаттады — Web-тен 46 жыл бұрын. Дұрыс идеялар өлмейді, олар өз технологияларын күтеді.", "body": "## Интернеттен қырық жыл бұрынғы гипермәтін\n\nӘлі 1945 жылы — алғашқы толыққанды компьютер пайда болудан екі жыл бұрын және World Wide Web-ке қырық алты жыл қалғанда — америкалық ғалым Ванневар Буш «Біз қалай ойлай аламыз» атты эссе жазды. Ол ғылыми журналда емес, кең аудиторияға арналған бұқаралық басылым The Atlantic-те жарияланды. Буш оны тек ғалым әріптестері емес, бәрі оқығанын қалады.\n\nОл «мемекс» деп атаған құрылғыны сипаттады — memory extender, жадты кеңейткіш дегеннен. Бұл адамзаттың барлық білімін қамтитын жеке кітапхана еді, онда кез келген құжат кез келген басқа құжатпен мағынасы арқылы байланысқан. Наполеон туралы мақала оқисың — бір қимылмен оның жорықтарының картасына өтесің. Картадан — оның генералдарының хаттарына. Хаттардан — XX ғасыр әскери тарихшыларының оның тактикасын талдауына. Әліпби бойынша каталогтан іздемейсің, сөрелерді ақтармайсың — ойдың өзі жүретіндей, ой тізбегімен ілесесің.\n\nБұл гипермәтін еді. Бұл сөз ресми түрде ойлап табылғаннан қырық жыл бұрын. Тим Бернерс-Ли бұл идеяны World Wide Web түрінде іске асырғаннан қырық алты жыл бұрын.\n\n## Неге арман үстел тартпасында жатты\n\nБуш болашақты мүлде анық көрді: білім байланысқан, әркімге қолжетімді және бәріне тиесілі болуы керек. Бір ғана проблема болды — технологиялар әлі жоқ еді. 1945 жылы компьютерлер тұтас бөлмелерді алып жататын, ұшақтай қымбат тұратын және тек есептей алатын. Дисплейлер де, тышқандар да, желілер де жоқ. Буш құрылғыны микрофильмдер мен механикалық иінтіректер арқылы сипаттады — өйткені аналогия үшін оның қолында бар нәрсе осы ғана еді.\n\nОның арманы жарты ғасырға жуық үстел тартпасында жатты. Бірақ ол ұмытылған жоқ. Оны оқыды, дәйексөз етті, қолдан-қолға берді. Тед Нельсон 1965 жылы «гипермәтін» сөзін ойлап тапты — Буштан тікелей шабыт алып. Дуглас Энгельбарт компьютер тінтуірін және гипермәтіндік құжаттар жүйесін жасады — ол да Буштың ықпалымен.\n\nТим Бернерс-Ли 1989 жылы CERN-де Web құруға арналған өтінімін жазғанда, ол Буштың эссесін бастапқы идея ретінде тікелей атады. Жарияланғаннан қырық төрт жыл өткен соң, арман ақыры іске асыратын құралдарға ие болды.\n\nБұл оқиға тарихи қызық ретінде емес, маңызды. Ол қағидатты нәрсені көрсетеді: дұрыс идея өлмейді. Ол өз сәтін күтеді. Кейде ондаған жылдар бойы. Бүгін біз ұқсас сәтті бастан өткеріп жатырмыз: пайдаланушылар өз деректеріне иелік ететін орталықсыздандырылған интернет идеялары блокчейннен әлдеқайда бұрын болған. Технологиялар жай ғана ақыры сол пайымға жетті.\n\n> Буш World Wide Web-ті оның ойлап табылуынан қырық алты жыл бұрын сипаттады. Пайғамбар болғандықтан емес — адам ақылы білім құралдарынан не қалайтынын түсінгендіктен.\n\nПарадокс мынада: Буш 1945 жылы идеялар арасындағы байланыстар туралы ойлады — ал біз ақырында идеялар арасындағы байланыстардан гөрі адамдар арасындағы байланыстар маңыздырақ болып шыққан интернет алдық. Бұл маңызды айырмашылық, біз оған келесі тарауларда қайта ораламыз.", "tags": ["гипермәтін", "білім", "байланыстар"], "lensWeight": {"chronology": 4, "power": 2, "technology": 4, "media": 5, "privacy": 1}, "angDeg": -10.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Ванневар Буш — As We May Think (1945)", "url": ""}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Элвин Тоффлер — The Third Wave (1980)", "url": ""}, {"title": "Маршалл Маклюэн — Understanding Media (1964)", "url": ""}, {"title": "Николас Негропонте — Being Digital (1995)", "url": ""}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": ""}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": ""}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Мануэль Кастельс — The Information Age (1996–1998)", "url": ""}], "era": "1945"}, {"id": "arpanet", "sceneIndex": 3, "x": 759.8, "y": 595.0, "type": "technology", "title": "ARPANET: интернет қорқыныштан туды", "shortTitle": "ARPANET", "insight": "ARPANET бірыңғай істен шығу нүктесі жоқ әскери байланыс жүйесі ретінде жасалды — дәл осы орталықсыздандырылған архитектура бүкіл интернеттің іргетасына айналды.", "body": "## Әлем архитектурасын өзгерткен спутник\n\nИнтернет тарихы Кремний алқабында да, университет аудиторияларында да басталмайды. Ол Пентагонда, қырғи-қабақ соғыстың қызған кезінде, өткір геосаяси қорқыныш сәтінде басталады.\n\n1957 жылғы 4 қазанда Кеңес Одағы Жердің алғашқы жасанды серігін ұшырды. Диаметрі 58 сантиметр, салмағы 83 килограмм болатын кішкентай металл шар Жердің үстімен ұшып, дыбыс шығарып тұрды — оны бүкіл әлем естіді. Америкалық әскерилер үшін бұл бәсекелестің жай ғана технологиялық триумфы емес еді. Бұл дабыл белгісі болды: жау орбитаны бақылап отыр. Егер олар серік ұшыра алса, ядролық оқтұмсығы бар зымыранды да ұшырып, планетаның кез келген нүктесіне жеткізе алады.\n\nБір жылдан кейін АҚШ DARPA — Перспективалық зерттеу жобалары агенттігін құрды. Оның алдында бір міндет тұрды: бір соққымен жойып жіберуге болмайтын әскери байланыс жүйесін жасау. Дәстүрлі телефон желілері апатты түрде осал еді: орталық телефон станциясы бар жерде істен шығу нүктесі де бар. Пентагонға түскен бір бомба — бүкіл әскермен байланыс жоғалады.\n\n## Орталығы жоқ желі — бәрін өзгерткен идея\n\nDARPA инженерлері түбегейлі басқа шешім ойлап тапты. Ал орталықты мүлде алып тастаса ше? Желінің әрбір түйінін тең құқықты ету. Біреуі істен шықса, хабарлама автоматты түрде басқа маршрут табады. Құбырдағы су сияқты: бір құбыр жабылса, су айналма жол табады.\n\nБұл идея ARPANET деп аталды. 1969 жылы ол алғаш рет жұмыс істеді: төрт университет — UCLA, Стэнфорд, UC Санта-Барбара және Юта — телефон желісі арқылы деректер алмасты. Жіберуге тырысқан алғашқы хабарлама \"login\" сөзі болды. Жүйе \"o\" әрпінен кейін істен шықты. Прото-интернет арқылы берілген алғашқы сөз \"lo\" болды — ағылшынша \"қара\" деген мағына береді. Кездейсоқ поэзия.\n\nОл кезде ешкім мұның жаһандық азаматтық интернеттің іргетасына айналатынын ойлаған жоқ. Әскерилер ядролық соғыс жағдайына арналған сенімді байланыс қалады. Олар бұдан да үлкен нәрсе жасады — билік құрылымдық түрде бір нүктеге шоғырлана алмайтын архитектура. Таратылған желі табиғаты бойынша орталықтандыруға төзімді.\n\nКем дегенде, бастапқы ой осындай еді. Шындық күрделірек болып шықты — бұл туралы келесі тарауларда сөйлесеміз.\n\n> Интернет ядролық соққыға төзімді әскери байланыс жүйесі ретінде жасалды. Ақырында ол биліктің кез келген орталықтануына төзімді болып шықты — бұл оның басты саяси қасиетіне айналды.\n\n1974 жылы Винтон Серф пен Роберт Кан келесі мәселені шешті: әртүрлі компьютерлер әртүрлі тілде сөйлейтін. Стэнфорд желісі MIT желісін түсінбейтін. Олар TCP/IP жасады — әмбебап протокол, кез келген желілер арасында дерек беруге арналған ортақ тіл. Деректер шағын пакеттерге бөлінеді, әрқайсысы өз жолын табады, ал екінші шетінде қайта жиналады. Хатты бөліктерге бөліп, әрқайсысын жеке курьермен жібергендей — сонда да олар алушыда дұрыс ретпен қайта жиналады. Дәл осы протокол интернеттің негізінде бүгін де жатыр — жасалғанына елу жыл өтсе де.", "tags": ["пакеттер", "DARPA", "TCP/IP", "орталықсыздандыру"], "lensWeight": {"chronology": 5, "power": 5, "technology": 5, "media": 2, "privacy": 3}, "angDeg": 30.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Ванневар Буш — As We May Think (1945)", "url": ""}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Элвин Тоффлер — The Third Wave (1980)", "url": ""}, {"title": "Маршалл Маклюэн — Understanding Media (1964)", "url": ""}, {"title": "Николас Негропонте — Being Digital (1995)", "url": ""}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": ""}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": ""}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Мануэль Кастельс — The Information Age (1996–1998)", "url": ""}], "era": "1969"}, {"id": "open-web", "sceneIndex": 4, "x": 602.6, "y": 726.9, "type": "technology", "title": "Бернерс-Ли: бәрін тегін беру шешімі", "shortTitle": "Ашық Web", "insight": "Бернерс-Ли Web-ті тегін берді — альтруизмнен емес, тек ашық протокол ғана жаһандық бола алатынын түсінгендіктен.", "body": "## \"Бұлыңғыр, бірақ қызық\" деген белгі қойылған өтінім\n\n1989 жылы жас британдық бағдарламашы Тим Бернерс-Ли Женевадағы CERN — Еуропалық ядролық зерттеулер орталығында жұмыс істеді. Бұл әлемдегі ең ірі ғылыми институт: ондаған елден келген мыңдаған ғалым бір эксперименттермен айналысады, бірақ үнемі құжаттарды жоғалтады, контексті ұмытады, өздеріне дейін не жасалғанын түсіну үшін айлар жұмсайды.\n\nБернерс-Ли басшылыққа ішкі өтінім жазды. Мәні: барлық құжаттар сілтемелер арқылы байланысқан және желідегі кез келген компьютерден қолжетімді болатын жүйе құру. Оның басшысы Майк Сендалл шетіне үш сөз жазды: \"Бұлыңғыр, бірақ қызық\". Бұл әлемді өзгертетін өнертабысқа берілген ең қарапайым рецензия еді.\n\nҮш жыл ішінде Бернерс-Ли қазіргі бүкіл интернет сүйенетін үш нәрсені жасады: HTML — құжаттарды белгілеу тілі, HTTP — оларды беру протоколы, және URL — адрестеу жүйесі. Олар бірге World Wide Web құрды. Құжаттар серверлерде сақталады, адрестері бар, сілтемелермен байланысқан және браузер бағдарламасы арқылы ашылады. Қарапайым, әсем, әмбебап.\n\n## Дәуірді айқындаған шешім\n\nБірақ негізгі шешім техникалық емес еді. Ол этикалық шешім болды.\n\nБернерс-Ли өз өнертабысын патенттей алатын еді. CERN заңгерлері осыны ұсынды. Егер әрбір сайт HTTP қолданғаны үшін роялти төлесе, Бернерс-Ли планетадағы ең бай адамға айналар еді. Оның орнына ол технологияны адамзатқа тегін беруді талап етті — шектеусіз, лицензиясыз, шартсыз.\n\n\"Егер Web патенттелген немесе бір компанияның бақылауында болған болса, ол өмір сүрмес еді\", — деп кейін түсіндірді ол. Бұл альтруизм үшін жасалған альтруизм емес еді. Бұл стратегия болатын: желі тек кедергілерсіз ғана жаһандық ауқымға өсе алды. Кез келген адам рұқсатсыз сайт жасай алса ғана желі шын мәнінде ашық болады.\n\n1993 жылы АҚШ Ұлттық суперкомпьютерлік орталығының студенттері Mosaic браузерін шығарды — мәтін мен суреттерді бір экранда бірге көрсеткен алғашқы браузер. Бұған дейін интернет мәтін әлемі болатын. Mosaic оны визуалды етті. Бағдарламалауды ешқашан оқымаған қарапайым адамға түсінікті етті.\n\nСол жылы веб-сайттар саны бес жүзден асты. Қазір бұл күлкілі естіледі, бірақ ол кезде бұл жарылыс еді. Екі жылдан кейін олардың саны екі жүз мыңға жетті. Жарыс басталды.\n\n> Бернерс-Ли Web-ті тегін берді — сөйтіп оны жаһандық етті. Егер ол оны патенттегенде, біз әлі күнге дейін әрбір сілтеме үшін роялти төлер едік.\n\nБернерс-Ли туралы бұл оқиға жай ғана өмірбаяндық дерек емес. Бұл желілердің табиғаты туралы сабақ: ашық протоколдар жабық протоколдарға қарағанда тез өседі, өйткені кез келген адам олардың үстіне құра алады. Ethereum блокчейні дәл сондықтан ашық. TON дәл сондықтан ашық протокол. Бернерс-Ли 1991 жылы қандай технологиялар жеңетінін әлі күнге дейін айқындайтын қағиданы қалады.", "tags": ["Web", "протокол", "ашықтық"], "lensWeight": {"chronology": 5, "power": 4, "technology": 5, "media": 4, "privacy": 2}, "angDeg": 70.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Ванневар Буш — As We May Think (1945)", "url": ""}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Элвин Тоффлер — The Third Wave (1980)", "url": ""}, {"title": "Маршалл Маклюэн — Understanding Media (1964)", "url": ""}, {"title": "Николас Негропонте — Being Digital (1995)", "url": ""}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": ""}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": ""}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Мануэль Кастельс — The Information Age (1996–1998)", "url": ""}], "era": "1991"}, {"id": "atoms-to-bits", "sceneIndex": 5, "x": 397.4, "y": 726.9, "type": "economy", "title": "Атомдардан биттерге: экономикалық логиканың ауысуы", "shortTitle": "Атомдар → биттер", "insight": "\"Атомдардан биттерге\" өту — бұл жай ғана технология емес, экономикалық логиканың ауысуы: бірдей нәрсенің ауқымынан әрбір өзара әрекеттесудің бірегейлігіне қарай.", "body": "## Тоффлер мұны 1980 жылы көрді\n\n1980 жылы Элвин Тоффлер \"Үшінші толқынды\" жариялаған кезде, дербес компьютерлер жоқтың қасы еді. Интернет болған жоқ. Ұялы телефондар болған жоқ. Соған қарамастан ол тек қырық жылдан кейін толық ашылған экономикалық трансформацияны сипаттады.\n\nТоффлер адамзат өркениетінің үш дәуірін сипаттады. Бірінші толқын — аграрлық: жер мен өнім басты құндылық ретінде. Екінші толқын — өнеркәсіптік: конвейер, стандарттау, тираж. Зауыт мың бірдей тоңазытқыш шығарады — бұл дәл олардың бірдей болғаны үшін тиімді. Өнім бірлігі көбейген сайын әрқайсысының өзіндік құны төмендейді. Ауқым — индустриялық экономиканың жеңісі.\n\nҮшінші толқын — ақпараттық. Мұнда логика түбегейлі төңкеріледі. Ақпараттық экономикада көшіру тегін. Бір бағдарлама бір уақытта миллиард пайдаланушымен әртүрлі әрекет ете алады — бұл баг емес, басты артықшылық. Құндылық бірдей нәрсені көбейту арқылы емес, әрбір өзара әрекеттесудің бірегейлігі арқылы жасалады.\n\n## Николас Негропонте және ең қарапайым формула\n\n1995 жылы MIT Media Lab директоры Николас Негропонте мұны қанатты сөзге айналған бір тіркеспен тұжырымдады: \"атомдардан биттерге\".\n\nАтомдар — физикалық әлем. Тоңазытқыш шығару үшін металл, пластик, электроника, жұмыс күші, зауыт керек. Оны сатып алушыға жеткізу үшін жүк көлігі, қойма, дүкен керек. Әр көшірме ақша тұрады. Тираж ресурстармен шектеледі. Бір миллион тоңазытқыш сатқың келсе, бір миллион тоңазытқыш өндіруің керек.\n\nБиттер — цифрлық әлем. Бағдарлама жасау үшін бір әзірлеуші және бір компьютер керек. Оны миллиард пайдаланушыға жеткізу үшін сервер мен интернет байланысы керек. Көшіру іс жүзінде тегін. Жеткізу лезде. Тираж шексіз. Бағдарламаның миллиард көшірмесін сатқың келсе, миллиард бағдарлама өндіруің қажет емес. Бір көшірме миллиард рет репликацияланады.\n\nБұл жай ғана технологиялық айырмашылық емес. Бұл іргелі экономикалық логиканың ауысуы. XX ғасырдың бүкіл экономикасы атомдар логикасына құрылды: тапшылық, ауқым, стандарттау. XXI ғасыр экономикасы биттер логикасына құрылады: молшылық, жекелендіру, желілік әсерлер.\n\n> Индустриялық экономика бірдей нәрсенің ауқымынан табыс тапты. Ақпараттық экономика әрбір өзара әрекеттесудің бірегейлігінен табыс табады. Бұл қарама-қарсы логикалар.\n\nОсы айырмашылықты түсінгенде, қазіргі әлемдегі көп нәрсе түсіндіріле бастайды. Неге Google тегін? Өйткені іздеу нәтижесін көшіру ештеңе тұрмайды — монетизация жарнама арқылы жүреді. Неге Spotify музыканттарға тиын-тебен төлейді? Өйткені бір стримнің шекті құны нөлге ұмтылады. Неге криптовалюталар мүлде мүмкін? Өйткені цифрлық активтерді физикалық тасымалдаушысыз беруге болады. Мұның бәрі Негропонте үш сөзбен тұжырымдаған бір қағиданың салдары.", "tags": ["экономика", "биттер", "ауқым"], "lensWeight": {"chronology": 4, "power": 4, "technology": 3, "media": 3, "privacy": 1}, "angDeg": 110.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Ванневар Буш — As We May Think (1945)", "url": ""}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Элвин Тоффлер — The Third Wave (1980)", "url": ""}, {"title": "Маршалл Маклюэн — Understanding Media (1964)", "url": ""}, {"title": "Николас Негропонте — Being Digital (1995)", "url": ""}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": ""}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": ""}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Мануэль Кастельс — The Information Age (1996–1998)", "url": ""}], "era": "1995"}, {"id": "media-effects", "sceneIndex": 6, "x": 240.2, "y": 595.0, "type": "media", "title": "Маклюэн және Рашкофф вирустары: медиа бізді өзгертеді", "shortTitle": "Медиа", "insight": "Маклюэн мен Рашкофф түсінді: маңыздысы ақпарат емес, оны жеткізетін орта. Медиа бізді мазмұнға тәуелсіз - біз байқамайтын құрылым арқылы өзгертеді.", "body": "## Жеткізу құралы хабарламадан маңыздырақ\n\nМаршалл Маклюэн қолайсыз ойшыл еді. 1964 жылы ол әуелі мағынасыздық деп қабылданған, кейін метафора саналған, ал содан соң ғана шындықтың дәл техникалық сипаттамасы ретінде түсінілген сөйлем жазды: «Жеткізу құралының өзі - хабарлама».\n\nОл нені меңзеді? 1950-жылдары бұқаралық теледидар пайда болғанда, бәрі мазмұн туралы дауласты: бағдарламалар жақсы ма, жаман ба, білім бере ме, көңіл көтере ме, насихат па, өнер ме. Маклюэн: бұл екінші кезектегі сұрақ деді. Теледидардың өзі - орта ретінде, технология ретінде, қабылдау тәсілі ретінде - нақты не көрсетілсе де, қоғамды өзгертіп қойды.\n\nТеледидар тарихта алғаш рет миллиондаған адамды синхрондады: бір жаңалық, бір уақытта, бір сөздермен - елдің барлық үйінде бір мезетте. Ол Маклюэн «жаһандық ауыл» деп атаған нәрсені - бәрі бір оқиғаны бір уақытта бастан кешіретін әлемді қалыптастырды. Теледидарға дейін әр қаладағы адамдар әртүрлі ақпараттық шындықта өмір сүрді. Одан кейін - бір шындықта.\n\n## Рашкоффтың биологиялық метафорасы\n\n1994 жылы америкалық медиа теоретигі Дуглас Рашкофф Маклюэн идеясына биологиялық метафора қосты, ол одан да дәлірек болып шықты. *Media Virus!* кітабында ол бүгінде вирустық контент деп аталатын механизмді сипаттады - YouTube-тен он жыл, TikTok-тан жиырма жыл бұрын.\n\nИдеялар вирус сияқты таралады. Олар шынайы болғандықтан емес. Пайдалы болғандықтан емес. Олар аудиторияның психологиялық осал тұсына - адамдарды әрі қарай таратуға итермелейтін нәрсеге дәл тигендіктен: қорқынышқа, наразылыққа, қуанышқа, танып-білу сезіміне, ашуға, елжіреуге. Эмоция - идеяның көбею механизмі.\n\nРашкофф көрсетті: күшті эмоция тудыратын контент өзінің шынайылығына немесе пайдалылығына тәуелсіз таралады. Даулы жаңалық шынайы жаңалықтан жылдамырақ тарайды. Қорқынышты оқиға іш пыстырарлық оқиғадан жылдамырақ тарайды. Бұл кездейсоқтық та, манипуляция да емес - бұл медиа ортаның архитектуралық ерекшелігі. Вирус иесін «жақсы адам ба, жаман адам ба» деген өлшеммен таңдамайды. Ол «осал ма, жоқ па» деген өлшеммен таңдайды.\n\nДәл осыған оңтайландырылған TikTok алгоритмдерінен әлдеқайда бұрын Рашкофф олардың негізінде жатқан қағиданы сипаттап берді. Алгоритм вирустылықты жасаған жоқ. Ол оны күшейтуді ғана үйренді.\n\n> Маклюэн ескерткен: маңыздысы бағдарлама емес, теледидар. Рашкофф нақтылады: маңыздысы идея емес, оның тудыратын эмоциясы. Екеуі бірге қазіргі әлеуметтік желілердің архитектурасын олар пайда болардан отыз жыл бұрын сипаттап берді.\n\nИнтернет пайда болғанда, алғашқы сұрақ қайтадан мазмұн туралы болды: адамдар онда не оқып, не көреді? Маклюэн: сұрақ дұрыс емес дер еді. Дұрысы - адам уақытының барған сайын көбін өткізетін ортаның өзі оған не істейді? Бұл сұрақ әлеуметтік желілер пайда болғанда аса маңызды болды. Өкінішке қарай, ол тым кеш қойылды.", "tags": ["медиа", "мінез-құлық", "қабылдау"], "lensWeight": {"chronology": 3, "power": 3, "technology": 1, "media": 5, "privacy": 2}, "angDeg": 150.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Ванневар Буш — As We May Think (1945)", "url": ""}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Элвин Тоффлер — The Third Wave (1980)", "url": ""}, {"title": "Маршалл Маклюэн — Understanding Media (1964)", "url": ""}, {"title": "Николас Негропонте — Being Digital (1995)", "url": ""}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": ""}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": ""}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Мануэль Кастельс — The Information Age (1996–1998)", "url": ""}], "era": "1964–1990-жж."}, {"id": "cypherpunks", "sceneIndex": 7, "x": 204.6, "y": 392.9, "type": "privacy", "title": "Хьюз және шифрпанктер: приваттық - бұл математика", "shortTitle": "Шифропанктер", "insight": "Хьюз 1993 жылы приваттық дағдарысын болжап, математикалық қорғанысты талап етті - оның манифесі Bitcoin мен бүкіл Web3-тің идеологиялық іргетасына айналды.", "body": "## Алдын ала ескерткен дауыс\n\n1993 жылы, көпшілік «интернет» деген сөзді алғаш ести бастаған кезде, математик әрі криптограф Эрик Хьюз үш беттен тұратын құжат жазды. Ол «Шифрпанк манифесі» деп аталды және криптографиямен айналысып, ашық желінің пайда болуы қандай салдарға әкелетінін ойлаған шағын қауымдастықтың тарату тізімінде жарияланды.\n\nОл кезде интернет қарапайым адамдарға енді ғана қолжетімді бола бастаған. Алғашқы браузерлер жаңа ғана пайда болған. Желіде приваттық туралы әлі ешкім ойлаған жоқ - адамдар жаңа мүмкіндіктерге жай ғана қуанды: планетаның арғы шетіндегі адамдармен хат алмасуға болады! Жаңалықтарды нақты уақытта оқуға болады! Кез келген ақпаратты табуға болады!\n\nХьюз басқаша ойлады. Оның уәжі қарапайым әрі берік еді: ашық интернет желідегі әр әрекетің ықтимал түрде бәріне - провайдерлерге, мемлекеттерге, корпорацияларға көрінеді дегенді білдіреді. Бұл кездейсоқ осалдық емес. Бұл жүйенің архитектуралық ерекшелігі: оны әдейі ме, жоқ па, дәл осылай құрған. Мұндай жағдайда приваттықты қорғаудың жалғыз жолы - провайдерлер мен мемлекеттерден рұқсат сұрау емес, математиканы қолдану. Криптографияны. Ешбір заң бұза алмайтын математиканы.\n\n## Сөзбе-сөз орындалған болжам\n\nХьюз 1993 жылы былай деп жазды: «Ашық қоғамдағы приваттық анонимді транзакциялар жүйесін талап етеді». Бұл ғылыми фантастика сияқты естілді. Оқырмандардың көбі иығын қиқаң еткізді: «Менің жасыратын ештеңем жоқ». Қарапайым адамға анонимді транзакциялар не үшін керек?\n\nОтыз жылдан кейін біз корпорациялар пайдаланушылар туралы олардың жақындарынан да көп білетін әлемде өмір сүріп жатырмыз. Дерек ағулары күнделікті жаңалыққа айналған әлемде. Карта арқылы жасалған әр сатып алу, әр іздеу сұрауы, қосулы телефонмен жасалған әр қозғалыс жазылып, сақталатын әлемде. Хьюз параноик болған жоқ. Ол жай ғана бірнеше жүріс ілгері ойлады.\n\nШифрпанктер - 1990-жылдардың басында осы идеяның айналасына жиналған шағын қауымдастық - ақырында Bitcoin үшін идеологиялық іргетас қалады. Сатоши Накамото 2008 жылы Bitcoin сипаттамасын дәл шифрпанктердің тарату тізімінде жариялады. Бұл Хьюз сұрағына тікелей жауап болды: міне, сендердің делдалға сенімге емес, математикаға құрылған анонимді транзакциялар жүйелерің.\n\nСтюарт Брэнд 1984 жылдың өзінде ашық интернеттің манифесіне айналған сөйлемді айтты: «Ақпарат еркін болғысы келеді». Ол ақпараттың табиғатын меңзеді - көшірілгенде ол азаймайды, сондықтан жасанды тосқауылдар оның табиғатына қайшы. Хьюз мұны басқа жағынан толықтырды: приваттықсыз ақпарат еркіндігі - еркіндік емес, бақылап отырғандар үшін мөлдірлік.\n\n> Брэнд айтты: ақпарат еркін болғысы келеді. Хьюз жауап берді: ал приваттық математикамен қорғалғысы келеді. Екеуі бірге цифрлық еркіндіктің екі полюсін сипаттады.\n\nБұл екі қағида - ашықтық пен приваттық - белгілі бір мағынада бір-біріне қайшы. Олардың арасындағы кернеу интернет қандай болуы керек деген негізгі дауларды әлі күнге дейін айқындайды. Білімді бәріне қолжетімді етіп, сонымен бірге әр адамның жеке деректерін қалай қорғауға болады? Бұл сұрақ әлі шешілген жоқ. Web3 дәл осыны шешуге тырысып жатыр.", "tags": ["криптография", "құпиялық", "қадағалау"], "lensWeight": {"chronology": 3, "power": 4, "technology": 4, "media": 2, "privacy": 5}, "angDeg": 190.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Ванневар Буш — As We May Think (1945)", "url": ""}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Элвин Тоффлер — The Third Wave (1980)", "url": ""}, {"title": "Маршалл Маклюэн — Understanding Media (1964)", "url": ""}, {"title": "Николас Негропонте — Being Digital (1995)", "url": ""}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": ""}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": ""}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Мануэль Кастельс — The Information Age (1996–1998)", "url": ""}], "era": "1993"}, {"id": "castells", "sceneIndex": 8, "x": 307.2, "y": 215.2, "type": "power", "title": "Кастельс: билік ағындарға өтті", "shortTitle": "Ағындар", "insight": "Кастельс көрсетті: билік орындарды бақылаудан деректер мен назар ағындарын бақылауға өтті - бұл оны көрінбейтін әрі дау айту қиын етті.", "body": "## Байқалмай қалған революция\n\n1990-жылдардың ортасына қарай испан әлеуметтанушысы Мануэль Кастельс бәрінің көз алдында болып жатқан өзгерісті бақылап, көпшілік байқамаған нәрсе туралы үш томдық еңбек жазды. Ақпараттық революция әлдеқашан болып қойған еді. Тек адамдар оны басқа жерден іздеді.\n\nОлар ұшатын көліктерді және асүйдегі роботтарды күтті. Олар 1960-жылдардағы ғылыми-көпшілік журналдар уәде еткен фантастикалық болашақты күтті. Ал революция банктердің сервер бөлмелерінде, жаһандық корпорациялардың логистикалық орталықтарында, құрлықтар арасындағы қаржы ағындарында жүріп жатты. 1990-жылдарға қарай ақша физикалық болудан қалған - ол серверлер арасындағы дерек ағындарына айналды. Өндіріс жергілікті болудан қалды - ол дизайн Калифорнияда жасалатын, бөлшектер Қытайда өндірілетін, Вьетнамда құрастырылатын, ал барлық жерде сатылатын жеткізушілердің жаһандық желісіне айналды. Билік аумақпен өлшенуден қалды.\n\n## Орындар кеңістігі мен ағындар кеңістігі\n\nКастельс қазіргі әлемді түсінуге көмектесетін айырмашылық енгізді. Ескі билік «орындар кеңістігін» бақылаған: зауыттарды, порттарды, шекараларды, аумақтарды. Басып алуға, қорғауға, ұстап тұруға болатын физикалық нүктелерді. Жаңа билік «ағындар кеңістігін» бақылайды: деректерді, капиталды, назарды, ақпаратты.\n\nБұл биліктің түбегейлі бөлек түрлері. Аумақтық билікті картадан көруге болады - міне шекара, міне әскер, міне қамал. Ағындар үстіндегі билік көрінбейді. Google билігі қайда орналасқан? Еш жерде де, барлық жерде де бір мезетте. Facebook билігі қайда орналасқан? Миллиардтаған адамның не көретінін анықтайтын алгоритмде. Bitcoin билігі қайда орналасқан? Физикалық мекені жоқ таратылған желіде.\n\nКастельс көрсетті: ағындарды кім басқарса, әлемді сол басқарады. Бұл байқау қорқынышты дәл болып шықты. Бес-алты технологиялық компания планетадағы ақпараттық ағындардың көп бөлігін бақылайды. Олар аумақтарға иелік етпейді. Олар адамдардың не көретінін, не оқитынын, не сатып алатынын және неге сенетінін анықтайтын алгоритмдерге иелік етеді.\n\nДаниел Белл 1973 жылдың өзінде басты ресурс ақпарат болатын, ал басты институттар зауыттар емес, университеттер мен зерттеу зертханалары болатын постиндустриялық қоғамға өтуді болжаған. Кастельс 1990-жылдары мұның болғанын көрді - бірақ ақпарат үстіндегі билік университеттерде емес, мүлде басқа жерде шоғырланды.\n\n> Ескі билік орындарды бақылаған. Жаңа билік ағындарды бақылайды. Ал ағындарға дау айту аумаққа дау айтудан әлдеқайда қиын.\n\nБүкіл курс арқылы өтетін негізгі сұрақ осы: ақпарат басты ресурс болған әлемде билік қалай құрылған? Оны кім бақылайды? Ол қалай шоғырланады? Бірнеше корпорация планетадағы ақпараттық ағындардың басым бөлігін бақылауға алғанда не болады? Келесі тараулар - осы туралы.", "tags": ["ағындар", "қоғам", "билік"], "lensWeight": {"chronology": 4, "power": 5, "technology": 2, "media": 4, "privacy": 3}, "angDeg": 230.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Ванневар Буш — As We May Think (1945)", "url": ""}, {"title": "Даниел Белл — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Элвин Тоффлер — The Third Wave (1980)", "url": ""}, {"title": "Маршалл Маклюэн — Understanding Media (1964)", "url": ""}, {"title": "Николас Негропонте — Being Digital (1995)", "url": ""}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": ""}, {"title": "Стюарт Брэнд — Information Wants to Be Free (1984)", "url": ""}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Мануэль Кастельс — The Information Age (1996–1998)", "url": ""}], "era": "1996"}], "edges": [{"from": "scarcity", "to": "shannon", "label": "тапшылықтан өлшеуге", "lenses": ["chronology", "technology"]}, {"from": "shannon", "to": "arpanet", "label": "сигнал желіге айналады", "lenses": ["chronology", "technology"]}, {"from": "memex", "to": "open-web", "label": "гипермәтін Web-ке айналады", "lenses": ["chronology", "media", "technology"]}, {"from": "arpanet", "to": "open-web", "label": "тұрақтылық және ашықтық", "lenses": ["chronology", "power", "technology"]}, {"from": "open-web", "to": "atoms-to-bits", "label": "ашықтық көшіруді жеделдетеді", "lenses": ["power", "technology"]}, {"from": "atoms-to-bits", "to": "castells", "label": "экономика ағындарға айналады", "lenses": ["power", "media"]}, {"from": "media-effects", "to": "castells", "label": "медиа желілік қоғамды қалыптастырады", "lenses": ["media", "power"]}, {"from": "arpanet", "to": "cypherpunks", "label": "желі қорғауды қажет етеді", "lenses": ["privacy", "technology", "power"]}, {"from": "cypherpunks", "to": "castells", "label": "ағындар ішіндегі құпиялық", "lenses": ["privacy", "power"]}, {"from": "scarcity", "to": "castells", "label": "қолжетімділікті бақылаудан ағындарды бақылауға", "lenses": ["power"]}], "ui": {"eyebrow": "Luminara · Негіздер", "sectionLenses": "Түсіндіру линзалары", "sectionScenes": "Тарау көріністері", "detailLabel": "Толығырақ", "detailEmpty": "Картадан түйінді таңдаңыз — мұнда тезис, инсайт, дереккөздер және байланысты идеялар пайда болады. Жоғарғы линзалар не ерекшеленетінін өзгертіп, ортаны қайта бояйды.", "related": "Байланысты идеялар", "sources": "Дереккөздер", "readScene": "Сахнаны оқу", "centerLabel": "Орталық идея", "progress": "Қаралды", "progressOf": "/", "openInLuminara": "Luminara-да ашу", "close": "Жабу", "arpaTitle": "Мини-демо · пакетті бағыттау", "arpaNote": "«Пакетті жіберу» түймесін басыңыз. Содан кейін «Түйінді өшіру» — пакет басқа маршрут табады. Бір ғана істен шығу нүктесі жоқ желі деген осы.", "arpaSend": "Пакетті жіберу", "arpaFail": "Түйінді өшіру", "arpaReset": "Қалпына келтіру", "arpaDemo": "ARPANET-демо", "typePower": "Билік", "typeTechnology": "Технологиялар", "typeMedia": "Медиа", "typePrivacy": "Құпиялық", "typeEconomy": "Экономика", "chapterTitle": "Интернетке дейін", "scene": "Көрініс", "arpaRouting": "Пакет жүріп барады", "arpaNoRoute": "Маршрут қолжетімсіз: тым көп түйін өшірілген.", "arpaDelivered": "жеткізілді", "arpaAria": "ARPANET пакетін қайта бағыттау", "initError": "Инициализация қатесі"}};
function renderEmptyState(reason){const empty=document.querySelector(".empty-state"),svg=document.querySelector(".system-map");if(!empty||!svg)return;empty.hidden=false;svg.setAttribute("hidden","");empty.innerHTML=`<p>${reason}</p><a href="${CHAPTER_DATA.chapter.sourceUrl}" target="_blank" rel="noreferrer">Luminara</a>`;}
</script></head>
<body>
<main class="app-shell">
  <section class="control-rail">
    <div><p class="eyebrow">Luminara · Негіздер</p><h1 id="app-title">Интернетке дейін</h1></div>
    <p class="chapter-lede">Ақпарат қалай билікке айналады — тапшылық пен сигналдардан желілік қоғамға дейін.</p>
    <div class="rail-rule"></div>
    <div><p class="section-h">Түсіндіру линзалары</p><div class="lens-group" style="margin-top:9px"></div><p class="lens-desc" style="margin-top:9px"></p></div>
    <div class="rail-rule"></div>
    <div class="progress-box"></div>
    <div><p class="section-h">Тарау көріністері</p><nav class="node-list" style="margin-top:6px"></nav></div>
  </section>
  <section class="map-stage">
    <svg class="system-map" viewBox="0 0 1000 890" role="img" preserveAspectRatio="xMidYMid meet"><title id="map-title">Интернетке дейін</title><desc id="map-desc">Ақпарат билікке айналады</desc></svg>
    <div class="empty-state" hidden></div>
  </section>
  <aside class="detail-panel"></aside>
</main>
<dialog class="scene-dialog"></dialog>
<script>
const state={lens:"chronology",selected:null,visited:new Set(),entered:false};
const byId=id=>CHAPTER_DATA.nodes.find(n=>n.id===id);
const SVGNS="http://www.w3.org/2000/svg";
const el=(t,a)=>{const e=document.createElementNS(SVGNS,t);for(const k in(a||{}))e.setAttribute(k,a[k]);return e;};
function typeColor(t){return{power:"#c0392b",technology:"#1f7a5a",media:"#b7791f",privacy:"#6b4fa0",economy:"#a04a7a"}[t]||"#b7791f";}
function typeLabel(t){const u=CHAPTER_DATA.ui;return{power:u.typePower,technology:u.typeTechnology,media:u.typeMedia,privacy:u.typePrivacy,economy:u.typeEconomy}[t]||"";}
function lensById(id){return CHAPTER_DATA.lenses.find(l=>l.id===id);}
function edgeActive(e){return e.lenses.includes(state.lens);}
function nodeWeight(n){return(n.lensWeight&&n.lensWeight[state.lens])||0;}
const CX=CHAPTER_DATA.chapter.centerX||500, CY=CHAPTER_DATA.chapter.centerY||445, RING=CHAPTER_DATA.chapter.ring||300;

function buildLenses(){
  const w=document.querySelector(".lens-group");w.innerHTML="";
  CHAPTER_DATA.lenses.forEach(l=>{const b=document.createElement("button");b.className="lens-btn";b.type="button";
    b.setAttribute("aria-pressed",String(l.id===state.lens));b.style.setProperty("--dot",l.accent);
    b.innerHTML=`<span class="lens-dot"></span>${l.label}`;b.addEventListener("click",()=>setLens(l.id));w.appendChild(b);});
}
function setLens(id){state.lens=id;const l=lensById(id);
  const d=document.querySelector(".lens-desc");if(d)d.textContent=l?l.description:"";
  document.querySelectorAll(".lens-btn").forEach((b,i)=>b.setAttribute("aria-pressed",String(CHAPTER_DATA.lenses[i].id===id)));
  renderAll();}

function curve(a,b){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;const dx=mx-CX,dy=my-CY,len=Math.hypot(dx,dy)||1;const bow=26;
  return `M ${a.x} ${a.y} Q ${mx+(dx/len)*bow} ${my+(dy/len)*bow} ${b.x} ${b.y}`;}

function defs(){
  const d=el("defs");
  const mk=(id,color)=>{const m=el("marker",{id,viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"});
    const p=el("path",{d:"M0 0 L10 5 L0 10 z",fill:color});m.appendChild(p);return m;};
  d.appendChild(mk("arrow-active", lensById(state.lens)?lensById(state.lens).accent:"#b7791f"));
  return d;
}

function renderMap(){
  const svg=document.querySelector(".system-map");if(!svg)return;
  [...svg.querySelectorAll("defs,g,.ring,.ring-tick,.era-label,.spoke")].forEach(n=>n.remove());
  svg.appendChild(defs());
  // rings
  const gDeco=el("g",{});
  [RING*0.55,RING].forEach(r=>gDeco.appendChild(el("circle",{class:"ring",cx:CX,cy:CY,r})));
  svg.appendChild(gDeco);
  // spokes + chronology era labels around outer ring
  const gSpoke=el("g",{});
  CHAPTER_DATA.nodes.forEach(n=>{
    gSpoke.appendChild(el("line",{class:"spoke",x1:CX,y1:CY,x2:n.x,y2:n.y}));
  });
  svg.appendChild(gSpoke);

  // edges (with directional arrows on active)
  const gE=el("g",{});
  CHAPTER_DATA.edges.forEach(e=>{const a=byId(e.from),b=byId(e.to);if(!a||!b)return;
    const active=edgeActive(e);const g=el("g",{class:"edge"+(active?" active":"")});
    if(active)g.style.setProperty("--dot",lensById(state.lens).accent);
    const d=curve(a,b);const p=el("path",{d});
    // approximate length for draw animation
    const len=Math.round(Math.hypot(b.x-a.x,b.y-a.y)*1.15);
    p.style.setProperty("--len",len);
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const lb=el("text",{class:"edge-label",x:mx,y:my-5,"text-anchor":"middle"});lb.textContent=e.label;
    g.appendChild(p);g.appendChild(lb);gE.appendChild(g);});
  svg.appendChild(gE);

  // center (breathing, lens-tinted ring)
  const gC=el("g",{});
  gC.style.setProperty("--dot", lensById(state.lens)?lensById(state.lens).accent:"#b7791f");
  gC.appendChild(el("circle",{class:"center-halo",cx:CX,cy:CY,r:78}));
  gC.appendChild(el("circle",{class:"center-ring",cx:CX,cy:CY,r:72}));
  gC.appendChild(el("circle",{class:"center-disc",cx:CX,cy:CY,r:66}));
  const t2=el("text",{class:"center-t2",x:CX,y:CY-20});t2.textContent=CHAPTER_DATA.ui.centerLabel;gC.appendChild(t2);
  wrapText(gC,CHAPTER_DATA.chapter.centralIdea,CX,CY+2,120,"center-t1",17);
  svg.appendChild(gC);

  // nodes with smart outward labels + era
  const gN=el("g",{});
  CHAPTER_DATA.nodes.forEach((n,i)=>{
    const g=el("g",{class:"node"+(state.selected===n.id?" selected":""),tabindex:"0",role:"button","aria-label":`${n.sceneIndex+1}. ${n.title} (${n.era||""})`});
    g.style.setProperty("--dot",typeColor(n.type));
    g.style.setProperty("--ox",n.x+"px");g.style.setProperty("--oy",n.y+"px");
    if(!state.entered) g.style.setProperty("--delay",(0.15+i*0.06)+"s"); else g.style.animation="none",g.style.opacity="1";
    if(state.selected){const linked=CHAPTER_DATA.edges.some(e=>(e.from===state.selected&&e.to===n.id)||(e.to===state.selected&&e.from===n.id));
      if(n.id!==state.selected&&!linked)g.classList.add("dim");}
    else if(nodeWeight(n)<=1){g.classList.add("dim");}
    g.appendChild(el("circle",{class:"halo",cx:n.x,cy:n.y,r:34}));
    g.appendChild(el("circle",{class:"disc",cx:n.x,cy:n.y,r:26}));
    const num=el("text",{class:"num",x:n.x,y:n.y});num.textContent=String(n.sceneIndex+1);g.appendChild(num);

    // smart label placement: outward along the radius from center
    const dx=n.x-CX,dy=n.y-CY,len=Math.hypot(dx,dy)||1;
    const ux=dx/len,uy=dy/len;
    const lx=n.x+ux*40, ly=n.y+uy*40;
    // anchor by horizontal side
    const anchor = ux>0.25?"start":(ux<-0.25?"end":"middle");
    const era=el("text",{class:"era",x:lx,y:ly-13,"text-anchor":anchor});era.textContent=n.era||"";g.appendChild(era);
    const kick=el("text",{class:"kicker",x:lx,y:ly-1,"text-anchor":anchor});kick.textContent=typeLabel(n.type);g.appendChild(kick);
    wrapTextAnchored(g,n.shortTitle,lx,ly+13,150,"cap",13,anchor);

    g.addEventListener("click",()=>selectNode(n.id));
    g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();selectNode(n.id);}});
    gN.appendChild(g);
  });
  svg.appendChild(gN);
  state.entered=true;
}
function wrapText(parent,text,x,y,maxw,cls,fs){wrapTextAnchored(parent,text,x,y,maxw,cls,fs,"middle");}
function wrapTextAnchored(parent,text,x,y,maxw,cls,fs,anchor){
  const words=String(text).split(/\s+/);const lines=[];let line="";
  const approx=s=>s.length*(fs*0.56);
  words.forEach(w=>{const t=line?line+" "+w:w;if(approx(t)>maxw&&line){lines.push(line);line=w;}else line=t;});
  if(line)lines.push(line);const total=(lines.length-1)*(fs+2);
  lines.forEach((ln,i)=>{const t=el("text",{class:cls,x,y:y-total/2+i*(fs+2),"text-anchor":anchor});t.textContent=ln;parent.appendChild(t);});
}

function renderNodeList(){const nav=document.querySelector(".node-list");if(!nav)return;nav.innerHTML="";
  CHAPTER_DATA.nodes.slice().sort((a,b)=>a.sceneIndex-b.sceneIndex).forEach(n=>{
    const b=document.createElement("button");b.type="button";b.setAttribute("aria-current",String(state.selected===n.id));b.style.setProperty("--dot",typeColor(n.type));
    b.innerHTML=`<span class="node-idx">${String(n.sceneIndex+1).padStart(2,"0")}</span><span>${n.shortTitle}</span>`;
    b.addEventListener("click",()=>selectNode(n.id));nav.appendChild(b);});}
function renderProgress(){const box=document.querySelector(".progress-box");if(!box)return;
  const total=CHAPTER_DATA.nodes.length,seen=state.visited.size;
  box.innerHTML=`${CHAPTER_DATA.ui.progress} ${seen} ${CHAPTER_DATA.ui.progressOf} ${total}<div class="progress-bar"><div class="progress-fill" style="width:${Math.round(seen/total*100)}%"></div></div>`;}
function firstSentence(txt){return String(txt).replace(/^##[^\n]*\n+/,"").split(/(?<=[.!?])\s/)[0]||"";}
function renderDetail(){const p=document.querySelector(".detail-panel");if(!p)return;
  if(!state.selected){p.innerHTML=`<p class="eyebrow">${CHAPTER_DATA.ui.detailLabel}</p><p class="detail-empty">${CHAPTER_DATA.ui.detailEmpty}</p>`;return;}
  const n=byId(state.selected);const c=typeColor(n.type);
  const related=CHAPTER_DATA.edges.filter(e=>e.from===n.id||e.to===n.id).map(e=>({node:byId(e.from===n.id?e.to:e.from),label:e.label})).filter(x=>x.node);
  const srcs=(n.sources||[]).slice(0,10);
  p.innerHTML=`<p class="detail-kicker" style="--dot:${c}">${CHAPTER_DATA.ui.scene} ${n.sceneIndex+1} · ${typeLabel(n.type)}${n.era?" · "+n.era:""}</p>
    <h3 class="detail-title">${n.title}</h3>
    <p class="detail-thesis">${firstSentence(n.body)}</p>
    <p class="detail-insight" style="--dot:${c}">${n.insight}</p>
    <div class="chips">${(n.tags||[]).map(t=>`<span class="chip">${t}</span>`).join("")}</div>
    <div class="related"><h4>${CHAPTER_DATA.ui.related}</h4><div class="related-list">
      ${related.map(r=>`<button type="button" data-go="${r.node.id}">${r.node.shortTitle} · <span style="color:var(--muted)">${r.label}</span></button>`).join("")}</div></div>
    ${srcs.length?`<div class="sources-block"><h4>${CHAPTER_DATA.ui.sources} (${srcs.length})</h4><ol>${srcs.map(s=>`<li>${s.url?`<a href="${s.url}" target="_blank" rel="noreferrer">${s.title}</a>`:s.title}</li>`).join("")}</ol></div>`:""}
    <div class="panel-actions"><button class="btn primary" type="button" data-full="${n.id}">${CHAPTER_DATA.ui.readScene}</button>
      ${n.id==="arpanet"?'<button class="btn" type="button" data-arpa="1">${CHAPTER_DATA.ui.arpaDemo}</button>':""}</div>`;
  p.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>selectNode(b.getAttribute("data-go"))));
  p.querySelector("[data-full]").addEventListener("click",()=>renderFullScene(n.id));
  const ad=p.querySelector("[data-arpa]");if(ad)ad.addEventListener("click",()=>renderFullScene("arpanet",true));}
function selectNode(id){state.selected=id;state.visited.add(id);renderAll();}

function mdToHtml(md){return String(md).split(/\n{2,}/).map(b=>{b=b.trim();if(!b)return"";
  if(b.startsWith("## "))return`<h2>${b.slice(3)}</h2>`;return`<p>${b.replace(/\*([^*]+)\*/g,"<em>$1</em>")}</p>`;}).join("");}
function renderFullScene(id,openArpa){const n=byId(id);if(!n)return;const dlg=document.querySelector(".scene-dialog");const isArpa=n.id==="arpanet";const c=typeColor(n.type);const srcs=(n.sources||[]);
  dlg.innerHTML=`<div class="dialog-inner"><button class="dialog-close" aria-label="${CHAPTER_DATA.ui.close}" type="button">×</button>
    <p class="detail-kicker" style="--dot:${c}">${CHAPTER_DATA.ui.scene} ${n.sceneIndex+1} · ${typeLabel(n.type)}${n.era?" · "+n.era:""}</p>
    <h3>${n.title}</h3><div class="dialog-body">${mdToHtml(n.body)}</div>
    <p class="detail-insight" style="--dot:${c}">${n.insight}</p>${isArpa?arpaMarkup():""}
    ${srcs.length?`<div class="sources-block"><h4>${CHAPTER_DATA.ui.sources}</h4><ol>${srcs.map(s=>`<li>${s.url?`<a href="${s.url}" target="_blank" rel="noreferrer">${s.title}</a>`:s.title}</li>`).join("")}</ol></div>`:""}
    <div class="panel-actions"><a class="btn" href="${CHAPTER_DATA.chapter.sourceUrl}" target="_blank" rel="noreferrer">${CHAPTER_DATA.ui.openInLuminara}</a>
      <button class="btn primary" type="button" data-close>${CHAPTER_DATA.ui.close}</button></div></div>`;
  const close=()=>dlg.close();dlg.querySelector(".dialog-close").addEventListener("click",close);dlg.querySelector("[data-close]").addEventListener("click",close);
  if(typeof dlg.showModal==="function")dlg.showModal();else dlg.setAttribute("open","");
  if(isArpa){wireArpanet(dlg);if(openArpa)setTimeout(()=>runArpanetPacketDemo(dlg),300);}}
function arpaMarkup(){return `<div class="arpa-wrap"><h4>${CHAPTER_DATA.ui.arpaTitle}</h4>
  <svg class="arpa-svg arpa-net" viewBox="0 0 460 160" role="img" aria-label="${CHAPTER_DATA.ui.arpaAria}"></svg>
  <p class="arpa-note">${CHAPTER_DATA.ui.arpaNote}</p>
  <div class="panel-actions"><button class="btn primary" type="button" data-send>${CHAPTER_DATA.ui.arpaSend}</button>
    <button class="btn" type="button" data-fail>${CHAPTER_DATA.ui.arpaFail}</button><button class="btn" type="button" data-reset>${CHAPTER_DATA.ui.arpaReset}</button></div></div>`;}
const ARPA={hosts:{A:{x:40,y:80,label:"A"},B:{x:170,y:38,label:"B"},C:{x:170,y:122,label:"C"},D:{x:300,y:80,label:"D"},E:{x:420,y:80,label:"E"}},
  links:[["A","B"],["A","C"],["B","D"],["C","D"],["D","E"]],down:new Set(),
  route(){const P=[["A","B","D","E"],["A","C","D","E"]];for(const p of P)if(p.every(h=>!this.down.has(h)))return p;return null;}};
function drawArpa(svg){svg.innerHTML="";const mk=(t,a)=>{const e=document.createElementNS(SVGNS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  ARPA.links.forEach(([f,t])=>{const A=ARPA.hosts[f],B=ARPA.hosts[t];svg.appendChild(mk("line",{x1:A.x,y1:A.y,x2:B.x,y2:B.y}));});
  Object.entries(ARPA.hosts).forEach(([id,h])=>{svg.appendChild(mk("circle",{cx:h.x,cy:h.y,r:16,class:ARPA.down.has(id)?"down":"host"}));const t=mk("text",{x:h.x,y:h.y+4});t.textContent=h.label;svg.appendChild(t);});}
function wireArpanet(dlg){const svg=dlg.querySelector(".arpa-net");ARPA.down=new Set();drawArpa(svg);
  dlg.querySelector("[data-send]").addEventListener("click",()=>runArpanetPacketDemo(dlg));
  dlg.querySelector("[data-fail]").addEventListener("click",()=>{ARPA.down.add("B");drawArpa(svg);dlg.querySelector(".arpa-note").textContent=(CHAPTER_DATA.ui.arpaFailNote||"Node B down; routes via C.");});
  dlg.querySelector("[data-reset]").addEventListener("click",()=>{ARPA.down=new Set();drawArpa(svg);dlg.querySelector(".arpa-note").textContent=(CHAPTER_DATA.ui.arpaResetNote||"Network restored.");});}
function runArpanetPacketDemo(dlg){dlg=dlg||document.querySelector(".scene-dialog");const svg=dlg.querySelector(".arpa-net");if(!svg)return;drawArpa(svg);
  const path=ARPA.route();const note=dlg.querySelector(".arpa-note");if(!path){if(note)note.textContent=CHAPTER_DATA.ui.arpaNoRoute;return;}
  for(let i=0;i<path.length-1;i++){const A=ARPA.hosts[path[i]],B=ARPA.hosts[path[i+1]];
    [...svg.querySelectorAll("line")].forEach(ln=>{const s=(+ln.getAttribute("x1")===A.x&&+ln.getAttribute("y1")===A.y&&+ln.getAttribute("x2")===B.x&&+ln.getAttribute("y2")===B.y)||(+ln.getAttribute("x1")===B.x&&+ln.getAttribute("y1")===B.y&&+ln.getAttribute("x2")===A.x&&+ln.getAttribute("y2")===A.y);if(s)ln.classList.add("path-active");});}
  if(note)note.textContent=CHAPTER_DATA.ui.arpaRouting+": "+path.join(" → ");
  const pkt=document.createElementNS(SVGNS,"circle");pkt.setAttribute("r","5");pkt.setAttribute("class","packet");svg.appendChild(pkt);
  let seg=0,t=0;function step(){if(seg>=path.length-1){pkt.remove();if(note)note.textContent+="  ✓ "+CHAPTER_DATA.ui.arpaDelivered;return;}
    const A=ARPA.hosts[path[seg]],B=ARPA.hosts[path[seg+1]];t+=0.04;pkt.setAttribute("cx",A.x+(B.x-A.x)*t);pkt.setAttribute("cy",A.y+(B.y-A.y)*t);if(t>=1){t=0;seg++;}requestAnimationFrame(step);}
  requestAnimationFrame(step);}
function renderAll(){renderMap();renderNodeList();renderDetail();renderProgress();}
async function boot(){buildLenses();setLens(state.lens);}
document.addEventListener("DOMContentLoaded",()=>{try{boot();}catch(e){renderEmptyState(CHAPTER_DATA.ui.initError+": "+e.message);}});
</script>
</body></html>
