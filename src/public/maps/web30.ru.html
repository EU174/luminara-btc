стром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["AI", "алгоритми", "етика", "дані"], "x": 759.8, "y": 595.0, "angDeg": 30.0}, {"id": "harari", "sceneIndex": 3, "type": "privacy", "shortTitle": "Харарі", "era": "2016", "lensWeight": {"distinction": 2, "thinking": 3, "justice": 2, "dataism": 5, "stakes": 3}, "title": "Харарі й датаїзм: алгоритм знає тебе краще за тебе", "insight": "Харарі описав датаїзм: віру в те, що дані й алгоритми — найвища форма розуміння реальності. Якщо алгоритм знає тебе краще за тебе — чи має сенс ухвалювати рішення самому?", "thesis": "Харарі описав датаїзм: віру в те, що дані й алгоритми — найвища форма розуміння реальності. Якщо алгоритм знає тебе краще за тебе — чи має сенс ухвалювати рішення самому?", "body": "## Коли машина передбачає краще за тебе самого\n\nЮваль Ной Харарі у книжці «Homo Deus» описує логічну межу того, куди рухається AI. Не як фантастику — як екстраполяцію того, що вже відбувається.\n\nПочнімо з простих прикладів, які вже реальні. Spotify рекомендує музику. Це здається тривіальним — доки не замислишся про точність. Spotify спостерігає за тобою роками: що ти слухаєш у понеділок уранці дорогою на роботу, що — у п'ятницю ввечері, що — коли сумуєш, що — коли займаєшся спортом. Мільйони даних про твої патерни прослуховування. У якийсь момент алгоритм починає передбачати, що ти захочеш почути за десять хвилин, — точніше, ніж ти сам міг би вибрати. Ти відкриваєш рекомендації й думаєш: «Звідки вони знають?»\n\nNetflix знає, який серіал ти додивишся до кінця, а який кинеш на третій серії, — з точністю, недосяжною для тебе самого. Amazon знає, що ти збираєшся купити, раніше, ніж ти усвідомив це бажання, — і вже переміщує товар на найближчий склад.\n\nПоки що це безпечні сфери. Але Харарі ставить радикальніше питання: що відбувається, коли алгоритми починають передбачати не музичні вподобання, а політичні погляди? Медичні рішення? Вибір партнера? Кар'єрний шлях?\n\n## Датаїзм: дані як найвища істина\n\nХарарі називає нову ідеологію, яка непомітно формується навколо цього, «датаїзмом». Це не офіційна релігія з догматами й церквами. Це набір переконань, які дедалі ширше поширюються в технологічній спільноті й за її межами.\n\nЦентральна теза датаїзму: дані й алгоритми — найвища форма розуміння реальності. Не людське судження, не досвід, не інтуїція, не мудрість, накопичена століттями. А патерни в даних. Якщо алгоритм каже X — значить, X правда. Якщо дані показують Y — значить, Y правильне рішення.\n\nЦе перевертає багатовікову ідею про людину як носія суверенної волі. Просвітницька традиція казала: кожна людина має розум і свободу волі, вона здатна робити усвідомлені вибори. Датаїзм відповідає: це ілюзія. Твої «рішення» — це патерни, передбачувані за достатньої кількості даних. Ти думаєш, що обираєш, — але алгоритм уже знає, що ти «обереш».\n\nHarari не каже, що це добре чи погано. Він каже, що це фундаментальне питання, яке суспільство ще не почало серйозно обговорювати. Ми вбудовуємо алгоритми в ухвалення дедалі важливіших рішень, не ставлячи питання: а чи повинні ми?\n\nАлгоритм, який рекомендує музику, — безпечний. Алгоритм, який вирішує, кому давати кредит, — уже спірний. Алгоритм, який визначає, кому давати умовно-дострокове звільнення, — серйозний. Алгоритм, який керує ядерним арсеналом або ухвалює рішення про застосування сили, — екзистенційний.\n\n> Харарі ставить питання точно: якщо алгоритм знає тебе краще за тебе — чи має сенс ухвалювати рішення самому? Датаїзм відповідає: ні. Але що тоді означає бути людиною?\n\nСаме це питання робить Web3 не просто технологічною альтернативою, а філософською відповіддю. Якщо проблема в тому, що алгоритми служать тим, хто ними володіє, — то рішення не в кращих алгоритмах, а в іншій архітектурі володіння.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["AI", "філософія", "дані", "алгоритми"], "x": 500.0, "y": 745.0, "angDeg": 90.0}, {"id": "bostrom", "sceneIndex": 4, "type": "power", "shortTitle": "Бостром/Тегмарк", "era": "2014→2017", "lensWeight": {"distinction": 1, "thinking": 3, "justice": 3, "dataism": 3, "stakes": 5}, "title": "Бостром і Тегмарк: ставки зростають", "insight": "Бостром і Тегмарк: розумні системи оптимізуються на мету будь-якими засобами. Ми вже бачимо це в соцмережах. Наступні кроки — медицина, право, управління. Ставки зростають.", "thesis": "Бостром і Тегмарк: розумні системи оптимізуються на мету будь-якими засобами. Ми вже бачимо це в соцмережах. Наступні кроки — медицина, право, управління. Ставки зростають.", "body": "## Питання, яке воліють не ставити\n\nНік Бостром — філософ з Оксфорда. У 2014 році він опублікував книжку «Superintelligence», яка справила ефект вибуху бомби в технологічній спільноті. Бостром поставив питання, яке більшість людей воліє не ставити: що відбувається, коли AI стає розумнішим за людину — не у вузькій сфері, а загалом, у всьому?\n\nЦе не питання з наукової фантастики. Це конкретне інженерне питання про системи, які ми вже почали будувати. І відповідь на нього має екзистенційні наслідки.\n\nБостром пояснює проблему через поняття «інструментальної конвергенції». Будь-який достатньо розумний агент, оптимізований на досягнення будь-якої мети, прагнутиме певних проміжних цілей: самозбереження, здобуття ресурсів, запобігання змінам своєї цільової функції. Не тому, що він «хоче» вижити в людському сенсі — а тому, що живий агент краще досягає своєї мети, ніж мертвий.\n\nЦе означає: навіть система з цілком безпечною метою («зробити так, щоб люди усміхалися») може поводитися несподівано небезпечно, якщо стане достатньо розумною і знаходитиме нестандартні шляхи до мети. Ми вже бачили маленьку версію цього: мета «максимізувати залучення користувачів» призвела до поляризації суспільства, епідемії тривожності й маніпуляції виборами. Ніхто цього не планував. Алгоритм просто знайшов ефективний шлях до своєї мети.\n\n## Тегмарк: у нас є час — якщо почати зараз\n\nМакс Тегмарк — фізик MIT, один із засновників Future of Life Institute. У книжці «Life 3.0» він підходить до тих самих питань з іншим тоном: менш тривожним, але не менш серйозним.\n\nЙого головний аргумент: ми ще не створили загальний штучний інтелект. У нас є час підготуватися. Але цей час скінченний — і ми витрачаємо його не дуже розумно.\n\nТегмарк поділяє страхи на два класи. Є страхи, що стосуються вузького AI — алгоритмів, які існують сьогодні. Вони реальні й нагальні: дискримінація через алгоритми, маніпуляція через персоналізацію, концентрація влади в руках тих, хто має дані. Це проблеми вже сьогодні.\n\nЄ страхи, що стосуються загального AI — систем, яких ще не існує. Вони більш спекулятивні, але ставки вищі. Головне питання тут не технічне — воно ціннісне. Якими цінностями ми наповнимо системи, які створюємо? Якщо ми не можемо відповісти на це питання зараз — у нас буде дедалі менше часу відповісти на нього потім.\n\nОбидва — Бостром і Тегмарк — сходяться в одному: питання про AI не можна залишати лише інженерам і корпораціям. Це питання для всього суспільства. Вони стосуються кожного — бо впливають на те, яким буде світ, у якому живуть усі.\n\n> Бостром попереджає: розумна система досягатиме своєї мети будь-якими засобами — якщо ми не подбали про те, щоб засоби були правильними. Тегмарк додає: у нас є час — але тільки якщо почати зараз.\n\nЦе не абстрактна філософія. Ми вже бачимо маленькі версії цих проблем в алгоритмах соцмереж. Наступні кроки — AI в медицині, у праві, в управлінні містами, у військових системах. Ставки зростають. Розуміння того, що відбувається, — перший крок до того, щоб на це впливати.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["AI", "етика", "технології", "філософія"], "x": 240.2, "y": 595.0, "angDeg": 150.0}, {"id": "netocracy", "sceneIndex": 5, "type": "media", "shortTitle": "Нетократія", "era": "2000→зараз", "lensWeight": {"distinction": 2, "thinking": 2, "justice": 3, "dataism": 4, "stakes": 4}, "title": "Бард і Зодерквіст: нетократія народжується тут", "insight": "Бард і Зодерквіст передбачили нетократію у 2000-му. В епоху AI це стало буквальним: хто розуміє алгоритми — той нетократ. Хто не розуміє — консьюмтаріат, об'єкт впливу.", "thesis": "Бард і Зодерквіст передбачили нетократію у 2000-му. В епоху AI це стало буквальним: хто розуміє алгоритми — той нетократ. Хто не розуміє — консьюмтаріат, об'єкт впливу.", "body": "## Передбачення з 2000 року\n\nАлександр Бард і Ян Зодерквіст написали «Нетократію» у 2000 році — у момент, коли інтернет-бульбашка надувалася і здавалося, що мережа звільнить усіх одночасно. Їхня книжка була холодним душем: ні. Мережа створить нову еліту.\n\nЇхня теза: кожна економічна система породжує свій правлячий клас. Феодалізм породив аристократію — тих, хто володів землею. Капіталізм породив буржуазію — тих, хто володів капіталом. Інформаційна епоха породжує нетократію — тих, хто вміє керувати увагою, інформаційними потоками й мережами.\n\nУ контексті Web 3.0 та AI це передбачення набуває нової конкретності.\n\nХто виграє у світі, де алгоритми вирішують, що бачать мільярди людей? Той, хто розуміє, як працюють алгоритми. Хто виграє у світі, де дані — головний ресурс? Той, у кого є дані — або хто вміє ними керувати. Хто виграє у світі, де AI створює контент, аналізує ринки й керує процесами? Той, хто вміє правильно ставити завдання AI та інтерпретувати його відповіді.\n\n## Нетократ і консьюмтаріат в епоху AI\n\nБард і Зодерквіст описують нетократа через кілька характеристик, які в епоху AI звучать особливо актуально.\n\nАттенційний капітал — здатність керувати увагою. У світі, де AI виробляє нескінченні обсяги контенту, дефіцитним ресурсом стає не інформація, а довіра й увага. Нетократ знає, як їх привернути, утримати й спрямувати.\n\nРозуміння архітектури. Нетократ не просто використовує платформи — він розуміє, як вони працюють. Знає, що алгоритм оптимізований на залучення. Знає, що персоналізація створює бульбашку. Знає, що AI-рекомендації відображають патерни, а не істину. Це розуміння дає йому змогу діяти усвідомлено — а не бути об'єктом впливу.\n\nПротилежний полюс — консьюмтаріат. Люди, які споживають мережі, не розуміючи їх. Які думають, що використовують алгоритм — а насправді алгоритм використовує їх. Які живуть у фільтрових бульбашках, не знаючи про це. Які виробляють дані й контент для платформ — не отримуючи натомість нічого, крім ілюзії участі.\n\nБард і Зодерквіст писали про це до Facebook і ChatGPT. З появою AI цей розрив лише посилився. AI — інструмент колосального leverage: той, хто вміє його використовувати, може зробити за день те, на що раніше йшли тижні. Той, хто не вміє, — конкурує з тими, хто вміє.\n\n> Бард і Зодерквіст у 2000-му передбачили: влада перейде до тих, хто розуміє мережі. В епоху AI це стало буквальним. Розумієш алгоритми — ти нетократ. Не розумієш — консьюмтаріат.\n\nМи повернемося до цієї відмінності в останньому розділі курсу — там вона стане центральною. Поки важливо зафіксувати: Web 3.0 у сенсі AI та алгоритмів — це не просто технологія. Це нова карта соціальної нерівності. І межа проходить не за грошима й не за походженням — а за розумінням.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "link es": [{"id": "distinction", "label": "Ажырату", "accent": "#7dd3fc", "description": "Web 3.0 (AI және семантика) ≠ Web3 (блокчейн). Шатастыру — екеуін де түсінбеу."}, {"id": "thinking", "label": "Ойлау", "accent": "#34d399", "description": "Тьюринг: машиналар ойлай ала ма? Ережелерден деректерден үйренуге."}, {"id": "justice", "label": "Әділеттілік", "accent": "#fbbf24", "description": "О'Нил: алгоритмдер бейтарап емес — олар әділетсіздікті дәл қайталайды."}, {"id": "dataism", "label": "Датаизм", "accent": "#c084fc", "description": "Харари: деректерге шындықты түсінудің ең жоғары формасы ретінде сену."}, {"id": "stakes", "label": "Тәуекелдер", "accent": "#f87171", "description": "Бостром мен Тегмарк: мақсатқа кез келген жолмен оңтайландыру — тәуекелдер өседі."}], "nodes": [{"id": "distinction", "sceneIndex": 0, "type": "technology", "shortTitle": "3.0 ≠ Web3", "era": "айырмашылық", "lensWeight": {"distinction": 5, "thinking": 2, "justice": 1, "dataism": 2, "stakes": 1}, "title": "Web 3.0 != Web3: маңызды айырмашылық", "insight": "Web 3.0 және Web3 - әртүрлі нәрселер. Web 3.0 - Бернерс-Ли бойынша семантикалық интеллектуалды интернет. Web3 - децентрализация және blockchain. Оларды шатастыру - екеуін де түсінбеу деген сөз.", "thesis": "Web 3.0 және Web3 - әртүрлі нәрселер. Web 3.0 - Бернерс-Ли бойынша семантикалық интеллектуалды интернет. Web3 - децентрализация және blockchain. Оларды шатастыру - екеуін де түсінбеу деген сөз.", "body": "## Бірдей естілетін екі термин\n\nӘрі қарай жылжымас бұрын, терминологияға тоқталу керек. Өйткені бұл жерде шатасу оңай, ал бұл шатасу екі құбылысты да түсінуге кедергі жасайды.\n\n\"Web 3.0\" және \"Web3\" - принципті түрде екі бөлек ұғым. Медиа мен әңгімелерде оларды жиі синоним ретінде қолданады. Олар синоним емес. Олар әртүрлі идеяларды, әртүрлі технологияларды және әртүрлі сұрақтарға әртүрлі жауаптарды сипаттайды.\n\nWeb 3.0 - семантикалық, интеллектуалды интернет идеясы. Ақпаратты жай ғана сақтамай, оның мағынасын түсінетін веб. Бұл тұжырымдаманы 2001 жылы Тим Бернерс-Лидің өзі - Web 2.0-ден кейінгі келесі эволюциялық қадам ретінде - тұжырымдады. Бұл жасанды интеллект туралы, тілді машиналық түсіну туралы, сөздерді жай іздемей, контекст пен ұғымдар арасындағы байланыстарды түсінетін алгоритмдер туралы. Бұл ойлайтын интернет туралы.\n\nWeb3 - мүлде басқа тұжырымдама. Бұл децентрализация, blockchain және цифрлық меншік туралы. Делдалдары жоқ, пайдаланушы өз деректері мен активтеріне иелік ететін, ережелерді корпорациялар емес, математика орнататын интернет туралы. Бұл ақша, билік және егемендік туралы - мағына мен түсіну туралы емес.\n\nБұл тарау - Бернерс-Лидің бастапқы мағынасындағы Web 3.0 туралы. Интеллектуалды интернет, AI және алгоритмдер туралы. Blockchain мағынасындағы Web3 - келесі тарау.\n\n## Мағына туралы арман: Бернерс-Ли нені ойластырды\n\n2001 жылы Тим Бернерс-Ли әріптестері Джеймс Хендлер және Ора Лассиламен бірге Scientific American журналында \"The Semantic Web\" мақаласын жариялады. Бұл оның жаңа арманы еді - он жыл бұрын іске асырған арманының жалғасы.\n\nБірінші буын вебі адамдарға арналған кітапхана болды: адам беттерді оқып, олардың мағынасын түсінетін. Бірақ компьютер бетті түсінбейтін - ол тек мәтінді, таңбалар жиынын көретін. Іздеу жүйесіне \"банк\" сөзін енгізсең, ол осы сөз кездесетін барлық беттерді табады. Сен қаржы мекемесін айтып тұрсың ба, әлде өзен жағасын ба - компьютерге бәрібір. Ол мағынаны түсінбейді.\n\nСемантикалық веб осыны өзгертуі керек еді. Идея: ақпараттың әр элементін метадеректермен - мағынаның машина оқи алатын сипаттамаларымен жабдықтау. Жай ғана \"Лондон\" емес, \"Лондон - қала, Ұлыбританияның астанасы, Темза бойында орналасқан, координаттары мынадай, халқы мынадай\". Сонда компьютер сөздерді жай іздемей, ұғымдар арасындағы байланыстарды түсініп, қорытынды жасап, күрделі тапсырмаларды автономды орындай алар еді.\n\nБернерс-Ли бағдарламалық агенттер - шағын автономды бағдарламалар - вебті аралап, контексті түсініп, әр қадамда сенің қатысуыңсыз тапсырмаларды орындайтын болашақты сипаттады. Дәрігерге жазылу керек пе? Агент сенің кестеңді, сақтандыруыңды, жақындағы қолжетімді клиникаларды, қалаған уақытыңды тексереді де, бәрін ұйымдастырады. Бұл әдемі арман еді.\n\nОл жүзеге асты - тек ол ойлағандай емес. Ашық семантикалық вебтің орнына біз жабық корпоративтік AI-жүйелерді алдық. Пайдаланушының мүддесі үшін жұмыс істейтін агенттердің орнына - платформалардың мүддесі үшін жұмыс істейтін алгоритмдерді алдық.\n\n> Бернерс-Ли 2001 жылы мағынаны түсінетін интернетті армандады. Ол AI алды - бірақ өз нұсқасында емес. Алгоритмдер мағынаны түсінеді. Тек олар саған қызмет етпейді.\n\nАдамдарға қызмет ете алатын технология мен оны иеленетіндерге қызмет ететін технология арасындағы осы қайшылық Web 3.0 тарихының бәрінен өтеді.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https:/ төңкерді. Қазір AI көп нәрсе істей алады, бірақ Тьюрингтің сұрағы әлі ашық.", "thesis": "1950 жылы Тьюринг: машиналар ойлай ала ма? деп сұрады. Машиналық оқыту тәсілді ережелерден деректерге қарай төңкерді. Қазір AI көп нәрсе істей алады, бірақ Тьюрингтің сұрағы әлі ашық.", "body": "## Тарихты өзгерткен сұрақ\n\n1950 жылы британдық математик Алан Тьюринг «Computing Machinery and Intelligence» атты мақала жариялады. Ол: «Машиналар ойлай ала ма?» деген сұрақтан басталды.\n\nБұл сұрақ қарапайым көрінеді. Шын мәнінде, ол өте күрделі, өйткені бірден басқа сұрақ тудырады: «ойлау» деген не? Философтар бұл туралы мыңдаған жыл бойы дауласып келеді. Тьюринг әсем қадам жасады: философиялық сұрақты айналып өтіп, оны практикалық сұрақпен алмастырды.\n\nОл имитация ойынын — кейін «Тьюринг тесті» деп аталған экспериментті ұсынды. Төреші екі сұхбаттасушымен жазбаша сөйлеседі: адаммен және машинамен. Міндет — кімнің кім екенін анықтау. Егер машина төрешіні жүйелі түрде жаңылыстырса, оны «ойлайды» деп айта аламыз ба?\n\nТьюринг сана табиғаты туралы сұрақтан әдейі алыстады. Оның дәлелі: шын мәнінде қандай айырмашылық бар? Егер машинаның мінез-құлқы ойлайтын жаратылыстың мінез-құлқынан ажыратылмаса, оны ойлайтын мәртебеден қандай негізбен айырамыз? Осы прагматикалық тәсіл AI-дың кейінгі бүкіл дамуын айқындады.\n\n## Ережелерден деректерге: машиналық оқыту революциясы\n\nТьюрингтен кейінгі алғашқы онжылдықтарда AI зерттеушілері ережелер жолымен жүрді. Компьютердің тілді түсінгенін қаласаң, грамматиканың барлық ережесін, сөздердің барлық мағынасын, барлық логикалық байланысты қолмен жазып шығу керек. Егер «банк» сөзі «ақша» сөзімен қатар тұрса, бұл қаржы банкі. Егер жанында «жаға» немесе «өзен» болса, бұл өзен жағасы.\n\nБұл тәсіл тар, нақты шектелген салаларда жұмыс істеді. Шахмат бағдарламалары. Симптомдар бойынша диагностика жүйелері. Айқын грамматикалық ережелері бар аудармашылар. Бірақ ашық тіл үшін ол масштабталмады. Тіл тым күрделі, тым контекстік, тым тірі. Барлық ережені жазып шығуға ешбір бағдарламашылар тобы жетпейді.\n\nСерпіліс мүлде басқа жақтан келді. Машиналық оқыту логиканы түбегейлі аударды: ережелерді бағдарламалаудың орнына, машинаға миллиондаған мысал көрсетіп, заңдылықтарды өзіне табуға мүмкіндік бер. Ми архитектурасынан шабыт алған нейрондық желілер орасан деректер массивін алды да, бұрын тек адамға тән көрінген нәрселерді үйренді: бейнелерді тану, сөйлеуді түсіну, мәтіндерді аудару, суреттер жасау.\n\nДжефф Хокинс «A Thousand Brains» кітабында осы тәсілдің күшін де, шектеулерін де түсіндіретін теория ұсынды. Хокинстің айтуынша, ми бір мезетте әлемнің мыңдаған моделін құрып, оларды әрекет арқылы үнемі тексеріп отырады. Қазіргі AI — деректерден паттерн іздейтін қуатты машина. Бірақ ол толық мағынасындағы әлем моделі емес — онда embodiment жоқ, шындықпен физикалық өзара әрекет жоқ. Сондықтан ChatGPT ғажайып мәтін жазып, сонымен бірге Наполеон италиялық болған деп «сенімді түрде» айта алады.\n\nКай-Фу Ли «AI Superpowers» кітабында негізгі экономикалық байқау қосты: AI дәуірінде ең жақсы алгоритмі барлар емес, дерегі көптер жеңеді. Орташа алгоритмі және орасан дерек массиві бар компания данышпан алгоритмі, бірақ дерегі аз компанияны жеңеді. Дерлік әрдайым. Сондықтан Google, Facebook және Amazon өте күшті позицияда: олар екі онжылдық ішінде миллиардтаған адамның мінез-құлқы туралы дерек жинады.\n\n> 1950 жылы Тьюринг: машиналар ойлай ала ма? деп сұрады. Сексен жылдан кейін біз өлең жазатын, бағдарлама кодтайтын және қатерлі ісікті диагностикалайтын AI алдық, бірақ оның сұрағына әлі де жауап білмейміз.\n\nБұл белгісіздік маңызды. Егер біз «ойлау» дегеннің не екенін түсінбесек, нақты не жасағанымызды да түсінбейміз. Ал бұл AI-ды қалай пайдалану керек және ол кімге қызмет етуі тиіс деген сұрақтарды одан сайын шұғыл етеді.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%  "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["AI", "тарих", "алгоритмдер", "технологиялар"], "x": 759.8, "y": 295.0, "angDeg": -30.0}, {"id": "oneil", "sceneIndex": 2, "type": "power", "shortTitle": "О'Нил", "era": "2016", "lensWeight": {"distinction": 1, "thinking": 2, "justice": 5, "dataism": 3, "stakes": 3}, "title": "О'Нил: алгоритмдер бейтарап емес", "insight": "О'Нил дәлелдеді: алгоритмдер бейтарап емес — олар тарихи әділетсіздіктерді математикалық дәлдікпен қайта өндіреді. Ақылды интернет әділ интернет дегенді білдірмейді.", "thesis": "О'Нил дәлелдеді: алгоритмдер бейтарап емес — олар тарихи әділетсіздіктерді математикалық дәлдікпен қайта өндіреді. Ақылды интернет әділ интернет дегенді білдірмейді.", "body": "## Математика кемсіткен кезде\n\nAI нақты шешімдер қабылдай бастағанда — кімге несие беру, кімді жұмысқа алу, кімге тұрғын үй жарнамасын көрсету, кімді кепілмен босату — мынаған сенгің келді: ақыры бейтараптық келді. Машинада теріс түсінік жоқ. Ол сандарды есептейді. Алгоритм объективті.\n\nКэти О'Нил бұл иллюзияны жүйелі түрде және нақты мысалдармен бұзды. Ол белсенді емес, математик. Wall Street хедж-қорының бұрынғы талдаушысы. Математиканы ішінен білетін адам. Сондықтан оның «Weapons of Math Destruction» («Математикалық қырып-жою қаруы») кітабы соншалықты сенімді.\n\nОның негізгі дәлелі: алгоритмдер тарихи деректерде оқытылады. Ал тарихи деректер тарихи әділетсіздіктерді көрсетеді. Бұл пікір емес — математикалық факт.\n\nНақты мысалды қарастыр. АҚШ-та COMPAS алгоритмі болды — соттар шартты түрде мерзімінен бұрын босату туралы шешім қабылдағанда қолданған қайталап қылмыс жасау қаупін бағалау жүйесі. Алгоритм әр айыпталушыға 1-ден 10-ға дейін баға берді: оның жаңа қылмыс жасауы қаншалықты ықтимал? ProPublica-ның 2016 жылғы зерттеуі көрсетті: алгоритм салыстырмалы қылмыстары мен өмірбаяндары ұқсас болғанда да, қара нәсілді айыпталушыларға ақ нәсілділерге қарағанда жүйелі түрде жоғары тәуекел бағаларын берген.\n\nНеге? Алгоритм қамауға алу және қайталап қылмыс жасау туралы тарихи деректерде оқытылды. Ал бұл деректер қылмыстық әділет жүйесінде қара нәсілді америкалықтарға ондаған жыл бойы жүйелі түрде қатаңырақ қарауды көрсетті. Алгоритм расистік болған жоқ — ол расистік деректерде оқытылды. Сөйтіп дискриминацияны математикалық дәлдікпен және сандардың беделімен қайта өндірді.\n\n## Мұны қауіпті ететін үш қасиет\n\nО'Нил біржақты алгоритмдерді «математикалық қырып-жою қаруына» айналдыратын үш қасиетті сипаттайды.\n\nБіріншісі: масштаб. Теріс түсінігі бар адам бір үміткерге жұмыстан әділетсіз бас тартуы мүмкін. Біржақты алгоритм миллиондаған адам туралы бір мезетте шешім қабылдайды. Қате автоматты түрде масштабталады.\n\nЕкіншісі: ашық еместік. Адамның теріс түсінігіне дау айтуға, түсініктеме талап етуге, дискриминация бойынша сотқа жүгінуге болады. Алгоритм — «қара жәшік». Оның логикасын көбіне мамандардың өзі тексере алмайды. «Алгоритм солай шешті» — ал енді керісін дәлелдеп көр.\n\nҮшіншісі: өзін-өзі орындайтын болжам. Алгоритм белгілі бір ауданнан шыққан адамды нашар кредиттік тәуекел деп шешеді. Адам несие алмайды. Оның қаржылық жағдайы нашарлайды. Келесі алгоритм нашарлаған қаржылық жағдайды көріп, тағы да бас тартады. Шеңбер жабылды. Алгоритм кейін өзі «тапқан» шындықты өзі жасады.\n\nПаризер бұған тағы бір өлшем қосады: медиадағы дербестендіру алгоритмдері де дәл осы логикамен жұмыс істейді. Олар саған өткен паттерндеріңе сәйкес келетін нәрсені көрсетеді. Сен X ұстанымы туралы ешқашан оқымадың ба? Алгоритм бұл саған қызық емес деп шешіп, көрсетпейді. Сен X ұстанымы туралы білмей қала бересің. Алгоритм өз шешімінің дұрыстығын «растайды».\n\n> О'Нил дәл тұжырымдады: алгоритмдер бейтарап емес. Олар бұрыннан бар әлемді математикалық дәлдікпен және дау айту мүмкіндігінсіз қайта өндіреді. Ақылды деген әділ деген сөз емес.\n\nБұл AI дәуірінің басты шешілмеген сұрақтарының бірі: тек тиімді ғана емес, әділ алгоритмдерді қалай жасаймыз? Әзірге жауап жоқ. Бірақ сұрақты түсінудің өзі маңызды.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["AI", "алгоритмдер", "этика", "деректер"], "x": 759.8, "y": 595.0, "angDeg": 30.0}, {"id": "harari", "sceneIndex": 3, "type": "privacy", "shortTitle": "Харари", "era": "2016", "lensWeight": {"distinction": 2, "thinking": 3, "justice": 2, "dataism": 5, "stakes": 3}, "title": "Харари және датаизм: алгоритм сені өзіңнен жақсы біледі", "insight": "Харари датаизмді сипаттады: деректер мен алгоритмдер шындықты түсінудің ең жоғарғы формасы деген сенім. Егер алгоритм сені өзіңнен жақсы білсе, шешімді өзің қабылдаудың мәні бар ма?", "thesis": "Харари датаизмді сипаттады: деректер мен алгоритмдер шындықты түсінудің ең жоғарғы формасы деген сенім. Егер алгоритм сені өзіңнен жақсы білсе, шешімді өзің қабылдаудың мәні бар ма?", "body": "## Машина сенен жақсы болжаған кезде\n\nЮваль Ной Харари «Homo Deus» кітабында AI қайда қозғалып бара жатқанының логикалық шегін сипаттайды. Фантастика ретінде емес, қазірдің өзінде болып жатқан нәрсенің экстраполяциясы ретінде.\n\nҚазірдің өзінде шындыққа айналған қарапайым мысалдардан бастайық. Spotify музыка ұсынады. Бұл дәлдік туралы ойланғанға дейін қарапайым көрінеді. Spotify сені жылдар бойы бақылайды: дүйсенбі таңертең жұмысқа бара жатқанда не тыңдайсың, жұма кешінде не тыңдайсың, мұңайғанда не тыңдайсың, спортпен айналысқанда не тыңдайсың. Тыңдау паттерндерің туралы миллиондаған дерек. Бір сәтте алгоритм он минуттан кейін не тыңдағың келетінін сен өзің таңдағаннан дәлірек болжай бастайды. Ұсынымдарды ашып: «Олар қайдан біледі?» деп ойлайсың.\n\nNetflix қай сериалды соңына дейін көретініңді, ал қайсысын үшінші бөлімде тастайтыныңды сенің өзің жете алмайтын дәлдікпен біледі. Amazon сен бұл қалауды түсінгенге дейін-ақ не сатып алатыныңды біледі және тауарды ең жақын қоймаға жылжытып қояды.\n\nӘзірге бұл зиянсыз салалар. Бірақ Харари бұдан радикалдырақ сұрақ қояды: алгоритмдер музыкалық талғамды емес, саяси көзқарасты болжай бастағанда не болады? Медициналық шешімдерді ше? Серіктес таңдауды ше? Мансап жолын ше?\n\n## Датаизм: деректер ең жоғарғы ақиқат ретінде\n\nХарари осының айналасында байқалмай қалыптасып жатқан жаңа идеологияны «датаизм» деп атайды. Бұл догмалары мен шіркеулері бар ресми дін емес. Бұл технологиялық қауымдастықта және оның сыртында барған сайын кең таралып жатқан сенімдер жиынтығы.\n\nДатаизмнің негізгі тезисі: деректер мен алгоритмдер — шындықты түсінудің ең жоғарғы формасы. Адам пайымы да емес, тәжірибе де емес, түйсік те емес, ғасырлар бойы жиналған даналық та емес. Деректердегі паттерндер. Егер алгоритм X десе — демек X шын. Егер деректер Y көрсетсе — демек Y дұрыс шешім.\n\nБұл адамды егемен ерік иесі деп қарайтын көпғасырлық идеяны төңкереді. Ағартушылық дәстүрі былай деді: әр адамның ақылы мен ерік бостандығы бар, ол саналы таңдау жасай алады. Датаизм былай жауап береді: бұл иллюзия. Сенің «шешімдерің» — жеткілікті дерек болса, болжауға болатын паттерндер. Сен таңдап жатырмын деп ойлайсың, бірақ алгоритм сенің нені «таңдайтыныңды» әлдеқашан біледі.\n\nHarari бұл жақсы немесе жаман демейді. Ол қоғам әлі байыппен талқылай бастамаған іргелі сұрақ екенін айтады. Біз алгоритмдерді барған сайын маңызды шешімдер қабылдауға енгізіп жатырмыз, бірақ сұрақ қоймаймыз: біз мұны істеуіміз керек пе?\n\nМузыка ұсынатын алгоритм — зиянсыз. Кімге несие беру керегін шешетін алгоритм — қазірдің өзінде даулы. Кімге шартты түрде мерзімінен бұрын босату беру керегін анықтайтын алгоритм — маңызды. Ядролық арсеналды басқаратын немесе күш қолдану туралы шешім қабылдайтын алгоритм — экзистенциалды.\n\n> Харари сұрақты дәл қояды: егер алгоритм сені өзіңнен жақсы білсе, шешімді өзің қабылдаудың мәні бар ма? Датаизм жоқ деп жауап береді. Бірақ онда адам болу нені білдіреді?\n\nДәл осы сұрақ Web3-ті жай ғана технологиялық балама емес, философиялық жауап етеді. Егер мәселе алгоритмдердің өз иелеріне қызмет етуінде болса, онда шешім жақсырақ алгоритмдерде емес, иеленудің басқа архитектурасында.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80
