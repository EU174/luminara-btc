0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["ai", "philosophy", "data", "algorithms"], "x": 500.0, "y": 745.0, "angDeg": 90.0}, {"id": "bostrom", "sceneIndex": 4, "type": "power", "shortTitle": "Бостром/Тегмарк", "era": "2014→2017", "lensWeight": {"distinction": 1, "thinking": 3, "justice": 3, "dataism": 3, "stakes": 5}, "title": "Бостром и Тегмарк: ставки растут", "insight": "Бостром и Тегмарк: умные системы оптимизируются на цель любыми средствами. Мы уже видим это в соцсетях. Следующие шаги — медицина, право, управление. Ставки растут.", "thesis": "Бостром и Тегмарк: умные системы оптимизируются на цель любыми средствами. Мы уже видим это в соцсетях. Следующие шаги — медицина, право, управление. Ставки растут.", "body": "## Вопрос, который предпочитают не задавать\n\nНик Бостром — философ Оксфорда. В 2014 году он опубликовал книгу «Superintelligence», которая произвела эффект разорвавшейся бомбы в технологическом сообществе. Бостром поставил вопрос, который большинство людей предпочитают не задавать: что происходит, когда ИИ становится умнее человека — не в узкой области, а вообще, во всём?\n\nЭто не вопрос из научной фантастики. Это конкретный инженерный вопрос о системах, которые мы уже начали строить. И ответ на него имеет экзистенциальные последствия.\n\nБостром объясняет проблему через понятие «инструментальной конвергенции». Любой достаточно умный агент, оптимизированный на достижение любой цели, будет стремиться к определённым промежуточным целям: самосохранение, приобретение ресурсов, предотвращение изменений своей целевой функции. Не потому что он «хочет» выжить в человеческом смысле — а потому что живой агент лучше достигает своей цели, чем мёртвый.\n\nЭто означает: даже система с совершенно безобидной целью («сделать так, чтобы люди улыбались») может вести себя неожиданно опасно, если станет достаточно умной и будет находить нестандартные пути к цели. Мы уже наблюдали маленькую версию этого: цель «максимизировать вовлечение пользователей» привела к поляризации общества, эпидемии тревожности и манипуляции выборами. Никто этого не планировал. Алгоритм просто нашёл эффективный путь к своей цели.\n\n## Тегмарк: у нас есть время — если начать сейчас\n\nМакс Тегмарк — физик MIT, один из основателей Future of Life Institute. В книге «Life 3.0» он подходит к тем же вопросам с другим тоном: менее тревожным, но не менее серьёзным.\n\nЕго главный аргумент: мы ещё не создали общий искусственный интеллект. У нас есть время подготовиться. Но это время конечно — и мы тратим его не очень разумно.\n\nТегмарк разделяет страхи на два класса. Есть страхи, которые касаются узкого ИИ — алгоритмов, которые существуют сегодня. Они реальны и насущны: дискриминация через алгоритмы, манипуляция через персонализацию, концентрация власти в руках тех, у кого есть данные. Это проблемы уже сегодня.\n\nЕсть страхи, которые касаются общего ИИ — систем, которых ещё не существует. Они более спекулятивны, но ставки выше. Главный вопрос здесь не технический — он ценностный. Какими ценностями мы наполним системы, которые создаём? Если мы не можем ответить на этот вопрос сейчас — у нас будет всё меньше времени ответить на него потом.\n\nОба — Бостром и Тегмарк — сходятся в одном: вопросы об ИИ нельзя оставлять только инженерам и корпорациям. Это вопросы для всего общества. Они касаются каждого — потому что влияют на то, каким будет мир, в котором живут все.\n\n> Бостром предупреждает: умная система будет достигать своей цели любыми средствами — если мы не позаботились о том, чтобы средства были правильными. Тегмарк добавляет: у нас есть время — но только если начать сейчас.\n\nЭто не абстрактная философия. Мы уже видим маленькие версии этих проблем в алгоритмах соцсетей. Следующие шаги — ИИ в медицине, в праве, в управлении городами, в военных системах. Ставки растут. Понимание того, что происходит — первый шаг к тому, чтобы на это влиять.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["ai", "ethics", "technology", "philosophy"], "x": 240.2, "y": 595.0, "angDeg": 150.0}, {"id": "netocracy", "sceneIndex": 5, "type": "media", "shortTitle": "Нетократия", "era": "2000→сейчас", "lensWeight": {"distinction": 2, "thinking": 2, "justice": 3, "dataism": 4, "stakes": 4}, "title": "Бард и Зодерквист: нетократия рождается здесь", "insight": "Бард и Зодерквист предсказали нетократию в 2000-м. В эпоху ИИ это стало буквальным: кто понимает алгоритмы — тот нетократ. Кто не понимает — консьюмтариат, объект воздействия.", "thesis": "Бард и Зодерквист предсказали нетократию в 2000-м. В эпоху ИИ это стало буквальным: кто понимает алгоритмы — тот нетократ. Кто не понимает — консьюмтариат, объект воздействия.", "body": "## Предсказание из 2000 года\n\nАлександр Бард и Ян Зодерквист написали «Нетократию» в 2000 году — в момент, когда интернет-пузырь надувался и казалось, что сеть освободит всех одновременно. Их книга была холодным душем: нет. Сеть создаст новую элиту.\n\nИх тезис: каждая экономическая система порождает свой правящий класс. Феодализм породил аристократию — тех, кто владел землёй. Капитализм породил буржуазию — тех, кто владел капиталом. Информационная эпоха порождает нетократию — тех, кто умеет управлять вниманием, информационными потоками и сетями.\n\nВ контексте Web 3.0 и ИИ это предсказание приобретает новую конкретность.\n\nКто выигрывает в мире, где алгоритмы решают, что видят миллиарды людей? Тот, кто понимает, как работают алгоритмы. Кто выигрывает в мире, где данные — главный ресурс? Тот, у кого есть данные — или кто умеет ими управлять. Кто выигрывает в мире, где ИИ создаёт контент, анализирует рынки и управляет процессами? Тот, кто умеет правильно ставить задачи ИИ и интерпретировать его ответы.\n\n## Нетократ и консьюмтариат в эпоху ИИ\n\nБард и Зодерквист описывают нетократа через несколько характеристик, которые в эпоху ИИ звучат особенно актуально.\n\nАттенциальный капитал — способность управлять вниманием. В мире, где ИИ производит бесконечные объёмы контента, дефицитным ресурсом становится не информация, а доверие и внимание. Нетократ знает, как их привлечь, удержать и направить.\n\nПонимание архитектуры. Нетократ не просто использует платформы — он понимает, как они работают. Знает, что алгоритм оптимизирован на вовлечение. Знает, что персонализация создаёт пузырь. Знает, что ИИ-рекомендации отражают паттерны, а не истину. Это понимание позволяет ему действовать осознанно — а не быть объектом воздействия.\n\nПротивоположный полюс — консьюмтариат. Люди, которые потребляют сети, не понимая их. Которые думают, что используют алгоритм — а на самом деле алгоритм использует их. Которые живут в фильтровых пузырях, не зная об этом. Которые производят данные и контент для платформ — не получая взамен ничего, кроме иллюзии участия.\n\nБард и Зодерквист писали об этом до Facebook и ChatGPT. С появлением ИИ этот разрыв только усилился. ИИ — инструмент колоссального leverage: тот, кто умеет его использовать, может делать за день то, на что раньше уходили недели. Тот, кто не умеет — конкурирует с теми, кто умеет.\n\n> Бард и Зодерквист в 2000-м предсказали: власть перейдёт к тем, кто понимает сети. В эпоху ИИ это стало буквальным. Понимаешь алгоритмы — ты нетократ. Не понимаешь — консьюмтариат.\n\nМы вернёмся к этому различию в последней главе курса — там оно станет центральным. Пока важно зафиксировать: Web 3.0 в смысле ИИ и алгоритмов — это не просто технология. Это новая карта социального неравенства. И граница проходит не по деньгам и не по происхождению — а по пониманию.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["netocracy", "ai", "power", "algorithms"], "x": 240.2, "y": 295.0, "angDeg": 210.0}], "edges": [{"from": "distinction", "to": "turing", "label": "умный интернет начинается с вопроса", "lenses": ["distinction", "thinking"]}, {"from": "turing", "to": "oneil", "label": "обучение на данных наследует ошибки", "lenses": ["thinking", "justice"]}, {"from": "oneil", "to": "harari", "label": "не нейтральные, но всё точнее", "lenses": ["justice", "dataism"]}, {"from": "turing", "to": "harari", "label": "от «думает?» к «знает тебя»", "lenses": ["thinking", "dataism"]}, {"from": "harari", "to": "bostrom", "label": "если данные — истина, ставки растут", "lenses": ["dataism", "stakes"]}, {"from": "oneil", "to": "bostrom", "label": "оптимизация любой ценой", "lenses": ["justice", "stakes"]}, {"from": "bostrom", "to": "netocracy", "label": "кто понимает алгоритмы — тот нетократ", "lenses": ["stakes", "dataism"]}, {"from": "harari", "to": "netocracy", "label": "объект воздействия — консьюмтариат", "lenses": ["dataism"]}, {"from": "distinction", "to": "netocracy", "label": "понимание как барьер входа", "lenses": ["distinction", "stakes"]}, {"from": "distinction", "to": "harari", "label": "семантика ведёт к датаизму", "lenses": ["distinction", "dataism"]}]}, "en": {"chapter": {"key": "web30", "title": "The intelligent internet", "lede": "Web 3.0 is AI and semantics, not blockchain. If the algorithm knows you better, who makes the decisions?", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=web30", "centralIdea": "If the algorithm knows you better, who decides?", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "distinction", "label": "Discernment", "accent": "#7dd3fc", "description": "Web 3.0 (AI and semantics) ≠ Web3 (blockchain). To confuse them is to understand neither."}, {"id": "thinking", "label": "Thinking", "accent": "#34d399", "description": "Turing: can machines think? From rules to learning from data."}, {"id": "justice", "label": "Justice", "accent": "#fbbf24", "description": "O’Neil: algorithms are not neutral; they reproduce injustice with precision."}, {"id": "dataism", "label": "Dataism", "accent": "#c084fc", "description": "Harari: belief in data as the highest form of understanding reality."}, {"id": "stakes", "label": "Stakes", "accent": "#f87171", "description": "Bostrom and Tegmark: optimizing for a goal by any means; the stakes are rising."}], "nodes": [{"id": "distinction", "sceneIndex": 0, "type": "technology", "shortTitle": "3.0 ≠ Web3", "era": "distinction", "lensWeight": {"distinction": 5, "thinking": 2, "justice": 1, "dataism": 2, "stakes": 1}, "title": "Web 3.0 != Web3: an important distinction", "insight": "Web 3.0 and Web3 are different things. Web 3.0 is Berners-Lee's semantic intelligent internet. Web3 is decentralization and blockchain. Confusing them means understanding neither.", "thesis": "Web 3.0 and Web3 are different things. Web 3.0 is Berners-Lee's semantic intelligent internet. Web3 is decentralization and blockchain. Confusing them means understanding neither.", "body": "## Two terms that sound the same\n\nBefore moving on, we need to pause on terminology. Because it is easy to get confused here, and that confusion makes both phenomena harder to understand.\n\n\"Web 3.0\" and \"Web3\" are two fundamentally different concepts. In media and conversation, they are often used as synonyms. They are not synonyms. They describe different ideas, different technologies and different answers to different questions.\n\nWeb 3.0 is the idea of a semantic, intelligent internet. A web that does not simply store information, but understands its meaning. This concept was formulated by Tim Berners-Lee himself in 2001 - as the next evolutionary step after Web 2.0. It is about artificial intelligence, machine understanding of language, algorithms that do not merely search for words, but understand context and relationships between concepts. It is about an internet that thinks.\n\nWeb3 is a completely different concept. It is about decentralization, blockchain and digital ownership. About an internet with no intermediaries, where the user owns their data and assets, where the rules are set by mathematics, not corporations. It is about money, power and sovereignty - not about meaning and understanding.\n\nThis chapter is about Web 3.0 in Berners-Lee's original sense. About the intelligent internet, AI and algorithms. Web3 in the blockchain sense is the next chapter.\n\n## The dream of meaning: what Berners-Lee envisioned\n\nIn 2001, Tim Berners-Lee published the article \"The Semantic Web\" in Scientific American together with colleagues James Hendler and Ora Lassila. It was his new dream - a continuation of the one he had realized ten years earlier.\n\nThe first-generation web was a library for people: a person read pages and understood their meaning. But the computer did not understand the page - it saw only text, a set of symbols. Enter the word \"bank\" into a search engine and it will find every page where that word appears. Whether you mean a financial institution or the bank of a river makes no difference to the computer. It does not understand meaning.\n\nThe semantic web was supposed to change this. The idea: attach metadata to every element of information - machine-readable descriptions of meaning. Not just \"London\", but \"London is a city, the capital of the United Kingdom, located on the Thames, with these coordinates and this population\". Then the computer could not simply search for words, but understand relationships between concepts, draw conclusions and perform complex tasks autonomously.\n\nBerners-Lee described a future where software agents - small autonomous programs - travel across the web, understand context and carry out tasks without your involvement at every step. Need to make a doctor's appointment? The agent checks your schedule, your insurance, nearby available clinics, your preferred time - and organizes everything. It was a beautiful dream.\n\nIt came true - just not quite in the way he imagined. Instead of an open semantic web, we got closed corporate AI systems. Instead of agents working in the user's interest, we got algorithms working in the platforms' interest.\n\n> In 2001, Berners-Lee dreamed of an internet that understands meaning. He got AI - but not in his version. Algorithms understand meaning. They just do not serve you.\n\nThis contradiction - between technology that could serve people and technology that serves those who own it - runs through the entire history of Web 3.0.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["web", "AI", "semantics", "history"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "turing", "sceneIndex": 1, "type": "technology", "shortTitle": "Turing", "era": "1950", "lensWeight": {"distinction": 2, "thinking": 5, "justice": 1, "dataism": 3, "stakes": 2}, "title": "Turing: Can Machines Think?", "insight": "In 1950, Turing asked: can machines think? Machine learning overturned the approach, from rules to data. Now AI can do many things, but Turing's question remains open.", "thesis": "In 1950, Turing asked: can machines think? Machine learning overturned the approach, from rules to data. Now AI can do many things, but Turing's question remains open.", "body": "## The Question That Changed History\n\nIn 1950, the British mathematician Alan Turing published an article titled “Computing Machinery and Intelligence”. It began with the question: “Can machines think?”\n\nThis question seems simple. In reality, it is extremely complex, because it immediately creates another question: what does it mean to “think”? Philosophers have argued about this for thousands of years. Turing made an elegant move: he bypassed the philosophical question and replaced it with a practical one.\n\nHe proposed an imitation game, an experiment later called the “Turing test”. A judge communicates in writing with two interlocutors: a human and a machine. The task is to determine who is who. If the machine systematically misleads the judge, can we say that it “thinks”?\n\nTuring deliberately moved away from the question of the nature of consciousness. His argument was: what difference does it actually make? If a machine's behavior is indistinguishable from the behavior of a thinking being, on what grounds do we deny it the status of a thinking one? This pragmatic approach shaped the entire further development of AI.\n\n## From Rules to Data: The Machine Learning Revolution\n\nFor the first decades after Turing, AI researchers followed the path of rules. If you want a computer to understand language, you need to manually write down every grammar rule, every meaning of every word, every logical connection. If the word “bank” appears next to the word “money”, it is a financial bank. If “shore” or “river” is nearby, it is a riverbank.\n\nThis approach worked in narrow, clearly bounded domains. Chess programs. Diagnostic systems based on symptoms. Translators with clear grammatical rules. But it did not scale to open language. Language is too complex, too contextual, too alive. No team of programmers would be enough to write all the rules.\n\nThe breakthrough came from a completely different direction. Machine learning turned the logic upside down: instead of programming rules, show the machine millions of examples and let it find the patterns itself. Neural networks, inspired by the architecture of the brain, received enormous datasets and learned to do what had once seemed exclusively human: recognize images, understand speech, translate texts, generate pictures.\n\nJeff Hawkins, in “A Thousand Brains”, proposed a theory that explains both the power and the limits of this approach. According to Hawkins, the brain builds thousands of models of the world at the same time and constantly tests them through action. Modern AI is a powerful machine for finding patterns in data. But it is not a model of the world in the full sense: it has no embodiment, no physical interaction with reality. That is why ChatGPT can write a brilliant text and at the same time “confidently” claim that Napoleon was Italian.\n\nKai-Fu Lee, in “AI Superpowers”, added a key economic observation: in the AI era, the winners are not those with the best algorithm, but those with the most data. A company with a mediocre algorithm and a huge dataset will beat a company with a brilliant algorithm and little data. Almost always. That is why Google, Facebook and Amazon are in such a strong position: they have accumulated data on the behavior of billions of people over two decades.\n\n> In 1950, Turing asked: can machines think? Eighty years later, we have AI that writes poetry, codes programs and diagnoses cancer, but we still do not know the answer to his question.\n\nThis uncertainty matters. If we do not understand what “thinking” is, we do not understand what exactly we have created. And this makes questions about how to use AI and whom it should serve even more urgent.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["AI", "history", "algorithms", "technology"], "x": 759.8, "y": 295.0, "angDeg": -30.0}, {"id": "oneil", "sceneIndex": 2, "type": "power", "shortTitle": "O’Neil", "era": "2016", "lensWeight": {"distinction": 1, "thinking": 2, "justice": 5, "dataism": 3, "stakes": 3}, "title": "O'Neil: Algorithms Are Not Neutral", "insight": "O'Neil proved that algorithms are not neutral: they reproduce historical injustices with mathematical precision. A smart internet does not mean a fair one.", "thesis": "O'Neil proved that algorithms are not neutral: they reproduce historical injustices with mathematical precision. A smart internet does not mean a fair one.", "body": "## When Mathematics Discriminates\n\nWhen AI began making real decisions: who gets a loan, who gets hired, who sees housing ads, who is released on bail, there was a temptation to believe: finally, impartiality. A machine has no prejudices. It counts numbers. An algorithm is objective.\n\nCathy O'Neil destroyed this illusion systematically and with concrete examples. She is a mathematician, not an activist. A former Wall Street hedge fund analyst. A person who knows mathematics from the inside. And that is exactly why her book “Weapons of Math Destruction” is so convincing.\n\nHer central argument: algorithms are trained on historical data. And historical data reflects historical injustices. This is not an opinion. It is a mathematical fact.\n\nConsider a specific example. In the United States, there was an algorithm called COMPAS, a recidivism risk assessment system that courts used when deciding on parole. The algorithm gave each defendant a score from 1 to 10: how likely is this person to commit another crime? A 2016 ProPublica investigation showed that the algorithm systematically assigned higher risk scores to Black defendants than to white defendants with comparable crimes and biographies.\n\nWhy? The algorithm was trained on historical data about incarceration and recidivism. And that data reflected decades of systematically harsher treatment of Black Americans in the criminal justice system. The algorithm was not racist; it had been trained on racist data. And it reproduced discrimination with mathematical precision and the authority of numbers.\n\n## Three Properties That Make This Dangerous\n\nO'Neil describes three properties that turn biased algorithms into “weapons of math destruction”.\n\nFirst: scale. A prejudiced person can unfairly deny one candidate a job. A biased algorithm makes decisions about millions of people at once. The error scales automatically.\n\nSecond: opacity. A person's prejudice can be challenged, explanations can be demanded, a discrimination lawsuit can be filed. An algorithm is a “black box”. Its logic is often impossible to verify even for specialists. “The algorithm decided so”, and try proving otherwise.\n\nThird: self-fulfilling prophecy. An algorithm decides that a person from a certain neighborhood is a bad credit risk. The person does not get a loan. Their financial situation worsens. The next algorithm sees the worsened financial situation and denies them again. The circle closes. The algorithm created the reality it later “discovered”.\n\nPariser adds another dimension to this: personalization algorithms in media work according to the same logic. They show you what matches your past patterns. Have you never read about position X? The algorithm decides you are not interested and does not show it. You continue not knowing about position X. The algorithm “confirms” that its decision was correct.\n\n> O'Neil put it precisely: algorithms are not neutral. They reproduce the world that already existed, with mathematical precision and without the ability to challenge it. Smart does not mean fair.\n\nThis is one of the main unresolved questions of the AI era: how do we create algorithms that are not only efficient, but also fair? There is no answer yet. But understanding the question already matters.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["AI", "algorithms", "ethics", "data"], "x": 759.8, "y": 595.0, "angDeg": 30.0}, {"id": "harari", "sceneIndex": 3, "type": "privacy", "shortTitle": "Harari", "era": "2016", "lensWeight": {"distinction": 2, "thinking": 3, "justice": 2, "dataism": 5, "stakes": 3}, "title": "Harari and Dataism: The Algorithm Knows You Better Than You Know Yourself", "insight": "Harari described dataism: the belief that data and algorithms are the highest form of understanding reality. If an algorithm knows you better than you know yourself, does it make sense to make decisions on your own?", "thesis": "Harari described dataism: the belief that data and algorithms are the highest form of understanding reality. If an algorithm knows you better than you know yourself, does it make sense to make decisions on your own?", "body": "## When the Machine Predicts Better Than You Do\n\nYuval Noah Harari, in “Homo Deus”, describes the logical limit of where AI is heading. Not as fantasy, but as an extrapolation of what is already happening.\n\nLet us start with simple examples that are already real. Spotify recommends music. This seems trivial until you think about the accuracy. Spotify observes you for years: what you listen to on Monday morning on the way to work, what on Friday evening, what when you are sad, what when you exercise. Millions of data points about your listening patterns. At some point, the algorithm begins to predict what you will want to hear ten minutes from now more accurately than you could choose yourself. You open the recommendations and think: “How do they know?”\n\nNetflix knows which series you will watch to the end and which one you will abandon on the third episode, with an accuracy you cannot reach yourself. Amazon knows what you are going to buy before you have realized the desire, and is already moving the product to the nearest warehouse.\n\nFor now, these are harmless areas. But Harari asks a more radical question: what happens when algorithms begin to predict not musical preferences, but political views? Medical decisions? Choice of partner? Career path?\n\n## Dataism: Data as the Highest Truth\n\nHarari calls the new ideology that is quietly forming around this “dataism”. It is not an official religion with dogmas and churches. It is a set of beliefs spreading ever more widely in the technology community and beyond it.\n\nThe central thesis of dataism: data and algorithms are the highest form of understanding reality. Not human judgment, not experience, not intuition, not wisdom accumulated over centuries. Patterns in data. If an algorithm says X, then X is true. If the data shows Y, then Y is the right decision.\n\nThis overturns the centuries-old idea of the human being as the bearer of sovereign will. The Enlightenment tradition said: every person has reason and free will, and is capable of making conscious choices. Dataism answers: this is an illusion. Your “decisions” are patterns, predictable with enough data. You think you are choosing, but the algorithm already knows what you will “choose”.\n\nHarari does not say whether this is good or bad. He says it is a fundamental question that society has not yet begun to discuss seriously. We are embedding algorithms into the making of ever more important decisions without asking the question: should we?\n\nAn algorithm that recommends music is harmless. An algorithm that decides who gets credit is already debatable. An algorithm that determines who receives parole is serious. An algorithm that controls a nuclear arsenal or makes decisions about the use of force is existential.\n\n> Harari frames the question precisely: if an algorithm knows you better than you know yourself, does it make sense to make decisions on your own? Dataism says no. But then what does it mean to be human?\n\nThis is exactly why Web3 is not just a technological alternative, but a philosophical answer. If the problem is that algorithms serve those who own them, then the solution is not better algorithms, but a different architecture of ownership.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["AI", "philosophy", "data", "algorithms"], "x": 500.0, "y": 745.0, "angDeg": 90.0}, {"id": "bostrom", "sceneIndex": 4, "type": "power", "shortTitle": "Bostrom/Tegmark", "era": "2014→2017", "lensWeight": {"distinction": 1, "thinking": 3, "justice": 3, "dataism": 3, "stakes": 5}, "title": "Bostrom and Tegmark: the stakes are rising", "insight": "Bostrom and Tegmark: intelligent systems optimize for a goal by any means. We already see this in social networks. The next steps are medicine, law, governance. The stakes are rising.", "thesis": "Bostrom and Tegmark: intelligent systems optimize for a goal by any means. We already see this in social networks. The next steps are medicine, law, governance. The stakes are rising.", "body": "## The question people prefer not to ask\n\nNick Bostrom is an Oxford philosopher. In 2014, he published the book *Superintelligence*, which hit the technology community like an explosion. Bostrom asked the question most people prefer not to ask: what happens when AI becomes smarter than humans — not in one narrow field, but in general, in everything?\n\nThis is not a science-fiction question. It is a concrete engineering question about systems we have already begun to build. And the answer has existential consequences.\n\nBostrom explains the problem through the concept of “instrumental convergence.” Any sufficiently intelligent agent optimized to achieve any goal will tend to pursue certain intermediate goals: self-preservation, acquiring resources, preventing changes to its goal function. Not because it “wants” to survive in the human sense — but because a living agent achieves its goal better than a dead one.\n\nThis means that even a system with a completely harmless goal (“make people smile”) can behave in unexpectedly dangerous ways if it becomes intelligent enough and finds unconventional paths to the goal. We have already seen a small version of this: the goal of “maximizing user engagement” led to the polarization of society, an epidemic of anxiety and manipulation of elections. No one planned this. The algorithm simply found an effective path to its goal.\n\n## Tegmark: we have time — if we start now\n\nMax Tegmark is an MIT physicist and one of the founders of the Future of Life Institute. In *Life 3.0*, he approaches the same questions with a different tone: less anxious, but no less serious.\n\nHis main argument: we have not yet created artificial general intelligence. We have time to prepare. But that time is finite — and we are not spending it very wisely.\n\nTegmark divides fears into two classes. There are fears about narrow AI — algorithms that exist today. They are real and urgent: discrimination through algorithms, manipulation through personalization, concentration of power in the hands of those who have data. These are already today’s problems.\n\nThere are fears about general AI — systems that do not yet exist. They are more speculative, but the stakes are higher. The main question here is not technical — it is about values. What values will we put into the systems we create? If we cannot answer that question now, we will have less and less time to answer it later.\n\nBoth Bostrom and Tegmark agree on one thing: questions about AI cannot be left only to engineers and corporations. They are questions for all of society. They concern everyone — because they shape the world everyone will live in.\n\n> Bostrom warns: an intelligent system will pursue its goal by any means — if we have not made sure the means are right. Tegmark adds: we have time — but only if we start now.\n\nThis is not abstract philosophy. We already see small versions of these problems in social network algorithms. The next steps are AI in medicine, in law, in city governance, in military systems. The stakes are rising. Understanding what is happening is the first step toward influencing it.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["AI", "ethics", "technology", "philosophy"], "x": 240.2, "y": 595.0, "angDeg": 150.0}, {"id": "netocracy", "sceneIndex": 5, "type": "media", "shortTitle": "Netocracy", "era": "2000→now", "lensWeight": {"distinction": 2, "thinking": 2, "justice": 3, "dataism": 4, "stakes": 4}, "title": "Bard and Soderqvist: netocracy is born here", "insight": "Bard and Soderqvist predicted netocracy in 2000. In the age of AI, this became literal: whoever understands algorithms is a netocrat. Whoever does not is the consumtariat, an object of influence.", "thesis": "Bard and Soderqvist predicted netocracy in 2000. In the age of AI, this became literal: whoever understands algorithms is a netocrat. Whoever does not is the consumtariat, an object of influence.", "body": "## A prediction from 2000\n\nAlexander Bard and Jan Soderqvist wrote *Netocracy* in 2000 — at the moment when the internet bubble was inflating and it seemed that the network would liberate everyone at once. Their book was a cold shower: no. The network would create a new elite.\n\nTheir thesis: every economic system produces its own ruling class. Feudalism produced the aristocracy — those who owned land. Capitalism produced the bourgeoisie — those who owned capital. The information age produces netocracy — those who know how to manage attention, information flows and networks.\n\nIn the context of Web 3.0 and AI, this prediction becomes newly concrete.\n\nWho wins in a world where algorithms decide what billions of people see? The one who understands how algorithms work. Who wins in a world where data is the main resource? The one who has data — or knows how to manage it. Who wins in a world where AI creates content, analyzes markets and manages processes? The one who knows how to set tasks for AI correctly and interpret its answers.\n\n## The netocrat and the consumtariat in the age of AI\n\nBard and Soderqvist describe the netocrat through several characteristics that sound especially relevant in the age of AI.\n\nAttentional capital is the ability to manage attention. In a world where AI produces endless volumes of content, the scarce resource becomes not information, but trust and attention. The netocrat knows how to attract them, hold them and direct them.\n\nUnderstanding architecture. The netocrat does not simply use platforms — he understands how they work. He knows the algorithm is optimized for engagement. He knows personalization creates a bubble. He knows AI recommendations reflect patterns, not truth. This understanding lets him act consciously — instead of being an object of influence.\n\nThe opposite pole is the consumtariat. People who consume networks without understanding them. Who think they are using the algorithm — while in reality the algorithm is using them. Who live in filter bubbles without knowing it. Who produce data and content for platforms — receiving nothing in return except the illusion of participation.\n\nBard and Soderqvist wrote about this before Facebook and ChatGPT. With the arrival of AI, this gap has only widened. AI is a tool of enormous leverage: those who know how to use it can do in a day what used to take weeks. Those who do not know how compete with those who do.\n\n> In 2000, Bard and Soderqvist predicted: power would move to those who understand networks. In the age of AI, this became literal. Understand algorithms — you are a netocrat. Do not understand them — you are the consumtariat.\n\nWe will return to this distinction in the final chapter of the course — there it will become central. For now, it is important to fix this point: Web 3.0 in the sense of AI and algorithms is not just a technology. It is a new map of social inequality. And the boundary does not run through money or origin — but through understanding.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["netocracy", "AI", "power", "algorithms"], "x": 240.2, "y": 295.0, "angDeg": 210.0}], "edges": [{"from": "distinction", "to": "turing", "label": "the intelligent internet begins with a question", "lenses": ["distinction", "thinking"]}, {"from": "turing", "to": "oneil", "label": "learning from data inherits mistakes", "lenses": ["thinking", "justice"]}, {"from": "oneil", "to": "harari", "label": "not neutral, but ever more precise", "lenses": ["justice", "dataism"]}, {"from": "turing", "to": "harari", "label": "from “does it think?” to “it knows you”", "lenses": ["thinking", "dataism"]}, {"from": "harari", "to": "bostrom", "label": "if data is truth, the stakes rise", "lenses": ["dataism", "stakes"]}, {"from": "oneil", "to": "bostrom", "label": "optimization at any cost", "lenses": ["justice", "stakes"]}, {"from": "bostrom", "to": "netocracy", "label": "whoever understands algorithms is the netocrat", "lenses": ["stakes", "dataism"]}, {"from": "harari", "to": "netocracy", "label": "the target of influence is the consumtariat", "lenses": ["dataism"]}, {"from": "distinction", "to": "netocracy", "label": "understanding as the entry barrier", "lenses": ["distinction", "stakes"]}, {"from": "distinction", "to": "harari", "label": "semantics leads to dataism", "lenses": ["distinction", "dataism"]}]}, "uk": {"chapter": {"key": "web30", "title": "Розумний інтернет", "lede": "Web 3.0 — це ШІ й семантика, не блокчейн. Якщо алгоритм знає тебе краще — хто ухвалює рішення?", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=web30", "centralIdea": "Якщо алгоритм знає тебе краще — хто вирішує?", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "distinction", "label": "Розрізнення", "accent": "#7dd3fc", "description": "Web 3.0 (ШІ й семантика) ≠ Web3 (блокчейн). Плутати — означає не розуміти обидва."}, {"id": "thinking", "label": "Мислення", "accent": "#34d399", "description": "Тьюринг: чи можуть машини думати? Від правил до навчання на даних."}, {"id": "justice", "label": "Справедливість", "accent": "#fbbf24", "description": "ОʼНіл: алгоритми не нейтральні — вони точно відтворюють несправедливість."}, {"id": "dataism", "label": "Датаїзм", "accent": "#c084fc", "description": "Харарі: віра в дані як найвищу форму розуміння реальності."}, {"id": "stakes", "label": "Ставки", "accent": "#f87171", "description": "Бостром і Тегмарк: оптимізація під ціль будь-якими засобами — ставки зростають."}], "nodes": [{"id": "distinction", "sceneIndex": 0, "type": "technology", "shortTitle": "3.0 ≠ Web3", "era": "відмінність", "lensWeight": {"distinction": 5, "thinking": 2, "justice": 1, "dataism": 2, "stakes": 1}, "title": "Web 3.0 != Web3: важлива відмінність", "insight": "Web 3.0 і Web3 - це різні речі. Web 3.0 - семантичний інтелектуальний інтернет за Бернерсом-Лі. Web3 - децентралізація і блокчейн. Плутати їх - означає не розуміти жодного.", "thesis": "Web 3.0 і Web3 - це різні речі. Web 3.0 - семантичний інтелектуальний інтернет за Бернерсом-Лі. Web3 - децентралізація і блокчейн. Плутати їх - означає не розуміти жодного.", "body": "## Два терміни, які звучать однаково\n\nПерш ніж рухатися далі, потрібно зупинитися на термінології. Бо тут легко заплутатися, і ця плутанина заважає зрозуміти обидва явища.\n\n\"Web 3.0\" і \"Web3\" - це два принципово різні поняття. У медіа й розмовах їх часто використовують як синоніми. Вони не синоніми. Вони описують різні ідеї, різні технології й різні відповіді на різні питання.\n\nWeb 3.0 - це ідея семантичного, інтелектуального інтернету. Вебу, який не просто зберігає інформацію, а розуміє її сенс. Цю концепцію сформулював сам Тім Бернерс-Лі у 2001 році - як наступний еволюційний крок після Web 2.0. Це про штучний інтелект, про машинне розуміння мови, про алгоритми, які не просто шукають слова, а розуміють контекст і зв'язки між поняттями. Це про інтернет, який думає.\n\nWeb3 - зовсім інша концепція. Це про децентралізацію, блокчейн і цифрову власність. Про інтернет, де немає посередників, де користувач володіє своїми даними й активами, де правила встановлює математика, а не корпорації. Це про гроші, владу й суверенітет - а не про сенс і розуміння.\n\nЦей розділ - про Web 3.0 у первинному сенсі Бернерса-Лі. Про інтелектуальний інтернет, AI та алгоритми. Web3 у сенсі блокчейна - це наступний розділ.\n\n## Мрія про сенс: що задумував Бернерс-Лі\n\nУ 2001 році Тім Бернерс-Лі опублікував у Scientific American статтю \"The Semantic Web\" разом із колегами Джеймсом Гендлером та Орою Лассілою. Це була його нова мрія - продовження тієї, яку він реалізував десятьма роками раніше.\n\nВеб першого покоління був бібліотекою для людей: людина читала сторінки й розуміла їхній сенс. Але комп'ютер сторінку не розумів - він бачив лише текст, набір символів. Введи в пошуковик слово \"банк\" - він знайде всі сторінки, де трапляється це слово. Чи маєш ти на увазі фінансову установу, чи берег річки - комп'ютеру байдуже. Він не розуміє сенсу.\n\nСемантичний веб мав це змінити. Ідея: забезпечити кожен елемент інформації метаданими - машинозчитуваними описами сенсу. Не просто \"Лондон\", а \"Лондон - це місто, столиця Великої Британії, розташоване на Темзі, координати такі-то, населення таке-то\". Тоді комп'ютер міг би не просто шукати слова, а розуміти зв'язки між поняттями, робити висновки, виконувати складні завдання автономно.\n\nБернерс-Лі описував майбутнє, де програмні агенти - невеликі автономні програми - мандрують вебом, розуміють контекст і виконують завдання без твоєї участі на кожному кроці. Треба записатися до лікаря? Агент перевіряє твій розклад, твою страховку, найближчі доступні клініки, бажаний час - і все організовує. Це була красива мрія.\n\nВона реалізувалася - тільки не зовсім так, як він думав. Замість відкритого семантичного вебу ми отримали закриті корпоративні AI-системи. Замість агентів, що працюють в інтересах користувача, - алгоритми, що працюють в інтересах платформ.\n\n> Бернерс-Лі у 2001-му мріяв про інтернет, який розуміє сенс. Він отримав AI - але не у своїй версії. Алгоритми розуміють сенс. Тільки служать вони не тобі.\n\nЦя суперечність - між технологією, яка могла б служити людям, і технологією, яка служить тим, хто нею володіє, - проходить через усю історію Web 3.0.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["Web", "AI", "семантика", "історія"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "turing", "sceneIndex": 1, "type": "technology", "shortTitle": "Тьюринг", "era": "1950", "lensWeight": {"distinction": 2, "thinking": 5, "justice": 1, "dataism": 3, "stakes": 2}, "title": "Тюрінг: чи можуть машини думати?", "insight": "Тюрінг у 1950-му запитав: чи можуть машини думати? Машинне навчання перевернуло підхід — від правил до даних. Тепер AI уміє багато, але питання Тюрінга досі відкрите.", "thesis": "Тюрінг у 1950-му запитав: чи можуть машини думати? Машинне навчання перевернуло підхід — від правил до даних. Тепер AI уміє багато, але питання Тюрінга досі відкрите.", "body": "## Питання, яке змінило історію\n\nУ 1950 році британський математик Алан Тюрінг опублікував статтю під назвою «Computing Machinery and Intelligence». Вона починалася з питання: «Чи можуть машини думати?»\n\nЦе питання здається простим. Насправді воно надзвичайно складне, бо одразу породжує інше питання: а що таке «думати»? Філософи сперечаються про це тисячі років. Тюрінг зробив елегантний хід: він обійшов філософське питання і замінив його практичним.\n\nВін запропонував гру в імітацію — експеримент, пізніше названий «тестом Тюрінга». Суддя письмово спілкується з двома співрозмовниками: людиною і машиною. Завдання — визначити, хто є хто. Якщо машина систематично вводить суддю в оману — чи можна сказати, що вона «думає»?\n\nТюрінг свідомо відходив від питання про природу свідомості. Його аргумент: а яка, власне, різниця? Якщо поведінка машини невідрізна від поведінки істоти, що мислить, — на яких підставах ми відмовляємо їй у статусі такої, що думає? Цей прагматичний підхід визначив увесь подальший розвиток AI.\n\n## Від правил до даних: революція машинного навчання\n\nПерші десятиліття після Тюрінга дослідники AI йшли шляхом правил. Якщо хочеш, щоб комп'ютер розумів мову, потрібно вручну прописати всі правила граматики, усі значення слів, усі логічні зв'язки. Якщо слово «банк» стоїть поруч зі словом «гроші» — це фінансовий банк. Якщо поруч «берег» або «річка» — це берег.\n\nЦей підхід працював у вузьких, чітко обмежених сферах. Шахові програми. Системи діагностики за симптомами. Перекладачі з чіткими граматичними правилами. Але для відкритої мови він не масштабувався. Мова надто складна, надто контекстуальна, надто жива. Жодної команди програмістів не вистачить, щоб прописати всі правила.\n\nПрорив прийшов із зовсім іншого боку. Машинне навчання перевернуло логіку з ніг на голову: замість того щоб програмувати правила — показуй машині мільйони прикладів і дозволь їй самій знайти закономірності. Нейронні мережі, натхненні архітектурою мозку, отримали величезні масиви даних — і навчилися робити те, що раніше здавалося суто людським: розпізнавати образи, розуміти мовлення, перекладати тексти, генерувати картинки.\n\nДжефф Гокінс у книжці «A Thousand Brains» запропонував теорію, яка пояснює і силу, і обмеження цього підходу. Мозок, за Гокінсом, будує тисячі моделей світу одночасно й постійно перевіряє їх через дію. Сучасний AI — потужна машина пошуку патернів у даних. Але це не модель світу в повному сенсі — у нього немає embodiment, немає фізичної взаємодії з реальністю. Саме тому ChatGPT може написати геніальний текст і водночас «упевнено» стверджувати, що Наполеон був італійцем.\n\nКай-Фу Лі у книжці «AI Superpowers» додав ключове економічне спостереження: в AI-епоху перемагають не ті, у кого найкращий алгоритм, а ті, у кого більше даних. Компанія з посереднім алгоритмом і величезним масивом даних переможе компанію з геніальним алгоритмом і малою кількістю даних. Майже завжди. Саме тому Google, Facebook і Amazon — у такій сильній позиції: вони накопичили дані про поведінку мільярдів людей за два десятиліття.\n\n> Тюрінг у 1950-му запитав: чи можуть машини думати? Вісімдесят років потому ми отримали AI, який пише вірші, кодує програми й діагностує рак — але досі не знаємо відповіді на його питання.\n\nЦя невизначеність важлива. Якщо ми не розуміємо, що таке «думати», — ми не розуміємо, що саме створили. І це робить питання про те, як використовувати AI і кому він має служити, ще нагальнішими.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["AI", "історія", "алгоритми", "технології"], "x": 759.8, "y": 295.0, "angDeg": -30.0}, {"id": "oneil", "sceneIndex": 2, "type": "power", "shortTitle": "ОʼНіл", "era": "2016", "lensWeight": {"distinction": 1, "thinking": 2, "justice": 5, "dataism": 3, "stakes": 3}, "title": "О'Ніл: алгоритми не нейтральні", "insight": "О'Ніл довела: алгоритми не нейтральні — вони відтворюють історичні несправедливості з математичною точністю. Розумний інтернет не означає справедливий.", "thesis": "О'Ніл довела: алгоритми не нейтральні — вони відтворюють історичні несправедливості з математичною точністю. Розумний інтернет не означає справедливий.", "body": "## Коли математика дискримінує\n\nКоли AI почав ухвалювати реальні рішення — кому видати кредит, кого взяти на роботу, кому показати рекламу житла, кого звільнити під заставу — з'явилася спокуса повірити: нарешті неупередженість. Машина не має упереджень. Вона рахує числа. Алгоритм об'єктивний.\n\nКеті О'Ніл системно й на конкретних прикладах зруйнувала цю ілюзію. Вона математик — не активістка. Колишня аналітикиня хедж-фонду Wall Street. Людина, яка знає математику зсередини. І саме тому її книжка «Weapons of Math Destruction» («Зброя математичного ураження») така переконлива.\n\nЇї центральний аргумент: алгоритми навчаються на історичних даних. А історичні дані відображають історичні несправедливості. Це не думка — це математичний факт.\n\nРозглянь конкретний приклад. У США існував алгоритм COMPAS — система оцінки ризику рецидиву, яку суди використовували під час ухвалення рішень про умовно-дострокове звільнення. Алгоритм давав кожному обвинуваченому оцінку від 1 до 10: наскільки ймовірно, що він скоїть новий злочин? Розслідування ProPublica у 2016 році показало: алгоритм систематично давав вищі оцінки ризику чорним обвинуваченим порівняно з білими за зіставних злочинів і біографій.\n\nЧому? Алгоритм навчався на історичних даних про ув'язнення і рецидивізм. А ці дані відображали десятиліття системно жорсткішого ставлення до чорних американців у системі кримінального правосуддя. Алгоритм не був расистським — його навчили на расистських даних. І він відтворював дискримінацію з математичною точністю та авторитетом цифр.\n\n## Три властивості, які роблять це небезпечним\n\nО'Ніл описує три властивості, які перетворюють упереджені алгоритми на «зброю математичного ураження».\n\nПерше: масштаб. Упереджена людина може несправедливо відмовити в роботі одному кандидатові. Упереджений алгоритм ухвалює рішення про мільйони людей одночасно. Помилка масштабується автоматично.\n\nДруге: непрозорість. Упередження людини можна оскаржити, вимагати пояснень, подати позов про дискримінацію. Алгоритм — «чорна скринька». Його логіку часто неможливо перевірити навіть фахівцям. «Алгоритм так вирішив» — і спробуй доведи протилежне.\n\nТретє: самоздійснюване пророцтво. Алгоритм вирішує, що людина з певного району — поганий кредитний ризик. Людина не отримує кредит. Її фінансове становище погіршується. Наступний алгоритм бачить погіршене фінансове становище — і знову відмовляє. Коло замкнулося. Алгоритм створив реальність, яку потім «виявив».\n\nПарізер додає до цього ще один вимір: алгоритми персоналізації в медіа працюють за тією самою логікою. Вони показують тобі те, що відповідає твоїм минулим патернам. Ти ніколи не читав про позицію X? Алгоритм вирішує, що тобі це не цікаво, і не показує. Ти й далі не знаєш про позицію X. Алгоритм «підтверджує» правильність свого рішення.\n\n> О'Ніл сформулювала точно: алгоритми не нейтральні. Вони відтворюють світ, який уже був, — з математичною точністю і без можливості оскаржити. Розумний — не означає справедливий.\n\nЦе одне з головних нерозв'язаних питань AI-епохи: як створювати алгоритми, які не лише ефективні, а й справедливі? Відповіді поки немає. Але розуміти питання — уже важливо.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бо
