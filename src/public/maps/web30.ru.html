мдер"], "x": 500.0, "y": 745.0, "angDeg": 90.0}, {"id": "bostrom", "sceneIndex": 4, "type": "power", "shortTitle": "Бостром/Тегмарк", "era": "2014→2017", "lensWeight": {"distinction": 1, "thinking": 3, "justice": 3, "dataism": 3, "stakes": 5}, "title": "Бостром мен Тегмарк: бәс жоғарылап келеді", "insight": "Бостром мен Тегмарк: ақылды жүйелер мақсатқа кез келген құралмен оңтайландырылады. Біз мұны әлеуметтік желілерден көріп отырмыз. Келесі қадамдар — медицина, құқық, басқару. Бәс жоғарылап келеді.", "thesis": "Бостром мен Тегмарк: ақылды жүйелер мақсатқа кез келген құралмен оңтайландырылады. Біз мұны әлеуметтік желілерден көріп отырмыз. Келесі қадамдар — медицина, құқық, басқару. Бәс жоғарылап келеді.", "body": "## Қоюдан қашатын сұрақ\n\nНик Бостром — Оксфорд философы. 2014 жылы ол технологиялық қауымдастықта жарылған бомбадай әсер еткен «Superintelligence» кітабын жариялады. Бостром көпшілік қоюдан қашатын сұрақты қойды: AI адамнан ақылдырақ болғанда не болады — тар бір салада емес, жалпы, барлық нәрседе?\n\nБұл ғылыми фантастикадағы сұрақ емес. Бұл біз құра бастаған жүйелер туралы нақты инженерлік сұрақ. Ал оның жауабы экзистенциалдық салдарға ие.\n\nБостром мәселені «инструменталдық конвергенция» ұғымы арқылы түсіндіреді. Кез келген мақсатқа жетуге оңтайландырылған жеткілікті ақылды агент белгілі бір аралық мақсаттарға ұмтылады: өзін сақтау, ресурстар жинау, өзінің мақсаттық функциясының өзгеруіне жол бермеу. Ол адамдық мағынада өмір сүргісі «келгендіктен» емес — тірі агент өз мақсатына өлі агенттен жақсырақ жететіндіктен.\n\nБұл мынаны білдіреді: тіпті мүлде зиянсыз мақсаты бар жүйе («адамдар күлімдесін») жеткілікті ақылды болып, мақсатқа жетудің қалыптан тыс жолдарын тапса, күтпегендей қауіпті әрекет етуі мүмкін. Мұның шағын нұсқасын біз қазірдің өзінде көрдік: «пайдаланушылардың қатысуын барынша арттыру» мақсаты қоғамның поляризациясына, мазасыздық эпидемиясына және сайлауларды манипуляциялауға әкелді. Мұны ешкім жоспарлаған жоқ. Алгоритм жай ғана өз мақсатына тиімді жол тапты.\n\n## Тегмарк: уақытымыз бар — егер қазір бастасақ\n\nМакс Тегмарк — MIT физигі, Future of Life Institute негізін қалаушылардың бірі. «Life 3.0» кітабында ол осы сұрақтарға басқа реңкпен келеді: үрейі азырақ, бірақ маңыздылығы кем емес.\n\nОның басты уәжі: біз әлі жалпы жасанды интеллект жасаған жоқпыз. Дайындалуға уақытымыз бар. Бірақ бұл уақыт шектеулі — әрі біз оны аса ақылмен жұмсап жатқан жоқпыз.\n\nТегмарк қорқыныштарды екі класқа бөледі. Тар AI-ға — бүгін бар алгоритмдерге қатысты қорқыныштар бар. Олар нақты әрі өзекті: алгоритмдер арқылы кемсіту, жекелендіру арқылы манипуляция, дерегі барлардың қолында биліктің шоғырлануы. Бұлар бүгіннің өзінде бар проблемалар.\n\nЖалпы AI-ға — әлі жоқ жүйелерге қатысты қорқыныштар бар. Олар көбірек болжамды, бірақ бәс жоғарырақ. Мұндағы басты сұрақ техникалық емес — құндылық туралы. Біз жасайтын жүйелерге қандай құндылықтарды енгіземіз? Егер бұл сұраққа қазір жауап бере алмасақ, кейін оған жауап беруге уақытымыз барған сайын азаяды.\n\nЕкеуі де — Бостром да, Тегмарк те — бір ойда тоғысады: AI туралы сұрақтарды тек инженерлер мен корпорацияларға қалдыруға болмайды. Бұл бүкіл қоғамның сұрақтары. Олар әркімге қатысты — өйткені бәрі өмір сүретін әлемнің қандай болатынына әсер етеді.\n\n> Бостром ескертеді: ақылды жүйе өз мақсатына кез келген құралмен жетеді — егер біз құралдардың дұрыс болуын алдын ала ойламасақ. Тегмарк қосады: уақытымыз бар — бірақ қазір бастасақ қана.\n\nБұл абстрактілі философия емес. Біз бұл проблемалардың шағын нұсқаларын әлеуметтік желілер алгоритмдерінен көріп отырмыз. Келесі қадамдар — медицинадағы, құқықтағы, қалаларды басқарудағы, әскери жүйелердегі AI. Бәс жоғарылап келеді. Не болып жатқанын түсіну — оған ықпал етудің алғашқы қадамы.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["AI", "этика", "технологиялар", "философия"], "x": 240.2, "y": 595.0, "angDeg": 150.0}, {"id": "netocracy", "sceneIndex": 5, "type": "media", "shortTitle": "Нетократия", "era": "2000→қазір", "lensWeight": {"distinction": 2, "thinking": 2, "justice": 3, "dataism": 4, "stakes": 4}, "title": "Бард пен Зодерквист: нетократия осы жерде туады", "insight": "Бард пен Зодерквист нетократияны 2000 жылы болжады. AI дәуірінде бұл тура мағынаға айналды: алгоритмдерді түсінетін адам — нетократ. Түсінбейтін адам — консюмтариат, ықпал ету объектісі.", "thesis": "Бард пен Зодерквист нетократияны 2000 жылы болжады. AI дәуірінде бұл тура мағынаға айналды: алгоритмдерді түсінетін адам — нетократ. Түсінбейтін адам — консюмтариат, ықпал ету объектісі.", "body": "## 2000 жылғы болжам\n\nАлександр Бард пен Ян Зодерквист «Нетократияны» 2000 жылы жазды — интернет көпіршігі үрленіп, желі бәрін бір мезетте азат ететіндей көрінген шақта. Олардың кітабы суық душтай әсер етті: жоқ. Желі жаңа элита жасайды.\n\nОлардың тезисі: әрбір экономикалық жүйе өз билеуші класын тудырады. Феодализм аристократияны — жерге иелік еткендерді тудырды. Капитализм буржуазияны — капиталға иелік еткендерді тудырды. Ақпараттық дәуір нетократияны — назарды, ақпарат ағындарын және желілерді басқаруды білетіндерді тудырады.\n\nWeb 3.0 және AI контексінде бұл болжам жаңа нақтылыққа ие болады.\n\nАлгоритмдер миллиардтаған адамның не көретінін шешетін әлемде кім ұтады? Алгоритмдердің қалай жұмыс істейтінін түсінетін адам. Деректер басты ресурс болған әлемде кім ұтады? Деректері бар адам — немесе оларды басқаруды білетін адам. AI контент жасап, нарықтарды талдап, процестерді басқаратын әлемде кім ұтады? AI-ға міндетті дұрыс қоюды және оның жауаптарын түсіндіруді білетін адам.\n\n## AI дәуіріндегі нетократ пен консюмтариат\n\nБард пен Зодерквист нетократты AI дәуірінде әсіресе өзекті естілетін бірнеше сипат арқылы суреттейді.\n\nАттенциялық капитал — назарды басқару қабілеті. AI шексіз көлемде контент өндіретін әлемде тапшы ресурс ақпарат емес, сенім мен назарға айналады. Нетократ оларды қалай тартуды, ұстап тұруды және бағыттауды біледі.\n\nАрхитектураны түсіну. Нетократ платформаларды жай ғана қолданбайды — олардың қалай жұмыс істейтінін түсінеді. Алгоритм қатысуды арттыруға оңтайландырылғанын біледі. Жекелендіру көпіршік жасайтынын біледі. AI-ұсынымдар шындықты емес, паттерндерді көрсететінін біледі. Бұл түсінік оған ықпал ету объектісі болмай, саналы әрекет етуге мүмкіндік береді.\n\nҚарама-қарсы полюс — консюмтариат. Желілерді түсінбей тұтынатын адамдар. Алгоритмді өздері қолданып жүрміз деп ойлайтын — ал шын мәнінде алгоритм оларды қолданатын адамдар. Фильтр көпіршіктерінде өмір сүріп, оны білмейтін адамдар. Платформалар үшін деректер мен контент өндіріп, орнына қатысу иллюзиясынан басқа ештеңе алмайтын адамдар.\n\nБард пен Зодерквист мұны Facebook пен ChatGPT-ға дейін жазған. AI пайда болғаннан кейін бұл алшақтық тек күшейді. AI — орасан зор leverage құралы: оны қолдануды білетін адам бұрын апталар кететін істі бір күнде жасай алады. Білмейтін адам — білетіндермен бәсекелеседі.\n\n> Бард пен Зодерквист 2000 жылы билік желілерді түсінетіндерге өтеді деп болжады. AI дәуірінде бұл тура мағынаға айналды. Алгоритмдерді түсінесің — сен нетократсың. Түсінбейсің — консюмтариатсың.\n\nБіз бұл айырмашылыққа курстың соңғы тарауында қайта ораламыз — онда ол орталық тақырыпқа айналады. Әзірге мынаны бекіту маңызды: AI мен алгоритмдер мағынасындағы Web 3.0 — жай ғана технология емес. Бұл әлеуметтік теңсіздіктің жаңа картасы. Ал шекара ақшаға да, шыққан тегіне де емес — түсінуге байланысты өтеді.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["нетократия", "AI", "билік", "алгоритмдер"], "x": 240.2, "y": 295.0, "angDeg": 210.0}], "edges": [{"from": "distinction", "to": "turing", "label": "ақылды интернет сұрақтан басталады", "lenses": ["distinction", "thinking"]}, {"from": "turing", "to": "oneil", "label": "деректерден үйрену қателерді мұра етеді", "lenses": ["thinking", "justice"]}, {"from": "oneil", "to": "harari", "label": "бейтарап емес, бірақ барған сайын дәлірек", "lenses": ["justice", "dataism"]}, {"from": "turing", "to": "harari", "label": "«ойлай ма?» дегеннен «сені біледі» дегенге", "lenses": ["thinking", "dataism"]}, {"from": "harari", "to": "bostrom", "label": "егер деректер ақиқат болса, тәуекелдер өседі", "lenses": ["dataism", "stakes"]}, {"from": "oneil", "to": "bostrom", "label": "кез келген құнмен оңтайландыру", "lenses": ["justice", "stakes"]}, {"from": "bostrom", "to": "netocracy", "label": "алгоритмдерді түсінген адам — нетократ", "lenses": ["stakes", "dataism"]}, {"from": "harari", "to": "netocracy", "label": "ықпал нысаны — консьюмтариат", "lenses": ["dataism"]}, {"from": "distinction", "to": "netocracy", "label": "түсіну кіру кедергісі ретінде", "lenses": ["distinction", "stakes"]}, {"from": "distinction", "to": "harari", "label": "семантика датаизмге апарады", "lenses": ["distinction", "dataism"]}]}, "uz": {"chapter": {"key": "web30", "title": "Aqlli internet", "lede": "Web 3.0 — blockchain emas, AI va semantika. Agar algoritm seni yaxshiroq bilsa, qarorni kim qabul qiladi?", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=web30", "centralIdea": "Agar algoritm seni yaxshiroq bilsa, kim qaror qiladi?", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "distinction", "label": "Farqlash", "accent": "#7dd3fc", "description": "Web 3.0 (AI va semantika) ≠ Web3 (blockchain). Ularni chalkashtirish — ikkalasini ham tushunmaslik."}, {"id": "thinking", "label": "Tafakkur", "accent": "#34d399", "description": "Turing: mashinalar oʻylay oladimi? Qoidalardan maʼlumotlarda oʻrganishga."}, {"id": "justice", "label": "Adolat", "accent": "#fbbf24", "description": "O’Neil: algoritmlar neytral emas — ular adolatsizlikni aniq takrorlaydi."}, {"id": "dataism", "label": "Dataizm", "accent": "#c084fc", "description": "Harari: maʼlumotlarga reallikni tushunishning eng oliy shakli sifatida ishonish."}, {"id": "stakes", "label": "Tikilgan narsa", "accent": "#f87171", "description": "Bostrom va Tegmark: maqsadga har qanday vosita bilan optimallashtirish — tikilgan narsa oshadi."}], "nodes": [{"id": "distinction", "sceneIndex": 0, "type": "technology", "shortTitle": "3.0 ≠ Web3", "era": "farq", "lensWeight": {"distinction": 5, "thinking": 2, "justice": 1, "dataism": 2, "stakes": 1}, "title": "Web 3.0 != Web3: muhim farq", "insight": "Web 3.0 va Web3 - boshqa-boshqa narsalar. Web 3.0 - Berners-Lee bo'yicha semantik intellektual internet. Web3 - markazsizlashuv va blockchain. Ularni chalkashtirish - ikkalasini ham tushunmaslik demak.", "thesis": "Web 3.0 va Web3 - boshqa-boshqa narsalar. Web 3.0 - Berners-Lee bo'yicha semantik intellektual internet. Web3 - markazsizlashuv va blockchain. Ularni chalkashtirish - ikkalasini ham tushunmaslik demak.", "body": "## Bir xil eshitiladigan ikki termin\n\nDavom etishdan oldin terminologiyada to'xtalish kerak. Chunki bu yerda chalkashish oson, va bu chalkashlik ikkala hodisani ham tushunishga xalaqit beradi.\n\n\"Web 3.0\" va \"Web3\" - prinsipial jihatdan ikki xil tushuncha. Media va suhbatlarda ularni ko'pincha sinonim sifatida ishlatishadi. Ular sinonim emas. Ular turli g'oyalarni, turli texnologiyalarni va turli savollarga turli javoblarni tasvirlaydi.\n\nWeb 3.0 - semantik, intellektual internet g'oyasi. Axborotni shunchaki saqlamaydigan, balki uning ma'nosini tushunadigan veb. Bu konsepsiyani 2001 yilda Tim Berners-Lee-ning o'zi - Web 2.0 dan keyingi navbatdagi evolyutsion qadam sifatida - shakllantirgan. Bu sun'iy intellekt haqida, tilni mashina darajasida tushunish haqida, shunchaki so'zlarni qidirmaydigan, balki kontekst va tushunchalar o'rtasidagi munosabatlarni tushunadigan algoritmlar haqida. Bu o'ylaydigan internet haqida.\n\nWeb3 - mutlaqo boshqa konsepsiya. Bu markazsizlashuv, blockchain va raqamli mulk haqida. Vositachilar bo'lmagan, foydalanuvchi o'z ma'lumotlari va aktivlariga egalik qiladigan, qoidalarni korporatsiyalar emas, matematika belgilaydigan internet haqida. Bu pul, hokimiyat va suverenitet haqida - ma'no va tushunish haqida emas.\n\nBu bob Berners-Lee-ning dastlabki ma'nosidagi Web 3.0 haqida. Intellektual internet, AI va algoritmlar haqida. Blockchain ma'nosidagi Web3 - keyingi bob.\n\n## Ma'no haqidagi orzu: Berners-Lee nimani ko'zlagan edi\n\n2001 yilda Tim Berners-Lee hamkasblari James Hendler va Ora Lassila bilan birga Scientific American-da \"The Semantic Web\" maqolasini e'lon qildi. Bu uning yangi orzusi edi - o'n yil avval amalga oshirgan orzusining davomi.\n\nBirinchi avlod vebi odamlar uchun kutubxona edi: odam sahifalarni o'qir va ularning ma'nosini tushunardi. Ammo kompyuter sahifani tushunmasdi - u faqat matnni, belgilar to'plamini ko'rardi. Qidiruv tizimiga \"bank\" so'zini kiritsang, u shu so'z uchraydigan barcha sahifalarni topadi. Sen moliyaviy muassasani nazarda tutyapsanmi yoki daryo qirg'og'inimi - kompyuterga baribir. U ma'noni tushunmaydi.\n\nSemantik veb buni o'zgartirishi kerak edi. G'oya: axborotning har bir elementini metama'lumotlar - ma'noning mashina o'qiy oladigan tavsiflari - bilan ta'minlash. Shunchaki \"London\" emas, balki \"London - shahar, Buyuk Britaniya poytaxti, Temza bo'yida joylashgan, koordinatalari shunday, aholisi shuncha\". Shunda kompyuter shunchaki so'zlarni qidirmay, tushunchalar o'rtasidagi munosabatlarni tushunishi, xulosa chiqarishi, murakkab vazifalarni avtonom bajarishi mumkin bo'lardi.\n\nBerners-Lee dasturiy agentlar - kichik avtonom dasturlar - veb bo'ylab sayohat qiladigan, kontekstni tushunadigan va har bir qadamda sening ishtirokingsiz vazifalarni bajaradigan kelajakni tasvirlagan. Shifokorga yozilish kerakmi? Agent sening jadvalingni, sug'urtangni, yaqin atrofdagi mavjud klinikalarni, qulay vaqtingni tekshiradi - va hammasini tashkil qiladi. Bu chiroyli orzu edi.\n\nU amalga oshdi - faqat u o'ylagandek emas. Ochiq semantik veb o'rniga biz yopiq korporativ AI-tizimlarni oldik. Foydalanuvchi manfaatida ishlaydigan agentlar o'rniga - platformalar manfaatida ishlaydigan algoritmlarni oldik.\n\n> Berners-Lee 2001 yilda ma'noni tushunadigan internetni orzu qilgan edi. U AI oldi - lekin o'z versiyasida emas. Algoritmlar ma'noni tushunadi. Faqat ular senga xizmat qilmaydi.\n\nOdamlarga xizmat qilishi mumkin bo'lgan texnologiya bilan unga egalik qiladiganlarga xizmat qiladigan texnologiya o'rtasidagi shu ziddiyat Web 3.0 tarixining hammasidan o'tadi.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["web", "AI", "semantika", "tarix"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "turing", "sceneIndex": 1, "type": "technology", "shortTitle": "Turing", "era": "1950", "lensWeight": {"distinction": 2, "thinking": 5, "justice": 1, "dataism": 3, "stakes": 2}, "title": "Turing: mashinalar o‘ylay oladimi?", "insight": "1950-yilda Turing: mashinalar o‘ylay oladimi? deb so‘radi. Mashinaviy o‘qitish yondashuvni qoidalardan ma’lumotlarga burdi. Endi AI ko‘p narsani qila oladi, ammo Turing savoli hanuz ochiq.", "thesis": "1950-yilda Turing: mashinalar o‘ylay oladimi? deb so‘radi. Mashinaviy o‘qitish yondashuvni qoidalardan ma’lumotlarga burdi. Endi AI ko‘p narsani qila oladi, ammo Turing savoli hanuz ochiq.", "body": "## Tarixni o‘zgartirgan savol\n\n1950-yilda britaniyalik matematik Alan Turing “Computing Machinery and Intelligence” nomli maqola e’lon qildi. U: “Mashinalar o‘ylay oladimi?” degan savol bilan boshlanardi.\n\nBu savol oddiy ko‘rinadi. Aslida esa u nihoyatda murakkab, chunki darhol boshqa savolni tug‘diradi: “o‘ylash” degani nima? Faylasuflar bu haqda minglab yillardan beri bahslashadi. Turing nafis yo‘l tutdi: u falsafiy savolni chetlab o‘tib, uni amaliy savol bilan almashtirdi.\n\nU imitatsiya o‘yinini — keyinchalik “Turing testi” deb atalgan tajribani taklif qildi. Hakam ikki suhbatdosh bilan yozma muloqot qiladi: inson va mashina bilan. Vazifa — kim kimligini aniqlash. Agar mashina hakamni muntazam ravishda chalg‘itsa, uni “o‘ylaydi” deyish mumkinmi?\n\nTuring ong tabiati haqidagi savoldan ongli ravishda uzoqlashdi. Uning dalili shunday edi: aslida qanday farqi bor? Agar mashinaning xatti-harakati o‘ylaydigan mavjudot xatti-harakatidan farq qilmasa, qanday asos bilan unga o‘ylovchi maqomini bermaymiz? Bu pragmatik yondashuv AI rivojining keyingi butun yo‘lini belgilab berdi.\n\n## Qoidalardan ma’lumotlarga: mashinaviy o‘qitish inqilobi\n\nTuringdan keyingi ilk o‘n yilliklarda AI tadqiqotchilari qoidalar yo‘lidan bordi. Agar kompyuter tilni tushunishini istasang, grammatikaning barcha qoidalarini, so‘zlarning barcha ma’nolarini, barcha mantiqiy bog‘lanishlarni qo‘lda yozib chiqish kerak. Agar “bank” so‘zi “pul” so‘zi yonida tursa, bu moliyaviy bank. Agar yonida “qirg‘oq” yoki “daryo” bo‘lsa, bu daryo qirg‘og‘i.\n\nBu yondashuv tor, aniq chegaralangan sohalarda ishladi. Shaxmat dasturlari. Belgilar bo‘yicha diagnostika tizimlari. Aniq grammatik qoidalarga ega tarjimonlar. Ammo ochiq til uchun u kengaya olmadi. Til juda murakkab, juda kontekstual, juda tirik. Barcha qoidalarni yozib chiqishga hech qanday dasturchilar jamoasi yetmaydi.\n\nYorilish mutlaqo boshqa tomondan keldi. Mashinaviy o‘qitish mantiqni ostin-ustun qildi: qoidalarni dasturlash o‘rniga, mashinaga millionlab misollarni ko‘rsat va qonuniyatlarni o‘zi topishiga imkon ber. Miya arxitekturasidan ilhomlangan neyron tarmoqlar ulkan ma’lumotlar massivlarini oldi va ilgari faqat insonga xosdek tuyulgan ishlarni bajarishni o‘rgandi: tasvirlarni tanish, nutqni tushunish, matnlarni tarjima qilish, rasmlar yaratish.\n\nJeff Hawkins “A Thousand Brains” kitobida bu yondashuvning kuchini ham, cheklovlarini ham tushuntiradigan nazariyani taklif qildi. Hawkinsga ko‘ra, miya bir vaqtning o‘zida dunyoning minglab modellarini quradi va ularni harakat orqali doimiy tekshiradi. Zamonaviy AI — ma’lumotlarda pattern izlaydigan qudratli mashina. Ammo bu to‘liq ma’nodagi dunyo modeli emas — unda embodiment yo‘q, reallik bilan jismoniy o‘zaro ta’sir yo‘q. Aynan shuning uchun ChatGPT dahona matn yozib, shu bilan birga Napoleon italiyalik bo‘lgan deb “ishonch bilan” ayta oladi.\n\nKai-Fu Lee “AI Superpowers” kitobida muhim iqtisodiy kuzatuvni qo‘shdi: AI davrida eng yaxshi algoritmga ega bo‘lganlar emas, eng ko‘p ma’lumotga ega bo‘lganlar g‘alaba qiladi. O‘rtacha algoritm va ulkan ma’lumotlar massiviga ega kompaniya dahona algoritm, ammo kam ma’lumotga ega kompaniyani yengadi. Deyarli har doim. Aynan shuning uchun Google, Facebook va Amazon shunday kuchli mavqeda: ular ikki o‘n yillik davomida milliardlab odamlarning xulq-atvori haqidagi ma’lumotlarni to‘plagan.\n\n> 1950-yilda Turing: mashinalar o‘ylay oladimi? deb so‘radi. Sakson yil o‘tib, biz she’r yozadigan, dasturlar kodlaydigan va saratonni diagnostika qiladigan AIga ega bo‘ldik, ammo uning savoliga javobni hali ham bilmaymiz.\n\nBu noaniqlik muhim. Agar biz “o‘ylash” nima ekanini tushunmasak, aynan nima yaratganimizni ham tushunmaymiz. Bu esa AIdan qanday foydalanish va u kimga xizmat qilishi kerakligi haqidagi savollarni yanada shoshilinch qiladi.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["AI", "tarix", "algoritmlar", "texnologiya"], "x": 759.8, "y": 295.0, "angDeg": -30.0}, {"id": "oneil", "sceneIndex": 2, "type": "power", "shortTitle": "O’Neil", "era": "2016", "lensWeight": {"distinction": 1, "thinking": 2, "justice": 5, "dataism": 3, "stakes": 3}, "title": "O'Neil: algoritmlar neytral emas", "insight": "O'Neil isbotladi: algoritmlar neytral emas — ular tarixiy adolatsizliklarni matematik aniqlik bilan qayta ishlab chiqaradi. Aqlli internet adolatli degani emas.", "thesis": "O'Neil isbotladi: algoritmlar neytral emas — ular tarixiy adolatsizliklarni matematik aniqlik bilan qayta ishlab chiqaradi. Aqlli internet adolatli degani emas.", "body": "## Matematika kamsitganda\n\nAI haqiqiy qarorlar qabul qila boshlaganda — kimga kredit berish, kimni ishga olish, kimga uy-joy reklamasini ko‘rsatish, kimni garov evaziga ozod qilish — nihoyat xolislik kelganiga ishonging keladi. Mashinada xurofot yo‘q. U raqamlarni hisoblaydi. Algoritm obyektiv.\n\nCathy O'Neil bu illyuziyani tizimli ravishda va aniq misollar bilan buzdi. U aktivist emas, matematik. Wall Street hedge-fondining sobiq tahlilchisi. Matematikani ichidan biladigan inson. Aynan shuning uchun uning “Weapons of Math Destruction” (“Matematik halokat qurollari”) kitobi juda ishonarli.\n\nUning asosiy dalili: algoritmlar tarixiy ma’lumotlarda o‘qitiladi. Tarixiy ma’lumotlar esa tarixiy adolatsizliklarni aks ettiradi. Bu fikr emas — bu matematik fakt.\n\nAniq bir misolni ko‘rib chiq. AQShda COMPAS algoritmi bor edi — sudlar shartli muddatidan oldin ozod qilish bo‘yicha qaror qabul qilganda foydalangan qayta jinoyat sodir etish xavfini baholash tizimi. Algoritm har bir ayblanuvchiga 1 dan 10 gacha baho berardi: u yangi jinoyat sodir etishi qanchalik ehtimol? ProPublicaning 2016-yilgi tadqiqoti shuni ko‘rsatdi: algoritm jinoyatlari va tarjimai hollari o‘xshash bo‘lgan holatlarda ham qora tanli ayblanuvchilarga oq tanlilarga qaraganda muntazam ravishda yuqoriroq xavf baholari bergan.\n\nNega? Algoritm qamalish va qayta jinoyat sodir etish haqidagi tarixiy ma’lumotlarda o‘qitilgan. Bu ma’lumotlar esa jinoiy adliya tizimida qora tanli amerikaliklarga o‘nlab yillar davomida tizimli ravishda qattiqroq munosabatni aks ettirgan. Algoritm irqchi emas edi — u irqchi ma’lumotlarda o‘qitilgan edi. Va diskriminatsiyani matematik aniqlik hamda raqamlar obro‘si bilan qayta ishlab chiqardi.\n\n## Buni xavfli qiladigan uch xususiyat\n\nO'Neil tarafkash algoritmlarni “matematik halokat qurollari”ga aylantiradigan uch xususiyatni tasvirlaydi.\n\nBirinchi: miqyos. Xurofotli inson bitta nomzodga ish berishdan adolatsiz bosh tortishi mumkin. Tarafkash algoritm bir vaqtning o‘zida millionlab odamlar haqida qaror qabul qiladi. Xato avtomatik ravishda miqyoslanadi.\n\nIkkinchi: shaffof emaslik. Insondagi xurofotga e’tiroz bildirish, izoh talab qilish, diskriminatsiya bo‘yicha sudga murojaat qilish mumkin. Algoritm esa “qora quti”. Uning mantiqini ko‘pincha mutaxassislar ham tekshira olmaydi. “Algoritm shunday qaror qildi” — endi aksini isbotlab ko‘r.\n\nUchinchi: o‘zini o‘zi amalga oshiradigan bashorat. Algoritm muayyan tumandan bo‘lgan odamni yomon kredit xavfi deb hisoblaydi. Odam kredit olmaydi. Uning moliyaviy ahvoli yomonlashadi. Keyingi algoritm yomonlashgan moliyaviy ahvolni ko‘radi va yana rad etadi. Doira yopildi. Algoritm keyin o‘zi “topgan” reallikni avval o‘zi yaratdi.\n\nPariser bunga yana bir o‘lcham qo‘shadi: mediadagi shaxsiylashtirish algoritmlari ham xuddi shu mantiq bilan ishlaydi. Ular senga o‘tmishdagi patternlaringga mos keladigan narsani ko‘rsatadi. X pozitsiyasi haqida hech qachon o‘qimaganmisan? Algoritm bu senga qiziq emas deb qaror qiladi va ko‘rsatmaydi. Sen X pozitsiyasi haqida bilmaslikda davom etasan. Algoritm o‘z qarorining to‘g‘riligini “tasdiqlaydi”.\n\n> O'Neil aniq ifodaladi: algoritmlar neytral emas. Ular allaqachon mavjud bo‘lgan dunyoni matematik aniqlik bilan va e’tiroz bildirish imkoniyatisiz qayta ishlab chiqaradi. Aqlli degani adolatli degani emas.\n\nBu AI davrining asosiy hal qilinmagan savollaridan biri: nafaqat samarali, balki adolatli algoritmlarni qanday yaratish mumkin? Hozircha javob yo‘q. Ammo savolni tushunishning o‘zi muhim.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["AI", "algoritmlar", "etika", "maʼlumotlar"], "x": 759.8, "y": 595.0, "angDeg": 30.0}, {"id": "harari", "sceneIndex": 3, "type": "privacy", "shortTitle": "Harari", "era": "2016", "lensWeight": {"distinction": 2, "thinking": 3, "justice": 2, "dataism": 5, "stakes": 3}, "title": "Harari va dataizm: algoritm seni o‘zingdan yaxshiroq biladi", "insight": "Harari dataizmni tasvirladi: ma’lumotlar va algoritmlar reallikni tushunishning eng oliy shakli degan e’tiqod. Agar algoritm seni o‘zingdan yaxshiroq bilsa, qarorlarni o‘zing qabul qilishning ma’nosi bormi?", "thesis": "Harari dataizmni tasvirladi: ma’lumotlar va algoritmlar reallikni tushunishning eng oliy shakli degan e’tiqod. Agar algoritm seni o‘zingdan yaxshiroq bilsa, qarorlarni o‘zing qabul qilishning ma’nosi bormi?", "body": "## Mashina sendan yaxshiroq bashorat qilganda\n\nYuval Noah Harari “Homo Deus” kitobida AI qayerga qarab ketayotganining mantiqiy chegarasini tasvirlaydi. Fantastika sifatida emas, balki allaqachon yuz berayotgan narsaning ekstrapolyatsiyasi sifatida.\n\nAllaqachon real bo‘lgan oddiy misollardan boshlaylik. Spotify musiqa tavsiya qiladi. Bu aniqlik haqida o‘ylamaguningcha arzimasdek ko‘rinadi. Spotify seni yillar davomida kuzatadi: dushanba kuni ertalab ishga ketayotganda nimani tinglaysan, juma kechasi nimani, xafa bo‘lganingda nimani, sport bilan shug‘ullanganingda nimani. Tinglash patternlaring haqida millionlab ma’lumotlar. Bir payt algoritm o‘n daqiqadan keyin nimani eshitishni xohlashingni o‘zing tanlaganingdan ham aniqroq bashorat qila boshlaydi. Tavsiyalarni ochasan va: “Ular qayerdan biladi?” deb o‘ylaysan.\n\nNetflix qaysi serialni oxirigacha ko‘rishingni, qaysinisini esa uchinchi qismda tashlab ketishingni o‘zing erisha olmaydigan aniqlik bilan biladi. Amazon sen bu istakni anglashdan oldin nima sotib olishingni biladi va mahsulotni allaqachon eng yaqin omborga ko‘chiradi.\n\nHozircha bular zararsiz sohalar. Ammo Harari yanada radikal savol beradi: algoritmlar musiqiy didlarni emas, siyosiy qarashlarni bashorat qila boshlaganda nima bo‘ladi? Tibbiy qarorlarni-chi? Juft tanlashni-chi? Karyera yo‘lini-chi?\n\n## Dataizm: ma’lumotlar eng oliy haqiqat sifatida\n\nHarari buning atrofida sezilmay shakllanayotgan yangi ideologiyani “dataizm” deb ataydi. Bu dogmalari va cherkovlari bor rasmiy din emas. Bu texnologik hamjamiyatda va undan tashqarida tobora keng tarqalayotgan e’tiqodlar to‘plami.\n\nDataizmning markaziy tezisi: ma’lumotlar va algoritmlar — reallikni tushunishning eng oliy shakli. Insoniy hukm emas, tajriba emas, intuitsiya emas, asrlar davomida to‘plangan donolik emas. Ma’lumotlardagi patternlar. Agar algoritm X desa — demak X haqiqat. Agar ma’lumotlar Yni ko‘rsatsa — demak Y to‘g‘ri qaror.\n\nBu insonni suveren iroda egasi deb bilgan ko‘p asrlik g‘oyani ag‘daradi. Ma’rifatparvarlik an’anasi shunday degan: har bir insonda aql va erkin iroda bor, u ongli tanlovlar qila oladi. Dataizm javob beradi: bu illyuziya. Sening “qarorlaring” — yetarlicha ma’lumot bo‘lsa, oldindan aytish mumkin bo‘lgan patternlar. Sen tanlayapman deb o‘ylaysan, ammo algoritm sen nimani “tanlashingni” allaqachon biladi.\n\nHarari bu yaxshi yoki yomon demaydi. U jamiyat hali jiddiy muhokama qila boshlamagan fundamental savol ekanini aytadi. Biz algoritmlarni tobora muhimroq qarorlar qabul qilishga joylashtiryapmiz, ammo savol bermayapmiz: buni qilishimiz kerakmi?\n\nMusiqa tavsiya qiladigan algoritm — zararsiz. Kimga kredit berishni hal qiladigan algoritm — allaqachon bahsli. Kimga shartli muddatidan oldin ozodlik berishni aniqlaydigan algoritm — jiddiy. Yadro arsenalini boshqaradigan yoki kuch ishlatish haqida qaror qabul qiladigan algoritm — ekzistensial.\n\n> Harari savolni aniq qo‘yadi: agar algoritm seni o‘zingdan yaxshiroq bilsa, qarorlarni o‘zing qabul qilishning ma’nosi bormi? Dataizm yo‘q deb javob beradi. Ammo unda inson bo‘lish nimani anglatadi?\n\nAynan shu savol Web3ni shunchaki texnologik muqobil emas, falsafiy javobga aylantiradi. Agar muammo algoritmlar ularga egalik qiladiganlarga xizmat qilishida bo‘lsa, yechim yaxshiroq algoritmlarda emas, egalikning boshqa arxitekturasida.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80% akes": 5}, "title": "Bostrom va Tegmark: stavkalar oshib bormoqda", "insight": "Bostrom va Tegmark: aqlli tizimlar maqsad sari har qanday vosita bilan optimallashadi. Biz buni ijtimoiy tarmoqlarda allaqachon ko‘ryapmiz. Keyingi qadamlar — tibbiyot, huquq, boshqaruv. Stavkalar oshib bormoqda.", "thesis": "Bostrom va Tegmark: aqlli tizimlar maqsad sari har qanday vosita bilan optimallashadi. Biz buni ijtimoiy tarmoqlarda allaqachon ko‘ryapmiz. Keyingi qadamlar — tibbiyot, huquq, boshqaruv. Stavkalar oshib bormoqda.", "body": "## Berishni xohlamaydigan savol\n\nNick Bostrom — Oxford faylasufi. 2014-yilda u texnologik hamjamiyatda portlagan bomba taʼsirini bergan “Superintelligence” kitobini chop etdi. Bostrom ko‘pchilik berishni xohlamaydigan savolni qo‘ydi: AI insondan aqlliroq bo‘lib qolsa nima bo‘ladi — tor bir sohada emas, umuman, hamma narsada?\n\nBu ilmiy fantastika savoli emas. Bu biz allaqachon qurishni boshlagan tizimlar haqidagi aniq muhandislik savoli. Va uning javobi ekzistensial oqibatlarga ega.\n\nBostrom muammoni “instrumental konvergentsiya” tushunchasi orqali tushuntiradi. Har qanday maqsadga erishish uchun optimallashtirilgan yetarlicha aqlli agent muayyan oraliq maqsadlarga intiladi: o‘zini saqlash, resurslar orttirish, o‘z maqsad funksiyasining o‘zgarishiga yo‘l qo‘ymaslik. U insoniy maʼnoda yashab qolishni “xohlagani” uchun emas — tirik agent o‘z maqsadiga o‘lik agentdan yaxshiroq erishgani uchun.\n\nBu shuni anglatadi: hatto mutlaqo zararsiz maqsadga ega tizim (“odamlar tabassum qilsin”) yetarlicha aqlli bo‘lib, maqsad sari nostandart yo‘llarni topsa, kutilmagan darajada xavfli harakat qilishi mumkin. Biz buning kichik versiyasini allaqachon ko‘rdik: “foydalanuvchilar jalb qilinishini maksimal oshirish” maqsadi jamiyat qutblanishiga, xavotir epidemiyasiga va saylovlar manipulyatsiyasiga olib keldi. Buni hech kim rejalashtirmagan. Algoritm shunchaki o‘z maqsadiga samarali yo‘l topdi.\n\n## Tegmark: vaqtimiz bor — agar hozir boshlasak\n\nMax Tegmark — MIT fizigi, Future of Life Institute asoschilaridan biri. “Life 3.0” kitobida u xuddi shu savollarga boshqa ohangda yondashadi: kamroq xavotirli, lekin jiddiyligi kam emas.\n\nUning asosiy dalili: biz hali umumiy sunʼiy intellekt yaratmadik. Tayyorlanish uchun vaqtimiz bor. Ammo bu vaqt cheklangan — va biz uni unchalik oqilona sarflamayapmiz.\n\nTegmark qo‘rquvlarni ikki sinfga ajratadi. Tor AI — bugun mavjud algoritmlar bilan bog‘liq qo‘rquvlar bor. Ular real va dolzarb: algoritmlar orqali diskriminatsiya, shaxsiylashtirish orqali manipulyatsiya, maʼlumotlarga ega bo‘lganlar qo‘lida hokimiyatning to‘planishi. Bular bugunning o‘zidayoq muammo.\n\nUmumiy AI — hali mavjud bo‘lmagan tizimlar bilan bog‘liq qo‘rquvlar ham bor. Ular ko‘proq taxminiy, ammo stavkalar yuqoriroq. Bu yerda asosiy savol texnik emas — u qadriyatlar haqidagi savol. Biz yaratayotgan tizimlarga qanday qadriyatlarni joylaymiz? Agar bu savolga hozir javob bera olmasak, keyin unga javob berish uchun vaqtimiz tobora kamayadi.\n\nIkkalasi — Bostrom ham, Tegmark ham — bir fikrda yakdil: AI haqidagi savollarni faqat muhandislar va korporatsiyalarga qoldirib bo‘lmaydi. Bu butun jamiyat uchun savollar. Ular har bir kishiga daxldor — chunki hamma yashaydigan dunyo qanday bo‘lishiga taʼsir qiladi.\n\n> Bostrom ogohlantiradi: aqlli tizim o‘z maqsadiga har qanday vosita bilan erishadi — agar biz vositalar to‘g‘ri bo‘lishi haqida oldindan qayg‘urmagan bo‘lsak. Tegmark qo‘shimcha qiladi: vaqtimiz bor — lekin faqat hozir boshlasak.\n\nBu abstrakt falsafa emas. Biz bu muammolarning kichik versiyalarini ijtimoiy tarmoqlar algoritmlarida allaqachon ko‘ryapmiz. Keyingi qadamlar — tibbiyotda, huquqda, shahar boshqaruvida, harbiy tizimlarda AI. Stavkalar oshib bormoqda. Nima bo‘layotganini tushunish — unga taʼsir qilishning birinchi qadami.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["AI", "etika", "texnologiya", "falsafa"], "x": 240.2, "y": 595.0, "angDeg": 150.0}, {"id": "netocracy", "sceneIndex": 5, "type": "media", "shortTitle": "Netokratiya", "era": "2000→hozir", "lensWeight": {"distinction": 2, "thinking": 2, "justice": 3, "dataism": 4, "stakes": 4}, "title": "Bard va Soderqvist: netokratiya shu yerda tugʻiladi", "insight": "Bard va Soderqvist 2000-yilda netokratiyani bashorat qilgan. AI davrida bu tom maʼnoga aylandi: algoritmlarni tushunadigan kishi — netokrat. Tushunmaydigan kishi — konsyumeriat, taʼsir obyekti.", "thesis": "Bard va Soderqvist 2000-yilda netokratiyani bashorat qilgan. AI davrida bu tom maʼnoga aylandi: algoritmlarni tushunadigan kishi — netokrat. Tushunmaydigan kishi — konsyumeriat, taʼsir obyekti.", "body": "## 2000-yildagi bashorat\n\nAlexander Bard va Jan Soderqvist “Netocracy” kitobini 2000-yilda yozdi — internet pufagi shishayotgan, tarmoq hammani bir vaqtning o‘zida ozod qiladigandek tuyulgan paytda. Ularning kitobi sovuq dush bo‘ldi: yo‘q. Tarmoq yangi elita yaratadi.\n\nUlarning tezisi: har bir iqtisodiy tizim o‘z hukmron sinfini yaratadi. Feodalizm aristokratiyani — yerga egalik qilganlarni yaratdi. Kapitalizm burjuaziyani — kapitalga egalik qilganlarni yaratdi. Axborot davri netokratiyani — eʼtibor, axborot oqimlari va tarmoqlarni boshqarishni biladiganlarni yaratadi.\n\nWeb 3.0 va AI kontekstida bu bashorat yangi aniqlik kasb etadi.\n\nAlgoritmlar milliardlab odamlar nimani ko‘rishini hal qiladigan dunyoda kim yutadi? Algoritmlar qanday ishlashini tushunadigan kishi. Maʼlumotlar asosiy resurs bo‘lgan dunyoda kim yutadi? Maʼlumotlarga ega bo‘lgan — yoki ularni boshqarishni biladigan kishi. AI kontent yaratadigan, bozorlarni tahlil qiladigan va jarayonlarni boshqaradigan dunyoda kim yutadi? AI-ga vazifalarni to‘g‘ri qo‘yishni va uning javoblarini talqin qilishni biladigan kishi.\n\n## AI davrida netokrat va konsyumeriat\n\nBard va Soderqvist netokratni AI davrida ayniqsa dolzarb eshitiladigan bir necha xususiyat orqali tasvirlaydi.\n\nAttensional kapital — eʼtiborni boshqarish qobiliyati. AI cheksiz hajmda kontent ishlab chiqaradigan dunyoda tanqis resurs axborot emas, ishonch va eʼtibor bo‘ladi. Netokrat ularni qanday jalb qilishni, ushlab turishni va yo‘naltirishni biladi.\n\nArxitekturani tushunish. Netokrat platformalardan shunchaki foydalanmaydi — ularning qanday ishlashini tushunadi. Algoritm jalb qilishga optimallashtirilganini biladi. Shaxsiylashtirish pufak yaratishini biladi. AI-tavsiyalar haqiqatni emas, patternlarni aks ettirishini biladi. Bu tushuncha unga taʼsir obyekti bo‘lish o‘rniga ongli harakat qilish imkonini beradi.\n\nQarama-qarshi qutb — konsyumeriat. Tarmoqlarni tushunmasdan isteʼmol qiladigan odamlar. Algoritmdan foydalanayapmiz deb o‘ylaydigan — aslida esa algoritm ulardan foydalanadigan odamlar. Filter pufaklarida yashab, bundan bexabar bo‘lgan odamlar. Platformalar uchun maʼlumot va kontent ishlab chiqarib, evaziga ishtirok illyuziyasidan boshqa hech narsa olmaydigan odamlar.\n\nBard va Soderqvist bu haqda Facebook va ChatGPT-dan oldin yozgan. AI paydo bo‘lishi bilan bu tafovut yanada kuchaydi. AI — ulkan leverage vositasi: undan foydalanishni biladigan kishi ilgari haftalar ketgan ishni bir kunda qila oladi. Bilmaydigan kishi esa biladiganlar bilan raqobat qiladi.\n\n> Bard va Soderqvist 2000-yilda bashorat qilgan: hokimiyat tarmoqlarni tushunadiganlarga o‘tadi. AI davrida bu tom maʼnoga aylandi. Algoritmlarni tushunsang — sen netokratsan. Tushunmasang — konsyumeriatsan.\n\nBiz bu farqqa kursning oxirgi bobida qaytamiz — u yerda bu markaziy mavzuga aylanadi. Hozircha muhim narsani qayd etamiz: AI va algoritmlar maʼnosidagi Web 3.0 shunchaki texnologiya emas. Bu ijtimoiy tengsizlikning yangi xaritasi. Chegara esa pul yoki kelib chiqish bo‘yicha emas — tushunish bo‘yicha o‘tadi.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["netokratiya", "AI", "hokimiyat", "algoritmlar"], "x": 240.2, "y": 295.0, "angDeg": 210.0}], "edges": [{"from": "distinction", "to": "turing", "label": "aqlli internet savoldan boshlanadi", "lenses": ["distinction", "thinking"]}, {"from": "turing", "to": "oneil", "label": "maʼlumotlardan oʼrganish xatolarni meros oladi", "lenses": ["thinking", "justice"]}, {"from": "oneil", "to": "harari", "label": "neytral emas, lekin tobora aniqroq", "lenses": ["justice", "dataism"]}, {"from": "turing", "to": "harari", "label": "“oʼylaydimi?”dan “seni biladi”ga", "lenses": ["thinking", "dataism"]}, {"from": "harari", "to": "bostrom", "label": "agar maʼlumotlar haqiqat boʼlsa, tikilgan narsa oshadi", "lenses": ["dataism", "stakes"]}, {"from": "oneil", "to": "bostrom", "label": "har qanday narxda optimallashtirish", "lenses": ["justice", "stakes"]}, {"from": "bostrom", "to": "netocracy", "label": "algoritmlarni tushungan — netokrat", "lenses": ["stakes", "dataism"]}, {"from": "harari", "to": "netocracy", "label": "taʼsir obyekti — konsyumatariat", "lenses": ["dataism"]}, {"from": "distinction", "to": "netocracy", "label": "tushunish kirish toʼsigʼi sifatida", "lenses": ["distinction", "stakes"]}, {"from": "distinction", "to": "harari", "label": "semantika dataizmga olib boradi", "lenses": ["distinction", "dataism"]}]}, "es": {"chapter": {"key": "web30", "title": "El internet inteligente", "lede": "Web 3.0 es IA y semántica, no blockchain. Si el algoritmo te conoce mejor, ¿quién decide?", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=web30", "centralIdea": "Si el algoritmo te conoce mejor, ¿quién decide?", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "distinction", "label": "Discernimiento", "accent": "#7dd3fc", "description": "Web 3.0 (IA y semántica) ≠ Web3 (blockchain). Confundirlos es no entender ninguno."}, {"id": "thinking", "label": "Pensamiento", "accent": "#34d399", "description": "Turing: ¿pueden pensar las máquinas? De las reglas al aprendizaje con datos."}, {"id": "justice", "label": "Justicia", "accent": "#fbbf24", "description": "O’Neil: los algoritmos no son neutrales; reproducen la injusticia con precisión."}, {"id": "dataism", "label": "Dataísmo", "accent": "#c084fc", "description": "Harari: la fe en los datos como forma superior de entender la realidad."}, {"id": "stakes", "label": "Apuestas", "accent": "#f87171", "description": "Bostrom y Tegmark: optimizar hacia un objetivo por cualquier medio; lo que está en juego aumenta."}], "nodes": [{"id": "distinction", "sceneIndex": 0, "type": "technology", "shortTitle": "3.0 ≠ Web3", "era": "distinción", "lensWeight": {"distinction": 5, "thinking": 2, "justice": 1, "dataism": 2, "stakes": 1}, "title": "Web 3.0 != Web3: una distinción importante", "insight": "Web 3.0 y Web3 son cosas distintas. Web 3.0 es el internet semántico e inteligente de Berners-Lee. Web3 es descentralización y blockchain. Confundirlos significa no entender ninguno de los dos.", "thesis": "Web 3.0 y Web3 son cosas distintas. Web 3.0 es el internet semántico e inteligente de Berners-Lee. Web3 es descentralización y blockchain. Confundirlos significa no entender ninguno de los dos.", "body": "## Dos términos que suenan igual\n\nAntes de seguir, hay que detenerse en la terminología. Porque aquí es fácil confundirse, y esa confusión dificulta entender ambos fenómenos.\n\n\"Web 3.0\" y \"Web3\" son dos conceptos fundamentalmente distintos. En los medios y en las conversaciones a menudo se usan como sinónimos. No lo son. Describen ideas distintas, tecnologías distintas y respuestas distintas a preguntas distintas.\n\nWeb 3.0 es la idea de un internet semántico e inteligente. Un web que no solo almacena información, sino que entiende su significado. Esta idea la formuló el propio Tim Berners-Lee en 2001, como el siguiente paso evolutivo después de Web 2.0. Se trata de inteligencia artificial, de comprensión automática del lenguaje, de algoritmos que no se limitan a buscar palabras, sino que entienden el contexto y las relaciones entre conceptos. Se trata de un internet que piensa.\n\nWeb3 es un concepto completamente diferente. Se trata de descentralización, blockchain y propiedad digital. De un internet sin intermediarios, donde el usuario es dueño de sus datos y activos, y donde las reglas las establece la matemática, no las corporaciones. Se trata de dinero, poder y soberanía, no de significado y comprensión.\n\nEste capítulo trata sobre Web 3.0 en el sentido original de Berners-Lee. Sobre el internet inteligente, la IA y los algoritmos. Web3 en el sentido blockchain es el capítulo siguiente.\n\n## El sueño del significado: lo que imaginó Berners-Lee\n\nEn 2001, Tim Berners-Lee publicó en Scientific American el artículo \"The Semantic Web\" junto con sus colegas James Hendler y Ora Lassila. Era su nuevo sueño, la continuación de aquel que había realizado diez años antes.\n\nLa web de la primera generación era una biblioteca para las personas: una persona leía las páginas y entendía su significado. Pero la computadora no entendía la página; solo veía texto, un conjunto de símbolos. Escribe la palabra \"banco\" en un buscador y encontrará todas las páginas en las que aparece esa palabra. Si te refieres a una institución financiera o a la orilla de un río, a la computadora le da igual. No entiende el significado.\n\nLa web semántica debía cambiar eso. La idea: dotar cada elemento de información de metadatos, descripciones legibles por máquinas del significado. No solo \"Londres\", sino \"Londres es una ciudad, la capital del Reino Unido, ubicada sobre el Támesis, con estas coordenadas y esta población\". Entonces la computadora podría no solo buscar palabras, sino entender las relaciones entre conceptos, sacar conclusiones y realizar tareas complejas de forma autónoma.\n\nBerners-Lee describía un futuro en el que agentes de software -pequeños programas autónomos- recorren la web, entienden el contexto y ejecutan tareas sin tu participación en cada paso. ¿Necesitas sacar una cita con el médico? El agente revisa tu agenda, tu seguro, las clínicas cercanas disponibles, tu horario preferido, y organiza todo. Era un sueño hermoso.\n\nSe hizo realidad, aunque no exactamente como él pensaba. En lugar de una web semántica abierta, obtuvimos sistemas cerrados de IA corporativa. En lugar de agentes que trabajan en interés del usuario, obtuvimos algoritmos que trabajan en interés de las plataformas.\n\n> En 2001, Berners-Lee soñaba con un internet que entendiera el significado. Obtuvo IA, pero no en su versión. Los algoritmos entienden el significado. Solo que no te sirven a ti.\n\nEsa contradicción, entre una tecnología que podría servir a las personas y una tecnología que sirve a quienes la poseen, recorre toda la historia de Web 3.0.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["web", "IA", "semántica", "historia"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "turing", "sceneIndex": 1, "type": "technology", "shortTitle": "Turing", "era": "1950", "lensWeight": {"distinction": 2, "thinking": 5, "justice": 1, "dataism": 3, "stakes": 2}, "title": "Turing: ¿pueden pensar las máquinas?", "insight": "En 1950, Turing preguntó: ¿pueden pensar las máquinas? El aprendizaje automático dio vuelta al enfoque, de las reglas a los datos. Ahora la IA puede hacer muchas cosas, pero la pregunta de Turing sigue abierta.", "thesis": "En 1950, Turing preguntó: ¿pueden pensar las máquinas? El aprendizaje automático dio vuelta al enfoque, de las reglas a los datos. Ahora la IA puede hacer muchas cosas, pero la pregunta de Turing sigue abierta.", "body": "## La pregunta que cambió la historia\n\nEn 1950, el matemático británico Alan Turing publicó un artículo titulado “Computing Machinery and Intelligence”. Empezaba con la pregunta: “¿Pueden pensar las máquinas?”\n\nEsta pregunta parece simple. En realidad, es extremadamente compleja, porque de inmediato plantea otra pregunta: ¿qué significa “pensar”? Los filósofos llevan miles de años discutiéndolo. Turing hizo un movimiento elegante: sorteó la pregunta filosófica y la reemplazó por una práctica.\n\nPropuso el juego de la imitación, un experimento que después se llamó “prueba de Turing”. Un juez se comunica por escrito con dos interlocutores: un humano y una máquina. La tarea es determinar quién es quién. Si la máquina engaña sistemáticamente al juez, ¿podemos decir que “piensa”?\n\nTuring se apartó deliberadamente de la pregunta sobre la naturaleza de la conciencia. Su argumento era: ¿y qué diferencia hace, en realidad? Si el comportamiento de una máquina es indistinguible del comportamiento de un ser que piensa, ¿con qué fundamento le negamos el estatus de pensante? Este enfoque pragmático marcó todo el desarrollo posterior de la IA.\n\n## De las reglas a los datos: la revolución del aprendizaje automático\n\nDurante las primeras décadas después de Turing, los investigadores de IA siguieron el camino de las reglas. Si quieres que una computadora entienda el lenguaje, tienes que escribir manualmente todas las reglas de la gramática, todos los significados de cada palabra, todas las conexiones lógicas. Si la palabra “banco” aparece junto a la palabra “dinero”, es un banco financiero. Si cerca hay “orilla” o “río”, es la orilla de un río.\n\nEste enfoque funcionaba en dominios estrechos y claramente delimitados. Programas de ajedrez. Sistemas de diagnóstico basados en síntomas. Traductores con reglas gramaticales claras. Pero no escalaba al lenguaje abierto. El lenguaje es demasiado complejo, demasiado contextual, demasiado vivo. Ningún equipo de programadores alcanzaría para escribir todas las reglas.\n\nEl avance llegó por un camino completamente distinto. El aprendizaje automático le dio vuelta a la lógica: en lugar de programar reglas, muéstrale a la máquina millones de ejemplos y deja que encuentre por sí misma los patrones. Las redes neuronales, inspiradas en la arquitectura del cerebro, recibieron enormes conjuntos de datos y aprendieron a hacer lo que antes parecía exclusivamente humano: reconocer imágenes, entender la voz, traducir textos, generar imágenes.\n\nJeff Hawkins, en “A Thousand Brains”, propuso una teoría que explica tanto la fuerza como las limitaciones de este enfoque. Según Hawkins, el cerebro construye miles de modelos del mundo al mismo tiempo y los pone a prueba constantemente mediante la acción. La IA moderna es una máquina poderosa para encontrar patrones en los datos. Pero no es un modelo del mundo en sentido pleno: no tiene embodiment, no tiene interacción física con la realidad. Por eso ChatGPT puede escribir un texto brillante y al mismo tiempo afirmar “con seguridad” que Napoleón era italiano.\n\nKai-Fu Lee, en “AI Superpowers”, añadió una observación económica clave: en la era de la IA, no ganan quienes tienen el mejor algoritmo, sino quienes tienen más datos. Una empresa con un algoritmo mediocre y un enorme volumen de datos vencerá a una empresa con un algoritmo brillante y pocos datos. Casi siempre. Por eso Google, Facebook y Amazon están en una posición tan fuerte: han acumulado datos sobre el comportamiento de miles de millones de personas durante dos décadas.\n\n> En 1950, Turing preguntó: ¿pueden pensar las máquinas? Ochenta años después, tenemos una IA que escribe poesía, programa software y diagnostica cáncer, pero todavía no sabemos la respuesta a su pregunta.\n\nEsta incertidumbre importa. Si no entendemos qué es “pensar”, no entendemos qué hemos creado exactamente. Y eso hace todavía más urgentes las preguntas sobre cómo usar la IA y a quién debe servir.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["IA", "historia", "algoritmos", "tecnología"], "x": 759.8, "y": 295.0, "angDeg": -30.0}, {"id": "oneil", "sceneIndex": 2, "type": "power", "shortTitle": "O’Neil", "era": "2016", "lensWeight": {"distinction": 1, "thinking": 2, "justice": 5, "dataism": 3, "stakes": 3}, "title": "O'Neil: los algoritmos no son neutrales", "insight": "O'Neil demostró que los algoritmos no son neutrales: reproducen injusticias históricas con precisión matemática. Un internet inteligente no significa uno justo.", "thesis": "O'Neil demostró que los algoritmos no son neutrales: reproducen injusticias históricas con precisión matemática. Un internet inteligente no significa uno justo.", "body": "## Cuando la matemática discrimina\n\nCuando la IA empezó a tomar decisiones reales —a quién darle un crédito, a quién contratar, a quién mostrarle anuncios de vivienda, a quién liberar bajo fianza— surgió la tentación de creer: por fin, imparcialidad. Una máquina no tiene prejuicios. Cuenta números. Un algoritmo es objetivo.\n\nCathy O'Neil desmontó esa ilusión de manera sistemática y con ejemplos concretos. Es matemática, no activista. Exanalista de un fondo de cobertura de Wall Street. Una persona que conoce la matemática desde dentro. Y precisamente por eso su libro “Weapons of Math Destruction” es tan convincente.\n\nSu argumento central: los algoritmos se entrenan con datos históricos. Y los datos históricos reflejan injusticias históricas. Eso no es una opinión. Es un hecho matemático.\n\nConsidera un ejemplo concreto. En Estados Unidos existió un algoritmo llamado COMPAS, un sistema de evaluación de riesgo de reincidencia que los tribunales usaban al decidir sobre la libertad condicional. El algoritmo le daba a cada acusado una puntuación del 1 al 10: ¿qué tan probable era que cometiera otro delito? Una investigación de ProPublica en 2016 mostró que el algoritmo asignaba sistemáticamente puntuaciones de riesgo más altas a los acusados negros que a los blancos con delitos y trayectorias comparables.\n\n¿Por qué? El algoritmo se entrenó con datos históricos sobre encarcelamiento y reincidencia. Y esos datos reflejaban décadas de trato sistemáticamente más severo hacia los estadounidenses negros en el sistema de justicia penal. El algoritmo no era racista; había sido entrenado con datos racistas. Y reprodujo la discriminación con precisión matemática y la autoridad de los números.\n\n## Tres propiedades que vuelven esto peligroso\n\nO'Neil describe tres propiedades que convierten a los algoritmos sesgados en “armas de destrucción matemática”.\n\nPrimera: escala. Una persona prejuiciosa puede negarle injustamente el trabajo a un solo candidato. Un algoritmo sesgado toma decisiones sobre millones de personas al mismo tiempo. El error escala automáticamente.\n\nSegunda: opacidad. El prejuicio de una persona puede cuestionarse, pueden exigirse explicaciones, se puede presentar una demanda por discriminación. Un algoritmo es una “caja negra”. A menudo su lógica es imposible de verificar incluso para especialistas. “El algoritmo lo decidió así” y trata de demostrar lo contrario.\n\nTercera: profecía autocumplida. Un algoritmo decide que una persona de cierto vecindario es un mal riesgo crediticio. La persona no obtiene un préstamo. Su situación financiera empeora. El siguiente algoritmo ve el deterioro financiero y vuelve a rechazarla. El círculo se cierra. El algoritmo creó la realidad que luego “descubrió”.\n\nPariser añade otra dimensión: los algoritmos de personalización en los medios funcionan con la misma lógica. Te muestran lo que coincide con tus patrones previos. ¿Nunca has leído sobre la posición X? El algoritmo decide que no te interesa y no te la muestra. Sigues sin saber sobre la posición X. El algoritmo “confirma” que su decisión era correcta.\n\n> O'Neil lo formuló con precisión: los algoritmos no son neutrales. Reproducen el mundo que ya existía, con precisión matemática y sin posibilidad de cuestionarlo. Ser inteligente no significa ser justo.\n\nEsta es una de las principales preguntas sin resolver de la era de la IA: ¿cómo creamos algoritmos que no solo sean eficientes, sino también justos? Todavía no hay respuesta. Pero entender la pregunta ya importa.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["IA", "algoritmos", "ética", "datos"], "x": 759.8, "y": 595.0, "angDeg": 30.0}, {"id": "harari", "sceneIndex": 3, "type": "privacy", "shortTitle": "Harari", "era": "2016", "lensWeight": {"distinction": 2, "thinking": 3, "justice": 2, "dataism": 5, "stakes": 3}, "title": "Harari y el dataísmo: el algoritmo te conoce mejor que tú mismo", "insight": "Harari describió el dataísmo: la creencia de que los datos y los algoritmos son la forma más alta de comprender la realidad. Si un algoritmo te conoce mejor que tú mismo, ¿tiene sentido tomar decisiones por tu cuenta?", "thesis": "Harari describió el dataísmo: la creencia de que los datos y
