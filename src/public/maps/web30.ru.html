ճշգրտության մասին։ Spotify-ը տարիներ շարունակ հետևում է քեզ՝ ինչ ես լսում երկուշաբթի առավոտյան աշխատանքի ճանապարհին, ինչ՝ ուրբաթ երեկոյան, ինչ՝ երբ տխուր ես, ինչ՝ երբ մարզվում ես։ Տվյալների միլիոնավոր կետեր քո լսելու սովորությունների մասին։ Որոշ պահին ալգորիթմը սկսում է կանխատեսել, թե ինչ կուզես լսել տասը րոպե հետո, ավելի ճշգրիտ, քան դու ինքդ կկարողանայիր ընտրել։ Դու բացում ես առաջարկները և մտածում՝ «Ինչպե՞ս գիտեն»։\n\nNetflix-ը գիտի, թե որ սերիալը կդիտես մինչև վերջ, իսկ որը կթողնես երրորդ էպիզոդում, այնպես, որ դա անհասանելի է քեզ համար։ Amazon-ը գիտի, թե ինչ ես պատրաստվում գնել, դեռ մինչև դու ինքդ գիտակցես այդ ցանկությունը, և արդեն տեղափոխում է ապրանքը մոտակա պահեստ։\n\nԱռայժմ սա անվնաս ոլորտ է։ Բայց Հարարին ավելի արմատական հարց է տալիս՝ ինչ է տեղի ունենում, երբ ալգորիթմները սկսում են կանխատեսել ոչ թե երաժշտական նախընտրություններ, այլ քաղաքական հայացքներ՞։ Բժշկական որոշումներ՞։ Գործընկեր ընտրություն՞։ Կարիերայի ուղի՞։\n\n## Դաթաիզմը. տվյալները որպես բարձրագույն ճշմարտություն\n\nՀարարին այս ամենի շուրջ կամաց-կամաց ձևավորվող նոր գաղափարախոսությունը կոչում է «դաթաիզմ»։ Սա ոչ թե պաշտոնական կրոն է՝ դոգմաներով ու եկեղեցիներով։ Սա համոզմունքների մի ամբողջություն է, որը ավելի ու ավելի լայնորեն տարածվում է տեխնոլոգիական համայնքում և դրանից դուրս։\n\nԴաթաիզմի կենտրոնական թեզը սա է՝ տվյալներն ու ալգորիթմները իրականությունը հասկանալու բարձրագույն ձևն են։ Ոչ մարդկային դատողությունը, ոչ փորձը, ոչ ինտուիցիան, ոչ դարերի ընթացքում կուտակված իմաստությունը։ Այլ տվյալների մեջ եղած օրինաչափությունները։ Եթե ալգորիթմը ասում է X՝ ուրեմն X-ը ճշմարիտ է։ Եթե տվյալները ցույց են տալիս Y՝ ուրեմն Y-ն է ճիշտ որոշումը։\n\nՍա շրջում է դարերով ձևավորված այն գաղափարը, ըստ որի մարդը ինքնիշխան կամքի կրող է։ Լուսավորության ավանդույթն ասում էր՝ յուրաքանչյուր մարդ ունի բանականություն և ազատ կամք, և կարող է կատարել գիտակցված ընտրություններ։ Դաթաիզմը պատասխանում է՝ սա պատրանք է։ Քո «որոշումները» նախօրոք կանխատեսելի օրինաչափություններ են, եթե բավականաչափ տվյալներ կան։ Դու կարծում ես, թե ընտրում ես, բայց ալգորիթմն արդեն գիտի, թե ինչ ես «ընտրելու»։\n\nՀարարին չի ասում՝ սա լավ է, թե վատ։ Նա ասում է, որ սա հիմնարար հարց է, որը հասարակությունը դեռ չի սկսել լուրջ քննարկել։ Մենք ալգորիթմները ներդնում ենք ավելի ու ավելի կարևոր որոշումների կայացման մեջ՝ առանց հարցնելու՝ արդյոք պետք է դա անել։\n\nԵրաժշտություն առաջարկող ալգորիթմը անվնաս է։ Ալգորիթմը, որը որոշում է՝ ում պետք է վարկ տրամադրել, արդեն վիճահարույց է։ Ալգորիթմը, որը որոշում է՝ ում տալ վաղաժամ պայմանական ազատում, լուրջ է։ Ալգորիթմը, որը կառավարում է միջուկային զինանոցը կամ որոշում է ուժի կիրառման մասին, գոյաբանական է։\n\n> Հարարին հարցը ճշգրիտ է դնում՝ եթե ալգորիթմը քեզնից լավ է ճանաչում քեզ, իմաստ ունի՞ ինքնուրույն որոշումներ կայացնել։ Դաթաիզմը պատասխանում է՝ ոչ։ Բայց այդ դեպքում ինչ է նշանակում մարդ լինել։\n\nՀենց այս հարցն է Web3-ը դարձնում ոչ թե պարզապես տեխնոլոգիական այլընտրանք, այլ փիլիսոփայական պատասխան։ Եթե խնդիրն այն է, որ ալգորիթմները ծառայում են նրանց, ովքեր դրանց տերն են, ապա լուծումը ավելի լավ ալգորիթմները չեն, այլ սեփականության այլ ճարտարապետությունը.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.goo ": "2014→2017", "lensWeight": {"distinction": 1, "thinking": 3, "justice": 3, "dataism": 3, "stakes": 5}, "title": "Բոստրոմ և Թեգմարկ. ռիսկերը աճում են", "insight": "Բոստրոմն ու Թեգմարկը. խելացի համակարգերը նպատակին հասնելու համար ցանկացած միջոց են օգտագործում։ Սա արդեն տեսնում ենք սոցիալական ցանցերում։ Հաջորդ քայլերը բժշկությունն են, իրավունքը և կառավարումը։ Խաղադրույքները աճում են։", "thesis": "Բոստրոմն ու Թեգմարկը. խելացի համակարգերը նպատակին հասնելու համար ցանկացած միջոց են օգտագործում։ Սա արդեն տեսնում ենք սոցիալական ցանցերում։ Հաջորդ քայլերը բժշկությունն են, իրավունքը և կառավարումը։ Խաղադրույքները աճում են։", "body": "## Մարդիկ նախընտրում են չտալու հարցը\n\nՆիկ Բոստրոմը Օքսֆորդի փիլիսոփա է։ 2014 թվականին նա հրապարակեց *Superintelligence* գիրքը, որը տեխնոլոգիական համայնքում պայթյունի ազդեցություն ունեցավ։ Բոստրոմը բարձրացրեց այն հարցը, որը մարդկանց մեծ մասը նախընտրում է չտալ. ի՞նչ է տեղի ունենում, երբ AI-ն դառնում է մարդուց ավելի խելացի՝ ոչ թե մի նեղ ոլորտում, այլ ընդհանրապես, ամեն ինչում։\n\nՍա գիտաֆանտաստիկայի հարց չէ։ Սա կոնկրետ ինժեներական հարց է այն համակարգերի մասին, որոնք մենք արդեն սկսել ենք կառուցել։ Եվ դրա պատասխանը գոյութենական հետևանքներ ունի։\n\nԲոստրոմը խնդիրը բացատրում է «գործիքային կոնվերգենցիա» հասկացությամբ։ Բավականաչափ խելացի ցանկացած գործակալ, որը օպտիմիզացված է որևէ նպատակի հասնելու համար, հակված կլինի ձգտելու որոշ միջանկյալ նպատակների՝ ինքնապահպանման, ռեսուրսների ձեռքբերման, իր նպատակային ֆունկցիայի փոփոխությունը կանխելու։ Ոչ այն պատճառով, որ մարդկային իմաստով «ուզում է» գոյատևել, այլ որովհետև կենդանի գործակալը իր նպատակին ավելի լավ է հասնում, քան մեռածը։\n\nՍա նշանակում է. նույնիսկ լիովին անվնաս նպատակ ունեցող համակարգը («մարդիկ ժպտան») կարող է անսպասելի վտանգավոր վարք դրսևորել, եթե բավականաչափ խելացի դառնա և գտնի նպատակին հասնելու ոչ սովորական ճանապարհներ։ Մենք արդեն տեսել ենք դրա փոքր տարբերակը. «օգտատերերի ներգրավվածությունը առավելագույնի հասցնել» նպատակը բերեց հասարակության բևեռացման, անհանգստության համաճարակի և ընտրությունների մանիպուլյացիայի։ Սա ոչ ոք չէր ծրագրել։ Ալգորիթմը պարզապես գտավ իր նպատակին տանող արդյունավետ ճանապարհը։\n\n## Թեգմարկ. ժամանակ ունենք, եթե հիմա սկսենք\n\nՄաքս Թեգմարկը MIT-ի ֆիզիկոս է և Future of Life Institute-ի հիմնադիրներից մեկը։ *Life 3.0* գրքում նա նույն հարցերին մոտենում է այլ տոնով՝ ավելի քիչ անհանգստացած, բայց ոչ պակաս լուրջ։\n\nՆրա հիմնական փաստարկը սա է. մենք դեռ չենք ստեղծել ընդհանուր արհեստական բանականություն։ Մենք ժամանակ ունենք պատրաստվելու։ Բայց այդ ժամանակը սահմանափակ է, և մենք այն առանձնապես խելամիտ չենք օգտագործում։\n\nԹեգմարկը վախերը բաժանում է երկու դասի։ Կան նեղ AI-ի մասին վախեր՝ այսօր գոյություն ունեցող ալգորիթմների մասին։ Դրանք իրական են և հրատապ. ալգորիթմների միջոցով խտրականություն, անհատականացման միջոցով մանիպուլյացիա, իշխանության կենտրոնացում նրանց ձեռքերում, ովքեր ունեն տվյալներ։ Սրանք արդեն այսօրվա խնդիրներն են։\n\nԿան ընդհանուր AI-ի մասին վախեր՝ համակարգերի, որոնք դեռ գոյություն չունեն։ Դրանք ավելի սպեկուլյատիվ են, բայց խաղադրույքներն ավելի բարձր են։ Այստեղ գլխավոր հարցը տեխնիկական չէ՝ այն արժեքների մասին է։ Ի՞նչ արժեքներ ենք դնելու այն համակարգերի մեջ, որոնք ստեղծում ենք։ Եթե հիմա չկարողանանք պատասխանել այս հարցին, հետո դրա համար ավելի ու ավելի քիչ ժամանակ կունենանք։\n\nԲոստրոմն ու Թեգմարկը մեկ հարցում համակարծիք են․ AI-ի մասին հարցերը չի կարելի թողնել միայն ինժեներներին ու կորպորացիաներին։ Սրանք ամբողջ հասարակության հարցերն են։ Դրանք վերաբերում են բոլորին, որովհետև ազդում են այն աշխարհի վրա, որտեղ ապրում են բոլորը։\n\n> Բոստրոմը զգուշացնում է. խելացի համակարգը կհասնի իր նպատակին ցանկացած միջոցներով, եթե մենք չենք համոզվել, որ այդ միջոցները ճիշտ են։ Թեգմարկը ավելացնում է. ժամանակ ունենք, բայց միայն եթե հիմա սկսենք։\n\nՍա վերացական փիլիսոփայություն չէ։ Մենք արդեն տեսնում ենք այս խնդիրների փոքր տարբերակները սոցիալական ցանցերի ալգորիթմներում։ Հաջորդ քայլերը AI-ն են բժշկությունում, իրավունքում, քաղաքների կառավարման մեջ, զինվորական համակարգերում։ Խաղադրույքները աճում են։ Տեղի ունեցողը հասկանալը առաջին քայլն է դրա վրա ազդելու համար.", "sources": [{ ատվական դարաշրջանը ստեղծում է նետոկրատիան՝ նրանց, ովքեր գիտեն կառավարել ուշադրությունը, տեղեկատվական հոսքերը և ցանցերը։\n\nWeb 3.0-ի և AI-ի համատեքստում այս կանխատեսումը ստանում է նոր, կոնկրետ ձև։\n\nՈ՞վ է հաղթում աշխարհում, որտեղ ալգորիթմները որոշում են՝ ինչ են տեսնում միլիարդավոր մարդիկ։ Նա, ով հասկանում է, թե ինչպես են աշխատում ալգորիթմները։ Ո՞վ է հաղթում աշխարհում, որտեղ տվյալները հիմնական ռեսուրսն են։ Նա, ով տվյալներ ունի, կամ գիտի՝ ինչպես դրանք կառավարել։ Ո՞վ է հաղթում աշխարհում, որտեղ AI-ն ստեղծում է բովանդակություն, վերլուծում է շուկաները և կառավարում գործընթացները։ Նա, ով գիտի, թե ինչպես ճիշտ առաջադրանքներ տալ AI-ին և մեկնաբանել նրա պատասխանները։\n\n## Նետոկրատն ու կոնսյումտարիատը AI-ի դարաշրջանում\n\nԲարդն ու Զոդերկվիստը նետոկրատին նկարագրում են մի քանի հատկանիշներով, որոնք AI-ի դարաշրջանում հատկապես արդիական են հնչում։\n\nՈւշադրության կապիտալը ուշադրությունը կառավարելու ունակությունն է։ Այն աշխարհում, որտեղ AI-ն անսպառ քանակի բովանդակություն է արտադրում, սակավ ռեսուրսը ոչ թե տեղեկատվությունն է, այլ վստահությունն ու ուշադրությունը։ Նետոկրատը գիտի, թե ինչպես դրանք գրավել, պահել և ուղղել։\n\nՃարտարապետության ընկալումը։ Նետոկրատը պարզապես չի օգտագործում հարթակները՝ նա հասկանում է, թե ինչպես են դրանք աշխատում։ Նա գիտի, որ ալգորիթմը օպտիմալացված է ներգրավվածության համար։ Նա գիտի, որ անհատականացումը փուչիկ է ստեղծում։ Նա գիտի, որ AI-ի առաջարկությունները արտացոլում են օրինաչափություններ, ոչ թե ճշմարտություն։ Այս ըմբռնումը նրան թույլ է տալիս գիտակցաբար գործել՝ այլ ոչ թե լինել ազդեցության օբյեկտ։\n\nՀակադիր բևեռն է կոնսյումտարիատը։ Մարդիկ, որոնք սպառում են ցանցերը՝ առանց դրանք հասկանալու։ Որոնք կարծում են, թե իրենք են օգտագործում ալգորիթմը, մինչդեռ իրականում ալգորիթմն է օգտագործում նրանց։ Որոնք ապրում են ֆիլտրային փուչիկներում՝ այդ մասին չիմանալով։ Որոնք տվյալներ ու բովանդակություն են արտադրում հարթակների համար՝ փոխարենը ոչինչ չստանալով, բացի մասնակցության պատրանքից։\n\nԲարդն ու Զոդերկվիստը դրա մասին գրել էին մինչև Facebook-ը և ChatGPT-ն։ AI-ի ի հայտ գալով այդ ճեղքը միայն ավելի է խորացել։ AI-ն ահռելի leverage-ի գործիք է. ով գիտի այն օգտագործել, կարող է մեկ օրում անել այն, ինչ նախկինում շաբաթներ էր պահանջում։ Ով չի գիտի, մրցում է նրանց հետ, ովքեր գիտեն։\n\n> 2000-ին Բարդն ու Զոդերկվիստը կանխատեսել էին՝ իշխանությունը կանցնի նրանց, ովքեր հասկանում են ցանցերը։ AI-ի դարաշրջանում դա դարձավ բառացի։ Հասկանում ես ալգորիթմները՝ դու նետոկրատ ես։ Չես հասկանում՝ կոնսյումտարիատ ես։\n\nՄենք կվերադառնանք այս տարբերությանը դասընթացի վերջին գլխում, որտեղ այն կդառնա կենտրոնական։ Առայժմ կարևոր է արձանագրել սա. Web 3.0-ն՝ AI-ի և ալգորիթմների իմաստով, պարզապես տեխնոլոգիա չէ։ Դա սոցիալական անհավասարության նոր քարտեզ է։ Եվ սահմանը չի անցնում ոչ փողի, ոչ էլ ծագման միջով, այլ՝ ըմբռնման միջոցով։", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0% const LANGS = ["ru", "en", "uk", "kk", "uz", "es", "fr", "hy"];
const LANG_LABELS = {"ru": "RU", "en": "EN", "uk": "UK", "kk": "KK", "uz": "UZ", "es": "ES", "fr": "FR", "hy": "HY"};
let CURRENT_LANG = 'ru';
function pickLang(l){ return LANGS.indexOf(l)>=0 ? l : 'ru'; }
function applyLang(l){
  l = pickLang(l); CURRENT_LANG = l;
  const src = CHAPTER_I18N[l];
  // подменяем содержимое рабочего CHAPTER_DATA
  CHAPTER_DATA.chapter.title = src.chapter.title;
  CHAPTER_DATA.chapter.lede = src.chapter.lede;
  CHAPTER_DATA.chapter.centralIdea = src.chapter.centralIdea;
  CHAPTER_DATA.lenses.forEach((ls,i)=>{ ls.label=src.lenses[i].label; ls.description=src.lenses[i].description; });
  CHAPTER_DATA.nodes.forEach((n,i)=>{ const s=src.nodes[i];
    n.shortTitle=s.shortTitle; n.era=s.era; n.title=s.title; n.insight=s.insight;
    n.thesis=s.thesis; n.body=s.body; n.tags=s.tags; });
  CHAPTER_DATA.edges.forEach((e,i)=>{ e.label=src.edges[i].label; });
  // UI-строки
  const _U = UI_I18N[l] || UI_I18N.ru; const _R = UI_I18N.ru || {};
  const U = {}; Object.keys(_R).forEach(k=>{ U[k] = (_U[k] && String(_U[k]).trim()) ? _U[k] : _R[k]; });
  document.documentElement.lang = l;
  const t=document.getElementById('app-title'); if(t) t.textContent=src.chapter.title;
  const ld=document.querySelector('.chapter-lede'); if(ld) ld.textContent=src.chapter.lede;
  document.querySelectorAll('[data-ui]').forEach(el=>{ const k=el.getAttribute('data-ui'); if(U[k]) el.textContent=U[k]; });
  // локализованный typeLabel + перестройка линз (иначе останутся на языке сборки)
  window.__UI_LOC = U;
  try{ buildLenses(); setLens(state.lens); }catch(e){}
  // перерисовать карту/деталь/прогресс
  try{ renderAll(); }catch(e){}
  // отметить активную кнопку языка
  document.querySelectorAll('.lang-btn').forEach(b=>b.setAttribute('aria-pressed', b.getAttribute('data-lang')===l ? 'true':'false'));
}
function buildLangSwitcher(){
  const rail=document.querySelector('.rail'); if(!rail) return;
  const wrap=document.createElement('div'); wrap.className='lang-switch';
  LANGS.forEach(l=>{ const b=document.createElement('button'); b.className='lang-btn'; b.type='button';
    b.setAttribute('data-lang',l); b.textContent=LANG_LABELS[l];
    b.addEventListener('click',()=>applyLang(l)); wrap.appendChild(b); });
  rail.insertBefore(wrap, rail.firstChild);
}


window.addEventListener("message",function(ev){try{var d=ev.data||{};if(d.lang){applyLang(d.lang);}}catch(e){}});
async function boot(){buildLangSwitcher();var _q=new URLSearchParams(location.search).get("lang");var _h=(location.hash.match(/[?&]lang=([a-z]{2})/)||[])[1];var _lp=_q||_h;if(_lp)CURRENT_LANG=pickLang(_lp);buildLenses();setLens(state.lens);applyLang(CURRENT_LANG);}
document.addEventListener("DOMContentLoaded",()=>{try{boot();}catch(e){renderEmptyState("Ошибка инициализации: "+e.message);}});
</script>
