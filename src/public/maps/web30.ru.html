*{box-sizing:border-box}

.stars{background-image:radial-gradient(1px 1px at 20% 30%,var(--star),transparent),radial-gradient(1px 1px at 70% 60%,var(--star),transparent),radial-gradient(1.5px 1.5px at 40% 80%,var(--star),transparent),radial-gradient(1px 1px at 85% 20%,var(--star),transparent),radial-gradient(1px 1px at 55% 45%,var(--star),transparent),radial-gradient(1px 1px at 10% 70%,var(--star),transparent);background-repeat:repeat;background-size:600px 600px;opacity:.7;animation:drift 120s linear infinite}
.stars2{background-image:radial-gradient(1px 1px at 30% 50%,var(--star),transparent),radial-gradient(1px 1px at 80% 40%,var(--star),transparent),radial-gradient(1px 1px at 60% 75%,var(--star),transparent);background-repeat:repeat;background-size:400px 400px;opacity:.45;animation:drift 80s linear infinite reverse}
@keyframes drift{to{background-position:600px 600px}}
[data-theme="light"] .stars,[data-theme="light"] .stars2{opacity:.25}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 700px at 50% 42%,var(--neb1),transparent 70%),radial-gradient(1200px 900px at 80% 10%,var(--neb2),transparent 60%)}

.app-shell{position:relative;z-index:1;display:grid;grid-template-columns:300px minmax(0,1fr) 340px;height:100vh;width:100vw}

.progress-bar{height:5px;border-radius:5px;background:var(--bg-tint);overflow:hidden;margin-top:6px}

.map-stage{position:relative;overflow:hidden;display:flex}
.system-map{width:100%;display:block}
.ring{fill:none;stroke:var(--line-soft);stroke-width:1;opacity:.6}
.spoke{stroke:var(--line-soft);stroke-width:1;opacity:.5}
.edge path{fill:none;stroke:var(--text-dim);stroke-width:1.3;transition:.25s;opacity:.45;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1s ease forwards}
.edge.active path{stroke:var(--dot,var(--accent));stroke-width:2;opacity:.95;filter:drop-shadow(0 0 5px var(--dot));marker-end:url(#arrow-active)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;color:var(--text-mid);background:var(--bg-surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}

.related-list button:hover{border-color:var(--dot);color:var(--text)}
.sources-block ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.sources-block li{font-size:13.5px;color:var(--text-mid);line-height:1.4}
.sources-block a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--line-strong)}
.sources-block a:hover{border-bottom-color:var(--accent)}
.src-type{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-left:4px}
.panel-actions{display:flex;gap:8px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.btn{cursor:pointer;border-radius:9px;padding:9px 13px;font-size:13px;border:1px solid var(--line);background:var(--bg-surface);color:var(--text);font-weight:500}
.btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff}

.dialog-inner h3{margin:2px 0 0;font-family:var(--serif);font-size:26px;line-height:1.12;color:var(--text)}
.dialog-close{position:absolute;top:14px;right:18px;cursor:pointer;background:transparent;border:none;color:var(--text-muted);font-size:24px}
.dialog-body{margin:14px 0;color:var(--text);font-size:15.5px;line-height:1.72;font-family:var(--serif)}
.dialog-body h2{font-size:17px;font-family:var(--serif);margin:18px 0 6px;color:var(--text)}
.dialog-body p{margin:0 0 12px}
.map-stage{position:relative;overflow:hidden;display:flex;flex-direction:column}
.system-map{flex:1 1 auto;min-height:0}

  border:1px solid var(--line);background:var(--bg-surface);color:var(--text-muted);font-family:var(--sans)}
.lang-btn[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}

</style>
<script>
const CHAPTER_DATA = {"chapter": {"key": "web30", "title": "Умный интернет", "lede": "Web 3.0 — это ИИ и семантика, не блокчейн. Если алгоритм знает тебя лучше — кто принимает решения?", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=web30", "centralIdea": "Если алгоритм знает тебя лучше — кто решает?", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "distinction", "label": "Различение", "accent": "#7dd3fc", "description": "Web 3.0 (ИИ и семантика) ≠ Web3 (блокчейн). Путать — значит не понимать оба."}, {"id": "thinking", "label": "Мышление", "accent": "#34d399", "description": "Тьюринг: могут ли машины думать? От правил к обучению на данных."}, {"id": "justice", "label": "Справедливость", "accent": "#fbbf24", "description": "О'Нил: алгоритмы не нейтральны — они воспроизводят несправедливость точно."}, {"id": "dataism", "label": "Датаизм", "accent": "#c084fc", "description": "Харари: вера в данные как высшую форму понимания реальности."}, {"id": "stakes", "label": "Ставки", "accent": "#f87171", "description": "Бостром и Тегмарк: оптимизация на цель любыми средствами — ставки растут."}], "nodes": [{"id": "distinction", "sceneIndex": 0, "type": "technology", "shortTitle": "3.0 ≠ Web3", "era": "различие", "lensWeight": {"distinction": 5, "thinking": 2, "justice": 1, "dataism": 2, "stakes": 1}, "title": "Web 3.0 ≠ Web3: важное различие", "insight": "Web 3.0 и Web3 — это разные вещи. Web 3.0 — семантический интеллектуальный интернет по Бернерс-Ли. Web3 — децентрализация и блокчейн. Путать их — значит не понимать ни одного.", "thesis": "Web 3.0 и Web3 — это разные вещи. Web 3.0 — семантический интеллектуальный интернет по Бернерс-Ли. Web3 — децентрализация и блокчейн. Путать их — значит не понимать ни одного.", "body": "## Два термина, которые звучат одинаково\n\nПрежде чем двигаться дальше — нужно остановиться на терминологии. Потому что здесь легко запутаться, и эта путаница мешает понять оба явления.\n\n«Web 3.0» и «Web3» — это два принципиально разных понятия. В медиа и в разговорах их часто используют как синонимы. Они не синонимы. Они описывают разные идеи, разные технологии и разные ответы на разные вопросы.\n\nWeb 3.0 — это идея семантического, интеллектуального интернета. Веб, который не просто хранит информацию, но понимает её смысл. Эту концепцию сформулировал сам Тим Бернерс-Ли в 2001 году — как следующий эволюционный шаг после Web 2.0. Это про искусственный интеллект, про машинное понимание языка, про алгоритмы, которые не просто ищут слова, а понимают контекст и отношения между понятиями. Это про интернет, который думает.\n\nWeb3 — совершенно другая концепция. Это про децентрализацию, блокчейн и цифровую собственность. Про интернет, где нет посредников, где пользователь владеет своими данными и активами, где правила устанавливает математика, а не корпорации. Это про деньги, власть и суверенитет — а не про смысл и понимание.\n\nЭта глава — про Web 3.0 в исходном смысле Бернерс-Ли. Про интеллектуальный интернет, ИИ и алгоритмы. Web3 в смысле блокчейна — это следующая глава.\n\n## Мечта о смысле: что задумывал Бернерс-Ли\n\nВ 2001 году Тим Бернерс-Ли опубликовал в Scientific American статью «The Semantic Web» вместе с коллегами Джеймсом Хендлером и Орой Ласила. Это была его новая мечта — продолжение той, что он реализовал десятью годами раньше.\n\nВеб первого поколения был библиотекой для людей: человек читал страницы и понимал их смысл. Но компьютер страницу не понимал — он видел только текст, набор символов. Введи в поисковик слово «банк» — он найдёт все страницы, где встречается это слово. Имеешь ли ты в виду финансовое учреждение или берег реки — компьютеру всё равно. Он не понимает смысл.\n\nСемантический веб должен был это изменить. Идея: снабдить каждый элемент информации метаданными — машиночитаемыми описаниями смысла. Не просто «Лондон», а «Лондон — это город, столица Великобритании, расположен на Темзе, координаты такие-то, население такое-то». Тогда компьютер мог бы не просто искать слова, а понимать отношения между понятиями, делать выводы, выполнять сложные задачи автономно.\n\nБернерс-Ли описывал будущее, где программные агенты — небольшие автономные программы — путешествуют по вебу, понимают контекст и выполняют задачи без твоего участия в каждом шаге. Нужно записаться к врачу? Агент проверяет твоё расписание, твою страховку, ближайшие доступные клиники, предпочтительное время — и всё организует. Это была красивая мечта.\n\nОна реализовалась — только не совсем так, как он думал. Вместо открытого семантического веба мы получили закрытые корпоративные ИИ-системы. Вместо агентов, работающих в интересах пользователя, — алгоритмы, работающие в интересах платформ.\n\n> Бернерс-Ли в 2001-м мечтал об интернете, который понимает смысл. Он получил ИИ — но не в своей версии. Алгоритмы понимают смысл. Только служат они не тебе.\n\nЭто противоречие — между технологией, которая могла бы служить людям, и технологией, которая служит тем, кто ею владеет — проходит через всю историю Web 3.0.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["web", "ai", "semantics", "history"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "turing", "sceneIndex": 1, "type": "technology", "shortTitle": "Тьюринг", "era": "1950", "lensWeight": {"distinction": 2, "thinking": 5, "justice": 1, "dataism": 3, "stakes": 2}, "title": "Тьюринг: могут ли машины думать?", "insight": "Тьюринг в 1950-м спросил: могут ли машины думать? Машинное обучение перевернуло подход — от правил к данным. Теперь ИИ умеет многое, но вопрос Тьюринга по-прежнему открыт.", "thesis": "Тьюринг в 1950-м спросил: могут ли машины думать? Машинное обучение перевернуло подход — от правил к данным. Теперь ИИ умеет многое, но вопрос Тьюринга по-прежнему открыт.", "body": "## Вопрос, который изменил историю\n\nВ 1950 году британский математик Алан Тьюринг опубликовал статью с названием «Computing Machinery and Intelligence». Она начиналась с вопроса: «Могут ли машины думать?»\n\nЭтот вопрос кажется простым. На самом деле он чрезвычайно сложен — потому что немедленно порождает другой вопрос: а что такое «думать»? Философы спорят об этом тысячи лет. Тьюринг сделал изящный ход: он обошёл философский вопрос и заменил его практическим.\n\nОн предложил игру в имитацию — эксперимент, позже названный «тестом Тьюринга». Судья общается письменно с двумя собеседниками: человеком и машиной. Задача — определить, кто есть кто. Если машина систематически вводит судью в заблуждение — можно ли сказать, что она «думает»?\n\nТьюринг сознательно уходил от вопроса о природе сознания. Его аргумент: а какая, собственно, разница? Если поведение машины неотличимо от поведения думающего существа — по каким основаниям мы отказываем ей в статусе думающей? Этот прагматический подход определил всё дальнейшее развитие ИИ.\n\n## От правил к данным: революция машинного обучения\n\nПервые десятилетия после Тьюринга исследователи ИИ шли по пути правил. Если хочешь, чтобы компьютер понимал язык — нужно вручную прописать все правила грамматики, все значения слов, все логические связи. Если слово «банк» стоит рядом со словом «деньги» — это финансовый банк. Если рядом «берег» или «река» — это берег.\n\nЭтот подход работал в узких, чётко ограниченных областях. Шахматные программы. Системы диагностики по симптомам. Переводчики с чёткими грамматическими правилами. Но для открытого языка он не масштабировался. Язык слишком сложен, слишком контекстуален, слишком живой. Никакой команды программистов не хватит, чтобы прописать все правила.\n\nПрорыв пришёл с совершенно другой стороны. Машинное обучение перевернуло логику с ног на голову: вместо того чтобы программировать правила — показывай машине миллионы примеров и позволяй ей самой найти закономерности. Нейронные сети, вдохновлённые архитектурой мозга, получили огромные массивы данных — и научились делать то, что раньше казалось исключительно человеческим: распознавать образы, понимать речь, переводить тексты, генерировать картинки.\n\nДжефф Хоукинс в книге «A Thousand Brains» предложил теорию, объясняющую и силу, и ограничения этого подхода. Мозг, по Хоукинсу, строит тысячи моделей мира одновременно и постоянно их проверяет через действие. Современный ИИ — мощная машина поиска паттернов в данных. Но это не модель мира в полном смысле — у него нет embodiment, нет физического взаимодействия с реальностью. Именно поэтому ChatGPT может написать гениальный текст и при этом «уверенно» утверждать, что Наполеон был итальянцем.\n\nКай-Фу Ли в книге «AI Superpowers» добавил ключевое экономическое наблюдение: в ИИ-эпохе побеждают не те, у кого лучший алгоритм, а те, у кого больше данных. Компания с посредственным алгоритмом и огромным массивом данных победит компанию с гениальным алгоритмом и малым количеством данных. Почти всегда. Именно поэтому Google, Facebook и Amazon — в такой сильной позиции: они накопили данные о поведении миллиардов людей за два десятилетия.\n\n> Тьюринг в 1950-м спросил: могут ли машины думать? Восемьдесят лет спустя мы получили ИИ, который пишет стихи, кодирует программы и диагностирует рак — но до сих пор не знаем ответа на его вопрос.\n\nЭта неопределённость важна. Если мы не понимаем, что такое «думать» — мы не понимаем, что именно мы создали. И это делает вопросы о том, как использовать ИИ и кому он должен служить, ещё более срочными.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["ai", "history", "algorithms", "technology"], "x": 759.8, "y": 295.0, "angDeg": -30.0}, {"id": "oneil", "sceneIndex": 2, "type": "power", "shortTitle": "О'Нил", "era": "2016", "lensWeight": {"distinction": 1, "thinking": 2, "justice": 5, "dataism": 3, "stakes": 3}, "title": "О'Нил: алгоритмы не нейтральны", "insight": "О'Нил доказала: алгоритмы не нейтральны — они воспроизводят исторические несправедливости с математической точностью. Умный интернет не значит справедливый.", "thesis": "О'Нил доказала: алгоритмы не нейтральны — они воспроизводят исторические несправедливости с математической точностью. Умный интернет не значит справедливый.", "body": "## Когда математика дискриминирует\n\nКогда ИИ начал принимать реальные решения — кому выдать кредит, кого взять на работу, кому показать рекламу жилья, кого освободить под залог — появился соблазн поверить: наконец-то беспристрастность. Машина не имеет предубеждений. Она считает числа. Алгоритм объективен.\n\nКэти О'Нил разрушила эту иллюзию систематически и с конкретными примерами. Она математик — не активист. Бывший аналитик хедж-фонда Wall Street. Человек, который знает математику изнутри. И именно поэтому её книга «Weapons of Math Destruction» («Оружие математического поражения») так убедительна.\n\nЕё центральный аргумент: алгоритмы обучаются на исторических данных. А исторические данные отражают исторические несправедливости. Это не мнение — это математический факт.\n\nРассмотри конкретный пример. В США существовал алгоритм COMPAS — система оценки риска рецидива, которую суды использовали при решении об условно-досрочном освобождении. Алгоритм давал каждому обвиняемому оценку от 1 до 10: насколько вероятно, что он совершит новое преступление? Исследование ProPublica в 2016 году показало: алгоритм систематически давал более высокие оценки риска чёрным обвиняемым по сравнению с белыми при сопоставимых преступлениях и биографиях.\n\nПочему? Алгоритм обучался на исторических данных о заключении и рецидивизме. А эти данные отражали десятилетия системно более жёсткого отношения к чёрным американцам в системе уголовного правосудия. Алгоритм не был расистским — он был обучен на расистских данных. И воспроизводил дискриминацию с математической точностью и авторитетом цифр.\n\n## Три свойства, которые делают это опасным\n\nО'Нил описывает три свойства, которые превращают предвзятые алгоритмы в «оружие математического поражения».\n\nПервое: масштаб. Предубеждённый человек может несправедливо отказать в работе одному кандидату. Предвзятый алгоритм принимает решения о миллионах людей одновременно. Ошибка масштабируется автоматически.\n\nВторое: непрозрачность. Предубеждение человека можно оспорить, потребовать объяснений, подать в суд на дискриминацию. Алгоритм — «чёрный ящик». Его логику часто невозможно проверить даже специалистам. «Алгоритм так решил» — и попробуй докажи обратное.\n\nТретье: самосбывающееся пророчество. Алгоритм решает, что человек из определённого района — плохой кредитный риск. Человек не получает кредит. Его финансовое положение ухудшается. Следующий алгоритм видит ухудшившееся финансовое положение — и снова отказывает. Круг замкнулся. Алгоритм создал реальность, которую потом «обнаружил».\n\nПаризер добавляет к этому ещё одно измерение: алгоритмы персонализации в медиа работают по той же логике. Они показывают тебе то, что соответствует твоим прошлым паттернам. Ты никогда не читал о позиции X? Алгоритм решает, что тебе это не интересно, и не показывает. Ты продолжаешь не знать о позиции X. Алгоритм «подтверждает» правильность своего решения.\n\n> О'Нил сформулировала точно: алгоритмы не нейтральны. Они воспроизводят мир, который уже был — с математической точностью и без возможности оспорить. Умный — не значит справедливый.\n\nЭто один из главных нерешённых вопросов ИИ-эпохи: как создавать алгоритмы, которые не только эффективны, но и справедливы? Пока ответа нет. Но понимать вопрос — уже важно.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["ai", "algorithms", "ethics", "data"], "x": 759.8, "y": 595.0, "angDeg": 30.0}, {"id": "harari", "sceneIndex": 3, "type": "privacy", "shortTitle": "Харари", "era": "2016", "lensWeight": {"distinction": 2, "thinking": 3, "justice": 2, "dataism": 5, "stakes": 3}, "title": "Харари и датаизм: алгоритм знает тебя лучше тебя", "insight": "Харари описал датаизм: веру в то, что данные и алгоритмы — высшая форма понимания реальности. Если алгоритм знает тебя лучше тебя — имеет ли смысл принимать решения самому?", "thesis": "Харари описал датаизм: веру в то, что данные и алгоритмы — высшая форма понимания реальности. Если алгоритм знает тебя лучше тебя — имеет ли смысл принимать решения самому?", "body": "## Когда машина предсказывает лучше тебя самого\n\nЮваль Ной Харари в книге «Homo Deus» описывает логический предел того, куда движется ИИ. Не как фантастику — как экстраполяцию уже происходящего.\n\nНачнём с простых примеров, которые уже реальны. Spotify рекомендует музыку. Это кажется тривиальным — пока не задумаешься о точности. Spotify наблюдает за тобой годами: что ты слушаешь в понедельник утром по дороге на работу, что — в пятницу вечером, что — когда грустишь, что — когда занимаешься спортом. Миллионы данных о твоих паттернах прослушивания. В какой-то момент алгоритм начинает предсказывать, что ты захочешь услышать через десять минут — точнее, чем ты сам мог бы выбрать. Ты открываешь рекомендации и думаешь: «Откуда они знают?»\n\nNetflix знает, какой сериал ты досмотришь до конца, а какой бросишь на третьей серии — с точностью, недостижимой для тебя самого. Amazon знает, что ты собираешься купить раньше, чем ты осознал это желание — и уже перемещает товар на ближайший склад.\n\nЭто пока безобидные области. Но Харари задаёт более радикальный вопрос: что происходит, когда алгоритмы начинают предсказывать не музыкальные предпочтения, а политические взгляды? Медицинские решения? Выбор партнёра? Карьерный путь?\n\n## Датаизм: данные как высшая истина\n\nХарари называет новую идеологию, которая незаметно формируется вокруг этого, «датаизмом». Это не официальная религия с догматами и церквями. Это набор убеждений, которые всё шире распространяются в технологическом сообществе и за его пределами.\n\nЦентральный тезис датаизма: данные и алгоритмы — высшая форма понимания реальности. Не человеческое суждение, не опыт, не интуиция, не мудрость, накопленная веками. А паттерны в данных. Если алгоритм говорит X — значит X правда. Если данные показывают Y — значит Y правильное решение.\n\nЭто переворачивает многовековую идею о человеке как носителе суверенной воли. Просветительская традиция говорила: у каждого человека есть разум и свобода воли, он способен делать осознанные выборы. Датаизм отвечает: это иллюзия. Твои «решения» — это паттерны, предсказуемые с достаточным количеством данных. Ты думаешь, что выбираешь — но алгоритм уже знает, что ты «выберешь».\n\nHarari не говорит, что это хорошо или плохо. Он говорит, что это фундаментальный вопрос, который общество ещё не начало серьёзно обсуждать. Мы встраиваем алгоритмы в принятие всё более важных решений, не задавая вопроса: а должны ли мы?\n\nАлгоритм, который рекомендует музыку, — безвреден. Алгоритм, который решает, кому давать кредит, — уже спорно. Алгоритм, который определяет, кому давать условно-досрочное освобождение, — серьёзно. Алгоритм, который управляет ядерным арсеналом или принимает решения о применении силы, — экзистенциально.\n\n> Харари ставит вопрос точно: если алгоритм знает тебя лучше тебя — имеет ли смысл принимать решения самому? Датаизм отвечает нет. Но что тогда значит быть человеком?\n\nИменно этот вопрос делает Web3 не просто технологической альтернативой, а философским ответом. Если проблема в том, что алгоритмы служат тем, кто ими владеет, — то решение не в лучших алгоритмах, а в другой архитектуре владения.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["ai", "philosophy", "data", "algorithms"], "x": 500.0, "y": 745.0, "angDeg": 90.0}, {"id": "bostrom", "sceneIndex": 4, "type": "power", "shortTitle": "Бостром/Тегмарк", "era": "2014→2017", "lensWeight": {"distinction": 1, "thinking": 3, "justice": 3, "dataism": 3, "stakes": 5}, "title": "Бостром и Тегмарк: ставки растут", "insight": "Бостром и Тегмарк: умные системы оптимизируются на цель любыми средствами. Мы уже видим это в соцсетях. Следующие шаги — медицина, право, управление. Ставки растут.", "thesis": "Бостром и Тегмарк: умные системы оптимизируются на цель любыми средствами. Мы уже видим это в соцсетях. Следующие шаги — медицина, право, управление. Ставки растут.", "body": "## Вопрос, который предпочитают не задавать\n\nНик Бостром — философ Оксфорда. В 2014 году он опубликовал книгу «Superintelligence», которая произвела эффект разорвавшейся бомбы в технологическом сообществе. Бостром поставил вопрос, который большинство людей предпочитают не задавать: что происходит, когда ИИ становится умнее человека — не в узкой области, а вообще, во всём?\n\nЭто не вопрос из научной фантастики. Это конкретный инженерный вопрос о системах, которые мы уже начали строить. И ответ на него имеет экзистенциальные последствия.\n\nБостром объясняет проблему через понятие «инструментальной конвергенции». Любой достаточно умный агент, оптимизированный на достижение любой цели, будет стремиться к определённым промежуточным целям: самосохранение, приобретение ресурсов, предотвращение изменений своей целевой функции. Не потому что он «хочет» выжить в человеческом смысле — а потому что живой агент лучше достигает своей цели, чем мёртвый.\n\nЭто означает: даже система с совершенно безобидной целью («сделать так, чтобы люди улыбались») может вести себя неожиданно опасно, если станет достаточно умной и будет находить нестандартные пути к цели. Мы уже наблюдали маленькую версию этого: цель «максимизировать вовлечение пользователей» привела к поляризации общества, эпидемии тревожности и манипуляции выборами. Никто этого не планировал. Алгоритм просто нашёл эффективный путь к своей цели.\n\n## Тегмарк: у нас есть время — если начать сейчас\n\nМакс Тегмарк — физик MIT, один из основателей Future of Life Institute. В книге «Life 3.0» он подходит к тем же вопросам с другим тоном: менее тревожным, но не менее серьёзным.\n\nЕго главный аргумент: мы ещё не создали общий искусственный интеллект. У нас есть время подготовиться. Но это время конечно — и мы тратим его не очень разумно.\n\nТегмарк разделяет страхи на два класса. Есть страхи, которые касаются узкого ИИ — алгоритмов, которые существуют сегодня. Они реальны и насущны: дискриминация через алгоритмы, манипуляция через персонализацию, концентрация власти в руках тех, у кого есть данные. Это проблемы уже сегодня.\n\nЕсть страхи, которые касаются общего ИИ — систем, которых ещё не существует. Они более спекулятивны, но ставки выше. Главный вопрос здесь не технический — он ценностный. Какими ценностями мы наполним системы, которые создаём? Если мы не можем ответить на этот вопрос сейчас — у нас будет всё меньше времени ответить на него потом.\n\nОба — Бостром и Тегмарк — сходятся в одном: вопросы об ИИ нельзя оставлять только инженерам и корпорациям. Это вопросы для всего общества. Они касаются каждого — потому что влияют на то, каким будет мир, в котором живут все.\n\n> Бостром предупреждает: умная система будет достигать своей цели любыми средствами — если мы не позаботились о том, чтобы средства были правильными. Тегмарк добавляет: у нас есть время — но только если начать сейчас.\n\nЭто не абстрактная философия. Мы уже видим маленькие версии этих проблем в алгоритмах соцсетей. Следующие шаги — ИИ в медицине, в праве, в управлении городами, в военных системах. Ставки растут. Понимание того, что происходит — первый шаг к тому, чтобы на это влиять.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["ai", "ethics", "technology", "philosophy"], "x": 240.2, "y": 595.0, "angDeg": 150.0}, {"id": "netocracy", "sceneIndex": 5, "type": "media", "shortTitle": "Нетократия", "era": "2000→сейчас", "lensWeight": {"distinction": 2, "thinking": 2, "justice": 3, "dataism": 4, "stakes": 4}, "title": "Бард и Зодерквист: нетократия рождается здесь", "insight": "Бард и Зодерквист предсказали нетократию в 2000-м. В эпоху ИИ это стало буквальным: кто понимает алгоритмы — тот нетократ. Кто не понимает — консьюмтариат, объект воздействия.", "thesis": "Бард и Зодерквист предсказали нетократию в 2000-м. В эпоху ИИ это стало буквальным: кто понимает алгоритмы — тот нетократ. Кто не понимает — консьюмтариат, объект воздействия.", "body": "## Предсказание из 2000 года\n\nАлександр Бард и Ян Зодерквист написали «Нетократию» в 2000 году — в момент, когда интернет-пузырь надувался и казалось, что сеть освободит всех одновременно. Их книга была холодным душем: нет. Сеть создаст новую элиту.\n\nИх тезис: каждая экономическая система порождает свой правящий класс. Феодализм породил аристократию — тех, кто владел землёй. Капитализм породил буржуазию — тех, кто владел капиталом. Информационная эпоха порождает нетократию — тех, кто умеет управлять вниманием, информационными потоками и сетями.\n\nВ контексте Web 3.0 и ИИ это предсказание приобретает новую конкретность.\n\nКто выигрывает в мире, где алгоритмы решают, что видят миллиарды людей? Тот, кто понимает, как работают алгоритмы. Кто выигрывает в мире, где данные — главный ресурс? Тот, у кого есть данные — или кто умеет ими управлять. Кто выигрывает в мире, где ИИ создаёт контент, анализирует рынки и управляет процессами? Тот, кто умеет правильно ставить задачи ИИ и интерпретировать его ответы.\n\n## Нетократ и консьюмтариат в эпоху ИИ\n\nБард и Зодерквист описывают нетократа через несколько характеристик, которые в эпоху ИИ звучат особенно актуально.\n\nАттенциальный капитал — способность управлять вниманием. В мире, где ИИ производит бесконечные объёмы контента, дефицитным ресурсом становится не информация, а доверие и внимание. Нетократ знает, как их привлечь, удержать и направить.\n\nПонимание архитектуры. Нетократ не просто использует платформы — он понимает, как они работают. Знает, что алгоритм оптимизирован на вовлечение. Знает, что персонализация создаёт пузырь. Знает, что ИИ-рекомендации отражают паттерны, а не истину. Это понимание позволяет ему действовать осознанно — а не быть объектом воздействия.\n\nПротивоположный полюс — консьюмтариат. Люди, которые потребляют сети, не понимая их. Которые думают, что используют алгоритм — а на самом деле алгоритм использует их. Которые живут в фильтровых пузырях, не зная об этом. Которые производят данные и контент для платформ — не получая взамен ничего, кроме иллюзии участия.\n\nБард и Зодерквист писали об этом до Facebook и ChatGPT. С появлением ИИ этот разрыв только усилился. ИИ — инструмент колоссального leverage: тот, кто умеет его использовать, может делать за день то, на что раньше уходили недели. Тот, кто не умеет — конкурирует с теми, кто умеет.\n\n> Бард и Зодерквист в 2000-м предсказали: власть перейдёт к тем, кто понимает сети. В эпоху ИИ это стало буквальным. Понимаешь алгоритмы — ты нетократ. Не понимаешь — консьюмтариат.\n\nМы вернёмся к этому различию в последней главе курса — там оно станет центральным. Пока важно зафиксировать: Web 3.0 в смысле ИИ и алгоритмов — это не просто технология. Это новая карта социального неравенства. И граница проходит не по деньгам и не по происхождению — а по пониманию.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["netocracy", "ai", "power", "algorithms"], "x": 240.2, "y": 295.0, "angDeg": 210.0}], "edges": [{"from": "distinction", "to": "turing", "label": "умный интернет начинается с вопроса", "lenses": ["distinction", "thinking"]}, {"from": "turing", "to": "oneil", "label": "обучение на данных наследует ошибки", "lenses": ["thinking", "justice"]}, {"from": "oneil", "to": "harari", "label": "не нейтральные, но всё точнее", "lenses": ["justice", "dataism"]}, {"from": "turing", "to": "harari", "label": "от «думает?» к «знает тебя»", "lenses": ["thinking", "dataism"]}, {"from": "harari", "to": "bostrom", "label": "если данные — истина, ставки растут", "lenses": ["dataism", "stakes"]}, {"from": "oneil", "to": "bostrom", "label": "оптимизация любой ценой", "lenses": ["justice", "stakes"]}, {"from": "bostrom", "to": "netocracy", "label": "кто понимает алгоритмы — тот нетократ", "lenses": ["stakes", "dataism"]}, {"from": "harari", "to": "netocracy", "label": "объект воздействия — консьюмтариат", "lenses": ["dataism"]}, {"from": "distinction", "to": "netocracy", "label": "понимание как барьер входа", "lenses": ["distinction", "stakes"]}, {"from": "distinction", "to": "harari", "label": "семантика ведёт к датаизму", "lenses": ["distinction", "dataism"]}]};;

function typeColor(t){return{power:"var(--power)",technology:"var(--technology)",media:"var(--media)",privacy:"var(--privacy)",economy:"var(--economy)"}[t]||"var(--accent)";}

  CHAPTER_DATA.lenses.forEach(l=>{const b=document.createElement("button");b.className="lens-btn";b.type="button";
    b.setAttribute("aria-pressed",String(l.id===state.lens));b.style.setProperty("--dot",l.accent);
    b.innerHTML=`<span class="lens-dot"></span>${l.label}`;b.addEventListener("click",()=>setLens(l.id));w.appendChild(b);});
}
function setLens(id){state.lens=id;const l=lensById(id);
  const d=document.querySelector(".lens-desc");if(d)d.textContent=l?l.description:"";
  document.querySelectorAll(".lens-btn").forEach((b,i)=>b.setAttribute("aria-pressed",String(CHAPTER_DATA.lenses[i].id===id)));
  renderAll();}

function curve(a,b){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;const dx=mx-CX,dy=my-CY,len=Math.hypot(dx,dy)||1;const bow=26;
  return `M ${a.x} ${a.y} Q ${mx+(dx/len)*bow} ${my+(dy/len)*bow} ${b.x} ${b.y}`;}

function defs(){
  const d=el("defs");
  const mk=(id,color)=>{color=lensById(state.lens)?lensById(state.lens).accent:"#888";const m=el("marker",{id,viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"});
    const p=el("path",{d:"M0 0 L10 5 L0 10 z",fill:color});m.appendChild(p);return m;};
  d.appendChild(mk("arrow-active", "var(--dot-fallback)"));
  var sg=el("radialGradient",{id:"sunGrad",cx:"50%",cy:"42%",r:"60%"});
  var css=getComputedStyle(document.documentElement);
  sg.appendChild(el("stop",{offset:"0%","stop-color":css.getPropertyValue("--bg-elev")||"#20264a"}));
  sg.appendChild(el("stop",{offset:"100%","stop-color":css.getPropertyValue("--bg")||"#0c1230"}));
  d.appendChild(sg);
  return d;
}

function renderMap(){
  const svg=document.querySelector(".system-map");if(!svg)return;
  [...svg.querySelectorAll("defs,g,.ring,.ring-tick,.era-label,.spoke")].forEach(n=>n.remove());
  svg.appendChild(defs());
  // rings
  const gDeco=el("g",{});
  [RING*0.55,RING].forEach(r=>gDeco.appendChild(el("circle",{class:"ring",cx:CX,cy:CY,r})));
  svg.appendChild(gDeco);
  // spokes + chronology era labels around outer ring
  const gSpoke=el("g",{});
  CHAPTER_DATA.nodes.forEach(n=>{
    gSpoke.appendChild(el("line",{class:"spoke",x1:CX,y1:CY,x2:n.x,y2:n.y}));
  });
  svg.appendChild(gSpoke);

  // edges (with directional arrows on active)
  const gE=el("g",{});
  CHAPTER_DATA.edges.forEach(e=>{const a=byId(e.from),b=byId(e.to);if(!a||!b)return;
    const active=edgeActive(e);const g=el("g",{class:"edge"+(active?" active":"")});
    if(active)g.style.setProperty("--dot",lensById(state.lens).accent);
    const d=curve(a,b);const p=el("path",{d});
    // approximate length for draw animation
    const len=Math.round(Math.hypot(b.x-a.x,b.y-a.y)*1.15);
    p.style.setProperty("--len",len);
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const lb=el("text",{class:"edge-label",x:mx,y:my-5,"text-anchor":"middle"});lb.textContent=e.label;
    g.appendChild(p);g.appendChild(lb);gE.appendChild(g);});
  svg.appendChild(gE);

  // center (breathing, lens-tinted ring)
  const gC=el("g",{});
  gC.style.setProperty("--dot", lensById(state.lens)?lensById(state.lens).accent:"#b7791f");
  gC.appendChild(el("circle",{class:"sun-glow",cx:CX,cy:CY,r:100}));
  gC.appendChild(el("circle",{class:"sun-ring",cx:CX,cy:CY,r:82}));
  gC.appendChild(el("circle",{class:"sun-core",cx:CX,cy:CY,r:70}));/*no sublabel*/
  
  wrapText(gC,CHAPTER_DATA.chapter.centralIdea,CX,CY+2,120,"sun-t1",17);
  svg.appendChild(gC);

  // nodes with smart outward labels + era
  const gN=el("g",{});
  CHAPTER_DATA.nodes.forEach((n,i)=>{
    const g=el("g",{class:"node"+(state.selected===n.id?" selected":""),tabindex:"0",role:"button","aria-label":`${n.sceneIndex+1}. ${n.title} (${n.era||""})`});
    g.style.setProperty("--dot",typeColor(n.type));
    g.style.setProperty("--ox",n.x+"px");g.style.setProperty("--oy",n.y+"px");
    if(!state.entered) g.style.setProperty("--delay",(0.15+i*0.06)+"s"); else g.style.animation="none",g.style.opacity="1";
    if(state.selected){const linked=CHAPTER_DATA.edges.some(e=>(e.from===state.selected&&e.to===n.id)||(e.to===state.selected&&e.from===n.id));
      if(n.id!==state.selected&&!linked)g.classList.add("dim");}
    else if(nodeWeight(n)<=1){g.classList.add("dim");}
    g.appendChild(el("circle",{class:"planet-glow",cx:n.x,cy:n.y,r:34}));
    var pl=el("circle",{class:"planet",cx:n.x,cy:n.y,r:26});pl.style.fill="color-mix(in oklch, "+typeColor(n.type)+" 20%, var(--bg-elev))";g.appendChild(pl);
    const num=el("text",{class:"num",x:n.x,y:n.y});num.textContent=String(n.sceneIndex+1);g.appendChild(num);

    // smart label placement: outward along the radius from center
    const dx=n.x-CX,dy=n.y-CY,len=Math.hypot(dx,dy)||1;
    const ux=dx/len,uy=dy/len;
    const lx=n.x+ux*46, ly=n.y+uy*46;
    // anchor by horizontal side
    const anchor = ux>0.25?"start":(ux<-0.25?"end":"middle");
    const era=el("text",{class:"era",x:lx,y:ly-30,"text-anchor":anchor});era.textContent=n.era||"";g.appendChild(era);
    const kick=el("text",{class:"kicker",x:lx,y:ly-14,"text-anchor":anchor});kick.textContent=typeLabel(n.type);g.appendChild(kick);
    wrapTextAnchored(g,n.shortTitle,lx,ly+20,180,"cap",18,anchor);

    g.addEventListener("click",()=>selectNode(n.id));
    g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();selectNode(n.id);}});
    gN.appendChild(g);
  });
  svg.appendChild(gN);
  state.entered=true;
}
function wrapText(parent,text,x,y,maxw,cls,fs){wrapTextAnchored(parent,text,x,y,maxw,cls,fs,"middle");}
function wrapTextAnchored(parent,text,x,y,maxw,cls,fs,anchor){
  const words=String(text).split(/\s+/);const lines=[];let line="";
  const approx=s=>s.length*(fs*0.56);
  words.forEach(w=>{const t=line?line+" "+w:w;if(approx(t)>maxw&&line){lines.push(line);line=w;}else line=t;});
  if(line)lines.push(line);const total=(lines.length-1)*(fs+2);
  lines.forEach((ln,i)=>{const t=el("text",{class:cls,x,y:y-total/2+i*(fs+2),"text-anchor":anchor});t.textContent=ln;parent.appendChild(t);});
}

      ${related.map(r=>`<button type="button" data-go="${r.node.id}">${r.node.shortTitle} · <span style="color:var(--muted)">${r.label}</span></button>`).join("")}</div></div>
    ${srcs.length?`<div class="sources-block"><h4>Источники (${srcs.length})</h4><ol>${srcs.map(s=>`<li>${s.url?`<a href="${s.url}" target="_blank" rel="noreferrer">${s.title}</a>`:s.title}${s.linkType==="gbooks"?`<span class="src-type">Google Books</span>`:(s.linkType==="direct"?`<span class="src-type">ссылка</span>`:"")}</li>`).join("")}</ol></div>`:""}
    <div class="panel-actions"><button class="btn primary" type="button" data-full="${n.id}">Читать сцену</button></div>`;
  p.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>selectNode(b.getAttribute("data-go"))));
  p.querySelector("[data-full]").addEventListener("click",()=>renderFullScene(n.id));
  const ad=p.querySelector("[data-arpa]");if(ad)ad.addEventListener("click",()=>renderFullScene("arpanet",true));}
function selectNode(id){state.selected=id;state.visited.add(id);renderAll();}

    <div class="panel-actions"><a class="btn" href="${CHAPTER_DATA.chapter.sourceUrl}" target="_blank" rel="noreferrer">Открыть в Luminara</a>

  const close=()=>dlg.close();dlg.querySelector(".dialog-close").addEventListener("click",close);dlg.querySelector("[data-close]").addEventListener("click",close);
  if(typeof dlg.showModal==="function")dlg.showModal();else dlg.setAttribute("open","");

const CHAPTER_I18N = {"ru": {"chapter": {"key": "web30", "title": "Умный интернет", "lede": "Web 3.0 — это ИИ и семантика, не блокчейн. Если алгоритм знает тебя лучше — кто принимает решения?", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=web30", "centralIdea": "Если алгоритм знает тебя лучше — кто решает?", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "distinction", "label": "Различение", "accent": "#7dd3fc", "description": "Web 3.0 (ИИ и семантика) ≠ Web3 (блокчейн). Путать — значит не понимать оба."}, {"id": "thinking", "label": "Мышление", "accent": "#34d399", "description": "Тьюринг: могут ли машины думать? От правил к обучению на данных."}, {"id": "justice", "label": "Справедливость", "accent": "#fbbf24", "description": "О'Нил: алгоритмы не нейтральны — они воспроизводят несправедливость точно."}, {"id": "dataism", "label": "Датаизм", "accent": "#c084fc", "description": "Харари: вера в данные как высшую форму понимания реальности."}, {"id": "stakes", "label": "Ставки", "accent": "#f87171", "description": "Бостром и Тегмарк: оптимизация на цель любыми средствами — ставки растут."}], "nodes": [{"id": "distinction", "sceneIndex": 0, "type": "technology", "shortTitle": "3.0 ≠ Web3", "era": "различие", "lensWeight": {"distinction": 5, "thinking": 2, "justice": 1, "dataism": 2, "stakes": 1}, "title": "Web 3.0 ≠ Web3: важное различие", "insight": "Web 3.0 и Web3 — это разные вещи. Web 3.0 — семантический интеллектуальный интернет по Бернерс-Ли. Web3 — децентрализация и блокчейн. Путать их — значит не понимать ни одного.", "thesis": "Web 3.0 и Web3 — это разные вещи. Web 3.0 — семантический интеллектуальный интернет по Бернерс-Ли. Web3 — децентрализация и блокчейн. Путать их — значит не понимать ни одного.", "body": "## Два термина, которые звучат одинаково\n\nПрежде чем двигаться дальше — нужно остановиться на терминологии. Потому что здесь легко запутаться, и эта путаница мешает понять оба явления.\n\n«Web 3.0» и «Web3» — это два принципиально разных понятия. В медиа и в разговорах их часто используют как синонимы. Они не синонимы. Они описывают разные идеи, разные технологии и разные ответы на разные вопросы.\n\nWeb 3.0 — это идея семантического, интеллектуального интернета. Веб, который не просто хранит информацию, но понимает её смысл. Эту концепцию сформулировал сам Тим Бернерс-Ли в 2001 году — как следующий эволюционный шаг после Web 2.0. Это про искусственный интеллект, про машинное понимание языка, про алгоритмы, которые не просто ищут слова, а понимают контекст и отношения между понятиями. Это про интернет, который думает.\n\nWeb3 — совершенно другая концепция. Это про децентрализацию, блокчейн и цифровую собственность. Про интернет, где нет посредников, где пользователь владеет своими данными и активами, где правила устанавливает математика, а не корпорации. Это про деньги, власть и суверенитет — а не про смысл и понимание.\n\nЭта глава — про Web 3.0 в исходном смысле Бернерс-Ли. Про интеллектуальный интернет, ИИ и алгоритмы. Web3 в смысле блокчейна — это следующая глава.\n\n## Мечта о смысле: что задумывал Бернерс-Ли\n\nВ 2001 году Тим Бернерс-Ли опубликовал в Scientific American статью «The Semantic Web» вместе с коллегами Джеймсом Хендлером и Орой Ласила. Это была его новая мечта — продолжение той, что он реализовал десятью годами раньше.\n\nВеб первого поколения был библиотекой для людей: человек читал страницы и понимал их смысл. Но компьютер страницу не понимал — он видел только текст, набор символов. Введи в поисковик слово «банк» — он найдёт все страницы, где встречается это слово. Имеешь ли ты в виду финансовое учреждение или берег реки — компьютеру всё равно. Он не понимает смысл.\n\nСемантический веб должен был это изменить. Идея: снабдить каждый элемент информации метаданными — машиночитаемыми описаниями смысла. Не просто «Лондон», а «Лондон — это город, столица Великобритании, расположен на Темзе, координаты такие-то, население такое-то». Тогда компьютер мог бы не просто искать слова, а понимать отношения между понятиями, делать выводы, выполнять сложные задачи автономно.\n\nБернерс-Ли описывал будущее, где программные агенты — небольшие автономные программы — путешествуют по вебу, понимают контекст и выполняют задачи без твоего участия в каждом шаге. Нужно записаться к врачу? Агент проверяет твоё расписание, твою страховку, ближайшие доступные клиники, предпочтительное время — и всё организует. Это была красивая мечта.\n\nОна реализовалась — только не совсем так, как он думал. Вместо открытого семантического веба мы получили закрытые корпоративные ИИ-системы. Вместо агентов, работающих в интересах пользователя, — алгоритмы, работающие в интересах платформ.\n\n> Бернерс-Ли в 2001-м мечтал об интернете, который понимает смысл. Он получил ИИ — но не в своей версии. Алгоритмы понимают смысл. Только служат они не тебе.\n\nЭто противоречие — между технологией, которая могла бы служить людям, и технологией, которая служит тем, кто ею владеет — проходит через всю историю Web 3.0.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["web", "ai", "semantics", "history"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "turing", "sceneIndex": 1, "type": "technology", "shortTitle": "Тьюринг", "era": "1950", "lensWeight": {"distinction": 2, "thinking": 5, "justice": 1, "dataism": 3, "stakes": 2}, "title": "Тьюринг: могут ли машины думать?", "insight": "Тьюринг в 1950-м спросил: могут ли машины думать? Машинное обучение перевернуло подход — от правил к данным. Теперь ИИ умеет многое, но вопрос Тьюринга по-прежнему открыт.", "thesis": "Тьюринг в 1950-м спросил: могут ли машины думать? Машинное обучение перевернуло подход — от правил к данным. Теперь ИИ умеет многое, но вопрос Тьюринга по-прежнему открыт.", "body": "## Вопрос, который изменил историю\n\nВ 1950 году британский математик Алан Тьюринг опубликовал статью с названием «Computing Machinery and Intelligence». Она начиналась с вопроса: «Могут ли машины думать?»\n\nЭтот вопрос кажется простым. На самом деле он чрезвычайно сложен — потому что немедленно порождает другой вопрос: а что такое «думать»? Философы спорят об этом тысячи лет. Тьюринг сделал изящный ход: он обошёл философский вопрос и заменил его практическим.\n\nОн предложил игру в имитацию — эксперимент, позже названный «тестом Тьюринга». Судья общается письменно с двумя собеседниками: человеком и машиной. Задача — определить, кто есть кто. Если машина систематически вводит судью в заблуждение — можно ли сказать, что она «думает»?\n\nТьюринг сознательно уходил от вопроса о природе сознания. Его аргумент: а какая, собственно, разница? Если поведение машины неотличимо от поведения думающего существа — по каким основаниям мы отказываем ей в статусе думающей? Этот прагматический подход определил всё дальнейшее развитие ИИ.\n\n## От правил к данным: революция машинного обучения\n\nПервые десятилетия после Тьюринга исследователи ИИ шли по пути правил. Если хочешь, чтобы компьютер понимал язык — нужно вручную прописать все правила грамматики, все значения слов, все логические связи. Если слово «банк» стоит рядом со словом «деньги» — это финансовый банк. Если рядом «берег» или «река» — это берег.\n\nЭтот подход работал в узких, чётко ограниченных областях. Шахматные программы. Системы диагностики по симптомам. Переводчики с чёткими грамматическими правилами. Но для открытого языка он не масштабировался. Язык слишком сложен, слишком контекстуален, слишком живой. Никакой команды программистов не хватит, чтобы прописать все правила.\n\nПрорыв пришёл с совершенно другой стороны. Машинное обучение перевернуло логику с ног на голову: вместо того чтобы программировать правила — показывай машине миллионы примеров и позволяй ей самой найти закономерности. Нейронные сети, вдохновлённые архитектурой мозга, получили огромные массивы данных — и научились делать то, что раньше казалось исключительно человеческим: распознавать образы, понимать речь, переводить тексты, генерировать картинки.\n\nДжефф Хоукинс в книге «A Thousand Brains» предложил теорию, объясняющую и силу, и ограничения этого подхода. Мозг, по Хоукинсу, строит тысячи моделей мира одновременно и постоянно их проверяет через действие. Современный ИИ — мощная машина поиска паттернов в данных. Но это не модель мира в полном смысле — у него нет embodiment, нет физического взаимодействия с реальностью. Именно поэтому ChatGPT может написать гениальный текст и при этом «уверенно» утверждать, что Наполеон был итальянцем.\n\nКай-Фу Ли в книге «AI Superpowers» добавил ключевое экономическое наблюдение: в ИИ-эпохе побеждают не те, у кого лучший алгоритм, а те, у кого больше данных. Компания с посредственным алгоритмом и огромным массивом данных победит компанию с гениальным алгоритмом и малым количеством данных. Почти всегда. Именно поэтому Google, Facebook и Amazon — в такой сильной позиции: они накопили данные о поведении миллиардов людей за два десятилетия.\n\n> Тьюринг в 1950-м спросил: могут ли машины думать? Восемьдесят лет спустя мы получили ИИ, который пишет стихи, кодирует программы и диагностирует рак — но до сих пор не знаем ответа на его вопрос.\n\nЭта неопределённость важна. Если мы не понимаем, что такое «думать» — мы не понимаем, что именно мы создали. И это делает вопросы о том, как использовать ИИ и кому он должен служить, ещё более срочными.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["ai", "history", "algorithms", "technology"], "x": 759.8, "y": 295.0, "angDeg": -30.0}, {"id": "oneil", "sceneIndex": 2, "type": "power", "shortTitle": "О'Нил", "era": "2016", "lensWeight": {"distinction": 1, "thinking": 2, "justice": 5, "dataism": 3, "stakes": 3}, "title": "О'Нил: алгоритмы не нейтральны", "insight": "О'Нил доказала: алгоритмы не нейтральны — они воспроизводят исторические несправедливости с математической точностью. Умный интернет не значит справедливый.", "thesis": "О'Нил доказала: алгоритмы не нейтральны — они воспроизводят исторические несправедливости с математической точностью. Умный интернет не значит справедливый.", "body": "## Когда математика дискриминирует\n\nКогда ИИ начал принимать реальные решения — кому выдать кредит, кого взять на работу, кому показать рекламу жилья, кого освободить под залог — появился соблазн поверить: наконец-то беспристрастность. Машина не имеет предубеждений. Она считает числа. Алгоритм объективен.\n\nКэти О'Нил разрушила эту иллюзию систематически и с конкретными примерами. Она математик — не активист. Бывший аналитик хедж-фонда Wall Street. Человек, который знает математику изнутри. И именно поэтому её книга «Weapons of Math Destruction» («Оружие математического поражения») так убедительна.\n\nЕё центральный аргумент: алгоритмы обучаются на исторических данных. А исторические данные отражают исторические несправедливости. Это не мнение — это математический факт.\n\nРассмотри конкретный пример. В США существовал алгоритм COMPAS — система оценки риска рецидива, которую суды использовали при решении об условно-досрочном освобождении. Алгоритм давал каждому обвиняемому оценку от 1 до 10: насколько вероятно, что он совершит новое преступление? Исследование ProPublica в 2016 году показало: алгоритм систематически давал более высокие оценки риска чёрным обвиняемым по сравнению с белыми при сопоставимых преступлениях и биографиях.\n\nПочему? Алгоритм обучался на исторических данных о заключении и рецидивизме. А эти данные отражали десятилетия системно более жёсткого отношения к чёрным американцам в системе уголовного правосудия. Алгоритм не был расистским — он был обучен на расистских данных. И воспроизводил дискриминацию с математической точностью и авторитетом цифр.\n\n## Три свойства, которые делают это опасным\n\nО'Нил описывает три свойства, которые превращают предвзятые алгоритмы в «оружие математического поражения».\n\nПервое: масштаб. Предубеждённый человек может несправедливо отказать в работе одному кандидату. Предвзятый алгоритм принимает решения о миллионах людей одновременно. Ошибка масштабируется автоматически.\n\nВторое: непрозрачность. Предубеждение человека можно оспорить, потребовать объяснений, подать в суд на дискриминацию. Алгоритм — «чёрный ящик». Его логику часто невозможно проверить даже специалистам. «Алгоритм так решил» — и попробуй докажи обратное.\n\nТретье: самосбывающееся пророчество. Алгоритм решает, что человек из определённого района — плохой кредитный риск. Человек не получает кредит. Его финансовое положение ухудшается. Следующий алгоритм видит ухудшившееся финансовое положение — и снова отказывает. Круг замкнулся. Алгоритм создал реальность, которую потом «обнаружил».\n\nПаризер добавляет к этому ещё одно измерение: алгоритмы персонализации в медиа работают по той же логике. Они показывают тебе то, что соответствует твоим прошлым паттернам. Ты никогда не читал о позиции X? Алгоритм решает, что тебе это не интересно, и не показывает. Ты продолжаешь не знать о позиции X. Алгоритм «подтверждает» правильность своего решения.\n\n> О'Нил сформулировала точно: алгоритмы не нейтральны. Они воспроизводят мир, который уже был — с математической точностью и без возможности оспорить. Умный — не значит справедливый.\n\nЭто один из главных нерешённых вопросов ИИ-эпохи: как создавать алгоритмы, которые не только эффективны, но и справедливы? Пока ответа нет. Но понимать вопрос — уже важно.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["ai", "algorithms", "ethics", "data"], "x": 759.8, "y": 595.0, "angDeg": 30.0}, {"id": "harari", "sceneIndex": 3, "type": "privacy", "shortTitle": "Харари", "era": "2016", "lensWeight": {"distinction": 2, "thinking": 3, "justice": 2, "dataism": 5, "stakes": 3}, "title": "Харари и датаизм: алгоритм знает тебя лучше тебя", "insight": "Харари описал датаизм: веру в то, что данные и алгоритмы — высшая форма понимания реальности. Если алгоритм знает тебя лучше тебя — имеет ли смысл принимать решения самому?", "thesis": "Харари описал датаизм: веру в то, что данные и алгоритмы — высшая форма понимания реальности. Если алгоритм знает тебя лучше тебя — имеет ли смысл принимать решения самому?", "body": "## Когда машина предсказывает лучше тебя самого\n\nЮваль Ной Харари в книге «Homo Deus» описывает логический предел того, куда движется ИИ. Не как фантастику — как экстраполяцию уже происходящего.\n\nНачнём с простых примеров, которые уже реальны. Spotify рекомендует музыку. Это кажется тривиальным — пока не задумаешься о точности. Spotify наблюдает за тобой годами: что ты слушаешь в понедельник утром по дороге на работу, что — в пятницу вечером, что — когда грустишь, что — когда занимаешься спортом. Миллионы данных о твоих паттернах прослушивания. В какой-то момент алгоритм начинает предсказывать, что ты захочешь услышать через десять минут — точнее, чем ты сам мог бы выбрать. Ты открываешь рекомендации и думаешь: «Откуда они знают?»\n\nNetflix знает, какой сериал ты досмотришь до конца, а какой бросишь на третьей серии — с точностью, недостижимой для тебя самого. Amazon знает, что ты собираешься купить раньше, чем ты осознал это желание — и уже перемещает товар на ближайший склад.\n\nЭто пока безобидные области. Но Харари задаёт более радикальный вопрос: что происходит, когда алгоритмы начинают предсказывать не музыкальные предпочтения, а политические взгляды? Медицинские решения? Выбор партнёра? Карьерный путь?\n\n## Датаизм: данные как высшая истина\n\nХарари называет новую идеологию, которая незаметно формируется вокруг этого, «датаизмом». Это не официальная религия с догматами и церквями. Это набор убеждений, которые всё шире распространяются в технологическом сообществе и за его пределами.\n\nЦентральный тезис датаизма: данные и алгоритмы — высшая форма понимания реальности. Не человеческое суждение, не опыт, не интуиция, не мудрость, накопленная веками. А паттерны в данных. Если алгоритм говорит X — значит X правда. Если данные показывают Y — значит Y правильное решение.\n\nЭто переворачивает многовековую идею о человеке как носителе суверенной воли. Просветительская традиция говорила: у каждого человека есть разум и свобода воли, он способен делать осознанные выборы. Датаизм отвечает: это иллюзия. Твои «решения» — это паттерны, предсказуемые с достаточным количеством данных. Ты думаешь, что выбираешь — но алгоритм уже знает, что ты «выберешь».\n\nHarari не говорит, что это хорошо или плохо. Он говорит, что это фундаментальный вопрос, который общество ещё не начало серьёзно обсуждать. Мы встраиваем алгоритмы в принятие всё более важных решений, не задавая вопроса: а должны ли мы?\n\nАлгоритм, который рекомендует музыку, — безвреден. Алгоритм, который решает, кому давать кредит, — уже спорно. Алгоритм, который определяет, кому давать условно-досрочное освобождение, — серьёзно. Алгоритм, который управляет ядерным арсеналом или принимает решения о применении силы, — экзистенциально.\n\n> Харари ставит вопрос точно: если алгоритм знает тебя лучше тебя — имеет ли смысл принимать решения самому? Датаизм отвечает нет. Но что тогда значит быть человеком?\n\nИменно этот вопрос делает Web3 не просто технологической альтернативой, а философским ответом. Если проблема в том, что алгоритмы служат тем, кто ими владеет, — то решение не в лучших алгоритмах, а в другой архитектуре владения.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D
