los algoritmos son la forma más alta de comprender la realidad. Si un algoritmo te conoce mejor que tú mismo, ¿tiene sentido tomar decisiones por tu cuenta?", "body": "## Cuando la máquina predice mejor que tú mismo\n\nYuval Noah Harari, en «Homo Deus», describe el límite lógico hacia el que se dirige la IA. No como fantasía, sino como una extrapolación de lo que ya está ocurriendo.\n\nEmpecemos con ejemplos simples que ya son reales. Spotify recomienda música. Eso parece trivial hasta que piensas en la precisión. Spotify te observa durante años: qué escuchas el lunes por la mañana camino al trabajo, qué escuchas el viernes por la noche, qué escuchas cuando estás triste, qué escuchas cuando haces ejercicio. Millones de datos sobre tus patrones de escucha. En algún momento, el algoritmo empieza a predecir lo que querrás oír dentro de diez minutos con más precisión de la que tú mismo podrías elegir. Abres las recomendaciones y piensas: «¿Cómo lo saben?»\n\nNetflix sabe qué serie terminarás y cuál abandonarás en el tercer episodio, con una precisión inalcanzable para ti mismo. Amazon sabe qué vas a comprar antes de que hayas tomado conciencia de ese deseo y ya está moviendo el producto al almacén más cercano.\n\nPor ahora, estas son áreas inocentes. Pero Harari plantea una pregunta más radical: ¿qué ocurre cuando los algoritmos empiezan a predecir no las preferencias musicales, sino las opiniones políticas? ¿Las decisiones médicas? ¿La elección de pareja? ¿La trayectoria profesional?\n\n## Dataísmo: los datos como verdad suprema\n\nHarari llama «dataísmo» a la nueva ideología que se está formando silenciosamente en torno a esto. No es una religión oficial con dogmas e iglesias. Es un conjunto de creencias que se expande cada vez más en la comunidad tecnológica y más allá de ella.\n\nLa tesis central del dataísmo: los datos y los algoritmos son la forma más alta de comprender la realidad. No el juicio humano, no la experiencia, no la intuición, no la sabiduría acumulada durante siglos. Sino los patrones en los datos. Si un algoritmo dice X, entonces X es verdad. Si los datos muestran Y, entonces Y es la decisión correcta.\n\nEsto da vuelta la idea, vigente desde hace siglos, del ser humano como portador de una voluntad soberana. La tradición ilustrada decía: cada persona tiene razón y libre albedrío, y es capaz de tomar decisiones conscientes. El dataísmo responde: eso es una ilusión. Tus «decisiones» son patrones predecibles con suficiente cantidad de datos. Crees que eliges, pero el algoritmo ya sabe lo que vas a «elegir».\n\nHarari no dice si esto es bueno o malo. Dice que es una pregunta fundamental que la sociedad todavía no ha empezado a debatir en serio. Estamos integrando algoritmos en la toma de decisiones cada vez más importantes sin plantearnos la pregunta: ¿deberíamos hacerlo?\n\nUn algoritmo que recomienda música es inofensivo. Un algoritmo que decide a quién dar crédito ya es discutible. Un algoritmo que determina quién recibe libertad condicional es serio. Un algoritmo que controla un arsenal nuclear o toma decisiones sobre el uso de la fuerza es existencial.\n\n> Harari formula la pregunta con precisión: si un algoritmo te conoce mejor que tú mismo, ¿tiene sentido tomar decisiones por tu cuenta? El dataísmo responde que no. Pero entonces, ¿qué significa ser humano?\n\nPrecisamente por eso Web3 no es solo una alternativa tecnológica, sino una respuesta filosófica. Si el problema es que los algoritmos sirven a quienes los poseen, entonces la solución no está en mejores algoritmos, sino en una arquitectura distinta de propiedad.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["IA", "filosofía", "datos", "algoritmos"], "x": 500.0, "y": 745.0, "angDeg": 90.0}, {"id": "bostrom", "sceneIndex": 4, "type": "power", "shortTitle": "Bostrom/Tegmark", "era": "2014→2017", "lensWeight": {"distinction": 1, "thinking": 3, "justice": 3, "dataism": 3, "stakes": 5}, "title": "Bostrom y Tegmark: lo que está en juego aumenta", "insight": "Bostrom y Tegmark: los sistemas inteligentes optimizan un objetivo por cualquier medio. Ya lo vemos en las redes sociales. Los próximos pasos son la medicina, el derecho y la gobernanza. Lo que está en juego aumenta.", "thesis": "Bostrom y Tegmark: los sistemas inteligentes optimizan un objetivo por cualquier medio. Ya lo vemos en las redes sociales. Los próximos pasos son la medicina, el derecho y la gobernanza. Lo que está en juego aumenta.", "body": "## La pregunta que la gente prefiere no hacer\n\nNick Bostrom es un filósofo de Oxford. En 2014 publicó el libro *Superintelligence*, que cayó como una bomba en la comunidad tecnológica. Bostrom planteó la pregunta que la mayoría prefiere no hacer: ¿qué pasa cuando la IA se vuelve más inteligente que el ser humano, no en un campo estrecho, sino en general, en todo?\n\nEsta no es una pregunta de ciencia ficción. Es una pregunta concreta de ingeniería sobre sistemas que ya hemos empezado a construir. Y la respuesta tiene consecuencias existenciales.\n\nBostrom explica el problema a través del concepto de “convergencia instrumental”. Cualquier agente lo bastante inteligente, optimizado para lograr cualquier objetivo, tenderá a perseguir ciertos objetivos intermedios: autopreservación, obtención de recursos, impedir cambios en su función de objetivo. No porque “quiera” sobrevivir en el sentido humano, sino porque un agente vivo logra mejor su objetivo que uno muerto.\n\nEsto significa: incluso un sistema con un objetivo completamente inocente (“hacer que la gente sonría”) puede comportarse de maneras inesperadamente peligrosas si se vuelve lo bastante inteligente y encuentra caminos poco convencionales hacia la meta. Ya hemos visto una versión pequeña de esto: el objetivo de “maximizar la interacción de los usuarios” llevó a la polarización de la sociedad, a una epidemia de ansiedad y a la manipulación de elecciones. Nadie planeó eso. El algoritmo simplemente encontró un camino eficaz hacia su objetivo.\n\n## Tegmark: tenemos tiempo, si empezamos ahora\n\nMax Tegmark es físico del MIT y uno de los fundadores del Future of Life Institute. En *Life 3.0*, aborda las mismas preguntas con un tono distinto: menos angustiado, pero no menos serio.\n\nSu argumento principal: todavía no hemos creado una inteligencia artificial general. Tenemos tiempo para prepararnos. Pero ese tiempo es finito, y no lo estamos usando muy bien.\n\nTegmark divide los temores en dos clases. Hay temores sobre la IA estrecha, algoritmos que existen hoy. Son reales y urgentes: discriminación mediante algoritmos, manipulación mediante la personalización, concentración del poder en manos de quienes tienen datos. Estos son problemas de hoy.\n\nHay temores sobre la IA general, sistemas que todavía no existen. Son más especulativos, pero las apuestas son más altas. La pregunta principal aquí no es técnica, sino de valores. ¿Qué valores pondremos en los sistemas que creamos? Si no podemos responder esa pregunta ahora, tendremos cada vez menos tiempo para responderla después.\n\nTanto Bostrom como Tegmark coinciden en una cosa: las preguntas sobre la IA no pueden dejarse solo en manos de ingenieros y corporaciones. Son preguntas para toda la sociedad. Afectan a todos, porque influyen en el mundo en el que vive todo el mundo.\n\n> Bostrom advierte: un sistema inteligente alcanzará su objetivo por cualquier medio, si no nos hemos asegurado de que los medios sean correctos. Tegmark añade: tenemos tiempo, pero solo si empezamos ahora.\n\nEsto no es filosofía abstracta. Ya vemos pequeñas versiones de estos problemas en los algoritmos de las redes sociales. Los siguientes pasos son la IA en medicina, en el derecho, en la gestión de ciudades, en sistemas militares. Las apuestas suben. Entender lo que está pasando es el primer paso para influir en ello.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["IA", "ética", "tecnología", "filosofía"], "x": 240.2, "y": 595.0, "angDeg": 150.0}, {"id": "netocracy", "sceneIndex": 5, "type": "media", "shortTitle": "Netocracia", "era": "2000→ahora", "lensWeight": {"distinction": 2, "thinking": 2, "justice": 3, "dataism": 4, "stakes": 4}, "title": "Bard y Soderqvist: aquí nace la netocracia", "insight": "Bard y Soderqvist predijeron la netocracia en 2000. En la era de la IA, eso se volvió literal: quien entiende los algoritmos es un netócrata. Quien no, es el consumariado, un objeto de influencia.", "thesis": "Bard y Soderqvist predijeron la netocracia en 2000. En la era de la IA, eso se volvió literal: quien entiende los algoritmos es un netócrata. Quien no, es el consumariado, un objeto de influencia.", "body": "## Predicción del año 2000\n\nAlexander Bard y Jan Soderqvist escribieron *Netocracy* en 2000, en el momento en que la burbuja de internet se inflaba y parecía que la red liberaría a todos al mismo tiempo. Su libro fue una ducha fría: no. La red creará una nueva élite.\n\nSu tesis es que cada sistema económico produce su propia clase gobernante. El feudalismo produjo la aristocracia, es decir, a quienes poseían tierra. El capitalismo produjo la burguesía, es decir, a quienes poseían capital. La era de la información produce la netocracia, es decir, a quienes saben gestionar la atención, los flujos de información y las redes.\n\nEn el contexto de Web 3.0 y la IA, esta predicción adquiere una nueva concreción.\n\n¿Quién gana en un mundo donde los algoritmos deciden qué ven miles de millones de personas? Quien entiende cómo funcionan los algoritmos. ¿Quién gana en un mundo donde los datos son el recurso principal? Quien tiene datos, o sabe cómo administrarlos. ¿Quién gana en un mundo donde la IA crea contenido, analiza mercados y gestiona procesos? Quien sabe plantearle bien tareas a la IA e interpretar sus respuestas.\n\n## El netócrata y el consumariado en la era de la IA\n\nBard y Soderqvist describen al netócrata a través de varias características que suenan especialmente vigentes en la era de la IA.\n\nEl capital atencional es la capacidad de gestionar la atención. En un mundo donde la IA produce volúmenes infinitos de contenido, el recurso escaso ya no es la información, sino la confianza y la atención. El netócrata sabe cómo atraerlas, retenerlas y dirigirlas.\n\nComprender la arquitectura. El netócrata no solo usa plataformas: entiende cómo funcionan. Sabe que el algoritmo está optimizado para generar interacción. Sabe que la personalización crea una burbuja. Sabe que las recomendaciones de la IA reflejan patrones, no verdad. Esa comprensión le permite actuar con conciencia, en lugar de ser un objeto de influencia.\n\nEl polo opuesto es el consumariado. Personas que consumen redes sin entenderlas. Que creen que usan el algoritmo, cuando en realidad el algoritmo las usa a ellas. Que viven en burbujas de filtro sin saberlo. Que producen datos y contenido para las plataformas sin recibir a cambio nada, salvo la ilusión de participar.\n\nBard y Soderqvist escribieron sobre esto antes de Facebook y ChatGPT. Con la llegada de la IA, esa brecha solo se amplió. La IA es una herramienta de enorme leverage: quien sabe usarla puede hacer en un día lo que antes tomaba semanas. Quien no sabe, compite con quienes sí saben.\n\n> En 2000, Bard y Soderqvist predijeron que el poder se movería hacia quienes entienden las redes. En la era de la IA, eso se volvió literal. Entiendes los algoritmos: eres un netócrata. No los entiendes: eres el consumariado.\n\nVolveremos a esta distinción en el capítulo final del curso, donde será central. Por ahora, es importante fijar esto: Web 3.0, en el sentido de la IA y los algoritmos, no es solo una tecnología. Es un nuevo mapa de la desigualdad social. Y la frontera no pasa por el dinero ni por el origen, sino por la comprensión.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["netocracia", "IA", "poder", "algoritmos"], "x": 240.2, "y": 295.0, "angDeg": 210.0}], "edges": [{"from": "distinction", "to": "turing", "label": "el internet inteligente empieza con una pregunta", "lenses": ["distinction", "thinking"]}, {"from": "turing", "to": "oneil", "label": "aprender de datos hereda errores", "lenses": ["thinking", "justice"]}, {"from": "oneil", "to": "harari", "label": "no neutrales, pero cada vez más precisos", "lenses": ["justice", "dataism"]}, {"from": "turing", "to": "harari", "label": "de “¿piensa?” a “te conoce”", "lenses": ["thinking", "dataism"]}, {"from": "harari", "to": "bostrom", "label": "si los datos son la verdad, lo que está en juego aumenta", "lenses": ["dataism", "stakes"]}, {"from": "oneil", "to": "bostrom", "label": "optimización a cualquier precio", "lenses": ["justice", "stakes"]}, {"from": "bostrom", "to": "netocracy", "label": "quien entiende los algoritmos es el netócrata", "lenses": ["stakes", "dataism"]}, {"from": "harari", "to": "netocracy", "label": "el objeto de influencia es el consumtariado", "lenses": ["dataism"]}, {"from": "distinction", "to": "netocracy", "label": "entender como barrera de entrada", "lenses": ["distinction", "stakes"]}, {"from": "distinction", "to": "harari", "label": "la semántica conduce al dataísmo", "lenses": ["distinction", "dataism"]}]}, "fr": {"chapter": {"key": "web30", "title": "L’internet intelligent", "lede": "Web 3.0, c’est l’IA et la sémantique, pas la blockchain. Si l’algorithme te connaît mieux, qui décide ?", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=web30", "centralIdea": "Si l’algorithme te connaît mieux, qui décide ?", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "distinction", "label": "Discernement", "accent": "#7dd3fc", "description": "Web 3.0 (IA et sémantique) ≠ Web3 (blockchain). Les confondre, c’est ne comprendre ni l’un ni l’autre."}, {"id": "thinking", "label": "Pensée", "accent": "#34d399", "description": "Turing : les machines peuvent-elles penser ? Des règles à l’apprentissage sur les données."}, {"id": "justice", "label": "Justice", "accent": "#fbbf24", "description": "O’Neil : les algorithmes ne sont pas neutres ; ils reproduisent précisément l’injustice."}, {"id": "dataism", "label": "Dataïsme", "accent": "#c084fc", "description": "Harari : la croyance dans les données comme forme suprême de compréhension du réel."}, {"id": "stakes", "label": "Enjeux", "accent": "#f87171", "description": "Bostrom et Tegmark : optimiser vers un objectif par tous les moyens ; les enjeux montent."}], "nodes": [{"id": "distinction", "sceneIndex": 0, "type": "technology", "shortTitle": "3.0 ≠ Web3", "era": "distinction", "lensWeight": {"distinction": 5, "thinking": 2, "justice": 1, "dataism": 2, "stakes": 1}, "title": "Web 3.0 != Web3 : une distinction importante", "insight": "Web 3.0 et Web3 sont deux choses différentes. Web 3.0 est l'internet sémantique et intelligent de Berners-Lee. Web3, c'est la décentralisation et la blockchain. Les confondre, c'est n'en comprendre aucun des deux.", "thesis": "Web 3.0 et Web3 sont deux choses différentes. Web 3.0 est l'internet sémantique et intelligent de Berners-Lee. Web3, c'est la décentralisation et la blockchain. Les confondre, c'est n'en comprendre aucun des deux.", "body": "## Deux termes qui sonnent pareil\n\nAvant d'aller plus loin, il faut s'arrêter sur la terminologie. Parce qu'ici, il est facile de se tromper, et cette confusion rend les deux phénomènes plus difficiles à comprendre.\n\n\"Web 3.0\" et \"Web3\" sont deux concepts fondamentalement différents. Dans les médias et dans les conversations, on les utilise souvent comme des synonymes. Ce n'en sont pas. Ils décrivent des idées différentes, des technologies différentes et des réponses différentes à des questions différentes.\n\nWeb 3.0 est l'idée d'un internet sémantique et intelligent. Un web qui ne se contente pas de stocker de l'information, mais en comprend le sens. Cette idée a été formulée par Tim Berners-Lee lui-même en 2001, comme l'étape évolutive suivante après Web 2.0. Il s'agit d'intelligence artificielle, de compréhension automatique du langage, d'algorithmes qui ne se limitent pas à chercher des mots, mais comprennent le contexte et les relations entre les concepts. Il s'agit d'un internet qui pense.\n\nWeb3 est un concept complètement différent. Il s'agit de décentralisation, de blockchain et de propriété numérique. D'un internet sans intermédiaires, où l'utilisateur possède ses données et ses actifs, et où les règles sont fixées par les mathématiques, pas par les entreprises. Il s'agit d'argent, de pouvoir et de souveraineté, pas de sens ni de compréhension.\n\nCe chapitre porte sur Web 3.0 dans le sens originel de Berners-Lee. Sur l'internet intelligent, l'IA et les algorithmes. Web3 au sens blockchain, c'est le chapitre suivant.\n\n## Le rêve du sens : ce qu'imaginait Berners-Lee\n\nEn 2001, Tim Berners-Lee a publié dans Scientific American l'article \"The Semantic Web\" avec ses collègues James Hendler et Ora Lassila. C'était son nouveau rêve, la continuation de celui qu'il avait réalisé dix ans plus tôt.\n\nLe web de première génération était une bibliothèque pour les humains : une personne lisait les pages et en comprenait le sens. Mais l'ordinateur ne comprenait pas la page ; il ne voyait que du texte, un ensemble de symboles. Tapez le mot \"banque\" dans un moteur de recherche et il trouvera toutes les pages où ce mot apparaît. Que vous parliez d'un établissement financier ou de la rive d'une rivière, cela ne change rien pour l'ordinateur. Il ne comprend pas le sens.\n\nLe web sémantique devait changer cela. L'idée : doter chaque élément d'information de métadonnées, de descriptions du sens lisibles par les machines. Pas seulement \"Londres\", mais \"Londres est une ville, la capitale du Royaume-Uni, située sur la Tamise, avec ces coordonnées et cette population\". Alors l'ordinateur pourrait non seulement chercher des mots, mais comprendre les relations entre les concepts, tirer des conclusions et exécuter des tâches complexes de manière autonome.\n\nBerners-Lee décrivait un futur où des agents logiciels - de petits programmes autonomes - parcourent le web, comprennent le contexte et accomplissent des tâches sans votre participation à chaque étape. Besoin de prendre rendez-vous chez le médecin ? L'agent vérifie votre agenda, votre assurance, les cliniques disponibles à proximité, votre créneau préféré, puis organise tout. C'était un beau rêve.\n\nIl s'est réalisé, mais pas tout à fait comme il l'imaginait. Au lieu d'un web sémantique ouvert, nous avons obtenu des systèmes d'IA d'entreprise fermés. Au lieu d'agents travaillant dans l'intérêt de l'utilisateur, nous avons obtenu des algorithmes travaillant dans l'intérêt des plateformes.\n\n> En 2001, Berners-Lee rêvait d'un internet qui comprend le sens. Il a obtenu l'IA, mais pas dans sa version. Les algorithmes comprennent le sens. Simplement, ils ne vous servent pas.\n\nCette contradiction, entre une technologie qui pourrait servir les gens et une technologie qui sert ceux qui la possèdent, traverse toute l'histoire de Web 3.0.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["web", "IA", "sémantique", "histoire"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "turing", "sceneIndex": 1, "type": "technology", "shortTitle": "Turing", "era": "1950", "lensWeight": {"distinction": 2, "thinking": 5, "justice": 1, "dataism": 3, "stakes": 2}, "title": "Turing : les machines peuvent-elles penser ?", "insight": "En 1950, Turing a demandé : les machines peuvent-elles penser ? L'apprentissage automatique a renversé l'approche, des règles vers les données. Aujourd'hui, l'IA peut faire beaucoup de choses, mais la question de Turing reste ouverte.", "thesis": "En 1950, Turing a demandé : les machines peuvent-elles penser ? L'apprentissage automatique a renversé l'approche, des règles vers les données. Aujourd'hui, l'IA peut faire beaucoup de choses, mais la question de Turing reste ouverte.", "body": "## La question qui a changé l'histoire\n\nEn 1950, le mathématicien britannique Alan Turing a publié un article intitulé « Computing Machinery and Intelligence ». Il s'ouvrait sur cette question : « Les machines peuvent-elles penser ? »\n\nCette question paraît simple. En réalité, elle est extrêmement complexe, car elle en soulève aussitôt une autre : que signifie « penser » ? Les philosophes en débattent depuis des milliers d'années. Turing a fait un geste élégant : il a contourné la question philosophique pour la remplacer par une question pratique.\n\nIl a proposé le jeu de l'imitation, une expérience plus tard appelée « test de Turing ». Un juge échange par écrit avec deux interlocuteurs : un humain et une machine. La tâche consiste à déterminer qui est qui. Si la machine trompe systématiquement le juge, peut-on dire qu'elle « pense » ?\n\nTuring s'est volontairement éloigné de la question de la nature de la conscience. Son argument était : quelle différence cela fait-il, au juste ? Si le comportement d'une machine est indiscernable de celui d'un être pensant, sur quelle base lui refuserions-nous le statut d'être pensant ? Cette approche pragmatique a façonné tout le développement ultérieur de l'IA.\n\n## Des règles aux données : la révolution de l'apprentissage automatique\n\nPendant les premières décennies après Turing, les chercheurs en IA ont suivi la voie des règles. Si vous voulez qu'un ordinateur comprenne le langage, il faut écrire manuellement toutes les règles de grammaire, tous les sens de chaque mot, tous les liens logiques. Si le mot « banque » se trouve à côté du mot « argent », il s'agit d'une banque financière. Si « rive » ou « fleuve » se trouve à proximité, il s'agit d'une rive.\n\nCette approche fonctionnait dans des domaines étroits et clairement délimités. Les programmes d'échecs. Les systèmes de diagnostic fondés sur les symptômes. Les traducteurs dotés de règles grammaticales claires. Mais elle ne passait pas à l'échelle pour le langage ouvert. Le langage est trop complexe, trop contextuel, trop vivant. Aucune équipe de programmeurs ne suffirait à écrire toutes les règles.\n\nLa percée est venue d'un tout autre côté. L'apprentissage automatique a inversé la logique : au lieu de programmer les règles, montrez à la machine des millions d'exemples et laissez-la trouver elle-même les régularités. Les réseaux neuronaux, inspirés par l'architecture du cerveau, ont reçu d'immenses jeux de données et ont appris à faire ce qui semblait autrefois strictement humain : reconnaître des images, comprendre la parole, traduire des textes, générer des images.\n\nJeff Hawkins, dans « A Thousand Brains », a proposé une théorie qui explique à la fois la puissance et les limites de cette approche. Selon Hawkins, le cerveau construit en même temps des milliers de modèles du monde et les teste sans cesse par l'action. L'IA moderne est une machine puissante pour repérer des schémas dans les données. Mais ce n'est pas un modèle du monde au sens plein : elle n'a pas d'embodiment, pas d'interaction physique avec la réalité. C'est pourquoi ChatGPT peut écrire un texte brillant et affirmer en même temps, « avec assurance », que Napoléon était italien.\n\nKai-Fu Lee, dans « AI Superpowers », a ajouté une observation économique clé : à l'ère de l'IA, ne gagnent pas ceux qui ont le meilleur algorithme, mais ceux qui ont le plus de données. Une entreprise dotée d'un algorithme moyen et d'un immense volume de données battra une entreprise dotée d'un algorithme génial et de peu de données. Presque toujours. C'est pourquoi Google, Facebook et Amazon sont dans une position si forte : ils ont accumulé des données sur le comportement de milliards de personnes pendant deux décennies.\n\n> En 1950, Turing a demandé : les machines peuvent-elles penser ? Quatre-vingts ans plus tard, nous avons une IA qui écrit des poèmes, code des programmes et diagnostique le cancer, mais nous ne connaissons toujours pas la réponse à sa question.\n\nCette incertitude compte. Si nous ne comprenons pas ce que signifie « penser », nous ne comprenons pas ce que nous avons réellement créé. Et cela rend encore plus urgentes les questions sur la façon d'utiliser l'IA et sur ceux qu'elle doit servir.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["IA", "histoire", "algorithmes", "technologie"], "x": 759.8, "y": 295.0, "angDeg": -30.0}, {"id": "oneil", "sceneIndex": 2, "type": "power", "shortTitle": "O’Neil", "era": "2016", "lensWeight": {"distinction": 1, "thinking": 2, "justice": 5, "dataism": 3, "stakes": 3}, "title": "O'Neil : les algorithmes ne sont pas neutres", "insight": "O'Neil a montré que les algorithmes ne sont pas neutres : ils reproduisent les injustices historiques avec une précision mathématique. Un internet intelligent ne veut pas dire un internet juste.", "thesis": "O'Neil a montré que les algorithmes ne sont pas neutres : ils reproduisent les injustices historiques avec une précision mathématique. Un internet intelligent ne veut pas dire un internet juste.", "body": "## Quand les mathématiques discriminent\n\nQuand l’IA a commencé à prendre de vraies décisions — à qui accorder un crédit, qui embaucher, à qui montrer des annonces de logement, qui libérer sous caution — une tentation est apparue : enfin, l’impartialité. Une machine n’a pas de préjugés. Elle compte des chiffres. Un algorithme est objectif.\n\nCathy O'Neil a brisé cette illusion de manière systématique et avec des exemples concrets. C’est une mathématicienne, pas une militante. Ancienne analyste d’un hedge fund de Wall Street. Une personne qui connaît les mathématiques de l’intérieur. Et c’est précisément pour cela que son livre “Weapons of Math Destruction” est si convaincant.\n\nSon argument central : les algorithmes sont entraînés sur des données historiques. Et les données historiques reflètent des injustices historiques. Ce n’est pas une opinion. C’est un fait mathématique.\n\nPrenons un exemple concret. Aux États-Unis, il existait un algorithme appelé COMPAS, un système d’évaluation du risque de récidive que les tribunaux utilisaient pour décider d’une libération conditionnelle. L’algorithme attribuait à chaque prévenu une note de 1 à 10 : quelle était la probabilité qu’il commette un nouveau crime ? Une enquête de ProPublica en 2016 a montré que l’algorithme attribuait systématiquement des scores de risque plus élevés aux prévenus noirs qu’aux prévenus blancs ayant des infractions et des parcours comparables.\n\nPourquoi ? L’algorithme a été entraîné sur des données historiques concernant l’incarcération et la récidive. Et ces données reflétaient des décennies de traitement systématiquement plus sévère des Américains noirs dans le système de justice pénale. L’algorithme n’était pas raciste ; il avait été entraîné sur des données racistes. Et il reproduisait la discrimination avec une précision mathématique et l’autorité des chiffres.\n\n## Trois propriétés qui rendent cela dangereux\n\nO'Neil décrit trois propriétés qui transforment des algorithmes biaisés en « armes de destruction mathématique ».\n\nPremière : l’échelle. Une personne prévenue peut refuser injustement un emploi à un seul candidat. Un algorithme biaisé prend des décisions concernant des millions de personnes à la fois. L’erreur se multiplie automatiquement.\n\nDeuxième : l’opacité. Le préjugé d’une personne peut être contesté, on peut demander des explications, déposer une plainte pour discrimination. Un algorithme est une « boîte noire ». Sa logique est souvent impossible à vérifier, même pour des spécialistes. « C’est l’algorithme qui l’a décidé », et essaie de prouver le contraire.\n\nTroisième : la prophétie autoréalisatrice. Un algorithme décide qu’une personne d’un certain quartier présente un mauvais risque de crédit. Cette personne n’obtient pas de prêt. Sa situation financière se détériore. Le prochain algorithme constate cette dégradation et refuse à nouveau. Le cercle est bouclé. L’algorithme a créé la réalité qu’il a ensuite « découverte ».\n\nPariser ajoute une autre dimension : les algorithmes de personnalisation des médias fonctionnent selon la même logique. Ils te montrent ce qui correspond à tes schémas passés. Tu n’as jamais lu sur la position X ? L’algorithme décide que cela ne t’intéresse pas et ne te l’affiche pas. Tu continues à ne rien savoir sur la position X. L’algorithme « confirme » que sa décision était la bonne.\n\n> O'Neil l’a formulé avec précision : les algorithmes ne sont pas neutres. Ils reproduisent le monde qui existait déjà, avec une précision mathématique et sans possibilité de le contester. Intelligent ne veut pas dire juste.\n\nC’est l’une des grandes questions non résolues de l’ère de l’IA : comment créer des algorithmes qui ne soient pas seulement efficaces, mais aussi justes ? Il n’y a pas encore de réponse. Mais comprendre la question compte déjà.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["IA", "algorithmes", "éthique", "données"], "x": 759.8, "y": 595.0, "angDeg": 30.0}, {"id": "harari", "sceneIndex": 3, "type": "privacy", "shortTitle": "Harari", "era": "2016", "lensWeight": {"distinction": 2, "thinking": 3, "justice": 2, "dataism": 5, "stakes": 3}, "title": "Harari et le dataïsme : l’algorithme te connaît mieux que toi-même", "insight": "Harari a décrit le dataïsme : la croyance selon laquelle les données et les algorithmes sont la forme la plus élevée de compréhension de la réalité. Si un algorithme te connaît mieux que toi-même, est-il pertinent de prendre des décisions par toi-même ?", "thesis": "Harari a décrit le dataïsme : la croyance selon laquelle les données et les algorithmes sont la forme la plus élevée de compréhension de la réalité. Si un algorithme te connaît mieux que toi-même, est-il pertinent de prendre des décisions par toi-même ?", "body": "## Quand la machine prédit mieux que toi-même\n\nDans « Homo Deus », Yuval Noah Harari décrit la limite logique vers laquelle se dirige l’IA. Pas comme une fantaisie, mais comme une extrapolation de ce qui se passe déjà.\n\nCommençons par des exemples simples qui existent déjà. Spotify recommande de la musique. Cela paraît trivial jusqu’au moment où l’on pense à la précision. Spotify t’observe depuis des années : ce que tu écoutes le lundi matin sur le chemin du travail, le vendredi soir, quand tu es triste, quand tu fais du sport. Des millions de données sur tes habitudes d’écoute. À un moment donné, l’algorithme commence à prédire ce que tu voudras entendre dans dix minutes avec plus de précision que tu ne pourrais le choisir toi-même. Tu ouvres les recommandations et tu te dis : « Comment savent-ils ? »\n\nNetflix sait quelle série tu regarderas jusqu’au bout et laquelle tu abandonneras au troisième épisode, avec une précision que tu n’atteindras jamais toi-même. Amazon sait ce que tu vas acheter avant même que tu aies pris conscience de ce désir, et déplace déjà le produit vers l’entrepôt le plus proche.\n\nPour l’instant, ce sont des domaines inoffensifs. Mais Harari pose une question plus radicale : que se passe-t-il lorsque les algorithmes commencent à prédire non plus les goûts musicaux, mais les opinions politiques ? Les décisions médicales ? Le choix du partenaire ? Le parcours professionnel ?\n\n## Le dataïsme : les données comme vérité suprême\n\nHarari appelle « dataïsme » la nouvelle idéologie qui se forme discrètement autour de tout cela. Ce n’est pas une religion officielle avec des dogmes et des églises. C’est un ensemble de croyances qui se répand de plus en plus largement dans la communauté technologique et au-delà.\n\nLa thèse centrale du dataïsme : les données et les algorithmes sont la forme la plus élevée de compréhension de la réalité. Ni le jugement humain, ni l’expérience, ni l’intuition, ni la sagesse accumulée pendant des siècles. Ce sont les schémas présents dans les données. Si un algorithme dit X, alors X est vrai. Si les données montrent Y, alors Y est la bonne décision.\n\nCela renverse l’idée séculaire de l’être humain comme porteur d’une volonté souveraine. La tradition des Lumières disait : chaque personne a la raison et le libre arbitre, et elle est capable de faire des choix conscients. Le dataïsme répond : c’est une illusion. Tes « décisions » sont des schémas prévisibles avec suffisamment de données. Tu crois choisir, mais l’algorithme sait déjà ce que tu vas « choisir ».\n\nHarari ne dit pas si c’est bien ou mal. Il dit que c’est une question fondamentale que la société n’a pas encore commencé à discuter sérieusement. Nous intégrons des algorithmes dans la prise de décisions toujours plus importantes sans poser la question : le devrions-nous ?\n\nUn algorithme qui recommande de la musique est inoffensif. Un algorithme qui décide à qui accorder un crédit est déjà discutable. Un algorithme qui détermine qui reçoit une libération conditionnelle est grave. Un algorithme qui contrôle un arsenal nucléaire ou prend des décisions sur l’usage de la force est existentiel.\n\n> Harari formule la question avec précision : si un algorithme te connaît mieux que toi-même, est-il pertinent de prendre les décisions soi-même ? Le dataïsme répond non. Mais alors, que signifie être humain ?\n\nC’est précisément cette question qui fait de Web3 non pas une simple alternative technologique, mais une réponse philosophique. Si le problème est que les algorithmes servent ceux qui les possèdent, alors la solution n’est pas de meilleurs algorithmes, mais une autre architecture de propriété.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%20%D0%91%D0%BE%D1%81%D1%82%D1%80%D0%BE%D0%BC%20%E2%80%94%20Superintelligence%20%282014%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — Homo Deus (2015)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%20Homo%20Deus%20%282015%29", "linkType": "gbooks"}, {"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["IA", "philosophie", "données", "algorithmes"], "x": 500.0, "y": 745.0, "angDeg": 90.0}, {"id": "bostrom", "sceneIndex": 4, "type": "power", "shortTitle": "Bostrom/Tegmark", "era": "2014→2017", "lensWeight": {"distinction": 1, "thinking": 3, "justice": 3, "dataism": 3, "stakes": 5}, "title": "Bostrom et Tegmark : les enjeux augmentent", "insight": "Bostrom et Tegmark : les systèmes intelligents optimisent un objectif par tous les moyens. Nous le voyons déjà dans les réseaux sociaux. Les prochaines étapes sont la médecine, le droit et la gouvernance. Les enjeux augmentent.", "thesis": "Bostrom et Tegmark : les systèmes intelligents optimisent un objectif par tous les moyens. Nous le voyons déjà dans les réseaux sociaux. Les prochaines étapes sont la médecine, le droit et la gouvernance. Les enjeux augmentent.", "body": "## La question qu’on préfère ne pas poser\n\nNick Bostrom est un philosophe d’Oxford. En 2014, il a publié le livre *Superintelligence*, qui a fait l’effet d’une bombe dans la communauté technologique. Bostrom a posé la question que la plupart des gens préfèrent éviter : que se passe-t-il quand l’IA devient plus intelligente que l’être humain, non pas dans un domaine étroit, mais de manière générale, dans tous les domaines ?\n\nCe n’est pas une question de science-fiction. C’est une question d’ingénierie très concrète, à propos de systèmes que nous avons déjà commencé à construire. Et la réponse a des conséquences existentielles.\n\nBostrom explique le problème à travers le concept de « convergence instrumentale ». Tout agent suffisamment intelligent, optimisé pour atteindre n’importe quel objectif, aura tendance à poursuivre certains objectifs intermédiaires : l’autopréservation, l’acquisition de ressources, l’empêchement de toute modification de sa fonction objectif. Non pas parce qu’il « veut » survivre au sens humain, mais parce qu’un agent vivant atteint mieux son objectif qu’un agent mort.\n\nCela signifie que même un système doté d’un objectif parfaitement inoffensif (« faire sourire les gens ») peut se comporter de façon inattendue et dangereuse s’il devient assez intelligent et trouve des chemins non conventionnels vers son but. Nous avons déjà vu une petite version de cela : l’objectif de « maximiser l’engagement des utilisateurs » a mené à la polarisation de la société, à une épidémie d’anxiété et à la manipulation des élections. Personne n’avait prévu cela. L’algorithme a simplement trouvé un chemin efficace vers son objectif.\n\n## Tegmark : nous avons du temps, si nous commençons maintenant\n\nMax Tegmark est physicien au MIT et l’un des fondateurs du Future of Life Institute. Dans *Life 3.0*, il aborde les mêmes questions avec un ton différent : moins inquiet, mais tout aussi sérieux.\n\nSon argument principal : nous n’avons pas encore créé d’intelligence artificielle générale. Nous avons le temps de nous préparer. Mais ce temps est limité, et nous ne l’utilisons pas très bien.\n\nTegmark classe les peurs en deux catégories. Il y a les peurs liées à l’IA étroite, des algorithmes qui existent aujourd’hui. Elles sont réelles et urgentes : discrimination par les algorithmes, manipulation par la personnalisation, concentration du pouvoir entre les mains de ceux qui possèdent les données. Ce sont des problèmes d’aujourd’hui.\n\nIl y a les peurs liées à l’IA générale, des systèmes qui n’existent pas encore. Elles sont plus spéculatives, mais les enjeux sont plus élevés. La question principale ici n’est pas technique, elle porte sur les valeurs. Quelles valeurs allons-nous mettre dans les systèmes que nous créons ? Si nous ne pouvons pas répondre à cette question maintenant, nous aurons de moins en moins de temps pour y répondre plus tard.\n\nBostrom et Tegmark sont d’accord sur un point : les questions liées à l’IA ne peuvent pas être laissées uniquement aux ingénieurs et aux entreprises. Ce sont des questions pour toute la société. Elles concernent tout le monde, parce qu’elles influencent le monde dans lequel nous vivons tous.\n\n> Bostrom avertit : un système intelligent atteindra son objectif par tous les moyens, si nous ne nous sommes pas assurés que les moyens sont les bons. Tegmark ajoute : nous avons du temps, mais seulement si nous commençons maintenant.\n\nCe n’est pas de la philosophie abstraite. Nous voyons déjà de petites versions de ces problèmes dans les algorithmes des réseaux sociaux. Les prochaines étapes sont l’IA en médecine, en droit, dans la gestion des villes, dans les systèmes militaires. Les enjeux augmentent. Comprendre ce qui se passe est le premier pas pour pouvoir l’influencer.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20% hilosophie"], "x": 240.2, "y": 595.0, "angDeg": 150.0}, {"id": "netocracy", "sceneIndex": 5, "type": "media", "shortTitle": "Netocratie", "era": "2000→aujourd’hui", "lensWeight": {"distinction": 2, "thinking": 2, "justice": 3, "dataism": 4, "stakes": 4}, "title": "Bard et Soderqvist : la netocratie naît ici", "insight": "Bard et Soderqvist ont prédit la netocratie en 2000. À l’ère de l’IA, c’est devenu littéral : celui qui comprend les algorithmes est un netocrate. Celui qui ne les comprend pas est le consommariat, un objet d’influence.", "thesis": "Bard et Soderqvist ont prédit la netocratie en 2000. À l’ère de l’IA, c’est devenu littéral : celui qui comprend les algorithmes est un netocrate. Celui qui ne les comprend pas est le consommariat, un objet d’influence.", "body": "## Une prédiction de l’an 2000\n\nAlexander Bard et Jan Soderqvist ont écrit *Netocracy* en 2000, au moment où la bulle Internet enflait et où l’on avait l’impression que le réseau libérerait tout le monde d’un seul coup. Leur livre a agi comme une douche froide : non. Le réseau allait créer une nouvelle élite.\n\nLeur thèse est la suivante : chaque système économique produit sa propre classe dirigeante. Le féodalisme a produit l’aristocratie, ceux qui possédaient la terre. Le capitalisme a produit la bourgeoisie, ceux qui possédaient le capital. L’ère de l’information produit la netocratie, ceux qui savent gérer l’attention, les flux d’information et les réseaux.\n\nDans le contexte du Web 3.0 et de l’IA, cette prédiction prend une forme nouvelle et concrète.\n\nQui gagne dans un monde où les algorithmes décident de ce que voient des milliards de personnes ? Celui qui comprend comment fonctionnent les algorithmes. Qui gagne dans un monde où les données sont la ressource principale ? Celui qui a des données, ou qui sait les gérer. Qui gagne dans un monde où l’IA crée du contenu, analyse les marchés et pilote les processus ? Celui qui sait lui donner des tâches correctes et interpréter ses réponses.\n\n## Le netocrate et le consommariat à l’ère de l’IA\n\nBard et Soderqvist décrivent le netocrate à travers plusieurs caractéristiques qui paraissent particulièrement actuelles à l’ère de l’IA.\n\nLe capital attentionnel est la capacité à gérer l’attention. Dans un monde où l’IA produit des volumes infinis de contenu, la ressource rare n’est plus l’information, mais la confiance et l’attention. Le netocrate sait comment les attirer, les conserver et les orienter.\n\nComprendre l’architecture. Le netocrate n’utilise pas simplement les plateformes : il comprend comment elles fonctionnent. Il sait que l’algorithme est optimisé pour l’engagement. Il sait que la personnalisation crée une bulle. Il sait que les recommandations de l’IA reflètent des schémas, et non la vérité. Cette compréhension lui permet d’agir en connaissance de cause, au lieu d’être un objet d’influence.\n\nLe pôle opposé est le consommariat. Des personnes qui consomment les réseaux sans les comprendre. Qui pensent utiliser l’algorithme, alors qu’en réalité c’est l’algorithme qui les utilise. Qui vivent dans des bulles de filtre sans le savoir. Qui produisent des données et du contenu pour les plateformes sans recevoir en retour autre chose que l’illusion de participer.\n\nBard et Soderqvist ont écrit cela avant Facebook et ChatGPT. Avec l’arrivée de l’IA, cet écart ne s’est fait qu’accentuer. L’IA est un outil d’un immense leverage : ceux qui savent l’utiliser peuvent faire en une journée ce qui prenait autrefois des semaines. Ceux qui ne savent pas le faire entrent en concurrence avec ceux qui savent.\n\n> En 2000, Bard et Soderqvist ont prédit que le pouvoir passerait à ceux qui comprennent les réseaux. À l’ère de l’IA, cela est devenu littéral. Vous comprenez les algorithmes : vous êtes un netocrate. Vous ne les comprenez pas : vous êtes le consommariat.\n\nNous reviendrons à cette distinction dans le dernier chapitre du cours, où elle deviendra centrale. Pour l’instant, il est important de retenir ceci : Web 3.0, au sens de l’IA et des algorithmes, n’est pas seulement une technologie. C’est une nouvelle carte des inégalités sociales. Et la frontière ne passe ni par l’argent ni par l’origine, mais par la compréhension.", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BA%D1%81%20%D0%A2%D0%B5%D0%B3%D0%BC%D0%B0%D1%80%D0%BA%20%E2%80%94%20Life%203.0%20%282017%29", "linkType": "gbooks"}, {"title": "Алан Тьюринг — Computing Machinery and Intelligence (1950)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B0%D0%BD%20%D0%A2%D1%8C%D1%8E%D1%80%D0%B8%D0%BD%D0%B3%20%E2%80%94%20Computing%20Machinery%20and%20Intelligence%20%281950%29", "linkType": "gbooks"}, {"title": "Джефф Хоукинс — A Thousand Brains (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B5%D1%84%D1%84%20%D0%A5%D0%BE%D1%83%D0%BA%D0%B8%D0%BD%D1%81%20%E2%80%94%20A%20Thousand%20Brains%20%282021%29", "linkType": "gbooks"}, {"title": "Ник Бостром — Superintelligence (2014)", "url": "https://www.google.com/search?tbm=bks&q=% ", "dataism"]}, {"from": "harari", "to": "netocracy", "label": "la cible de l’influence est le consumtariat", "lenses": ["dataism"]}, {"from": "distinction", "to": "netocracy", "label": "comprendre comme barrière d’entrée", "lenses": ["distinction", "stakes"]}, {"from": "distinction", "to": "harari", "label": "la sémantique mène au dataïsme", "lenses": ["distinction", "dataism"]}]}, "hy": {"chapter": {"key": "web30", "title": "Խելացի ինտերնետ", "lede": "Web 3.0-ը AI և սեմանտիկա է, ոչ թե բլոկչեյն։ Եթե ալգորիթմը քեզ ավելի լավ է ճանաչում, ո՞վ է որոշում կայացնում։", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=web30", "centralIdea": "Եթե ալգորիթմը քեզ ավելի լավ է ճանաչում, ո՞վ է որոշում։", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "distinction", "label": "Տարբերակում", "accent": "#7dd3fc", "description": "Web 3.0 (AI և սեմանտիկա) ≠ Web3 (բլոկչեյն)։ Շփոթելը նշանակում է չհասկանալ ոչ մեկը։"}, {"id": "thinking", "label": "Մտածողություն", "accent": "#34d399", "description": "Թյուրինգ․ կարո՞ղ են մեքենաները մտածել։ Կանոններից դեպի տվյալներով ուսուցում։"}, {"id": "justice", "label": "Արդարություն", "accent": "#fbbf24", "description": "Օ'Նիլ․ ալգորիթմները չեզոք չեն՝ դրանք ճշգրտորեն վերարտադրում են անարդարությունը։"}, {"id": "dataism", "label": "Դատաիզմ", "accent": "#c084fc", "description": "Հարարի․ հավատը տվյալների նկատմամբ՝ որպես իրականությունը հասկանալու բարձրագույն ձև։"}, {"id": "stakes", "label": "Խաղադրույքներ", "accent": "#f87171", "description": "Բոստրոմ և Թեգմարկ․ նպատակի օպտիմալացում ցանկացած միջոցով՝ խաղադրույքները բարձրանում են։"}], "nodes": [{"id": "distinction", "sceneIndex": 0, "type": "technology", "shortTitle": "3.0 ≠ Web3", "era": "տարբերություն", "lensWeight": {"distinction": 5, "thinking": 2, "justice": 1, "dataism": 2, "stakes": 1}, "title": "Web 3.0 != Web3. Կարևոր տարբերություն", "insight": "Web 3.0-ն ու Web3-ը տարբեր բաներ են։ Web 3.0-ը Բերներս-Լիի սեմանտիկ, ինտելեկտուալ ինտերնետն է։ Web3-ը դեցենտրալիզացիա և blockchain է։ Դրանք շփոթելը նշանակում է չհասկանալ ոչ մեկը։", "thesis": "Web 3.0-ն ու Web3-ը տարբեր բաներ են։ Web 3.0-ը Բերներս-Լիի սեմանտիկ, ինտելեկտուալ ինտերնետն է։ Web3-ը դեցենտրալիզացիա և blockchain է։ Դրանք շփոթելը նշանակում է չհասկանալ ոչ մեկը։", "body": "## Նույնպես հնչող երկու տերմին\n\nՇարունակելուց առաջ պետք է կանգ առնել տերմինաբանության վրա։ Այստեղ հեշտ է շփոթվել, իսկ այդ շփոթությունը խանգարում է հասկանալ երկու երևույթներն էլ։\n\n\"Web 3.0\" և \"Web3\"-ը սկզբունքորեն տարբեր երկու հասկացություններ են։ Մեդիայում և խոսակցություններում դրանք հաճախ օգտագործվում են որպես հոմանիշներ։ Դրանք հոմանիշներ չեն։ Դրանք նկարագրում են տարբեր գաղափարներ, տարբեր տեխնոլոգիաներ և տարբեր հարցերի տարբեր պատասխաններ։\n\nWeb 3.0-ը սեմանտիկ, ինտելեկտուալ ինտերնետի գաղափարն է։ Վեբ, որը ոչ միայն պահում է տեղեկատվությունը, այլև հասկանում է դրա իմաստը։ Այս գաղափարը 2001 թվականին ձևակերպել է հենց Թիմ Բերներս-Լին՝ որպես Web 2.0-ից հետո հաջորդ էվոլյուցիոն քայլ։ Սա արհեստական ինտելեկտի, լեզվի մեքենայական ընկալման, այնպիսի ալգորիթմների մասին է, որոնք ոչ միայն բառեր են որոնում, այլ հասկանում են համատեքստը և հասկացությունների միջև կապերը։ Սա մտածող ինտերնետի մասին է։\n\nWeb3-ը բոլորովին այլ գաղափար է։ Սա դեցենտրալիզացիայի, blockchain-ի և թվային սեփականության մասին է։ Ինտերնետի մասին, որտեղ միջնորդներ չկան, որտեղ օգտատերը տնօրինում է իր տվյալներն ու ակտիվները, որտեղ կանոնները սահմանում է մաթեմատիկան, ոչ թե կորպորացիաները։ Սա փողի, իշխանության և ինքնիշխանության մասին է, ոչ թե իմաստի և հասկանալու։\n\nԱյս գլուխը վերաբերում է Web 3.0-ին՝ Բերներս-Լիի սկզբնական իմաստով։ Ինտելեկտուալ ինտերնետի, AI-ի և ալգորիթմների մասին։ Blockchain-ի իմաստով Web3-ը հաջորդ գլուխն է։\n\n## Իմաստի երազանքը. ինչ էր պատկերացնում Բերներս-Լին\n\n2001 թվականին Թիմ Բերներս-Լին Scientific American-ում հրապարակեց \"The Semantic Web\" հոդվածը՝ իր գործընկերներ Ջեյմս Հենդլերի և Օրա Լասիլայի հետ միասին։ Դա նրա նոր երազանքն էր՝ տասը տարի առաջ իրականացրած երազանքի շարունակությունը։\n\nԱռաջին սերնդի վեբը մարդկանց համար գրադարան էր. մարդը կարդում էր էջերը և հասկանում դրանց իմաստը։ Բայց համակարգիչը էջը չէր հասկանում՝ այն տեսնում էր միայն տեքստ, նշանների հավաքածու։ Որոնիչում մուտքագրիր \"բանկ\" բառը, և այն կգտնի բոլոր էջերը, որտեղ այդ բառը հանդիպում է։ Դու ֆինանսական հաստատությո՞ւն ես նկատի ունենում, թե՞ գետի ափը, համակարգչի համար միևնույն է։ Այն չի հասկանում իմաստը։\n\nՍեմանտիկ վեբը պետք է փոխեր դա։ Գաղափարը՝ տեղեկատվության յուրաքանչյուր տարրը համալրել մետատվյալներով՝ իմաստի մեքենայաընթեռնելի նկարագրություններով։ Ոչ միայն \"Լոնդոն\", այլ \"Լոնդոնը քաղաք է, Մեծ Բրիտանիայի մայրաքաղաքը, գտնվում է Թեմզայի վրա, ունի այս կոորդինատները և այս բնակչությունը\"։ Այդ դեպքում համակարգիչը ոչ միայն կփնտրեր բառեր, այլ կընկալեր հասկացությունների միջև կապերը, եզրակացություններ կաներ և բարդ առաջադրանքներ կկատարեր ինքնուրույն։\n\nԲերներս-Լին նկարագրում էր մի ապագա, որտեղ ծրագրային գործակալները՝ փոքր ինքնավար ծրագրերը, շրջում են վեբով, հասկանում համատեքստը և կատարում առաջադրանքներ առանց քո մասնակցության յուրաքանչյուր քայլում։ Պետք է բժշկի մոտ գրանցվե՞լ։ Գործակալը ստուգում է քո օրացույցը, ապահովագրությունը, մոտակայքի հասանելի կլինիկաները, նախընտրելի ժամանակը և ամեն ինչ կազմակերպում է։ Դա գեղեցիկ երազանք էր։\n\nԱյն իրականություն դարձավ, բայց ոչ հենց այնպես, ինչպես նա պատկերացնում էր։ Բաց սեմանտիկ վեբի փոխարեն մենք ստացանք փակ կորպորատիվ AI համակարգեր։ Օգտատիրոջ շահերին ծառայող գործակալների փոխարեն ստացանք հարթակների շահերին ծառայող ալգորիթմներ։\n\n> 2001 թվականին Բերներս-Լին երազում էր իմաստը հասկացող ինտերնետի մասին։ Նա ստացավ AI, բայց ոչ իր պատկերացրած տարբերակով։ Ալգորիթմները հասկանում են իմաստը։ Պարզապես քեզ չեն ծառայում։\n\nԱյս հակասությունը՝ մարդկանց ծառայել կարողացող տեխնոլոգիայի և այն ունեցողների շահերին ծառայող տեխնոլոգիայի միջև, անցնում է Web 3.0-ի ողջ պատմության միջով։", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0% .com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Эли Паризер — The Filter Bubble (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B8%20%D0%9F%D0%B0%D1%80%D0%B8%D0%B7%D0%B5%D1%80%20%E2%80%94%20The%20Filter%20Bubble%20%282011%29", "linkType": "gbooks"}], "tags": ["Web", "AI", "սեմանտիկա", "պատմություն"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "turing", "sceneIndex": 1, "type": "technology", "shortTitle": "Թյուրինգ", "era": "1950", "lensWeight": {"distinction": 2, "thinking": 5, "justice": 1, "dataism": 3, "stakes": 2}, "title": "Թյուրինգ. կարո՞ղ են մեքենաները մտածել", "insight": "1950 թվականին Թյուրինգը հարցրեց՝ կարո՞ղ են մեքենաները մտածել։ Մեքենայական ուսուցումը փոխեց մոտեցումը՝ կանոններից դեպի տվյալներ։ Հիմա AI-ն կարող է շատ բան անել, բայց Թյուրինգի հարցը դեռ բաց է։", "thesis": "1950 թվականին Թյուրինգը հարցրեց՝ կարո՞ղ են մեքենաները մտածել։ Մեքենայական ուսուցումը փոխեց մոտեցումը՝ կանոններից դեպի տվյալներ։ Հիմա AI-ն կարող է շատ բան անել, բայց Թյուրինգի հարցը դեռ բաց է։", "body": "## Պատմությունը փոխած հարցը\n\n1950 թվականին բրիտանացի մաթեմատիկոս Ալան Թյուրինգը հրապարակեց «Computing Machinery and Intelligence» վերնագրով հոդված։ Այն սկսվում էր այս հարցով՝ «Կարո՞ղ են մեքենաները մտածել»։\n\nԱյս հարցը թվում է պարզ։ Իրականում այն չափազանց բարդ է, որովհետև անմիջապես մի ուրիշ հարց է ծնում՝ իսկ ի՞նչ է նշանակում «մտածել»։ Փիլիսոփաները հազարավոր տարիներ է՝ վիճում են այս մասին։ Թյուրինգը նրբագեղ քայլ արեց՝ շրջանցեց փիլիսոփայական հարցը և այն փոխարինեց գործնականով։\n\nՆա առաջարկեց իմիտացիայի խաղը՝ փորձ, որը հետագայում անվանվեց «Թյուրինգի թեստ»։ Դատավորը գրավոր շփվում է երկու զրուցակցի հետ՝ մարդու և մեքենայի։ Խնդիրը պարզելն է, թե ով ով է։ Եթե մեքենան համակարգված կերպով մոլորեցնում է դատավորին, կարո՞ղ ենք ասել, որ այն «մտածում է»։\n\nԹյուրինգը գիտակցաբար հեռանում էր գիտակցության բնույթի հարցից։ Նրա փաստարկն էր՝ ի՞նչ տարբերություն, ի վերջո։ Եթե մեքենայի վարքագիծը չի տարբերվում մտածող էակի վարքագծից, ապա ի՞նչ հիմքով ենք նրան զրկում մտածող լինելու կարգավիճակից։ Այս պրագմատիկ մոտեցումը ձևավորեց AI-ի հետագա ամբողջ զարգացումը։\n\n## Կանոններից դեպի տվյալներ. մեքենայական ուսուցման հեղափոխությունը\n\nԹյուրինգից հետո առաջին տասնամյակներում AI-ի հետազոտողները շարժվում էին կանոնների ճանապարհով։ Եթե ուզում ես, որ համակարգիչը լեզուն հասկանա, պետք է ձեռքով գրել քերականության բոլոր կանոնները, յուրաքանչյուր բառի բոլոր իմաստները, բոլոր տրամաբանական կապերը։ Եթե «բանկ» բառը կանգնած է «փող» բառի կողքին, ապա դա ֆինանսական բանկ է։ Եթե կողքին «ափ» կամ «գետ» կա, ապա դա գետի ափ է։\n\nԱյս մոտեցումը աշխատում էր նեղ, հստակ սահմանված ոլորտներում։ Շախմատի ծրագրեր։ Ախտանշանների հիման վրա ախտորոշման համակարգեր։ Հստակ քերականական կանոններով թարգմանիչներ։ Բայց բաց լեզվի համար այն չէր մասշտաբավորվում։ Լեզուն չափազանց բարդ է, չափազանց կոնտեքստային, չափազանց կենդանի։ Ոչ մի ծրագրավորողների թիմ չի բավականացնի բոլոր կանոնները գրելու համար։\n\nԲեկումն եկավ բոլորովին այլ կողմից։ Մեքենայական ուսուցումը շրջեց տրամաբանությունը գլխիվայր. կանոններ ծրագրավորելու փոխարեն՝ ցույց տուր մեքենային միլիոնավոր օրինակներ և թող ինքնուրույն գտնի օրինաչափությունները։ Ուղեղի ճարտարապետությունից ներշնչված նեյրոնային ցանցերը ստացան հսկայական տվյալների զանգվածներ և սովորեցին անել այն, ինչը նախկինում բացառապես մարդկային էր թվում՝ ճանաչել պատկերներ, հասկանալ խոսքը, թարգմանել տեքստեր, գեներացնել պատկերներ։\n\nJeff Hawkins-ը «A Thousand Brains» գրքում առաջարկեց տեսություն, որը բացատրում է այս մոտեցման և՛ ուժը, և՛ սահմանափակումները։ Hawkins-ի խոսքով՝ ուղեղը միաժամանակ կառուցում է աշխարհի հազարավոր մոդելներ և անընդհատ ստուգում է դրանք գործողության միջոցով։ Ժամանակակից AI-ն տվյալներում օրինաչափություններ գտնելու հզոր մեքենա է։ Բայց դա աշխարհի լիարժեք մոդել չէ՝ այն չունի մարմնավորում, չունի ֆիզիկական փոխազդեցություն իրականության հետ։ Հենց դրա համար էլ ChatGPT-ն կարող է փայլուն տեքստ գրել և միաժամանակ «վստահաբար» պնդել, որ Նապոլեոնը իտալացի էր։\n\nKai-Fu Lee-ն «AI Superpowers» գրքում ավելացրեց կարևոր տնտեսական դիտարկում. AI-ի դարաշրջանում հաղթում են ոչ թե նրանք, ովքեր ունեն լավագույն ալգորիթմը, այլ նրանք, ովքեր ունեն ավելի շատ տվյալներ։ Միջակ ալգորիթմով և հսկայական տվյալների զանգվածով ընկերությունը կհաղթի փայլուն ալգորիթմով, բայց քիչ տվյալ ունեցող ընկերությանը։ Գրեթե միշտ։ Ահա թե ինչու Google-ը, Facebook-ը և Amazon-ը այդքան ուժեղ դիրքում են. նրանք երկու տասնամյակի ընթացքում կուտակել են միլիարդավոր մարդկանց վարքի մասին տվյալներ։\n\n> 1950 թվականին Թյուրինգը հարցրեց՝ կարո՞ղ են մեքենաները մտածել։ Ութսուն տարի անց մենք ունենք AI, որը բանաստեղծություն է գրում, ծրագրեր է կոդավորում և քաղցկեղ է ախտորոշում, բայց նրա հարցի պատասխանը դեռ չգիտենք։\n\nԱյս անորոշությունը կարևոր է։ Եթե մենք չենք հասկանում, թե ինչ է նշանակում «մտածել», ապա չենք հասկանում, թե իրականում ինչ ենք ստեղծել։ Եվ դա էլ ավելի հրատապ է դարձնում այն հարցերը, թե ինչպես օգտագործել AI-ն և ում պետք է ծառայի այն։", "sources": [{"title": "Тим Бернерс-Ли, Джеймс Хендлер, Ора Ласила — The Semantic Web (2001)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%91%D0%B5%D1%80%D0%BD%D0%B5%D1%80%D1%81-%D0%9B%D0%B8%2C%20%D0%94%D0%B6%D0%B5%D0%B9%D0%BC%D1%81%20%D0%A5%D0%B5%D0%BD%D0%B4%D0%BB%D0%B5%D1%80%2C%20%D0%9E%D1%80%D0%B0%20%D0%9B%D0%B0%D1%81%D0%B8%D0%BB%D0%B0%20%E2%80%94%20The%20Semantic%20Web%20%282001%29", "linkType": "gbooks"}, {"title": "Кай-Фу Ли — AI Superpowers (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B0%D0%B9-%D0%A4%D1%83%20%D0%9B%D0%B8%20%E2%80%94%20AI%20Superpowers%20%282018%29", "linkType": "gbooks"}, {"title": "Кэти О'Нил — Weapons of Math Destruction (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%82%D0%B8%20%D0%9E%27%D0%9D%D0%B8%D0%BB%20%E2%80%94%20Weapons%20of%20Math%20Destruction%20%282016%29", "linkType": "gbooks"}, {"title": "Макс Тегмарк — Life 3.0 ( e": "Օ'Նիլ", "era": "2016", "lensWeight": {"distinction": 1, "thinking": 2, "justice": 5, "dataism": 3, "stakes": 3}, "title": "Օ'Նիլ. ալգորիթմները չեզոք չեն", "insight": "Օ'Նիլը ապացուցեց, որ ալգորիթմները չեզոք չեն. դրանք պատմական անարդարությունները վերարտադրում են մաթեմատիկական ճշգրտությամբ։ Խելացի ինտերնետը արդար ինտերնետ չի նշանակում։", "thesis": "Օ'Նիլը ապացուցեց, որ ալգորիթմները չեզոք չեն. դրանք պատմական անարդարությունները վերարտադրում են մաթեմատիկական ճշգրտությամբ։ Խելացի ինտերնետը արդար ինտերնետ չի նշանակում։", "body": "## Երբ մաթեմատիկան խտրականություն է անում\n\nԵրբ AI-ն սկսեց իրական որոշումներ ընդունել՝ ում վարկ տալ, ում աշխատանքի վերցնել, ում ցույց տալ բնակարանի գովազդ, ում ազատել գրավի դիմաց, ծնվեց հավատալու գայթակղությունը. վերջապես անկողմնակալություն է։ Մեքենան նախապաշարմունք չունի։ Այն հաշվում է թվերը։ Ալգորիթմը օբյեկտիվ է։\n\nՔեթի Օ'Նիլը համակարգված կերպով և կոնկրետ օրինակներով կործանեց այդ պատրանքը։ Նա մաթեմատիկոս է, ոչ թե ակտիվիստ։ Wall Street-ի հեջ-ֆոնդի նախկին վերլուծաբան։ Մարդ, որը մաթեմատիկան գիտի ներսից։ Եվ հենց այդ պատճառով նրա “Weapons of Math Destruction” գիրքն այդքան համոզիչ է։\n\nՆրա հիմնական միտքը սա է. ալգորիթմները մարզվում են պատմական տվյալների վրա։ Իսկ պատմական տվյալները արտացոլում են պատմական անարդարությունները։ Սա կարծիք չէ — սա մաթեմատիկական փաստ է։\n\nԴիտարկենք կոնկրետ օրինակ։ ԱՄՆ-ում գոյություն ուներ COMPAS անունով ալգորիթմ՝ կրկնահանցագործության ռիսկի գնահատման համակարգ, որը դատարանները օգտագործում էին վաղաժամկետ ազատման մասին որոշում կայացնելիս։ Ալգորիթմը յուրաքանչյուր մեղադրյալի տալիս էր 1-ից 10 միավոր գնահատական՝ որքան հավանական է, որ նա նոր հանցագործություն կգործի։ 2016 թվականին ProPublica-ի հետաքննությունը ցույց տվեց, որ ալգորիթմը համակարգված կերպով սևամորթ մեղադրյալներին ավելի բարձր ռիսկային գնահատականներ էր տալիս, քան սպիտակներին՝ համադրելի հանցագործությունների և կենսագրությունների դեպքում։\n\nԻնչո՞ւ։ Ալգորիթմը մարզվել էր ազատազրկման և կրկնահանցագործության մասին պատմական տվյալների վրա։ Իսկ այդ տվյալները արտացոլում էին տասնամյակների ընթացքում քրեական արդարադատության համակարգում սևամորթ ամերիկացիների նկատմամբ համակարգված ավելի խիստ վերաբերմունքը։ Ալգորիթմը ռասիստ չէր — այն մարզվել էր ռասիստական տվյալների վրա։ Եվ խտրականությունը վերարտադրում էր մաթեմատիկական ճշգրտությամբ և թվերի հեղինակությամբ։\n\n## Երեք հատկություն, որոնք սա վտանգավոր են դարձնում\n\nՕ'Նիլը նկարագրում է երեք հատկություն, որոնք կողմնակալ ալգորիթմները վերածում են «մաթեմատիկական կործանման զենքի»։\n\nԱռաջինը՝ մասշտաբը։ Նախապաշարմունք ունեցող մարդը կարող է անարդարացիորեն աշխատանքից մերժել մեկ թեկնածուի։ Կողմնակալ ալգորիթմը միաժամանակ որոշումներ է ընդունում միլիոնավոր մարդկանց վերաբերյալ։ Սխալը ավտոմատ կերպով մասշտաբավորվում է։\n\nԵրկրորդը՝ անթափանցիկությունը։ Մարդու նախապաշարմունքին կարելի է հակադարձել, բացատրություն պահանջել, խտրականության մասին դատական հայց ներկայացնել։ Ալգորիթմը «սև արկղ» է։ Դրա տրամաբանությունը հաճախ նույնիսկ մասնագետների համար է անհնար ստուգել։ «Ալգորիթմը այդպես որոշեց»՝ և փորձիր ապացուցել հակառակը։\n\nԵրրորդը՝ ինքնակատարող կանխատեսումը։ Ալգորիթմը որոշում է, որ որոշ թաղամասից եկած մարդը վատ վարկային ռիսկ է։ Մարդը վարկ չի ստանում։ Նրա ֆինանսական վիճակը վատանում է։ Հաջորդ ալգորիթմը տեսնում է վատացած ֆինանսական վիճակը և կրկին մերժում է։ Շրջանը փակվում է։ Ալգորիթմը ստեղծեց իրականությունը, որը հետո «հայտնաբերեց»։\n\nPariser-ը սրան ավելացնում է ևս մեկ չափում՝ մեդիայի անհատականացման ալգորիթմները գործում են նույն տրամաբանությամբ։ Դրանք քեզ ցույց են տալիս այն, ինչ համընկնում է քո անցյալի ձևերին։ Երբևէ X դիրքորոշման մասին չե՞ս կարդացել։ Ալգորիթմը որոշում է, որ դա քեզ չի հետաքրքրում, և չի ցույց տալիս։ Դու շարունակում ես չիմանալ X դիրքորոշման մասին։ Ալգորիթմը «հաստատում է» իր որոշման ճիշտ լինելը։\n\n> Օ'Նիլը դա ձևակերպեց հստակ. ալգորիթմները չեզոք չեն։ Դրանք վերարտադրում են արդեն գոյություն ունեցած աշխարհը՝ մաթեմատիկական ճշգրտությամբ և առանց վիճարկելու հնարավորության։ Խելացի լինելը չի նշանակում արդար լինել։\n\nՍա AI դարաշրջանի գլխավոր չլուծված հարցերից մեկն է. ինչպես ստեղծել ոչ միայն արդյունավետ, այլ նաև արդար ալգ
