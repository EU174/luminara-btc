"}], "tags": ["Web2", "plateformes", "psychologie", "pouvoir"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "network", "sceneIndex": 4, "type": "economy", "shortTitle": "Effets de réseau", "era": "2018", "lensWeight": {"chronology": 4, "attention": 2, "platform": 5, "economy": 5, "manipulation": 2}, "title": "Effets de réseau : pourquoi le gagnant ne peut pas être remplacé", "insight": "Les effets de réseau rendent les plateformes presque imbattables. Cambridge Analytica a montré la limite: quand les données des utilisateurs deviennent un outil pour influencer les élections, c'est un problème d'architecture, pas de réglementation.", "thesis": "Les effets de réseau rendent les plateformes presque imbattables. Cambridge Analytica a montré la limite: quand les données des utilisateurs deviennent un outil pour influencer les élections, c'est un problème d'architecture, pas de réglementation.", "body": "## La gravité des plateformes\n\nLes plateformes ont une propriété qui rend la concurrence avec elles presque impossible. On appelle cela l'« effet de réseau » et c'est sans doute le concept économique le plus important pour comprendre l'ère numérique.\n\nEffet de réseau: la valeur d'un réseau pour chaque utilisateur augmente à mesure que de nouveaux utilisateurs rejoignent le réseau. Le premier téléphone au monde était totalement inutile: personne à appeler. Le deuxième téléphone a créé une connexion. Mille téléphones ont créé près d'un demi-million de connexions possibles. Un million de téléphones ont créé environ cinq cents milliards. La valeur ne croît pas de manière linéaire, mais exponentielle.\n\nPour Facebook, cela signifie ceci: la plateforme a de la valeur précisément parce que tous tes amis y sont. Si une personne de plus de ton cercle s'y inscrit, Facebook devient un peu plus précieux pour toi. Si tous tes amis partent, Facebook devient inutile, quel que soit l'argent investi dedans.\n\nCela crée une boucle d'auto-renforcement. La première plateforme qui atteint une masse critique devient presque imbattable. Un concurrent ne peut pas simplement créer un meilleur produit: il doit convaincre tous tes amis de changer en même temps. Et pour cela, convaincre leurs amis. Et pour cela, leurs amis. C'est presque impossible.\n\n## Cambridge Analytica et la limite de la tolérance\n\nDans les années 2010, une chose est devenue évidente: les données sur le comportement des gens valent énormément d'argent. À tel point que les entreprises étaient prêtes à offrir n'importe quel service gratuitement, pourvu qu'elles obtiennent l'accès aux données. Mais une question est apparue, à laquelle Web2 n'a jamais répondu: à qui appartiennent ces données?\n\nEn 2018, le scandale Cambridge Analytica a éclaté. Facebook a vendu les données de 87 millions d'utilisateurs, sans leur consentement explicite, à une entreprise qui les a utilisées pour des manipulations politiques dans plusieurs pays. Ces données auraient influencé l'issue de l'élection présidentielle américaine et du référendum sur le Brexit au Royaume-Uni.\n\nCela a bouleversé la perception du public. Avant 2018, la plupart des gens considéraient « des données en échange d'un service » comme un échange normal. Ensuite, il est devenu clair que les données sur le comportement des gens ne sont pas seulement un actif commercial. C'est un instrument de pouvoir sur les processus démocratiques. C'est quelque chose dont la fuite peut avoir des conséquences non seulement désagréables, mais politiquement catastrophiques.\n\nAndrew Keen avertissait déjà en 2007 dans *The Cult of the Amateur* : lorsque n'importe qui peut publier n'importe quoi sans édition ni vérification des faits, l'expertise est dévalorisée et la qualité de l'information baisse. Cambridge Analytica a montré que la manipulation de l'information à l'échelle des plateformes Web2 peut avoir des conséquences que Keen ne pouvait pas prévoir.\n\n> Les effets de réseau sont la gravité des plateformes. Plus la masse est grande, plus l'attraction est forte et plus il est difficile de partir. Cambridge Analytica a montré que cette gravité peut entraîner non seulement les utilisateurs, mais aussi les processus démocratiques.\n\nCe scandale a accéléré le débat sur le fait que Web2 a des problèmes structurels qu'on ne peut pas résoudre par la réglementation ou les amendes. Il faut une autre architecture. Une architecture où les données appartiennent aux utilisateurs, et non aux plateformes. C'est précisément à cette question que Web3 a commencé à répondre.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["Web2", "effets de réseau", "données", "vie privée"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "kotler", "sceneIndex": 5, "type": "media", "shortTitle": "Kotler 3.0", "era": "2010", "lensWeight": {"chronology": 2, "attention": 3, "platform": 2, "economy": 3, "manipulation": 5}, "title": "Kotler 3.0 : quand le marketing a commencé à vendre du sens", "insight": "Kotler l'a bien montré : le marketing 3.0 ne vend ni un produit ni une utilité, mais du sens et de l'identité. Web2 lui a donné des outils sans précédent et a effacé la frontière entre comprendre et manipuler.", "thesis": "Kotler l'a bien montré : le marketing 3.0 ne vend ni un produit ni une utilité, mais du sens et de l'identité. Web2 lui a donné des outils sans précédent et a effacé la frontière entre comprendre et manipuler.", "body": "## Trois époques de la relation entre l'entreprise et l'être humain\n\nPhilip Kotler est l'un des principaux théoriciens du marketing du XXe siècle, l'auteur de manuels par lesquels des générations de managers ont étudié. En 2010, il a écrit *Marketing 3.0* et a fixé une transformation qui se déroulait sous les yeux de tous, mais que peu comprenaient de manière systématique.\n\nKotler a décrit trois générations de marketing comme trois réponses différentes à la question « que vendons-nous, et à qui ? »\n\nLe marketing 1.0 est l'époque du produit. L'usine fabrique le bien, la publicité dit : « Achète-le, il est de qualité et il est nécessaire ». Le consommateur est perçu comme un acheteur rationnel qui a besoin d'un produit fonctionnel. Pense au produit, ne pense pas à la personne.\n\nLe marketing 2.0 est l'époque du consommateur. Les entreprises ont commencé à étudier la psychologie de l'acheteur, à segmenter les publics, à personnaliser les offres. « Nous te comprenons mieux que les concurrents, et donc notre produit est pour toi. » Le consommateur est perçu comme un être émotionnel avec des besoins.\n\nLe marketing 3.0 est l'époque des valeurs. À l'époque du Web2, ceux qui ont gagné ne sont pas ceux qui vendaient le meilleur produit ou comprenaient mieux le consommateur. Ce sont ceux qui ont créé du sens et de l'appartenance. Le consommateur est perçu comme une personne entière avec des valeurs, des rêves et des besoins spirituels.\n\n## Du produit à l'identité\n\nRegarde des exemples concrets : ils expliquent mieux que n'importe quelle théorie.\n\nApple. Sur le plan fonctionnel, l'iPhone n'est pas tellement meilleur que ses concurrents pour valoir deux fois plus cher. Mais Apple ne vend pas un téléphone. Elle vend l'identité d'une personne créative, instruite et de bon goût. Quand tu achètes un iPhone, tu achètes l'appartenance à une certaine tribu. C'est précisément pour cela que les fans d'Apple le défendent avec une telle passion : ils défendent leur identité.\n\nNike. Les baskets Nike sont fonctionnellement comparables à des dizaines d'autres marques. Mais Nike vend une histoire de dépassement de soi. Just Do It n'est pas une consigne pour acheter des chaussures. C'est une philosophie. Quand tu achètes Nike, tu essayes un récit selon lequel tu es capable de plus.\n\nStarbucks. Le café Starbucks coûte objectivement cinq à huit fois plus qu'une boisson de qualité comparable dans un café moyen. Mais Starbucks vend le « troisième lieu » : l'espace entre la maison et le travail où l'on peut rester, travailler, se retrouver. Tu ne paies pas pour le café ; tu paies pour louer un espace social avec une sensation particulière.\n\nKotler y voyait une évolution : l'entreprise avait enfin commencé à penser les personnes comme des êtres entiers. Mais ce progrès avait un revers. La frontière entre « comprendre une personne plus en profondeur » et « manipuler une personne plus précisément » s'est révélée très fine. Si tu vends de l'identité, tu travailles avec ce qu'il y a de plus intime. Tu n'influences pas la décision d'achat, mais la personne que quelqu'un croit être.\n\n> Kotler a appelé cela un progrès. Zuboff a appelé cela un instrument de pouvoir. Les deux ont raison : la différence tient seulement au point de vue.\n\nÀ l'époque du Web2, le marketing 3.0 a reçu des outils sans précédent : des données sur le comportement de milliards de personnes, des algorithmes de personnalisation, une publicité ciblée avec une précision allant jusqu'au psychotype. Cela a permis de vendre l'identité avec une précision chirurgicale. Mais qui protège la personne dont on commerce l'identité à son insu ?", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["marketing", "identité", "Web2", "psychologie"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "verdict", "sceneIndex": 6, "type": "power", "shortTitle": "Bilan de Web2", "era": "≈2020", "lensWeight": {"chronology": 5, "attention": 4, "platform": 4, "economy": 3, "manipulation": 4}, "title": "Le résultat du Web2 : on nous a donné une voix, on nous a pris nos données", "insight": "Web2 a donné une voix à des milliards de personnes et a pris en échange la vie privée, la propriété des données et un espace d\\information commun. C\\était un contrat dont personne n\\a annoncé les conditions.", "thesis": "Web2 a donné une voix à des milliards de personnes et a pris en échange la vie privée, la propriété des données et un espace d\\information commun. C\\était un contrat dont personne n\\a annoncé les conditions.", "body": "## Ce que Web2 a apporté\n\nAvant de rendre un jugement sur l'ère Web2, il faut reconnaître honnêtement ses acquis. Ce n'est pas une apologie. C'est une tentative de comprendre pourquoi des personnes intelligentes ont construit ce système avec des intentions sincères, et ce qui a dérapé.\n\nWeb2 a donné une voix à des milliards de personnes qui n'en avaient pas auparavant. Ce n'est pas une métaphore. Un journaliste d'une petite ville peut révéler la corruption d'élus locaux, et son article sera lu par des centaines de milliers de personnes. Un militant peut organiser une manifestation en contournant les médias d'État. Une petite entreprise peut trouver des clients dans le monde entier sans budget publicitaire. C'est une démocratisation réelle et immense.\n\nWeb2 a fait tomber la distance. Avant lui, des barrières linguistiques, financières et géographiques séparaient le savoir mondial d'une personne vivant dans une petite ville. YouTube a donné un accès gratuit à du contenu éducatif de tous niveaux. Wikipedia a créé une encyclopédie universelle dans toutes les langues. Google Translate a supprimé la barrière linguistique. Cela a réellement changé les possibilités de millions de personnes.\n\nWeb2 a créé de nouveaux marchés et de nouveaux métiers. Créateur de contenu, community manager, podcasteur, streamer : ces professions n'existaient pas il y a vingt ans. L'économie des plateformes a permis à des personnes sans employeur traditionnel de gagner de l'argent : freelances, artisans, artistes.\n\n## Ce que Web2 a pris\n\nMais la liste de ce que Web2 a pris n'est pas moins longue.\n\nLa vie privée. Chaque action sur internet est désormais enregistrée, analysée et vendue. Vous ne savez pas exactement ce que l'on sait sur vous ni à qui on le vend. Les entreprises en savent plus sur vous que vos proches.\n\nLa propriété des données. Vous créez du contenu, la plateforme en est propriétaire. Vous construisez une audience, la plateforme contrôle l'accès à cette audience. L'algorithme change, et tout ce que vous avez construit pendant des années peut s'évaporer du jour au lendemain.\n\nUn espace d'information commun. Les algorithmes de personnalisation ont créé un monde où chacun vit dans sa propre bulle informationnelle. Des personnes dans une même ville peuvent voir des versions fondamentalement différentes de la réalité, et cela détruit la possibilité même d'un dialogue public.\n\nLa qualité moyenne de la culture. Keen le signalait déjà en 2007 : quand tout le monde peut publier sans édition ni vérification des faits, l'expertise est dévalorisée. Cela ne veut pas dire qu'il n'y a plus de contenu de qualité, il existe. Mais le retrouver dans un océan de bruit est devenu bien plus difficile.\n\nQuitter Web2 est simple en théorie et presque impossible en pratique. Les effets de réseau ont créé une telle gravité que « partir simplement » des plateformes revient à sortir de la vie sociale et professionnelle.\n\n> Web2 a conclu avec nous un accord sans en annoncer les conditions. Une voix en échange des données. Le lien en échange de la vie privée. Un service gratuit en échange de l'attention.\n\nCette contradiction même — entre la valeur que Web2 a créée et le prix qu'il a fait payer — a fait naître la question au centre de Web3 : peut-on obtenir une voix, du lien et un service sans qu'un autre possède nos données et notre attention ?", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29" : 5, "attention": 3, "platform": 4, "economy": 3, "manipulation": 2}, "title": "Web2-ի ծնունդը. ինտերնետը քաղաք դարձավ", "insight": "Web2-ը ինտերնետը գրադարանից քաղաք դարձրեց՝ բոլորին ձայն տալով, բայց այդ ձայնը ներդնելով ուշադրությունը դրամայնացնող մեքենայի մեջ։", "thesis": "Web2-ը ինտերնետը գրադարանից քաղաք դարձրեց՝ բոլորին ձայն տալով, բայց այդ ձայնը ներդնելով ուշադրությունը դրամայնացնող մեքենայի մեջ։", "body": "## Համաժողովում հորինված տերմին\n\n2004 թվականին տեխնիկական գրականության հրատարակիչ Թիմ Օ'Ռեյլին գործընկերների հետ մտահեղձման սեանս էր անցկացնում։ Պահը տարօրինակ էր. դոթքոմների փուչիկը պայթել էր 2000-ին, հազարավոր ընկերություններ սնանկացել էին, իսկ ներդրողները կորցրել էին հարյուրավոր միլիարդավոր դոլարներ։ Մեդիայում գրում էին, թե ինտերնետ-բիզնեսը պատրանք էր պարզվել։\n\nԲայց Օ'Ռեյլին նայում էր տվյալներին ու ուրիշ բան էր տեսնում։ Տրաֆիկը աճում էր։ Օգտատերերի թիվն ավելանում էր։ Փրկված ընկերությունները — Google, Amazon, eBay — պարզապես չէին գոյատևել, նրանք արագացել էին։ Ինտերնետի աշխատանքի էության մեջ ինչ-որ բան փոխվել էր։ Այդ փոփոխությանը անուն էր պետք։\n\nԱյսպես հայտնվեց «Web 2.0» տերմինը։ 2005 թվականի հոդվածում Օ'Ռեյլին ձևակերպեց դրա հատկանիշները. վեբը որպես հարթակ, ոչ թե որպես կայքերի հավաքածու։ Օգտատերերը՝ որպես արժեքի համաստեղծողներ, ոչ միայն սպառողներ։ Տվյալները՝ որպես գլխավոր ակտիվ։ Ցանցային էֆեկտները՝ որպես աճի շարժիչ. որքան շատ մարդ կա ցանցում, այնքան այն ավելի արժեքավոր է դառնում յուրաքանչյուր մասնակցի համար։\n\nՍա տեխնիկական մանիֆեստի նման էր հնչում։ Իրականում դա նոր բիզնես-մոդելի նկարագրություն էր, որի հետևանքները Օ'Ռեյլին այդ պահին դեռ չէր կանխատեսում։\n\n## Գրադարանից քաղաք\n\nWeb2-ից առաջ ինտերնետը գրադարան էր։ Դու գալիս էիր, կարդում, հետո հեռանում։ Կայքերը գոյություն ունեին առանձին-առանձին, ինչպես գրքերն էդարակներում։ Քո ու տեղեկատվության միջև միջնորդ չկար՝ միայն հասցե և բրաուզեր։\n\nWeb2-ը ինտերնետը դարձրեց քաղաք։ Հայտնվեցին հրապարակներ — Facebook, YouTube, Twitter — որտեղ մարդիկ ոչ միայն կարդում էին, այլ խոսում, վիճում, ցույց տալիս իրենց, հեղինակություն կառուցում։ Հայտնվեցին շուկաներ — Amazon, eBay — որտեղ մարդիկ միմյանց հետ ուղղակի գնում ու վաճառում էին։ Հայտնվեցին նավիգատորներ — Google որոնում — որոնք ցույց էին տալիս, թե ուր գնալ այս քաղաքում։\n\nԱռաջին անգամ սովորական մարդը, առանց տեխնիկական գիտելիքների, կարողացավ ոչ միայն ինտերնետը սպառել, այլ նաև ստեղծել այն։ Բլոգ բացել՝ WordPress-ում հինգ րոպե։ Տեսանյութ վերբեռնել՝ YouTube-ում մեկ կոճակ։ Կարծիք գրել, գնահատական տալ, լուսանկար կիսվել՝ այս ամենը հասանելի դարձավ բոլորին։ Web1-ում ընթերցողներին հեղինակներից բաժանող տեխնիկական պատնեշը փլուզվեց։\n\nՍա մասնակցության իսկական հեղափոխություն էր։ Եվ այն իսկապես փոխեց աշխարհը։ Բլոգերները բացահայտում էին կոռուպցիան այնտեղ, ուր պրոֆեսիոնալ լրագրողները չէին կարող հասնել։ Քաղաքացի լրագրողները նկարահանում էին իրադարձություններ, որոնք պաշտոնական ԶԼՄ-ները անտեսում էին։ Ակտիվիստները սոցիալական ցանցերի միջոցով բողոքներ էին կազմակերպում ավելի արագ, քան իշխանությունները հասցնում էին արձագանքել։ Արաբական գարուն։ #MeToo։ Այս ամենը հնարավոր դարձավ Web2-ի շնորհիվ։\n\nԲայց այս հեղափոխությունն ուներ իր գինը։ Եվ ոչ ոք դա չկարդաց օգտատիրոջ համաձայնագրում։\n\n> Web2-ը բոլորին ձայն տվեց — և այդ ձայնը ներմուծեց մի մեքենայի մեջ, որը փող էր աշխատում նրա ասած յուրաքանչյուր բառից։\n\nWeb2-ի պարադոքսն այն է, որ դա ազնիվ փոխանակում էր — պարզապես ոչ ոք դրա պայմանները բարձրաձայն չէր բացատրում։ Դու ստանում ես անվճար ծառայություն։ Փոխարենը՝ քո ուշադրությունը, քո տվյալները, քո վարքագիծը։ Խնդիրը ոչ թե այն էր, որ փոխանակումը գոյություն ուներ։ Խնդիրը այն էր, որ այն անտեսանելի էր։", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5% ooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["Web2", "հարթակներ", "պատմություն", "մեդիա"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "attention", "sceneIndex": 1, "type": "power", "shortTitle": "Ուշադրություն", "era": "1971 · 2019", "lensWeight": {"chronology": 3, "attention": 5, "platform": 3, "economy": 3, "manipulation": 3}, "title": "Ուշադրության տնտեսություն. այն սակավությունը, որը ոչ ոք չնկատեց", "insight": "Սայմոնը դեռ 1971-ին կանխատեսել էր ուշադրության տնտեսությունը։ Զուբոֆը արձանագրեց, որ մարդկային վարքագիծը դարձել է հումք, և դա իշխանության մի նոր տեսակ է, որը նախկինում գոյություն չուներ։", "thesis": "Սայմոնը դեռ 1971-ին կանխատեսել էր ուշադրության տնտեսությունը։ Զուբոֆը արձանագրեց, որ մարդկային վարքագիծը դարձել է հումք, և դա իշխանության մի նոր տեսակ է, որը նախկինում գոյություն չուներ։", "body": "## Նոբելյան դափնեկիրը նախազգուշացրել էր դեռ 1971-ին\n\n1971 թվականին տնտեսագիտության Նոբելյան մրցանակակիր Հերբերտ Սայմոնը գրեց մի հոդված, որը գրեթե ոչ ոք չնկատեց։ Դրա հիմնական միտքը պարզ ու անողոք էր. երբ տեղեկատվությունը շատանում է, սակավ ռեսուրսը ոչ թե տեղեկատվությունն է, այլ ուշադրությունը։\n\nՍայմոնը սա անվանեց «ուշադրության տնտեսություն» և ձևակերպեց Facebook-ից երեսուն տարի առաջ։ Տրամաբանությունը տարրական է. եթե ունես մեկ միլիոն կայք, իսկ մարդն ունի միայն քսանչորս ժամ օրում, արժեքը ոչ թե բովանդակության մեջ է։ Արժեքը մարդու աչքերին ու ականջներին հասանելիության մեջ է։ Ով վերահսկում է ուշադրությունը, վերահսկում է տնտեսությունը։\n\nGoogle-ը սա հասկացավ առաջինը և դրա վրա կառուցեց մի կայսրություն։ Որոնողական համակարգը անվճար էր։ Բայց ամեն անգամ, երբ ինչ-որ բան էիր որոնում, Google-ը քո մասին նոր բան էր իմանում. ինչն է քեզ անհանգստացնում, ինչ ես ուզում գնել, ինչի մասին ես մտածում գիշերը։ Այդ գիտելիքը Google-ը վաճառում էր գովազդատուներին։ Դու գումարով չէիր վճարում. վճարում էիր ուշադրությամբ ու տվյալներով։\n\n2005 թվականին Ջոն Բատելլը գրեց «The Search» գիրքը՝ Google-ի պատմությունը որպես նոր իշխանության պատմություն։ Նրա դիտարկումը պարզ էր. որոնողական համակարգը պարզապես որոնելու գործիք չէ։ Դա ենթակառուցվածք է, որով անցնում է մարդու ամբողջ տեղեկատվական տարածքը։ Ով վերահսկում է որոնումը, նա է որոշում՝ ինչն է գոյություն ունի մարդկանց համար, իսկ ինչն է՝ ոչ։ Որ կայքը կգտնեն, և որը կմնա անտեսանելի։ Սա այնպիսի իշխանություն է, որը կարելի է համեմատել անցյալի հրատարակիչների և հեռուստատեսային կորպորացիաների իշխանության հետ, միայն թե այլ մասշտաբով։\n\n## Հսկողության կապիտալիզմ. մարդը որպես հումք\n\nՇոշանա Զուբոֆը տասը տարի ծախսեց՝ ուսումնասիրելով, թե ինչ է տեղի ունենում մարդկանց տվյալների հետ ինտերնետում։ 2019 թվականին նա հրապարակեց «The Age of Surveillance Capitalism» գիրքը և ներմուծեց այն տերմինը, որը ամենաճշգրիտ կերպով նկարագրում է Web2-ի բիզնես մոդելը։\n\nՆրա փաստարկը սա էր. Google-ը և Facebook-ը հայտնաբերեցին հումքի նոր տեսակ։ Ոչ թե նավթ, ոչ թե ածուխ, այլ մարդկային վարքագիծ։ Ամեն սեղմում, կարդալու ընթացքում ամեն դադար, քաղաքի միջով անցած ամեն երթուղի, կոնկրետ էջում անցկացված ամեն վայրկյան՝ այս ամենը հավաքվում է, վերլուծվում և վերածվում այն բանի, ինչ Զուբոֆն անվանում է «վարքային ավելցուկներ»։ Այդ ավելցուկները վաճառվում են գովազդատուներին՝ մարդկանց ապագա գործողությունները կանխատեսելու և դրանց վրա ազդեցություն գործադրելու գործիք որպես։\n\nԶուբոֆը ընդգծում է ավանդական գովազդից հիմնարար տարբերությունը։ Քսաներորդ դարի գովազդն ասում էր. «Գնիր այս ապրանքը, այն լավն է»։ Հսկողության կապիտալիզմն ասում է. «Մենք գիտենք, որ դու սա կգնես, դեռ մինչև ինքդ որոշես։ Եվ մենք կարող ենք փոխել այդ որոշման հավանականությունը»։ Սա համոզում չէ։ Սա վարքի փոփոխություն է՝ այնպիսի միջավայրի միջոցով, որի մասին մարդը չի կասկածում։\n\nԿոնկրետ մասշտաբը սա է. մինչև 2023 թվականը թվային գովազդի շուկան գերազանցել էր տարեկան 600 միլիարդ դոլարը։ Դա ավելի շատ է, քան աշխարհի երկրների մեծ մասի ՀՆԱ-ն։ Այդ ամբողջ գումարը մարդկային ուշադրության և վարքային տվյալների մոնետիզացիա է։\n\n> Սայմոնը 1971-ին զգուշացրել էր. տեղեկատվական դարաշրջանի գլխավոր սակավությունը ուշադրությունն է։ Զուբոֆը 2019-ին արձանագրեց. այդ ուշադրությունը դարձավ մոլորակի գլխավոր հումքը։\n\nԱյս երկու դիտարկումների միջև քառասունութ տարի է և մեդիայի պատմության մեջ իշխանության ամենամեծ վերաբաշխումը։", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["ուշադրություն", "վերահսկման կապիտալիզմ", "Web2", "իշխանություն"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "lanier", "sceneIndex": 2, "type": "privacy", "shortTitle": "Լանիե", "era": "2010", "lensWeight": {"chronology": 3, "attention": 4, "platform": 3, "economy": 4, "manipulation": 4}, "title": "Լանիեր. դու գաջեթ չես, դու հենց արտադրանքն ես", "insight": "Լանիերը ցույց տվեց, որ Web2-ը ոչնչացրեց ստեղծագործողների միջին դասը՝ ստեղծելով «հաղթողը տանում է ամեն ինչ» կառուցվածք՝ մի քանի սուպերաստղեր և միլիոնավոր ստեղծողներ, որոնք անվճար են աշխատում հարթակների համար։", "thesis": "Լանիերը ցույց տվեց, որ Web2-ը ոչնչացրեց ստեղծագործողների միջին դասը՝ ստեղծելով «հաղթողը տանում է ամեն ինչ» կառուցվածք՝ մի քանի սուպերաստղեր և միլիոնավոր ստեղծողներ, որոնք անվճար են աշխատում հարթակների համար։", "body": "## Արդյունաբերության ներսից եկող ձայնը\n\nՋարոն Լանիերը հարթակների անսովոր քննադատ է։ Նա ոչ լրագրող է, ոչ էլ դրսից եկած գիտնական։ Նա վիրտուալ իրականության առաջամարտիկներից մեկն է, մարդ, որը 1980-ականներին աշխատում էր տեխնոլոգիական հեղափոխության հենց կենտրոնում՝ Սիլիկոնյան հովտում, կողք կողքի նրանց հետ, ովքեր կառուցում էին այդ արդյունաբերությունը։ Հենց դրա համար էլ նրա քննադատությունն այնքան համոզիչ է. նա համակարգը ճանաչում է ներսից։\n\n2010 թվականին նա գրել է «You Are Not a Gadget» գիրքը՝ հիասթափության մանիֆեստը։ Հիմնական թեզը սա է. Web2 հարթակները կառուցված են հիմնարար ստի վրա։ Դրանք ասում են, թե քեզ անվճար ծառայություն են տալիս։ Իրականում դրանք քեզանից վերցնում են արժեքավոր բան՝ քո ստեղծագործությունը, քո տվյալները, քո ժամանակը, քո անհատականությունը, և դա դրամայնացնում են՝ քեզ հետ որևէ էական բան չկիսելով։\n\nԼանիերը բերում է կոնկրետ օրինակներ, որոնք դժվար է անտեսել։ Երաժիշտը երգ է ձայնագրում, վերբեռնում է YouTube և հազար լսումների դիմաց ստանում է մի քանի ցենտ։ YouTube-ը այդ երգի շուրջ գովազդից շատ ավելի մեծ եկամուտ է ստանում։ Լրագրողը հոդված է գրում, որը Facebook-ում հարյուր հազար անգամ կիսվում է, և ստանում է զրո։ Facebook-ը գումար է վաստակում այդ հոդվածի ստեղծած տրաֆիկից։ Լուսանկարիչը նկարներ է անում, որոնք Instagram-ը օգտագործում է պատկերների ճանաչման ալգորիթմներ ուսուցանելու համար՝ առանց թույլտվության և առանց վճարման։\n\n## Ստեղծագործողների միջին դասի անհետացումը\n\nԼանիերը նկարագրել է տնտեսական հետևանք, որը 2010-ին քչերն էին տեսնում, բայց որը 2020-ականներին դարձավ ակնհայտ. Web2-ը ոչնչացրեց ստեղծագործողների միջին դասը։\n\nՆախկինում աստղերի և լիակատար անհայտության միջև կար ամբողջական մի տարածք՝ մասնագիտացված երաժիշտներ, որոնք ապրում էին համերգներից և ալբոմների վաճառքից։ Լրագրողներ, որոնք ընտանիք էին պահում տեղական թերթերի համար հոդվածներ գրելով։ Լուսանկարիչներ, որոնք նկարներ էին վաճառում գործակալություններին։ Գրողներ, որոնք ապրում էին միջին տպաքանակներից ստացվող հոնորարներով։ Սա մշակույթի միջին դասն էր։\n\nWeb2-ը այդ տարածքը փլուզեց։ Ալգորիթմները ստեղծեցին «հաղթողը տանում է ամեն ինչ» կառուցվածք. մի քանի սուպերաստղ հավաքում են միլիոնավոր հետևորդներ և հսկայական գումարներ վաստակում։ Մնացած բոլորը աշխատում են անվճար՝ ստեղծելով բովանդակություն հարթակների համար, որոնք այդ բովանդակությունից եկամուտ են ստանում։\n\n2011 թվականին Մարկ Անդրեսենը գրեց «Software Is Eating the World» հաղթական սյունակը՝ ծրագրային ապահովումը կլանում է յուրաքանչյուր արդյունաբերություն, և դա անխուսափելի է ու լավ։ Տաքսիները դառնում են Uber։ Հյուրանոցները՝ Airbnb։ Մեդիան՝ Netflix։ Երաժշտությունը՝ Spotify։ Հարթակի տրամաբանությունն ամենուր նույնն է. հանիր միջնորդներին, վաճառողին և գնորդին միացրու ուղիղ, վերցրու յուրաքանչյուր գործարքից միջնորդավճար։ Գործարաններ պետք չեն։ Մարժան հսկայական է։\n\nԱնդրեսենը ճիշտ էր, երբ նկարագրում էր կատարվողը։ Բայց նա լռեց գնի մասին. միջնորդների հետ միասին անհետանում էր նաև այն ենթակառուցվածքը, որը պահում էր հազարավոր մասնագետների։ Տաքսի ընկերությունները անարդյունավետ էին, բայց այնտեղ մարդիկ էին աշխատում։ Երաժշտական խանութները անհարմար էին, բայց երաժիշտներին ռոյալթի էին վճարում։\n\n> Լանիերը դա ճշգրիտ ձևակերպեց. անվճար ծառայությունը նվեր չէ։ Դա գործարք է, որի պայմանները քեզ երբեք չեն բացատրել։ Դու վճարում ես ստեղծագործությամբ, տվյալներով և ժամանակով։\n\nԱյս տրամաբանությունը կարևոր է Web3-ը հասկանալու համար։ Ապակենտրոնացված ինտերնետի կենտրոնական գաղափարներից մեկը ստեղծագործողներին վերադարձնելն է այն, ինչ Web2 հարթակները նրանցից վերցրել են։ Token-ները, smart contract-ները, ուղղակի վճարումները՝ դրանք տեխնիկական գործիքներ են այն խնդիրը լուծելու համար, որը Լանիերը նկարագրել էր դեռ 2010 թվականին։", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are N 94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["ստեղծողներ", "Web2", "տնտեսություն", "ուշադրություն"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "galloway", "sceneIndex": 3, "type": "power", "shortTitle": "Չորս հեծյալ", "era": "2017", "lensWeight": {"chronology": 3, "attention": 3, "platform": 5, "economy": 4, "manipulation": 3}, "title": "Գելոուեյը և չորս հեծյալները. գրավման հոգեբանությունը", "insight": "Գելոուեյը բացատրեց. Amazon, Apple, Facebook, Google-ը գրավեցին ոչ թե շուկաները, այլ մարդկային հիմնական կարիքները՝ գոյատևում, կարգավիճակ, պատկանելություն և գիտելիք։", "thesis": "Գելոուեյը բացատրեց. Amazon, Apple, Facebook, Google-ը գրավեցին ոչ թե շուկաները, այլ մարդկային հիմնական կարիքները՝ գոյատևում, կարգավիճակ, պատկանելություն և գիտելիք։", "body": "## Ինչու հենց այս չորսը\n\n2010-ականների կեսերին ակնհայտ դարձավ, որ մի քանի տեխնոլոգիական ընկերություններ գրավել են համաշխարհային տնտեսության անհամաչափ մեծ մասը։ Amazon, Apple, Facebook, Google. միասին նրանք կազմում էին ավելի շատ շուկայական կապիտալիզացիա, քան ազգային տնտեսությունների մեծ մասը։ Ինչու հենց նրանք։ Եվ ինչու այդքան արագ։\n\nՍքոթ Գելոուեյը *The Four* գրքում տվեց մի պատասխան, որը զարմացնում է հենց իր ոչ տեխնոլոգիական բնույթով։ Նա չի խոսում ավելի լավ ալգորիթմների կամ մեծ զարգացման բյուջեի մասին։ Նա խոսում է հոգեբանության մասին։ Չորս ընկերություններից յուրաքանչյուրն իր ձեռքն է վերցրել մարդկային հիմնական կարիքներից մեկը և դարձել է դրա միակ իրական մատակարարը։\n\nAmazon-ը գրավել է գոյատևման ու կուտակման կարիքը։ Սա ամենահին բնազդն է՝ պաշարներ ունենալ, ապրանքներ ստանալ արագ ու վստահելի։ Amazon Prime-ը խոստանում է. քեզ անհրաժեշտ ամեն ինչ վաղը կգա։ Սա պարզապես առաքման հարմարավետություն չէ, այլ անվտանգության զգացում։ Դու առանց անհրաժեշտի չես մնա։\n\nApple-ը գրավել է կարգավիճակի ու սեռական գրավչության կարիքը։ iPhone-ը հեռախոս չէ։ Դա ազդանշան է մյուսներին՝ ես պատկանում եմ որոշակի խավի, ունեմ լավ ճաշակ, հոգ եմ տանում իմ մասին։ Հենց այդ պատճառով մարդիկ նոր iPhone են գնում, նույնիսկ երբ հինը հիանալի աշխատում է։ Ոչ թե գործառույթների, այլ ազդանշանի համար։\n\nFacebook-ը գրավել է սիրո ու պատկանելության կարիքը։ Մարդու ամենախորը ցանկությունն է լինել խմբի մաս, ընդունված լինել, սիրված լինել։ Facebook-ի լայքը սոցիալական հավանություն է՝ փաթեթավորված ինտերֆեյսի մեջ։ «Ընկերներ» բառը պատահական չէ։ Պլատֆորմը շահագործում է մարդկային հոգեկանի ամենախոցելի տեղը։\n\nGoogle-ը գրավել է գիտելիքի և Աստծո կարիքը՝ ցանկացած հարցի պատասխանների աղբյուր լինելու կարիքը։ «Փնտրիր Google-ում» արտահայտությունը դարձել է «իմացիր ճշմարտությունը» արտահայտության հոմանիշը։ Google-ը գիտի ցանկացած հարցի պատասխան՝ բորշչի բաղադրատոմսից մինչև կյանքի իմաստը։ Սա աննախադեպ իշխանություն է՝ լինել ճշմարտության աղբյուրը միլիարդավոր մարդկանց համար։\n\n## Մարքեթինգը նոր լեզու գտավ\n\nՖիլիպ Կոտլերը նկարագրել է մարքեթինգի էվոլյուցիան երեք դարաշրջանով։ Մարքեթինգ 1.0-ը ապրանքն է. գործարանը արտադրում է, գովազդը վաճառում է։ Մարքեթինգ 2.0-ը սպառողն է. ուսումնասիրիր հոգեբանությունը, սեգմենտավորիր լսարանը, անհատականացրու առաջարկը։ Մարքեթինգ 3.0-ը արժեքներն են. Web2-ի դարաշրջանում հաղթում են նրանք, ովքեր վաճառում են ոչ թե ապրանք ու ոչ թե օգտակարություն, այլ իմաստ ու ինքնություն։\n\nApple-ը հեռախոս չի վաճառում. այն վաճառում է ստեղծագործ մարդու ինքնությունը։ Nike-ը կոշիկ չի վաճառում. այն վաճառում է պատմություն՝ ինքն իրեն հաղթահարելու մասին։ Starbucks-ը սուրճ չի վաճառում. այն վաճառում է «երրորդ վայրը»՝ տան ու աշխատանքի միջև գտնվող տարածքը։ Հենց այդ պատճառով Starbucks-ը կարող է հինգ եվրո վերցնել մի խմիչքի համար, որը տանը կարելի է պատրաստել հիսուն ցենտով։\n\nԿոտլերը սա տեսնում էր որպես առաջընթաց. բիզնեսը վերջապես սկսեց մարդկանց վերաբերվել որպես ամբողջական անձերի։ Բայց «մարդուն ավելի խորությամբ հասկանալու» և «մարդուն ավելի ճշգրիտ մանիպուլացնելու» միջև սահմանը չափազանց բարակ դուրս եկավ։ Երբ դու վաճառում ես ոչ թե ապրանք, այլ ինքնություն, դու աշխատում ես ամենաինտիմ բանի հետ՝ այն բանի հետ, թե մարդն ում է համարում իրեն։\n\n> Գելոուեյը ցույց տվեց. չորս հարթակները գրավել են ոչ թե շուկաները, այլ մարդկային հիմնական կարիքները։ Դա նրանց դարձնում է գրեթե անփոխարինելի։\n\nՀենց սա է բացատրում, թե ինչու են ցանցային էֆեկտները նրանց դեպքում այդքան ուժեղ։ Facebook-ից դուրս գալը նշանակում է կորցնել կապը ընկերների հետ։ Google-ն օգտագործելը դադարեցնելը նշանակում է զրկվել պատասխանների սովորական աղբյուրից։ Սա պարզապես անհարմարություն չէ։ Սա սոցիալական և հոգեբանական արժեք է։", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["Web2", "հարթակներ", "հոգեբանություն", "իշխանություն"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "network", "sceneIndex": 4, "type": "economy", "shortTitle": "Ցանցային էֆեկտներ", "era": "2018", "lensWeight": {"chronology": 4, "attention": 2, "platform": 5, "economy": 5, "manipulation": 2}, "title": "Հարթակների գրավիտացիան. ինչու հաղթողին փոխարինել չի ստացվում", "insight": "Ցանցային էֆեկտները հարթակները դարձնում են գրեթե անպարտելի։ Cambridge Analytica-ն ցույց տվեց սահմանը. երբ օգտատերերի տվյալները դառնում են ընտրությունների վրա ազդելու գործիք, դա ճարտարապետական խնդիր է, ոչ թե կարգավորող։", "thesis": "Ցանցային էֆեկտները հարթակները դարձնում են գրեթե անպարտելի։ Cambridge Analytica-ն ցույց տվեց սահմանը. երբ օգտատերերի տվյալները դառնում են ընտրությունների վրա ազդելու գործիք, դա ճարտարապետական խնդիր է, ոչ թե կարգավորող։", "body": "## Հարթակների գրավիտացիան\n\nՊլատֆորմներն ունեն մի հատկություն, որը նրանց հետ մրցակցելը գրեթե անհնար է դարձնում: Այն կոչվում է «ցանցային էֆեկտ» — և սա, հավանաբար, թվային դարաշրջանը հասկանալու համար ամենակարևոր տնտեսական հասկացությունն է։\n\nՑանցային էֆեկտ. ցանցի արժեքը յուրաքանչյուր օգտատիրոջ համար աճում է, երբ ցանց են միանում նոր օգտատերեր։ Աշխարհի առաջին հեռախոսը լրիվ անօգուտ էր — զանգելու ոչ ոք չկար։ Երկրորդ հեռախոսը ստեղծեց մեկ կապ։ Հազար հեռախոսը՝ գրեթե կես միլիոն հնարավոր կապեր։ Մեկ միլիոն հեռախոսը՝ մոտ հինգ հարյուր միլիարդ։ Արժեքը աճում է ոչ թե գծային, այլ էքսպոնենցիալ։\n\nFacebook-ի համար սա նշանակում է հետևյալը. հարթակը արժեքավոր է հենց այն պատճառով, որ այնտեղ են քո բոլոր ընկերները։ Եթե քո շրջանից էլի մեկ մարդ միանա այնտեղ, Facebook-ը քեզ համար մի փոքր ավելի արժեքավոր կդառնա։ Եթե բոլոր ընկերներդ հեռանան, Facebook-ը անօգուտ կդառնա, որքան էլ փող ներդրվի դրա մեջ։\n\nՍա ստեղծում է ինքնաուժեղացող օղակ։ Առաջին հարթակը, որը հավաքում է կրիտիկական զանգված, դառնում է գրեթե անպարտելի։ Մրցակիցը պարզապես չի կարող ավելի լավ արտադրանք ստեղծել. պետք է միաժամանակ համոզի քո բոլոր ընկերներին փոխվել։ Իսկ դրա համար պետք է համոզի նրանց ընկերներին։ Իսկ դրա համար՝ նրանց ընկերներին։ Սա գրեթե անհնար է։\n\n## Cambridge Analytica-ն և համբերության սահմանը\n\n2010-ականներին ակնհայտ դարձավ. մարդկանց վարքագծի մասին տվյալները հսկայական գումար են արժե։ Այնքան հսկայական, որ ընկերությունները պատրաստ էին անվճար տալ ցանկացած ծառայություն՝ միայն թե տվյալներին հասանելիություն ստանան։ Բայց առաջացավ մի հարց, որին Web2-ը այդպես էլ պատասխան չտվեց. ո՞ւմ են պատկանում այդ տվյալները։\n\n2018 թվականին պայթեց Cambridge Analytica-ի սկանդալը։ Facebook-ը 87 միլիոն օգտատիրոջ տվյալները՝ առանց նրանց հստակ համաձայնության, վաճառեց մի ընկերության, որը դրանք օգտագործեց մի քանի երկրներում քաղաքական մանիպուլյացիաների համար։ Ենթադրաբար, այդ տվյալները ազդեցություն ունեցան ԱՄՆ նախագահական ընտրությունների արդյունքի և Միացյալ Թագավորությունում Brexit-ի հանրաքվեի վրա։\n\nՍա փոխեց հանրային ընկալումը։ 2018-ից առաջ մարդկանց մեծ մասը «ծառայության դիմաց տվյալներ» փոխանակումը ընդունում էր որպես նորմալ գործարք։ Դրանից հետո պարզ դարձավ, որ մարդկանց վարքագծի մասին տվյալները պարզապես առևտրային ակտիվ չեն։ Դա ժողովրդավարական գործընթացների վրա ազդեցություն գործադրելու գործիք է։ Դա մի բան է, որի արտահոսքը կարող է ունենալ ոչ միայն տհաճ, այլև քաղաքականապես աղետալի հետևանքներ։\n\nAndrew Keen-ը դեռ 2007 թվականին *The Cult of the Amateur*-ում զգուշացնում էր. երբ յուրաքանչյուրն առանց խմբագրման և փաստերի ստուգման կարող է հրապարակել ամեն ինչ, փորձագիտությունը արժեզրկվում է, իսկ տեղեկատվության որակը ընկնում է։ Cambridge Analytica-ն ցույց տվեց, որ Web2 հարթակների մասշտաբով տեղեկատվության մանիպուլյացիան կարող է ունենալ այնպիսի հետևանքներ, որոնք Keen-ը չէր կարող կանխատեսել։\n\n> Ցանցային էֆեկտները հարթակների գրավիտացիան են։ Որքան մեծ է զանգվածը, այնքան ուժեղ է ձգումը, այնքան դժվար է հեռանալ։ Cambridge Analytica-ն ցույց տվեց, որ այդ գրավիտացիան կարող է ներս քաշել ոչ միայն օգտատերերին, այլև ժողովրդավարական գործընթացները։\n\nՀենց այս սկանդալը արագացրեց խոսակցությունը այն մասին, որ Web2-ը կառուցվածքային խնդիրներ ունի, որոնք հնարավոր չէ լուծել կարգավորմամբ կամ տուգանքներով։ Անհրաժեշտ է այլ ճարտարապետություն։ Ճարտարապետություն, որտեղ տվյալները պատկանում են օգտատերերին, ոչ թե հարթակներին։ Հենց այս հարցին սկսեց պատասխանել Web3-ը.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20No {"id": "kotler", "sceneIndex": 5, "type": "media", "shortTitle": "Կոտլեր 3.0", "era": "2010", "lensWeight": {"chronology": 2, "attention": 3, "platform": 2, "economy": 3, "manipulation": 5}, "title": "Կոթլեր 3.0․ երբ մարքեթինգը սկսեց վաճառել իմաստներ", "insight": "Կոթլերը արձանագրեց. մարքեթինգ 3.0-ը վաճառում է ոչ թե արտադրանքն ու ոչ էլ օգտակարությունը, այլ իմաստներն ու ինքնությունը։ Web2-ը դրան տվեց աննախադեպ գործիքներ և ջնջեց հասկանալու ու մանիպուլացնելու միջև սահմանը։", "thesis": "Կոթլերը արձանագրեց. մարքեթինգ 3.0-ը վաճառում է ոչ թե արտադրանքն ու ոչ էլ օգտակարությունը, այլ իմաստներն ու ինքնությունը։ Web2-ը դրան տվեց աննախադեպ գործիքներ և ջնջեց հասկանալու ու մանիպուլացնելու միջև սահմանը։", "body": "## Բիզնեսի և մարդու հարաբերությունների երեք դարաշրջանները\n\nՖիլիպ Կոթլերը XX դարի մարքեթինգի գլխավոր տեսաբաններից մեկն է, դասագրքերի հեղինակ, որոնցով սերունդներ են սովորել մենեջմենթ։ 2010 թվականին նա գրեց «Marketing 3.0» և ֆիքսեց մի վերափոխում, որը տեղի էր ունենում բոլորի աչքի առաջ, բայց որը քչերն էին համակարգված հասկանում։\n\nԿոթլերը մարքեթինգի երեք սերունդները նկարագրեց որպես «ինչ ենք մենք վաճառում և ում» հարցին տրված երեք տարբեր պատասխաններ։\n\nՄարքեթինգ 1.0-ը արտադրանքի դարաշրջանն է։ Գործարանը արտադրում է ապրանք, գովազդը ասում է. «Գնիր, այն որակյալ է ու անհրաժեշտ»։ Սպառողը ընկալվում է որպես բանական գնորդ, ում պետք է ֆունկցիոնալ արտադրանք։ Մտածիր ապրանքի մասին, մի մտածիր մարդու մասին։\n\nՄարքեթինգ 2.0-ը սպառողի դարաշրջանն է։ Ընկերությունները սկսեցին ուսումնասիրել գնորդի հոգեբանությունը, սեգմենտավորել լսարանները, անհատականացնել առաջարկները։ «Մենք քեզ ավելի լավ ենք հասկանում, քան մրցակիցները, ուստի մեր արտադրանքը քեզ համար է»։ Սպառողը ընկալվում է որպես կարիքներ ունեցող էմոցիոնալ էակ։\n\nՄարքեթինգ 3.0-ը արժեքների դարաշրջանն է։ Web2-ի դարաշրջանում հաղթեցին ոչ թե նրանք, ովքեր վաճառում էին լավագույն արտադրանքը կամ ավելի լավ էին հասկանում սպառողին։ Հաղթեցին նրանք, ովքեր ստեղծում էին իմաստ և պատկանելություն։ Սպառողը ընկալվում է որպես ամբողջական անձ՝ արժեքներով, երազանքներով և հոգևոր կարիքներով։\n\n## Արտադրանքից դեպի ինքնություն\n\nՆայիր կոնկրետ օրինակներին՝ դրանք ցանկացած տեսությունից լավ են բացատրում։\n\nApple. Ֆունկցիոնալ առումով iPhone-ը այնքան էլ լավ չէ մրցակիցներից, որ արժենա կրկնակի թանկ։ Բայց Apple-ը հեռախոս չի վաճառում։ Այն վաճառում է ստեղծագործ, կրթված, լավ ճաշակ ունեցող մարդու ինքնությունը։ iPhone գնելիս դու գնում ես որոշակի ցեղին պատկանելությունը։ Հենց դրա համար էլ Apple-ի երկրպագուները այդքան կրքով են պաշտպանում այն՝ նրանք պաշտպանում են իրենց ինքնությունը։\n\nNike. Nike-ի կոշիկները ֆունկցիոնալ առումով համեմատելի են տասնյակ այլ բրենդների հետ։ Բայց Nike-ը վաճառում է ինքն իրեն հաղթահարելու պատմություն։ Just Do It-ը կոշիկ գնելու հրահանգ չէ։ Դա փիլիսոփայություն է։ Nike գնելիս դու փորձում ես այն նարատիվը, թե ի վիճակի ես ավելին անել։\n\nStarbucks. Starbucks-ի սուրճը օբյեկտիվորեն հինգից ութ անգամ ավելի թանկ է, քան միջին սրճարանում համեմատելի որակի խմիչքը։ Բայց Starbucks-ը վաճառում է «երրորդ վայրը»՝ տան և աշխատանքի միջև ընկած տարածքը, որտեղ կարելի է լինել, աշխատել, հանդիպել։ Դու վճարում ես ոչ թե սուրճի, այլ որոշակի զգացողությամբ սոցիալական տարածք վարձելու համար։\n\nԿոթլերը սա տեսնում էր որպես էվոլյուցիա. բիզնեսը վերջապես սկսեց մարդկանց մասին մտածել որպես ամբողջական անձերի մասին։ Բայց այս առաջընթացն ուներ հակառակ կողմը։ «Մարդուն ավելի խորությամբ հասկանալու» և «մարդուն ավելի ճշգրիտ մանիպուլացնելու» միջև սահմանը շատ բարակ դուրս եկավ։ Եթե դու ինքնություն ես վաճառում, աշխատում ես ամենաինտիմի հետ։ Դու ազդում ես ոչ թե գնման որոշման, այլ այն բանի վրա, թե մարդն իրեն ով է համարում։\n\n> Կոթլերը սա կոչեց առաջընթաց։ Զուբոֆը սա կոչեց իշխանության գործիք։ Երկուսն էլ ճիշտ են. տարբերությունը միայն այն է, թե ինչ տեսանկյունից ես նայում։\n\nWeb2-ի դարաշրջանում մարքեթինգ 3.0-ը ստացավ աննախադեպ գործիքներ՝ միլիարդավոր մարդկանց վարքագծի մասին տվյալներ, անհատականացման ալգորիթմներ, մինչև հոգետիպը ճշգրիտ թիրախավորված գովազդ։ Դա թույլ տվեց ինքնությունը վաճառել վիրահատական ճշգրտությամբ։ Բայց ո՞վ է պաշտպանում այն մարդուն, ում ինքնությամբ առևտուր են անում առանց լ բողոքի ակցիա՝ շրջանցելով պետական լրատվամիջոցները։ Փոքր բիզնեսը կարող է հաճախորդներ գտնել ամբողջ աշխարհում՝ առանց գովազդային բյուջեի։ Սա իրական և հսկայական ժողովրդավարացում է։\n\nWeb2-ը վերացրեց հեռավորությունը։ Մինչ այդ համաշխարհային գիտելիքի և փոքր քաղաքում ապրող մարդու միջև կանգնած էին լեզվական, ֆինանսական և աշխարհագրական խոչընդոտներ։ YouTube-ը անվճար հասանելիություն տվեց ցանկացած մակարդակի կրթական բովանդակության։ Wikipedia-ն ստեղծեց ունիվերսալ հանրագիտարան ցանկացած լեզվով։ Google Translate-ը վերացրեց լեզվական արգելքը։ Դա իրոք փոխեց միլիոնավոր մարդկանց հնարավորությունները։\n\nWeb2-ը ստեղծեց նոր շուկաներ և նոր մասնագիտություններ։ Content creator-ը, SMM-մենեջերը, podcaster-ը, streamer-ը՝ այս մասնագիտությունները քսան տարի առաջ գոյություն չունեին։ Պլատֆորմների տնտեսությունը հնարավորություն տվեց եկամուտ ստանալ մարդկանց, որոնք չունեն ավանդական գործատու՝ ֆրիլանսերներին, արհեստավորներին, արվեստագետներին։\n\n## Web2-ը ինչ վերցրեց\n\nԲայց այն, ինչ վերցրեց Web2-ը, ցուցակը նույնպես պակաս երկար չէ։\n\nԳաղտնիությունը։ Ինտերնետում յուրաքանչյուր գործողություն հիմա գրանցվում է, վերլուծվում և վաճառվում։ Դու չգիտես՝ կոնկրետ ինչ գիտեն քո մասին և ում են դա վաճառում։ Կորպորացիաները քո մասին ավելի շատ գիտեն, քան քեզ մոտ կանգնած մարդիկ։\n\nՏվյալների սեփականությունը։ Դու բովանդակություն ես ստեղծում, բայց այն պատկանում է պլատֆորմին։ Դու լսարան ես կառուցում, բայց դրա հասանելիությունը վերահսկում է պլատֆորմը։ Ալգորիթմը փոխվում է, և այն ամենը, ինչ տարիներով կառուցել ես, կարող է մեկ գիշերում անհետանալ։\n\nԸնդհանուր տեղեկատվական տարածքը։ Անհատականացման ալգորիթմները ստեղծեցին աշխարհ, որտեղ բոլորը ապրում են իրենց տեղեկատվական պղպջակներում։ Նույն քաղաքի մարդիկ կարող են տեսնել իրականության արմատապես տարբեր տարբերակներ, և դա քանդում է հանրային երկխոսության հենց հնարավորությունը։\n\nՄշակույթի միջին որակը։ Keen-ը դեռ 2007-ին էր զգուշացնում դրա մասին․ երբ բոլորը կարող են հրապարակել առանց խմբագրման և փաստերի ստուգման, փորձառությունը արժեզրկվում է։ Դա չի նշանակում, որ որակյալ բովանդակություն այլևս չկա՝ կա։ Բայց այն գտնելը աղմուկի օվկիանոսում շատ ավելի դժվար է դարձել։\n\nWeb2-ից դուրս գալը խոսքերով հեշտ է, իսկ գործնականում գրեթե անհնար։ Ցանցային էֆեկտները ստեղծել են այնպիսի ձգողականություն, որ պլատֆորմներից «ուղղակի հեռանալը» նշանակում է դուրս մնալ սոցիալական և մասնագիտական կյանքից։\n\n> Web2-ը մեզ հետ գործարք կնքեց՝ առանց պայմանները հայտարարելու։ Ձայն՝ տվյալների դիմաց։ Կապ՝ գաղտնիության դիմաց։ Անվճար ծառայություն՝ ուշադրության դիմաց։\n\nՀենց այդ հակասությունը՝ Web2-ի ստեղծած արժեքի և դրա դիմաց վերցրած գնի միջև, ծնեց Web3-ի կենտրոնում կանգնած հարցը. հնարավո՞ր է ստանալ ձայն, կապ և ծառայություն՝ առանց այն բանի, որ մեկ ուրիշը տիրի քո տվյալներին և ուշադրությանը։", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D const LANGS = ["ru", "en", "uk", "kk", "uz", "es", "fr", "hy"];
const LANG_LABELS = {"ru": "RU", "en": "EN", "uk": "UK", "kk": "KK", "uz": "UZ", "es": "ES", "fr": "FR", "hy": "HY"};
let CURRENT_LANG = 'ru';
function pickLang(l){ return LANGS.indexOf(l)>=0 ? l : 'ru'; }
function applyLang(l){
  l = pickLang(l); CURRENT_LANG = l;
  const src = CHAPTER_I18N[l];
  // подменяем содержимое рабочего CHAPTER_DATA
  CHAPTER_DATA.chapter.title = src.chapter.title;
  CHAPTER_DATA.chapter.lede = src.chapter.lede;
  CHAPTER_DATA.chapter.centralIdea = src.chapter.centralIdea;
  CHAPTER_DATA.lenses.forEach((ls,i)=>{ ls.label=src.lenses[i].label; ls.description=src.lenses[i].description; });
  CHAPTER_DATA.nodes.forEach((n,i)=>{ const s=src.nodes[i];
    n.shortTitle=s.shortTitle; n.era=s.era; n.title=s.title; n.insight=s.insight;
    n.thesis=s.thesis; n.body=s.body; n.tags=s.tags; });
  CHAPTER_DATA.edges.forEach((e,i)=>{ e.label=src.edges[i].label; });
  // UI-строки
  const _U = UI_I18N[l] || UI_I18N.ru; const _R = UI_I18N.ru || {};
  const U = {}; Object.keys(_R).forEach(k=>{ U[k] = (_U[k] && String(_U[k]).trim()) ? _U[k] : _R[k]; });
  document.documentElement.lang = l;
  const t=document.getElementById('app-title'); if(t) t.textContent=src.chapter.title;
  const ld=document.querySelector('.chapter-lede'); if(ld) ld.textContent=src.chapter.lede;
  document.querySelectorAll('[data-ui]').forEach(el=>{ const k=el.getAttribute('data-ui'); if(U[k]) el.textContent=U[k]; });
  // локализованный typeLabel + перестройка линз (иначе останутся на языке сборки)
  window.__UI_LOC = U;
  try{ buildLenses(); setLens(state.lens); }catch(e){}
  // перерисовать карту/деталь/прогресс
  try{ renderAll(); }catch(e){}
  // отметить активную кнопку языка
  document.querySelectorAll('.lang-btn').forEach(b=>b.setAttribute('aria-pressed', b.getAttribute('data-lang')===l ? 'true':'false'));
}
function buildLangSwitcher(){
  const rail=document.querySelector('.rail'); if(!rail) return;
  const wrap=document.createElement('div'); wrap.className='lang-switch';
  LANGS.forEach(l=>{ const b=document.createElement('button'); b.className='lang-btn'; b.type='button';
    b.setAttribute('data-lang',l); b.textContent=LANG_LABELS[l];
    b.addEventListener('click',()=>applyLang(l)); wrap.appendChild(b); });
  rail.insertBefore(wrap, rail.firstChild);
}


window.addEventListener("message",function(ev){try{var d=ev.data||{};if(d.lang){applyLang(d.lang);}}catch(e){}});
async function boot(){buildLangSwitcher();var _q=new URLSearchParams(location.search).get("lang");var _h=(location.hash.match(/[?&]lang=([a-z]{2})/)||[])[1];var _lp=_q||_h;if(_lp)CURRENT_LANG=pickLang(_lp);buildLenses();setLens(state.lens);applyLang(CURRENT_LANG);}
document.addEventListener("DOMContentLoaded",()=>{try{boot();}catch(e){renderEmptyState("Ошибка инициализации: "+e.message);}});
</script>
