"to": "verdict", "label": "a deal with undeclared terms", "lenses": ["attention", "chronology"]}, {"from": "network", "to": "kotler", "label": "scale amplifies influence", "lenses": ["economy", "manipulation"]}]}, "uk": {"chapter": {"key": "web2", "title": "Інтернет став містом", "lede": "Тобі дали голос — щоб забрати твою увагу. Як Web2 перетворив бібліотеку на машину монетизації.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=web2", "centralIdea": "Тобі дали голос, щоб забрати твою увагу", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Хронологія", "accent": "#7dd3fc", "description": "Від народження Web2 до Cambridge Analytica — як «місто» стало машиною."}, {"id": "attention", "label": "Увага", "accent": "#fbbf24", "description": "Саймон і Зубофф: людська поведінка як сировина нового типу влади."}, {"id": "platform", "label": "Влада платформ", "accent": "#f87171", "description": "Гелловей і чотири вершники: захоплення не ринків, а базових потреб."}, {"id": "economy", "label": "Економіка", "accent": "#a78bfa", "description": "Мережеві ефекти й «переможець забирає все»: чому платформу не замінити."}, {"id": "manipulation", "label": "Маніпуляція", "accent": "#34d399", "description": "Котлер 3.0 і Ланьє: продаж смислів, стерта межа розуміння й впливу."}], "nodes": [{"id": "city", "sceneIndex": 0, "type": "media", "shortTitle": "Місто", "era": "2004→", "lensWeight": {"chronology": 5, "attention": 3, "platform": 4, "economy": 3, "manipulation": 2}, "title": "Народження Web2: інтернет став містом", "insight": "Web2 перетворив інтернет із бібліотеки на місто — дав голос кожному, але вбудував цей голос у машину монетизації уваги.", "thesis": "Web2 перетворив інтернет із бібліотеки на місто — дав голос кожному, але вбудував цей голос у машину монетизації уваги.", "body": "## Термін, придуманий на конференції\n\nУ 2004 році видавець технічної літератури Тім О'Рейлі проводив мозковий штурм із колегами. Момент був дивний: бульбашка доткомів луснула у 2000-му, тисячі компаній збанкрутували, інвестори втратили сотні мільярдів доларів. У медіа писали, що інтернет-бізнес виявився ілюзією.\n\nАле О'Рейлі дивився на дані й бачив інше. Трафік зростав. Користувачів ставало більше. Компанії, що вижили — Google, Amazon, eBay — не просто вижили, вони прискорилися. Щось змінилося в самій природі того, як працює інтернет. Цю зміну потрібно було назвати.\n\nТак з'явився термін «Web 2.0». У статті 2005 року О'Рейлі сформулював його ознаки: веб як платформа, а не як набір сайтів. Користувачі як співтворці цінності, а не лише споживачі. Дані як головний актив. Мережеві ефекти як двигун зростання — що більше людей у мережі, то ціннішою вона стає для кожного учасника.\n\nЦе звучало як технічний маніфест. Насправді це був опис нової бізнес-моделі, наслідків якої О'Рейлі тоді не передбачав.\n\n## З бібліотеки в місто\n\nДо Web2 інтернет був бібліотекою. Ти приходив, читав, ішов. Сайти існували окремо один від одного, як книжки на полицях. Між тобою та інформацією не було посередника — лише адреса й браузер.\n\nWeb2 перетворив інтернет на місто. З'явилися площі — Facebook, YouTube, Twitter — де люди не просто читали, а говорили, сперечалися, показували себе, будували репутацію. З'явилися ринки — Amazon, eBay — де купували й продавали напряму між собою. З'явилися навігатори — Google пошук — які показували, куди йти в цьому місті.\n\nУперше звичайна людина без технічних знань могла не лише споживати інтернет, а й створювати його. Завести блог — п'ять хвилин на WordPress. Завантажити відео — одна кнопка на YouTube. Написати відгук, поставити оцінку, поділитися фотографією — усе це стало доступним для всіх. Технічний бар'єр, який у Web1 відділяв читачів від авторів, упав.\n\nЦе була справжня революція участі. І вона справді змінила світ. Блогери викривали корупцію там, куди професійні журналісти не могли дістатися. Громадянські журналісти знімали події, які офіційні ЗМІ ігнорували. Активісти організовували протести через соціальні мережі швидше, ніж влада встигала реагувати. Арабська весна. #MeToo. Усе це стало можливим завдяки Web2.\n\nАле ця революція мала ціну. І її ніхто не читав у користувацькій угоді.\n\n> Web2 дав голос кожному — і вбудував цей голос у машину, яка заробляла на кожному його слові.\n\nПарадокс Web2 у тому, що це був чесний обмін — просто ніхто не пояснював його умов уголос. Ти отримуєш безплатний сервіс. Натомість — твоя увага, твої дані, твоя поведінка. Проблема не в тому, що обмін існував. Проблема в тому, що він був невидимим.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["Web2", "платформи", "історія", "медіа"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "attention", "sceneIndex": 1, "type": "power", "shortTitle": "Увага", "era": "1971 · 2019", "lensWeight": {"chronology": 3, "attention": 5, "platform": 3, "economy": 3, "manipulation": 3}, "title": "Економіка уваги: дефіцит, якого не помітили", "insight": "Саймон передбачив економіку уваги у 1971-му. Зубофф зафіксувала: людська поведінка стала сировиною — і це новий тип влади, якого раніше не існувало.", "thesis": "Саймон передбачив економіку уваги у 1971-му. Зубофф зафіксувала: людська поведінка стала сировиною — і це новий тип влади, якого раніше не існувало.", "body": "## Нобелівський лауреат попереджав у 1971-му\n\nУ 1971 році нобелівський лауреат з економіки Герберт Саймон написав статтю, яку майже ніхто не помітив. Її головна думка була простою й залізною: коли інформації стає багато, дефіцитним ресурсом стає не інформація, а увага.\n\nСаймон назвав це «економікою уваги» й сформулював за тридцять років до Facebook. Логіка елементарна: якщо в тебе є мільйон сайтів, а в людини лише двадцять чотири години на добу — цінність має не контент. Цінність має доступ до очей і вух людини. Той, хто контролює увагу, контролює економіку.\n\nGoogle зрозумів це першим — і побудував на цьому імперію. Пошуковик був безплатним. Але щоразу, коли ти щось шукав, Google дізнавався про тебе щось нове: що тебе непокоїть, що ти хочеш купити, про що думаєш уночі. Ці знання Google продавав рекламодавцям. Ти не платив грошима — ти платив увагою й даними.\n\nДжон Баттель у 2005 році написав книжку «The Search» — історію Google як історію нової влади. Його спостереження: пошуковик — це не просто інструмент пошуку. Це інфраструктура, через яку проходить увесь інформаційний простір людини. Той, хто контролює пошук, вирішує, що існує для людей, а що ні. Який сайт вони знайдуть, а який залишиться невидимим. Це влада, порівнянна з владою видавців і телекомпаній минулого — тільки масштаб інший.\n\n## Капіталізм стеження: людина як сировина\n\nШошана Зубофф витратила десять років на дослідження того, що відбувається з даними людей в інтернеті. У 2019 році вона опублікувала книжку «Епоха наглядового капіталізму» — і ввела термін, який найточніше описує бізнес-модель Web2.\n\nЇї аргумент: Google і Facebook відкрили новий вид сировини. Не нафту, не вугілля — людську поведінку. Кожен клік, кожна пауза під час читання, кожен маршрут містом, кожна секунда, проведена на конкретній сторінці — усе це збирається, аналізується й перетворюється на те, що Зубофф називає «поведінковими надлишками». Ці надлишки продаються рекламодавцям як інструмент передбачення й впливу на майбутні дії людей.\n\nЗубофф підкреслює принципову відмінність від традиційної реклами. Реклама XX століття казала: «Купи цей продукт — він хороший». Наглядовий капіталізм каже: «Ми знаємо, що ти це купиш — ще до того, як ти це вирішив. І ми можемо змінити ймовірність цього рішення». Це не переконання. Це модифікація поведінки через середовище, про яке людина не здогадується.\n\nКонкретний масштаб: ринок цифрової реклами до 2023 року перевищив 600 мільярдів доларів на рік. Це більше, ніж ВВП більшості країн світу. Уся ця сума — монетизація людської уваги й поведінкових даних.\n\n> Саймон попереджав у 1971-му: головний дефіцит інформаційної епохи — це увага. Зубофф зафіксувала у 2019-му: ця увага стала головною сировиною планети.\n\nМіж цими двома спостереженнями — сорок вісім років і найбільший перерозподіл влади в історії медіа.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["увага", "капіталізм спостереження", "Web2", "влада"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "lanier", "sceneIndex": 2, "type": "privacy", "shortTitle": "Ланьє", "era": "2010", "lensWeight": {"chronology": 3, "attention": 4, "platform": 3, "economy": 4, "manipulation": 4}, "title": "Ланьє: ти не гаджет, ти і є продукт", "insight": "Ланьє показав: Web2 знищив середній клас творців, створивши структуру «переможець забирає все» — кілька суперзірок і мільйони творців, які безплатно працюють для платформ.", "thesis": "Ланьє показав: Web2 знищив середній клас творців, створивши структуру «переможець забирає все» — кілька суперзірок і мільйони творців, які безплатно працюють для платформ.", "body": "## Голос ізсередини індустрії\n\nДжарон Ланьє — незвичний критик платформ. Він не журналіст і не вчений-аутсайдер. Він один із піонерів віртуальної реальності, людина, яка у 1980-х працювала в самому центрі технологічної революції — у Кремнієвій долині, пліч-о-пліч із тими, хто будував цю індустрію. Саме тому його критика така переконлива: він знає систему зсередини.\n\nУ 2010 році він написав книжку «You Are Not a Gadget» — маніфест розчарування. Головна теза: платформи Web2 побудовані на фундаментальній брехні. Вони кажуть, що дають тобі сервіс безплатно. Насправді вони забирають у тебе щось цінне — твою творчість, твої дані, твій час, твою індивідуальність — і монетизують це, не ділячись із тобою нічим суттєвим.\n\nЛаньє наводить конкретні приклади, від яких важко відмахнутися. Музикант записує пісню, викладає на YouTube — і отримує кілька центів за тисячу прослуховувань. YouTube заробляє на рекламі навколо цієї пісні значно більше. Журналіст пише статтю, яку поширюють у Facebook сто тисяч разів — і отримує нуль. Facebook заробляє на трафіку, який ця стаття генерує. Фотограф робить знімки, які Instagram використовує для навчання алгоритмів розпізнавання зображень — без дозволу й без оплати.\n\n## Зникнення середнього класу творців\n\nЛаньє описав економічний наслідок, який мало хто бачив у 2010-му, але який став очевидним до 2020-х: Web2 знищив середній клас творців.\n\nРаніше між зірками й повною невідомістю існував цілий простір — професійні музиканти, які заробляли на життя концертами й продажем альбомів. Журналісти, які годували сім'ї статтями для місцевих газет. Фотографи, які продавали знімки агентствам. Письменники, які жили на гонорари від середніх накладів. Це був середній клас культури.\n\nWeb2 схлопнув цей простір. Алгоритми створили структуру «переможець забирає все»: кілька суперзірок збирають мільйони підписників і заробляють величезні гроші. Усі інші працюють безплатно — створюючи контент для платформ, які на цьому контенті заробляють.\n\nМарк Андрессен у 2011 році написав тріумфальну колонку «Software Is Eating the World» — програмне забезпечення поглинає кожну індустрію, це неминуче й добре. Таксі перетворюється на Uber. Готелі — на Airbnb. Медіа — на Netflix. Музика — на Spotify. Логіка платформи всюди одна: прибери посередників, зведи продавця й покупця напряму, візьми комісію з кожної транзакції. Заводи не потрібні. Маржа величезна.\n\nАндрессен мав рацію в описі того, що відбувалося. Але промовчав про ціну: разом із посередниками зникала інфраструктура, яка підтримувала тисячі професіоналів. Таксі-компанії були неефективні — але в них працювали люди. Музичні магазини були незручні — але вони платили музикантам роялті.\n\n> Ланьє сформулював точно: безплатний сервіс — це не подарунок. Це угода, умови якої тобі не пояснили. Ти платиш творчістю, даними й часом.\n\nЦя логіка важлива для розуміння Web3. Одна з центральних ідей децентралізованого інтернету — повернути творцям те, що платформи Web2 у них забрали. Токени, смарт-контракти, прямі платежі — це технічні інструменти для розв'язання проблеми, яку Ланьє описав ще у 2010 році.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["творці", "Web2", "економіка", "увага"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "galloway", "sceneIndex": 3, "type": "power", "shortTitle": "Чотири вершники", "era": "2017", "lensWeight": {"chronology": 3, "attention": 3, "platform": 5, "economy": 4, "manipulation": 3}, "title": "Гелловей і чотири вершники: психологія захоплення", "insight": "Гелловей пояснив: Amazon, Apple, Facebook, Google захопили не ринки, а базові людські потреби — виживання, статус, належність, знання.", "thesis": "Гелловей пояснив: Amazon, Apple, Facebook, Google захопили не ринки, а базові людські потреби — виживання, статус, належність, знання.", "body": "## Чому саме ці четверо\n\nДо середини 2010-х стало очевидно, що кілька технологічних компаній захопили непропорційно велику частку світової економіки. Amazon, Apple, Facebook, Google — на їхню частку припадало більше ринкової капіталізації, ніж у більшості національних економік. Чому саме вони? І чому так швидко?\n\nСкотт Гелловей у книжці «The Four» дав відповідь, яка дивує своєю нетехнологічністю. Він не говорить про кращі алгоритми чи більший бюджет на розробку. Він говорить про психологію. Кожна з чотирьох компаній захопила одну з базових людських потреб — і стала її безальтернативним постачальником.\n\nAmazon захопив потребу у виживанні та накопиченні. Це найдавніший інстинкт — мати запаси, отримувати товари швидко й надійно. Amazon Prime обіцяє: усе, що тобі потрібно, прийде завтра. Це не просто зручність доставки — це відчуття безпеки. Ти не залишишся без необхідного.\n\nApple захопила потребу в статусі та сексуальній привабливості. iPhone — це не телефон. Це сигнал іншим людям: я належу до певного класу, у мене добрий смак, я дбаю про себе. Саме тому люди купують новий iPhone, навіть коли старий чудово працює. Не заради функцій — заради сигналу.\n\nFacebook захопив потребу в любові та належності. Найглибше людське бажання — бути частиною групи, бути прийнятим, бути любимим. Лайк у Facebook — це соціальне схвалення, запаковане в інтерфейс. Слово «друзі» не випадкове. Платформа експлуатує найуразливіше місце людської психіки.\n\nGoogle захопив потребу в знанні та в богові — у джерелі відповідей на будь-яке запитання. «Погугли це» стало синонімом «дізнайся правду». Google знає відповідь на будь-яке запитання — від рецепта борщу до сенсу життя. Це безпрецедентна влада: бути джерелом істини для мільярдів людей.\n\n## Маркетинг знайшов нову мову\n\nФіліп Котлер описав еволюцію маркетингу через три епохи. Маркетинг 1.0 — це продукт: завод виробляє, реклама продає. Маркетинг 2.0 — це споживач: вивчай психологію, сегментуй аудиторію, персоналізуй пропозицію. Маркетинг 3.0 — це цінності: в епоху Web2 виграють ті, хто продає не продукт і не користь, а сенс та ідентичність.\n\nApple не продає телефони — продає ідентичність творчої людини. Nike не продає кросівки — продає історію про подолання себе. Starbucks не продає каву — продає «третє місце», простір між домом і роботою. Саме тому Starbucks може брати п'ять євро за напій, який можна зробити вдома за п'ятдесят центів.\n\nКотлер бачив у цьому прогрес: бізнес нарешті почав ставитися до людей як до цілісних особистостей. Але межа між «зрозуміти людину глибше» і «маніпулювати людиною точніше» виявилася дуже тонкою. Коли ти продаєш не товар, а ідентичність — ти працюєш із найінтимнішим: із тим, ким людина себе вважає.\n\n> Гелловей показав: чотири платформи захопили не ринки — вони захопили базові людські потреби. Це робить їх майже незамінними.\n\nСаме це пояснює, чому мережеві ефекти в їхньому випадку такі потужні. Вийти з Facebook — означає втратити зв'язок із друзями. Перестати користуватися Google — означає позбутися звичного джерела відповідей. Це не просто незручність. Це соціальна й психологічна ціна.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["Web2", "платформи", "психологія", "влада"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "network", "sceneIndex": 4, "type": "economy", "shortTitle": "Мережеві ефекти", "era": "2018", "lensWeight": {"chronology": 4, "attention": 2, "platform": 5, "economy": 5, "manipulation": 2}, "title": "Мережеві ефекти: чому переможця не замінити", "insight": "Мережеві ефекти роблять платформи майже непереможними. Cambridge Analytica показав межу: коли дані користувачів стають інструментом впливу на вибори — це архітектурна проблема, а не регуляторна.", "thesis": "Мережеві ефекти роблять платформи майже непереможними. Cambridge Analytica показав межу: коли дані користувачів стають інструментом впливу на вибори — це архітектурна проблема, а не регуляторна.", "body": "## Гравітація платформ\n\nУ платформ є одна властивість, яка робить конкуренцію з ними майже неможливою. Вона називається «мережевий ефект» — і це, мабуть, найважливіша економічна концепція для розуміння цифрової епохи.\n\nМережевий ефект: цінність мережі для кожного користувача зростає в міру того, як до мережі приходять нові користувачі. Перший телефон у світі був абсолютно марним — телефонувати було нікому. Другий телефон створив одне з'єднання. Тисяча телефонів — майже пів мільйона можливих з'єднань. Мільйон телефонів — близько п'ятисот мільярдів. Цінність зростає не лінійно, а експоненційно.\n\nДля Facebook це означає таке: платформа цінна саме тому, що там усі твої друзі. Якщо туди приходить ще одна людина з твого кола — Facebook стає трохи ціннішим для тебе. Якщо всі твої друзі підуть — Facebook стане марним, скільки б грошей у нього не інвестували.\n\nЦе створює петлю самопосилення. Перша платформа, яка набирає критичну масу, стає майже непереможною. Конкурент не може просто створити кращий продукт — потрібно переконати одночасно перейти всіх твоїх друзів. А для цього потрібно переконати їхніх друзів. А для цього — їхніх друзів. Це майже неможливо.\n\n## Cambridge Analytica і межа терпіння\n\nДо 2010-х років стало очевидно: дані про поведінку людей коштують величезних грошей. Настільки величезних, що компанії були готові давати будь-які сервіси безкоштовно — аби лише отримати доступ до даних. Але постало питання, на яке Web2 так і не дав відповіді: кому належать ці дані?\n\nУ 2018 році вибухнув скандал із Cambridge Analytica. Facebook продав дані 87 мільйонів користувачів — без їхньої явної згоди — компанії, яка використала ці дані для політичних маніпуляцій у кількох країнах. Імовірно, ці дані вплинули на результат президентських виборів у США та на референдум про Brexit у Великій Британії.\n\nЦе переламало суспільне сприйняття. До 2018 року більшість людей сприймали «дані в обмін на сервіс» як нормальну угоду. Після — стало ясно, що дані про поведінку людей — це не просто комерційний актив. Це інструмент влади над демократичними процесами. Це те, наслідки витоку чого можуть бути не просто неприємними, а політично катастрофічними.\n\nЕндрю Кін ще у 2007 році попереджав у «The Cult of the Amateur»: коли кожен може публікувати будь-що без редагування й перевірки фактів — експертиза знецінюється, а якість інформації падає. Cambridge Analytica показав, що маніпуляція інформацією в масштабі платформ Web2 може мати наслідки, яких Кін не міг передбачити.\n\n> Мережеві ефекти — це гравітація платформ. Що більша маса — то сильніше тяжіння, то важче піти. Cambridge Analytica показав: ця гравітація може затягувати не лише користувачів, а й демократичні процеси.\n\nСаме цей скандал прискорив розмову про те, що Web2 має структурні проблеми, які неможливо розв'язати регулюванням або штрафами. Потрібна інша архітектура. Архітектура, де дані належать користувачам, а не платформам. Саме на це питання почав відповідати Web3.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["Web2", "мережеві ефекти", "дані", "приватність"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "kotler", "sceneIndex": 5, "type": "media", "shortTitle": "Котлер 3.0", "era": "2010", "lensWeight": {"chronology": 2, "attention": 3, "platform": 2, "economy": 3, "manipulation": 5}, "title": "Котлер 3.0: коли маркетинг почав продавати сенси", "insight": "Котлер зафіксував: маркетинг 3.0 продає не продукт і не користь, а сенси та ідентичність. Web2 дав цьому безпрецедентні інструменти — і стер межу між розумінням та маніпуляцією.", "thesis": "Котлер зафіксував: маркетинг 3.0 продає не продукт і не користь, а сенси та ідентичність. Web2 дав цьому безпрецедентні інструменти — і стер межу між розумінням та маніпуляцією.", "body": "## Три епохи відносин бізнесу й людини\n\nФіліп Котлер — один із головних теоретиків маркетингу XX століття, автор підручників, за якими навчалися покоління менеджерів. У 2010 році він написав «Маркетинг 3.0» — і зафіксував трансформацію, що відбувалася в усіх на очах, але яку мало хто осмислював системно.\n\nКотлер описав три покоління маркетингу як три різні відповіді на питання «що ми продаємо і кому?»\n\nМаркетинг 1.0 — епоха продукту. Завод виробляє товар, реклама каже: «Купи — він якісний і потрібний». Споживач сприймається як раціональний покупець, якому потрібен функціональний продукт. Думай про продукт, не думай про людину.\n\nМаркетинг 2.0 — епоха споживача. Компанії почали вивчати психологію покупця, сегментувати аудиторії, персоналізувати пропозиції. «Ми розуміємо тебе краще, ніж конкуренти, — і тому наш продукт для тебе». Споживач сприймається як емоційна істота з потребами.\n\nМаркетинг 3.0 — епоха цінностей. В епоху Web2 виграли не ті, хто продає найкращий продукт або краще розуміє споживача. Виграли ті, хто створює сенс і належність. Споживач сприймається як цілісна особистість із цінностями, мріями та духовними потребами.\n\n## Від продукту до ідентичності\n\nПодивися на конкретні приклади — вони пояснюють краще за будь-яку теорію.\n\nApple. Функціонально iPhone не настільки кращий за конкурентів, щоб коштувати вдвічі дорожче. Але Apple не продає телефон. Вона продає ідентичність творчої, освіченої людини з добрим смаком. Купуючи iPhone, ти купуєш належність до певного племені. Саме тому фанати Apple захищають її з такою пристрастю — вони захищають свою ідентичність.\n\nNike. Кросівки Nike функціонально співставні з десятками інших брендів. Але Nike продає історію про подолання себе. Just Do It — це не інструкція з купівлі взуття. Це філософія. Купуючи Nike, ти приміряєш на себе наратив про те, що здатен на більше.\n\nStarbucks. Кава Starbucks об'єктивно коштує у п'ять-вісім разів дорожче, ніж співставний за якістю напій у середньому кафе. Але Starbucks продає «третє місце» — простір між домом і роботою, де можна побути, попрацювати, зустрітися. Ви платите не за каву, ви платите за оренду соціального простору з певним відчуттям.\n\nКотлер бачив у цьому еволюцію: бізнес нарешті почав думати про людей як про цілісних особистостей. Але в цього прогресу був зворотний бік. Межа між «зрозуміти людину глибше» і «маніпулювати людиною точніше» виявилася дуже тонкою. Якщо ти продаєш ідентичність — ти працюєш із найінтимнішим. Ти впливаєш не на рішення про купівлю, а на те, ким людина себе вважає.\n\n> Котлер назвав це прогресом. Зубофф назвала це інструментом влади. Обоє мають рацію — різниця лише в тому, з чиєї точки зору дивитися.\n\nВ епоху Web2 маркетинг 3.0 отримав безпрецедентні інструменти: дані про поведінку мільярдів людей, алгоритми персоналізації, таргетовану рекламу з точністю до психотипу. Це дало змогу продавати ідентичність із хірургічною точністю. Але хто захищає людину, чиєю ідентичністю торгують без її відома?", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["маркетинг", "ідентичність", "Web2", "психологія"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "verdict", "sceneIndex": 6, "type": "power", "shortTitle": "Підсумок Web2", "era": "≈2020", "lensWeight": {"chronology": 5, "attention": 4, "platform": 4, "economy": 3, "manipulation": 4}, "title": "Підсумок Web2: голос дали, дані забрали", "insight": "Web2 дав голос мільярдам — і взяв натомість приватність, власність на дані та спільний інформаційний простір. Це угода, умов якої ніхто не оголошував.", "thesis": "Web2 дав голос мільярдам — і взяв натомість приватність, власність на дані та спільний інформаційний простір. Це угода, умов якої ніхто не оголошував.", "body": "## Що дав Web2\n\nПерш ніж виносити вирок епосі Web2, варто чесно визнати її досягнення. Це не апологетика. Це спроба зрозуміти, чому розумні люди будували цю систему зі щирими намірами — і що пішло не так.\n\nWeb2 дав голос мільярдам людей, у яких його раніше не було. Це не метафора. Журналіст із маленького міста може викрити корупцію місцевих чиновників — і його матеріал прочитають сотні тисяч. Активіст може організувати протест, оминувши державні ЗМІ. Малий бізнес може знайти клієнтів у всьому світі без рекламного бюджету. Це реальна й величезна демократизація.\n\nWeb2 знищив дистанцію. До нього між світовими знаннями й людиною в маленькому місті стояли барʼєри: мовні, фінансові, географічні. YouTube дав безкоштовний доступ до освітнього контенту будь-якого рівня. Wikipedia створила універсальну енциклопедію будь-якою мовою. Google Translate прибрав мовний барʼєр. Це справді змінило можливості мільйонів людей.\n\nWeb2 створив нові ринки й нові професії. Контент-кріейтор, SMM-менеджер, подкастер, стример — цих професій не існувало двадцять років тому. Економіка платформ дала змогу заробляти людям, які не мають традиційного роботодавця: фрилансерам, ремісникам, митцям.\n\n## Що взяв Web2\n\nАле список того, що взяв Web2, не менш довгий.\n\nПриватність. Кожна дія в інтернеті тепер записана, проаналізована й продана. Ти не знаєш точно, що про тебе знають і кому це продають. Корпорації знають про тебе більше, ніж твої близькі.\n\nВласність на дані. Ти створюєш контент — платформа ним володіє. Ти будуєш аудиторію — платформа контролює доступ до неї. Алгоритм змінюється — і все, що ти будував роками, може випаруватися за одну ніч.\n\nСпільний інформаційний простір. Алгоритми персоналізації створили світ, де всі живуть у власних інформаційних бульбашках. Люди в одному місті можуть бачити принципово різні версії реальності — і це руйнує саму можливість суспільного діалогу.\n\nСередню якість культури. Кін попереджав про це ще у 2007-му: коли кожен може публікувати без редагування й перевірки фактів, експертиза знецінюється. Це не означає, що якісного контенту не лишилося — він є. Але знайти його в океані шуму стало значно важче.\n\nВийти з Web2 просто на словах і майже неможливо на практиці. Мережеві ефекти створили таку гравітацію, що «просто піти» з платформ означає випасти із соціального й професійного життя.\n\n> Web2 уклав із нами угоду, не оголосивши її умов. Голос — в обмін на дані. Звʼязок — в обмін на приватність. Безкоштовний сервіс — в обмін на увагу.\n\nСаме ця суперечність — між цінністю, яку Web2 створив, і ціною, яку він узяв, — породила питання, що стоїть у центрі Web3: чи можна отримати голос, звʼязок і сервіс без того, щоб хтось інший володів твоїми даними й увагою?", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/searc eight": {"chronology": 5, "attention": 3, "platform": 4, "economy": 3, "manipulation": 2}, "title": "Web2-нің тууы: интернет қалаға айналды", "insight": "Web2 интернетті кітапханадан қалаға айналдырды — әркімге дауыс берді, бірақ сол дауысты назарды монетизациялайтын машинаға кіріктірді.", "thesis": "Web2 интернетті кітапханадан қалаға айналдырды — әркімге дауыс берді, бірақ сол дауысты назарды монетизациялайтын машинаға кіріктірді.", "body": "## Конференцияда ойлап табылған термин\n\n2004 жылы техникалық әдебиет баспагері Тим О'Рейли әріптестерімен миға шабуыл өткізді. Бұл бір оғаш кезең еді: дотком көпіршігі 2000 жылы жарылды, мыңдаған компания банкрот болды, инвесторлар жүздеген миллиард доллар жоғалтты. БАҚ интернет-бизнес елес болып шықты деп жазды.\n\nБірақ О'Рейли деректерге қарап, басқа нәрсені көрді. Трафик өсіп жатты. Пайдаланушылар көбейіп жатты. Аман қалған компаниялар — Google, Amazon, eBay — жай ғана аман қалған жоқ, олар үдей түсті. Интернеттің қалай жұмыс істейтінінің табиғатында бір нәрсе өзгерді. Бұл өзгеріске атау керек болды.\n\nОсылай «Web 2.0» термині пайда болды. 2005 жылғы мақаласында О'Рейли оның белгілерін тұжырымдады: веб сайттар жиынтығы емес, платформа ретінде. Пайдаланушылар тек тұтынушы емес, құндылықты бірге жасаушылар ретінде. Деректер басты актив ретінде. Желілік әсерлер өсу қозғалтқышы ретінде — желіде адам неғұрлым көп болса, желі әр қатысушы үшін соғұрлым құнды болады.\n\nБұл техникалық манифест сияқты естілді. Шын мәнінде, бұл О'Рейли сол кезде салдарын болжай алмаған жаңа бизнес-модельдің сипаттамасы еді.\n\n## Кітапханадан қалаға\n\nWeb2-ге дейін интернет кітапхана болды. Сен кіресің, оқисың, кетесің. Сайттар сөрелердегі кітаптар сияқты бір-бірінен бөлек өмір сүрді. Сен мен ақпараттың арасында делдал болған жоқ — тек мекенжай мен браузер ғана болды.\n\nWeb2 интернетті қалаға айналдырды. Алаңдар пайда болды — Facebook, YouTube, Twitter — онда адамдар тек оқып қана қоймай, сөйлесті, дауласты, өзін көрсетті, бедел құрды. Нарықтар пайда болды — Amazon, eBay — онда адамдар бір-бірімен тікелей сатып алды және сатты. Навигаторлар пайда болды — Google іздеу — олар осы қалада қайда бару керегін көрсетті.\n\nАлғаш рет техникалық білімі жоқ қарапайым адам интернетті тек тұтынып қана қоймай, оны жасай да алды. Блог ашу — WordPress-та бес минут. Видео жүктеу — YouTube-та бір батырма. Пікір жазу, баға қою, фотосуретпен бөлісу — мұның бәрі бәріне қолжетімді болды. Web1-де оқырмандарды авторлардан бөліп тұрған техникалық тосқауыл құлады.\n\nБұл қатысудың нағыз революциясы болды. Және ол әлемді шынымен өзгертті. Блогерлер кәсіби журналистер жете алмаған жерлердегі жемқорлықты әшкереледі. Азаматтық журналистер ресми БАҚ елемеген оқиғаларды түсірді. Белсенділер әлеуметтік желілер арқылы билік әрекет етіп үлгергенше наразылықтарды ұйымдастырды. Араб көктемі. #MeToo. Мұның бәрі Web2 арқасында мүмкін болды.\n\nБірақ бұл революцияның құны болды. Оны пайдаланушы келісімінен ешкім оқыған жоқ.\n\n> Web2 әркімге дауыс берді — әрі сол дауысты әр сөзі арқылы ақша табатын машинаға кіріктірді.\n\nWeb2 парадоксы мынада: бұл адал айырбас болды — тек оның шарттарын ешкім дауыстап түсіндірмеді. Сен тегін сервис аласың. Оның орнына — сенің назарың, сенің деректерің, сенің мінез-құлқың. Мәселе айырбастың болғанында емес. Мәселе оның көрінбейтін болғанында.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "htt  "linkType": "gbooks"}], "tags": ["Web2", "платформалар", "тарих", "медиа"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "attention", "sceneIndex": 1, "type": "power", "shortTitle": "Назар", "era": "1971 · 2019", "lensWeight": {"chronology": 3, "attention": 5, "platform": 3, "economy": 3, "manipulation": 3}, "title": "Назар экономикасы: байқалмай қалған тапшылық", "insight": "Саймон назар экономикасын 1971 жылы болжады. Зубофф тіркеді: адамның мінез-құлқы шикізатқа айналды — және бұл бұрын болмаған жаңа билік түрі.", "thesis": "Саймон назар экономикасын 1971 жылы болжады. Зубофф тіркеді: адамның мінез-құлқы шикізатқа айналды — және бұл бұрын болмаған жаңа билік түрі.", "body": "## Нобель лауреаты 1971 жылы ескерткен\n\n1971 жылы экономика бойынша Нобель лауреаты Герберт Саймон жұрттың көбі байқамаған мақала жазды. Оның басты ойы қарапайым әрі берік еді: ақпарат көбейген кезде тапшы ресурс ақпарат емес, назар болады.\n\nСаймон мұны «назар экономикасы» деп атады және Facebook-тан отыз жыл бұрын тұжырымдады. Логикасы қарапайым: егер сенде миллион сайт болса, ал адамда тәулігіне небәрі жиырма төрт сағат болса — құндылық контентте емес. Құндылық адамның көзі мен құлағына қол жеткізуде. Назарды кім бақылайды, экономиканы сол бақылайды.\n\nGoogle мұны бірінші түсінді — және соның үстіне империя құрды. Іздеу жүйесі тегін болды. Бірақ сен бір нәрсе іздеген сайын, Google сен туралы жаңа нәрсе білді: сені не мазалайды, не сатып алғың келеді, түнде не туралы ойлайсың. Бұл білімді Google жарнама берушілерге сатты. Сен ақшамен төлемедің — назар мен деректеріңмен төледің.\n\nДжон Баттелль 2005 жылы «The Search» кітабын жазды — Google тарихын жаңа биліктің тарихы ретінде. Оның байқауы: іздеу жүйесі жай ғана іздеу құралы емес. Бұл адамның бүкіл ақпараттық кеңістігі өтетін инфрақұрылым. Іздеуді кім бақылайды, адамдар үшін ненің бар, ненің жоқ екенін сол шешеді. Қай сайтты табады, қайсысы көрінбей қалады. Бұл өткендегі баспагерлер мен телекомпаниялардың билігімен салыстыруға болатын билік — тек масштабы басқа.\n\n## Қадағалау капитализмі: адам шикізат ретінде\n\nШошана Зубофф интернеттегі адамдар деректерімен не болатынын зерттеуге он жыл жұмсады. 2019 жылы ол «Қадағалау капитализмі дәуірі» кітабын жариялады — және Web2 бизнес-моделін ең дәл сипаттайтын терминді енгізді.\n\nОның уәжі: Google мен Facebook шикізаттың жаңа түрін ашты. Мұнай емес, көмір емес — адамның мінез-құлқы. Әр клик, оқу кезіндегі әр кідіріс, қала ішіндегі әр маршрут, нақты бетте өткізілген әр секунд — мұның бәрі жиналады, талданады және Зубофф «мінез-құлықтық артықтар» деп атайтын нәрсеге айналады. Бұл артықтар жарнама берушілерге адамдардың болашақ әрекеттерін болжау және ықпал ету құралы ретінде сатылады.\n\nЗубофф дәстүрлі жарнамадан түбегейлі айырмашылықты атап көрсетеді. XX ғасырдың жарнамасы: «Мына өнімді сатып ал — ол жақсы» дейтін. Қадағалау капитализмі: «Сен мұны сатып алатыныңды білеміз — сен оны шешпей тұрып-ақ. Және біз бұл шешімнің ықтималдығын өзгерте аламыз» дейді. Бұл сендіру емес. Бұл адам сезбейтін орта арқылы мінез-құлықты өзгерту.\n\nНақты ауқымы: цифрлық жарнама нарығы 2023 жылға қарай жылына 600 миллиард доллардан асты. Бұл әлем елдерінің көпшілігінің ЖІӨ-сінен көп. Осы соманың бәрі — адам назары мен мінез-құлық деректерін монетизациялау.\n\n> Саймон 1971 жылы ескертті: ақпарат дәуірінің басты тапшылығы — назар. Зубофф 2019 жылы тіркеді: бұл назар планетаның басты шикізатына айналды.\n\nОсы екі байқаудың арасында — қырық сегіз жыл және медиа тарихындағы биліктің ең ірі қайта бөлінуі жатыр.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%
