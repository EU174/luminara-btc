en una ciudad", "lede": "Te dieron voz para quedarse con tu atención. Cómo Web2 convirtió la biblioteca en una máquina de monetización.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=web2", "centralIdea": "Te dieron voz para quedarse con tu atención", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Cronología", "accent": "#7dd3fc", "description": "Del nacimiento de Web2 a Cambridge Analytica: cómo la “ciudad” se volvió máquina."}, {"id": "attention", "label": "Atención", "accent": "#fbbf24", "description": "Simon y Zuboff: la conducta humana como materia prima de un nuevo tipo de poder."}, {"id": "platform", "label": "Poder de las plataformas", "accent": "#f87171", "description": "Galloway y los cuatro jinetes: capturar no mercados, sino necesidades básicas."}, {"id": "economy", "label": "Economía", "accent": "#a78bfa", "description": "Efectos de red y “el ganador se lo lleva todo”: por qué no se cambia de plataforma."}, {"id": "manipulation", "label": "Manipulación", "accent": "#34d399", "description": "Kotler 3.0 y Lanier: vender significados y borrar la frontera entre entender e influir."}], "nodes": [{"id": "city", "sceneIndex": 0, "type": "media", "shortTitle": "Ciudad", "era": "2004→", "lensWeight": {"chronology": 5, "attention": 3, "platform": 4, "economy": 3, "manipulation": 2}, "title": "El nacimiento de Web2: internet se convirtió en una ciudad", "insight": "Web2 convirtió internet de una biblioteca en una ciudad: le dio voz a todo el mundo, pero integró esa voz en una máquina para monetizar la atención.", "thesis": "Web2 convirtió internet de una biblioteca en una ciudad: le dio voz a todo el mundo, pero integró esa voz en una máquina para monetizar la atención.", "body": "## Un término acuñado en una conferencia\n\nEn 2004, el editor de libros técnicos Tim O'Reilly estaba haciendo una lluvia de ideas con colegas. Era un momento extraño: la burbuja puntocom había estallado en 2000, miles de empresas habían quebrado y los inversores habían perdido cientos de miles de millones de dólares. Los medios escribían que el negocio de internet había resultado ser una ilusión.\n\nPero O'Reilly miró los datos y vio otra cosa. El tráfico crecía. El número de usuarios aumentaba. Las empresas que sobrevivieron —Google, Amazon, eBay— no solo sobrevivieron; aceleraron. Algo había cambiado en la propia naturaleza de cómo funcionaba internet. Ese cambio necesitaba un nombre.\n\nAsí apareció el término «Web 2.0». En un artículo de 2005, O'Reilly describió sus rasgos: la web como plataforma, no como una colección de sitios. Los usuarios como co-creadores de valor, no solo como consumidores. Los datos como el principal activo. Los efectos de red como motor del crecimiento: cuanto más gente hay en la red, más valiosa se vuelve para cada participante.\n\nSonaba como un manifiesto técnico. En realidad, era la descripción de un nuevo modelo de negocio cuyas consecuencias O'Reilly no previó en ese momento.\n\n## De biblioteca a ciudad\n\nAntes de Web2, internet era una biblioteca. Entrabas, leías y te ibas. Los sitios existían por separado, como libros en estantes. Entre tú y la información no había intermediario: solo una dirección y un navegador.\n\nWeb2 convirtió internet en una ciudad. Aparecieron plazas —Facebook, YouTube, Twitter— donde la gente no solo leía, sino que hablaba, discutía, se mostraba y construía reputación. Aparecieron mercados —Amazon, eBay— donde la gente compraba y vendía directamente entre sí. Aparecieron navegadores —Google Search— que mostraban a dónde ir en esa ciudad.\n\nPor primera vez, una persona común sin conocimientos técnicos no solo podía consumir internet, sino también crearlo. Abrir un blog tomaba cinco minutos en WordPress. Subir un video era un solo botón en YouTube. Escribir una reseña, poner una calificación, compartir una foto: todo eso quedó al alcance de cualquiera. La barrera técnica que en Web1 separaba a los lectores de los autores se vino abajo.\n\nFue una verdadera revolución de la participación. Y realmente cambió el mundo. Los blogueros expusieron corrupción en lugares a los que los periodistas profesionales no podían llegar. Los periodistas ciudadanos filmaron eventos que los medios oficiales ignoraban. Los activistas organizaron protestas a través de las redes sociales más rápido de lo que las autoridades podían reaccionar. La Primavera Árabe. #MeToo. Todo eso fue posible gracias a Web2.\n\nPero esa revolución tuvo un precio. Y nadie lo leyó en el acuerdo de usuario.\n\n> Web2 le dio voz a todos — y metió esa voz en una máquina que ganaba dinero con cada palabra que decía.\n\nLa paradoja de Web2 es que fue un intercambio honesto, solo que nadie explicó sus condiciones en voz alta. Recibes un servicio gratis. A cambio: tu atención, tus datos, tu comportamiento. El problema no era que el intercambio existiera. El problema era que era invisible.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["Web2", "plataformas", "historia", "medios"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "attention", "sceneIndex": 1, "type": "power", "shortTitle": "Atención", "era": "1971 · 2019", "lensWeight": {"chronology": 3, "attention": 5, "platform": 3, "economy": 3, "manipulation": 3}, "title": "La economía de la atención: la escasez que nadie notó", "insight": "Simon predijo la economía de la atención en 1971. Zuboff dejó constancia de que el comportamiento humano se convirtió en materia prima, y ese es un nuevo tipo de poder que antes no existía.", "thesis": "Simon predijo la economía de la atención en 1971. Zuboff dejó constancia de que el comportamiento humano se convirtió en materia prima, y ese es un nuevo tipo de poder que antes no existía.", "body": "## Un premio Nobel lo advirtió en 1971\n\nEn 1971, Herbert Simon, premio Nobel de Economía, escribió un artículo que casi nadie notó. Su idea central era simple e inflexible: cuando la información se vuelve abundante, el recurso escaso no es la información, sino la atención.\n\nSimon llamó a esto la “economía de la atención” y lo formuló treinta años antes de Facebook. La lógica es elemental: si tienes un millón de sitios y una persona solo tiene veinticuatro horas al día, el valor no está en el contenido. El valor está en el acceso a los ojos y los oídos de una persona. Quien controla la atención controla la economía.\n\nGoogle lo entendió primero y construyó un imperio sobre eso. El buscador era gratis. Pero cada vez que buscabas algo, Google aprendía algo nuevo sobre ti: qué te preocupa, qué quieres comprar, en qué piensas por la noche. Google vendía ese conocimiento a los anunciantes. No pagabas con dinero: pagabas con atención y datos.\n\nEn 2005, John Battelle escribió el libro “The Search”, la historia de Google como la historia de un nuevo poder. Su observación: un buscador no es solo una herramienta para encontrar cosas. Es la infraestructura por la que pasa todo el espacio informativo de una persona. Quien controla la búsqueda decide qué existe para la gente y qué no. Qué sitio encontrarán y cuál permanecerá invisible. Es un poder comparable al de los editores y las televisoras del pasado, solo que a otra escala.\n\n## Capitalismo de vigilancia: el ser humano como materia prima\n\nShoshana Zuboff dedicó diez años a investigar qué ocurre con los datos de las personas en internet. En 2019 publicó el libro “La era del capitalismo de vigilancia” e introdujo el término que describe con más precisión el modelo de negocio de Web2.\n\nSu argumento: Google y Facebook descubrieron un nuevo tipo de materia prima. No petróleo, no carbón: comportamiento humano. Cada clic, cada pausa al leer, cada recorrido por la ciudad, cada segundo pasado en una página concreta, todo eso se recopila, se analiza y se convierte en lo que Zuboff llama “excedente conductual”. Ese excedente se vende a los anunciantes como una herramienta para predecir e influir en las acciones futuras de las personas.\n\nZuboff subraya la diferencia fundamental con la publicidad tradicional. La publicidad del siglo XX decía: “Compra este producto, es bueno”. El capitalismo de vigilancia dice: “Sabemos que vas a comprar esto, antes de que siquiera lo hayas decidido. Y podemos cambiar la probabilidad de esa decisión”. Eso no es persuasión. Es modificación de la conducta a través de un entorno que la persona no sospecha.\n\nLa escala concreta: para 2023, el mercado de la publicidad digital había superado los 600 mil millones de dólares al año. Es más que el PIB de la mayoría de los países del mundo. Toda esa suma es la monetización de la atención humana y de los datos conductuales.\n\n> Simon advirtió en 1971: la principal escasez de la era de la información es la atención. Zuboff dejó constancia en 2019: esa atención se convirtió en la principal materia prima del planeta.\n\nEntre esas dos observaciones hay cuarenta y ocho años y la mayor redistribución de poder en la historia de los medios.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["atención", "capitalismo de vigilancia", "Web2", "poder"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "lanier", "sceneIndex": 2, "type": "privacy", "shortTitle": "Lanier", "era": "2010", "lensWeight": {"chronology": 3, "attention": 4, "platform": 3, "economy": 4, "manipulation": 4}, "title": "Lanier: no eres un gadget, eres el producto", "insight": "Lanier mostró que Web2 destruyó la clase media creativa al crear una estructura de “el ganador se lo lleva todo”: unas pocas superestrellas y millones de creadores trabajando gratis para las plataformas.", "thesis": "Lanier mostró que Web2 destruyó la clase media creativa al crear una estructura de “el ganador se lo lleva todo”: unas pocas superestrellas y millones de creadores trabajando gratis para las plataformas.", "body": "## Una voz desde dentro de la industria\n\nJaron Lanier es un crítico poco común de las plataformas. No es periodista ni un académico externo. Es uno de los pioneros de la realidad virtual, una persona que en los años 80 trabajó en el centro mismo de la revolución tecnológica, en Silicon Valley, codo a codo con quienes construían esta industria. Precisamente por eso su crítica es tan convincente: conoce el sistema desde adentro.\n\nEn 2010 escribió el libro “You Are Not a Gadget”, un manifiesto de decepción. La tesis principal: las plataformas Web2 se construyen sobre una mentira fundamental. Dicen que te dan un servicio gratis. En realidad, te quitan algo valioso: tu creatividad, tus datos, tu tiempo, tu individualidad, y monetizan todo eso sin compartir contigo nada sustancial.\n\nLanier ofrece ejemplos concretos que son difíciles de ignorar. Un músico graba una canción, la sube a YouTube y recibe unos centavos por cada mil escuchas. YouTube gana mucho más con la publicidad alrededor de esa canción. Un periodista escribe un artículo que se comparte en Facebook cien mil veces y no recibe nada. Facebook gana dinero con el tráfico que genera ese artículo. Un fotógrafo toma imágenes que Instagram usa para entrenar algoritmos de reconocimiento de imágenes, sin permiso y sin pago.\n\n## La desaparición de la clase media creativa\n\nLanier describió una consecuencia económica que pocos veían en 2010, pero que se volvió evidente para los años 2020: Web2 destruyó la clase media creativa.\n\nAntes, entre la fama y el anonimato total, existía un espacio completo: músicos profesionales que vivían de los conciertos y la venta de álbumes. Periodistas que mantenían a sus familias con artículos para periódicos locales. Fotógrafos que vendían imágenes a agencias. Escritores que vivían de regalías por tirajes medianos. Esa era la clase media de la cultura.\n\nWeb2 hizo colapsar ese espacio. Los algoritmos crearon una estructura de “el ganador se lo lleva todo”: unas cuantas superestrellas reúnen millones de seguidores y ganan muchísimo dinero. Todos los demás trabajan gratis, creando contenido para plataformas que ganan con ese contenido.\n\nEn 2011, Marc Andreessen escribió la columna triunfal “Software Is Eating the World”: el software está devorando cada industria, y eso es inevitable y bueno. Los taxis se convierten en Uber. Los hoteles en Airbnb. Los medios en Netflix. La música en Spotify. La lógica de la plataforma es la misma en todas partes: elimina intermediarios, conecta directamente al vendedor con el comprador y cobra una comisión por cada transacción. No hacen falta fábricas. El margen es enorme.\n\nAndreessen tenía razón al describir lo que estaba ocurriendo. Pero omitió el precio: junto con los intermediarios desaparecía la infraestructura que sostenía a miles de profesionales. Las compañías de taxis eran ineficientes, pero allí trabajaba gente. Las tiendas de música eran incómodas, pero pagaban regalías a los músicos.\n\n> Lanier lo formuló con precisión: un servicio gratis no es un regalo. Es un acuerdo cuyos términos nunca te explicaron. Pagas con creatividad, datos y tiempo.\n\nEsta lógica importa para entender Web3. Una de las ideas centrales de internet descentralizado es devolver a los creadores lo que las plataformas Web2 les quitaron. Tokens, contratos inteligentes y pagos directos son herramientas técnicas para resolver el problema que Lanier describió ya en 2010.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["creadores", "Web2", "economía", "atención"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "galloway", "sceneIndex": 3, "type": "power", "shortTitle": "Cuatro jinetes", "era": "2017", "lensWeight": {"chronology": 3, "attention": 3, "platform": 5, "economy": 4, "manipulation": 3}, "title": "Galloway y los cuatro jinetes: la psicología de la captura", "insight": "Galloway explicó: Amazon, Apple, Facebook, Google no capturaron mercados, sino necesidades humanas básicas: sobrevivir, estatus, pertenencia y conocimiento.", "thesis": "Galloway explicó: Amazon, Apple, Facebook, Google no capturaron mercados, sino necesidades humanas básicas: sobrevivir, estatus, pertenencia y conocimiento.", "body": "## Por qué justamente estos cuatro\n\nA mediados de la década de 2010, ya era evidente que varias empresas tecnológicas habían capturado una parte desproporcionadamente grande de la economía mundial. Amazon, Apple, Facebook, Google: juntas representaban más capitalización bursátil que la mayoría de las economías nacionales. ¿Por qué ellas? ¿Y por qué tan rápido?\n\nEn *The Four*, Scott Galloway ofreció una respuesta que llama la atención precisamente porque no es tecnológica. No habla de mejores algoritmos ni de un mayor presupuesto de desarrollo. Habla de psicología. Cada una de las cuatro empresas capturó una necesidad humana básica y se convirtió en su proveedor sin una alternativa real.\n\nAmazon capturó la necesidad de sobrevivir y acumular. Es el instinto más antiguo: tener reservas, recibir productos rápida y confiablemente. Amazon Prime promete: todo lo que necesitas llegará mañana. Esto no es solo comodidad de entrega; es una sensación de seguridad. No te quedarás sin lo que necesitas.\n\nApple capturó la necesidad de estatus y atractivo sexual. El iPhone no es un teléfono. Es una señal para los demás: pertenezco a cierta clase, tengo buen gusto, me cuido. Por eso la gente compra un iPhone nuevo incluso cuando el anterior funciona perfectamente. No por las funciones, sino por la señal.\n\nFacebook capturó la necesidad de amor y pertenencia. El deseo humano más profundo es formar parte de un grupo, ser aceptado, ser amado. Un like en Facebook es aprobación social empaquetada en una interfaz. La palabra \"amigos\" no es casual. La plataforma explota el lugar más vulnerable de la psique humana.\n\nGoogle capturó la necesidad de conocimiento y de Dios: una fuente de respuestas para cualquier pregunta. \"Búscalo en Google\" se volvió sinónimo de \"descubre la verdad\". Google conoce la respuesta a cualquier pregunta, desde una receta de borsch hasta el sentido de la vida. Es un poder sin precedentes: ser la fuente de verdad para miles de millones de personas.\n\n## El marketing encontró un nuevo lenguaje\n\nPhilip Kotler describió la evolución del marketing a través de tres eras. El marketing 1.0 es el producto: la fábrica produce, la publicidad vende. El marketing 2.0 es el consumidor: estudiar la psicología, segmentar la audiencia, personalizar la oferta. El marketing 3.0 son los valores: en la era Web2 ganan quienes no venden un producto ni una utilidad, sino significado e identidad.\n\nApple no vende teléfonos; vende la identidad de una persona creativa. Nike no vende zapatillas; vende una historia sobre superarte a ti mismo. Starbucks no vende café; vende el \"tercer lugar\", el espacio entre la casa y el trabajo. Por eso Starbucks puede cobrar cinco euros por una bebida que se puede hacer en casa por cincuenta centavos.\n\nKotler veía esto como progreso: por fin los negocios empezaban a tratar a las personas como individuos completos. Pero la frontera entre \"entender a una persona más a fondo\" y \"manipular a una persona con más precisión\" resultó ser muy delgada. Cuando no vendes un producto, sino una identidad, trabajas con lo más íntimo: con quién cree una persona que es.\n\n> Galloway mostró que las cuatro plataformas no capturaron mercados, sino necesidades humanas básicas. Eso las vuelve casi irremplazables.\n\nEso explica exactamente por qué los efectos de red son tan poderosos en su caso. Salir de Facebook significa perder la conexión con los amigos. Dejar de usar Google significa perder una fuente habitual de respuestas. No es solo una molestia. Es un costo social y psicológico.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["Web2", "plataformas", "psicología", "poder"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "network", "sceneIndex": 4, "type": "economy", "shortTitle": "Efectos de red", "era": "2018", "lensWeight": {"chronology": 4, "attention": 2, "platform": 5, "economy": 5, "manipulation": 2}, "title": "Efectos de red: por qué al ganador no se le puede reemplazar", "insight": "Los efectos de red hacen que las plataformas sean casi imbatibles. Cambridge Analytica mostró el límite: cuando los datos de los usuarios se convierten en una herramienta para influir en las elecciones, se trata de un problema de arquitectura, no regulatorio.", "thesis": "Los efectos de red hacen que las plataformas sean casi imbatibles. Cambridge Analytica mostró el límite: cuando los datos de los usuarios se convierten en una herramienta para influir en las elecciones, se trata de un problema de arquitectura, no regulatorio.", "body": "## La gravedad de las plataformas\n\nLas plataformas tienen una propiedad que hace casi imposible competir con ellas. Se llama \"efecto de red\" y probablemente sea el concepto económico más importante para entender la era digital.\n\nEfecto de red: el valor de una red para cada usuario crece a medida que nuevos usuarios se suman a la red. El primer teléfono del mundo era completamente inútil: no había a quién llamar. El segundo teléfono creó una conexión. Mil teléfonos crearon casi medio millón de posibles conexiones. Un millón de teléfonos creó alrededor de quinientos mil millones. El valor no crece de forma lineal, sino exponencial.\n\nPara Facebook, esto significa lo siguiente: la plataforma vale precisamente porque allí están todos tus amigos. Si se suma una persona más de tu círculo, Facebook se vuelve un poco más valioso para ti. Si todos tus amigos se van, Facebook se volverá inútil, por más dinero que se invierta en él.\n\nEsto crea un bucle de retroalimentación. La primera plataforma que alcanza masa crítica se vuelve casi imbatible. Un competidor no puede simplemente crear un mejor producto: tiene que convencer a todos tus amigos de cambiar al mismo tiempo. Y para eso, tiene que convencer a sus amigos. Y para eso, a sus amigos. Es casi imposible.\n\n## Cambridge Analytica y el límite de la paciencia\n\nPara la década de 2010, se volvió evidente: los datos sobre el comportamiento de las personas valen muchísimo dinero. Tanto, que las empresas estaban dispuestas a ofrecer cualquier servicio gratis con tal de obtener acceso a los datos. Pero surgió una pregunta a la que Web2 nunca dio respuesta: ¿a quién pertenecen esos datos?\n\nEn 2018 estalló el escándalo de Cambridge Analytica. Facebook vendió los datos de 87 millones de usuarios, sin su consentimiento explícito, a una empresa que los usó para la manipulación política en varios países. Supuestamente, esos datos influyeron en el resultado de la elección presidencial de Estados Unidos y en el referéndum del Brexit en el Reino Unido.\n\nEso cambió la percepción pública. Hasta 2018, la mayoría veía \"datos a cambio de servicio\" como un trato normal. Después, quedó claro que los datos sobre el comportamiento de las personas no son solo un activo comercial. Son un instrumento de poder sobre los procesos democráticos. Son algo cuya filtración puede tener consecuencias no solo molestas, sino políticamente catastróficas.\n\nAndrew Keen ya había advertido en 2007 en *The Cult of the Amateur*: cuando cualquiera puede publicar lo que quiera sin edición ni verificación de hechos, la experiencia se devalúa y la calidad de la información cae. Cambridge Analytica mostró que la manipulación de la información a la escala de las plataformas Web2 puede tener consecuencias que Keen no podía prever.\n\n> Los efectos de red son la gravedad de las plataformas. Cuanta más masa, mayor la atracción y más difícil es irse. Cambridge Analytica mostró que esa gravedad puede arrastrar no solo a los usuarios, sino también a los procesos democráticos.\n\nEse escándalo aceleró la conversación sobre que Web2 tiene problemas estructurales que no se pueden resolver con regulación ni multas. Se necesita otra arquitectura. Una arquitectura donde los datos pertenezcan a los usuarios, no a las plataformas. Precisamente a esa pregunta empezó a responder Web3.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["Web2", "efectos de red", "datos", "privacidad"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "kotler", "sceneIndex": 5, "type": "media", "shortTitle": "Kotler 3.0", "era": "2010", "lensWeight": {"chronology": 2, "attention": 3, "platform": 2, "economy": 3, "manipulation": 5}, "title": "Kotler 3.0: cuando el marketing empezó a vender significados", "insight": "Kotler dejó claro esto: el marketing 3.0 no vende un producto ni una utilidad, sino significados e identidad. Web2 le dio herramientas sin precedentes y borró la frontera entre comprender y manipular.", "thesis": "Kotler dejó claro esto: el marketing 3.0 no vende un producto ni una utilidad, sino significados e identidad. Web2 le dio herramientas sin precedentes y borró la frontera entre comprender y manipular.", "body": "## Tres eras de la relación entre los negocios y la persona\n\nPhilip Kotler es uno de los principales teóricos del marketing del siglo XX, autor de libros de texto con los que aprendieron generaciones de gerentes. En 2010 escribió *Marketing 3.0* y registró una transformación que estaba ocurriendo ante los ojos de todos, pero que pocos entendían de forma sistemática.\n\nKotler describió tres generaciones de marketing como tres respuestas distintas a la pregunta \"¿qué vendemos y a quién?\"\n\nMarketing 1.0 es la era del producto. La fábrica produce el bien, la publicidad dice: \"Cómpralo: es de calidad y necesario\". El consumidor se percibe como un comprador racional que necesita un producto funcional. Piensa en el producto, no pienses en la persona.\n\nMarketing 2.0 es la era del consumidor. Las empresas empezaron a estudiar la psicología del comprador, segmentar audiencias y personalizar ofertas. \"Te entendemos mejor que la competencia y por eso nuestro producto es para ti\". El consumidor se percibe como un ser emocional con necesidades.\n\nMarketing 3.0 es la era de los valores. En la era de Web2 no ganaron quienes vendían el mejor producto o entendían mejor al consumidor. Ganaron quienes creaban sentido y pertenencia. El consumidor se percibe como una persona integral con valores, sueños y necesidades espirituales.\n\n## Del producto a la identidad\n\nMira ejemplos concretos: explican mejor que cualquier teoría.\n\nApple. En términos funcionales, el iPhone no es tan superior a sus competidores como para costar el doble. Pero Apple no vende un teléfono. Vende la identidad de una persona creativa, educada y con buen gusto. Cuando compras un iPhone, compras pertenecer a una tribu determinada. Por eso mismo los fans de Apple lo defienden con tanta pasión: están defendiendo su identidad.\n\nNike. Los tenis Nike son funcionalmente comparables con decenas de otras marcas. Pero Nike vende una historia sobre superarte a ti mismo. Just Do It no es una instrucción para comprar zapatos. Es una filosofía. Cuando compras Nike, te pruebas una narrativa de que eres capaz de más.\n\nStarbucks. El café de Starbucks cuesta objetivamente cinco a ocho veces más que una bebida de calidad similar en un café promedio. Pero Starbucks vende el \"tercer lugar\": el espacio entre la casa y el trabajo donde puedes estar, trabajar o encontrarte con alguien. No pagas por el café; pagas por alquilar un espacio social con una sensación particular.\n\nKotler vio en esto una evolución: por fin las empresas empezaron a pensar en las personas como seres integrales. Pero este progreso tuvo un reverso. La frontera entre \"entender mejor a una persona\" y \"manipularla con más precisión\" resultó ser muy delgada. Si vendes identidad, trabajas con lo más íntimo. Influyes no en la decisión de compra, sino en quién cree la persona que es.\n\n> Kotler llamó a esto progreso. Zuboff lo llamó un instrumento de poder. Ambas tienen razón; la diferencia está solo en el punto de vista desde el que se mire.\n\nEn la era de Web2, Marketing 3.0 recibió herramientas sin precedentes: datos sobre el comportamiento de miles de millones de personas, algoritmos de personalización, publicidad segmentada con precisión hasta el psicotipo. Eso permitió vender identidad con precisión quirúrgica. Pero ¿quién protege a la persona cuya identidad se comercia sin que lo sepa?", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["marketing", "identidad", "Web2", "psicología"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "verdict", "sceneIndex": 6, "type": "power", "shortTitle": "Balance de Web2", "era": "≈2020", "lensWeight": {"chronology": 5, "attention": 4, "platform": 4, "economy": 3, "manipulation": 4}, "title": "El resultado de Web2: nos dieron voz, nos quitaron los datos", "insight": "Web2 les dio voz a miles de millones, y a cambio tomó la privacidad, la propiedad de los datos y un espacio informativo compartido. Fue un trato cuyas condiciones nadie anunció.", "thesis": "Web2 les dio voz a miles de millones, y a cambio tomó la privacidad, la propiedad de los datos y un espacio informativo compartido. Fue un trato cuyas condiciones nadie anunció.", "body": "## Lo que Web2 dio\n\nAntes de dictar sentencia sobre la era Web2, conviene reconocer con honestidad sus logros. No es una apología. Es un intento de entender por qué personas inteligentes construyeron este sistema con intenciones sinceras y qué salió mal.\n\nWeb2 les dio voz a miles de millones de personas que antes no la tenían. No es una metáfora. Un periodista de una ciudad pequeña puede destapar la corrupción de autoridades locales, y cientos de miles leerán su nota. Un activista puede organizar una protesta sin pasar por los medios estatales. Un pequeño negocio puede encontrar clientes en todo el mundo sin presupuesto publicitario. Eso es una democratización real y enorme.\n\nWeb2 eliminó la distancia. Antes de eso, entre el conocimiento del mundo y una persona en una ciudad pequeña había barreras lingüísticas, financieras y geográficas. YouTube dio acceso gratuito a contenido educativo de cualquier nivel. Wikipedia creó una enciclopedia universal en cualquier idioma. Google Translate eliminó la barrera del idioma. Eso cambió de verdad las posibilidades de millones de personas.\n\nWeb2 creó nuevos mercados y nuevas profesiones. Creador de contenido, gerente de SMM, podcaster, streamer: esas profesiones no existían hace veinte años. La economía de las plataformas permitió ganar dinero a personas sin empleador tradicional: freelancers, artesanos, artistas.\n\n## Lo que Web2 tomó\n\nPero la lista de lo que tomó Web2 no es menos larga.\n\nPrivacidad. Cada acción en internet ahora queda registrada, analizada y vendida. No sabes con certeza qué saben de ti ni a quién se lo venden. Las corporaciones saben más de ti que tus propios seres cercanos.\n\nPropiedad de los datos. Tú creas contenido y la plataforma lo posee. Tú construyes una audiencia y la plataforma controla el acceso a ella. El algoritmo cambia, y todo lo que construiste durante años puede evaporarse de un día para otro.\n\nUn espacio informativo compartido. Los algoritmos de personalización crearon un mundo en el que todos viven dentro de sus propias burbujas informativas. Personas en una misma ciudad pueden ver versiones radicalmente distintas de la realidad, y eso destruye la posibilidad misma del diálogo público.\n\nLa calidad media de la cultura. Keen ya advertía esto en 2007: cuando cualquiera puede publicar sin edición ni verificación de hechos, la experiencia pierde valor. Eso no significa que ya no exista contenido de calidad; sí existe. Pero encontrarlo en un océano de ruido se volvió mucho más difícil.\n\nSalir de Web2 es simple en palabras y casi imposible en la práctica. Los efectos de red crearon una gravedad tal que «simplemente irse» de las plataformas significa quedar fuera de la vida social y profesional.\n\n> Web2 nos hizo un trato sin anunciar sus condiciones. Voz a cambio de datos. Conexión a cambio de privacidad. Servicio gratis a cambio de atención.\n\nEsa contradicción misma —entre el valor que Web2 creó y el precio que cobró— dio origen a la pregunta que está en el centro de Web3: ¿se puede obtener voz, conexión y servicio sin que otra persona posea tus datos y tu atención?", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["Web2", "datos", "privacidad", "plataformas"], "x": 265.5, "y": 258.0, "angDeg": 218.6}], "edges": [{"from": "city", "to": "attention", "label": "la voz se volvió materia prima", "lenses": ["chronology", "attention"]}, {"from": "attention", "to": "lanier", "label": "tú eres el producto", "lenses": ["attention", "manipulation"]}, {"from": "attention", "to": "galloway", "label": "la atención es una palanca de poder", "lenses": ["attention", "platform"]}, {"from": "galloway", "to": "network", "label": "la captura se consolida mediante efectos", "lenses": ["platform", "economy"]}, {"from": "network", "to": "verdict", "label": "al ganador no se lo puede reemplazar", "lenses": ["economy", "platform"]}, {"from": "lanier", "to": "kotler", "label": "del producto a los significados", "lenses": ["manipulation"]}, {"from": "kotler", "to": "verdict", "label": "la manipulación como norma", "lenses": ["manipulation", "media"]}, {"from": "city", "to": "galloway", "label": "cuatro capturaron la ciudad", "lenses": ["platform", "chronology"]}, {"from": "attention", "to": "verdict", "label": "un trato sin condiciones declaradas", "lenses": ["attention", "chronology"]}, {"from": "network", "to": "kotler", "label": "la escala amplifica la influencia", "lenses": ["economy", "manipulation"]}]}, "fr": {"chapter": {"key": "web2", "title": "Internet est devenu une ville", "lede": "On t’a donné une voix pour capter ton attention. Comment Web2 a transformé la bibliothèque en machine à monétiser.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=web2", "centralIdea": "On t’a donné une voix pour capter ton attention", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Chronologie", "accent": "#7dd3fc", "description": "De la naissance de Web2 à Cambridge Analytica : comment la « ville » est devenue une machine."}, {"id": "attention", "label": "Attention", "accent": "#fbbf24", "description": "Simon et Zuboff : le comportement humain comme matière première d’un nouveau type de pouvoir."}, {"id": "platform", "label": "Pouvoir des plateformes", "accent": "#f87171", "description": "Galloway et les quatre cavaliers : capter non pas des marchés, mais des besoins fondamentaux."}, {"id": "economy", "label": "Économie", "accent": "#a78bfa", "description": "Effets de réseau et « le gagnant rafle tout » : pourquoi on ne remplace pas une plateforme."}, {"id": "manipulation", "label": "Manipulation", "accent": "#34d399", "description": "Kotler 3.0 et Lanier : vendre des significations, effacer la frontière entre comprendre et influencer."}], "nodes": [{"id": "city", "sceneIndex": 0, "type": "media", "shortTitle": "Ville", "era": "2004→", "lensWeight": {"chronology": 5, "attention": 3, "platform": 4, "economy": 3, "manipulation": 2}, "title": "La naissance du Web2 : l'internet est devenu une ville", "insight": "Web2 a transformé l'internet d'une bibliothèque en ville : il a donné une voix à chacun, mais a intégré cette voix dans une machine qui monétise l'attention.", "thesis": "Web2 a transformé l'internet d'une bibliothèque en ville : il a donné une voix à chacun, mais a intégré cette voix dans une machine qui monétise l'attention.", "body": "## Un terme inventé lors d'une conférence\n\nEn 2004, l'éditeur de livres techniques Tim O'Reilly animait une séance de remue-méninges avec des collègues. Le moment était étrange : la bulle des dot-coms avait éclaté en 2000, des milliers d'entreprises avaient fait faillite et les investisseurs avaient perdu des centaines de milliards de dollars. Les médias écrivaient que les affaires sur internet n'étaient qu'une illusion.\n\nMais O'Reilly regardait les données et voyait autre chose. Le trafic augmentait. Le nombre d'utilisateurs progressait. Les entreprises qui avaient survécu — Google, Amazon, eBay — ne s'étaient pas seulement maintenues ; elles avaient accéléré. Quelque chose avait changé dans la nature même du fonctionnement de l'internet. Il fallait nommer ce changement.\n\nC'est ainsi qu'est apparu le terme « Web 2.0 ». Dans un article de 2005, O'Reilly en a formulé les caractéristiques : le web comme plateforme, et non comme simple collection de sites. Les utilisateurs comme co-créateurs de valeur, et pas seulement comme consommateurs. Les données comme principal actif. Les effets de réseau comme moteur de croissance : plus il y a de monde dans le réseau, plus le réseau devient précieux pour chaque participant.\n\nCela ressemblait à un manifeste technique. En réalité, il s'agissait de la description d'un nouveau modèle économique dont O'Reilly n'avait pas encore perçu les conséquences.\n\n## De la bibliothèque à la ville\n\nAvant Web2, l'internet était une bibliothèque. On y entrait, on lisait, puis on repartait. Les sites existaient séparément les uns des autres, comme des livres sur des étagères. Entre vous et l'information, il n'y avait pas d'intermédiaire — seulement une adresse et un navigateur.\n\nWeb2 a transformé l'internet en ville. Des places sont apparues — Facebook, YouTube, Twitter — où les gens ne faisaient pas que lire, mais parlaient, débattaient, se montraient, construisaient leur réputation. Des marchés sont apparus — Amazon, eBay — où l'on achetait et vendait directement entre soi. Des outils de navigation sont apparus — la recherche Google — pour montrer où aller dans cette ville.\n\nPour la première fois, une personne ordinaire sans connaissances techniques pouvait non seulement consommer l'internet, mais aussi le créer. Ouvrir un blog prenait cinq minutes sur WordPress. Mettre en ligne une vidéo demandait un seul bouton sur YouTube. Rédiger un avis, attribuer une note, partager une photo : tout cela est devenu accessible à tous. La barrière technique qui, dans Web1, séparait les lecteurs des auteurs, s'est effondrée.\n\nC'était une véritable révolution de la participation. Et elle a réellement changé le monde. Les blogueurs ont révélé des cas de corruption là où les journalistes professionnels ne pouvaient pas aller. Les journalistes citoyens ont filmé des événements ignorés par les médias officiels. Les militants ont organisé des manifestations via les réseaux sociaux plus vite que les autorités ne pouvaient réagir. Le Printemps arabe. #MeToo. Tout cela est devenu possible grâce à Web2.\n\nMais cette révolution avait un prix. Et personne ne l'a lu dans les conditions d'utilisation.\n\n> Web2 a donné une voix à chacun — et a intégré cette voix dans une machine qui gagnait de l'argent grâce à chacun de ses mots.\n\nLe paradoxe de Web2, c'est que c'était un échange honnête — simplement, personne n'en expliquait les conditions à voix haute. Vous obtenez un service gratuit. En échange : votre attention, vos données, votre comportement. Le problème n'était pas que l'échange existait. Le problème était qu'il était invisible.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["Web2", "plateformes", "histoire", "médias"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "attention", "sceneIndex": 1, "type": "power", "shortTitle": "Attention", "era": "1971 · 2019", "lensWeight": {"chronology": 3, "attention": 5, "platform": 3, "economy": 3, "manipulation": 3}, "title": "L'économie de l'attention : la rareté que personne n'a remarquée", "insight": "Simon avait prédit l'économie de l'attention en 1971. Zuboff a constaté que le comportement humain était devenu une matière première, et c'est un nouveau type de pouvoir qui n'existait pas auparavant.", "thesis": "Simon avait prédit l'économie de l'attention en 1971. Zuboff a constaté que le comportement humain était devenu une matière première, et c'est un nouveau type de pouvoir qui n'existait pas auparavant.", "body": "## Un lauréat du Nobel l'avait annoncé en 1971\n\nEn 1971, Herbert Simon, lauréat du prix Nobel d'économie, a écrit un article que presque personne n'a remarqué. Son idée principale était simple et implacable : lorsque l'information devient abondante, la ressource rare n'est plus l'information, mais l'attention.\n\nSimon a appelé cela « l'économie de l'attention » et l'a formulé trente ans avant Facebook. La logique est élémentaire : si vous avez un million de sites et qu'une personne ne dispose que de vingt-quatre heures par jour, la valeur ne se trouve pas dans le contenu. La valeur se trouve dans l'accès aux yeux et aux oreilles d'une personne. Celui qui contrôle l'attention contrôle l'économie.\n\nGoogle l'a compris en premier et a bâti un empire là-dessus. Le moteur de recherche était gratuit. Mais chaque fois que vous cherchiez quelque chose, Google apprenait quelque chose de nouveau sur vous : ce qui vous préoccupe, ce que vous voulez acheter, ce à quoi vous pensez la nuit. Google vendait ces informations aux annonceurs. Vous ne payiez pas avec de l'argent, vous payiez avec votre attention et vos données.\n\nEn 2005, John Battelle a écrit le livre “The Search”, l'histoire de Google comme l'histoire d'un nouveau pouvoir. Son observation : un moteur de recherche n'est pas seulement un outil pour trouver des choses. C'est l'infrastructure par laquelle passe tout l'espace informationnel d'une personne. Celui qui contrôle la recherche décide de ce qui existe pour les gens et de ce qui n'existe pas. Quel site ils trouveront, et lequel restera invisible. C'est un pouvoir comparable à celui des éditeurs et des chaînes de télévision d'autrefois, mais à une autre échelle.\n\n## Capitalisme de surveillance : l'être humain comme matière première\n\nShoshana Zuboff a consacré dix ans à étudier ce qui arrive aux données des personnes sur internet. En 2019, elle a publié le livre “L'âge du capitalisme de surveillance” et a introduit le terme qui décrit le plus précisément le modèle économique de Web2.\n\nSon argument : Google et Facebook ont découvert un nouveau type de matière première. Pas du pétrole, pas du charbon, mais le comportement humain. Chaque clic, chaque pause pendant la lecture, chaque trajet dans la ville, chaque seconde passée sur une page précise, tout cela est collecté, analysé et transformé en ce que Zuboff appelle des « surplus comportementaux ». Ces surplus sont vendus aux annonceurs comme un outil pour prédire et influencer les actions futures des personnes.\n\nZuboff souligne la différence fondamentale avec la publicité traditionnelle. La publicité du XXe siècle disait : « Achetez ce produit, il est bon ». Le capitalisme de surveillance dit : « Nous savons que vous allez acheter cela, avant même que vous l'ayez décidé. Et nous pouvons modifier la probabilité de cette décision ». Ce n'est pas de la persuasion. C'est une modification du comportement par un environnement dont la personne n'a pas conscience.\n\nL'échelle concrète : en 2023, le marché de la publicité numérique avait dépassé les 600 milliards de dollars par an. C'est plus que le PIB de la plupart des pays du monde. Cette somme entière est la monétisation de l'attention humaine et des données comportementales.\n\n> Simon avertissait en 1971 : la principale rareté de l'ère de l'information, c'est l'attention. Zuboff a constaté en 2019 : cette attention est devenue la principale matière première de la planète.\n\nEntre ces deux observations, il y a quarante-huit ans et la plus grande redistribution du pouvoir de l'histoire des médias.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["attention", "capitalisme de surveillance", "Web2", "pouvoir"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "lanier", "sceneIndex": 2, "type": "privacy", "shortTitle": "Lanier", "era": "2010", "lensWeight": {"chronology": 3, "attention": 4, "platform": 3, "economy": 4, "manipulation": 4}, "title": "Lanier: tu n'es pas un gadget, tu es le produit", "insight": "Lanier a montré que Web2 a détruit la classe moyenne des créateurs en créant une structure où le gagnant rafle tout: quelques superstars et des millions de créateurs qui travaillent gratuitement pour les plateformes.", "thesis": "Lanier a montré que Web2 a détruit la classe moyenne des créateurs en créant une structure où le gagnant rafle tout: quelques superstars et des millions de créateurs qui travaillent gratuitement pour les plateformes.", "body": "## Une voix venue de l'intérieur de l'industrie\n\nJaron Lanier est un critique atypique des plateformes. Il n'est ni journaliste ni universitaire extérieur au milieu. Il est l'un des pionniers de la réalité virtuelle, quelqu'un qui, dans les années 1980, travaillait au cœur même de la révolution technologique, dans la Silicon Valley, aux côtés de ceux qui construisaient cette industrie. C'est précisément pour cela que sa critique est si convaincante: il connaît le système de l'intérieur.\n\nEn 2010, il a écrit le livre « You Are Not a Gadget » — un manifeste de désillusion. Thèse centrale: les plateformes Web2 reposent sur un mensonge fondamental. Elles prétendent t'offrir un service gratuit. En réalité, elles te prennent quelque chose de précieux — ta créativité, tes données, ton temps, ton individualité — et monétisent tout cela sans rien partager de substantiel avec toi.\n\nLanier donne des exemples concrets difficiles à balayer d'un revers de main. Un musicien enregistre une chanson, la met sur YouTube — et reçoit quelques centimes pour mille écoutes. YouTube gagne bien plus grâce à la publicité autour de cette chanson. Un journaliste écrit un article partagé cent mille fois sur Facebook — et ne reçoit rien. Facebook gagne de l'argent grâce au trafic généré par cet article. Un photographe prend des images qu'Instagram utilise pour entraîner des algorithmes de reconnaissance d'images — sans autorisation et sans paiement.\n\n## La disparition de la classe moyenne des créateurs\n\nLanier a décrit une conséquence économique que peu de gens voyaient en 2010, mais qui est devenue évidente dans les années 2020: Web2 a détruit la classe moyenne des créateurs.\n\nAutrefois, entre la célébrité et l'anonymat total, il existait tout un espace: des musiciens professionnels qui vivaient des concerts et de la vente d'albums. Des journalistes qui faisaient vivre leur famille grâce à des articles pour la presse locale. Des photographes qui vendaient leurs images à des agences. Des écrivains qui vivaient des droits d'auteur de tirages moyens. C'était la classe moyenne de la culture.\n\nWeb2 a fait s'effondrer cet espace. Les algorithmes ont créé une structure où le gagnant rafle tout: quelques superstars réunissent des millions d'abonnés et gagnent énormément d'argent. Tous les autres travaillent gratuitement, en créant du contenu pour des plateformes qui, elles, gagnent de l'argent grâce à ce contenu.\n\nEn 2011, Marc Andreessen a écrit la chronique triomphale « Software Is Eating the World » — le logiciel dévore chaque industrie, et c'est inévitable et positif. Les taxis deviennent Uber. Les hôtels deviennent Airbnb. Les médias deviennent Netflix. La musique devient Spotify. La logique des plateformes est la même partout: supprimer les intermédiaires, relier directement vendeur et acheteur, prendre une commission sur chaque transaction. Pas besoin d'usines. La marge est énorme.\n\nAndreessen avait raison sur la description du mouvement en cours. Mais il a passé sous silence le prix: avec les intermédiaires disparaissait aussi l'infrastructure qui faisait vivre des milliers de professionnels. Les compagnies de taxi étaient inefficaces, mais des gens y travaillaient. Les magasins de musique étaient peu pratiques, mais ils versaient des royalties aux musiciens.\n\n> Lanier l'a formulé avec précision: un service gratuit n'est pas un cadeau. C'est un accord dont on ne t'a jamais expliqué les conditions. Tu paies avec ta créativité, tes données et ton temps.\n\nCette logique est importante pour comprendre Web3. L'une des idées centrales d'Internet décentralisé est de rendre aux créateurs ce que les plateformes Web2 leur ont pris. Les tokens, les contrats intelligents et les paiements directs sont des outils techniques pour résoudre le problème que Lanier décrivait déjà en 2010.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["créateurs", "Web2", "économie", "attention"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "galloway", "sceneIndex": 3, "type": "power", "shortTitle": "Quatre cavaliers", "era": "2017", "lensWeight": {"chronology": 3, "attention": 3, "platform": 5, "economy": 4, "manipulation": 3}, "title": "Galloway et les quatre cavaliers : la psychologie de la capture", "insight": "Galloway a expliqué: Amazon, Apple, Facebook, Google n'ont pas capté des marchés, mais des besoins humains fondamentaux: survie, statut, appartenance et connaissance.", "thesis": "Galloway a expliqué: Amazon, Apple, Facebook, Google n'ont pas capté des marchés, mais des besoins humains fondamentaux: survie, statut, appartenance et connaissance.", "body": "## Pourquoi précisément ces quatre\n\nAu milieu des années 2010, il est devenu évident que plusieurs entreprises technologiques avaient capté une part disproportionnée de l'économie mondiale. Amazon, Apple, Facebook, Google: ensemble, elles représentaient plus de capitalisation boursière que la plupart des économies nationales. Pourquoi elles ? Et pourquoi si vite ?\n\nDans *The Four*, Scott Galloway a proposé une réponse frappante précisément parce qu'elle n'est pas technologique. Il ne parle pas de meilleurs algorithmes ni d'un budget de développement plus important. Il parle de psychologie. Chacune des quatre entreprises a capté un besoin humain fondamental et en est devenue le fournisseur sans véritable alternative.\n\nAmazon a capté le besoin de survie et d'accumulation. C'est l'instinct le plus ancien: avoir des réserves, recevoir des produits rapidement et de manière fiable. Amazon Prime promet: tout ce dont tu as besoin arrivera demain. Ce n'est pas seulement une question de confort de livraison; c'est un sentiment de sécurité. Tu ne manqueras pas de l'essentiel.\n\nApple a capté le besoin de statut et d'attractivité sexuelle. L'iPhone n'est pas un téléphone. C'est un signal adressé aux autres: j'appartiens à une certaine classe, j'ai du goût, je prends soin de moi. C'est précisément pour cela que les gens achètent un nouvel iPhone même lorsque l'ancien fonctionne parfaitement. Pas pour les fonctions, mais pour le signal.\n\nFacebook a capté le besoin d'amour et d'appartenance. Le désir humain le plus profond est de faire partie d'un groupe, d'être accepté, d'être aimé. Un like sur Facebook est une approbation sociale emballée dans une interface. Le mot « amis » n'est pas anodin. La plateforme exploite le point le plus vulnérable de la psyché humaine.\n\nGoogle a capté le besoin de connaissance et de Dieu: une source de réponses à n'importe quelle question. « Cherche sur Google » est devenu synonyme de « découvre la vérité ». Google connaît la réponse à n'importe quelle question, d'une recette de bortsch au sens de la vie. C'est un pouvoir sans précédent: être la source de vérité pour des milliards de personnes.\n\n## Le marketing a trouvé une nouvelle langue\n\nPhilip Kotler a décrit l'évolution du marketing à travers trois ères. Le marketing 1.0, c'est le produit: l'usine produit, la publicité vend. Le marketing 2.0, c'est le consommateur: étudier la psychologie, segmenter l'audience, personnaliser l'offre. Le marketing 3.0, ce sont les valeurs: à l'ère Web2, gagnent ceux qui ne vendent ni un produit ni un usage, mais du sens et de l'identité.\n\nApple ne vend pas des téléphones; elle vend l'identité d'une personne créative. Nike ne vend pas des baskets; elle vend une histoire de dépassement de soi. Starbucks ne vend pas du café; elle vend le « troisième lieu », l'espace entre la maison et le travail. C'est précisément pour cela que Starbucks peut facturer cinq euros une boisson que l'on peut faire chez soi pour cinquante centimes.\n\nKotler y voyait un progrès: le business avait enfin commencé à traiter les gens comme des personnes entières. Mais la frontière entre « comprendre une personne plus profondément » et « manipuler une personne plus précisément » s'est révélée très mince. Quand tu ne vends pas un produit, mais une identité, tu travailles avec le plus intime: avec la personne que quelqu'un pense être.\n\n> Galloway a montré que les quatre plateformes n'ont pas capturé des marchés, mais des besoins humains fondamentaux. Cela les rend presque irremplaçables.\n\nC'est précisément ce qui explique pourquoi les effets de réseau sont si puissants dans leur cas. Quitter Facebook signifie perdre le lien avec ses amis. Arrêter d'utiliser Google signifie perdre une source familière de réponses. Ce n'est pas seulement un inconvénient. C'est un coût social et psychologique.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks
