": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["назар", "бақылау капитализмі", "Web2", "билік"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "lanier", "sceneIndex": 2, "type": "privacy", "shortTitle": "Ланье", "era": "2010", "lensWeight": {"chronology": 3, "attention": 4, "platform": 3, "economy": 4, "manipulation": 4}, "title": "Ланье: сен гаджет емессің, өнімнің өзі сенсің", "insight": "Ланье көрсетті: Web2 «жеңімпаз бәрін алады» құрылымын жасап, шығармашылардың орта табын жойды — бірнеше супержұлдыз және платформалар үшін тегін жұмыс істейтін миллиондаған жасаушы.", "thesis": "Ланье көрсетті: Web2 «жеңімпаз бәрін алады» құрылымын жасап, шығармашылардың орта табын жойды — бірнеше супержұлдыз және платформалар үшін тегін жұмыс істейтін миллиондаған жасаушы.", "body": "## Индустрия ішінен шыққан дауыс\n\nДжарон Ланье — платформалардың әдеттен тыс сыншысы. Ол журналист те, сырттан келген ғалым да емес. Ол виртуалды шындықтың пионерлерінің бірі, 1980-жылдары технологиялық революцияның дәл ортасында — Кремний алқабында, осы индустрияны құрғандармен қатар жұмыс істеген адам. Сондықтан оның сыны соншалықты сенімді: ол жүйені ішінен біледі.\n\n2010 жылы ол «You Are Not a Gadget» кітабын жазды — көңіл қалудың манифесі. Негізгі тезис: Web2 платформалары іргелі өтірікке құрылған. Олар саған сервисті тегін береміз дейді. Шын мәнінде, олар сенен құнды нәрсені — шығармашылығыңды, деректеріңді, уақытыңды, даралығыңды — алып, оны монетизациялайды, ал сенімен мәнді ештеңе бөліспейді.\n\nЛанье теріске шығару қиын нақты мысалдар келтіреді. Музыкант ән жазып, YouTube-қа жүктейді — және мың тыңдалым үшін бірнеше цент алады. YouTube бұл әннің айналасындағы жарнамадан әлдеқайда көп табыс табады. Журналист Facebook-та жүз мың рет бөлісілген мақала жазады — және нөл алады. Facebook сол мақала тудырған трафиктен ақша табады. Фотограф Instagram бейнелерді тану алгоритмдерін үйрету үшін пайдаланатын суреттер түсіреді — рұқсатсыз және ақысыз.\n\n## Шығармашылардың орта тап болып жоғалуы\n\nЛанье 2010 жылы аз адам көрген, бірақ 2020-жылдарға қарай анық болған экономикалық салдарды сипаттады: Web2 шығармашылардың орта табын жойды.\n\nБұрын жұлдыздар мен толық белгісіздіктің арасында тұтас кеңістік бар еді — концерттер мен альбом сатудан күн көретін кәсіби музыканттар. Жергілікті газеттерге мақала жазып, отбасын асыраған журналистер. Суреттерін агенттіктерге сатқан фотографтар. Орташа таралымдардан қаламақы алып өмір сүрген жазушылар. Бұл мәдениеттің орта табы еді.\n\nWeb2 бұл кеңістікті жиырып тастады. Алгоритмдер «жеңімпаз бәрін алады» құрылымын жасады: бірнеше супержұлдыз миллиондаған жазылушы жинап, орасан ақша табады. Қалғандарының бәрі тегін жұмыс істейді — сол контенттен ақша табатын платформалар үшін контент жасайды.\n\n2011 жылы Марк Андрессен «Software Is Eating the World» деген салтанатты баған жазды — бағдарламалық қамтамасыз ету әр индустрияны жұтып жатыр, бұл болмай қоймайды әрі жақсы. Такси Uber-ге айналады. Қонақүйлер — Airbnb-ге. Медиа — Netflix-ке. Музыка — Spotify-ға. Платформа логикасы барлық жерде бірдей: делдалдарды алып таста, сатушы мен сатып алушыны тікелей байланыстыр, әр транзакциядан комиссия ал. Зауыттардың керегі жоқ. Маржа орасан.\n\nАндрессен болып жатқанды сипаттауда дұрыс айтты. Бірақ құнын айтпады: делдалдармен бірге мыңдаған кәсіби маманды қолдап тұрған инфрақұрылым да жоғалып бара жатты. Такси компаниялары тиімсіз болды — бірақ онда адамдар жұмыс істеді. Музыкалық дүкендер ыңғайсыз болды — бірақ олар музыканттарға роялти төледі.\n\n> Ланье дәл тұжырымдады: тегін сервис — сыйлық емес. Бұл саған шарттары түсіндірілмеген мәміле. Сен шығармашылықпен, деректермен және уақытпен төлейсің.\n\nБұл логика Web3-ті түсіну үшін маңызды. Децентрализованған интернеттің орталық идеяларының бірі — Web2 платформалары шығармашылардан тартып алған нәрсені оларға қайтару. Токендер, смарт-контракттар, тікелей төлемдер — Ланье 2010 жылы-ақ сипаттаған мәселені шешуге арналған техникалық құралдар.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["жасаушылар", "Web2", "экономика", "назар"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "galloway", "sceneIndex": 3, "type": "power", "shortTitle": "Төрт салт атты", "era": "2017", "lensWeight": {"chronology": 3, "attention": 3, "platform": 5, "economy": 4, "manipulation": 3}, "title": "Гэллоуэй және төрт салт атты: басып алудың психологиясы", "insight": "Гэллоуэй түсіндірді: Amazon, Apple, Facebook, Google нарықтарды емес, адамның негізгі қажеттіліктерін — тірі қалуды, мәртебені, тиесілікті, білімді басып алды.", "thesis": "Гэллоуэй түсіндірді: Amazon, Apple, Facebook, Google нарықтарды емес, адамның негізгі қажеттіліктерін — тірі қалуды, мәртебені, тиесілікті, білімді басып алды.", "body": "## Неге дәл осы төртеуі\n\n2010-жылдардың ортасына қарай бірнеше технологиялық компания әлемдік экономиканың шамадан тыс үлкен үлесін иеленіп алғаны айқын болды. Amazon, Apple, Facebook, Google — олардың нарықтық капитализациясы көптеген ұлттық экономикалардан асып түсті. Неге дәл солар? Және неге соншалықты тез?\n\nСкотт Гэллоуэй «The Four» кітабында технологияға мүлде ұқсамайтын жауабын берді. Ол үздік алгоритмдер немесе әзірлеуге бөлінген үлкен бюджет туралы айтпайды. Ол психология туралы айтады. Төрт компанияның әрқайсысы адамның негізгі қажеттіліктерінің бірін басып алды да, соның баламасыз жеткізушісіне айналды.\n\nAmazon тірі қалу және жинақтау қажеттілігін басып алды. Бұл ең көне инстинкт — қор жинау, тауарды тез әрі сенімді алу. Amazon Prime былай уәде береді: саған қажет нәрсенің бәрі ертең келеді. Бұл жеткізудің жай ғана ыңғайлылығы емес — қауіпсіздік сезімі. Сен қажетті нәрсесіз қалмайсың.\n\nApple мәртебе мен сексуалдық тартымдылық қажеттілігін басып алды. iPhone — телефон емес. Бұл басқа адамдарға берілетін белгі: мен белгілі бір тапқа жатамын, талғамым жақсы, өзіме қараймын. Дәл сондықтан адамдар ескі iPhone мінсіз жұмыс істеп тұрса да, жаңасын сатып алады. Функциялар үшін емес — белгі үшін.\n\nFacebook махаббат пен тиесілік қажеттілігін басып алды. Адамның ең терең қалауы — топтың бір бөлігі болу, қабылдану, сүйікті болу. Facebook-тегі лайк — интерфейске оралған әлеуметтік мақұлдау. «Достар» деген сөз кездейсоқ емес. Платформа адам психикасының ең осал жерін пайдаланады.\n\nGoogle білімге және құдайға деген қажеттілікті — кез келген сұраққа жауап беретін дереккөзге деген қажеттілікті басып алды. «Мұны Google-дан ізде» деген сөз «шындықты біл» дегеннің синониміне айналды. Google кез келген сұрақтың жауабын біледі — борщ рецептісінен бастап өмірдің мәніне дейін. Бұл бұрын-соңды болмаған билік: миллиардтаған адам үшін ақиқат көзі болу.\n\n## Маркетинг жаңа тіл тапты\n\nФилип Котлер маркетинг эволюциясын үш дәуір арқылы сипаттады. Маркетинг 1.0 — өнім: зауыт өндіреді, жарнама сатады. Маркетинг 2.0 — тұтынушы: психологияны зертте, аудиторияны сегментте, ұсынысты жекелендір. Маркетинг 3.0 — құндылықтар: Web2 дәуірінде өнімді де, пайдалықты да емес, мағына мен бірегейлікті сататындар жеңеді.\n\nApple телефон сатпайды — шығармашыл адамның бірегейлігін сатады. Nike кроссовка сатпайды — өзіңді жеңу туралы оқиғаны сатады. Starbucks кофе сатпайды — «үшінші орынды», үй мен жұмыстың арасындағы кеңістікті сатады. Дәл сондықтан Starbucks үйде елу центке жасауға болатын сусын үшін бес еуро ала алады.\n\nКотлер мұны прогресс деп көрді: бизнес ақыры адамдарға тұтас тұлға ретінде қарай бастады. Бірақ «адамды тереңірек түсіну» мен «адамды дәлірек манипуляциялау» арасындағы шекара өте жұқа болып шықты. Тауарды емес, бірегейлікті сатқанда, сен ең интимді нәрсемен — адамның өзін кім деп санайтынымен жұмыс істейсің.\n\n> Гэллоуэй көрсетті: төрт платформа нарықтарды емес, адамның негізгі қажеттіліктерін басып алды. Бұл оларды дерлік алмастырылмайтын етеді.\n\nОлардың жағдайында желілік әсерлердің неге соншалықты қуатты екенін дәл осы түсіндіреді. Facebook-тен шығу — достармен байланысты жоғалту деген сөз. Google-ды қолдануды тоқтату — үйреншікті жауап көзінен айырылу деген сөз. Бұл жай ғана қолайсыздық емес. Бұл әлеуметтік және психологиялық құн.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["Web2", "платформалар", "психология", "билік"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "network", "sceneIndex": 4, "type": "economy", "shortTitle": "Желілік әсерлер", "era": "2018", "lensWeight": {"chronology": 4, "attention": 2, "platform": 5, "economy": 5, "manipulation": 2}, "title": "Желілік әсерлер: неге жеңімпазды ауыстыру мүмкін емес", "insight": "Желілік әсерлер платформаларды дерлік жеңілмейтін етеді. Cambridge Analytica шекті көрсетті: пайдаланушы деректері сайлауға ықпал ету құралына айналғанда, бұл реттеушілік емес, архитектуралық проблема.", "thesis": "Желілік әсерлер платформаларды дерлік жеңілмейтін етеді. Cambridge Analytica шекті көрсетті: пайдаланушы деректері сайлауға ықпал ету құралына айналғанда, бұл реттеушілік емес, архитектуралық проблема.", "body": "## Платформалардың гравитациясы\n\nПлатформаларда олармен бәсекені дерлік мүмкін емес ететін бір қасиет бар. Ол «желілік әсер» деп аталады — және бұл цифрлық дәуірді түсіну үшін ең маңызды экономикалық ұғым шығар.\n\nЖелілік әсер: желіге жаңа пайдаланушылар келген сайын, желінің әр пайдаланушы үшін құндылығы артады. Әлемдегі алғашқы телефон мүлде пайдасыз болды — қоңырау шалатын ешкім жоқ еді. Екінші телефон бір байланыс жасады. Мың телефон — мүмкін болатын жарты миллионға жуық байланыс. Миллион телефон — шамамен бес жүз миллиард. Құндылық сызықтық емес, экспоненциалды өседі.\n\nFacebook үшін бұл мынаны білдіреді: платформа дәл сонда барлық достарың болғандықтан құнды. Егер оған сенің ортаңнан тағы бір адам келсе, Facebook сен үшін сәл құндырақ болады. Егер барлық достарың кетсе, Facebook қанша ақша инвестицияланса да пайдасыз болып қалады.\n\nБұл өзін-өзі күшейтетін ілмек жасайды. Критикалық масса жинаған алғашқы платформа дерлік жеңілмейтін болады. Бәсекелес жай ғана жақсырақ өнім жасай алмайды — барлық достарыңды бір мезгілде көшуге көндіру керек. Ал ол үшін олардың достарын көндіру керек. Ал ол үшін — олардың достарын. Бұл дерлік мүмкін емес.\n\n## Cambridge Analytica және төзімнің шегі\n\n2010-жылдарға қарай айқын болды: адамдардың мінез-құлқы туралы деректер орасан көп ақша тұрады. Соншалықты көп болғандықтан, компаниялар деректерге қол жеткізу үшін кез келген сервисті тегін беруге дайын еді. Бірақ Web2 жауап бере алмаған сұрақ пайда болды: бұл деректер кімге тиесілі?\n\n2018 жылы Cambridge Analytica жанжалы бұрқ етті. Facebook 87 миллион пайдаланушының деректерін — олардың айқын келісімінсіз — бұл деректерді бірнеше елде саяси манипуляция үшін пайдаланған компанияға сатты. Болжам бойынша, бұл деректер АҚШ-тағы президент сайлауының нәтижесіне және Ұлыбританиядағы Brexit референдумына әсер етті.\n\nБұл қоғамдық қабылдауды өзгертті. 2018 жылға дейін адамдардың көпшілігі «сервис үшін деректер» алмасуын қалыпты мәміле ретінде қабылдайтын. Одан кейін адамдардың мінез-құлқы туралы деректер жай ғана коммерциялық актив емес екені анық болды. Бұл демократиялық процестерге билік жүргізу құралы. Бұл ағып кетуінің салдары жай ғана жағымсыз емес, саяси тұрғыдан апатты болуы мүмкін нәрсе.\n\nЭндрю Кин 2007 жылдың өзінде «The Cult of the Amateur» еңбегінде ескерткен: әркім редакциялаусыз және фактілерді тексерусіз қалаған нәрсесін жариялай алғанда, сарапшылық құнсызданады, ал ақпарат сапасы төмендейді. Cambridge Analytica Web2 платформалары ауқымындағы ақпарат манипуляциясының Кин болжай алмаған салдары болуы мүмкін екенін көрсетті.\n\n> Желілік әсерлер — платформалардың гравитациясы. Масса неғұрлым үлкен болса, тартылыс соғұрлым күшті, кету соғұрлым қиын. Cambridge Analytica көрсетті: бұл гравитация пайдаланушыларды ғана емес, демократиялық процестерді де тартып әкете алады.\n\nДәл осы жанжал Web2-де реттеу немесе айыппұлдармен шешілмейтін құрылымдық проблемалар бар деген әңгімені жеделдетті. Басқа архитектура керек. Деректер платформаларға емес, пайдаланушыларға тиесілі болатын архитектура. Web3 дәл осы сұраққа жауап бере бастады.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["Web2", "желілік әсерлер", "деректер", "құпиялылық"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "kotler", "sceneIndex": 5, "type": "media", "shortTitle": "Котлер 3.0", "era": "2010", "lensWeight": {"chronology": 2, "attention": 3, "platform": 2, "economy": 3, "manipulation": 5}, "title": "Котлер 3.0: маркетинг мағыналарды сата бастаған кезде", "insight": "Котлер тіркеді: маркетинг 3.0 өнімді де, пайдалықты да емес, мағыналар мен бірегейлікті сатады. Web2 бұған бұрын-соңды болмаған құралдар берді — әрі түсіну мен манипуляция арасындағы шекараны өшірді.", "thesis": "Котлер тіркеді: маркетинг 3.0 өнімді де, пайдалықты да емес, мағыналар мен бірегейлікті сатады. Web2 бұған бұрын-соңды болмаған құралдар берді — әрі түсіну мен манипуляция арасындағы шекараны өшірді.", "body": "## Бизнес пен адам қатынасының үш дәуірі\n\nФилип Котлер — XX ғасырдағы маркетингтің басты теоретиктерінің бірі, менеджерлердің бірнеше буыны оқыған оқулықтардың авторы. 2010 жылы ол «Маркетинг 3.0» кітабын жазып, бәрінің көз алдында болып жатқан, бірақ аз адам ғана жүйелі түсінген трансформацияны тіркеді.\n\nКотлер маркетингтің үш буынын «біз нені және кімге сатамыз?» деген сұраққа берілген үш түрлі жауап ретінде сипаттады.\n\nМаркетинг 1.0 — өнім дәуірі. Зауыт тауар өндіреді, жарнама: «Сатып ал — ол сапалы әрі қажет» дейді. Тұтынушы функционалды өнім қажет рационалды сатып алушы ретінде қабылданады. Өнім туралы ойла, адам туралы ойлама.\n\nМаркетинг 2.0 — тұтынушы дәуірі. Компаниялар сатып алушы психологиясын зерттей, аудиторияларды сегменттей, ұсыныстарды жекелендіре бастады. «Біз сені бәсекелестерден жақсырақ түсінеміз — сондықтан біздің өнім саған арналған». Тұтынушы қажеттіліктері бар эмоционалды жаратылыс ретінде қабылданады.\n\nМаркетинг 3.0 — құндылықтар дәуірі. Web2 дәуірінде ең жақсы өнімді сататындар немесе тұтынушыны жақсырақ түсінетіндер жеңген жоқ. Мағына мен тиесілікті жасайтындар жеңді. Тұтынушы құндылықтары, армандары және рухани қажеттіліктері бар тұтас тұлға ретінде қабылданады.\n\n## Өнімнен бірегейлікке\n\nНақты мысалдарға қара — олар кез келген теориядан жақсырақ түсіндіреді.\n\nApple. Функционалды тұрғыдан iPhone бәсекелестерден екі есе қымбат тұратындай соншалықты жақсы емес. Бірақ Apple телефон сатпайды. Ол талғамы жақсы, шығармашыл, білімді адамның бірегейлігін сатады. iPhone сатып алғанда, сен белгілі бір тайпаға тиесілікті сатып аласың. Дәл сондықтан Apple жанкүйерлері оны сондай құштарлықпен қорғайды — олар өз бірегейлігін қорғайды.\n\nNike. Nike кроссовкалары функционалды тұрғыдан ондаған басқа брендтермен салыстырмалы. Бірақ Nike өзіңді жеңу туралы оқиғаны сатады. Just Do It — аяқ киім сатып алу жөніндегі нұсқаулық емес. Бұл философия. Nike сатып алғанда, сен көбірекке қабілетті екенің туралы нарративті өзіңе өлшеп көресің.\n\nStarbucks. Starbucks кофесі сапасы ұқсас орташа кафедегі сусыннан объективті түрде бес-сегіз есе қымбат. Бірақ Starbucks «үшінші орынды» — үй мен жұмыстың арасындағы, отыруға, жұмыс істеуге, кездесуге болатын кеңістікті сатады. Сіз кофе үшін емес, белгілі бір сезімі бар әлеуметтік кеңістікті жалға алу үшін төлейсіз.\n\nКотлер мұны эволюция деп көрді: бизнес ақыры адамдар туралы тұтас тұлға ретінде ойлай бастады. Бірақ бұл прогрестің кері жағы болды. «Адамды тереңірек түсіну» мен «адамды дәлірек манипуляциялау» арасындағы шекара өте жұқа болып шықты. Егер сен бірегейлікті сатсаң, ең интимді нәрсемен жұмыс істейсің. Сен сатып алу туралы шешімге емес, адамның өзін кім деп санайтынына ықпал етесің.\n\n> Котлер мұны прогресс деп атады. Зубофф мұны билік құралы деп атады. Екеуі де дұрыс — айырмашылық тек қай көзқараспен қарауда.\n\nWeb2 дәуірінде маркетинг 3.0 бұрын-соңды болмаған құралдарға ие болды: миллиардтаған адамның мінез-құлқы туралы деректер, жекелендіру алгоритмдері, психотипке дейін дәл таргеттелген жарнама. Бұл бірегейлікті хирургиялық дәлдікпен сатуға мүмкіндік берді. Бірақ өзінің хабарынсыз бірегейлігімен сауда жасалып жатқан адамды кім қорғайды?", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["маркетинг", "бірегейлік", "Web2", "психология"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "verdict", "sceneIndex": 6, "type": "power", "shortTitle": "Web2 қорытындысы", "era": "≈2020", "lensWeight": {"chronology": 5, "attention": 4, "platform": 4, "economy": 3, "manipulation": 4}, "title": "Web2 қорытындысы: дауыс берді, деректерді алды", "insight": "Web2 миллиардтаған адамға дауыс берді — ал орнына жекелікті, деректерге меншікті және ортақ ақпараттық кеңістікті алды. Бұл шарттарын ешкім жарияламаған мәміле еді.", "thesis": "Web2 миллиардтаған адамға дауыс берді — ал орнына жекелікті, деректерге меншікті және ортақ ақпараттық кеңістікті алды. Бұл шарттарын ешкім жарияламаған мәміле еді.", "body": "## Web2 не берді\n\nWeb2 дәуіріне үкім шығармас бұрын, оның жетістіктерін адал мойындаған жөн. Бұл ақтау емес. Бұл ақылды адамдардың бұл жүйені шынайы ниетпен неге құрғанын — және ненің дұрыс болмағанын түсіну әрекеті.\n\nWeb2 бұрын дауысы болмаған миллиардтаған адамға дауыс берді. Бұл метафора емес. Шағын қаладан шыққан журналист жергілікті шенеуніктердің жемқорлығын әшкерелей алады — әрі оның материалын жүз мыңдаған адам оқиды. Белсенді мемлекеттік БАҚ-ты айналып өтіп, наразылық ұйымдастыра алады. Шағын бизнес жарнама бюджеті жоқ болса да, бүкіл әлемнен клиент таба алады. Бұл нақты әрі орасан зор демократияландыру.\n\nWeb2 қашықтықты жойды. Оған дейін әлемдік білім мен шағын қаладағы адамның арасында тілдік, қаржылық, географиялық кедергілер тұрды. YouTube кез келген деңгейдегі білім беру контентіне тегін қолжетімділік берді. Wikipedia кез келген тілдегі әмбебап энциклопедия жасады. Google Translate тілдік кедергіні алып тастады. Бұл миллиондаған адамның мүмкіндіктерін шынымен өзгертті.\n\nWeb2 жаңа нарықтар мен жаңа мамандықтар құрды. Контент-криэйтор, SMM-менеджер, подкастер, стример — бұл мамандықтар жиырма жыл бұрын болған жоқ. Платформалар экономикасы дәстүрлі жұмыс берушісі жоқ адамдарға табыс табуға мүмкіндік берді: фрилансерлерге, қолөнершілерге, суретшілерге.\n\n## Web2 не алды\n\nБірақ Web2 алған нәрселердің тізімі де одан қысқа емес.\n\nЖекелік. Интернеттегі әрбір әрекет қазір жазылады, талданады және сатылады. Сен өзің туралы нақты не білетінін және оны кімге сататынын білмейсің. Корпорациялар сен туралы жақындарыңнан да көп біледі.\n\nДеректерге меншік. Сен контент жасайсың — оған платформа иелік етеді. Сен аудитория жинайсың — оған қолжетімділікті платформа бақылайды. Алгоритм өзгереді — жылдар бойы құрғаныңның бәрі бір түнде жоқ болып кетуі мүмкін.\n\nОртақ ақпараттық кеңістік. Дербестендіру алгоритмдері әркім өз ақпараттық көпіршігінде өмір сүретін әлем құрды. Бір қаладағы адамдар шындықтың түбегейлі әртүрлі нұсқаларын көруі мүмкін — бұл қоғамдық диалог мүмкіндігінің өзін бұзады.\n\nМәдениеттің орташа сапасы. Кин бұл туралы 2007 жылдың өзінде ескерткен: әркім редакциясыз және фактчекингсіз жариялай алғанда, сарапшылықтың құны түседі. Бұл сапалы контент қалмады деген сөз емес — ол бар. Бірақ оны шу мұхитынан табу әлдеқайда қиындады.\n\nWeb2-ден шығу сөз жүзінде оңай, ал іс жүзінде дерлік мүмкін емес. Желілік әсерлер сондай тартылыс күшін құрды: платформалардан «жай ғана кету» әлеуметтік және кәсіби өмірден түсіп қалу дегенді білдіреді.\n\n> Web2 бізбен шарттарын жарияламай мәміле жасасты. Дауыс — деректердің орнына. Байланыс — жекеліктің орнына. Тегін сервис — назардың орнына.\n\nДәл осы қайшылық — Web2 жасаған құндылық пен оның алған құны арасындағы қайшылық — Web3 орталығында тұрған сұрақты тудырды: дауыс, байланыс және сервиске басқа біреу сенің деректерің мен назарыңа иелік етпей-ақ қол жеткізуге бола ма?", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20 "manipulation", "media"]}, {"from": "city", "to": "galloway", "label": "қаланы төртеуі басып алды", "lenses": ["platform", "chronology"]}, {"from": "attention", "to": "verdict", "label": "жарияланбаған шарттары бар мәміле", "lenses": ["attention", "chronology"]}, {"from": "network", "to": "kotler", "label": "ауқым ықпалды күшейтеді", "lenses": ["economy", "manipulation"]}]}, "uz": {"chapter": {"key": "web2", "title": "Internet shaharga aylandi", "lede": "Senga ovoz berishdi — eʼtiboringni olish uchun. Web2 kutubxonani monetizatsiya mashinasiga qanday aylantirdi.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=web2", "centralIdea": "Senga ovoz berishdi, eʼtiboringni olish uchun", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Xronologiya", "accent": "#7dd3fc", "description": "Web2 tugʻilishidan Cambridge Analyticaʼgacha: “shahar” qanday mashinaga aylandi."}, {"id": "attention", "label": "Diqqat", "accent": "#fbbf24", "description": "Simon va Zuboff: inson xulqi yangi turdagi hokimiyat xomashyosi sifatida."}, {"id": "platform", "label": "Platformalar hokimiyati", "accent": "#f87171", "description": "Galloway va toʻrt chavandoz: bozorlarni emas, bazaviy ehtiyojlarni egallash."}, {"id": "economy", "label": "Iqtisodiyot", "accent": "#a78bfa", "description": "Tarmoq effektlari va “gʻolib hammasini oladi”: nega platformani almashtirib boʻlmaydi."}, {"id": "manipulation", "label": "Manipulyatsiya", "accent": "#34d399", "description": "Kotler 3.0 va Lanier: maʼnolarni sotish, tushunish va taʼsir chegarasining oʻchishi."}], "nodes": [{"id": "city", "sceneIndex": 0, "type": "media", "shortTitle": "Shahar", "era": "2004→", "lensWeight": {"chronology": 5, "attention": 3, "platform": 4, "economy": 3, "manipulation": 2}, "title": "Web2 tugʻilishi: internet shaharga aylandi", "insight": "Web2 internetni kutubxonadan shaharga aylantirdi — har kimga ovoz berdi, lekin bu ovozni eʼtiborni monetizatsiya qiladigan mashinaga joyladi.", "thesis": "Web2 internetni kutubxonadan shaharga aylantirdi — har kimga ovoz berdi, lekin bu ovozni eʼtiborni monetizatsiya qiladigan mashinaga joyladi.", "body": "## Konferensiyada oʻylab topilgan atama\n\n2004 yilda texnik adabiyotlar nashriyotchisi Tim O'Reilly hamkasblari bilan aqliy hujum oʻtkazayotgan edi. Vaziyat gʻalati edi: dotkom pufagi 2000 yilda yorilgan, minglab kompaniyalar bankrot boʻlgan, investorlar yuzlab milliard dollar yoʻqotgan edi. Media internet-biznes illyuziya boʻlib chiqqani haqida yozardi.\n\nAmmo O'Reilly maʼlumotlarga qarab, boshqa narsani koʻrdi. Trafik oʻsayotgan edi. Foydalanuvchilar soni koʻpayayotgan edi. Omon qolgan kompaniyalar — Google, Amazon, eBay — shunchaki omon qolmadi, ular tezlashdi. Internet qanday ishlashining tabiatida nimadir oʻzgargan edi. Bu oʻzgarishga nom berish kerak edi.\n\nShu tariqa “Web 2.0” atamasi paydo boʻldi. 2005 yilgi maqolasida O'Reilly uning belgilarini taʼrifladi: veb saytlar toʻplami emas, platforma sifatida. Foydalanuvchilar faqat isteʼmolchi emas, qiymatning hamyaratuvchilari sifatida. Maʼlumotlar asosiy aktiv sifatida. Tarmoq effektlari oʻsish dvigateli sifatida — tarmoqda odam qancha koʻp boʻlsa, tarmoq har bir ishtirokchi uchun shuncha qimmatli boʻladi.\n\nBu texnik manifestdek eshitilardi. Aslida esa bu O'Reilly oʻsha paytda oqibatlarini oldindan koʻra olmagan yangi biznes-modelning tavsifi edi.\n\n## Kutubxonadan shaharga\n\nWeb2 dan oldin internet kutubxona edi. Sen kelarding, oʻqirding, ketarding. Saytlar javonlardagi kitoblar kabi bir-biridan alohida mavjud edi. Sen bilan axborot orasida vositachi yoʻq edi — faqat manzil va brauzer bor edi.\n\nWeb2 internetni shaharga aylantirdi. Maydonlar paydo boʻldi — Facebook, YouTube, Twitter — u yerda odamlar shunchaki oʻqimadi, balki gapirdi, bahslashdi, oʻzini koʻrsatdi, obroʻ qurdi. Bozorlar paydo boʻldi — Amazon, eBay — u yerda odamlar bir-biri bilan bevosita oldi-sotdi qildi. Navigatorlar paydo boʻldi — Google qidiruv — ular bu shaharda qayerga borishni koʻrsatardi.\n\nIlk bor texnik bilimi yoʻq oddiy odam internetni nafaqat isteʼmol qila oldi, balki uni yarata oldi. Blog ochish — WordPressʼda besh daqiqa. Video yuklash — YouTubeʼda bitta tugma. Sharh yozish, baho qoʻyish, surat ulashish — bularning barchasi hamma uchun ochiq boʻldi. Web1 da oʻquvchilarni mualliflardan ajratib turgan texnik toʻsiq qulab tushdi.\n\nBu ishtirokning haqiqiy inqilobi edi. Va u dunyoni chindan ham oʻzgartirdi. Blogerlar professional jurnalistlar yetib bora olmagan joylardagi korrupsiyani fosh qildi. Fuqarolik jurnalistlari rasmiy OAV eʼtiborsiz qoldirgan voqealarni tasvirga oldi. Faollar ijtimoiy tarmoqlar orqali hokimiyat javob berishga ulgurmasidan tezroq noroziliklarni uyushtirdi. Arab bahori. #MeToo. Bularning barchasi Web2 tufayli mumkin boʻldi.\n\nAmmo bu inqilobning narxi bor edi. Va uni foydalanuvchi kelishuvida hech kim oʻqimagan edi.\n\n> Web2 har kimga ovoz berdi — va bu ovozni uning har bir soʻzidan pul topadigan mashinaga joyladi.\n\nWeb2 paradoksi shundaki, bu halol almashinuv edi — faqat uning shartlarini hech kim ovoz chiqarib tushuntirmadi. Sen bepul servis olasan. Evaziga — sening eʼtiboring, sening maʼlumotlaring, sening xulq-atvoring. Muammo almashinuv mavjud boʻlganida emas. Muammo uning koʻrinmas boʻlganida edi.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["Web2", "platformalar", "tarix", "media"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "attention", "sceneIndex": 1, "type": "power", "shortTitle": "Diqqat", "era": "1971 · 2019", "lensWeight": {"chronology": 3, "attention": 5, "platform": 3, "economy": 3, "manipulation": 3}, "title": "Eʼtibor iqtisodiyoti: sezilmay qolgan tanqislik", "insight": "Simon 1971 yilda eʼtibor iqtisodiyotini bashorat qilgan. Zuboff qayd etdi: inson xulq-atvori xomashyoga aylandi — va bu avval mavjud boʻlmagan yangi hokimiyat turidir.", "thesis": "Simon 1971 yilda eʼtibor iqtisodiyotini bashorat qilgan. Zuboff qayd etdi: inson xulq-atvori xomashyoga aylandi — va bu avval mavjud boʻlmagan yangi hokimiyat turidir.", "body": "## Nobel laureati 1971 yildayoq ogohlantirgan edi\n\n1971 yilda iqtisodiyot boʻyicha Nobel laureati Herbert Simon deyarli hech kim payqamagan maqola yozdi. Uning asosiy fikri sodda va qatʼiy edi: axborot koʻpayganda, tanqis resurs axborot emas, eʼtibor boʻladi.\n\nSimon buni “eʼtibor iqtisodiyoti” deb atadi va Facebookʼdan oʻttiz yil oldin taʼriflab berdi. Mantiq oddiy: agar senda millionta sayt boʻlsa, odamda esa bir sutkada atigi yigirma toʻrt soat boʻlsa — qiymat kontentda emas. Qiymat odamning koʻzi va qulogʻiga kirish imkonida. Eʼtiborni kim nazorat qilsa, iqtisodiyotni ham oʻsha nazorat qiladi.\n\nGoogle buni birinchi boʻlib tushundi — va shu asosda imperiya qurdi. Qidiruv tizimi bepul edi. Ammo sen har safar nimanidir qidirganingda, Google sen haqingda yangi narsa bilib olardi: seni nima bezovta qiladi, nima sotib olmoqchisan, tunda nimalar haqida oʻylaysan. Google bu bilimlarni reklama beruvchilarga sotardi. Sen pul bilan toʻlamading — eʼtibor va maʼlumotlaring bilan toʻlading.\n\nJohn Battelle 2005 yilda “The Search” kitobini yozdi — Google tarixini yangi hokimiyat tarixi sifatida. Uning kuzatuvi: qidiruv tizimi shunchaki qidirish vositasi emas. Bu insonning butun axborot makoni oʻtadigan infratuzilma. Qidiruvni kim nazorat qilsa, odamlar uchun nima mavjud, nima mavjud emasligini oʻsha hal qiladi. Qaysi saytni topishadi, qaysisi koʻrinmay qoladi. Bu oʻtmishdagi nashriyotlar va telekompaniyalar hokimiyati bilan taqqoslanadigan kuch — faqat miqyosi boshqa.\n\n## Kuzatuv kapitalizmi: inson xomashyo sifatida\n\nShoshana Zuboff internetdagi odamlar maʼlumotlari bilan nima yuz berishini oʻrganishga oʻn yil sarfladi. 2019 yilda u “Kuzatuv kapitalizmi davri” kitobini chop etdi — va Web2 biznes-modelini eng aniq tasvirlaydigan atamani kiritdi.\n\nUning dalili: Google va Facebook xomashyoning yangi turini kashf etdi. Neft emas, koʻmir emas — inson xulq-atvori. Har bir klik, oʻqishdagi har bir pauza, shahar boʻylab har bir yoʻnalish, muayyan sahifada oʻtkazilgan har bir soniya — bularning barchasi yigʻiladi, tahlil qilinadi va Zuboff “xulq-atvor ortiqchalari” deb ataydigan narsaga aylantiriladi. Bu ortiqchalar reklama beruvchilarga odamlarning kelajakdagi harakatlarini bashorat qilish va ularga taʼsir oʻtkazish vositasi sifatida sotiladi.\n\nZuboff anʼanaviy reklamadan prinsipial farqni taʼkidlaydi. XX asr reklamasi: “Bu mahsulotni sotib ol — u yaxshi” der edi. Kuzatuv kapitalizmi esa: “Sen buni sotib olishingni bilamiz — hali oʻzing qaror qilmasingdan oldin. Va biz bu qarorning ehtimolini oʻzgartira olamiz” deydi. Bu ishontirish emas. Bu odam sezmaydigan muhit orqali xulq-atvorni oʻzgartirish.\n\nAniq miqyos: raqamli reklama bozori 2023 yilga kelib yiliga 600 milliard dollardan oshdi. Bu dunyodagi aksariyat mamlakatlar YaIMidan koʻp. Bu butun summa — inson eʼtibori va xulq-atvor maʼlumotlarini monetizatsiya qilishdir.\n\n> Simon 1971 yilda ogohlantirgan edi: axborot davrining asosiy tanqisligi — eʼtibor. Zuboff 2019 yilda qayd etdi: bu eʼtibor sayyoraning asosiy xomashyosiga aylandi.\n\nBu ikki kuzatuv orasida qirq sakkiz yil va media tarixidagi hokimiyatning eng yirik qayta taqsimlanishi turibdi.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["diqqat", "kuzatuv kapitalizmi", "Web2", "hokimiyat"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "lanier", "sceneIndex": 2, "type": "privacy", "shortTitle": "Lanier", "era": "2010", "lensWeight": {"chronology": 3, "attention": 4, "platform": 3, "economy": 4, "manipulation": 4}, "title": "Lanier: sen gadjet emassan, mahsulotning oʻzi sensan", "insight": "Lanier koʻrsatdi: Web2 “gʻolib hammasini oladi” tuzilmasini yaratib, ijodkorlarning oʻrta sinfini yoʻq qildi — bir nechta superyulduz va platformalar uchun bepul ishlaydigan millionlab yaratuvchilar.", "thesis": "Lanier koʻrsatdi: Web2 “gʻolib hammasini oladi” tuzilmasini yaratib, ijodkorlarning oʻrta sinfini yoʻq qildi — bir nechta superyulduz va platformalar uchun bepul ishlaydigan millionlab yaratuvchilar.", "body": "## Industriya ichidan chiqqan ovoz\n\nJaron Lanier — platformalarning noodatiy tanqidchisi. U jurnalist ham, tashqaridan kelgan olim ham emas. U virtual reallik pionerlaridan biri, 1980-yillarda texnologik inqilobning ayni markazida — Kremniy vodiysida, bu industriyani qurayotganlar bilan yonma-yon ishlagan inson. Aynan shuning uchun uning tanqidi juda ishonchli: u tizimni ichidan biladi.\n\n2010 yilda u “You Are Not a Gadget” kitobini yozdi — hafsalasi pir boʻlish manifesti. Asosiy tezis: Web2 platformalari fundamental yolgʻon ustiga qurilgan. Ular senga servisni bepul beramiz deydi. Aslida esa ular sendan qimmatli narsani — ijodingni, maʼlumotlaringni, vaqtingni, individualligingni — olib, uni monetizatsiya qiladi va sen bilan sezilarli hech narsa boʻlishmaydi.\n\nLanier rad etish qiyin boʻlgan aniq misollar keltiradi. Musiqachi qoʻshiq yozadi, YouTubeʼga joylaydi — va har ming tinglash uchun bir necha sent oladi. YouTube bu qoʻshiq atrofidagi reklamadan ancha koʻproq daromad oladi. Jurnalist Facebookʼda yuz ming marta ulashilgan maqola yozadi — va nol oladi. Facebook bu maqola yaratgan trafikdan pul topadi. Fotograf Instagram tasvirlarni tanish algoritmlarini oʻqitish uchun ishlatadigan suratlar oladi — ruxsatsiz va toʻlovsiz.\n\n## Ijodkorlar oʻrta sinfining yoʻqolishi\n\nLanier 2010 yilda kam odam koʻrgan, ammo 2020-yillarga kelib yaqqol boʻlgan iqtisodiy oqibatni tasvirladi: Web2 ijodkorlarning oʻrta sinfini yoʻq qildi.\n\nIlgari yulduzlar bilan mutlaq nomaʼlumlik orasida butun bir makon bor edi — konsertlar va albom sotish orqali tirikchilik qiladigan professional musiqachilar. Mahalliy gazetalar uchun maqolalar yozib, oilasini boqadigan jurnalistlar. Suratlarini agentliklarga sotadigan fotograflar. Oʻrtacha tirajlardan gonorar olib yashaydigan yozuvchilar. Bu madaniyatning oʻrta sinfi edi.\n\nWeb2 bu makonni siqib tashladi. Algoritmlar “gʻolib hammasini oladi” tuzilmasini yaratdi: bir nechta superyulduz millionlab obunachi yigʻadi va ulkan pul topadi. Qolganlarning hammasi bepul ishlaydi — shu kontentdan pul topadigan platformalar uchun kontent yaratadi.\n\nMarc Andreessen 2011 yilda “Software Is Eating the World” degan tantanavor kolonka yozdi — dasturiy taʼminot har bir industriyani yutib yuboryapti, bu muqarrar va yaxshi. Taksi Uberʼga aylanadi. Mehmonxonalar — Airbnbʼga. Media — Netflixʼga. Musiqa — Spotifyʼga. Platforma mantiqi hamma joyda bir xil: vositachilarni olib tashla, sotuvchi va xaridorni bevosita uchrashtir, har bir tranzaksiyadan komissiya ol. Zavodlar kerak emas. Marja ulkan.\n\nAndreessen sodir boʻlayotgan narsani tasvirlashda haq edi. Ammo narxini aytmadi: vositachilar bilan birga minglab professionallarni qoʻllab turgan infratuzilma ham yoʻqolib borardi. Taksi kompaniyalari samarasiz edi — lekin ularda odamlar ishlardi. Musiqa doʻkonlari noqulay edi — lekin ular musiqachilarga royalti toʻlardi.\n\n> Lanier aniq ifodaladi: bepul servis — sovgʻa emas. Bu shartlari senga tushuntirilmagan bitim. Sen ijod, maʼlumotlar va vaqt bilan toʻlaysan.\n\nBu mantiq Web3ʼni tushunish uchun muhim. Detsentralizatsiyalashgan internetning markaziy gʻoyalaridan biri — Web2 platformalari ijodkorlardan olib qoʻygan narsani ularga qaytarish. Tokenlar, smart-kontraktlar, toʻgʻridan-toʻgʻri toʻlovlar — bular Lanier 2010 yildayoq tasvirlagan muammoni hal qilish uchun texnik vositalardir.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["ijodkorlar", "Web2", "iqtisodiyot", "diqqat"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "galloway", "sceneIndex": 3, "type": "power", "shortTitle": "Toʻrt chavandoz", "era": "2017", "lensWeight": {"chronology": 3, "attention": 3, "platform": 5, "economy": 4, "manipulation": 3}, "title": "Galloway va toʻrt chavandoz: egallash psixologiyasi", "insight": "Galloway tushuntirdi: Amazon, Apple, Facebook, Google bozorlarni emas, insonning asosiy ehtiyojlarini — yashab qolish, maqom, mansublik va bilimni egalladi.", "thesis": "Galloway tushuntirdi: Amazon, Apple, Facebook, Google bozorlarni emas, insonning asosiy ehtiyojlarini — yashab qolish, maqom, mansublik va bilimni egalladi.", "body": "## Nega aynan shu toʻrttasi\n\n2010-yillarning oʻrtalariga kelib, bir nechta texnologiya kompaniyasi jahon iqtisodiyotining nomutanosib darajada katta ulushini egallab olgani aniq boʻldi. Amazon, Apple, Facebook, Google — ularning bozor kapitallashuvi aksariyat milliy iqtisodiyotlarnikidan katta edi. Nega aynan ular? Va nega bunchalik tez?\n\nScott Galloway «The Four» kitobida texnologiyaga bogʻliq emasligi bilan hayratlantiradigan javob berdi. U yaxshiroq algoritmlar yoki ishlab chiqish uchun kattaroq budjet haqida gapirmaydi. U psixologiya haqida gapiradi. Toʻrt kompaniyaning har biri insonning asosiy ehtiyojlaridan birini egalladi va uning muqobilsiz yetkazib beruvchisiga aylandi.\n\nAmazon yashab qolish va jamgʻarish ehtiyojini egalladi. Bu eng qadimiy instinkt: zaxiraga ega boʻlish, tovarlarni tez va ishonchli olish. Amazon Prime shunday vaʼda beradi: senga kerak hamma narsa ertaga keladi. Bu shunchaki yetkazib berish qulayligi emas — bu xavfsizlik hissi. Sen zarur narsasiz qolmaysan.\n\nApple maqom va jinsiy jozibadorlik ehtiyojini egalladi. iPhone — telefon emas. Bu boshqa odamlarga signal: men muayyan sinfga mansubman, didim yaxshi, oʻzimga qarayman. Aynan shuning uchun odamlar eski iPhone juda yaxshi ishlayotgan boʻlsa ham, yangisini sotib oladi. Funksiyalar uchun emas — signal uchun.\n\nFacebook sevgi va mansublik ehtiyojini egalladi. Insonning eng chuqur istagi — guruhning bir qismi boʻlish, qabul qilinish, sevilish. Facebookdagi layk — interfeysga oʻralgan ijtimoiy maʼqullash. «Doʻstlar» soʻzi tasodifiy emas. Platforma inson psixikasining eng zaif joyidan foydalanadi.\n\nGoogle bilimga va xudoga boʻlgan ehtiyojni — har qanday savolga javob manbasini egalladi. «Buni Google'dan qidir» iborasi «haqiqatni bilib ol» degan soʻzning sinonimiga aylandi. Google har qanday savolning javobini biladi — borsh retseptidan tortib hayot maʼnosigacha. Bu misli koʻrilmagan hokimiyat: milliardlab odamlar uchun haqiqat manbasi boʻlish.\n\n## Marketing yangi til topdi\n\nPhilip Kotler marketing evolyutsiyasini uch davr orqali tasvirlagan. Marketing 1.0 — bu mahsulot: zavod ishlab chiqaradi, reklama sotadi. Marketing 2.0 — bu isteʼmolchi: psixologiyani oʻrgan, auditoriyani segmentla, taklifni shaxsiylashtir. Marketing 3.0 — bu qadriyatlar: Web2 davrida mahsulotni ham, foydani ham emas, maʼno va identifikatsiyani sotadiganlar yutadi.\n\nApple telefon sotmaydi — ijodkor inson identifikatsiyasini sotadi. Nike krossovka sotmaydi — oʻzini yengish haqidagi hikoyani sotadi. Starbucks qahva sotmaydi — «uchinchi joy»ni, uy va ish orasidagi makonni sotadi. Aynan shuning uchun Starbucks uyda ellik sentga tayyorlash mumkin boʻlgan ichimlik uchun besh yevro olishi mumkin.\n\nKotler buni taraqqiyot deb koʻrgan: biznes nihoyat odamlarga yaxlit shaxslar sifatida munosabat qila boshladi. Ammo «insonni chuqurroq tushunish» va «insonni aniqroq manipulyatsiya qilish» oʻrtasidagi chegara juda nozik boʻlib chiqdi. Tovarni emas, identifikatsiyani sotganingda, eng intim narsa bilan — inson oʻzini kim deb bilishi bilan ishlaysan.\n\n> Galloway koʻrsatdi: toʻrt platforma bozorlarni emas, insonning asosiy ehtiyojlarini egalladi. Bu ularni deyarli almashtirib boʻlmaydigan qiladi.\n\nAynan shu ularning holatida tarmoq effektlari nega bunchalik kuchli ekanini tushuntiradi. Facebook'dan chiqish — doʻstlar bilan aloqani yoʻqotish demak. Google'dan foydalanishni toʻxtatish — odatiy javob manbasidan mahrum boʻlish demak. Bu shunchaki noqulaylik emas. Bu ijtimoiy va psixologik xarajat.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["Web2", "platformalar", "psixologiya", "hokimiyat"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "network", "sceneIndex": 4, "type": "economy", "shortTitle": "Tarmoq effektlari", "era": "2018", "lensWeight": {"chronology": 4, "attention": 2, "platform": 5, "economy": 5, "manipulation": 2}, "title": "Tarmoq effektlari: nega gʻolibni almashtirib boʻlmaydi", "insight": "Tarmoq effektlari platformalarni deyarli yengilmas qiladi. Cambridge Analytica chegarani koʻrsatdi: foydalanuvchi maʼlumotlari saylovlarga taʼsir qilish vositasiga aylanganda, bu regulyatorlik emas, arxitektura muammosidir.", "thesis": "Tarmoq effektlari platformalarni deyarli yengilmas qiladi. Cambridge Analytica chegarani koʻrsatdi: foydalanuvchi maʼlumotlari saylovlarga taʼsir qilish vositasiga aylanganda, bu regulyatorlik emas, arxitektura muammosidir.", "body": "## Platformalar gravitatsiyasi\n\nPlatformalarda ular bilan raqobat qilishni deyarli imkonsiz qiladigan bir xususiyat bor. U «tarmoq effekti» deb ataladi va bu raqamli davrni tushunish uchun ehtimol eng muhim iqtisodiy tushunchadir.\n\nTarmoq effekti: tarmoqqa yangi foydalanuvchilar kelgani sari, tarmoqning har bir foydalanuvchi uchun qiymati oshadi. Dunyodagi birinchi telefon mutlaqo foydasiz edi — qoʻngʻiroq qiladigan hech kim yoʻq. Ikkinchi telefon bitta ulanish yaratdi. Mingta telefon — deyarli yarim million mumkin boʻlgan ulanish. Millionta telefon — taxminan besh yuz milliard. Qiymat chiziqli emas, eksponensial oʻsadi.\n\nFacebook uchun bu quyidagini anglatadi: platforma aynan u yerda barcha doʻstlaring borligi uchun qimmatli. Agar u yerga sening davrangdan yana bir kishi kelsa, Facebook sen uchun biroz qimmatliroq boʻladi. Agar barcha doʻstlaring ketib qolsa, unga qancha pul investitsiya qilingan boʻlsa ham, Facebook foydasiz boʻlib qoladi.\n\nBu oʻzini oʻzi kuchaytiradigan halqa yaratadi. Kritik massani toʻplagan birinchi platforma deyarli yengilmas boʻladi. Raqobatchi shunchaki yaxshiroq mahsulot yaratishi yetarli emas — barcha doʻstlaringni bir vaqtda oʻtishga ishontirish kerak. Buning uchun esa ularning doʻstlarini ishontirish kerak. Buning uchun esa — ularning doʻstlarini. Bu deyarli imkonsiz.\n\n## Cambridge Analytica va sabr chegarasi\n\n2010-yillarga kelib aniq boʻldi: odamlarning xulq-atvori haqidagi maʼlumotlar ulkan pul turadi. Shu qadar ulkanki, kompaniyalar maʼlumotlarga kirish imkonini olish uchungina har qanday servisni bepul berishga tayyor edi. Ammo Web2 javob bera olmagan savol paydo boʻldi: bu maʼlumotlar kimga tegishli?\n\n2018-yilda Cambridge Analytica mojarosi boshlandi. Facebook 87 million foydalanuvchining maʼlumotlarini — ularning aniq roziligisiz — bu maʼlumotlardan bir necha mamlakatda siyosiy manipulyatsiyalar uchun foydalangan kompaniyaga sotdi. Taxminlarga koʻra, bu maʼlumotlar AQShdagi prezidentlik saylovi natijasiga va Buyuk Britaniyadagi Brexit referendumi natijasiga taʼsir qilgan.\n\nBu jamoatchilik idrokini sindirdi. 2018-yilgacha koʻpchilik «servis evaziga maʼlumotlar»ni normal kelishuv deb qabul qilardi. Undan keyin odamlarning xulq-atvori haqidagi maʼlumotlar shunchaki tijorat aktivi emasligi ayon boʻldi. Bu demokratik jarayonlar ustidan hokimiyat vositasi. Bu sizib chiqish oqibatlari shunchaki yoqimsiz emas, siyosiy jihatdan halokatli boʻlishi mumkin boʻlgan narsadir.\n\nAndrew Keen 2007-yildayoq «The Cult of the Amateur» asarida ogohlantirgan edi: har kim tahrirsiz va faktlarni tekshirmasdan istagan narsasini eʼlon qila olsa, ekspertiza qadrsizlanadi, axborot sifati pasayadi. Cambridge Analytica Web2 platformalari miqyosidagi axborot manipulyatsiyasi Keen oldindan koʻra olmagan oqibatlarga olib kelishi mumkinligini koʻrsatdi.\n\n> Tarmoq effektlari — platformalar gravitatsiyasi. Massa qancha katta boʻlsa, tortishish shuncha kuchli, ketish shuncha qiyin. Cambridge Analytica koʻrsatdi: bu gravitatsiya nafaqat foydalanuvchilarni, balki demokratik jarayonlarni ham oʻziga tortib ketishi mumkin.\n\nAynan shu mojaro Web2da tartibga solish yoki jarimalar bilan hal qilib boʻlmaydigan strukturaviy muammolar borligi haqidagi suhbatni tezlashtirdi. Boshqa arxitektura kerak. Maʼlumotlar platformalarga emas, foydalanuvchilarga tegishli boʻladigan arxitektura. Web3 aynan shu savolga javob bera boshladi.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["Web2", "tarmoq effektlari", "maʼlumotlar", "maxfiylik"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "kotler", "sceneIndex": 5, "type": "media", "shortTitle": "Kotler 3.0", "era": "2010", "lensWeight": {"chronology": 2, "attention": 3, "platform": 2, "economy": 3, "manipulation": 5}, "title": "Kotler 3.0: marketing maʼnolarni sota boshlagan payt", "insight": "Kotler qayd etdi: marketing 3.0 mahsulotni ham, foydani ham emas, maʼnolar va identifikatsiyani sotadi. Web2 bunga misli koʻrilmagan vositalar berdi va tushunish bilan manipulyatsiya oʻrtasidagi chegarani oʻchirdi.", "thesis": "Kotler qayd etdi: marketing 3.0 mahsulotni ham, foydani ham emas, maʼnolar va identifikatsiyani sotadi. Web2 bunga misli koʻrilmagan vositalar berdi va tushunish bilan manipulyatsiya oʻrtasidagi chegarani oʻchirdi.", "body": "## Biznes va inson munosabatlarining uch davri\n\nPhilip Kotler — XX asr marketingining asosiy nazariyotchilaridan biri, menejerlarning avlodlari oʻqigan darsliklar muallifi. 2010-yilda u «Marketing 3.0»ni yozdi va hammaning koʻz oʻngida sodir boʻlayotgan, ammo kam odam tizimli anglagan transformatsiyani qayd etdi.\n\nKotler marketingning uch avlodini «biz nimani va kimga sotamiz?» degan savolga uch xil javob sifatida tasvirladi.\n\nMarketing 1.0 — mahsulot davri. Zavod tovar ishlab chiqaradi, reklama deydi: «Sotib ol — u sifatli va kerakli». Isteʼmolchi funksional mahsulotga muhtoj ratsional xaridor sifatida qabul qilinadi. Mahsulot haqida oʻyla, inson haqida oʻylama.\n\nMarketing 2.0 — isteʼmolchi davri. Kompaniyalar xaridor psixologiyasini oʻrganishni, auditoriyalarni segmentlashni, takliflarni shaxsiylashtirishni boshladi. «Biz seni raqobatchilardan yaxshiroq tushunamiz — shuning uchun mahsulotimiz sen uchun». Isteʼmolchi ehtiyojlari bor emotsional mavjudot sifatida qabul qilinadi.\n\nMarketing 3.0 — qadriyatlar davri. Web2 davrida eng yaxshi mahsulotni sotadiganlar yoki isteʼmolchini yaxshiroq tushunadiganlar yutmadi. Maʼno va mansublik yaratadiganlar yutdi. Isteʼmolchi qadriyatlari, orzulari va ruhiy ehtiyojlari bor yaxlit shaxs sifatida qabul qilinadi.\n\n## Mahsulotdan identifikatsiyaga\n\nAniq misollarga qarang — ular har qanday nazariyadan yaxshiroq tushuntiradi.\n\nApple. Funksional jihatdan iPhone raqobatchilardan ikki baravar qimmat turadigan darajada yaxshiroq emas. Ammo Apple telefon sotmaydi. U didi yaxshi, ijodkor, bilimli inson identifikatsiyasini sotadi. iPhone sotib olganingda, muayyan qabilaga mansublikni sotib olasan. Aynan shuning uchun Apple muxlislari uni shunday ishtiyoq bilan himoya qiladi — ular oʻz identifikatsiyasini himoya qiladi.\n\nNike. Nike krossovkalari funksional jihatdan oʻnlab boshqa brendlar bilan solishtirish mumkin. Ammo Nike oʻzini yengish haqidagi hikoyani sotadi. Just Do It — oyoq kiyim sotib olish boʻyicha yoʻriqnoma emas. Bu falsafa. Nike sotib olganingda, sen koʻproqqa qodir ekaning haqidagi narrativni oʻzingga kiyib koʻrasan.\n\nStarbucks. Starbucks qahvasi obyektiv ravishda oʻrtacha kafedagi sifati oʻxshash ichimlikdan besh-sakkiz baravar qimmat turadi. Ammo Starbucks «uchinchi joy»ni — uy va ish orasidagi, boʻlish, ishlash, uchrashish mumkin boʻlgan makonni sotadi. Siz qahva uchun emas, muayyan hissi bor ijtimoiy makonni ijaraga olish uchun toʻlaysiz.\n\nKotler buni evolyutsiya deb koʻrgan: biznes nihoyat odamlar haqida yaxlit shaxslar sifatida oʻylay boshladi. Ammo bu taraqqiyotning teskari tomoni bor edi. «Insonni chuqurroq tushunish» va «insonni aniqroq manipulyatsiya qilish» oʻrtasidagi chegara juda nozik boʻlib chiqdi. Agar identifikatsiyani sotsang, eng intim narsa bilan ishlaysan. Sen xarid qilish qaroriga emas, inson oʻzini kim deb bilishiga taʼsir qilasan.\n\n> Kotler buni taraqqiyot deb atadi. Zuboff buni hokimiyat vositasi deb atadi. Ikkalasi ham haq — farq faqat qaysi nuqtayi nazardan qarashda.\n\nWeb2 davrida marketing 3.0 misli koʻrilmagan vositalarga ega boʻldi: milliardlab odamlarning xulq-atvori haqidagi maʼlumotlar, shaxsiylashtirish algoritmlari, psixotipgacha aniqlikdagi targetlangan reklama. Bu identifikatsiyani jarrohlik aniqligi bilan sotish imkonini berdi. Ammo oʻzidan bexabar identifikatsiyasi bilan savdo qilinayotgan insonni kim himoya qiladi?", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["marketing", "identiklik", "Web2", "psixologiya"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "verdict", "sceneIndex": 6, "type": "power", "shortTitle": "Web2 yakuni", "era": "≈2020", "lensWeight": {"chronology": 5, "attention": 4, "platform": 4, "economy": 3, "manipulation": 4}, "title": "Web2 yakuni: ovoz berildi, maʼlumotlar olib qoʻyildi", "insight": "Web2 milliardlab odamlarga ovoz berdi — evaziga maxfiylikni, maʼlumotlarga egalikni va umumiy axborot maydonini oldi. Bu shartlari hech kim eʼlon qilmagan bitim edi.", "thesis": "Web2 milliardlab odamlarga ovoz berdi — evaziga maxfiylikni, maʼlumotlarga egalikni va umumiy axborot maydonini oldi. Bu shartlari hech kim eʼlon qilmagan bitim edi.", "body": "## Web2 nima berdi\n\nWeb2 davriga hukm chiqarishdan oldin uning yutuqlarini halol tan olish kerak. Bu oqlash emas. Bu aqlli odamlar nega bu tizimni samimiy niyatlar bilan qurganini — va nima notoʻgʻri ketganini tushunishga urinish.\n\nWeb2 ilgari ovozi boʻlmagan milliardlab odamlarga ovoz berdi. Bu metafora emas. Kichik shahardagi jurnalist mahalliy amaldorlarning korrupsiyasini fosh qilishi mumkin — va uning materialini yuz minglab odam oʻqiydi. Faol davlat OAVni chetlab oʻtib, norozilik aksiyasini tashkil qilishi mumkin. Kichik biznes reklama budjetisiz butun dunyodan mijoz topishi mumkin. Bu haqiqiy va ulkan demokratlashuv.\n\nWeb2 masofani yoʻq qildi. Undan oldin jahon bilimlari bilan kichik shahardagi odam orasida toʻsiqlar bor edi: til, moliya, geografiya. YouTube istalgan darajadagi taʼlim kontentiga bepul kirish imkonini berdi. Wikipedia istalgan tildagi universal ensiklopediyani yaratdi. Google Translate til toʻsigʻini olib tashladi. Bu millionlab odamlarning imkoniyatlarini chindan ham oʻzgartirdi.\n\nWeb2 yangi bozorlar va yangi kasblarni yaratdi. Kontent-kreator, SMM-menejer, podkaster, strimer — bu kasblar yigirma yil oldin mavjud emas edi. Platformalar iqtisodiyoti anʼanaviy ish beruvchisi yoʻq odamlarga pul topish imkonini berdi: frilanserlar, hunarmandlar, rassomlar.\n\n## Web2 nima oldi\n\nAmmo Web2 olgan narsalar roʻyxati ham undan kam emas.\n\nMaxfiylik. Internetdagi har bir harakat endi yozib olinadi, tahlil qilinadi va sotiladi. Sen haqingda aynan nimalarni bilishlarini va bu kimga sotilishini aniq bilmaysan. Korporatsiyalar sen haqingda yaqinlaringdan ham koʻproq biladi.\n\nMaʼlumotlarga egalik. Sen kontent yaratasan — platforma unga egalik qiladi. Sen auditoriya qurasan — unga kirishni platforma nazorat qiladi. Algoritm oʻzgaradi — va yillar davomida qurgan hamma narsang bir kechada bugʻlanib ketishi mumkin.\n\nUmumiy axborot maydoni. Shaxsiylashtirish algoritmlari hamma oʻz axborot pufakchasida yashaydigan dunyoni yaratdi. Bir shahardagi odamlar voqelikning tubdan boshqa-boshqa versiyalarini koʻrishi mumkin — bu esa jamoatchilik muloqoti imkoniyatining oʻzini yemiradi.\n\nMadaniyatning oʻrtacha sifati. Keen bu haqda 2007-yildayoq ogohlantirgan: har kim tahrirsiz va faktlarni tekshirmasdan nashr qila olganida, ekspertiza qadrsizlanadi. Bu sifatli kontent qolmadi degani emas — u bor. Ammo uni shovqin ummonidan topish ancha qiyinlashdi.\n\nWeb2-dan chiqish soʻzda oddiy, amalda esa deyarli imkonsiz. Tarmoq effektlari shunday tortish kuchini yaratdiki, platformalardan «shunchaki ketish» ijtimoiy va professional hayotdan tushib qolishni anglatadi.\n\n> Web2 biz bilan shartlarini eʼlon qilmasdan bitim tuzdi. Ovoz — maʼlumotlar evaziga. Aloqa — maxfiylik evaziga. Bepul servis — eʼtibor evaziga.\n\nAynan shu ziddiyat — Web2 yaratgan qiymat va u olgan narx oʻrtasidagi ziddiyat — Web3 markazida turgan savolni tugʻdirdi: ovoz, aloqa va servisni boshqa birov sening maʼlumotlaring va eʼtiboringga egalik qilmasdan olish mumkinmi?", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https:/
