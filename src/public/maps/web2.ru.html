. Фотографы, которые продавали снимки агентствам. Писатели, которые жили на гонорары от средних тиражей. Это был средний класс культуры.\n\nWeb2 схлопнул это пространство. Алгоритмы создали структуру «победитель берёт всё»: несколько суперзвёзд собирают миллионы подписчиков и зарабатывают огромные деньги. Все остальные работают бесплатно — создавая контент для платформ, которые на этом контенте зарабатывают.\n\nМарк Андрессен в 2011 году написал триумфальную колонку «Software Is Eating the World» — программное обеспечение поглощает каждую индустрию, это неизбежно и хорошо. Такси превращается в Uber. Гостиницы — в Airbnb. Медиа — в Netflix. Музыка — в Spotify. Логика платформы везде одна: убери посредников, сведи продавца и покупателя напрямую, возьми комиссию с каждой транзакции. Заводов не нужно. Маржа огромная.\n\nАндрессен был прав в описании происходящего. Но умолчал о цене: вместе с посредниками исчезала инфраструктура, которая поддерживала тысячи профессионалов. Такси-компании были неэффективны — но в них работали люди. Музыкальные магазины были неудобны — но они платили музыкантам роялти.\n\n> Ланье сформулировал точно: бесплатный сервис — это не подарок. Это сделка, где тебе не объяснили условия. Ты платишь творчеством, данными и временем.\n\nЭта логика важна для понимания Web3. Одна из центральных идей децентрализованного интернета — вернуть творцам то, что платформы Web2 у них забрали. Токены, смарт-контракты, прямые платежи — это технические инструменты для решения проблемы, которую Ланье описал ещё в 2010 году.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["creators", "web2", "economics", "attention"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "galloway", "sceneIndex": 3, "type": "power", "shortTitle": "Четыре всадника", "era": "2017", "lensWeight": {"chronology": 3, "attention": 3, "platform": 5, "economy": 4, "manipulation": 3}, "title": "Гэллоуэй и четыре всадника: психология захвата", "insight": "Гэллоуэй объяснил: Amazon, Apple, Facebook, Google захватили не рынки, а базовые человеческие потребности — выживание, статус, принадлежность, знание.", "thesis": "Гэллоуэй объяснил: Amazon, Apple, Facebook, Google захватили не рынки, а базовые человеческие потребности — выживание, статус, принадлежность, знание.", "body": "## Почему именно эти четыре\n\nК середине 2010-х стало очевидно, что несколько технологических компаний захватили непропорционально большую долю мировой экономики. Amazon, Apple, Facebook, Google — на их долю приходилось больше рыночной капитализации, чем у большинства национальных экономик. Почему именно они? И почему так быстро?\n\nСкотт Гэллоуэй в книге «The Four» дал ответ, который удивляет своей нетехнологичностью. Он не говорит о лучших алгоритмах или большем бюджете на разработку. Он говорит о психологии. Каждая из четырёх компаний захватила одну из базовых человеческих потребностей — и стала её безальтернативным поставщиком.\n\nAmazon захватил потребность в выживании и накоплении. Это самый древний инстинкт — иметь запасы, получать товары быстро и надёжно. Amazon Prime обещает: всё, что тебе нужно, придёт завтра. Это не просто удобство доставки — это ощущение безопасности. Ты не останешься без необходимого.\n\nApple захватил потребность в статусе и сексуальной привлекательности. iPhone — это не телефон. Это сигнал другим людям: я принадлежу к определённому классу, у меня хороший вкус, я слежу за собой. Именно поэтому люди покупают новый iPhone, даже когда старый прекрасно работает. Не ради функций — ради сигнала.\n\nFacebook захватил потребность в любви и принадлежности. Самое глубокое человеческое желание — быть частью группы, быть принятым, быть любимым. Лайк в Facebook — это социальное одобрение, упакованное в интерфейс. «Друзья» — это слово не случайно. Платформа эксплуатирует самое уязвимое место человеческой психики.\n\nGoogle захватил потребность в знании и в боге — в источнике ответов на любой вопрос. «Погугли это» стало синонимом «узнай правду». Google знает ответ на любой вопрос — от рецепта борща до смысла жизни. Это беспрецедентная власть: быть источником истины для миллиардов людей.\n\n## Маркетинг нашёл новый язык\n\nФилип Котлер описал эволюцию маркетинга через три эпохи. Маркетинг 1.0 — это продукт: завод производит, реклама продаёт. Маркетинг 2.0 — это потребитель: изучи психологию, сегментируй аудиторию, персонализируй предложение. Маркетинг 3.0 — это ценности: в эпоху Web2 выигрывают те, кто продаёт не продукт и не пользу, а смысл и идентичность.\n\nApple не продаёт телефоны — продаёт идентичность творческого человека. Nike не продаёт кроссовки — продаёт историю о преодолении себя. Starbucks не продаёт кофе — продаёт «третье место», пространство между домом и работой. Именно поэтому Starbucks может брать пять евро за напиток, который можно сделать дома за пятьдесят центов.\n\nКотлер видел в этом прогресс: бизнес наконец начал относиться к людям как к целостным личностям. Но граница между «понять человека глубже» и «манипулировать человеком точнее» оказалась очень тонкой. Когда ты продаёшь не товар, а идентичность — ты работаешь с самым интимным: с тем, кем человек себя считает.\n\n> Гэллоуэй показал: четыре платформы захватили не рынки — они захватили базовые человеческие потребности. Это делает их почти незаменимыми.\n\nИменно это объясняет, почему сетевые эффекты в их случае столь мощны. Выйти из Facebook — значит потерять связь с друзьями. Перестать пользоваться Google — значит лишиться привычного источника ответов. Это не просто неудобство. Это социальная и психологическая стоимость.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["web2", "platforms", "psychology", "power"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "network", "sceneIndex": 4, "type": "economy", "shortTitle": "Сетевые эффекты", "era": "2018", "lensWeight": {"chronology": 4, "attention": 2, "platform": 5, "economy": 5, "manipulation": 2}, "title": "Сетевые эффекты: почему победителя не сменить", "insight": "Сетевые эффекты делают платформы почти непобедимыми. Cambridge Analytica показал предел: когда данные пользователей становятся инструментом влияния на выборы — это архитектурная проблема, не регуляторная.", "thesis": "Сетевые эффекты делают платформы почти непобедимыми. Cambridge Analytica показал предел: когда данные пользователей становятся инструментом влияния на выборы — это архитектурная проблема, не регуляторная.", "body": "## Гравитация платформ\n\nУ платформ есть одно свойство, которое делает их почти невозможными для конкуренции. Называется оно «сетевой эффект» — и это, пожалуй, самая важная экономическая концепция для понимания цифровой эпохи.\n\nСетевой эффект: ценность сети для каждого пользователя растёт по мере того, как в сеть приходят новые пользователи. Первый телефон в мире был абсолютно бесполезен — позвонить некому. Второй телефон создал одно соединение. Тысяча телефонов — почти полмиллиона возможных соединений. Миллион телефонов — около пятисот миллиардов. Ценность растёт не линейно, а экспоненциально.\n\nДля Facebook это означает следующее: платформа ценна именно потому, что там все твои друзья. Если туда приходит ещё один человек из твоего круга — Facebook становится чуть ценнее для тебя. Если все твои друзья уйдут — Facebook станет бесполезным, сколько бы денег в него ни инвестировали.\n\nЭто создаёт самоусиливающуюся петлю. Первая платформа, которая набирает критическую массу, становится почти непобедимой. Конкурент не может просто создать лучший продукт — нужно убедить одновременно перейти всех твоих друзей. А для этого нужно убедить их друзей. А для этого — их друзей. Это почти невозможно.\n\n## Cambridge Analytica и предел терпения\n\nК 2010-м годам стало очевидно: данные о поведении людей стоят огромных денег. Настолько огромных, что компании были готовы давать любые сервисы бесплатно — лишь бы получить доступ к данным. Но возник вопрос, на который Web2 так и не дал ответа: кому принадлежат эти данные?\n\nВ 2018 году разразился скандал с Cambridge Analytica. Facebook продал данные 87 миллионов пользователей — без их явного согласия — компании, которая использовала эти данные для политических манипуляций в нескольких странах. Предположительно, эти данные повлияли на исход президентских выборов в США и на референдум о Brexit в Великобритании.\n\nЭто переломило общественное восприятие. До 2018 года большинство людей воспринимали «данные в обмен на сервис» как нормальную сделку. После — стало ясно, что данные о поведении людей — это не просто коммерческий актив. Это инструмент власти над демократическими процессами. Это нечто, последствия утечки которого могут быть не просто неприятными, а политически катастрофическими.\n\nЭендрю Кин ещё в 2007 году предупреждал в «The Cult of the Amateur»: когда каждый может публиковать всё что угодно без редактуры и проверки фактов — экспертиза обесценивается, а качество информации падает. Cambridge Analytica показал, что манипуляция информацией в масштабе платформ Web2 может иметь последствия, которые Кин не мог предвидеть.\n\n> Сетевые эффекты — это гравитация платформ. Чем больше масса — тем сильнее притяжение, тем труднее уйти. Cambridge Analytica показал: эта гравитация может затягивать не только пользователей, но и демократические процессы.\n\nИменно этот скандал ускорил разговор о том, что у Web2 есть структурные проблемы, которые нельзя решить регулированием или штрафами. Нужна другая архитектура. Архитектура, где данные принадлежат пользователям, а не платформам. Именно этот вопрос начал отвечать Web3.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["web2", "network-effects", "data", "privacy"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "kotler", "sceneIndex": 5, "type": "media", "shortTitle": "Котлер 3.0", "era": "2010", "lensWeight": {"chronology": 2, "attention": 3, "platform": 2, "economy": 3, "manipulation": 5}, "title": "Котлер 3.0: когда маркетинг стал продавать смыслы", "insight": "Котлер зафиксировал: маркетинг 3.0 продаёт не продукт и не пользу, а смыслы и идентичность. Web2 дал этому беспрецедентные инструменты — и стёр границу между пониманием и манипуляцией.", "thesis": "Котлер зафиксировал: маркетинг 3.0 продаёт не продукт и не пользу, а смыслы и идентичность. Web2 дал этому беспрецедентные инструменты — и стёр границу между пониманием и манипуляцией.", "body": "## Три эпохи отношений бизнеса и человека\n\nФилип Котлер — один из главных теоретиков маркетинга XX века, автор учебников, по которым учились поколения менеджеров. В 2010 году он написал «Маркетинг 3.0» — и зафиксировал трансформацию, которая происходила у всех на глазах, но которую мало кто осмыслял системно.\n\nКотлер описал три поколения маркетинга как три разных ответа на вопрос «что мы продаём и кому?»\n\nМаркетинг 1.0 — эпоха продукта. Завод производит товар, реклама говорит: «Купи — он качественный и нужный». Потребитель воспринимается как рациональный покупатель, которому нужен функциональный продукт. Думай о продукте, не думай о человеке.\n\nМаркетинг 2.0 — эпоха потребителя. Компании начали изучать психологию покупателя, сегментировать аудитории, персонализировать предложения. «Мы понимаем тебя лучше, чем конкуренты — и поэтому наш продукт для тебя». Потребитель воспринимается как эмоциональное существо с потребностями.\n\nМаркетинг 3.0 — эпоха ценностей. В эпоху Web2 выиграли не те, кто продаёт лучший продукт или лучше понимает потребителя. Выиграли те, кто создаёт смысл и принадлежность. Потребитель воспринимается как целостная личность с ценностями, мечтами и духовными потребностями.\n\n## От продукта к идентичности\n\nПосмотри на конкретные примеры — они объясняют лучше любой теории.\n\nApple. Функционально iPhone не лучше конкурентов настолько, чтобы стоить вдвое дороже. Но Apple продаёт не телефон. Он продаёт идентичность творческого, образованного человека с хорошим вкусом. Покупая iPhone, ты покупаешь принадлежность к определённому племени. Именно поэтому фанаты Apple защищают его с такой страстью — они защищают свою идентичность.\n\nNike. Кроссовки Nike функционально сопоставимы с десятками других брендов. Но Nike продаёт историю о преодолении себя. Just Do It — это не инструкция по покупке обуви. Это философия. Покупая Nike, ты примеряешь нарратив о том, что способен на большее.\n\nStarbucks. Кофе Starbucks объективно стоит в пять-восемь раз дороже, чем сопоставимый по качеству напиток в среднем кафе. Но Starbucks продаёт «третье место» — пространство между домом и работой, где можно побыть, поработать, встретиться. Вы платите не за кофе, вы платите за аренду социального пространства с определённым ощущением.\n\nКотлер видел в этом эволюцию: бизнес наконец начал думать о людях как о целостных личностях. Но у этого прогресса была обратная сторона. Граница между «понять человека глубже» и «манипулировать человеком точнее» оказалась очень тонкой. Если ты продаёшь идентичность — ты работаешь с самым интимным. Ты влияешь не на решение о покупке, а на то, кем человек себя считает.\n\n> Котлер назвал это прогрессом. Зубофф назвала это инструментом власти. Обе правы — разница только в том, с чьей точки зрения смотреть.\n\nВ эпоху Web2 маркетинг 3.0 получил беспрецедентные инструменты: данные о поведении миллиардов людей, алгоритмы персонализации, таргетированная реклама с точностью до психотипа. Это позволило продавать идентичность с хирургической точностью. Но кто защищает человека, чьей идентичностью торгуют без его ведома?", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["marketing", "identity", "web2", "psychology"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "verdict", "sceneIndex": 6, "type": "power", "shortTitle": "Итог Web2", "era": "≈2020", "lensWeight": {"chronology": 5, "attention": 4, "platform": 4, "economy": 3, "manipulation": 4}, "title": "Итог Web2: голос дали, данные забрали", "insight": "Web2 дал голос миллиардам — и взял взамен приватность, собственность на данные и общее информационное пространство. Это сделка, условий которой никто не объявлял.", "thesis": "Web2 дал голос миллиардам — и взял взамен приватность, собственность на данные и общее информационное пространство. Это сделка, условий которой никто не объявлял.", "body": "## Что Web2 дал\n\nПрежде чем ставить приговор эпохе Web2 — стоит честно признать её достижения. Это не апологетика. Это попытка понять, почему умные люди строили эту систему с искренними намерениями — и что пошло не так.\n\nWeb2 дал голос миллиардам людей, у которых его раньше не было. Это не метафора. Журналист из маленького города может разоблачить коррупцию местных чиновников — и его материал прочитают сотни тысяч. Активист может организовать протест, минуя государственные СМИ. Малый бизнес может найти клиентов по всему миру без рекламного бюджета. Это реальная и огромная демократизация.\n\nWeb2 убил дистанцию. До него между мировыми знаниями и человеком в маленьком городе стояли барьеры: языковые, финансовые, географические. YouTube дал бесплатный доступ к образовательному контенту любого уровня. Wikipedia создала универсальную энциклопедию на любом языке. Google Translate убрал языковой барьер. Это реально изменило возможности миллионов людей.\n\nWeb2 создал новые рынки и новые профессии. Контент-криэйтор, SMM-менеджер, подкастер, стример — этих профессий не существовало двадцать лет назад. Экономика платформ дала возможность зарабатывать людям, у которых нет традиционного работодателя: фрилансерам, ремесленникам, художникам.\n\n## Что Web2 взял\n\nНо список того, что взял Web2, не менее длинный.\n\nПриватность. Каждое действие в интернете теперь записано, проанализировано и продано. Ты не знаешь точно, что о тебе знают и кому это продают. Корпорации знают о тебе больше, чем твои близкие.\n\nСобственность на данные. Ты создаёшь контент — платформа им владеет. Ты строишь аудиторию — платформа контролирует доступ к ней. Алгоритм меняется — и всё, что ты строил годами, может испариться в одночасье.\n\nОбщее информационное пространство. Алгоритмы персонализации создали мир, где все живут в своих информационных пузырях. Люди в одном городе могут видеть принципиально разные версии реальности — и это разрушает саму возможность общественного диалога.\n\nСреднее качество культуры. Кин предупреждал об этом ещё в 2007-м: когда каждый может публиковать без редактуры и проверки фактов, экспертиза обесценивается. Это не значит, что не осталось качественного контента — он есть. Но найти его в океане шума стало значительно труднее.\n\nВыход из Web2 прост на словах и почти невозможен на практике. Сетевые эффекты создали такую гравитацию, что «просто уйти» с платформ означает выпасть из социальной и профессиональной жизни.\n\n> Web2 заключил с нами сделку, не объявив её условий. Голос — взамен на данные. Связь — взамен на приватность. Бесплатный сервис — взамен на внимание.\n\nИменно это противоречие — между ценностью, которую Web2 создал, и ценой, которую он взял — породило вопрос, который стоит в центре Web3: а можно ли получить голос, связь и сервис без того, чтобы кто-то другой владел твоими данными и вниманием?", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["web2", "data", "privacy", "platforms"], "x": 265.5, "y": 258.0, "angDeg": 218.6}], "edges": [{"from": "city", "to": "attention", "label": "голос стал сырьём", "lenses": ["chronology", "attention"]}, {"from": "attention", "to": "lanier", "label": "ты и есть продукт", "lenses": ["attention", "manipulation"]}, {"from": "attention", "to": "galloway", "label": "внимание — рычаг власти", "lenses": ["attention", "platform"]}, {"from": "galloway", "to": "network", "label": "захват закрепляется эффектами", "lenses": ["platform", "economy"]}, {"from": "network", "to": "verdict", "label": "победителя не сменить", "lenses": ["economy", "platform"]}, {"from": "lanier", "to": "kotler", "label": "от продукта к смыслам", "lenses": ["manipulation"]}, {"from": "kotler", "to": "verdict", "label": "манипуляция как норма", "lenses": ["manipulation", "media"]}, {"from": "city", "to": "galloway", "label": "город захватили четверо", "lenses": ["platform", "chronology"]}, {"from": "attention", "to": "verdict", "label": "сделка без объявленных условий", "lenses": ["attention", "chronology"]}, {"from": "network", "to": "kotler", "label": "масштаб усиливает влияние", "lenses": ["economy", "manipulation"]}]}, "en": {"chapter": {"key": "web2", "title": "The internet became a city", "lede": "You were given a voice so your attention could be taken. How Web2 turned the library into a monetization machine.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=web2", "centralIdea": "You were given a voice so your attention could be taken", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Chronology", "accent": "#7dd3fc", "description": "From the birth of Web2 to Cambridge Analytica: how the “city” became a machine."}, {"id": "attention", "label": "Attention", "accent": "#fbbf24", "description": "Simon and Zuboff: human behavior as raw material for a new kind of power."}, {"id": "platform", "label": "Platform power", "accent": "#f87171", "description": "Galloway and the Four Horsemen: capturing not markets, but basic needs."}, {"id": "economy", "label": "Economy", "accent": "#a78bfa", "description": "Network effects and “winner takes all”: why a platform is hard to replace."}, {"id": "manipulation", "label": "Manipulation", "accent": "#34d399", "description": "Kotler 3.0 and Lanier: selling meanings, with the boundary between understanding and influence erased."}], "nodes": [{"id": "city", "sceneIndex": 0, "type": "media", "shortTitle": "City", "era": "2004→", "lensWeight": {"chronology": 5, "attention": 3, "platform": 4, "economy": 3, "manipulation": 2}, "title": "The Birth of Web2: the internet became a city", "insight": "Web2 turned the internet from a library into a city — it gave everyone a voice, but built that voice into a machine for monetizing attention.", "thesis": "Web2 turned the internet from a library into a city — it gave everyone a voice, but built that voice into a machine for monetizing attention.", "body": "## A term coined at a conference\n\nIn 2004, technical publisher Tim O'Reilly was holding a brainstorming session with colleagues. It was a strange moment: the dot-com bubble had burst in 2000, thousands of companies had gone bankrupt, and investors had lost hundreds of billions of dollars. The media wrote that internet business had turned out to be an illusion.\n\nBut O'Reilly looked at the data and saw something else. Traffic was growing. The number of users was rising. The companies that survived — Google, Amazon, eBay — had not merely survived; they had accelerated. Something had changed in the very nature of how the internet worked. That change needed a name.\n\nThat is how the term “Web 2.0” appeared. In a 2005 article, O'Reilly described its features: the web as a platform, not as a collection of sites. Users as co-creators of value, not only consumers. Data as the main asset. Network effects as the engine of growth — the more people are in the network, the more valuable the network becomes for every participant.\n\nIt sounded like a technical manifesto. In reality, it was a description of a new business model whose consequences O'Reilly did not foresee at the time.\n\n## From library to city\n\nBefore Web2, the internet was a library. You came in, read, and left. Sites existed separately from one another, like books on shelves. Between you and information there was no intermediary — only an address and a browser.\n\nWeb2 turned the internet into a city. Squares appeared — Facebook, YouTube, Twitter — where people not only read, but spoke, argued, showed themselves, and built reputations. Markets appeared — Amazon, eBay — where people bought and sold directly with one another. Navigators appeared — Google Search — showing where to go in this city.\n\nFor the first time, an ordinary person without technical knowledge could not only consume the internet, but create it. Starting a blog took five minutes on WordPress. Uploading a video took one button on YouTube. Writing a review, giving a rating, sharing a photo — all of this became available to everyone. The technical barrier that had separated readers from authors in Web1 collapsed.\n\nThis was a real revolution of participation. And it truly changed the world. Bloggers exposed corruption in places professional journalists could not reach. Citizen journalists filmed events ignored by official media. Activists organized protests through social networks faster than authorities could react. The Arab Spring. #MeToo. All of this became possible because of Web2.\n\nBut this revolution had a price. And nobody read it in the user agreement.\n\n> Web2 gave everyone a voice — and built that voice into a machine that earned money from every word it spoke.\n\nThe paradox of Web2 is that it was an honest exchange — only no one explained its terms out loud. You get a free service. In return: your attention, your data, your behavior. The problem was not that the exchange existed. The problem was that it was invisible.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["Web2", "platforms", "history", "media"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "attention", "sceneIndex": 1, "type": "power", "shortTitle": "Attention", "era": "1971 · 2019", "lensWeight": {"chronology": 3, "attention": 5, "platform": 3, "economy": 3, "manipulation": 3}, "title": "The Attention Economy: the scarcity no one noticed", "insight": "Simon predicted the attention economy in 1971. Zuboff recorded that human behavior had become raw material — and this is a new type of power that did not exist before.", "thesis": "Simon predicted the attention economy in 1971. Zuboff recorded that human behavior had become raw material — and this is a new type of power that did not exist before.", "body": "## A Nobel laureate warned about it in 1971\n\nIn 1971, Nobel laureate in economics Herbert Simon wrote an article that almost no one noticed. Its main idea was simple and ironclad: when information becomes abundant, the scarce resource is not information, but attention.\n\nSimon called this the “attention economy” and formulated it thirty years before Facebook. The logic is elementary: if you have a million sites, and a person has only twenty-four hours in a day, the value is not in content. The value is in access to a person's eyes and ears. Whoever controls attention controls the economy.\n\nGoogle understood this first — and built an empire on it. The search engine was free. But every time you searched for something, Google learned something new about you: what worries you, what you want to buy, what you think about at night. Google sold this knowledge to advertisers. You did not pay with money — you paid with attention and data.\n\nIn 2005, John Battelle wrote the book “The Search” — the story of Google as the story of a new power. His observation: a search engine is not just a tool for finding things. It is the infrastructure through which a person's entire information space passes. Whoever controls search decides what exists for people and what does not. Which site they will find, and which will remain invisible. This is power comparable to the power of publishers and television corporations of the past — only on a different scale.\n\n## Surveillance capitalism: the human being as raw material\n\nShoshana Zuboff spent ten years researching what happens to people's data on the internet. In 2019, she published the book “The Age of Surveillance Capitalism” — and introduced the term that most precisely describes the Web2 business model.\n\nHer argument: Google and Facebook discovered a new kind of raw material. Not oil, not coal — human behavior. Every click, every pause while reading, every route through the city, every second spent on a specific page — all of this is collected, analyzed, and turned into what Zuboff calls “behavioral surplus.” This surplus is sold to advertisers as a tool for predicting and influencing people's future actions.\n\nZuboff emphasizes the fundamental difference from traditional advertising. Advertising in the twentieth century said: “Buy this product — it is good.” Surveillance capitalism says: “We know that you will buy this — before you have even decided it. And we can change the probability of that decision.” This is not persuasion. It is behavior modification through an environment the person does not suspect.\n\nThe concrete scale: by 2023, the digital advertising market had exceeded 600 billion dollars a year. That is more than the GDP of most countries in the world. This entire sum is the monetization of human attention and behavioral data.\n\n> Simon warned in 1971: the main scarcity of the information age is attention. Zuboff recorded in 2019: that attention became the planet's main raw material.\n\nBetween these two observations lie forty-eight years and the largest redistribution of power in the history of media.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["attention", "surveillance capitalism", "Web2", "power"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "lanier", "sceneIndex": 2, "type": "privacy", "shortTitle": "Lanier", "era": "2010", "lensWeight": {"chronology": 3, "attention": 4, "platform": 3, "economy": 4, "manipulation": 4}, "title": "Lanier: you are not a gadget, you are the product", "insight": "Lanier showed that Web2 destroyed the creative middle class by creating a “winner takes all” structure — a few superstars and millions of creators working for platforms for free.", "thesis": "Lanier showed that Web2 destroyed the creative middle class by creating a “winner takes all” structure — a few superstars and millions of creators working for platforms for free.", "body": "## A voice from inside the industry\n\nJaron Lanier is an unusual critic of platforms. He is not a journalist or an outsider academic. He is one of the pioneers of virtual reality, a person who in the 1980s worked at the very center of the technological revolution — in Silicon Valley, side by side with those who were building this industry. That is exactly why his criticism is so persuasive: he knows the system from the inside.\n\nIn 2010, he wrote the book “You Are Not a Gadget” — a manifesto of disappointment. The main thesis: Web2 platforms are built on a fundamental lie. They say they give you a service for free. In reality, they take something valuable from you — your creativity, your data, your time, your individuality — and monetize it without sharing anything substantial with you.\n\nLanier gives concrete examples that are hard to dismiss. A musician records a song, uploads it to YouTube — and receives a few cents per thousand listens. YouTube earns much more from advertising around that song. A journalist writes an article that is shared on Facebook one hundred thousand times — and receives zero. Facebook earns money from the traffic that article generates. A photographer takes images that Instagram uses to train image recognition algorithms — without permission and without payment.\n\n## The disappearance of the creative middle class\n\nLanier described an economic consequence that few people saw in 2010, but that became obvious by the 2020s: Web2 destroyed the creative middle class.\n\nEarlier, between stardom and complete obscurity, there was an entire space — professional musicians who made a living from concerts and album sales. Journalists who fed families with articles for local newspapers. Photographers who sold images to agencies. Writers who lived on royalties from mid-sized print runs. This was the middle class of culture.\n\nWeb2 collapsed this space. Algorithms created a “winner takes all” structure: a few superstars gather millions of followers and earn huge money. Everyone else works for free — creating content for platforms that earn money from that content.\n\nIn 2011, Marc Andreessen wrote the triumphant column “Software Is Eating the World” — software is consuming every industry, and this is inevitable and good. Taxis turn into Uber. Hotels into Airbnb. Media into Netflix. Music into Spotify. The platform logic is the same everywhere: remove intermediaries, bring seller and buyer together directly, take a commission from every transaction. No factories needed. The margin is enormous.\n\nAndreessen was right in describing what was happening. But he left out the price: along with intermediaries, the infrastructure that supported thousands of professionals was disappearing. Taxi companies were inefficient — but people worked in them. Music stores were inconvenient — but they paid musicians royalties.\n\n> Lanier put it precisely: a free service is not a gift. It is a deal whose terms were never explained to you. You pay with creativity, data, and time.\n\nThis logic matters for understanding Web3. One of the central ideas of the decentralized internet is to return to creators what Web2 platforms took from them. Tokens, smart contracts, direct payments — these are technical tools for solving the problem Lanier described back in 2010.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["creators", "Web2", "economics", "attention"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "galloway", "sceneIndex": 3, "type": "power", "shortTitle": "Four Horsemen", "era": "2017", "lensWeight": {"chronology": 3, "attention": 3, "platform": 5, "economy": 4, "manipulation": 3}, "title": "Galloway and the Four Horsemen: the psychology of capture", "insight": "Galloway explained: Amazon, Apple, Facebook, Google captured not markets, but basic human needs: survival, status, belonging and knowledge.", "thesis": "Galloway explained: Amazon, Apple, Facebook, Google captured not markets, but basic human needs: survival, status, belonging and knowledge.", "body": "## Why these four specifically\n\nBy the mid-2010s, it had become clear that several technology companies had captured a disproportionately large share of the global economy. Amazon, Apple, Facebook, Google: together, they accounted for more market capitalization than most national economies. Why them? And why so quickly?\n\nIn *The Four*, Scott Galloway offered an answer that is striking precisely because it is not technological. He does not talk about better algorithms or a larger development budget. He talks about psychology. Each of the four companies captured one basic human need and became its provider without a real alternative.\n\nAmazon captured the need for survival and accumulation. This is the oldest instinct: to have reserves, to receive goods quickly and reliably. Amazon Prime promises: everything you need will arrive tomorrow. This is not just delivery convenience; it is a feeling of safety. You will not be left without what you need.\n\nApple captured the need for status and sexual attractiveness. The iPhone is not a phone. It is a signal to other people: I belong to a certain class, I have good taste, I take care of myself. That is exactly why people buy a new iPhone even when the old one works perfectly. Not for the features, but for the signal.\n\nFacebook captured the need for love and belonging. The deepest human desire is to be part of a group, to be accepted, to be loved. A Facebook like is social approval packaged into an interface. The word \"friends\" is not accidental. The platform exploits the most vulnerable place in the human psyche.\n\nGoogle captured the need for knowledge and for God: a source of answers to any question. \"Google it\" became a synonym for \"find out the truth.\" Google knows the answer to any question, from a borscht recipe to the meaning of life. This is unprecedented power: to be the source of truth for billions of people.\n\n## Marketing found a new language\n\nPhilip Kotler described the evolution of marketing through three eras. Marketing 1.0 is the product: the factory produces, advertising sells. Marketing 2.0 is the consumer: study psychology, segment the audience, personalize the offer. Marketing 3.0 is values: in the Web2 era, the winners are those who sell not a product and not utility, but meaning and identity.\n\nApple does not sell phones; it sells the identity of a creative person. Nike does not sell sneakers; it sells a story about overcoming yourself. Starbucks does not sell coffee; it sells the \"third place,\" the space between home and work. That is exactly why Starbucks can charge five euros for a drink that can be made at home for fifty cents.\n\nKotler saw this as progress: business had finally begun treating people as whole persons. But the boundary between \"understanding a person more deeply\" and \"manipulating a person more precisely\" turned out to be very thin. When you sell not a product, but an identity, you work with the most intimate thing: with who a person believes they are.\n\n> Galloway showed that the four platforms captured not markets, but basic human needs. This makes them almost irreplaceable.\n\nThis is exactly what explains why network effects are so powerful in their case. Leaving Facebook means losing connection with friends. Stopping using Google means losing a familiar source of answers. This is not just inconvenience. It is a social and psychological cost.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["Web2", "platforms", "psychology", "power"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "network", "sceneIndex": 4, "type": "economy", "shortTitle": "Network effects", "era": "2018", "lensWeight": {"chronology": 4, "attention": 2, "platform": 5, "economy": 5, "manipulation": 2}, "title": "Network effects: why the winner cannot be replaced", "insight": "Network effects make platforms almost unbeatable. Cambridge Analytica showed the limit: when user data becomes a tool for influencing elections, this is an architectural problem, not a regulatory one.", "thesis": "Network effects make platforms almost unbeatable. Cambridge Analytica showed the limit: when user data becomes a tool for influencing elections, this is an architectural problem, not a regulatory one.", "body": "## The gravity of platforms\n\nPlatforms have one property that makes competing with them almost impossible. It is called the \"network effect\" and it is probably the most important economic concept for understanding the digital era.\n\nNetwork effect: the value of a network for each user grows as new users join the network. The first telephone in the world was completely useless: there was no one to call. The second telephone created one connection. A thousand telephones created almost half a million possible connections. A million telephones created about five hundred billion. Value grows not linearly, but exponentially.\n\nFor Facebook, this means the following: the platform is valuable precisely because all your friends are there. If one more person from your circle joins it, Facebook becomes slightly more valuable for you. If all your friends leave, Facebook becomes useless, no matter how much money is invested in it.\n\nThis creates a self-reinforcing loop. The first platform to reach critical mass becomes almost unbeatable. A competitor cannot simply create a better product: it has to persuade all your friends to move at the same time. And to do that, it has to persuade their friends. And to do that, their friends. This is almost impossible.\n\n## Cambridge Analytica and the limit of tolerance\n\nBy the 2010s, it had become obvious that data about people's behavior was worth enormous money. So enormous that companies were willing to provide any services for free, as long as they could get access to the data. But a question emerged that Web2 never answered: who owns this data?\n\nIn 2018, the Cambridge Analytica scandal broke. Facebook sold the data of 87 million users, without their explicit consent, to a company that used it for political manipulation in several countries. Allegedly, this data influenced the outcome of the U.S. presidential election and the Brexit referendum in the United Kingdom.\n\nThis broke public perception. Before 2018, most people saw \"data in exchange for service\" as a normal deal. Afterward, it became clear that data about people's behavior is not just a commercial asset. It is an instrument of power over democratic processes. It is something whose leakage can have consequences that are not merely unpleasant, but politically catastrophic.\n\nAndrew Keen had warned back in 2007 in *The Cult of the Amateur*: when anyone can publish anything without editing or fact-checking, expertise is devalued and the quality of information falls. Cambridge Analytica showed that manipulation of information at the scale of Web2 platforms can have consequences Keen could not have foreseen.\n\n> Network effects are the gravity of platforms. The greater the mass, the stronger the pull and the harder it is to leave. Cambridge Analytica showed that this gravity can pull in not only users, but democratic processes too.\n\nThis scandal accelerated the conversation about Web2 having structural problems that cannot be solved with regulation or fines. A different architecture is needed. An architecture where data belongs to users, not platforms. Web3 began to answer exactly this question.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["Web2", "network effects", "data", "privacy"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "kotler", "sceneIndex": 5, "type": "media", "shortTitle": "Kotler 3.0", "era": "2010", "lensWeight": {"chronology": 2, "attention": 3, "platform": 2, "economy": 3, "manipulation": 5}, "title": "Kotler 3.0: when marketing began selling meanings", "insight": "Kotler captured this: Marketing 3.0 sells not a product and not utility, but meanings and identity. Web2 gave it unprecedented tools and erased the boundary between understanding and manipulation.", "thesis": "Kotler captured this: Marketing 3.0 sells not a product and not utility, but meanings and identity. Web2 gave it unprecedented tools and erased the boundary between understanding and manipulation.", "body": "## Three eras of the relationship between business and the human being\n\nPhilip Kotler is one of the main marketing theorists of the twentieth century, the author of textbooks used by generations of managers. In 2010, he wrote *Marketing 3.0* and captured a transformation that was happening in front of everyone, but that few had understood systematically.\n\nKotler described three generations of marketing as three different answers to the question \"what do we sell, and to whom?\"\n\nMarketing 1.0 is the era of the product. The factory produces the goods, advertising says: \"Buy it; it is high quality and necessary.\" The consumer is seen as a rational buyer who needs a functional product. Think about the product, do not think about the person.\n\nMarketing 2.0 is the era of the consumer. Companies began studying buyer psychology, segmenting audiences, personalizing offers. \"We understand you better than competitors do, and therefore our product is for you.\" The consumer is seen as an emotional being with needs.\n\nMarketing 3.0 is the era of values. In the Web2 era, the winners were not those who sold the best product or understood the consumer better. The winners were those who created meaning and belonging. The consumer is seen as a whole person with values, dreams and spiritual needs.\n\n## From product to identity\n\nLook at concrete examples: they explain better than any theory.\n\nApple. Functionally, the iPhone is not so much better than competitors that it should cost twice as much. But Apple does not sell a phone. It sells the identity of a creative, educated person with good taste. When you buy an iPhone, you buy belonging to a certain tribe. That is exactly why Apple fans defend it with such passion: they are defending their identity.\n\nNike. Nike sneakers are functionally comparable to dozens of other brands. But Nike sells a story about overcoming yourself. Just Do It is not an instruction to buy shoes. It is a philosophy. When you buy Nike, you try on a narrative that you are capable of more.\n\nStarbucks. Starbucks coffee objectively costs five to eight times more than a drink of comparable quality in an average cafe. But Starbucks sells the \"third place\": the space between home and work where you can spend time, work, meet someone. You are not paying for coffee; you are paying to rent a social space with a particular feeling.\n\nKotler saw this as evolution: business had finally begun thinking about people as whole persons. But this progress had a reverse side. The boundary between \"understanding a person more deeply\" and \"manipulating a person more precisely\" turned out to be very thin. If you sell identity, you work with the most intimate thing. You influence not the purchase decision, but who a person believes they are.\n\n> Kotler called this progress. Zuboff called it an instrument of power. Both are right; the only difference is whose point of view you take.\n\nIn the Web2 era, Marketing 3.0 received unprecedented tools: data about the behavior of billions of people, personalization algorithms, targeted advertising precise down to psychotype. This made it possible to sell identity with surgical precision. But who protects the person whose identity is traded without their knowledge?", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["marketing", "identity", "Web2", "psychology"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "verdict", "sceneIndex": 6, "type": "power", "shortTitle": "Web2 outcome", "era": "≈2020", "lensWeight": {"chronology": 5, "attention": 4, "platform": 4, "economy": 3, "manipulation": 4}, "title": "The Result of Web2: They Gave Us a Voice, Took Our Data", "insight": "Web2 gave billions a voice — and took privacy, ownership of data and a shared information space in return. It was a deal whose terms no one announced.", "thesis": "Web2 gave billions a voice — and took privacy, ownership of data and a shared information space in return. It was a deal whose terms no one announced.", "body": "## What Web2 Gave\n\nBefore passing judgment on the Web2 era, it is worth honestly acknowledging its achievements. This is not apologetics. It is an attempt to understand why smart people built this system with sincere intentions — and what went wrong.\n\nWeb2 gave a voice to billions of people who did not have one before. This is not a metaphor. A journalist from a small town can expose corruption among local officials — and hundreds of thousands will read the story. An activist can organize a protest while bypassing state media. A small business can find customers around the world without an advertising budget. This is real and enormous democratization.\n\nWeb2 killed distance. Before it, barriers stood between global knowledge and a person in a small town: linguistic, financial, geographic. YouTube gave free access to educational content at any level. Wikipedia created a universal encyclopedia in any language. Google Translate removed the language barrier. This truly changed the opportunities available to millions of people.\n\nWeb2 created new markets and new professions. Content creator, SMM manager, podcaster, streamer — these professions did not exist twenty years ago. The platform economy gave people without a traditional employer a way to earn money: freelancers, craftspeople, artists.\n\n## What Web2 Took\n\nBut the list of what Web2 took is no shorter.\n\nPrivacy. Every action on the internet is now recorded, analyzed and sold. You do not know exactly what is known about you or who it is sold to. Corporations know more about you than the people close to you do.\n\nOwnership of data. You create content — the platform owns it. You build an audience — the platform controls access to it. The algorithm changes — and everything you built for years can evaporate overnight.\n\nA shared information space. Personalization algorithms created a world where everyone lives in their own information bubble. People in the same city can see fundamentally different versions of reality — and this destroys the very possibility of public dialogue.\n\nThe average quality of culture. Keen warned about this back in 2007: when everyone can publish without editing or fact-checking, expertise is devalued. That does not mean quality content is gone — it exists. But finding it in an ocean of noise has become much harder.\n\nLeaving Web2 is simple in words and almost impossible in practice. Network effects have created such gravity that to “just leave” the platforms means dropping out of social and professional life.\n\n> Web2 made a deal with us without announcing its terms. A voice — in exchange for data. Connection — in exchange for privacy. A free service — in exchange for attention.\n\nThis very contradiction — between the value Web2 created and the price it took — gave rise to the question at the center of Web3: can we get voice, connection and service without someone else owning our data and attention?", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["Web2", "data", "privacy", "platforms"], "x": 265.5, "y": 258.0, "angDeg": 218.6}], "edges": [{"from": "city", "to": "attention", "label": "the voice became raw material", "lenses": ["chronology", "attention"]}, {"from": "attention", "to": "lanier", "label": "you are the product", "lenses": ["attention", "manipulation"]}, {"from": "attention", "to": "galloway", "label": "attention is a lever of power", "lenses": ["attention", "platform"]}, {"from": "galloway", "to": "network", "label": "capture is locked in by effects", "lenses": ["platform", "economy"]}, {"from": "network", "to": "verdict", "label": "the winner cannot be replaced", "lenses": ["economy", "platform"]}, {"from": "lanier", "to": "kotler", "label": "from product to meanings", "lenses": ["manipulation"]}, {"from": "kotler", "to": "verdict", "label": "manipulation as the norm", "lenses": ["manipulation", "media"]}, {"from": "city", "to": "galloway", "label": "four captured the city", "lenses": ["platform", "chronology"]}, {"from": "attention",
