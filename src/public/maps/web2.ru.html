<script>
const CHAPTER_DATA = {"chapter": {"key": "web2", "title": "Интернет стал городом", "lede": "Тебе дали голос — чтобы забрать твоё внимание. Как Web2 превратил библиотеку в машину монетизации.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=web2", "centralIdea": "Тебе дали голос, чтобы забрать твоё внимание", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Хронология", "accent": "#7dd3fc", "description": "От рождения Web2 до Cambridge Analytica — как «город» стал машиной."}, {"id": "attention", "label": "Внимание", "accent": "#fbbf24", "description": "Саймон и Зубофф: человеческое поведение как сырьё нового типа власти."}, {"id": "platform", "label": "Власть платформ", "accent": "#f87171", "description": "Гэллоуэй и четыре всадника: захват не рынков, а базовых потребностей."}, {"id": "economy", "label": "Экономика", "accent": "#a78bfa", "description": "Сетевые эффекты и «победитель берёт всё»: почему платформу не сменить."}, {"id": "manipulation", "label": "Манипуляция", "accent": "#34d399", "description": "Котлер 3.0 и Ланье: продажа смыслов, стёртая граница понимания и влияния."}], "nodes": [{"id": "city", "sceneIndex": 0, "type": "media", "shortTitle": "Город", "era": "2004→", "lensWeight": {"chronology": 5, "attention": 3, "platform": 4, "economy": 3, "manipulation": 2}, "title": "Рождение Web2: интернет стал городом", "insight": "Web2 превратил интернет из библиотеки в город — дал голос каждому, но встроил этот голос в машину монетизации внимания.", "thesis": "Web2 превратил интернет из библиотеки в город — дал голос каждому, но встроил этот голос в машину монетизации внимания.", "body": "## Термин, придуманный на конференции\n\nВ 2004 году издатель технической литературы Тим О'Рейли проводил мозговой штурм с коллегами. Момент был странный: пузырь доткомов лопнул в 2000-м, тысячи компаний обанкротились, инвесторы потеряли сотни миллиардов долларов. В медиа писали, что интернет-бизнес оказался иллюзией.\n\nНо О'Рейли смотрел на данные и видел другое. Трафик рос. Пользователей становилось больше. Выжившие компании — Google, Amazon, eBay — не просто выжили, они ускорились. Что-то изменилось в самой природе того, как работает интернет. Это изменение нужно было назвать.\n\nТак появился термин «Web 2.0». В статье 2005 года О'Рейли сформулировал его признаки: веб как платформа, а не как набор сайтов. Пользователи как со-создатели ценности, а не только потребители. Данные как главный актив. Сетевые эффекты как двигатель роста — чем больше людей в сети, тем ценнее сеть для каждого участника.\n\nЭто звучало как технический манифест. На деле это было описание новой бизнес-модели, последствия которой О'Рейли тогда не предвидел.\n\n## Из библиотеки в город\n\nДо Web2 интернет был библиотекой. Ты приходил, читал, уходил. Сайты существовали отдельно друг от друга, как книги на полках. Между тобой и информацией не было посредника — только адрес и браузер.\n\nWeb2 превратил интернет в город. Появились площади — Facebook, YouTube, Twitter — где люди не просто читали, но говорили, спорили, показывали себя, строили репутацию. Появились рынки — Amazon, eBay — где покупали и продавали напрямую между собой. Появились навигаторы — Google поиск — которые показывали, куда идти в этом городе.\n\nВпервые обычный человек без технических знаний мог не только потреблять интернет, но и создавать его. Завести блог — пять минут на WordPress. Загрузить видео — одна кнопка на YouTube. Написать отзыв, поставить оценку, поделиться фотографией — всё это стало доступно всем. Технический барьер, который в Web1 отделял читателей от авторов, рухнул.\n\nЭто была настоящая революция участия. И она действительно изменила мир. Блогеры разоблачали коррупцию там, куда профессиональные журналисты не могли добраться. Гражданские журналисты снимали события, которые официальные СМИ игнорировали. Активисты организовывали протесты через социальные сети быстрее, чем власти успевали реагировать. Арабская весна. #MeToo. Это всё стало возможным благодаря Web2.\n\nНо у этой революции была цена. И её никто не читал в пользовательском соглашении.\n\n> Web2 дал голос каждому — и встроил этот голос в машину, которая зарабатывала на каждом его слове.\n\nПарадокс Web2 в том, что это был честный обмен — просто никто не объяснял его условия вслух. Ты получаешь бесплатный сервис. Взамен — твоё внимание, твои данные, твоё поведение. Проблема не в том, что обмен существовал. Проблема в том, что он был невидимым.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["web2", "platforms", "history", "media"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "attention", "sceneIndex": 1, "type": "power", "shortTitle": "Внимание", "era": "1971 · 2019", "lensWeight": {"chronology": 3, "attention": 5, "platform": 3, "economy": 3, "manipulation": 3}, "title": "Экономика внимания: дефицит, который не заметили", "insight": "Саймон предсказал экономику внимания в 1971-м. Зубофф зафиксировала: человеческое поведение стало сырьём — и это новый тип власти, которого раньше не существовало.", "thesis": "Саймон предсказал экономику внимания в 1971-м. Зубофф зафиксировала: человеческое поведение стало сырьём — и это новый тип власти, которого раньше не существовало.", "body": "## Нобелевский лауреат предупреждал в 1971-м\n\nВ 1971 году нобелевский лауреат по экономике Герберт Саймон написал статью, которую почти никто не заметил. Её главная мысль была простой и железной: когда информации становится много, дефицитным ресурсом становится не информация, а внимание.\n\nСаймон назвал это «экономикой внимания» и сформулировал за тридцать лет до Facebook. Логика элементарная: если у тебя есть миллион сайтов, а у человека есть только двадцать четыре часа в сутки — ценность имеет не контент. Ценность имеет доступ к глазам и ушам человека. Тот, кто контролирует внимание, контролирует экономику.\n\nGoogle понял это первым — и построил на этом империю. Поисковик был бесплатным. Но каждый раз, когда ты что-то искал, Google узнавал о тебе что-то новое: что тебя беспокоит, что ты хочешь купить, о чём думаешь ночью. Эти знания Google продавал рекламодателям. Ты не платил деньгами — ты платил вниманием и данными.\n\nДжон Батель в 2005 году написал книгу «The Search» — историю Google как историю новой власти. Его наблюдение: поисковик — это не просто инструмент поиска. Это инфраструктура, через которую проходит всё информационное пространство человека. Тот, кто контролирует поиск, решает, что существует для людей, а что нет. Какой сайт они найдут, а какой останется невидимым. Это власть, сравнимая с властью издателей и телекорпораций прошлого — только масштаб другой.\n\n## Капитализм слежки: человек как сырьё\n\nШошана Зубофф потратила десять лет на исследование того, что происходит с данными людей в интернете. В 2019 году она опубликовала книгу «Эпоха надзорного капитализма» — и ввела термин, который точнее всего описывает бизнес-модель Web2.\n\nЕё аргумент: Google и Facebook открыли новый вид сырья. Не нефть, не уголь — человеческое поведение. Каждый клик, каждая пауза при чтении, каждый маршрут по городу, каждая секунда, проведённая на конкретной странице — всё это собирается, анализируется и превращается в то, что Зубофф называет «поведенческими излишками». Эти излишки продаются рекламодателям как инструмент предсказания и влияния на будущие действия людей.\n\nЗубофф подчёркивает принципиальное отличие от традиционной рекламы. Реклама XX века говорила: «Купи этот продукт — он хороший». Надзорный капитализм говорит: «Мы знаем, что ты купишь это — ещё до того, как ты это решил. И мы можем изменить вероятность этого решения». Это не убеждение. Это модификация поведения через среду, о которой человек не подозревает.\n\nКонкретный масштаб: рынок цифровой рекламы к 2023 году превысил 600 миллиардов долларов в год. Это больше, чем ВВП большинства стран мира. Вся эта сумма — монетизация человеческого внимания и поведенческих данных.\n\n> Саймон предупреждал в 1971-м: главный дефицит информационной эпохи — это внимание. Зубофф зафиксировала в 2019-м: это внимание стало главным сырьём планеты.\n\nМежду этими двумя наблюдениями — сорок восемь лет и крупнейшее перераспределение власти в истории медиа.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["attention", "surveillance-capitalism", "web2", "power"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "lanier", "sceneIndex": 2, "type": "privacy", "shortTitle": "Ланье", "era": "2010", "lensWeight": {"chronology": 3, "attention": 4, "platform": 3, "economy": 4, "manipulation": 4}, "title": "Ланье: ты не гаджет, ты и есть продукт", "insight": "Ланье показал: Web2 уничтожил средний класс творцов, создав структуру «победитель берёт всё» — несколько суперзвёзд и миллионы создателей, работающих бесплатно для платформ.", "thesis": "Ланье показал: Web2 уничтожил средний класс творцов, создав структуру «победитель берёт всё» — несколько суперзвёзд и миллионы создателей, работающих бесплатно для платформ.", "body": "## Голос изнутри индустрии\n\nДжарон Ланье — необычный критик платформ. Он не журналист и не учёный-аутсайдер. Он один из пионеров виртуальной реальности, человек, который в 1980-е работал в самом центре технологической революции — в Кремниевой долине, бок о бок с теми, кто строил эту индустрию. Именно поэтому его критика так убедительна: он знает систему изнутри.\n\nВ 2010 году он написал книгу «You Are Not a Gadget» — манифест разочарования. Главный тезис: платформы Web2 построены на фундаментальной лжи. Они говорят, что дают тебе сервис бесплатно. На самом деле они забирают у тебя нечто ценное — твоё творчество, твои данные, твоё время, твою индивидуальность — и монетизируют это, не делясь с тобой ничем существенным.\n\nЛанье приводит конкретные примеры, от которых трудно отмахнуться. Музыкант записывает песню, выкладывает на YouTube — и получает несколько центов за тысячу прослушиваний. YouTube зарабатывает на рекламе вокруг этой песни гораздо больше. Журналист пишет статью, которую расшаривают в Facebook сто тысяч раз — и получает ноль. Facebook зарабатывает на трафике, который эта статья генерирует. Фотограф делает снимки, которые Instagram использует для обучения алгоритмов распознавания изображений — без разрешения и без оплаты.\n\n## Исчезновение среднего класса творцов\n\nЛанье описал экономическое последствие, которое мало кто видел в 2010-м, но которое стало очевидным к 2020-м: Web2 уничтожил средний класс творцов.\n\nРаньше между звёздами и полной безвестностью существовало целое пространство — профессиональные музыканты, которые зарабатывали на жизнь концертами и продажей альбомов. Журналисты, которые кормили семьи статьями для местных газет. Фотографы, которые продавали снимки агентствам. Писатели, которые жили на гонорары от средних тиражей. Это был средний класс культуры.\n\nWeb2 схлопнул это пространство. Алгоритмы создали структуру «победитель берёт всё»: несколько суперзвёзд собирают миллионы подписчиков и зарабатывают огромные деньги. Все остальные работают бесплатно — создавая контент для платформ, которые на этом контенте зарабатывают.\n\nМарк Андрессен в 2011 году написал триумфальную колонку «Software Is Eating the World» — программное обеспечение поглощает каждую индустрию, это неизбежно и хорошо. Такси превращается в Uber. Гостиницы — в Airbnb. Медиа — в Netflix. Музыка — в Spotify. Логика платформы везде одна: убери посредников, сведи продавца и покупателя напрямую, возьми комиссию с каждой транзакции. Заводов не нужно. Маржа огромная.\n\nАндрессен был прав в описании происходящего. Но умолчал о цене: вместе с посредниками исчезала инфраструктура, которая поддерживала тысячи профессионалов. Такси-компании были неэффективны — но в них работали люди. Музыкальные магазины были неудобны — но они платили музыкантам роялти.\n\n> Ланье сформулировал точно: бесплатный сервис — это не подарок. Это сделка, где тебе не объяснили условия. Ты платишь творчеством, данными и временем.\n\nЭта логика важна для понимания Web3. Одна из центральных идей децентрализованного интернета — вернуть творцам то, что платформы Web2 у них забрали. Токены, смарт-контракты, прямые платежи — это технические инструменты для решения проблемы, которую Ланье описал ещё в 2010 году.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["creators", "web2", "economics", "attention"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "galloway", "sceneIndex": 3, "type": "power", "shortTitle": "Четыре всадника", "era": "2017", "lensWeight": {"chronology": 3, "attention": 3, "platform": 5, "economy": 4, "manipulation": 3}, "title": "Гэллоуэй и четыре всадника: психология захвата", "insight": "Гэллоуэй объяснил: Amazon, Apple, Facebook, Google захватили не рынки, а базовые человеческие потребности — выживание, статус, принадлежность, знание.", "thesis": "Гэллоуэй объяснил: Amazon, Apple, Facebook, Google захватили не рынки, а базовые человеческие потребности — выживание, статус, принадлежность, знание.", "body": "## Почему именно эти четыре\n\nК середине 2010-х стало очевидно, что несколько технологических компаний захватили непропорционально большую долю мировой экономики. Amazon, Apple, Facebook, Google — на их долю приходилось больше рыночной капитализации, чем у большинства национальных экономик. Почему именно они? И почему так быстро?\n\nСкотт Гэллоуэй в книге «The Four» дал ответ, который удивляет своей нетехнологичностью. Он не говорит о лучших алгоритмах или большем бюджете на разработку. Он говорит о психологии. Каждая из четырёх компаний захватила одну из базовых человеческих потребностей — и стала её безальтернативным поставщиком.\n\nAmazon захватил потребность в выживании и накоплении. Это самый древний инстинкт — иметь запасы, получать товары быстро и надёжно. Amazon Prime обещает: всё, что тебе нужно, придёт завтра. Это не просто удобство доставки — это ощущение безопасности. Ты не останешься без необходимого.\n\nApple захватил потребность в статусе и сексуальной привлекательности. iPhone — это не телефон. Это сигнал другим людям: я принадлежу к определённому классу, у меня хороший вкус, я слежу за собой. Именно поэтому люди покупают новый iPhone, даже когда старый прекрасно работает. Не ради функций — ради сигнала.\n\nFacebook захватил потребность в любви и принадлежности. Самое глубокое человеческое желание — быть частью группы, быть принятым, быть любимым. Лайк в Facebook — это социальное одобрение, упакованное в интерфейс. «Друзья» — это слово не случайно. Платформа эксплуатирует самое уязвимое место человеческой психики.\n\nGoogle захватил потребность в знании и в боге — в источнике ответов на любой вопрос. «Погугли это» стало синонимом «узнай правду». Google знает ответ на любой вопрос — от рецепта борща до смысла жизни. Это беспрецедентная власть: быть источником истины для миллиардов людей.\n\n## Маркетинг нашёл новый язык\n\nФилип Котлер описал эволюцию маркетинга через три эпохи. Маркетинг 1.0 — это продукт: завод производит, реклама продаёт. Маркетинг 2.0 — это потребитель: изучи психологию, сегментируй аудиторию, персонализируй предложение. Маркетинг 3.0 — это ценности: в эпоху Web2 выигрывают те, кто продаёт не продукт и не пользу, а смысл и идентичность.\n\nApple не продаёт телефоны — продаёт идентичность творческого человека. Nike не продаёт кроссовки — продаёт историю о преодолении себя. Starbucks не продаёт кофе — продаёт «третье место», пространство между домом и работой. Именно поэтому Starbucks может брать пять евро за напиток, который можно сделать дома за пятьдесят центов.\n\nКотлер видел в этом прогресс: бизнес наконец начал относиться к людям как к целостным личностям. Но граница между «понять человека глубже» и «манипулировать человеком точнее» оказалась очень тонкой. Когда ты продаёшь не товар, а идентичность — ты работаешь с самым интимным: с тем, кем человек себя считает.\n\n> Гэллоуэй показал: четыре платформы захватили не рынки — они захватили базовые человеческие потребности. Это делает их почти незаменимыми.\n\nИменно это объясняет, почему сетевые эффекты в их случае столь мощны. Выйти из Facebook — значит потерять связь с друзьями. Перестать пользоваться Google — значит лишиться привычного источника ответов. Это не просто неудобство. Это социальная и психологическая стоимость.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["web2", "platforms", "psychology", "power"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "network", "sceneIndex": 4, "type": "economy", "shortTitle": "Сетевые эффекты", "era": "2018", "lensWeight": {"chronology": 4, "attention": 2, "platform": 5, "economy": 5, "manipulation": 2}, "title": "Сетевые эффекты: почему победителя не сменить", "insight": "Сетевые эффекты делают платформы почти непобедимыми. Cambridge Analytica показал предел: когда данные пользователей становятся инструментом влияния на выборы — это архитектурная проблема, не регуляторная.", "thesis": "Сетевые эффекты делают платформы почти непобедимыми. Cambridge Analytica показал предел: когда данные пользователей становятся инструментом влияния на выборы — это архитектурная проблема, не регуляторная.", "body": "## Гравитация платформ\n\nУ платформ есть одно свойство, которое делает их почти невозможными для конкуренции. Называется оно «сетевой эффект» — и это, пожалуй, самая важная экономическая концепция для понимания цифровой эпохи.\n\nСетевой эффект: ценность сети для каждого пользователя растёт по мере того, как в сеть приходят новые пользователи. Первый телефон в мире был абсолютно бесполезен — позвонить некому. Второй телефон создал одно соединение. Тысяча телефонов — почти полмиллиона возможных соединений. Миллион телефонов — около пятисот миллиардов. Ценность растёт не линейно, а экспоненциально.\n\nДля Facebook это означает следующее: платформа ценна именно потому, что там все твои друзья. Если туда приходит ещё один человек из твоего круга — Facebook становится чуть ценнее для тебя. Если все твои друзья уйдут — Facebook станет бесполезным, сколько бы денег в него ни инвестировали.\n\nЭто создаёт самоусиливающуюся петлю. Первая платформа, которая набирает критическую массу, становится почти непобедимой. Конкурент не может просто создать лучший продукт — нужно убедить одновременно перейти всех твоих друзей. А для этого нужно убедить их друзей. А для этого — их друзей. Это почти невозможно.\n\n## Cambridge Analytica и предел терпения\n\nК 2010-м годам стало очевидно: данные о поведении людей стоят огромных денег. Настолько огромных, что компании были готовы давать любые сервисы бесплатно — лишь бы получить доступ к данным. Но возник вопрос, на который Web2 так и не дал ответа: кому принадлежат эти данные?\n\nВ 2018 году разразился скандал с Cambridge Analytica. Facebook продал данные 87 миллионов пользователей — без их явного согласия — компании, которая использовала эти данные для политических манипуляций в нескольких странах. Предположительно, эти данные повлияли на исход президентских выборов в США и на референдум о Brexit в Великобритании.\n\nЭто переломило общественное восприятие. До 2018 года большинство людей воспринимали «данные в обмен на сервис» как нормальную сделку. После — стало ясно, что данные о поведении людей — это не просто коммерческий актив. Это инструмент власти над демократическими процессами. Это нечто, последствия утечки которого могут быть не просто неприятными, а политически катастрофическими.\n\nЭендрю Кин ещё в 2007 году предупреждал в «The Cult of the Amateur»: когда каждый может публиковать всё что угодно без редактуры и проверки фактов — экспертиза обесценивается, а качество информации падает. Cambridge Analytica показал, что манипуляция информацией в масштабе платформ Web2 может иметь последствия, которые Кин не мог предвидеть.\n\n> Сетевые эффекты — это гравитация платформ. Чем больше масса — тем сильнее притяжение, тем труднее уйти. Cambridge Analytica показал: эта гравитация может затягивать не только пользователей, но и демократические процессы.\n\nИменно этот скандал ускорил разговор о том, что у Web2 есть структурные проблемы, которые нельзя решить регулированием или штрафами. Нужна другая архитектура. Архитектура, где данные принадлежат пользователям, а не платформам. Именно этот вопрос начал отвечать Web3.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["web2", "network-effects", "data", "privacy"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "kotler", "sceneIndex": 5, "type": "media", "shortTitle": "Котлер 3.0", "era": "2010", "lensWeight": {"chronology": 2, "attention": 3, "platform": 2, "economy": 3, "manipulation": 5}, "title": "Котлер 3.0: когда маркетинг стал продавать смыслы", "insight": "Котлер зафиксировал: маркетинг 3.0 продаёт не продукт и не пользу, а смыслы и идентичность. Web2 дал этому беспрецедентные инструменты — и стёр границу между пониманием и манипуляцией.", "thesis": "Котлер зафиксировал: маркетинг 3.0 продаёт не продукт и не пользу, а смыслы и идентичность. Web2 дал этому беспрецедентные инструменты — и стёр границу между пониманием и манипуляцией.", "body": "## Три эпохи отношений бизнеса и человека\n\nФилип Котлер — один из главных теоретиков маркетинга XX века, автор учебников, по которым учились поколения менеджеров. В 2010 году он написал «Маркетинг 3.0» — и зафиксировал трансформацию, которая происходила у всех на глазах, но которую мало кто осмыслял системно.\n\nКотлер описал три поколения маркетинга как три разных ответа на вопрос «что мы продаём и кому?»\n\nМаркетинг 1.0 — эпоха продукта. Завод производит товар, реклама говорит: «Купи — он качественный и нужный». Потребитель воспринимается как рациональный покупатель, которому нужен функциональный продукт. Думай о продукте, не думай о человеке.\n\nМаркетинг 2.0 — эпоха потребителя. Компании начали изучать психологию покупателя, сегментировать аудитории, персонализировать предложения. «Мы понимаем тебя лучше, чем конкуренты — и поэтому наш продукт для тебя». Потребитель воспринимается как эмоциональное существо с потребностями.\n\nМаркетинг 3.0 — эпоха ценностей. В эпоху Web2 выиграли не те, кто продаёт лучший продукт или лучше понимает потребителя. Выиграли те, кто создаёт смысл и принадлежность. Потребитель воспринимается как целостная личность с ценностями, мечтами и духовными потребностями.\n\n## От продукта к идентичности\n\nПосмотри на конкретные примеры — они объясняют лучше любой теории.\n\nApple. Функционально iPhone не лучше конкурентов настолько, чтобы стоить вдвое дороже. Но Apple продаёт не телефон. Он продаёт идентичность творческого, образованного человека с хорошим вкусом. Покупая iPhone, ты покупаешь принадлежность к определённому племени. Именно поэтому фанаты Apple защищают его с такой страстью — они защищают свою идентичность.\n\nNike. Кроссовки Nike функционально сопоставимы с десятками других брендов. Но Nike продаёт историю о преодолении себя. Just Do It — это не инструкция по покупке обуви. Это философия. Покупая Nike, ты примеряешь нарратив о том, что способен на большее.\n\nStarbucks. Кофе Starbucks объективно стоит в пять-восемь раз дороже, чем сопоставимый по качеству напиток в среднем кафе. Но Starbucks продаёт «третье место» — пространство между домом и работой, где можно побыть, поработать, встретиться. Вы платите не за кофе, вы платите за аренду социального пространства с определённым ощущением.\n\nКотлер видел в этом эволюцию: бизнес наконец начал думать о людях как о целостных личностях. Но у этого прогресса была обратная сторона. Граница между «понять человека глубже» и «манипулировать человеком точнее» оказалась очень тонкой. Если ты продаёшь идентичность — ты работаешь с самым интимным. Ты влияешь не на решение о покупке, а на то, кем человек себя считает.\n\n> Котлер назвал это прогрессом. Зубофф назвала это инструментом власти. Обе правы — разница только в том, с чьей точки зрения смотреть.\n\nВ эпоху Web2 маркетинг 3.0 получил беспрецедентные инструменты: данные о поведении миллиардов людей, алгоритмы персонализации, таргетированная реклама с точностью до психотипа. Это позволило продавать идентичность с хирургической точностью. Но кто защищает человека, чьей идентичностью торгуют без его ведома?", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["marketing", "identity", "web2", "psychology"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "verdict", "sceneIndex": 6, "type": "power", "shortTitle": "Итог Web2", "era": "≈2020", "lensWeight": {"chronology": 5, "attention": 4, "platform": 4, "economy": 3, "manipulation": 4}, "title": "Итог Web2: голос дали, данные забрали", "insight": "Web2 дал голос миллиардам — и взял взамен приватность, собственность на данные и общее информационное пространство. Это сделка, условий которой никто не объявлял.", "thesis": "Web2 дал голос миллиардам — и взял взамен приватность, собственность на данные и общее информационное пространство. Это сделка, условий которой никто не объявлял.", "body": "## Что Web2 дал\n\nПрежде чем ставить приговор эпохе Web2 — стоит честно признать её достижения. Это не апологетика. Это попытка понять, почему умные люди строили эту систему с искренними намерениями — и что пошло не так.\n\nWeb2 дал голос миллиардам людей, у которых его раньше не было. Это не метафора. Журналист из маленького города может разоблачить коррупцию местных чиновников — и его материал прочитают сотни тысяч. Активист может организовать протест, минуя государственные СМИ. Малый бизнес может найти клиентов по всему миру без рекламного бюджета. Это реальная и огромная демократизация.\n\nWeb2 убил дистанцию. До него между мировыми знаниями и человеком в маленьком городе стояли барьеры: языковые, финансовые, географические. YouTube дал бесплатный доступ к образовательному контенту любого уровня. Wikipedia создала универсальную энциклопедию на любом языке. Google Translate убрал языковой барьер. Это реально изменило возможности миллионов людей.\n\nWeb2 создал новые рынки и новые профессии. Контент-криэйтор, SMM-менеджер, подкастер, стример — этих профессий не существовало двадцать лет назад. Экономика платформ дала возможность зарабатывать людям, у которых нет традиционного работодателя: фрилансерам, ремесленникам, художникам.\n\n## Что Web2 взял\n\nНо список того, что взял Web2, не менее длинный.\n\nПриватность. Каждое действие в интернете теперь записано, проанализировано и продано. Ты не знаешь точно, что о тебе знают и кому это продают. Корпорации знают о тебе больше, чем твои близкие.\n\nСобственность на данные. Ты создаёшь контент — платформа им владеет. Ты строишь аудиторию — платформа контролирует доступ к ней. Алгоритм меняется — и всё, что ты строил годами, может испариться в одночасье.\n\nОбщее информационное пространство. Алгоритмы персонализации создали мир, где все живут в своих информационных пузырях. Люди в одном городе могут видеть принципиально разные версии реальности — и это разрушает саму возможность общественного диалога.\n\nСреднее качество культуры. Кин предупреждал об этом ещё в 2007-м: когда каждый может публиковать без редактуры и проверки фактов, экспертиза обесценивается. Это не значит, что не осталось качественного контента — он есть. Но найти его в океане шума стало значительно труднее.\n\nВыход из Web2 прост на словах и почти невозможен на практике. Сетевые эффекты создали такую гравитацию, что «просто уйти» с платформ означает выпасть из социальной и профессиональной жизни.\n\n> Web2 заключил с нами сделку, не объявив её условий. Голос — взамен на данные. Связь — взамен на приватность. Бесплатный сервис — взамен на внимание.\n\nИменно это противоречие — между ценностью, которую Web2 создал, и ценой, которую он взял — породило вопрос, который стоит в центре Web3: а можно ли получить голос, связь и сервис без того, чтобы кто-то другой владел твоими данными и вниманием?", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["web2", "data", "privacy", "platforms"], "x": 265.5, "y": 258.0, "angDeg": 218.6}], "edges": [{"from": "city", "to": "attention", "label": "голос стал сырьём", "lenses": ["chronology", "attention"]}, {"from": "attention", "to": "lanier", "label": "ты и есть продукт", "lenses": ["attention", "manipulation"]}, {"from": "attention", "to": "galloway", "label": "внимание — рычаг власти", "lenses": ["attention", "platform"]}, {"from": "galloway", "to": "network", "label": "захват закрепляется эффектами", "lenses": ["platform", "economy"]}, {"from": "network", "to": "verdict", "label": "победителя не сменить", "lenses": ["economy", "platform"]}, {"from": "lanier", "to": "kotler", "label": "от продукта к смыслам", "lenses": ["manipulation"]}, {"from": "kotler", "to": "verdict", "label": "манипуляция как норма", "lenses": ["manipulation", "media"]}, {"from": "city", "to": "galloway", "label": "город захватили четверо", "lenses": ["platform", "chronology"]}, {"from": "attention", "to": "verdict", "label": "сделка без объявленных условий", "lenses": ["attention", "chronology"]}, {"from": "network", "to": "kotler", "label": "масштаб усиливает влияние", "lenses": ["economy", "manipulation"]}]};;
function renderEmptyState(reason){const empty=document.querySelector(".empty-state"),svg=document.querySelector(".system-map");
  if(!empty||!svg)return;empty.hidden=false;svg.setAttribute("hidden","");
  empty.innerHTML=`<p>${reason}</p><a href="${CHAPTER_DATA.chapter.sourceUrl}" target="_blank" rel="noreferrer">Luminara</a>`;}
</script>

<body>
<div class="stars"></div><div class="stars2"></div>
<main class="app-shell">
  <section class="rail">
    <div><p class="eyebrow">Luminara · Atlas</p><h1 id="app-title">Интернет стал городом</h1></div>
    <p class="chapter-lede">Тебе дали голос — чтобы забрать твоё внимание. Как Web2 превратил библиотеку в машину монетизации.</p>
    <div class="rail-rule"></div>
    <div><p class="section-h" data-ui="section_lenses">Линзы интерпретации</p><div class="lens-group" style="margin-top:9px"></div><p class="lens-desc" style="margin-top:9px"></p></div>
    <div class="rail-rule"></div>
    <div class="progress-box"></div>
    <div><p class="section-h" data-ui="section_scenes">Сцены главы</p><nav class="node-list" style="margin-top:6px"></nav></div>
  </section>
  <section class="map-stage">
    <svg class="system-map" viewBox="0 0 1120 940" role="img" preserveAspectRatio="xMidYMid meet">
      <title>До интернета</title><desc>Информация становится властью</desc>
    </svg>

<dialog class="scene-dialog"></dialog>
<script>
// --- theme from URL (?theme=light|dark & ?accent=oklch/hex) — mirrors app ---
(function(){
  try{
    var p=new URLSearchParams(location.search);
    var theme=p.get("theme"); var accent=p.get("accent");
    if(theme==="light") document.documentElement.setAttribute("data-theme","light");
    else if(theme==="dark") document.documentElement.removeAttribute("data-theme");
    if(accent){ document.documentElement.style.setProperty("--accent", decodeURIComponent(accent)); }
    // sun ink: readable on core
    document.documentElement.style.setProperty("--sun-ink", theme==="light" ? "#fff" : "#fff");
  }catch(e){}
})();
// live updates from parent (optional): postMessage {theme, accent}
window.addEventListener("message",function(ev){
  var m=ev.data||{};
  if(m.theme==="light") document.documentElement.setAttribute("data-theme","light");
  if(m.theme==="dark") document.documentElement.removeAttribute("data-theme");
  if(m.accent) document.documentElement.style.setProperty("--accent", m.accent);
  if(typeof renderAll==="function") renderAll();
});

const state={lens:"chronology",selected:null,visited:new Set(),entered:false};
const byId=id=>CHAPTER_DATA.nodes.find(n=>n.id===id);
const SVGNS="http://www.w3.org/2000/svg";
const el=(t,a)=>{const e=document.createElementNS(SVGNS,t);for(const k in(a||{}))e.setAttribute(k,a[k]);return e;};
function typeColor(t){return{power:"var(--power)",technology:"var(--technology)",media:"var(--media)",privacy:"var(--privacy)",economy:"var(--economy)"}[t]||"var(--accent)";}
function typeLabel(t){var U=window.__UI_LOC||{};var k="type_"+t;if(U[k])return U[k];return{power:"Власть",technology:"Технологии",media:"Медиа",privacy:"Приватность",economy:"Экономика"}[t]||"Идея";}
function lensById(id){return CHAPTER_DATA.lenses.find(l=>l.id===id);}
function edgeActive(e){return e.lenses.includes(state.lens);}
function nodeWeight(n){return(n.lensWeight&&n.lensWeight[state.lens])||0;}
const CX=CHAPTER_DATA.chapter.centerX||500, CY=CHAPTER_DATA.chapter.centerY||445, RING=CHAPTER_DATA.chapter.ring||300;

function buildLenses(){
  const w=document.querySelector(".lens-group");w.innerHTML="";
  CHAPTER_DATA.lenses.forEach(l=>{const b=document.createElement("button");b.className="lens-btn";b.type="button";
    b.setAttribute("aria-pressed",String(l.id===state.lens));b.style.setProperty("--dot",l.accent);
    b.innerHTML=`<span class="lens-dot"></span>${l.label}`;b.addEventListener("click",()=>setLens(l.id));w.appendChild(b);});
}
function setLens(id){state.lens=id;const l=lensById(id);
  const d=document.querySelector(".lens-desc");if(d)d.textContent=l?l.description:"";
  document.querySelectorAll(".lens-btn").forEach((b,i)=>b.setAttribute("aria-pressed",String(CHAPTER_DATA.lenses[i].id===id)));
  renderAll();}

function curve(a,b){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;const dx=mx-CX,dy=my-CY,len=Math.hypot(dx,dy)||1;const bow=26;
  return `M ${a.x} ${a.y} Q ${mx+(dx/len)*bow} ${my+(dy/len)*bow} ${b.x} ${b.y}`;}

function defs(){
  const d=el("defs");
  const mk=(id,color)=>{color=lensById(state.lens)?lensById(state.lens).accent:"#888";const m=el("marker",{id,viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"});
    const p=el("path",{d:"M0 0 L10 5 L0 10 z",fill:color});m.appendChild(p);return m;};
  d.appendChild(mk("arrow-active", "var(--dot-fallback)"));
  var sg=el("radialGradient",{id:"sunGrad",cx:"50%",cy:"42%",r:"60%"});
  var css=getComputedStyle(document.documentElement);
  sg.appendChild(el("stop",{offset:"0%","stop-color":css.getPropertyValue("--bg-elev")||"#20264a"}));
  sg.appendChild(el("stop",{offset:"100%","stop-color":css.getPropertyValue("--bg")||"#0c1230"}));
  d.appendChild(sg);
  return d;
}

function renderMap(){
  const svg=document.querySelector(".system-map");if(!svg)return;
  [...svg.querySelectorAll("defs,g,.ring,.ring-tick,.era-label,.spoke")].forEach(n=>n.remove());
  svg.appendChild(defs());
  // rings
  const gDeco=el("g",{});
  [RING*0.55,RING].forEach(r=>gDeco.appendChild(el("circle",{class:"ring",cx:CX,cy:CY,r})));
  svg.appendChild(gDeco);
  // spokes + chronology era labels around outer ring
  const gSpoke=el("g",{});
  CHAPTER_DATA.nodes.forEach(n=>{
    gSpoke.appendChild(el("line",{class:"spoke",x1:CX,y1:CY,x2:n.x,y2:n.y}));
  });
  svg.appendChild(gSpoke);

  // edges (with directional arrows on active)
  const gE=el("g",{});
  CHAPTER_DATA.edges.forEach(e=>{const a=byId(e.from),b=byId(e.to);if(!a||!b)return;
    const active=edgeActive(e);const g=el("g",{class:"edge"+(active?" active":"")});
    if(active)g.style.setProperty("--dot",lensById(state.lens).accent);
    const d=curve(a,b);const p=el("path",{d});
    // approximate length for draw animation
    const len=Math.round(Math.hypot(b.x-a.x,b.y-a.y)*1.15);
    p.style.setProperty("--len",len);
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const lb=el("text",{class:"edge-label",x:mx,y:my-5,"text-anchor":"middle"});lb.textContent=e.label;
    g.appendChild(p);g.appendChild(lb);gE.appendChild(g);});
  svg.appendChild(gE);

  // center (breathing, lens-tinted ring)
  const gC=el("g",{});
  gC.style.setProperty("--dot", lensById(state.lens)?lensById(state.lens).accent:"#b7791f");
  gC.appendChild(el("circle",{class:"sun-glow",cx:CX,cy:CY,r:100}));
  gC.appendChild(el("circle",{class:"sun-ring",cx:CX,cy:CY,r:82}));
  gC.appendChild(el("circle",{class:"sun-core",cx:CX,cy:CY,r:70}));/*no sublabel*/
  
  wrapText(gC,CHAPTER_DATA.chapter.centralIdea,CX,CY+2,120,"sun-t1",17);
  svg.appendChild(gC);

  // nodes with smart outward labels + era
  const gN=el("g",{});
  CHAPTER_DATA.nodes.forEach((n,i)=>{
    const g=el("g",{class:"node"+(state.selected===n.id?" selected":""),tabindex:"0",role:"button","aria-label":`${n.sceneIndex+1}. ${n.title} (${n.era||""})`});
    g.style.setProperty("--dot",typeColor(n.type));
    g.style.setProperty("--ox",n.x+"px");g.style.setProperty("--oy",n.y+"px");
    if(!state.entered) g.style.setProperty("--delay",(0.15+i*0.06)+"s"); else g.style.animation="none",g.style.opacity="1";
    if(state.selected){const linked=CHAPTER_DATA.edges.some(e=>(e.from===state.selected&&e.to===n.id)||(e.to===state.selected&&e.from===n.id));
      if(n.id!==state.selected&&!linked)g.classList.add("dim");}
    else if(nodeWeight(n)<=1){g.classList.add("dim");}
    g.appendChild(el("circle",{class:"planet-glow",cx:n.x,cy:n.y,r:34}));
    var pl=el("circle",{class:"planet",cx:n.x,cy:n.y,r:26});pl.style.fill="color-mix(in oklch, "+typeColor(n.type)+" 20%, var(--bg-elev))";g.appendChild(pl);
    const num=el("text",{class:"num",x:n.x,y:n.y});num.textContent=String(n.sceneIndex+1);g.appendChild(num);

    // smart label placement: outward along the radius from center
    const dx=n.x-CX,dy=n.y-CY,len=Math.hypot(dx,dy)||1;
    const ux=dx/len,uy=dy/len;
    const lx=n.x+ux*46, ly=n.y+uy*46;
    // anchor by horizontal side
    const anchor = ux>0.25?"start":(ux<-0.25?"end":"middle");
    const era=el("text",{class:"era",x:lx,y:ly-30,"text-anchor":anchor});era.textContent=n.era||"";g.appendChild(era);
    const kick=el("text",{class:"kicker",x:lx,y:ly-14,"text-anchor":anchor});kick.textContent=typeLabel(n.type);g.appendChild(kick);
    wrapTextAnchored(g,n.shortTitle,lx,ly+20,180,"cap",18,anchor);

    g.addEventListener("click",()=>selectNode(n.id));
    g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();selectNode(n.id);}});
    gN.appendChild(g);
  });
  svg.appendChild(gN);
  state.entered=true;
}
function wrapText(parent,text,x,y,maxw,cls,fs){wrapTextAnchored(parent,text,x,y,maxw,cls,fs,"middle");}
function wrapTextAnchored(parent,text,x,y,maxw,cls,fs,anchor){
  const words=String(text).split(/\s+/);const lines=[];let line="";
  const approx=s=>s.length*(fs*0.56);
  words.forEach(w=>{const t=line?line+" "+w:w;if(approx(t)>maxw&&line){lines.push(line);line=w;}else line=t;});
  if(line)lines.push(line);const total=(lines.length-1)*(fs+2);
  lines.forEach((ln,i)=>{const t=el("text",{class:cls,x,y:y-total/2+i*(fs+2),"text-anchor":anchor});t.textContent=ln;parent.appendChild(t);});
}

function renderNodeList(){const nav=document.querySelector(".node-list");if(!nav)return;nav.innerHTML="";
  CHAPTER_DATA.nodes.slice().sort((a,b)=>a.sceneIndex-b.sceneIndex).forEach(n=>{
    const b=document.createElement("button");b.type="button";b.setAttribute("aria-current",String(state.selected===n.id));b.style.setProperty("--dot",typeColor(n.type));
    b.innerHTML=`<span class="node-idx">${String(n.sceneIndex+1).padStart(2,"0")}</span><span>${n.shortTitle}</span>`;
    b.addEventListener("click",()=>selectNode(n.id));nav.appendChild(b);});}
function renderProgress(){const box=document.querySelector(".progress-box");if(!box)return;
  const total=CHAPTER_DATA.nodes.length,seen=state.visited.size;
  box.innerHTML=`${((window.__UI_LOC&&window.__UI_LOC.progress_studied)||"Изучено")} ${seen}/${total}<div class="progress-bar"><div class="progress-fill" style="width:${Math.round(seen/total*100)}%"></div></div>`;}
function firstSentence(txt){return String(txt).replace(/^##[^\n]*\n+/,"").split(/(?<=[.!?])\s/)[0]||"";}
function renderDetail(){const p=document.querySelector(".detail-panel");if(!p)return;
  if(!state.selected){p.innerHTML=`<p class="eyebrow">${(window.__UI_LOC&&window.__UI_LOC.detail_label)||"Деталь"}</p><p class="detail-empty">${(window.__UI_LOC&&window.__UI_LOC.detail_empty)||"Выбери узел на карте — здесь появятся тезис, инсайт, источники и связанные идеи. Линзы вверху меняют, что подсвечено, и перекрашивают центр."}</p>`;return;}
  const n=byId(state.selected);const c=typeColor(n.type);
  const related=CHAPTER_DATA.edges.filter(e=>e.from===n.id||e.to===n.id).map(e=>({node:byId(e.from===n.id?e.to:e.from),label:e.label})).filter(x=>x.node);
  const srcs=(n.sources||[]).slice(0,10);
  p.innerHTML=`<p class="detail-kicker" style="--dot:${c}">${(window.__UI_LOC&&window.__UI_LOC.scene_word)||"Сцена"} ${n.sceneIndex+1} · ${typeLabel(n.type)}${n.era?" · "+n.era:""}</p>
    <h3 class="detail-title">${n.title}</h3>
    <p class="detail-thesis">${firstSentence(n.body)}</p>
    <p class="detail-insight" style="--dot:${c}">${n.insight}</p>
    <div class="chips">${(n.tags||[]).map(t=>`<span class="chip">${t}</span>`).join("")}</div>
    <div class="related"><h4>${(window.__UI_LOC&&window.__UI_LOC.related_ideas)||"Связанные идеи"}</h4><div class="related-list">
      ${related.map(r=>`<button type="button" data-go="${r.node.id}">${r.node.shortTitle} · <span style="color:var(--muted)">${r.label}</span></button>`).join("")}</div></div>
    ${srcs.length?`<div class="sources-block"><h4>Источники (${srcs.length})</h4><ol>${srcs.map(s=>`<li>${s.url?`<a href="${s.url}" target="_blank" rel="noreferrer">${s.title}</a>`:s.title}${s.linkType==="gbooks"?`<span class="src-type">Google Books</span>`:(s.linkType==="direct"?`<span class="src-type">ссылка</span>`:"")}</li>`).join("")}</ol></div>`:""}
    <div class="panel-actions"><button class="btn primary" type="button" data-full="${n.id}">Читать сцену</button></div>`;
  p.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>selectNode(b.getAttribute("data-go"))));
  p.querySelector("[data-full]").addEventListener("click",()=>renderFullScene(n.id));
  const ad=p.querySelector("[data-arpa]");if(ad)ad.addEventListener("click",()=>renderFullScene("arpanet",true));}
function selectNode(id){state.selected=id;state.visited.add(id);renderAll();}

function mdToHtml(md){return String(md).split(/\n{2,}/).map(b=>{b=b.trim();if(!b)return"";
  if(b.startsWith("## "))return`<h2>${b.slice(3)}</h2>`;return`<p>${b.replace(/\*([^*]+)\*/g,"<em>$1</em>")}</p>`;}).join("");}
function renderFullScene(id,openArpa){const n=byId(id);if(!n)return;const dlg=document.querySelector(".scene-dialog");const isArpa=n.id==="arpanet";const c=typeColor(n.type);const srcs=(n.sources||[]);
  dlg.innerHTML=`<div class="dialog-inner"><button class="dialog-close" aria-label="Закрыть" type="button">×</button>
    <p class="detail-kicker" style="--dot:${c}">${(window.__UI_LOC&&window.__UI_LOC.scene_word)||"Сцена"} ${n.sceneIndex+1} · ${typeLabel(n.type)}${n.era?" · "+n.era:""}</p>
    <h3>${n.title}</h3><div class="dialog-body">${mdToHtml(n.body)}</div>
    <p class="detail-insight" style="--dot:${c}">${n.insight}</p>
    ${srcs.length?`<div class="sources-block"><h4>Источники</h4><ol>${srcs.map(s=>`<li>${s.url?`<a href="${s.url}" target="_blank" rel="noreferrer">${s.title}</a>`:s.title}${s.linkType==="gbooks"?`<span class="src-type">Google Books</span>`:(s.linkType==="direct"?`<span class="src-type">ссылка</span>`:"")}</li>`).join("")}</ol></div>`:""}
    <div class="panel-actions"><a class="btn" href="${CHAPTER_DATA.chapter.sourceUrl}" target="_blank" rel="noreferrer">Открыть в Luminara</a>
      <button class="btn primary" type="button" data-close>Закрыть</button></div></div>`;
  const close=()=>dlg.close();dlg.querySelector(".dialog-close").addEventListener("click",close);dlg.querySelector("[data-close]").addEventListener("click",close);
  if(typeof dlg.showModal==="function")dlg.showModal();else dlg.setAttribute("open","");
  }





function renderAll(){renderMap();renderNodeList();renderDetail();renderProgress();}


const CHAPTER_I18N = {"ru": {"chapter": {"key": "web2", "title": "Интернет стал городом", "lede": "Тебе дали голос — чтобы забрать твоё внимание. Как Web2 превратил библиотеку в машину монетизации.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=web2", "centralIdea": "Тебе дали голос, чтобы забрать твоё внимание", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Хронология", "accent": "#7dd3fc", "description": "От рождения Web2 до Cambridge Analytica — как «город» стал машиной."}, {"id": "attention", "label": "Внимание", "accent": "#fbbf24", "description": "Саймон и Зубофф: человеческое поведение как сырьё нового типа власти."}, {"id": "platform", "label": "Власть платформ", "accent": "#f87171", "description": "Гэллоуэй и четыре всадника: захват не рынков, а базовых потребностей."}, {"id": "economy", "label": "Экономика", "accent": "#a78bfa", "description": "Сетевые эффекты и «победитель берёт всё»: почему платформу не сменить."}, {"id": "manipulation", "label": "Манипуляция", "accent": "#34d399", "description": "Котлер 3.0 и Ланье: продажа смыслов, стёртая граница понимания и влияния."}], "nodes": [{"id": "city", "sceneIndex": 0, "type": "media", "shortTitle": "Город", "era": "2004→", "lensWeight": {"chronology": 5, "attention": 3, "platform": 4, "economy": 3, "manipulation": 2}, "title": "Рождение Web2: интернет стал городом", "insight": "Web2 превратил интернет из библиотеки в город — дал голос каждому, но встроил этот голос в машину монетизации внимания.", "thesis": "Web2 превратил интернет из библиотеки в город — дал голос каждому, но встроил этот голос в машину монетизации внимания.", "body": "## Термин, придуманный на конференции\n\nВ 2004 году издатель технической литературы Тим О'Рейли проводил мозговой штурм с коллегами. Момент был странный: пузырь доткомов лопнул в 2000-м, тысячи компаний обанкротились, инвесторы потеряли сотни миллиардов долларов. В медиа писали, что интернет-бизнес оказался иллюзией.\n\nНо О'Рейли смотрел на данные и видел другое. Трафик рос. Пользователей становилось больше. Выжившие компании — Google, Amazon, eBay — не просто выжили, они ускорились. Что-то изменилось в самой природе того, как работает интернет. Это изменение нужно было назвать.\n\nТак появился термин «Web 2.0». В статье 2005 года О'Рейли сформулировал его признаки: веб как платформа, а не как набор сайтов. Пользователи как со-создатели ценности, а не только потребители. Данные как главный актив. Сетевые эффекты как двигатель роста — чем больше людей в сети, тем ценнее сеть для каждого участника.\n\nЭто звучало как технический манифест. На деле это было описание новой бизнес-модели, последствия которой О'Рейли тогда не предвидел.\n\n## Из библиотеки в город\n\nДо Web2 интернет был библиотекой. Ты приходил, читал, уходил. Сайты существовали отдельно друг от друга, как книги на полках. Между тобой и информацией не было посредника — только адрес и браузер.\n\nWeb2 превратил интернет в город. Появились площади — Facebook, YouTube, Twitter — где люди не просто читали, но говорили, спорили, показывали себя, строили репутацию. Появились рынки — Amazon, eBay — где покупали и продавали напрямую между собой. Появились навигаторы — Google поиск — которые показывали, куда идти в этом городе.\n\nВпервые обычный человек без технических знаний мог не только потреблять интернет, но и создавать его. Завести блог — пять минут на WordPress. Загрузить видео — одна кнопка на YouTube. Написать отзыв, поставить оценку, поделиться фотографией — всё это стало доступно всем. Технический барьер, который в Web1 отделял читателей от авторов, рухнул.\n\nЭто была настоящая революция участия. И она действительно изменила мир. Блогеры разоблачали коррупцию там, куда профессиональные журналисты не могли добраться. Гражданские журналисты снимали события, которые официальные СМИ игнорировали. Активисты организовывали протесты через социальные сети быстрее, чем власти успевали реагировать. Арабская весна. #MeToo. Это всё стало возможным благодаря Web2.\n\nНо у этой революции была цена. И её никто не читал в пользовательском соглашении.\n\n> Web2 дал голос каждому — и встроил этот голос в машину, которая зарабатывала на каждом его слове.\n\nПарадокс Web2 в том, что это был честный обмен — просто никто не объяснял его условия вслух. Ты получаешь бесплатный сервис. Взамен — твоё внимание, твои данные, твоё поведение. Проблема не в том, что обмен существовал. Проблема в том, что он был невидимым.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["web2", "platforms", "history", "media"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "attention", "sceneIndex": 1, "type": "power", "shortTitle": "Внимание", "era": "1971 · 2019", "lensWeight": {"chronology": 3, "attention": 5, "platform": 3, "economy": 3, "manipulation": 3}, "title": "Экономика внимания: дефицит, который не заметили", "insight": "Саймон предсказал экономику внимания в 1971-м. Зубофф зафиксировала: человеческое поведение стало сырьём — и это новый тип власти, которого раньше не существовало.", "thesis": "Саймон предсказал экономику внимания в 1971-м. Зубофф зафиксировала: человеческое поведение стало сырьём — и это новый тип власти, которого раньше не существовало.", "body": "## Нобелевский лауреат предупреждал в 1971-м\n\nВ 1971 году нобелевский лауреат по экономике Герберт Саймон написал статью, которую почти никто не заметил. Её главная мысль была простой и железной: когда информации становится много, дефицитным ресурсом становится не информация, а внимание.\n\nСаймон назвал это «экономикой внимания» и сформулировал за тридцать лет до Facebook. Логика элементарная: если у тебя есть миллион сайтов, а у человека есть только двадцать четыре часа в сутки — ценность имеет не контент. Ценность имеет доступ к глазам и ушам человека. Тот, кто контролирует внимание, контролирует экономику.\n\nGoogle понял это первым — и построил на этом империю. Поисковик был бесплатным. Но каждый раз, когда ты что-то искал, Google узнавал о тебе что-то новое: что тебя беспокоит, что ты хочешь купить, о чём думаешь ночью. Эти знания Google продавал рекламодателям. Ты не платил деньгами — ты платил вниманием и данными.\n\nДжон Батель в 2005 году написал книгу «The Search» — историю Google как историю новой власти. Его наблюдение: поисковик — это не просто инструмент поиска. Это инфраструктура, через которую проходит всё информационное пространство человека. Тот, кто контролирует поиск, решает, что существует для людей, а что нет. Какой сайт они найдут, а какой останется невидимым. Это власть, сравнимая с властью издателей и телекорпораций прошлого — только масштаб другой.\n\n## Капитализм слежки: человек как сырьё\n\nШошана Зубофф потратила десять лет на исследование того, что происходит с данными людей в интернете. В 2019 году она опубликовала книгу «Эпоха надзорного капитализма» — и ввела термин, который точнее всего описывает бизнес-модель Web2.\n\nЕё аргумент: Google и Facebook открыли новый вид сырья. Не нефть, не уголь — человеческое поведение. Каждый клик, каждая пауза при чтении, каждый маршрут по городу, каждая секунда, проведённая на конкретной странице — всё это собирается, анализируется и превращается в то, что Зубофф называет «поведенческими излишками». Эти излишки продаются рекламодателям как инструмент предсказания и влияния на будущие действия людей.\n\nЗубофф подчёркивает принципиальное отличие от традиционной рекламы. Реклама XX века говорила: «Купи этот продукт — он хороший». Надзорный капитализм говорит: «Мы знаем, что ты купишь это — ещё до того, как ты это решил. И мы можем изменить вероятность этого решения». Это не убеждение. Это модификация поведения через среду, о которой человек не подозревает.\n\nКонкретный масштаб: рынок цифровой рекламы к 2023 году превысил 600 миллиардов долларов в год. Это больше, чем ВВП большинства стран мира. Вся эта сумма — монетизация человеческого внимания и поведенческих данных.\n\n> Саймон предупреждал в 1971-м: главный дефицит информационной эпохи — это внимание. Зубофф зафиксировала в 2019-м: это внимание стало главным сырьём планеты.\n\nМежду этими двумя наблюдениями — сорок восемь лет и крупнейшее перераспределение власти в истории медиа.", "sources": [{"title": "Шошана Зубофф — The Age of Surveillance Capitalism (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A8%D0%BE%D1%88%D0%B0%D0%BD%D0%B0%20%D0%97%D1%83%D0%B1%D0%BE%D1%84%D1%84%20%E2%80%94%20The%20Age%20of%20Surveillance%20Capitalism%20%282019%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — WTF: What's the Future and Why It's Up to Us (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20WTF%3A%20What%27s%20the%20Future%20and%20Why%20It%27s%20Up%20to%20Us%20%282017%29", "linkType": "gbooks"}, {"title": "Джарон Ланье — You Are Not a Gadget (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%BE%D0%BD%20%D0%9B%D0%B0%D0%BD%D1%8C%D0%B5%20%E2%80%94%20You%20Are%20Not%20a%20Gadget%20%282010%29", "linkType": "gbooks"}, {"title": "Скотт Гэллоуэй — The Four (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%BA%D0%BE%D1%82%D1%82%20%D0%93%D1%8D%D0%BB%D0%BB%D0%BE%D1%83%D1%8D%D0%B9%20%E2%80%94%20The%20Four%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 3.0 (2010)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%203.0%20%282010%29", "linkType": "gbooks"}, {"title": "Тим О'Рейли — What Is Web 2.0 (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%9E%27%D0%A0%D0%B5%D0%B9%D0%BB%D0%B8%20%E2%80%94%20What%20Is%20Web%202.0%20%282005%29", "linkType": "gbooks"}, {"title": "Герберт Саймон — Designing Organizations for an Information-Rich World (1971)", "url": "https://www.google.com/search?tbm=bks&q=%D0%93%D0%B5%D1%80%D0%B1%D0%B5%D1%80%D1%82%20%D0%A1%D0%B0%D0%B9%D0%BC%D0%BE%D0%BD%20%E2%80%94%20Designing%20Organizations%20for%20an%20Information-Rich%20World%20%281971%29", "linkType": "gbooks"}, {"title": "Марк Андрессен — Software Is Eating the World (2011)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D1%80%D0%BA%20%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D1%81%D1%81%D0%B5%D0%BD%20%E2%80%94%20Software%20Is%20Eating%20the%20World%20%282011%29", "linkType": "gbooks"}, {"title": "Эндрю Кин — The Cult of the Amateur (2007)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BD%D0%B4%D1%80%D1%8E%20%D0%9A%D0%B8%D0%BD%20%E2%80%94%20The%20Cult%20of%20the%20Amateur%20%282007%29", "linkType": "gbooks"}, {"title": "Джон Батель — The Search (2005)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%20%D0%91%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%20%E2%80%94%20The%20Search%20%282005%29", "linkType": "gbooks"}], "tags": ["attention", "surveillance-capitalism", "web2", "power"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "lanier", "sceneIndex": 2, "type": "privacy", "shortTitle": "Ланье", "era": "2010", "lensWeight": {"chronology": 3, "attention": 4, "platform": 3, "economy": 4, "manipulation": 4}, "title": "Ланье: ты не гаджет, ты и есть продукт", "insight": "Ланье показал: Web2 уничтожил средний класс творцов, создав структуру «победитель берёт всё» — несколько суперзвёзд и миллионы создателей, работающих бесплатно для платформ.", "thesis": "Ланье показал: Web2 уничтожил средний класс творцов, создав структуру «победитель берёт всё» — несколько суперзвёзд и миллионы создателей, работающих бесплатно для платформ.", "body": "## Голос изнутри индустрии\n\nДжарон Ланье — необычный критик платформ. Он не журналист и не учёный-аутсайдер. Он один из пионеров виртуальной реальности, человек, который в 1980-е работал в самом центре технологической революции — в Кремниевой долине, бок о бок с теми, кто строил эту индустрию. Именно поэтому его критика так убедительна: он знает систему изнутри.\n\nВ 2010 году он написал книгу «You Are Not a Gadget» — манифест разочарования. Главный тезис: платформы Web2 построены на фундаментальной лжи. Они говорят, что дают тебе сервис бесплатно. На самом деле они забирают у тебя нечто ценное — твоё творчество, твои данные, твоё время, твою индивидуальность — и монетизируют это, не делясь с тобой ничем существенным.\n\nЛанье приводит конкретные примеры, от которых трудно отмахнуться. Музыкант записывает песню, выкладывает на YouTube — и получает несколько центов за тысячу прослушиваний. YouTube зарабатывает на рекламе вокруг этой песни гораздо больше. Журналист пишет статью, которую расшаривают в Facebook сто тысяч раз — и получает ноль. Facebook зарабатывает на трафике, который эта статья генерирует. Фотограф делает снимки, которые Instagram использует для обучения алгоритмов распознавания изображений — без разрешения и без оплаты.\n\n## Исчезновение среднего класса творцов\n\nЛанье описал экономическое последствие, которое мало кто видел в 2010-м, но которое стало очевидным к 2020-м: Web2 уничтожил средний класс творцов.\n\nРаньше между звёздами и полной безвестностью существовало целое пространство — профессиональные музыканты, которые зарабатывали на жизнь концертами и продажей альбомов. Журналисты, которые кормили семьи статьями для местных газет
