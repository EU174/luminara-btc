e monde entier depuis le début des années 2010 coïncide dans le temps avec la diffusion massive des smartphones et des réseaux sociaux. Ce n’est pas un hasard.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["psychologie", "graphe social", "neurosciences", "communauté"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "haidt", "sceneIndex": 3, "type": "power", "shortTitle": "Haidt", "era": "2012→", "lensWeight": {"chronology": 4, "psychology": 4, "bonds": 3, "health": 5, "reality": 2}, "title": "Haidt : la génération anxieuse", "insight": "Haidt a réuni des données provenant de dizaines de pays: depuis 2012, l'épidémie d'anxiété et de dépression chez les adolescents coïncide dans le temps avec la diffusion massive des smartphones et d'Instagram.", "thesis": "Haidt a réuni des données provenant de dizaines de pays: depuis 2012, l'épidémie d'anxiété et de dépression chez les adolescents coïncide dans le temps avec la diffusion massive des smartphones et d'Instagram.", "body": "## Les données qui ont changé la conversation\n\nJonathan Haidt est un psychologue social de l'université de New York. En 2024, il a publié *The Anxious Generation*. Il ne s'agit pas de la panique des adultes face aux nouvelles technologies. C'est une étude systématique des données, menée sur plusieurs années, qui aboutit à une conclusion difficile à contester.\n\nÀ partir d'environ 2012, au moment où les smartphones sont devenus véritablement grand public et où Instagram a atteint une audience critique, le niveau de dépression, d'anxiété et d'automutilation chez les adolescents a commencé à augmenter en même temps dans tous les pays occidentaux. Haidt a réuni des données des États-Unis, du Royaume-Uni, du Canada, de l'Australie, de la Nouvelle-Zélande et de la Scandinavie. Partout, la même courbe: une rupture nette vers 2012-2013.\n\nPas dans un seul pays, mais dans tous. Pas chez les garçons, surtout chez les filles. Pas progressivement, mais brutalement, comme une cassure sur un graphique. La coïncidence temporelle avec la diffusion massive des smartphones et des réseaux sociaux est trop précise pour être fortuite.\n\n## Mécanismes: comment cela fonctionne\n\nHaidt décrit plusieurs mécanismes concrets par lesquels les réseaux sociaux affectent la santé psychologique des adolescents.\n\nComparaison sociale permanente. Sur Instagram, les gens publient les meilleurs moments de leur vie: filtrés, retouchés, soigneusement sélectionnés. Un adolescent voit un fil composé de corps parfaits, de vacances parfaites, de relations parfaites. Sa propre vie, observée de l'intérieur avec ses journées banales et son incertitude, paraît misérable en comparaison. Cette comparaison est infinie et inégale: on compare son quotidien aux fêtes des autres.\n\nÉvaluation publique par les likes. L'estime de soi d'un adolescent, déjà instable du fait de l'âge, se trouve littéralement liée à un chiffre sur l'écran. Tu publies une photo et tu reçois peu de likes: c'est la preuve publique que tu n'es pas assez populaire, pas assez beau, pas assez intéressant. C'est un rejet social en temps réel, visible par tous.\n\nRemplacer la communication en personne par le numérique. La communication en personne, avec ses maladresses, ses pauses et la nécessité de lire les émotions, développe l'intelligence émotionnelle. Les échanges écrits ne la développent pas. Une génération qui a grandi avec un téléphone à la place des rencontres arrive à l'âge adulte avec un déficit de véritables compétences relationnelles, et cela ne fait qu'augmenter l'anxiété dans les situations sociales.\n\nDisponibilité permanente. Avant les smartphones, les enfants avaient un refuge: le harcèlement scolaire s'arrêtait à six heures du soir, quand on rentrait à la maison. Ce n'est plus le cas. Un téléphone dans la poche signifie que l'humiliation, l'exclusion et le harcèlement sont disponibles 24 heures sur 24, sept jours sur sept. Il n'y a nulle part où se cacher.\n\nAdam Alter ajoute dans *Irresistible*: il ne s'agit pas seulement de dommages psychologiques. Selon les critères cliniques, ce qui arrive aux adolescents - retour compulsif au téléphone, perte de contrôle du temps, poursuite malgré le mal reconnu - correspond à la définition de la dépendance comportementale. Nous avons donné aux enfants un appareil addictif et nous sommes surpris par les résultats.\n\n> Haidt a réuni des données provenant de dizaines de pays: depuis 2012, l'épidémie d'anxiété et de dépression chez les adolescents coïncide dans le temps avec la diffusion massive des smartphones et d'Instagram. Ce n'est pas un hasard.\n\nNous avons mené une vaste expérience sociale sur des enfants, sans leur consentement et sans comprendre les conséquences. Les résultats de cette expérience sont désormais visibles dans les statistiques des hôpitaux psychiatriques du monde entier.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["psychologie", "santé mentale", "graphe social", "médias"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "kotler", "sceneIndex": 4, "type": "media", "shortTitle": "Kotler 4.0/5.0", "era": "2016→2021", "lensWeight": {"chronology": 3, "psychology": 3, "bonds": 2, "health": 1, "reality": 3}, "title": "Kotler 4.0 et 5.0: le marketing à l’ère des réseaux sociaux", "insight": "Kotler 4.0 a constaté ceci: la confiance est passée des marques aux personnes. Kotler 5.0 a décrit la personnalisation jusqu’à une seule personne: un outil qui fonctionne à la fois comme attention et comme manipulation.", "thesis": "Kotler 4.0 a constaté ceci: la confiance est passée des marques aux personnes. Kotler 5.0 a décrit la personnalisation jusqu’à une seule personne: un outil qui fonctionne à la fois comme attention et comme manipulation.", "body": "## Quand la confiance est passée des marques aux personnes\n\nPhilip Kotler ne s’est pas arrêté à *Marketing 3.0*. Les réseaux sociaux ont changé les règles du jeu de façon si fondamentale qu’il a fallu tout repenser, deux fois.\n\nDans *Marketing 4.0* (2016), Kotler a décrit la transformation que les réseaux sociaux ont provoquée dans la relation entre la marque et l’acheteur. Le marketing 3.0 a révélé que les gens achètent des valeurs, et non des produits. Le marketing 4.0 a ajouté qu’à l’ère des réseaux sociaux, le parcours de l’acheteur devenait non linéaire et collectif.\n\nAvant, le parcours de l’acheteur était prévisible: il voyait une publicité → s’intéressait → allait en magasin → achetait. La marque contrôlait chaque étape. Aujourd’hui, une personne voit la publication d’un autre acheteur sur Instagram → lit les avis d’inconnus sur une marketplace → regarde la vidéo d’un créateur sur YouTube → en discute dans les commentaires → et seulement ensuite, peut-être, achète. À chaque étape, la marque ne contrôle pas la conversation. Ce sont les autres personnes qui la mènent.\n\nCela a tout changé. Un influenceur avec une audience sincère de cent mille abonnés se révèle plus efficace qu’un spot télévisé à un million de dollars. Pas parce qu’il a plus de portée, mais parce que ses abonnés lui font confiance. La confiance est passée des marques aux personnes. C’est un basculement irréversible.\n\nKotler décrit un nouveau modèle du parcours de l’acheteur: Aware → Appeal → Ask → Act → Advocate. Vous découvrez le produit (Aware), il vous attire (Appeal), vous demandez l’avis des autres (Ask), vous achetez (Act) — et si vous êtes satisfait, vous devenez son ambassadeur (Advocate). Advocate boucle le cycle: il crée le contenu qui lance le parcours du prochain acheteur. Le client est devenu partie intégrante de la machine marketing.\n\n## Marketing 5.0: en tête-à-tête avec chacun\n\nDans *Marketing 5.0* (2021), Kotler a décrit l’étape suivante: les technologies — IA, big data, automatisation — permettent de personnaliser la communication jusqu’au niveau d’une seule personne, en temps réel.\n\nAvant, le ciblage ressemblait à cela: \"Publicité pour les hommes de 25 à 35 ans intéressés par le sport\". Brut, imprécis, inefficace. Le marketing 5.0 moderne fonctionne autrement: \"Ce message est pour Ivan, 28 ans, qui a regardé trois fois des tests de baskets sur YouTube, a cherché des réductions sur Google vendredi dernier, et dont les amis sur Instagram ont récemment publié des photos de leurs sorties running. Montre-lui cette offre lundi à 7 h 30 du matin, quand il va au travail\".\n\nKotler y voyait une opportunité: la technologie peut enfin vraiment servir les gens. Donner à chacun exactement ce dont il a besoin, au moment où il en a besoin. La personnalisation comme attention.\n\nMais cette même description — jusqu’à la virgule — est aussi un outil de manipulation d’une précision extrême. La seule différence tient à l’intention de celui qui l’utilise. Le même outil peut aider une personne à trouver le produit dont elle a besoin — ou créer en silence un besoin qu’elle n’avait pas.\n\nEt là surgit une question que Kotler pose, sans y répondre complètement: qui contrôle les intérêts auxquels cette personnalisation sert? Les intérêts de l’acheteur — ou ceux du vendeur?\n\n> Kotler l’a constaté: le marketing 4.0 a redonné le pouvoir aux gens via les réseaux sociaux. Le marketing 5.0 a tenté de le récupérer via l’IA. La question est de savoir à quels intérêts cet outil sert.\n\nCette contradiction — entre la technologie comme outil d’attention et la technologie comme outil de manipulation — traverse toute l’histoire de l’ère numérique. Et c’est précisément ce que Web3 essaie de résoudre: par la décentralisation, par la propriété des données, par la transparence des algorithmes.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["marketing", "graphe social", "plateformes", "psychologie"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "sunstein", "sceneIndex": 5, "type": "power", "shortTitle": "Sunstein", "era": "2001→2017", "lensWeight": {"chronology": 3, "psychology": 2, "bonds": 2, "health": 2, "reality": 5}, "title": "Sunstein: les chambres d’écho et la fin de la réalité partagée", "insight": "Sunstein a montré que les algorithmes des réseaux sociaux sont optimisés pour l’engagement, et non pour la compréhension, et que cela détruit systématiquement l’espace informationnel commun sans lequel la démocratie est impossible.", "thesis": "Sunstein a montré que les algorithmes des réseaux sociaux sont optimisés pour l’engagement, et non pour la compréhension, et que cela détruit systématiquement l’espace informationnel commun sans lequel la démocratie est impossible.", "body": "## Un problème d’architecture, pas de politique\n\nCass Sunstein est juriste et économiste comportemental à Harvard. Dans son livre \"#Republic\", il a posé une question qui semble politique, mais qui est en réalité architecturale: que devient la démocratie quand chaque citoyen vit dans sa propre bulle d’information?\n\nLa démocratie suppose un minimum commun. Les citoyens peuvent être en désaccord sur les valeurs, les priorités et les positions politiques: c’est normal, et même utile. Mais ils doivent s’accorder sur la réalité de base. Cet événement a eu lieu. Voici les données. Voici les faits. Ce n’est qu’avec une base factuelle partagée qu’on peut débattre de ce qu’il faut en faire.\n\nLes algorithmes des réseaux sociaux détruisent cet espace commun. Ils sont optimisés pour l’engagement: pour que vous restiez dans l’application le plus longtemps possible. Et qu’est-ce qui retient le mieux l’attention? Le contenu qui déclenche une émotion forte: indignation, peur, enthousiasme, colère. Le contenu qui confirme des croyances déjà présentes. Le contenu qui amplifie des émotions déjà présentes.\n\nRésultat: l’algorithme montre à chacun sa propre réalité personnelle. Non pas parce que quelqu’un l’a décidé avec mauvaise intention. Simplement parce que cela maximise l’engagement.\n\n## Les chambres d’écho: quand vous n’entendez que votre propre écho\n\nSunstein appelle cela des \"chambres d’écho\". Vous entrez dans un espace d’information où tout le monde dit à peu près ce que vous pensez déjà. Vos convictions ne font que se renforcer, parce que vous voyez une quantité infinie de confirmations. Les objections et les points de vue alternatifs sont presque absents: l’algorithme les filtre parce qu’ils réduisent l’engagement.\n\nCe n’est pas seulement désagréable. C’est destructeur pour la capacité de jugement. Quand vous n’entendez que votre propre écho, vous cessez de comprendre que d’autres personnes peuvent avoir une image différente de la réalité. Vous commencez à considérer votre version comme la seule possible. Les personnes qui ont d’autres points de vue vous paraissent malveillantes, stupides ou biaisées.\n\nLa polarisation politique des dernières années aux États-Unis, en Europe et dans d’autres régions n’est pas un hasard, ni simplement le résultat de problèmes économiques. C’est la conséquence prévisible d’une architecture optimisée pour l’engagement, et non pour la compréhension. L’algorithme n’a pas créé la polarisation. Mais il l’a amplifiée et accélérée.\n\nSunstein propose une analogie: imaginez une ville où tous les restaurants ont été remplacés par des distributeurs qui vous donnent ce que vous avez déjà mangé auparavant. Aucun nouveau goût. Aucune découverte inattendue. Seulement la confirmation des préférences déjà formées. Cela semble pratique, mais en réalité, cela rétrécit le monde.\n\n> Sunstein a montré que l’algorithme n’est pas malveillant: il est simplement optimisé pour l’engagement. Mais cela détruit l’espace informationnel commun sans lequel la démocratie est impossible.\n\nCe problème ne se résout pas par la régulation ni par des amendes pour les plateformes. Il est intégré à l’architecture du modèle économique: la plateforme gagne grâce à l’engagement, l’engagement est maximisé par le contenu émotionnel, et le contenu émotionnel polarise. On ne peut le changer qu’en modifiant le modèle économique lui-même, ou en créant une architecture alternative.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["algorithmes", "démocratie", "graphe social", "médias"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "baudrillard", "sceneIndex": 6, "type": "privacy", "shortTitle": "Baudrillard", "era": "1981", "lensWeight": {"chronology": 2, "psychology": 2, "bonds": 2, "health": 3, "reality": 5}, "title": "Baudrillard et le simulacre : la vie comme contenu", "insight": "En 1981, Baudrillard a décrit le simulacre : une image qui remplace la réalité. Sur Instagram, cela est devenu littéral : les gens produisent du contenu sur la vie au lieu de la vivre.", "thesis": "En 1981, Baudrillard a décrit le simulacre : une image qui remplace la réalité. Sur Instagram, cela est devenu littéral : les gens produisent du contenu sur la vie au lieu de la vivre.", "body": "## Le philosophe qui a décrit Instagram en 1981\n\nJean Baudrillard était un philosophe et sociologue français. En 1981, il a publié le livre « Simulacres et Simulation ». C'était un ouvrage philosophique abstrait sur la nature de l'image et de la réalité dans la société moderne. Instagram n'existait pas alors. TikTok n'existait pas. Même Internet relevait encore du monde militaire et scientifique.\n\nMais si l'on lit Baudrillard aujourd'hui, on a l'impression qu'il écrivait un reportage depuis 2024.\n\nSon idée centrale : dans le monde moderne, l'image ne reflète plus la réalité, elle la remplace. Baudrillard décrivait quatre étapes de l'image. D'abord, l'image reflète la réalité : une photographie montre à quoi ressemble un lieu. Puis, l'image masque la réalité : la publicité montre une version idéalisée d'un produit. Ensuite, l'image masque l'absence de réalité : l'image existe sans réalité correspondante. Et enfin, le simulacre : l'image n'a aucun rapport avec la réalité ; elle est devenue réalité elle-même.\n\nLe simulacre est une copie sans original. Une image qui ne reflète rien de réel, mais qui est perçue comme plus réelle que la réalité elle-même.\n\n## L'hyperréalité d'Instagram\n\nRegarde ce qui se passe sur Instagram à travers l'optique de Baudrillard.\n\nUne personne part en voyage. Avant, elle vivait le lieu : odeurs, sons, température, rencontres fortuites. Maintenant, elle photographie le lieu. Elle ne vit pas le coucher du soleil : elle le filme pour les stories. Elle ne savoure pas la nourriture : elle photographie le plat avant de commencer à manger. Elle ne vit pas l'émotion : elle pense à la façon dont elle apparaîtra dans le feed.\n\nLa simulation devient plus importante que l'expérience. L'image devient plus importante que la réalité. Et peu à peu, les gens commencent à vivre non pour faire l'expérience, mais pour produire du contenu sur l'expérience.\n\nBaudrillard aurait appelé cela l'« hyperréalité » : un état où la simulation devient plus réelle que la réalité elle-même. La version filtrée de la vie sur Instagram devient plus « réelle » que la vie réelle, avec ses imperfections et sa banalité.\n\nZygmunt Bauman, dans « Liquid Modernity », ajoute à cela la dimension de l'identité : dans le monde moderne, l'identité a cessé d'être stable. Tu n'es pas simplement celui ou celle qui est né et a grandi. Tu te reconstruis sans cesse. Les réseaux sociaux sont devenus le principal lieu de cette construction, et aussi son principal amplificateur. Tu peux être différent sur LinkedIn et sur Instagram, sur Twitter et sur TikTok. Liberté, mais aussi un nouveau type d'angoisse : où s'arrête la performance et où commence le vrai moi ?\n\nCe n'est pas seulement une abstraction philosophique. C'est la description d'un état psychologique concret, la « dissociation en ligne », que les psychologues observent : la sensation de ne pas vraiment vivre, mais d'interpréter une version de soi pour un public.\n\n> En 1981, Baudrillard a décrit ce que nous appelons aujourd'hui Instagram : un monde où l'image compte plus que l'expérience, où la simulation compte plus que la réalité, et où la personne produit du contenu sur la vie au lieu de la vivre.\n\nDans le contexte de Web3, cette observation compte pour la raison suivante : l'une des promesses d'Internet décentralisé est de rendre aux gens le contrôle non seulement de leurs données, mais aussi de leur identité. Au lieu d'un simulacre destiné à la plateforme, une identité numérique souveraine qui t'appartient. Mais reste à savoir si cela se réalisera.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94  Նորից ու նորից։ Նույնիսկ երբ սոված չէր։ Նույնիսկ երբ սնունդը երկար ժամանակ չէր գալիս, առնետը չէր դադարում։ Սքինները սա կոչեց «ընդհատվող ամրապնդման գրաֆիկ» և անվանեց այն վարքագիծ ձևավորելու ամենահզոր մեխանիզմը, որ երբևէ նկատել էր։\n\nՀիմա առնետի փոխարեն դիր քեզ։ Լծակի փոխարեն՝ «թարմացնել հոսքը» կոճակը։ Սննդի փոխարեն՝ լայք, հետաքրքիր գրառում, ընկերոջից հաղորդագրություն։ Դու բացում ես Instagram-ը, և երբեմն այնտեղ հետաքրքիր բան կա, երբեմն՝ ձանձրալի բան, երբեմն՝ կարևոր մեկի լայք, երբեմն՝ ոչինչ։ Դու նախապես չգիտես։ Հենց այդ անկանխատեսելիությունն էլ քեզ պահում է այնտեղ։\n\n## Նիր Էյալը սա վերածեց դասագրքի\n\nՆիր Էյալը 2014 թվականին գրել է «Hooked» գիրքը և լիովին անկեղծ է եղել իր մտադրությունների մասին։ Սա ստարտափների համար ուղեցույց է՝ ինչպես ստեղծել այնպիսի ապրանքներ, որոնց մարդիկ վերադառնում են առանց հիշեցման և առանց արտաքին խթանի։\n\nԷյալի մոդելը կոչվում է «կարթ»՝ չորս քայլ, որոնք կրկնվում են կրկին ու կրկին։ Թրիգեր՝ արտաքին (ծանուցում, նամակ) կամ ներքին (ձանձրույթ, անհանգստություն, միայնություն), որը գործարկում է գործողությունը։ Գործողություն՝ բացել հավելվածը, թերթել հոսքը, հրապարակել լուսանկար՝ նվազագույն ջանք, առավելագույն պարզություն։ Փոփոխական պարգև՝ երբեմն հետաքրքիր է, երբեմն ոչ, երբեմն լայք, երբեմն լռություն՝ Սքինների անկանխատեսելիությունը գործողության մեջ։ Ներդրում՝ դու ավելացնում ես բովանդակություն, նշում ես մարդկանց, կարգավորում ես պրոֆիլդ, և դրանով ապրանքը քեզ համար ավելի արժեքավոր ու հրաժարվելու համար ավելի դժվար ես դարձնում։\n\nԷյալը սա գրել էր որպես դասագիրք՝ բացահայտ և առանց ներողության։ Սոցիալական ցանցերի ինժեներները ուսումնասիրում էին այս մոդելը։ Ոմանք հետո խոստովանել են, որ այն կիրառելիս խղճի խայթ են զգացել։ Facebook-ի նախկին փոխնախագահներից մեկը՝ Չամաթ Պալիհապիթիան, 2017 թվականին հրապարակայնորեն ասաց. «Մենք ստեղծել ենք գործիքներ, որոնք քանդում են հասարակության սոցիալական հյուսվածքը»։ Նրա երեխաները սոցիալական ցանցերից չեն օգտվում։\n\nԱդամ Ալթերը «Irresistible» (2017) գրքում ավելի հեռուն գնաց և կոշտ հարց տվեց՝ արդյո՞ք ընդհանրապես նորմալ է ապրանքներ նախագծել՝ օգտագործելով նույն սկզբունքները, որոնք ընկած են խաղային ավտոմատներից կախվածության հիմքում։ Կլինիկական չափանիշներով՝ մոլագար վերադարձ, ժամանակի նկատմամբ վերահսկողության կորուստ, գիտակցված վնասի պայմաններում շարունակել օգտագործել, դադարեցնելիս հեռացման համախտանիշ՝ այն, ինչ կատարվում է սոցիալական ցանցերի շատ օգտատերերի հետ, համապատասխանում է վարքագծային կախվածության սահմանմանը։\n\n> Սքինները 1938-ին բացահայտեց փոփոխական ամրապնդումը։ Նիր Էյալը 2014-ին դա վերածեց ստարտափների համար դասագրքի։ Սոցիալական ցանցերը դա ներկառուցեցին յուրաքանչյուր հավելվածի ճարտարապետության մեջ։\n\nԶուգահեռաբար Մալքոլմ Գլադուելը «The Tipping Point» գրքում նկարագրեց համաճարակային տարածման մեխանիկան․ ցանկացած համաճարակ ունի շրջադարձային կետ, որից հետո տարածումը սկսում է ձնահյուսի պես արագանալ։ Facebook-ը հասավ այդ կետին, երբ դարձավ այն վայրը, որտեղ «բոլորը» կային, որովհետև եթե բոլոր ընկերներդ այնտեղ են, քեզ այլ ընտրություն չի մնում, քան նույնպես այնտեղ լինել։ Անհատական կախվածությունն ու հավաքական սոցիալական ճնշումը միասին են պատճառը, որ սոցիալական ցանցերից հեռանալը այդքան դժվար է։", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D ": "chronicle", "sceneIndex": 1, "type": "media", "shortTitle": "Ժամանակագրություն", "era": "2003→2020-ականներ", "lensWeight": {"chronology": 5, "psychology": 3, "bonds": 3, "health": 3, "reality": 2}, "title": "Սոցիալական ցանցերի տարեգրություն. Friendster-ից մինչև TikTok", "insight": "20 տարվա ընթացքում սոցիալական ցանցերը հաջորդաբար գրավեցին սոցիալական կյանքի բոլոր շերտերը։ 2020-ականներին միջին մարդը դրանցում օրական երկու ժամից ավելի էր անցկացնում՝ ավելի շատ, քան ցանկացած այլ զբաղմունք, բացի քնից և աշխատանքից։", "thesis": "20 տարվա ընթացքում սոցիալական ցանցերը հաջորդաբար գրավեցին սոցիալական կյանքի բոլոր շերտերը։ 2020-ականներին միջին մարդը դրանցում օրական երկու ժամից ավելի էր անցկացնում՝ ավելի շատ, քան ցանկացած այլ զբաղմունք, բացի քնից և աշխատանքից։", "body": "## Սոցիալական կյանքը փոխած քսան տարիները\n\nՔսան տարվա ընթացքում՝ 2002-ից 2022 թվականներին, սոցիալական ցանցերը ուսանողական ժամանցից դարձան գլոբալ ենթակառուցվածք, որից օգտվում է հինգ միլիարդ մարդ։ Յուրաքանչյուր ալիք նախորդից արագ էր։ Յուրաքանչյուր հարթակ գրավում էր սոցիալական կյանքի նոր շերտ։\n\nԺամանակակից իմաստով առաջին զանգվածային սոցիալական ցանցը Friendster-ն էր՝ գործարկված 2002 թվականին ԱՄՆ-ում։ Գաղափարը հեղափոխական էր թվում՝ պրոֆիլ, ընկերների ցուցակ, ընկերների ընկերներին տեսնելու հնարավորություն։ Երեք ամսում՝ երեք միլիոն օգտատեր։ Դա իր ժամանակի համար պայթյուն էր։ Բայց Friendster-ը չդիմացավ սեփական հաջողությանը. սերվերները ընկնում էին, էջերը մեկ րոպե էին բեռնվում, օգտատերերը հիասթափված հեռանում էին։ Տեխնոլոգիան չհասցրեց պահանջարկին։\n\n2003 թվականին հայտնվեց MySpace-ը և արագ դարձավ աշխարհի ամենամեծ սոցիալական ցանցը։ Նրա տարբերությունը՝ անհատականացման առավելագույն ազատություն։ Յուրաքանչյուրը կարող էր ձևավորել իր պրոֆիլը ինչպես ուզենար՝ իր գույներով, հետնամասում իր երաժշտությամբ, իր ձևավորմամբ։ MySpace-ը դարձավ երաժիշտների, արվեստագետների, ենթամշակույթների տուն։ 2005 թվականին մեդիամագնատ Rupert Murdoch-ը այն գնեց 580 միլիոն դոլարով՝ հիպի գագաթնակետին։ Հինգ տարի անց MySpace-ը մեռած էր։ Այն սպանեց Facebook-ը՝ մաքրությամբ, պարզությամբ և ալգորիթմով։\n\nՆույն 2003 թվականին LinkedIn-ը լուռ գործարկվեց մասնագիտական կապերի համար։ Առանց վառ դիզայնի, առանց զվարճանքի՝ միայն ռեզյումեներ և կոնտակտներ։ Թվում էր՝ ձանձրալի է։ Բայց LinkedIn-ը գտավ իր նիշը և այն զբաղեցրեց ընդմիշտ. մինչև 2023 թվականը՝ ավելի քան 900 միլիոն օգտատեր։\n\n## Facebook, Twitter, YouTube, Instagram\n\n2004 թվական։ Mark Zuckerberg-ը գործարկում է TheFacebook.com-ը Harvard-ի հանրակացարանի մի սենյակից։ Մի շաբաթ անց Harvard-ի ուսանողների կեսը գրանցված էր։ Մեխանիկան հանճարեղ է՝ իրական անուններ, իրական լուսանկարներ, իրական կապեր։ Ոչ մի կեղծանուն։ Սա անանուն տարածք չէ՝ իրական սոցիալական կյանքի թվային արտացոլումն է։\n\n2012 թվականին՝ մեկ միլիարդ օգտատեր։ «Facebook-ով մուտք գործել» կոճակը հայտնվեց միլիոնավոր կայքերում։ Facebook-ից դուրս գալը սկսեց նշանակել դուրս մնալ սոցիալական կյանքից։\n\n2005 թվական։ PayPal-ի երեք նախկին աշխատակիցներ ստեղծում են YouTube-ը։ Առաջին տեսանյութը՝ տասնութ վայրկյանանոց է կենդանաբանական այգում։ Մեկ տարի անց Google-ը գնում է այն 1,65 միլիարդ դոլարով՝ այն ժամանակ դա խելահեղություն էր թվում։ YouTube-ը կոտրեց հեռուստատեսության մոնոպոլիան. տեսախցիկ ունեցող ցանկացած մարդ կարող է հեռարձակել գլոբալ լսարանին։ 2023 թվականին՝ ամեն րոպե 500 ժամ տեսանյութ է վերբեռնվում։\n\n2006 թվական։ Jack Dorsey-ը հրապարակում է առաջին թվիթը։ Twitter-ը վերածվեց իրական ժամանակի գլոբալ հրապարակի. լրագրողներ, քաղաքական գործիչներ, գիտնականներ ուղղակիորեն խոսում էին լսարանի հետ՝ առանց խմբագիրների։ Արաբական գարունը կազմակերպվում էր Twitter-ի միջոցով։ Երկրաշարժերը սկզբում այնտեղ էին հայտնվում, և միայն հետո՝ նորություններում։\n\n2010 թվական։ Instagram՝ քառակուսի լուսանկարներ, ֆիլտրեր, առանց տեքստի։ Facebook-ը այն գնում է 2012 թվականին՝ մեկ միլիարդով։ Instagram-ը փոխեց տեսողական մշակույթը. ռեստորանները ձևավորում էին ինտերիերներ «Instagram-ի համար», զբոսաշրջային վայրերը գնահատվում էին իրենց «ինստագրամայնությամբ»։\n\n## VKontakte, Telegram և TikTok\n\n2006 թվական։ Pavel Durov-ը գործարկում է VKontakte-ը Saint Petersburg համալսարանի ուսանողների համար։ Ռուսաստանի, Ուկրաինայի և հետսովետական երկրների տասնյակ միլիոնավոր մարդկանց համար VKontakte-ը դարձավ առաջին ինտերնետը՝ այն վայրը, որտեղ ձևավորվում էին մի ամբողջ սերնդի թվային սովորությունները։ Durov-ի պատմությունը VKontakte-ի հետ ավարտվեց պետության հետ հակամարտությամբ՝ 2014 թվականին։ Նա հեռացավ և ստեղծեց Telegram-ը։ Դրա մասին կխոսենք հաջորդ գլուխներում։\n\n2016 թվականին՝ Չինաստանում, 2018-ին՝ TikTok-ի գլոբալ գործարկումը։ Սա արմատական տեղաշարժ է. գլխավոր feed-ը՝ «For You Page»-ը, քեզ ցույց է տալիս լրիվ անծանոթ մարդկանց տեսանյութեր, որոնք ընտրվել են քո վարքագծի հիման վրա գործող ալգորիթմի կողմից։ Դու չես ընտրում՝ ինչ դիտել. ալգորիթմն է որոշում։ TikTok-ում միջին ժամանակը օրական ավելի քան 90 րոպե է։ TikTok-ը բարձրացրեց մի հարց, որն առաջ այսքան սուր չէր հնչել. ի՞նչ է տեղի ունենում, երբ միլիարդների իրականությունը ձևավորող ալգորիթմը պատկանում է այլ պետության իրավազորության տակ գտնվող ընկերության։\n\n> Քսան տարվա ընթացքում սոցիալական ցանցերը հաջորդաբար գրավեցին սոցիալական կյանքի բոլոր շերտերը՝ մասնագիտական կապեր, ընկերություն, հանրային դիսկուրս, տեսանյութ, տեսողական ինքնություն, զվարճանք։ 2020-ականների կեսերին միջին մարդը դրանցում օրական երկու ժամից ավելի էր անցկացնում։\n\nԴա ավելի շատ է, քան մարդու կյանքում ցանկացած այլ զբաղմունք, բացի քնից և աշխատանքից։ Պատմության մեջ ոչ մի տեխնոլոգիա այսքան շատ մարդկանցից այսքան շատ ժամանակ չի խլել։", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20% %80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["սոցիալական գրաֆ", "պատմություն", "հարթակներ", "Telegram"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "dunbar", "sceneIndex": 2, "type": "privacy", "shortTitle": "Դանբար", "era": "1992", "lensWeight": {"chronology": 2, "psychology": 2, "bonds": 5, "health": 3, "reality": 1}, "title": "Դանբար. հազար ընկեր ընդդեմ հարյուր հիսունի", "insight": "Դանբարը ցույց տվեց, որ ուղեղը նախատեսված է 150 հարաբերության համար։ Սոցիալական ցանցերում հազար «ընկեր» այդ սահմանը չի ընդլայնում. այն յուրաքանչյուր շփումը դարձնում է մակերեսային և ուժեղացնում է միայնակությունը։", "thesis": "Դանբարը ցույց տվեց, որ ուղեղը նախատեսված է 150 հարաբերության համար։ Սոցիալական ցանցերում հազար «ընկեր» այդ սահմանը չի ընդլայնում. այն յուրաքանչյուր շփումը դարձնում է մակերեսային և ուժեղացնում է միայնակությունը։", "body": "## Այն թիվը, որը միլիոն տարի չի փոխվել\n\n1992 թվականին բրիտանացի մարդաբան Ռոբին Դանբարը հրապարակեց մի ուսումնասիրություն, որը դարձավ մարդաբանության ամենահաճախ մեջբերվող աշխատանքներից մեկը։ Նա ուսումնասիրում էր տարբեր պրիմատների մոտ նեոկորտեքսի՝ սոցիալական ճանաչողության համար պատասխանատու ուղեղի մասի չափը։ Եվ հստակ կապ հայտնաբերեց. որքան մեծ է նեոկորտեքսը ուղեղի ընդհանուր չափի համեմատ, այնքան մեծ սոցիալական խմբերով է ապրում տվյալ տեսակը։\n\nՄարդու համար Դանբարը հաշվարկեց այս թիվը՝ մոտ 150։ Ահա թե որքան կայուն սոցիալական հարաբերություն կարող է միաժամանակ պահպանել մարդու ուղեղը։ Ոչ միայն «ծանոթներ», այլ մարդիկ, որոնց կյանքի ընթացքը դու հետևում ես, որոնց հետ պատմություն ունես, որոնց որոշակի մակարդակով վստահում ես։\n\nԱյս թիվը՝ 150-ը, կոչվում է «Դանբարի թիվ»։ Այն կրկնվում է ամենատարբեր համատեքստերում։ Պատմության ընթացքում արդյունավետ ռազմական ստորաբաժանումների չափը մոտ 150 մարդ է եղել։ Ավանդական որսորդ-հավաքարար գյուղերի չափը մոտ 150 մարդ է եղել։ Ամուր համախմբված կրոնական համայնքների չափը մոտ 150 մարդ է եղել։ Ոչ թե որովհետև ինչ-որ մեկը այդպես է որոշել։ Պարզապես դա է մեր ուղեղի մշակման սահմանը։\n\n## Ինչ է կատարվում ուղեղի հետ, երբ կա հազար «ընկեր»\n\nՀիմա նայիր քո Facebook-ին կամ Instagram-ին։ Քանի՞ «ընկեր» կամ հետևորդ ունես։ Հարյո՞ւրներ։ Հազարնե՞ր։ Սոցիալական ցանցերը մեզ տվեցին հնարավորություն կապ պահպանելու մարդկանց հետ, որոնց թիվը մեր ճանաչողական սահմանը հինգից մինչև քսան անգամ գերազանցում է։\n\nՄեր ուղեղը չի փոխվել։ Էվոլյուցիան տեխնոլոգիաներին չի հասցրել հետևել։ Ի՞նչ է լինում, երբ մարդը փորձում է կառավարել սոցիալական կյանք, որը տասնապատիկ գերազանցում է իր ճանաչողական հնարավորությունները։ Նա սկսում է պարզեցնել։ Արագ, մակերեսային, զգացմունքային արձագանքել։ Խոսակցության փոխարեն՝ լայք։ Հասկացողության փոխարեն՝ արձագանք։ Անձնական հաղորդագրության փոխարեն՝ հրապարակային մեկնաբանություն։\n\nՍա ծուլություն չէ և ոչ էլ անկում։ Սա նյարդակենսաբանական գերծանրաբեռնվածություն է։ Ուղեղը անում է միակ բանը, որ կարող է՝ ազդանշանները հասցնում է նվազագույնի։ Բարդ հուզական փոխազդեցության փոխարեն՝ սեղմել սրտիկը։ Անկեղծ խոսակցության փոխարեն՝ լուսանկարի տակ գրել «շնորհավորում եմ»։\n\nԱհա թե ինչու սոցիալական ցանցերում հազար ընկեր ունենալը մեզ ավելի երջանիկ կամ պակաս միայնակ չի դարձնում։ Հետազոտությունները՝ ներառյալ Հեյդթի հիշատակած աշխատանքները, ցույց են տալիս հակառակը. առցանց «կապերի» քանակի աճը կապակցված է միայնակության զգացողության աճի հետ։ Որովհետև ուղեղը չի կարող տարբերել մակերեսային առցանց շփումը իրական կապից. այն պարզապես գերծանրաբեռնվում է և հուզականորեն անջատվում։\n\nՍրան ավելացրու այն, ինչ Գլադվելը նկարագրել է «The Tipping Point»-ում. երբ հարթակը հասնում է կրիտիկական զանգվածի, այնտեղ ներկայությունը դառնում է սոցիալական անհրաժեշտություն։ Դու Facebook-ում չես լինում շփման որակի պատճառով։ Դու այնտեղ ես, որովհետև բոլորը այնտեղ են։ Եվ սա նշանակում է, որ դատապարտված ես անվերջ թերթել մարդկանց հոսքը, որոնց հետ ունես «կապ» առանց իրական կապի։\n\n> Դանբարը ցույց տվեց. մեր ուղեղը կառուցված է 150 հարաբերության համար։ Սոցիալական ցանցերը մեզ տվեցին հազարավոր հարաբերություններ և յուրաքանչյուրն էլ մակերեսային դարձրեցին։ Ավելի շատ կապերը չեն նշանակում պակաս միայնակություն։\n\nՍա բացատրում է սոցիալական ցանցերի դարաշրջանի գլխավոր պարադոքսներից մեկը. մենք երբեք այսքան «կապակցված» չենք եղել և երբեք այսքան միայնակ չենք զգացել մեզ։ Միայնակության համաճարակը, որը հոգեբանները ամբողջ աշխարհում գրանցում են 2010-ականների սկզբից, ժամանակով համընկնում է սմարթֆոնների և սոցիալական ցանցերի զանգվածային տարածման հետ։ Սա պատահականություն չէ.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neo dy": "## Բանավեճը փոխած տվյալները\n\nՋոնաթան Հայդթը Նյու Յորքի համալսարանի սոցիալական հոգեբան է։ 2024 թվականին նա հրապարակեց *The Anxious Generation* գիրքը։ Սա նոր տեխնոլոգիաներից մեծահասակների խուճապը չէ։ Սա տվյալների բազմամյա, համակարգված ուսումնասիրություն է, որը հանգեցրել է դժվար վիճարկելի եզրակացության։\n\nՄոտավորապես 2012 թվականից սկսած, երբ սմարթֆոնները իսկապես մասսայական դարձան, իսկ Instagram-ը ձեռք բերեց քննադատական լսարան, դեռահասների շրջանում դեպրեսիայի, տագնապի և ինքնավնասման մակարդակը սկսեց միաժամանակ աճել բոլոր արևմտյան երկրներում։ Հայդթը տվյալներ է հավաքել ԱՄՆ-ից, Միացյալ Թագավորությունից, Կանադայից, Ավստրալիայից, Նոր Զելանդիայից և Սկանդինավիայից։ Ամենուր նույն կորն է՝ կտրուկ շրջադարձ շուրջ 2012–2013 թվականներին։\n\nՈչ մեկ երկրում՝ բոլորում։ Ոչ տղաների մոտ՝ հատկապես աղջիկների մոտ։ Ոչ աստիճանաբար՝ այլ կտրուկ, ինչպես գրաֆիկի վրա մի կոտրվածք։ Ժամանակային համընկնումը սմարթֆոնների և սոցիալական ցանցերի զանգվածային տարածման հետ չափազանց ճշգրիտ է, որպեսզի պատահական լինի։\n\n## Մեխանիզմները. ինչպես է դա աշխատում\n\nՀայդթը նկարագրում է մի քանի կոնկրետ մեխանիզմ, որոնց միջոցով սոցիալական ցանցերը ազդում են դեռահասների հոգեբանական առողջության վրա։\n\nՄշտական սոցիալական համեմատություն։ Instagram-ում մարդիկ հրապարակում են իրենց կյանքի լավագույն պահերը՝ զտված, խմբագրված, ուշադիր ընտրված։ Դեռահասը տեսնում է հարթակ, որը կազմված է կատարյալ մարմիններից, կատարյալ արձակուրդներից, կատարյալ հարաբերություններից։ Իր սեփական կյանքը, ներսից դիտված՝ իր ձանձրալի առօրյայով ու անորոշությամբ, դրա կողքին ողորմելի է թվում։ Այս համեմատությունը անվերջ է և անհավասար. դու համեմատում ես քո առօրյան ուրիշների տոների հետ։\n\nՀանրային գնահատում լայքերի միջոցով։ Դեռահասի ինքնագնահատականը, որն արդեն իսկ անկայուն է տարիքի պատճառով, բառացիորեն կապվում է էկրանի վրա երևացող թվի հետ։ Լուսանկար ես հրապարակում և քիչ լայք ես ստանում. դա հանրային ապացույց է, որ դու բավականաչափ հայտնի չես, բավականաչափ գեղեցիկ չես, բավականաչափ հետաքրքիր չես։ Սա իրական ժամանակում տեղի ունեցող սոցիալական մերժում է, որը տեսանելի է բոլորի համար։\n\nԿենդանի հաղորդակցության փոխարինումը թվայինով։ Կենդանի շփումը՝ իր անհարմարությամբ, դադարներով և էմոցիաները կարդալու անհրաժեշտությամբ, զարգացնում է հուզական ինտելեկտը։ Տեքստային փոխազդեցությունները դա չեն զարգացնում։ Հանդիպումների փոխարեն հեռախոսով մեծացած սերունդը չափահաս կյանք է մտնում իրական հաղորդակցման հմտությունների պակասով, և դա միայն ուժեղացնում է տագնապը սոցիալական իրավիճակներում։\n\nՕր ու գիշեր հասանելիություն։ Սմարթֆոններից առաջ երեխաներն ունեին ապաստարան. դպրոցական ծաղրանքը ավարտվում էր երեկոյան վեցին, երբ դու տուն էիր գալիս։ Հիմա՝ ոչ։ Գրպանում եղած հեռախոսը նշանակում է, որ նվաստացումը, մեկուսացումը, ծաղրանքը հասանելի են օրական 24 ժամ, շաբաթը յոթ օր։ Թաքնվելու տեղ չկա։\n\nԱդամ Ալթերը *Irresistible*-ում ավելացնում է. սա պարզապես հոգեբանական վնաս չէ։ Կլինիկական չափանիշներով այն, ինչ տեղի է ունենում դեռահասների հետ՝ հեռախոսին մոլագար վերադարձը, ժամանակի նկատմամբ վերահսկողության կորուստը, գիտակցված վնասի მიუხედავად շարունակելը, համապատասխանում է վարքագծային կախվածության սահմանմանը։ Մենք երեխաներին տվեցինք կախվածություն առաջացնող սարք և զարմանում ենք արդյունքներից։\n\n> Հայդթը տվյալներ է հավաքել տասնյակ երկրներից. 2012 թվականից սկսած դեռահասների շրջանում տագնապի և դեպրեսիայի համաճարակը ժամանակային առումով համընկնում է սմարթֆոնների և Instagram-ի զանգվածային տարածման հետ։ Սա պատահականություն չէ։\n\nՄենք երեխաների վրա լայնածավալ սոցիալական փորձարկում ենք անցկացրել՝ առանց նրանց համաձայնության և առանց հետևանքները հասկանալու։ Այդ փորձարկման արդյունքներն այժմ երևում են ամբողջ աշխարհի հոգեբուժական հիվանդանոցների վիճակագրության մեջ։", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%2 000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["հոգեբանություն", "հոգեկան առողջություն", "սոցիալական գրաֆ", "մեդիա"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "kotler", "sceneIndex": 4, "type": "media", "shortTitle": "Կոտլեր 4.0/5.0", "era": "2016→2021", "lensWeight": {"chronology": 3, "psychology": 3, "bonds": 2, "health": 1, "reality": 3}, "title": "Կոտլեր 4.0 և 5.0. մարքեթինգը սոցիալական ցանցերի դարում", "insight": "Kotler 4.0-ը արձանագրեց սա. վստահությունը բրենդներից անցավ մարդկանց։ Kotler 5.0-ը նկարագրեց անհատականացումը մինչև մեկ մարդ․ գործիք, որը նույնքան աշխատում է և՛ որպես հոգատարություն, և՛ որպես մանիպուլյացիա։", "thesis": "Kotler 4.0-ը արձանագրեց սա. վստահությունը բրենդներից անցավ մարդկանց։ Kotler 5.0-ը նկարագրեց անհատականացումը մինչև մեկ մարդ․ գործիք, որը նույնքան աշխատում է և՛ որպես հոգատարություն, և՛ որպես մանիպուլյացիա։", "body": "## Երբ վստահությունը բրենդներից անցավ մարդկանց\n\nՖիլիպ Կոտլերը չկանգնեց «Marketing 3.0»-ում։ Սոցիալական ցանցերը խաղի կանոնները փոխեցին այնքան հիմնարար, որ ամեն ինչ պետք էր նորից վերաիմաստավորել՝ երկու անգամ։\n\n«Marketing 4.0»-ում (2016) Կոտլերը արձանագրեց այն փոխակերպումը, որ սոցիալական ցանցերը բերեցին բրենդի և գնորդի հարաբերություններում։ Marketing 3.0-ը բացեց մի բան. մարդիկ գնում են արժեքներ, ոչ թե ապրանքներ։ Marketing 4.0-ը ավելացրեց. սոցիալական ցանցերի դարաշրջանում գնորդի ճանապարհը դարձավ ոչ գծային և հավաքական։\n\nՆախկինում գնորդի ճանապարհը կանխատեսելի էր. տեսավ գովազդը → հետաքրքրվեց → եկավ խանութ → գնեց։ Բրենդը վերահսկում էր յուրաքանչյուր քայլը։ Հիմա մարդը Instagram-ում տեսնում է մեկ այլ գնորդի գրառումը → marketplace-ում կարդում է անծանոթների կարծիքները → YouTube-ում դիտում է բլոգերի տեսությունը → քննարկում է մեկնաբանություններում → և միայն հետո, գուցե, գնում է։ Յուրաքանչյուր քայլում բրենդը չի վերահսկում զրույցը։ Զրույցը վարում են այլ մարդիկ։\n\nՍա ամեն ինչ փոխեց։ Հարյուր հազար հետևորդ ունեցող անկեղծ լսարանով ինֆլուենսերը ավելի արդյունավետ է դառնում, քան մեկ միլիոն դոլարի հեռուստատեսային հոլովակը։ Ոչ թե որովհետև նրա հասանելիությունն ավելի մեծ է, այլ որովհետև նրա լսարանը վստահում է նրան։ Վստահությունը բրենդներից անցավ մարդկանց։ Սա անշրջելի տեղաշարժ է։\n\nԿոտլերը նկարագրում է գնորդի ճանապարհի նոր մոդելը՝ Aware → Appeal → Ask → Act → Advocate։ Դու իմանում ես ապրանքի մասին (Aware), այն գրավում է քեզ (Appeal), հարցնում ես ուրիշների կարծիքը (Ask), գնում ես (Act) — և եթե գոհ ես, դառնում ես դրա դեսպանը (Advocate)։ Advocate-ը փակում է ցիկլը. նա ստեղծում է այն բովանդակությունը, որը սկսում է հաջորդ գնորդի ճանապարհը։ Հաճախորդը դարձավ մարքեթինգային մեքենայի մի մասը։\n\n## Marketing 5.0. մեկը մեկի հետ\n\n«Marketing 5.0»-ում (2021) Կոտլերը նկարագրեց հաջորդ մակարդակը. տեխնոլոգիաները՝ AI, մեծ տվյալներ, ավտոմատացում, հնարավորություն են տալիս հաղորդակցությունը իրական ժամանակում անհատականացնել մինչև մեկ մարդու մակարդակ։\n\nՆախկինում թիրախավորումը այսպես էր երևում. «Գովազդ 25-35 տարեկան, սպորտով հետաքրքրվող տղամարդկանց համար»։ Կոպիտ, անճշգրիտ, անարդյունավետ։ Ժամանակակից Marketing 5.0-ը այլ կերպ է աշխատում. «Այս հաղորդագրությունը Իվանի համար է, 28 տարեկան, որը երեք անգամ դիտել է կեդերի կարծիքները YouTube-ում, անցած ուրբաթ օրը Google-ում որոնել է զեղչեր, և որի ընկերները Instagram-ում վերջերս վազքից լուսանկարներ են հրապարակել։ Ցույց տուր նրան այս առաջարկը երկուշաբթի առավոտյան ժամը 7:30-ին, երբ նա աշխատանքի է գնում»։\n\nԿոտլերը այստեղ հնարավորություն էր տեսնում. տեխնոլոգիան վերջապես կարող է իսկապես ծառայել մարդկանց։ Յուրաքանչյուրին տալ հենց այն, ինչ նրան պետք է, այն ժամանակ, երբ դա պետք է։ Անհատականացում՝ որպես հոգատարություն։\n\nԲայց նույն այս նկարագրությունը՝ մինչև ստորակետը, նաև առավել ճշգրիտ մանիպուլյացիայի գործիք է։ Տարբերությունը միայն այն մարդու մտադրության մեջ է, ով օգտագործում է այն։ Նույն գործիքը կարող է օգնել մարդուն գտնել իրեն անհրաժեշտ ապրանքը — կամ աննկատ ձևավորել նրա մեջ կարիք, որը նա չուներ։\n\nԵվ այստեղ առաջանում է հարց, որը Կոտլերը բարձրացնում է, բայց ամբողջությամբ չի պատասխանում. ո՞վ է վերահսկում, թե ում շահերին է ծառայում այս անհատականացումը։ Գնորդի շահե՞րին — թե՞ վաճառողի։\n\n> Կոտլերը ֆիքսեց սա. Marketing 4.0-ը իշխանությունը վերադարձրեց մարդկանց՝ սոցիալական ցանցերի միջոցով։ Marketing 5.0-ը փորձեց այն վերադարձնել AI-ի միջոցով։ Հարցն այն է, թե ում շահերին է ծառայում այս գործիքը։\n\nԱյս հակասությունը՝ տեխնոլոգիայի՝ որպես հոգատարության գործիքի և տեխնոլոգիայի՝ որպես մանիպուլյացիայի գործիքի միջև, անցնում է թվային դարաշրջանի ամբողջ պատմության միջով։ Եվ հենց դա է փորձում լուծել Web3-ը՝ ապակենտրոնացման միջոցով, տվյալների սեփականության միջոցով, ալգորիթմների թափանցիկության միջոցով.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "ur ընդհանուր իրականության ավարտը", "insight": "Սանստեյնը ցույց տվեց. սոցիալական ցանցերի ալգորիթմները օպտիմիզացված են ներգրավվածության, ոչ թե ըմբռնման համար, և դա համակարգային կերպով քանդում է ընդհանուր տեղեկատվական տարածքը, առանց որի ժողովրդավարությունը հնարավոր չէ։", "thesis": "Սանստեյնը ցույց տվեց. սոցիալական ցանցերի ալգորիթմները օպտիմիզացված են ներգրավվածության, ոչ թե ըմբռնման համար, և դա համակարգային կերպով քանդում է ընդհանուր տեղեկատվական տարածքը, առանց որի ժողովրդավարությունը հնարավոր չէ։", "body": "## Ճարտարապետական խնդիր, ոչ թե քաղաքական\n\nՔես Սանստեյնը Հարվարդի իրավագետ և վարքագծային տնտեսագետ է։ Իր \"#Republic\" գրքում նա բարձրացրեց մի հարց, որը քաղաքական է թվում, բայց իրականում ճարտարապետական է. ինչ է տեղի ունենում ժողովրդավարության հետ, երբ յուրաքանչյուր քաղաքացի ապրում է իր սեփական տեղեկատվական պղպջակի մեջ։\n\nԺողովրդավարությունը ենթադրում է ընդհանուրի որոշակի նվազագույնը։ Քաղաքացիները կարող են չհամաձայնել արժեքների, առաջնահերթությունների և քաղաքական հայացքների շուրջ, և դա նորմալ է, նույնիսկ օգտակար։ Բայց նրանք պետք է համաձայն լինեն հիմնական իրականության շուրջ։ Ահա այս իրադարձությունը տեղի ունեցավ։ Ահա այս տվյալները։ Ահա այս փաստերը։ Միայն ընդհանուր փաստական հիմք ունենալով է հնարավոր վիճել, թե ինչ անել դրա հետ։\n\nՍոցիալական ցանցերի ալգորիթմները քանդում են այդ ընդհանուր տարածքը։ Դրանք օպտիմիզացված են ներգրավվածության համար՝ որպեսզի դու հնարավորինս երկար մնաս հավելվածում։ Իսկ ի՞նչն է ամենալավը պահում ուշադրությունը։ Այնպիսի բովանդակությունը, որը ուժեղ զգացողություն է առաջացնում՝ զայրույթ, վախ, հիացմունք, վրդովմունք։ Այն բովանդակությունը, որը հաստատում է արդեն գոյություն ունեցող համոզմունքները։ Այն բովանդակությունը, որը ուժեղացնում է արդեն գոյություն ունեցող զգացմունքները։\n\nԱրդյունքում ալգորիթմը յուրաքանչյուրին ցույց է տալիս իր անձնական իրականությունը։ Ոչ թե որովհետև ինչ-որ մեկը դա չար նպատակով է որոշել։ Պարզապես որովհետև դա առավելագույնի է հասցնում ներգրավվածությունը։\n\n## Էխո-խցիկներ. երբ լսում ես միայն քո արձագանքը\n\nՍանստեյնը սա անվանում է «էխո-խցիկներ»։ Դու մտնում ես տեղեկատվական միջավայր, որտեղ բոլորը մոտավորապես ասում են այն, ինչ արդեն մտածում ես։ Քո համոզմունքները միայն ուժեղանում են, որովհետև դու տեսնում ես անվերջ հաստատումներ։ Առարկությունները և այլընտրանքային տեսակետները գրեթե չկան՝ ալգորիթմը դրանք ֆիլտրում է, որովհետև դրանք նվազեցնում են ներգրավվածությունը։\n\nՍա պարզապես տհաճ չէ։ Սա կործանարար է դատողության կարողության համար։ Երբ լսում ես միայն քո արձագանքը, դադարում ես հասկանալ, որ այլ մարդիկ կարող են ունենալ իրականության այլ պատկեր։ Սկսում ես քո տարբերակը տեսնել որպես միակ հնարավոր տարբերակ։ Այլ հայացքներ ունեցող մարդկանց սկսում ես ընկալել որպես չարամիտ, հիմար կամ կողմնակալ։\n\nՎերջին տարիների քաղաքական բևեռացումը ԱՄՆ-ում, Եվրոպայում և այլ տարածաշրջաններում պատահականություն չէ և պարզապես տնտեսական խնդիրների արդյունք էլ չէ։ Դա ներգրավվածության, ոչ թե ըմբռնման համար օպտիմիզացված ճարտարապետության կանխատեսելի հետևանքն է։ Ալգորիթմը չի ստեղծել բևեռացումը։ Բայց այն մեծացրել ու արագացրել է այն։\n\nՍանստեյնը առաջարկում է մի համեմատություն. պատկերացրու քաղաք, որտեղ բոլոր ռեստորանները փոխարինված են ավտոմատներով, որոնք քեզ տալիս են այն, ինչ արդեն նախկինում կերել ես։ Նոր համեր չկան։ Անսպասելի բացահայտումներ չկան։ Միայն արդեն ձևավորված նախընտրությունների հաստատում կա։ Սա հարմար է թվում, բայց իրականում նեղացնում է աշխարհը։\n\n> Սանստեյնը ցույց տվեց. ալգորիթմը չար չէ՝ պարզապես օպտիմիզացված է ներգրավվածության համար։ Բայց դա քանդում է ընդհանուր տեղեկատվական տարածքը, առանց որի ժողովրդավարությունը հնարավոր չէ։\n\nԱյս խնդիրը չի լուծվում կարգավորմամբ կամ հարթակների տուգանքներով։ Այն ներկառուցված է բիզնես-մոդելի ճարտարապետության մեջ. հարթակը եկամուտ է ստանում ներգրավվածությունից, ներգրավվածությունը առավելագույնի է հասցվում զգացմունքային բովանդակության միջոցով, իսկ զգացմունքային բովանդակությունը բևեռացնում է։ Դա կարելի է փոխել միայն բիզնես-մոդելն ինքնին փոխելով կամ այլընտրանքային ճարտարապետություն ստեղծելով.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1% կակից աշխարհում պատկերը այլևս իրականությունը չի արտացոլում, այլ փոխարինում է նրան։ Բոդրիյարը նկարագրում էր պատկերի չորս փուլ։ Սկզբում պատկերը արտացոլում է իրականությունը. լուսանկարը ցույց է տալիս, թե ինչպիսին է որևէ վայր։ Հետո պատկերը քողարկում է իրականությունը. գովազդը ցույց է տալիս ապրանքի իդեալականացված տարբերակը։ Հետո պատկերը քողարկում է իրականության բացակայությունը. պատկերը գոյություն ունի առանց համապատասխան իրականության։ Եվ վերջապես՝ սիմուլյակրը. պատկերը որևէ կապ չունի իրականության հետ, այն ինքն է դարձել իրականություն։\n\nՍիմուլյակրը առանց բնօրինակի կրկնօրինակ է։ Պատկեր, որը ոչ մի իրական բան չի արտացոլում, բայց ընկալվում է որպես ավելի իրական, քան իրականությունն ինքն է։\n\n## Instagram-ի հիպերիրականությունը\n\nՆայիր, թե ինչ է տեղի ունենում Instagram-ում՝ Բոդրիյարի տեսանկյունից։\n\nՄարդը ճանապարհորդության է գնում։ Նախկինում նա զգում էր վայրը՝ հոտերը, ձայները, ջերմաստիճանը, պատահական հանդիպումները։ Հիմա նա լուսանկարում է վայրը։ Նա չի ապրում մայրամուտը՝ նա այն նկարահանում է stories-ի համար։ Նա չի վայելում ուտելիքը՝ ուտեստը լուսանկարում է, նախքան սկսելը ուտել։ Նա զգացմունքը չի ապրում՝ մտածում է, թե այն ինչպես կերևա ֆիդում։\n\nՍիմուլյացիան սկսում է ավելի կարևոր դառնալ, քան փորձը։ Պատկերը ավելի կարևոր է դառնում, քան իրականությունը։ Եվ աստիճանաբար մարդիկ սկսում են ապրել ոչ թե ապրելու, այլ ապրելու մասին բովանդակություն ստեղծելու համար։\n\nԲոդրիյարը դա կկոչեր «հիպերիրականություն»՝ մի վիճակ, երբ սիմուլյացիան ավելի իրական է դառնում, քան իրականությունն ինքն է։ Instagram-ում կյանքի ֆիլտրացված տարբերակը ավելի «իրական» է դառնում, քան իրական կյանքը՝ իր անկատարությամբ ու առօրեականությամբ։\n\nԶիգմունդ Բաումանը «Liquid Modernity»-ում դրան ավելացնում է ինքնության հարթությունը. ժամանակակից աշխարհում ինքնությունը դադարել է կայուն լինել։ Դու պարզապես այն մարդը չես, որին ծնվել ու մեծացել ես։ Դու անընդհատ քեզ նորից ես կառուցում։ Սոցիալական ցանցերը դարձել են այդ կառուցման գլխավոր հարթակը և դրա գլխավոր ուժեղացուցիչը։ Դու կարող ես տարբեր լինել LinkedIn-ում և Instagram-ում, Twitter-ում և TikTok-ում։ Ազատություն, բայց նաև նոր տեսակի անհանգստություն՝ որտեղ է ավարտվում performance-ը, և որտեղ է սկսվում իսկական ես-ը։\n\nՍա պարզապես փիլիսոփայական աբստրակցիա չէ։ Սա կոնկրետ հոգեբանական վիճակի՝ «օնլայն դիսոցիացիայի» նկարագրությունն է, որը արձանագրում են հոգեբանները. այն զգացումը, թե դու իրականում չես ապրում, այլ հանդիսատեսի համար խաղում ես քո մի տարբերակը։\n\n> Բոդրիյարը 1981 թվականին նկարագրել էր այն, ինչ մենք հիմա անվանում ենք Instagram. մի աշխարհ, որտեղ պատկերը ավելի կարևոր է, քան փորձը, սիմուլյացիան ավելի կարևոր է, քան իրականությունը, և մարդը կյանքն ապրելու փոխարեն կյանքի մասին բովանդակություն է ստեղծում։\n\nWeb3-ի համատեքստում այս դիտարկումը կարևոր է հետևյալ պատճառով. ապակենտրոնացված ինտերնետի խոստումներից մեկը մարդկանց վերադարձնել վերահսկողությունը ոչ միայն տվյալների, այլև ինքնության նկատմամբ։ Պլատֆորմի համար սիմուլյակրի փոխարեն՝ քեզ պատկանող ինքնիշխան թվային ինքնություն։ Բայց արդյոք դա կհաջողվի, բաց հարց է մնում։", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%2 const LANGS = ["ru", "en", "uk", "kk", "uz", "es", "fr", "hy"];
const LANG_LABELS = {"ru": "RU", "en": "EN", "uk": "UK", "kk": "KK", "uz": "UZ", "es": "ES", "fr": "FR", "hy": "HY"};
let CURRENT_LANG = 'ru';
function pickLang(l){ return LANGS.indexOf(l)>=0 ? l : 'ru'; }
function applyLang(l){
  l = pickLang(l); CURRENT_LANG = l;
  const src = CHAPTER_I18N[l];
  // подменяем содержимое рабочего CHAPTER_DATA
  CHAPTER_DATA.chapter.title = src.chapter.title;
  CHAPTER_DATA.chapter.lede = src.chapter.lede;
  CHAPTER_DATA.chapter.centralIdea = src.chapter.centralIdea;
  CHAPTER_DATA.lenses.forEach((ls,i)=>{ ls.label=src.lenses[i].label; ls.description=src.lenses[i].description; });
  CHAPTER_DATA.nodes.forEach((n,i)=>{ const s=src.nodes[i];
    n.shortTitle=s.shortTitle; n.era=s.era; n.title=s.title; n.insight=s.insight;
    n.thesis=s.thesis; n.body=s.body; n.tags=s.tags; });
  CHAPTER_DATA.edges.forEach((e,i)=>{ e.label=src.edges[i].label; });
  // UI-строки
  const _U = UI_I18N[l] || UI_I18N.ru; const _R = UI_I18N.ru || {};
  const U = {}; Object.keys(_R).forEach(k=>{ U[k] = (_U[k] && String(_U[k]).trim()) ? _U[k] : _R[k]; });
  document.documentElement.lang = l;
  const t=document.getElementById('app-title'); if(t) t.textContent=src.chapter.title;
  const ld=document.querySelector('.chapter-lede'); if(ld) ld.textContent=src.chapter.lede;
  document.querySelectorAll('[data-ui]').forEach(el=>{ const k=el.getAttribute('data-ui'); if(U[k]) el.textContent=U[k]; });
  // локализованный typeLabel + перестройка линз (иначе останутся на языке сборки)
  window.__UI_LOC = U;
  try{ buildLenses(); setLens(state.lens); }catch(e){}
  // перерисовать карту/деталь/прогресс
  try{ renderAll(); }catch(e){}
  // отметить активную кнопку языка
  document.querySelectorAll('.lang-btn').forEach(b=>b.setAttribute('aria-pressed', b.getAttribute('data-lang')===l ? 'true':'false'));
}
function buildLangSwitcher(){
  const rail=document.querySelector('.rail'); if(!rail) return;
  const wrap=document.createElement('div'); wrap.className='lang-switch';
  LANGS.forEach(l=>{ const b=document.createElement('button'); b.className='lang-btn'; b.type='button';
    b.setAttribute('data-lang',l); b.textContent=LANG_LABELS[l];
    b.addEventListener('click',()=>applyLang(l)); wrap.appendChild(b); });
  rail.insertBefore(wrap, rail.firstChild);
}


window.addEventListener("message",function(ev){try{var d=ev.data||{};if(d.lang){applyLang(d.lang);}}catch(e){}});
async function boot(){buildLangSwitcher();var _q=new URLSearchParams(location.search).get("lang");var _h=(location.hash.match(/[?&]lang=([a-z]{2})/)||[])[1];var _lp=_q||_h;if(_lp)CURRENT_LANG=pickLang(_lp);buildLenses();setLens(state.lens);applyLang(CURRENT_LANG);}
document.addEventListener("DOMContentLoaded",()=>{try{boot();}catch(e){renderEmptyState("Ошибка инициализации: "+e.message);}});
</script>
