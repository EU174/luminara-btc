ya reallikdan muhimroq, inson esa hayotni yashash o'rniga hayot haqida kontent ishlab chiqaradigan dunyoni.\n\nWeb3 kontekstida bu kuzatuv quyidagi sababga ko'ra muhim: markazlashmagan internet va'dalaridan biri odamlarga nafaqat ma'lumotlar, balki identiklik ustidan ham nazoratni qaytarishdir. Platforma uchun simulyakr o'rniga - senga tegishli suveren raqamli shaxsiyat. Ammo bunga erishiladimi - savol ochiq.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["identiklik", "falsafa", "ijtimoiy graf", "media"], "x": 265.5, "y": 258.0, "angDeg": 218.6}], "edges": [{"from": "skinner", "to": "chronicle", "label": "mexanika ilovalarga joylandi", "lenses": ["psychology", "chronology"]}, {"from": "chronicle", "to": "haidt", "label": "egallash xavotir oʼsishi bilan bir vaqtga toʼgʼri keldi", "lenses": ["chronology", "health"]}, {"from": "skinner", "to": "haidt", "label": "qaramlik ruhiyatga zarba beradi", "lenses": ["psychology", "health"]}, {"from": "dunbar", "to": "chronicle", "label": "yuz ellik oʼrniga ming doʼst", "lenses": ["bonds", "chronology"]}, {"from": "dunbar", "to": "haidt", "label": "yuzakilik yolgʼizlikni kuchaytiradi", "lenses": ["bonds", "health"]}, {"from": "chronicle", "to": "kotler", "label": "ishonch odamlarga oʼtdi", "lenses": ["media", "chronology"]}, {"from": "kotler", "to": "sunstein", "label": "personallashtirish reallikni parchalab yuboradi", "lenses": ["reality", "psychology"]}, {"from": "sunstein", "to": "baudrillard", "label": "echo-kamera simulyakr tugʼdiradi", "lenses": ["reality"]}, {"from": "haidt", "to": "baudrillard", "label": "hayot kontent bilan almashtiriladi", "lenses": ["health", "reality"]}, {"from": "skinner", "to": "sunstein", "label": "jalb qilish tushunishdan muhimroq", "lenses": ["psychology", "reality"]}]}, "es": {"chapter": {"key": "social", "title": "Redes sociales", "lede": "Cómo los vínculos se volvieron producto y tú, materia prima. La mecánica de la adicción, la soledad y el simulacro.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=social", "centralIdea": "Los vínculos se volvieron producto, y tú, materia prima", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Cronología", "accent": "#7dd3fc", "description": "De Friendster a TikTok: cómo las redes sociales capturaron cada capa de la vida."}, {"id": "psychology", "label": "Psicología", "accent": "#f87171", "description": "Skinner y el refuerzo variable: el like funciona como una máquina tragamonedas."}, {"id": "bonds", "label": "Conexiones", "accent": "#c084fc", "description": "Dunbar: el cerebro está hecho para 150 relaciones, no para mil “amigos”."}, {"id": "health", "label": "Salud", "accent": "#34d399", "description": "Haidt: la generación ansiosa, con aumento de ansiedad y depresión desde 2012."}, {"id": "reality", "label": "Realidad", "accent": "#fbbf24", "description": "Sunstein y Baudrillard: cámaras de eco y vida sustituida por contenido."}], "nodes": [{"id": "skinner", "sceneIndex": 0, "type": "power", "shortTitle": "Skinner", "era": "1938→", "lensWeight": {"chronology": 2, "psychology": 5, "bonds": 1, "health": 3, "reality": 1}, "title": "Skinner y el like: la mecánica de la adicción", "insight": "Skinner descubrió el refuerzo variable en 1938. Las redes sociales lo integraron en cada app: un like funciona exactamente como una máquina tragamonedas.", "thesis": "Skinner descubrió el refuerzo variable en 1938. Las redes sociales lo integraron en cada app: un like funciona exactamente como una máquina tragamonedas.", "body": "## Una rata en una caja y tú con un teléfono\n\nEn 1938, el psicólogo estadounidense B. F. Skinner realizó una serie de experimentos que se convirtieron en algunos de los más importantes en la historia de la ciencia del comportamiento. Metía ratas en cajas especiales y observaba cómo aprendían a presionar una palanca según la recompensa que recibían.\n\nPrimera versión: presionas la palanca y obtienes comida. Siempre. Predecible. La rata aprendió rápido a presionar y lo hacía justamente cuando tenía hambre. Nada de compulsión, nada de adicción.\n\nSegunda versión: presionas la palanca y a veces obtienes comida, a veces no. Al azar. De forma impredecible. Y aquí ocurrió algo sorprendente: la rata empezó a presionar la palanca de manera obsesiva. Una y otra vez. Incluso cuando no tenía hambre. Incluso cuando la comida tardaba mucho en llegar, la rata no se detenía. Skinner llamó a esto un «programa de refuerzo intermitente» y lo definió como el mecanismo de formación de conducta más poderoso que había observado.\n\nAhora reemplaza a la rata contigo. La palanca con el botón de «actualizar el feed». La comida con un like, una publicación interesante, un mensaje de un amigo. Abres Instagram y a veces hay algo interesante, a veces algo aburrido, a veces un like de alguien importante, a veces nada. No lo sabes de antemano. Esa imprevisibilidad es precisamente lo que te mantiene ahí.\n\n## Nir Eyal lo sistematizó en un manual\n\nNir Eyal escribió el libro «Hooked» en 2014, y fue completamente franco sobre sus intenciones. Es una guía para startups: cómo crear productos a los que la gente vuelve sin recordatorios y sin un estímulo externo.\n\nEl modelo de Eyal se llama el «gancho»: cuatro pasos que se repiten una y otra vez. Disparador: externo (una notificación, un correo) o interno (aburrimiento, ansiedad, soledad) y pone en marcha la acción. Acción: abrir la app, desplazarse por el feed, publicar una foto: el mínimo esfuerzo, la máxima simplicidad. Recompensa variable: a veces interesante, a veces no, a veces un like, a veces silencio: la imprevisibilidad de Skinner en acción. Inversión: añades contenido, etiquetas a personas, ajustas tu perfil, y así haces que el producto sea más valioso para ti y más difícil de abandonar.\n\nEyal escribió esto como un manual, de forma abierta y sin disculpas. Los ingenieros de redes sociales estudiaron este modelo. Algunos luego admitieron que sintieron remordimiento al aplicarlo. Uno de los ex vicepresidentes de Facebook, Chamath Palihapitiya, dijo públicamente en 2017: «Hemos creado herramientas que están rompiendo el tejido social de la sociedad». Sus hijos no usan redes sociales.\n\nAdam Alter, en el libro «Irresistible» (2017), fue más lejos y planteó una pregunta dura: ¿es normal diseñar productos usando los mismos principios que sostienen la adicción a las máquinas tragamonedas? Según criterios clínicos: regreso compulsivo, pérdida de control sobre el tiempo, continuidad pese al daño consciente, síndrome de abstinencia al dejarlo, lo que les ocurre a muchos usuarios de redes sociales encaja con la definición de adicción conductual.\n\n> Skinner descubrió el refuerzo variable en 1938. Nir Eyal lo convirtió en un manual para startups en 2014. Las redes sociales lo incorporaron en la arquitectura de cada app.\n\nEn paralelo, Malcolm Gladwell, en «The Tipping Point», describió la mecánica de la propagación epidémica: toda epidemia tiene un punto de inflexión, después del cual la difusión adquiere una forma de avalancha. Facebook llegó a ese punto cuando se convirtió en el lugar donde estaba «todo el mundo», porque si todos tus amigos están allí, no tienes más opción que estar también allí. Adicción individual más presión social colectiva: por eso es tan difícil dejar las redes sociales.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["grafo social", "psicología", "adicción", "plataformas"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "chronicle", "sceneIndex": 1, "type": "media", "shortTitle": "Crónica", "era": "2003→años 2020", "lensWeight": {"chronology": 5, "psychology": 3, "bonds": 3, "health": 3, "reality": 2}, "title": "Crónica de las redes sociales: de Friendster a TikTok", "insight": "En 20 años, las redes sociales capturaron de forma sucesiva todos los niveles de la vida social. Para los años 2020, la persona promedio pasaba más de dos horas al día en ellas, más que en cualquier otra actividad, salvo dormir y trabajar.", "thesis": "En 20 años, las redes sociales capturaron de forma sucesiva todos los niveles de la vida social. Para los años 2020, la persona promedio pasaba más de dos horas al día en ellas, más que en cualquier otra actividad, salvo dormir y trabajar.", "body": "## Veinte años que cambiaron la vida social\n\nEn veinte años —de 2002 a 2022— las redes sociales pasaron de ser un pasatiempo estudiantil a una infraestructura global usada por cinco mil millones de personas. Cada ola fue más rápida que la anterior. Cada plataforma capturó una nueva capa de la vida social.\n\nLa primera red social masiva en el sentido moderno fue Friendster, lanzada en 2002 en Estados Unidos. La idea parecía revolucionaria: un perfil, una lista de amigos, la posibilidad de ver a los amigos de tus amigos. En tres meses, tres millones de usuarios. Fue una explosión para su época. Pero Friendster no soportó su propio éxito: los servidores se caían, las páginas tardaban un minuto en cargar, los usuarios se iban frustrados. La tecnología no alcanzó a la demanda.\n\nEn 2003 apareció MySpace y rápidamente se convirtió en la red social más grande del mundo. Su diferencia era la máxima libertad de personalización. Cada quien podía diseñar su perfil como quisiera: sus propios colores, su propia música de fondo, su propio estilo. MySpace se volvió un hogar para músicos, artistas y subculturas. En 2005, el magnate de los medios Rupert Murdoch lo compró por 580 millones de dólares, en el pico del hype. Cinco años después, MySpace estaba muerto. Facebook lo mató, con limpieza, simplicidad y algoritmo.\n\nEse mismo 2003, LinkedIn se lanzó en silencio para conexiones profesionales. Sin diseño llamativo, sin entretenimiento: solo currículums y contactos. Parecía aburrido. Pero LinkedIn encontró su nicho y lo ocupó para siempre: para 2023, más de 900 millones de usuarios.\n\n## Facebook, Twitter, YouTube, Instagram\n\n2004. Mark Zuckerberg lanza TheFacebook.com desde una habitación en una residencia de Harvard. En una semana, la mitad de los estudiantes de Harvard estaban registrados. La mecánica es brillante: nombres reales, fotos reales, conexiones reales. Nada de seudónimos. No es un espacio anónimo: es un reflejo digital de la vida social real.\n\nPara 2012, ya había mil millones de usuarios. El botón «Iniciar sesión con Facebook» apareció en millones de sitios. Salir de Facebook pasó a significar quedar fuera de la vida social.\n\n2005. Tres ex empleados de PayPal crean YouTube. El primer video dura dieciocho segundos en el zoológico. Un año después, Google lo compra por 1,65 mil millones de dólares, algo que entonces parecía una locura. YouTube rompió el monopolio de la televisión: cualquiera con una cámara puede transmitir a una audiencia global. Para 2023, se suben 500 horas de video cada minuto.\n\n2006. Jack Dorsey publica el primer tuit. Twitter se convirtió en una plaza global en tiempo real: periodistas, políticos y científicos hablaban directamente con la audiencia, sin editores. La Primavera Árabe se organizó a través de Twitter. Los terremotos aparecían primero allí y solo después en las noticias.\n\n2010. Instagram: fotos cuadradas, filtros, nada de texto. Facebook lo compra en 2012 por mil millones. Instagram cambió la cultura visual: los restaurantes diseñaban interiores «para Instagram», los lugares turísticos se evaluaban por su «instagrameabilidad».\n\n## VKontakte, Telegram y TikTok\n\n2006. Pavel Durov lanza VKontakte para los estudiantes de la Universidad de San Petersburgo. Para decenas de millones de personas en Rusia, Ucrania y los países postsoviéticos, VKontakte se convirtió en el primer internet, el lugar donde se formaron los hábitos digitales de toda una generación. La historia de Durov con VKontakte terminó en un conflicto con el Estado en 2014. Se fue y creó Telegram. Hablaremos de eso en los próximos capítulos.\n\n2016 en China, 2018 el lanzamiento global de TikTok. Este es un giro radical: la sección principal, el «For You Page», te muestra videos de personas totalmente desconocidas, seleccionados por un algoritmo según tu comportamiento. Tú no eliges qué mirar: el algoritmo decide. El tiempo promedio en TikTok es de más de 90 minutos al día. TikTok planteó una pregunta que antes no sonaba con tanta fuerza: ¿qué pasa cuando el algoritmo que moldea la realidad de miles de millones pertenece a una empresa bajo la jurisdicción de otro Estado?\n\n> En veinte años, las redes sociales capturaron de forma sucesiva todos los niveles de la vida social: vínculos profesionales, amistad, discurso público, video, identidad visual, entretenimiento. Hacia mediados de la década de 2020, la persona promedio pasaba en ellas más de dos horas al día.\n\nEso es más que cualquier otra actividad en la vida de una persona, salvo dormir y trabajar. Ninguna tecnología en la historia ha ocupado tanto tiempo de tanta gente.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["grafo social", "historia", "plataformas", "Telegram"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "dunbar", "sceneIndex": 2, "type": "privacy", "shortTitle": "Dunbar", "era": "1992", "lensWeight": {"chronology": 2, "psychology": 2, "bonds": 5, "health": 3, "reality": 1}, "title": "Dunbar: mil amigos frente a ciento cincuenta", "insight": "Dunbar demostró que el cerebro está hecho para 150 relaciones. Mil «amigos» en las redes sociales no amplían ese límite: vuelven superficial cada contacto y agravan la soledad.", "thesis": "Dunbar demostró que el cerebro está hecho para 150 relaciones. Mil «amigos» en las redes sociales no amplían ese límite: vuelven superficial cada contacto y agravan la soledad.", "body": "## El número que no ha cambiado en un millón de años\n\nEn 1992, el antropólogo británico Robin Dunbar publicó un estudio que se convirtió en uno de los más citados de la antropología. Estudió el tamaño de la neocorteza —la parte del cerebro responsable de la cognición social— en distintas especies de primates. Y encontró una correlación clara: cuanto mayor es la neocorteza en relación con el tamaño del cerebro, más grandes son los grupos sociales en los que vive la especie.\n\nPara los seres humanos, Dunbar calculó este número: alrededor de 150. Esa es la cantidad de relaciones sociales estables que el cerebro humano puede mantener al mismo tiempo. No solo «conocidos», sino personas cuya situación de vida sigues, con quienes tienes una historia y en quienes confías en cierto nivel.\n\nEse número —150— se llama «número de Dunbar». Se reproduce en contextos muy distintos. El tamaño de las unidades militares eficaces a lo largo de la historia es de alrededor de 150 personas. El tamaño de las aldeas tradicionales de cazadores-recolectores es de alrededor de 150 personas. El tamaño de las comunidades religiosas cohesionadas es de alrededor de 150 personas. No porque alguien lo haya decidido así. Simplemente porque ese es el límite de lo que nuestro cerebro puede procesar.\n\n## Qué le pasa al cerebro con mil «amigos»\n\nAhora mira tu Facebook o Instagram. ¿Cuántos «amigos» o seguidores tienes? ¿Cientos? ¿Miles? Las redes sociales nos dieron la posibilidad de mantener vínculos con entre cinco y veinte veces más personas que nuestro límite cognitivo.\n\nNuestro cerebro no ha cambiado. La evolución no ha alcanzado a la tecnología. ¿Qué pasa cuando una persona intenta gestionar una vida social que supera por diez veces su capacidad cognitiva? Empieza a simplificar. A reaccionar rápido, superficialmente, emocionalmente. Un like en lugar de una conversación. Una reacción en lugar de comprensión. Un comentario público en lugar de un mensaje privado.\n\nEsto no es pereza ni degradación. Es una sobrecarga neurobiológica. El cerebro hace lo único que puede: simplifica las señales al mínimo. En lugar de una interacción emocional compleja, presionar el corazón. En lugar de una conversación sincera, escribir «¡felicidades!» debajo de una foto.\n\nPor eso mil amigos en las redes sociales no nos hacen más felices ni menos solitarios. Los estudios —incluidos los trabajos que cita Haidt— muestran lo contrario: el aumento de las «conexiones» en línea se correlaciona con un aumento de la sensación de soledad. Porque el cerebro no puede distinguir un contacto superficial en línea de un vínculo real: simplemente se sobrecarga y se apaga emocionalmente.\n\nA esto súmale lo que Gladwell describió en «The Tipping Point»: después de que una plataforma alcanza masa crítica, estar presente en ella se vuelve una necesidad social. No eliges estar en Facebook por la calidad de la interacción. Estás ahí porque todos están ahí. Y eso significa que estás condenado a desplazarte sin fin por un feed de personas con las que tienes una «conexión» sin conexión real.\n\n> Dunbar lo demostró: nuestro cerebro está hecho para 150 relaciones. Las redes sociales nos dieron miles y volvieron superficial cada una de ellas. Más conexiones no significa menos soledad.\n\nEsto explica una de las grandes paradojas de la era de las redes sociales: nunca hemos estado tan «conectados» y nunca nos hemos sentido tan solos. La epidemia de soledad que los psicólogos registran en todo el mundo desde principios de la década de 2010 coincide en el tiempo con la expansión masiva de los teléfonos inteligentes y las redes sociales. No es una casualidad.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["psicología", "grafo social", "neurociencia", "comunidad"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "haidt", "sceneIndex": 3, "type": "power", "shortTitle": "Haidt", "era": "2012→", "lensWeight": {"chronology": 4, "psychology": 4, "bonds": 3, "health": 5, "reality": 2}, "title": "Haidt: la generación ansiosa", "insight": "Haidt reunió datos de docenas de países: desde 2012, la epidemia de ansiedad y depresión entre adolescentes coincide en el tiempo con la difusión masiva de los smartphones y Instagram.", "thesis": "Haidt reunió datos de docenas de países: desde 2012, la epidemia de ansiedad y depresión entre adolescentes coincide en el tiempo con la difusión masiva de los smartphones y Instagram.", "body": "## Los datos que cambiaron la conversación\n\nJonathan Haidt es un psicólogo social de la Universidad de Nueva York. En 2024 publicó *The Anxious Generation*. No se trata del pánico de los adultos ante las nuevas tecnologías. Es un estudio sistemático de datos, de varios años, que llegó a una conclusión difícil de refutar.\n\nA partir de alrededor de 2012, cuando los smartphones se volvieron realmente masivos e Instagram ganó una audiencia crítica, el nivel de depresión, ansiedad y autolesiones entre adolescentes empezó a aumentar al mismo tiempo en todos los países occidentales. Haidt reunió datos de Estados Unidos, Reino Unido, Canadá, Australia, Nueva Zelanda y Escandinavia. En todas partes, la misma curva: una ruptura brusca alrededor de 2012-2013.\n\nNo en un país, en todos. No entre los chicos, especialmente entre las chicas. No de forma gradual, sino de golpe, como una ruptura en el gráfico. La coincidencia temporal con la difusión masiva de los smartphones y las redes sociales es demasiado precisa para ser casualidad.\n\n## Mecanismos: cómo funciona\n\nHaidt describe varios mecanismos concretos a través de los cuales las redes sociales afectan la salud psicológica de los adolescentes.\n\nComparación social constante. En Instagram, la gente publica los mejores momentos de su vida: filtrados, editados, cuidadosamente seleccionados. Un adolescente ve un feed formado por cuerpos perfectos, vacaciones perfectas y relaciones perfectas. Su propia vida, vista desde dentro con sus días aburridos y su inseguridad, se ve miserable en comparación. Esta comparación es infinita y desigual: comparas tus días normales con las celebraciones ajenas.\n\nEvaluación pública a través de los likes. La autoestima de un adolescente, ya de por sí inestable por la edad, queda literalmente atada a un número en la pantalla. Publicas una foto y recibes pocos likes: esa es una prueba pública de que no eres lo bastante popular, no eres lo bastante atractivo, no eres lo bastante interesante. Es un rechazo social en tiempo real, visible para todos.\n\nSustituir la comunicación cara a cara por la digital. La comunicación cara a cara, con su incomodidad, sus pausas y la necesidad de leer emociones, desarrolla la inteligencia emocional. Las interacciones de texto no la desarrollan. Una generación que creció con el teléfono en lugar de las reuniones llega a la vida adulta con un déficit de habilidades reales de comunicación, y eso solo aumenta la ansiedad en situaciones sociales.\n\nDisponibilidad las 24 horas. Antes de los smartphones, los niños tenían un refugio: el acoso escolar terminaba a las seis de la tarde, cuando llegabas a casa. Ahora no. Un teléfono en el bolsillo significa que la humillación, la exclusión y el acoso están disponibles las 24 horas del día, los siete días de la semana. No hay un lugar donde esconderse.\n\nAdam Alter añade en *Irresistible*: esto no es solo daño psicológico. Según los criterios clínicos, lo que les está pasando a los adolescentes -volver de forma compulsiva al teléfono, perder el control del tiempo, seguir a pesar del daño reconocido- encaja con la definición de adicción conductual. Les dimos a los niños un dispositivo adictivo y nos sorprenden los resultados.\n\n> Haidt reunió datos de docenas de países: desde 2012, la epidemia de ansiedad y depresión entre adolescentes coincide en el tiempo con la difusión masiva de los smartphones y Instagram. No es una casualidad.\n\nHemos llevado a cabo un experimento social masivo con niños, sin su consentimiento y sin entender las consecuencias. Los resultados de ese experimento ahora son visibles en las estadísticas de los hospitales psiquiátricos de todo el mundo.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["psicología", "salud mental", "grafo social", "medios"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "kotler", "sceneIndex": 4, "type": "media", "shortTitle": "Kotler 4.0/5.0", "era": "2016→2021", "lensWeight": {"chronology": 3, "psychology": 3, "bonds": 2, "health": 1, "reality": 3}, "title": "Kotler 4.0 y 5.0: marketing en la era de las redes sociales", "insight": "Kotler 4.0 registró esto: la confianza pasó de las marcas a las personas. Kotler 5.0 describió la personalización hasta una sola persona: una herramienta que funciona tanto como cuidado como manipulación.", "thesis": "Kotler 4.0 registró esto: la confianza pasó de las marcas a las personas. Kotler 5.0 describió la personalización hasta una sola persona: una herramienta que funciona tanto como cuidado como manipulación.", "body": "## Cuando la confianza pasó de las marcas a las personas\n\nPhilip Kotler no se detuvo en *Marketing 3.0*. Las redes sociales cambiaron las reglas del juego de forma tan fundamental que hubo que replantearlo todo otra vez, dos veces.\n\nEn *Marketing 4.0* (2016), Kotler registró la transformación que las redes sociales produjeron en la relación entre la marca y el comprador. Marketing 3.0 reveló esto: las personas compran valores, no productos. Marketing 4.0 añadió: en la era de las redes sociales, el recorrido del comprador se volvió no lineal y colectivo.\n\nAntes, el recorrido del comprador era predecible: veía un anuncio → se interesaba → iba a una tienda → compraba. La marca controlaba cada paso. Ahora una persona ve la publicación de otro comprador en Instagram → lee reseñas de desconocidos en un marketplace → mira la reseña de un creador en YouTube → lo comenta en los comentarios → y solo entonces, quizá, compra. En cada paso, la marca no controla la conversación. La conversación la llevan otras personas.\n\nEso lo cambió todo. Un influencer con una audiencia genuina de cien mil seguidores resulta más eficaz que un comercial de televisión de un millón de dólares. No porque tenga más alcance, sino porque sus seguidores confían en él. La confianza pasó de las marcas a las personas. Es un cambio irreversible.\n\nKotler describe un nuevo modelo del recorrido del comprador: Aware → Appeal → Ask → Act → Advocate. Conoces el producto (Aware), te atrae (Appeal), preguntas la opinión de otros (Ask), compras (Act) — y si quedas satisfecho, te conviertes en su embajador (Advocate). Advocate cierra el ciclo: crea el contenido que inicia el recorrido del siguiente comprador. El cliente pasó a formar parte de la máquina de marketing.\n\n## Marketing 5.0: uno a uno con cada persona\n\nEn *Marketing 5.0* (2021), Kotler describió el siguiente nivel: las tecnologías — IA, big data, automatización — permiten personalizar la comunicación hasta el nivel de una sola persona en tiempo real.\n\nAntes, la segmentación se veía así: \"Publicidad para hombres de 25 a 35 años interesados en el deporte\". Burda, imprecisa, ineficaz. El marketing 5.0 moderno funciona de otra manera: \"Este mensaje es para Iván, de 28 años, que vio reseñas de zapatillas en YouTube tres veces, buscó descuentos en Google el viernes pasado y cuyos amigos en Instagram publicaron recientemente fotos de sus carreras. Muéstrale esta oferta a las 7:30 de la mañana del lunes, cuando va camino al trabajo\".\n\nKotler veía en esto una oportunidad: por fin la tecnología puede servir de verdad a las personas. Dar a cada una exactamente lo que necesita, cuando lo necesita. Personalización como cuidado.\n\nPero esa misma descripción — hasta la coma — también es una herramienta de manipulación de máxima precisión. La única diferencia está en la intención de quien la usa. La misma herramienta puede ayudar a una persona a encontrar el producto que necesita — o formar en silencio una necesidad que no tenía.\n\nY aquí surge una pregunta que Kotler plantea, pero no responde del todo: ¿quién controla a qué intereses sirve esta personalización? ¿A los intereses del comprador — o a los del vendedor?\n\n> Kotler dejó esto claro: Marketing 4.0 devolvió el poder a las personas a través de las redes sociales. Marketing 5.0 intentó recuperarlo a través de la IA. La pregunta es a cuyos intereses sirve esta herramienta.\n\nEsta contradicción — entre la tecnología como herramienta de cuidado y la tecnología como herramienta de manipulación — recorre toda la historia de la era digital. Y precisamente eso es lo que Web3 intenta resolver: mediante la descentralización, mediante la propiedad de los datos, mediante la transparencia de los algoritmos.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["marketing", "grafo social", "plataformas", "psicología"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "sunstein", "sceneIndex": 5, "type": "power", "shortTitle": "Sunstein", "era": "2001→2017", "lensWeight": {"chronology": 3, "psychology": 2, "bonds": 2, "health": 2, "reality": 5}, "title": "Sunstein: cámaras de eco y el fin de la realidad compartida", "insight": "Sunstein mostró que los algoritmos de las redes sociales están optimizados para la interacción, no para la comprensión, y eso destruye de forma sistemática el espacio informativo compartido sin el cual la democracia es imposible.", "thesis": "Sunstein mostró que los algoritmos de las redes sociales están optimizados para la interacción, no para la comprensión, y eso destruye de forma sistemática el espacio informativo compartido sin el cual la democracia es imposible.", "body": "## Un problema de arquitectura, no de política\n\nCass Sunstein es un jurista y economista del comportamiento de Harvard. En su libro \"#Republic\", planteó una pregunta que parece política, pero en realidad es arquitectónica: ¿qué le pasa a la democracia cuando cada ciudadano vive dentro de su propia burbuja informativa?\n\nLa democracia presupone un mínimo compartido. Los ciudadanos pueden discrepar en valores, prioridades y posturas políticas; eso es normal e incluso útil. Pero deben ponerse de acuerdo en una realidad básica. Ocurrió este hecho. Estos son los datos. Estos son los hechos. Solo con una base factual compartida se puede discutir qué hacer con ella.\n\nLos algoritmos de las redes sociales destruyen ese espacio compartido. Están optimizados para la interacción: para que te quedes en la app el mayor tiempo posible. ¿Y qué es lo que mejor retiene la atención? El contenido que provoca una emoción intensa: indignación, miedo, entusiasmo, enojo. El contenido que confirma creencias ya existentes. El contenido que amplifica emociones ya existentes.\n\nComo resultado, el algoritmo le muestra a cada persona su propia realidad personal. No porque alguien lo haya decidido con mala intención. Simplemente porque eso maximiza la interacción.\n\n## Cámaras de eco: cuando solo oyes tu propio eco\n\nSunstein llama a esto \"cámaras de eco\". Entras en un espacio informativo donde todos dicen más o menos lo mismo que ya piensas. Tus creencias solo se fortalecen, porque ves un número infinito de confirmaciones. Las objeciones y los puntos de vista alternativos casi no existen: el algoritmo los filtra porque reducen la interacción.\n\nEsto no es solo molesto. Es destructivo para la capacidad de juzgar. Cuando solo oyes tu propio eco, dejas de entender que otras personas pueden tener una imagen distinta de la realidad. Empiezas a ver tu propia versión como la única posible. A las personas con otras ideas las percibes como malintencionadas, torpes o sesgadas.\n\nLa polarización política de los últimos años en Estados Unidos, Europa y otras regiones no es una casualidad ni simplemente el resultado de problemas económicos. Es la consecuencia previsible de una arquitectura optimizada para la interacción, no para la comprensión. El algoritmo no creó la polarización. Pero la amplificó y la aceleró.\n\nSunstein propone una analogía: imagina una ciudad donde todos los restaurantes han sido sustituidos por máquinas que te dan lo que ya habías comido antes. No hay nuevos sabores. No hay descubrimientos inesperados. Solo confirmación de preferencias ya formadas. Parece cómodo, pero en realidad estrecha el mundo.\n\n> Sunstein demostró que el algoritmo no es malvado: simplemente está optimizado para la interacción. Pero eso destruye el espacio informativo compartido sin el cual la democracia es imposible.\n\nEste problema no se resuelve con regulación ni con multas para las plataformas. Está integrado en la arquitectura del modelo de negocio: la plataforma gana con la interacción, la interacción se maximiza mediante contenido emocional, y el contenido emocional polariza. Solo se puede cambiar modificando el propio modelo de negocio, o creando una arquitectura alternativa.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["algoritmos", "democracia", "grafo social", "medios"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "baudrillard", "sceneIndex": 6, "type": "privacy", "shortTitle": "Baudrillard", "era": "1981", "lensWeight": {"chronology": 2, "psychology": 2, "bonds": 2, "health": 3, "reality": 5}, "title": "Baudrillard y el simulacro: la vida como contenido", "insight": "En 1981, Baudrillard describió el simulacro: una imagen que reemplaza la realidad. En Instagram esto se volvió literal: la gente produce contenido sobre la vida en lugar de vivirla.", "thesis": "En 1981, Baudrillard describió el simulacro: una imagen que reemplaza la realidad. En Instagram esto se volvió literal: la gente produce contenido sobre la vida en lugar de vivirla.", "body": "## El filósofo que describió Instagram en 1981\n\nJean Baudrillard fue un filósofo y sociólogo francés. En 1981 publicó el libro «Simulacra and Simulation». Era una obra filosófica abstracta sobre la naturaleza de la imagen y la realidad en la sociedad moderna. Instagram no existía entonces. TikTok no existía. Incluso internet era territorio de los militares y los científicos.\n\nPero si lees a Baudrillard ahora, da la sensación de que estaba escribiendo un reportaje desde 2024.\n\nSu idea central: en el mundo moderno, la imagen ya no refleja la realidad, la sustituye. Baudrillard describía cuatro etapas de la imagen. Primero, la imagen refleja la realidad: una fotografía muestra cómo se ve un lugar. Luego, la imagen enmascara la realidad: la publicidad muestra una versión idealizada de un producto. Después, la imagen enmascara la ausencia de realidad: la imagen existe sin una realidad correspondiente. Y por último, el simulacro: la imagen no tiene ninguna relación con la realidad; ella misma se ha vuelto realidad.\n\nEl simulacro es una copia sin original. Una imagen que no refleja nada real, pero que se percibe como más real que la propia realidad.\n\n## La hiperrealidad de Instagram\n\nMira lo que pasa en Instagram a través de la óptica de Baudrillard.\n\nUna persona viaja. Antes vivía el lugar: olores, sonidos, temperatura, encuentros casuales. Ahora fotografía el lugar. No vive la puesta de sol: la graba para las historias. No disfruta la comida: fotografía el plato antes de empezar a comer. No vive la emoción: piensa en cómo se verá en el feed.\n\nLa simulación se vuelve más importante que la experiencia. La imagen se vuelve más importante que la realidad. Y poco a poco la gente empieza a vivir no para experimentar, sino para producir contenido sobre la experiencia.\n\nBaudrillard llamaría a esto «hiperrealidad»: un estado en el que la simulación se vuelve más real que la propia realidad. La versión filtrada de la vida en Instagram se vuelve más «real» que la vida real con su imperfección y su cotidianidad.\n\nZygmunt Bauman, en «Liquid Modernity», añade a esto la dimensión de la identidad: en el mundo moderno, la identidad dejó de ser estable. No eres simplemente quien naciste y creciste siendo. Te reconstruyes constantemente desde cero. Las redes sociales se volvieron el principal escenario de esa construcción, y también su principal amplificador. Puedes ser distinto en LinkedIn y en Instagram, en Twitter y en TikTok. Libertad, pero también un nuevo tipo de ansiedad: ¿dónde termina la performance y dónde comienza el yo verdadero?\n\nEsto no es solo una abstracción filosófica. Es la descripción de un estado psicológico concreto, la «disociación en línea», que registran los psicólogos: la sensación de que no vives de verdad, sino que representas una versión de ti mismo para una audiencia.\n\n> En 1981, Baudrillard describió lo que hoy llamamos Instagram: un mundo donde la imagen importa más que la experiencia, la simulación importa más que la realidad, y la persona produce contenido sobre la vida en lugar de vivirla.\n\nEn el contexto de Web3, esta observación importa por la siguiente razón: una de las promesas de internet descentralizado es devolver a las personas el control no solo sobre los datos, sino también sobre la identidad. En lugar de un simulacro para la plataforma, una identidad digital soberana que te pertenece. Pero si esto logrará hacerse realidad sigue siendo una pregunta abierta.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["identidad", "filosofía", "grafo social", "medios"], "x": 265.5, "y": 258.0, "angDeg": 218.6}], "edges": [{"from": "skinner", "to": "chronicle", "label": "la mecánica se incorporó a las aplicaciones", "lenses": ["psychology", "chronology"]}, {"from": "chronicle", "to": "haidt", "label": "la captura coincidió con el aumento de la ansiedad", "lenses": ["chronology", "health"]}, {"from": "skinner", "to": "haidt", "label": "la adicción golpea la psique", "lenses": ["psychology", "health"]}, {"from": "dunbar", "to": "chronicle", "label": "mil amigos en lugar de ciento cincuenta", "lenses": ["bonds", "chronology"]}, {"from": "dunbar", "to": "haidt", "label": "la superficialidad amplifica la soledad", "lenses": ["bonds", "health"]}, {"from": "chronicle", "to": "kotler", "label": "la confianza pasó a las personas", "lenses": ["media", "chronology"]}, {"from": "kotler", "to": "sunstein", "label": "la personalización fragmenta la realidad", "lenses": ["reality", "psychology"]}, {"from": "sunstein", "to": "baudrillard", "label": "la cámara de eco produce un simulacro", "lenses": ["reality"]}, {"from": "haidt", "to": "baudrillard", "label": "la vida es sustituida por contenido", "lenses": ["health", "reality"]}, {"from": "skinner", "to": "sunstein", "label": "la participación pesa más que la comprensión", "lenses": ["psychology", "reality"]}]}, "fr": {"chapter": {"key": "social", "title": "Réseaux sociaux", "lede": "Comment les liens sont devenus un produit et toi, une matière première. La mécanique de l’addiction, de la solitude et du simulacre.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=social", "centralIdea": "Les liens sont devenus un produit, et toi, une matière première", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Chronologie", "accent": "#7dd3fc", "description": "De Friendster à TikTok : comment les réseaux sociaux ont capturé chaque strate de la vie."}, {"id": "psychology", "label": "Psychologie", "accent": "#f87171", "description": "Skinner et le renforcement variable : le like fonctionne comme une machine à sous."}, {"id": "bonds", "label": "Liens", "accent": "#c084fc", "description": "Dunbar : le cerveau est fait pour 150 relations, pas pour mille « amis »."}, {"id": "health", "label": "Santé", "accent": "#34d399", "description": "Haidt : la génération anxieuse, avec la hausse de l’anxiété et de la dépression depuis 2012."}, {"id": "reality", "label": "Réalité", "accent": "#fbbf24", "description": "Sunstein et Baudrillard : chambres d’écho et vie remplacée par le contenu."}], "nodes": [{"id": "skinner", "sceneIndex": 0, "type": "power", "shortTitle": "Skinner", "era": "1938→", "lensWeight": {"chronology": 2, "psychology": 5, "bonds": 1, "health": 3, "reality": 1}, "title": "Skinner et le like : la mécanique de la dépendance", "insight": "Skinner a découvert le renforcement variable en 1938. Les réseaux sociaux l’ont intégré à chaque application : un like fonctionne exactement comme une machine à sous.", "thesis": "Skinner a découvert le renforcement variable en 1938. Les réseaux sociaux l’ont intégré à chaque application : un like fonctionne exactement comme une machine à sous.", "body": "## Un rat dans une boîte et toi avec un téléphone\n\nEn 1938, le psychologue américain B. F. Skinner a mené une série d'expériences qui sont devenues parmi les plus importantes de l'histoire des sciences du comportement. Il plaçait des rats dans des boîtes spéciales et observait comment ils apprenaient à appuyer sur un levier selon la récompense qu'ils recevaient.\n\nPremière version : tu appuies sur le levier et tu obtiens à manger. Toujours. Prévisible. Le rat a vite appris à appuyer, et il le faisait exactement quand il avait faim. Aucune compulsion, aucune dépendance.\n\nDeuxième version : tu appuies sur le levier et, parfois, tu obtiens à manger, parfois non. Au hasard. De manière imprévisible. Et là, il s'est produit quelque chose de frappant : le rat s'est mis à appuyer sur le levier de façon obsessionnelle. Encore et encore. Même lorsqu'il n'avait pas faim. Même lorsque la nourriture tardait longtemps à venir, le rat ne s'arrêtait pas. Skinner a appelé cela un « programme de renforcement intermittent » et l'a présenté comme le mécanisme de façonnage du comportement le plus puissant qu'il ait jamais observé.\n\nMaintenant, remplace le rat par toi. Le levier par le bouton « actualiser le fil ». La nourriture par un like, un post intéressant, un message d'un ami. Tu ouvres Instagram et, parfois, il y a quelque chose d'intéressant, parfois quelque chose d'ennuyeux, parfois un like de quelqu'un d'important, parfois rien. Tu ne le sais pas à l'avance. C'est précisément cette imprévisibilité qui te retient.\n\n## Nir Eyal en a fait un manuel\n\nNir Eyal a écrit le livre « Hooked » en 2014, et il était parfaitement franc sur ses intentions. C'est un guide pour les startups : comment créer des produits auxquels les gens reviennent sans rappel et sans stimulus externe.\n\nLe modèle d'Eyal s'appelle le « hook » : quatre étapes qui se répètent encore et encore. Déclencheur : externe (une notification, un e-mail) ou interne (ennui, anxiété, solitude) et lance l'action. Action : ouvrir l'application, faire défiler le fil, publier une photo : effort minimal, simplicité maximale. Récompense variable : parfois intéressant, parfois non, parfois un like, parfois le silence : l'imprévisibilité de Skinner en action. Investissement : tu ajoutes du contenu, tu tags des personnes, tu ajustes ton profil, et tu rends ainsi le produit plus précieux pour toi et plus difficile à abandonner.\n\nEyal a écrit cela comme un manuel, ouvertement et sans excuses. Les ingénieurs des réseaux sociaux ont étudié ce modèle. Certains ont ensuite admis avoir ressenti des remords en l'appliquant. L'un des anciens vice-présidents de Facebook, Chamath Palihapitiya, a déclaré publiquement en 2017 : « Nous avons créé des outils qui déchirent le tissu social de la société. » Ses enfants n'utilisent pas les réseaux sociaux.\n\nAdam Alter, dans le livre « Irresistible » (2017), est allé plus loin et a posé une question difficile : est-il normal de concevoir des produits en utilisant les mêmes principes qui sous-tendent l'addiction aux machines à sous ? Selon les critères cliniques — retour compulsif, perte de contrôle du temps, poursuite malgré un dommage conscient, syndrome de sevrage à l'arrêt — ce qui arrive à de nombreux utilisateurs de réseaux sociaux correspond à la définition d'une dépendance comportementale.\n\n> Skinner a découvert le renforcement variable en 1938. Nir Eyal en a fait un manuel pour startups en 2014. Les réseaux sociaux l'ont intégré à l'architecture de chaque application.\n\nParallèlement, Malcolm Gladwell, dans « The Tipping Point », a décrit la mécanique de la propagation épidémique : toute épidémie a un point de bascule, après lequel la diffusion prend une ampleur d'avalanche. Facebook a atteint ce point lorsqu'il est devenu l'endroit où se trouvait « tout le monde », parce que si tous tes amis y sont, tu n'as pas d'autre choix que d'y être aussi. Dépendance individuelle plus pression sociale collective : c'est pour cela qu'il est si difficile de quitter les réseaux sociaux.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["graphe social", "psychologie", "addiction", "plateformes"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "chronicle", "sceneIndex": 1, "type": "media", "shortTitle": "Chronique", "era": "2003→années 2020", "lensWeight": {"chronology": 5, "psychology": 3, "bonds": 3, "health": 3, "reality": 2}, "title": "Chronique des réseaux sociaux : de Friendster à TikTok", "insight": "En 20 ans, les réseaux sociaux ont capté successivement tous les niveaux de la vie sociale. Dans les années 2020, la personne moyenne y passait plus de deux heures par jour, davantage que pour toute autre activité, sauf dormir et travailler.", "thesis": "En 20 ans, les réseaux sociaux ont capté successivement tous les niveaux de la vie sociale. Dans les années 2020, la personne moyenne y passait plus de deux heures par jour, davantage que pour toute autre activité, sauf dormir et travailler.", "body": "## Vingt ans qui ont changé la vie sociale\n\nEn vingt ans — de 2002 à 2022 — les réseaux sociaux sont passés d’un passe-temps étudiant à une infrastructure mondiale utilisée par cinq milliards de personnes. Chaque vague allait plus vite que la précédente. Chaque plateforme a capté une nouvelle couche de la vie sociale.\n\nLe premier réseau social de masse au sens moderne a été Friendster, lancé en 2002 aux États-Unis. L’idée semblait révolutionnaire : un profil, une liste d’amis, la possibilité de voir les amis de ses amis. En trois mois, trois millions d’utilisateurs. C’était une explosion pour l’époque. Mais Friendster n’a pas supporté son propre succès : les serveurs tombaient, les pages mettaient une minute à se charger, les utilisateurs repartaient frustrés. La technologie n’a pas suivi la demande.\n\nEn 2003, MySpace est apparu et est vite devenu le plus grand réseau social du monde. Sa particularité : une liberté de personnalisation maximale. Chacun pouvait façonner son profil comme il le voulait — ses propres couleurs, sa propre musique de fond, sa propre mise en page. MySpace est devenu un refuge pour les musiciens, les artistes et les sous-cultures. En 2005, le magnat des médias Rupert Murdoch l’a acheté pour 580 millions de dollars, au sommet du buzz. Cinq ans plus tard, MySpace était mort. Facebook l’a tué, par sa propreté, sa simplicité et son algorithme.\n\nLa même année 2003, LinkedIn a discrètement été lancé pour les relations professionnelles. Pas de design tape-à-l'œil, pas de divertissement, seulement des CV et des contacts. Cela semblait ennuyeux. Mais LinkedIn a trouvé sa niche et l’a occupée pour de bon : en 2023, plus de 900 millions d’utilisateurs.\n\n## Facebook, Twitter, YouTube, Instagram\n\n2004. Mark Zuckerberg lance TheFacebook.com depuis une chambre d’une résidence universitaire de Harvard. En une semaine, la moitié des étudiants de Harvard sont inscrits. La mécanique est brillante : de vrais noms, de vraies photos, de vraies connexions. Aucun pseudonyme. Ce n’est pas un espace anonyme, c’est un reflet numérique de la vie sociale réelle.\n\nEn 2012, un milliard d’utilisateurs. Le bouton « Se connecter avec Facebook » apparaît sur des millions de sites. Quitter Facebook en vient à signifier sortir de la vie sociale.\n\n2005. Trois anciens employés de PayPal créent YouTube. La première vidéo dure dix-huit secondes au zoo. Un an plus tard, Google l’achète pour 1,65 milliard de dollars — à l’époque, cela semblait fou. YouTube a brisé le monopole de la télévision : n’importe qui avec une caméra peut diffuser à une audience mondiale. En 2023, 500 heures de vidéo sont mises en ligne chaque minute.\n\n2006. Jack Dorsey publie le premier tweet. Twitter est devenu une place mondiale en temps réel : journalistes, politiques et chercheurs s’adressaient directement au public sans éditeurs. Le Printemps arabe s’est organisé via Twitter. Les tremblements de terre apparaissaient d’abord là — et seulement ensuite dans les informations.\n\n2010. Instagram : photos carrées, filtres, pas de texte. Facebook l’achète en 2012 pour un milliard. Instagram a transformé la culture visuelle : les restaurants concevaient des intérieurs « pour Instagram », les lieux touristiques étaient jugés à leur « instagrammabilité ».\n\n## VKontakte, Telegram et TikTok\n\n2006. Pavel Durov lance VKontakte pour les étudiants de l’Université de Saint-Pétersbourg. Pour des dizaines de millions de personnes en Russie, en Ukraine et dans les pays postsoviétiques, VKontakte est devenu le premier internet, l’endroit où se sont formées les habitudes numériques de toute une génération. L’histoire de Durov avec VKontakte s’est terminée par un conflit avec l’État en 2014. Il est parti — et a créé Telegram. Nous en parlerons dans les prochains chapitres.\n\n2016 en Chine, 2018 pour le lancement mondial de TikTok. C’est un changement radical : le fil principal, le « For You Page », vous montre des vidéos de parfaits inconnus, sélectionnées par un algorithme en fonction de votre comportement. Vous ne choisissez pas ce que vous regardez : c’est l’algorithme qui décide. Le temps moyen passé sur TikTok est de plus de 90 minutes par jour. TikTok a posé une question qui n’avait jamais résonné avec une telle acuité : que se passe-t-il lorsque l’algorithme qui façonne la réalité de milliards de personnes appartient à une entreprise relevant de la juridiction d’un autre État ?\n\n> En vingt ans, les réseaux sociaux ont capté successivement toutes les couches de la vie sociale : liens professionnels, amitié, discours public, vidéo, identité visuelle, divertissement. Au milieu des années 2020, la personne moyenne y passait plus de deux heures par jour.\n\nC’est plus que toute autre activité dans la vie d’une personne, à l’exception du sommeil et du travail. Aucune technologie dans l’histoire n’a pris autant de temps à autant de gens.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["graphe social", "histoire", "plateformes", "Telegram"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "dunbar", "sceneIndex": 2, "type": "privacy", "shortTitle": "Dunbar", "era": "1992", "lensWeight": {"chronology": 2, "psychology": 2, "bonds": 5, "health": 3, "reality": 1}, "title": "Dunbar : mille amis contre cent cinquante", "insight": "Dunbar a démontré que le cerveau est conçu pour 150 relations. Mille « amis » sur les réseaux sociaux n’élargissent pas cette limite : ils rendent chaque contact superficiel et aggravent la solitude.", "thesis": "Dunbar a démontré que le cerveau est conçu pour 150 relations. Mille « amis » sur les réseaux sociaux n’élargissent pas cette limite : ils rendent chaque contact superficiel et aggravent la solitude.", "body": "## Le nombre qui n’a pas changé depuis un million d’années\n\nEn 1992, l’anthropologue britannique Robin Dunbar a publié une étude qui est devenue l’une des plus citées en anthropologie. Il a étudié la taille du néocortex — la partie du cerveau responsable de la cognition sociale — chez différentes espèces de primates. Et il a trouvé une corrélation nette : plus le néocortex est grand par rapport à la taille du cerveau, plus les groupes sociaux dans lesquels vit l’espèce sont vastes.\n\nChez l’être humain, Dunbar a calculé ce nombre : environ 150. C’est le nombre de relations sociales stables que le cerveau humain peut entretenir en même temps. Pas seulement des « connaissances », mais des personnes dont tu suis la situation de vie, avec qui tu as une histoire, et à qui tu fais confiance à un certain niveau.\n\nCe nombre — 150 — est appelé le « nombre de Dunbar ». On le retrouve dans des contextes très différents. La taille des unités militaires efficaces à travers l’histoire est d’environ 150 personnes. La taille des villages traditionnels de chasseurs-cueilleurs est d’environ 150 personnes. La taille des communautés religieuses soudées est d’environ 150 personnes. Pas parce que quelqu’un l’a décidé ainsi. Simplement parce que c’est la limite de ce que notre cerveau peut traiter.\n\n## Ce qui arrive au cerveau avec mille « amis »\n\nRegarde maintenant ton Facebook ou ton Instagram. Combien as-tu d’« amis » ou d’abonnés ? Des centaines ? Des milliers ? Les réseaux sociaux nous ont donné la possibilité d’entretenir des liens avec un nombre de personnes cinq à vingt fois supérieur à notre limite cognitive.\n\nNotre cerveau n’a pas changé. L’évolution n’a pas suivi la technologie. Que se passe-t-il lorsqu’une personne tente de gérer une vie sociale qui dépasse de dix fois ses capacités cognitives ? Elle commence à simplifier. À réagir vite, superficiellement, émotionnellement. Un like au lieu d’une conversation. Une réaction au lieu d’une compréhension. Un commentaire public au lieu d’un message privé.\n\nCe n’est ni de la paresse ni une dégradation. C’est une surcharge neurobiologique. Le cerveau fait ce qu’il peut : il réduit les signaux au minimum. À la place d’une interaction émotionnelle complexe, appuyer sur le cœur. À la place d’une conversation sincère, écrire « félicitations ! » sous une photo.\n\nC’est pour cela qu’un millier d’amis sur les réseaux sociaux ne nous rend pas plus heureux ni moins seuls. Les études — y compris les travaux cités par Haidt — montrent l’inverse : l’augmentation du nombre de « liens » en ligne est corrélée à une hausse du sentiment de solitude. Parce que le cerveau ne peut pas distinguer un contact en ligne superficiel d’un vrai lien : il se surcharge simplement et se coupe émotionnellement.\n\nAjoute à cela ce que Gladwell décrit dans « The Tipping Point » : une fois qu’une plateforme atteint une masse critique, y être présent devient une nécessité sociale. On ne choisit pas d’être sur Facebook pour la qualité des interactions. On y est parce que tout le monde y est. Et cela signifie que tu es condamné à faire défiler sans fin un fil de personnes avec lesquelles tu as un « lien » sans lien réel.\n\n> Dunbar l’a montré : notre cerveau est fait pour 150 relations. Les réseaux sociaux nous en ont donné des milliers — et ont rendu chacune d’elles superficielle. Plus de liens ne veut pas dire moins de solitude.\n\nCela explique l’un des grands paradoxes de l’ère des réseaux sociaux : nous n’avons jamais été aussi « connectés » — et nous n’avons jamais ressenti autant de solitude. L’épidémie de solitude que les psychologues observent dans l
