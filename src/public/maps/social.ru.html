ng%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["әлеуметтік граф", "тарих", "платформалар", "Telegram"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "dunbar", "sceneIndex": 2, "type": "privacy", "shortTitle": "Данбар", "era": "1992", "lensWeight": {"chronology": 2, "psychology": 2, "bonds": 5, "health": 3, "reality": 1}, "title": "Данбар: мың дос пен жүз елу", "insight": "Данбар дәлелдеді: ми 150 қатынасқа арналған. Әлеуметтік желідегі мың «дос» бұл шекті кеңейтпейді — ол әр контактіні үстірт етіп, жалғыздықты күшейтеді.", "thesis": "Данбар дәлелдеді: ми 150 қатынасқа арналған. Әлеуметтік желідегі мың «дос» бұл шекті кеңейтпейді — ол әр контактіні үстірт етіп, жалғыздықты күшейтеді.", "body": "## Миллион жылда өзгермеген сан\n\n1992 жылы британдық антрополог Робин Данбар антропологиядағы ең көп дәйексөз келтірілетін зерттеулердің біріне айналған еңбегін жариялады. Ол приматтардың әртүрлі түрлеріндегі неокортекстің — әлеуметтік танымға жауап беретін ми бөлігінің — көлемін зерттеді. Және нақты корреляция тапты: неокортекс ми көлеміне қатысты неғұрлым үлкен болса, түр соғұрлым үлкен әлеуметтік топтарда өмір сүреді.\n\nАдам үшін Данбар бұл санды есептеді: шамамен 150. Адам миы бір уақытта дәл осынша тұрақты әлеуметтік қатынасты ұстап тұра алады. Жай ғана «таныстарды» емес, өмірлік жағдайын бақылап отыратын, ортақ тарихың бар, белгілі бір деңгейде сенетін адамдарды.\n\nБұл сан — 150 — «Данбар саны» деп аталады. Ол әртүрлі контекстерде қайталанады. Тарих бойындағы тиімді әскери бөлімшелердің көлемі — шамамен 150 адам. Дәстүрлі аңшы-жинаушы ауылдардың көлемі — шамамен 150 адам. Ұйысқан діни қауымдардың көлемі — шамамен 150 адам. Біреу солай шешкендіктен емес. Жай ғана бұл — миымыз өңдей алатын нәрсенің шегі.\n\n## Мың «дос» болғанда миға не болады\n\nЕнді өз Facebook немесе Instagram парақшаңа қара. Сенде қанша «дос» немесе жазылушы бар? Жүздеген бе? Мыңдаған ба? Әлеуметтік желілер бізге когнитивтік шегімізден бес-жиырма есе көп адаммен байланыс ұстап тұру мүмкіндігін берді.\n\nМиымыз өзгерген жоқ. Эволюция технологияларға ілесе алмады. Адам өзінің когнитивтік мүмкіндіктерінен он есе асып түсетін әлеуметтік өмірді басқаруға тырысқанда не болады? Ол жеңілдетуге кіріседі. Жылдам, үстірт, эмоциямен реакция береді. Әңгіме орнына лайк. Түсіну орнына реакция. Жеке хабарлама орнына жария пікір.\n\nБұл жалқаулық та, құлдырау да емес. Бұл — нейробиологиялық артық жүктеме. Ми қолынан келетін жалғыз нәрсені істейді: сигналдарды минимумға дейін жеңілдетеді. Күрделі эмоциялық өзара әрекет орнына — жүрекшені басу. Шынайы әңгіме орнына — суреттің астына «құттықтаймын!» деп жазу.\n\nСондықтан әлеуметтік желідегі мың дос бізді бақыттырақ немесе жалғыздығы аз адамдарға айналдырмайды. Зерттеулер — соның ішінде Хайдт сілтеме жасайтын еңбектер — керісінше көрсетеді: онлайн-«байланыстар» санының өсуі жалғыздық сезімінің өсуімен корреляцияланады. Өйткені ми үстірт онлайн-контактіні шынайы байланыстан ажырата алмайды — ол жай ғана артық жүктеліп, эмоциялық тұрғыдан өшіп қалады.\n\nБұған Гладвеллдің «The Tipping Point» кітабында сипаттағанын қос: платформа критикалық массаға жеткеннен кейін, онда болу әлеуметтік қажеттілікке айналады. Сен Facebook-те өзара әрекет сапасы үшін отырмайсың. Сен ондасың, өйткені бәрі сонда. Демек, сен шынайы байланысың жоқ болса да «байланысың» бар адамдардың лентасын шексіз скролдауға мәжбүрсің.\n\n> Данбар көрсетті: миымыз 150 қатынасқа арналған. Әлеуметтік желілер бізге мыңдағанын берді — әрі олардың әрқайсысын үстірт етті. Көп байланыс жалғыздықтың азаюын білдірмейді.\n\nБұл әлеуметтік желілер дәуірінің басты парадокстарының бірін түсіндіреді: біз ешқашан мұншалықты «байланысқан» емеспіз — және ешқашан өзімізді мұншалықты жалғыз сезінген емеспіз. 2010-жылдардың басынан бері бүкіл әлем психологтары тіркеп отырған жалғыздық эпидемиясы смартфондар мен әлеуметтік желілердің жаппай таралуымен уақыт жағынан сәйкес келеді. Бұл кездейсоқтық емес.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["психология", "әлеуметтік граф", "нейроғылым", "қауымдастық"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "haidt", "sceneIndex": 3, "type": "power", "shortTitle": "Хайдт", "era": "2012→", "lensWeight": {"chronology": 4, "psychology": 4, "bonds": 3, "health": 5, "reality": 2}, "title": "Хайдт: мазасыз ұрпақ", "insight": "Хайдт ондаған елдің деректерін жинады: 2012 жылдан бері жасөспірімдер арасында мазасыздық пен депрессия күрт өсті. Бұл смартфондар мен Instagram-ның жаппай таралуымен сәйкес келеді.", "thesis": "Хайдт ондаған елдің деректерін жинады: 2012 жылдан бері жасөспірімдер арасында мазасыздық пен депрессия күрт өсті. Бұл смартфондар мен Instagram-ның жаппай таралуымен сәйкес келеді.", "body": "## Әңгімені өзгерткен деректер\n\nДжонатан Хайдт — Нью-Йорк университетінің әлеуметтік психологы. 2024 жылы ол «The Anxious Generation» — «Мазасыз ұрпақ» кітабын жариялады. Бұл ересектердің жаңа технологияларға қатысты үрейі емес. Бұл көп жылдық жүйелі деректер зерттеуі, әрі ол даулауға қиын қорытындыға келді.\n\nШамамен 2012 жылдан бастап — смартфондар шынымен жаппай таралып, Instagram критикалық аудитория жинаған кезде — жасөспірімдер арасындағы депрессия, мазасыздық және өзіне зиян келтіру деңгейі барлық батыс елдерінде бір уақытта өсе бастады. Хайдт АҚШ, Ұлыбритания, Канада, Аустралия, Жаңа Зеландия, Скандинавия деректерін жинады. Барлық жерде бірдей қисық — шамамен 2012–2013 жылдары күрт сыну.\n\nБір елде емес — бәрінде. Ұлдарда емес — әсіресе қыздарда. Біртіндеп емес — графиктегі сыну сияқты күрт. Уақыт жағынан смартфондар мен әлеуметтік желілердің жаппай таралуымен сәйкес келуі кездейсоқтық бола алмайтындай дәл.\n\n## Механизмдер: бұл қалай жұмыс істейді\n\nХайдт әлеуметтік желілер жасөспірімдердің психологиялық денсаулығына әсер ететін бірнеше нақты механизмді сипаттайды.\n\nТұрақты әлеуметтік салыстыру. Instagram-да адамдар өмірінің ең жақсы сәттерін — сүзгіден өткен, өңделген, мұқият таңдалған сәттерін жариялайды. Жасөспірім идеал денелерден, идеал демалыстардан, идеал қарым-қатынастардан тұратын лентаны көреді. Өзінің іштен қарағандағы өмірі — қызықсыз күнделікті тірлігі мен сенімсіздігі бар өмір — салыстырғанда жұтаң көрінеді. Бұл салыстыру шексіз әрі тең емес: сен өз күнделікті өміріңді басқалардың мерекелерімен салыстырасың.\n\nЛайктар арқылы жария бағалау. Жасөспірімнің өзін-өзі бағалауы — жасының өзі салдарынан онсыз да тұрақсыз — экрандағы санға тура байланып қалады. Фото жариялап, аз лайк алдың — бұл сенің жеткілікті танымал емес, жеткілікті әдемі емес, жеткілікті қызық емес екеніңнің жария дәлелі. Бұл — барлығына көрінетін, нақты уақыттағы әлеуметтік қабылдамау.\n\nТірі қарым-қатынасты цифрлық қарым-қатынаспен алмастыру. Тірі қарым-қатынас — ыңғайсыздығымен, үзілістерімен, эмоцияларды оқуға мәжбүрлігімен — эмоциялық интеллектіні дамытады. Мәтіндік өзара әрекеттер оны дамытпайды. Кездесулердің орнына телефонмен өскен ұрпақ ересек өмірге шынайы қарым-қатынас дағдыларының тапшылығымен келеді — бұл әлеуметтік жағдайлардағы мазасыздықты тек күшейтеді.\n\nТәулік бойы қолжетімділік. Смартфондарға дейін балаларда паналайтын орын болды: мектептегі қорлау кешкі алтыда, сен үйге келгенде аяқталатын. Енді олай емес. Қалтадағы телефон қорлау, шеттету, буллинг тәулігіне 24 сағат, аптасына жеті күн қолжетімді дегенді білдіреді. Жасырынатын жер жоқ.\n\nАдам Альтер «Irresistible» кітабында қосады: бұл жай ғана психологиялық зиян емес. Клиникалық критерийлер бойынша жасөспірімдермен болып жатқан нәрсе — телефонға мәжбүрлі түрде қайта оралу, уақытты бақылауды жоғалту, зиянын түсінсе де жалғастыру — мінез-құлықтық тәуелділік анықтамасына сай келеді. Біз балаларға аддиктивті құрылғы бердік те, нәтижелеріне таңғаламыз.\n\n> Хайдт ондаған елдің деректерін жинады: 2012 жылдан бері жасөспірімдер арасындағы мазасыздық пен депрессия эпидемиясы смартфондар мен Instagram-ның жаппай таралуымен уақыт жағынан сәйкес келеді. Бұл кездейсоқтық емес.\n\nБіз балаларға олардың келісімінсіз және салдарын түсінбей ауқымды әлеуметтік эксперимент жүргіздік. Бұл эксперименттің нәтижелері қазір бүкіл әлемдегі психиатриялық ауруханалардың статистикасынан көрініп тұр.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["психология", "психикалық денсаулық", "әлеуметтік граф", "медиа"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "kotler", "sceneIndex": 4, "type": "media", "shortTitle": "Котлер 4.0/5.0", "era": "2016→2021", "lensWeight": {"chronology": 3, "psychology": 3, "bonds": 2, "health": 1, "reality": 3}, "title": "Котлер 4.0 және 5.0: әлеуметтік желілер дәуіріндегі маркетинг", "insight": "Котлер 4.0 тіркеді: сенім брендтерден адамдарға өтті. Котлер 5.0 бір адамға дейінгі жекелендіруді сипаттады — бұл құрал қамқорлық ретінде де, манипуляция ретінде де бірдей жұмыс істейді.", "thesis": "Котлер 4.0 тіркеді: сенім брендтерден адамдарға өтті. Котлер 5.0 бір адамға дейінгі жекелендіруді сипаттады — бұл құрал қамқорлық ретінде де, манипуляция ретінде де бірдей жұмыс істейді.", "body": "## Сенім брендтерден адамдарға өткен кезде\n\nФилип Котлер «Маркетинг 3.0»-де тоқтап қалған жоқ. Әлеуметтік желілер ойын ережелерін соншалықты түбегейлі өзгертті, оны қайта ойластыру қажет болды — екі рет.\n\n«Маркетинг 4.0» (2016) кітабында Котлер әлеуметтік желілер бренд пен сатып алушы қатынасында жасаған трансформацияны тіркеді. Маркетинг 3.0 мынаны ашты: адамдар тауарды емес, құндылықтарды сатып алады. Маркетинг 4.0 қосты: әлеуметтік желілер дәуірінде сатып алушының жолы сызықтық емес әрі ұжымдық болды.\n\nБұрын сатып алушының жолы болжамды болатын: жарнаманы көрді → қызықты → дүкенге келді → сатып алды. Бренд әр қадамды бақылап отырды. Енді адам Instagram-да басқа сатып алушының постын көреді → маркетплейстегі бейтаныс адамдардың пікірлерін оқиды → YouTube-та блогердің шолуын қарайды → комментарийлерде талқылайды → содан кейін ғана, мүмкін, сатып алады. Әр қадамда бренд әңгімені бақыламайды. Әңгімені басқа адамдар жүргізеді.\n\nБұл бәрін өзгертті. Жүз мың жазылушысы бар шынайы аудиториялы инфлюенсер миллион долларлық телероликтен тиімдірек болып шығады. Оның қамтуы көбірек болғандықтан емес, тыңдаушылары оған сенетіндіктен. Сенім брендтерден адамдарға өтті. Бұл — қайтымсыз ығысу.\n\nКотлер сатып алушы жолының жаңа моделін сипаттайды: Aware → Appeal → Ask → Act → Advocate. Сен өнім туралы білесің (Aware), ол сені тартады (Appeal), басқалардың пікірін сұрайсың (Ask), сатып аласың (Act) — ал егер риза болсаң, оның амбассадорына айналасың (Advocate). Advocate циклді жабады: ол келесі сатып алушының жолын бастайтын контент жасайды. Клиент маркетинг машинасының бір бөлігіне айналды.\n\n## Маркетинг 5.0: әр адаммен бір де бір\n\n«Маркетинг 5.0» (2021) кітабында Котлер келесі деңгейді сипаттады: технологиялар — AI, үлкен деректер, автоматтандыру — коммуникацияны нақты уақыт режимінде бір адам деңгейіне дейін жекелендіруге мүмкіндік береді.\n\nБұрын таргетинг былай көрінетін: «Спортқа қызығатын 25–35 жастағы ер адамдарға арналған жарнама». Дөрекі, дәл емес, тиімсіз. Қазіргі маркетинг 5.0 басқаша жұмыс істейді: «Бұл хабарлама — 28 жастағы Иванға, ол YouTube-та кроссовка шолуларын үш рет қараған, өткен жұмада Google-дан жеңілдіктер іздеген, ал оның Instagram-дағы достары жақында жүгіруден суреттер жариялаған. Ол дүйсенбі күні таңғы 7:30-да жұмысқа бара жатқанда, оған осы ұсынысты көрсет».\n\nКотлер мұнда мүмкіндік көрді: технологиялар ақыры адамдарға шынайы қызмет ете алады. Әр адамға дәл өзіне керек нәрсені, керек кезінде беру. Жекелендіру — қамқорлық ретінде.\n\nБірақ дәл осы сипаттама — үтіріне дейін — ең дәл манипуляция құралының да сипаттамасы. Айырмашылық тек оны қолданатын адамның ниетінде. Бір құрал адамға қажет өнімді табуға көмектесе алады — немесе онда бұрын болмаған қажеттілікті байқатпай қалыптастыра алады.\n\nОсы жерде Котлер қоятын, бірақ толық жауап бермейтін сұрақ туындайды: бұл жекелендіру кімнің мүддесіне қызмет ететінін кім бақылайды? Сатып алушының мүддесіне ме — әлде сатушының мүддесіне ме?\n\n> Котлер тіркеді: маркетинг 4.0 әлеуметтік желілер арқылы билікті адамдарға берді. Маркетинг 5.0 оны AI арқылы қайтаруға тырысты. Сұрақ — бұл құрал кімнің мүддесіне қызмет етеді.\n\nБұл қайшылық — технологияның қамқорлық құралы болуы мен манипуляция құралы болуы арасындағы қайшылық — цифрлық дәуірдің бүкіл тарихынан өтеді. Web3 дәл осыны шешуге тырысады: децентрализация арқылы, деректерге меншік арқылы, алгоритмдердің ашықтығы арқылы.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["маркетинг", "әлеуметтік граф", "платформалар", "психология"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "sunstein", "sceneIndex": 5, "type": "power", "shortTitle": "Санстейн", "era": "2001→2017", "lensWeight": {"chronology": 3, "psychology": 2, "bonds": 2, "health": 2, "reality": 5}, "title": "Санстейн: эхо-камералар және ортақ шындықтың соңы", "insight": "Санстейн көрсетті: әлеуметтік желілердің алгоритмдері түсінуге емес, қатысымға оңтайландырылған - және бұл демократия онсыз мүмкін болмайтын ортақ ақпараттық кеңістікті жүйелі түрде бұзады.", "thesis": "Санстейн көрсетті: әлеуметтік желілердің алгоритмдері түсінуге емес, қатысымға оңтайландырылған - және бұл демократия онсыз мүмкін болмайтын ортақ ақпараттық кеңістікті жүйелі түрде бұзады.", "body": "## Саяси емес, архитектуралық мәселе\n\nКэсс Санстейн - Гарвардтағы құқықтанушы және мінез-құлық экономикасының маманы. \"#Republic\" кітабында ол саяси болып көрінетін, бірақ шын мәнінде архитектуралық сұрақ қойды: әр азамат өзінің ақпараттық көпіршігінде өмір сүрсе, демократияға не болады?\n\nДемократия ортақ нәрсенің белгілі бір минимумын талап етеді. Азаматтар құндылықтар, басымдықтар және саяси көзқарастар бойынша келіспеуі мүмкін - бұл қалыпты, тіпті пайдалы. Бірақ олар базалық шындықта келісуі керек. Мына оқиға болды. Мынау деректер. Мынау фактілер. Ортақ фактілік база болғанда ғана онымен не істеу керегін талқылауға болады.\n\nӘлеуметтік желілердің алгоритмдері осы ортақ кеңістікті бұзады. Олар қатысымға - сен қолданбада мүмкіндігінше ұзақ қалуыңа оңтайландырылған. Ал назарды ең жақсы ұстайтын не? Күшті эмоция тудыратын контент: ашу, қорқыныш, шаттық, наразылық. Бұрыннан бар сенімдерді растайтын контент. Бұрыннан бар эмоцияларды күшейтетін контент.\n\nНәтижесінде алгоритм әркімге оның жеке шындығын көрсетеді. Біреу мұны қасақана шешкендіктен емес. Жай ғана бұл қатысымды барынша арттыратындықтан.\n\n## Эхо-камералар: өз жаңғырығыңды ғана естігенде\n\nСанстейн мұны \"эхо-камералар\" деп атайды. Сен бәрі шамамен өзің бұрыннан ойлайтын нәрсені айтатын ақпараттық кеңістікке түсесің. Сенімдерің тек күшейе береді - өйткені сен шексіз көп растау көресің. Қарсы уәждер мен балама көзқарастар дерлік жоқ - алгоритм оларды сүзеді, себебі олар қатысымды төмендетеді.\n\nБұл жай ғана жағымсыз емес. Бұл пайымдау қабілеті үшін күйретуші. Өз жаңғырығыңды ғана естігенде, басқа адамдарда шындықтың басқа көрінісі болуы мүмкін екенін түсінуден қаласың. Өз нұсқаңды жалғыз мүмкін нұсқа ретінде қабылдай бастайсың. Басқа көзқарастағы адамдарды қаскөй, ақымақ немесе біржақты деп көресің.\n\nСоңғы жылдардағы АҚШ-тағы, Еуропадағы және басқа өңірлердегі саяси поляризация - кездейсоқтық та емес, жай ғана экономикалық проблемалардың нәтижесі де емес. Бұл түсінуге емес, қатысымға оңтайландырылған архитектураның болжамды салдары. Алгоритм поляризацияны жасаған жоқ. Бірақ оны ауқымдандырып, жеделдетті.\n\nСанстейн мынадай ұқсастық ұсынады: барлық мейрамханалары бұрын жегеніңді ғана беретін автоматтарға ауыстырылған қаланы елестет. Жаңа дәмдер жоқ. Күтпеген жаңалықтар жоқ. Тек қалыптасып қойған қалауларды растау ғана бар. Бұл ыңғайлы сияқты көрінеді - бірақ шын мәнінде әлемді тарылтады.\n\n> Санстейн көрсетті: алгоритм зұлым емес - ол жай ғана қатысымға оңтайландырылған. Бірақ бұл демократия онсыз мүмкін болмайтын ортақ ақпараттық кеңістікті бұзады.\n\nБұл проблема платформаларды реттеу немесе айыппұл салу арқылы шешілмейді. Ол бизнес-модель архитектурасына ендірілген: платформа қатысымнан табыс табады, қатысым эмоциялық контент арқылы барынша артады, ал эмоциялық контент поляризациялайды. Мұны тек бизнес-модельдің өзін өзгерту арқылы - немесе балама архитектура құру арқылы өзгертуге болады.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["алгоритмдер", "демократия", "әлеуметтік граф", "медиа"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "baudrillard", "sceneIndex": 6, "type": "privacy", "shortTitle": "Бодрийяр", "era": "1981", "lensWeight": {"chronology": 2, "psychology": 2, "bonds": 2, "health": 3, "reality": 5}, "title": "Бодрийяр және симулякр: өмір контент ретінде", "insight": "Бодрийяр 1981 жылы симулякрды - шындықты алмастыратын бейнені сипаттады. Instagram-да бұл тура мағынаға айналды: адамдар өмірді бастан кешірудің орнына өмір туралы контент өндіреді.", "thesis": "Бодрийяр 1981 жылы симулякрды - шындықты алмастыратын бейнені сипаттады. Instagram-да бұл тура мағынаға айналды: адамдар өмірді бастан кешірудің орнына өмір туралы контент өндіреді.", "body": "## 1981 жылы Instagram-ды сипаттаған философ\n\nЖан Бодрийяр - француз философы және әлеуметтанушысы. 1981 жылы ол \"Симулякрлар және симуляция\" кітабын жариялады. Бұл қазіргі қоғамдағы бейне мен шындықтың табиғаты туралы абстрактілі философиялық еңбек еді. Ол кезде Instagram болған жоқ. TikTok болған жоқ. Тіпті интернеттің өзі әскери адамдар мен ғалымдардың ғана ісі болатын.\n\nБірақ Бодрийярды қазір оқысаң - ол 2024 жылдан репортаж жазғандай әсер қалдырады.\n\nОның негізгі идеясы: қазіргі әлемде бейне енді шындықты бейнелемейді - оны алмастырады. Бодрийяр бейненің төрт сатысын сипаттады. Алдымен бейне шындықты көрсетеді: фотосурет бір жердің қалай көрінетінін көрсетеді. Кейін бейне шындықты бүркемелейді: жарнама өнімнің идеалдандырылған нұсқасын көрсетеді. Одан кейін бейне шындықтың жоқтығын бүркемелейді: бейне оған сәйкес шындықсыз өмір сүреді. Ақырында - симулякр: бейненің шындыққа еш қатысы жоқ, ол өзі шындыққа айналған.\n\nСимулякр - түпнұсқасы жоқ көшірме. Нақты ештеңені бейнелемейтін, бірақ шындықтың өзінен де шынайырақ қабылданатын бейне.\n\n## Instagram гиперреалдығы\n\nInstagram-да не болып жатқанын Бодрийяр оптикасы арқылы қара.\n\nАдам саяхатқа шығады. Бұрын ол мекенді сезінетін: иістерді, дыбыстарды, температураны, кездейсоқ кездесулерді. Қазір ол мекенді суретке түсіреді. Ол күн батуын сезінбейді - сторис үшін күн батуын түсіреді. Тамақтан ләззат алмайды - жеуді бастамай тұрып тағамды суретке түсіреді. Эмоцияны бастан кешірмейді - оның лентада қалай көрінетінін ойлайды.\n\nСимуляция тәжірибеден маңыздырақ бола бастайды. Бейне шындықтан маңыздырақ. Сөйтіп адамдар біртіндеп бастан кешіру үшін емес, бастан кешіру туралы контент өндіру үшін өмір сүре бастайды.\n\nБодрийяр мұны \"гиперреалдық\" деп атар еді: симуляция шындықтың өзінен де шынайырақ болатын жағдай. Instagram-дағы өмірдің сүзгіден өткен нұсқасы кемшілігі мен күнделіктілігі бар нақты өмірден де \"нағыз\" болып көрінеді.\n\nЗигмунт Бауман \"Liquid Modernity\" еңбегінде бұған сәйкестік өлшемін қосады: қазіргі әлемде сәйкестік тұрақты болудан қалды. Сен тек туғаннан және өскеннен қалыптасқан адам ғана емессің. Сен өзіңді үнемі қайта құрастырасың. Әлеуметтік желілер осы құрылыстың басты алаңына - әрі оның басты күшейткішіне айналды. LinkedIn мен Instagram-да, Twitter мен TikTok-та әртүрлі бола аласың. Еркіндік - бірақ сонымен бірге жаңа мазасыздық түрі: перформанс қай жерде аяқталып, шынайы мен қай жерде басталады?\n\nБұл жай ғана философиялық абстракция емес. Бұл психологтар тіркейтін нақты психологиялық күйдің - \"онлайн-диссоциацияның\" сипаттамасы: шынымен өмір сүрмей, аудитория үшін өзіңнің бір нұсқаңды ойнап жүргендей сезім.\n\n> Бодрийяр 1981 жылы біз қазір Instagram деп атайтын нәрсені сипаттады: бейне тәжірибеден маңыздырақ, симуляция шындықтан маңыздырақ, ал адам өмірді сүрудің орнына өмір туралы контент өндіретін әлемді.\n\nWeb3 контекстінде бұл байқау мына себептен маңызды: децентрализденген интернеттің уәделерінің бірі - адамдарға тек деректерді ғана емес, сәйкестікті де бақылауды қайтару. Платформаға арналған симулякрдың орнына - өзіңе тиесілі егемен цифрлық тұлға. Бірақ бұған қол жете ме - ашық сұрақ.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE% 3%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["бірегейлік", "философия", "әлеуметтік граф", "медиа"], "x": 265.5, "y": 258.0, "angDeg": 218.6}], "edges": [{"from": "skinner", "to": "chronicle", "label": "механика қолданбаларға енгізілді", "lenses": ["psychology", "chronology"]}, {"from": "chronicle", "to": "haidt", "label": "басып алу үрейдің өсуімен тұспа-тұс келді", "lenses": ["chronology", "health"]}, {"from": "skinner", "to": "haidt", "label": "тәуелділік психикаға соққы береді", "lenses": ["psychology", "health"]}, {"from": "dunbar", "to": "chronicle", "label": "жүз елу орнына мың дос", "lenses": ["bonds", "chronology"]}, {"from": "dunbar", "to": "haidt", "label": "үстірттік жалғыздықты күшейтеді", "lenses": ["bonds", "health"]}, {"from": "chronicle", "to": "kotler", "label": "сенім адамдарға өтті", "lenses": ["media", "chronology"]}, {"from": "kotler", "to": "sunstein", "label": "дербестендіру шындықты бөлшектейді", "lenses": ["reality", "psychology"]}, {"from": "sunstein", "to": "baudrillard", "label": "эхо-камера симулякр тудырады", "lenses": ["reality"]}, {"from": "haidt", "to": "baudrillard", "label": "өмір контентпен алмастырылады", "lenses": ["health", "reality"]}, {"from": "skinner", "to": "sunstein", "label": "қызықтыру түсінуден маңыздырақ", "lenses": ["psychology", "reality"]}]}, "uz": {"chapter": {"key": "social", "title": "Ijtimoiy tarmoqlar", "lede": "Aloqalar qanday mahsulotga, sen esa xomashyoga aylanding. Qaramlik, yolgʻizlik va simulyakr mexanikasi.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=social", "centralIdea": "Aloqalar mahsulotga, sen esa xomashyoga aylanding", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Xronologiya", "accent": "#7dd3fc", "description": "Friendsterʼdan TikTokʼgacha: ijtimoiy tarmoqlar hayotning har qatlamini qanday egalladi."}, {"id": "psychology", "label": "Psixologiya", "accent": "#f87171", "description": "Skinner va oʻzgaruvchan mustahkamlash: layk oʻyin avtomati kabi ishlaydi."}, {"id": "bonds", "label": "Aloqalar", "accent": "#c084fc", "description": "Dunbar: miya mingta “doʻst” uchun emas, 150 munosabat uchun yaratilgan."}, {"id": "health", "label": "Salomatlik", "accent": "#34d399", "description": "Haidt: xavotirli avlod — 2012 yildan beri xavotir va depressiya oʻsishi."}, {"id": "reality", "label": "Reallik", "accent": "#fbbf24", "description": "Sunstein va Baudrillard: echo-kameralar va kontent bilan almashtirilgan hayot."}], "nodes": [{"id": "skinner", "sceneIndex": 0, "type": "power", "shortTitle": "Skinner", "era": "1938→", "lensWeight": {"chronology": 2, "psychology": 5, "bonds": 1, "health": 3, "reality": 1}, "title": "Skinner va layk: qaramlik mexanikasi", "insight": "Skinner oʻzgaruvchan mustahkamlashni 1938-yilda kashf etdi. Ijtimoiy tarmoqlar uni har bir ilovaga joyladi — layk xuddi oʻyin avtomati kabi ishlaydi.", "thesis": "Skinner oʻzgaruvchan mustahkamlashni 1938-yilda kashf etdi. Ijtimoiy tarmoqlar uni har bir ilovaga joyladi — layk xuddi oʻyin avtomati kabi ishlaydi.", "body": "## Qutidagi kalamush va qoʻlida telefoni bor sen\n\n1938-yilda amerikalik psixolog B. F. Skinner xulq-atvor haqidagi fan tarixidagi eng muhim tajribalardan biriga aylangan bir qator eksperimentlar oʻtkazdi. U kalamushlarni maxsus qutilarga solib, ular qanday mukofot olishiga qarab richagni bosishni qanday oʻrganishini kuzatdi.\n\nBirinchi variant: richagni bosdi — ovqat oldi. Har doim. Oldindan maʼlum. Kalamush tezda bosishni oʻrgandi — va aynan och qolganda bosardi. Hech qanday majburiylik, hech qanday qaramlik yoʻq.\n\nIkkinchi variant: richagni bosdi — baʼzan ovqat olasan, baʼzan yoʻq. Tasodifiy. Oldindan bilib boʻlmaydi. Mana shu yerda hayratlanarli narsa yuz berdi: kalamush richagni berilib bosa boshladi. Qayta-qayta. Hatto och boʻlmasa ham. Hatto ovqat uzoq vaqt kelmasa ham — kalamush toʻxtamadi. Skinner buni «uzlukli mustahkamlash jadvali» deb atadi va oʻzi kuzatgan xulq-atvorni shakllantirishning eng kuchli mexanizmi dedi.\n\nEndi kalamush oʻrniga oʻzingni qoʻy. Richag oʻrniga — «lentani yangilash» tugmasini. Ovqat oʻrniga — layk, qiziqarli post, doʻstdan xabarni. Sen Instagram ochasan — baʼzan u yerda qiziq narsa bor, baʼzan zerikarli, baʼzan muhim odamdan layk, baʼzan hech narsa yoʻq. Oldindan bilmaysan. Aynan shu oldindan bilib boʻlmaslik seni ushlab turadi.\n\n## Nir Eyal buni darslikka aylantirdi\n\nNir Eyal 2014-yilda «Hooked» kitobini yozdi — va niyatlari haqida mutlaqo ochiq edi. Bu startaplar uchun qoʻllanma: odamlar eslatmasiz va tashqi turtkisiz qaytadigan mahsulotlarni qanday yaratish kerak.\n\nEyal modeli «ilgak» deb ataladi — qayta-qayta takrorlanadigan toʻrt qadam. Trigger: tashqi (bildirishnoma, xat) yoki ichki (zerikish, xavotir, yolgʻizlik) — harakatni ishga tushiradi. Harakat: ilovani ochish, lentani aylantirish, surat joylash — minimal kuch, maksimal soddalik. Oʻzgaruvchan mukofot: baʼzan qiziq, baʼzan yoʻq, baʼzan layk, baʼzan sukunat — Skinnerning oldindan bilib boʻlmasligi amalda. Investitsiya: sen kontent qoʻshasan, odamlarni belgilaysan, profilni sozlaysan — va shu orqali mahsulotni oʻzing uchun qimmatroq, undan voz kechishni esa qiyinroq qilasan.\n\nEyal buni darslik sifatida yozdi — ochiq va uzrsiz. Ijtimoiy tarmoq muhandislari bu modelni oʻrgandi. Ayrimlari keyinroq uni qoʻllaganida vijdon azobi chekkanini tan oldi. Facebook sobiq vitse-prezidentlaridan biri Chamath Palihapitiya 2017-yilda omma oldida: «Biz jamiyatning ijtimoiy toʻqimasini yirtib tashlayotgan vositalarni yaratdik», dedi. Uning farzandlari ijtimoiy tarmoqlardan foydalanmaydi.\n\nAdam Alter «Irresistible» (2017) kitobida yanada uzoqroqqa bordi va keskin savol berdi: oʻyin avtomatlariga qaramlik asosida yotgan prinsiplardan foydalanib mahsulot loyihalash umuman normalmi? Klinik mezonlarga koʻra — majburiy qaytish, vaqt ustidan nazoratni yoʻqotish, ongli zararga qaramay davom ettirish, voz kechganda chekinish sindromi — koʻplab ijtimoiy tarmoq foydalanuvchilari bilan yuz berayotgan narsa xulq-atvor qaramligi taʼrifiga mos keladi.\n\n> Skinner oʻzgaruvchan mustahkamlashni 1938-yilda kashf etdi. Nir Eyal 2014-yilda buni startaplar uchun darslikka aylantirdi. Ijtimoiy tarmoqlar buni har bir ilovaning arxitekturasiga joyladi.\n\nShu bilan birga Malcolm Gladwell «The Tipping Point» kitobida epidemik tarqalish mexanikasini tasvirladi: har qanday epidemiyada burilish nuqtasi boʻladi, undan keyin tarqalish qor koʻchkisidek tus oladi. Facebook bu nuqtaga «hamma» bor joyga aylanganda yetdi — chunki barcha doʻstlaring u yerda boʻlsa, senda ham u yerda boʻlishdan boshqa tanlov qolmaydi. Individual qaramlik va jamoaviy ijtimoiy bosim qoʻshilgani — ijtimoiy tarmoqlarni tark etish nega bunchalik qiyinligining sababi shu.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["ijtimoiy graf", "psixologiya", "qaramlik", "platformalar"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "chronicle", "sceneIndex": 1, "type": "media", "shortTitle": "Xronika", "era": "2003→2020-yillar", "lensWeight": {"chronology": 5, "psychology": 3, "bonds": 3, "health": 3, "reality": 2}, "title": "Ijtimoiy tarmoqlar xronikasi: Friendster’dan TikTok’gacha", "insight": "20 yil ichida ijtimoiy tarmoqlar ijtimoiy hayotning barcha qatlamlarini ketma-ket egalladi. 2020-yillarga kelib oʻrtacha odam ularda kuniga ikki soatdan ortiq vaqt oʻtkazdi — uyqu va ishdan tashqari har qanday faoliyatdan koʻproq.", "thesis": "20 yil ichida ijtimoiy tarmoqlar ijtimoiy hayotning barcha qatlamlarini ketma-ket egalladi. 2020-yillarga kelib oʻrtacha odam ularda kuniga ikki soatdan ortiq vaqt oʻtkazdi — uyqu va ishdan tashqari har qanday faoliyatdan koʻproq.", "body": "## Ijtimoiy hayotni oʻzgartirgan yigirma yil\n\nYigirma yil ichida — 2002-yildan 2022-yilgacha — ijtimoiy tarmoqlar talabalar oʻyin-kulgisidan besh milliard odam foydalanadigan global infratuzilmagacha boʻlgan yoʻlni bosib oʻtdi. Har bir toʻlqin avvalgisidan tezroq edi. Har bir platforma ijtimoiy hayotning yangi qatlamini egalladi.\n\nZamonaviy maʼnodagi birinchi ommaviy ijtimoiy tarmoq Friendster boʻldi — u 2002-yilda AQShda ishga tushirilgan. Gʻoya inqilobiy tuyulardi: profil, doʻstlar roʻyxati, doʻstlarning doʻstlarini koʻrish imkoniyati. Uch oyda — uch million foydalanuvchi. Bu oʻz davri uchun portlash edi. Ammo Friendster oʻz muvaffaqiyatiga dosh bera olmadi: serverlar qular, sahifalar bir necha daqiqalab yuklanar, foydalanuvchilar hafsalasi pir boʻlib ketardi. Texnologiya talabga yetib bora olmadi.\n\n2003-yilda MySpace paydo boʻldi — va tezda dunyodagi eng yirik ijtimoiy tarmoqqa aylandi. Uning farqi: maksimal moslashtirish erkinligi. Har kim profilini istaganicha bezashi mumkin edi — oʻz ranglari, fonda oʻz musiqasi, oʻz dizayni. MySpace musiqachilar, rassomlar, submadaniyatlar uchun uyga aylandi. 2005-yilda mediamagnat Rupert Murdoch uni 580 million dollarga sotib oldi — shov-shuv choʻqqisida. Besh yil oʻtib MySpace oʻlik edi. Uni Facebook oʻldirdi — tozaligi, soddaligi va algoritmi bilan.\n\nOʻsha 2003-yilda LinkedIn professional aloqalar uchun sokin ishga tushdi. Yorqin dizaynsiz, koʻngilochar narsalarsiz — faqat rezyume va kontaktlar. Zerikarli tuyulardi. Ammo LinkedIn oʻz joyini topdi va uni abadiy egalladi: 2023-yilga kelib 900 milliondan ortiq foydalanuvchi.\n\n## Facebook, Twitter, YouTube, Instagram\n\n2004-yil. Mark Zuckerberg TheFacebook.com saytini Harvard yotoqxonasidagi xonadan ishga tushiradi. Bir haftadan keyin — Harvard talabalarining yarmi roʻyxatdan oʻtgan. Mexanika dahshatli darajada zoʻr: haqiqiy ismlar, haqiqiy fotosuratlar, haqiqiy aloqalar. Hech qanday taxalluslar yoʻq. Bu anonim makon emas — bu real ijtimoiy hayotning raqamli aksidir.\n\n2012-yilga kelib — bir milliard foydalanuvchi. «Facebook orqali kirish» tugmasi millionlab saytlarda paydo boʻldi. Facebook’dan chiqish ijtimoiy hayotdan tushib qolishni anglatadigan boʻldi.\n\n2005-yil. PayPal’ning uch nafar sobiq xodimi YouTube yaratadi. Birinchi video — hayvonot bogʻida oʻn sakkiz soniya. Bir yil oʻtib Google uni 1,65 milliard dollarga sotib oladi — oʻsha paytda bu telbalikdek tuyulgan. YouTube televideniye monopoliyasini sindirdi: kamerasi bor har qanday odam global auditoriyaga efirga chiqa oladi. 2023-yilga kelib — har daqiqada 500 soat video yuklanadi.\n\n2006-yil. Jack Dorsey birinchi tvitni eʼlon qiladi. Twitter real vaqt rejimidagi global maydonga aylandi — jurnalistlar, siyosatchilar, olimlar auditoriya bilan muharrirlarsiz toʻgʻridan-toʻgʻri gaplashdi. Arab bahori Twitter orqali tashkil qilindi. Zilzilalar avval u yerda paydo boʻlardi — va faqat keyin yangiliklarda.\n\n2010-yil. Instagram — kvadrat suratlar, filtrlar, matn yoʻq. Facebook uni 2012-yilda bir milliardga sotib oladi. Instagram vizual madaniyatni oʻzgartirdi: restoranlar interyerlarni «Instagram uchun» loyihaladi, sayyohlik joylari «instagramga mosligi» bilan baholandi.\n\n## VKontakte, Telegram va TikTok\n\n2006-yil. Pavel Durov Peterburg universiteti talabalari uchun VKontakte’ni ishga tushiradi. Rossiya, Ukraina va postsovet mamlakatlaridagi oʻn millionlab odamlar uchun VKontakte birinchi internetga — butun bir avlodning raqamli odatlari shakllangan joyga aylandi. Durovning VKontakte bilan tarixi 2014-yilda davlat bilan mojaro bilan tugadi. U ketdi — va Telegram yaratdi. U haqda keyingi boblarda gaplashamiz.\n\n2016-yil Xitoyda, 2018-yil — TikTok’ning global ishga tushishi. Bu radikal siljish: asosiy lenta — «For You Page» — senga algoritm xatti-harakating asosida tanlagan mutlaqo notanish odamlarning videolarini koʻrsatadi. Nimani koʻrishni sen tanlamaysan — algoritm hal qiladi. TikTok’dagi oʻrtacha vaqt — kuniga 90 daqiqadan ortiq. TikTok ilgari bunchalik keskin yangramagan savolni qoʻydi: milliardlarning voqeligini shakllantiradigan algoritm boshqa davlat yurisdiksiyasidagi kompaniyaga tegishli boʻlsa, nima boʻladi?\n\n> Yigirma yil ichida ijtimoiy tarmoqlar ijtimoiy hayotning barcha qatlamlarini ketma-ket egalladi: professional aloqalar, doʻstlik, ommaviy diskurs, video, vizual identiklik, koʻngilocharlik. 2020-yillarning oʻrtalariga kelib oʻrtacha odam ularda kuniga ikki soatdan ortiq vaqt oʻtkazdi.\n\nBu inson hayotidagi uyqu va ishdan tashqari har qanday faoliyatdan koʻproq. Tarixda hech bir texnologiya shuncha koʻp odamdan shuncha koʻp vaqt olmagan.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https: ogle.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["ijtimoiy graf", "tarix", "platformalar", "Telegram"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "dunbar", "sceneIndex": 2, "type": "privacy", "shortTitle": "Dunbar", "era": "1992", "lensWeight": {"chronology": 2, "psychology": 2, "bonds": 5, "health": 3, "reality": 1}, "title": "Dunbar: ming doʻst va bir yuz ellik", "insight": "Dunbar isbotladi: miya 150 munosabat uchun yaratilgan. Ijtimoiy tarmoqlardagi mingta «doʻst» bu chegarani kengaytirmaydi — u har bir kontaktni yuzaki qiladi va yolgʻizlikni kuchaytiradi.", "thesis": "Dunbar isbotladi: miya 150 munosabat uchun yaratilgan. Ijtimoiy tarmoqlardagi mingta «doʻst» bu chegarani kengaytirmaydi — u har bir kontaktni yuzaki qiladi va yolgʻizlikni kuchaytiradi.", "body": "## Bir million yil davomida oʻzgarmagan son\n\n1992-yilda britaniyalik antropolog Robin Dunbar antropologiyada eng koʻp iqtibos keltiriladigan tadqiqotlardan biriga aylangan ishini eʼlon qildi. U turli primat turlarida neokorteks — ijtimoiy bilish uchun javob beradigan miya qismi — hajmini oʻrgandi. Va aniq korrelyatsiyani topdi: neokorteks miya hajmiga nisbatan qanchalik katta boʻlsa, tur shunchalik katta ijtimoiy guruhlarda yashaydi.\n\nInson uchun Dunbar bu sonni hisoblab chiqdi: taxminan 150. Inson miyasi bir vaqtning oʻzida aynan shuncha barqaror ijtimoiy munosabatni ushlab tura oladi. Shunchaki «tanishlar»ni emas, balki hayotiy holatini kuzatib boradigan, u bilan umumiy tarixing bor, maʼlum darajada ishonadigan odamlarni.\n\nBu son — 150 — «Dunbar soni» deb ataladi. U juda turli kontekstlarda takrorlanadi. Tarix davomida samarali harbiy boʻlinmalar hajmi — taxminan 150 kishi. Anʼanaviy ovchi-terimchi qishloqlar hajmi — taxminan 150 kishi. Jips diniy jamoalar hajmi — taxminan 150 kishi. Kimdir shunday qaror qilgani uchun emas. Shunchaki bu miyamiz qayta ishlay oladigan narsaning chegarasi.\n\n## Mingta «doʻst» boʻlganda miyaga nima boʻladi\n\nEndi oʻz Facebook yoki Instagram'ingga qarang. Senda nechta «doʻst» yoki obunachi bor? Yuzlabmi? Minglabmi? Ijtimoiy tarmoqlar bizga kognitiv chegaramizdan besh-yigirma baravar koʻp odam bilan aloqa ushlab turish imkonini berdi.\n\nMiyamiz oʻzgarmadi. Evolyutsiya texnologiyalarga yetib ulgurmadi. Inson oʻz kognitiv imkoniyatlaridan oʻn baravar oshib ketadigan ijtimoiy hayotni boshqarishga uringanda nima boʻladi? U soddalashtira boshlaydi. Tez, yuzaki, emotsional munosabat bildiradi. Suhbat oʻrniga layk. Tushunish oʻrniga reaksiya. Shaxsiy xabar oʻrniga ommaviy izoh.\n\nBu dangasalik ham, tanazzul ham emas. Bu neyrobiologik ortiqcha yuklama. Miya qoʻlidan keladigan yagona ishni qiladi: signallarni minimumgacha soddalashtiradi. Murakkab emotsional oʻzaro taʼsir oʻrniga — yurakchani bosish. Samimiy suhbat oʻrniga — surat ostiga «tabriklayman!» deb yozish.\n\nShuning uchun ijtimoiy tarmoqlardagi mingta doʻst bizni baxtliroq yoki kamroq yolgʻiz qilmaydi. Tadqiqotlar — jumladan Haidt havola qiladigan ishlar — buning aksini koʻrsatadi: onlayn-«aloqalar» sonining oʻsishi yolgʻizlik hissining oʻsishi bilan korrelyatsiyalanadi. Chunki miya yuzaki onlayn-kontaktni haqiqiy aloqadan ajrata olmaydi — u shunchaki ortiqcha yuklanadi va emotsional jihatdan oʻchib qoladi.\n\nBunga Gladwell «The Tipping Point»da tasvirlagan narsani qoʻshing: platforma kritik massaga yetgandan keyin, unda boʻlish ijtimoiy zaruratga aylanadi. Sen Facebook'da oʻzaro taʼsir sifati uchun emassan. Sen u yerdasan, chunki hamma u yerda. Demak, haqiqiy aloqang boʻlmasa ham «aloqang» bor odamlar lentasini cheksiz skroll qilishga mahkumsan.\n\n> Dunbar koʻrsatdi: miyamiz 150 munosabat uchun yaratilgan. Ijtimoiy tarmoqlar bizga minglab munosabat berdi — va ularning har birini yuzaki qildi. Koʻproq aloqa kamroq yolgʻizlikni anglatmaydi.\n\nBu ijtimoiy tarmoqlar davrining asosiy paradokslaridan birini tushuntiradi: biz hech qachon bunchalik «bogʻlangan» boʻlmaganmiz — va hech qachon oʻzimizni bunchalik yolgʻiz his qilmaganmiz. 2010-yillarning boshidan beri butun dunyo psixologlari qayd etayotgan yolgʻizlik epidemiyasi smartfonlar va ijtimoiy tarmoqlarning ommaviy tarqalishi bilan vaqt jihatidan mos keladi. Bu tasodif emas.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["psixologiya", "ijtimoiy graf", "neyrofan", "hamjamiyat"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "haidt", "sceneIndex": 3, "type": "power", "shortTitle": "Haidt", "era": "2012→", "lensWeight": {"chronology": 4, "psychology": 4, "bonds": 3, "health": 5, "reality": 2}, "title": "Haidt: xavotirli avlod", "insight": "Haidt oʻnlab mamlakatlardan maʼlumot toʻpladi: 2012-yildan beri oʻsmirlar orasida xavotir va depressiya keskin oʻsdi. Bu smartfonlar va Instagram'ning ommaviy tarqalishi bilan mos keladi.", "thesis": "Haidt oʻnlab mamlakatlardan maʼlumot toʻpladi: 2012-yildan beri oʻsmirlar orasida xavotir va depressiya keskin oʻsdi. Bu smartfonlar va Instagram'ning ommaviy tarqalishi bilan mos keladi.", "body": "## Suhbatni oʻzgartirgan maʼlumotlar\n\nJonathan Haidt — New York universitetining ijtimoiy psixologi. 2024-yilda u «The Anxious Generation» — «Xavotirli avlod» kitobini eʼlon qildi. Bu kattalarning yangi texnologiyalar haqidagi vahimasi emas. Bu koʻp yillik tizimli maʼlumotlar tadqiqoti boʻlib, u bahslashish qiyin boʻlgan xulosaga keldi.\n\nTaxminan 2012-yildan boshlab — smartfonlar chinakam ommaviy boʻlib, Instagram kritik auditoriya toʻplagan paytda — oʻsmirlar orasida depressiya, xavotir va oʻziga zarar yetkazish darajasi barcha gʻarb mamlakatlarida bir vaqtda oʻsa boshladi. Haidt AQSH, Buyuk Britaniya, Kanada, Avstraliya, Yangi Zelandiya, Skandinaviya maʼlumotlarini toʻpladi. Hamma joyda bir xil egri chiziq — taxminan 2012–2013-yillarda keskin sinish.\n\nBitta mamlakatda emas — hammasida. Oʻgʻil bolalarda emas — ayniqsa qizlarda. Asta-sekin emas — grafikdagi sinishdek keskin. Smartfonlar va ijtimoiy tarmoqlarning ommaviy tarqalishi bilan vaqt jihatidan mos kelishi tasodif boʻla olmaydigan darajada aniq.\n\n## Mexanizmlar: bu qanday ishlaydi\n\nHaidt ijtimoiy tarmoqlar oʻsmirlarning psixologik salomatligiga taʼsir qiladigan bir nechta aniq mexanizmni tasvirlaydi.\n\nDoimiy ijtimoiy taqqoslash. Instagram'da odamlar hayotining eng yaxshi lahzalarini — filtrlangan, tahrirlangan, puxta tanlangan holatlarni eʼlon qiladi. Oʻsmir ideal tanalar, ideal taʼtillar, ideal munosabatlardan iborat lentani koʻradi. Uning ichkaridan kuzatiladigan oʻz hayoti — zerikarli kundaliklari va ishonchsizligi bilan — taqqoslaganda ayanchli koʻrinadi. Bu taqqoslash cheksiz va tengsiz: sen oʻz kundalik hayotingni boshqalarning bayramlari bilan solishtirasan.\n\nLayklar orqali ommaviy baholash. Oʻsmirning oʻziga bahosi — yoshi tufayli shundoq ham beqaror — ekrandagi songa tom maʼnoda bogʻlanib qoladi. Surat eʼlon qilding va kam layk olding — bu sen yetarlicha mashhur emasliging, yetarlicha chiroyli emasliging, yetarlicha qiziq emasliging haqidagi ommaviy dalil. Bu real vaqtdagi, hammaga koʻrinadigan ijtimoiy rad etilish.\n\nJonli muloqotni raqamli muloqot bilan almashtirish. Jonli muloqot — noqulayligi, pauzalari, emotsiyalarni oʻqish zarurati bilan — emotsional intellektni rivojlantiradi. Matnli oʻzaro taʼsirlar uni rivojlantirmaydi. Uchrashuvlar oʻrniga telefon bilan ulgʻaygan avlod kattalar hayotiga haqiqiy muloqot koʻnikmalari tanqisligi bilan kiradi — va bu ijtimoiy vaziyatlardagi xavotirni faqat kuchaytiradi.\n\nKecha-kunduz mavjudlik. Smartfonlargacha bolalarda boshpana bor edi: maktabdagi tahqirlash kechki oltida, uyga kelganingda tugardi. Endi unday emas. Choʻntakdagi telefon kamsitish, chetlatish, bulling kuniga 24 soat, haftasiga yetti kun mavjudligini anglatadi. Yashirinadigan joy yoʻq.\n\nAdam Alter «Irresistible»da qoʻshimcha qiladi: bu shunchaki psixologik zarar emas. Klinik mezonlarga koʻra, oʻsmirlar bilan sodir boʻlayotgan narsa — telefonga majburiy qaytish, vaqt ustidan nazoratni yoʻqotish, anglangan zararga qaramay davom ettirish — xulq-atvor qaramligi taʼrifiga mos keladi. Biz bolalarga addiktiv qurilma berdik va natijalarga hayron boʻlyapmiz.\n\n> Haidt oʻnlab mamlakatlardan maʼlumot toʻpladi: 2012-yildan beri oʻsmirlar orasidagi xavotir va depressiya epidemiyasi smartfonlar va Instagram'ning ommaviy tarqalishi bilan vaqt jihatidan mos keladi. Bu tasodif emas.\n\nBiz bolalar ustida keng koʻlamli ijtimoiy eksperiment oʻtkazdik — ularning roziligisiz va oqibatlarini tushunmasdan. Bu eksperiment natijalari hozir butun dunyodagi psixiatriya shifoxonalari statistikasida koʻrinib turibdi.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["psixologiya", "ruhiy salomatlik", "ijtimoiy graf", "media"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "kotler", "sceneIndex": 4, "type": "media", "shortTitle": "Kotler 4.0/5.0", "era": "2016→2021", "lensWeight": {"chronology": 3, "psychology": 3, "bonds": 2, "health": 1, "reality": 3}, "title": "Kotler 4.0 va 5.0: ijtimoiy tarmoqlar davridagi marketing", "insight": "Kotler 4.0 qayd etdi: ishonch brendlardan odamlarga oʻtdi. Kotler 5.0 bitta insongacha shaxsiylashtirishni tasvirladi — bu vosita gʻamxoʻrlik sifatida ham, manipulyatsiya sifatida ham bir xil ishlaydi.", "thesis": "Kotler 4.0 qayd etdi: ishonch brendlardan odamlarga oʻtdi. Kotler 5.0 bitta insongacha shaxsiylashtirishni tasvirladi — bu vosita gʻamxoʻrlik sifatida ham, manipulyatsiya sifatida ham bir xil ishlaydi.", "body": "## Ishonch brendlardan odamlarga oʻtganda\n\nPhilip Kotler «Marketing 3.0»da toʻxtab qolmadi. Ijtimoiy tarmoqlar oʻyin qoidalarini shunchalik fundamental oʻzgartirdiki, hammasini qayta oʻylashga toʻgʻri keldi — ikki marta.\n\n«Marketing 4.0»da (2016) Kotler ijtimoiy tarmoqlar brend va xaridor munosabatlarida yaratgan transformatsiyani qayd etdi. Marketing 3.0 shuni ochdi: odamlar tovarlarni emas, qadriyatlarni sotib oladi. Marketing 4.0 qoʻshdi: ijtimoiy tarmoqlar davrida xaridor yoʻli chiziqli emas va kollektiv boʻlib qoldi.\n\nAvval xaridor yoʻli oldindan aytish mumkin edi: reklamani koʻrdi → qiziqdi → doʻkonga keldi → sotib oldi. Brend har bir qadamni nazorat qilardi. Endi odam Instagram'da boshqa xaridorning postini koʻradi → marketplace'da notanishlarning sharhlarini oʻqiydi → YouTube'da bloger sharhini koʻradi → izohlarda muhokama qiladi → faqat shundan keyin, balki, sotib oladi. Har bir qadamda brend suhbatni nazorat qilmaydi. Suhbatni boshqa odamlar olib boradi.\n\nBu hammasini oʻzgartirdi. Yuz ming obunachidan iborat samimiy auditoriyaga ega influenser million dollarlik televizion rolikdan samaraliroq boʻlib chiqadi. Qamrovi kattaroq boʻlgani uchun emas, tinglovchilari unga ishongani uchun. Ishonch brendlardan odamlarga oʻtdi. Bu ortga qaytmaydigan siljish.\n\nKotler xaridor yoʻlining yangi modelini tasvirlaydi: Aware → Appeal → Ask → Act → Advocate. Sen mahsulot haqida bilasan (Aware), u seni jalb qiladi (Appeal), boshqalarning fikrini soʻraysan (Ask), sotib olasan (Act) — va agar mamnun boʻlsang, uning elchisiga aylanasan (Advocate). Advocate siklni yopadi: u keyingi xaridor yoʻlini boshlaydigan kontent yaratadi. Mijoz marketing mashinasining bir qismiga aylandi.\n\n## Marketing 5.0: har bir inson bilan yakkama-yakka\n\n«Marketing 5.0»da (2021) Kotler keyingi darajani tasvirladi: texnologiyalar — AI, katta maʼlumotlar, avtomatlashtirish — kommunikatsiyani real vaqtda bitta inson darajasigacha shaxsiylashtirish imkonini beradi.\n\nAvval targeting shunday koʻrinardi: «Sportga qiziqadigan 25–35 yoshli erkaklar uchun reklama». Qoʻpol, noaniq, samarasiz. Zamonaviy marketing 5.0 boshqacha ishlaydi: «Bu xabar 28 yoshli Ivan uchun: u YouTube'da uch marta krossovka sharhlarini koʻrgan, oʻtgan juma kuni Google'da chegirmalarni qidirgan, Instagram'dagi doʻstlari esa yaqinda yugurishdan suratlar joylagan. U dushanba kuni ertalab 7:30 da ishga ketayotganida unga shu taklifni koʻrsat».\n\nKotler bunda imkoniyat koʻrdi: texnologiyalar nihoyat odamlarga chinakam xizmat qilishi mumkin. Har kimga aynan unga kerak narsani, kerak paytda berish. Shaxsiylashtirish — gʻamxoʻrlik sifatida.\n\nAmmo shu tavsifning oʻzi — verguligacha — maksimal aniq manipulyatsiya vositasining ham tavsifidir. Farq faqat uni ishlatayotgan odamning niyatida. Bir xil vosita insonga kerakli mahsulotni topishga yordam berishi yoki unda avval boʻlmagan ehtiyojni sezdirmay shakllantirishi mumkin.\n\nVa shu yerda Kotler qoʻyadigan, ammo toʻliq javob bermaydigan savol paydo boʻladi: bu shaxsiylashtirish kimning manfaatlariga xizmat qilishini kim nazorat qiladi? Xaridor manfaatlariga — yoki sotuvchining manfaatlariga?\n\n> Kotler qayd etdi: marketing 4.0 ijtimoiy tarmoqlar orqali hokimiyatni odamlarga berdi. Marketing 5.0 uni AI orqali qaytarishga urindi. Savol shunda: bu vosita kimning manfaatlariga xizmat qiladi.\n\nBu ziddiyat — texnologiya gʻamxoʻrlik vositasi sifatida va texnologiya manipulyatsiya vositasi sifatida — raqamli davrning butun tarixi boʻylab oʻtadi. Web3 aynan shuni hal qilishga urinadi: markazsizlashtirish orqali, maʼlumotlarga egalik orqali, algoritmlar shaffofligi orqali.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["marketing", "ijtimoiy graf", "platformalar", "psixologiya"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "sunstein", "sceneIndex": 5, "type": "power", "shortTitle": "Sunstein", "era": "2001→2017", "lensWeight": {"chronology": 3, "psychology": 2, "bonds": 2, "health": 2, "reality": 5}, "title": "Sunstein: aks-sado kameralari va umumiy reallikning tugashi", "insight": "Sunstein ko'rsatdi: ijtimoiy tarmoqlar algoritmlari tushunishga emas, jalb etishga optimallashtirilgan - va bu demokratiya usiz mumkin bo'lmagan umumiy axborot makonini tizimli ravishda buzadi.", "thesis": "Sunstein ko'rsatdi: ijtimoiy tarmoqlar algoritmlari tushunishga emas, jalb etishga optimallashtirilgan - va bu demokratiya usiz mumkin bo'lmagan umumiy axborot makonini tizimli ravishda buzadi.", "body": "## Siyosiy emas, arxitekturaviy muammo\n\nCass Sunstein - Harvard huquqshunosi va xulq-atvor iqtisodiyoti mutaxassisi. \"#Republic\" kitobida u siyosiydek ko'rinadigan, aslida esa arxitekturaviy bo'lgan savolni qo'ydi: har bir fuqaro o'z axborot pufagi ichida yashasa, demokratiya bilan nima bo'ladi?\n\nDemokratiya umumiylikning muayyan minimumini nazarda tutadi. Fuqarolar qadriyatlar, ustuvorliklar va siyosiy qarashlarda kelishmasligi mumkin - bu normal va hatto foydali. Ammo ular bazaviy reallik borasida kelishishi kerak. Mana bu voqea yuz berdi. Mana bu ma'lumotlar. Mana bu faktlar. Faqat umumiy faktik asos bo'lgandagina u bilan nima qilish haqida bahslashish mumkin.\n\nIjtimoiy tarmoqlar algoritmlari shu umumiy makonni buzadi. Ular jalb etishga - sen ilovada imkon qadar uzoq qolishingga optimallashtirilgan. Diqqatni eng yaxshi nima ushlab turadi? Kuchli emotsiya uyg'otadigan kontent: g'azab, qo'rquv, zavq, norozilik. Allaqachon mavjud e'tiqodlarni tasdiqlaydigan kontent. Allaqachon mavjud emotsiyalarni kuchaytiradigan kontent.\n\nNatijada algoritm har kimga uning shaxsiy realligini ko'rsatadi. Kimdir buni yomon niyat bilan shunday hal qilgani uchun emas. Shunchaki bu jalb etishni maksimal qiladi.\n\n## Aks-sado kameralari: faqat o'z aks-sadoingni eshitganingda\n\nSunstein buni \"aks-sado kameralari\" deb ataydi. Sen hamma taxminan o'zing allaqachon o'ylayotgan narsani aytadigan axborot makoniga tushasan. E'tiqodlaring faqat kuchayadi - chunki sen cheksiz tasdiqlarni ko'rasan. E'tirozlar va muqobil nuqtai nazarlar deyarli yo'q - algoritm ularni filtrlab tashlaydi, chunki ular jalb etishni pasaytiradi.\n\nBu shunchaki yoqimsiz emas. Bu hukm chiqarish qobiliyati uchun yemiruvchidir. Faqat o'z aks-sadoingni eshitganingda, boshqa odamlar reallikning boshqa manzarasiga ega bo'lishi mumkinligini tushunmay qo'yasan. O'z versiyangni yagona mumkin bo'lgan versiya sifatida qabul qila boshlaysan. Boshqa qarashdagi odamlarni esa yomon niyatli, ahmoq yoki tarafkash deb ko'rasan.\n\nSo'nggi yillardagi AQSH, Yevropa va boshqa mintaqalardagi siyosiy qutblanish tasodif emas va shunchaki iqtisodiy muammolar natijasi ham emas. Bu tushunishga emas, jalb etishga optimallashtirilgan arxitekturaning oldindan kutiladigan oqibati. Algoritm qutblanishni yaratmadi. Ammo uni kengaytirdi va tezlashtirdi.\n\nSunstein bir o'xshatish taklif qiladi: barcha restoranlari sen ilgari yegan narsani beradigan avtomatlar bilan almashtirilgan shaharni tasavvur qil. Yangi ta'mlar yo'q. Kutilmagan kashfiyotlar yo'q. Faqat allaqachon shakllangan afzalliklarni tasdiqlash bor. Bu qulaydek tuyuladi - lekin aslida dunyoni toraytiradi.\n\n> Sunstein ko'rsatdi: algoritm yovuz emas - u shunchaki jalb etishga optimallashtirilgan. Ammo bu demokratiya usiz mumkin bo'lmagan umumiy axborot makonini buzadi.\n\nBu muammo platformalarni tartibga solish yoki jarimalar bilan hal bo'lmaydi. U biznes-model arxitekturasiga kiritilgan: platforma jalb etishdan pul topadi, jalb etish emotsional kontent orqali maksimal qilinadi, emotsional kontent esa qutblantiradi. Buni faqat biznes-modelning o'zini o'zgartirib - yoki muqobil arxitektura yaratib o'zgartirish mumkin.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["algoritmlar", "demokratiya", "ijtimoiy graf", "media"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "baudrillard", "sceneIndex": 6, "type": "privacy", "shortTitle": "Baudrillard", "era": "1981", "lensWeight": {"chronology": 2, "psychology": 2, "bonds": 2, "health": 3, "reality": 5}, "title": "Baudrillard va simulyakr: hayot kontent sifatida", "insight": "Baudrillard 1981 yilda simulyakrni - reallikni almashtiradigan obrazni tasvirlagan. Instagram-da bu tom ma'noda ro'y berdi: odamlar hayotni boshdan kechirish o'rniga hayot haqida kontent ishlab chiqaradi.", "thesis": "Baudrillard 1981 yilda simulyakrni - reallikni almashtiradigan obrazni tasvirlagan. Instagram-da bu tom ma'noda ro'y berdi: odamlar hayotni boshdan kechirish o'rniga hayot haqida kontent ishlab chiqaradi.", "body": "## 1981 yilda Instagram-ni tasvirlagan faylasuf\n\nJean Baudrillard - fransuz faylasufi va sotsiologi. 1981 yilda u \"Simulacra and Simulation\" kitobini nashr qildi. Bu zamonaviy jamiyatda obraz va reallik tabiati haqidagi abstrakt falsafiy ish edi. O'shanda Instagram mavjud emas edi. TikTok mavjud emas edi. Hatto internet ham harbiylar va olimlar sohasi edi.\n\nAmmo Baudrillard-ni hozir o'qisang, u 2024 yildan reportaj yozgandek tuyuladi.\n\nUning markaziy g'oyasi: zamonaviy dunyoda obraz endi reallikni aks ettirmaydi - uni almashtiradi. Baudrillard obrazning to'rt bosqichini tasvirlagan. Avval obraz reallikni aks ettiradi: fotosurat joy qanday ko'rinishini ko'rsatadi. Keyin obraz reallikni niqoblaydi: reklama mahsulotning ideallashtirilgan versiyasini ko'rsatadi. Keyin obraz reallikning yo'qligini niqoblaydi: obraz unga mos realliksiz mavjud bo'ladi. Va nihoyat - simulyakr: obrazning reallikka hech qanday aloqasi yo'q, u o'zi reallikka aylangan.\n\nSimulyakr - originalsiz nusxa. Haqiqiy hech narsani aks ettirmaydigan, ammo reallikning o'zidan ham haqiqiyroq qabul qilinadigan obraz.\n\n## Instagram giperealligi\n\nInstagram-da nima bo'layotganiga Baudrillard nigohi orqali qara.\n\nOdam sayohatga boradi. Ilgari u joyni boshdan kechirardi: hidlar, tovushlar, harorat, tasodifiy uchrashuvlar. Hozir esa u joyni suratga oladi. U quyosh botishini boshdan kechirmaydi - stories uchun quyosh botishini videoga oladi. Ovqatdan zavqlanmaydi - yeyishni boshlashdan oldin taomni suratga oladi. Emotsiyani boshdan kechirmaydi - u lentada qanday ko'rinishi haqida o'ylaydi.\n\nSimulyatsiya tajribadan muhimroq bo'lib qoladi. Obraz reallikdan muhimroq. Va asta-sekin odamlar boshdan kechirish uchun emas, balki boshdan kechirish haqida kontent ishlab chiqarish uchun yashay boshlaydi.\n\nBaudrillard buni \"gipereallik\" deb atagan bo'lardi: simulyatsiya reallikning o'zidan ham realroq bo'lib qoladigan holat. Instagram-dagi hayotning filtrlangan versiyasi nomukammalligi va oddiyligi bor real hayotdan ham \"haqiqiyroq\" bo'lib qoladi.\n\nZygmunt Bauman \"Liquid Modernity\" asarida bunga identiklik o'lchamini qo'shadi: zamonaviy dunyoda identiklik barqaror bo'lmay qoldi. Sen shunchaki tug'ilib o'sgan odaming emassan. Sen doimiy ravishda o'zingni yangidan qurib borasan. Ijtimoiy tarmoqlar bu qurilishning asosiy maydoniga - va uning asosiy kuchaytirgichiga aylandi. LinkedIn va Instagram-da, Twitter va TikTok-da turlicha bo'lishing mumkin. Erkinlik - lekin yangi turdagi xavotir ham: performans qayerda tugaydi va haqiqiy men qayerda boshlanadi?\n\nBu shunchaki falsafiy abstraksiya emas. Bu psixologlar qayd etayotgan aniq psixologik holat - \"onlayn dissotsiatsiya\" - tasviri: go'yo haqiqatan yashamay, auditoriya uchun o'zingning bir versiyangni ijro etayotgandek hissiyot.\n\n> Baudrillard 1981 yilda biz hozir Instagram deb ataydigan narsani tasvirlagan: obraz tajribadan muhimroq, simulyatsi
