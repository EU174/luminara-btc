rom": "chronicle", "to": "kotler", "label": "trust shifted to people", "lenses": ["media", "chronology"]}, {"from": "kotler", "to": "sunstein", "label": "personalization fragments reality", "lenses": ["reality", "psychology"]}, {"from": "sunstein", "to": "baudrillard", "label": "the echo chamber produces a simulacrum", "lenses": ["reality"]}, {"from": "haidt", "to": "baudrillard", "label": "life is replaced by content", "lenses": ["health", "reality"]}, {"from": "skinner", "to": "sunstein", "label": "engagement matters more than understanding", "lenses": ["psychology", "reality"]}]}, "uk": {"chapter": {"key": "social", "title": "Соцмережі", "lede": "Як звʼязки стали продуктом, а ти — сировиною. Механіка залежності, самотності й симулякра.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=social", "centralIdea": "Звʼязки стали продуктом, а ти — сировиною", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Хронологія", "accent": "#7dd3fc", "description": "Від Friendster до TikTok: як соцмережі захопили кожен шар життя."}, {"id": "psychology", "label": "Психологія", "accent": "#f87171", "description": "Скіннер і змінне підкріплення: лайк працює як ігровий автомат."}, {"id": "bonds", "label": "Звʼязки", "accent": "#c084fc", "description": "Данбар: мозок створений для 150 стосунків, а не для тисячі «друзів»."}, {"id": "health", "label": "Здоровʼя", "accent": "#34d399", "description": "Хайдт: тривожне покоління — зростання тривоги й депресії з 2012 року."}, {"id": "reality", "label": "Реальність", "accent": "#fbbf24", "description": "Санстейн і Бодрійяр: ехо-камери й життя, замінене контентом."}], "nodes": [{"id": "skinner", "sceneIndex": 0, "type": "power", "shortTitle": "Скіннер", "era": "1938→", "lensWeight": {"chronology": 2, "psychology": 5, "bonds": 1, "health": 3, "reality": 1}, "title": "Скіннер і лайк: механіка залежності", "insight": "Скіннер відкрив змінне підкріплення у 1938-му. Соцмережі вбудували його в кожен застосунок — лайк працює точно так само, як ігровий автомат.", "thesis": "Скіннер відкрив змінне підкріплення у 1938-му. Соцмережі вбудували його в кожен застосунок — лайк працює точно так само, як ігровий автомат.", "body": "## Щур у ящику і ти з телефоном\n\nУ 1938 році американський психолог Б. Ф. Скіннер провів серію експериментів, які стали одними з найважливіших в історії науки про поведінку. Він саджав щурів у спеціальні ящики й спостерігав, як вони вчаться натискати на важіль залежно від того, яку винагороду отримують.\n\nПерший варіант: натиснув на важіль — отримав їжу. Завжди. Передбачувано. Щур швидко навчився натискати — і натискав саме тоді, коли був голодний. Жодної навʼязливості, жодної залежності.\n\nДругий варіант: натиснув на важіль — іноді отримуєш їжу, іноді ні. Випадково. Непередбачувано. І ось тут сталося дещо вражаюче: щур починав натискати на важіль одержимо. Знову і знову. Навіть коли не був голодний. Навіть коли їжа довго не зʼявлялася — щур не припиняв. Скіннер назвав це «переривчастим графіком підкріплення» і назвав його найпотужнішим механізмом формування поведінки, який він будь-коли спостерігав.\n\nТепер заміни щура на себе. Важіль — на кнопку «оновити стрічку». Їжу — на лайк, цікавий пост, повідомлення від друга. Ти відкриваєш Instagram — і іноді там щось цікаве, іноді нудне, іноді лайк від когось важливого, іноді нічого. Ти не знаєш заздалегідь. Саме ця непередбачуваність і тримає тебе.\n\n## Нір Еяль систематизував це в підручник\n\nНір Еяль у 2014 році написав книжку «Hooked» — і був цілком відвертий у своїх намірах. Це посібник для стартапів: як створювати продукти, до яких люди повертаються без нагадування і без зовнішнього стимулу.\n\nМодель Еяля називається «гачок» — чотири кроки, що повторюються знову і знову. Тригер: зовнішній (сповіщення, лист) або внутрішній (нудьга, тривога, самотність) — запускає дію. Дія: відкрити застосунок, прокрутити стрічку, опублікувати фото — мінімальне зусилля, максимальна простота. Змінна винагорода: іноді цікаво, іноді ні, іноді лайк, іноді тиша — непередбачуваність Скіннера в дії. Інвестиція: ти додаєш контент, позначаєш людей, налаштовуєш профіль — і тим самим робиш продукт ціннішим для себе й важчим для відмови.\n\nЕяль написав це як підручник — відкрито й без вибачень. Інженери соцмереж вивчали цю модель. Дехто пізніше зізнавався, що відчував докори сумління, застосовуючи її. Один із колишніх віцепрезидентів Facebook Чамат Паліхапітія у 2017 році публічно сказав: «Ми створили інструменти, які розривають соціальну тканину суспільства». Його діти не користуються соцмережами.\n\nАдам Альтер у книжці «Irresistible» (2017) пішов далі й поставив жорстке питання: а це взагалі нормально — проєктувати продукти з використанням тих самих принципів, що лежать в основі залежності від ігрових автоматів? За клінічними критеріями — навʼязливе повернення, втрата контролю над часом, продовження попри усвідомлену шкоду, синдром відміни при відмові — те, що відбувається з багатьма користувачами соцмереж, відповідає визначенню поведінкової залежності.\n\n> Скіннер відкрив змінне підкріплення у 1938-му. Нір Еяль у 2014-му перетворив це на підручник для стартапів. Соцмережі вбудували це в архітектуру кожного застосунку.\n\nПаралельно з цим Малкольм Гладуелл у «The Tipping Point» описав механіку епідемічного поширення: у будь-якої епідемії є переломний момент, після якого поширення стає лавиноподібним. Facebook досяг цієї точки, коли став місцем, де «всі» — бо якщо там усі твої друзі, у тебе немає вибору, крім як теж бути там. Індивідуальна залежність плюс колективний соціальний тиск — ось чому соцмережі так важко покинути.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D %20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["соціальний граф", "психологія", "залежність", "платформи"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "chronicle", "sceneIndex": 1, "type": "media", "shortTitle": "Хроніка", "era": "2003→2020-ті", "lensWeight": {"chronology": 5, "psychology": 3, "bonds": 3, "health": 3, "reality": 2}, "title": "Хроніка соцмереж: від Friendster до TikTok", "insight": "За 20 років соцмережі послідовно захопили всі шари соціального життя. До 2020-х середня людина проводила в них понад дві години на день — більше за будь-яку іншу активність, крім сну й роботи.", "thesis": "За 20 років соцмережі послідовно захопили всі шари соціального життя. До 2020-х середня людина проводила в них понад дві години на день — більше за будь-яку іншу активність, крім сну й роботи.", "body": "## Двадцять років, які змінили соціальне життя\n\nЗа двадцять років — з 2002 по 2022 рік — соціальні мережі пройшли шлях від студентської забави до глобальної інфраструктури, якою користуються пʼять мільярдів людей. Кожна хвиля була швидшою за попередню. Кожна платформа захоплювала новий шар соціального життя.\n\nПершою масовою соціальною мережею в сучасному сенсі став Friendster — запущений у 2002 році в США. Ідея здавалася революційною: профіль, список друзів, можливість бачити друзів друзів. За три місяці — три мільйони користувачів. Це був вибух для свого часу. Але Friendster не витримав власного успіху: сервери падали, сторінки вантажилися по хвилині, користувачі йшли розчарованими. Технологія не встигла за попитом.\n\nУ 2003 році зʼявився MySpace — і швидко став найбільшою соціальною мережею світу. Його відмінність: максимальна свобода кастомізації. Кожен міг оформити профіль як завгодно — свої кольори, своя музика на фоні, своє оформлення. MySpace став домом для музикантів, художників, субкультур. У 2005 році медіамагнат Руперт Мердок купив його за 580 мільйонів доларів — на піку хайпу. Через пʼять років MySpace був мертвий. Його вбив Facebook — чистотою, простотою й алгоритмом.\n\nУ тому ж 2003-му LinkedIn тихо запустився для професійних звʼязків. Без яскравого дизайну, без розваг — тільки резюме й контакти. Здавалося, нудно. Але LinkedIn знайшов нішу й зайняв її назавжди: до 2023 року понад 900 мільйонів користувачів.\n\n## Facebook, Twitter, YouTube, Instagram\n\n2004 рік. Марк Цукерберг запускає TheFacebook.com із кімнати в гарвардському гуртожитку. За тиждень — половина студентів Гарварду зареєстровані. Механіка геніальна: справжні імена, справжні фотографії, справжні звʼязки. Жодних псевдонімів. Це не анонімний простір — це цифрове відображення реального соціального життя.\n\nДо 2012 року — мільярд користувачів. Кнопка «Увійти через Facebook» зʼявилася на мільйонах сайтів. Вийти з Facebook стало означати випасти із соціального життя.\n\n2005 рік. Троє колишніх співробітників PayPal створюють YouTube. Перше відео — вісімнадцять секунд у зоопарку. Через рік Google купує його за 1,65 мільярда доларів — тоді це здавалося безумством. YouTube зламав монополію телебачення: будь-яка людина з камерою може мовити на глобальну аудиторію. До 2023 року — 500 годин відео завантажуються щохвилини.\n\n2006 рік. Джек Дорсі публікує перший твіт. Twitter перетворився на глобальну площу реального часу — журналісти, політики, науковці говорили напряму з аудиторією без редакторів. Арабська весна організовувалася через Twitter. Землетруси спочатку зʼявлялися там — і лише потім у новинах.\n\n2010 рік. Instagram — квадратні фото, фільтри, жодного тексту. Facebook купує його у 2012 році за мільярд. Instagram змінив візуальну культуру: ресторани проєктували інтерʼєри «для Instagram», туристичні місця оцінювалися за «інстаграмністю».\n\n## ВКонтакте, Telegram і TikTok\n\n2006 рік. Павло Дуров запускає ВКонтакте для студентів Петербурзького університету. Для десятків мільйонів людей у Росії, Україні та пострадянських країнах ВКонтакте став першим інтернетом — місцем, де формувалися цифрові звички цілого покоління. Історія Дурова з ВКонтакте закінчилася конфліктом із державою у 2014 році. Він поїхав — і створив Telegram. Про нього ми поговоримо в наступних главах.\n\n2016 рік у Китаї, 2018-й — глобальний запуск TikTok. Це радикальний зсув: головна стрічка — «For You Page» — показує тобі відео зовсім незнайомих людей, відібрані алгоритмом на основі твоєї поведінки. Ти не обираєш, що дивитися — алгоритм вирішує. Середній час у TikTok — понад 90 хвилин на день. TikTok поставив питання, яке раніше не звучало так гостро: що відбувається, коли алгоритм, який формує реальність мільярдів, належить компанії в юрисдикції іншої держави?\n\n> За двадцять років соцмережі послідовно захопили всі шари соціального життя: професійні звʼязки, дружбу, публічний дискурс, відео, візуальну ідентичність, розваги. До середини 2020-х середня людина проводила в них понад дві години на день.\n\nЦе більше, ніж будь-яка інша активність у житті людини — крім сну й роботи. Жодна технологія в історії не займала стільки часу у такої кількості людей.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["соціальний граф", "історія", "платформи", "Telegram"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "dunbar", "sceneIndex": 2, "type": "privacy", "shortTitle": "Данбар", "era": "1992", "lensWeight": {"chronology": 2, "psychology": 2, "bonds": 5, "health": 3, "reality": 1}, "title": "Данбар: тисяча друзів проти ста п'ятдесяти", "insight": "Данбар довів: мозок створений для 150 стосунків. Тисяча «друзів» у соцмережах не розширює цю межу — вона робить кожен контакт поверховим і посилює самотність.", "thesis": "Данбар довів: мозок створений для 150 стосунків. Тисяча «друзів» у соцмережах не розширює цю межу — вона робить кожен контакт поверховим і посилює самотність.", "body": "## Число, яке не змінилося за мільйон років\n\nУ 1992 році британський антрополог Робін Данбар опублікував дослідження, яке стало одним із найцитованіших в антропології. Він вивчав розмір неокортексу — частини мозку, що відповідає за соціальне пізнання, — у різних видів приматів. І виявив чітку кореляцію: що більший неокортекс відносно розміру мозку, то більшими соціальними групами живе вид.\n\nДля людини Данбар обчислив це число: близько 150. Саме стільки стабільних соціальних стосунків людський мозок здатен підтримувати одночасно. Не просто «знайомих», а людей, чию життєву ситуацію ти відстежуєш, із ким у тебе є історія, кому ти довіряєш на певному рівні.\n\nЦе число — 150 — називають «числом Данбара». Воно відтворюється в найрізноманітніших контекстах. Розмір ефективних військових підрозділів протягом історії — близько 150 людей. Розмір традиційних селищ мисливців-збирачів — близько 150 людей. Розмір згуртованих релігійних громад — близько 150 людей. Не тому, що хтось так вирішив. Просто тому, що це межа того, що наш мозок здатен обробити.\n\n## Що відбувається з мозком за тисячі «друзів»\n\nТепер подивися на свій Facebook або Instagram. Скільки в тебе «друзів» чи підписників? Сотні? Тисячі? Соцмережі дали нам можливість підтримувати зв'язки з кількістю людей, що у п'ять-двадцять разів перевищує нашу когнітивну межу.\n\nНаш мозок не змінився. Еволюція не встигла за технологіями. Що відбувається, коли людина намагається керувати соціальним життям, яке вдесятеро перевищує її когнітивні можливості? Вона починає спрощувати. Реагувати швидко, поверхово, емоційно. Лайк замість розмови. Реакція замість розуміння. Публічний коментар замість особистого повідомлення.\n\nЦе не лінь і не деградація. Це нейробіологічне перевантаження. Мозок робить єдине, що може: спрощує сигнали до мінімуму. Замість складної емоційної взаємодії — натиснути сердечко. Замість щирої розмови — написати «вітаю!» під фотографією.\n\nТому тисяча друзів у соцмережах не робить нас щасливішими чи менш самотніми. Дослідження — зокрема роботи, на які посилається Гайдт, — показують протилежне: зростання кількості онлайн-«зв'язків» корелює зі зростанням відчуття самотності. Бо мозок не може відрізнити поверховий онлайн-контакт від справжнього зв'язку — він просто перевантажується й емоційно вимикається.\n\nДодай до цього те, що Ґладвелл описав у «The Tipping Point»: після того як платформа досягає критичної маси, присутність у ній стає соціальною необхідністю. Ти не обираєш бути у Facebook через якість взаємодії. Ти там, бо там усі. А отже, приречений нескінченно скролити стрічку людей, із якими в тебе є «зв'язок» без реального зв'язку.\n\n> Данбар показав: наш мозок створений для 150 стосунків. Соцмережі дали нам тисячі — і зробили кожен із них поверховим. Більше зв'язків не означає менше самотності.\n\nЦе пояснює один із головних парадоксів епохи соцмереж: ми ніколи не були настільки «зв'язані» — і ніколи не почувалися настільки самотніми. Епідемія самотності, яку психологи фіксують у всьому світі з початку 2010-х, збігається в часі з масовим поширенням смартфонів і соцмереж. Це не випадковість.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["психологія", "соціальний граф", "нейронаука", "спільнота"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "haidt", "sceneIndex": 3, "type": "power", "shortTitle": "Хайдт", "era": "2012→", "lensWeight": {"chronology": 4, "psychology": 4, "bonds": 3, "health": 5, "reality": 2}, "title": "Гайдт: тривожне покоління", "insight": "Гайдт зібрав дані з десятків країн: з 2012 року — різке зростання тривожності й депресії серед підлітків. Це збігається з масовим поширенням смартфонів та Instagram.", "thesis": "Гайдт зібрав дані з десятків країн: з 2012 року — різке зростання тривожності й депресії серед підлітків. Це збігається з масовим поширенням смартфонів та Instagram.", "body": "## Дані, які змінили розмову\n\nДжонатан Гайдт — соціальний психолог із Нью-Йоркського університету. У 2024 році він опублікував книжку «The Anxious Generation» — «Тривожне покоління». Це не паніка дорослих через нові технології. Це багаторічне систематичне дослідження даних, яке дійшло висновку, що його важко заперечити.\n\nПриблизно з 2012 року — коли смартфони стали справді масовими, а Instagram набрав критичну аудиторію — рівень депресії, тривожності та самоушкоджень серед підлітків почав зростати в усіх західних країнах одночасно. Гайдт зібрав дані зі США, Великої Британії, Канади, Австралії, Нової Зеландії, Скандинавії. Усюди одна й та сама крива — різкий перелом приблизно у 2012–2013 роках.\n\nНе в одній країні — в усіх. Не у хлопців — особливо у дівчат. Не поступово — різко, як перелом на графіку. Збіг у часі з масовим поширенням смартфонів і соцмереж надто точний, щоб бути випадковим.\n\n## Механізми: як це працює\n\nГайдт описує кілька конкретних механізмів, через які соцмережі впливають на психологічне здоров'я підлітків.\n\nПостійне соціальне порівняння. В Instagram люди публікують найкращі моменти свого життя — відфільтровані, відредаговані, ретельно відібрані. Підліток бачить стрічку, що складається з ідеальних тіл, ідеальних відпусток, ідеальних стосунків. Його власне життя, побачене зсередини з його нудними буднями й невпевненістю, виглядає жалюгідно на цьому тлі. Це порівняння нескінченне й нерівне: ти порівнюєш свої будні з чужими святами.\n\nПублічна оцінка через лайки. Самооцінка підлітка — і без того нестабільна через вік — виявляється буквально прив'язаною до числа на екрані. Опублікував фото й отримав мало лайків — це публічне свідчення того, що ти недостатньо популярний, недостатньо красивий, недостатньо цікавий. Це соціальне відкидання в реальному часі, доступне для всіх.\n\nЗаміна живого спілкування цифровим. Живе спілкування — з його незручністю, паузами, необхідністю читати емоції — розвиває емоційний інтелект. Текстові взаємодії його не розвивають. Покоління, яке виросло з телефоном замість зустрічей, входить у доросле життя з дефіцитом навичок реального спілкування — і це лише посилює тривогу в соціальних ситуаціях.\n\nЦілодобова доступність. До смартфонів у дітей був прихисток: шкільне цькування закінчувалося о шостій вечора, коли ти приходив додому. Тепер ні. Телефон у кишені означає, що приниження, виключення, цькування доступні 24 години на добу, сім днів на тиждень. Немає місця, де можна сховатися.\n\nАдам Альтер в «Irresistible» додає: це не просто психологічна шкода. За клінічними критеріями те, що відбувається з підлітками — нав'язливе повернення до телефона, втрата контролю над часом, продовження попри усвідомлену шкоду, — відповідає визначенню поведінкової залежності. Ми дали дітям адиктивний пристрій і дивуємося результатам.\n\n> Гайдт зібрав дані з десятків країн: з 2012 року епідемія тривожності й депресії серед підлітків збігається в часі з масовим поширенням смартфонів та Instagram. Це не випадковість.\n\nМи провели масштабний соціальний експеримент над дітьми — без їхньої згоди й без розуміння наслідків. Результати цього експерименту зараз видно у статистиці психіатричних лікарень по всьому світу.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["психологія", "ментальне здоровʼя", "соціальний граф", "медіа"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "kotler", "sceneIndex": 4, "type": "media", "shortTitle": "Котлер 4.0/5.0", "era": "2016→2021", "lensWeight": {"chronology": 3, "psychology": 3, "bonds": 2, "health": 1, "reality": 3}, "title": "Котлер 4.0 і 5.0: маркетинг в епоху соцмереж", "insight": "Котлер 4.0 зафіксував: довіра перейшла від брендів до людей. Котлер 5.0 описав персоналізацію до однієї людини — інструмент, який однаково працює і як турбота, і як маніпуляція.", "thesis": "Котлер 4.0 зафіксував: довіра перейшла від брендів до людей. Котлер 5.0 описав персоналізацію до однієї людини — інструмент, який однаково працює і як турбота, і як маніпуляція.", "body": "## Коли довіра перейшла від брендів до людей\n\nФіліп Котлер не зупинився на «Маркетингу 3.0». Соцмережі змінили правила гри настільки фундаментально, що знадобилося переосмислення заново — двічі.\n\nУ «Маркетингу 4.0» (2016) Котлер зафіксував трансформацію, яку соцмережі спричинили у відносинах бренда й покупця. Маркетинг 3.0 відкрив: люди купують цінності, а не товари. Маркетинг 4.0 додав: в епоху соцмереж шлях покупця став нелінійним і колективним.\n\nРаніше шлях покупця був передбачуваним: побачив рекламу → зацікавився → прийшов у магазин → купив. Бренд контролював кожен крок. Тепер людина бачить пост іншого покупця в Instagram → читає відгуки незнайомців на маркетплейсі → дивиться огляд блогера на YouTube → обговорює в коментарях → лише потім, можливо, купує. На кожному кроці бренд не контролює розмову. Розмову ведуть інші люди.\n\nЦе змінило все. Інфлюенсер зі щирою аудиторією у сто тисяч підписників виявляється ефективнішим за телевізійний ролик за мільйон доларів. Не тому, що в нього більше охоплення, а тому, що його слухачі йому довіряють. Довіра перейшла від брендів до людей. Це незворотний зсув.\n\nКотлер описує нову модель шляху покупця: Aware → Appeal → Ask → Act → Advocate. Ти дізнаєшся про продукт (Aware), він тебе приваблює (Appeal), ти питаєш думку інших (Ask), купуєш (Act) — і якщо задоволений, стаєш його амбасадором (Advocate). Advocate замикає цикл: він створює контент, який запускає шлях для наступного покупця. Клієнт став частиною маркетингової машини.\n\n## Маркетинг 5.0: один на один із кожним\n\nУ «Маркетингу 5.0» (2021) Котлер описав наступний рівень: технології — AI, великі дані, автоматизація — дають змогу персоналізувати комунікацію до рівня однієї людини в реальному часі.\n\nРаніше таргетинг виглядав так: «Реклама для чоловіків 25–35 років з інтересом до спорту». Грубо, неточно, неефективно. Сучасний маркетинг 5.0 працює інакше: «Це повідомлення для Івана, 28 років, який тричі дивився огляди кросівок на YouTube, шукав знижки в Google минулої п'ятниці, і чиї друзі в Instagram нещодавно публікували фото з пробіжок. Покажи йому цю пропозицію о 7:30 ранку в понеділок, коли він їде на роботу».\n\nКотлер бачив у цьому можливість: технології нарешті можуть по-справжньому служити людям. Дати кожному саме те, що йому потрібно, коли йому потрібно. Персоналізація як турбота.\n\nАле цей самий опис — з точністю до коми — є інструментом максимально точної маніпуляції. Різниця лише в намірі того, хто ним користується. Один і той самий інструмент може допомогти людині знайти потрібний продукт — або непомітно сформувати в неї потребу, якої в неї не було.\n\nІ тут виникає питання, яке Котлер ставить, але не відповідає на нього повністю: хто контролює, в чиїх інтересах працює ця персоналізація? В інтересах покупця — чи в інтересах продавця?\n\n> Котлер зафіксував: маркетинг 4.0 віддав владу людям через соцмережі. Маркетинг 5.0 спробував повернути її через AI. Питання в тому, чиїм інтересам служить цей інструмент.\n\nЦя суперечність — між технологією як інструментом турботи й технологією як інструментом маніпуляції — проходить крізь усю історію цифрової епохи. І саме її намагається розв'язати Web3: через децентралізацію, через власність на дані, через прозорість алгоритмів.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["маркетинг", "соціальний граф", "платформи", "психологія"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "sunstein", "sceneIndex": 5, "type": "power", "shortTitle": "Санстейн", "era": "2001→2017", "lensWeight": {"chronology": 3, "psychology": 2, "bonds": 2, "health": 2, "reality": 5}, "title": "Санстейн: ехо-камери і кінець спільної реальності", "insight": "Санстейн показав: алгоритми соцмереж оптимізовані під залучення, а не під розуміння - і це системно руйнує спільний інформаційний простір, без якого демократія неможлива.", "thesis": "Санстейн показав: алгоритми соцмереж оптимізовані під залучення, а не під розуміння - і це системно руйнує спільний інформаційний простір, без якого демократія неможлива.", "body": "## Архітектурна проблема, а не політична\n\nКесс Санстейн - правознавець і фахівець із поведінкової економіки з Гарварду. У книжці \"#Republic\" він поставив питання, яке здається політичним, але насправді є архітектурним: що відбувається з демократією, коли кожен громадянин живе у власній інформаційній бульбашці?\n\nДемократія передбачає певний мінімум спільного. Громадяни можуть не погоджуватися в цінностях, пріоритетах і політичних поглядах - це нормально і навіть корисно. Але вони мають погоджуватися щодо базової реальності. Ось сталася ця подія. Ось ці дані. Ось ці факти. Лише маючи спільну фактичну базу, можна сперечатися про те, що з нею робити.\n\nАлгоритми соцмереж руйнують цей спільний простір. Вони оптимізовані під залучення - під те, щоб ти залишався в застосунку якомога довше. А що найкраще утримує увагу? Контент, який викликає сильну емоцію: обурення, страх, захват, негодування. Контент, який підтверджує вже наявні переконання. Контент, який посилює вже наявні емоції.\n\nУ результаті алгоритм показує кожному його персональну реальність. Не тому, що хтось так зловмисно вирішив. Просто тому, що це максимізує залучення.\n\n## Ехо-камери: коли ти чуєш тільки власне ехо\n\nСанстейн називає це \"ехо-камерами\". Ти потрапляєш в інформаційний простір, де всі говорять приблизно те саме, що ти вже думаєш. Твої переконання лише посилюються - бо ти бачиш нескінченну кількість підтверджень. Заперечень і альтернативних поглядів майже немає - алгоритм їх фільтрує, бо вони знижують залучення.\n\nЦе не просто неприємно. Це руйнівно для здатності судити. Коли ти чуєш тільки власне ехо - ти перестаєш розуміти, що інші люди можуть мати іншу картину реальності. Ти починаєш сприймати свою версію як єдино можливу. Людей з іншими поглядами - як зловмисних, дурних або упереджених.\n\nПолітична поляризація останніх років у США, Європі та інших регіонах - це не випадковість і не просто результат економічних проблем. Це передбачуваний наслідок архітектури, оптимізованої під залучення, а не під розуміння. Алгоритм не створив поляризацію. Але він її масштабував і прискорив.\n\nСанстейн пропонує аналогію: уяви місто, де всі ресторани замінені автоматами, які дають тобі те, що ти вже їв раніше. Жодних нових смаків. Жодних несподіваних відкриттів. Лише підтвердження вже сформованих уподобань. Це здається зручним - але насправді звужує світ.\n\n> Санстейн показав: алгоритм не злий - він просто оптимізований під залучення. Але це руйнує спільний інформаційний простір, без якого демократія неможлива.\n\nЦя проблема не розв'язується регулюванням або штрафами для платформ. Вона вбудована в архітектуру бізнес-моделі: платформа заробляє на залученні, залучення максимізується через емоційний контент, емоційний контент поляризує. Змінити це можна лише змінивши саму бізнес-модель - або створивши альтернативну архітектуру.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www. %BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["алгоритми", "демократія", "соціальний граф", "медіа"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "baudrillard", "sceneIndex": 6, "type": "privacy", "shortTitle": "Бодрійяр", "era": "1981", "lensWeight": {"chronology": 2, "psychology": 2, "bonds": 2, "health": 3, "reality": 5}, "title": "Бодріяр і симулякр: життя як контент", "insight": "Бодріяр у 1981-му описав симулякр - образ, що замінює реальність. В Instagram це стало буквальним: люди виробляють контент про життя замість того, щоб його переживати.", "thesis": "Бодріяр у 1981-му описав симулякр - образ, що замінює реальність. В Instagram це стало буквальним: люди виробляють контент про життя замість того, щоб його переживати.", "body": "## Філософ, який описав Instagram у 1981 році\n\nЖан Бодріяр - французький філософ і соціолог. У 1981 році він опублікував книжку \"Симулякри і симуляція\". Це була абстрактна філософська праця про природу образу й реальності в сучасному суспільстві. Instagram тоді не існував. TikTok не існував. Навіть інтернет був справою військових і науковців.\n\nАле якщо читати Бодріяра зараз - виникає відчуття, що він писав репортаж із 2024 року.\n\nЙого центральна ідея: у сучасному світі образ більше не відображає реальність - він її замінює. Бодріяр описував чотири стадії образу. Спершу образ відображає реальність: фотографія показує, як виглядає місце. Потім образ маскує реальність: реклама показує ідеалізовану версію продукту. Потім образ маскує відсутність реальності: образ існує без відповідної реальності. І нарешті - симулякр: образ не має жодного стосунку до реальності, він сам став реальністю.\n\nСимулякр - це копія без оригіналу. Образ, який не відображає нічого реального, - але сприймається як реальніший за саму реальність.\n\n## Гіперреальність Instagram\n\nПодивися на те, що відбувається в Instagram, крізь оптику Бодріяра.\n\nЛюдина їде в подорож. Раніше вона переживала місце: запахи, звуки, температуру, випадкові зустрічі. Тепер вона фотографує місце. Вона не переживає захід сонця - вона знімає захід для сторис. Не насолоджується їжею - фотографує страву до того, як почне їсти. Не проживає емоцію - думає, як вона виглядатиме у стрічці.\n\nСимуляція стає важливішою за досвід. Образ важливіший за реальність. І поступово люди починають жити не для того, щоб переживати, - а для того, щоб виробляти контент про переживання.\n\nБодріяр назвав би це \"гіперреальністю\": станом, коли симуляція стає реальнішою за саму реальність. Відфільтрована версія життя в Instagram стає більш \"справжньою\", ніж реальне життя з його недосконалістю та буденністю.\n\nЗиґмунт Бауман у \"Liquid Modernity\" додає до цього вимір ідентичності: у сучасному світі ідентичність перестала бути стабільною. Ти не просто той, ким народився і виріс. Ти постійно конструюєш себе заново. Соцмережі стали головним майданчиком цього будівництва - і його головним підсилювачем. Ти можеш бути різним у LinkedIn та Instagram, у Twitter і TikTok. Свобода - але й новий тип тривоги: де закінчується перформанс і починається справжнє я?\n\nЦе не просто філософська абстракція. Це опис конкретного психологічного стану - \"онлайн-дисоціації\" - який фіксують психологи: відчуття, що живеш не по-справжньому, а розігруєш версію себе для аудиторії.\n\n> Бодріяр у 1981 році описав те, що ми зараз називаємо Instagram: світ, де образ важливіший за досвід, симуляція важливіша за реальність, а людина виробляє контент про життя замість того, щоб його проживати.\n\nУ контексті Web3 це спостереження важливе ось чому: одна з обіцянок децентралізованого інтернету - повернути людям контроль не лише над даними, а й над ідентичністю. Замість симулякра для платформи - суверенна цифрова особистість, яка належить тобі. Але чи вдасться це - питання відкрите.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%8 лі күшейтуді 1938 жылы ашты. Әлеуметтік желілер оны әр қолданбаға кіріктірді — лайк дәл ойын автоматы сияқты жұмыс істейді.", "thesis": "Скиннер өзгермелі күшейтуді 1938 жылы ашты. Әлеуметтік желілер оны әр қолданбаға кіріктірді — лайк дәл ойын автоматы сияқты жұмыс істейді.", "body": "## Қораптағы егеуқұйрық және қолында телефоны бар сен\n\n1938 жылы америкалық психолог Б. Ф. Скиннер мінез-құлық ғылымы тарихындағы ең маңызды тәжірибелердің біріне айналған бірқатар эксперимент жүргізді. Ол егеуқұйрықтарды арнайы қораптарға салып, олардың қандай марапат алатынына қарай тетікті басуды қалай үйренетінін бақылаған.\n\nБірінші нұсқа: тетікті басты — тамақ алды. Әрқашан. Болжамды түрде. Егеуқұйрық тез үйренді — және дәл аш болған кезде басты. Ешқандай жабысқақтық, ешқандай тәуелділік жоқ.\n\nЕкінші нұсқа: тетікті басты — кейде тамақ аласың, кейде жоқ. Кездейсоқ. Болжау мүмкін емес. Міне, осы жерде таңғаларлық нәрсе болды: егеуқұйрық тетікті құмарлана баса бастады. Қайта-қайта. Аш болмаса да. Тамақ ұзақ уақыт келмесе де — егеуқұйрық тоқтамады. Скиннер мұны «үзілісті күшейту кестесі» деп атады және өзі бақылаған мінез-құлық қалыптастырудың ең қуатты механизмі деді.\n\nЕнді егеуқұйрықтың орнына өзіңді қой. Тетікті — «лентаны жаңарту» батырмасына. Тамақты — лайкқа, қызық постқа, досыңнан келген хабарламаға. Сен Instagram ашасың — кейде онда қызық нәрсе бар, кейде іш пыстырады, кейде маңызды біреуден лайк келеді, кейде ештеңе жоқ. Алдын ала білмейсің. Дәл осы болжаусыздық сені ұстап тұрады.\n\n## Нир Эяль мұны оқулыққа айналдырды\n\nНир Эяль 2014 жылы «Hooked» кітабын жазды — және өз ниетін толық ашық айтты. Бұл стартаптарға арналған нұсқаулық: адамдар еске салусыз және сыртқы түрткісіз қайта оралатын өнімдерді қалай жасау керек.\n\nЭяль моделі «ілмек» деп аталады — қайта-қайта қайталанатын төрт қадам. Триггер: сыртқы (хабарлама, хат) немесе ішкі (зерігу, мазасыздық, жалғыздық) — әрекетті іске қосады. Әрекет: қолданбаны ашу, лентаны айналдыру, фото жариялау — ең аз күш, ең жоғары қарапайымдық. Өзгермелі марапат: кейде қызық, кейде жоқ, кейде лайк, кейде тыныштық — Скиннердің болжаусыздығы әрекет үстінде. Инвестиция: сен контент қосасың, адамдарды белгілейсің, профильді баптайсың — сөйтіп өнімді өзің үшін құндырақ әрі бас тартуға қиынырақ етесің.\n\nЭяль мұны оқулық ретінде жазды — ашық және кешірім сұрамай. Әлеуметтік желі инженерлері бұл модельді зерттеді. Кейбіреулері кейін оны қолданғанда ар азабын сезінгенін мойындады. Facebook-тің бұрынғы вице-президенттерінің бірі Чамат Палихапития 2017 жылы көпшілік алдында: «Біз қоғамның әлеуметтік тінін жыртып жатқан құралдар жасадық», — деді. Оның балалары әлеуметтік желілерді қолданбайды.\n\nАдам Альтер «Irresistible» (2017) кітабында бұдан әрі барып, қатал сұрақ қойды: ойын автоматтарына тәуелділіктің негізінде жатқан қағидаларды пайдаланып өнім жобалау жалпы дұрыс па? Клиникалық өлшемдер бойынша — қайта оралуға мәжбүрлік, уақытты бақылауды жоғалту, зиянын түсінсе де жалғастыру, тоқтатқанда абстиненция синдромы — көптеген әлеуметтік желі пайдаланушыларымен болып жатқан нәрсе мінез-құлықтық тәуелділік анықтамасына сәйкес келеді.\n\n> Скиннер өзгермелі күшейтуді 1938 жылы ашты. Нир Эяль 2014 жылы оны стартаптарға арналған оқулыққа айналдырды. Әлеуметтік желілер оны әр қолданбаның архитектурасына кіріктірді.\n\nСонымен қатар Малкольм Гладуэлл «The Tipping Point» кітабында індет сияқты таралу механикасын сипаттады: кез келген індетте бетбұрыс нүктесі болады, содан кейін таралу қар көшкініндей үдейді. Facebook осы нүктеге «бәрі» бар орынға айналғанда жетті — өйткені барлық достарың сонда болса, сенің де сонда болудан басқа таңдауың жоқ. Жеке тәуелділік пен ұжымдық әлеуметтік қысым қосылғанда — әлеуметтік желілерден кетудің соншалық қиын болуының себебі осы.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious y (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["әлеуметтік граф", "психология", "тәуелділік", "платформалар"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "chronicle", "sceneIndex": 1, "type": "media", "shortTitle": "Шежіре", "era": "2003→2020-шы жылдар", "lensWeight": {"chronology": 5, "psychology": 3, "bonds": 3, "health": 3, "reality": 2}, "title": "Әлеуметтік желілер хроникасы: Friendster-ден TikTok-қа дейін", "insight": "20 жыл ішінде әлеуметтік желілер әлеуметтік өмірдің барлық қабатын бірінен соң бірін басып алды. 2020-жылдарға қарай орташа адам оларда күніне екі сағаттан астам уақыт өткізді — ұйқы мен жұмыстан басқа кез келген әрекеттен көп.", "thesis": "20 жыл ішінде әлеуметтік желілер әлеуметтік өмірдің барлық қабатын бірінен соң бірін басып алды. 2020-жылдарға қарай орташа адам оларда күніне екі сағаттан астам уақыт өткізді — ұйқы мен жұмыстан басқа кез келген әрекеттен көп.", "body": "## Әлеуметтік өмірді өзгерткен жиырма жыл\n\nЖиырма жыл ішінде — 2002 жылдан 2022 жылға дейін — әлеуметтік желілер студенттік ермектен бес миллиард адам қолданатын жаһандық инфрақұрылымға дейінгі жолдан өтті. Әр толқын алдыңғысынан жылдам болды. Әр платформа әлеуметтік өмірдің жаңа қабатын басып алды.\n\nҚазіргі мағынадағы алғашқы жаппай әлеуметтік желі Friendster болды — ол 2002 жылы АҚШ-та іске қосылды. Идея революциялық көрінді: профиль, достар тізімі, достардың достарын көру мүмкіндігі. Үш айда — үш миллион пайдаланушы. Бұл өз уақыты үшін жарылыс еді. Бірақ Friendster өз табысына шыдай алмады: серверлер істен шығып, парақшалар минуттап жүктелді, пайдаланушылар көңілі қалып кете бастады. Технология сұранысқа ілесе алмады.\n\n2003 жылы MySpace пайда болды — әрі тез арада әлемдегі ең ірі әлеуметтік желіге айналды. Оның ерекшелігі: баптаудың барынша еркіндігі. Әркім профилін қалағанынша безендіре алды — өз түстері, фонда өз музыкасы, өз дизайны. MySpace музыканттар, суретшілер, субмәдениеттер үшін үйге айналды. 2005 жылы медиамагнат Руперт Мердок оны 580 миллион долларға сатып алды — хайптың шыңында. Бес жылдан кейін MySpace өлді. Оны Facebook өлтірді — тазалығымен, қарапайымдылығымен және алгоритмімен.\n\nСол 2003 жылы LinkedIn кәсіби байланыстар үшін тыныш қана іске қосылды. Жарқын дизайнсыз, ойын-сауықсыз — тек түйіндеме мен байланыстар. Іш пыстыратын сияқты көрінді. Бірақ LinkedIn өз орнын тапты және оны мәңгі иеленді: 2023 жылға қарай 900 миллионнан астам пайдаланушы.\n\n## Facebook, Twitter, YouTube, Instagram\n\n2004 жыл. Марк Цукерберг TheFacebook.com сайтын Гарвард жатақханасындағы бөлмеден іске қосады. Бір аптадан кейін — Гарвард студенттерінің жартысы тіркелген. Механикасы данышпандық: шын есімдер, шын фотосуреттер, шын байланыстар. Ешқандай бүркеншік ат жоқ. Бұл анонимді кеңістік емес — нақты әлеуметтік өмірдің цифрлық көрінісі.\n\n2012 жылға қарай — бір миллиард пайдаланушы. «Facebook арқылы кіру» батырмасы миллиондаған сайтта пайда болды. Facebook-тен шығу әлеуметтік өмірден түсіп қалуды білдіре бастады.\n\n2005 жыл. PayPal-дың бұрынғы үш қызметкері YouTube жасайды. Алғашқы видео — хайуанаттар бағындағы он сегіз секунд. Бір жылдан кейін Google оны 1,65 миллиард долларға сатып алады — ол кезде бұл ақылға сыймайтындай көрінді. YouTube телевидениенің монополиясын бұзды: камерасы бар кез келген адам жаһандық аудиторияға хабар тарата алады. 2023 жылға қарай — әр минут сайын 500 сағат видео жүктеледі.\n\n2006 жыл. Джек Дорси алғашқы твитін жариялайды. Twitter нақты уақыттағы жаһандық алаңға айналды — журналистер, саясаткерлер, ғалымдар редакторларсыз аудиториямен тікелей сөйлесті. Араб көктемі Twitter арқылы ұйымдастырылды. Жер сілкіністері алдымен сонда пайда болатын — содан кейін ғана жаңалықтарға шығатын.\n\n2010 жыл. Instagram — шаршы фотолар, фильтрлер, мәтін жоқ. Facebook оны 2012 жылы бір миллиардқа сатып алады. Instagram визуалды мәдениетті өзгертті: мейрамханалар интерьерді «Instagram үшін» жобалады, туристік орындар «инстаграмдылығына» қарай бағаланды.\n\n## ВКонтакте, Telegram және TikTok\n\n2006 жыл. Павел Дуров Петербург университетінің студенттері үшін ВКонтакте желісін іске қосады. Ресей, Украина және посткеңестік елдердегі ондаған миллион адам үшін ВКонтакте алғашқы интернетке — тұтас бір буынның цифрлық әдеттері қалыптасқан орынға айналды. Дуровтың ВКонтакте-мен тарихы 2014 жылы мемлекетпен қақтығыспен аяқталды. Ол кетіп қалды — және Telegram құрды. Ол туралы келесі тарауларда сөйлесеміз.\n\n2016 жыл Қытайда, 2018 жыл — TikTok-тың жаһандық іске қосылуы. Бұл түбегейлі өзгеріс: басты лента — «For You Page» — саған мінез-құлқың негізінде алгоритм таңдаған мүлде бейтаныс адамдардың видеоларын көрсетеді. Не көретініңді сен таңдамайсың — алгоритм шешеді. TikTok-тағы орташа уақыт — күніне 90 минуттан асады. TikTok бұрын дәл мұншалық өткір қойылмаған сұрақты көтерді: миллиардтардың шындығын қалыптастыратын алгоритм басқа мемлекеттің юрисдикциясындағы компанияға тиесілі болғанда не болады?\n\n> Жиырма жыл ішінде әлеуметтік желілер әлеуметтік өмірдің барлық қабатын бірінен соң бірін басып алды: кәсіби байланыстар, достық, қоғамдық дискурс, видео, визуалды бірегейлік, ойын-сауық. 2020-жылдардың ортасына қарай орташа адам оларда күніне екі сағаттан астам уақыт өткізді.\n\nБұл адамның өміріндегі ұйқы мен жұмыстан басқа кез келген әрекеттен көп. Тарихта ешбір технология сонша көп адамның сонша көп уақытын алған емес.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%
