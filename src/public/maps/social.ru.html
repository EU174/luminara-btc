 Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["psychology", "social-graph", "neuroscience", "community"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "haidt", "sceneIndex": 3, "type": "power", "shortTitle": "Хайдт", "era": "2012→", "lensWeight": {"chronology": 4, "psychology": 4, "bonds": 3, "health": 5, "reality": 2}, "title": "Хайдт: тревожное поколение", "insight": "Хайдт собрал данные из десятков стран: с 2012 года — резкий рост тревожности и депрессии среди подростков. Это совпадает с массовым распространением смартфонов и Instagram.", "thesis": "Хайдт собрал данные из десятков стран: с 2012 года — резкий рост тревожности и депрессии среди подростков. Это совпадает с массовым распространением смартфонов и Instagram.", "body": "## Данные, которые изменили разговор\n\nДжонатан Хайдт — социальный психолог из Нью-Йоркского университета. В 2024 году он опубликовал книгу «The Anxious Generation» — «Тревожное поколение». Это не паника взрослых по поводу новых технологий. Это многолетнее систематическое исследование данных, которое пришло к выводу, трудному для оспаривания.\n\nПримерно с 2012 года — когда смартфоны стали действительно массовыми и Instagram набрал критическую аудиторию — уровень депрессии, тревожности и самоповреждений среди подростков начал расти во всех западных странах одновременно. Хайдт собрал данные из США, Великобритании, Канады, Австралии, Новой Зеландии, Скандинавии. Везде одна и та же кривая — резкий перелом примерно в 2012–2013 годах.\n\nНе в одной стране — во всех. Не у мальчиков — особенно у девочек. Не постепенно — резко, как перелом на графике. Совпадение по времени с массовым распространением смартфонов и соцсетей слишком точное, чтобы быть случайным.\n\n## Механизмы: как это работает\n\nХайдт описывает несколько конкретных механизмов, через которые соцсети влияют на психологическое здоровье подростков.\n\nПостоянное социальное сравнение. В Instagram люди публикуют лучшие моменты своей жизни — отфильтрованные, отредактированные, тщательно подобранные. Подросток видит ленту, состоящую из идеальных тел, идеальных отпусков, идеальных отношений. Его собственная жизнь, наблюдаемая изнутри с её скучными буднями и неуверенностью, выглядит убого по сравнению. Это сравнение бесконечное и неравное: ты сравниваешь свои будни с чужими праздниками.\n\nПубличная оценка через лайки. Самооценка подростка — и без того нестабильная в силу возраста — оказывается буквально привязана к числу на экране. Опубликовал фото и получил мало лайков — это публичное свидетельство того, что ты недостаточно популярен, недостаточно красив, недостаточно интересен. Это социальное отвержение в реальном времени, доступное для всех.\n\nЗамена живого общения цифровым. Живое общение — с его неловкостью, паузами, необходимостью читать эмоции — развивает эмоциональный интеллект. Текстовые взаимодействия его не развивают. Поколение, выросшее с телефоном вместо встреч, приходит во взрослую жизнь с дефицитом навыков реального общения — и это только усиливает тревогу в социальных ситуациях.\n\nКруглосуточная доступность. До смартфонов у детей было убежище: школьная травля заканчивалась в шесть вечера, когда ты приходил домой. Теперь нет. Телефон в кармане означает, что унижение, исключение, травля — доступны 24 часа в сутки, семь дней в неделю. Нет места, где можно укрыться.\n\nАдам Альтер в «Irresistible» добавляет: это не просто психологический ущерб. По клиническим критериям то, что происходит с подростками — навязчивое возвращение к телефону, потеря контроля над временем, продолжение несмотря на осознанный вред — соответствует определению поведенческой зависимости. Мы дали детям аддиктивное устройство и удивляемся результатам.\n\n> Хайдт собрал данные из десятков стран: с 2012 года эпидемия тревожности и депрессии среди подростков совпадает по времени с массовым распространением смартфонов и Instagram. Это не случайность.\n\nМы провели масштабный социальный эксперимент над детьми — без их согласия и без понимания последствий. Результаты этого эксперимента сейчас видны в статистике психиатрических больниц по всему миру.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["psychology", "mental-health", "social-graph", "media"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "kotler", "sceneIndex": 4, "type": "media", "shortTitle": "Котлер 4.0/5.0", "era": "2016→2021", "lensWeight": {"chronology": 3, "psychology": 3, "bonds": 2, "health": 1, "reality": 3}, "title": "Котлер 4.0 и 5.0: маркетинг в эпоху соцсетей", "insight": "Котлер 4.0 зафиксировал: доверие перешло от брендов к людям. Котлер 5.0 описал персонализацию до одного человека — инструмент, который одинаково работает как как забота и как манипуляция.", "thesis": "Котлер 4.0 зафиксировал: доверие перешло от брендов к людям. Котлер 5.0 описал персонализацию до одного человека — инструмент, который одинаково работает как как забота и как манипуляция.", "body": "## Когда доверие перешло от брендов к людям\n\nФилип Котлер не остановился на «Маркетинге 3.0». Соцсети изменили правила игры настолько фундаментально, что потребовалось переосмысление заново — дважды.\n\nВ «Маркетинге 4.0» (2016) Котлер зафиксировал трансформацию, которую произвели соцсети в отношениях бренда и покупателя. Маркетинг 3.0 открыл: люди покупают ценности, а не товары. Маркетинг 4.0 добавил: в эпоху соцсетей путь покупателя стал нелинейным и коллективным.\n\nРаньше путь покупателя был предсказуемым: увидел рекламу → заинтересовался → пришёл в магазин → купил. Бренд контролировал каждый шаг. Теперь человек видит пост другого покупателя в Instagram → читает отзывы незнакомцев на маркетплейсе → смотрит обзор блогера на YouTube → обсуждает в комментариях → только потом, может быть, покупает. На каждом шагу бренд не контролирует разговор. Разговор ведут другие люди.\n\nЭто изменило всё. Инфлюенсер с искренней аудиторией в сто тысяч подписчиков оказывается эффективнее телевизионного ролика за миллион долларов. Не потому что у него больше охват — а потому что его слушатели ему доверяют. Доверие перешло от брендов к людям. Это необратимый сдвиг.\n\nКотлер описывает новую модель пути покупателя: Aware → Appeal → Ask → Act → Advocate. Ты узнаёшь о продукте (Aware), он тебя привлекает (Appeal), ты спрашиваешь мнение других (Ask), покупаешь (Act) — и если доволен, становишься его амбассадором (Advocate). Advocate замыкает цикл: он создаёт контент, который запускает путь для следующего покупателя. Клиент стал частью маркетинговой машины.\n\n## Маркетинг 5.0: один на один с каждым\n\nВ «Маркетинге 5.0» (2021) Котлер описал следующий уровень: технологии — ИИ, большие данные, автоматизация — позволяют персонализировать коммуникацию до уровня одного человека в реальном времени.\n\nРаньше таргетинг выглядел так: «Реклама для мужчин 25–35 лет с интересом к спорту». Грубо, неточно, неэффективно. Современный маркетинг 5.0 работает иначе: «Это сообщение для Ивана, 28 лет, который три раза смотрел обзоры кроссовок на YouTube, искал скидки в Google в прошлую пятницу, и чьи друзья в Instagram недавно публиковали фото с пробежек. Покажи ему это предложение в 7:30 утра в понедельник, когда он едет на работу».\n\nКотлер видел в этом возможность: технологии наконец могут по-настоящему служить людям. Дать каждому именно то, что ему нужно, когда ему нужно. Персонализация как забота.\n\nНо это же описание — с точностью до запятой — инструмента максимально точной манипуляции. Разница только в намерении того, кто его использует. Один и тот же инструмент может помочь человеку найти нужный продукт — или незаметно сформировать у него потребность, которой у него не было.\n\nИ здесь возникает вопрос, который Котлер ставит, но не отвечает на него полностью: кто контролирует, в чьих интересах работает эта персонализация? В интересах покупателя — или в интересах продающего?\n\n> Котлер зафиксировал: маркетинг 4.0 отдал власть людям через соцсети. Маркетинг 5.0 попытался вернуть её через ИИ. Вопрос в том, чьим интересам служит этот инструмент.\n\nЭто противоречие — между технологией как инструментом заботы и технологией как инструментом манипуляции — проходит через всю историю цифровой эпохи. И именно его пытается разрешить Web3: через децентрализацию, через собственность на данные, через прозрачность алгоритмов.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["marketing", "social-graph", "platforms", "psychology"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "sunstein", "sceneIndex": 5, "type": "power", "shortTitle": "Санстейн", "era": "2001→2017", "lensWeight": {"chronology": 3, "psychology": 2, "bonds": 2, "health": 2, "reality": 5}, "title": "Санстейн: эхо-камеры и конец общей реальности", "insight": "Санстейн показал: алгоритмы соцсетей оптимизированы на вовлечение, не на понимание — и это системно разрушает общее информационное пространство, без которого демократия невозможна.", "thesis": "Санстейн показал: алгоритмы соцсетей оптимизированы на вовлечение, не на понимание — и это системно разрушает общее информационное пространство, без которого демократия невозможна.", "body": "## Архитектурная проблема, а не политическая\n\nКэсс Санстейн — правовед и специалист по поведенческой экономике из Гарварда. В книге «#Republic» он поставил вопрос, который кажется политическим, но на самом деле является архитектурным: что происходит с демократией, когда каждый гражданин живёт в собственном информационном пузыре?\n\nДемократия предполагает определённый минимум общего. Граждане могут не соглашаться в ценностях, приоритетах и политических взглядах — это нормально и даже полезно. Но они должны соглашаться в базовой реальности. Вот произошло это событие. Вот эти данные. Вот эти факты. Только имея общую фактическую базу, можно спорить о том, что с ней делать.\n\nАлгоритмы соцсетей разрушают это общее пространство. Они оптимизированы на вовлечение — на то, чтобы ты оставался в приложении как можно дольше. А что лучше всего удерживает внимание? Контент, который вызывает сильную эмоцию: возмущение, страх, восторг, негодование. Контент, который подтверждает уже существующие убеждения. Контент, который усиливает уже существующие эмоции.\n\nВ результате алгоритм показывает каждому его персональную реальность. Не потому что кто-то так решил злонамеренно. Просто потому что это максимизирует вовлечение.\n\n## Эхо-камеры: когда ты слышишь только своё эхо\n\nСанстейн называет это «эхо-камерами». Ты попадаешь в информационное пространство, где все говорят примерно то же, что ты уже думаешь. Твои убеждения только усиливаются — потому что ты видишь бесконечное количество подтверждений. Возражений и альтернативных точек зрения почти нет — алгоритм их фильтрует, потому что они снижают вовлечение.\n\nЭто не просто неприятно. Это разрушительно для способности к суждению. Когда ты слышишь только своё эхо — ты перестаёшь понимать, что другие люди могут иметь другую картину реальности. Ты начинаешь воспринимать свою версию как единственно возможную. Людей с другими взглядами — как злонамеренных, глупых или предубеждённых.\n\nПолитическая поляризация последних лет в США, Европе и других регионах — это не случайность и не просто результат экономических проблем. Это предсказуемое следствие архитектуры, которая оптимизирована на вовлечение, а не на понимание. Алгоритм не создал поляризацию. Но он её масштабировал и ускорил.\n\nСанстейн предлагает аналогию: представь город, где все рестораны заменены автоматами, которые дают тебе то, что ты уже ел раньше. Никаких новых вкусов. Никаких неожиданных открытий. Только подтверждение уже сложившихся предпочтений. Это кажется удобным — но на самом деле сужает мир.\n\n> Санстейн показал: алгоритм не злой — он просто оптимизирован на вовлечение. Но это разрушает общее информационное пространство, без которого демократия невозможна.\n\nЭта проблема не решается регулированием или штрафами для платформ. Она встроена в архитектуру бизнес-модели: платформа зарабатывает на вовлечении, вовлечение максимизируется через эмоциональный контент, эмоциональный контент поляризует. Изменить это можно только изменив саму бизнес-модель — или создав альтернативную архитектуру.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["algorithms", "democracy", "social-graph", "media"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "baudrillard", "sceneIndex": 6, "type": "privacy", "shortTitle": "Бодрийяр", "era": "1981", "lensWeight": {"chronology": 2, "psychology": 2, "bonds": 2, "health": 3, "reality": 5}, "title": "Бодрийяр и симулякр: жизнь как контент", "insight": "Бодрийяр в 1981-м описал симулякр — образ, заменяющий реальность. В Instagram это стало буквальным: люди производят контент о жизни вместо того, чтобы её переживать.", "thesis": "Бодрийяр в 1981-м описал симулякр — образ, заменяющий реальность. В Instagram это стало буквальным: люди производят контент о жизни вместо того, чтобы её переживать.", "body": "## Философ, который описал Instagram в 1981 году\n\nЖан Бодрийяр — французский философ и социолог. В 1981 году он опубликовал книгу «Симулякры и симуляция». Это была абстрактная философская работа о природе образа и реальности в современном обществе. Instagram тогда не существовал. TikTok не существовал. Даже интернет был уделом военных и учёных.\n\nНо если читать Бодрийяра сейчас — ощущение, что он писал репортаж из 2024 года.\n\nЕго центральная идея: в современном мире образ больше не отражает реальность — он её заменяет. Бодрийяр описывал четыре стадии образа. Сначала образ отражает реальность: фотография показывает, как выглядит место. Потом образ маскирует реальность: реклама показывает идеализированную версию продукта. Потом образ маскирует отсутствие реальности: образ существует без соответствующей реальности. И наконец — симулякр: образ не имеет никакого отношения к реальности, он сам стал реальностью.\n\nСимулякр — это копия без оригинала. Образ, который не отражает ничего реального — но воспринимается как более реальный, чем сама реальность.\n\n## Гиперреальность Instagram\n\nПосмотри на то, что происходит в Instagram через оптику Бодрийяра.\n\nЧеловек едет в путешествие. Раньше — он переживал место: запахи, звуки, температура, случайные встречи. Сейчас — он фотографирует место. Он не переживает закат — он снимает закат для сторис. Не наслаждается едой — фотографирует блюдо до того, как начнёт есть. Не переживает эмоцию — думает, как она будет выглядеть в ленте.\n\nСимуляция становится важнее опыта. Образ важнее реальности. И постепенно люди начинают жить не для того, чтобы переживать — а для того, чтобы производить контент о переживании.\n\nБодрийяр назвал бы это «гиперреальностью»: состоянием, когда симуляция становится более реальной, чем сама реальность. Отфильтрованная версия жизни в Instagram становится более «настоящей», чем реальная жизнь с её несовершенством и обыденностью.\n\nЗигмунт Бауман в «Liquid Modernity» добавляет к этому измерение идентичности: в современном мире идентичность перестала быть стабильной. Ты не просто тот, кем родился и вырос. Ты постоянно конструируешь себя заново. Соцсети стали главной площадкой этого строительства — и его главным усилителем. Ты можешь быть разным в LinkedIn и Instagram, в Twitter и TikTok. Свобода — но и новый тип тревоги: где заканчивается перформанс и начинается настоящее я?\n\nЭто не просто философская абстракция. Это описание конкретного психологического состояния — «онлайн-диссоциации» — которое фиксируют психологи: ощущение, что живёшь не по-настоящему, а разыгрываешь версию себя для аудитории.\n\n> Бодрийяр в 1981 году описал то, что мы сейчас называем Instagram: мир, где образ важнее опыта, симуляция важнее реальности, а человек производит контент о жизни вместо того, чтобы её проживать.\n\nВ контексте Web3 это наблюдение важно вот почему: одно из обещаний децентрализованного интернета — вернуть людям контроль не только над данными, но и над идентичностью. Вместо симулякра для платформы — суверенная цифровая личность, которая принадлежит тебе. Но удастся ли это — вопрос открытый.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["identity", "philosophy", "social-graph", "media"], "x": 265.5, "y": 258.0, "angDeg": 218.6}], "edges": [{"from": "skinner", "to": "chronicle", "label": "механику встроили в приложения", "lenses": ["psychology", "chronology"]}, {"from": "chronicle", "to": "haidt", "label": "захват совпал с ростом тревоги", "lenses": ["chronology", "health"]}, {"from": "skinner", "to": "haidt", "label": "зависимость бьёт по психике", "lenses": ["psychology", "health"]}, {"from": "dunbar", "to": "chronicle", "label": "тысяча друзей вместо ста пятидесяти", "lenses": ["bonds", "chronology"]}, {"from": "dunbar", "to": "haidt", "label": "поверхностность усиливает одиночество", "lenses": ["bonds", "health"]}, {"from": "chronicle", "to": "kotler", "label": "доверие перешло к людям", "lenses": ["media", "chronology"]}, {"from": "kotler", "to": "sunstein", "label": "персонализация дробит реальность", "lenses": ["reality", "psychology"]}, {"from": "sunstein", "to": "baudrillard", "label": "эхо-камера рождает симулякр", "lenses": ["reality"]}, {"from": "haidt", "to": "baudrillard", "label": "жизнь заменяется контентом", "lenses": ["health", "reality"]}, {"from": "skinner", "to": "sunstein", "label": "вовлечение важнее понимания", "lenses": ["psychology", "reality"]}]}, "en": {"chapter": {"key": "social", "title": "Social networks", "lede": "How connections became the product and you became the raw material. The mechanics of addiction, loneliness, and simulacra.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=social", "centralIdea": "Connections became the product, and you became the raw material", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Chronology", "accent": "#7dd3fc", "description": "From Friendster to TikTok: how social networks captured every layer of life."}, {"id": "psychology", "label": "Psychology", "accent": "#f87171", "description": "Skinner and variable reinforcement: the like works like a slot machine."}, {"id": "bonds", "label": "Connections", "accent": "#c084fc", "description": "Dunbar: the brain is built for 150 relationships, not a thousand “friends.”"}, {"id": "health", "label": "Health", "accent": "#34d399", "description": "Haidt: the anxious generation, with anxiety and depression rising since 2012."}, {"id": "reality", "label": "Reality", "accent": "#fbbf24", "description": "Sunstein and Baudrillard: echo chambers and life replaced by content."}], "nodes": [{"id": "skinner", "sceneIndex": 0, "type": "power", "shortTitle": "Skinner", "era": "1938→", "lensWeight": {"chronology": 2, "psychology": 5, "bonds": 1, "health": 3, "reality": 1}, "title": "Skinner and the Like: The Mechanics of Addiction", "insight": "Skinner discovered variable reinforcement in 1938. Social networks built it into every app — a like works exactly like a slot machine.", "thesis": "Skinner discovered variable reinforcement in 1938. Social networks built it into every app — a like works exactly like a slot machine.", "body": "## A Rat in a Box and You with a Phone\n\nIn 1938, the American psychologist B. F. Skinner conducted a series of experiments that became some of the most important in the history of behavioral science. He placed rats in special boxes and observed how they learned to press a lever depending on what reward they received.\n\nFirst version: press the lever — get food. Always. Predictably. The rat quickly learned to press it — and pressed it exactly when it was hungry. No compulsion, no addiction.\n\nSecond version: press the lever — sometimes you get food, sometimes you do not. Randomly. Unpredictably. And here something striking happened: the rat began pressing the lever obsessively. Again and again. Even when it was not hungry. Even when food did not arrive for a long time — the rat did not stop. Skinner called this an “intermittent schedule of reinforcement” and called it the most powerful mechanism for shaping behavior he had ever observed.\n\nNow replace the rat with yourself. The lever — with the “refresh feed” button. Food — with a like, an interesting post, a message from a friend. You open Instagram — and sometimes there is something interesting, sometimes something boring, sometimes a like from someone important, sometimes nothing. You do not know in advance. It is precisely this unpredictability that keeps you there.\n\n## Nir Eyal Turned This into a Textbook\n\nNir Eyal wrote the book “Hooked” in 2014 — and was completely frank about his intentions. It is a guide for startups: how to create products that people return to without reminders and without an external stimulus.\n\nEyal’s model is called the “hook” — four steps repeated again and again. Trigger: external (a notification, an email) or internal (boredom, anxiety, loneliness) — starts the action. Action: open the app, scroll the feed, post a photo — minimum effort, maximum simplicity. Variable reward: sometimes interesting, sometimes not, sometimes a like, sometimes silence — Skinner’s unpredictability in action. Investment: you add content, tag people, customize your profile — and by doing so make the product more valuable for yourself and harder to abandon.\n\nEyal wrote this as a textbook — openly and without apology. Social network engineers studied this model. Some later admitted they felt remorse when applying it. One former Facebook vice president, Chamath Palihapitiya, publicly said in 2017: “We have created tools that are ripping apart the social fabric of how society works.” His children do not use social networks.\n\nAdam Alter, in the book “Irresistible” (2017), went further and asked a hard question: is it even normal to design products using the same principles that underlie addiction to slot machines? By clinical criteria — compulsive return, loss of control over time, continued use despite conscious harm, withdrawal symptoms when stopping — what happens to many social network users fits the definition of behavioral addiction.\n\n> Skinner discovered variable reinforcement in 1938. Nir Eyal turned it into a startup textbook in 2014. Social networks built it into the architecture of every app.\n\nIn parallel, Malcolm Gladwell in “The Tipping Point” described the mechanics of epidemic spread: every epidemic has a tipping point after which its spread becomes avalanche-like. Facebook reached that point when it became the place where “everyone” was — because if all your friends are there, you have no choice except to be there too. Individual addiction plus collective social pressure — that is why social networks are so hard to leave.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["social graph", "psychology", "addiction", "platforms"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "chronicle", "sceneIndex": 1, "type": "media", "shortTitle": "Chronicle", "era": "2003→2020s", "lensWeight": {"chronology": 5, "psychology": 3, "bonds": 3, "health": 3, "reality": 2}, "title": "The Chronicle of Social Networks: from Friendster to TikTok", "insight": "In 20 years, social networks sequentially captured every layer of social life. By the 2020s, the average person spent more than two hours a day in them — more than any other activity except sleep and work.", "thesis": "In 20 years, social networks sequentially captured every layer of social life. By the 2020s, the average person spent more than two hours a day in them — more than any other activity except sleep and work.", "body": "## Twenty Years That Changed Social Life\n\nOver twenty years — from 2002 to 2022 — social networks went from a student pastime to global infrastructure used by five billion people. Each wave was faster than the one before it. Each platform captured a new layer of social life.\n\nThe first mass social network in the modern sense was Friendster — launched in 2002 in the United States. The idea seemed revolutionary: a profile, a list of friends, the ability to see friends of friends. In three months — three million users. That was an explosion for its time. But Friendster could not withstand its own success: servers crashed, pages took minutes to load, users left disappointed. The technology could not keep up with demand.\n\nIn 2003, MySpace appeared — and quickly became the largest social network in the world. Its difference: maximum freedom of customization. Everyone could design a profile however they wanted — their own colors, their own background music, their own layout. MySpace became a home for musicians, artists, subcultures. In 2005, media magnate Rupert Murdoch bought it for 580 million dollars — at the peak of the hype. Five years later, MySpace was dead. Facebook killed it — with cleanliness, simplicity and the algorithm.\n\nThat same year, 2003, LinkedIn quietly launched for professional connections. No flashy design, no entertainment — only resumes and contacts. It seemed boring. But LinkedIn found a niche and occupied it forever: by 2023, more than 900 million users.\n\n## Facebook, Twitter, YouTube, Instagram\n\n2004. Mark Zuckerberg launches TheFacebook.com from a room in a Harvard dormitory. Within a week, half of Harvard’s students are registered. The mechanics are brilliant: real names, real photos, real connections. No pseudonyms. This is not an anonymous space — it is a digital reflection of real social life.\n\nBy 2012 — one billion users. The “Log in with Facebook” button appeared on millions of sites. Leaving Facebook came to mean dropping out of social life.\n\n2005. Three former PayPal employees create YouTube. The first video — eighteen seconds at the zoo. A year later, Google buys it for 1.65 billion dollars — at the time, it seemed madness. YouTube broke television’s monopoly: anyone with a camera can broadcast to a global audience. By 2023 — 500 hours of video are uploaded every minute.\n\n2006. Jack Dorsey publishes the first tweet. Twitter turned into a global real-time square — journalists, politicians, scientists spoke directly to audiences without editors. The Arab Spring was organized through Twitter. Earthquakes appeared there first — and only later in the news.\n\n2010. Instagram — square photos, filters, no text. Facebook buys it in 2012 for a billion. Instagram changed visual culture: restaurants designed interiors “for Instagram,” tourist places were judged by their “Instagrammability.”\n\n## VKontakte, Telegram and TikTok\n\n2006. Pavel Durov launches VKontakte for students of Saint Petersburg University. For tens of millions of people in Russia, Ukraine and post-Soviet countries, VKontakte became the first internet — the place where the digital habits of an entire generation were formed. Durov’s story with VKontakte ended in conflict with the state in 2014. He left — and created Telegram. We will talk about it in the next chapters.\n\n2016 in China, 2018 — TikTok’s global launch. This is a radical shift: the main feed — the “For You Page” — shows you videos from complete strangers, selected by an algorithm based on your behavior. You do not choose what to watch — the algorithm decides. Average time on TikTok is more than 90 minutes a day. TikTok raised a question that had not sounded so acute before: what happens when the algorithm shaping the reality of billions belongs to a company in the jurisdiction of another state?\n\n> In twenty years, social networks sequentially captured every layer of social life: professional connections, friendship, public discourse, video, visual identity, entertainment. By the mid-2020s, the average person spent more than two hours a day in them.\n\nThat is more than any other activity in a person’s life — except sleep and work. No technology in history has taken so much time from so many people.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["social graph", "history", "platforms", "Telegram"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "dunbar", "sceneIndex": 2, "type": "privacy", "shortTitle": "Dunbar", "era": "1992", "lensWeight": {"chronology": 2, "psychology": 2, "bonds": 5, "health": 3, "reality": 1}, "title": "Dunbar: a thousand friends versus one hundred and fifty", "insight": "Dunbar proved: the brain is built for 150 relationships. A thousand \"friends\" on social networks does not expand this limit — it makes every contact superficial and intensifies loneliness.", "thesis": "Dunbar proved: the brain is built for 150 relationships. A thousand \"friends\" on social networks does not expand this limit — it makes every contact superficial and intensifies loneliness.", "body": "## The number that has not changed in a million years\n\nIn 1992, the British anthropologist Robin Dunbar published a study that became one of the most cited in anthropology. He studied the size of the neocortex — the part of the brain responsible for social cognition — in different primate species. And he found a clear correlation: the larger the neocortex relative to brain size, the larger the social groups in which a species lives.\n\nFor humans, Dunbar calculated this number: around 150. That is how many stable social relationships the human brain can maintain at the same time. Not just \"acquaintances,\" but people whose life situation you keep track of, with whom you have a history, whom you trust at a certain level.\n\nThis number — 150 — is called \"Dunbar's number.\" It appears across very different contexts. The size of effective military units throughout history is around 150 people. The size of traditional hunter-gatherer villages is around 150 people. The size of cohesive religious communities is around 150 people. Not because someone decided it that way. Simply because this is the limit of what our brain can process.\n\n## What happens to the brain with a thousand \"friends\"\n\nNow look at your Facebook or Instagram. How many \"friends\" or followers do you have? Hundreds? Thousands? Social networks gave us the ability to maintain ties with a number of people five to twenty times higher than our cognitive limit.\n\nOur brain has not changed. Evolution has not kept up with technology. What happens when a person tries to manage a social life that exceeds their cognitive capacity tenfold? They start simplifying. Reacting quickly, superficially, emotionally. A like instead of a conversation. A reaction instead of understanding. A public comment instead of a private message.\n\nThis is not laziness or degradation. It is neurobiological overload. The brain does the only thing it can: it reduces signals to the minimum. Instead of complex emotional interaction — press the heart. Instead of a sincere conversation — write \"congratulations!\" under a photo.\n\nThat is why a thousand friends on social networks does not make us happier or less lonely. Studies — including the works Haidt cites — show the opposite: growth in the number of online \"connections\" correlates with growth in the feeling of loneliness. Because the brain cannot distinguish a superficial online contact from a real bond — it simply overloads and switches off emotionally.\n\nAdd to this what Gladwell described in *The Tipping Point*: after a platform reaches critical mass, being present on it becomes a social necessity. You do not choose to be on Facebook because of the quality of interaction. You are there because everyone is there. And that means you are condemned to endlessly scroll through a feed of people with whom you have a \"connection\" without a real connection.\n\n> Dunbar showed: our brain is built for 150 relationships. Social networks gave us thousands — and made each of them superficial. More connections does not mean less loneliness.\n\nThis explains one of the central paradoxes of the social media era: we have never been so \"connected\" — and we have never felt so lonely. The epidemic of loneliness that psychologists around the world have recorded since the early 2010s coincides in time with the mass spread of smartphones and social networks. This is not an accident.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["psychology", "social graph", "neuroscience", "community"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "haidt", "sceneIndex": 3, "type": "power", "shortTitle": "Haidt", "era": "2012→", "lensWeight": {"chronology": 4, "psychology": 4, "bonds": 3, "health": 5, "reality": 2}, "title": "Haidt: the anxious generation", "insight": "Haidt gathered data from dozens of countries: since 2012, there has been a sharp rise in anxiety and depression among teenagers. It coincides with the mass spread of smartphones and Instagram.", "thesis": "Haidt gathered data from dozens of countries: since 2012, there has been a sharp rise in anxiety and depression among teenagers. It coincides with the mass spread of smartphones and Instagram.", "body": "## The data that changed the conversation\n\nJonathan Haidt is a social psychologist at New York University. In 2024, he published *The Anxious Generation*. This is not adult panic about new technologies. It is a multi-year, systematic study of data that reached a conclusion difficult to dispute.\n\nStarting around 2012 — when smartphones became truly mass-market and Instagram gained a critical audience — the level of depression, anxiety and self-harm among teenagers began to rise across all Western countries at the same time. Haidt gathered data from the United States, the United Kingdom, Canada, Australia, New Zealand and Scandinavia. Everywhere, the same curve: a sharp break around 2012–2013.\n\nNot in one country — in all of them. Not among boys — especially among girls. Not gradually — sharply, like a break in a graph. The timing coincides with the mass spread of smartphones and social networks too precisely to be accidental.\n\n## Mechanisms: how it works\n\nHaidt describes several concrete mechanisms through which social networks affect teenagers' psychological health.\n\nConstant social comparison. On Instagram, people publish the best moments of their lives — filtered, edited, carefully selected. A teenager sees a feed made up of perfect bodies, perfect vacations, perfect relationships. Their own life, observed from the inside with its boring weekdays and uncertainty, looks miserable by comparison. This comparison is endless and unequal: you compare your ordinary days with other people's celebrations.\n\nPublic evaluation through likes. A teenager's self-esteem — already unstable because of age — becomes literally tied to a number on a screen. You post a photo and get few likes: this is public evidence that you are not popular enough, not beautiful enough, not interesting enough. It is social rejection in real time, visible to everyone.\n\nReplacing live communication with digital communication. Live communication — with its awkwardness, pauses and need to read emotions — develops emotional intelligence. Text interactions do not develop it. A generation that grew up with a phone instead of meetings enters adult life with a deficit of real communication skills — and this only increases anxiety in social situations.\n\nRound-the-clock availability. Before smartphones, children had a refuge: school bullying ended at six in the evening, when you came home. Not anymore. A phone in your pocket means humiliation, exclusion and bullying are available 24 hours a day, seven days a week. There is no place to hide.\n\nAdam Alter adds in *Irresistible*: this is not just psychological damage. By clinical criteria, what is happening to teenagers — compulsive returning to the phone, loss of control over time, continuing despite recognized harm — fits the definition of behavioral addiction. We gave children an addictive device and are surprised by the results.\n\n> Haidt gathered data from dozens of countries: since 2012, the epidemic of anxiety and depression among teenagers has coincided in time with the mass spread of smartphones and Instagram. This is not an accident.\n\nWe conducted a massive social experiment on children — without their consent and without understanding the consequences. The results of this experiment are now visible in the statistics of psychiatric hospitals around the world.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["psychology", "mental health", "social graph", "media"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "kotler", "sceneIndex": 4, "type": "media", "shortTitle": "Kotler 4.0/5.0", "era": "2016→2021", "lensWeight": {"chronology": 3, "psychology": 3, "bonds": 2, "health": 1, "reality": 3}, "title": "Kotler 4.0 and 5.0: marketing in the social media era", "insight": "Kotler 4.0 captured this: trust moved from brands to people. Kotler 5.0 described personalization down to one person — a tool that works equally as care and as manipulation.", "thesis": "Kotler 4.0 captured this: trust moved from brands to people. Kotler 5.0 described personalization down to one person — a tool that works equally as care and as manipulation.", "body": "## When trust moved from brands to people\n\nPhilip Kotler did not stop at *Marketing 3.0*. Social networks changed the rules of the game so fundamentally that the whole thing had to be rethought again — twice.\n\nIn *Marketing 4.0* (2016), Kotler captured the transformation that social networks had produced in the relationship between brand and buyer. Marketing 3.0 revealed: people buy values, not goods. Marketing 4.0 added: in the social media era, the buyer's path became nonlinear and collective.\n\nBefore, the buyer's path was predictable: saw an ad → became interested → came to a store → bought. The brand controlled every step. Now a person sees another buyer's post on Instagram → reads strangers' reviews on a marketplace → watches a blogger's review on YouTube → discusses it in comments → only then, maybe, buys. At every step, the brand does not control the conversation. Other people conduct the conversation.\n\nThis changed everything. An influencer with a sincere audience of one hundred thousand followers turns out to be more effective than a million-dollar TV commercial. Not because they have more reach, but because their listeners trust them. Trust moved from brands to people. This is an irreversible shift.\n\nKotler describes a new model of the buyer's path: Aware → Appeal → Ask → Act → Advocate. You learn about a product (Aware), it attracts you (Appeal), you ask others for their opinion (Ask), you buy (Act) — and if you are satisfied, you become its ambassador (Advocate). Advocate closes the cycle: they create content that starts the path for the next buyer. The customer became part of the marketing machine.\n\n## Marketing 5.0: one-to-one with each person\n\nIn *Marketing 5.0* (2021), Kotler described the next level: technologies — AI, big data, automation — make it possible to personalize communication down to the level of one person in real time.\n\nPreviously, targeting looked like this: \"Advertising for men aged 25–35 with an interest in sports.\" Rough, imprecise, ineffective. Modern Marketing 5.0 works differently: \"This message is for Ivan, 28, who watched sneaker reviews on YouTube three times, searched for discounts on Google last Friday, and whose friends on Instagram recently posted photos from runs. Show him this offer at 7:30 on Monday morning, when he is commuting to work.\"\n\nKotler saw opportunity in this: technology can finally truly serve people. Give each person exactly what they need, when they need it. Personalization as care.\n\nBut this same description — down to the comma — is also a tool for maximally precise manipulation. The only difference is the intention of the person using it. The same tool can help a person find the product they need — or quietly form in them a need they did not have.\n\nAnd here a question arises that Kotler raises but does not fully answer: who controls whose interests this personalization serves? The buyer's interests — or the seller's interests?\n\n> Kotler captured this: Marketing 4.0 gave power to people through social networks. Marketing 5.0 tried to return it through AI. The question is whose interests this tool serves.\n\nThis contradiction — between technology as a tool of care and technology as a tool of manipulation — runs through the entire history of the digital era. And Web3 is precisely what tries to resolve it: through decentralization, through ownership of data, through transparency of algorithms.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["marketing", "social graph", "platforms", "psychology"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "sunstein", "sceneIndex": 5, "type": "power", "shortTitle": "Sunstein", "era": "2001→2017", "lensWeight": {"chronology": 3, "psychology": 2, "bonds": 2, "health": 2, "reality": 5}, "title": "Sunstein: echo chambers and the end of shared reality", "insight": "Sunstein showed: social network algorithms are optimized for engagement, not understanding - and this systematically destroys the shared information space without which democracy is impossible.", "thesis": "Sunstein showed: social network algorithms are optimized for engagement, not understanding - and this systematically destroys the shared information space without which democracy is impossible.", "body": "## An architectural problem, not a political one\n\nCass Sunstein is a legal scholar and behavioral economist at Harvard. In his book \"#Republic\", he raised a question that seems political, but is in fact architectural: what happens to democracy when every citizen lives inside their own information bubble?\n\nDemocracy assumes a certain minimum of the shared. Citizens may disagree on values, priorities and political views - that is normal and even useful. But they must agree on basic reality. This event happened. These are the data. These are the facts. Only with a shared factual base can people argue about what to do with it.\n\nSocial network algorithms destroy this shared space. They are optimized for engagement - for keeping you in the app as long as possible. And what holds attention best? Content that triggers a strong emotion: outrage, fear, delight, indignation. Content that confirms existing beliefs. Content that amplifies existing emotions.\n\nAs a result, the algorithm shows each person their own personal reality. Not because someone maliciously decided it should. Simply because it maximizes engagement.\n\n## Echo chambers: when you hear only your own echo\n\nSunstein calls this \"echo chambers\". You enter an information space where everyone says roughly what you already think. Your beliefs only grow stronger - because you see an endless number of confirmations. Objections and alternative points of view are almost absent - the algorithm filters them out because they reduce engagement.\n\nThis is not just unpleasant. It is destructive to the capacity for judgment. When you hear only your own echo, you stop understanding that other people can have a different picture of reality. You begin to perceive your own version as the only possible one. People with other views become malicious, stupid or biased in your eyes.\n\nThe political polarization of recent years in the United States, Europe and other regions is not an accident and not simply the result of economic problems. It is the predictable consequence of an architecture optimized for engagement, not for understanding. The algorithm did not create polarization. But it scaled and accelerated it.\n\nSunstein offers an analogy: imagine a city where all restaurants have been replaced by vending machines that give you what you have already eaten before. No new tastes. No unexpected discoveries. Only confirmation of already formed preferences. It seems convenient - but in fact it narrows the world.\n\n> Sunstein showed: the algorithm is not evil - it is simply optimized for engagement. But this destroys the shared information space without which democracy is impossible.\n\nThis problem cannot be solved by regulation or fines for platforms. It is built into the architecture of the business model: the platform earns from engagement, engagement is maximized through emotional content, and emotional content polarizes. This can be changed only by changing the business model itself - or by creating an alternative architecture.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["algorithms", "democracy", "social graph", "media"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "baudrillard", "sceneIndex": 6, "type": "privacy", "shortTitle": "Baudrillard", "era": "1981", "lensWeight": {"chronology": 2, "psychology": 2, "bonds": 2, "health": 3, "reality": 5}, "title": "Baudrillard and the simulacrum: life as content", "insight": "In 1981, Baudrillard described the simulacrum - an image that replaces reality. On Instagram, this became literal: people produce content about life instead of experiencing it.", "thesis": "In 1981, Baudrillard described the simulacrum - an image that replaces reality. On Instagram, this became literal: people produce content about life instead of experiencing it.", "body": "## The philosopher who described Instagram in 1981\n\nJean Baudrillard was a French philosopher and sociologist. In 1981, he published the book \"Simulacra and Simulation\". It was an abstract philosophical work about the nature of the image and reality in modern society. Instagram did not exist then. TikTok did not exist. Even the internet was the domain of the military and scientists.\n\nBut if you read Baudrillard now, it feels as if he was writing a report from 2024.\n\nHis central idea: in the modern world, the image no longer reflects reality - it replaces it. Baudrillard described four stages of the image. First, the image reflects reality: a photograph shows what a place looks like. Then the image masks reality: advertising shows an idealized version of a product. Then the image masks the absence of reality: the image exists without a corresponding reality. And finally - the simulacrum: the image has no relation to reality at all; it has itself become reality.\n\nA simulacrum is a copy without an original. An image that reflects nothing real - but is perceived as more real than reality itself.\n\n## The hyperreality of Instagram\n\nLook at what happens on Instagram through Baudrillard's lens.\n\nA person goes on a trip. Earlier, they experienced the place: smells, sounds, temperature, chance encounters. Now, they photograph the place. They do not experience the sunset - they film the sunset for stories. They do not enjoy the food - they photograph the dish before they start eating. They do not live through an emotion - they think about how it will look in the feed.\n\nSimulation becomes more important than experience. The image becomes more important than reality. And gradually people begin to live not in order to experience, but in order to produce content about experience.\n\nBaudrillard would call this \"hyperreality\": a state in which simulation becomes more real than reality itself. The filtered version of life on Instagram becomes more \"real\" than real life with its imperfection and ordinariness.\n\nZygmunt Bauman, in \"Liquid Modernity\", adds the dimension of identity to this: in the modern world, identity has ceased to be stable. You are not simply who you were born and grew up as. You constantly construct yourself anew. Social networks have become the main site of this construction - and its main amplifier. You can be different on LinkedIn and Instagram, on Twitter and TikTok. Freedom - but also a new kind of anxiety: where does performance end and the real self begin?\n\nThis is not just a philosophical abstraction. It is a description of a concrete psychological state - \"online dissociation\" - that psychologists record: the feeling that you are not really living, but performing a version of yourself for an audience.\n\n> In 1981, Baudrillard described what we now call Instagram: a world where the image matters more than experience, simulation matters more than reality, and a person produces content about life instead of living it.\n\nIn the context of Web3, this observation matters for the following reason: one of the promises of the decentralized internet is to return control to people not only over data, but also over identity. Instead of a simulacrum for the platform - a sovereign digital identity that belongs to you. But whether this will succeed remains an open question.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D
