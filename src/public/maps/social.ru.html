<script>
const CHAPTER_DATA = {"chapter": {"key": "social", "title": "Соцсети", "lede": "Как связи стали продуктом, а ты — сырьём. Механика зависимости, одиночества и симулякра.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=social", "centralIdea": "Связи стали продуктом, а ты — сырьём", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Хронология", "accent": "#7dd3fc", "description": "От Friendster до TikTok: как соцсети захватили каждый слой жизни."}, {"id": "psychology", "label": "Психология", "accent": "#f87171", "description": "Скиннер и переменное подкрепление: лайк работает как игровой автомат."}, {"id": "bonds", "label": "Связи", "accent": "#c084fc", "description": "Данбар: мозг создан для 150 отношений, а не для тысячи «друзей»."}, {"id": "health", "label": "Здоровье", "accent": "#34d399", "description": "Хайдт: тревожное поколение — рост тревоги и депрессии с 2012 года."}, {"id": "reality", "label": "Реальность", "accent": "#fbbf24", "description": "Санстейн и Бодрийяр: эхо-камеры и жизнь, заменённая контентом."}], "nodes": [{"id": "skinner", "sceneIndex": 0, "type": "power", "shortTitle": "Скиннер", "era": "1938→", "lensWeight": {"chronology": 2, "psychology": 5, "bonds": 1, "health": 3, "reality": 1}, "title": "Скиннер и лайк: механика зависимости", "insight": "Скиннер открыл переменное подкрепление в 1938-м. Соцсети встроили его в каждое приложение — лайк работает точно так же, как игровой автомат.", "thesis": "Скиннер открыл переменное подкрепление в 1938-м. Соцсети встроили его в каждое приложение — лайк работает точно так же, как игровой автомат.", "body": "## Крыса в ящике и ты с телефоном\n\nВ 1938 году американский психолог Б. Ф. Скиннер провёл серию экспериментов, которые стали одними из самых важных в истории науки о поведении. Он сажал крыс в специальные ящики и наблюдал, как они учатся нажимать на рычаг в зависимости от того, какую награду получают.\n\nПервый вариант: нажал на рычаг — получил еду. Всегда. Предсказуемо. Крыса быстро научилась нажимать — и нажимала именно тогда, когда была голодна. Никакой навязчивости, никакой зависимости.\n\nВторой вариант: нажал на рычаг — иногда получаешь еду, иногда нет. Случайно. Непредсказуемо. И вот здесь произошло кое-что поразительное: крыса начинала нажимать на рычаг одержимо. Снова и снова. Даже когда не была голодна. Даже когда еда не приходила подолгу — крыса не прекращала. Скиннер назвал это «прерывистым расписанием подкрепления» и назвал его самым мощным механизмом формирования поведения, который он когда-либо наблюдал.\n\nТеперь замени крысу на тебя. Рычаг — на кнопку «обновить ленту». Еду — на лайк, интересный пост, сообщение от друга. Ты открываешь Instagram — и иногда там что-то интересное, иногда скучное, иногда лайк от кого-то важного, иногда ничего. Ты не знаешь заранее. Именно эта непредсказуемость и держит тебя.\n\n## Нир Эяль систематизировал это в учебник\n\nНир Эяль в 2014 году написал книгу «Hooked» — и был совершенно откровенен в своих намерениях. Это руководство для стартапов: как создавать продукты, к которым люди возвращаются без напоминания и без внешнего стимула.\n\nМодель Эяля называется «крючок» — четыре шага, которые повторяются снова и снова. Триггер: внешний (уведомление, письмо) или внутренний (скука, тревога, одиночество) — запускает действие. Действие: открыть приложение, прокрутить ленту, опубликовать фото — минимальное усилие, максимальная простота. Переменная награда: иногда интересно, иногда нет, иногда лайк, иногда тишина — непредсказуемость Скиннера в действии. Инвестиция: ты добавляешь контент, отмечаешь людей, настраиваешь профиль — и тем самым делаешь продукт ценнее для себя и труднее для отказа.\n\nЭяль написал это как учебник — открыто и без извинений. Инженеры соцсетей изучали эту модель. Некоторые позже признавались, что испытывали угрызения совести, применяя её. Один из бывших вице-президентов Facebook Чамат Палихапития в 2017 году публично сказал: «Мы создали инструменты, которые разрывают социальную ткань общества». Его дети не пользуются соцсетями.\n\nАдам Альтер в книге «Irresistible» (2017) пошёл дальше и задал жёсткий вопрос: а это вообще нормально — проектировать продукты с использованием тех же принципов, что лежат в основе зависимости от игровых автоматов? По клиническим критериям — навязчивое возвращение, потеря контроля над временем, продолжение несмотря на осознанный вред, синдром отмены при отказе — то, что происходит с многими пользователями соцсетей, соответствует определению поведенческой зависимости.\n\n> Скиннер открыл переменное подкрепление в 1938-м. Нир Эяль в 2014-м превратил это в учебник для стартапов. Соцсети встроили это в архитектуру каждого приложения.\n\nПараллельно с этим Малкольм Гладуэлл в «The Tipping Point» описал механику эпидемического распространения: у любой эпидемии есть переломный момент, после которого распространение становится лавинообразным. Facebook достиг этой точки, когда стал местом, где «все» — потому что если там все твои друзья, у тебя нет выбора, кроме как тоже быть там. Зависимость индивидуальная плюс социальное давление коллективное — вот почему соцсети так трудно покинуть.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["social-graph", "psychology", "addiction", "platforms"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "chronicle", "sceneIndex": 1, "type": "media", "shortTitle": "Хроника", "era": "2003→2020-е", "lensWeight": {"chronology": 5, "psychology": 3, "bonds": 3, "health": 3, "reality": 2}, "title": "Хроника соцсетей: от Friendster до TikTok", "insight": "За 20 лет соцсети последовательно захватили все слои социальной жизни. К 2020-м средний человек проводил в них более двух часов в день — больше любой другой активности кроме сна и работы.", "thesis": "За 20 лет соцсети последовательно захватили все слои социальной жизни. К 2020-м средний человек проводил в них более двух часов в день — больше любой другой активности кроме сна и работы.", "body": "## Двадцать лет, которые изменили социальную жизнь\n\nЗа двадцать лет — с 2002 по 2022 год — социальные сети прошли путь от студенческой забавы до глобальной инфраструктуры, которой пользуются пять миллиардов человек. Каждая волна была быстрее предыдущей. Каждая платформа захватывала новый слой социальной жизни.\n\nПервой массовой социальной сетью в современном смысле стал Friendster — запущен в 2002 году в США. Идея казалась революционной: профиль, список друзей, возможность видеть друзей друзей. За три месяца — три миллиона пользователей. Это был взрыв для своего времени. Но Friendster не выдержал собственного успеха: серверы падали, страницы грузились по минуте, пользователи уходили разочарованными. Технология не успела за спросом.\n\nВ 2003 году появился MySpace — и быстро стал крупнейшей социальной сетью мира. Его отличие: максимальная свобода кастомизации. Каждый мог оформить профиль как угодно — свои цвета, своя музыка на фоне, своё оформление. MySpace стал домом для музыкантов, художников, субкультур. В 2005 году медиамагнат Руперт Мёрдок купил его за 580 миллионов долларов — на пике хайпа. Через пять лет MySpace был мёртв. Его убил Facebook — чистотой, простотой и алгоритмом.\n\nВ том же 2003-м LinkedIn тихо запустился для профессиональных связей. Без яркого дизайна, без развлечений — только резюме и контакты. Казалось, скучно. Но LinkedIn нашёл нишу и занял её навсегда: к 2023 году более 900 миллионов пользователей.\n\n## Facebook, Twitter, YouTube, Instagram\n\n2004 год. Марк Цукерберг запускает TheFacebook.com из комнаты в гарвардском общежитии. Через неделю — половина студентов Гарварда зарегистрированы. Механика гениальная: настоящие имена, настоящие фотографии, настоящие связи. Никаких псевдонимов. Это не анонимное пространство — это цифровое отражение реальной социальной жизни.\n\nК 2012 году — миллиард пользователей. Кнопка «Войти через Facebook» появилась на миллионах сайтов. Выйти из Facebook стало означать выпасть из социальной жизни.\n\n2005 год. Три бывших сотрудника PayPal создают YouTube. Первое видео — восемнадцать секунд в зоопарке. Через год Google покупает его за 1,65 миллиарда долларов — тогда казалось безумием. YouTube сломал монополию телевидения: любой человек с камерой может вещать на глобальную аудиторию. К 2023 году — 500 часов видео загружаются каждую минуту.\n\n2006 год. Джек Дорси публикует первый твит. Twitter превратился в глобальную площадь реального времени — журналисты, политики, учёные говорили напрямую с аудиторией без редакторов. Арабская весна организовывалась через Twitter. Землетрясения сначала появлялись там — и только потом в новостях.\n\n2010 год. Instagram — квадратные фото, фильтры, никакого текста. Facebook покупает его в 2012 году за миллиард. Instagram изменил визуальную культуру: рестораны проектировали интерьеры «для Instagram», туристические места оценивались по «инстаграмности».\n\n## ВКонтакте, Telegram и TikTok\n\n2006 год. Павел Дуров запускает ВКонтакте для студентов Петербургского университета. Для десятков миллионов людей в России, Украине и постсоветских странах ВКонтакте стал первым интернетом — местом, где формировались цифровые привычки целого поколения. История Дурова с ВКонтакте закончилась конфликтом с государством в 2014 году. Он уехал — и создал Telegram. О нём мы поговорим в следующих главах.\n\n2016 год в Китае, 2018-й — глобальный запуск TikTok. Это радикальный сдвиг: главная лента — «For You Page» — показывает тебе видео совершенно незнакомых людей, отобранных алгоритмом на основе твоего поведения. Ты не выбираешь, что смотреть — алгоритм решает. Среднее время в TikTok — более 90 минут в день. TikTok поставил вопрос, который раньше не звучал так остро: что происходит, когда алгоритм, формирующий реальность миллиардов, принадлежит компании в юрисдикции другого государства?\n\n> За двадцать лет соцсети захватили последовательно все слои социальной жизни: профессиональные связи, дружба, публичный дискурс, видео, визуальная идентичность, развлечение. К середине 2020-х средний человек проводил в них более двух часов в день.\n\nЭто больше, чем любая другая активность в жизни человека — кроме сна и работы. Ни одна технология в истории не занимала столько времени у столь многих людей.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["social-graph", "history", "platforms", "telegram"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "dunbar", "sceneIndex": 2, "type": "privacy", "shortTitle": "Данбар", "era": "1992", "lensWeight": {"chronology": 2, "psychology": 2, "bonds": 5, "health": 3, "reality": 1}, "title": "Данбар: тысяча друзей против ста пятидесяти", "insight": "Данбар доказал: мозг создан для 150 отношений. Тысяча «друзей» в соцсетях не расширяет этот предел — она делает каждый контакт поверхностным и усиливает одиночество.", "thesis": "Данбар доказал: мозг создан для 150 отношений. Тысяча «друзей» в соцсетях не расширяет этот предел — она делает каждый контакт поверхностным и усиливает одиночество.", "body": "## Число, которое не изменилось за миллион лет\n\nВ 1992 году британский антрополог Роберт Данбар опубликовал исследование, которое стало одним из самых цитируемых в антропологии. Он изучал размер неокортекса — части мозга, отвечающей за социальное познание — у различных видов приматов. И обнаружил чёткую корреляцию: чем больше неокортекс относительно размера мозга, тем большими социальными группами живёт вид.\n\nДля человека Данбар вычислил это число: около 150. Именно столько стабильных социальных отношений способен поддерживать человеческий мозг одновременно. Не просто «знакомых» — а людей, чью жизненную ситуацию ты отслеживаешь, с кем у тебя есть история, кому ты доверяешь на определённом уровне.\n\nЭто число — 150 — называют «числом Данбара». Оно воспроизводится в самых разных контекстах. Размер эффективных военных подразделений на протяжении истории — около 150 человек. Размер традиционных деревень охотников-собирателей — около 150 человек. Размер сплочённых религиозных общин — около 150 человек. Не потому что кто-то так решил. Просто потому что это предел того, что наш мозг способен обработать.\n\n## Что происходит с мозгом при тысяче «друзей»\n\nТеперь посмотри на свой Facebook или Instagram. Сколько у тебя «друзей» или подписчиков? Сотни? Тысячи? Социальные сети дали нам возможность поддерживать связи с количеством людей, в пять-двадцать раз превышающим наш когнитивный предел.\n\nНаш мозг не изменился. Эволюция не успела за технологиями. Что происходит, когда человек пытается управлять социальной жизнью, превышающей его когнитивные возможности в десять раз? Он начинает упрощать. Реагировать быстро, поверхностно, эмоционально. Лайк вместо разговора. Реакция вместо понимания. Публичный комментарий вместо личного сообщения.\n\nЭто не лень и не деградация. Это нейробиологическая перегрузка. Мозг делает то единственное, что может: упрощает сигналы до минимума. Вместо сложного эмоционального взаимодействия — нажать сердечко. Вместо искреннего разговора — написать «поздравляю!» под фотографией.\n\nПоэтому тысяча друзей в соцсетях не делает нас счастливее или менее одинокими. Исследования — включая работы, на которые ссылается Хайдт — показывают обратное: рост числа онлайн-«связей» коррелирует с ростом ощущения одиночества. Потому что мозг не может отличить поверхностный онлайн-контакт от настоящей связи — он просто перегружается и отключается эмоционально.\n\nДобавь к этому то, что Гладуэлл описал в «The Tipping Point»: после того как платформа достигает критической массы, присутствие в ней становится социальной необходимостью. Ты не выбираешь быть в Facebook из-за качества взаимодействия. Ты там, потому что там все. А значит, ты обречён бесконечно скроллить ленту из людей, с которыми у тебя «связь» без реальной связи.\n\n> Данбар показал: наш мозг создан для 150 отношений. Соцсети дали нам тысячи — и сделали каждое из них поверхностным. Больше связей не означает меньше одиночества.\n\nЭто объясняет один из главных парадоксов эпохи соцсетей: мы никогда не были так «связаны» — и никогда не чувствовали себя так одинокими. Эпидемия одиночества, которую фиксируют психологи по всему миру с начала 2010-х, совпадает по времени с массовым распространением смартфонов и соцсетей. Это не случайность.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["psychology", "social-graph", "neuroscience", "community"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "haidt", "sceneIndex": 3, "type": "power", "shortTitle": "Хайдт", "era": "2012→", "lensWeight": {"chronology": 4, "psychology": 4, "bonds": 3, "health": 5, "reality": 2}, "title": "Хайдт: тревожное поколение", "insight": "Хайдт собрал данные из десятков стран: с 2012 года — резкий рост тревожности и депрессии среди подростков. Это совпадает с массовым распространением смартфонов и Instagram.", "thesis": "Хайдт собрал данные из десятков стран: с 2012 года — резкий рост тревожности и депрессии среди подростков. Это совпадает с массовым распространением смартфонов и Instagram.", "body": "## Данные, которые изменили разговор\n\nДжонатан Хайдт — социальный психолог из Нью-Йоркского университета. В 2024 году он опубликовал книгу «The Anxious Generation» — «Тревожное поколение». Это не паника взрослых по поводу новых технологий. Это многолетнее систематическое исследование данных, которое пришло к выводу, трудному для оспаривания.\n\nПримерно с 2012 года — когда смартфоны стали действительно массовыми и Instagram набрал критическую аудиторию — уровень депрессии, тревожности и самоповреждений среди подростков начал расти во всех западных странах одновременно. Хайдт собрал данные из США, Великобритании, Канады, Австралии, Новой Зеландии, Скандинавии. Везде одна и та же кривая — резкий перелом примерно в 2012–2013 годах.\n\nНе в одной стране — во всех. Не у мальчиков — особенно у девочек. Не постепенно — резко, как перелом на графике. Совпадение по времени с массовым распространением смартфонов и соцсетей слишком точное, чтобы быть случайным.\n\n## Механизмы: как это работает\n\nХайдт описывает несколько конкретных механизмов, через которые соцсети влияют на психологическое здоровье подростков.\n\nПостоянное социальное сравнение. В Instagram люди публикуют лучшие моменты своей жизни — отфильтрованные, отредактированные, тщательно подобранные. Подросток видит ленту, состоящую из идеальных тел, идеальных отпусков, идеальных отношений. Его собственная жизнь, наблюдаемая изнутри с её скучными буднями и неуверенностью, выглядит убого по сравнению. Это сравнение бесконечное и неравное: ты сравниваешь свои будни с чужими праздниками.\n\nПубличная оценка через лайки. Самооценка подростка — и без того нестабильная в силу возраста — оказывается буквально привязана к числу на экране. Опубликовал фото и получил мало лайков — это публичное свидетельство того, что ты недостаточно популярен, недостаточно красив, недостаточно интересен. Это социальное отвержение в реальном времени, доступное для всех.\n\nЗамена живого общения цифровым. Живое общение — с его неловкостью, паузами, необходимостью читать эмоции — развивает эмоциональный интеллект. Текстовые взаимодействия его не развивают. Поколение, выросшее с телефоном вместо встреч, приходит во взрослую жизнь с дефицитом навыков реального общения — и это только усиливает тревогу в социальных ситуациях.\n\nКруглосуточная доступность. До смартфонов у детей было убежище: школьная травля заканчивалась в шесть вечера, когда ты приходил домой. Теперь нет. Телефон в кармане означает, что унижение, исключение, травля — доступны 24 часа в сутки, семь дней в неделю. Нет места, где можно укрыться.\n\nАдам Альтер в «Irresistible» добавляет: это не просто психологический ущерб. По клиническим критериям то, что происходит с подростками — навязчивое возвращение к телефону, потеря контроля над временем, продолжение несмотря на осознанный вред — соответствует определению поведенческой зависимости. Мы дали детям аддиктивное устройство и удивляемся результатам.\n\n> Хайдт собрал данные из десятков стран: с 2012 года эпидемия тревожности и депрессии среди подростков совпадает по времени с массовым распространением смартфонов и Instagram. Это не случайность.\n\nМы провели масштабный социальный эксперимент над детьми — без их согласия и без понимания последствий. Результаты этого эксперимента сейчас видны в статистике психиатрических больниц по всему миру.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["psychology", "mental-health", "social-graph", "media"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "kotler", "sceneIndex": 4, "type": "media", "shortTitle": "Котлер 4.0/5.0", "era": "2016→2021", "lensWeight": {"chronology": 3, "psychology": 3, "bonds": 2, "health": 1, "reality": 3}, "title": "Котлер 4.0 и 5.0: маркетинг в эпоху соцсетей", "insight": "Котлер 4.0 зафиксировал: доверие перешло от брендов к людям. Котлер 5.0 описал персонализацию до одного человека — инструмент, который одинаково работает как как забота и как манипуляция.", "thesis": "Котлер 4.0 зафиксировал: доверие перешло от брендов к людям. Котлер 5.0 описал персонализацию до одного человека — инструмент, который одинаково работает как как забота и как манипуляция.", "body": "## Когда доверие перешло от брендов к людям\n\nФилип Котлер не остановился на «Маркетинге 3.0». Соцсети изменили правила игры настолько фундаментально, что потребовалось переосмысление заново — дважды.\n\nВ «Маркетинге 4.0» (2016) Котлер зафиксировал трансформацию, которую произвели соцсети в отношениях бренда и покупателя. Маркетинг 3.0 открыл: люди покупают ценности, а не товары. Маркетинг 4.0 добавил: в эпоху соцсетей путь покупателя стал нелинейным и коллективным.\n\nРаньше путь покупателя был предсказуемым: увидел рекламу → заинтересовался → пришёл в магазин → купил. Бренд контролировал каждый шаг. Теперь человек видит пост другого покупателя в Instagram → читает отзывы незнакомцев на маркетплейсе → смотрит обзор блогера на YouTube → обсуждает в комментариях → только потом, может быть, покупает. На каждом шагу бренд не контролирует разговор. Разговор ведут другие люди.\n\nЭто изменило всё. Инфлюенсер с искренней аудиторией в сто тысяч подписчиков оказывается эффективнее телевизионного ролика за миллион долларов. Не потому что у него больше охват — а потому что его слушатели ему доверяют. Доверие перешло от брендов к людям. Это необратимый сдвиг.\n\nКотлер описывает новую модель пути покупателя: Aware → Appeal → Ask → Act → Advocate. Ты узнаёшь о продукте (Aware), он тебя привлекает (Appeal), ты спрашиваешь мнение других (Ask), покупаешь (Act) — и если доволен, становишься его амбассадором (Advocate). Advocate замыкает цикл: он создаёт контент, который запускает путь для следующего покупателя. Клиент стал частью маркетинговой машины.\n\n## Маркетинг 5.0: один на один с каждым\n\nВ «Маркетинге 5.0» (2021) Котлер описал следующий уровень: технологии — ИИ, большие данные, автоматизация — позволяют персонализировать коммуникацию до уровня одного человека в реальном времени.\n\nРаньше таргетинг выглядел так: «Реклама для мужчин 25–35 лет с интересом к спорту». Грубо, неточно, неэффективно. Современный маркетинг 5.0 работает иначе: «Это сообщение для Ивана, 28 лет, который три раза смотрел обзоры кроссовок на YouTube, искал скидки в Google в прошлую пятницу, и чьи друзья в Instagram недавно публиковали фото с пробежек. Покажи ему это предложение в 7:30 утра в понедельник, когда он едет на работу».\n\nКотлер видел в этом возможность: технологии наконец могут по-настоящему служить людям. Дать каждому именно то, что ему нужно, когда ему нужно. Персонализация как забота.\n\nНо это же описание — с точностью до запятой — инструмента максимально точной манипуляции. Разница только в намерении того, кто его использует. Один и тот же инструмент может помочь человеку найти нужный продукт — или незаметно сформировать у него потребность, которой у него не было.\n\nИ здесь возникает вопрос, который Котлер ставит, но не отвечает на него полностью: кто контролирует, в чьих интересах работает эта персонализация? В интересах покупателя — или в интересах продающего?\n\n> Котлер зафиксировал: маркетинг 4.0 отдал власть людям через соцсети. Маркетинг 5.0 попытался вернуть её через ИИ. Вопрос в том, чьим интересам служит этот инструмент.\n\nЭто противоречие — между технологией как инструментом заботы и технологией как инструментом манипуляции — проходит через всю историю цифровой эпохи. И именно его пытается разрешить Web3: через децентрализацию, через собственность на данные, через прозрачность алгоритмов.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["marketing", "social-graph", "platforms", "psychology"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "sunstein", "sceneIndex": 5, "type": "power", "shortTitle": "Санстейн", "era": "2001→2017", "lensWeight": {"chronology": 3, "psychology": 2, "bonds": 2, "health": 2, "reality": 5}, "title": "Санстейн: эхо-камеры и конец общей реальности", "insight": "Санстейн показал: алгоритмы соцсетей оптимизированы на вовлечение, не на понимание — и это системно разрушает общее информационное пространство, без которого демократия невозможна.", "thesis": "Санстейн показал: алгоритмы соцсетей оптимизированы на вовлечение, не на понимание — и это системно разрушает общее информационное пространство, без которого демократия невозможна.", "body": "## Архитектурная проблема, а не политическая\n\nКэсс Санстейн — правовед и специалист по поведенческой экономике из Гарварда. В книге «#Republic» он поставил вопрос, который кажется политическим, но на самом деле является архитектурным: что происходит с демократией, когда каждый гражданин живёт в собственном информационном пузыре?\n\nДемократия предполагает определённый минимум общего. Граждане могут не соглашаться в ценностях, приоритетах и политических взглядах — это нормально и даже полезно. Но они должны соглашаться в базовой реальности. Вот произошло это событие. Вот эти данные. Вот эти факты. Только имея общую фактическую базу, можно спорить о том, что с ней делать.\n\nАлгоритмы соцсетей разрушают это общее пространство. Они оптимизированы на вовлечение — на то, чтобы ты оставался в приложении как можно дольше. А что лучше всего удерживает внимание? Контент, который вызывает сильную эмоцию: возмущение, страх, восторг, негодование. Контент, который подтверждает уже существующие убеждения. Контент, который усиливает уже существующие эмоции.\n\nВ результате алгоритм показывает каждому его персональную реальность. Не потому что кто-то так решил злонамеренно. Просто потому что это максимизирует вовлечение.\n\n## Эхо-камеры: когда ты слышишь только своё эхо\n\nСанстейн называет это «эхо-камерами». Ты попадаешь в информационное пространство, где все говорят примерно то же, что ты уже думаешь. Твои убеждения только усиливаются — потому что ты видишь бесконечное количество подтверждений. Возражений и альтернативных точек зрения почти нет — алгоритм их фильтрует, потому что они снижают вовлечение.\n\nЭто не просто неприятно. Это разрушительно для способности к суждению. Когда ты слышишь только своё эхо — ты перестаёшь понимать, что другие люди могут иметь другую картину реальности. Ты начинаешь воспринимать свою версию как единственно возможную. Людей с другими взглядами — как злонамеренных, глупых или предубеждённых.\n\nПолитическая поляризация последних лет в США, Европе и других регионах — это не случайность и не просто результат экономических проблем. Это предсказуемое следствие архитектуры, которая оптимизирована на вовлечение, а не на понимание. Алгоритм не создал поляризацию. Но он её масштабировал и ускорил.\n\nСанстейн предлагает аналогию: представь город, где все рестораны заменены автоматами, которые дают тебе то, что ты уже ел раньше. Никаких новых вкусов. Никаких неожиданных открытий. Только подтверждение уже сложившихся предпочтений. Это кажется удобным — но на самом деле сужает мир.\n\n> Санстейн показал: алгоритм не злой — он просто оптимизирован на вовлечение. Но это разрушает общее информационное пространство, без которого демократия невозможна.\n\nЭта проблема не решается регулированием или штрафами для платформ. Она встроена в архитектуру бизнес-модели: платформа зарабатывает на вовлечении, вовлечение максимизируется через эмоциональный контент, эмоциональный контент поляризует. Изменить это можно только изменив саму бизнес-модель — или создав альтернативную архитектуру.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["algorithms", "democracy", "social-graph", "media"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "baudrillard", "sceneIndex": 6, "type": "privacy", "shortTitle": "Бодрийяр", "era": "1981", "lensWeight": {"chronology": 2, "psychology": 2, "bonds": 2, "health": 3, "reality": 5}, "title": "Бодрийяр и симулякр: жизнь как контент", "insight": "Бодрийяр в 1981-м описал симулякр — образ, заменяющий реальность. В Instagram это стало буквальным: люди производят контент о жизни вместо того, чтобы её переживать.", "thesis": "Бодрийяр в 1981-м описал симулякр — образ, заменяющий реальность. В Instagram это стало буквальным: люди производят контент о жизни вместо того, чтобы её переживать.", "body": "## Философ, который описал Instagram в 1981 году\n\nЖан Бодрийяр — французский философ и социолог. В 1981 году он опубликовал книгу «Симулякры и симуляция». Это была абстрактная философская работа о природе образа и реальности в современном обществе. Instagram тогда не существовал. TikTok не существовал. Даже интернет был уделом военных и учёных.\n\nНо если читать Бодрийяра сейчас — ощущение, что он писал репортаж из 2024 года.\n\nЕго центральная идея: в современном мире образ больше не отражает реальность — он её заменяет. Бодрийяр описывал четыре стадии образа. Сначала образ отражает реальность: фотография показывает, как выглядит место. Потом образ маскирует реальность: реклама показывает идеализированную версию продукта. Потом образ маскирует отсутствие реальности: образ существует без соответствующей реальности. И наконец — симулякр: образ не имеет никакого отношения к реальности, он сам стал реальностью.\n\nСимулякр — это копия без оригинала. Образ, который не отражает ничего реального — но воспринимается как более реальный, чем сама реальность.\n\n## Гиперреальность Instagram\n\nПосмотри на то, что происходит в Instagram через оптику Бодрийяра.\n\nЧеловек едет в путешествие. Раньше — он переживал место: запахи, звуки, температура, случайные встречи. Сейчас — он фотографирует место. Он не переживает закат — он снимает закат для сторис. Не наслаждается едой — фотографирует блюдо до того, как начнёт есть. Не переживает эмоцию — думает, как она будет выглядеть в ленте.\n\nСимуляция становится важнее опыта. Образ важнее реальности. И постепенно люди начинают жить не для того, чтобы переживать — а для того, чтобы производить контент о переживании.\n\nБодрийяр назвал бы это «гиперреальностью»: состоянием, когда симуляция становится более реальной, чем сама реальность. Отфильтрованная версия жизни в Instagram становится более «настоящей», чем реальная жизнь с её несовершенством и обыденностью.\n\nЗигмунт Бауман в «Liquid Modernity» добавляет к этому измерение идентичности: в современном мире идентичность перестала быть стабильной. Ты не просто тот, кем родился и вырос. Ты постоянно конструируешь себя заново. Соцсети стали главной площадкой этого строительства — и его главным усилителем. Ты можешь быть разным в LinkedIn и Instagram, в Twitter и TikTok. Свобода — но и новый тип тревоги: где заканчивается перформанс и начинается настоящее я?\n\nЭто не просто философская абстракция. Это описание конкретного психологического состояния — «онлайн-диссоциации» — которое фиксируют психологи: ощущение, что живёшь не по-настоящему, а разыгрываешь версию себя для аудитории.\n\n> Бодрийяр в 1981 году описал то, что мы сейчас называем Instagram: мир, где образ важнее опыта, симуляция важнее реальности, а человек производит контент о жизни вместо того, чтобы её проживать.\n\nВ контексте Web3 это наблюдение важно вот почему: одно из обещаний децентрализованного интернета — вернуть людям контроль не только над данными, но и над идентичностью. Вместо симулякра для платформы — суверенная цифровая личность, которая принадлежит тебе. Но удастся ли это — вопрос открытый.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["identity", "philosophy", "social-graph", "media"], "x": 265.5, "y": 258.0, "angDeg": 218.6}], "edges": [{"from": "skinner", "to": "chronicle", "label": "механику встроили в приложения", "lenses": ["psychology", "chronology"]}, {"from": "chronicle", "to": "haidt", "label": "захват совпал с ростом тревоги", "lenses": ["chronology", "health"]}, {"from": "skinner", "to": "haidt", "label": "зависимость бьёт по психике", "lenses": ["psychology", "health"]}, {"from": "dunbar", "to": "chronicle", "label": "тысяча друзей вместо ста пятидесяти", "lenses": ["bonds", "chronology"]}, {"from": "dunbar", "to": "haidt", "label": "поверхностность усиливает одиночество", "lenses": ["bonds", "health"]}, {"from": "chronicle", "to": "kotler", "label": "доверие перешло к людям", "lenses": ["media", "chronology"]}, {"from": "kotler", "to": "sunstein", "label": "персонализация дробит реальность", "lenses": ["reality", "psychology"]}, {"from": "sunstein", "to": "baudrillard", "label": "эхо-камера рождает симулякр", "lenses": ["reality"]}, {"from": "haidt", "to": "baudrillard", "label": "жизнь заменяется контентом", "lenses": ["health", "reality"]}, {"from": "skinner", "to": "sunstein", "label": "вовлечение важнее понимания", "lenses": ["psychology", "reality"]}]};;
function renderEmptyState(reason){const empty=document.querySelector(".empty-state"),svg=document.querySelector(".system-map");
  if(!empty||!svg)return;empty.hidden=false;svg.setAttribute("hidden","");
  empty.innerHTML=`<p>${reason}</p><a href="${CHAPTER_DATA.chapter.sourceUrl}" target="_blank" rel="noreferrer">Luminara</a>`;}
</script>

<body>
<div class="stars"></div><div class="stars2"></div>
<main class="app-shell">
  <section class="rail">
    <div><p class="eyebrow">Luminara · Atlas</p><h1 id="app-title">Соцсети</h1></div>
    <p class="chapter-lede">Как связи стали продуктом, а ты — сырьём. Механика зависимости, одиночества и симулякра.</p>
    <div class="rail-rule"></div>
    <div><p class="section-h" data-ui="section_lenses">Линзы интерпретации</p><div class="lens-group" style="margin-top:9px"></div><p class="lens-desc" style="margin-top:9px"></p></div>
    <div class="rail-rule"></div>
    <div class="progress-box"></div>
    <div><p class="section-h" data-ui="section_scenes">Сцены главы</p><nav class="node-list" style="margin-top:6px"></nav></div>
  </section>
  <section class="map-stage">
    <svg class="system-map" viewBox="0 0 1120 940" role="img" preserveAspectRatio="xMidYMid meet">
      <title>До интернета</title><desc>Информация становится властью</desc>
    </svg>

</main>
<dialog class="scene-dialog"></dialog>
<script>
// --- theme from URL (?theme=light|dark & ?accent=oklch/hex) — mirrors app ---
(function(){
  try{
    var p=new URLSearchParams(location.search);
    var theme=p.get("theme"); var accent=p.get("accent");
    if(theme==="light") document.documentElement.setAttribute("data-theme","light");
    else if(theme==="dark") document.documentElement.removeAttribute("data-theme");
    if(accent){ document.documentElement.style.setProperty("--accent", decodeURIComponent(accent)); }
    // sun ink: readable on core
    document.documentElement.style.setProperty("--sun-ink", theme==="light" ? "#fff" : "#fff");
  }catch(e){}
})();
// live updates from parent (optional): postMessage {theme, accent}
window.addEventListener("message",function(ev){
  var m=ev.data||{};
  if(m.theme==="light") document.documentElement.setAttribute("data-theme","light");
  if(m.theme==="dark") document.documentElement.removeAttribute("data-theme");
  if(m.accent) document.documentElement.style.setProperty("--accent", m.accent);
  if(typeof renderAll==="function") renderAll();
});

const state={lens:"chronology",selected:null,visited:new Set(),entered:false};
const byId=id=>CHAPTER_DATA.nodes.find(n=>n.id===id);
const SVGNS="http://www.w3.org/2000/svg";
const el=(t,a)=>{const e=document.createElementNS(SVGNS,t);for(const k in(a||{}))e.setAttribute(k,a[k]);return e;};
function typeColor(t){return{power:"var(--power)",technology:"var(--technology)",media:"var(--media)",privacy:"var(--privacy)",economy:"var(--economy)"}[t]||"var(--accent)";}
function typeLabel(t){var U=window.__UI_LOC||{};var k="type_"+t;if(U[k])return U[k];return{power:"Власть",technology:"Технологии",media:"Медиа",privacy:"Приватность",economy:"Экономика"}[t]||"Идея";}
function lensById(id){return CHAPTER_DATA.lenses.find(l=>l.id===id);}
function edgeActive(e){return e.lenses.includes(state.lens);}
function nodeWeight(n){return(n.lensWeight&&n.lensWeight[state.lens])||0;}
const CX=CHAPTER_DATA.chapter.centerX||500, CY=CHAPTER_DATA.chapter.centerY||445, RING=CHAPTER_DATA.chapter.ring||300;

function buildLenses(){
  const w=document.querySelector(".lens-group");w.innerHTML="";
  CHAPTER_DATA.lenses.forEach(l=>{const b=document.createElement("button");b.className="lens-btn";b.type="button";
    b.setAttribute("aria-pressed",String(l.id===state.lens));b.style.setProperty("--dot",l.accent);
    b.innerHTML=`<span class="lens-dot"></span>${l.label}`;b.addEventListener("click",()=>setLens(l.id));w.appendChild(b);});
}
function setLens(id){state.lens=id;const l=lensById(id);
  const d=document.querySelector(".lens-desc");if(d)d.textContent=l?l.description:"";
  document.querySelectorAll(".lens-btn").forEach((b,i)=>b.setAttribute("aria-pressed",String(CHAPTER_DATA.lenses[i].id===id)));
  renderAll();}

function curve(a,b){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;const dx=mx-CX,dy=my-CY,len=Math.hypot(dx,dy)||1;const bow=26;
  return `M ${a.x} ${a.y} Q ${mx+(dx/len)*bow} ${my+(dy/len)*bow} ${b.x} ${b.y}`;}

function defs(){
  const d=el("defs");
  const mk=(id,color)=>{color=lensById(state.lens)?lensById(state.lens).accent:"#888";const m=el("marker",{id,viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"});
    const p=el("path",{d:"M0 0 L10 5 L0 10 z",fill:color});m.appendChild(p);return m;};
  d.appendChild(mk("arrow-active", "var(--dot-fallback)"));
  var sg=el("radialGradient",{id:"sunGrad",cx:"50%",cy:"42%",r:"60%"});
  var css=getComputedStyle(document.documentElement);
  sg.appendChild(el("stop",{offset:"0%","stop-color":css.getPropertyValue("--bg-elev")||"#20264a"}));
  sg.appendChild(el("stop",{offset:"100%","stop-color":css.getPropertyValue("--bg")||"#0c1230"}));
  d.appendChild(sg);
  return d;
}

function renderMap(){
  const svg=document.querySelector(".system-map");if(!svg)return;
  [...svg.querySelectorAll("defs,g,.ring,.ring-tick,.era-label,.spoke")].forEach(n=>n.remove());
  svg.appendChild(defs());
  // rings
  const gDeco=el("g",{});
  [RING*0.55,RING].forEach(r=>gDeco.appendChild(el("circle",{class:"ring",cx:CX,cy:CY,r})));
  svg.appendChild(gDeco);
  // spokes + chronology era labels around outer ring
  const gSpoke=el("g",{});
  CHAPTER_DATA.nodes.forEach(n=>{
    gSpoke.appendChild(el("line",{class:"spoke",x1:CX,y1:CY,x2:n.x,y2:n.y}));
  });
  svg.appendChild(gSpoke);

  // edges (with directional arrows on active)
  const gE=el("g",{});
  CHAPTER_DATA.edges.forEach(e=>{const a=byId(e.from),b=byId(e.to);if(!a||!b)return;
    const active=edgeActive(e);const g=el("g",{class:"edge"+(active?" active":"")});
    if(active)g.style.setProperty("--dot",lensById(state.lens).accent);
    const d=curve(a,b);const p=el("path",{d});
    // approximate length for draw animation
    const len=Math.round(Math.hypot(b.x-a.x,b.y-a.y)*1.15);
    p.style.setProperty("--len",len);
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const lb=el("text",{class:"edge-label",x:mx,y:my-5,"text-anchor":"middle"});lb.textContent=e.label;
    g.appendChild(p);g.appendChild(lb);gE.appendChild(g);});
  svg.appendChild(gE);

  // center (breathing, lens-tinted ring)
  const gC=el("g",{});
  gC.style.setProperty("--dot", lensById(state.lens)?lensById(state.lens).accent:"#b7791f");
  gC.appendChild(el("circle",{class:"sun-glow",cx:CX,cy:CY,r:100}));
  gC.appendChild(el("circle",{class:"sun-ring",cx:CX,cy:CY,r:82}));
  gC.appendChild(el("circle",{class:"sun-core",cx:CX,cy:CY,r:70}));/*no sublabel*/
  
  wrapText(gC,CHAPTER_DATA.chapter.centralIdea,CX,CY+2,120,"sun-t1",17);
  svg.appendChild(gC);

  // nodes with smart outward labels + era
  const gN=el("g",{});
  CHAPTER_DATA.nodes.forEach((n,i)=>{
    const g=el("g",{class:"node"+(state.selected===n.id?" selected":""),tabindex:"0",role:"button","aria-label":`${n.sceneIndex+1}. ${n.title} (${n.era||""})`});
    g.style.setProperty("--dot",typeColor(n.type));
    g.style.setProperty("--ox",n.x+"px");g.style.setProperty("--oy",n.y+"px");
    if(!state.entered) g.style.setProperty("--delay",(0.15+i*0.06)+"s"); else g.style.animation="none",g.style.opacity="1";
    if(state.selected){const linked=CHAPTER_DATA.edges.some(e=>(e.from===state.selected&&e.to===n.id)||(e.to===state.selected&&e.from===n.id));
      if(n.id!==state.selected&&!linked)g.classList.add("dim");}
    else if(nodeWeight(n)<=1){g.classList.add("dim");}
    g.appendChild(el("circle",{class:"planet-glow",cx:n.x,cy:n.y,r:34}));
    var pl=el("circle",{class:"planet",cx:n.x,cy:n.y,r:26});pl.style.fill="color-mix(in oklch, "+typeColor(n.type)+" 20%, var(--bg-elev))";g.appendChild(pl);
    const num=el("text",{class:"num",x:n.x,y:n.y});num.textContent=String(n.sceneIndex+1);g.appendChild(num);

    // smart label placement: outward along the radius from center
    const dx=n.x-CX,dy=n.y-CY,len=Math.hypot(dx,dy)||1;
    const ux=dx/len,uy=dy/len;
    const lx=n.x+ux*46, ly=n.y+uy*46;
    // anchor by horizontal side
    const anchor = ux>0.25?"start":(ux<-0.25?"end":"middle");
    const era=el("text",{class:"era",x:lx,y:ly-30,"text-anchor":anchor});era.textContent=n.era||"";g.appendChild(era);
    const kick=el("text",{class:"kicker",x:lx,y:ly-14,"text-anchor":anchor});kick.textContent=typeLabel(n.type);g.appendChild(kick);
    wrapTextAnchored(g,n.shortTitle,lx,ly+20,180,"cap",18,anchor);

    g.addEventListener("click",()=>selectNode(n.id));
    g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();selectNode(n.id);}});
    gN.appendChild(g);
  });
  svg.appendChild(gN);
  state.entered=true;
}
function wrapText(parent,text,x,y,maxw,cls,fs){wrapTextAnchored(parent,text,x,y,maxw,cls,fs,"middle");}
function wrapTextAnchored(parent,text,x,y,maxw,cls,fs,anchor){
  const words=String(text).split(/\s+/);const lines=[];let line="";
  const approx=s=>s.length*(fs*0.56);
  words.forEach(w=>{const t=line?line+" "+w:w;if(approx(t)>maxw&&line){lines.push(line);line=w;}else line=t;});
  if(line)lines.push(line);const total=(lines.length-1)*(fs+2);
  lines.forEach((ln,i)=>{const t=el("text",{class:cls,x,y:y-total/2+i*(fs+2),"text-anchor":anchor});t.textContent=ln;parent.appendChild(t);});
}

const CHAPTER_I18N = {"ru": {"chapter": {"key": "social", "title": "Соцсети", "lede": "Как связи стали продуктом, а ты — сырьём. Механика зависимости, одиночества и симулякра.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=social", "centralIdea": "Связи стали продуктом, а ты — сырьём", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Хронология", "accent": "#7dd3fc", "description": "От Friendster до TikTok: как соцсети захватили каждый слой жизни."}, {"id": "psychology", "label": "Психология", "accent": "#f87171", "description": "Скиннер и переменное подкрепление: лайк работает как игровой автомат."}, {"id": "bonds", "label": "Связи", "accent": "#c084fc", "description": "Данбар: мозг создан для 150 отношений, а не для тысячи «друзей»."}, {"id": "health", "label": "Здоровье", "accent": "#34d399", "description": "Хайдт: тревожное поколение — рост тревоги и депрессии с 2012 года."}, {"id": "reality", "label": "Реальность", "accent": "#fbbf24", "description": "Санстейн и Бодрийяр: эхо-камеры и жизнь, заменённая контентом."}], "nodes": [{"id": "skinner", "sceneIndex": 0, "type": "power", "shortTitle": "Скиннер", "era": "1938→", "lensWeight": {"chronology": 2, "psychology": 5, "bonds": 1, "health": 3, "reality": 1}, "title": "Скиннер и лайк: механика зависимости", "insight": "Скиннер открыл переменное подкрепление в 1938-м. Соцсети встроили его в каждое приложение — лайк работает точно так же, как игровой автомат.", "thesis": "Скиннер открыл переменное подкрепление в 1938-м. Соцсети встроили его в каждое приложение — лайк работает точно так же, как игровой автомат.", "body": "## Крыса в ящике и ты с телефоном\n\nВ 1938 году американский психолог Б. Ф. Скиннер провёл серию экспериментов, которые стали одними из самых важных в истории науки о поведении. Он сажал крыс в специальные ящики и наблюдал, как они учатся нажимать на рычаг в зависимости от того, какую награду получают.\n\nПервый вариант: нажал на рычаг — получил еду. Всегда. Предсказуемо. Крыса быстро научилась нажимать — и нажимала именно тогда, когда была голодна. Никакой навязчивости, никакой зависимости.\n\nВторой вариант: нажал на рычаг — иногда получаешь еду, иногда нет. Случайно. Непредсказуемо. И вот здесь произошло кое-что поразительное: крыса начинала нажимать на рычаг одержимо. Снова и снова. Даже когда не была голодна. Даже когда еда не приходила подолгу — крыса не прекращала. Скиннер назвал это «прерывистым расписанием подкрепления» и назвал его самым мощным механизмом формирования поведения, который он когда-либо наблюдал.\n\nТеперь замени крысу на тебя. Рычаг — на кнопку «обновить ленту». Еду — на лайк, интересный пост, сообщение от друга. Ты открываешь Instagram — и иногда там что-то интересное, иногда скучное, иногда лайк от кого-то важного, иногда ничего. Ты не знаешь заранее. Именно эта непредсказуемость и держит тебя.\n\n## Нир Эяль систематизировал это в учебник\n\nНир Эяль в 2014 году написал книгу «Hooked» — и был совершенно откровенен в своих намерениях. Это руководство для стартапов: как создавать продукты, к которым люди возвращаются без напоминания и без внешнего стимула.\n\nМодель Эяля называется «крючок» — четыре шага, которые повторяются снова и снова. Триггер: внешний (уведомление, письмо) или внутренний (скука, тревога, одиночество) — запускает действие. Действие: открыть приложение, прокрутить ленту, опубликовать фото — минимальное усилие, максимальная простота. Переменная награда: иногда интересно, иногда нет, иногда лайк, иногда тишина — непредсказуемость Скиннера в действии. Инвестиция: ты добавляешь контент, отмечаешь людей, настраиваешь профиль — и тем самым делаешь продукт ценнее для себя и труднее для отказа.\n\nЭяль написал это как учебник — открыто и без извинений. Инженеры соцсетей изучали эту модель. Некоторые позже признавались, что испытывали угрызения совести, применяя её. Один из бывших вице-президентов Facebook Чамат Палихапития в 2017 году публично сказал: «Мы создали инструменты, которые разрывают социальную ткань общества». Его дети не пользуются соцсетями.\n\nАдам Альтер в книге «Irresistible» (2017) пошёл дальше и задал жёсткий вопрос: а это вообще нормально — проектировать продукты с использованием тех же принципов, что лежат в основе зависимости от игровых автоматов? По клиническим критериям — навязчивое возвращение, потеря контроля над временем, продолжение несмотря на осознанный вред, синдром отмены при отказе — то, что происходит с многими пользователями соцсетей, соответствует определению поведенческой зависимости.\n\n> Скиннер открыл переменное подкрепление в 1938-м. Нир Эяль в 2014-м превратил это в учебник для стартапов. Соцсети встроили это в архитектуру каждого приложения.\n\nПараллельно с этим Малкольм Гладуэлл в «The Tipping Point» описал механику эпидемического распространения: у любой эпидемии есть переломный момент, после которого распространение становится лавинообразным. Facebook достиг этой точки, когда стал местом, где «все» — потому что если там все твои друзья, у тебя нет выбора, кроме как тоже быть там. Зависимость индивидуальная плюс социальное давление коллективное — вот почему соцсети так трудно покинуть.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/sea  "tags": ["social-graph", "psychology", "addiction", "platforms"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "chronicle", "sceneIndex": 1, "type": "media", "shortTitle": "Хроника", "era": "2003→2020-е", "lensWeight": {"chronology": 5, "psychology": 3, "bonds": 3, "health": 3, "reality": 2}, "title": "Хроника соцсетей: от Friendster до TikTok", "insight": "За 20 лет соцсети последовательно захватили все слои социальной жизни. К 2020-м средний человек проводил в них более двух часов в день — больше любой другой активности кроме сна и работы.", "thesis": "За 20 лет соцсети последовательно захватили все слои социальной жизни. К 2020-м средний человек проводил в них более двух часов в день — больше любой другой активности кроме сна и работы.", "body": "## Двадцать лет, которые изменили социальную жизнь\n\nЗа двадцать лет — с 2002 по 2022 год — социальные сети прошли путь от студенческой забавы до глобальной инфраструктуры, которой пользуются пять миллиардов человек. Каждая волна была быстрее предыдущей. Каждая платформа захватывала новый слой социальной жизни.\n\nПервой массовой социальной сетью в современном смысле стал Friendster — запущен в 2002 году в США. Идея казалась революционной: профиль, список друзей, возможность видеть друзей друзей. За три месяца — три миллиона пользователей. Это был взрыв для своего времени. Но Friendster не выдержал собственного успеха: серверы падали, страницы грузились по минуте, пользователи уходили разочарованными. Технология не успела за спросом.\n\nВ 2003 году появился MySpace — и быстро стал крупнейшей социальной сетью мира. Его отличие: максимальная свобода кастомизации. Каждый мог оформить профиль как угодно — свои цвета, своя музыка на фоне, своё оформление. MySpace стал домом для музыкантов, художников, субкультур. В 2005 году медиамагнат Руперт Мёрдок купил его за 580 миллионов долларов — на пике хайпа. Через пять лет MySpace был мёртв. Его убил Facebook — чистотой, простотой и алгоритмом.\n\nВ том же 2003-м LinkedIn тихо запустился для профессиональных связей. Без яркого дизайна, без развлечений — только резюме и контакты. Казалось, скучно. Но LinkedIn нашёл нишу и занял её навсегда: к 2023 году более 900 миллионов пользователей.\n\n## Facebook, Twitter, YouTube, Instagram\n\n2004 год. Марк Цукерберг запускает TheFacebook.com из комнаты в гарвардском общежитии. Через неделю — половина студентов Гарварда зарегистрированы. Механика гениальная: настоящие имена, настоящие фотографии, настоящие связи. Никаких псевдонимов. Это не анонимное пространство — это цифровое отражение реальной социальной жизни.\n\nК 2012 году — миллиард пользователей. Кнопка «Войти через Facebook» появилась на миллионах сайтов. Выйти из Facebook стало означать выпасть из социальной жизни.\n\n2005 год. Три бывших сотрудника PayPal создают YouTube. Первое видео — восемнадцать секунд в зоопарке. Через год Google покупает его за 1,65 миллиарда долларов — тогда казалось безумием. YouTube сломал монополию телевидения: любой человек с камерой может вещать на глобальную аудиторию. К 2023 году — 500 часов видео загружаются каждую минуту.\n\n2006 год. Джек Дорси публикует первый твит. Twitter превратился в глобальную площадь реального времени — журналисты, политики, учёные говорили напрямую с аудиторией без редакторов. Арабская весна организовывалась через Twitter. Землетрясения сначала появлялись там — и только потом в новостях.\n\n2010 год. Instagram — квадратные фото, фильтры, никакого текста. Facebook покупает его в 2012 году за миллиард. Instagram изменил визуальную культуру: рестораны проектировали интерьеры «для Instagram», туристические места оценивались по «инстаграмности».\n\n## ВКонтакте, Telegram и TikTok\n\n2006 год. Павел Дуров запускает ВКонтакте для студентов Петербургского университета. Для десятков миллионов людей в России, Украине и постсоветских странах ВКонтакте стал первым интернетом — местом, где формировались цифровые привычки целого поколения. История Дурова с ВКонтакте закончилась конфликтом с государством в 2014 году. Он уехал — и создал Telegram. О нём мы поговорим в следующих главах.\n\n2016 год в Китае, 2018-й — глобальный запуск TikTok. Это радикальный сдвиг: главная лента — «For You Page» — показывает тебе видео совершенно незнакомых людей, отобранных алгоритмом на основе твоего поведения. Ты не выбираешь, что смотреть — алгоритм решает. Среднее время в TikTok — более 90 минут в день. TikTok поставил вопрос, который раньше не звучал так остро: что происходит, когда алгоритм, формирующий реальность миллиардов, принадлежит компании в юрисдикции другого государства?\n\n> За двадцать лет соцсети захватили последовательно все слои социальной жизни: профессиональные связи, дружба, публичный дискурс, видео, визуальная идентичность, развлечение. К середине 2020-х средний человек проводил в них более двух часов в день.\n\nЭто больше, чем любая другая активность в жизни человека — кроме сна и работы. Ни одна технология в истории не занимала столько времени у столь многих людей.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The Anxious Generation (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%BE%D0%BD%D0%B0%D1%82%D0%B0%D0%BD%20%D0%A5%D0%B0%D0%B9%D0%B4%D1%82%20%E2%80%94%20The%20Anxious%20Generation%20%282024%29", "linkType": "gbooks"}, {"title": "Адам Альтер — Irresistible (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%B4%D0%B0%D0%BC%20%D0%90%D0%BB%D1%8C%D1%82%D0%B5%D1%80%20%E2%80%94%20Irresistible%20%282017%29", "linkType": "gbooks"}, {"title": "Филип Котлер — Маркетинг 4.0 (2016) и Маркетинг 5.0 (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A4%D0%B8%D0%BB%D0%B8%D0%BF%20%D0%9A%D0%BE%D1%82%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%204.0%20%282016%29%20%D0%B8%20%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%D0%B8%D0%BD%D0%B3%205.0%20%282021%29", "linkType": "gbooks"}, {"title": "Б. Ф. Скиннер — The Behavior of Organisms (1938)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91.%20%D0%A4.%20%D0%A1%D0%BA%D0%B8%D0%BD%D0%BD%D0%B5%D1%80%20%E2%80%94%20The%20Behavior%20of%20Organisms%20%281938%29", "linkType": "gbooks"}, {"title": "Роберт Данбар — Neocortex size as a constraint on group size in primates (1992)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%94%D0%B0%D0%BD%D0%B1%D0%B0%D1%80%20%E2%80%94%20Neocortex%20size%20as%20a%20constraint%20on%20group%20size%20in%20primates%20%281992%29", "linkType": "gbooks"}, {"title": "Кэсс Санстейн — #Republic (2017)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%8D%D1%81%D1%81%20%D0%A1%D0%B0%D0%BD%D1%81%D1%82%D0%B5%D0%B9%D0%BD%20%E2%80%94%20%23Republic%20%282017%29", "linkType": "gbooks"}, {"title": "Малкольм Гладуэлл — The Tipping Point (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BB%D0%BA%D0%BE%D0%BB%D1%8C%D0%BC%20%D0%93%D0%BB%D0%B0%D0%B4%D1%83%D1%8D%D0%BB%D0%BB%20%E2%80%94%20The%20Tipping%20Point%20%282000%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман — Liquid Modernity (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%20%E2%80%94%20Liquid%20Modernity%20%282000%29", "linkType": "gbooks"}, {"title": "Жан Бодрийяр — Симулякры и симуляция (1981)", "url": "https://www.google.com/search?tbm=bks&q=%D0%96%D0%B0%D0%BD%20%D0%91%D0%BE%D0%B4%D1%80%D0%B8%D0%B9%D1%8F%D1%80%20%E2%80%94%20%D0%A1%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D0%BA%D1%80%D1%8B%20%D0%B8%20%D1%81%D0%B8%D0%BC%D1%83%D0%BB%D1%8F%D1%86%D0%B8%D1%8F%20%281981%29", "linkType": "gbooks"}], "tags": ["social-graph", "history", "platforms", "telegram"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "dunbar", "sceneIndex": 2, "type": "privacy", "shortTitle": "Данбар", "era": "1992", "lensWeight": {"chronology": 2, "psychology": 2, "bonds": 5, "health": 3, "reality": 1}, "title": "Данбар: тысяча друзей против ста пятидесяти", "insight": "Данбар доказал: мозг создан для 150 отношений. Тысяча «друзей» в соцсетях не расширяет этот предел — она делает каждый контакт поверхностным и усиливает одиночество.", "thesis": "Данбар доказал: мозг создан для 150 отношений. Тысяча «друзей» в соцсетях не расширяет этот предел — она делает каждый контакт поверхностным и усиливает одиночество.", "body": "## Число, которое не изменилось за миллион лет\n\nВ 1992 году британский антрополог Роберт Данбар опубликовал исследование, которое стало одним из самых цитируемых в антропологии. Он изучал размер неокортекса — части мозга, отвечающей за социальное познание — у различных видов приматов. И обнаружил чёткую корреляцию: чем больше неокортекс относительно размера мозга, тем большими социальными группами живёт вид.\n\nДля человека Данбар вычислил это число: около 150. Именно столько стабильных социальных отношений способен поддерживать человеческий мозг одновременно. Не просто «знакомых» — а людей, чью жизненную ситуацию ты отслеживаешь, с кем у тебя есть история, кому ты доверяешь на определённом уровне.\n\nЭто число — 150 — называют «числом Данбара». Оно воспроизводится в самых разных контекстах. Размер эффективных военных подразделений на протяжении истории — около 150 человек. Размер традиционных деревень охотников-собирателей — около 150 человек. Размер сплочённых религиозных общин — около 150 человек. Не потому что кто-то так решил. Просто потому что это предел того, что наш мозг способен обработать.\n\n## Что происходит с мозгом при тысяче «друзей»\n\nТеперь посмотри на свой Facebook или Instagram. Сколько у тебя «друзей» или подписчиков? Сотни? Тысячи? Социальные сети дали нам возможность поддерживать связи с количеством людей, в пять-двадцать раз превышающим наш когнитивный предел.\n\nНаш мозг не изменился. Эволюция не успела за технологиями. Что происходит, когда человек пытается управлять социальной жизнью, превышающей его когнитивные возможности в десять раз? Он начинает упрощать. Реагировать быстро, поверхностно, эмоционально. Лайк вместо разговора. Реакция вместо понимания. Публичный комментарий вместо личного сообщения.\n\nЭто не лень и не деградация. Это нейробиологическая перегрузка. Мозг делает то единственное, что может: упрощает сигналы до минимума. Вместо сложного эмоционального взаимодействия — нажать сердечко. Вместо искреннего разговора — написать «поздравляю!» под фотографией.\n\nПоэтому тысяча друзей в соцсетях не делает нас счастливее или менее одинокими. Исследования — включая работы, на которые ссылается Хайдт — показывают обратное: рост числа онлайн-«связей» коррелирует с ростом ощущения одиночества. Потому что мозг не может отличить поверхностный онлайн-контакт от настоящей связи — он просто перегружается и отключается эмоционально.\n\nДобавь к этому то, что Гладуэлл описал в «The Tipping Point»: после того как платформа достигает критической массы, присутствие в ней становится социальной необходимостью. Ты не выбираешь быть в Facebook из-за качества взаимодействия. Ты там, потому что там все. А значит, ты обречён бесконечно скроллить ленту из людей, с которыми у тебя «связь» без реальной связи.\n\n> Данбар показал: наш мозг создан для 150 отношений. Соцсети дали нам тысячи — и сделали каждое из них поверхностным. Больше связей не означает меньше одиночества.\n\nЭто объясняет один из главных парадоксов эпохи соцсетей: мы никогда не были так «связаны» — и никогда не чувствовали себя так одинокими. Эпидемия одиночества, которую фиксируют психологи по всему миру с начала 2010-х, совпадает по времени с массовым распространением смартфонов и соцсетей. Это не случайность.", "sources": [{"title": "Нир Эяль — Hooked (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D1%80%20%D0%AD%D1%8F%D0%BB%D1%8C%20%E2%80%94%20Hooked%20%282014%29", "linkType": "gbooks"}, {"title": "Джонатан Хайдт — The
