 ұйым: токендер дауыс ретінде, smart contracts орындаушы ретінде. Көпшіліктің шешімін бұғаттай алатын CEO жоқ. Алғаш рет — орталықтандырылған басқарусыз үйлестіру.", "body": "## Ұйымдасудың жаңа формасы\n\n2014 жылы Виталик Бутерин басқаруда адамдарсыз ұйымды іске қосуға бола ма деген сұрақтан басталатын эссе жазды.\n\nБұл фантастика сияқты естілді. Бірақ идеяның темірдей логикасы болды.\n\nДәстүрлі компания — иерархия. Акционерлер (иелер) бар, директорлар кеңесі (стратегиялық басқару) бар, менеджмент (операциялық басқару) бар, қызметкерлер (орындау) бар. Әр деңгейде агенттік мәселе бар: бөтен ақшаны басқаратын адамның өз мүдделері болады, олар иелердің мүдделерімен сәйкес келмеуі мүмкін. Менеджер компанияға емес, өзіне тиімді шешім қабылдауы мүмкін. Директор ірі акционер үшін ұсақ акционерлердің есебінен жұмыс істеуі мүмкін.\n\nБутерин мынаны ұсынды: ұйымның ережелерін smart contract-қа жазса ше? Code-ты сатып алу мүмкін емес. Code бір қатысушының пайдасына, басқалардың қарсысына шешім қабылдай алмайды. Code ішінде не жазылса, дәл соны орындайды.\n\nОсылай DAO — Decentralized Autonomous Organization, орталықтандырылмаған автономды ұйым тұжырымдамасы дүниеге келді.\n\n## DAO іс жүзінде қалай жұмыс істейді\n\nDeFi-протоколды, мысалы орталықтандырылмаған биржаны басқаратын ұйымды елестет. Бұл ұйымның CEO-сы жоқ, кеңсесі жоқ, заңды мекенжайы жоқ. Ережелерді анықтайтын smart contract бар және басқару токендері — цифрлық дауыстар бар.\n\nӘрбір токен иесі ұсынысты дауыс беруге шығара алады. «Комиссияны 0.3%-дан 0.25%-ға өзгертейік». «Жаңа активті қолдауды қосайық». «Протокол кірісінің 10%-ын резервтік қорға бағыттайық». Токен иелері дауыс береді. Егер ұсыныс жеткілікті дауыс жинаса — smart contract оны автоматты түрде орындайды. Бұғаттай алатын CEO жоқ. Шешімді қайта қарай алатын директорлар кеңесі жоқ. Code — заң.\n\nАлғашқы ірі DAO — The DAO — 2016 жылы Ethereum-да іске қосылып, қатысушылардан 150 миллион доллар жинады. Бірнеше аптадан кейін хакер code ішінен осалдық тауып, қаражаттың үштен бірін шығарып алды. Бұл ауыр сабақ болды: DAO code қаншалықты сенімді болса, дәл соншалықты сенімді жұмыс істейді. Smart contract-тағы қате — түзетуге болатын адам факторы емес. Бұл тура мағынасында орындалатын математика.\n\nБірақ идея аман қалды. 2020-жылдарға қарай DAO-лар DeFi-протоколдарда миллиардтаған долларды басқарады. Uniswap DAO арқылы басқарылады, онда UNI токенін ұстаушылар протокол өзгерістеріне дауыс береді. MakerDAO DAI стейблкоинін MKR иелерінің дауыс беруі арқылы басқарады. Бұлар нақты ақшасы бар жұмыс істейтін ұйымдар — дәстүрлі корпоративтік құрылымсыз.\n\nРакеш Агравал «The Tokenized Economy» еңбегінде осы контексте токендердің тереңірек мағынасын сипаттайды. DAO токені — жай ғана дауыс беру құқығы емес. Бұл мүдделерді теңестіру. Егер протокол өсіп, құндырақ бола түссе — токендер бәрі үшін қымбаттайды: әзірлеушілер үшін де, пайдаланушылар үшін де, инвесторлар үшін де. Барлығы бір мезетте өсімге мүдделі. Дәстүрлі компанияда бұған қол жеткізу іс жүзінде мүмкін емес: акционерлер мен пайдаланушылардың мүдделері құрылымдық тұрғыдан қарама-қарсы.\n\n> DAO — мінсіз ұйым емес. Бұл басқа ұйым: басқа ымыралармен, басқа тәуекелдермен, басқа мүмкіндіктермен. Ең бастысы: алғаш рет адамдарды ортақ мақсат айналасында орталықтандырылған басқарусыз үйлестірудің техникалық мүмкіндігі пайда болды.\n\nЖасампаздар, қауымдастықтар және шағын бизнес үшін бұл қызықты мүмкіндіктер ашады: ұжымдық иелік, ашық басқару, кірісті автоматты бөлу. Мұның бәрі заң фирмаларынсыз, банктерсіз және шешімді жеке өзі қабылдайтын CEO-сыз.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["DAO", "токеномика", "басқару", "DeFi"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "value", "sceneIndex": 6, "type": "economy", "shortTitle": "Желілердегі құндылық", "era": "→протоколдар", "lensWeight": {"chronology": 4, "attention": 2, "creators": 3, "networks": 5, "ownership": 5}, "title": "Құндылық желілерде жасалады: зауыттардан протоколдарға дейін", "insight": "Әлемдегі ең ірі компаниялар физикалық активтерге иелік етпейді — олар байланыстар инфрақұрылымына иелік етеді. Web3 әрі қарай барады: бұл инфрақұрылым қатысушылардың өзіне тиесілі болса ше?", "thesis": "Әлемдегі ең ірі компаниялар физикалық активтерге иелік етпейді — олар байланыстар инфрақұрылымына иелік етеді. Web3 әрі қарай барады: бұл инфрақұрылым қатысушылардың өзіне тиесілі болса ше?", "body": "## Әлемдегі ең ірі компаниялар ешқандай физикалық нәрсеге иелік етпейді\n\n1998 жылы Кевин Келли сол кезде тосын естілген ой жазды: жаңа экономикада құндылық өндірісте емес, байланыстарда жасалады.\n\n2024 жылға қара — оның дұрыс айтқанын түсінесің.\n\nUber — әлемдегі ең ірі такси қызметі. Бірде-бір автокөлігі жоқ. Airbnb — әлемдегі ең ірі қонақүй компаниясы. Бірде-бір нөмірі жоқ. Facebook — әлемдегі ең ірі медиа. Бірде-бір контент бірлігін өндірмейді. Alibaba — Қытайдағы ең ірі бөлшек саудагер. Қоймаларда ешқандай тауар ұстамайды.\n\nОларда не бар? Байланыстар инфрақұрылымы. Uber жүргізушілер мен жолаушыларды байланыстырады. Airbnb үй иелері мен қонақтарды байланыстырады. Facebook адамдарды бір-бірімен байланыстырады. Alibaba сатушылар мен сатып алушыларды байланыстырады. Құндылық физикалық активтерде емес, байланыстың өз фактісінде.\n\nБұл индустриялық логикадан желілік логикаға іргелі ауысу. Индустриялық экономикада құндылық = ресурстар + еңбек + капитал. Құндылық жасау үшін өндіріс құралдарына иелік ету керек. Желілік экономикада құндылық = байланыстар × қатысушылар². Құндылық жасау үшін адамдар арасындағы өзара әрекеттестікті ұйымдастыру керек.\n\n## Web3: ал желі қатысушыларға тиесілі болса ше?\n\nБірақ бұл келесі сұрақты көтереді — дәл осы жерде Web3 түбегейлі жаңа жауап ұсынады.\n\nUber жүргізушілер мен жолаушыларды байланыстыру арқылы құндылық жасайды. Жүргізушілер бұл құндылықты өз еңбегімен жасайды. Бірақ Uber жүргізушілерге емес, акционерлерге тиесілі. Жүргізушілер сапар үшін ақы алады. Олар өз еңбегімен жасап жатқан желі құнының өсуінен үлес алмайды.\n\nАл жүргізушілер мен жолаушыларды байланыстыратын протоколды DAO басқарса ше? Жүргізушілер өз үлесіне пропорционалды токендер алар еді. Желі өскен сайын — токендер қымбаттар еді. Желіні алғашқы күндерден құруға қатысқан жүргізуші оның өсуінен ұтар еді — опцион алған стартаптың ерте қызметкері сияқты.\n\nБұл идея DeFi-де қазірдің өзінде іске асқан. Uniswap — орталықтандырылмаған биржа — сауда комиссияларын пулдарға актив енгізген өтімділік провайдерлері арасында бөледі. Compound протоколды пайдаланатын пайдаланушылар арасында басқару токендерін таратады. Бұл утопия емес. Бұл басқаруында миллиардтаған доллар бар жұмыс істейтін модель.\n\nДжаред Ланьє «Own the Internet» эссесінде тұжырымдаманы point-blank түрде қалыптастырды: интернеттің келесі кезеңі — бір бөлігін сатып ала алатын интернет. Жай ғана пайдалану емес. Иелік ету. Өсуінен табыс алу. Өзгерістерге дауыс беру.\n\n«Пайдаланушы өнім ретінде» моделінен «пайдаланушы ортақ иеленуші ретінде» моделіне өту — жай ғана технологиялық ауысу емес. Бұл саяси ауысу. Желі жасаған құндылық кімге тиесілі деген сұрақ — қоғамдағы биліктің қалай бөлінетіні туралы сұрақ.\n\n> Келли 1998 жылы: құндылық өндірісте емес, байланыстарда жасалады. Ланьє 2021 жылы: ал желі қатысушылары оған өздері иелік етсе ше? Олар бірге «құндылық платформада» дегеннен «құндылық қатысушыларда» дегенге өтуді сипаттайды.\n\nБұл дәл қазір болып жатыр — эксперименттік ауқымда. Миллиардтаған доллар TVL (Total Value Locked — жалпы бұғатталған құн) бар блокчейндер, мыңдаған қатысушысы бар DAO-лар, NFT-қауымдастықтары бар жасаушылар. Эксперименттердің бәрі сәтті болған жоқ. Көбі сәтсіздікке ұшырады. Бірақ принцип жұмыс істейді — және бұл бәрін өзгертеді.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["экономика", "желілер", "токеномика", "құндылық"], "x": 265.5, "y": 258.0, "angDeg": 218.6}], "edges": [{"from": "wu", "to": "rules", "label": "назар желі ережелеріне бағынады", "lenses": ["attention", "networks"]}, {"from": "rules", "to": "trap", "label": "монополиялар жасаушыларды тұзаққа түсіреді", "lenses": ["networks", "creators"]}, {"from": "trap", "to": "fans", "label": "шығу жолы — фанаттармен тікелей байланыс", "lenses": ["creators", "ownership"]}, {"from": "fans", "to": "longtail", "label": "нишаларға орын жеткілікті", "lenses": ["creators", "networks"]}, {"from": "longtail", "to": "value", "label": "құйрық желілерді қоректендіреді", "lenses": ["networks", "chronology"]}, {"from": "trap", "to": "dao", "label": "инфрақұрылым — жасаушыларға", "lenses": ["creators", "ownership"]}, {"from": "dao", "to": "value", "label": "қатысушылар желіге иелік етеді", "lenses": ["ownership", "networks"]}, {"from": "wu", "to": "value", "label": "назарды сатудан иеленуге", "lenses": ["chronology", "attention"]}, {"from": "rules", "to": "value", "label": "протоколдар ережені өзгертеді", "lenses": ["networks", "ownership"]}, {"from": "fans", "to": "dao", "label": "токендер құрал ретінде", "lenses": ["ownership", "creators"]}]}, "uz": {"chapter": {"key": "economy", "title": "Ijodkorlar iqtisodiyoti", "lede": "Qiymat tarmoqlarda tugʻiladi, asosiy savol esa u kimga tegishli.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=economy", "centralIdea": "Qiymat tarmoqda, savol esa u kimga tegishli", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Xronologiya", "accent": "#7dd3fc", "description": "Tim Wu gazetalari dan Web3 protokollarigacha: eʼtiborni sotishning ikki yuz yili."}, {"id": "attention", "label": "Diqqat", "accent": "#fbbf24", "description": "Tim Wu: Web2 yiliga $600 mlrdgacha olib chiqqan eʼtiborni sotish modeli."}, {"id": "creators", "label": "Ijodkorlar", "accent": "#c084fc", "description": "Kontent tuzogʻi, ming haqiqiy fanat va uzun dum iqtisodiyoti."}, {"id": "networks", "label": "Tarmoqlar", "accent": "#34d399", "description": "Metcalfe qonuni va nol xarajatlar: nega gʻolib hammasini oladi."}, {"id": "ownership", "label": "Mulkchilik", "accent": "#f87171", "description": "DAO va aloqalar infratuzilmasi: u ishtirokchilarga tegishli boʻlsa-chi?"}], "nodes": [{"id": "wu", "sceneIndex": 0, "type": "media", "shortTitle": "Tim Wu", "era": "200 yil", "lensWeight": {"chronology": 5, "attention": 5, "creators": 2, "networks": 2, "ownership": 1}, "title": "Tim Wu: e'tiborni sotish tarixi", "insight": "Tim Wu ko'rsatdi: e'tiborni sotish — gazetalardan TikTokgacha bo'lgan ikki yuz yillik model. Web2 uni yiliga 600 mlrd dollarga yetkazdi. Farq faqat targeting aniqligida.", "thesis": "Tim Wu ko'rsatdi: e'tiborni sotish — gazetalardan TikTokgacha bo'lgan ikki yuz yillik model. Web2 uni yiliga 600 mlrd dollarga yetkazdi. Farq faqat targeting aniqligida.", "body": "## Bir sentlik gazeta va e'tibor bilan birinchi bitim\n\n1833 yilda amerikalik noshir Benjamin Day mediabiznesni butunlay o'zgartirgan narsani o'ylab topdi. U New York Sun gazetasini bir sentdan sota boshladi — tannarxidan uch-to'rt baravar arzon. Atrofdagilarning hammasi uni aqldan ozgandek ko'rdi: ishlab chiqarish narxidan arzonga sotib qanday pul topish mumkin?\n\nJavob oddiy va dahona edi. Arzon gazeta o'quvchilarni — narx tufayli ilgari matbuot sotib olmagan ishchi sinf vakillarini — jalb qildi. Ko'p o'quvchi — bu auditoriya. Auditoriyani esa u reklama beruvchilarga sotdi. O'quvchi e'tibori bilan, reklama beruvchi pul bilan to'ladi. Gazeta mahsulot emas edi — u yem edi.\n\nBu tarixdagi e'tiborni sotish bo'yicha birinchi bitim edi. Va o'shandan beri — deyarli ikki yuz yil davomida — uning tuzilishi o'zgarmadi. Faqat miqyosi o'zgardi.\n\nTim Wu \"The Attention Merchants\" kitobida bu mantiqni ikki asr davomida hayratlanarli aniqlik bilan kuzatdi. Har bir yangi media bir xil sxemani takrorladi. 1920-yillar radiosi: bepul kontent tinglovchilarni jalb qiladi, tinglovchilar reklama beruvchilarga sotiladi. 1950-yillar televideniyesi: xuddi shu sxema, lekin harakatlanuvchi tasvir va kengroq qamrov bilan. Kabel TV: xuddi shu sxema, lekin obuna evaziga. Web1 interneti: kontent bepul, ammo e'tibor hali monetizatsiya qilinmagan. Web2: e'tibor monetizatsiyasi sanoat miqyosiga yetadi.\n\n## Buyuk tortib olish: sen tovarga aylangan payt\n\nWu yuz berayotgan jarayonni \"buyuk tortib olish\" deb ataydi. Media tizimi odamlarning e'tiborini — bizda bor eng tiklanmaydigan resursni — muntazam ravishda tortib oladi va uni uchinchi tomonlar uchun pulga aylantiradi.\n\nAniq raqamlar miqyosni tushunishga yordam beradi. 2023 yilda o'rtacha Facebook foydalanuvchisi ilovada kuniga taxminan 35 daqiqa o'tkazdi. Facebook AQShda shu foydalanuvchidan reklama orqali yiliga taxminan 50 dollar ishlab topdi. Foydalanuvchi servisning o'zidan boshqa hech narsa olmadi. Bitim bir tomonlama edi.\n\nGoogle qidiruv so'rovlaridan pul topadi: har bir so'rov — reklama beruvchilarga sotiladigan niyat signali. Sen \"divan sotib olish\" deb qidirasan — Google bu ma'lumotni mebel do'konlariga sotadi. Sen pul bilan to'lamaysan. Sen niyating bilan to'laysan.\n\nFacebook ijtimoiy aloqalardan pul topadi: har bir like — psixologik profil haqidagi ma'lumot. Sen muayyan postlarga like bosasan — Facebook sening qadriyatlaringni, qo'rquvlaringni, siyosiy qarashlaringni biladi. U bu bilimni reklama beruvchilarga, siyosiy kampaniyalarga, to'lashga tayyor har kimga sotadi.\n\nTikTok vaqtdan pul topadi: ilovadagi har bir ortiqcha soniya — pul. Uning algoritmi bitta narsaga optimallashtirilgan: seni iloji boricha uzoqroq ushlab turish. Bu sen uchun yaxshi bo'lgani uchun emas. Bu uning reklama daromadi uchun yaxshi bo'lgani uchun.\n\nRaqamli reklamaning umumiy bozori 2023 yilga kelib yiliga 600 milliard dollardan oshdi. Taqqoslash uchun — bu Shvetsiya YaIMidan ko'p. Bu butun summa — odamlar bepul servisdan foydalanayapmiz deb o'ylab beradigan inson e'tiborining monetizatsiyasi.\n\nWu prinsipial assimetriyaga ishora qiladi: odamlar bitim shartlarini bilmaydi. Hech qayerda \"sening e'tiboring yiliga 50 dollar turadi, biz uni sotamiz\" deb yozilmagan. \"Bepul. Shunchaki ro'yxatdan o'ting\" deb yozilgan.\n\n> Wu ko'rsatdi: e'tiborni sotish — internet ixtirosi emas. Bu Web2 sanoat miqyosiga olib chiqqan ikki yuz yillik model. Bir sentlik gazeta bilan TikTok o'rtasidagi farq faqat targeting aniqligi va bozor hajmida.\n\nBu tushuncha \"bepul\" servislarga qarashingni o'zgartiradi. Hech narsa bepul emas. Savol faqat shunda: sen nima bilan to'layotganingni tushunasanmi. Web3 qurayotgan yangi iqtisodiyot bu bitimni o'zgartirishga urinmoqda: uni ochiq, adolatli va o'zaro qilishga.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["diqqat", "iqtisodiyot", "media", "Web2"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "rules", "sceneIndex": 1, "type": "economy", "shortTitle": "Axborot qoidalari", "era": "Metcalfe qonuni", "lensWeight": {"chronology": 3, "attention": 2, "creators": 2, "networks": 5, "ownership": 3}, "title": "Axborot qoidalari: nega g'olib hammasini oladi", "insight": "Axborotning nol marginal xarajatlari + Metcalfe qonuni = Web2 monopoliyalari. Kritik massani yig'gan birinchi ishtirokchi abadiy g'alaba qozonadi. Web3 ochiq protokollari bu qoidani o'zgartiradi.", "thesis": "Axborotning nol marginal xarajatlari + Metcalfe qonuni = Web2 monopoliyalari. Kritik massani yig'gan birinchi ishtirokchi abadiy g'alaba qozonadi. Web3 ochiq protokollari bu qoidani o'zgartiradi.", "body": "## Nol marginal xarajatlar: nega axborot alohida\n\nInternet iqtisodiyotini tushunish uchun axborot mahsulotlarini prinsipial jihatdan boshqacha qiladigan bitta narsani tushunish kerak. Hal Varian va Carl Shapiro buni \"Information Rules\" kitobida 1999 yildayoq tasvirlagan — ularning kuzatuvlari bir kun ham eskirmagan.\n\nJismoniy tovar — muzlatkich, avtomobil, non — har safar ishlab chiqarilganda pul turadi. Xomashyo kerak, mehnat kerak, energiya kerak. Minginchi muzlatkichni ishlab chiqarish birinchisini ishlab chiqarish bilan taxminan bir xil turadi. Bu \"marginal xarajatlar\" deb ataladi — tovarning yana bir birligini ishlab chiqarish qiymati.\n\nAxborot mahsuloti — film, dastur, qo'shiq, maqola — bir marta pul turadi: yaratilganda. Bu kitobning birinchi nusxasini yozish oylar mehnatiga tushdi. Ikkinchi nusxasini yozish — nol. Faylni ko'chirish. Axborotning marginal xarajatlari nolga intiladi.\n\nBu butun iqtisodiy mantiqni o'zgartiradi. Agar marginal xarajatlar nol bo'lsa — mahsulotni bepul tarqatib, boshqa narsadan pul topish mumkin. E'tibordan. Ma'lumotlardan. Obunadan. Reklamadan. Aynan shuning uchun Google bepul. Aynan shuning uchun Spotify oyiga 10 yevroga 100 million trekka kirish beradi. Aynan shuning uchun Facebook bepul — kontent emas, ma'lumotlar monetizatsiya qilinadi.\n\n## Metcalfe qonuni: g'oliblar matematikasi\n\nRobert Metcalfe, Ethernet (lokal tarmoqlar texnologiyasi) yaratuvchilaridan biri, raqamli iqtisodiyotdagi hokimiyat tuzilishini tushuntiradigan qonunni ifodaladi: tarmoq qiymati uning ishtirokchilari sonining kvadratiga proporsional.\n\nTelefonlar bilan oddiy misol. Dunyoda bitta telefon — foydasiz, qo'ng'iroq qiladigan odam yo'q. Ikkita telefon — bitta ulanish, minimal qiymat. O'nta telefon — 45 ta mumkin bo'lgan ulanish. Mingta telefon — deyarli yarim million mumkin bo'lgan ulanish. Millionta telefon — taxminan 500 milliard mumkin bo'lgan ulanish. Qiymat chiziqli emas, eksponensial o'sadi.\n\nPlatformalar uchun bu shuni anglatadi: kritik massani yig'gan birinchi platforma deyarli yengilmas bo'lib qoladi. U eng yaxshisi bo'lgani uchun emas. U yerda hamma borligi uchun — va bu uni har bir foydalanuvchi uchun qimmatroq qiladi.\n\nIkki milliard foydalanuvchiga ega Facebook bir millionli muqobildan obyektiv ravishda qimmatroq — chunki u yerda sening haqiqiy tanishlaring ko'proq. Google muqobil qidiruv tizimidan qimmatroq — chunki so'rovlarning kattaroq hajmi algoritmni aniqroq qiladi. Amazon kichik do'kondan qimmatroq — ko'proq sotuvchilar ko'proq xaridorlarni jalb qiladi, ko'proq xaridorlar ko'proq sotuvchilarni jalb qiladi.\n\nVarian va Shapiro lock-in — bloklash mexanizmini ham tasvirlagan. Platformaga vaqt, ma'lumot va odatlarni kiritganingda — boshqasiga o'tish og'riqli bo'ladi. Instagramdagi suratlaring, WhatsAppdagi kontaktlaring, YouTubedagi tarixing — bu shunchaki ma'lumotlar emas. Bu platformalar ataylab yaratadigan chiqish to'sig'i.\n\nMicrosoft korporativ mijozlarni Office formatlari mosligi orqali ushlab turdi. Apple foydalanuvchilarni qurilmalar ekotizimi orqali ushlab turadi. Google qidiruv tarixi va pochta orqali ushlab turadi. Platformadan qancha uzoq foydalansang — ketish shuncha qimmatlashadi.\n\n> Metcalfe qonuni va nol marginal xarajatlar birgalikda Web2 monopoliyalarini tushuntiradi: kritik massani yig'gan birinchi ishtirokchi abadiy g'alaba qozonadi — chunki tarmoq qiymati har qanday raqobatchi quvib yetishidan tezroq o'sadi.\n\nKriptoiqtisodiyotda bu qonun ikki tomonga ham ishlaydi. Dasturchilar, foydalanuvchilar va likvidlik auditoriyasi katta bo'lgan blockchain kichigidan eksponensial ravishda qimmatroq. Ammo ochiq protokollar qoidani o'zgartiradi: agar tarmoq markazlashmagan bo'lsa — uning qiymati yagona kompaniya aksiyadorlariga emas, ishtirokchilarga tegishli bo'ladi.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["iqtisodiyot", "tarmoq effektlari", "platformalar", "tokenomika"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "trap", "sceneIndex": 2, "type": "power", "shortTitle": "Ijodkorlar tuzogʻi", "era": "Web2", "lensWeight": {"chronology": 2, "attention": 3, "creators": 5, "networks": 3, "ownership": 3}, "title": "Ijodkorlar tuzogʻi: nega kontent pul keltirmaydi", "insight": "Peress koʻrsatdi: tuzoq kontent sifatida emas. Haqiqiy mahsulot — kontent emas, hamjamiyat. Platformalar aloqalar infratuzilmasini qurib yutdi. Web3 uni ijodkorlarga qaytaradi.", "thesis": "Peress koʻrsatdi: tuzoq kontent sifatida emas. Haqiqiy mahsulot — kontent emas, hamjamiyat. Platformalar aloqalar infratuzilmasini qurib yutdi. Web3 uni ijodkorlarga qaytaradi.", "body": "## Moʻl-koʻllik paradoksi\n\nKevin Kelly 1998-yilda millionlab kontent ijodkorlari uchun laʼnatga aylangan paradoksni ifodaladi: axborot moʻl-koʻl boʻlgan dunyoda axborotning oʻz qiymati nolga intiladi.\n\nMantiq temirdek. Axborot tanqis boʻlganida — uning uchun pul toʻlashardi. Kitoblar qimmat edi, chunki ular kam edi va ularni ishlab chiqarish qimmatga tushardi. Musiqiy albom oʻn besh dollar turardi, chunki jismoniy CDni ishlab chiqarish, qadoqlash, yetkazish kerak edi. Ekspert maqolasi qimmatli edi, chunki ekspertga kirish imkoniyati kamyob edi.\n\nInternet bu tanqislikni yoʻq qildi. Endi istalgan odam istalgan narsani eʼlon qilishi mumkin. Istalgan odam albom chiqarishi, film yuklashi, maqola yozishi mumkin. Kontent taklifi — cheksiz. Cheksiz taklif esa cheklangan talab sharoitida bitta narsani anglatadi: narx nolga intiladi.\n\nJurnalist clickbait sarlavhalar yozadi — xohlagani uchun emas, algoritm aynan shuni mukofotlagani uchun. Musiqachi albomlar oʻrniga cheksiz singllar chiqaradi — chunki Spotify sifat uchun emas, streamlar uchun pul toʻlaydi. Rassom uslubini Instagram algoritmiga moslaydi — aks holda uni hech kim koʻrmaydi. Tizim ijodkorlikni yomon niyat orqali emas, ragʻbatlar orqali buzadi.\n\n## Peress: sening mahsuloting kontent emas\n\nDavid Peress «The Content Trap» asarida toʻgʻri tashxis qoʻydi: ijodkorlar platformalarga kontenti yomon boʻlgani uchun yutqazmaydi. Balki ular aynan nimani yaratishini notoʻgʻri tushungani uchun yutqazadi.\n\nPeress mediaindustriyani oʻrgandi va bir qonuniyatni topdi: mahsuloti kontent deb oʻylagan kompaniyalar yutqazgan. Mahsuloti kontent atrofidagi hamjamiyat ekanini tushungan kompaniyalar yutgan.\n\nNyu-York Tayms — gazeta emas. Bu Nyu-York Taymsga ishonadigan va unga har kuni qaytadigan odamlar hamjamiyati. Bunday hamjamiyat bor boʻlsa — monetizatsiya obunalar, tadbirlar, maxsus loyihalar orqali mumkin. U yoʻq boʻlsa — sen internetdagi millionlab saytlardan birisan, xolos.\n\nArtist — treklar toʻplami emas. Bu artist va uning tinglovchilari oʻrtasidagi munosabat. Adele albomlarni ular boshqa albomlardan yaxshiroq boʻlgani uchun sotmaydi. U ularni oʻzi bilan shaxsiy bogʻliqlikni his qiladigan sodiq tinglovchilar armiyasi borligi uchun sotadi.\n\nPlatformalar aynan shu tushunchani yutdi: ular kontent yaratmadi — ular ijodkorlar va auditoriya oʻrtasidagi aloqalar infratuzilmasini qurdi. Facebook post yozmaydi. YouTube video olmaydi. Lekin ular yozadiganlar va oʻqiydiganlar oʻrtasidagi aloqani nazorat qiladi. Va buning uchun foydalanuvchilar eʼtibori bilan haq oladi.\n\nPeressning xulosasi: tuzoqdan chiqmoqchi boʻlgan ijodkor kontent haqida oʻylashni toʻxtatib, hamjamiyat haqida oʻylashni boshlashi kerak. Auditoriya bilan bevosita munosabatlar qurishi kerak. Koʻrishlarni emas, mansublikni monetizatsiya qilishi kerak.\n\n> Peress aniq ifodaladi: tuzoq kontent sifatida emas. Tuzoq shundaki, sen mahsuloting kontent deb oʻylaysan. Sening mahsuloting — hamjamiyat. Platformalar aloqalar infratuzilmasini qurdi va uni nazorat ostiga oldi. Web3 bu nazoratni ijodkorga qaytarish uchun vositalar beradi.\n\nAynan shuning uchun Web3dagi tokenlar, NFT va bevosita toʻlovlar shunchaki qulaylik emas. Ular hamjamiyatni platforma-vositachisiz toʻgʻridan-toʻgʻri monetizatsiya qilish vositalaridir.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["ijodkorlar", "hamjamiyat", "diqqat", "iqtisodiyot"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "fans", "sceneIndex": 3, "type": "privacy", "shortTitle": "1000 fanat", "era": "2008→2020-yillar", "lensWeight": {"chronology": 3, "attention": 2, "creators": 5, "networks": 2, "ownership": 4}, "title": "Ming haqiqiy fanat: manifest vositalarga ega boʻldi", "insight": "Kelly 2008-yilda: ming haqiqiy fanat $100 dan = yiliga $100k. 2020-yillarda Web3 vositalarni berdi: tokenlar, NFT, bevosita toʻlovlar — platforma komissiyalarisiz. Manifest biznes-modelga aylandi.", "thesis": "Kelly 2008-yilda: ming haqiqiy fanat $100 dan = yiliga $100k. 2020-yillarda Web3 vositalarni berdi: tokenlar, NFT, bevosita toʻlovlar — platforma komissiyalarisiz. Manifest biznes-modelga aylandi.", "body": "## Vaqtidan oldin yozilgan esse\n\n2008-yilda Kevin Kelly «1,000 True Fans» nomli qisqa esse yozdi. U ijodiy iqtisodiyot haqidagi eng koʻp iqtibos qilinadigan matnlardan biriga aylandi — va 2008-yilda bu amaliy vositalarsiz chiroyli manifest edi. 2020-yillarda esa u ishlaydigan biznes-modelga aylandi.\n\nUning dalili nafis: ijodkorga millionlab tasodifiy obunachilar kerak emas. Unga mingta haqiqiy fanat kerak — sen yaratgan hamma narsani sotib oladigan odamlar. Qattiq muqovali kitobni ham, yumshoq muqovalisini ham. Konsert chiptasini ham, konsert yozuvini ham. Cheklangan printni ham, oddiy posterni ham. Yopiq hamjamiyatga kirishni ham, ommaviy kontentni ham.\n\nMatematika oddiy. Har biri yiliga 100 dollar sarflaydigan ming fanat — bu 100 000 dollar. Bu mustaqil ijodkor uchun kamtarona, lekin yetarli daromad. Millioner boʻlish uchun emas. Ijodiy erkinlikni saqlab qolish va algoritmlarga qaram boʻlmaslik uchun.\n\nPlatforma modeli bilan farq keskin. YouTubeda million koʻrishdan 1 000 dan 3 000 dollargacha topish mumkin — kontent kategoriyasi va auditoriya demografiyasiga qarab. Bu shuni anglatadi: YouTubeda yiliga 100 000 dollar topish uchun yiliga taxminan 40–100 million koʻrish kerak. Bu juda ozchilikka nasib qiladi.\n\nToʻgʻridan-toʻgʻri 100 dollardan toʻlaydigan ming odam-chi? Bu koʻpchilik uchun mumkin — agar bevosita toʻlovlar uchun vosita boʻlsa.\n\n## Web3 bunga qanday vositalar berdi\n\n2008-yilda Kelly gʻoyani tasvirladi — lekin mexanizmni tasvirlay olmadi. Bu ming kishini qanday topish mumkin? Vositachi banksiz va 30% oladigan toʻlov platformasisiz pulni qanday bevosita olish mumkin? Algoritm kim nimani koʻrishini hal qilganda odamlar bilan munosabatni qanday saqlab qolish mumkin?\n\nWeb3 javoblarni berdi.\n\nTokenlar fanatga loyihaning hammuallifiga aylanish imkonini beradi. Shunchaki xaridor emas — ishtirokchi. Keng tan olinishdan oldin token sotib olgan ilk qoʻllab-quvvatlovchi loyiha oʻsishi bilan birga yutadi. Bu manfaatlarni tenglashtiradi: ijodkor oʻsishdan manfaatdor, fan ham. Ikkalasi ham muvaffaqiyatdan yutadi.\n\nNFT — Non-Fungible Tokens — noyob raqamli aktivlar beradi. Ijodkor cheklangan ishlar seriyasini kolleksionerlarga bevosita sotadi. 50% oladigan galereyasiz. Xaridorlar haqidagi maʼlumotlarni olib qoʻyadigan platformasiz. Va smart contract har bir keyingi qayta sotuvda ijodkorga royalti avtomatik toʻlaydi — hatto oʻn yildan keyin ham. Bu anʼanaviy dunyoda imkonsiz: rassom kartinani sotadi va u narxda qancha oʻssa ham, boshqa hech narsa olmaydi. Web3da esa — har bir bitimdan abadiy foiz oladi.\n\nBlockchain orqali bevosita toʻlovlar — Stripe komissiyasisiz (2,9%), PayPal komissiyasisiz (3–5%), App Store komissiyasisiz (30%). TON-hamyon toʻlovni sentning ulushlari miqdoridagi komissiya bilan olish imkonini beradi. Toʻgʻridan-toʻgʻri toʻlaydigan ming fanatga ega ijodkor uchun bu shuni anglatadi: u deyarli hammasini oladi.\n\nLi Jin «The Passion Economy» asarida kengroq siljishni tasvirladi: ijodkorlar platformaning algoritmik qarorlariga qaram boʻladigan «platformalar iqtisodiyoti»dan chuqurlik kenglikdan muhimroq boʻlgan «ishtiyoq iqtisodiyoti»ga oʻtish. Senga noyob kirish imkoniyati uchun yiliga ming dollardan toʻlaydigan yuz odam — sen hech narsa olmaydigan million tasodifiy tomoshabindan yaxshiroq.\n\n> Kelly manifestni 2008-yilda yozdi. Web3 uni 2020-yillarda amalga oshirish uchun vositalar berdi. Ming haqiqiy fanat plus tokenlar, NFT va bevosita toʻlovlar — mustaqil ijodkor uchun ishlaydigan biznes-model.\n\nBu platformalarni butunlay bekor qilmaydi. Lekin kuchlar muvozanatini oʻzgartiradi: ijodkor endi boshqa kompaniyaning algoritmik qarorlariga toʻliq qaram emas. Unda auditoriyaga va monetizatsiyaga boradigan muqobil yoʻl bor.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["ijodkorlar", "tokenomika", "NFT", "qiziqishlar iqtisodiyoti"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "longtail", "sceneIndex": 4, "type": "media", "shortTitle": "Uzoq dum", "era": "2004", "lensWeight": {"chronology": 3, "attention": 2, "creators": 4, "networks": 4, "ownership": 3}, "title": "Uzun dum: nishalar iqtisodiyoti", "insight": "Uzun dum: raqamli dunyoda nishaviy ijodkorlar uchun joy cheksiz. Web2 baribir ular bilan auditoriya orasiga algoritmni qoʻydi. Web3 darvozabonsiz bevosita kanallar quradi.", "thesis": "Uzun dum: raqamli dunyoda nishaviy ijodkorlar uchun joy cheksiz. Web2 baribir ular bilan auditoriya orasiga algoritmni qoʻydi. Web3 darvozabonsiz bevosita kanallar quradi.", "body": "## Xitlar diktaturasining oxiri\n\nRaqamli iqtisodiyot bozorlar tuzilmasini oʻzgartirdi — buni oddiy oʻxshatish orqali tushunish mumkin.\n\n1990-yillardagi musiqa doʻkonini tasavvur qil. Uning maydoni cheklangan: ming-ikki ming kvadrat metr, javonlar soni cheklangan. U nimani qoʻyadi? Xitlarni. Haftasiga minglab nusxada sotiladigan albomlarni. Chunki javon maydoni — tanqis resurs. Butun mamlakatda yuz kishi tinglaydigan nishaviy ijrochilar u yerga kirmaydi. Oyiga bir nusxa sotiladigan albomni saqlash doʻkon uchun foydasiz.\n\nEndi Spotify. Unda jismoniy javonlar yoʻq. Yana bir million trekni saqlash deyarli hech narsa turmaydi — raqamli maʼlumotlar. Shuning uchun Spotify bir vaqtning oʻzida 100 million trekni taklif qila oladi. Butun dunyoda yuz kishi tinglaydiganlarni ham qoʻshib.\n\nMana shu uzun dum — Chris Anderson 2006-yildagi kitobida tasvirlagan konsepsiya. Mashhurlik egri chizigʻida «bosh» bor — ulkan auditoriyaga ega bir nechta superxit. Va «dum» bor — kichik, lekin mavjud auditoriyaga ega nishaviy mahsulotlarning cheksiz toʻplami. Jismoniy dunyoda «bosh» hukmron: javonlarga faqat xitlar chiqadi. Raqamli dunyoda «dum» cheksiz — va nishaviy mahsulotlarning jami auditoriyasi xitlar auditoriyasidan oshib ketishi mumkin.\n\n## Bu ijodkorlar uchun nimani anglatadi\n\nAnderson Amazon va Netflix uchun tadqiqot oʻtkazdi — va aniqladiki: ularning tushumining katta qismi bestsellerlardan emas, balki millionlab nishaviy mahsulotlardan keladi; ularning har biri kam sotiladi, lekin baribir sotiladi.\n\nIjodkorlar uchun bu vaziyatni tubdan oʻzgartiradi. Internetdan oldingi davrda professional musiqachi boʻlish uchun radioga chiqish, label bilan shartnoma olish, millionlab tinglovchilarga yetib borish kerak edi. Butun dunyo boʻylab yigirma ming odam sevib tinglaydigan nishaviy ijrochi buning ustiga karyera qura olmasdi — chunki bu yigirma ming odam tarqoq edi va ularga yetib borishning yoʻli yoʻq edi.\n\nInternet buni oʻzgartirdi: nishaviy auditoriyalar topiladigan va yetib boriladigan boʻldi. Lekin Web2 yangi muammo yaratdi: algoritmlar «bosh» foydasiga ishlaydi. YouTube allaqachon mashhur boʻlgan narsani tavsiya qiladi. Instagram yuqori jalb etilishga ega kontentni targʻib qiladi. TikTok virus boʻlayotgan narsani virus qiladi. Nishaviy ijodkor tuzoqqa tushadi: nazariy jihatdan uning auditoriyasi bor, lekin algoritm uni topishga yordam bermaydi — u superxitlarni targʻib qilish bilan band.\n\nWeb3 buni oʻzgartirishi mumkin. Agar ijodkorda auditoriyaga bevosita kanal boʻlsa — hamyonlar, tokenlar, markazlashmagan protokollar orqali — unga algoritmik eʼtibor uchun raqobatlashish shart emas. Uning yigirma ming haqiqiy muxlisi toʻgʻridan-toʻgʻri obuna boʻlgan. Algoritm endi darvozabon emas.\n\n> Anderson koʻrsatdi: raqamli dunyo cheksiz sonli nishaviy ijodkorlar uchun joy yaratadi. Web2 ularga vositalar bermadi — algoritmlar ularga qarshi ishladi. Web3 nishaviy ijodkor tavsiya tizimiga qaram boʻlmaydigan bevosita kanallarni quradi.\n\nBu har bir nishaviy ijodkor boyib ketadi degani emas. Lekin bu shuni anglatadi: noyob narsa yaratadiganlarda oʻz auditoriyasini topish va uning asosida barqaror daromad qurish uchun haqiqiy imkoniyat bor — superyulduzga aylanish zaruratisiz.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["ijodkorlar", "iqtisodiyot", "uzun dum", "hamjamiyat"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "dao", "sceneIndex": 5, "type": "technology", "shortTitle": "DAO", "era": "Web3", "lensWeight": {"chronology": 3, "attention": 1, "creators": 3, "networks": 4, "ownership": 5}, "title": "DAO: direktorsiz kompaniya", "insight": "DAO — code ichidagi tashkilot: tokenlar ovoz sifatida, smart contracts ijrochi sifatida. Ko'pchilik qarorini bloklay oladigan CEO yo'q. Ilk bor — markazlashgan boshqaruvsiz muvofiqlashtirish.", "thesis": "DAO — code ichidagi tashkilot: tokenlar ovoz sifatida, smart contracts ijrochi sifatida. Ko'pchilik qarorini bloklay oladigan CEO yo'q. Ilk bor — markazlashgan boshqaruvsiz muvofiqlashtirish.", "body": "## Tashkilotning yangi shakli\n\n2014-yilda Vitalik Buterin boshqaruvda odamlarsiz tashkilotni ishga tushirish mumkin bo'lsa-chi, degan savol bilan boshlanadigan esse yozdi.\n\nBu fantastikadek eshitilardi. Ammo g'oyaning temirdek mantiqi bor edi.\n\nAn'anaviy kompaniya — iyerarxiya. Aksiyadorlar (egalar) bor, direktorlar kengashi (strategik boshqaruv) bor, menejment (operatsion boshqaruv) bor, xodimlar (ijro) bor. Har bir darajada agentlik muammosi mavjud: boshqaning pulini boshqarayotgan odamning o'z manfaatlari bor, ular egalar manfaatlariga mos kelmasligi mumkin. Menejer kompaniyaga emas, o'ziga foydali qarorlar qabul qilishi mumkin. Direktor mayda aksiyadorlar zarariga yirik aksiyador manfaatiga ishlashi mumkin.\n\nButerin shunday taklif qildi: tashkilot qoidalarini smart contract-ga yozsak-chi? Code-ni pora bilan sotib olib bo'lmaydi. Code bir ishtirokchi foydasiga, boshqalarga qarshi qaror qabul qila olmaydi. Code unda nima yozilgan bo'lsa, aynan shuni bajaradi.\n\nShu tariqa DAO — Decentralized Autonomous Organization, markazlashmagan avtonom tashkilot konsepsiyasi tug'ildi.\n\n## DAO amalda qanday ishlaydi\n\nDeFi-protokolni, masalan markazlashmagan birjani boshqaradigan tashkilotni tasavvur qiling. Bu tashkilotda CEO yo'q, ofis yo'q, yuridik manzil yo'q. Qoidalarni belgilaydigan smart contract bor va boshqaruv tokenlari — raqamli ovozlar bor.\n\nHar bir token egasi taklifni ovoz berishga chiqarishi mumkin. \"Komissiyani 0.3% dan 0.25% ga o'zgartiraylik\". \"Yangi aktivni qo'llab-quvvatlashni qo'shaylik\". \"Protokol daromadlarining 10% ini zaxira fondiga yo'naltiraylik\". Token egalari ovoz beradi. Agar taklif yetarlicha ovoz olsa, smart contract uni avtomatik bajaradi. Uni bloklay oladigan CEO yo'q. Qarorni bekor qila oladigan direktorlar kengashi yo'q. Code — qonun.\n\nBirinchi yirik DAO — The DAO — 2016-yilda Ethereum-da ishga tushirildi va ishtirokchilardan 150 million dollar yig'di. Bir necha haftadan keyin xaker code-dan zaiflik topib, mablag'larning uchdan birini chiqarib oldi. Bu og'riqli saboq bo'ldi: DAO code qanchalik ishonchli bo'lsa, aynan shunchalik ishonchli ishlaydi. Smart contract-dagi xato — tuzatish mumkin bo'lgan inson omili emas. Bu so'zma-so'z bajariladigan matematika.\n\nAmmo g'oya yashab qoldi. 2020-yillarga kelib DAO-lar DeFi-protokollarda milliardlab dollarni boshqaradi. Uniswap DAO orqali boshqariladi, u yerda UNI tokeni egalari protokol o'zgarishlari uchun ovoz beradi. MakerDAO DAI stablecoinini MKR egalari ovoz berishi orqali boshqaradi. Bular real pulga ega ishlayotgan tashkilotlar — an'anaviy korporativ tuzilmasiz.\n\nRakesh Agrawal \"The Tokenized Economy\" asarida bu kontekstda tokenlarning chuqurroq ma'nosini tasvirlaydi. DAO tokeni — shunchaki ovoz berish huquqi emas. Bu manfaatlarni moslashtirish. Agar protokol o'sib, qimmatroq bo'lsa, tokenlar hamma uchun qimmatlashadi: dasturchilar uchun ham, foydalanuvchilar uchun ham, investorlar uchun ham. Hamma bir vaqtning o'zida o'sishdan manfaatdor. An'anaviy kompaniyada bunga erishish deyarli imkonsiz: aksiyadorlar va foydalanuvchilar manfaatlari tuzilmaviy jihatdan qarama-qarshi.\n\n> DAO — ideal tashkilot emas. Bu boshqa tashkilot: boshqa murosalar, boshqa risklar, boshqa imkoniyatlar bilan. Eng muhimi: ilk bor odamlarni umumiy maqsad atrofida markazlashgan boshqaruvsiz muvofiqlashtirishning texnik imkoniyati paydo bo'ldi.\n\nIjodkorlar, hamjamiyatlar va kichik biznes uchun bu qiziqarli imkoniyatlarni ochadi: jamoaviy egalik, shaffof boshqaruv, daromadlarni avtomatik taqsimlash. Bularning barchasi yuridik firmalarsiz, banklarsiz va qarorlarni yakka o'zi qabul qiladigan CEO-siz.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["DAO", "tokenomika", "boshqaruv", "DeFi"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "value", "sceneIndex": 6, "type": "economy", "shortTitle": "Tarmoqlardagi qiymat", "era": "→protokollar", "lensWeight": {"chronology": 4, "attention": 2, "creators": 3, "networks": 5, "ownership": 5}, "title": "Qiymat tarmoqlarda yaratiladi: zavodlardan protokollargacha", "insight": "Dunyoning eng yirik kompaniyalari jismoniy aktivlarga egalik qilmaydi — ular aloqalar infratuzilmasiga egalik qiladi. Web3 yanada oldinga boradi: agar bu infratuzilma ishtirokchilarning o'ziga tegishli bo'lsa-chi?", "thesis": "Dunyoning eng yirik kompaniyalari jismoniy aktivlarga egalik qilmaydi — ular aloqalar infratuzilmasiga egalik qiladi. Web3 yanada oldinga boradi: agar bu infratuzilma ishtirokchilarning o'ziga tegishli bo'lsa-chi?", "body": "## Dunyoning eng yirik kompaniyalari hech qanday jismoniy narsaga egalik qilmaydi\n\n1998-yilda Kevin Kelly o'sha paytda provokatsion eshitilgan fikrni yozdi: yangi iqtisodiyotda qiymat ishlab chiqarishda emas, aloqalarda yaratiladi.\n\n2024-yilga qarang — va uning haq bo'lganini tushunasiz.\n\nUber — dunyodagi eng yirik taksi xizmati. Birorta avtomobilga ega emas. Airbnb — dunyodagi eng yirik mehmonxona kompaniyasi. Birorta xonaga ega emas. Facebook — dunyodagi eng yirik media. Birorta kontent birligini ishlab chiqarmaydi. Alibaba — Xitoydagi eng yirik chakana sotuvchi. Omborlarda hech qanday tovar saqlamaydi.\n\nUlarda nima bor? Aloqalar infratuzilmasi. Uber haydovchilar va yo'lovchilarni bog'laydi. Airbnb mezbonlar va mehmonlarni bog'laydi. Facebook odamlarni bir-biri bilan bog'laydi. Alibaba sotuvchilar va xaridorlarni bog'laydi. Qiymat jismoniy aktivlarda emas, bog'lanish faktining o'zida.\n\nBu industrial mantiqdan tarmoq mantiqiga fundamental siljish. Industrial iqtisodiyotda qiymat = resurslar + mehnat + kapital. Qiymat yaratish uchun ishlab chiqarish vositalariga egalik qilish kerak. Tarmoq iqtisodiyotida qiymat = aloqalar × ishtirokchilar². Qiymat yaratish uchun odamlar o'rtasidagi o'zaro ta'sirni tashkil qilish kerak.\n\n## Web3: agar tarmoq ishtirokchilarga tegishli bo'lsa-chi?\n\nAmmo bu keyingi savolni ko'taradi — va aynan shu yerda Web3 tubdan yangi javob taklif qiladi.\n\nUber haydovchilar va yo'lovchilarni bog'lash orqali qiymat yaratadi. Haydovchilar bu qiymatni o'z mehnati bilan yaratadi. Ammo Uber haydovchilarga emas, aksiyadorlarga tegishli. Haydovchilar safar uchun haq oladi. Ular o'z mehnati bilan yaratayotgan tarmoq qiymatining o'sishidan ulush olmaydi.\n\nHaydovchilar va yo'lovchilarni bog'laydigan protokol DAO tomonidan boshqarilsa-chi? Haydovchilar o'z hissasiga mutanosib tokenlar olardi. Tarmoq o'sgani sari tokenlar qimmatlashardi. Tarmoqni ilk kunlardan yaratishda qatnashgan haydovchi uning o'sishidan yutardi — opsion olgan erta startup xodimi kabi.\n\nBu g'oya DeFi-da allaqachon amalga oshirilgan. Uniswap — markazlashmagan birja — savdo komissiyalarini pullarga aktiv kiritgan likvidlik provayderlari o'rtasida taqsimlaydi. Compound protokoldan foydalanadigan foydalanuvchilar orasida boshqaruv tokenlarini tarqatadi. Bu utopiya emas. Bu boshqaruvida milliardlab dollar bo'lgan ishlayotgan model.\n\nJared Lanier \"Own the Internet\" essesida konsepsiyani point-blank shakllantirdi: internetning keyingi bosqichi — bir qismini sotib olishingiz mumkin bo'lgan internet. Shunchaki foydalanish emas. Egalik qilish. O'sishidan daromad olish. O'zgarishlar uchun ovoz berish.\n\n\"Foydalanuvchi mahsulot sifatida\" modelidan \"foydalanuvchi hammulkdor sifatida\" modeliga o'tish — shunchaki texnologik siljish emas. Bu siyosiy siljish. Tarmoq yaratgan qiymat kimga tegishli degan savol — jamiyatda hokimiyat qanday taqsimlanishi haqidagi savol.\n\n> Kelly 1998-yilda: qiymat ishlab chiqarishda emas, aloqalarda yaratiladi. Lanier 2021-yilda: agar tarmoq ishtirokchilari unga egalik qilsa-chi? Ular birgalikda \"qiymat platformada\" modelidan \"qiymat ishtirokchilarda\" modeliga o'tishni tasvirlaydi.\n\nBu ayni hozir sodir bo'lmoqda — eksperimental miqyosda. Milliardlab dollar TVL (Total Value Locked — umumiy bloklangan qiymat) ga ega blockchainlar, minglab ishtirokchisi bor DAO-lar, NFT-hamjamiyatlari bor ijodkorlar. Eksperimentlarning hammasi muvaffaqiyatli bo'lmadi. Ko'pi muvaffaqiyatsiz bo'ldi. Ammo prinsip ishlaydi — va bu hammasini o'zgartiradi.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["iqtisodiyot", "tarmoqlar", "tokenomika", "qiymat"], "x": 265.5, "y": 258.0, "angDeg": 218.6}], "edges": [{"from": "wu", "to": "rules", "label": "eʼtibor tarmoq qoidalariga boʼysunadi", "lenses": ["attention", "networks"]}, {"from": "rules", "to": "trap", "label": "monopoliyalar ijodkorlarni tuzoqqa tushiradi", "lenses": ["networks", "creators"]}, {"from": "trap", "to": "fans", "label": "chiqish yoʼli — fanatlar bilan bevosita aloqa", "lenses": ["creators", "ownership"]}, {"from": "fans", "to": "longtail", "label": "nishalarga joy yetadi", "lenses": ["creators", "networks"]}, {"from": "longtail", "to": "value", "label": "dum tarmoqlarni oziqlantiradi", "lenses": ["networks", "chronology"]}, {"from": "trap", "to": "dao", "label": "infratuzilma — ijodkorlarga", "lenses": ["creators", "ownership"]}, {"from": "dao", "to": "value", "label": "ishtirokchilar tarmoqqa egalik qiladi", "lenses": ["ownership", "networks"]}, {"from": "wu", "to": "value", "label": "eʼtiborni sotishdan egalikka", "lenses": ["chronology", "attention"]}, {"from": "rules", "to": "value", "label": "protokollar qoidani oʼzgartiradi", "lenses": ["networks", "ownership"]}, {"from": "fans", "to": "dao", "label": "tokenlar vosita sifatida", "lenses": ["ownership", "creators"]}]}, "es": {"chapter": {"key": "economy", "title": "Economía de creadores", "lede": "El valor nace en las redes, y la pregunta clave es a quién pertenece.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=economy", "centralIdea": "El valor está en la red, y la pregunta es a quién pertenece", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Cronología", "accent": "#7dd3fc", "description": "De los periódicos de Tim Wu a los protocolos Web3: doscientos años vendiendo atención."}, {"id": "attention", "label": "Atención", "accent": "#fbbf24", "description": "Tim Wu: vender atención como modelo llevado por Web2 a 600.000 millones de dólares al año."}, {"id": "creators", "label": "Creadores", "accent": "#c084fc", "description": "La trampa del contenido, mil fans verdaderos y la economía de la larga cola."}, {"id": "networks", "label": "Redes", "accent": "#34d399", "description": "La ley de Metcalfe y los costes cero: por qué el ganador se lo lleva todo."}, {"id": "ownership", "label": "Propiedad", "accent": "#f87171", "description": "DAO e infraestructura de vínculos: ¿y si pertenece a los participantes?"}], "nodes": [{"id": "wu", "sceneIndex": 0, "type": "media", "shortTitle": "Tim Wu", "era": "200 años", "lensWeight": {"chronology": 5, "attention": 5, "creators": 2, "networks": 2, "ownership": 1}, "title": "Tim Wu: la historia de vender la atención", "insight": "Tim Wu mostró que vender atención es un modelo de doscientos años, desde los periódicos hasta TikTok. Web2 lo llevó a 600 mil millones de dólares al año. La única diferencia es la precisión de la segmentación.", "thesis": "Tim Wu mostró que vender atención es un modelo de doscientos años, desde los periódicos hasta TikTok. Web2 lo llevó a 600 mil millones de dólares al año. La única diferencia es la precisión de la segmentación.", "body": "## El periódico de un centavo y el primer trato con la atención\n\nEn 1833, el editor estadounidense Benjamin Day ideó algo que cambió para siempre el negocio de los medios. Empezó a vender el periódico New York Sun por un centavo, entre tres y cuatro veces más barato que su costo de producción. Todos a su alrededor pensaban que estaba loco: ¿cómo se puede ganar dinero vendiendo por menos de lo que cuesta producir?\n\nLa respuesta fue simple y brillante. Un periódico barato atraía lectores: personas de la clase trabajadora que antes no compraban prensa por el precio. Muchos lectores significaban una audiencia. Y esa audiencia la vendía a los anunciantes. El lector pagaba con su atención, el anunciante con dinero. El periódico no era el producto. Era el anzuelo.\n\nEste fue el primer trato de venta de atención de la historia. Y desde entonces, durante casi doscientos años, su estructura no ha cambiado. Solo cambió la escala.\n\nTim Wu, en el libro \"The Attention Merchants\", siguió esta lógica a lo largo de dos siglos con una precisión asombrosa. Cada nuevo medio repitió el mismo esquema. La radio de los años 20: el contenido gratis atrae oyentes, y los oyentes se venden a los anunciantes. La televisión de los años 50: el mismo esquema, pero con imagen en movimiento y un alcance mayor. La TV por cable: el mismo esquema, pero con suscripción. Internet Web1: el contenido es gratis, pero todavía no se monetiza la atención. Web2: la monetización de la atención alcanza escala industrial.\n\n## La gran extracción: cuando te convertiste en el producto\n\nWu llama a lo que está ocurriendo \"la gran extracción\". El sistema de medios toma de forma sistemática la atención de las personas, el recurso no renovable más valioso que tenemos, y la convierte en dinero para terceros.\n\nLas cifras concretas ayudan a entender la magnitud. El usuario promedio de Facebook en 2023 pasaba alrededor de 35 minutos al día en la app. Facebook ganaba cerca de 50 dólares al año con ese usuario en Estados Unidos, a través de la publicidad. El usuario no recibía nada, salvo el servicio en sí. El trato era unilateral.\n\nGoogle gana dinero con las búsquedas: cada consulta es una señal de intención que se vende a los anunciantes. Buscas \"comprar un sofá\" y Google vende esa información a las tiendas de muebles. No pagas con dinero. Pagas con intención.\n\nFacebook gana dinero con los vínculos sociales: cada like es un dato sobre un perfil psicológico. Le das like a ciertas publicaciones y Facebook sabe tus valores, miedos y opiniones políticas. Vende ese conocimiento a anunciantes, campañas políticas y a cualquiera que esté dispuesto a pagar.\n\nTikTok gana dinero con el tiempo: cada segundo extra en la app es dinero. Su algoritmo está optimizado para una sola cosa: mantenerte el mayor tiempo posible. No porque eso sea bueno para ti. Sino porque es bueno para sus ingresos publicitarios.\n\nEl mercado total de la publicidad digital superó los 600 mil millones de dólares al año para 2023. Para comparar, eso es más que el PIB de Suecia. Toda esa suma es la monetización de la atención humana que la gente entrega pensando que usa un servicio gratis.\n\nWu señala una asimetría fundamental: la gente no conoce los términos del trato. En ninguna parte dice \"tu atención vale 50 dólares al año, y la vendemos\". Dice: \"Gratis. Solo regístrate\".\n\n> Wu mostró que vender atención no es un invento de internet. Es un modelo de doscientos años que Web2 llevó a escala industrial. La diferencia entre un periódico de un centavo y TikTok solo está en la precisión de la segmentación y en el tamaño del mercado.\n\nEsta comprensión cambia la forma en que ves los servicios \"gratis\". Nada es gratis. La única pregunta es si entiendes con qué estás pagando. La nueva economía que está construyendo Web3 intenta cambiar ese trato: hacerlo explícito, justo y mutuo.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["atención", "economía", "medios", "Web2"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "rules", "sceneIndex": 1, "type": "economy", "shortTitle": "Reglas de la información", "era": "ley de Metcalfe", "lensWeight": {"chronology": 3, "attention": 2, "creators": 2, "networks": 5, "ownership": 3}, "title": "Reglas de la información: por qué el ganador se lo lleva todo", "insight": "Costos marginales cero de la información + la ley de Metcalfe = monopolios de Web2. El primero en alcanzar masa crítica gana para siempre. Los protocolos abiertos de Web3 cambian esta regla.", "thesis": "Costos marginales cero de la información + la ley de Metcalfe = monopolios de Web2. El primero en alcanzar masa crítica gana para siempre. Los protocolos abiertos de Web3 cambian esta regla.", "body": "## Costos marginales cero: por qué la información es especial\n\nPara entender la economía de internet, hay que entender una cosa que hace que los productos de información sean fundamentalmente distintos. Hal Varian y Carl Shapiro describieron esto en el libro \"Information Rules\" en 1999, y sus observaciones no han quedado anticuadas ni un solo día.\n\nUn bien físico, un refrigerador, un automóvil, pan, cuesta dinero cada vez que se produce. Se necesitan materias primas, trabajo y energía. Producir el refrigerador número mil cuesta aproximadamente lo mismo que el primero. A esto se le llama \"costos marginales\": el costo de producir una unidad más de un bien.\n\nUn producto informativo, una película, un programa, una canción, un artículo, cuesta dinero una sola vez: cuando se crea. Escribir la primera copia de este libro costó meses de trabajo. Escribir la segunda copia cuesta cero. Copiar un archivo. Los costos marginales de la información tienden a cero.\n\nEso cambia toda la lógica económica. Si los costos marginales son cero, puedes regalar el producto y ganar dinero con otra cosa. Con la atención. Con los datos. Con una suscripción. Con la publicidad. Esa es exactamente la razón por la que Google es gratis. Esa es exactamente la razón por la que Spotify da acceso a 100 millones de canciones por 10 euros al mes. Esa es exactamente la razón por la que Facebook es gratis: lo que se monetiza no es el contenido, sino los datos.\n\n## La ley de Metcalfe: la matemática de los ganadores\n\nRobert Metcalfe, uno de los creadores de Ethernet (la tecnología de redes de área local), formuló una ley que explica la estructura del poder en la economía digital: el valor de una red es proporcional al cuadrado del número de sus participantes.\n\nUn ejemplo simple con teléfonos. Un teléfono en el mundo no sirve de nada; no hay a quién llamar. Dos teléfonos significan una conexión, un valor mínimo. Diez teléfonos significan 45 conexiones posibles. Mil teléfonos significan casi medio millón de conexiones posibles. Un millón de teléfonos significan unos 500 mil millones de conexiones posibles. El valor no crece de forma lineal, sino exponencial.\n\nPara las plataformas, esto significa: la primera plataforma en alcanzar masa crítica se vuelve casi imbatible. No porque sea la mejor. Sino porque ahí está todo el mundo, y eso la hace más valiosa para cada usuario.\n\nFacebook, con dos mil millones de usuarios, es objetivamente más valioso que una alternativa con un millón, porque ahí están más de tus conocidos reales. Google es más valioso que un buscador alternativo porque un mayor volumen de consultas hace que el algoritmo sea más preciso. Amazon es más valioso que una tienda pequeña: más vendedores atraen a más compradores, más compradores atraen a más vendedores.\n\nVarian y Shapiro también describieron el mecanismo del lock-in, el encierro. Cuando has invertido tiempo, datos y hábitos en una plataforma, cambiarte a otra se vuelve doloroso. Tus fotos en Instagram, tus contactos en WhatsApp, tu historial en YouTube: no son solo datos. Son una barrera de salida que las plataformas crean de forma deliberada.\n\nMicrosoft retenía a los clientes corporativos mediante la compatibilidad de los formatos de Office. Apple retiene a los usuarios a través de su ecosistema de dispositivos. Google retiene mediante el historial de búsquedas y el correo. Cuanto más tiempo usas una plataforma, más caro resulta irte.\n\n> La ley de Metcalfe y los costos marginales cero explican juntos los monopolios de Web2: el primero en alcanzar masa crítica gana para siempre, porque el valor de la red crece más rápido de lo que cualquier competidor puede alcanzarlo.\n\nEn la criptoeconomía, esta ley funciona en ambos sentidos. Una blockchain con una gran base de desarrolladores, usuarios y liquidez vale exponencialmente más que una pequeña. Pero los protocolos abiertos cambian la regla: si la red está descentralizada, su valor pertenece a los participantes, no a los accionistas de una sola empresa.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%
