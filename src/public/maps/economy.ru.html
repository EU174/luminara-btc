<script>
const CHAPTER_DATA = {"chapter": {"key": "economy", "title": "Экономика создателей", "lede": "Ценность рождается в сетях — и главный вопрос в том, кому она принадлежит.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=economy", "centralIdea": "Ценность в сети — и вопрос, кому она принадлежит", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Хронология", "accent": "#7dd3fc", "description": "От газет Тима Ву к протоколам Web3: двести лет продажи внимания."}, {"id": "attention", "label": "Внимание", "accent": "#fbbf24", "description": "Тим Ву: продажа внимания как модель, доведённая Web2 до $600 млрд в год."}, {"id": "creators", "label": "Создатели", "accent": "#c084fc", "description": "Ловушка контента, тысяча истинных фанатов и экономика длинного хвоста."}, {"id": "networks", "label": "Сети", "accent": "#34d399", "description": "Закон Меткалфа и нулевые издержки: почему победитель берёт всё."}, {"id": "ownership", "label": "Собственность", "accent": "#f87171", "description": "DAO и инфраструктура связей: что если она принадлежит участникам?"}], "nodes": [{"id": "wu", "sceneIndex": 0, "type": "media", "shortTitle": "Тим Ву", "era": "200 лет", "lensWeight": {"chronology": 5, "attention": 5, "creators": 2, "networks": 2, "ownership": 1}, "title": "Тим Ву: история продажи внимания", "insight": "Тим Ву показал: продажа внимания — двухсотлетняя модель от газет до TikTok. Web2 довёл её до 600 млрд долларов в год. Разница только в точности таргетинга.", "thesis": "Тим Ву показал: продажа внимания — двухсотлетняя модель от газет до TikTok. Web2 довёл её до 600 млрд долларов в год. Разница только в точности таргетинга.", "body": "## Газета за один цент и первая сделка с вниманием\n\nВ 1833 году американский издатель Бенджамин Дэй придумал нечто, изменившее медиабизнес навсегда. Он начал продавать газету New York Sun за один цент — в три-четыре раза дешевле себестоимости. Все вокруг крутили пальцем у виска: как можно зарабатывать, продавая дешевле, чем стоит производство?\n\nОтвет был простым и гениальным. Дешёвая газета привлекала читателей — людей из рабочего класса, которые раньше не покупали прессу из-за цены. Много читателей — это аудитория. Аудиторию он продавал рекламодателям. Читатель платил вниманием, рекламодатель — деньгами. Газета была не продуктом — она была приманкой.\n\nЭто была первая в истории сделка по продаже внимания. И с тех пор — почти двести лет — её структура не изменилась. Изменился только масштаб.\n\nТим Ву в книге «The Attention Merchants» проследил эту логику через два столетия с поразительной точностью. Каждое новое медиа повторяло одну и ту же схему. Радио 1920-х: бесплатный контент привлекает слушателей, слушателей продают рекламодателям. Телевидение 1950-х: та же схема, но с движущейся картинкой и более широким охватом. Кабельное ТВ: та же схема, но за подписку. Интернет Web1: контент бесплатно, но пока без монетизации внимания. Web2: монетизация внимания достигает промышленного масштаба.\n\n## Великое изъятие: когда ты стал товаром\n\nВу называет происходящее «великим изъятием». Медиасистема систематически забирает внимание людей — самый невозобновляемый ресурс, который у нас есть — и конвертирует его в деньги для третьих сторон.\n\nКонкретные цифры помогают понять масштаб. Средний пользователь Facebook в 2023 году проводил в приложении около 35 минут в день. Facebook зарабатывал на этом пользователе примерно 50 долларов в год в США — через рекламу. Пользователь не получал ничего — кроме самого сервиса. Сделка была односторонней.\n\nGoogle зарабатывает на поисковых запросах: каждый запрос — это сигнал о намерении, который продаётся рекламодателям. Ты ищешь «купить диван» — Google продаёт эту информацию мебельным магазинам. Ты платишь не деньгами. Ты платишь намерением.\n\nFacebook зарабатывает на социальных связях: каждый лайк — это данные о психологическом профиле. Ты ставишь лайк определённым постам — Facebook знает твои ценности, страхи, политические взгляды. Он продаёт эти знания рекламодателям, политическим кампаниям, всем, кто готов платить.\n\nTikTok зарабатывает на времени: каждая лишняя секунда в приложении — деньги. Его алгоритм оптимизирован на одно: удержать тебя как можно дольше. Не потому что это хорошо для тебя. Потому что это хорошо для его рекламной выручки.\n\nСовокупный рынок цифровой рекламы превысил 600 миллиардов долларов в год к 2023-му. Для сравнения — это больше ВВП Швеции. Вся эта сумма — монетизация человеческого внимания, которое люди отдают, думая, что пользуются бесплатным сервисом.\n\nВу указывает на принципиальную асимметрию: люди не знают условий сделки. Нигде не написано «твоё внимание стоит 50 долларов в год, и мы его продаём». Написано: «Бесплатно. Просто зарегистрируйтесь».\n\n> Ву показал: продажа внимания — не изобретение интернета. Это двухсотлетняя модель, которую Web2 довёл до промышленного масштаба. Разница между газетой за цент и TikTok — только в точности таргетинга и размере рынка.\n\nЭто понимание меняет то, как ты смотришь на «бесплатные» сервисы. Ничто не бесплатно. Вопрос только в том, понимаешь ли ты, чем платишь. Новая экономика, которую строит Web3, пытается изменить эту сделку: сделать её явной, справедливой и взаимной.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["attention", "economics", "media", "web2"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "rules", "sceneIndex": 1, "type": "economy", "shortTitle": "Правила информации", "era": "закон Меткалфа", "lensWeight": {"chronology": 3, "attention": 2, "creators": 2, "networks": 5, "ownership": 3}, "title": "Информационные правила: почему победитель берёт всё", "insight": "Нулевые предельные издержки информации + закон Меткалфа = монополии Web2. Первый, кто набирает критическую массу, побеждает навсегда. Открытые протоколы Web3 меняют это правило.", "thesis": "Нулевые предельные издержки информации + закон Меткалфа = монополии Web2. Первый, кто набирает критическую массу, побеждает навсегда. Открытые протоколы Web3 меняют это правило.", "body": "## Нулевые предельные издержки: почему информация особенная\n\nЧтобы понять экономику интернета — нужно понять одну вещь, которая делает информационные продукты принципиально другими. Хэл Вэриан и Карл Шапиро описали это в книге «Information Rules» ещё в 1999 году — и их наблюдения не устарели ни на день.\n\nФизический товар — холодильник, автомобиль, хлеб — стоит денег каждый раз, когда производится. Нужно сырьё, нужен труд, нужна энергия. Произвести тысячный холодильник стоит примерно столько же, сколько первый. Это называется «предельные издержки» — стоимость производства ещё одной единицы товара.\n\nИнформационный продукт — фильм, программа, песня, статья — стоит денег один раз: при создании. Написать первую копию этой книги стоило месяцев работы. Написать вторую копию — ноль. Скопировать файл. Предельные издержки информации стремятся к нулю.\n\nЭто меняет всю экономическую логику. Если предельные издержки нулевые — ты можешь раздавать продукт бесплатно и зарабатывать на чём-то другом. На внимании. На данных. На подписке. На рекламе. Именно поэтому Google бесплатный. Именно поэтому Spotify за 10 евро в месяц даёт доступ к 100 миллионам треков. Именно поэтому Facebook бесплатный — монетизируется не контент, а данные.\n\n## Закон Меткалфа: математика победителей\n\nРоберт Меткалфе, один из создателей Ethernet (технологии локальных сетей), сформулировал закон, объясняющий структуру власти в цифровой экономике: ценность сети пропорциональна квадрату числа её участников.\n\nПростой пример с телефонами. Один телефон в мире — бесполезен, звонить некому. Два телефона — одно соединение, минимальная ценность. Десять телефонов — 45 возможных соединений. Тысяча телефонов — почти полмиллиона возможных соединений. Миллион телефонов — около 500 миллиардов возможных соединений. Ценность растёт не линейно, а экспоненциально.\n\nДля платформ это означает: первая платформа, набравшая критическую массу, становится почти непобедимой. Не потому что она лучшая. А потому что там все — и это делает её ценнее для каждого пользователя.\n\nFacebook с двумя миллиардами пользователей объективно ценнее альтернативы с миллионом — потому что там больше твоих реальных знакомых. Google ценнее альтернативного поисковика — потому что больший объём запросов делает алгоритм точнее. Amazon ценнее маленького магазина — больше продавцов привлекает больше покупателей, больше покупателей привлекает больше продавцов.\n\nВэриан и Шапиро также описали механизм lock-in — блокировки. Когда ты вложил время, данные и привычки в платформу — переход на другую становится болезненным. Твои фотографии в Instagram, твои контакты в WhatsApp, твоя история в YouTube — это не просто данные. Это барьер выхода, который платформы создают намеренно.\n\nMicrosoft удерживала корпоративных клиентов через совместимость форматов Office. Apple удерживает пользователей через экосистему устройств. Google удерживает через историю поиска и почту. Чем дольше ты пользуешься платформой — тем дороже уход.\n\n> Закон Меткалфа и нулевые предельные издержки вместе объясняют монополии Web2: первый, кто набирает критическую массу, побеждает навсегда — потому что ценность сети растёт быстрее, чем любой конкурент может её нагнать.\n\nВ криптоэкономике этот закон работает в обе стороны. Блокчейн с большой аудиторией разработчиков, пользователей и ликвидности экспоненциально ценнее маленького. Но открытые протоколы меняют правило: если сеть децентрализована — её ценность принадлежит участникам, а не акционерам единственной компании.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["economics", "network-effects", "platforms", "tokenomics"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "trap", "sceneIndex": 2, "type": "power", "shortTitle": "Ловушка создателей", "era": "Web2", "lensWeight": {"chronology": 2, "attention": 3, "creators": 5, "networks": 3, "ownership": 3}, "title": "Ловушка создателей: почему контент не приносит денег", "insight": "Пересс показал: ловушка не в качестве контента. Настоящий продукт — это сообщество, а не контент. Платформы выиграли, построив инфраструктуру связей. Web3 возвращает её создателям.", "thesis": "Пересс показал: ловушка не в качестве контента. Настоящий продукт — это сообщество, а не контент. Платформы выиграли, построив инфраструктуру связей. Web3 возвращает её создателям.", "body": "## Парадокс изобилия\n\nКевин Келли в 1998 году сформулировал парадокс, который стал проклятием миллионов создателей контента: в мире изобилия информации ценность самой информации стремится к нулю.\n\nЛогика железная. Когда информация была дефицитом — за неё платили. Книги стоили дорого, потому что их было мало и их дорого производить. Музыкальный альбом стоил пятнадцать долларов, потому что физический CD нужно было произвести, упаковать, доставить. Статья эксперта стоила, потому что доступ к эксперту был редким.\n\nИнтернет уничтожил этот дефицит. Теперь любой может опубликовать что угодно. Любой может выпустить альбом, загрузить фильм, написать статью. Предложение контента — бесконечное. А бесконечное предложение при конечном спросе означает одно: цена стремится к нулю.\n\nЖурналист пишет кликбейтные заголовки — не потому что хочет, а потому что алгоритм вознаграждает именно это. Музыкант выпускает бесконечные синглы вместо альбомов — потому что Spotify платит за стримы, а не за качество. Художник подстраивает стиль под алгоритм Instagram — потому что иначе никто не увидит. Система деформирует творчество не через злой умысел — через стимулы.\n\n## Пересс: твой продукт — не контент\n\nДэвид Пересс в «The Content Trap» поставил правильный диагноз: создатели проигрывают платформам не потому что их контент плохой. А потому что они неправильно понимают, что именно они создают.\n\nПересс изучал медиаиндустрию и обнаружил закономерность: компании, которые думали, что их продукт — это контент, проигрывали. Компании, которые понимали, что их продукт — это сообщество вокруг контента, выигрывали.\n\nНью-Йорк Таймс — это не газета. Это сообщество людей, которые доверяют Нью-Йорк Таймс и возвращаются к нему каждый день. Когда это сообщество есть — монетизация возможна через подписки, события, специальные проекты. Когда его нет — ты просто один из миллионов сайтов в интернете.\n\nАртист — это не набор треков. Это отношения между артистом и его слушателями. Адель продаёт альбомы не потому что они лучше других альбомов. А потому что у неё есть армия преданных слушателей, которые чувствуют личную связь с ней.\n\nПлатформы выиграли именно это понимание: они не создавали контент — они строили инфраструктуру связей между создателями и аудиторией. Facebook не пишет посты. YouTube не снимает видео. Но они контролируют связь между теми, кто пишет, и теми, кто читает. И берут за это плату — вниманием пользователей.\n\nВывод Пересса: создатель, который хочет вырваться из ловушки, должен перестать думать о контенте и начать думать о сообществе. Строить прямые отношения с аудиторией. Монетизировать принадлежность, а не просмотры.\n\n> Пересс сформулировал точно: ловушка не в качестве контента. Ловушка в том, что ты думаешь, будто твой продукт — контент. Твой продукт — это сообщество. Платформы построили инфраструктуру связей и взяли её под контроль. Web3 даёт инструменты, чтобы вернуть этот контроль создателю.\n\nИменно поэтому токены, NFT и прямые платежи в Web3 — это не просто удобство. Это инструменты для монетизации сообщества напрямую, без платформы-посредника.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["creators", "community", "attention", "economics"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "fans", "sceneIndex": 3, "type": "privacy", "shortTitle": "1000 фанатов", "era": "2008→2020-е", "lensWeight": {"chronology": 3, "attention": 2, "creators": 5, "networks": 2, "ownership": 4}, "title": "Тысяча истинных фанатов: манифест получил инструменты", "insight": "Келли в 2008-м: тысяча истинных фанатов по $100 = $100k в год. В 2020-х Web3 дал инструменты: токены, NFT, прямые платежи — без платформенных комиссий. Манифест стал бизнес-моделью.", "thesis": "Келли в 2008-м: тысяча истинных фанатов по $100 = $100k в год. В 2020-х Web3 дал инструменты: токены, NFT, прямые платежи — без платформенных комиссий. Манифест стал бизнес-моделью.", "body": "## Эссе, опередившее время\n\nВ 2008 году Кевин Келли написал короткое эссе «1,000 True Fans». Оно стало одним из самых цитируемых текстов о творческой экономике — и в 2008-м это был красивый манифест без практических инструментов. В 2020-х это стало рабочей бизнес-моделью.\n\nЕго аргумент элегантен: творцу не нужны миллионы случайных подписчиков. Нужна тысяча истинных фанатов — людей, которые купят всё, что ты создашь. Книгу в твёрдой обложке и в мягкой. Билет на концерт и запись с концерта. Лимитированный принт и обычный постер. Доступ к закрытому сообществу и публичный контент.\n\nМатематика простая. Тысяча фанатов, каждый из которых тратит 100 долларов в год — это 100 000 долларов. Это скромный, но достаточный доход для независимого творца. Не стать миллионером. Но сохранить творческую свободу и не зависеть от алгоритмов.\n\nКонтраст с платформенной моделью разителен. На YouTube с миллионом просмотров можно заработать от 1 000 до 3 000 долларов — в зависимости от категории контента и демографии аудитории. Это значит: чтобы зарабатывать 100 000 долларов в год на YouTube, нужно около 40–100 миллионов просмотров в год. Это доступно единицам.\n\nА тысяча человек, платящих по 100 долларов напрямую? Это доступно многим — если есть инструмент для прямых платежей.\n\n## Как Web3 дал этому инструменты\n\nВ 2008 году Келли описал идею — но не мог описать механизм. Как найти эту тысячу? Как получить деньги напрямую без банка-посредника и без платёжной платформы, берущей 30%? Как удержать отношения с людьми, когда алгоритм решает, кто что видит?\n\nWeb3 дал ответы.\n\nТокены позволяют фанату стать совладельцем проекта. Не просто покупателем — участником. Ранний поддерживатель, купивший токены до широкого признания, выигрывает вместе с ростом проекта. Это выравнивает интересы: создатель заинтересован в росте, фан — тоже. Оба выигрывают от успеха.\n\nNFT — Non-Fungible Tokens — дают уникальные цифровые активы. Создатель продаёт ограниченную серию работ напрямую коллекционерам. Без галереи, берущей 50%. Без платформы, забирающей данные о покупателях. И смарт-контракт автоматически платит создателю роялти при каждой последующей перепродаже — даже через десять лет. Это невозможно в традиционном мире: художник продал картину и больше не получает ничего, сколько бы она ни росла в цене. В Web3 — получает процент при каждой сделке навсегда.\n\nПрямые платежи через блокчейн — без комиссии Stripe (2,9%), без комиссии PayPal (3–5%), без комиссии App Store (30%). TON-кошелёк позволяет получить платёж с комиссией в доли цента. Для создателя с тысячей фанатов, платящих напрямую, это означает: он получает почти всё.\n\nЛи Джин в «The Passion Economy» описала более широкий сдвиг: от «экономики платформ», где создатели зависят от алгоритмических решений платформы, к «экономике страсти», где глубина важнее ширины. Сто человек, платящих по тысяче долларов в год за уникальный доступ к тебе, — лучше, чем миллион случайных зрителей, от которых ты не получаешь ничего.\n\n> Келли написал манифест в 2008-м. Web3 дал инструменты для его реализации в 2020-х. Тысяча истинных фанатов плюс токены, NFT и прямые платежи — это работающая бизнес-модель для независимого творца.\n\nЭто не отменяет платформы полностью. Но меняет баланс сил: создатель больше не полностью зависит от алгоритмических решений чужой компании. У него есть альтернативный путь к аудитории и к монетизации.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["creators", "tokenomics", "nft", "passion-economy"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "longtail", "sceneIndex": 4, "type": "media", "shortTitle": "Длинный хвост", "era": "2004", "lensWeight": {"chronology": 3, "attention": 2, "creators": 4, "networks": 4, "ownership": 3}, "title": "Длинный хвост: экономика ниш", "insight": "Длинный хвост: в цифровом мире место для нишевых создателей бесконечно. Web2 всё равно ставил алгоритм между ними и аудиторией. Web3 строит прямые каналы без привратника.", "thesis": "Длинный хвост: в цифровом мире место для нишевых создателей бесконечно. Web2 всё равно ставил алгоритм между ними и аудиторией. Web3 строит прямые каналы без привратника.", "body": "## Конец диктатуры хитов\n\nЦифровая экономика изменила структуру рынков — и понять это можно через простую аналогию.\n\nПредставь музыкальный магазин 1990-х. У него ограниченная площадь: тысяча-две квадратных метров, ограниченное количество полок. Что он выставляет? Хиты. Альбомы, которые продаются тысячами копий в неделю. Потому что полочное пространство — дефицитный ресурс. Нишевые исполнители, которых слушают сто человек во всей стране, туда не попадают. Магазину невыгодно держать альбом, который продаётся одна копия в месяц.\n\nТеперь Spotify. У него нет физических полок. Хранение ещё одного миллиона треков практически ничего не стоит — цифровые данные. Поэтому Spotify может предлагать 100 миллионов треков одновременно. Включая тех, кого слушают сто человек во всём мире.\n\nЭто и есть длинный хвост — концепция, описанная Крисом Андерсоном в книге 2006 года. На кривой популярности есть «голова» — несколько суперхитов с огромной аудиторией. И есть «хвост» — бесконечное множество нишевых продуктов с маленькой, но существующей аудиторией. В физическом мире «голова» доминирует: только хиты попадают на полки. В цифровом мире «хвост» бесконечен — и совокупная аудитория нишевых продуктов может превышать аудиторию хитов.\n\n## Что это означает для творцов\n\nАндерсон провёл исследование для Amazon и Netflix — и обнаружил: значительная часть их выручки приходит не от бестселлеров, а от миллионов нишевых продуктов, каждый из которых продаётся редко, но всё же продаётся.\n\nДля создателей это фундаментально меняет расклад. В эпоху до интернета, чтобы быть профессиональным музыкантом, нужно было попасть на радио, получить контракт с лейблом, добраться до миллионов слушателей. Нишевый исполнитель, которого обожают двадцать тысяч человек по всему миру, не мог построить на этом карьеру — потому что эти двадцать тысяч были разбросаны и у него не было способа до них добраться.\n\nИнтернет это изменил: нишевые аудитории стали найдёнными и достижимыми. Но Web2 создал новую проблему: алгоритмы работают в пользу «головы». YouTube рекомендует то, что уже популярно. Instagram продвигает контент с высоким вовлечением. TikTok вирусит то, что вирусит. Нишевый создатель попадает в ловушку: теоретически его аудитория существует, но алгоритм не помогает её найти — он занят продвижением суперхитов.\n\nWeb3 может изменить это. Если у создателя есть прямой канал к аудитории — через кошельки, через токены, через децентрализованные протоколы — ему не нужно конкурировать за алгоритмическое внимание. Его двадцать тысяч истинных поклонников подписаны напрямую. Алгоритм больше не привратник.\n\n> Андерсон показал: цифровой мир создаёт место для бесконечного числа нишевых создателей. Web2 не дал им инструментов — алгоритмы работали против них. Web3 строит прямые каналы, где нишевый создатель не зависит от рекомендательной системы.\n\nЭто не значит, что каждый нишевый создатель разбогатеет. Но это означает: у тех, кто создаёт уникальное, есть реальный шанс найти свою аудиторию и построить на ней устойчивый доход — без необходимости становиться суперзвездой.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["creators", "economics", "long-tail", "community"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "dao", "sceneIndex": 5, "type": "technology", "shortTitle": "DAO", "era": "Web3", "lensWeight": {"chronology": 3, "attention": 1, "creators": 3, "networks": 4, "ownership": 5}, "title": "DAO: компания без директора", "insight": "DAO — организация в коде: токены как голоса, смарт-контракты как исполнители. Никакого CEO, который может заблокировать решение большинства. Впервые — координация без централизованного управления.", "thesis": "DAO — организация в коде: токены как голоса, смарт-контракты как исполнители. Никакого CEO, который может заблокировать решение большинства. Впервые — координация без централизованного управления.", "body": "## Новая форма организации\n\nВиталик Бутерин в 2014 году написал эссе, которое начиналось с вопроса: а что, если организацию можно запустить без людей в управлении?\n\nЭто звучало как фантастика. Но у идеи была железная логика.\n\nТрадиционная компания — это иерархия. Есть акционеры (владельцы), есть совет директоров (стратегическое управление), есть менеджмент (оперативное управление), есть сотрудники (исполнение). На каждом уровне — агентская проблема: у человека, управляющего чужими деньгами, есть собственные интересы, которые могут не совпадать с интересами владельцев. Менеджер может принимать решения, выгодные ему, а не компании. Директор может работать на крупного акционера в ущерб мелким.\n\nБутерин предложил: а что, если правила организации записать в смарт-контракт? Код не может быть подкуплен. Код не может принять решение в пользу одного участника против других. Код исполняет ровно то, что в нём написано.\n\nТак родилась концепция DAO — Decentralized Autonomous Organization, децентрализованная автономная организация.\n\n## Как работает DAO на практике\n\nПредставь организацию, управляющую DeFi-протоколом — например, децентрализованной биржей. У этой организации нет CEO, нет офиса, нет юридического адреса. Есть смарт-контракт, определяющий правила, и есть токены управления — цифровые голоса.\n\nКаждый держатель токена может вынести предложение на голосование. «Изменим комиссию с 0.3% до 0.25%». «Добавим поддержку нового актива». «Направим 10% доходов протокола в резервный фонд». Держатели токенов голосуют. Если предложение набирает достаточно голосов — смарт-контракт автоматически исполняет его. Никакого CEO, который может заблокировать. Никакого совета директоров, который может переиграть решение. Код — закон.\n\nПервый крупный DAO — The DAO — был запущен в 2016 году на Ethereum и собрал 150 миллионов долларов от участников. Через несколько недель хакер нашёл уязвимость в коде и вывел треть средств. Это был болезненный урок: DAO работает ровно настолько надёжно, насколько надёжен код. Ошибка в смарт-контракте — это не человеческий фактор, который можно исправить. Это математика, которая исполняется буквально.\n\nНо идея выжила. К 2020-м DAO управляют миллиардами долларов в DeFi-протоколах. Uniswap управляется через DAO, где держатели токена UNI голосуют за изменения протокола. MakerDAO управляет стейблкоином DAI через голосование держателей MKR. Это работающие организации с реальными деньгами — без традиционной корпоративной структуры.\n\nРакеш Агравал в «The Tokenized Economy» описывает более глубокое значение токенов в этом контексте. Токен DAO — это не просто право голоса. Это выравнивание интересов. Если протокол растёт и становится ценнее — токены дорожают для всех: и для разработчиков, и для пользователей, и для инвесторов. Все заинтересованы в росте одновременно. В традиционной компании этого добиться практически невозможно: интересы акционеров и пользователей структурно противоположны.\n\n> DAO — это не идеальная организация. Это другая организация: с другими компромиссами, другими рисками, другими возможностями. Главное: впервые появилась техническая возможность координировать людей вокруг общей цели без централизованного управления.\n\nДля творцов, сообществ и малого бизнеса это открывает интересные возможности: коллективное владение, прозрачное управление, автоматическое распределение доходов. Всё это без юридических фирм, без банков и без CEO, принимающего решения единолично.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["dao", "tokenomics", "governance", "defi"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "value", "sceneIndex": 6, "type": "economy", "shortTitle": "Ценность в сетях", "era": "→протоколы", "lensWeight": {"chronology": 4, "attention": 2, "creators": 3, "networks": 5, "ownership": 5}, "title": "Ценность создаётся в сетях: от заводов к протоколам", "insight": "Крупнейшие компании мира не владеют физическими активами — они владеют инфраструктурой связей. Web3 идёт дальше: что если эта инфраструктура будет принадлежать самим участникам?", "thesis": "Крупнейшие компании мира не владеют физическими активами — они владеют инфраструктурой связей. Web3 идёт дальше: что если эта инфраструктура будет принадлежать самим участникам?", "body": "## Крупнейшие компании мира не владеют ничем физическим\n\nКевин Келли в 1998 году написал что-то, что тогда звучало провокационно: в новой экономике ценность создаётся не в производстве, а в связях.\n\nПосмотри на 2024 год — и поймёшь, что он был прав.\n\nUber — крупнейшая в мире служба такси. Не владеет ни одним автомобилем. Airbnb — крупнейшая в мире гостиничная компания. Не владеет ни одним номером. Facebook — крупнейшее в мире медиа. Не производит ни одной единицы контента. Alibaba — крупнейший в Китае розничный продавец. Не держит никаких товаров на складах.\n\nЧто у них есть? Инфраструктура связей. Uber соединяет водителей и пассажиров. Airbnb соединяет хозяев и гостей. Facebook соединяет людей между собой. Alibaba соединяет продавцов и покупателей. Ценность — в самом факте соединения, а не в физических активах.\n\nЭто фундаментальный сдвиг от индустриальной логики к сетевой. В индустриальной экономике ценность = ресурсы + труд + капитал. Чтобы создать ценность, нужно владеть средствами производства. В сетевой экономике ценность = связи × участники². Чтобы создать ценность, нужно организовать взаимодействие между людьми.\n\n## Web3: а что, если сеть принадлежит участникам?\n\nNo это поднимает следующий вопрос — и именно здесь Web3 предлагает радикально новый ответ.\n\nUber создаёт ценность через соединение водителей и пассажиров. Водители создают эту ценность своим трудом. Но Uber принадлежит акционерам — а не водителям. Водители получают плату за поездку. Они не получают долю в росте стоимости сети, которую создают своим трудом.\n\nА что, если бы протокол, соединяющий водителей и пассажиров, управлялся DAO? Водители получали бы токены пропорционально своему вкладу. По мере роста сети — токены дорожали бы. Водитель, который участвовал в создании сети с первых дней, выигрывал бы от её роста — как ранний сотрудник стартапа, получивший опционы.\n\nЭта идея уже реализована в DeFi. Uniswap — децентрализованная биржа — распределяет комиссии от торгов между провайдерами ликвидности, которые внесли активы в пулы. Compound распределяет токены управления среди пользователей, которые используют протокол. Это не утопия. Это работающая модель с миллиардами долларов в управлении.\n\nДжаред Ларни в эссе «Own the Internet» сформулировал концепцию point-blank: следующий этап интернета — это интернет, часть которого ты можешь купить. Не просто использовать. Владеть. Получать доход от роста. Голосовать за изменения.\n\nПереход от «пользователь как продукт» к «пользователь как совладелец» — это не просто технологический сдвиг. Это политический. Вопрос о том, кому принадлежит ценность, созданная сетью, — это вопрос о распределении власти в обществе.\n\n> Келли в 1998-м: ценность создаётся в связях, а не в производстве. Ларни в 2021-м: а что, если участники сети будут ею владеть? Вместе они описывают переход от «ценность у платформы» к «ценность у участников».\n\nЭто происходит прямо сейчас — в экспериментальном масштабе. Блокчейны с миллиардами долларов TVL (Total Value Locked — общей заблокированной стоимостью), DAO с тысячами участников, создатели с NFT-сообществами. Не все эксперименты удались. Многие провалились. Но принцип работает — и это меняет всё.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["economics", "networks", "tokenomics", "value"], "x": 265.5, "y": 258.0, "angDeg": 218.6}], "edges": [{"from": "wu", "to": "rules", "label": "внимание подчиняется правилам сети", "lenses": ["attention", "networks"]}, {"from": "rules", "to": "trap", "label": "монополии ловят создателей", "lenses": ["networks", "creators"]}, {"from": "trap", "to": "fans", "label": "выход — прямая связь с фанатами", "lenses": ["creators", "ownership"]}, {"from": "fans", "to": "longtail", "label": "нишам хватает места", "lenses": ["creators", "networks"]}, {"from": "longtail", "to": "value", "label": "хвост питает сети", "lenses": ["networks", "chronology"]}, {"from": "trap", "to": "dao", "label": "инфраструктуру — создателям", "lenses": ["creators", "ownership"]}, {"from": "dao", "to": "value", "label": "участники владеют сетью", "lenses": ["ownership", "networks"]}, {"from": "wu", "to": "value", "label": "от продажи внимания к владению", "lenses": ["chronology", "attention"]}, {"from": "rules", "to": "value", "label": "протоколы меняют правило", "lenses": ["networks", "ownership"]}, {"from": "fans", "to": "dao", "label": "токены как инструмент", "lenses": ["ownership", "creators"]}]};;
function renderEmptyState(reason){const empty=document.querySelector(".empty-state"),svg=document.querySelector(".system-map");
  if(!empty||!svg)return;empty.hidden=false;svg.setAttribute("hidden","");
  empty.innerHTML=`<p>${reason}</p><a href="${CHAPTER_DATA.chapter.sourceUrl}" target="_blank" rel="noreferrer">Luminara</a>`;}
</script>
</head>
<body>
<div class="stars"></div><div class="stars2"></div>
<main class="app-shell">
  <section class="rail">
    <div><p class="eyebrow">Luminara · Atlas</p><h1 id="app-title">Экономика создателей</h1></div>
    <p class="chapter-lede">Ценность рождается в сетях — и главный вопрос в том, кому она принадлежит.</p>
    <div class="rail-rule"></div>
    <div><p class="section-h" data-ui="section_lenses">Линзы интерпретации</p><div class="lens-group" style="margin-top:9px"></div><p class="lens-desc" style="margin-top:9px"></p></div>
    <div class="rail-rule"></div>
    <div class="progress-box"></div>
    <div><p class="section-h" data-ui="section_scenes">Сцены главы</p><nav class="node-list" style="margin-top:6px"></nav></div>
  </section>
  <section class="map-stage">
    <svg class="system-map" viewBox="0 0 1120 940" role="img" preserveAspectRatio="xMidYMid meet">
      <title>До интернета</title><desc>Информация становится властью</desc>
    </svg>
    <div class="empty-state" hidden></div>
  </section>
  <aside class="detail-panel"></aside>
</main>
<dialog class="scene-dialog"></dialog>
<script>
// --- theme from URL (?theme=light|dark & ?accent=oklch/hex) — mirrors app ---
(function(){
  try{
    var p=new URLSearchParams(location.search);
    var theme=p.get("theme"); var accent=p.get("accent");
    if(theme==="light") document.documentElement.setAttribute("data-theme","light");
    else if(theme==="dark") document.documentElement.removeAttribute("data-theme");
    if(accent){ document.documentElement.style.setProperty("--accent", decodeURIComponent(accent)); }
    // sun ink: readable on core
    document.documentElement.style.setProperty("--sun-ink", theme==="light" ? "#fff" : "#fff");
  }catch(e){}
})();
// live updates from parent (optional): postMessage {theme, accent}
window.addEventListener("message",function(ev){
  var m=ev.data||{};
  if(m.theme==="light") document.documentElement.setAttribute("data-theme","light");
  if(m.theme==="dark") document.documentElement.removeAttribute("data-theme");
  if(m.accent) document.documentElement.style.setProperty("--accent", m.accent);
  if(typeof renderAll==="function") renderAll();
});

const state={lens:"chronology",selected:null,visited:new Set(),entered:false};
const byId=id=>CHAPTER_DATA.nodes.find(n=>n.id===id);
const SVGNS="http://www.w3.org/2000/svg";
const el=(t,a)=>{const e=document.createElementNS(SVGNS,t);for(const k in(a||{}))e.setAttribute(k,a[k]);return e;};
function typeColor(t){return{power:"var(--power)",technology:"var(--technology)",media:"var(--media)",privacy:"var(--privacy)",economy:"var(--economy)"}[t]||"var(--accent)";}
function typeLabel(t){var U=window.__UI_LOC||{};var k="type_"+t;if(U[k])return U[k];return{power:"Власть",technology:"Технологии",media:"Медиа",privacy:"Приватность",economy:"Экономика"}[t]||"Идея";}
function lensById(id){return CHAPTER_DATA.lenses.find(l=>l.id===id);}
function edgeActive(e){return e.lenses.includes(state.lens);}
function nodeWeight(n){return(n.lensWeight&&n.lensWeight[state.lens])||0;}
const CX=CHAPTER_DATA.chapter.centerX||500, CY=CHAPTER_DATA.chapter.centerY||445, RING=CHAPTER_DATA.chapter.ring||300;

function buildLenses(){
  const w=document.querySelector(".lens-group");w.innerHTML="";
  CHAPTER_DATA.lenses.forEach(l=>{const b=document.createElement("button");b.className="lens-btn";b.type="button";
    b.setAttribute("aria-pressed",String(l.id===state.lens));b.style.setProperty("--dot",l.accent);
    b.innerHTML=`<span class="lens-dot"></span>${l.label}`;b.addEventListener("click",()=>setLens(l.id));w.appendChild(b);});
}
function setLens(id){state.lens=id;const l=lensById(id);
  const d=document.querySelector(".lens-desc");if(d)d.textContent=l?l.description:"";
  document.querySelectorAll(".lens-btn").forEach((b,i)=>b.setAttribute("aria-pressed",String(CHAPTER_DATA.lenses[i].id===id)));
  renderAll();}

function curve(a,b){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;const dx=mx-CX,dy=my-CY,len=Math.hypot(dx,dy)||1;const bow=26;
  return `M ${a.x} ${a.y} Q ${mx+(dx/len)*bow} ${my+(dy/len)*bow} ${b.x} ${b.y}`;}

function defs(){
  const d=el("defs");
  const mk=(id,color)=>{color=lensById(state.lens)?lensById(state.lens).accent:"#888";const m=el("marker",{id,viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"});
    const p=el("path",{d:"M0 0 L10 5 L0 10 z",fill:color});m.appendChild(p);return m;};
  d.appendChild(mk("arrow-active", "var(--dot-fallback)"));
  var sg=el("radialGradient",{id:"sunGrad",cx:"50%",cy:"42%",r:"60%"});
  var css=getComputedStyle(document.documentElement);
  sg.appendChild(el("stop",{offset:"0%","stop-color":css.getPropertyValue("--bg-elev")||"#20264a"}));
  sg.appendChild(el("stop",{offset:"100%","stop-color":css.getPropertyValue("--bg")||"#0c1230"}));
  d.appendChild(sg);
  return d;
}

function renderMap(){
  const svg=document.querySelector(".system-map");if(!svg)return;
  [...svg.querySelectorAll("defs,g,.ring,.ring-tick,.era-label,.spoke")].forEach(n=>n.remove());
  svg.appendChild(defs());
  // rings
  const gDeco=el("g",{});
  [RING*0.55,RING].forEach(r=>gDeco.appendChild(el("circle",{class:"ring",cx:CX,cy:CY,r})));
  svg.appendChild(gDeco);
  // spokes + chronology era labels around outer ring
  const gSpoke=el("g",{});
  CHAPTER_DATA.nodes.forEach(n=>{
    gSpoke.appendChild(el("line",{class:"spoke",x1:CX,y1:CY,x2:n.x,y2:n.y}));
  });
  svg.appendChild(gSpoke);

  // edges (with directional arrows on active)
  const gE=el("g",{});
  CHAPTER_DATA.edges.forEach(e=>{const a=byId(e.from),b=byId(e.to);if(!a||!b)return;
    const active=edgeActive(e);const g=el("g",{class:"edge"+(active?" active":"")});
    if(active)g.style.setProperty("--dot",lensById(state.lens).accent);
    const d=curve(a,b);const p=el("path",{d});
    // approximate length for draw animation
    const len=Math.round(Math.hypot(b.x-a.x,b.y-a.y)*1.15);
    p.style.setProperty("--len",len);
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const lb=el("text",{class:"edge-label",x:mx,y:my-5,"text-anchor":"middle"});lb.textContent=e.label;
    g.appendChild(p);g.appendChild(lb);gE.appendChild(g);});
  svg.appendChild(gE);

  // center (breathing, lens-tinted ring)
  const gC=el("g",{});
  gC.style.setProperty("--dot", lensById(state.lens)?lensById(state.lens).accent:"#b7791f");
  gC.appendChild(el("circle",{class:"sun-glow",cx:CX,cy:CY,r:100}));
  gC.appendChild(el("circle",{class:"sun-ring",cx:CX,cy:CY,r:82}));
  gC.appendChild(el("circle",{class:"sun-core",cx:CX,cy:CY,r:70}));/*no sublabel*/
  
  wrapText(gC,CHAPTER_DATA.chapter.centralIdea,CX,CY+2,120,"sun-t1",17);
  svg.appendChild(gC);

  // nodes with smart outward labels + era
  const gN=el("g",{});
  CHAPTER_DATA.nodes.forEach((n,i)=>{
    const g=el("g",{class:"node"+(state.selected===n.id?" selected":""),tabindex:"0",role:"button","aria-label":`${n.sceneIndex+1}. ${n.title} (${n.era||""})`});
    g.style.setProperty("--dot",typeColor(n.type));
    g.style.setProperty("--ox",n.x+"px");g.style.setProperty("--oy",n.y+"px");
    if(!state.entered) g.style.setProperty("--delay",(0.15+i*0.06)+"s"); else g.style.animation="none",g.style.opacity="1";
    if(state.selected){const linked=CHAPTER_DATA.edges.some(e=>(e.from===state.selected&&e.to===n.id)||(e.to===state.selected&&e.from===n.id));
      if(n.id!==state.selected&&!linked)g.classList.add("dim");}
    else if(nodeWeight(n)<=1){g.classList.add("dim");}
    g.appendChild(el("circle",{class:"planet-glow",cx:n.x,cy:n.y,r:34}));
    var pl=el("circle",{class:"planet",cx:n.x,cy:n.y,r:26});pl.style.fill="color-mix(in oklch, "+typeColor(n.type)+" 20%, var(--bg-elev))";g.appendChild(pl);
    const num=el("text",{class:"num",x:n.x,y:n.y});num.textContent=String(n.sceneIndex+1);g.appendChild(num);

    // smart label placement: outward along the radius from center
    const dx=n.x-CX,dy=n.y-CY,len=Math.hypot(dx,dy)||1;
    const ux=dx/len,uy=dy/len;
    const lx=n.x+ux*46, ly=n.y+uy*46;
    // anchor by horizontal side
    const anchor = ux>0.25?"start":(ux<-0.25?"end":"middle");
    const era=el("text",{class:"era",x:lx,y:ly-30,"text-anchor":anchor});era.textContent=n.era||"";g.appendChild(era);
    const kick=el("text",{class:"kicker",x:lx,y:ly-14,"text-anchor":anchor});kick.textContent=typeLabel(n.type);g.appendChild(kick);
    wrapTextAnchored(g,n.shortTitle,lx,ly+20,180,"cap",18,anchor);

    g.addEventListener("click",()=>selectNode(n.id));
    g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();selectNode(n.id);}});
    gN.appendChild(g);
  });
  svg.appendChild(gN);
  state.entered=true;
}
function wrapText(parent,text,x,y,maxw,cls,fs){wrapTextAnchored(parent,text,x,y,maxw,cls,fs,"middle");}
function wrapTextAnchored(parent,text,x,y,maxw,cls,fs,anchor){
  const words=String(text).split(/\s+/);const lines=[];let line="";
  const approx=s=>s.length*(fs*0.56);
  words.forEach(w=>{const t=line?line+" "+w:w;if(approx(t)>maxw&&line){lines.push(line);line=w;}else line=t;});
  if(line)lines.push(line);const total=(lines.length-1)*(fs+2);
  lines.forEach((ln,i)=>{const t=el("text",{class:cls,x,y:y-total/2+i*(fs+2),"text-anchor":anchor});t.textContent=ln;parent.appendChild(t);});
}

function renderNodeList(){const nav=document.querySelector(".node-list");if(!nav)return;nav.innerHTML="";
  CHAPTER_DATA.nodes.slice().sort((a,b)=>a.sceneIndex-b.sceneIndex).forEach(n=>{
    const b=document.createElement("button");b.type="button";b.setAttribute("aria-current",String(state.selected===n.id));b.style.setProperty("--dot",typeColor(n.type));
    b.innerHTML=`<span class="node-idx">${String(n.sceneIndex+1).padStart(2,"0")}</span><span>${n.shortTitle}</span>`;
    b.addEventListener("click",()=>selectNode(n.id));nav.appendChild(b);});}
function renderProgress(){const box=document.querySelector(".progress-box");if(!box)return;
  const total=CHAPTER_DATA.nodes.length,seen=state.visited.size;
  box.innerHTML=`${((window.__UI_LOC&&window.__UI_LOC.progress_studied)||"Изучено")} ${seen}/${total}<div class="progress-bar"><div class="progress-fill" style="width:${Math.round(seen/total*100)}%"></div></div>`;}
function firstSentence(txt){return String(txt).replace(/^##[^\n]*\n+/,"").split(/(?<=[.!?])\s/)[0]||"";}
function renderDetail(){const p=document.querySelector(".detail-panel");if(!p)return;
  if(!state.selected){p.innerHTML=`<p class="eyebrow">${(window.__UI_LOC&&window.__UI_LOC.detail_label)||"Деталь"}</p><p class="detail-empty">${(window.__UI_LOC&&window.__UI_LOC.detail_empty)||"Выбери узел на карте — здесь появятся тезис, инсайт, источники и связанные идеи. Линзы вверху меняют, что подсвечено, и перекрашивают центр."}</p>`;return;}
  const n=byId(state.selected);const c=typeColor(n.type);
  const related=CHAPTER_DATA.edges.filter(e=>e.from===n.id||e.to===n.id).map(e=>({node:byId(e.from===n.id?e.to:e.from),label:e.label})).filter(x=>x.node);
  const srcs=(n.sources||[]).slice(0,10);

const CHAPTER_I18N = {"ru": {"chapter": {"key": "economy", "title": "Экономика создателей", "lede": "Ценность рождается в сетях — и главный вопрос в том, кому она принадлежит.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=economy", "centralIdea": "Ценность в сети — и вопрос, кому она принадлежит", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Хронология", "accent": "#7dd3fc", "description": "От газет Тима Ву к протоколам Web3: двести лет продажи внимания."}, {"id": "attention", "label": "Внимание", "accent": "#fbbf24", "description": "Тим Ву: продажа внимания как модель, доведённая Web2 до $600 млрд в год."}, {"id": "creators", "label": "Создатели", "accent": "#c084fc", "description": "Ловушка контента, тысяча истинных фанатов и экономика длинного хвоста."}, {"id": "networks", "label": "Сети", "accent": "#34d399", "description": "Закон Меткалфа и нулевые издержки: почему победитель берёт всё."}, {"id": "ownership", "label": "Собственность", "accent": "#f87171", "description": "DAO и инфраструктура связей: что если она принадлежит участникам?"}], "nodes": [{"id": "wu", "sceneIndex": 0, "type": "media", "shortTitle": "Тим Ву", "era": "200 лет", "lensWeight": {"chronology": 5, "attention": 5, "creators": 2, "networks": 2, "ownership": 1}, "title": "Тим Ву: история продажи внимания", "insight": "Тим Ву показал: продажа внимания — двухсотлетняя модель от газет до TikTok. Web2 довёл её до 600 млрд долларов в год. Разница только в точности таргетинга.", "thesis": "Тим Ву показал: продажа внимания — двухсотлетняя модель от газет до TikTok. Web2 довёл её до 600 млрд долларов в год. Разница только в точности таргетинга.", "body": "## Газета за один цент и первая сделка с вниманием\n\nВ 1833 году американский издатель Бенджамин Дэй придумал нечто, изменившее медиабизнес навсегда. Он начал продавать газету New York Sun за один цент — в три-четыре раза дешевле себестоимости. Все вокруг крутили пальцем у виска: как можно зарабатывать, продавая дешевле, чем стоит производство?\n\nОтвет был простым и гениальным. Дешёвая газета привлекала читателей — людей из рабочего класса, которые раньше не покупали прессу из-за цены. Много читателей — это аудитория. Аудиторию он продавал рекламодателям. Читатель платил вниманием, рекламодатель — деньгами. Газета была не продуктом — она была приманкой.\n\nЭто была первая в истории сделка по продаже внимания. И с тех пор — почти двести лет — её структура не изменилась. Изменился только масштаб.\n\nТим Ву в книге «The Attention Merchants» проследил эту логику через два столетия с поразительной точностью. Каждое новое медиа повторяло одну и ту же схему. Радио 1920-х: бесплатный контент привлекает слушателей, слушателей продают рекламодателям. Телевидение 1950-х: та же схема, но с движущейся картинкой и более широким охватом. Кабельное ТВ: та же схема, но за подписку. Интернет Web1: контент бесплатно, но пока без монетизации внимания. Web2: монетизация внимания достигает промышленного масштаба.\n\n## Великое изъятие: когда ты стал товаром\n\nВу называет происходящее «великим изъятием». Медиасистема систематически забирает внимание людей — самый невозобновляемый ресурс, который у нас есть — и конвертирует его в деньги для третьих сторон.\n\nКонкретные цифры помогают понять масштаб. Средний пользователь Facebook в 2023 году проводил в приложении около 35 минут в день. Facebook зарабатывал на этом пользователе примерно 50 долларов в год в США — через рекламу. Пользователь не получал ничего — кроме самого сервиса. Сделка была односторонней.\n\nGoogle зарабатывает на поисковых запросах: каждый запрос — это сигнал о намерении, который продаётся рекламодателям. Ты ищешь «купить диван» — Google продаёт эту информацию мебельным магазинам. Ты платишь не деньгами. Ты платишь намерением.\n\nFacebook зарабатывает на социальных связях: каждый лайк — это данные о психологическом профиле. Ты ставишь лайк определённым постам — Facebook знает твои ценности, страхи, политические взгляды. Он продаёт эти знания рекламодателям, политическим кампаниям, всем, кто готов платить.\n\nTikTok зарабатывает на времени: каждая лишняя секунда в приложении — деньги. Его алгоритм оптимизирован на одно: удержать тебя как можно дольше. Не потому что это хорошо для тебя. Потому что это хорошо для его рекламной выручки.\n\nСовокупный рынок цифровой рекламы превысил 600 миллиардов долларов в год к 2023-му. Для сравнения — это больше ВВП Швеции. Вся эта сумма — монетизация человеческого внимания, которое люди отдают, думая, что пользуются бесплатным сервисом.\n\nВу указывает на принципиальную асимметрию: люди не знают условий сделки. Нигде не написано «твоё внимание стоит 50 долларов в год, и мы его продаём». Написано: «Бесплатно. Просто зарегистрируйтесь».\n\n> Ву показал: продажа внимания — не изобретение интернета. Это двухсотлетняя модель, которую Web2 довёл до промышленного масштаба. Разница между газетой за цент и TikTok — только в точности таргетинга и размере рынка.\n\nЭто понимание меняет то, как ты смотришь на «бесплатные» сервисы. Ничто не бесплатно. Вопрос только в том, понимаешь ли ты, чем платишь. Новая экономика, которую строит Web3, пытается изменить эту сделку: сделать её явной, справедливой и взаимной.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["attention", "economics", "media", "web2"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "rules", "sceneIndex": 1, "type": "economy", "shortTitle": "Правила информации", "era": "закон Меткалфа", "lensWeight": {"chronology": 3, "attention": 2, "creators": 2, "networks": 5, "ownership": 3}, "title": "Информационные правила: почему победитель берёт всё", "insight": "Нулевые предельные издержки информации + закон Меткалфа = монополии Web2. Первый, кто набирает критическую массу, побеждает навсегда. Открытые протоколы Web3 меняют это правило.", "thesis": "Нулевые предельные издержки информации + закон Меткалфа = монополии Web2. Первый, кто набирает критическую массу, побеждает навсегда. Открытые протоколы Web3 меняют это правило.", "body": "## Нулевые предельные издержки: почему информация особенная\n\nЧтобы понять экономику интернета — нужно понять одну вещь, которая делает информационные продукты принципиально другими. Хэл Вэриан и Карл Шапиро описали это в книге «Information Rules» ещё в 1999 году — и их наблюдения не устарели ни на день.\n\nФизический товар — холодильник, автомобиль, хлеб — стоит денег каждый раз, когда производится. Нужно сырьё, нужен труд, нужна энергия. Произвести тысячный холодильник стоит примерно столько же, сколько первый. Это называется «предельные издержки» — стоимость производства ещё одной единицы товара.\n\nИнформационный продукт — фильм, программа, песня, статья — стоит денег один раз: при создании. Написать первую копию этой книги стоило месяцев работы. Написать вторую копию — ноль. Скопировать файл. Предельные издержки информации стремятся к нулю.\n\nЭто меняет всю экономическую логику. Если предельные издержки нулевые — ты можешь раздавать продукт бесплатно и зарабатывать на чём-то другом. На внимании. На данных. На подписке. На рекламе. Именно поэтому Google бесплатный. Именно поэтому Spotify за 10 евро в месяц даёт доступ к 100 миллионам треков. Именно поэтому Facebook бесплатный — монетизируется не контент, а данные.\n\n## Закон Меткалфа: математика победителей\n\nРоберт Меткалфе, один из создателей Ethernet (технологии локальных сетей), сформулировал закон, объясняющий структуру власти в цифровой экономике: ценность сети пропорциональна квадрату числа её участников.\n\nПростой пример с телефонами. Один телефон в мире — бесполезен, звонить некому. Два телефона — одно соединение, минимальная ценность. Десять телефонов — 45 возможных соединений. Тысяча телефонов — почти полмиллиона возможных соединений. Миллион телефонов — около 500 миллиардов возможных соединений. Ценность растёт не линейно, а экспоненциально.\n\nДля платформ это означает: первая платформа, набравшая критическую массу, становится почти непобедимой. Не потому что она лучшая. А потому что там все — и это делает её ценнее для каждого пользователя.\n\nFacebook с двумя миллиардами пользователей объективно ценнее альтернативы с миллионом — потому что там больше твоих реальных знакомых. Google ценнее альтернативного поисковика — потому что больший объём запросов делает алгоритм точнее. Amazon ценнее маленького магазина — больше продавцов привлекает больше покупателей, больше покупателей привлекает больше продавцов.\n\nВэриан и Шапиро также описали механизм lock-in — блокировки. Когда ты вложил время, данные и привычки в платформу — переход на другую становится болезненным. Твои фотографии в Instagram, твои контакты в WhatsApp, твоя история в YouTube — это не просто данные. Это барьер выхода, который платформы создают намеренно.\n\nMicrosoft удерживала корпоративных клиентов через совместимость форматов Office. Apple удерживает пользователей через экосистему устройств. Google удерживает через историю поиска и почту. Чем дольше ты пользуешься платформой — тем дороже уход.\n\n> Закон Меткалфа и нулевые предельные издержки вместе объясняют монополии Web2: первый, кто набирает критическую массу, побеждает навсегда — потому что ценность сети растёт быстрее, чем любой конкурент может её нагнать.\n\nВ криптоэкономике этот закон работает в обе стороны. Блокчейн с большой аудиторией разработчиков, пользователей и ликвидности экспоненциально ценнее маленького. Но открытые протоколы меняют правило: если сеть децентрализована — её ценность принадлежит участникам, а не акционерам единственной компании.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["economics", "network-effects", "platforms", "tokenomics"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "trap", "sceneIndex": 2, "type": "power", "shortTitle": "Ловушка создателей", "era": "Web2", "lensWeight": {"chronology": 2, "attention": 3, "creators": 5, "networks": 3, "ownership": 3}, "title": "Ловушка создателей: почему контент не приносит денег", "insight": "Пересс показал: ловушка не в качестве контента. Настоящий продукт — это сообщество, а не контент. Платформы выиграли, построив инфраструктуру связей. Web3 возвращает её создателям.", "thesis": "Пересс показал: ловушка не в качестве контента. Настоящий продукт — это сообщество, а не контент. Платформы выиграли, построив инфраструктуру связей. Web3 возвращает её создателям.", "body": "## Парадокс изобилия\n\nКевин Келли в 1998 году сформулировал парадокс, который стал проклятием миллионов создателей контента: в мире изобилия информации ценность самой информации стремится к нулю.\n\nЛогика железная. Когда информация была дефицитом — за неё платили. Книги стоили дорого, потому что их было мало и их дорого производить. Музыкальный альбом стоил пятнадцать долларов, потому что физический CD нужно было произвести, упаковать, доставить. Статья эксперта стоила, потому что доступ к эксперту был редким.\n\nИнтернет уничтожил этот дефицит. Теперь любой может опубликовать что угодно. Любой может выпустить альбом, загрузить фильм, написать статью. Предложение контента — бесконечное. А бесконечное предложение при конечном спросе означает одно: цена стремится к нулю.\n\nЖурналист пишет кликбейтные заголовки — не потому что хочет, а потому что алгоритм вознаграждает именно это. Музыкант выпускает бесконечные синглы вместо альбомов — потому что Spotify платит за стримы, а не за качество. Художник подстраивает стиль под алгоритм Instagram — потому что иначе никто не увидит. Система деформирует творчество не через злой умысел — через стимулы.\n\n## Пересс: твой продукт — не контент\n\nДэвид Пересс в «The Content Trap» поставил правильный диагноз: создатели проигрывают платформам не потому что их контент плохой. А потому что они неправильно понимают, что именно они создают.\n\nПересс изучал медиаиндустрию и обнаружил закономерность: компании, которые думали, что их продукт — это контент, проигрывали. Компании, которые понимали, что их продукт — это сообщество вокруг контента, выигрывали.\n\nНью-Йорк Таймс — это не газета. Это сообщество людей, которые доверяют Нью-Йорк Таймс и возвращаются к нему каждый день. Когда это сообщество есть — монетизация возможна через подписки, события, специальные проекты. Когда его нет — ты просто один из миллионов сайтов в интернете.\n\nАртист — это не набор треков. Это отношения между артистом и его слушателями. Адель продаёт альбомы не потому что они лучше других альбомов. А потому что у неё есть армия преданных слушателей, которые чувствуют личную связь с ней.\n\nПлатформы выиграли именно это понимание: они не создавали контент — они строили инфраструктуру связей между создателями и аудиторией. Facebook не пишет посты. YouTube не снимает видео. Но они контролируют связь между теми, кто пишет, и теми, кто читает. И берут за это плату — вниманием пользователей.\n\nВывод Пересса: созда
