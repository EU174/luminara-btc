sans CEO qui prend les décisions seul.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["DAO", "tokenomics", "gouvernance", "DeFi"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "value", "sceneIndex": 6, "type": "economy", "shortTitle": "Valeur dans les réseaux", "era": "→protocoles", "lensWeight": {"chronology": 4, "attention": 2, "creators": 3, "networks": 5, "ownership": 5}, "title": "La valeur se crée dans les réseaux : des usines aux protocoles", "insight": "Les plus grandes entreprises du monde ne possèdent pas d'actifs physiques : elles possèdent une infrastructure de connexions. Web3 va plus loin : et si cette infrastructure appartenait aux participants eux-mêmes ?", "thesis": "Les plus grandes entreprises du monde ne possèdent pas d'actifs physiques : elles possèdent une infrastructure de connexions. Web3 va plus loin : et si cette infrastructure appartenait aux participants eux-mêmes ?", "body": "## Les plus grandes entreprises du monde ne possèdent rien de physique\n\nEn 1998, Kevin Kelly a écrit quelque chose qui paraissait provocateur à l'époque : dans la nouvelle économie, la valeur ne se crée pas dans la production, mais dans les liens.\n\nRegarde 2024 et tu comprendras qu'il avait raison.\n\nUber est le plus grand service de taxi au monde. Il ne possède pas une seule voiture. Airbnb est la plus grande entreprise hôtelière au monde. Elle ne possède pas une seule chambre. Facebook est le plus grand média au monde. Il ne produit pas une seule pièce de contenu. Alibaba est le plus grand détaillant de Chine. Il ne garde aucune marchandise en stock.\n\nQu'ont-ils alors ? Une infrastructure de connexions. Uber relie les conducteurs et les passagers. Airbnb relie les hôtes et les voyageurs. Facebook relie les gens entre eux. Alibaba relie les vendeurs et les acheteurs. La valeur réside dans le simple fait de relier, et non dans des actifs physiques.\n\nC'est un changement fondamental, de la logique industrielle à la logique de réseau. Dans l'économie industrielle, valeur = ressources + travail + capital. Pour créer de la valeur, il faut posséder les moyens de production. Dans l'économie de réseau, valeur = connexions × participants². Pour créer de la valeur, il faut organiser l'interaction entre les personnes.\n\n## Web3 : et si le réseau appartenait aux participants ?\n\nMais cela soulève la question suivante, et c'est précisément là que Web3 propose une réponse radicalement nouvelle.\n\nUber crée de la valeur en reliant les conducteurs et les passagers. Les conducteurs créent cette valeur par leur travail. Mais Uber appartient aux actionnaires, pas aux conducteurs. Les conducteurs sont payés pour une course. Ils ne reçoivent pas de part dans la croissance de la valeur du réseau, qu'ils créent eux-mêmes par leur travail.\n\nEt si le protocole qui relie les conducteurs et les passagers était gouverné par une DAO ? Les conducteurs recevraient des tokens proportionnellement à leur contribution. À mesure que le réseau grandirait, les tokens prendraient de la valeur. Un conducteur qui aurait aidé à construire le réseau dès les premiers jours profiterait de sa croissance, comme un premier employé d'une startup qui a reçu des options.\n\nCette idée est déjà mise en œuvre dans la DeFi. Uniswap, un échange décentralisé, répartit les frais de trading entre les fournisseurs de liquidité qui ont apporté des actifs aux pools. Compound distribue des tokens de gouvernance aux utilisateurs qui utilisent le protocole. Ce n'est pas une utopie. C'est un modèle qui fonctionne avec des milliards de dollars sous gestion.\n\nJared Lanier, dans l'essai \"Own the Internet\", a formulé le concept sans détour : la prochaine étape d'internet est un internet dont tu peux acheter une part. Pas seulement l'utiliser. En être propriétaire. Gagner avec sa croissance. Voter les changements.\n\nLe passage de « l'utilisateur comme produit » à « l'utilisateur comme copropriétaire » n'est pas seulement un changement technologique. C'est un changement politique. La question de savoir à qui appartient la valeur créée par un réseau est une question de répartition du pouvoir dans la société.\n\n> Kelly en 1998 : la valeur se crée dans les connexions, pas dans la production. Lanier en 2021 : et si les participants du réseau en étaient propriétaires ? Ensemble, ils décrivent le passage de « valeur pour la plateforme » à « valeur pour les participants ».\n\nCela se passe en ce moment, à l'échelle expérimentale. Des blockchains avec des milliards de dollars de TVL (Total Value Locked — valeur totale verrouillée), des DAO avec des milliers de participants, des créateurs avec des communautés NFT. Toutes les expériences n'ont pas réussi. Beaucoup ont échoué. Mais le principe fonctionne, et cela change tout.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1 ": "#c084fc", "description": "Կոնտենտի ծուղակը, հազար իրական երկրպագու և երկար պոչի տնտեսությունը։"}, {"id": "networks", "label": "Ցանցեր", "accent": "#34d399", "description": "Մետկալֆի օրենքը և զրոյական ծախսերը․ ինչու հաղթողը վերցնում է ամեն ինչ։"}, {"id": "ownership", "label": "Սեփականություն", "accent": "#f87171", "description": "DAO և կապերի ենթակառուցվածք․ իսկ եթե այն պատկանի մասնակիցներին՞"}], "nodes": [{"id": "wu", "sceneIndex": 0, "type": "media", "shortTitle": "Թիմ Ու", "era": "200 տարի", "lensWeight": {"chronology": 5, "attention": 5, "creators": 2, "networks": 2, "ownership": 1}, "title": "Թիմ Ու: ուշադրությունը վաճառելու պատմությունը", "insight": "Թիմ Ու-ն ցույց տվեց․ ուշադրություն վաճառելը երկու հարյուր տարվա մոդել է՝ թերթերից մինչև TikTok։ Web2-ը այն հասցրեց տարեկան 600 միլիարդ դոլարի։ Տարբերությունը միայն թիրախավորման ճշգրտության մեջ է։", "thesis": "Թիմ Ու-ն ցույց տվեց․ ուշադրություն վաճառելը երկու հարյուր տարվա մոդել է՝ թերթերից մինչև TikTok։ Web2-ը այն հասցրեց տարեկան 600 միլիարդ դոլարի։ Տարբերությունը միայն թիրախավորման ճշգրտության մեջ է։", "body": "## Մեկ ցենտանոց թերթը և ուշադրության առաջին գործարքը\n\n1833 թվականին ամերիկացի հրատարակիչ Բենջամին Դեյը մի բան հորինեց, որը հավերժ փոխեց մեդիաբիզնեսը։ Նա սկսեց New York Sun թերթը վաճառել մեկ ցենտով՝ արտադրության ինքնարժեքից երեք-չորս անգամ էժան։ Շրջապատում բոլորը մտածում էին, թե նա խելքը կորցրել է. ինչպես կարելի է շահույթ ստանալ՝ վաճառելով ավելի էժան, քան արժե արտադրելը՞\n\nՊատասխանը պարզ և հանճարեղ էր։ Էժան թերթը գրավում էր ընթերցողներին՝ բանվորական դասի մարդկանց, որոնք նախկինում գնի պատճառով մամուլ չէին գնում։ Շատ ընթերցողներ նշանակում էին լսարան։ Իսկ լսարանը նա վաճառում էր գովազդատուներին։ Ընթերցողը վճարում էր ուշադրությամբ, գովազդատուն՝ գումարով։ Թերթը ոչ թե ապրանքն էր, այլ՝ խայծը։\n\nՍա պատմության մեջ ուշադրություն վաճառելու առաջին գործարքն էր։ Եվ այդ օրվանից՝ գրեթե երկու հարյուր տարի շարունակ, դրա կառուցվածքը չի փոխվել։ Փոխվել է միայն մասշտաբը։\n\nԹիմ Ու-ն «The Attention Merchants» գրքում այս տրամաբանությունը հետևել է երկու դարերի ընթացքում՝ զարմանալի ճշգրտությամբ։ Յուրաքանչյուր նոր մեդիա կրկնեց նույն սխեման։ 1920-ականների ռադիոն՝ անվճար բովանդակությունը գրավում է լսողներին, լսողներին վաճառում են գովազդատուներին։ 1950-ականների հեռուստատեսությունը՝ նույն սխեման, բայց շարժվող պատկերով և ավելի լայն հասանելիությամբ։ Մալուխային հեռուստատեսությունը՝ նույն սխեման, բայց բաժանորդագրությամբ։ Web1 ինտերնետը՝ բովանդակությունը անվճար է, բայց ուշադրությունը դեռ չի մոնետիզացվում։ Web2՝ ուշադրության մոնետիզացիան հասնում է արդյունաբերական մասշտաբի։\n\n## Մեծ կորզումը. երբ դու դարձար ապրանքը\n\nՎուն այն, ինչ տեղի է ունենում, անվանում է «մեծ կորզում»։ Մեդիա համակարգը համակարգված կերպով վերցնում է մարդկանց ուշադրությունը՝ մեր ունեցած ամենաչվերականգնվող ռեսուրսը, և այն փոխակերպում փողի՝ երրորդ կողմերի համար։\n\nԿոնկրետ թվերը օգնում են հասկանալ մասշտաբը։ 2023 թվականին Facebook-ի միջին օգտատերը օրական մոտ 35 րոպե էր անցկացնում հավելվածում։ Facebook-ը ԱՄՆ-ում այդ օգտատիրոջից տարեկան մոտ 50 դոլար էր վաստակում՝ գովազդի միջոցով։ Օգտատերը ոչինչ չէր ստանում՝ բացի հենց ծառայությունից։ Գործարքը միակողմանի էր։\n\nGoogle-ը փող է վաստակում որոնման հարցումներից. յուրաքանչյուր հարցում մտադրության ազդանշան է, որը վաճառվում է գովազդատուներին։ Դու որոնում ես «գնել բազմոց» — Google-ը այդ տեղեկությունը վաճառում է կահույքի խանութներին։ Դու գումարով չես վճարում։ Դու վճարում ես մտադրությամբ։\n\nFacebook-ը փող է վաստակում սոցիալական կապերից. յուրաքանչյուր like հոգեբանական պրոֆիլի մասին տվյալ է։ Դու like ես դնում որոշ հրապարակումների վրա — Facebook-ը գիտի քո արժեքները, վախերը, քաղաքական հայացքները։ Այդ գիտելիքը նա վաճառում է գովազդատուներին, քաղաքական արշավներին, բոլոր նրանց, ովքեր պատրաստ են վճարել։\n\nTikTok-ը փող է վաստակում ժամանակից. հավելվածում անցկացրած յուրաքանչյուր լրացուցիչ վայրկյանը փող է։ Նրա ալգորիթմը օպտիմալացված է մեկ բանի համար՝ քեզ որքան հնարավոր է երկար պահելու։ Ոչ թե որովհետև դա լավ է քեզ համար։ Այլ որովհետև դա լավ է նրա գովազդային եկամուտի համար։\n\nԹվային գովազդի ընդհանուր շուկան 2023 թվականին գերազանցեց տարեկան 600 միլիարդ դոլարը։ Համեմատության համար՝ դա ավելի շատ է, քան Շվեդիայի ՀՆԱ-ն։ Այդ ամբողջ գումարը մարդկային ուշադրության մոնետիզացիա է, որը մարդիկ տալիս են՝ կարծելով, թե օգտվում են անվճար ծառայությունից։\n\nՎուն մատնանշում է հիմնարար ասիմետրիա․ մարդիկ չեն գիտակցում գործարքի պայմանները։ Ոչ մի տեղ գրված չէ՝ «քո ուշադրությունը տարեկան 50 դոլար արժե, և մենք այն վաճառում ենք»։ Գրված է՝ «Անվճար։ Պարզապես գրանցվեք»։\n\n> Վուն ցույց տվեց. ուշադրություն վաճառելը ինտերնետի հայտնագործությունը չէ։ Սա երկու հարյուր տարվա մոդել է, որը Web2-ը հասցրեց արդյունաբերական մասշտաբի։ Մեկ ցենտանոց թերթի և TikTok-ի տարբերությունը միայն թիրախավորման ճշգրտության և շուկայի չափի մեջ է։\n\nԱյս ըմբռնումը փոխում է, թե ինչպես ես նայում «անվճար» ծառայություններին։ Ոչինչ անվճար չէ։ Միակ հարցն այն է, թե հասկանում ես արդյոք, թե ինչով ես վճարում։ Web3-ը կառուցող նոր տնտեսությունը փորձում է փոխել այդ գործարքը՝ դարձնելով այն բաց, արդար և փոխադարձ.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (198  ծախսեր + Մետկալի օրենքը = Web2-ի մոնոպոլիաներ։ Կրիտիկական զանգվածին առաջինը հասնողը հաղթում է ընդմիշտ։ Web3-ի բաց protocol-ները փոխում են այս կանոնը։", "thesis": "Տեղեկատվության զրոյական մարժային ծախսեր + Մետկալի օրենքը = Web2-ի մոնոպոլիաներ։ Կրիտիկական զանգվածին առաջինը հասնողը հաղթում է ընդմիշտ։ Web3-ի բաց protocol-ները փոխում են այս կանոնը։", "body": "## Զրոյական մարժային ծախսեր. ինչու է տեղեկատվությունը առանձնահատուկ\n\nԻնտերնետի տնտեսությունը հասկանալու համար պետք է հասկանալ մի բան, որը տեղեկատվական արտադրանքները սկզբունքորեն տարբեր է դարձնում։ Հել Վերիանը և Կարլ Շապիրոն սա նկարագրել են դեռ 1999 թվականին հրատարակված «Information Rules» գրքում, և նրանց դիտարկումները մեկ օր անգամ չեն հնացել։\n\nՖիզիկական ապրանքը՝ սառնարան, ավտոմեքենա, հաց, ամեն անգամ արտադրելիս փող է արժենում։ Պետք են հումք, աշխատանք, էներգիա։ Հազարերորդ սառնարանը արտադրելն արժե մոտավորապես այնքան, որքան առաջինը։ Սա կոչվում է «մարժային ծախսեր»՝ ապրանքի ևս մեկ միավոր արտադրելու արժեքը։\n\nՏեղեկատվական արտադրանքը՝ ֆիլմ, ծրագիր, երգ, հոդված, փող է արժենում մեկ անգամ՝ ստեղծման պահին։ Այս գրքի առաջին պատճենը գրելն ամիսների աշխատանք արժեցավ։ Երկրորդ պատճենը գրելն՝ զրո։ Ֆայլ պարզապես պատճենել։ Տեղեկատվության մարժային ծախսերը ձգտում են զրոյի։\n\nՍա փոխում է ամբողջ տնտեսական տրամաբանությունը։ Եթե մարժային ծախսերը զրոյական են՝ կարող ես ապրանքը անվճար բաժանել և փող վաստակել այլ բանից։ Ուշադրությունից։ Տվյալներից։ Բաժանորդագրությունից։ Գովազդից։ Հենց դրա համար է Google-ը անվճար։ Հենց դրա համար է Spotify-ը ամսական 10 եվրոյով տալիս 100 միլիոն թրեքի հասանելիություն։ Հենց դրա համար է Facebook-ը անվճար՝ դրամայնացվում է ոչ թե բովանդակությունը, այլ տվյալները։\n\n## Մետկալի օրենքը. հաղթողների մաթեմատիկան\n\nՌոբերտ Մետկալֆը, Ethernet-ի (տեղային ցանցերի տեխնոլոգիա) ստեղծողներից մեկը, ձևակերպեց մի օրենք, որը բացատրում է իշխանության կառուցվածքը թվային տնտեսությունում. ցանցի արժեքը համեմատական է դրա մասնակիցների քանակի քառակուսուն։\n\nՀեռախոսների պարզ օրինակով։ Աշխարհում մեկ հեռախոսը անօգուտ է, զանգելու մարդ չկա։ Երկու հեռախոս՝ մեկ կապ, նվազագույն արժեք։ Տասը հեռախոս՝ 45 հնարավոր կապ։ Հազար հեռախոս՝ գրեթե կես միլիոն հնարավոր կապ։ Միլիոն հեռախոս՝ մոտ 500 միլիարդ հնարավոր կապ։ Արժեքը աճում է ոչ թե գծային, այլ էքսպոնենցիալ։\n\nՊլատֆորմների համար սա նշանակում է. առաջին պլատֆորմը, որը հավաքում է կրիտիկական զանգված, դառնում է գրեթե անպարտելի։ Ոչ թե որովհետև լավագույնն է։ Այլ որովհետև այնտեղ բոլորը կան, և դա այն ավելի արժեքավոր է դարձնում յուրաքանչյուր օգտատիրոջ համար։\n\nԵրկու միլիարդ օգտատեր ունեցող Facebook-ը օբյեկտիվորեն ավելի արժեքավոր է, քան միլիոն ունեցող այլընտրանքը, որովհետև այնտեղ քո իրական ծանոթներն ավելի շատ են։ Google-ն ավելի արժեքավոր է, քան այլ որոնիչը, որովհետև հարցումների ավելի մեծ ծավալը ալգորիթմն ավելի ճշգրիտ է դարձնում։ Amazon-ը փոքր խանութից ավելի արժեքավոր է. ավելի շատ վաճառողներ ավելի շատ գնորդներ են գրավում, ավելի շատ գնորդներ՝ ավելի շատ վաճառողներ։\n\nՎերիանը և Շապիրոն նաև նկարագրել են lock-in-ի՝ փակման մեխանիզմը։ Երբ ժամանակ, տվյալներ և սովորություններ ես ներդրել որևէ պլատֆորմի մեջ, այլ հարթակ տեղափոխվելը ցավոտ է դառնում։ Instagram-ում քո լուսանկարները, WhatsApp-ում քո կոնտակտները, YouTube-ում քո պատմությունը պարզապես տվյալներ չեն։ Դրանք ելքի խոչընդոտ են, որը պլատֆորմները միտումնավոր են ստեղծում։\n\nMicrosoft-ը կորպորատիվ հաճախորդներին պահում էր Office ձևաչափերի համատեղելիության միջոցով։ Apple-ը օգտատերերին պահում է սարքերի էկոհամակարգի միջոցով։ Google-ը պահում է որոնման պատմության և փոստի միջոցով։ Պլատֆորմը որքան երկար ես օգտագործում, այնքան թանկ է դառնում հեռանալը։\n\n> Մետկալի օրենքը և զրոյական մարժային ծախսերը միասին բացատրում են Web2-ի մոնոպոլիաները. առաջինը, որ հավաքում է կրիտիկական զանգված, հաղթում է ընդմիշտ, որովհետև ցանցի արժեքը աճում է ավելի արագ, քան որևէ մրցակից կարող է հասցնել նրան։\n\nՔրիպտոտնտեսությունում այս օրենքը գործում է երկու ուղղությամբ։ Մեծ թվով մշակողների, օգտատերերի և իրացվելիության համայնք ունեցող blockchain-ը էքսպոնենցիալ ավելի արժեքավոր է, քան փոքրինը։ Բայց բաց protocol-ները փոխում են կանոնը. եթե ցանցը դեցենտրալիզացված է, նրա արժեքը պատկանում է մասնակիցներին, ոչ թե մեկ ընկերության բաժնետերերին.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис  արժեք ուներ, որովհետև փորձագետին հասնելը հազվադեպ էր։\n\nԻնտերնետը կործանեց այդ սակավությունը։ Այժմ ցանկացած մարդ կարող է հրապարակել ամեն ինչ։ Ցանկացած մարդ կարող է ալբոմ թողարկել, ֆիլմ վերբեռնել, հոդված գրել։ Բովանդակության առաջարկը անսահման է։ Իսկ անսահման առաջարկը սահմանափակ պահանջարկի դեպքում նշանակում է մեկ բան՝ գինը ձգտում է զրոյի:\n\nԼրագրողը գրում է clickbait վերնագրեր ոչ թե որովհետև ուզում է, այլ որովհետև ալգորիթմը հենց դա է պարգևատրում։ Երաժիշտը ալբոմների փոխարեն թողարկում է անընդհատ սինգլներ, որովհետև Spotify-ն վճարում է stream-երի, ոչ թե որակի համար։ Նկարիչը իր ոճը հարմարեցնում է Instagram-ի ալգորիթմին, որովհետև հակառակ դեպքում ոչ ոք չի տեսնի։ Համակարգը ստեղծարարությունը խեղում է ոչ թե չար մտադրությամբ, այլ խթաններով։\n\n## Պերես. քո ապրանքը բովանդակությունը չէ\n\nDavid Peress-ը «The Content Trap»-ում ճիշտ ախտորոշում տվեց. ստեղծողները հարթակներին պարտվում են ոչ թե որովհետև իրենց բովանդակությունը վատն է։ Նրանք պարտվում են, որովհետև սխալ են հասկանում, թե կոնկրետ ինչ են ստեղծում։\n\nՊերեսը ուսումնասիրեց մեդիաարդյունաբերությունը և մի օրինաչափություն գտավ. այն ընկերությունները, որոնք կարծում էին, թե իրենց ապրանքը բովանդակությունն է, պարտվում էին։ Այն ընկերությունները, որոնք հասկանում էին, որ իրենց ապրանքը բովանդակության շուրջ ձևավորված համայնքն է, հաղթում էին։\n\nThe New York Times-ը թերթ չէ։ Դա մարդկանց համայնք է, որոնք վստահում են The New York Times-ին և ամեն օր վերադառնում են նրան։ Երբ այդ համայնքը կա, մոնետիզացիան հնարավոր է բաժանորդագրությունների, միջոցառումների և հատուկ նախագծերի միջոցով։ Երբ այն չկա, դու պարզապես ինտերնետի միլիոնավոր կայքերից մեկն ես։\n\nԱրտիստը երգերի հավաքածու չէ։ Դա արտիստի և նրա լսարանների միջև հարաբերությունն է։ Adele-ն ալբոմներ է վաճառում ոչ թե որովհետև դրանք ավելի լավն են, քան մյուս ալբոմները։ Նա դրանք վաճառում է, որովհետև ունի նվիրված լսողների բանակ, որոնք նրա հետ անձնական կապ են զգում։\n\nՀարթակները հենց այս ըմբռնման շնորհիվ հաղթեցին. դրանք բովանդակություն չէին ստեղծում, այլ ստեղծողների և լսարանի միջև կապերի ենթակառուցվածք էին կառուցում։ Facebook-ը գրառումներ չի գրում։ YouTube-ը տեսանյութեր չի նկարահանում։ Բայց դրանք վերահսկում են կապը նրանց միջև, ովքեր գրում են, և նրանց միջև, ովքեր կարդում են։ Եվ դրա համար վճար են վերցնում՝ օգտատերերի ուշադրությամբ։\n\nՊերեսի եզրակացությունը պարզ է. ստեղծողը, որը ցանկանում է դուրս գալ թակարդից, պետք է դադարի մտածել բովանդակության մասին և սկսի մտածել համայնքի մասին։ Պետք է կառուցել ուղիղ հարաբերություններ լսարանի հետ։ Մոնետիզացնել պատկանելությունը, ոչ թե դիտումները։\n\n> Պերեսը հստակ ձևակերպեց. թակարդը բովանդակության որակի մեջ չէ։ Թակարդն այն է, որ դու կարծում ես, թե քո ապրանքը բովանդակությունն է։ Քո ապրանքը համայնքն է։ Հարթակները կառուցեցին կապերի ենթակառուցվածքը և վերցրին այն իրենց վերահսկողության տակ։ Web3-ը ստեղծողին վերադարձնում է այդ վերահսկողությունը։\n\nԱհա թե ինչու Web3-ում token-ները, NFT-ները և ուղիղ վճարումները պարզապես հարմարություն չեն։ Դրանք գործիքներ են համայնքը անմիջապես մոնետիզացնելու համար, առանց միջնորդ հարթակի։", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткал րպագու՝ յուրաքանչյուրը 100 դոլարով = տարեկան 100k։ 2020-ականներին Web3-ը տվեց գործիքները՝ token-ներ, NFT և ուղիղ վճարումներ՝ առանց պլատֆորմների միջնորդավճարների։ Մանիֆեստը դարձավ բիզնես-մոդել։", "thesis": "Քելլին 2008-ին. հազար իրական երկրպագու՝ յուրաքանչյուրը 100 դոլարով = տարեկան 100k։ 2020-ականներին Web3-ը տվեց գործիքները՝ token-ներ, NFT և ուղիղ վճարումներ՝ առանց պլատֆորմների միջնորդավճարների։ Մանիֆեստը դարձավ բիզնես-մոդել։", "body": "## Իր ժամանակից առաջ ընկած էսսե\n\n2008 թվականին Քևին Քելլին գրեց «1,000 True Fans» կարճ էսսեն։ Այն դարձավ ստեղծագործական տնտեսության մասին ամենահաճախ մեջբերվող տեքստերից մեկը, և 2008-ին դա գեղեցիկ մանիֆեստ էր՝ առանց գործնական գործիքների։ 2020-ականներին այն դարձավ աշխատող բիզնես-մոդել։\n\nՆրա փաստարկը նուրբ է. ստեղծողին պետք չեն միլիոնավոր պատահական բաժանորդներ։ Նրան պետք է հազար իրական երկրպագու՝ մարդիկ, որոնք կգնեն այն ամենը, ինչ նա կստեղծի։ Կոշտ կազմով գիրքը և փափուկ կազմովը։ Համերգի տոմսը և համերգի ձայնագրությունը։ Սահմանափակ տպաքանակով պաստառը և սովորական պաստառը։ Փակ համայնքի հասանելիությունը և հրապարակային բովանդակությունը։\n\nՄաթեմատիկան պարզ է։ Հազար երկրպագու, որոնցից յուրաքանչյուրը տարեկան ծախսում է 100 դոլար, դա 100 000 դոլար է։ Սա համեստ, բայց բավարար եկամուտ է անկախ ստեղծողի համար։ Ոչ թե միլիոնատեր դառնալու համար։ Այլ ստեղծագործական ազատությունը պահպանելու և ալգորիթմներից կախված չլինելու համար։\n\nՊլատֆորմային մոդելի հետ հակադրությունը կտրուկ է։ YouTube-ում մեկ միլիոն դիտումից կարելի է վաստակել 1 000-ից մինչև 3 000 դոլար՝ կախված բովանդակության կատեգորիայից և լսարանի դեմոգրաֆիայից։ Սա նշանակում է, որ YouTube-ում տարեկան 100 000 դոլար վաստակելու համար պետք է մոտ 40–100 միլիոն դիտում տարեկան։ Սա հասանելի է միայն քչերին։\n\nԻսկ ի՞նչ կասեք հազար մարդու մասին, որոնք ուղղակիորեն վճարում են 100 դոլար։ Դա հասանելի է շատերին, եթե կա ուղիղ վճարումների գործիք։\n\n## Ինչպես Web3-ը դրա համար գործիքներ տվեց\n\n2008 թվականին Քելլին նկարագրեց գաղափարը, բայց չէր կարող նկարագրել մեխանիզմը։ Ինչպե՞ս գտնել այդ հազարին։ Ինչպե՞ս ուղղակի գումար ստանալ՝ առանց միջնորդ բանկի և առանց 30% վերցնող վճարային պլատֆորմի։ Ինչպե՞ս պահպանել հարաբերությունը մարդկանց հետ, երբ ալգորիթմն է որոշում՝ ով ինչ է տեսնում։\n\nWeb3-ը տվեց պատասխանները։\n\nToken-ները թույլ են տալիս երկրպագուին դառնալ նախագծի համասեփականատեր։ Ոչ պարզապես գնորդ, այլ մասնակից։ Վաղ աջակցողը, որը token-ներ է գնել մինչև լայն ճանաչումը, շահում է նախագծի աճին զուգընթաց։ Սա հավասարեցնում է շահերը. ստեղծողը շահագրգռված է աճով, և երկրպագուն՝ նույնպես։ Երկուսն էլ շահում են հաջողությունից։\n\nNFT — Non-Fungible Tokens — տալիս են եզակի թվային ակտիվներ։ Ստեղծողը սահմանափակ աշխատանքների շարքը վաճառում է անմիջապես հավաքորդներին։ Առանց 50% վերցնող պատկերասրահի։ Առանց գնորդների տվյալները վերցնող պլատֆորմի։ Եվ smart contract-ը ավտոմատ կերպով վճարում է ստեղծողին ռոյալթի յուրաքանչյուր հաջորդ վերավաճառքի ժամանակ, նույնիսկ տասը տարի անց։ Սա անհնար է ավանդական աշխարհում. նկարիչը վաճառում է նկարը և այլևս ոչինչ չի ստանում, որքան էլ այն թանկանա։ Web3-ում նա ստանում է յուրաքանչյուր գործարքից տոկոս՝ ընդմիշտ։\n\nՈւղիղ վճարումներ blockchain-ի միջոցով՝ առանց Stripe-ի միջնորդավճարի (2,9%), առանց PayPal-ի միջնորդավճարի (3–5%), առանց App Store-ի միջնորդավճարի (30%)։ TON wallet-ը թույլ է տալիս ստանալ վճարում՝ ցենտի մասերի չափով միջնորդավճարով։ Տասը հազար չէ, այլ հազար երկրպագուի կողմից ուղիղ վճարումներ ստացող ստեղծողի համար սա նշանակում է՝ նա ստանում է գրեթե ամեն ինչ։\n\nԼի Ջինը «The Passion Economy»-ում նկարագրեց ավելի լայն տեղաշարժ. «պլատֆորմների տնտեսությունից», որտեղ ստեղծողները կախված են պլատֆորմի ալգորիթմական որոշումներից, դեպի «կրքի տնտեսություն», որտեղ խորությունն ավելի կարևոր է, քան լայնությունը։ Հարյուր մարդ, որոնք տարեկան հազար դոլար են վճարում քեզ եզակի հասանելիության համար, ավելի լավ է, քան մեկ միլիոն պատահական դիտող, որոնցից դու ոչինչ չես ստանում։\n\n> Քելլին մանիֆեստը գրեց 2008-ին։ Web3-ը 2020-ականներին տվեց այն կիրառելու գործիքները։ Հազար իրական երկրպագուներ՝ գումարած token-ներ, NFT և ուղիղ վճարումներ, անկախ ստեղծողի համար աշխատող բիզնես-մոդել է։\n\nՍա ամբողջությամբ չի վերացնում պլատֆորմները։ Բայց փոխում է ուժերի հավասարակշռությունը. ստեղծողն այլևս ամբողջովին կախված չէ ուրիշի ընկերության ալգորիթմական որոշումներից։ Նա ունի այլընտրանքային ճանապարհ դեպի լսարանն ու մոնետիզացիան։", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["ստեղծողներ", "տոկենոմիկա", "NFT", "կրքի տնտեսություն"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "longtail", "sceneIndex": 4, "type": "media", "shortTitle": "Երկար պոչ", "era": "2004", "lensWeight": {"chronology": 3, "attention": 2, "creators": 4, "networks": 4, "ownership": 3}, "title": "Երկար պոչը՝ նիշային տնտեսություն", "insight": "Երկար պոչը. թվային աշխարհում նիշային ստեղծողների համար տեղը անսահման է: Web2-ը դեռ նրանց ու լսարանի միջև ալգորիթմ էր դնում: Web3-ը կառուցում է ուղիղ ալիքներ՝ առանց դարպասապահի.", "thesis": "Երկար պոչը. թվային աշխարհում նիշային ստեղծողների համար տեղը անսահման է: Web2-ը դեռ նրանց ու լսարանի միջև ալգորիթմ էր դնում: Web3-ը կառուցում է ուղիղ ալիքներ՝ առանց դարպասապահի.", "body": "## Հիթերի դիկտատուրայի ավարտը\n\nԹվային տնտեսությունը փոխեց շուկաների կառուցվածքը, և դա կարելի է հասկանալ պարզ համեմատությամբ.\n\nՊատկերացրու 1990-ականների երաժշտական խանութը. Այն ունի սահմանափակ տարածք՝ հազար-երկու հազար քառակուսի մետր, սահմանափակ թվով դարակներ: Ի՞նչ է այն ցուցադրում: Հիթեր: Ալբոմներ, որոնք շաբաթական հազարավոր օրինակներով են վաճառվում: Որովհետև դարակի տեղը սակավ ռեսուրս է: Նիշային կատարողները, որոնց լսում են ամբողջ երկրում ընդամենը հարյուր մարդ, այնտեղ չեն հայտնվում: Խանութի համար շահավետ չէ պահել մի ալբոմ, որը ամսական մեկ օրինակ է վաճառում.\n\nԱյժմ Spotify-ը. Այն չունի ֆիզիկական դարակներ: Եվս մեկ միլիոն թրեք պահելը գործնականում ոչինչ չի արժենում՝ թվային տվյալներ են: Այդ պատճառով Spotify-ը կարող է միաժամանակ առաջարկել 100 միլիոն թրեք: Ներառյալ նրանց, որոնց լսում են ամբողջ աշխարհում ընդամենը հարյուր մարդ.\n\nՍա է երկար պոչը՝ Կրիս Անդերսոնի 2006 թվականի գրքում նկարագրված գաղափարը: Հանրաճանաչության կորի վրա կա «գլուխը»՝ հսկայական լսարան ունեցող մի քանի սուպերհիթեր: Եվ կա «պոչը»՝ փոքր, բայց գոյություն ունեցող լսարան ունեցող նիշային ապրանքների անվերջ բազմություն: Ֆիզիկական աշխարհում «գլուխը» գերիշխում է. դարակներ են հասնում միայն հիթերը: Թվային աշխարհում «պոչը» անսահման է, և նիշային ապրանքների համակցված լսարանը կարող է գերազանցել հիթերի լսարանին.\n\n## Ինչ է սա նշանակում ստեղծողների համար\n\nԱնդերսոնը հետազոտություն է անցկացրել Amazon-ի և Netflix-ի համար և պարզել է. նրանց եկամտի զգալի մասը գալիս է ոչ թե բեսթսելերներից, այլ միլիոնավոր նիշային ապրանքներից, որոնցից յուրաքանչյուրը հազվադեպ է վաճառվում, բայց միևնույն է վաճառվում է.\n\nՍտեղծողների համար սա արմատապես փոխում է իրավիճակը. Ինտերնետից առաջ, որպեսզի լինես պրոֆեսիոնալ երաժիշտ, պետք էր հայտնվել ռադիոյում, պայմանագիր կնքել լեյբլի հետ, հասնել միլիոնավոր ունկնդիրների: Նիշային կատարողը, որին ամբողջ աշխարհում սիրում են քսան հազար մարդ, չէր կարող դրա վրա կարիերա կառուցել, որովհետև այդ քսան հազարը ցրված էր, և նրան հասնելու միջոց չկար.\n\nԻնտերնետը փոխեց սա. նիշային լսարանները դարձան գտանելի և հասանելի: Բայց Web2-ը նոր խնդիր ստեղծեց. ալգորիթմները աշխատում են «գլխի» օգտին: YouTube-ը խորհուրդ է տալիս արդեն հայտնի բաները: Instagram-ը առաջ է մղում բարձր ներգրավվածություն ունեցող բովանդակությունը: TikTok-ը վիրուսային է դարձնում այն, ինչը արդեն վիրուսային է դառնում: Նիշային ստեղծողը ընկնում է թակարդի մեջ. տեսականորեն նրա լսարանը գոյություն ունի, բայց ալգորիթմը չի օգնում այն գտնել՝ այն զբաղված է սուպերհիթերի առաջմղմամբ.\n\nWeb3-ը կարող է դա փոխել. Եթե ստեղծողը ունի ուղիղ կապ լսարանի հետ՝ դրամապանակների, թոքենների, ապակենտրոնացված պրոտոկոլների միջոցով՝ նրան պետք չէ մրցել ալգորիթմական ուշադրության համար: Նրա քսան հազար իրական երկրպագուները բաժանորդագրված են ուղղակիորեն: Ալգորիթմը այլևս դարպասապահ չէ.\n\n> Անդերսոնը ցույց տվեց. թվային աշխարհը տեղ է ստեղծում անսահման թվով նիշային ստեղծողների համար: Web2-ը նրանց գործիքներ չտվեց՝ ալգորիթմները աշխատում էին նրանց դեմ: Web3-ը կառուցում է ուղիղ ալիքներ, որտեղ նիշային ստեղծողը կախված չէ առաջարկությունների համակարգից.\n\nՍա չի նշանակում, որ յուրաքանչյուր նիշային ստեղծող կհարստանա: Բայց դա նշանակում է՝ նրանք, ովքեր ստեղծում են եզակի բան, իրական հնարավորություն ունեն գտնելու իրենց լսարանը և դրա վրա կառուցելու կայուն եկամուտ՝ առանց սուպերաստղ դառնալու անհրաժեշտության.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["ստեղծողներ", "տնտեսություն", "երկար պոչ", "համայնք"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "dao", "sceneIndex": 5, "type": "technology", "shortTitle": "DAO", "era": "Web3", "lensWeight": {"chronology": 3, "attention": 1, "creators": 3, "networks": 4, "ownership": 5}, "title": "DAO. տնօրեն չունեցող ընկերություն", "insight": "DAO-ն կազմակերպություն է code-ի մեջ՝ token-ները որպես ձայներ, smart contract-ները որպես կատարողներ։ Չկա որևէ CEO, որը կարող է արգելափակել մեծամասնության որոշումը։ Առաջին անգամ՝ համակարգում առանց կենտրոնացված կառավարման։", "thesis": "DAO-ն կազմակերպություն է code-ի մեջ՝ token-ները որպես ձայներ, smart contract-ները որպես կատարողներ։ Չկա որևէ CEO, որը կարող է արգելափակել մեծամասնության որոշումը։ Առաջին անգամ՝ համակարգում առանց կենտրոնացված կառավարման։", "body": "## Կազմակերպման նոր ձև\n\n2014 թվականին Վիտալիկ Բուտերինը գրեց էսսե, որը սկսվում էր մի հարցով. իսկ եթե հնարավոր լիներ կազմակերպություն գործարկել առանց կառավարման մեջ մարդկանց?\n\nԴա հնչում էր ինչպես գիտաֆանտաստիկա։ Բայց գաղափարը ուներ երկաթե տրամաբանություն։\n\nԱվանդական ընկերությունը հիերարխիա է։ Կան բաժնետերեր (սեփականատերեր), կա տնօրենների խորհուրդ (ռազմավարական կառավարում), կա կառավարում (օպերատիվ կառավարում), կան աշխատակիցներ (կատարում)։ Յուրաքանչյուր մակարդակում կա գործակալական խնդիր․ ուրիշի փողը կառավարող մարդն ունի սեփական շահեր, որոնք կարող են չհամընկնել սեփականատերերի շահերի հետ։ Մենեջերը կարող է որոշումներ ընդունել իր, ոչ թե ընկերության օգտին։ Տնօրենը կարող է աշխատել խոշոր բաժնետիրոջ համար՝ փոքրերի հաշվին։\n\nԲուտերինը առաջարկեց. իսկ եթե կազմակերպության կանոնները գրվեն smart contract-ի մեջ? Code-ը չի կարելի կաշառել։ Code-ը չի կարող որոշում ընդունել մեկ մասնակցի օգտին՝ մյուսների դեմ։ Code-ը կատարում է հենց այն, ինչ գրված է նրա մեջ։\n\nԱյսպես ծնվեց DAO-ի գաղափարը — Decentralized Autonomous Organization, ապակենտրոնացված ինքնավար կազմակերպություն։\n\n## Ինչպես է DAO-ն աշխատում գործնականում\n\nՊատկերացրու մի կազմակերպություն, որը ղեկավարում է DeFi-protocol, օրինակ՝ ապակենտրոնացված exchange-ը։ Այդ կազմակերպությունը չունի CEO, չունի գրասենյակ, չունի իրավաբանական հասցե։ Կա smart contract, որը սահմանում է կանոնները, և կան governance tokens՝ թվային ձայներ։\n\nՅուրաքանչյուր token-ի սեփականատեր կարող է առաջարկություն դնել քվեարկության։ «Փոխենք 0.3%-ից մինչև 0.25% հանձնաժողովը»։ «Ավելացնենք նոր ակտիվի աջակցությունը»։ «Protocol-ի եկամուտների 10%-ը ուղղենք պահուստային ֆոնդին»։ Token-ի սեփականատերերը քվեարկում են։ Եթե առաջարկը հավաքում է բավական ձայներ, smart contract-ը այն ավտոմատ կատարում է։ Չկա CEO, որը կարող է արգելափակել։ Չկա տնօրենների խորհուրդ, որը կարող է հետ բերել որոշումը։ Code-ը՝ օրենքն է։\n\nԱռաջին խոշոր DAO-ն — The DAO-ն — գործարկվեց 2016 թվականին Ethereum-ում և մասնակիցներից հավաքեց 150 միլիոն դոլար։ Մի քանի շաբաթ անց հաքերը գտավ code-ի խոցելիություն և դուրս բերեց միջոցների մեկ երրորդը։ Դա ցավոտ դաս էր․ DAO-ն այնքան է հուսալի, որքան հուսալի է նրա code-ը։ Smart contract-ի սխալը մարդկային գործոն չէ, որը կարելի է ուղղել։ Դա մաթեմատիկա է, որը կատարվում է բառացիորեն։\n\nԲայց գաղափարը գոյատևեց։ 2020-ականներին DAO-ները կառավարում են միլիարդավոր դոլարներ DeFi-protocol-ներում։ Uniswap-ը կառավարվում է DAO-ի միջոցով, որտեղ UNI token-ի սեփականատերերը քվեարկում են protocol-ի փոփոխությունների համար։ MakerDAO-ն կառավարում է DAI stablecoin-ը՝ MKR սեփականատերերի քվեարկությամբ։ Սրանք գործուն կազմակերպություններ են՝ իրական փողերով, առանց ավանդական կորպորատիվ կառուցվածքի։\n\nՌակեշ Ագրավալը «The Tokenized Economy»-ում նկարագրում է token-ների ավելի խոր իմաստը այս համատեքստում։ DAO-ի token-ը պարզապես քվեարկելու իրավունք չէ։ Դա շահերի համընկեցում է։ Եթե protocol-ը աճում է և ավելի արժեքավոր դառնում, token-ները թանկանում են բոլորի համար՝ և՛ մշակողների, և՛ օգտատերերի, և՛ ներդրողների։ Բոլորն էլ միաժամանակ շահագրգռված են աճով։ Ավանդական ընկերությունում սա գրեթե անհնար է հասնել․ բաժնետերերի և օգտատերերի շահերը կառուցվածքայինորեն հակադիր են։\n\n> DAO-ն իդեալական կազմակերպություն չէ։ Դա այլ կազմակերպություն է՝ այլ փոխզիջումներով, այլ ռիսկերով, այլ հնարավորություններով։ Ամենակարևորը․ առաջին անգամ տեխնիկական հնարավորություն հայտնվեց մարդկանց միասնական նպատակի շուրջ համակարգելու առանց կենտրոնացված կառավարման։\n\nՍտեղծագործողների, համայնքների և փոքր բիզնեսի համար սա բացում է հետաքրքիր հնարավորություններ՝ համատեղ սեփականություն, թափանցիկ կառավարում, եկամուտների ավտոմատ բաշխում։ Այս ամենը՝ առանց իրավաբանական ընկերությունների, առանց բանկերի և առանց CEO-ի, որը միանձնյա որոշումներ է ընդունում.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D "title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["DAO", "տոկենոմիկա", "կառավարում", "DeFi"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "value", "sceneIndex": 6, "type": "economy", "shortTitle": "Արժեքը ցանցերում", "era": "→արձանագրություններ", "lensWeight": {"chronology": 4, "attention": 2, "creators": 3, "networks": 5, "ownership": 5}, "title": "Արժեքը ստեղծվում է ցանցերում՝ գործարաններից մինչև պրոտոկոլներ", "insight": "Աշխարհի ամենամեծ ընկերությունները ֆիզիկական ակտիվներ չունեն՝ նրանք ունեն կապերի ենթակառուցվածք։ Web3-ը գնում է ավելի հեռուն. իսկ եթե այդ ենթակառուցվածքը պատկաներ հենց մասնակիցներին՞", "thesis": "Աշխարհի ամենամեծ ընկերությունները ֆիզիկական ակտիվներ չունեն՝ նրանք ունեն կապերի ենթակառուցվածք։ Web3-ը գնում է ավելի հեռուն. իսկ եթե այդ ենթակառուցվածքը պատկաներ հենց մասնակիցներին՞", "body": "## Աշխարհի ամենամեծ ընկերությունները ոչ մի ֆիզիկական բան չունեն\n\n1998 թվականին Քևին Քելլին գրեց մի բան, որը այդ ժամանակ սադրիչ էր թվում. նոր տնտեսությունում արժեքը ստեղծվում է ոչ թե արտադրության մեջ, այլ կապերում։\n\nԴիտիր 2024 թվականը և կհասկանաս, որ նա ճիշտ էր։\n\nUber-ը աշխարհի ամենամեծ տաքսի ծառայությունն է։ Չունի ոչ մի մեքենա։ Airbnb-ն աշխարհի ամենամեծ հյուրանոցային ընկերությունն է։ Չունի ոչ մի սենյակ։ Facebook-ը աշխարհի ամենամեծ մեդիան է։ Չի արտադրում ոչ մի բովանդակության միավոր։ Alibaba-ն Չինաստանի ամենամեծ մանրածախ վաճառողն է։ Պահեստներում ոչ մի ապրանք չի պահում։\n\nԻ՞նչ ունեն նրանք։ Կապերի ենթակառուցվածք։ Uber-ը կապում է վարորդներին և ուղևորներին։ Airbnb-ն կապում է տանտերերին և հյուրերին։ Facebook-ը կապում է մարդկանց միմյանց հետ։ Alibaba-ն կապում է վաճառողներին և գնորդներին։ Արժեքը հենց կապի փաստի մեջ է, ոչ թե ֆիզիկական ակտիվների։\n\nՍա արդյունաբերական տրամաբանությունից ցանցային տրամաբանության հիմնարար տեղաշարժ է։ Արդյունաբերական տնտեսությունում արժեք = ռեսուրսներ + աշխատանք + կապիտալ։ Արժեք ստեղծելու համար պետք է տիրապետել արտադրության միջոցներին։ Ցանցային տնտեսությունում արժեք = կապեր × մասնակիցներ²։ Արժեք ստեղծելու համար պետք է կազմակերպել մարդկանց միջև փոխազդեցությունը։\n\n## Web3. իսկ եթե ցանցը պատկաներ մասնակիցներին՞\n\nԲայց սա բարձրացնում է հաջորդ հարցը, և հենց այստեղ Web3-ը առաջարկում է արմատապես նոր պատասխան։\n\nUber-ը արժեք է ստեղծում՝ կապելով վարորդներին և ուղևորներին։ Վարորդները այդ արժեքը ստեղծում են իրենց աշխատանքով։ Բայց Uber-ը պատկանում է բաժնետերերին, ոչ թե վարորդներին։ Վարորդները վճարվում են ուղևորության համար։ Նրանք չեն ստանում բաժին այն ցանցի արժեքի աճից, որը ստեղծում են իրենց աշխատանքով։\n\nԻսկ եթե վարորդներին և ուղևորներին կապող պրոտոկոլը կառավարվեր DAO-ով՞ Վարորդները կստանային իրենց ներդրմանը համարժեք տոկեններ։ Ցանցի աճի հետ միասին տոկենները կթանկանային։ Վարորդը, որը մասնակցել էր ցանցի ստեղծմանը առաջին օրերից, կշահեր դրա աճից, ինչպես ստարտափի վաղ աշխատակիցը, որը ստացել էր օպցիոններ։\n\nԱյս գաղափարն արդեն իրականացվել է DeFi-ում։ Uniswap-ը՝ դեցենտրալիզացված բորսա, առևտրի միջնորդավճարները բաժանում է իրացվելիության մատակարարների միջև, որոնք ակտիվներ են ներդրել պուլերում։ Compound-ը կառավարման տոկեններ է բաշխում այն օգտատերերի միջև, որոնք օգտագործում են պրոտոկոլը։ Սա ուտոպիա չէ։ Սա աշխատող մոդել է, որի կառավարման տակ միլիարդավոր դոլարներ կան։\n\nՋարեդ Լանիերը «Own the Internet» էսսեում ձևակերպեց գաղափարը point-blank. ինտերնետի հաջորդ փուլը այն ինտերնետն է, որի մի մասը կարող ես գնել։ Ոչ միայն օգտագործել։ Տիրապետել։ Եկամուտ ստանալ դրա աճից։ Քվեարկել փոփոխությունների համար։\n\n«Օգտատերը որպես ապրանք» մոդելից «օգտատերը որպես համասեփականատեր» մոդելին անցումը պարզապես տեխնոլոգիական տեղաշարժ չէ։ Դա քաղաքական է։ Հարցը, թե ում է պատկանում ցանցի ստեղծած արժեքը, հասարակությունում իշխանության բաշխման հարց է։\n\n> Քելլին 1998-ին. արժեքը ստեղծվում է կապերում, ոչ թե արտադրության մեջ։ Լանիերը 2021-ին. իսկ եթե ցանցի մասնակիցները տիրապետեին դրան՞ Միասին նրանք նկարագրում են «արժեքը հարթակում» վիճակից դեպի «արժեքը մասնակիցների մոտ» վիճակին անցումը։\n\nՍա հիմա է տեղի ունենում՝ փորձարարական մասշտաբով։ Բլոկչեյններ՝ միլիարդավոր դոլարների TVL-ով (Total Value Locked — ընդհանուր արգելափակված արժեք), հազարավոր մասնակիցներով DAO-ներ, ստեղծողներ՝ NFT համայնքներով։ Ոչ բոլոր փորձերն են հաջողվել։ Շատերը ձախողվել են։ Բայց սկզբունքը աշխատում է, և դա փոխում է ամեն ինչ։", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8% const LANGS = ["ru", "en", "uk", "kk", "uz", "es", "fr", "hy"];
const LANG_LABELS = {"ru": "RU", "en": "EN", "uk": "UK", "kk": "KK", "uz": "UZ", "es": "ES", "fr": "FR", "hy": "HY"};
let CURRENT_LANG = 'ru';
function pickLang(l){ return LANGS.indexOf(l)>=0 ? l : 'ru'; }
function applyLang(l){
  l = pickLang(l); CURRENT_LANG = l;
  const src = CHAPTER_I18N[l];
  // подменяем содержимое рабочего CHAPTER_DATA
  CHAPTER_DATA.chapter.title = src.chapter.title;
  CHAPTER_DATA.chapter.lede = src.chapter.lede;
  CHAPTER_DATA.chapter.centralIdea = src.chapter.centralIdea;
  CHAPTER_DATA.lenses.forEach((ls,i)=>{ ls.label=src.lenses[i].label; ls.description=src.lenses[i].description; });
  CHAPTER_DATA.nodes.forEach((n,i)=>{ const s=src.nodes[i];
    n.shortTitle=s.shortTitle; n.era=s.era; n.title=s.title; n.insight=s.insight;
    n.thesis=s.thesis; n.body=s.body; n.tags=s.tags; });
  CHAPTER_DATA.edges.forEach((e,i)=>{ e.label=src.edges[i].label; });
  // UI-строки
  const _U = UI_I18N[l] || UI_I18N.ru; const _R = UI_I18N.ru || {};
  const U = {}; Object.keys(_R).forEach(k=>{ U[k] = (_U[k] && String(_U[k]).trim()) ? _U[k] : _R[k]; });
  document.documentElement.lang = l;
  const t=document.getElementById('app-title'); if(t) t.textContent=src.chapter.title;
  const ld=document.querySelector('.chapter-lede'); if(ld) ld.textContent=src.chapter.lede;
  document.querySelectorAll('[data-ui]').forEach(el=>{ const k=el.getAttribute('data-ui'); if(U[k]) el.textContent=U[k]; });
  // локализованный typeLabel + перестройка линз (иначе останутся на языке сборки)
  window.__UI_LOC = U;
  try{ buildLenses(); setLens(state.lens); }catch(e){}
  // перерисовать карту/деталь/прогресс
  try{ renderAll(); }catch(e){}
  // отметить активную кнопку языка
  document.querySelectorAll('.lang-btn').forEach(b=>b.setAttribute('aria-pressed', b.getAttribute('data-lang')===l ? 'true':'false'));
}
function buildLangSwitcher(){
  const rail=document.querySelector('.rail'); if(!rail) return;
  const wrap=document.createElement('div'); wrap.className='lang-switch';
  LANGS.forEach(l=>{ const b=document.createElement('button'); b.className='lang-btn'; b.type='button';
    b.setAttribute('data-lang',l); b.textContent=LANG_LABELS[l];
    b.addEventListener('click',()=>applyLang(l)); wrap.appendChild(b); });
  rail.insertBefore(wrap, rail.firstChild);
}


window.addEventListener("message",function(ev){try{var d=ev.data||{};if(d.lang){applyLang(d.lang);}}catch(e){}});
async function boot(){buildLangSwitcher();var _q=new URLSearchParams(location.search).get("lang");var _h=(location.hash.match(/[?&]lang=([a-z]{2})/)||[])[1];var _lp=_q||_h;if(_lp)CURRENT_LANG=pickLang(_lp);buildLenses();setLens(state.lens);applyLang(CURRENT_LANG);}
document.addEventListener("DOMContentLoaded",()=>{try{boot();}catch(e){renderEmptyState("Ошибка инициализации: "+e.message);}});
</script>
