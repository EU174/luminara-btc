"label": "monopolies trap creators", "lenses": ["networks", "creators"]}, {"from": "trap", "to": "fans", "label": "the exit is a direct link with fans", "lenses": ["creators", "ownership"]}, {"from": "fans", "to": "longtail", "label": "niches have enough room", "lenses": ["creators", "networks"]}, {"from": "longtail", "to": "value", "label": "the tail feeds networks", "lenses": ["networks", "chronology"]}, {"from": "trap", "to": "dao", "label": "infrastructure to creators", "lenses": ["creators", "ownership"]}, {"from": "dao", "to": "value", "label": "participants own the network", "lenses": ["ownership", "networks"]}, {"from": "wu", "to": "value", "label": "from selling attention to ownership", "lenses": ["chronology", "attention"]}, {"from": "rules", "to": "value", "label": "protocols change the rule", "lenses": ["networks", "ownership"]}, {"from": "fans", "to": "dao", "label": "tokens as a tool", "lenses": ["ownership", "creators"]}]}, "uk": {"chapter": {"key": "economy", "title": "Економіка творців", "lede": "Цінність народжується в мережах — і головне питання в тому, кому вона належить.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=economy", "centralIdea": "Цінність у мережі — і питання, кому вона належить", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Хронологія", "accent": "#7dd3fc", "description": "Від газет Тіма Ву до протоколів Web3: двісті років продажу уваги."}, {"id": "attention", "label": "Увага", "accent": "#fbbf24", "description": "Тім Ву: продаж уваги як модель, яку Web2 довів до $600 млрд на рік."}, {"id": "creators", "label": "Творці", "accent": "#c084fc", "description": "Пастка контенту, тисяча справжніх фанатів і економіка довгого хвоста."}, {"id": "networks", "label": "Мережі", "accent": "#34d399", "description": "Закон Меткалфа й нульові витрати: чому переможець забирає все."}, {"id": "ownership", "label": "Власність", "accent": "#f87171", "description": "DAO й інфраструктура звʼязків: що, як вона належить учасникам?"}], "nodes": [{"id": "wu", "sceneIndex": 0, "type": "media", "shortTitle": "Тім Ву", "era": "200 років", "lensWeight": {"chronology": 5, "attention": 5, "creators": 2, "networks": 2, "ownership": 1}, "title": "Тім Ву: історія продажу уваги", "insight": "Тім Ву показав: продаж уваги — двохсотрічна модель від газет до TikTok. Web2 довів її до 600 млрд доларів на рік. Різниця лише в точності таргетингу.", "thesis": "Тім Ву показав: продаж уваги — двохсотрічна модель від газет до TikTok. Web2 довів її до 600 млрд доларів на рік. Різниця лише в точності таргетингу.", "body": "## Газета за один цент і перша угода з увагою\n\nУ 1833 році американський видавець Бенджамін Дей придумав дещо, що назавжди змінило медіабізнес. Він почав продавати газету New York Sun за один цент — у три-чотири рази дешевше за собівартість. Усі навколо крутили пальцем біля скроні: як можна заробляти, продаючи дешевше, ніж коштує виробництво?\n\nВідповідь була простою і геніальною. Дешева газета приваблювала читачів — людей із робітничого класу, які раніше не купували пресу через ціну. Багато читачів — це аудиторія. Аудиторію він продавав рекламодавцям. Читач платив увагою, рекламодавець — грошима. Газета була не продуктом — вона була приманкою.\n\nЦе була перша в історії угода з продажу уваги. І відтоді — майже двісті років — її структура не змінилася. Змінився лише масштаб.\n\nТім Ву в книжці «The Attention Merchants» простежив цю логіку через два століття з вражаючою точністю. Кожне нове медіа повторювало одну й ту саму схему. Радіо 1920-х: безкоштовний контент приваблює слухачів, слухачів продають рекламодавцям. Телебачення 1950-х: та сама схема, але з рухомою картинкою і ширшим охопленням. Кабельне ТБ: та сама схема, але за підписку. Інтернет Web1: контент безкоштовний, але ще без монетизації уваги. Web2: монетизація уваги досягає промислового масштабу.\n\n## Велике вилучення: коли ти став товаром\n\nВу називає те, що відбувається, «великим вилученням». Медіасистема систематично забирає увагу людей — найбільш невідновлюваний ресурс, який у нас є, — і конвертує її в гроші для третіх сторін.\n\nКонкретні цифри допомагають зрозуміти масштаб. Середній користувач Facebook у 2023 році проводив у застосунку близько 35 хвилин на день. Facebook заробляв на цьому користувачеві приблизно 50 доларів на рік у США — через рекламу. Користувач не отримував нічого — крім самого сервісу. Угода була односторонньою.\n\nGoogle заробляє на пошукових запитах: кожен запит — це сигнал про намір, який продається рекламодавцям. Ти шукаєш «купити диван» — Google продає цю інформацію меблевим магазинам. Ти платиш не грошима. Ти платиш наміром.\n\nFacebook заробляє на соціальних зв'язках: кожен лайк — це дані про психологічний профіль. Ти ставиш лайк певним дописам — Facebook знає твої цінності, страхи, політичні погляди. Він продає ці знання рекламодавцям, політичним кампаніям, усім, хто готовий платити.\n\nTikTok заробляє на часі: кожна зайва секунда в застосунку — це гроші. Його алгоритм оптимізований на одне: утримати тебе якомога довше. Не тому, що це добре для тебе. А тому, що це добре для його рекламної виручки.\n\nСукупний ринок цифрової реклами перевищив 600 мільярдів доларів на рік до 2023-го. Для порівняння — це більше за ВВП Швеції. Уся ця сума — монетизація людської уваги, яку люди віддають, думаючи, що користуються безкоштовним сервісом.\n\nВу вказує на принципову асиметрію: люди не знають умов угоди. Ніде не написано «твоя увага коштує 50 доларів на рік, і ми її продаємо». Написано: «Безкоштовно. Просто зареєструйтесь».\n\n> Ву показав: продаж уваги — не винахід інтернету. Це двохсотрічна модель, яку Web2 довів до промислового масштабу. Різниця між газетою за цент і TikTok — лише в точності таргетингу та розмірі ринку.\n\nЦе розуміння змінює те, як ти дивишся на «безкоштовні» сервіси. Ніщо не безкоштовне. Питання лише в тому, чи розумієш ти, чим платиш. Нова економіка, яку будує Web3, намагається змінити цю угоду: зробити її явною, справедливою і взаємною.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["увага", "економіка", "медіа", "Web2"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "rules", "sceneIndex": 1, "type": "economy", "shortTitle": "Правила інформації", "era": "закон Меткалфа", "lensWeight": {"chronology": 3, "attention": 2, "creators": 2, "networks": 5, "ownership": 3}, "title": "Інформаційні правила: чому переможець забирає все", "insight": "Нульові граничні витрати інформації + закон Меткалфа = монополії Web2. Перший, хто набирає критичну масу, перемагає назавжди. Відкриті протоколи Web3 змінюють це правило.", "thesis": "Нульові граничні витрати інформації + закон Меткалфа = монополії Web2. Перший, хто набирає критичну масу, перемагає назавжди. Відкриті протоколи Web3 змінюють це правило.", "body": "## Нульові граничні витрати: чому інформація особлива\n\nЩоб зрозуміти економіку інтернету — потрібно зрозуміти одну річ, яка робить інформаційні продукти принципово іншими. Хел Веріан і Карл Шапіро описали це в книжці «Information Rules» ще у 1999 році — і їхні спостереження не застаріли ні на день.\n\nФізичний товар — холодильник, автомобіль, хліб — коштує грошей щоразу, коли виробляється. Потрібна сировина, потрібна праця, потрібна енергія. Виробити тисячний холодильник коштує приблизно стільки ж, скільки перший. Це називається «граничні витрати» — вартість виробництва ще однієї одиниці товару.\n\nІнформаційний продукт — фільм, програма, пісня, стаття — коштує грошей один раз: під час створення. Написати першу копію цієї книжки коштувало місяців роботи. Написати другу копію — нуль. Скопіювати файл. Граничні витрати інформації прямують до нуля.\n\nЦе змінює всю економічну логіку. Якщо граничні витрати нульові — ти можеш роздавати продукт безкоштовно і заробляти на чомусь іншому. На увазі. На даних. На підписці. На рекламі. Саме тому Google безкоштовний. Саме тому Spotify за 10 євро на місяць дає доступ до 100 мільйонів треків. Саме тому Facebook безкоштовний — монетизується не контент, а дані.\n\n## Закон Меткалфа: математика переможців\n\nРоберт Меткалф, один із творців Ethernet (технології локальних мереж), сформулював закон, який пояснює структуру влади в цифровій економіці: цінність мережі пропорційна квадрату кількості її учасників.\n\nПростий приклад із телефонами. Один телефон у світі — марний, дзвонити нікому. Два телефони — одне з'єднання, мінімальна цінність. Десять телефонів — 45 можливих з'єднань. Тисяча телефонів — майже пів мільйона можливих з'єднань. Мільйон телефонів — близько 500 мільярдів можливих з'єднань. Цінність зростає не лінійно, а експоненційно.\n\nДля платформ це означає: перша платформа, що набрала критичну масу, стає майже непереможною. Не тому, що вона найкраща. А тому, що там усі — і це робить її ціннішою для кожного користувача.\n\nFacebook із двома мільярдами користувачів об'єктивно цінніший за альтернативу з мільйоном — тому що там більше твоїх реальних знайомих. Google цінніший за альтернативну пошукову систему — тому що більший обсяг запитів робить алгоритм точнішим. Amazon цінніший за маленький магазин — більше продавців приваблює більше покупців, більше покупців приваблює більше продавців.\n\nВеріан і Шапіро також описали механізм lock-in — блокування. Коли ти вклав час, дані й звички в платформу — перехід на іншу стає болючим. Твої фотографії в Instagram, твої контакти в WhatsApp, твоя історія в YouTube — це не просто дані. Це бар'єр виходу, який платформи створюють навмисно.\n\nMicrosoft утримувала корпоративних клієнтів через сумісність форматів Office. Apple утримує користувачів через екосистему пристроїв. Google утримує через історію пошуку і пошту. Що довше ти користуєшся платформою — то дорожчим є вихід.\n\n> Закон Меткалфа і нульові граничні витрати разом пояснюють монополії Web2: перший, хто набирає критичну масу, перемагає назавжди — тому що цінність мережі зростає швидше, ніж будь-який конкурент може її наздогнати.\n\nУ криптоекономіці цей закон працює в обидва боки. Блокчейн із великою аудиторією розробників, користувачів і ліквідності експоненційно цінніший за маленький. Але відкриті протоколи змінюють правило: якщо мережа децентралізована — її цінність належить учасникам, а не акціонерам єдиної компанії.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["економіка", "мережеві ефекти", "платформи", "токеноміка"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "trap", "sceneIndex": 2, "type": "power", "shortTitle": "Пастка творців", "era": "Web2", "lensWeight": {"chronology": 2, "attention": 3, "creators": 5, "networks": 3, "ownership": 3}, "title": "Пастка творців: чому контент не приносить грошей", "insight": "Пересс показав: пастка не в якості контенту. Справжній продукт — це спільнота, а не контент. Платформи виграли, побудувавши інфраструктуру зв'язків. Web3 повертає її творцям.", "thesis": "Пересс показав: пастка не в якості контенту. Справжній продукт — це спільнота, а не контент. Платформи виграли, побудувавши інфраструктуру зв'язків. Web3 повертає її творцям.", "body": "## Парадокс достатку\n\nКевін Келлі у 1998 році сформулював парадокс, який став прокляттям для мільйонів творців контенту: у світі надлишку інформації цінність самої інформації прямує до нуля.\n\nЛогіка залізна. Коли інформація була дефіцитом — за неї платили. Книжки коштували дорого, бо їх було мало і їх було дорого виробляти. Музичний альбом коштував п'ятнадцять доларів, бо фізичний CD потрібно було виготовити, упакувати, доставити. Стаття експерта мала цінність, бо доступ до експерта був рідкісним.\n\nІнтернет знищив цей дефіцит. Тепер будь-хто може опублікувати будь-що. Будь-хто може випустити альбом, завантажити фільм, написати статтю. Пропозиція контенту — нескінченна. А нескінченна пропозиція за скінченного попиту означає одне: ціна прямує до нуля.\n\nЖурналіст пише клікбейтні заголовки — не тому, що хоче, а тому, що алгоритм винагороджує саме це. Музикант випускає нескінченні сингли замість альбомів — бо Spotify платить за стріми, а не за якість. Художник підлаштовує стиль під алгоритм Instagram — бо інакше ніхто не побачить. Система деформує творчість не через злий умисел — через стимули.\n\n## Пересс: твій продукт — не контент\n\nДевід Пересс у «The Content Trap» поставив правильний діагноз: творці програють платформам не тому, що їхній контент поганий. А тому, що вони неправильно розуміють, що саме вони створюють.\n\nПересс вивчав медіаіндустрію й виявив закономірність: компанії, які думали, що їхній продукт — це контент, програвали. Компанії, які розуміли, що їхній продукт — це спільнота навколо контенту, вигравали.\n\nНью-Йорк Таймс — це не газета. Це спільнота людей, які довіряють Нью-Йорк Таймс і повертаються до нього щодня. Коли така спільнота є — монетизація можлива через підписки, події, спеціальні проєкти. Коли її немає — ти просто один із мільйонів сайтів в інтернеті.\n\nАртист — це не набір треків. Це стосунки між артистом і його слухачами. Адель продає альбоми не тому, що вони кращі за інші альбоми. А тому, що в неї є армія відданих слухачів, які відчувають особистий зв'язок із нею.\n\nПлатформи виграли саме це розуміння: вони не створювали контент — вони будували інфраструктуру зв'язків між творцями й аудиторією. Facebook не пише пости. YouTube не знімає відео. Але вони контролюють зв'язок між тими, хто пише, і тими, хто читає. І беруть за це плату — увагою користувачів.\n\nВисновок Пересса: творець, який хоче вирватися з пастки, має перестати думати про контент і почати думати про спільноту. Будувати прямі стосунки з аудиторією. Монетизувати належність, а не перегляди.\n\n> Пересс сформулював точно: пастка не в якості контенту. Пастка в тому, що ти думаєш, ніби твій продукт — контент. Твій продукт — це спільнота. Платформи побудували інфраструктуру зв'язків і взяли її під контроль. Web3 дає інструменти, щоб повернути цей контроль творцю.\n\nСаме тому токени, NFT і прямі платежі у Web3 — це не просто зручність. Це інструменти для монетизації спільноти напряму, без платформи-посередника.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["творці", "спільнота", "увага", "економіка"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "fans", "sceneIndex": 3, "type": "privacy", "shortTitle": "1000 фанатів", "era": "2008→2020-ті", "lensWeight": {"chronology": 3, "attention": 2, "creators": 5, "networks": 2, "ownership": 4}, "title": "Тисяча справжніх фанатів: маніфест отримав інструменти", "insight": "Келлі у 2008-му: тисяча справжніх фанатів по $100 = $100k на рік. У 2020-х Web3 дав інструменти: токени, NFT, прямі платежі — без платформних комісій. Маніфест став бізнес-моделлю.", "thesis": "Келлі у 2008-му: тисяча справжніх фанатів по $100 = $100k на рік. У 2020-х Web3 дав інструменти: токени, NFT, прямі платежі — без платформних комісій. Маніфест став бізнес-моделлю.", "body": "## Есе, що випередило час\n\nУ 2008 році Кевін Келлі написав коротке есе «1,000 True Fans». Воно стало одним із найбільш цитованих текстів про творчу економіку — і у 2008-му це був красивий маніфест без практичних інструментів. У 2020-х це стало робочою бізнес-моделлю.\n\nЙого аргумент елегантний: творцю не потрібні мільйони випадкових підписників. Потрібна тисяча справжніх фанатів — людей, які куплять усе, що ти створиш. Книжку у твердій обкладинці й у м'якій. Квиток на концерт і запис із концерту. Лімітований принт і звичайний постер. Доступ до закритої спільноти й публічний контент.\n\nМатематика проста. Тисяча фанатів, кожен із яких витрачає 100 доларів на рік, — це 100 000 доларів. Це скромний, але достатній дохід для незалежного творця. Не щоб стати мільйонером. А щоб зберегти творчу свободу й не залежати від алгоритмів.\n\nКонтраст із платформною моделлю разючий. На YouTube з мільйоном переглядів можна заробити від 1 000 до 3 000 доларів — залежно від категорії контенту й демографії аудиторії. Це означає: щоб заробляти 100 000 доларів на рік на YouTube, потрібно близько 40–100 мільйонів переглядів на рік. Це доступно одиницям.\n\nА тисяча людей, які платять по 100 доларів напряму? Це доступно багатьом — якщо є інструмент для прямих платежів.\n\n## Як Web3 дав цьому інструменти\n\nУ 2008 році Келлі описав ідею — але не міг описати механізм. Як знайти цю тисячу? Як отримати гроші напряму без банку-посередника і без платіжної платформи, що бере 30%? Як утримати стосунки з людьми, коли алгоритм вирішує, хто що бачить?\n\nWeb3 дав відповіді.\n\nТокени дозволяють фанату стати співвласником проєкту. Не просто покупцем — учасником. Ранній прихильник, який купив токени до широкого визнання, виграє разом зі зростанням проєкту. Це вирівнює інтереси: творець зацікавлений у зростанні, фан — також. Обидва виграють від успіху.\n\nNFT — Non-Fungible Tokens — дають унікальні цифрові активи. Творець продає обмежену серію робіт напряму колекціонерам. Без галереї, яка бере 50%. Без платформи, що забирає дані про покупців. І смарт-контракт автоматично платить творцю роялті під час кожного наступного перепродажу — навіть через десять років. Це неможливо в традиційному світі: художник продав картину й більше не отримує нічого, хоч би як вона зростала в ціні. У Web3 — отримує відсоток від кожної угоди назавжди.\n\nПрямі платежі через блокчейн — без комісії Stripe (2,9%), без комісії PayPal (3–5%), без комісії App Store (30%). TON-гаманець дозволяє отримати платіж із комісією в частки цента. Для творця з тисячею фанатів, які платять напряму, це означає: він отримує майже все.\n\nЛі Джин у «The Passion Economy» описала ширший зсув: від «економіки платформ», де творці залежать від алгоритмічних рішень платформи, до «економіки пристрасті», де глибина важливіша за ширину. Сто людей, які платять по тисячі доларів на рік за унікальний доступ до тебе, — краще, ніж мільйон випадкових глядачів, від яких ти не отримуєш нічого.\n\n> Келлі написав маніфест у 2008-му. Web3 дав інструменти для його реалізації у 2020-х. Тисяча справжніх фанатів плюс токени, NFT і прямі платежі — це робоча бізнес-модель для незалежного творця.\n\nЦе не скасовує платформи повністю. Але змінює баланс сил: творець більше не повністю залежить від алгоритмічних рішень чужої компанії. У нього є альтернативний шлях до аудиторії й до монетизації.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["творці", "токеноміка", "NFT", "економіка захоплень"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "longtail", "sceneIndex": 4, "type": "media", "shortTitle": "Довгий хвіст", "era": "2004", "lensWeight": {"chronology": 3, "attention": 2, "creators": 4, "networks": 4, "ownership": 3}, "title": "Довгий хвіст: економіка ніш", "insight": "Довгий хвіст: у цифровому світі місце для нішевих творців нескінченне. Web2 усе одно ставив алгоритм між ними й аудиторією. Web3 будує прямі канали без привратника.", "thesis": "Довгий хвіст: у цифровому світі місце для нішевих творців нескінченне. Web2 усе одно ставив алгоритм між ними й аудиторією. Web3 будує прямі канали без привратника.", "body": "## Кінець диктатури хітів\n\nЦифрова економіка змінила структуру ринків — і зрозуміти це можна через просту аналогію.\n\nУяви музичний магазин 1990-х. У нього обмежена площа: тисяча-дві квадратних метрів, обмежена кількість полиць. Що він виставляє? Хіти. Альбоми, які продаються тисячами копій на тиждень. Бо поличний простір — дефіцитний ресурс. Нішеві виконавці, яких слухають сто людей у всій країні, туди не потрапляють. Магазину невигідно тримати альбом, який продається одна копія на місяць.\n\nТепер Spotify. У нього немає фізичних полиць. Зберігання ще одного мільйона треків практично нічого не коштує — цифрові дані. Тому Spotify може пропонувати 100 мільйонів треків одночасно. Включно з тими, кого слухають сто людей у всьому світі.\n\nЦе і є довгий хвіст — концепція, описана Крісом Андерсоном у книжці 2006 року. На кривій популярності є «голова» — кілька суперхітів із величезною аудиторією. І є «хвіст» — нескінченна множина нішевих продуктів із маленькою, але наявною аудиторією. У фізичному світі «голова» домінує: тільки хіти потрапляють на полиці. У цифровому світі «хвіст» нескінченний — і сукупна аудиторія нішевих продуктів може перевищувати аудиторію хітів.\n\n## Що це означає для творців\n\nАндерсон провів дослідження для Amazon і Netflix — і виявив: значна частина їхнього виторгу приходить не від бестселерів, а від мільйонів нішевих продуктів, кожен із яких продається рідко, але все ж продається.\n\nДля творців це фундаментально змінює розклад. В епоху до інтернету, щоб бути професійним музикантом, потрібно було потрапити на радіо, отримати контракт із лейблом, дістатися до мільйонів слухачів. Нішевий виконавець, якого обожнюють двадцять тисяч людей у всьому світі, не міг побудувати на цьому кар'єру — бо ці двадцять тисяч були розпорошені й у нього не було способу до них дістатися.\n\nІнтернет це змінив: нішеві аудиторії стали знайденими й досяжними. Але Web2 створив нову проблему: алгоритми працюють на користь «голови». YouTube рекомендує те, що вже популярне. Instagram просуває контент із високим залученням. TikTok вірусить те, що віруситься. Нішевий творець потрапляє в пастку: теоретично його аудиторія існує, але алгоритм не допомагає її знайти — він зайнятий просуванням суперхітів.\n\nWeb3 може це змінити. Якщо у творця є прямий канал до аудиторії — через гаманці, через токени, через децентралізовані протоколи — йому не потрібно конкурувати за алгоритмічну увагу. Його двадцять тисяч справжніх прихильників підписані напряму. Алгоритм більше не привратник.\n\n> Андерсон показав: цифровий світ створює місце для нескінченної кількості нішевих творців. Web2 не дав їм інструментів — алгоритми працювали проти них. Web3 будує прямі канали, де нішевий творець не залежить від рекомендаційної системи.\n\nЦе не означає, що кожен нішевий творець розбагатіє. Але це означає: у тих, хто створює унікальне, є реальний шанс знайти свою аудиторію й побудувати на ній стійкий дохід — без необхідності ставати суперзіркою.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["творці", "економіка", "довгий хвіст", "спільнота"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "dao", "sceneIndex": 5, "type": "technology", "shortTitle": "DAO", "era": "Web3", "lensWeight": {"chronology": 3, "attention": 1, "creators": 3, "networks": 4, "ownership": 5}, "title": "DAO: компанія без директора", "insight": "DAO — організація в code: токени як голоси, smart contracts як виконавці. Жодного CEO, який може заблокувати рішення більшості. Вперше — координація без централізованого управління.", "thesis": "DAO — організація в code: токени як голоси, smart contracts як виконавці. Жодного CEO, який може заблокувати рішення більшості. Вперше — координація без централізованого управління.", "body": "## Нова форма організації\n\nУ 2014 році Віталік Бутерін написав есе, яке починалося з питання: а що, якби організацію можна було запустити без людей в управлінні?\n\nЦе звучало як фантастика. Але ідея мала залізну логіку.\n\nТрадиційна компанія — це ієрархія. Є акціонери (власники), є рада директорів (стратегічне управління), є менеджмент (операційне управління), є співробітники (виконання). На кожному рівні є агентська проблема: людина, яка управляє чужими грошима, має власні інтереси, що можуть не збігатися з інтересами власників. Менеджер може ухвалювати рішення, вигідні йому, а не компанії. Директор може працювати на великого акціонера на шкоду дрібним.\n\nБутерін запропонував: а що, якби правила організації записати в smart contract? Code не можна підкупити. Code не може ухвалити рішення на користь одного учасника проти інших. Code виконує рівно те, що в ньому написано.\n\nТак народилася концепція DAO — Decentralized Autonomous Organization, децентралізованої автономної організації.\n\n## Як DAO працює на практиці\n\nУяви організацію, що управляє DeFi-протоколом — наприклад, децентралізованою біржею. У цієї організації немає CEO, немає офісу, немає юридичної адреси. Є smart contract, який визначає правила, і є токени управління — цифрові голоси.\n\nКожен власник токена може винести пропозицію на голосування. «Змінимо комісію з 0.3% до 0.25%». «Додамо підтримку нового активу». «Спрямуємо 10% доходів протоколу в резервний фонд». Власники токенів голосують. Якщо пропозиція набирає достатньо голосів — smart contract автоматично виконує її. Жодного CEO, який може заблокувати. Жодної ради директорів, яка може переграти рішення. Code — закон.\n\nПерший великий DAO — The DAO — був запущений у 2016 році на Ethereum і зібрав 150 мільйонів доларів від учасників. За кілька тижнів хакер знайшов уразливість у code і вивів третину коштів. Це був болісний урок: DAO працює рівно настільки надійно, наскільки надійний code. Помилка в smart contract — це не людський фактор, який можна виправити. Це математика, яка виконується буквально.\n\nАле ідея вижила. До 2020-х DAO управляють мільярдами доларів у DeFi-протоколах. Uniswap управляється через DAO, де власники токена UNI голосують за зміни протоколу. MakerDAO управляє стейблкоїном DAI через голосування власників MKR. Це дієві організації з реальними грошима — без традиційної корпоративної структури.\n\nРакеш Агравал у «The Tokenized Economy» описує глибше значення токенів у цьому контексті. Токен DAO — це не просто право голосу. Це вирівнювання інтересів. Якщо протокол зростає і стає ціннішим — токени дорожчають для всіх: і для розробників, і для користувачів, і для інвесторів. Усі одночасно зацікавлені в зростанні. У традиційній компанії цього досягти практично неможливо: інтереси акціонерів і користувачів структурно протилежні.\n\n> DAO — це не ідеальна організація. Це інша організація: з іншими компромісами, іншими ризиками, іншими можливостями. Головне: вперше з’явилася технічна можливість координувати людей навколо спільної мети без централізованого управління.\n\nДля творців, спільнот і малого бізнесу це відкриває цікаві можливості: колективне володіння, прозоре управління, автоматичний розподіл доходів. Усе це без юридичних фірм, без банків і без CEO, який ухвалює рішення одноосібно.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["DAO", "токеноміка", "управління", "DeFi"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "value", "sceneIndex": 6, "type": "economy", "shortTitle": "Цінність у мережах", "era": "→протоколи", "lensWeight": {"chronology": 4, "attention": 2, "creators": 3, "networks": 5, "ownership": 5}, "title": "Цінність створюється в мережах: від заводів до протоколів", "insight": "Найбільші компанії світу не володіють фізичними активами — вони володіють інфраструктурою зв’язків. Web3 іде далі: що, якби ця інфраструктура належала самим учасникам?", "thesis": "Найбільші компанії світу не володіють фізичними активами — вони володіють інфраструктурою зв’язків. Web3 іде далі: що, якби ця інфраструктура належала самим учасникам?", "body": "## Найбільші компанії світу не володіють нічим фізичним\n\nКевін Келлі у 1998 році написав дещо, що тоді звучало провокативно: у новій економіці цінність створюється не у виробництві, а у зв’язках.\n\nПодивись на 2024 рік — і зрозумієш, що він мав рацію.\n\nUber — найбільша у світі служба таксі. Не володіє жодним автомобілем. Airbnb — найбільша у світі готельна компанія. Не володіє жодним номером. Facebook — найбільше у світі медіа. Не виробляє жодної одиниці контенту. Alibaba — найбільший у Китаї роздрібний продавець. Не тримає жодних товарів на складах.\n\nЩо в них є? Інфраструктура зв’язків. Uber з’єднує водіїв і пасажирів. Airbnb з’єднує господарів і гостей. Facebook з’єднує людей між собою. Alibaba з’єднує продавців і покупців. Цінність — у самому факті з’єднання, а не у фізичних активах.\n\nЦе фундаментальний зсув від індустріальної логіки до мережевої. В індустріальній економіці цінність = ресурси + праця + капітал. Щоб створити цінність, потрібно володіти засобами виробництва. У мережевій економіці цінність = зв’язки × учасники². Щоб створити цінність, потрібно організувати взаємодію між людьми.\n\n## Web3: а що, якби мережа належала учасникам?\n\nАле це порушує наступне питання — і саме тут Web3 пропонує радикально нову відповідь.\n\nUber створює цінність через з’єднання водіїв і пасажирів. Водії створюють цю цінність своєю працею. Але Uber належить акціонерам — а не водіям. Водії отримують плату за поїздку. Вони не отримують частки у зростанні вартості мережі, яку створюють своєю працею.\n\nА що, якби протокол, який з’єднує водіїв і пасажирів, управлявся DAO? Водії отримували б токени пропорційно своєму внеску. У міру зростання мережі — токени дорожчали б. Водій, який брав участь у створенні мережі з перших днів, вигравав би від її зростання — як ранній співробітник стартапу, що отримав опціони.\n\nЦя ідея вже реалізована в DeFi. Uniswap — децентралізована біржа — розподіляє комісії від торгів між провайдерами ліквідності, які внесли активи в пули. Compound розподіляє токени управління серед користувачів, які використовують протокол. Це не утопія. Це робоча модель з мільярдами доларів в управлінні.\n\nДжаред Ланьє в есе «Own the Internet» сформулював концепцію point-blank: наступний етап інтернету — це інтернет, частину якого ти можеш купити. Не просто використовувати. Володіти. Отримувати дохід від зростання. Голосувати за зміни.\n\nПерехід від «користувач як продукт» до «користувач як співвласник» — це не просто технологічний зсув. Це політичний зсув. Питання про те, кому належить цінність, створена мережею, — це питання про розподіл влади в суспільстві.\n\n> Келлі у 1998-му: цінність створюється у зв’язках, а не у виробництві. Ланьє у 2021-му: а що, якби учасники мережі нею володіли? Разом вони описують перехід від «цінність у платформи» до «цінність в учасників».\n\nЦе відбувається прямо зараз — в експериментальному масштабі. Блокчейни з мільярдами доларів TVL (Total Value Locked — загальною заблокованою вартістю), DAO з тисячами учасників, творці з NFT-спільнотами. Не всі експерименти вдалися. Багато провалилися. Але принцип працює — і це змінює все.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbook ": "wu", "to": "rules", "label": "увага підпорядковується правилам мережі", "lenses": ["attention", "networks"]}, {"from": "rules", "to": "trap", "label": "монополії ловлять творців", "lenses": ["networks", "creators"]}, {"from": "trap", "to": "fans", "label": "вихід — прямий звʼязок із фанатами", "lenses": ["creators", "ownership"]}, {"from": "fans", "to": "longtail", "label": "нішам вистачає місця", "lenses": ["creators", "networks"]}, {"from": "longtail", "to": "value", "label": "хвіст живить мережі", "lenses": ["networks", "chronology"]}, {"from": "trap", "to": "dao", "label": "інфраструктуру — творцям", "lenses": ["creators", "ownership"]}, {"from": "dao", "to": "value", "label": "учасники володіють мережею", "lenses": ["ownership", "networks"]}, {"from": "wu", "to": "value", "label": "від продажу уваги до володіння", "lenses": ["chronology", "attention"]}, {"from": "rules", "to": "value", "label": "протоколи змінюють правило", "lenses": ["networks", "ownership"]}, {"from": "fans", "to": "dao", "label": "токени як інструмент", "lenses": ["ownership", "creators"]}]}, "kk": {"chapter": {"key": "economy", "title": "Жасаушылар экономикасы", "lede": "Құндылық желілерде туады, ал басты сұрақ — оның кімге тиесілі екені.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=economy", "centralIdea": "Құндылық желіде, ал сұрақ — оның кімге тиесілі екені", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Хронология", "accent": "#7dd3fc", "description": "Тим Вудың газеттерінен Web3 протоколдарына дейін: назарды сатудың екі жүз жылы."}, {"id": "attention", "label": "Назар", "accent": "#fbbf24", "description": "Тим Ву: Web2 жылына $600 млрд-қа жеткізген назар сату моделі."}, {"id": "creators", "label": "Жасаушылар", "accent": "#c084fc", "description": "Контент тұзағы, мың шынайы фанат және ұзын құйрық экономикасы."}, {"id": "networks", "label": "Желілер", "accent": "#34d399", "description": "Меткалф заңы және нөлдік шығындар: неге жеңімпаз бәрін алады."}, {"id": "ownership", "label": "Меншік", "accent": "#f87171", "description": "DAO және байланыстар инфрақұрылымы: егер ол қатысушыларға тиесілі болса ше?"}], "nodes": [{"id": "wu", "sceneIndex": 0, "type": "media", "shortTitle": "Тим Ву", "era": "200 жыл", "lensWeight": {"chronology": 5, "attention": 5, "creators": 2, "networks": 2, "ownership": 1}, "title": "Тим Ву: назарды сату тарихы", "insight": "Тим Ву көрсетті: назарды сату — газеттерден TikTok-қа дейін созылған екі жүз жылдық модель. Web2 оны жылына 600 млрд долларға жеткізді. Айырма тек таргетинг дәлдігінде.", "thesis": "Тим Ву көрсетті: назарды сату — газеттерден TikTok-қа дейін созылған екі жүз жылдық модель. Web2 оны жылына 600 млрд долларға жеткізді. Айырма тек таргетинг дәлдігінде.", "body": "## Бір центтік газет және назармен жасалған алғашқы мәміле\n\n1833 жылы америкалық баспагер Бенджамин Дэй медиабизнесті мәңгі өзгерткен нәрсе ойлап тапты. Ол New York Sun газетін бір центке сата бастады — өзіндік құнынан үш-төрт есе арзан. Айналасындағылардың бәрі оны есінен адасқандай көрді: өндіріс құнынан арзан сатып қалай ақша табуға болады?\n\nЖауабы қарапайым әрі данышпандық еді. Арзан газет оқырмандарды — бұрын бағасына бола баспасөз сатып алмаған жұмысшы табының адамдарын — тартты. Оқырман көп болса, бұл аудитория. Ал аудиторияны ол жарнама берушілерге сатты. Оқырман назарымен төледі, жарнама беруші ақшамен төледі. Газет өнім емес еді — ол жем еді.\n\nБұл тарихтағы назарды сату жөніндегі алғашқы мәміле болды. Содан бері — екі жүз жылға жуық уақыт бойы — оның құрылымы өзгерген жоқ. Тек масштабы өзгерді.\n\nТим Ву «The Attention Merchants» кітабында осы логиканы екі ғасыр бойымен таңғаларлық дәлдікпен қадағалады. Әрбір жаңа медиа бір схеманы қайталады. 1920-жылдардағы радио: тегін контент тыңдаушыларды тартады, тыңдаушылар жарнама берушілерге сатылады. 1950-жылдардағы телевидение: дәл сол схема, бірақ қозғалыстағы бейнемен және кеңірек қамтумен. Кабельдік ТВ: дәл сол схема, бірақ жазылым арқылы. Web1 интернеті: контент тегін, бірақ назарды монетизациялау әлі жоқ. Web2: назарды монетизациялау өнеркәсіптік масштабқа жетеді.\n\n## Ұлы алу: сен тауарға айналған кезде\n\nВу болып жатқанды «ұлы алу» деп атайды. Медиа жүйе адамдардың назарын — бізде бар ең жаңғырмайтын ресурсты — жүйелі түрде алып, оны үшінші тараптар үшін ақшаға айналдырады.\n\nНақты сандар масштабты түсінуге көмектеседі. 2023 жылы Facebook-тің орташа пайдаланушысы қолданбада күніне шамамен 35 минут өткізді. Facebook АҚШ-та осы пайдаланушыдан жарнама арқылы жылына шамамен 50 доллар табатын. Пайдаланушы сервистің өзінен басқа ештеңе алған жоқ. Мәміле біржақты болды.\n\nGoogle іздеу сұрауларынан ақша табады: әрбір сұрау — жарнама берушілерге сатылатын ниет сигналы. Сен «диван сатып алу» деп іздейсің — Google бұл ақпаратты жиһаз дүкендеріне сатады. Сен ақшамен төлемейсің. Сен ниетіңмен төлейсің.\n\nFacebook әлеуметтік байланыстардан ақша табады: әрбір лайк — психологиялық профиль туралы дерек. Сен белгілі бір жазбаларға лайк қоясың — Facebook сенің құндылықтарыңды, қорқыныштарыңды, саяси көзқарастарыңды біледі. Ол бұл білімді жарнама берушілерге, саяси кампанияларға, төлеуге дайын кез келген адамға сатады.\n\nTikTok уақыттан ақша табады: қолданбадағы әрбір артық секунд — ақша. Оның алгоритмі бір нәрсеге оңтайландырылған: сені мүмкіндігінше ұзақ ұстауға. Бұл сен үшін жақсы болғандықтан емес. Бұл оның жарнамалық түсімі үшін жақсы болғандықтан.\n\nЦифрлық жарнаманың жиынтық нарығы 2023 жылға қарай жылына 600 миллиард доллардан асты. Салыстыру үшін — бұл Швецияның ЖІӨ-сінен көп. Бұл соманың бәрі — адамдар тегін сервисті пайдаланып жүрміз деп ойлап беретін адам назарын монетизациялау.\n\nВу принципті асимметрияны көрсетеді: адамдар мәміле шарттарын білмейді. Еш жерде «сенің назарың жылына 50 доллар тұрады, біз оны сатамыз» деп жазылмаған. «Тегін. Жай ғана тіркеліңіз» деп жазылған.\n\n> Ву көрсетті: назарды сату — интернеттің өнертабысы емес. Бұл Web2 өнеркәсіптік масштабқа жеткізген екі жүз жылдық модель. Бір центтік газет пен TikTok арасындағы айырма — тек таргетинг дәлдігі мен нарық көлемінде.\n\nБұл түсінік «тегін» сервистерге қалай қарайтыныңды өзгертеді. Ештеңе тегін емес. Мәселе тек сен немен төлеп жатқаныңды түсінесің бе, сонында. Web3 құрып жатқан жаңа экономика осы мәмілені өзгертуге тырысады: оны айқын, әділ және өзара етуге.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["назар", "экономика", "медиа", "Web2"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "rules", "sceneIndex": 1, "type": "economy", "shortTitle": "Ақпарат ережелері", "era": "Меткалф заңы", "lensWeight": {"chronology": 3, "attention": 2, "creators": 2, "networks": 5, "ownership": 3}, "title": "Ақпараттық ережелер: неге жеңімпаз бәрін алады", "insight": "Ақпараттың нөлдік шекті шығындары + Меткалф заңы = Web2 монополиялары. Критикалық масса жинаған алғашқысы мәңгі жеңеді. Web3 ашық протоколдары бұл ережені өзгертеді.", "thesis": "Ақпараттың нөлдік шекті шығындары + Меткалф заңы = Web2 монополиялары. Критикалық масса жинаған алғашқысы мәңгі жеңеді. Web3 ашық протоколдары бұл ережені өзгертеді.", "body": "## Нөлдік шекті шығындар: ақпарат неге ерекше\n\nИнтернет экономикасын түсіну үшін ақпараттық өнімдерді түбегейлі бөлек ететін бір нәрсені түсіну керек. Хэл Вэриан мен Карл Шапиро мұны «Information Rules» кітабында сонау 1999 жылы сипаттаған — олардың байқаулары бір күнге де ескірген жоқ.\n\nФизикалық тауар — тоңазытқыш, автомобиль, нан — әр өндірілген сайын ақша тұрады. Шикізат керек, еңбек керек, энергия керек. Мыңыншы тоңазытқышты өндіру шамамен біріншісін өндірумен бірдей тұрады. Бұл «шекті шығындар» деп аталады — тауардың тағы бір бірлігін өндіру құны.\n\nАқпараттық өнім — фильм, бағдарлама, ән, мақала — бір рет ақша тұрады: жасалған кезде. Бұл кітаптың бірінші көшірмесін жазу бірнеше айлық жұмысқа тұрды. Екінші көшірмесін жазу — нөл. Файлды көшіре салу. Ақпараттың шекті шығындары нөлге ұмтылады.\n\nБұл бүкіл экономикалық логиканы өзгертеді. Егер шекті шығындар нөл болса — өнімді тегін таратып, басқа нәрседен ақша табуға болады. Назардан. Деректерден. Жазылымнан. Жарнамадан. Дәл сондықтан Google тегін. Дәл сондықтан Spotify айына 10 еуроға 100 миллион трекке қол жеткізуді береді. Дәл сондықтан Facebook тегін — контент емес, деректер монетизацияланады.\n\n## Меткалф заңы: жеңімпаздар математикасы\n\nRobert Metcalfe, Ethernet (жергілікті желілер технологиясы) жасаушылардың бірі, цифрлық экономикадағы билік құрылымын түсіндіретін заңды тұжырымдады: желінің құндылығы оның қатысушылары санының квадратына пропорционал.\n\nТелефондармен қарапайым мысал. Әлемде бір телефон болса — пайдасыз, қоңырау шалатын ешкім жоқ. Екі телефон — бір байланыс, ең аз құндылық. Он телефон — 45 ықтимал байланыс. Мың телефон — жарты миллионға жуық ықтимал байланыс. Миллион телефон — шамамен 500 миллиард ықтимал байланыс. Құндылық сызықтық емес, экспоненциалды өседі.\n\nПлатформалар үшін бұл мынаны білдіреді: критикалық масса жинаған алғашқы платформа дерлік жеңілмейтін болады. Ол ең жақсы болғандықтан емес. Онда бәрі бар болғандықтан — бұл оны әрбір пайдаланушы үшін құндырақ етеді.\n\nЕкі миллиард пайдаланушысы бар Facebook бір миллионы бар баламадан объективті түрде құндырақ — өйткені онда сенің нақты таныстарың көбірек. Google баламалы іздеу жүйесінен құндырақ — өйткені сұраулардың үлкен көлемі алгоритмді дәлірек етеді. Amazon шағын дүкеннен құндырақ — сатушылар көп болса, сатып алушылар көп келеді, сатып алушылар көп болса, сатушылар көп келеді.\n\nВэриан мен Шапиро lock-in — бұғаттау механизмін де сипаттады. Сен платформаға уақыт, дерек және әдеттер салған кезде — басқа платформаға көшу ауыр болады. Instagram-дағы фотоларың, WhatsApp-тағы контактілерің, YouTube-тағы тарихың — жай ғана деректер емес. Бұл платформалар әдейі жасайтын шығу кедергісі.\n\nMicrosoft корпоративтік клиенттерді Office форматтарының үйлесімділігі арқылы ұстап тұрды. Apple пайдаланушыларды құрылғылар экожүйесі арқылы ұстайды. Google іздеу тарихы мен пошта арқылы ұстайды. Платформаны неғұрлым ұзақ пайдалансаң — кету соғұрлым қымбат.\n\n> Меткалф заңы мен нөлдік шекті шығындар бірге Web2 монополияларын түсіндіреді: критикалық масса жинаған алғашқысы мәңгі жеңеді — өйткені желінің құндылығы кез келген бәсекелес қуып жете алатыннан жылдамырақ өседі.\n\nКриптоэкономикада бұл заң екі бағытта да жұмыс істейді. Әзірлеушілер, пайдаланушылар және өтімділік аудиториясы үлкен блокчейн кішкентайынан экспоненциалды түрде құндырақ. Бірақ ашық протоколдар ережені өзгертеді: егер желі децентрализденген болса — оның құндылығы бір компанияның акционерлеріне емес, қатысушыларға тиесілі.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https: ", "era": "Web2", "lensWeight": {"chronology": 2, "attention": 3, "creators": 5, "networks": 3, "ownership": 3}, "title": "Жасаушылардың тұзағы: неге контент ақша әкелмейді", "insight": "Пересс көрсетті: тұзақ контент сапасында емес. Нағыз өнім — контент емес, қауымдастық. Платформалар байланыстар инфрақұрылымын құрып жеңді. Web3 оны жасаушыларға қайтарады.", "thesis": "Пересс көрсетті: тұзақ контент сапасында емес. Нағыз өнім — контент емес, қауымдастық. Платформалар байланыстар инфрақұрылымын құрып жеңді. Web3 оны жасаушыларға қайтарады.", "body": "## Молшылық парадоксы\n\nКевин Келли 1998 жылы миллиондаған контент жасаушы үшін қарғысқа айналған парадоксты тұжырымдады: ақпарат мол әлемде ақпараттың өз құны нөлге ұмтылады.\n\nЛогикасы темірдей. Ақпарат тапшы болған кезде — оған ақша төлейтін. Кітаптар қымбат тұрды, өйткені олар аз еді және оларды өндіру қымбат болатын. Музыкалық альбом он бес доллар тұрды, өйткені физикалық CD-ді шығару, қаптау, жеткізу керек еді. Сарапшының мақаласы бағалы болды, өйткені сарапшыға қол жеткізу сирек еді.\n\nИнтернет бұл тапшылықты жойды. Енді кез келген адам кез келген нәрсені жариялай алады. Кез келген адам альбом шығарып, фильм жүктеп, мақала жаза алады. Контент ұсынысы — шексіз. Ал сұраныс шектеулі кезде ұсыныстың шексіз болуы бір нәрсені білдіреді: баға нөлге ұмтылады.\n\nЖурналист кликбейт тақырыптар жазады — қалағандықтан емес, алгоритм дәл соны марапаттайтындықтан. Музыкант альбомдардың орнына шексіз синглдер шығарады — өйткені Spotify сапа үшін емес, стримдер үшін төлейді. Суретші стилін Instagram алгоритміне бейімдейді — әйтпесе оны ешкім көрмейді. Жүйе шығармашылықты жаман ниет арқылы емес, ынталандырулар арқылы бұрмалайды.\n\n## Пересс: сенің өнімің — контент емес\n\nДэвид Пересс «The Content Trap» еңбегінде дұрыс диагноз қойды: жасаушылар платформаларға контенті нашар болғандықтан жеңілмейді. Олар нақты нені жасап жатқанын дұрыс түсінбегендіктен жеңіледі.\n\nПересс медиаиндустрияны зерттеп, бір заңдылықты анықтады: өніміміз — контент деп ойлаған компаниялар жеңілді. Өніміміз — контенттің айналасындағы қауымдастық деп түсінген компаниялар жеңді.\n\nНью-Йорк Таймс — газет емес. Бұл Нью-Йорк Таймсқа сенетін және оған күн сайын қайта оралатын адамдар қауымдастығы. Мұндай қауымдастық бар кезде монетизация жазылымдар, іс-шаралар, арнайы жобалар арқылы мүмкін болады. Ол жоқ кезде — сен интернеттегі миллиондаған сайттың бірісің.\n\nАртист — тректер жиынтығы емес. Бұл артист пен оның тыңдармандары арасындағы қарым-қатынас. Адель альбомдарын олар басқа альбомдардан жақсы болғандықтан сатпайды. Ол оларды өзімен жеке байланыс сезінетін адал тыңдармандар армиясы болғандықтан сатады.\n\nПлатформалар дәл осы түсінікті ұтты: олар контент жасамады — олар жасаушылар мен аудитория арасындағы байланыстар инфрақұрылымын құрды. Facebook пост жазбайды. YouTube видео түсірмейді. Бірақ олар жазатындар мен оқитындар арасындағы байланысты бақылайды. Және осы үшін ақы алады — пайдаланушылардың назары арқылы.\n\nПересстің қорытындысы: тұзақтан шыққысы келетін жасаушы контент туралы ойлауды тоқтатып, қауымдастық туралы ойлай бастауы керек. Аудиториямен тікелей қарым-қатынас құруы керек. Қаралымдарды емес, тиесілілікті монетизациялауы керек.\n\n> Пересс дәл тұжырымдады: тұзақ контент сапасында емес. Тұзақ — сен өз өнімің контент деп ойлайтыныңда. Сенің өнімің — қауымдастық. Платформалар байланыстар инфрақұрылымын құрып, оны бақылауға алды. Web3 бұл бақылауды жасаушыға қайтаруға арналған құралдар береді.\n\nСондықтан Web3-тегі токендер, NFT және тікелей төлемдер жай ғана ыңғайлылық емес. Олар қауымдастықты платформа-делдалсыз тікелей монетизациялау құралдары.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["жасаушылар", "қауымдастық", "назар", "экономика"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "fans", "sceneIndex": 3, "type": "privacy", "shortTitle": "1000 фанат", "era": "2008→2020-шы жылдар", "lensWeight": {"chronology": 3, "attention": 2, "creators": 5, "networks": 2, "ownership": 4}, "title": "Мың шынайы фанат: манифест құралдарға ие болды", "insight": "Келли 2008 жылы: мың шынайы фанат $100-ден = жылына $100k. 2020-жылдары Web3 құралдар берді: токендер, NFT, тікелей төлемдер — платформалық комиссияларсыз. Манифест бизнес-модельге айналды.", "thesis": "Келли 2008 жылы: мың шынайы фанат $100-ден = жылына $100k. 2020-жылдары Web3 құралдар берді: токендер, NFT, тікелей төлемдер — платформалық комиссияларсыз. Манифест бизнес-модельге айналды.", "body": "## Уақытынан озған эссе\n\n2008 жылы Кевин Келли «1,000 True Fans» атты қысқа эссе жазды. Ол шығармашылық экономика туралы ең көп дәйектелетін мәтіндердің біріне айналды — ал 2008 жылы бұл практикалық құралдары жоқ әдемі манифест еді. 2020-жылдары ол жұмыс істейтін бизнес-модельге айналды.\n\nОның уәжі көркем: шығармашыға миллиондаған кездейсоқ жазылушы керек емес. Оған мың шынайы фанат керек — сен жасағанның бәрін сатып алатын адамдар. Қатты мұқабалы кітапты да, жұмсақ мұқабалысын да. Концерт билетін де, концерт жазбасын да. Лимиттелген принтті де, кәдімгі постерді де. Жабық қауымдастыққа қолжетімділікті де, ашық контентті де.\n\nМатематика қарапайым. Әрқайсысы жылына 100 доллар жұмсайтын мың фанат — бұл 100 000 доллар. Бұл тәуелсіз шығармашы үшін қарапайым, бірақ жеткілікті табыс. Миллионер болу үшін емес. Шығармашылық еркіндікті сақтап, алгоритмдерге тәуелді болмау үшін.\n\nПлатформалық модельмен айырмашылығы айқын. YouTube-та миллион қаралымнан 1 000-нан 3 000 долларға дейін табуға болады — контент санатына және аудитория демографиясына байланысты. Бұл дегеніміз: YouTube-та жылына 100 000 доллар табу үшін жылына шамамен 40–100 миллион қаралым керек. Бұл санаулы адамға ғана қолжетімді.\n\nАл тікелей 100 доллардан төлейтін мың адам ше? Бұл көп адамға қолжетімді — егер тікелей төлемдерге арналған құрал болса.\n\n## Web3 бұған құралдарды қалай берді\n\n2008 жылы Келли идеяны сипаттады — бірақ механизмді сипаттай алмады. Сол мың адамды қалай табуға болады? Делдал банксіз және 30% алатын төлем платформасынсыз ақшаны тікелей қалай алуға болады? Алгоритм кімнің не көретінін шешкен кезде адамдармен қарым-қатынасты қалай сақтауға болады?\n\nWeb3 жауап берді.\n\nТокендер фанатқа жобаның ортақ иесі болуға мүмкіндік береді. Жай сатып алушы емес — қатысушы. Кең танылғанға дейін токен сатып алған ерте қолдаушы жоба өскен сайын бірге ұтады. Бұл мүдделерді теңестіреді: жасаушы өсімге мүдделі, фан да солай. Екеуі де табыстан ұтады.\n\nNFT — Non-Fungible Tokens — бірегей цифрлық активтер береді. Жасаушы шектеулі жұмыс сериясын коллекционерлерге тікелей сатады. 50% алатын галереясыз. Сатып алушылар туралы деректерді алып қоятын платформасыз. Ал смарт-контракт әрбір кейінгі қайта сатылым кезінде жасаушыға роялтиді автоматты түрде төлейді — тіпті он жылдан кейін де. Бұл дәстүрлі әлемде мүмкін емес: суретші картинаны сатады да, оның бағасы қанша өссе де, енді ештеңе алмайды. Web3-те — әр мәміледен мәңгі пайыз алады.\n\nБлокчейн арқылы тікелей төлемдер — Stripe комиссиясынсыз (2,9%), PayPal комиссиясынсыз (3–5%), App Store комиссиясынсыз (30%). TON-әмиян төлемді центтің үлестері көлеміндегі комиссиямен алуға мүмкіндік береді. Тікелей төлейтін мың фанаты бар жасаушы үшін бұл: ол дерлік бәрін өзі алады деген сөз.\n\nЛи Джин «The Passion Economy» еңбегінде кеңірек өзгерісті сипаттады: жасаушылар платформаның алгоритмдік шешімдеріне тәуелді болатын «платформалар экономикасынан» тереңдік ауқымнан маңыздырақ болатын «құштарлық экономикасына» өту. Саған бірегей қолжетімділік үшін жылына мың доллардан төлейтін жүз адам — сен ештеңе алмайтын миллион кездейсоқ көрерменнен жақсы.\n\n> Келли манифесті 2008 жылы жазды. Web3 оны 2020-жылдары жүзеге асыратын құралдарды берді. Мың шынайы фанат плюс токендер, NFT және тікелей төлемдер — тәуелсіз шығармашы үшін жұмыс істейтін бизнес-модель.\n\nБұл платформаларды толық жоймайды. Бірақ күштердің тепе-теңдігін өзгертеді: жасаушы енді бөтен компанияның алгоритмдік шешімдеріне толық тәуелді емес. Оның аудиторияға және монетизацияға апаратын балама жолы бар.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["жасаушылар", "токеномика", "NFT", "құштарлық экономикасы"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "longtail", "sceneIndex": 4, "type": "media", "shortTitle": "Ұзын құйрық", "era": "2004", "lensWeight": {"chronology": 3, "attention": 2, "creators": 4, "networks": 4, "ownership": 3}, "title": "Ұзын құйрық: нишалар экономикасы", "insight": "Ұзын құйрық: цифрлық әлемде нишалық жасаушыларға орын шексіз. Web2 бәрібір олардың арасына алгоритмді қойды. Web3 қақпашысыз тікелей арналар құрады.", "thesis": "Ұзын құйрық: цифрлық әлемде нишалық жасаушыларға орын шексіз. Web2 бәрібір олардың арасына алгоритмді қойды. Web3 қақпашысыз тікелей арналар құрады.", "body": "## Хиттер диктатурасының соңы\n\nЦифрлық экономика нарықтардың құрылымын өзгертті — мұны қарапайым ұқсастық арқылы түсінуге болады.\n\n1990-жылдардағы музыкалық дүкенді елестет. Оның кеңістігі шектеулі: бір-екі мың шаршы метр, сөрелер саны шектеулі. Ол нені қояды? Хиттерді. Аптасына мыңдаған данамен сатылатын альбомдарды. Өйткені сөре кеңістігі — тапшы ресурс. Бүкіл елде жүз адам тыңдайтын нишалық орындаушылар ол жерге кірмейді. Айына бір дана сатылатын альбомды ұстау дүкенге тиімсіз.\n\nЕнді Spotify. Оның физикалық сөрелері жоқ. Тағы бір миллион тректі сақтау іс жүзінде ештеңе тұрмайды — цифрлық деректер. Сондықтан Spotify бір уақытта 100 миллион трек ұсына алады. Бүкіл әлемде жүз адам тыңдайтындарды қоса алғанда.\n\nБұл — ұзын құйрық, 2006 жылғы кітабында Крис Андерсон сипаттаған концепция. Танымалдық қисығында «бас» бар — үлкен аудиториясы бар бірнеше суперхит. Және «құйрық» бар — аудиториясы шағын, бірақ бар нишалық өнімдердің шексіз жиыны. Физикалық әлемде «бас» үстемдік етеді: сөрелерге тек хиттер түседі. Цифрлық әлемде «құйрық» шексіз — және нишалық өнімдердің жиынтық аудиториясы хиттердің аудиториясынан асып түсуі мүмкін.\n\n## Бұл жасаушылар үшін нені білдіреді\n\nАндерсон Amazon және Netflix үшін зерттеу жүргізіп, олардың табысының елеулі бөлігі бестселлерлерден емес, әрқайсысы сирек сатылса да, бәрібір сатылатын миллиондаған нишалық өнімдерден келетінін анықтады.\n\nЖасаушылар үшін бұл жағдайды түбегейлі өзгертеді. Интернетке дейінгі дәуірде кәсіби музыкант болу үшін радиоға шығу, лейблмен келісімшарт алу, миллиондаған тыңдарманға жету керек еді. Бүкіл әлем бойынша жиырма мың адам сүйіп тыңдайтын нишалық орындаушы бұған мансап құра алмады — өйткені сол жиырма мың адам шашырап жатты және оларға жетудің жолы жоқ еді.\n\nИнтернет мұны өзгертті: нишалық аудиториялар табылатын және қолжетімді болды. Бірақ Web2 жаңа проблема тудырды: алгоритмдер «бастың» пайдасына жұмыс істейді. YouTube бұрыннан танымал нәрсені ұсынады. Instagram жоғары вовлечениесі бар контентті ілгерілетеді. TikTok вирустық болып жатқанды вирустық етеді. Нишалық жасаушы тұзаққа түседі: теориялық тұрғыдан оның аудиториясы бар, бірақ алгоритм оны табуға көмектеспейді — ол суперхиттерді ілгерілетумен айналысады.\n\nWeb3 мұны өзгерте алады. Егер жасаушының аудиторияға тікелей арнасы болса — әмияндар, токендер, децентрализденген протоколдар арқылы — оған алгоритмдік назар үшін бәсекелесудің қажеті жоқ. Оның жиырма мың шынайы жанкүйері тікелей жазылған. Алгоритм енді қақпашы емес.\n\n> Андерсон көрсетті: цифрлық әлем шексіз көп нишалық жасаушыларға орын ашады. Web2 оларға құралдар бермеді — алгоритмдер оларға қарсы жұмыс істеді. Web3 нишалық жасаушы ұсыныс жүйесіне тәуелді болмайтын тікелей арналар құрады.\n\nБұл әрбір нишалық жасаушы байып кетеді дегенді білдірмейді. Бірақ бұл бірегей нәрсе жасайтындардың өз аудиториясын тауып, соның негізінде тұрақты табыс құруға нақты мүмкіндігі бар деген сөз — супер жұлдызға айналу қажеттілігінсіз.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["жасаушылар", "экономика", "ұзын құйрық", "қауымдастық"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "dao", "sceneIndex": 5, "type": "technology", "shortTitle": "DAO", "era": "Web3", "lensWeight": {"chronology": 3, "attention": 1, "creators": 3, "networks": 4, "ownership": 5}, "title": "DAO: директорсыз компания", "insight": "DAO — code ішіндегі ұйым: токендер дауыс ретінде, smart contracts орындаушы ретінде. Көпшіліктің шешімін бұғаттай алатын CEO жоқ. Алғаш рет — орталықтандырылған басқарусыз үйлестіру.", "thesis": "DAO — code ішіндегі
