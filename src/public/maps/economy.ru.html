D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["economía", "efectos de red", "plataformas", "tokenomía"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "trap", "sceneIndex": 2, "type": "power", "shortTitle": "Trampa de los creadores", "era": "Web2", "lensWeight": {"chronology": 2, "attention": 3, "creators": 5, "networks": 3, "ownership": 3}, "title": "La trampa de los creadores: por qué el contenido no genera dinero", "insight": "Peress mostró que la trampa no está en la calidad del contenido. El verdadero producto es la comunidad, no el contenido. Las plataformas ganaron al construir la infraestructura de conexiones. Web3 se la devuelve a los creadores.", "thesis": "Peress mostró que la trampa no está en la calidad del contenido. El verdadero producto es la comunidad, no el contenido. Las plataformas ganaron al construir la infraestructura de conexiones. Web3 se la devuelve a los creadores.", "body": "## La paradoja de la abundancia\n\nEn 1998, Kevin Kelly formuló una paradoja que se convirtió en una maldición para millones de creadores de contenido: en un mundo de abundancia de información, el valor de la información misma tiende a cero.\n\nLa lógica es de hierro. Cuando la información era escasa, se pagaba por ella. Los libros eran caros porque había pocos y producirlos costaba mucho. Un álbum musical costaba quince dólares porque había que fabricar, empaquetar y entregar un CD físico. Un artículo de un experto valía porque el acceso a ese experto era poco común.\n\nInternet destruyó esa escasez. Ahora cualquiera puede publicar cualquier cosa. Cualquiera puede sacar un álbum, subir una película, escribir un artículo. La oferta de contenido es infinita. Y una oferta infinita con una demanda finita significa una sola cosa: el precio tiende a cero.\n\nUn periodista escribe titulares clickbait no porque quiera, sino porque el algoritmo premia exactamente eso. Un músico lanza sencillos interminables en lugar de álbumes porque Spotify paga por reproducciones, no por calidad. Un artista adapta su estilo al algoritmo de Instagram porque, de lo contrario, nadie lo verá. El sistema deforma la creatividad no por mala intención, sino por los incentivos.\n\n## Peress: tu producto no es el contenido\n\nDavid Peress, en \"The Content Trap\", dio el diagnóstico correcto: los creadores pierden frente a las plataformas no porque su contenido sea malo. Pierden porque entienden mal qué es exactamente lo que están creando.\n\nPeress estudió la industria de los medios y encontró un patrón: las empresas que pensaban que su producto era el contenido perdían. Las empresas que entendían que su producto era la comunidad alrededor del contenido ganaban.\n\nThe New York Times no es un periódico. Es una comunidad de personas que confían en The New York Times y regresan a él cada día. Cuando esa comunidad existe, la monetización es posible mediante suscripciones, eventos y proyectos especiales. Cuando no existe, eres solo uno de millones de sitios en internet.\n\nUn artista no es un conjunto de temas. Es la relación entre el artista y sus oyentes. Adele vende álbumes no porque sean mejores que otros álbumes. Los vende porque tiene un ejército de oyentes fieles que sienten una conexión personal con ella.\n\nLas plataformas ganaron precisamente por entender esto: no crearon contenido, construyeron la infraestructura de conexiones entre creadores y audiencias. Facebook no escribe publicaciones. YouTube no graba videos. Pero controlan la conexión entre quienes escriben y quienes leen. Y cobran por ello con la atención de los usuarios.\n\nLa conclusión de Peress: un creador que quiera salir de la trampa debe dejar de pensar en contenido y empezar a pensar en comunidad. Construir relaciones directas con la audiencia. Monetizar la pertenencia, no las vistas.\n\n> Peress lo formuló con precisión: la trampa no está en la calidad del contenido. La trampa está en que piensas que tu producto es contenido. Tu producto es la comunidad. Las plataformas construyeron la infraestructura de conexiones y la pusieron bajo control. Web3 da herramientas para devolver ese control al creador.\n\nPor eso mismo, los tokens, NFT y los pagos directos en Web3 no son solo comodidad. Son herramientas para monetizar una comunidad directamente, sin una plataforma intermediaria.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["creadores", "comunidad", "atención", "economía"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "fans", "sceneIndex": 3, "type": "privacy", "shortTitle": "1000 fans", "era": "2008→años 2020", "lensWeight": {"chronology": 3, "attention": 2, "creators": 5, "networks": 2, "ownership": 4}, "title": "Mil fans verdaderos: el manifiesto consiguió sus herramientas", "insight": "Kelly en 2008: mil fans verdaderos a 100 dólares = 100k al año. En la década de 2020, Web3 dio las herramientas: tokens, NFT y pagos directos, sin comisiones de plataforma. El manifiesto se convirtió en un modelo de negocio.", "thesis": "Kelly en 2008: mil fans verdaderos a 100 dólares = 100k al año. En la década de 2020, Web3 dio las herramientas: tokens, NFT y pagos directos, sin comisiones de plataforma. El manifiesto se convirtió en un modelo de negocio.", "body": "## Un ensayo adelantado a su tiempo\n\nEn 2008, Kevin Kelly escribió un breve ensayo, \"1,000 True Fans\". Se convirtió en uno de los textos más citados sobre la economía de los creadores, y en 2008 era un bello manifiesto sin herramientas prácticas. En la década de 2020, se convirtió en un modelo de negocio que sí funciona.\n\nSu argumento es elegante: un creador no necesita millones de suscriptores al azar. Necesita mil fans verdaderos, personas que comprarán todo lo que cree. El libro de tapa dura y el de tapa blanda. La entrada al concierto y la grabación del concierto. La edición limitada y el póster común. El acceso a una comunidad cerrada y el contenido público.\n\nLa matemática es simple. Mil fans, cada uno gastando 100 dólares al año, son 100 000 dólares. Es un ingreso modesto pero suficiente para un creador independiente. No para hacerse millonario. Sí para conservar la libertad creativa y no depender de los algoritmos.\n\nEl contraste con el modelo de plataforma es contundente. En YouTube, un millón de vistas puede generar entre 1 000 y 3 000 dólares, según la categoría del contenido y la demografía de la audiencia. Eso significa que para ganar 100 000 dólares al año en YouTube necesitas unos 40-100 millones de vistas al año. Eso está al alcance de muy pocos.\n\n¿Y mil personas que pagan 100 dólares directamente? Eso está al alcance de muchos, si existe una herramienta para pagos directos.\n\n## Cómo Web3 le dio herramientas\n\nEn 2008, Kelly describió la idea, pero no podía describir el mecanismo. ¿Cómo encuentras a esos mil? ¿Cómo recibes dinero directamente, sin un banco intermediario y sin una plataforma de pagos que cobre 30%? ¿Cómo mantienes la relación con la gente cuando un algoritmo decide quién ve qué?\n\nWeb3 dio las respuestas.\n\nLos tokens permiten que un fan se convierta en copropietario del proyecto. No solo un comprador, sino un participante. Un seguidor temprano que compró tokens antes del reconocimiento general gana a medida que crece el proyecto. Eso alinea los intereses: el creador está interesado en crecer, y el fan también. Ambos ganan con el éxito.\n\nNFT — Non-Fungible Tokens — ofrecen activos digitales únicos. Un creador vende una serie limitada de obras directamente a coleccionistas. Sin una galería que se quede con el 50%. Sin una plataforma que se lleve los datos de los compradores. Y un contrato inteligente paga automáticamente regalías al creador en cada reventa posterior, incluso diez años después. Eso es imposible en el mundo tradicional: un artista vende una pintura y no vuelve a recibir nada, por mucho que suba de precio. En Web3, recibe un porcentaje de cada transacción para siempre.\n\nLos pagos directos a través de blockchain, sin la comisión de Stripe (2,9%), sin la comisión de PayPal (3–5%), sin la comisión de App Store (30%). Un monedero de TON permite recibir un pago con una comisión de fracciones de centavo. Para un creador con mil fans que pagan directamente, eso significa: recibe casi todo.\n\nLi Jin, en \"The Passion Economy\", describió un cambio más amplio: de la \"economía de plataformas\", donde los creadores dependen de las decisiones algorítmicas de la plataforma, a la \"economía de la pasión\", donde la profundidad importa más que el alcance. Cien personas que pagan mil dólares al año por un acceso único a ti están mejor que un millón de espectadores al azar de quienes no recibes nada.\n\n> Kelly escribió el manifiesto en 2008. Web3 dio las herramientas para implementarlo en la década de 2020. Mil fans verdaderos más tokens, NFT y pagos directos es un modelo de negocio funcional para un creador independiente.\n\nEso no elimina por completo las plataformas. Pero sí cambia el equilibrio de poder: el creador ya no depende por completo de las decisiones algorítmicas de la empresa de otro. Tiene una vía alternativa hacia la audiencia y la monetización.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["creadores", "tokenomía", "NFT", "economía de la pasión"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "longtail", "sceneIndex": 4, "type": "media", "shortTitle": "Larga cola", "era": "2004", "lensWeight": {"chronology": 3, "attention": 2, "creators": 4, "networks": 4, "ownership": 3}, "title": "La larga cola: la economía de los nichos", "insight": "La larga cola: en el mundo digital hay espacio infinito para los creadores de nicho. Web2 todavía puso un algoritmo entre ellos y la audiencia. Web3 construye canales directos sin guardián.", "thesis": "La larga cola: en el mundo digital hay espacio infinito para los creadores de nicho. Web2 todavía puso un algoritmo entre ellos y la audiencia. Web3 construye canales directos sin guardián.", "body": "## El fin de la dictadura de los éxitos\n\nLa economía digital cambió la estructura de los mercados, y esto se puede entender con una analogía sencilla.\n\nImagina una tienda de música de los años 1990. Tiene espacio limitado: mil o dos mil metros cuadrados, un número limitado de estantes. ¿Qué exhibe? Éxitos. Álbumes que venden miles de copias por semana. Porque el espacio en los estantes es un recurso escaso. Los artistas de nicho que escucha un centenar de personas en todo el país no llegan ahí. No le conviene a la tienda guardar un álbum que vende una copia al mes.\n\nAhora Spotify. No tiene estantes físicos. Guardar otro millón de pistas prácticamente no cuesta nada: datos digitales. Por eso Spotify puede ofrecer 100 millones de pistas al mismo tiempo. Incluyendo a las que escucha un centenar de personas en todo el mundo.\n\nEso es la larga cola, un concepto descrito por Chris Anderson en su libro de 2006. En la curva de popularidad hay una «cabeza» — unos pocos superéxitos con una audiencia enorme. Y hay una «cola» — un conjunto interminable de productos de nicho con una audiencia pequeña pero existente. En el mundo físico, la «cabeza» domina: solo los éxitos llegan a los estantes. En el mundo digital, la «cola» es infinita, y la audiencia combinada de los productos de nicho puede superar la de los éxitos.\n\n## Lo que esto significa para los creadores\n\nAnderson realizó una investigación para Amazon y Netflix, y descubrió que una parte importante de sus ingresos no proviene de los más vendidos, sino de millones de productos de nicho, cada uno de los cuales se vende pocas veces, pero se vende.\n\nPara los creadores, esto cambia por completo el panorama. En la era anterior a Internet, para ser músico profesional había que sonar en la radio, firmar con un sello discográfico y llegar a millones de oyentes. Un artista de nicho adorado por veinte mil personas en todo el mundo no podía construir una carrera sobre eso, porque esas veinte mil personas estaban dispersas y no había forma de llegar a ellas.\n\nInternet cambió eso: las audiencias de nicho se volvieron localizables y accesibles. Pero Web2 creó un nuevo problema: los algoritmos favorecen a la «cabeza». YouTube recomienda lo que ya es popular. Instagram promociona el contenido con alto nivel de interacción. TikTok vuelve viral lo que ya está volviéndose viral. El creador de nicho cae en una trampa: en teoría, su audiencia existe, pero el algoritmo no ayuda a encontrarla; está ocupado promocionando superéxitos.\n\nWeb3 puede cambiar esto. Si un creador tiene un canal directo con su audiencia —a través de billeteras, tokens y protocolos descentralizados— no necesita competir por la atención algorítmica. Sus veinte mil verdaderos fans están suscritos directamente. El algoritmo ya no es el guardián.\n\n> Anderson mostró: el mundo digital crea espacio para un número infinito de creadores de nicho. Web2 no les dio herramientas: los algoritmos trabajaban en su contra. Web3 construye canales directos donde el creador de nicho no depende del sistema de recomendaciones.\n\nEsto no significa que cada creador de nicho se hará rico. Pero sí significa que quienes crean algo único tienen una oportunidad real de encontrar a su audiencia y construir con ella un ingreso sostenible, sin necesidad de convertirse en una superestrella.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["creadores", "economía", "larga cola", "comunidad"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "dao", "sceneIndex": 5, "type": "technology", "shortTitle": "DAO", "era": "Web3", "lensWeight": {"chronology": 3, "attention": 1, "creators": 3, "networks": 4, "ownership": 5}, "title": "DAO: una empresa sin director", "insight": "DAO es una organización en código: los tokens como votos y los smart contracts como ejecutores. No hay un CEO que pueda bloquear la decisión de la mayoría. Por primera vez, coordinación sin gestión centralizada.", "thesis": "DAO es una organización en código: los tokens como votos y los smart contracts como ejecutores. No hay un CEO que pueda bloquear la decisión de la mayoría. Por primera vez, coordinación sin gestión centralizada.", "body": "## Una nueva forma de organización\n\nEn 2014, Vitalik Buterin escribió un ensayo que empezaba con una pregunta: ¿y si una organización pudiera ponerse en marcha sin personas en la gestión?\n\nSonaba a ciencia ficción. Pero la idea tenía una lógica de hierro.\n\nUna empresa tradicional es una jerarquía. Hay accionistas (dueños), hay un directorio (dirección estratégica), hay gerencia (dirección operativa) y hay empleados (ejecución). En cada nivel existe un problema de agencia: una persona que administra dinero ajeno tiene sus propios intereses, que pueden no coincidir con los de los dueños. Un gerente puede tomar decisiones que le convienen a él y no a la empresa. Un director puede trabajar para un accionista grande en perjuicio de los pequeños.\n\nButerin propuso: ¿y si las reglas de la organización se escribieran en un smart contract? El código no se puede sobornar. El código no puede tomar una decisión a favor de un participante contra otros. El código ejecuta exactamente lo que está escrito en él.\n\nAsí nació el concepto de DAO: Decentralized Autonomous Organization, organización autónoma descentralizada.\n\n## Cómo funciona una DAO en la práctica\n\nImagina una organización que administra un protocolo DeFi, por ejemplo un exchange descentralizado. Esa organización no tiene CEO, no tiene oficina, no tiene domicilio legal. Hay un smart contract que define las reglas y hay tokens de gobernanza: votos digitales.\n\nCada titular de tokens puede llevar una propuesta a votación. \"Cambiemos la comisión de 0.3% a 0.25%.\" \"Agreguemos soporte para un nuevo activo.\" \"Destinemos 10% de los ingresos del protocolo a un fondo de reserva.\" Los titulares de tokens votan. Si una propuesta obtiene suficientes votos, el smart contract la ejecuta automáticamente. No hay un CEO que pueda bloquearla. No hay un directorio que pueda revertir la decisión. El código es la ley.\n\nLa primera gran DAO, The DAO, se lanzó en 2016 en Ethereum y reunió 150 millones de dólares de los participantes. Unas semanas después, un hacker encontró una vulnerabilidad en el código y retiró un tercio de los fondos. Fue una lección dolorosa: una DAO es tan confiable como lo sea su código. Un error en un smart contract no es un factor humano que se pueda corregir. Es matemática ejecutada literalmente.\n\nPero la idea sobrevivió. Para la década de 2020, las DAOs manejan miles de millones de dólares en protocolos DeFi. Uniswap se gobierna mediante una DAO, donde los titulares del token UNI votan los cambios del protocolo. MakerDAO gobierna la stablecoin DAI mediante la votación de los titulares de MKR. Son organizaciones en funcionamiento, con dinero real, sin una estructura corporativa tradicional.\n\nRakesh Agrawal, en \"The Tokenized Economy\", describe un significado más profundo de los tokens en este contexto. Un token de DAO no es solo un derecho de voto. Es alineación de intereses. Si el protocolo crece y se vuelve más valioso, los tokens suben de precio para todos: desarrolladores, usuarios e inversores. Todos están interesados en el crecimiento al mismo tiempo. En una empresa tradicional, lograr eso es prácticamente imposible: los intereses de accionistas y usuarios son estructuralmente opuestos.\n\n> Una DAO no es una organización perfecta. Es una organización distinta: con otros compromisos, otros riesgos y otras posibilidades. Lo principal: por primera vez existe la posibilidad técnica de coordinar personas alrededor de un objetivo común sin una gestión centralizada.\n\nPara creadores, comunidades y pequeños negocios, esto abre posibilidades interesantes: propiedad colectiva, gobernanza transparente, distribución automática de ingresos. Todo esto sin despachos jurídicos, sin bancos y sin un CEO tomando decisiones en solitario.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["DAO", "tokenomía", "gobernanza", "DeFi"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "value", "sceneIndex": 6, "type": "economy", "shortTitle": "Valor en las redes", "era": "→protocolos", "lensWeight": {"chronology": 4, "attention": 2, "creators": 3, "networks": 5, "ownership": 5}, "title": "El valor se crea en las redes: de las fábricas a los protocolos", "insight": "Las empresas más grandes del mundo no poseen activos físicos: poseen infraestructura de conexiones. Web3 va más allá: ¿y si esa infraestructura perteneciera a los propios participantes?", "thesis": "Las empresas más grandes del mundo no poseen activos físicos: poseen infraestructura de conexiones. Web3 va más allá: ¿y si esa infraestructura perteneciera a los propios participantes?", "body": "## Las empresas más grandes del mundo no poseen nada físico\n\nEn 1998, Kevin Kelly escribió algo que entonces sonaba provocador: en la nueva economía, el valor no se crea en la producción, sino en las conexiones.\n\nMira 2024 y entenderás que tenía razón.\n\nUber es el servicio de taxis más grande del mundo. No posee ni un solo automóvil. Airbnb es la empresa hotelera más grande del mundo. No posee ni una sola habitación. Facebook es el medio de comunicación más grande del mundo. No produce ni una sola pieza de contenido. Alibaba es el minorista más grande de China. No mantiene mercancías en almacenes.\n\n¿Qué tienen? Infraestructura de conexiones. Uber conecta conductores y pasajeros. Airbnb conecta anfitriones y huéspedes. Facebook conecta a las personas entre sí. Alibaba conecta vendedores y compradores. El valor está en el simple hecho de conectar, no en los activos físicos.\n\nEste es un cambio fundamental de la lógica industrial a la lógica de red. En la economía industrial, valor = recursos + trabajo + capital. Para crear valor, necesitas ser dueño de los medios de producción. En la economía de red, valor = conexiones × participantes². Para crear valor, necesitas organizar la interacción entre personas.\n\n## Web3: ¿y si la red perteneciera a los participantes?\n\nPero esto plantea la siguiente pregunta, y justo ahí Web3 ofrece una respuesta radicalmente nueva.\n\nUber crea valor al conectar conductores y pasajeros. Los conductores crean ese valor con su trabajo. Pero Uber pertenece a los accionistas, no a los conductores. Los conductores cobran por un viaje. No reciben una parte del crecimiento del valor de la red, que ellos mismos crean con su trabajo.\n\n¿Qué pasaría si el protocolo que conecta conductores y pasajeros estuviera gobernado por una DAO? Los conductores recibirían tokens en proporción a su contribución. A medida que creciera la red, los tokens subirían de precio. Un conductor que ayudó a construir la red desde los primeros días se beneficiaría de su crecimiento, como un empleado temprano de una startup que recibió opciones.\n\nEsta idea ya está implementada en DeFi. Uniswap, un exchange descentralizado, distribuye las comisiones de trading entre los proveedores de liquidez que aportaron activos a los pools. Compound distribuye tokens de gobernanza entre los usuarios que usan el protocolo. Esto no es una utopía. Es un modelo en funcionamiento con miles de millones de dólares bajo gestión.\n\nJared Lanier, en el ensayo \"Own the Internet\", formuló el concepto sin rodeos: la siguiente etapa de internet es una internet de la que puedes comprar una parte. No solo usarla. Poseerla. Ganar con su crecimiento. Votar los cambios.\n\nLa transición de \"usuario como producto\" a \"usuario como copropietario\" no es solo un cambio tecnológico. Es político. La pregunta de quién posee el valor creado por una red es una pregunta sobre cómo se distribuye el poder en la sociedad.\n\n> Kelly en 1998: el valor se crea en las conexiones, no en la producción. Lanier en 2021: ¿y si los participantes de la red la poseyeran? Juntos describen la transición de \"valor en la plataforma\" a \"valor en los participantes\".\n\nEsto está ocurriendo ahora mismo, a escala experimental. Blockchains con miles de millones de dólares en TVL (Total Value Locked — valor total bloqueado), DAO con miles de participantes, creadores con comunidades NFT. No todos los experimentos tuvieron éxito. Muchos fracasaron. Pero el principio funciona, y eso lo cambia todo.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["economía", "redes", "tokenomía", "valor"], "x": 265.5, "y": 258.0, "angDeg": 218.6}], "edges": [{"from": "wu", "to": "rules", "label": "la atención obedece las reglas de la red", "lenses": ["attention", "networks"]}, {"from": "rules", "to": "trap", "label": "los monopolios atrapan a los creadores", "lenses": ["networks", "creators"]}, {"from": "trap", "to": "fans", "label": "la salida es una conexión directa con los fans", "lenses": ["creators", "ownership"]}, {"from": "fans", "to": "longtail", "label": "hay espacio suficiente para los nichos", "lenses": ["creators", "networks"]}, {"from": "longtail", "to": "value", "label": "la cola alimenta las redes", "lenses": ["networks", "chronology"]}, {"from": "trap", "to": "dao", "label": "infraestructura para los creadores", "lenses": ["creators", "ownership"]}, {"from": "dao", "to": "value", "label": "los participantes poseen la red", "lenses": ["ownership", "networks"]}, {"from": "wu", "to": "value", "label": "de vender atención a poseer", "lenses": ["chronology", "attention"]}, {"from": "rules", "to": "value", "label": "los protocolos cambian la regla", "lenses": ["networks", "ownership"]}, {"from": "fans", "to": "dao", "label": "tokens como herramienta", "lenses": ["ownership", "creators"]}]}, "fr": {"chapter": {"key": "economy", "title": "Économie des créateurs", "lede": "La valeur naît dans les réseaux, et la question centrale est de savoir à qui elle appartient.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=economy", "centralIdea": "La valeur est dans le réseau, et la question est de savoir à qui elle appartient", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Chronologie", "accent": "#7dd3fc", "description": "Des journaux de Tim Wu aux protocoles Web3 : deux cents ans de vente de l’attention."}, {"id": "attention", "label": "Attention", "accent": "#fbbf24", "description": "Tim Wu : la vente de l’attention comme modèle porté par Web2 à 600 milliards de dollars par an."}, {"id": "creators", "label": "Créateurs", "accent": "#c084fc", "description": "Le piège du contenu, mille vrais fans et l’économie de la longue traîne."}, {"id": "networks", "label": "Réseaux", "accent": "#34d399", "description": "La loi de Metcalfe et les coûts nuls : pourquoi le gagnant rafle tout."}, {"id": "ownership", "label": "Propriété", "accent": "#f87171", "description": "DAO et infrastructure des liens : et si elle appartenait aux participants ?"}], "nodes": [{"id": "wu", "sceneIndex": 0, "type": "media", "shortTitle": "Tim Wu", "era": "200 ans", "lensWeight": {"chronology": 5, "attention": 5, "creators": 2, "networks": 2, "ownership": 1}, "title": "Tim Wu : l’histoire de la vente de l’attention", "insight": "Tim Wu a montré que la vente de l’attention est un modèle vieux de deux cents ans, des journaux jusqu’à TikTok. Web2 l’a portée à 600 milliards de dollars par an. La seule différence est la précision du ciblage.", "thesis": "Tim Wu a montré que la vente de l’attention est un modèle vieux de deux cents ans, des journaux jusqu’à TikTok. Web2 l’a portée à 600 milliards de dollars par an. La seule différence est la précision du ciblage.", "body": "## Le journal à un centime et le premier marché de l’attention\n\nEn 1833, l’éditeur américain Benjamin Day a imaginé quelque chose qui a changé à jamais le secteur des médias. Il a commencé à vendre le journal New York Sun pour un centime, trois à quatre fois moins cher que son coût de production. Tout le monde autour de lui pensait qu’il avait perdu la tête : comment peut-on gagner de l’argent en vendant à un prix inférieur au coût de fabrication ?\n\nLa réponse était simple et brillante. Un journal bon marché attirait des lecteurs, des personnes de la classe ouvrière qui n’achetaient pas la presse auparavant à cause du prix. Beaucoup de lecteurs, c’est une audience. Et il vendait cette audience aux annonceurs. Le lecteur payait avec son attention, l’annonceur avec de l’argent. Le journal n’était pas le produit. C’était l’appât.\n\nC’était la première transaction de l’histoire fondée sur la vente de l’attention. Et depuis, pendant presque deux cents ans, sa structure n’a pas changé. Seule l’échelle a changé.\n\nTim Wu, dans le livre \"The Attention Merchants\", a suivi cette logique à travers deux siècles avec une précision remarquable. Chaque nouveau média a repris le même schéma. La radio des années 1920 : le contenu gratuit attire des auditeurs, les auditeurs sont vendus aux annonceurs. La télévision des années 1950 : le même schéma, mais avec des images en mouvement et une portée plus large. La télévision par câble : le même schéma, mais avec abonnement. L’internet Web1 : le contenu est gratuit, mais l’attention n’est pas encore monétisée. Web2 : la monétisation de l’attention atteint une échelle industrielle.\n\n## La grande extraction : quand tu es devenu le produit\n\nWu appelle ce qui se passe « la grande extraction ». Le système médiatique prélève systématiquement l’attention des gens, la ressource la moins renouvelable que nous ayons, et la transforme en argent pour des tiers.\n\nDes chiffres précis aident à mesurer l’ampleur. L’utilisateur moyen de Facebook en 2023 passait environ 35 minutes par jour dans l’application. Facebook gagnait environ 50 dollars par an sur cet utilisateur aux États-Unis, grâce à la publicité. L’utilisateur ne recevait rien, à part le service lui-même. La transaction était à sens unique.\n\nGoogle gagne de l’argent sur les requêtes de recherche : chaque requête est un signal d’intention vendu aux annonceurs. Tu cherches « acheter un canapé » et Google vend cette information aux magasins de meubles. Tu ne paies pas avec de l’argent. Tu paies avec ton intention.\n\nFacebook gagne de l’argent sur les liens sociaux : chaque like est une donnée sur un profil psychologique. Tu likes certaines publications et Facebook connaît tes valeurs, tes peurs et tes opinions politiques. Il vend ces connaissances à des annonceurs, à des campagnes politiques, à tous ceux qui sont prêts à payer.\n\nTikTok gagne de l’argent sur le temps : chaque seconde supplémentaire dans l’application rapporte. Son algorithme est optimisé pour une seule chose : te retenir le plus longtemps possible. Non pas parce que c’est bon pour toi. Mais parce que c’est bon pour ses revenus publicitaires.\n\nLe marché global de la publicité numérique a dépassé 600 milliards de dollars par an en 2023. À titre de comparaison, c’est plus que le PIB de la Suède. L’intégralité de cette somme correspond à la monétisation de l’attention humaine que les gens cèdent en pensant utiliser un service gratuit.\n\nWu pointe une asymétrie fondamentale : les gens ne connaissent pas les conditions de la transaction. Nulle part il n’est écrit : « ton attention vaut 50 dollars par an, et nous la vendons ». Il est écrit : « Gratuit. Il suffit de s’inscrire ».\n\n> Wu a montré que la vente de l’attention n’est pas une invention d’internet. C’est un modèle vieux de deux cents ans, que Web2 a porté à l’échelle industrielle. La différence entre un journal à un centime et TikTok tient seulement à la précision du ciblage et à la taille du marché.\n\nCette compréhension change la façon dont tu regardes les services « gratuits ». Rien n’est gratuit. La seule question est de savoir si tu comprends ce avec quoi tu paies. La nouvelle économie que construit Web3 essaie de changer cet échange : le rendre explicite, juste et mutuel.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["attention", "économie", "médias", "Web2"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "rules", "sceneIndex": 1, "type": "economy", "shortTitle": "Règles de l’information", "era": "loi de Metcalfe", "lensWeight": {"chronology": 3, "attention": 2, "creators": 2, "networks": 5, "ownership": 3}, "title": "Les règles de l’information : pourquoi le gagnant rafle tout", "insight": "Les coûts marginaux nuls de l’information + la loi de Metcalfe = les monopoles de Web2. Le premier à atteindre une masse critique gagne pour toujours. Les protocoles ouverts de Web3 changent cette règle.", "thesis": "Les coûts marginaux nuls de l’information + la loi de Metcalfe = les monopoles de Web2. Le premier à atteindre une masse critique gagne pour toujours. Les protocoles ouverts de Web3 changent cette règle.", "body": "## Coûts marginaux nuls : pourquoi l’information est particulière\n\nPour comprendre l’économie d’internet, il faut comprendre une chose qui rend les produits d’information fondamentalement différents. Hal Varian et Carl Shapiro l’ont décrit dans le livre \"Information Rules\" dès 1999, et leurs observations n’ont pas pris une ride.\n\nUn bien matériel, un réfrigérateur, une voiture, du pain, coûte de l’argent à chaque production. Il faut des matières premières, du travail et de l’énergie. Produire le millième réfrigérateur coûte à peu près autant que le premier. C’est ce qu’on appelle les \"coûts marginaux\" : le coût de production d’une unité supplémentaire d’un bien.\n\nUn produit d’information, un film, un programme, une chanson, un article, ne coûte de l’argent qu’une seule fois : au moment de sa création. Écrire la première copie de ce livre a demandé des mois de travail. Écrire la deuxième copie coûte zéro. Copier un fichier. Les coûts marginaux de l’information tendent vers zéro.\n\nCela change toute la logique économique. Si les coûts marginaux sont nuls, tu peux offrir le produit gratuitement et gagner de l’argent ailleurs. Sur l’attention. Sur les données. Sur un abonnement. Sur la publicité. C’est exactement pour cela que Google est gratuit. C’est exactement pour cela que Spotify donne accès à 100 millions de titres pour 10 euros par mois. C’est exactement pour cela que Facebook est gratuit : ce qui est monétisé, ce n’est pas le contenu, mais les données.\n\n## La loi de Metcalfe : la mathématique des gagnants\n\nRobert Metcalfe, l’un des créateurs d’Ethernet (la technologie des réseaux locaux), a formulé une loi qui explique la structure du pouvoir dans l’économie numérique : la valeur d’un réseau est proportionnelle au carré du nombre de ses participants.\n\nUn exemple simple avec les téléphones. Un téléphone dans le monde ne sert à rien ; il n’y a personne à appeler. Deux téléphones signifient une connexion, une valeur minimale. Dix téléphones signifient 45 connexions possibles. Mille téléphones signifient presque un demi-million de connexions possibles. Un million de téléphones signifient environ 500 milliards de connexions possibles. La valeur ne croît pas de façon linéaire, mais exponentielle.\n\nPour les plateformes, cela signifie : la première plateforme à atteindre une masse critique devient presque imbattable. Pas parce qu’elle est la meilleure. Mais parce que tout le monde est là, et cela la rend plus précieuse pour chaque utilisateur.\n\nFacebook, avec deux milliards d’utilisateurs, est objectivement plus précieux qu’une alternative avec un million, parce qu’il y a davantage de tes connaissances réelles. Google est plus précieux qu’un moteur de recherche alternatif parce qu’un plus grand volume de requêtes rend l’algorithme plus précis. Amazon est plus précieux qu’un petit magasin : plus de vendeurs attirent plus d’acheteurs, plus d’acheteurs attirent plus de vendeurs.\n\nVarian et Shapiro ont aussi décrit le mécanisme du lock-in, l’enfermement. Quand tu as investi du temps, des données et des habitudes dans une plateforme, passer à une autre devient douloureux. Tes photos sur Instagram, tes contacts sur WhatsApp, ton historique sur YouTube : ce ne sont pas seulement des données. C’est une barrière de sortie que les plateformes créent délibérément.\n\nMicrosoft retenait ses clients entreprises grâce à la compatibilité des formats Office. Apple retient ses utilisateurs grâce à son écosystème d’appareils. Google les retient grâce à l’historique de recherche et au mail. Plus tu utilises une plateforme longtemps, plus il est coûteux d’en partir.\n\n> La loi de Metcalfe et les coûts marginaux nuls expliquent ensemble les monopoles de Web2 : le premier à atteindre une masse critique gagne pour toujours, parce que la valeur du réseau croît plus vite que n’importe quel concurrent ne peut le rattraper.\n\nDans l’économie crypto, cette loi fonctionne dans les deux sens. Une blockchain dotée d’une vaste communauté de développeurs, d’utilisateurs et de liquidité vaut exponentiellement plus qu’une petite. Mais les protocoles ouverts changent la règle : si le réseau est décentralisé, sa valeur appartient aux participants, et non aux actionnaires d’une seule entreprise.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["économie", "effets de réseau", "plateformes", "tokenomics"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "trap", "sceneIndex": 2, "type": "power", "shortTitle": "Piège des créateurs", "era": "Web2", "lensWeight": {"chronology": 2, "attention": 3, "creators": 5, "networks": 3, "ownership": 3}, "title": "Le piège des créateurs : pourquoi le contenu ne rapporte pas d'argent", "insight": "Peress a montré que le piège n'est pas la qualité du contenu. Le vrai produit, c'est la communauté, pas le contenu. Les plateformes ont gagné en construisant l'infrastructure des liens. Web3 la rend aux créateurs.", "thesis": "Peress a montré que le piège n'est pas la qualité du contenu. Le vrai produit, c'est la communauté, pas le contenu. Les plateformes ont gagné en construisant l'infrastructure des liens. Web3 la rend aux créateurs.", "body": "## Le paradoxe de l'abondance\n\nEn 1998, Kevin Kelly a formulé un paradoxe devenu une malédiction pour des millions de créateurs de contenu: dans un monde d'abondance d'information, la valeur de l'information elle-même tend vers zéro.\n\nLa logique est implacable. Quand l'information était rare, on payait pour l'obtenir. Les livres coûtaient cher parce qu'il y en avait peu et qu'ils étaient coûteux à produire. Un album de musique coûtait quinze dollars parce qu'il fallait fabriquer, emballer et livrer un CD physique. Un article d'expert avait de la valeur parce que l'accès à cet expert était rare.\n\nInternet a détruit cette rareté. Désormais, n'importe qui peut publier n'importe quoi. N'importe qui peut sortir un album, mettre un film en ligne, écrire un article. L'offre de contenu est infinie. Et une offre infinie avec une demande finie signifie une seule chose: le prix tend vers zéro.\n\nUn journaliste écrit des titres racoleurs non pas parce qu'il le veut, mais parce que l'algorithme récompense exactement cela. Un musicien publie une suite infinie de singles au lieu d'albums parce que Spotify paie les écoutes, pas la qualité. Un artiste adapte son style à l'algorithme d'Instagram parce que sinon personne ne le verra. Le système déforme la créativité non par mauvaise intention, mais par les incitations.\n\n## Peress: ton produit n'est pas le contenu\n\nDans \"The Content Trap\", David Peress a posé le bon diagnostic: les créateurs perdent face aux plateformes non pas parce que leur contenu est mauvais. Ils perdent parce qu'ils comprennent mal ce qu'ils créent exactement.\n\nPeress a étudié l'industrie des médias et a trouvé un schéma: les entreprises qui pensaient que leur produit était le contenu perdaient. Celles qui comprenaient que leur produit était la communauté autour du contenu gagnaient.\n\nThe New York Times n'est pas un journal. C'est une communauté de personnes qui font confiance à The New York Times et y reviennent chaque jour. Quand cette communauté existe, la monétisation est possible via les abonnements, les événements et les projets spéciaux. Quand elle n'existe pas, vous n'êtes qu'un site parmi des millions sur internet.\n\nUn artiste n'est pas un ensemble de morceaux. C'est la relation entre l'artiste et ses auditeurs. Adele vend des albums non pas parce qu'ils sont meilleurs que les autres albums. Elle les vend parce qu'elle a une armée d'auditeurs fidèles qui ressentent avec elle un lien personnel.\n\nLes plateformes ont gagné précisément parce qu'elles ont compris cela: elles ne créaient pas de contenu, elles construisaient l'infrastructure des liens entre créateurs et publics. Facebook n'écrit pas de publications. YouTube ne tourne pas de vidéos. Mais ils contrôlent le lien entre ceux qui écrivent et ceux qui lisent. Et ils le facturent avec l'attention des utilisateurs.\n\nLa conclusion de Peress: un créateur qui veut sortir du piège doit cesser de penser au contenu et commencer à penser à la communauté. Construire des relations directes avec le public. Monétiser l'appartenance, pas les vues.\n\n> Peress l'a formulé précisément: le piège n'est pas dans la qualité du contenu. Le piège, c'est que tu crois que ton produit est le contenu. Ton produit, c'est la communauté. Les plateformes ont construit l'infrastructure des liens et en ont pris le contrôle. Web3 donne aux créateurs les outils pour reprendre ce contrôle.\n\nC'est exactement pourquoi les tokens, les NFT et les paiements directs dans Web3 ne sont pas seulement pratiques. Ce sont des outils pour monétiser directement une communauté, sans plateforme intermédiaire.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["créateurs", "communauté", "attention", "économie"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "fans", "sceneIndex": 3, "type": "privacy", "shortTitle": "1000 fans", "era": "2008→années 2020", "lensWeight": {"chronology": 3, "attention": 2, "creators": 5, "networks": 2, "ownership": 4}, "title": "Mille vrais fans : le manifeste a trouvé ses outils", "insight": "Kelly en 2008 : mille vrais fans à 100 dollars = 100k par an. Dans les années 2020, Web3 a donné les outils : tokens, NFT et paiements directs, sans frais de plateforme. Le manifeste est devenu un modèle économique.", "thesis": "Kelly en 2008 : mille vrais fans à 100 dollars = 100k par an. Dans les années 2020, Web3 a donné les outils : tokens, NFT et paiements directs, sans frais de plateforme. Le manifeste est devenu un modèle économique.", "body": "## Un essai en avance sur son temps\n\nEn 2008, Kevin Kelly a écrit un court essai, « 1,000 True Fans ». Il est devenu l’un des textes les plus cités sur l’économie des créateurs — et en 2008, c’était un beau manifeste sans outils pratiques. Dans les années 2020, c’est devenu un modèle économique qui fonctionne.\n\nSon argument est élégant : un créateur n’a pas besoin de millions d’abonnés aléatoires. Il lui faut mille vrais fans, des personnes qui achèteront tout ce qu’il crée. Le livre relié et le livre de poche. Le billet de concert et l’enregistrement du concert. L’impression limitée et l’affiche classique. L’accès à une communauté fermée et du contenu public.\n\nLe calcul est simple. Mille fans qui dépensent chacun 100 dollars par an, cela fait 100 000 dollars. C’est un revenu modeste, mais suffisant pour un créateur indépendant. Pas pour devenir millionnaire. Mais pour préserver sa liberté créative et ne pas dépendre des algorithmes.\n\nLe contraste avec le modèle des plateformes est saisissant. Sur YouTube, un million de vues peut rapporter entre 1 000 et 3 000 dollars, selon la catégorie du contenu et les caractéristiques démographiques de l’audience. Cela signifie que pour gagner 100 000 dollars par an sur YouTube, il faut environ 40 à 100 millions de vues par an. Seuls quelques-uns y ont accès.\n\nEt mille personnes qui paient 100 dollars directement ? C’est à la portée de beaucoup, s’il existe un outil de paiement direct.\n\n## Comment Web3 lui a donné des outils\n\nEn 2008, Kelly a décrit l’idée, mais il ne pouvait pas décrire le mécanisme. Comment trouver ce millier ? Comment recevoir de l’argent directement, sans banque intermédiaire et sans plateforme de paiement qui prend 30 % ? Comment maintenir la relation avec les gens quand un algorithme décide qui voit quoi ?\n\nWeb3 a donné les réponses.\n\nLes tokens permettent à un fan de devenir copropriétaire du projet. Pas seulement un acheteur, mais un participant. Un soutien précoce qui a acheté des tokens avant la reconnaissance massive profite avec la croissance du projet. Cela aligne les intérêts : le créateur est intéressé par la croissance, et le fan aussi. Tous deux gagnent avec le succès.\n\nNFT — Non-Fungible Tokens — offrent des actifs numériques uniques. Un créateur vend une série limitée d’œuvres directement aux collectionneurs. Sans galerie qui prend 50 %. Sans plateforme qui récupère les données des acheteurs. Et un smart contract verse automatiquement des royalties au créateur à chaque revente ultérieure, même dix ans plus tard. C’est impossible dans le monde traditionnel : un artiste vend une peinture et ne reçoit plus rien, quelle que soit la hausse de sa valeur. Dans Web3, il reçoit un pourcentage de chaque transaction pour toujours.\n\nLes paiements directs via blockchain, sans les frais de Stripe (2,9 %), sans les frais de PayPal (3 à 5 %), sans les frais de l’App Store (30 %). Un portefeuille TON permet de recevoir un paiement avec des frais de l’ordre de fractions de centime. Pour un créateur avec mille fans qui paient directement, cela signifie qu’il reçoit presque tout.\n\nLi Jin, dans « The Passion Economy », a décrit un changement plus large : de « l’économie des plateformes », où les créateurs dépendent des décisions algorithmiques de la plateforme, à « l’économie de la passion », où la profondeur compte plus que l’étendue. Cent personnes qui paient mille dollars par an pour un accès unique à toi, c’est mieux qu’un million de spectateurs aléatoires dont tu ne reçois rien.\n\n> Kelly a écrit le manifeste en 2008. Web3 a donné les outils pour le mettre en œuvre dans les années 2020. Mille vrais fans plus des tokens, des NFT et des paiements directs, c’est un modèle économique viable pour un créateur indépendant.\n\nCela n’abolit pas complètement les plateformes. Mais cela change l’équilibre des forces : le créateur ne dépend plus entièrement des décisions algorithmiques de l’entreprise de quelqu’un d’autre. Il dispose d’une voie alternative vers l’audience et la monétisation.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["créateurs", "tokenomics", "NFT", "économie de la passion"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "longtail", "sceneIndex": 4, "type": "media", "shortTitle": "Longue traîne", "era": "2004", "lensWeight": {"chronology": 3, "attention": 2, "creators": 4, "networks": 4, "ownership": 3}, "title": "La longue traîne : l’économie des niches", "insight": "La longue traîne : dans le monde numérique, l’espace pour les créateurs de niche est infini. Web2 plaçait encore un algorithme entre eux et l’audience. Web3 construit des canaux directs sans gardien.", "thesis": "La longue traîne : dans le monde numérique, l’espace pour les créateurs de niche est infini. Web2 plaçait encore un algorithme entre eux et l’audience. Web3 construit des canaux directs sans gardien.", "body": "## La fin de la dictature des hits\n\nL’économie numérique a changé la structure des marchés, et on peut le comprendre par une analogie simple.\n\nImagine un magasin de musique dans les années 1990. L’espace y est limité: mille ou deux mille mètres carrés, un nombre limité d’étagères. Qu’est-ce qu’il met en avant? Des hits. Des albums qui se vendent à des milliers d’exemplaires par semaine. Parce que l’espace en rayon est une ressource rare. Les artistes de niche écoutés par cent personnes dans tout le pays n’y ont pas accès. Il n’est pas rentable pour le magasin de garder un album qui vend un exemplaire par mois.\n\nMaintenant Spotify. Il n’a pas d’étagères physiques. Stocker un million de titres supplémentaires ne coûte pratiquement rien: ce sont des données numériques. Spotify peut donc proposer 100 millions de titres en même temps. Y compris ceux écoutés par cent personnes dans le monde entier.\n\nC’est la longue traîne, un concept décrit par Chris Anderson dans son livre de 2006. Sur la courbe de popularité, il y a la « tête » — quelques superhits avec une audience énorme. Et il y a la « traîne » — une infinité de produits de niche avec une audience petite mais bien réelle. Dans le monde physique, la « tête » domine: seuls les hits arrivent en rayon. Dans le monde numérique, la « traîne » est infinie, et l’audience cumulée des produits de niche peut dépasser celle des hits.\n\n## Ce que cela signifie pour les créateurs\n\nAnderson a mené une étude pour Amazon et Netflix, et il a constaté qu’une part importante de leurs revenus ne vient pas des best-sellers, mais de millions de produits de niche, dont chacun se vend rarement, mais se vend quand même.\n\nPour les créateurs, cela change fondamentalement la donne. À l’époque d’avant Internet, pour être musicien professionnel, il fallait passer à la radio, signer un contrat avec un label et atteindre des millions d’auditeurs. Un artiste de niche adoré par vingt mille personnes dans le monde ne pouvait pas bâtir une carrière là-dessus, parce que ces vingt mille personnes étaient dispersées et qu’il n’avait aucun moyen de les atteindre.\n\nInternet a changé cela: les publics de niche sont devenus repérables et accessibles. Mais Web2 a créé un nouveau problème: les algorithmes jouent en faveur de la « tête ». YouTube recommande ce qui est déjà populaire. Instagram promeut le contenu qui suscite beaucoup d’engagement. TikTok rend viral ce qui est déjà en train de devenir viral. Le créateur de niche tombe dans un piège: en théorie, son public existe, mais l’algorithme ne l’aide pas à le trouver — il est occupé à promouvoir les superhits.\n\nWeb3 peut changer cela. Si un créateur dispose d’un canal direct vers son audience — via des portefeuilles, des tokens et des protocoles décentralisés — il n’a pas besoin de lutter pour attirer l’attention de l’algorithme. Ses vingt mille vrais fans sont abonnés directement. L’algorithme n’est plus le gardien.\n\n> Anderson a montré: le monde numérique crée de la place pour un nombre infini de créateurs de niche. Web2 ne leur a pas donné d’outils — les algorithmes travaillaient contre eux. Web3 construit des canaux directs où le créateur de niche ne dépend pas du système de recommandation.\n\nCela ne signifie pas que chaque créateur de niche deviendra riche. Mais cela signifie que ceux qui créent quelque chose d’unique ont une vraie chance de trouver leur audience et de construire dessus un revenu durable, sans avoir besoin de devenir une superstar.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["créateurs", "économie", "longue traîne", "communauté"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "dao", "sceneIndex": 5, "type": "technology", "shortTitle": "DAO", "era": "Web3", "lensWeight": {"chronology": 3, "attention": 1, "creators": 3, "networks": 4, "ownership": 5}, "title": "DAO : une entreprise sans directeur", "insight": "Une DAO est une organisation en code: les tokens comme votes, les smart contracts comme exécutants. Pas de CEO capable de bloquer la décision de la majorité. Pour la première fois, une coordination sans gestion centralisée.", "thesis": "Une DAO est une organisation en code: les tokens comme votes, les smart contracts comme exécutants. Pas de CEO capable de bloquer la décision de la majorité. Pour la première fois, une coordination sans gestion centralisée.", "body": "## Une nouvelle forme d'organisation\n\nEn 2014, Vitalik Buterin a écrit un essai qui commençait par une question: et si l'on pouvait lancer une organisation sans personnes à la direction?\n\nCela ressemblait à de la science-fiction. Mais l'idée avait une logique implacable.\n\nUne entreprise traditionnelle est une hiérarchie. Il y a des actionnaires (propriétaires), un conseil d'administration (pilotage stratégique), une direction (pilotage opérationnel) et des employés (exécution). À chaque niveau existe un problème d'agence: une personne qui gère l'argent d'autrui a ses propres intérêts, qui peuvent ne pas coïncider avec ceux des propriétaires. Un manager peut prendre des décisions qui lui profitent à lui, et non à l'entreprise. Un directeur peut travailler pour un gros actionnaire au détriment des plus petits.\n\nButerin a proposé: et si les règles de l'organisation étaient inscrites dans un smart contract? Le code ne peut pas être corrompu. Le code ne peut pas prendre une décision en faveur d'un participant contre les autres. Le code exécute exactement ce qui est écrit en lui.\n\nC'est ainsi qu'est née la notion de DAO: Decentralized Autonomous Organization, organisation autonome décentralisée.\n\n## Comment une DAO fonctionne en pratique\n\nImaginez une organisation qui gère un protocole DeFi, par exemple un exchange décentralisé. Cette organisation n'a pas de CEO, pas de bureau, pas d'adresse juridique. Elle dispose d'un smart contract qui définit les règles, et de tokens de gouvernance: des votes numériques.\n\nChaque détenteur de tokens peut soumettre une proposition au vote. «Changeons les frais de 0.3% à 0.25%.» «Ajoutons la prise en charge d'un nouvel actif.» «Affectons 10% des revenus du protocole à un fonds de réserve.» Les détenteurs de tokens votent. Si une proposition obtient suffisamment de voix, le smart contract l'exécute automatiquement. Aucun CEO ne peut la bloquer. Aucun conseil d'administration ne peut revenir sur la décision. Le code fait loi.\n\nLa première grande DAO, The DAO, a été lancée en 2016 sur Ethereum et a levé 150 millions de dollars auprès des participants. Quelques semaines plus tard, un hacker a trouvé une vulnérabilité dans le code et a retiré un tiers des fonds. Ce fut une leçon douloureuse: une DAO n'est fiable qu'à la hauteur de son code. Une erreur dans un smart contract n'est pas un facteur humain que l'on peut corriger. C'est une mathématique exécutée littéralement.\n\nMais l'idée a survécu. Dans les années 2020, les DAOs gèrent des milliards de dollars dans des protocoles DeFi. Uniswap est gouverné par une DAO, où les détenteurs du token UNI votent les changements du protocole. MakerDAO gouverne le stablecoin DAI par le vote des détenteurs de MKR. Ce sont des organisations qui fonctionnent avec de l'argent réel, sans structure d'entreprise traditionnelle.\n\nRakesh Agrawal, dans \"The Tokenized Economy\", décrit une signification plus profonde des tokens dans ce contexte. Un token de DAO n'est pas seulement un droit de vote. C'est un alignement des intérêts. Si le protocole se développe et prend de la valeur, les tokens prennent de la valeur pour tout le monde: développeurs, utilisateurs et investisseurs. Tout le monde a intérêt à la croissance en même temps. Dans une entreprise traditionnelle, y parvenir est pratiquement impossible: les intérêts des actionnaires et des utilisateurs sont structurellement opposés.\n\n> Une DAO n'est pas une organisation parfaite. C'est une organisation différente: avec d'autres compromis, d'autres risques, d'autres possibilités. L'essentiel: pour la première fois, il existe une possibilité technique de coordonner des personnes autour d'un objectif commun sans gestion centralisée.\n\nPour les créateurs, les communautés et les petites entreprises, cela ouvre des possibilités intéressantes: propriété collective, gouvernance transparente, distribution automatique des revenus. Tout cela sans cabinets juridiques, sans banques et
