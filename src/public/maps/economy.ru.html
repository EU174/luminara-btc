тель, который хочет вырваться из ловушки, должен перестать думать о контенте и начать думать о сообществе. Строить прямые отношения с аудиторией. Монетизировать принадлежность, а не просмотры.\n\n> Пересс сформулировал точно: ловушка не в качестве контента. Ловушка в том, что ты думаешь, будто твой продукт — контент. Твой продукт — это сообщество. Платформы построили инфраструктуру связей и взяли её под контроль. Web3 даёт инструменты, чтобы вернуть этот контроль создателю.\n\nИменно поэтому токены, NFT и прямые платежи в Web3 — это не просто удобство. Это инструменты для монетизации сообщества напрямую, без платформы-посредника.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["creators", "community", "attention", "economics"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "fans", "sceneIndex": 3, "type": "privacy", "shortTitle": "1000 фанатов", "era": "2008→2020-е", "lensWeight": {"chronology": 3, "attention": 2, "creators": 5, "networks": 2, "ownership": 4}, "title": "Тысяча истинных фанатов: манифест получил инструменты", "insight": "Келли в 2008-м: тысяча истинных фанатов по $100 = $100k в год. В 2020-х Web3 дал инструменты: токены, NFT, прямые платежи — без платформенных комиссий. Манифест стал бизнес-моделью.", "thesis": "Келли в 2008-м: тысяча истинных фанатов по $100 = $100k в год. В 2020-х Web3 дал инструменты: токены, NFT, прямые платежи — без платформенных комиссий. Манифест стал бизнес-моделью.", "body": "## Эссе, опередившее время\n\nВ 2008 году Кевин Келли написал короткое эссе «1,000 True Fans». Оно стало одним из самых цитируемых текстов о творческой экономике — и в 2008-м это был красивый манифест без практических инструментов. В 2020-х это стало рабочей бизнес-моделью.\n\nЕго аргумент элегантен: творцу не нужны миллионы случайных подписчиков. Нужна тысяча истинных фанатов — людей, которые купят всё, что ты создашь. Книгу в твёрдой обложке и в мягкой. Билет на концерт и запись с концерта. Лимитированный принт и обычный постер. Доступ к закрытому сообществу и публичный контент.\n\nМатематика простая. Тысяча фанатов, каждый из которых тратит 100 долларов в год — это 100 000 долларов. Это скромный, но достаточный доход для независимого творца. Не стать миллионером. Но сохранить творческую свободу и не зависеть от алгоритмов.\n\nКонтраст с платформенной моделью разителен. На YouTube с миллионом просмотров можно заработать от 1 000 до 3 000 долларов — в зависимости от категории контента и демографии аудитории. Это значит: чтобы зарабатывать 100 000 долларов в год на YouTube, нужно около 40–100 миллионов просмотров в год. Это доступно единицам.\n\nА тысяча человек, платящих по 100 долларов напрямую? Это доступно многим — если есть инструмент для прямых платежей.\n\n## Как Web3 дал этому инструменты\n\nВ 2008 году Келли описал идею — но не мог описать механизм. Как найти эту тысячу? Как получить деньги напрямую без банка-посредника и без платёжной платформы, берущей 30%? Как удержать отношения с людьми, когда алгоритм решает, кто что видит?\n\nWeb3 дал ответы.\n\nТокены позволяют фанату стать совладельцем проекта. Не просто покупателем — участником. Ранний поддерживатель, купивший токены до широкого признания, выигрывает вместе с ростом проекта. Это выравнивает интересы: создатель заинтересован в росте, фан — тоже. Оба выигрывают от успеха.\n\nNFT — Non-Fungible Tokens — дают уникальные цифровые активы. Создатель продаёт ограниченную серию работ напрямую коллекционерам. Без галереи, берущей 50%. Без платформы, забирающей данные о покупателях. И смарт-контракт автоматически платит создателю роялти при каждой последующей перепродаже — даже через десять лет. Это невозможно в традиционном мире: художник продал картину и больше не получает ничего, сколько бы она ни росла в цене. В Web3 — получает процент при каждой сделке навсегда.\n\nПрямые платежи через блокчейн — без комиссии Stripe (2,9%), без комиссии PayPal (3–5%), без комиссии App Store (30%). TON-кошелёк позволяет получить платёж с комиссией в доли цента. Для создателя с тысячей фанатов, платящих напрямую, это означает: он получает почти всё.\n\nЛи Джин в «The Passion Economy» описала более широкий сдвиг: от «экономики платформ», где создатели зависят от алгоритмических решений платформы, к «экономике страсти», где глубина важнее ширины. Сто человек, платящих по тысяче долларов в год за уникальный доступ к тебе, — лучше, чем миллион случайных зрителей, от которых ты не получаешь ничего.\n\n> Келли написал манифест в 2008-м. Web3 дал инструменты для его реализации в 2020-х. Тысяча истинных фанатов плюс токены, NFT и прямые платежи — это работающая бизнес-модель для независимого творца.\n\nЭто не отменяет платформы полностью. Но меняет баланс сил: создатель больше не полностью зависит от алгоритмических решений чужой компании. У него есть альтернативный путь к аудитории и к монетизации.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["creators", "tokenomics", "nft", "passion-economy"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "longtail", "sceneIndex": 4, "type": "media", "shortTitle": "Длинный хвост", "era": "2004", "lensWeight": {"chronology": 3, "attention": 2, "creators": 4, "networks": 4, "ownership": 3}, "title": "Длинный хвост: экономика ниш", "insight": "Длинный хвост: в цифровом мире место для нишевых создателей бесконечно. Web2 всё равно ставил алгоритм между ними и аудиторией. Web3 строит прямые каналы без привратника.", "thesis": "Длинный хвост: в цифровом мире место для нишевых создателей бесконечно. Web2 всё равно ставил алгоритм между ними и аудиторией. Web3 строит прямые каналы без привратника.", "body": "## Конец диктатуры хитов\n\nЦифровая экономика изменила структуру рынков — и понять это можно через простую аналогию.\n\nПредставь музыкальный магазин 1990-х. У него ограниченная площадь: тысяча-две квадратных метров, ограниченное количество полок. Что он выставляет? Хиты. Альбомы, которые продаются тысячами копий в неделю. Потому что полочное пространство — дефицитный ресурс. Нишевые исполнители, которых слушают сто человек во всей стране, туда не попадают. Магазину невыгодно держать альбом, который продаётся одна копия в месяц.\n\nТеперь Spotify. У него нет физических полок. Хранение ещё одного миллиона треков практически ничего не стоит — цифровые данные. Поэтому Spotify может предлагать 100 миллионов треков одновременно. Включая тех, кого слушают сто человек во всём мире.\n\nЭто и есть длинный хвост — концепция, описанная Крисом Андерсоном в книге 2006 года. На кривой популярности есть «голова» — несколько суперхитов с огромной аудиторией. И есть «хвост» — бесконечное множество нишевых продуктов с маленькой, но существующей аудиторией. В физическом мире «голова» доминирует: только хиты попадают на полки. В цифровом мире «хвост» бесконечен — и совокупная аудитория нишевых продуктов может превышать аудиторию хитов.\n\n## Что это означает для творцов\n\nАндерсон провёл исследование для Amazon и Netflix — и обнаружил: значительная часть их выручки приходит не от бестселлеров, а от миллионов нишевых продуктов, каждый из которых продаётся редко, но всё же продаётся.\n\nДля создателей это фундаментально меняет расклад. В эпоху до интернета, чтобы быть профессиональным музыкантом, нужно было попасть на радио, получить контракт с лейблом, добраться до миллионов слушателей. Нишевый исполнитель, которого обожают двадцать тысяч человек по всему миру, не мог построить на этом карьеру — потому что эти двадцать тысяч были разбросаны и у него не было способа до них добраться.\n\nИнтернет это изменил: нишевые аудитории стали найдёнными и достижимыми. Но Web2 создал новую проблему: алгоритмы работают в пользу «головы». YouTube рекомендует то, что уже популярно. Instagram продвигает контент с высоким вовлечением. TikTok вирусит то, что вирусит. Нишевый создатель попадает в ловушку: теоретически его аудитория существует, но алгоритм не помогает её найти — он занят продвижением суперхитов.\n\nWeb3 может изменить это. Если у создателя есть прямой канал к аудитории — через кошельки, через токены, через децентрализованные протоколы — ему не нужно конкурировать за алгоритмическое внимание. Его двадцать тысяч истинных поклонников подписаны напрямую. Алгоритм больше не привратник.\n\n> Андерсон показал: цифровой мир создаёт место для бесконечного числа нишевых создателей. Web2 не дал им инструментов — алгоритмы работали против них. Web3 строит прямые каналы, где нишевый создатель не зависит от рекомендательной системы.\n\nЭто не значит, что каждый нишевый создатель разбогатеет. Но это означает: у тех, кто создаёт уникальное, есть реальный шанс найти свою аудиторию и построить на ней устойчивый доход — без необходимости становиться суперзвездой.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["creators", "economics", "long-tail", "community"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "dao", "sceneIndex": 5, "type": "technology", "shortTitle": "DAO", "era": "Web3", "lensWeight": {"chronology": 3, "attention": 1, "creators": 3, "networks": 4, "ownership": 5}, "title": "DAO: компания без директора", "insight": "DAO — организация в коде: токены как голоса, смарт-контракты как исполнители. Никакого CEO, который может заблокировать решение большинства. Впервые — координация без централизованного управления.", "thesis": "DAO — организация в коде: токены как голоса, смарт-контракты как исполнители. Никакого CEO, который может заблокировать решение большинства. Впервые — координация без централизованного управления.", "body": "## Новая форма организации\n\nВиталик Бутерин в 2014 году написал эссе, которое начиналось с вопроса: а что, если организацию можно запустить без людей в управлении?\n\nЭто звучало как фантастика. Но у идеи была железная логика.\n\nТрадиционная компания — это иерархия. Есть акционеры (владельцы), есть совет директоров (стратегическое управление), есть менеджмент (оперативное управление), есть сотрудники (исполнение). На каждом уровне — агентская проблема: у человека, управляющего чужими деньгами, есть собственные интересы, которые могут не совпадать с интересами владельцев. Менеджер может принимать решения, выгодные ему, а не компании. Директор может работать на крупного акционера в ущерб мелким.\n\nБутерин предложил: а что, если правила организации записать в смарт-контракт? Код не может быть подкуплен. Код не может принять решение в пользу одного участника против других. Код исполняет ровно то, что в нём написано.\n\nТак родилась концепция DAO — Decentralized Autonomous Organization, децентрализованная автономная организация.\n\n## Как работает DAO на практике\n\nПредставь организацию, управляющую DeFi-протоколом — например, децентрализованной биржей. У этой организации нет CEO, нет офиса, нет юридического адреса. Есть смарт-контракт, определяющий правила, и есть токены управления — цифровые голоса.\n\nКаждый держатель токена может вынести предложение на голосование. «Изменим комиссию с 0.3% до 0.25%». «Добавим поддержку нового актива». «Направим 10% доходов протокола в резервный фонд». Держатели токенов голосуют. Если предложение набирает достаточно голосов — смарт-контракт автоматически исполняет его. Никакого CEO, который может заблокировать. Никакого совета директоров, который может переиграть решение. Код — закон.\n\nПервый крупный DAO — The DAO — был запущен в 2016 году на Ethereum и собрал 150 миллионов долларов от участников. Через несколько недель хакер нашёл уязвимость в коде и вывел треть средств. Это был болезненный урок: DAO работает ровно настолько надёжно, насколько надёжен код. Ошибка в смарт-контракте — это не человеческий фактор, который можно исправить. Это математика, которая исполняется буквально.\n\nНо идея выжила. К 2020-м DAO управляют миллиардами долларов в DeFi-протоколах. Uniswap управляется через DAO, где держатели токена UNI голосуют за изменения протокола. MakerDAO управляет стейблкоином DAI через голосование держателей MKR. Это работающие организации с реальными деньгами — без традиционной корпоративной структуры.\n\nРакеш Агравал в «The Tokenized Economy» описывает более глубокое значение токенов в этом контексте. Токен DAO — это не просто право голоса. Это выравнивание интересов. Если протокол растёт и становится ценнее — токены дорожают для всех: и для разработчиков, и для пользователей, и для инвесторов. Все заинтересованы в росте одновременно. В традиционной компании этого добиться практически невозможно: интересы акционеров и пользователей структурно противоположны.\n\n> DAO — это не идеальная организация. Это другая организация: с другими компромиссами, другими рисками, другими возможностями. Главное: впервые появилась техническая возможность координировать людей вокруг общей цели без централизованного управления.\n\nДля творцов, сообществ и малого бизнеса это открывает интересные возможности: коллективное владение, прозрачное управление, автоматическое распределение доходов. Всё это без юридических фирм, без банков и без CEO, принимающего решения единолично.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["dao", "tokenomics", "governance", "defi"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "value", "sceneIndex": 6, "type": "economy", "shortTitle": "Ценность в сетях", "era": "→протоколы", "lensWeight": {"chronology": 4, "attention": 2, "creators": 3, "networks": 5, "ownership": 5}, "title": "Ценность создаётся в сетях: от заводов к протоколам", "insight": "Крупнейшие компании мира не владеют физическими активами — они владеют инфраструктурой связей. Web3 идёт дальше: что если эта инфраструктура будет принадлежать самим участникам?", "thesis": "Крупнейшие компании мира не владеют физическими активами — они владеют инфраструктурой связей. Web3 идёт дальше: что если эта инфраструктура будет принадлежать самим участникам?", "body": "## Крупнейшие компании мира не владеют ничем физическим\n\nКевин Келли в 1998 году написал что-то, что тогда звучало провокационно: в новой экономике ценность создаётся не в производстве, а в связях.\n\nПосмотри на 2024 год — и поймёшь, что он был прав.\n\nUber — крупнейшая в мире служба такси. Не владеет ни одним автомобилем. Airbnb — крупнейшая в мире гостиничная компания. Не владеет ни одним номером. Facebook — крупнейшее в мире медиа. Не производит ни одной единицы контента. Alibaba — крупнейший в Китае розничный продавец. Не держит никаких товаров на складах.\n\nЧто у них есть? Инфраструктура связей. Uber соединяет водителей и пассажиров. Airbnb соединяет хозяев и гостей. Facebook соединяет людей между собой. Alibaba соединяет продавцов и покупателей. Ценность — в самом факте соединения, а не в физических активах.\n\nЭто фундаментальный сдвиг от индустриальной логики к сетевой. В индустриальной экономике ценность = ресурсы + труд + капитал. Чтобы создать ценность, нужно владеть средствами производства. В сетевой экономике ценность = связи × участники². Чтобы создать ценность, нужно организовать взаимодействие между людьми.\n\n## Web3: а что, если сеть принадлежит участникам?\n\nNo это поднимает следующий вопрос — и именно здесь Web3 предлагает радикально новый ответ.\n\nUber создаёт ценность через соединение водителей и пассажиров. Водители создают эту ценность своим трудом. Но Uber принадлежит акционерам — а не водителям. Водители получают плату за поездку. Они не получают долю в росте стоимости сети, которую создают своим трудом.\n\nА что, если бы протокол, соединяющий водителей и пассажиров, управлялся DAO? Водители получали бы токены пропорционально своему вкладу. По мере роста сети — токены дорожали бы. Водитель, который участвовал в создании сети с первых дней, выигрывал бы от её роста — как ранний сотрудник стартапа, получивший опционы.\n\nЭта идея уже реализована в DeFi. Uniswap — децентрализованная биржа — распределяет комиссии от торгов между провайдерами ликвидности, которые внесли активы в пулы. Compound распределяет токены управления среди пользователей, которые используют протокол. Это не утопия. Это работающая модель с миллиардами долларов в управлении.\n\nДжаред Ларни в эссе «Own the Internet» сформулировал концепцию point-blank: следующий этап интернета — это интернет, часть которого ты можешь купить. Не просто использовать. Владеть. Получать доход от роста. Голосовать за изменения.\n\nПереход от «пользователь как продукт» к «пользователь как совладелец» — это не просто технологический сдвиг. Это политический. Вопрос о том, кому принадлежит ценность, созданная сетью, — это вопрос о распределении власти в обществе.\n\n> Келли в 1998-м: ценность создаётся в связях, а не в производстве. Ларни в 2021-м: а что, если участники сети будут ею владеть? Вместе они описывают переход от «ценность у платформы» к «ценность у участников».\n\nЭто происходит прямо сейчас — в экспериментальном масштабе. Блокчейны с миллиардами долларов TVL (Total Value Locked — общей заблокированной стоимостью), DAO с тысячами участников, создатели с NFT-сообществами. Не все эксперименты удались. Многие провалились. Но принцип работает — и это меняет всё.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["economics", "networks", "tokenomics", "value"], "x": 265.5, "y": 258.0, "angDeg": 218.6}], "edges": [{"from": "wu", "to": "rules", "label": "внимание подчиняется правилам сети", "lenses": ["attention", "networks"]}, {"from": "rules", "to": "trap", "label": "монополии ловят создателей", "lenses": ["networks", "creators"]}, {"from": "trap", "to": "fans", "label": "выход — прямая связь с фанатами", "lenses": ["creators", "ownership"]}, {"from": "fans", "to": "longtail", "label": "нишам хватает места", "lenses": ["creators", "networks"]}, {"from": "longtail", "to": "value", "label": "хвост питает сети", "lenses": ["networks", "chronology"]}, {"from": "trap", "to": "dao", "label": "инфраструктуру — создателям", "lenses": ["creators", "ownership"]}, {"from": "dao", "to": "value", "label": "участники владеют сетью", "lenses": ["ownership", "networks"]}, {"from": "wu", "to": "value", "label": "от продажи внимания к владению", "lenses": ["chronology", "attention"]}, {"from": "rules", "to": "value", "label": "протоколы меняют правило", "lenses": ["networks", "ownership"]}, {"from": "fans", "to": "dao", "label": "токены как инструмент", "lenses": ["ownership", "creators"]}]}, "en": {"chapter": {"key": "economy", "title": "Creator economy", "lede": "Value is born in networks, and the key question is who owns it.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=economy", "centralIdea": "Value is in the network, and the question is who owns it", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Chronology", "accent": "#7dd3fc", "description": "From Tim Wu’s newspapers to Web3 protocols: two hundred years of selling attention."}, {"id": "attention", "label": "Attention", "accent": "#fbbf24", "description": "Tim Wu: selling attention as a model that Web2 brought to $600 billion a year."}, {"id": "creators", "label": "Creators", "accent": "#c084fc", "description": "The content trap, a thousand true fans, and the long-tail economy."}, {"id": "networks", "label": "Networks", "accent": "#34d399", "description": "Metcalfe’s law and zero costs: why the winner takes all."}, {"id": "ownership", "label": "Ownership", "accent": "#f87171", "description": "DAO and the infrastructure of connections: what if it belongs to the participants?"}], "nodes": [{"id": "wu", "sceneIndex": 0, "type": "media", "shortTitle": "Tim Wu", "era": "200 years", "lensWeight": {"chronology": 5, "attention": 5, "creators": 2, "networks": 2, "ownership": 1}, "title": "Tim Wu: the history of selling attention", "insight": "Tim Wu showed: selling attention is a two-hundred-year-old model from newspapers to TikTok. Web2 brought it to 600 billion dollars a year. The only difference is targeting precision.", "thesis": "Tim Wu showed: selling attention is a two-hundred-year-old model from newspapers to TikTok. Web2 brought it to 600 billion dollars a year. The only difference is targeting precision.", "body": "## The one-cent newspaper and the first attention deal\n\nIn 1833, American publisher Benjamin Day came up with something that changed the media business forever. He began selling the New York Sun newspaper for one cent, three to four times cheaper than its production cost. Everyone around him thought he was crazy: how can you make money by selling for less than it costs to produce?\n\nThe answer was simple and brilliant. A cheap newspaper attracted readers: working-class people who had not bought newspapers before because of the price. Many readers meant an audience. He sold the audience to advertisers. The reader paid with attention, the advertiser with money. The newspaper was not the product. It was the bait.\n\nThis was the first attention-selling deal in history. And since then, for almost two hundred years, its structure has not changed. Only the scale has changed.\n\nTim Wu, in the book \"The Attention Merchants\", traced this logic across two centuries with remarkable precision. Every new medium repeated the same pattern. Radio in the 1920s: free content attracts listeners, listeners are sold to advertisers. Television in the 1950s: the same pattern, but with moving images and broader reach. Cable TV: the same pattern, but with a subscription. The Web1 internet: content is free, but attention is not yet monetized. Web2: attention monetization reaches industrial scale.\n\n## The great extraction: when you became the product\n\nWu calls what is happening \"the great extraction\". The media system systematically takes people's attention, the most non-renewable resource we have, and converts it into money for third parties.\n\nSpecific numbers help show the scale. The average Facebook user in 2023 spent about 35 minutes a day in the app. Facebook earned about 50 dollars a year from this user in the United States, through advertising. The user received nothing, except the service itself. The deal was one-sided.\n\nGoogle earns money on search queries: every query is a signal of intent that is sold to advertisers. You search for \"buy a sofa\" — Google sells this information to furniture stores. You do not pay with money. You pay with intent.\n\nFacebook earns money on social connections: every like is data about a psychological profile. You like certain posts, and Facebook knows your values, fears and political views. It sells this knowledge to advertisers, political campaigns and anyone willing to pay.\n\nTikTok earns money on time: every extra second in the app is money. Its algorithm is optimized for one thing: to keep you as long as possible. Not because it is good for you. Because it is good for its advertising revenue.\n\nThe total digital advertising market exceeded 600 billion dollars a year by 2023. For comparison, that is more than Sweden's GDP. This entire amount is the monetization of human attention that people give away while thinking they are using a free service.\n\nWu points to a fundamental asymmetry: people do not know the terms of the deal. Nowhere does it say, \"your attention is worth 50 dollars a year, and we sell it\". It says: \"Free. Just sign up\".\n\n> Wu showed: selling attention is not an invention of the internet. It is a two-hundred-year-old model that Web2 brought to industrial scale. The difference between a one-cent newspaper and TikTok is only in targeting precision and market size.\n\nThis understanding changes how you look at \"free\" services. Nothing is free. The only question is whether you understand what you are paying with. The new economy that Web3 is building is trying to change this deal: to make it explicit, fair and mutual.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["attention", "economics", "media", "Web2"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "rules", "sceneIndex": 1, "type": "economy", "shortTitle": "Information Rules", "era": "Metcalfe’s law", "lensWeight": {"chronology": 3, "attention": 2, "creators": 2, "networks": 5, "ownership": 3}, "title": "Information Rules: why the winner takes all", "insight": "Zero marginal costs of information + Metcalfe's law = Web2 monopolies. The first to reach critical mass wins forever. Open Web3 protocols change this rule.", "thesis": "Zero marginal costs of information + Metcalfe's law = Web2 monopolies. The first to reach critical mass wins forever. Open Web3 protocols change this rule.", "body": "## Zero marginal costs: why information is special\n\nTo understand the economy of the internet, you need to understand one thing that makes information products fundamentally different. Hal Varian and Carl Shapiro described this in the book \"Information Rules\" back in 1999, and their observations have not become outdated by a single day.\n\nA physical good, a refrigerator, a car, bread, costs money every time it is produced. You need raw materials, labor and energy. Producing the thousandth refrigerator costs about as much as the first. This is called \"marginal costs\": the cost of producing one more unit of a good.\n\nAn information product, a film, a program, a song, an article, costs money once: when it is created. Writing the first copy of this book took months of work. Writing the second copy costs zero. Copy a file. The marginal costs of information tend toward zero.\n\nThis changes the entire economic logic. If marginal costs are zero, you can give the product away for free and earn money on something else. On attention. On data. On a subscription. On advertising. That is exactly why Google is free. That is exactly why Spotify gives access to 100 million tracks for 10 euros a month. That is exactly why Facebook is free: what is monetized is not content, but data.\n\n## Metcalfe's law: the mathematics of winners\n\nRobert Metcalfe, one of the creators of Ethernet (local area network technology), formulated a law that explains the structure of power in the digital economy: the value of a network is proportional to the square of the number of its participants.\n\nA simple example with telephones. One telephone in the world is useless; there is no one to call. Two telephones mean one connection, minimal value. Ten telephones mean 45 possible connections. A thousand telephones mean almost half a million possible connections. A million telephones mean about 500 billion possible connections. Value grows not linearly, but exponentially.\n\nFor platforms, this means: the first platform to reach critical mass becomes almost unbeatable. Not because it is the best. Because everyone is there, and that makes it more valuable for every user.\n\nFacebook with two billion users is objectively more valuable than an alternative with a million, because more of your real acquaintances are there. Google is more valuable than an alternative search engine because a larger volume of queries makes the algorithm more accurate. Amazon is more valuable than a small store: more sellers attract more buyers, more buyers attract more sellers.\n\nVarian and Shapiro also described the mechanism of lock-in. When you have invested time, data and habits into a platform, moving to another one becomes painful. Your photos in Instagram, your contacts in WhatsApp, your history in YouTube: these are not just data. They are an exit barrier that platforms create deliberately.\n\nMicrosoft kept corporate clients through Office format compatibility. Apple keeps users through its device ecosystem. Google keeps them through search history and mail. The longer you use a platform, the more expensive it is to leave.\n\n> Metcalfe's law and zero marginal costs together explain Web2 monopolies: the first to reach critical mass wins forever, because the value of the network grows faster than any competitor can catch up with it.\n\nIn the crypto economy, this law works both ways. A blockchain with a large audience of developers, users and liquidity is exponentially more valuable than a small one. But open protocols change the rule: if the network is decentralized, its value belongs to participants, not to shareholders of a single company.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["economics", "network effects", "platforms", "tokenomics"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "trap", "sceneIndex": 2, "type": "power", "shortTitle": "Creators’ trap", "era": "Web2", "lensWeight": {"chronology": 2, "attention": 3, "creators": 5, "networks": 3, "ownership": 3}, "title": "The creators' trap: why content does not make money", "insight": "Peress showed: the trap is not the quality of the content. The real product is the community, not the content. Platforms won by building the infrastructure of connections. Web3 returns it to creators.", "thesis": "Peress showed: the trap is not the quality of the content. The real product is the community, not the content. Platforms won by building the infrastructure of connections. Web3 returns it to creators.", "body": "## The paradox of abundance\n\nIn 1998, Kevin Kelly formulated a paradox that became a curse for millions of content creators: in a world of information abundance, the value of information itself tends toward zero.\n\nThe logic is ironclad. When information was scarce, people paid for it. Books were expensive because there were few of them and they were costly to produce. A music album cost fifteen dollars because a physical CD had to be manufactured, packaged and delivered. An expert article had value because access to an expert was rare.\n\nThe internet destroyed that scarcity. Now anyone can publish anything. Anyone can release an album, upload a film, write an article. The supply of content is infinite. And infinite supply with finite demand means one thing: the price tends toward zero.\n\nA journalist writes clickbait headlines not because they want to, but because the algorithm rewards exactly that. A musician releases endless singles instead of albums because Spotify pays for streams, not for quality. An artist adjusts their style to the Instagram algorithm because otherwise no one will see it. The system deforms creativity not through malicious intent, but through incentives.\n\n## Peress: your product is not content\n\nDavid Peress, in \"The Content Trap,\" made the right diagnosis: creators lose to platforms not because their content is bad. They lose because they misunderstand what exactly they are creating.\n\nPeress studied the media industry and found a pattern: companies that thought their product was content lost. Companies that understood that their product was the community around the content won.\n\nThe New York Times is not a newspaper. It is a community of people who trust The New York Times and come back to it every day. When that community exists, monetization is possible through subscriptions, events and special projects. When it does not, you are just one of millions of websites on the internet.\n\nAn artist is not a set of tracks. It is the relationship between the artist and their listeners. Adele sells albums not because they are better than other albums. She sells them because she has an army of devoted listeners who feel a personal connection with her.\n\nPlatforms won precisely because they understood this: they did not create content, they built the infrastructure of connections between creators and audiences. Facebook does not write posts. YouTube does not shoot videos. But they control the connection between those who write and those who read. And they charge for it with users' attention.\n\nPeress's conclusion: a creator who wants to escape the trap must stop thinking about content and start thinking about community. Build direct relationships with the audience. Monetize belonging, not views.\n\n> Peress put it precisely: the trap is not the quality of the content. The trap is that you think your product is content. Your product is the community. Platforms built the infrastructure of connections and took control of it. Web3 gives creators tools to take that control back.\n\nThat is exactly why tokens, NFT and direct payments in Web3 are not just a convenience. They are tools for monetizing a community directly, without an intermediary platform.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["creators", "community", "attention", "economics"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "fans", "sceneIndex": 3, "type": "privacy", "shortTitle": "1000 fans", "era": "2008→2020s", "lensWeight": {"chronology": 3, "attention": 2, "creators": 5, "networks": 2, "ownership": 4}, "title": "A thousand true fans: the manifesto got its tools", "insight": "Kelly in 2008: a thousand true fans at $100 = $100k a year. In the 2020s, Web3 gave the tools: tokens, NFT, direct payments, without platform fees. The manifesto became a business model.", "thesis": "Kelly in 2008: a thousand true fans at $100 = $100k a year. In the 2020s, Web3 gave the tools: tokens, NFT, direct payments, without platform fees. The manifesto became a business model.", "body": "## An essay ahead of its time\n\nIn 2008, Kevin Kelly wrote a short essay, \"1,000 True Fans.\" It became one of the most cited texts about the creator economy — and in 2008 it was a beautiful manifesto without practical tools. In the 2020s, it became a working business model.\n\nHis argument is elegant: a creator does not need millions of random subscribers. They need a thousand true fans — people who will buy everything they create. The hardcover book and the paperback. The concert ticket and the concert recording. The limited print and the regular poster. Access to a closed community and public content.\n\nThe math is simple. A thousand fans, each spending 100 dollars a year, is 100,000 dollars. That is a modest but sufficient income for an independent creator. Not to become a millionaire. But to preserve creative freedom and not depend on algorithms.\n\nThe contrast with the platform model is stark. On YouTube, a million views can earn from 1,000 to 3,000 dollars, depending on the content category and the audience demographics. This means: to earn 100,000 dollars a year on YouTube, you need about 40-100 million views a year. That is available to only a few.\n\nAnd a thousand people paying 100 dollars directly? That is available to many, if there is a tool for direct payments.\n\n## How Web3 gave it tools\n\nIn 2008, Kelly described the idea, but he could not describe the mechanism. How do you find that thousand? How do you receive money directly without an intermediary bank and without a payment platform taking 30%? How do you maintain relationships with people when an algorithm decides who sees what?\n\nWeb3 gave the answers.\n\nTokens allow a fan to become a co-owner of the project. Not just a buyer, but a participant. An early supporter who bought tokens before broad recognition wins as the project grows. This aligns interests: the creator is interested in growth, and the fan is too. Both benefit from success.\n\nNFT — Non-Fungible Tokens — provide unique digital assets. A creator sells a limited series of works directly to collectors. Without a gallery taking 50%. Without a platform taking buyer data. And a smart contract automatically pays the creator royalties on every subsequent resale, even ten years later. This is impossible in the traditional world: an artist sells a painting and never receives anything again, no matter how much it rises in price. In Web3, they receive a percentage of every transaction forever.\n\nDirect payments through blockchain — without Stripe's fee (2.9%), without PayPal's fee (3-5%), without the App Store fee (30%). A TON wallet makes it possible to receive a payment with a fee of fractions of a cent. For a creator with a thousand fans paying directly, this means they receive almost everything.\n\nLi Jin, in \"The Passion Economy,\" described a broader shift: from the \"platform economy,\" where creators depend on the platform's algorithmic decisions, to the \"passion economy,\" where depth matters more than width. One hundred people paying a thousand dollars a year for unique access to you is better than a million random viewers from whom you receive nothing.\n\n> Kelly wrote the manifesto in 2008. Web3 gave the tools to implement it in the 2020s. A thousand true fans plus tokens, NFT and direct payments is a working business model for an independent creator.\n\nThis does not abolish platforms completely. But it changes the balance of power: the creator is no longer fully dependent on the algorithmic decisions of someone else's company. They have an alternative path to the audience and to monetization.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["creators", "tokenomics", "NFT", "passion economy"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "longtail", "sceneIndex": 4, "type": "media", "shortTitle": "Long tail", "era": "2004", "lensWeight": {"chronology": 3, "attention": 2, "creators": 4, "networks": 4, "ownership": 3}, "title": "The long tail: the economy of niches", "insight": "The long tail: in the digital world, there is infinite room for niche creators. Web2 still placed an algorithm between them and the audience. Web3 builds direct channels without a gatekeeper.", "thesis": "The long tail: in the digital world, there is infinite room for niche creators. Web2 still placed an algorithm between them and the audience. Web3 builds direct channels without a gatekeeper.", "body": "## The end of the dictatorship of hits\n\nThe digital economy changed the structure of markets — and this can be understood through a simple analogy.\n\nImagine a music store in the 1990s. It has limited space: one or two thousand square meters, a limited number of shelves. What does it display? Hits. Albums that sell thousands of copies a week. Because shelf space is a scarce resource. Niche performers who are listened to by a hundred people in the whole country do not get there. It is not profitable for the store to keep an album that sells one copy a month.\n\nNow Spotify. It has no physical shelves. Storing another million tracks costs practically nothing: digital data. So Spotify can offer 100 million tracks at the same time. Including those listened to by a hundred people in the entire world.\n\nThis is the long tail, a concept described by Chris Anderson in his 2006 book. On the popularity curve there is the \"head\" — a few superhits with huge audiences. And there is the \"tail\" — an endless set of niche products with small but existing audiences. In the physical world, the \"head\" dominates: only hits get onto shelves. In the digital world, the \"tail\" is endless, and the combined audience of niche products can exceed the audience of hits.\n\n## What this means for creators\n\nAnderson conducted research for Amazon and Netflix and found that a significant part of their revenue comes not from bestsellers, but from millions of niche products, each of which sells rarely, but still sells.\n\nFor creators, this fundamentally changes the picture. In the pre-internet era, to be a professional musician, you had to get on the radio, get a contract with a label, reach millions of listeners. A niche performer adored by twenty thousand people around the world could not build a career on that, because those twenty thousand were scattered and there was no way to reach them.\n\nThe internet changed this: niche audiences became findable and reachable. But Web2 created a new problem: algorithms work in favor of the \"head.\" YouTube recommends what is already popular. Instagram promotes content with high engagement. TikTok makes viral what is already going viral. The niche creator falls into a trap: theoretically, their audience exists, but the algorithm does not help find it. It is busy promoting superhits.\n\nWeb3 can change this. If a creator has a direct channel to the audience, through wallets, tokens and decentralized protocols, they do not need to compete for algorithmic attention. Their twenty thousand true fans are subscribed directly. The algorithm is no longer the gatekeeper.\n\n> Anderson showed: the digital world creates room for an infinite number of niche creators. Web2 did not give them tools; algorithms worked against them. Web3 builds direct channels where a niche creator does not depend on a recommendation system.\n\nThis does not mean every niche creator will get rich. But it does mean that those who create something unique have a real chance to find their audience and build a sustainable income on it without needing to become a superstar.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["creators", "economics", "long tail", "community"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "dao", "sceneIndex": 5, "type": "technology", "shortTitle": "DAO", "era": "Web3", "lensWeight": {"chronology": 3, "attention": 1, "creators": 3, "networks": 4, "ownership": 5}, "title": "DAO: a company without a director", "insight": "A DAO is an organization in code: tokens as votes, smart contracts as executors. No CEO who can block the majority's decision. For the first time, coordination without centralized management.", "thesis": "A DAO is an organization in code: tokens as votes, smart contracts as executors. No CEO who can block the majority's decision. For the first time, coordination without centralized management.", "body": "## A new form of organization\n\nIn 2014, Vitalik Buterin wrote an essay that began with a question: what if an organization could be launched without people in management?\n\nIt sounded like science fiction. But the idea had iron logic.\n\nA traditional company is a hierarchy. There are shareholders (owners), a board of directors (strategic management), management (operational management), and employees (execution). At every level there is an agency problem: a person managing someone else's money has their own interests, which may not align with the owners' interests. A manager may make decisions that benefit them, not the company. A director may work for a large shareholder at the expense of smaller ones.\n\nButerin proposed: what if the organization's rules were written into a smart contract? Code cannot be bribed. Code cannot make a decision in favor of one participant against others. Code executes exactly what is written in it.\n\nThat is how the concept of a DAO was born: Decentralized Autonomous Organization.\n\n## How a DAO works in practice\n\nImagine an organization that manages a DeFi protocol, for example a decentralized exchange. This organization has no CEO, no office, no legal address. There is a smart contract that defines the rules, and there are governance tokens: digital votes.\n\nEvery token holder can put a proposal to a vote. \"Let's change the fee from 0.3% to 0.25%.\" \"Let's add support for a new asset.\" \"Let's direct 10% of the protocol's revenue into a reserve fund.\" Token holders vote. If a proposal gets enough votes, the smart contract automatically executes it. No CEO who can block it. No board of directors that can overturn the decision. Code is law.\n\nThe first major DAO, The DAO, was launched in 2016 on Ethereum and raised 150 million dollars from participants. A few weeks later, a hacker found a vulnerability in the code and withdrew a third of the funds. It was a painful lesson: a DAO is only as reliable as its code. An error in a smart contract is not a human factor that can be corrected. It is mathematics executed literally.\n\nBut the idea survived. By the 2020s, DAOs manage billions of dollars in DeFi protocols. Uniswap is governed through a DAO, where holders of the UNI token vote on protocol changes. MakerDAO governs the DAI stablecoin through voting by MKR holders. These are functioning organizations with real money, without a traditional corporate structure.\n\nRakesh Agrawal, in \"The Tokenized Economy,\" describes the deeper meaning of tokens in this context. A DAO token is not just a voting right. It is alignment of interests. If the protocol grows and becomes more valuable, the tokens rise in price for everyone: developers, users, and investors. Everyone is interested in growth at the same time. In a traditional company, achieving this is practically impossible: the interests of shareholders and users are structurally opposed.\n\n> A DAO is not a perfect organization. It is a different organization: with different compromises, different risks, different possibilities. The main thing: for the first time, there is a technical possibility to coordinate people around a shared goal without centralized management.\n\nFor creators, communities, and small businesses, this opens interesting possibilities: collective ownership, transparent governance, automatic revenue distribution. All of this without law firms, without banks, and without a CEO making decisions alone.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["DAO", "tokenomics", "governance", "DeFi"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "value", "sceneIndex": 6, "type": "economy", "shortTitle": "Value in networks", "era": "→protocols", "lensWeight": {"chronology": 4, "attention": 2, "creators": 3, "networks": 5, "ownership": 5}, "title": "Value is created in networks: from factories to protocols", "insight": "The world's largest companies do not own physical assets: they own infrastructure of connections. Web3 goes further: what if this infrastructure belongs to the participants themselves?", "thesis": "The world's largest companies do not own physical assets: they own infrastructure of connections. Web3 goes further: what if this infrastructure belongs to the participants themselves?", "body": "## The world's largest companies own nothing physical\n\nIn 1998, Kevin Kelly wrote something that sounded provocative at the time: in the new economy, value is created not in production, but in connections.\n\nLook at 2024 and you will understand that he was right.\n\nUber is the world's largest taxi service. It does not own a single car. Airbnb is the world's largest hotel company. It does not own a single room. Facebook is the world's largest media company. It does not produce a single piece of content. Alibaba is China's largest retailer. It keeps no goods in warehouses.\n\nWhat do they have? Infrastructure of connections. Uber connects drivers and passengers. Airbnb connects hosts and guests. Facebook connects people with one another. Alibaba connects sellers and buyers. The value is in the very fact of connection, not in physical assets.\n\nThis is a fundamental shift from industrial logic to network logic. In the industrial economy, value = resources + labor + capital. To create value, you need to own the means of production. In the network economy, value = connections × participants². To create value, you need to organize interaction between people.\n\n## Web3: what if the network belongs to the participants?\n\nBut this raises the next question, and this is exactly where Web3 offers a radically new answer.\n\nUber creates value by connecting drivers and passengers. Drivers create that value through their labor. But Uber belongs to shareholders, not drivers. Drivers get paid for a ride. They do not receive a share in the growth of the network's value, which they create through their labor.\n\nWhat if the protocol connecting drivers and passengers were governed by a DAO? Drivers would receive tokens in proportion to their contribution. As the network grew, the tokens would rise in price. A driver who helped build the network from the first days would benefit from its growth, like an early startup employee who received options.\n\nThis idea is already implemented in DeFi. Uniswap, a decentralized exchange, distributes trading fees among liquidity providers who contributed assets to pools. Compound distributes governance tokens among users who use the protocol. This is not a utopia. It is a working model with billions of dollars under management.\n\nJared Lanier, in the essay \"Own the Internet,\" formulated the concept point-blank: the next stage of the internet is an internet of which you can buy a part. Not just use it. Own it. Earn from its growth. Vote on changes.\n\nThe transition from \"user as product\" to \"user as co-owner\" is not just a technological shift. It is a political one. The question of who owns the value created by a network is a question of how power is distributed in society.\n\n> Kelly in 1998: value is created in connections, not in production. Lanier in 2021: what if the network's participants owned it? Together, they describe the transition from \"value with the platform\" to \"value with the participants.\"\n\nThis is happening right now, on an experimental scale. Blockchains with billions of dollars in TVL (Total Value Locked), DAOs with thousands of participants, creators with NFT communities. Not all experiments succeeded. Many failed. But the principle works, and it changes everything.", "sources": [{"title": "Кевин Келли — New Rules for the New Economy (1998)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%20New%20Rules%20for%20the%20New%20Economy%20%281998%29", "linkType": "gbooks"}, {"title": "Тим Ву — The Attention Merchants (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%20%D0%92%D1%83%20%E2%80%94%20The%20Attention%20Merchants%20%282016%29", "linkType": "gbooks"}, {"title": "Дэвид Пересс — The Content Trap (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9F%D0%B5%D1%80%D0%B5%D1%81%D1%81%20%E2%80%94%20The%20Content%20Trap%20%282016%29", "linkType": "gbooks"}, {"title": "Ракеш Агравал — The Tokenized Economy (2023)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%B0%D0%BA%D0%B5%D1%88%20%D0%90%D0%B3%D1%80%D0%B0%D0%B2%D0%B0%D0%BB%20%E2%80%94%20The%20Tokenized%20Economy%20%282023%29", "linkType": "gbooks"}, {"title": "Роберт Меткалфе — Закон Меткалфа (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A0%D0%BE%D0%B1%D0%B5%D1%80%D1%82%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B5%20%E2%80%94%20%D0%97%D0%B0%D0%BA%D0%BE%D0%BD%20%D0%9C%D0%B5%D1%82%D0%BA%D0%B0%D0%BB%D1%84%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — DAOs, DACs, DAs and More (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20DAOs%2C%20DACs%2C%20DAs%20and%20More%20%282014%29", "linkType": "gbooks"}, {"title": "Хэл Вэриан, Карл Шапиро — Information Rules (1999)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A5%D1%8D%D0%BB%20%D0%92%D1%8D%D1%80%D0%B8%D0%B0%D0%BD%2C%20%D0%9A%D0%B0%D1%80%D0%BB%20%D0%A8%D0%B0%D0%BF%D0%B8%D1%80%D0%BE%20%E2%80%94%20Information%20Rules%20%281999%29", "linkType": "gbooks"}, {"title": "Крис Андерсон — The Long Tail (2006)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%90%D0%BD%D0%B4%D0%B5%D1%80%D1%81%D0%BE%D0%BD%20%E2%80%94%20The%20Long%20Tail%20%282006%29", "linkType": "gbooks"}, {"title": "Ли Джин — The Passion Economy (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9B%D0%B8%20%D0%94%D0%B6%D0%B8%D0%BD%20%E2%80%94%20The%20Passion%20Economy%20%282019%29", "linkType": "gbooks"}, {"title": "Кевин Келли — 1,000 True Fans (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D0%B5%D0%B2%D0%B8%D0%BD%20%D0%9A%D0%B5%D0%BB%D0%BB%D0%B8%20%E2%80%94%201%2C000%20True%20Fans%20%282008%29", "linkType": "gbooks"}], "tags": ["economics", "networks", "tokenomics", "value"], "x": 265.5, "y": 258.0, "angDeg": 218.6}], "edges": [{"from": "wu", "to": "rules", "label": "attention follows the rules of the network", "lenses": ["attention", "networks"]}, {"from": "rules", "to": "trap",
