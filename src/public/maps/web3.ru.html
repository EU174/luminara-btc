B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["TON", "Telegram", "блокчейн", "масштабталу"], "x": 287.9, "y": 232.9, "angDeg": 225.0}], "edges": [{"from": "intermediary", "to": "nakamoto", "label": "мәселе делдалсыз шешілді", "lenses": ["chronology", "trust"]}, {"from": "nakamoto", "to": "buterin", "label": "тізілімнен компьютерге", "lenses": ["chronology", "programmability"]}, {"from": "buterin", "to": "defi", "label": "смарт-келісімшарттар банктерді алмастырады", "lenses": ["programmability", "access"]}, {"from": "nakamoto", "to": "keys", "label": "егемендік кілттерді талап етеді", "lenses": ["trust", "sovereignty"]}, {"from": "keys", "to": "wallets", "label": "кілттер әмиянға жасырылды", "lenses": ["sovereignty", "access"]}, {"from": "wallets", "to": "ton", "label": "криптаны хабарлама сияқты жіберу", "lenses": ["access", "chronology"]}, {"from": "keys", "to": "identity", "label": "егемен «мен» ажырамас", "lenses": ["sovereignty"]}, {"from": "buterin", "to": "identity", "label": "тұлға бағдарламаланады", "lenses": ["programmability", "sovereignty"]}, {"from": "defi", "to": "ton", "label": "банксыз 1,4 млрд үшін қолжетімділік", "lenses": ["access", "economy"]}, {"from": "intermediary", "to": "defi", "label": "институттарсыз қаржы", "lenses": ["trust", "programmability"]}, {"from": "wallets", "to": "defi", "label": "әмиян — DeFi-ге кіру", "lenses": ["access", "programmability"]}]}, "uz": {"chapter": {"key": "web3", "title": "Blockchain", "lede": "Vositachisiz ishonch — hokimiyat bilan emas, matematika bilan. Ikki marta sarflash muammosidan TONʼgacha.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=web3", "centralIdea": "Vositachisiz ishonch — matematika bilan, hokimiyat bilan emas", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Xronologiya", "accent": "#7dd3fc", "description": "Vositachi muammosidan Nakamoto va Buterin orqali TONʼgacha."}, {"id": "trust", "label": "Ishonch", "accent": "#fbbf24", "description": "Ikki marta sarflash va taqsimlangan reyestr: banksiz ishonch."}, {"id": "sovereignty", "label": "Suverenlik", "accent": "#c084fc", "description": "Self-custody, “not your keys” va suveren raqamli identifikatsiya."}, {"id": "programmability", "label": "Dasturlanuvchanlik", "accent": "#34d399", "description": "Buterin va smart-kontraktlar: blockchain universal kompyuter va DeFi sifatida."}, {"id": "access", "label": "Kirish", "accent": "#f87171", "description": "Hamyonlar va TON: mavjud infratuzilma orqali milliard kishi uchun blockchain."}], "nodes": [{"id": "intermediary", "sceneIndex": 0, "type": "power", "shortTitle": "Vositachi", "era": "muammo", "lensWeight": {"chronology": 4, "trust": 5, "sovereignty": 2, "programmability": 1, "access": 2}, "title": "Vositachi muammosi: bank bizga nima uchun kerak", "insight": "Vositachi raqamli faylni nusxalash mumkin bo‘lgani uchun mavjud — bank bir xil pul ikki marta sarflanmasligini kuzatadi. blockchain bu muammoni matematik tarzda, vositachisiz hal qiladi.", "thesis": "Vositachi raqamli faylni nusxalash mumkin bo‘lgani uchun mavjud — bank bir xil pul ikki marta sarflanmasligini kuzatadi. blockchain bu muammoni matematik tarzda, vositachisiz hal qiladi.", "body": "## Javobi ravshan bo‘lmagan oddiy savol\n\nTasavvur qil: sen boshqa mamlakatdagi do‘stingga pul yubormoqchisan. Raqamli davrda bu oddiy bo‘lishi kerakdek tuyuladi. Ilovani ochasan, summani kiritasan, tugmani bosasan. Ammo bu ko‘rinadigan soddalik ortida vositachilarning murakkab tizimi turadi.\n\nSen shunchaki “pul solingan faylni yubora” olmaysan. Chunki raqamli faylni nusxalash mumkin. Agar senda fayl ko‘rinishidagi “raqamli dollar” bo‘lganida, uni bir vaqtning o‘zida yigirma kishiga yuborib, originalini o‘zingda qoldirishing mumkin edi. Bu “double-spending problem” deb ataladi — aynan shu sababli biz pulni internet orqali matn yoki fotosurat kabi bevosita uzata olmaymiz.\n\nShuning uchun bank kerak. Bank markazlashtirilgan reyestr yuritadi: senda yuz dollar bor. Sen do‘stingga ellik yuborasan. Bank yozadi: endi senda ellik, do‘stingda esa plus ellik. Bank bir xil pul ikki marta sarflanmasligini nazorat qiladi. Uning asosiy funksiyasi ham shu.\n\nIshonch vositachisi. Sen bankka ishonasan, do‘sting bankka ishonadi — va shu tufayli siz bir-biringizga ishonasiz. Butun moliya tizimi shunday vositachilar tarmog‘i: banklar, to‘lov tizimlari, birjalar, notariuslar, regulyatorlar. Ular begona odamlar bir-biriga bevosita ishonmagani uchun mavjud.\n\n## Vositachining narxi\n\nBu tizim asrlar davomida ishladi. Ammo uning fundamental muammosi bor: vositachi hokimiyatga ega. Va u bu hokimiyatdan faqat sening manfaatlaring yo‘lida foydalanmasligi mumkin.\n\nBank hisobingni muzlatib qo‘yishi mumkin — davlat talabi bilan, qoidabuzarlik gumoni tufayli, texnik nosozlik sababli. To‘lov tizimi tranzaksiyani rad etishi mumkin — chunki qabul qiluvchi “nomaqbul” ro‘yxatda. Hukumat aktivlarni musodara qilishi mumkin — 2013-yilda Kiprda banklar depozitlarni muzlatib, ularning bir qismini hisobdan chiqargani kabi. Birja mijozlarga pullarini bermasdan yopilib ketishi mumkin — 2022-yildagi FTX kabi.\n\nBugun sen ishonadigan vositachi ertaga o‘z hokimiyatidan senga qarshi foydalanishi mumkin. U yovuz niyatli bo‘lgani uchun emas — balki uning motivlari seniki bilan mos kelmagani uchun.\n\nEric Hughes bu muammoni 1993-yildayoq “A Cypherpunk's Manifesto”da ifodalagan: ochiq jamiyatdagi maxfiylik anonim tranzaksiyalar tizimini talab qiladi. Vositachi sir saqlashga vaʼda beradigan tizimni emas — uni buzish matematik jihatdan imkonsiz bo‘lgan tizimni. Hughes texnik topshiriqni tasvirlab berdi. Yechim o‘n besh yil o‘tib paydo bo‘ldi.\n\n> Ishonch vositachisi — yovuz qahramon emas. Bu kriptografiyasiz dunyodagi arxitekturaviy zarurat. blockchain bu zaruratni olib tashlaydi — insonga bo‘lgan ishonchni matematik kafolat bilan almashtiradi.\n\nBu almashuvni tushunish — keyin sodir bo‘lgan hamma narsani tushunish kaliti. Agar ishonchni matematik tarzda ifodalash mumkin bo‘lsa, bank ham, notarius ham, regulyator ham kerak emas. Faqat code kerak.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["blokcheyn", "ishonch", "markazsizlashuv", "moliya"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "nakamoto", "sceneIndex": 1, "type": "technology", "shortTitle": "Nakamoto", "era": "2008", "lensWeight": {"chronology": 5, "trust": 5, "sovereignty": 3, "programmability": 2, "access": 2}, "title": "Nakamoto: dunyoni o'zgartirgan to'qqiz sahifa", "insight": "2008-yilda Nakamoto double-spending muammosini vositachisiz hal qildi: minglab ishtirokchilar yuritadigan taqsimlangan reestr, uni matematik jihatdan soxtalashtirib bo'lmaydi. To'qqiz sahifa moliyani o'zgartirdi.", "thesis": "2008-yilda Nakamoto double-spending muammosini vositachisiz hal qildi: minglab ishtirokchilar yuritadigan taqsimlangan reestr, uni matematik jihatdan soxtalashtirib bo'lmaydi. To'qqiz sahifa moliyani o'zgartirdi.", "body": "## 2008-yil oktabr: global inqiroz va anonim manifest\n\n2008-yil oktabr. Jahon moliyaviy inqirozining avj pallasi. Lehman Brothers endigina bankrot bo'lgan. Hukumatlar banklarni soliq to'lovchilar puli bilan shoshilinch qutqarmoqda. Moliyaviy tizimga ishonch tarixiy minimumda.\n\nAynan shu paytda kriptograflarning kichik hamjamiyati pochta ro'yxatiga xat keladi. Jo'natuvchi - Satoshi Nakamoto nomi ostidagi kimsa. Hech qanday affiliatsiya, hech qanday institut, hech qanday haqiqiy ism yo'q. Xatda hujjatga havola bor: \"Bitcoin: A Peer-to-Peer Electronic Cash System\". To'qqiz sahifa.\n\nBu Eric Hughes savoliga javob edi - matematika asosida qurilgan anonim tranzaksiyalar tizimi. Nakamoto double-spending muammosiga markaziy vositachisiz yechim taklif qildi.\n\nMantiq nafis. Reestrni bitta bank yuritishining o'rniga, uni minglab ishtirokchilar bir vaqtning o'zida yuritsin. Har bir tranzaksiya tarmoqning barcha ishtirokchilariga uzatiladi. Ular tranzaksiyalarni bloklarga yig'adi, har bir blok esa avvalgisi bilan matematik bog'langan - shundan \"blok-zanjir\", blockchain. Tarixni o'zgartirish imkonsiz: buning uchun butun blockchain-ni minglab ishtirokchilar yangi bloklar qo'shayotganidan tezroq qayta hisoblash kerak bo'lardi. Bu tarmoqning qolgan hamma qismi birgalikdagi quvvatidan ham ko'proq hisoblash quvvatini talab qiladi.\n\n## Ilgari birga mavjud bo'lmagan uch xususiyat\n\nAndreas Antonopoulos *Mastering Bitcoin*da tushuntiradi: Bitcoin-ning inqilobiyligi har bir alohida elementda emas - barcha komponentlar oldin ham mavjud edi. Inqilobiylik ularning kombinatsiyasida: u ilgari bir vaqtning o'zida mavjud bo'lmagan uch xususiyatni yaratadi.\n\nMarkazsizlashuv. Yagona server yo'q, ishdan chiqish yoki nazoratning yagona nuqtasi yo'q. Hibsga olish mumkin bo'lgan Bitcoin CEO-si yo'q. O'chirib qo'yish mumkin bo'lgan Bitcoin serveri yo'q. Hech bo'lmaganda bitta node ishlab tursa, tarmoq ishlaydi.\n\nShaffoflik. Barcha tranzaksiyalar hammaga ko'rinadi. Tarix o'zgarmas. Sen Bitcoin tarmog'ida qachonlardir sodir bo'lgan istalgan tranzaksiyani tekshira olasan - 2009-yil yanvardagi birinchi blokdan boshlab.\n\nRuxsatsizlik. Hech kim senga tarmoqda ishtirok etishni taqiqlay olmaydi. KYCdan o'tish kerak emas, bank ruxsati kerak emas, ma'lum bir mamlakatda ro'yxatdan o'tish kerak emas. Hamyon soniyalar ichida bepul yaratiladi.\n\nPaul Vigna va Michael Casey *The Truth Machine*da mohiyatni aniq tasvirlagan: blockchain - bu ishonch mashinasi. Ikki notanish odamga kafolatchi-vositachisiz bitim tuzish imkonini beradigan texnologiya. Bu texnik detaldek eshitiladi. Ammo oqibatlari ulkan: bugun bank, notarius, regulyator yoki platformani talab qiladigan hamma narsani potensial ravishda to'g'ridan-to'g'ri, matematika orqali qilish mumkin.\n\nNakamoto shaxsiyati - yoki uning yo'qligi - ustida to'xtalishga arziydi. U 2024-yilga kelib yuzlab milliard dollarlik aktivlarni boshqargan texnologiyani yaratdi va hech qachon o'z ismini oshkor qilmadi. Ba'zilar bu bitta odam deb o'ylaydi. Boshqalar - guruh deb. Ayrim tadqiqotchilar Nakamoto allaqachon vafot etgan deb hisoblaydi. Biz bilmaymiz. Va buning o'zi manifest: g'oya ism va rezyumega ega muallifsiz ham dunyoni o'zgartira oladi.\n\n> Nakamoto kriptograflar o'nlab yillar davomida ishlagan masalani hal qildi: markaziy vositachisiz raqamli pul. To'qqiz sahifa. Anonim. Moliyaviy inqiroz avjida. Bu XXI asrning eng muhim hujjatlaridan biri.\n\nBitcoin-ning birinchi bloki - \"genesis block\" - 2009-yil 3-yanvarda qazib olindi. Uning ma'lumotlariga Nakamoto o'sha kungi Times gazetasi sarlavhasini kiritdi: \"Chancellor on brink of second bailout for banks\". Kansler banklarni ikkinchi bor qutqarish arafasida. Bu tasodif emas edi. Bu siyosiy bayonot edi.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["Bitcoin", "blokcheyn", "tarix", "markazsizlashuv"], "x": 712.1, "y": 232.9, "angDeg": -45.0}, {"id": "buterin", "sceneIndex": 2, "type": "technology", "shortTitle": "Buterin", "era": "2013→2015", "lensWeight": {"chronology": 4, "trust": 2, "sovereignty": 2, "programmability": 5, "access": 2}, "title": "Buterin: blockchain kompyuter sifatida", "insight": "Buterin 19 yoshida blockchain-ni ixtisoslashgan reestrdan universal kompyuterga aylantirdi. Smart contractlar - code ichidagi, vositachisiz avtomatik bajariladigan kelishuvlar.", "thesis": "Buterin 19 yoshida blockchain-ni ixtisoslashgan reestrdan universal kompyuterga aylantirdi. Smart contractlar - code ichidagi, vositachisiz avtomatik bajariladigan kelishuvlar.", "body": "## 19 yosh, white paper va keyingi savol\n\nBitcoin aniq bir masalani hal qildi: banksiz raqamli pul. Bu ulkan yutuq. Ammo 2013-yilga kelib blockchain-texnologiya bundan ham ko'proq narsa qila olishi ayon bo'ldi - agar u Bitcoin cheklovlaridan ozod qilinsa.\n\nBuni 19 yoshli kanadalik-rossiyalik dasturchi Vitalik Buterin tushundi. U oddiy savol berdi: agar blockchain tranzaksiyalar haqidagi ma'lumotlarni saqlash bilangina cheklanmay, ixtiyoriy dasturlarni ham bajara olsa-chi?\n\nBitcoin - ixtisoslashgan blockchain. U bitta narsani qila oladi: Bitcoin-ni bir adresdan boshqasiga o'tkazish. Bu kuchli, ammo cheklangan. Buterin dasturlanadigan blockchain - istalgan dasturni ishga tushirish mumkin bo'lgan universal markazsiz kompyuter yaratishni taklif qildi.\n\nU Ethereum White Paper-ni 2013-yilda diplomsiz, institutsional qo'llab-quvvatlovsiz va investorlarsiz yozdi. Internetdagi shunchaki white paper. G'oya shunchalik ishontiruvchi ediki, yuzlab dasturchilarni jalb qildi. Ethereum 2015-yilda ishga tushdi - va 2020-yillarga kelib Bitcoin-dan keyin kapitalizatsiya bo'yicha ikkinchi kriptotarmoqqa aylandi.\n\n## Smart contractlar: buzib bo'lmaydigan kelishuvlar\n\nEthereum-ning markaziy innovatsiyasi - smart contractlar. Bular blockchain-da saqlanadigan va oldindan belgilangan shartlar yuz berganda avtomatik bajariladigan dasturlar. \"Smart\" - chunki ular o'zlari bajariladi. \"Contractlar\" - chunki ular tomonlar o'rtasidagi kelishuvlarni tasvirlaydi.\n\nAvvalo oddiy shartnoma qanday ishlashini tasavvur qil. Sen kvartira ijaraga olasan. Sen va egasi shartnoma imzolaysizlar. Unda yozilgan: \"Ijarachi har oyning birinchi kuni to'laydi. Kechiksa - jarima\". Ammo bu shunchaki qog'oz. Shartnoma ishlashi uchun ijroga majburlash tizimi kerak: sudlar, yuristlar, sud ijrochilari. Bu sekin, qimmat va shu institutlarga ishonch talab qiladi.\n\nSmart contract boshqacha ishlaydi. Xuddi shu shartlar - lekin code shaklida yozilgan. Har oyning birinchi kuni smart contract ijara haqini ijarachining adresidan egasining adresiga avtomatik o'tkazadi. To'lov yo'q - kalitlari ham contractda bo'lgan aqlli qulf orqali kvartiraga kirish yo'q. Shartlar avtomatik bajariladi, sudsiz va yuristsiz. Code - bu qonun.\n\nReal dunyodan misol: sen notanish odamdan raqamli aktiv sotib olmoqchisan. Avval ikkalangiz ham ishonadigan vositachi kerak bo'lardi: escrow-servis, birja. Smart contract bilan: puling contractda bloklanadi, sen aktivni olasan, contract pulni avtomatik sotuvchiga o'tkazadi. Agar aktivni olmagan bo'lsang - pul senga qaytadi. Avtomatik. Matematik. Vositachisiz.\n\nBu fantastikadek tuyulgan imkoniyatlarni ochdi: savdoni hech kim nazorat qilmaydigan markazsiz birjalar. Banklarsiz kreditlash. Markaziy sanoqchisiz ovoz berish. CEO va ofissiz tashkilotlar.\n\n> Buterin 19 yoshida moliya uchun Berners-Lee 1991-yilda axborot uchun qilgan ishni qildi: har kim uning ustida qurishi mumkin bo'lgan ochiq protokol yaratdi. Va Berners-Lee kabi, unga monopoliyadan voz kechdi.\n\n2024-yilga kelib Ethereum-da DeFi smart contractlarida o'nlab milliard dollarlik aktivlar bloklangan edi. Minglab ilovalar uning bazasida ishlaydi. Bularning barchasi 19 yoshli dasturchining bitta savoli oqibati: agar blockchain puldan tashqari narsalarni ham qila olsa-chi?", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["Ethereum", "smart-kontraktlar", "blokcheyn", "DeFi"], "x": 800.0, "y": 445.0, "angDeg": 0.0}, {"id": "keys", "sceneIndex": 3, "type": "privacy", "shortTitle": "Not your keys", "era": "prinsip", "lensWeight": {"chronology": 2, "trust": 3, "sovereignty": 5, "programmability": 1, "access": 3}, "title": "Not your keys - not your coins: self-custody", "insight": "Not your keys - not your coins: aktivlarni birjada saqlash ularga birja egalik qilishini anglatadi. Self-custody - private key senda bo'lishi - yagona haqiqiy moliyaviy suverenitet.", "thesis": "Not your keys - not your coins: aktivlarni birjada saqlash ularga birja egalik qilishini anglatadi. Self-custody - private key senda bo'lishi - yagona haqiqiy moliyaviy suverenitet.", "body": "## FTX, Mt. Gox va takrorlashga to'g'ri kelgan saboq\n\n2022-yil noyabr. FTX - dunyodagi eng yirik kriptobirjalardan biri, 32 milliard dollarga baholangan. Uning asoschisi Sam Bankman-Fried Forbes va Time muqovalarida paydo bo'ladi, AQSH Kongressida nutq qiladi, siyosiy kampaniyalarga millionlab dollar xayriya qiladi. Hammasi jiddiy ko'rinadi.\n\nKeyin bir necha kun ichida birja qulab tushdi. Mijozlar mablag'lari xavfli stavkalar uchun ishlatilgani ma'lum bo'ldi. Millionlab odamlar o'z aktivlariga kirish imkonini yo'qotdi. Bankman-Fried hibsga olindi va hukm qilindi.\n\nBu birinchi marta emas. 2014-yilda Mt. Gox buzib kirildi - o'shanda u dunyodagi eng yirik birja bo'lib, barcha Bitcoin tranzaksiyalarining 70% undan o'tardi. 850 000 bitcoin yo'qoldi. 2019-yilda QuadrigaCX birjasi asoschisi vafot etdi - parollarni bilgan yagona odam shu edi. Mijozlarning 190 million dollar mablag'i abadiy qulflanib qoldi.\n\nHar safar pattern bir xil: odamlar aktivlarni birjada saqlab, unga ishonishgan. Birja vositachi edi - xuddi bank kabi. Va xuddi bank kabi, u bu hokimiyatni ularga qarshi ishlata olardi.\n\nKriptohamjamiyatda allaqachon aksiomaga aylangan ibora bor: \"Not your keys - not your coins\". Kalitlaring seniki bo'lmasa - tangalaring ham seniki emas.\n\n## Private key nima va bu nega muhim\n\nBlockchain-da aktivlar private key orqali nazorat qilinadi. Bu uzun belgilar qatori - hamyon adresi bilan matematik bog'langan juda murakkab parolga o'xshash narsa. Private key kimda bo'lsa, shu adresdagi hamma narsani o'sha nazorat qiladi. Usiz kirish yo'q.\n\nAktivlarni birjada ushlasang, private key birjada bo'ladi. Sen ekranda balansni ko'rasan, ammo bu birjaning va'dasi, matematik kafolat emas. Birja yechib olishni muzlatishi mumkin. Bankrot bo'lishi mumkin. Firibgar bo'lib chiqishi mumkin.\n\nSelf-custody - mustaqil saqlash - degani: private key senda. Hech qanday kompaniya, hech qanday regulyator, boshqa birovning serverini buzgan hech qanday hacker sening kalitingizsiz aktivlaringga yetib bora olmaydi. Faqat sen.\n\nBu texnikdek eshitiladi, ammo bu moliyaviy suverenitetning fundamental prinsipi. Tarixda birinchi marta oddiy inson katta qiymatlarni vositachisiz saqlashi mumkin - davlat yoki korporatsiya emas, matematika beradigan kafolat bilan.\n\nSaqlash usullari bir nechta. 12 yoki 24 so'zdan iborat seed phrase - private keyning inson o'qiy oladigan versiyasi. Qog'ozga yozib, ishonchli joyga yashirsang, barcha qurilmalaring yonib ketsa ham aktivlar xavfsiz bo'ladi. Hardware walletlar - Ledger, Trezor - private keyni internetdan izolyatsiya qilingan jismoniy qurilmada saqlaydi. Kompyutering virus yuqtirgan bo'lsa ham, kalitga yetib bo'lmaydi. Software walletlar - MetaMask, Rabby Wallet, Tonkeeper - qulayroq, ammo kalitlarni internetga ulangan qurilmada saqlaydi, bu ko'proq ehtiyotkorlik talab qiladi.\n\n> \"Not your keys - not your coins\" - bu paranoya emas. Bu matematik fakt. FTX, Mt. Gox, QuadrigaCX - istisno emas. Bular qiymatlarni vositachida saqlashning oldindan kutiladigan oqibatlari.\n\nCustodial va non-custodial saqlash o'rtasidagi farqni tushunish texnik detal emas. Bu Web3-ning birinchi va eng muhim amaliy sabog'i. Kriptovalyutaga birjada egalik qilish - oltinni birovning seyfida saqlashga o'xshaydi. Qulay. Seyfning o'zi yo'qligi ayon bo'lguncha.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["oʻz nazoratida saqlash", "hamyon", "xavfsizlik", "blokcheyn"], "x": 712.1, "y": 657.1, "angDeg": 45.0}, {"id": "wallets", "sceneIndex": 4, "type": "media", "shortTitle": "Hamyonlar", "era": "2009→2024", "lensWeight": {"chronology": 4, "trust": 2, "sovereignty": 3, "programmability": 2, "access": 5}, "title": "Hamyonlar evolyutsiyasi: matn faylidan Telegramgacha", "insight": "Hamyonlar 2009 yildagi matn faylidan 2024 yildagi Telegram tugmasigacha yoʻl bosib oʻtdi. Kripto yuborish xabar yuborishdek oson boʻlganda, adoption miqyosi tubdan oʻzgaradi.", "thesis": "Hamyonlar 2009 yildagi matn faylidan 2024 yildagi Telegram tugmasigacha yoʻl bosib oʻtdi. Kripto yuborish xabar yuborishdek oson boʻlganda, adoption miqyosi tubdan oʻzgaradi.", "body": "## “Faqat texniklar uchun”dan “hamma uchun”gacha yoʻl\n\nKriptohamyonlar tarixi — kirish toʻsigʻi asta-sekin pasayib borgan tarix. Matematiklar va dasturchilar uchun vositadan sen allaqachon foydalanadigan messenjer ichidagi tugmagacha.\n\nBitcoinning ilk foydalanuvchilari, 2009-2011 yillarda, shaxsiy kalitlarni qattiq diskdagi matn fayllarida tom maʼnoda saqlashgan. Hech qanday interfeys yoʻq. Hech qanday maslahat yoʻq. Sen shunchaki buyruq satrida ishlarding va faylni yoʻqotib qoʻymaslikka umid qilarding. Koʻpchilik yoʻqotgan.\n\nEng mashhur voqea — Uelslik dasturchi James Howells haqida. 2013 yilda u katta tozalash paytida ichida 8000 bitcoin boʻlgan qattiq diskni tasodifan tashlab yuborgan. Hozirgi narxlarda bu yuzlab million dollar. Disk haligacha Newport shahar chiqindixonasida yotibdi. Howells yillar davomida uni qazib olishga ruxsat olishga urinmoqda, lekin hokimiyat ekologik sabablar bilan rad etmoqda.\n\nBu kulgili tasodif emas. Bu erta Web3 qanday boʻlganini koʻrsatadi: texnik jihatdan inqilobiy, lekin koʻpchilik odamlar uchun amalda yetib boʻlmas.\n\n## Dasturiy hamyonlar: qulaylikning birinchi inqilobi\n\nMetaMask — 2016 yilda ishga tushirilgan brauzer kengaytmasi — texnik taʼlimsiz oddiy odam foydalana oladigan birinchi hamyon boʻldi. Chromeʼga kengaytmani oʻrnatasan, “Create wallet”ni bosasan, 12 soʻzdan iborat seed-fraza olasan, uni yozib qoʻyasan, tasdiqlaysan — tayyor. Butun jarayon uch daqiqa oladi.\n\nSeed-fraza — shaxsiy kalitingning odam oʻqiy oladigan versiyasi. Oʻn ikki oddiy soʻz: masalan, “river cloud magic forest apple sunset...” Bu oʻn ikki soʻz hamyoning bilan matematik bogʻlangan. Qogʻozga yozib, ishonchli joyga yashirsang, kompyuter yonib ketsa ham, telefon buzilsa ham, MetaMask kompaniya sifatida yopilsa ham aktivlaring xavfsiz boʻladi. Seed-fraza — doim ishlaydigan zaxira nusxa.\n\nMetaMask millionlab odamlar uchun Ethereumga kirish imkonini ochdi. Undan keyin boshqalar paydo boʻldi: mobil qurilmalar uchun Trust Wallet, Solana uchun Phantom, DeFi uchun qulay interfeysga ega Rabby Wallet — u tranzaksiya imzolanishidan oldin uning simulyatsiyasini koʻrsatadi, bu firibgarlar foydalanuvchilarni aldash yoʻllarini doim izlaydigan dunyoda xavfsizlik uchun nihoyatda muhim.\n\n## TON va Telegram: messenjer ichidagi hamyon\n\nTonkeeper va Telegram Wallet keyingina ravshan boʻlib koʻringan navbatdagi qadamni tashladi: agar hamyonni foydalanuvchi har kuni ishlatadigan ilova ichiga joylash mumkin boʻlsa, nega undan alohida ilova oʻrnatishni talab qilish kerak?\n\nTelegram Wallet — Telegramning bevosita ichidagi hamyon. Agar doʻstingga TON yubormoqchi boʻlsang, uni xabar yuborgandek yuborasan. Chatni ochasan, “attach”ni bosasan, “Transfer”ni tanlaysan. Manzillar, shaxsiy kalitlar, seed-frazalar — bularning barchasi ichki tomonda ishlaydi. Tashqaridan bu shunchaki “messenjerda pul yuborish”.\n\nBu adoptionning mutlaqo boshqa darajasi. “Kriptohamyon oʻrnating” emas, balki “sizda allaqachon bor ilovadagi tugmani bosing”. Aynan shunday qilib milliardlab oddiy odamlar blockchain bilan birinchi marta, buni qilayotganini anglamagan holda, oʻzaro taʼsirlasha oladi.\n\nKastodial va nokastodial hamyon oʻrtasidagi farq muhimligicha qoladi. Telegram Wallet asosiy variantda kastodial: kalitlar Telegram serverlarida saqlanadi. Bu qulayroq, lekin bank mantiqini takrorlaydi. Tonkeeper — nokastodial: kalitlar oʻzingda. Bu murakkabroq, lekin haqiqiy egalik beradi. Boshlash uchun — Telegram Wallet. Jiddiy summalar uchun — Tonkeeper yoki apparat hamyon.\n\n> 2009 yildagi buyruq satridan 2024 yildagi Telegram tugmasigacha boʻlgan yoʻl — toʻsiqni nolgacha pasaytirish tarixi. Kriptovalyuta yuborish xabar yuborishdek oson boʻlganda, adoption miqyosi tubdan oʻzgaradi.\n\nApparat hamyonlar — Ledger va Trezor — jiddiy summalarni saqlash standarti boʻlib qoladi. Shaxsiy kalit internetdan ajratilgan jismoniy qurilmada saqlanadi. Kompyutering keylogger virusi bilan zararlangan boʻlsa ham, tajovuzkor kalitni ololmaydi. Kirish uchun qurilmadagi tugmani jismonan bosish kerak.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["hamyon", "oʻz nazoratida saqlash", "Telegram", "TON"], "x": 500.0, "y": 745.0, "angDeg": 90.0}, {"id": "defi", "sceneIndex": 5, "type": "economy", "shortTitle": "DeFi", "era": "2020→", "lensWeight": {"chronology": 3, "trust": 3, "sovereignty": 3, "programmability": 5, "access": 4}, "title": "DeFi: moliyaviy institutlarsiz moliya", "insight": "DeFi banklar va brokerlarni smart contractlar bilan almashtiradi: kreditlar, almashinuv, aktivlardan daromad — KYCsiz, tasdiqsiz, 24/7, dunyoning istalgan nuqtasidan. Bank hisobi yoʻq 1,4 mlrd odam kirish imkoniga ega boʻladi.", "thesis": "DeFi banklar va brokerlarni smart contractlar bilan almashtiradi: kreditlar, almashinuv, aktivlardan daromad — KYCsiz, tasdiqsiz, 24/7, dunyoning istalgan nuqtasidan. Bank hisobi yoʻq 1,4 mlrd odam kirish imkoniga ega boʻladi.", "body": "## DeFi nima va u nega kerak\n\nDeFi — Decentralized Finance, markazlashmagan moliya. Bu blockchain ustida smart contractlar orqali ishlaydigan moliyaviy servislar majmuasi — banklar, brokerlar va boshqa moliyaviy vositachilarsiz.\n\nBu yerda nima inqilobiy ekanini tushunish uchun anʼanaviy moliya qanday ishlashini eslash kerak. Kredit olmoqchisan — bankka borasan, KYC-tekshiruvdan oʻtasan (Know Your Customer — shaxsni verifikatsiya qilish), daromad haqidagi hujjatlarni berasan, qarorni bir hafta kutasan. Bank oʻzi kerak deb hisoblagan foiz stavkasini belgilaydi. Aksiyalar bilan savdo qilmoqchisan — brokerda hisob ochasan, yana KYC, yana kutish. Jamgʻarmalardan daromad olmoqchisan — bank yiliga 2% taklif qiladi, 8% marjani esa oʻzida qoldiradi.\n\nBu ssenariylarning barchasida bank yoki broker — darvozabon. U kimga kirish berishni, qanday shartlarda, qanday mukofot evaziga berishni hal qiladi. Kredit tarixi yoʻq, kerakli mamlakatda roʻyxati yoʻq, yetarli daromadi yoʻq odamlar bazaviy moliyaviy servislardan uzib qoʻyiladi. Jahon banki maʼlumotlariga koʻra, dunyoda 1,4 milliard katta yoshli odamda bank hisobi yoʻq.\n\n## Uniswap, Aave, Compound: bu qanday ishlaydi\n\nDeFi darvozabonni matematika bilan almashtiradi.\n\nUniswap — markazlashmagan birja. Anʼanaviy birjada buyurtmalar kitobi bor: xaridorlar va sotuvchilar orderlar qoʻyadi, birja ularni moslashtiradi. Uniswapda buyurtmalar kitobi ham, operator kompaniya ham yoʻq. Buning oʻrniga likvidlik puli bor: foydalanuvchilar token juftlarini smart contractda bloklaydi va komissiyalardan ulush oladi. Bir tokenni boshqasiga almashtirmoqchi boʻlganingda, smart contract narxni algoritm boʻyicha avtomatik hisoblaydi va almashinuvni amalga oshiradi. KYC yoʻq. Tasdiq yoʻq. Ish vaqti yoʻq.\n\nAave — kreditlash protokoli. Sen tokenlarni garov sifatida bloklab, boshqa tokenda kredit olishing mumkin. Yoki aksincha, tokenlarni pulga berib, foiz olasan. Stavkalar bank tomonidan emas, talab va taklif orqali avtomatik belgilanadi. Jarayon bir necha daqiqa oladi, 24/7 ishlaydi, internet bor dunyoning istalgan nuqtasidan foydalanish mumkin.\n\nCompound ham oʻxshash tamoyilda ishlaydi: aktivlarni taqdim etasan — ular avtomatik ishlaydi va daromad keltiradi. “Yiliga 2% depozitga qoʻyish” degan narsa yoʻq. Stavkalar bozor talabiga qarab real vaqtda oʻzgaradi.\n\nBu protokollarning ofislari yoʻq, arizalarni qayta ishlaydigan xodimlarni yollamaydi, anʼanaviy banklarning regulatory overhead xarajatlarini koʻtarmaydi. Shuning uchun bu tejamkorlikning bir qismi foydalanuvchilarga kreditorlar uchun yuqoriroq stavkalar va qarz oluvchilar uchun pastroq stavkalar shaklida qaytadi.\n\nDon va Alex Tapscott “Blockchain Revolution”da buni “moliyaviy internet” deb ataydi: internet axborotga kirishni demokratlashtirgani kabi, DeFi moliyaviy servislarga kirishni demokratlashtiradi. Nigeriya aholisi New Yorkdagi xedj-fond bilan bir xil vositalarni oladi.\n\n> DeFi — faqat qulaylik emas. Bu siyosiy bayonot: moliyaviy xizmatlar muayyan institutlar mijozlarining imtiyozi emas, hammaga ochiq protokol sifatida.\n\nXatarlar real: smart contractlarda baglar boʻladi, protokollar buzib kiriladi, bozorlar volatildir, regulyator muhit beqaror. DeFi hayotning barcha holatlari uchun anʼanaviy moliya oʻrnini bosmaydi. Lekin tamoyil inqilobiy. Va u ishlaydi.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["DeFi", "smart-kontraktlar", "moliya", "blokcheyn"], "x": 287.9, "y": 657.1, "angDeg": 135.0}, {"id": "identity", "sceneIndex": 6, "type": "privacy", "shortTitle": "Identifikatsiya", "era": "Web3", "lensWeight": {"chronology": 2, "trust": 2, "sovereignty": 5, "programmability": 3, "access": 2}, "title": "Raqamli identiklik: Web3dagi suveren “men”", "insight": "Web2da identiklik platformaga tegishli va oʻchirib tashlanishi mumkin. Web3da esa ENS, NFT, on-chain reputatsiya — matematik jihatdan musodara qilib boʻlmaydigan suveren raqamli shaxsdir.", "thesis": "Web2da identiklik platformaga tegishli va oʻchirib tashlanishi mumkin. Web3da esa ENS, NFT, on-chain reputatsiya — matematik jihatdan musodara qilib boʻlmaydigan suveren raqamli shaxsdir.", "body": "## Web2dagi identiklik muammosi\n\nOldingi bobdagi Baudrillardni esla: ijtimoiy tarmoqlarda odamlar oʻzlarining simulyakrlarini — reallik oʻrnini bosadigan obrazlarni quradi. Hayotning Instagram-versiyasi, aslidan chiroyliroq va baxtliroq. Lekin bu simulyakrda Baudrillard oldindan koʻra olmagan yana bir muammo bor: u platformaga tegishli.\n\nInstagram million obunachisi bor akkauntingni istalgan payt, izohsiz oʻchirishi mumkin. Twitter ban qilishi mumkin. TikTok bloklashi mumkin. Yillar davomida qurgan hamma narsang — obunachilar, reputatsiya, tarix — ularning serverlarida saqlanadi va ularga tegishli.\n\nChris Dixon “Why Decentralization Matters”da buni Web2 platformalarining asosiy muammosi sifatida tasvirlagan: ular oldindan aytish mumkin boʻlgan sikldan oʻtadi. Avval foydalanuvchilar va dasturchilarni saxiy shartlar bilan jalb qiladi. Keyin, kritik massaga yetgach, qoidalarni oʻz foydasiga oʻzgartiradi. 2007 yilda Facebook ustida qurgan dasturchilar 2012 yilga kelib platforma raqibga aylanganini koʻrdi. Twitterda auditoriya qurgan yaratuvchilar 2022 yilga kelib moderatsiya siyosati ogohlantirishsiz oʻzgarganini bildi.\n\nMuammo yomon niyatda emas. Muammo arxitekturada: sening identikliging begona serverda saqlanadi.\n\n## ENS, NFT-avatarlar va on-chain reputatsiya\n\nWeb3 boshqa modelni taklif qiladi — suveren raqamli identiklik.\n\nENS — Ethereum Name Service — blockchain uchun nomlar tizimi. “0x742d35Cc6634C0532...” kabi manzil oʻrniga sen “luminara.eth” nomini sotib olasan va uni hamyoningga bogʻlaysan. Bu internetdagi domen kabi ishlaydi, faqat uni tortib olish imkoniyati yoʻq. Sening nomingni bloklay oladigan kompaniya yoʻq. Oʻchirib qoʻyilishi mumkin boʻlgan server yoʻq. Uzaytirish uchun toʻlab tursang, u seniki. Va u platformalar orasida koʻchadi: bitta nom, bitta manzil, hamma joyda.\n\nNFT-avatarlar Web3-identiklikning birinchi ommaviy koʻrinishi boʻldi. CryptoPunks — 2017 yilda ishga tushirilgan 10 000 pikselli personaj — madaniy fenomen boʻldi. Bored Ape Yacht Club hamjamiyat yaratdi: Bored Ape egasi yopiq tadbirlarga kirish, oʻz personajiga IP-huquqlar, muayyan madaniyatga mansublik oldi. Bular shunchaki rasmlar emas. Bular aʼzolik chiptalari, mansublik dalillari, qadriyatlarni bildirish usullari.\n\nLekin eng qiziq narsa — keyin nima boʻlishi. On-chain reputatsiya — blockchain ichidagi tarixingni avtomatik aks ettiradigan profil. Qaysi protokollardan foydalanding, qaysi ovoz berishlarda qatnashding, qaysi loyihalarni qoʻllab-quvvatlading, bitimlar ishtirokchisi sifatida qanchalik ishonchli boʻlding. Bu reputatsiyani soxtalashtirib boʻlmaydi — u oʻzgarmas reyestrga yozilgan va matematik verifikatsiya qilinadi. Va u platformaga emas, senga tegishli.\n\nWeb3dagi taxallusli identiklik yana bir oʻlcham qoʻshadi. Satoshi Nakamoto anonim qolgan holda dunyoni oʻzgartirdi. Web3da sen haqiqiy ismingni oshkor qilmasdan, hamyon nomi ostida mazmunli reputatsiya qura olasan. Blockchain ichidagi harakatlaring — identikligingning oʻzi. Biografiya emas. Rezyume emas. Fotosuratlar emas. Harakatlar.\n\n> Web2da sening identikliging — platforma sen haqingda qaror qilgan narsa. Web3da esa — oʻzgarmas reyestrga yozilgan sen qilgan ishlar. Auditoriya uchun simulyakr suveren raqamli shaxsga qarshi.\n\nBu ertaga boʻladigan narsa emas va bugunning oʻzidayoq hamma uchun emas. Lekin yoʻnalish aniq: internet identiklik platformaga emas, insonga tegishli boʻladigan modelga qarab harakatlanmoqda. TON esa buni Telegramning milliard foydalanuvchisi uchun ochiq qilishga asosiy daʼvogarlardan biri.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["identiklik", "oʻz nazoratida saqlash", "NFT", "Web3"], "x": 200.0, "y": 445.0, "angDeg": 180.0}, {"id": "ton", "sceneIndex": 7, "type": "power", "shortTitle": "TON", "era": "→milliard", "lensWeight": {"chronology": 4, "trust": 2, "sovereignty": 2, "programmability": 3, "access": 5}, "title": "TON: milliard uchun blockchain", "insight": "TON Telegram orqali milliard foydalanuvchi uchun loyihalangan: cheksiz sharding, lahzalik tranzaksiyalar, messenjer ichiga kiritilgan. Adoption ishontirish orqali emas, mavjud infratuzilma orqali.", "thesis": "TON Telegram orqali milliard foydalanuvchi uchun loyihalangan: cheksiz sharding, lahzalik tranzaksiyalar, messenjer ichiga kiritilgan. Adoption ishontirish orqali emas, mavjud infratuzilma orqali.", "body": "## Ethereum hal qilmagan miqyos muammosi\n\n2017 yilga kelib Ethereum konsepsiyani isbotladi: smart contractlar ishlaydi, markazlashmagan ilovalar mumkin. Ammo yangi muammo paydo bo'ldi — miqyos.\n\nEthereum bazaviy versiyasida soniyasiga taxminan 15 ta tranzaksiyani qayta ishlaydi. Taqqoslash uchun: Visa o'rtacha soniyasiga 1700 ta tranzaksiyani, eng yuqori davrlarda esa 24 000 tagacha tranzaksiyani qayta ishlaydi. Ethereum tarmog'ida mashhur ilova paydo bo'lganda — masalan, 2017 yildagi CryptoKitties o'yini — tarmoq tom ma'noda ortiqcha yuklanib ketdi. Foydalanuvchilar soatlab kutishdi, komissiyalar esa bitta tranzaksiya uchun o'nlab dollargacha oshdi. Hamma uchun blockchain hamma uchun juda sekin bo'lib chiqdi.\n\nBundan tashqari, Ethereumdan foydalanish texnik jihatdan murakkab edi. Hamyon o'rnatish kerak. Komissiyalarni to'lash uchun maxsus ETH sotib olish kerak. Dasturchilar dasturchilar uchun loyihalagan interfeyslarni tushunib olish kerak. Oddiy Telegram foydalanuvchisi uchun bu juda yuqori to'siq edi.\n\n## TON: miqyos uchun loyihalangan arxitektura\n\n2018-2019 yillarda aka-uka Durovlar — Pavel va Nikolay — TON: The Open Network ustida ishlashdi. Nikolay Durov — o'z avlodining eng kuchli matematiklari va dasturchilaridan biri, VKontakte va Telegram algoritmlarining yaratuvchisi. U TONni noldan, aniq maqsadni ko'zlab loyihaladi: tizim milliard foydalanuvchi uchun ishlashi kerak.\n\nTON Whitepaper uni Bitcoin va Ethereumdan ajratib turadigan bir nechta asosiy texnik yechimlarni tasvirlaydi.\n\nCheksiz sharding. Blockchainni miqyoslashning asosiy muammosi: tranzaksiyalar qancha ko'p bo'lsa, tarmoq shuncha sekin ishlaydi, chunki har bir tugun hammasini qayta ishlashi kerak. TON buni avtomatik sharding orqali hal qiladi: yuklama oshgani sari tarmoq parallel zanjirlarga (shardlarga) bo'linadi — xuddi tig'iz paytda avtomatik ravishda polosalar qo'shadigan yo'l kabi. Nazariy jihatdan bu tezlikni yo'qotmasdan miqyoslanish imkonini beradi.\n\nLahzalik tranzaksiyalar. Bitcoin'da tranzaksiya 10-60 daqiqada tasdiqlanadi. Ethereumda — bir necha daqiqada. TONda optimistik tasdiqlar mexanizmi tranzaksiyalarni soniyalar ichida qayta ishlash imkonini beradi. To'lov servisi uchun bu prinsipial ahamiyatga ega.\n\nIchki servislar. Bitcoin va Ethereumda DNS (domen nomlari tizimi), fayl saqlash va boshqa servislar — tashqi qo'shimchalar. TONda ular protokol ichiga kiritilgan. Bu ilovalar ishlab chiqishni soddalashtiradi va tashqi servislarga qaramlikni kamaytiradi.\n\n## Telegram kirish nuqtasi sifatida\n\nAmmo TONdagi eng muhim narsa — kontekst. Bu Ethereum bilan raqobatlashadigan yana bir blockchain emas. Bu 950 million foydalanuvchiga ega messenjer Telegram uchun moliyaviy qatlam.\n\nStrategiya raqobatchilarnikidan tubdan farq qiladi. Bitcoin va Ethereum ekotizimni noldan qurdi: foydalanuvchilarni jalb qil, ularni hamyon o'rnatishga ishontir, blockchain nima ekanini tushuntir. TON mavjud infratuzilmaga joylashadi: senda allaqachon Telegram bor, senda allaqachon kontaktlar bor, senda ilovadan har kuni foydalanish odati bor. Shunchaki hamyon qo'sh — va bazaviy kriptotranzaksiyalar uchun kerak bo'lgan hamma narsa shu yerda.\n\nJared Larnie \"Own the Internet\" essesida foydalanuvchilar tokenlar orqali platformalarning bir qismiga egalik qiladigan kelajakni tasvirlaydi. TON aynan shu yo'nalishda harakat qilmoqda: Telegram foydalanuvchilari — servisning shunchaki iste'molchilari emas, TON-iqtisodiyotining potensial ishtirokchilari.\n\nTON yo'li oson bo'lmadi: dastlabki loyihani SEC 2020 yilda blokladi. Durovlar loyihani yopishdi. Ammo hamjamiyat TON Foundation nomi ostida rivojlantirishni davom ettirdi. 2024 yilga kelib TON eng tez o'sayotgan blockchainlardan biriga aylandi — Telegram ichida DeFi, NFT-ekotizimi va Mini Apps faol rivojlandi.\n\n> TON shunchaki miqyosning texnik vazifasini hal qilmaydi. U adoption vazifasini hal qiladi: blockchain haqida hech qachon eshitmagan odamlar uchun blockchainni qanday ochiq qilish mumkin — chunki u ular allaqachon foydalanayotgan ilova ichiga kiritilgan.\n\nKeyingi chegaraning o'zi shu: odamlarni yangi texnologiyalarga o'tishga ishontirish emas, balki yangi texnologiyalarni ularning mavjud hayotiga kiritish. Sezdirmay. To'siqlarsiz. Maxfiy kalitlar haqidagi ma'ruzalarsiz.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%8  232.9, "angDeg": 225.0}], "edges": [{"from": "intermediary", "to": "nakamoto", "label": "muammo vositachisiz hal qilindi", "lenses": ["chronology", "trust"]}, {"from": "nakamoto", "to": "buterin", "label": "reyestrdan kompyuterga", "lenses": ["chronology", "programmability"]}, {"from": "buterin", "to": "defi", "label": "smart-kontraktlar banklarni almashtiradi", "lenses": ["programmability", "access"]}, {"from": "nakamoto", "to": "keys", "label": "suverenlik kalitlarni talab qiladi", "lenses": ["trust", "sovereignty"]}, {"from": "keys", "to": "wallets", "label": "kalitlar hamyonga yashirildi", "lenses": ["sovereignty", "access"]}, {"from": "wallets", "to": "ton", "label": "kriptani xabar kabi yuborish", "lenses": ["access", "chronology"]}, {"from": "keys", "to": "identity", "label": "suveren “men” begonalashtirilmaydi", "lenses": ["sovereignty"]}, {"from": "buterin", "to": "identity", "label": "shaxsiyat dasturlanadi", "lenses": ["programmability", "sovereignty"]}, {"from": "defi", "to": "ton", "label": "banksiz 1,4 mlrd uchun kirish", "lenses": ["access", "economy"]}, {"from": "intermediary", "to": "defi", "label": "institutlarsiz moliya", "lenses": ["trust", "programmability"]}, {"from": "wallets", "to": "defi", "label": "hamyon — DeFiʼga kirish", "lenses": ["access", "programmability"]}]}, "es": {"chapter": {"key": "web3", "title": "Blockchain", "lede": "Confianza sin intermediario, mediante matemáticas y no autoridad. Del problema del doble gasto a TON.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=web3", "centralIdea": "Confianza sin intermediario, con matemáticas, no autoridad", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Cronología", "accent": "#7dd3fc", "description": "Del problema del intermediario, pasando por Nakamoto y Buterin, a TON."}, {"id": "trust", "label": "Confianza", "accent": "#fbbf24", "description": "Doble gasto y registro distribuido: confianza sin banco."}, {"id": "sovereignty", "label": "Soberanía", "accent": "#c084fc", "description": "Self-custody, “not your keys” e identidad digital soberana."}, {"id": "programmability", "label": "Programabilidad", "accent": "#34d399", "description": "Buterin y los smart contracts: blockchain como computadora universal y DeFi."}, {"id": "access", "label": "Acceso", "accent": "#f87171", "description": "Billeteras y TON: blockchain para mil millones mediante infraestructura existente."}], "nodes": [{"id": "intermediary", "sceneIndex": 0, "type": "power", "shortTitle": "Intermediario", "era": "problema", "lensWeight": {"chronology": 4, "trust": 5, "sovereignty": 2, "programmability": 1, "access": 2}, "title": "El problema del intermediario: por qué necesitamos un banco", "insight": "El intermediario existe porque un archivo digital se puede copiar: el banco se asegura de que el mismo dinero no se gaste dos veces. blockchain resuelve este problema matemáticamente, sin intermediario.", "thesis": "El intermediario existe porque un archivo digital se puede copiar: el banco se asegura de que el mismo dinero no se gaste dos veces. blockchain resuelve este problema matemáticamente, sin intermediario.", "body": "## Una pregunta simple con una respuesta no obvia\n\nImagina que quieres enviar dinero a un amigo en otro país. Parece que en la era digital esto debería ser fácil. Abres una aplicación, ingresas el monto, presionas un botón. Pero detrás de esa aparente sencillez hay un sistema complejo de intermediarios.\n\nNo puedes simplemente «enviar un archivo con dinero». Porque un archivo digital se puede copiar. Si tuvieras un «dólar digital» en forma de archivo, podrías enviarlo a veinte personas al mismo tiempo y quedarte con el original. Eso se llama el «problema del doble gasto» y es precisamente por eso que no podemos transferir dinero directamente por internet, como transferimos texto o una foto.\n\nPor eso hace falta un banco. Un banco lleva un libro mayor centralizado: tienes cien dólares. Le envías cincuenta a un amigo. El banco registra: ahora tienes cincuenta, tu amigo tiene cincuenta más. El banco controla que el mismo dinero no se gaste dos veces. Esa es su función principal.\n\nUn intermediario de confianza. Tú confías en el banco, tu amigo confía en el banco, y gracias a eso confían el uno en el otro. Todo el sistema financiero es una red de estos intermediarios: bancos, sistemas de pago, bolsas, notarios, reguladores. Existen porque las personas que no se conocen no confían directamente entre sí.\n\n## El precio del intermediario\n\nEste sistema funcionó durante siglos. Pero tiene un problema fundamental: el intermediario tiene poder. Y puede usar ese poder no solo en tu beneficio.\n\nUn banco puede congelar tu cuenta, por orden del Estado, por sospecha de incumplimiento de las normas o por una falla técnica. Un sistema de pago puede rechazar una transacción porque el destinatario está en una lista \"indeseable\". Un gobierno puede confiscar activos, como ocurrió en Chipre en 2013, cuando los bancos congelaron los depósitos y recortaron parcialmente su valor. Una plataforma de intercambio puede cerrarse sin entregar el dinero a los clientes, como FTX en 2022.\n\nEl intermediario en el que confías hoy puede usar su poder contra ti mañana. No porque sea malicioso, sino porque tiene incentivos que no coinciden con los tuyos.\n\nEric Hughes formuló este problema en *A Cypherpunk's Manifesto* en 1993: la privacidad en una sociedad abierta requiere un sistema de transacciones anónimas. No un sistema en el que el intermediario promete guardar el secreto, sino un sistema en el que es matemáticamente imposible violarlo. Hughes describió el encargo técnico. La solución apareció quince años después.\n\n> Un intermediario de confianza no es un villano. Es una necesidad arquitectónica en un mundo sin criptografía. blockchain elimina esa necesidad y sustituye la confianza en una persona por una garantía matemática.\n\nEntender este reemplazo es la clave para entender todo lo que vino después. Si la confianza puede expresarse matemáticamente, no hace falta ni banco, ni notario, ni regulador. Solo hace falta código.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["blockchain", "confianza", "descentralización", "finanzas"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "nakamoto", "sceneIndex": 1, "type": "technology", "shortTitle": "Nakamoto", "era": "2008", "lensWeight": {"chronology": 5, "trust": 5, "sovereignty": 3, "programmability": 2, "access": 2}, "title": "Nakamoto: nueve páginas que cambiaron el mundo", "insight": "En 2008, Nakamoto resolvió el problema del doble gasto sin intermediarios: un libro mayor distribuido entre miles de participantes, imposible de falsificar matemáticamente. Nueve páginas cambiaron las finanzas.", "thesis": "En 2008, Nakamoto resolvió el problema del doble gasto sin intermediarios: un libro mayor distribuido entre miles de participantes, imposible de falsificar matemáticamente. Nueve páginas cambiaron las finanzas.", "body": "## Octubre de 2008: una crisis global y un manifiesto anónimo\n\nOctubre de 2008. El punto más álgido de la crisis financiera mundial. Lehman Brothers acaba de quebrar. Los gobiernos están rescatando de urgencia a los bancos con dinero de los contribuyentes. La confianza en el sistema financiero está en un mínimo histórico.\n\nEn ese mismo momento, llega un correo a la lista de distribución de una pequeña comunidad de criptógrafos. El remitente es alguien que usa el nombre Satoshi Nakamoto. Sin afiliación, sin institución, sin nombre real. El correo contiene un enlace a un documento: \"Bitcoin: A Peer-to-Peer Electronic Cash System\". Nueve páginas.\n\nEra una respuesta a la pregunta de Eric Hughes: un sistema anónimo de transacciones construido sobre matemáticas. Nakamoto propuso una solución al problema del doble gasto sin un intermediario central.\n\nLa lógica es elegante. En lugar de que un banco lleve el registro, que lo lleven miles de participantes al mismo tiempo. Cada transacción se transmite a todos los participantes de la red. Ellos agrupan las transacciones en bloques, y cada bloque está vinculado matemáticamente con el anterior: de ahí \"block-chain\", blockchain. Cambiar la historia es imposible: para hacerlo, habría que volver a calcular toda la blockchain más rápido de lo que miles de participantes agregan nuevos bloques. Eso requiere más poder de cómputo que el resto de la red junto.\n\n## Tres propiedades que antes nunca habían existido juntas\n\nAndreas Antonopoulos explica en *Mastering Bitcoin*: lo revolucionario de Bitcoin no está en cada elemento por separado - todos los componentes ya existían. Lo revolucionario es su combinación, que crea tres propiedades que antes no habían existido al mismo tiempo.\n\nDescentralización. No hay un servidor único, ni un punto único de falla o de control. No existe un CEO de Bitcoin al que se pueda arrestar. No existe un servidor de Bitcoin que se pueda apagar. La red funciona mientras haya al menos un nodo en funcionamiento.\n\nTransparencia. Todas las transacciones son visibles para todos. La historia es inmutable. Puedes verificar cualquier transacción que haya ocurrido alguna vez en la red Bitcoin, empezando por el primer bloque de enero de 2009.\n\nSin permisos. Nadie puede prohibirte participar en la red. No necesitas pasar KYC, no necesitas permiso de un banco, no necesitas empadronarte en un país concreto. Una billetera se crea gratis en segundos.\n\nPaul Vigna y Michael Casey describieron la esencia con precisión en *The Truth Machine*: blockchain es una máquina de confianza. Una tecnología que permite que dos desconocidos cierren un trato sin un intermediario garante. Suena como un detalle técnico. Pero las consecuencias son enormes: todo lo que hoy requiere un banco, un notario, un regulador o una plataforma, potencialmente se puede hacer de forma directa, a través de las matemáticas.\n\nVale la pena detenerse en la identidad de Nakamoto, o en su ausencia. Creó una tecnología que para 2024 gestionaba activos por valor de cientos de miles de millones de dólares, y nunca reveló su nombre. Algunos piensan que era una sola persona. Otros, que era un grupo. Algunos investigadores creen que Nakamoto murió hace mucho. No lo sabemos. Y eso, en sí mismo, es un manifiesto: una idea puede cambiar el mundo sin un autor con nombre y currículum.\n\n> Nakamoto resolvió un problema en el que los criptógrafos habían trabajado durante décadas: dinero digital sin un intermediario central. Nueve páginas. Anónimo. En plena crisis financiera. Este es uno de los documentos más importantes del siglo XXI.\n\nEl primer bloque de Bitcoin, el \"bloque génesis\", se minó el 3 de enero de 2009. En sus datos, Nakamoto incluyó el titular del Times de ese día: \"Chancellor on brink of second bailout for banks\". El canciller al borde de un segundo rescate a los bancos. No fue casualidad. Fue una declaración política.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["Bitcoin", "blockchain", "historia", "descentralización"], "x": 712.1, "y": 232.9, "angDeg": -45.0}, {"id": "buterin", "sceneIndex": 2, "type": "technology", "shortTitle": "Buterin", "era": "2013→2015", "lensWeight": {"chronology": 4, "trust": 2, "sovereignty": 2, "programmability": 5, "access": 2}, "title": "Buterin: blockchain como computadora", "insight": "A los 19 años, Buterin convirtió blockchain de un libro mayor especializado en una computadora universal. Los smart contracts son acuerdos en código que se ejecutan automáticamente sin intermediarios.", "thesis": "A los 19 años, Buterin convirtió blockchain de un libro mayor especializado en una computadora universal. Los smart contracts son acuerdos en código que se ejecutan automáticamente sin intermediarios.", "body": "## 19 años, un white paper y la siguiente pregunta\n\nBitcoin resolvió un problema concreto: dinero digital sin banco. Es un logro enorme. Pero para 2013 ya era evidente que la tecnología blockchain podía hacer algo más, si se la liberaba de las limitaciones de Bitcoin.\n\nEso lo entendió Vitalik Buterin, un programador canadiense-ruso de 19 años. Se hizo una pregunta simple: ¿y si blockchain no solo pudiera guardar información sobre transacciones, sino también ejecutar programas arbitrarios?\n\nBitcoin es un blockchain especializado. Puede hacer una sola cosa: transferir Bitcoin de una dirección a otra. Es potente, pero limitado. Buterin propuso crear un blockchain programable: una computadora descentralizada universal sobre la que se pudiera ejecutar cualquier programa.\n\nEscribió el Ethereum White Paper en 2013, sin un título universitario, sin apoyo institucional y sin inversores. Solo un white paper en internet. La idea fue tan convincente que atrajo a cientos de desarrolladores. Ethereum se lanzó en 2015 y, para la década de 2020, se convirtió en la segunda red cripto por capitalización después de Bitcoin.\n\n## Los smart contracts: acuerdos que no se pueden romper\n\nLa innovación central de Ethereum son los smart contracts. Son programas almacenados en blockchain y ejecutados automáticamente cuando se cumplen condiciones previamente definidas. \"Smart\" porque se ejecutan solos. \"Contracts\" porque describen acuerdos entre partes.\n\nPrimero, imagina cómo funciona un contrato normal. Alquilas un departamento. Tú y el dueño firman un acuerdo. Dice: \"El inquilino paga el primer día de cada mes. Si se retrasa, hay multa\". Pero eso es solo papel. Para que el contrato funcione, hace falta un sistema de cumplimiento: tribunales, abogados, oficiales de justicia. Es lento, caro y exige confianza en esas instituciones.\n\nUn smart contract funciona de otra manera. Las mismas condiciones, pero escritas en code. El primer día de cada mes, el smart contract transfiere automáticamente la renta desde la dirección del inquilino a la dirección del dueño. Si no hay pago, no hay acceso al departamento mediante la cerradura inteligente, cuyas llaves también están en el contrato. Las condiciones se cumplen automáticamente, sin juez y sin abogado. Code es ley.\n\nEjemplo del mundo real: quieres comprar un activo digital a un desconocido. Antes necesitabas un intermediario en el que ambos confiaran: un servicio de escrow, un exchange. Con un smart contract: tu dinero queda bloqueado en el contrato, tú recibes el activo y el contrato transfiere automáticamente el dinero al vendedor. Si no recibes el activo, el dinero vuelve a ti. Automáticamente. Matemáticamente. Sin intermediario.\n\nEso abrió posibilidades que parecían ciencia ficción: exchanges descentralizados donde nadie controla las operaciones. Préstamos sin bancos. Votaciones sin un contador central. Organizaciones sin CEO ni oficina.\n\n> A los 19 años, Buterin hizo por las finanzas lo que Berners-Lee hizo por la información en 1991: creó un protocolo abierto sobre el que cualquiera puede construir. Y, como Berners-Lee, renunció al monopolio sobre él.\n\nPara 2024, había decenas de miles de millones de dólares en activos bloqueados en smart contracts DeFi sobre Ethereum. Miles de aplicaciones funcionan sobre su base. Todo eso es consecuencia de una sola pregunta de un programador de 19 años: ¿y si blockchain puede hacer algo más que dinero?", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%2
