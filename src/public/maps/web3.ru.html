const CHAPTER_DATA = {"chapter": {"key": "web3", "title": "Блокчейн", "lede": "Доверие без посредника — математикой, а не властью. От проблемы двойной траты до TON.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=web3", "centralIdea": "Доверие без посредника — математикой, не властью", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Хронология", "accent": "#7dd3fc", "description": "От проблемы посредника через Накамото и Бутерина к TON."}, {"id": "trust", "label": "Доверие", "accent": "#fbbf24", "description": "Двойная трата и распределённый реестр: доверие без банка."}, {"id": "sovereignty", "label": "Суверенность", "accent": "#c084fc", "description": "Self-custody, «not your keys» и суверенная цифровая идентичность."}, {"id": "programmability", "label": "Программируемость", "accent": "#34d399", "description": "Бутерин и смарт-контракты: блокчейн как универсальный компьютер и DeFi."}, {"id": "access", "label": "Доступ", "accent": "#f87171", "description": "Кошельки и TON: блокчейн для миллиарда через существующую инфраструктуру."}], "nodes": [{"id": "intermediary", "sceneIndex": 0, "type": "power", "shortTitle": "Посредник", "era": "проблема", "lensWeight": {"chronology": 4, "trust": 5, "sovereignty": 2, "programmability": 1, "access": 2}, "title": "Проблема посредника: почему нам нужен банк", "insight": "Посредник существует потому, что цифровой файл можно скопировать — банк следит, чтобы одни деньги не потратили дважды. Блокчейн решает эту проблему математически, без посредника.", "thesis": "Посредник существует потому, что цифровой файл можно скопировать — банк следит, чтобы одни деньги не потратили дважды. Блокчейн решает эту проблему математически, без посредника.", "body": "## Простой вопрос с неочевидным ответом\n\nПредставь, что ты хочешь отправить деньги другу в другую страну. Казалось бы — в цифровую эпоху это должно быть просто. Открываешь приложение, вводишь сумму, нажимаешь кнопку. Но за этой кажущейся простотой — сложная система посредников.\n\nТы не можешь просто «отправить файл с деньгами». Потому что цифровой файл можно скопировать. Если бы у тебя был «цифровой доллар» в виде файла — ты мог бы отправить его одновременно двадцати людям, оставив себе оригинал. Это называется «проблема двойной траты» — и именно поэтому мы не можем передавать деньги напрямую через интернет, как передаём текст или фотографию.\n\nПоэтому нужен банк. Банк ведёт централизованный реестр: у тебя есть сто долларов. Ты отправляешь другу пятьдесят. Банк записывает: у тебя теперь пятьдесят, у друга — плюс пятьдесят. Банк контролирует, что одни и те же деньги не потрачены дважды. Это и есть его главная функция.\n\nПосредник доверия. Ты доверяешь банку, друг доверяет банку — и благодаря этому вы доверяете друг другу. Вся финансовая система — это сеть таких посредников: банки, платёжные системы, биржи, нотариусы, регуляторы. Они существуют потому, что незнакомые люди не доверяют друг другу напрямую.\n\n## Цена посредника\n\nЭта система работала веками. Но у неё есть фундаментальная проблема: посредник обладает властью. И эту власть он может использовать не только в твоих интересах.\n\nБанк может заморозить твой счёт — по требованию государства, из-за подозрения в нарушении правил, из-за технического сбоя. Платёжная система может отказать в транзакции — потому что получатель в «нежелательном» списке. Правительство может конфисковать активы — как это происходило в Кипре в 2013 году, когда банки заморозили депозиты и частично их списали. Биржа может закрыться, не выдав деньги клиентам — как FTX в 2022 году.\n\nПосредник, которому ты доверяешь сегодня, может использовать свою власть против тебя завтра. Не потому что злонамерен — а потому что у него есть мотивы, которые не совпадают с твоими.\n\nЭрик Хьюз сформулировал эту проблему в «Манифесте шифропанка» ещё в 1993 году: приватность в открытом обществе требует анонимной системы транзакций. Не системы, где посредник обещает хранить тайну — а системы, где математически невозможно её нарушить. Хьюз описал техническое задание. Решение появилось через пятнадцать лет.\n\n> Посредник доверия — это не злодей. Это архитектурная необходимость в мире без криптографии. Блокчейн убирает эту необходимость — заменяя доверие к человеку математической гарантией.\n\nПонять эту замену — ключ к пониманию всего, что произошло дальше. Если доверие можно выразить математически — не нужен ни банк, ни нотариус, ни регулятор. Нужен только код.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["blockchain", "trust", "decentralization", "finance"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "nakamoto", "sceneIndex": 1, "type": "technology", "shortTitle": "Накамото", "era": "2008", "lensWeight": {"chronology": 5, "trust": 5, "sovereignty": 3, "programmability": 2, "access": 2}, "title": "Накамото: девять страниц, изменивших мир", "insight": "Накамото в 2008-м решил проблему двойной траты без посредника: распределённый реестр у тысяч участников, который математически невозможно подделать. Девять страниц изменили финансы.", "thesis": "Накамото в 2008-м решил проблему двойной траты без посредника: распределённый реестр у тысяч участников, который математически невозможно подделать. Девять страниц изменили финансы.", "body": "## Октябрь 2008 года: мировой кризис и анонимный манифест\n\nОктябрь 2008 года. Разгар мирового финансового кризиса. Lehman Brothers только что обанкротился. Правительства срочно спасают банки деньгами налогоплательщиков. Доверие к финансовой системе на историческом минимуме.\n\nИменно в этот момент в рассылку небольшого сообщества криптографов приходит письмо. Отправитель — некто под именем Сатоши Накамото. Никакой аффилиации, никакого института, никакого настоящего имени. Письмо содержит ссылку на документ: «Bitcoin: A Peer-to-Peer Electronic Cash System». Девять страниц.\n\nЭто был ответ на вопрос Эрика Хьюза — анонимная система транзакций, построенная на математике. Накамото предложил решение проблемы двойной траты без центрального посредника.\n\nЛогика элегантна. Вместо того чтобы один банк вёл реестр — пусть реестр ведут тысячи участников одновременно. Каждая транзакция транслируется всем участникам сети. Они собирают транзакции в блоки, и каждый блок математически связан с предыдущим — отсюда «блок-цепь», blockchain. Изменить историю невозможно: для этого нужно было бы пересчитать весь блокчейн быстрее, чем тысячи участников добавляют новые блоки. Это требует больше вычислительной мощности, чем вся остальная сеть вместе взятая.\n\n## Три свойства, которых раньше не существовало вместе\n\nАндреас Антонопулос в «Mastering Bitcoin» объясняет: революционность Bitcoin не в каждом отдельном элементе — все компоненты существовали раньше. Революционность в их комбинации, создающей три свойства, которых раньше не существовало одновременно.\n\nДецентрализация. Нет единого сервера, нет единой точки отказа или контроля. Нет CEO Bitcoin, которого можно арестовать. Нет сервера Bitcoin, который можно отключить. Сеть работает, пока работает хотя бы один узел.\n\nПрозрачность. Все транзакции видны всем. История неизменна. Ты можешь проверить любую транзакцию, когда-либо произошедшую в сети Bitcoin — начиная с первого блока в январе 2009 года.\n\nОтсутствие разрешения. Никто не может запретить тебе участвовать в сети. Не нужно проходить KYC, не нужно разрешение банка, не нужна прописка в определённой стране. Кошелёк создаётся бесплатно за секунды.\n\nПол Виньи и Майкл Кейси в «The Truth Machine» описали суть точно: блокчейн — это машина доверия. Технология, которая позволяет двум незнакомым людям заключить сделку без посредника-гаранта. Это звучит как техническая деталь. Но последствия огромны: всё, что сегодня требует банка, нотариуса, регулятора или платформы — потенциально можно сделать напрямую, через математику.\n\nСтоит остановиться на личности Накамото — или её отсутствии. Он создал технологию, которая к 2024 году управляла активами на сотни миллиардов долларов — и никогда не раскрыл своего имени. Некоторые думают, что это один человек. Другие — что группа. Некоторые исследователи считают, что Накамото — давно умер. Мы не знаем. И это само по себе — манифест: идея может изменить мир без автора с именем и резюме.\n\n> Накамото решил задачу, над которой криптографы работали десятилетия: цифровые деньги без центрального посредника. Девять страниц. Аноним. В разгар финансового кризиса. Это один из самых важных документов XXI века.\n\nПервый блок Bitcoin — «блок генезиса» — был добыт 3 января 2009 года. В его данные Накамото включил заголовок газеты Times того дня: «Chancellor on brink of second bailout for banks». Канцлер на пороге второго спасения банков. Это было не случайно. Это было политическое заявление.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["bitcoin", "blockchain", "history", "decentralization"], "x": 712.1, "y": 232.9, "angDeg": -45.0}, {"id": "buterin", "sceneIndex": 2, "type": "technology", "shortTitle": "Бутерин", "era": "2013→2015", "lensWeight": {"chronology": 4, "trust": 2, "sovereignty": 2, "programmability": 5, "access": 2}, "title": "Бутерин: блокчейн как компьютер", "insight": "Бутерин в 19 лет превратил блокчейн из специализированного реестра в универсальный компьютер. Смарт-контракты — соглашения в коде, которые исполняются автоматически без посредника.", "thesis": "Бутерин в 19 лет превратил блокчейн из специализированного реестра в универсальный компьютер. Смарт-контракты — соглашения в коде, которые исполняются автоматически без посредника.", "body": "## 19 лет, белая бумага и следующий вопрос\n\nBitcoin решил конкретную задачу: цифровые деньги без банка. Это огромное достижение. Но уже к 2013 году стало очевидно, что блокчейн-технология может сделать нечто большее — если освободить её от ограничений Bitcoin.\n\nЭто понял 19-летний канадско-российский программист Виталик Бутерин. Он предложил простой вопрос: а что, если блокчейн может не только хранить информацию о транзакциях, но и выполнять произвольные программы?\n\nBitcoin — это специализированный блокчейн. Он умеет делать одно: передавать Bitcoin от одного адреса другому. Это мощно, но ограничено. Бутерин предложил создать программируемый блокчейн — универсальный децентрализованный компьютер, на котором можно запустить любую программу.\n\nОн написал Ethereum White Paper в 2013 году, не имея ни диплома, ни институциональной поддержки, ни инвесторов. Просто белая бумага в интернете. Идея была настолько убедительной, что привлекла сотни разработчиков. Ethereum запустился в 2015 году — и к 2020-м стал второй по капитализации криптосетью после Bitcoin.\n\n## Смарт-контракты: соглашения, которые нельзя нарушить\n\nЦентральная инновация Ethereum — смарт-контракты. Это программы, хранящиеся в блокчейне и выполняющиеся автоматически при наступлении заранее определённых условий. «Смарт» — потому что они исполняются сами. «Контракты» — потому что они описывают соглашения между сторонами.\n\nПрежде всего представь, как работает обычный контракт. Ты арендуешь квартиру. Вы с хозяином подписываете договор. В нём написано: «Арендатор платит первого числа каждого месяца. При просрочке — штраф». Но это просто бумага. Чтобы договор работал, нужна система принуждения к исполнению: суды, юристы, судебные приставы. Это медленно, дорого и требует доверия к этим институтам.\n\nСмарт-контракт работает иначе. Те же условия — но записанные в код. Первого числа каждого месяца смарт-контракт автоматически переводит арендную плату с адреса арендатора на адрес хозяина. Нет исполнения — нет доступа к квартире через умный замок, ключи от которого тоже в контракте. Условия выполняются автоматически, без суда и без юриста. Код — это закон.\n\nПример из реального мира: ты хочешь купить цифровой актив у незнакомца. Раньше нужен посредник, которому доверяете оба: эскроу-сервис, биржа. Со смарт-контрактом: твои деньги блокируются в контракте, ты получаешь актив, контракт автоматически переводит деньги продавцу. Если ты не получил актив — деньги возвращаются тебе. Автоматически. Математически. Без посредника.\n\nЭто открыло возможности, которые казались фантастикой: децентрализованные биржи, где никто не контролирует торги. Кредитование без банков. Голосование без центрального счётчика. Организации без CEO и офиса.\n\n> Бутерин в 19 лет сделал для финансов то, что Бернерс-Ли сделал для информации в 1991-м: создал открытый протокол, на котором каждый может строить. И, как Бернерс-Ли, отказался от монополии на него.\n\nK 2024 году на Ethereum заблокировано активов на десятки миллиардов долларов в смарт-контрактах DeFi. Тысячи приложений работают на его базе. Всё это — следствие одного вопроса 19-летнего программиста: а что, если блокчейн может делать не только деньги?", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["ethereum", "smart-contracts", "blockchain", "defi"], "x": 800.0, "y": 445.0, "angDeg": 0.0}, {"id": "keys", "sceneIndex": 3, "type": "privacy", "shortTitle": "Not your keys", "era": "принцип", "lensWeight": {"chronology": 2, "trust": 3, "sovereignty": 5, "programmability": 1, "access": 3}, "title": "Not your keys — not your coins: self-custody", "insight": "Not your keys — not your coins: хранение активов на бирже означает, что биржа ими владеет. Self-custody — приватный ключ у тебя — это единственная настоящая финансовая суверенность.", "thesis": "Not your keys — not your coins: хранение активов на бирже означает, что биржа ими владеет. Self-custody — приватный ключ у тебя — это единственная настоящая финансовая суверенность.", "body": "## FTX, Mt. Gox и урок, который пришлось повторить\n\nНоябрь 2022 года. FTX — одна из крупнейших криптобирж мира, оцениваемая в 32 миллиарда долларов. Её основатель Сэм Бэнкман-Фрид появляется на обложках Forbes и Time, выступает в Конгрессе США, жертвует миллионы на политические кампании. Всё выглядит солидно.\n\nЗатем за несколько дней биржа рухнула. Выяснилось, что средства клиентов использовались для рискованных ставок. Миллионы людей потеряли доступ к своим активам. Бэнкман-Фрид был арестован и осуждён.\n\nЭто не первый раз. В 2014 году взломали Mt. Gox — тогда крупнейшую биржу в мире, через которую проходило 70% всех транзакций Bitcoin. 850 000 биткоинов исчезли. В 2019 году умер основатель биржи QuadrigaCX — единственный человек, знавший пароли. 190 миллионов долларов клиентских средств оказались заперты навсегда.\n\nКаждый раз паттерн один: люди хранили активы на бирже, доверяя ей. Биржа была посредником — точно так же, как банк. И точно так же, как банк, она могла использовать эту власть против них.\n\nВ криптосообществе давно существует фраза, ставшая аксиомой: «Not your keys — not your coins». Не твои ключи — не твои монеты.\n\n## Что такое приватный ключ и почему это важно\n\nВ блокчейне активы контролируются приватным ключом. Это длинная строка символов — что-то вроде очень сложного пароля, математически связанного с адресом кошелька. Тот, у кого есть приватный ключ, контролирует всё на этом адресе. Без него — доступа нет.\n\nКогда ты держишь активы на бирже — приватный ключ у биржи. Ты видишь баланс на экране, но это обещание биржи, не математическая гарантия. Биржа может заморозить вывод. Может обанкротиться. Может оказаться мошеннической.\n\nSelf-custody — самостоятельное хранение — означает: приватный ключ у тебя. Никакая компания, никакой регулятор, никакой хакер, взломавший чужой сервер, не может добраться до твоих активов без твоего ключа. Только ты.\n\nЭто звучит технически — но это фундаментальный принцип финансового суверенитета. Впервые в истории обычный человек может хранить значительные ценности без посредника — с гарантией, которую даёт математика, а не государство или корпорация.\n\nМетодов хранения несколько. Seed-фраза из 12 или 24 слов — человекочитаемая версия приватного ключа. Запишешь на бумаге и спрячешь в надёжном месте — активы в безопасности, даже если все твои устройства сгорят. Аппаратные кошельки — Ledger, Trezor — хранят приватный ключ на физическом устройстве, изолированном от интернета. Даже если твой компьютер заражён вирусом — ключ недоступен. Программные кошельки — MetaMask, Rabby Wallet, Tonkeeper — удобнее, но хранят ключи на устройстве с интернетом, что требует большей осторожности.\n\n> «Not your keys — not your coins» — это не паранойя. Это математический факт. FTX, Mt. Gox, QuadrigaCX — это не исключения. Это предсказуемые следствия хранения ценностей у посредника.\n\nПонимание разницы между кастодиальным и некастодиальным хранением — это не техническая деталь. Это первый и самый важный практический урок Web3. Владеть криптовалютой на бирже — это как хранить золото в чужом сейфе. Удобно. Пока не окажется, что сейфа нет.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["self-custody", "wallet", "security", "blockchain"], "x": 712.1, "y": 657.1, "angDeg": 45.0}, {"id": "wallets", "sceneIndex": 4, "type": "media", "shortTitle": "Кошельки", "era": "2009→2024", "lensWeight": {"chronology": 4, "trust": 2, "sovereignty": 3, "programmability": 2, "access": 5}, "title": "Эволюция кошельков: от текстового файла до Telegram", "insight": "Кошельки прошли путь от текстового файла в 2009-м до кнопки в Telegram в 2024-м. Когда отправить крипту так же просто, как сообщение — масштаб adoption меняется кардинально.", "thesis": "Кошельки прошли путь от текстового файла в 2009-м до кнопки в Telegram в 2024-м. Когда отправить крипту так же просто, как сообщение — масштаб adoption меняется кардинально.", "body": "## Путь от «только для технарей» до «для всех»\n\nИстория криптокошельков — это история постепенного снижения барьера входа. От инструмента для математиков и программистов до кнопки в мессенджере, которым ты уже пользуешься.\n\nПервые пользователи Bitcoin — 2009–2011 годы — хранили приватные ключи буквально в текстовых файлах на жёстком диске. Никакого интерфейса. Никаких подсказок. Ты просто работал с командной строкой и надеялся не потерять файл. Многие теряли.\n\nСамая известная история — программист Джеймс Хоуэллс из Уэльса. В 2013 году он случайно выбросил жёсткий диск с 8000 биткоинами при генеральной уборке. По текущим ценам это сотни миллионов долларов. Диск до сих пор лежит на городской свалке в Ньюпорте. Хоуэллс годами пытается получить разрешение на её раскопку — власти отказывают из экологических соображений.\n\nЭто не курьёз. Это иллюстрация того, каким был ранний Web3: технически революционным, но практически недоступным для большинства людей.\n\n## Программные кошельки: первая революция удобства\n\nMetaMask — расширение для браузера, запущенное в 2016 году — стало первым кошельком, который нормальный человек мог использовать без технического образования. Ты устанавливаешь расширение в Chrome, нажимаешь «Создать кошелёк», получаешь seed-фразу из 12 слов, записываешь её, подтверждаешь — готово. Весь процесс занимает три минуты.\n\nSeed-фраза — это человекочитаемая версия твоего приватного ключа. Двенадцать обычных слов: например, «river cloud magic forest apple sunset...» Эти двенадцать слов математически связаны с твоим кошельком. Запишешь на бумаге, спрячешь в надёжном месте — твои активы в безопасности, даже если компьютер сгорит, телефон сломается, MetaMask закроется как компания. Seed-фраза — это резервная копия, которая работает всегда.\n\nMetaMask открыл доступ к Ethereum для миллионов людей. После него появились другие: Trust Wallet для мобильных устройств, Phantom для Solana, Rabby Wallet с удобным интерфейсом для DeFi — он показывает симуляцию транзакции до её подписи, что критически важно для безопасности в мире, где мошенники постоянно ищут способы обмануть пользователей.\n\n## TON и Telegram: кошелёк внутри мессенджера\n\nTonkeeper и Telegram Wallet сделали следующий шаг, который казался очевидным только задним числом: зачем требовать от пользователя устанавливать отдельное приложение, если можно встроить кошелёк в приложение, которым он уже пользуется каждый день?\n\nTelegram Wallet — это кошелёк прямо внутри Telegram. Если ты хочешь отправить TON другу — ты отправляешь его так же, как отправляешь сообщение. Открываешь чат, нажимаешь «прикрепить», выбираешь «Transfer». Адреса, приватные ключи, seed-фразы — всё это работает под капотом. Снаружи это просто «отправить деньги в мессенджере».\n\nЭто принципиально другой уровень adoption. Не «установите криптокошелёк» — а «нажмите кнопку в приложении, которое у вас уже есть». Именно так миллиарды обычных людей могут впервые взаимодействовать с блокчейном, не осознавая, что они это делают.\n\nРазличие между кастодиальным и некастодиальным кошельком остаётся важным. Telegram Wallet в базовом варианте — кастодиальный: ключи хранятся на серверах Telegram. Это удобнее, но воспроизводит логику банка. Tonkeeper — некастодиальный: ключи у тебя. Это сложнее, но даёт настоящую собственность. Для начала работы — Telegram Wallet. Для серьёзных сумм — Tonkeeper или аппаратный кошелёк.\n\n> Путь от командной строки в 2009-м до кнопки в Telegram в 2024-м — это история снижения барьера до нуля. Когда отправить криптовалюту так же просто, как отправить сообщение — масштаб adoption меняется кардинально.\n\nАппаратные кошельки — Ledger и Trezor — остаются стандартом для хранения серьёзных сумм. Приватный ключ хранится на физическом устройстве, изолированном от интернета. Даже если твой компьютер заражён вирусом-кейлоггером — злоумышленник не получит ключ. Для входа нужно физически нажать кнопку на устройстве.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["wallet", "self-custody", "telegram", "ton"], "x": 500.0, "y": 745.0, "angDeg": 90.0}, {"id": "defi", "sceneIndex": 5, "type": "economy", "shortTitle": "DeFi", "era": "2020→", "lensWeight": {"chronology": 3, "trust": 3, "sovereignty": 3, "programmability": 5, "access": 4}, "title": "DeFi: финансы без финансовых институтов", "insight": "DeFi заменяет банки и брокеров смарт-контрактами: кредиты, обмен, доход на активы — без KYC, без одобрения, 24/7, из любой точки мира. 1,4 млрд людей без банковского счёта получают доступ.", "thesis": "DeFi заменяет банки и брокеров смарт-контрактами: кредиты, обмен, доход на активы — без KYC, без одобрения, 24/7, из любой точки мира. 1,4 млрд людей без банковского счёта получают доступ.", "body": "## Что такое DeFi и зачем он нужен\n\nDeFi — Decentralized Finance, децентрализованные финансы. Это набор финансовых сервисов, работающих на блокчейне через смарт-контракты — без банков, брокеров и других финансовых посредников.\n\nЧтобы понять, что здесь революционного, нужно вспомнить, как работают традиционные финансы. Хочешь получить кредит — идёшь в банк, проходишь KYC-проверку (Know Your Customer — верификацию личности), предоставляешь документы о доходах, ждёшь неделю решения. Банк устанавливает процентную ставку, которую считает нужной. Хочешь торговать акциями — открываешь счёт у брокера, снова KYC, снова ожидание. Хочешь заработать на сбережениях — банк предлагает 2% годовых, оставляя себе маржу от 8%.\n\nВо всех этих сценариях банк или брокер — привратник. Он решает, кому дать доступ, на каких условиях, за какое вознаграждение. Люди без кредитной истории, без прописки в нужной стране, без достаточного дохода — отрезаны от базовых финансовых сервисов. По данным Всемирного банка, 1,4 миллиарда взрослых людей в мире не имеют банковского счёта.\n\n## Uniswap, Aave, Compound: как это работает\n\nDeFi заменяет привратника математикой.\n\nUniswap — децентрализованная биржа. На традиционной бирже есть книга заявок: покупатели и продавцы выставляют ордера, биржа их сводит. На Uniswap нет книги заявок и нет компании-оператора. Вместо этого — пул ликвидности: пользователи блокируют пары токенов в смарт-контракте, получая долю от комиссий. Когда ты хочешь обменять один токен на другой — смарт-контракт автоматически рассчитывает цену по алгоритму и проводит обмен. Никакого KYC. Никакого одобрения. Никаких рабочих часов.\n\nAave — протокол кредитования. Ты можешь заблокировать токены как залог и получить кредит в другом токене. Или, наоборот, предоставить токены в пул и получать проценты. Ставки определяются спросом и предложением автоматически — не банком. Процесс занимает минуты, работает 24/7, доступен из любой точки мира с интернетом.\n\nCompound работает по схожему принципу: предоставляешь активы — они автоматически работают и приносят доход. Никакого «положить на депозит под 2% годовых». Ставки меняются в реальном времени в зависимости от рыночного спроса.\n\nЭти протоколы не имеют офисов, не нанимают сотрудников по обработке заявок, не несут regulatory overhead традиционных банков. Поэтому часть этой экономии возвращается пользователям в виде более высоких ставок для кредиторов и более низких — для заёмщиков.\n\nДон и Алекс Тапскотты в «Blockchain Revolution» называют это «финансовым интернетом»: как интернет демократизировал доступ к информации, DeFi демократизирует доступ к финансовым сервисам. Житель Нигерии получает те же инструменты, что хедж-фонд в Нью-Йорке.\n\n> DeFi — это не только удобство. Это политическое заявление: финансовые услуги как открытый протокол, доступный всем, а не привилегия клиентов определённых институтов.\n\nРиски реальны: смарт-контракты содержат баги, протоколы взламывают, рынки волатильны, регуляторная среда нестабильна. DeFi — не замена традиционным финансам для всех случаев жизни. Но принцип революционен. И он работает.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["defi", "smart-contracts", "finance", "blockchain"], "x": 287.9, "y": 657.1, "angDeg": 135.0}, {"id": "identity", "sceneIndex": 6, "type": "privacy", "shortTitle": "Идентичность", "era": "Web3", "lensWeight": {"chronology": 2, "trust": 2, "sovereignty": 5, "programmability": 3, "access": 2}, "title": "Цифровая идентичность: суверенное «я» в Web3", "insight": "В Web2 идентичность принадлежит платформе и может быть удалена. В Web3 — ENS, NFT, on-chain репутация — это суверенная цифровая личность, которую математически невозможно конфисковать.", "thesis": "В Web2 идентичность принадлежит платформе и может быть удалена. В Web3 — ENS, NFT, on-chain репутация — это суверенная цифровая личность, которую математически невозможно конфисковать.", "body": "## Проблема идентичности в Web2\n\nВспомни Бодрийяра из предыдущей главы: в соцсетях люди строят симулякры себя — образы, которые заменяют реальность. Instagram-версия жизни, красивее и счастливее оригинала. Но у этого симулякра есть ещё одна проблема, которую Бодрийяр не мог предвидеть: он принадлежит платформе.\n\nИнстаграм может удалить твой аккаунт с миллионом подписчиков — в любой момент, без объяснений. Twitter может забанить. TikTok может заблокировать. Всё, что ты строил годами — подписчики, репутация, история — хранится на их серверах и принадлежит им.\n\nКрис Диксон в «Why Decentralization Matters» описал это как ключевую проблему платформ Web2: они проходят через предсказуемый цикл. Сначала привлекают пользователей и разработчиков щедрыми условиями. Потом, набрав критическую массу, меняют правила в свою пользу. Разработчики, которые строили на Facebook в 2007-м, к 2012-му обнаружили, что платформа стала конкурентом. Создатели, которые строили аудиторию в Twitter, к 2022-му обнаружили, что политика модерации изменилась без предупреждения.\n\nПроблема не в злом умысле. Проблема архитектурная: твоя идентичность хранится на чужом сервере.\n\n## ENS, NFT-аватары и on-chain репутация\n\nWeb3 предлагает другую модель — суверенную цифровую идентичность.\n\nENS — Ethereum Name Service — это система имён для блокчейна. Вместо адреса типа «0x742d35Cc6634C0532...» ты покупаешь имя «luminara.eth» и привязываешь его к своему кошельку. Это работает как домен в интернете — только без возможности отобрать. Никакой компании, которая могла бы заблокировать твоё имя. Никакого сервера, который могла бы выключить. Пока ты платишь за продление — оно твоё. И оно переносится между платформами: одно имя, один адрес, везде.\n\nNFT-аватары стали первым массовым проявлением Web3-идентичности. CryptoPunks — 10 000 пиксельных персонажей, запущенных в 2017 году — стали культурным феноменом. Bored Ape Yacht Club создал сообщество: владелец Bored Ape получал доступ к закрытым мероприятиям, IP-права на своего персонажа, принадлежность к определённой культуре. Это не просто картинки. Это членские билеты, доказательства принадлежности, способы сигнализировать о ценностях.\n\nНо самое интересное — это то, что будет дальше. On-chain репутация — это профиль, который автоматически отражает твою историю в блокчейне. Какие протоколы ты использовал, в каких голосованиях участвовал, какие проекты поддерживал, насколько надёжным оказался как участник сделок. Эту репутацию нельзя подделать — она записана в неизменяемый реестр и верифицируется математически. И она принадлежит тебе, а не платформе.\n\nПсевдонимная идентичность в Web3 добавляет ещё одно измерение. Сатоши Накамото изменил мир, оставаясь анонимом. В Web3 ты можешь строить значимую репутацию под именем кошелька, не раскрывая настоящего имени. Твои действия в блокчейне — это и есть твоя идентичность. Не биография. Не резюме. Не фотографии. Действия.\n\n> В Web2 твоя идентичность — это то, что о тебе решила платформа. В Web3 — это то, что ты сделал, записанное в неизменяемый реестр. Симулякр для аудитории против суверенной цифровой личности.\n\nЭто не завтра и не для всех уже сегодня. Но направление очевидно: интернет движется к модели, где идентичность принадлежит человеку, а не платформе. И TON — один из главных претендентов на то, чтобы сделать это доступным для миллиарда пользователей Telegram.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["identity", "self-custody", "nft", "web3"], "x": 200.0, "y": 445.0, "angDeg": 180.0}, {"id": "ton", "sceneIndex": 7, "type": "power", "shortTitle": "TON", "era": "→миллиард", "lensWeight": {"chronology": 4, "trust": 2, "sovereignty": 2, "programmability": 3, "access": 5}, "title": "TON: блокчейн для миллиарда", "insight": "TON спроектирован для миллиарда пользователей через Telegram: бесконечное шардирование, мгновенные транзакции, встроенный в мессенджер. Adoption через существующую инфраструктуру, а не убеждение.", "thesis": "TON спроектирован для миллиарда пользователей через Telegram: бесконечное шардирование, мгновенные транзакции, встроенный в мессенджер. Adoption через существующую инфраструктуру, а не убеждение.", "body": "## Проблема масштаба, которую не решил Ethereum\n\nК 2017 году Ethereum доказал концепцию: смарт-контракты работают, децентрализованные приложения возможны. Но появилась новая проблема — масштаб.\n\nEthereum в базовой версии обрабатывает около 15 транзакций в секунду. Для сравнения: Visa обрабатывает в среднем 1700 транзакций в секунду, а в пиковые периоды — до 24 000. Когда в сети Ethereum появлялось популярное приложение — например, игра CryptoKitties в 2017 году — сеть буквально перегружалась. Пользователи ждали часы, а комиссии вырастали до десятков долларов за одну транзакцию. Блокчейн для всех оказался слишком медленным для всех.\n\nКроме того, использование Ethereum было технически сложным. Нужно установить кошелёк. Купить ETH специально для оплаты комиссий. Разобраться в интерфейсах, которые проектировались программистами для программистов. Для среднестатистического пользователя Telegram — слишком высокий порог.\n\n## TON: архитектура, спроектированная для масштаба\n\nВ 2018–2019 годах братья Дуровы — Павел и Николай — работали над TON: The Open Network. Николай Дуров — один из сильнейших математиков и программистов своего поколения, создатель алгоритмов ВКонтакте и Telegram. Он спроектировал TON с нуля, имея в виду конкретную цель: система должна работать для миллиарда пользователей.\n\nTON Whitepaper описывает несколько ключевых технических решений, отличающих его от Bitcoin и Ethereum.\n\nБесконечное шардирование. Основная проблема масштабирования блокчейна: чем больше транзакций, тем медленнее работает сеть, потому что каждый узел должен обрабатывать всё. TON решает это через автоматическое шардирование: сеть делится на параллельные цепочки (шарды) по мере роста нагрузки — как дорога, которая автоматически добавляет полосы в час пик. Теоретически это позволяет масштабироваться без потери скорости.\n\nМгновенные транзакции. В Bitcoin транзакция подтверждается за 10–60 минут. В Ethereum — за несколько минут. В TON механизм оптимистичных подтверждений позволяет обрабатывать транзакции за секунды. Для платёжного сервиса это принципиально.\n\nВстроенные сервисы. В Bitcoin и Ethereum DNS (система доменных имён), хранилище файлов и другие сервисы — внешние надстройки. В TON они встроены в протокол. Это упрощает разработку приложений и снижает зависимость от внешних сервисов.\n\n## Telegram как точка входа\n\nНо самое важное в TON — контекст. Это не просто ещё один блокчейн, конкурирующий с Ethereum. Это финансовый слой для Telegram — мессенджера с 950 миллионами пользователей.\n\nСтратегия принципиально отличается от конкурентов. Bitcoin и Ethereum строили экосистему с нуля: привлеки пользователей, убеди их установить кошелёк, объясни, что такое блокчейн. TON встраивается в существующую инфраструктуру: у тебя уже есть Telegram, у тебя уже есть контакты, у тебя уже есть привычка использовать приложение каждый день. Просто добавь кошелёк — и всё, что тебе нужно для базовых криптотранзакций, уже здесь.\n\nДжаред Ларни в эссе «Own the Internet» описывает будущее, где пользователи владеют частью платформ через токены. TON движется именно в этом направлении: пользователи Telegram — потенциальные участники TON-экономики, а не просто потребители сервиса.\n\nПуть TON был непростым: первоначальный проект заблокировала SEC в 2020 году. Дуровы закрыли проект. Но сообщество продолжило развитие под именем TON Foundation. К 2024 году TON стал одним из самых быстро растущих блокчейнов — с активным развитием DeFi, NFT-экосистемы и мини-приложений внутри Telegram.\n\n> TON решает не просто техническую задачу масштаба. Он решает задачу adoption: как сделать блокчейн доступным для людей, которые никогда не слышали о блокчейне — потому что он встроен в приложение, которым они уже пользуются.\n\nЭто и есть следующий фронтир: не убеждать людей перейти на новые технологии, а встраивать новые технологии в их существующую жизнь. Незаметно. Без барьеров. Без лекций о приватных ключах.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["ton", "telegram", "blockchain", "scalability"], "x": 287.9, "y": 232.9, "angDeg": 225.0}], "edges": [{"from": "intermediary", "to": "nakamoto", "label": "проблему решили без посредника", "lenses": ["chronology", "trust"]}, {"from": "nakamoto", "to": "buterin", "label": "от реестра к компьютеру", "lenses": ["chronology", "programmability"]}, {"from": "buterin", "to": "defi", "label": "смарт-контракты заменяют банки", "lenses": ["programmability", "access"]}, {"from": "nakamoto", "to": "keys", "label": "суверенность требует ключей", "lenses": ["trust", "sovereignty"]}, {"from": "keys", "to": "wallets", "label": "ключи спрятали в кошелёк", "lenses": ["sovereignty", "access"]}, {"from": "wallets", "to": "ton", "label": "отправить крипту как сообщение", "lenses": ["access", "chronology"]}, {"from": "keys", "to": "identity", "label": "суверенное «я» неотчуждаемо", "lenses": ["sovereignty"]}, {"from": "buterin", "to": "identity", "label": "личность программируема", "lenses": ["programmability", "sovereignty"]}, {"from": "defi", "to": "ton", "label": "доступ для 1,4 млрд без банка", "lenses": ["access", "economy"]}, {"from": "intermediary", "to": "defi", "label": "финансы без институтов", "lenses": ["trust", "programmability"]}, {"from": "wallets", "to": "defi", "label": "кошелёк — вход в DeFi", "lenses": ["access", "programmability"]}]};;

    <div><p class="eyebrow">Luminara · Atlas</p><h1 id="app-title">Блокчейн</h1></div>
    <p class="chapter-lede">Доверие без посредника — математикой, а не властью. От проблемы двойной траты до TON.</p>
    <div class="rail-rule"></div>
    <div><p class="section-h" data-ui="section_lenses">Линзы интерпретации</p><div class="lens-group" style="margin-top:9px"></div><p class="lens-desc" style="margin-top:9px"></p></div>
    <div class="rail-rule"></div>
    <div class="progress-box"></div>
    <div><p class="section-h" data-ui="section_scenes">Сцены главы</p><nav class="node-list" style="margin-top:6px"></nav></div>
  </section>
  <section class="map-stage">
    <svg class="system-map" viewBox="0 0 1120 940" role="img" preserveAspectRatio="xMidYMid meet">
      <title>До интернета</title><desc>Информация становится властью</desc>
    </svg>
    <div class="empty-state" hidden></div>
  </section>
  <aside class="detail-panel"></aside>
</main>
<dialog class="scene-dialog"></dialog>
<script>
// --- theme from URL (?theme=light|dark & ?accent=oklch/hex) — mirrors app ---
(function(){
  try{
    var p=new URLSearchParams(location.search);
    var theme=p.get("theme"); var accent=p.get("accent");
    if(theme==="light") document.documentElement.setAttribute("data-theme","light");
    else if(theme==="dark") document.documentElement.removeAttribute("data-theme");
    if(accent){ document.documentElement.style.setProperty("--accent", decodeURIComponent(accent)); }
    // sun ink: readable on core
    document.documentElement.style.setProperty("--sun-ink", theme==="light" ? "#fff" : "#fff");
  }catch(e){}
})();
// live updates from parent (optional): postMessage {theme, accent}
window.addEventListener("message",function(ev){
  var m=ev.data||{};
  if(m.theme==="light") document.documentElement.setAttribute("data-theme","light");
  if(m.theme==="dark") document.documentElement.removeAttribute("data-theme");
  if(m.accent) document.documentElement.style.setProperty("--accent", m.accent);
  if(typeof renderAll==="function") renderAll();
});

const state={lens:"chronology",selected:null,visited:new Set(),entered:false};
const byId=id=>CHAPTER_DATA.nodes.find(n=>n.id===id);
const SVGNS="http://www.w3.org/2000/svg";
const el=(t,a)=>{const e=document.createElementNS(SVGNS,t);for(const k in(a||{}))e.setAttribute(k,a[k]);return e;};
function typeColor(t){return{power:"var(--power)",technology:"var(--technology)",media:"var(--media)",privacy:"var(--privacy)",economy:"var(--economy)"}[t]||"var(--accent)";}
function typeLabel(t){var U=window.__UI_LOC||{};var k="type_"+t;if(U[k])return U[k];return{power:"Власть",technology:"Технологии",media:"Медиа",privacy:"Приватность",economy:"Экономика"}[t]||"Идея";}
function lensById(id){return CHAPTER_DATA.lenses.find(l=>l.id===id);}
function edgeActive(e){return e.lenses.includes(state.lens);}
function nodeWeight(n){return(n.lensWeight&&n.lensWeight[state.lens])||0;}
const CX=CHAPTER_DATA.chapter.centerX||500, CY=CHAPTER_DATA.chapter.centerY||445, RING=CHAPTER_DATA.chapter.ring||300;

function buildLenses(){
  const w=document.querySelector(".lens-group");w.innerHTML="";
  CHAPTER_DATA.lenses.forEach(l=>{const b=document.createElement("button");b.className="lens-btn";b.type="button";
    b.setAttribute("aria-pressed",String(l.id===state.lens));b.style.setProperty("--dot",l.accent);
    b.innerHTML=`<span class="lens-dot"></span>${l.label}`;b.addEventListener("click",()=>setLens(l.id));w.appendChild(b);});
}
function setLens(id){state.lens=id;const l=lensById(id);
  const d=document.querySelector(".lens-desc");if(d)d.textContent=l?l.description:"";
  document.querySelectorAll(".lens-btn").forEach((b,i)=>b.setAttribute("aria-pressed",String(CHAPTER_DATA.lenses[i].id===id)));
  renderAll();}

function curve(a,b){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;const dx=mx-CX,dy=my-CY,len=Math.hypot(dx,dy)||1;const bow=26;
  return `M ${a.x} ${a.y} Q ${mx+(dx/len)*bow} ${my+(dy/len)*bow} ${b.x} ${b.y}`;}

function defs(){
  const d=el("defs");
  const mk=(id,color)=>{color=lensById(state.lens)?lensById(state.lens).accent:"#888";const m=el("marker",{id,viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"});
    const p=el("path",{d:"M0 0 L10 5 L0 10 z",fill:color});m.appendChild(p);return m;};
  d.appendChild(mk("arrow-active", "var(--dot-fallback)"));
  var sg=el("radialGradient",{id:"sunGrad",cx:"50%",cy:"42%",r:"60%"});
  var css=getComputedStyle(document.documentElement);
  sg.appendChild(el("stop",{offset:"0%","stop-color":css.getPropertyValue("--bg-elev")||"#20264a"}));
  sg.appendChild(el("stop",{offset:"100%","stop-color":css.getPropertyValue("--bg")||"#0c1230"}));
  d.appendChild(sg);
  return d;
}

function renderMap(){
  const svg=document.querySelector(".system-map");if(!svg)return;
  [...svg.querySelectorAll("defs,g,.ring,.ring-tick,.era-label,.spoke")].forEach(n=>n.remove());
  svg.appendChild(defs());
  // rings
  const gDeco=el("g",{});
  [RING*0.55,RING].forEach(r=>gDeco.appendChild(el("circle",{class:"ring",cx:CX,cy:CY,r})));
  svg.appendChild(gDeco);
  // spokes + chronology era labels around outer ring
  const gSpoke=el("g",{});
  CHAPTER_DATA.nodes.forEach(n=>{
    gSpoke.appendChild(el("line",{class:"spoke",x1:CX,y1:CY,x2:n.x,y2:n.y}));
  });
  svg.appendChild(gSpoke);

  // edges (with directional arrows on active)
  const gE=el("g",{});
  CHAPTER_DATA.edges.forEach(e=>{const a=byId(e.from),b=byId(e.to);if(!a||!b)return;
    const active=edgeActive(e);const g=el("g",{class:"edge"+(active?" active":"")});
    if(active)g.style.setProperty("--dot",lensById(state.lens).accent);
    const d=curve(a,b);const p=el("path",{d});
    // approximate length for draw animation
    const len=Math.round(Math.hypot(b.x-a.x,b.y-a.y)*1.15);
    p.style.setProperty("--len",len);
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const lb=el("text",{class:"edge-label",x:mx,y:my-5,"text-anchor":"middle"});lb.textContent=e.label;
    g.appendChild(p);g.appendChild(lb);gE.appendChild(g);});
  svg.appendChild(gE);

  // center (breathing, lens-tinted ring)
  const gC=el("g",{});
  gC.style.setProperty("--dot", lensById(state.lens)?lensById(state.lens).accent:"#b7791f");
  gC.appendChild(el("circle",{class:"sun-glow",cx:CX,cy:CY,r:100}));
  gC.appendChild(el("circle",{class:"sun-ring",cx:CX,cy:CY,r:82}));
  gC.appendChild(el("circle",{class:"sun-core",cx:CX,cy:CY,r:70}));/*no sublabel*/
  
  wrapText(gC,CHAPTER_DATA.chapter.centralIdea,CX,CY+2,120,"sun-t1",17);
  svg.appendChild(gC);

  // nodes with smart outward labels + era
  const gN=el("g",{});
  CHAPTER_DATA.nodes.forEach((n,i)=>{
    const g=el("g",{class:"node"+(state.selected===n.id?" selected":""),tabindex:"0",role:"button","aria-label":`${n.sceneIndex+1}. ${n.title} (${n.era||""})`});
    g.style.setProperty("--dot",typeColor(n.type));
    g.style.setProperty("--ox",n.x+"px");g.style.setProperty("--oy",n.y+"px");
    if(!state.entered) g.style.setProperty("--delay",(0.15+i*0.06)+"s"); else g.style.animation="none",g.style.opacity="1";
    if(state.selected){const linked=CHAPTER_DATA.edges.some(e=>(e.from===state.selected&&e.to===n.id)||(e.to===state.selected&&e.from===n.id));
      if(n.id!==state.selected&&!linked)g.classList.add("dim");}
    else if(nodeWeight(n)<=1){g.classList.add("dim");}
    g.appendChild(el("circle",{class:"planet-glow",cx:n.x,cy:n.y,r:34}));
    var pl=el("circle",{class:"planet",cx:n.x,cy:n.y,r:26});pl.style.fill="color-mix(in oklch, "+typeColor(n.type)+" 20%, var(--bg-elev))";g.appendChild(pl);
    const num=el("text",{class:"num",x:n.x,y:n.y});num.textContent=String(n.sceneIndex+1);g.appendChild(num);

    // smart label placement: outward along the radius from center
    const dx=n.x-CX,dy=n.y-CY,len=Math.hypot(dx,dy)||1;
    const ux=dx/len,uy=dy/len;
    const lx=n.x+ux*46, ly=n.y+uy*46;
    // anchor by horizontal side
    const anchor = ux>0.25?"start":(ux<-0.25?"end":"middle");
    const era=el("text",{class:"era",x:lx,y:ly-30,"text-anchor":anchor});era.textContent=n.era||"";g.appendChild(era);
    const kick=el("text",{class:"kicker",x:lx,y:ly-14,"text-anchor":anchor});kick.textContent=typeLabel(n.type);g.appendChild(kick);
    wrapTextAnchored(g,n.shortTitle,lx,ly+20,180,"cap",18,anchor);

    g.addEventListener("click",()=>selectNode(n.id));
    g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();selectNode(n.id);}});
    gN.appendChild(g);
  });
  svg.appendChild(gN);
  state.entered=true;
}
function wrapText(parent,text,x,y,maxw,cls,fs){wrapTextAnchored(parent,text,x,y,maxw,cls,fs,"middle");}
function wrapTextAnchored(parent,text,x,y,maxw,cls,fs,anchor){
  const words=String(text).split(/\s+/);const lines=[];let line="";
  const approx=s=>s.length*(fs*0.56);
  words.forEach(w=>{const t=line?line+" "+w:w;if(approx(t)>maxw&&line){lines.push(line);line=w;}else line=t;});
  if(line)lines.push(line);const total=(lines.length-1)*(fs+2);
  lines.forEach((ln,i)=>{const t=el("text",{class:cls,x,y:y-total/2+i*(fs+2),"text-anchor":anchor});t.textContent=ln;parent.appendChild(t);});
}

function renderNodeList(){const nav=document.querySelector(".node-list");if(!nav)return;nav.innerHTML="";
  CHAPTER_DATA.nodes.slice().sort((a,b)=>a.sceneIndex-b.sceneIndex).forEach(n=>{
    const b=document.createElement("button");b.type="button";b.setAttribute("aria-current",String(state.selected===n.id));b.style.setProperty("--dot",typeColor(n.type));
    b.innerHTML=`<span class="node-idx">${String(n.sceneIndex+1).padStart(2,"0")}</span><span>${n.shortTitle}</span>`;
    b.addEventListener("click",()=>selectNode(n.id));nav.appendChild(b);});}
function renderProgress(){const box=document.querySelector(".progress-box");if(!box)return;
  const total=CHAPTER_DATA.nodes.length,seen=state.visited.size;
  box.innerHTML=`${((window.__UI_LOC&&window.__UI_LOC.progress_studied)||"Изучено")} ${seen}/${total}<div class="progress-bar"><div class="progress-fill" style="width:${Math.round(seen/total*100)}%"></div></div>`;}
function firstSentence(txt){return String(txt).replace(/^##[^\n]*\n+/,"").split(/(?<=[.!?])\s/)[0]||"";}
function renderDetail(){const p=document.querySelector(".detail-panel");if(!p)return;
  if(!state.selected){p.innerHTML=`<p class="eyebrow">${(window.__UI_LOC&&window.__UI_LOC.detail_label)||"Деталь"}</p><p class="detail-empty">${(window.__UI_LOC&&window.__UI_LOC.detail_empty)||"Выбери узел на карте — здесь появятся тезис, инсайт, источники и связанные идеи. Линзы вверху меняют, что подсвечено, и перекрашивают центр."}</p>`;return;}
  const n=byId(state.selected);const c=typeColor(n.type);
  const related=CHAPTER_DATA.edges.filter(e=>e.from===n.id||e.to===n.id).map(e=>({node:byId(e.from===n.id?e.to:e.from),label:e.label})).filter(x=>x.node);
  const srcs=(n.sources||[]).slice(0,10);
  p.innerHTML=`<p class="detail-kicker" style="--dot:${c}">${(window.__UI_LOC&&window.__UI_LOC.scene_word)||"Сцена"} ${n.sceneIndex+1} · ${typeLabel(n.type)}${n.era?" · "+n.era:""}</p>
    <h3 class="detail-title">${n.title}</h3>
    <p class="detail-thesis">${firstSentence(n.body)}</p>
    <p class="detail-insight" style="--dot:${c}">${n.insight}</p>
    <div class="chips">${(n.tags||[]).map(t=>`<span class="chip">${t}</span>`).join("")}</div>
    <div class="related"><h4>${(window.__UI_LOC&&window.__UI_LOC.related_ideas)||"Связанные идеи"}</h4><div class="related-list">
      ${related.map(r=>`<button type="button" data-go="${r.node.id}">${r.node.shortTitle} · <span style="color:var(--muted)">${r.label}</span></button>`).join("")}</div></div>
    ${srcs.length?`<div class="sources-block"><h4>Источники (${srcs.length})</h4><ol>${srcs.map(s=>`<li>${s.url?`<a href="${s.url}" target="_blank" rel="noreferrer">${s.title}</a>`:s.title}${s.linkType==="gbooks"?`<span class="src-type">Google Books</span>`:(s.linkType==="direct"?`<span class="src-type">ссылка</span>`:"")}</li>`).join("")}</ol></div>`:""}
    <div class="panel-actions"><button class="btn primary" type="button" data-full="${n.id}">Читать сцену</button></div>`;
  p.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>selectNode(b.getAttribute("data-go"))));
  p.querySelector("[data-full]").addEventListener("click",()=>renderFullScene(n.id));
  const ad=p.querySelector("[data-arpa]");if(ad)ad.addEventListener("click",()=>renderFullScene("arpanet",true));}
function selectNode(id){state.selected=id;state.visited.add(id);renderAll();}

function mdToHtml(md){return String(md).split(/\n{2,}/).map(b=>{b=b.trim();if(!b)return"";
  if(b.startsWith("## "))return`<h2>${b.slice(3)}</h2>`;return`<p>${b.replace(/\*([^*]+)\*/g,"<em>$1</em>")}</p>`;}).join("");}
function renderFullScene(id,openArpa){const n=byId(id);if(!n)return;const dlg=document.querySelector(".scene-dialog");const isArpa=n.id==="arpanet";const c=typeColor(n.type);const srcs=(n.sources||[]);
  dlg.innerHTML=`<div class="dialog-inner"><button class="dialog-close" aria-label="Закрыть" type="button">×</button>
    <p class="detail-kicker" style="--dot:${c}">${(window.__UI_LOC&&window.__UI_LOC.scene_word)||"Сцена"} ${n.sceneIndex+1} · ${typeLabel(n.type)}${n.era?" · "+n.era:""}</p>
    <h3>${n.title}</h3><div class="dialog-body">${mdToHtml(n.body)}</div>
    <p class="detail-insight" style="--dot:${c}">${n.insight}</p>
    ${srcs.length?`<div class="sources-block"><h4>Источники</h4><ol>${srcs.map(s=>`<li>${s.url?`<a href="${s.url}" target="_blank" rel="noreferrer">${s.title}</a>`:s.title}${s.linkType==="gbooks"?`<span class="src-type">Google Books</span>`:(s.linkType==="direct"?`<span class="src-type">ссылка</span>`:"")}</li>`).join("")}</ol></div>`:""}
    <div class="panel-actions"><a class="btn" href="${CHAPTER_DATA.chapter.sourceUrl}" target="_blank" rel="noreferrer">Открыть в Luminara</a>
      <button class="btn primary" type="button" data-close>Закрыть</button></div></div>`;
  const close=()=>dlg.close();dlg.querySelector(".dialog-close").addEventListener("click",close);dlg.querySelector("[data-close]").addEventListener("click",close);
  if(typeof dlg.showModal==="function")dlg.showModal();else dlg.setAttribute("open","");
  }





function renderAll(){renderMap();renderNodeList();renderDetail();renderProgress();}


const CHAPTER_I18N = {"ru": {"chapter": {"key": "web3", "title": "Блокчейн", "lede": "Доверие без посредника — математикой, а не властью. От проблемы двойной траты до TON.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=web3", "centralIdea": "Доверие без посредника — математикой, не властью", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Хронология", "accent": "#7dd3fc", "description": "От проблемы посредника через Накамото и Бутерина к TON."}, {"id": "trust", "label": "Доверие", "accent": "#fbbf24", "description": "Двойная трата и распределённый реестр: доверие без банка."}, {"id": "sovereignty", "label": "Суверенность", "accent": "#c084fc", "description": "Self-custody, «not your keys» и суверенная цифровая идентичность."}, {"id": "programmability", "label": "Программируемость", "accent": "#34d399", "description": "Бутерин и смарт-контракты: блокчейн как универсальный компьютер и DeFi."}, {"id": "access", "label": "Доступ", "accent": "#f87171", "description": "Кошельки и TON: блокчейн для миллиарда через существующую инфраструктуру."}], "nodes": [{"id": "intermediary", "sceneIndex": 0, "type": "power", "shortTitle": "Посредник", "era": "проблема", "lensWeight": {"chronology": 4, "trust": 5, "sovereignty": 2, "programmability": 1, "access": 2}, "title": "Проблема посредника: почему нам нужен банк", "insight": "Посредник существует потому, что цифровой файл можно скопировать — банк следит, чтобы одни деньги не потратили дважды. Блокчейн решает эту проблему математически, без посредника.", "thesis": "Посредник существует потому, что цифровой файл можно скопировать — банк следит, чтобы одни деньги не потратили дважды. Блокчейн решает эту проблему математически, без посредника.", "body": "## Простой вопрос с неочевидным ответом\n\nПредставь, что ты хочешь отправить деньги другу в другую страну. Казалось бы — в цифровую эпоху это должно быть просто. Открываешь приложение, вводишь сумму, нажимаешь кнопку. Но за этой кажущейся простотой — сложная система посредников.\n\nТы не можешь просто «отправить файл с деньгами». Потому что цифровой файл можно скопировать. Если бы у тебя был «цифровой доллар» в виде файла — ты мог бы отправить его одновременно двадцати людям, оставив себе оригинал. Это называется «проблема двойной траты» — и именно поэтому мы не можем передавать деньги напрямую через интернет, как передаём текст или фотографию.\n\nПоэтому нужен банк. Банк ведёт централизованный реестр: у тебя есть сто долларов. Ты отправляешь другу пятьдесят. Банк записывает: у тебя теперь пятьдесят, у друга — плюс пятьдесят. Банк контролирует, что одни и те же деньги не потрачены дважды. Это и есть его главная функция.\n\nПосредник доверия. Ты доверяешь банку, друг доверяет банку — и благодаря этому вы доверяете друг другу. Вся финансовая система — это сеть таких посредников: банки, платёжные системы, биржи, нотариусы, регуляторы. Они существуют потому, что незнакомые люди не доверяют друг другу напрямую.\n\n## Цена посредника\n\nЭта система работала веками. Но у неё есть фундаментальная проблема: посредник обладает властью. И эту власть он может использовать не только в твоих интересах.\n\nБанк может заморозить твой счёт — по требованию государства, из-за подозрения в нарушении правил, из-за технического сбоя. Платёжная система может отказать в транзакции — потому что получатель в «нежелательном» списке. Правительство может конфисковать активы — как это происходило в Кипре в 2013 году, когда банки заморозили депозиты и частично их списали. Биржа может закрыться, не выдав деньги клиентам — как FTX в 2022 году.\n\nПосредник, которому ты доверяешь сегодня, может использовать свою власть против тебя завтра. Не потому что злонамерен — а потому что у него есть мотивы, которые не совпадают с твоими.\n\nЭрик Хьюз сформулировал эту проблему в «Манифесте шифропанка» ещё в 1993 году: приватность в открытом обществе требует анонимной системы транзакций. Не системы, где посредник обещает хранить тайну — а системы, где математически невозможно её нарушить. Хьюз описал техническое задание. Решение появилось через пятнадцать лет.\n\n> Посредник доверия — это не злодей. Это архитектурная необходимость в мире без криптографии. Блокчейн убирает эту необходимость — заменяя доверие к человеку математической гарантией.\n\nПонять эту замену — ключ к пониманию всего, что произошло дальше. Если доверие можно выразить математически — не нужен ни банк, ни нотариус, ни регулятор. Нужен только код.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20
