s"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["self-custody", "wallet", "security", "blockchain"], "x": 712.1, "y": 657.1, "angDeg": 45.0}, {"id": "wallets", "sceneIndex": 4, "type": "media", "shortTitle": "Wallets", "era": "2009→2024", "lensWeight": {"chronology": 4, "trust": 2, "sovereignty": 3, "programmability": 2, "access": 5}, "title": "The evolution of wallets: from a text file to Telegram", "insight": "Wallets have gone from a text file in 2009 to a button in Telegram in 2024. When sending crypto is as simple as sending a message, the scale of adoption changes radically.", "thesis": "Wallets have gone from a text file in 2009 to a button in Telegram in 2024. When sending crypto is as simple as sending a message, the scale of adoption changes radically.", "body": "## The path from “only for tech people” to “for everyone”\n\nThe history of crypto wallets is the history of gradually lowering the barrier to entry. From a tool for mathematicians and programmers to a button inside the messenger you already use.\n\nThe first Bitcoin users, in 2009-2011, stored private keys literally in text files on a hard drive. No interface. No prompts. You simply worked with the command line and hoped not to lose the file. Many did lose it.\n\nThe best-known story is that of programmer James Howells from Wales. In 2013, during a house cleanout, he accidentally threw away a hard drive with 8000 bitcoins on it. At current prices, that is hundreds of millions of dollars. The drive is still lying in a municipal landfill in Newport. Howells has spent years trying to get permission to excavate it, but the authorities refuse on environmental grounds.\n\nThis is not a curiosity. It is an illustration of what early Web3 was like: technically revolutionary, but practically inaccessible to most people.\n\n## Software wallets: the first convenience revolution\n\nMetaMask, a browser extension launched in 2016, became the first wallet a normal person could use without a technical education. You install the extension in Chrome, click “Create wallet,” receive a 12-word seed phrase, write it down, confirm it, and you are done. The whole process takes three minutes.\n\nA seed phrase is a human-readable version of your private key. Twelve ordinary words: for example, “river cloud magic forest apple sunset...” These twelve words are mathematically linked to your wallet. Write them on paper, hide them in a safe place, and your assets are secure even if your computer burns, your phone breaks, or MetaMask shuts down as a company. A seed phrase is a backup that always works.\n\nMetaMask opened access to Ethereum for millions of people. Others followed: Trust Wallet for mobile devices, Phantom for Solana, Rabby Wallet with a convenient interface for DeFi. It shows a transaction simulation before signing, which is critically important for security in a world where scammers are constantly looking for ways to deceive users.\n\n## TON and Telegram: a wallet inside the messenger\n\nTonkeeper and Telegram Wallet took the next step, one that seemed obvious only in hindsight: why require the user to install a separate app if you can build a wallet into the app they already use every day?\n\nTelegram Wallet is a wallet right inside Telegram. If you want to send TON to a friend, you send it the same way you send a message. Open a chat, tap “attach,” choose “Transfer.” Addresses, private keys, seed phrases: all of it works under the hood. From the outside, it is simply “send money in a messenger.”\n\nThis is a fundamentally different level of adoption. Not “install a crypto wallet,” but “tap a button in the app you already have.” That is how billions of ordinary people can interact with blockchain for the first time without realizing that they are doing it.\n\nThe distinction between custodial and non-custodial wallets remains important. Telegram Wallet in its basic version is custodial: keys are stored on Telegram servers. It is more convenient, but it reproduces the logic of a bank. Tonkeeper is non-custodial: the keys are yours. It is more difficult, but it gives real ownership. To get started, use Telegram Wallet. For serious amounts, use Tonkeeper or a hardware wallet.\n\n> The path from the command line in 2009 to a button in Telegram in 2024 is the story of lowering the barrier to zero. When sending cryptocurrency becomes as simple as sending a message, the scale of adoption changes radically.\n\nHardware wallets, Ledger and Trezor, remain the standard for storing serious amounts. The private key is stored on a physical device isolated from the internet. Even if your computer is infected with a keylogger virus, an attacker will not get the key. To sign in, you need to physically press a button on the device.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["wallet", "self-custody", "Telegram", "TON"], "x": 500.0, "y": 745.0, "angDeg": 90.0}, {"id": "defi", "sceneIndex": 5, "type": "economy", "shortTitle": "DeFi", "era": "2020→", "lensWeight": {"chronology": 3, "trust": 3, "sovereignty": 3, "programmability": 5, "access": 4}, "title": "DeFi: finance without financial institutions", "insight": "DeFi replaces banks and brokers with smart contracts: loans, exchange, income on assets, without KYC, without approval, 24/7, from anywhere in the world. 1.4 billion people without a bank account get access.", "thesis": "DeFi replaces banks and brokers with smart contracts: loans, exchange, income on assets, without KYC, without approval, 24/7, from anywhere in the world. 1.4 billion people without a bank account get access.", "body": "## What DeFi is and why it is needed\n\nDeFi means Decentralized Finance. It is a set of financial services that run on blockchain through smart contracts, without banks, brokers or other financial intermediaries.\n\nTo understand what is revolutionary here, you need to remember how traditional finance works. Want to get a loan? You go to a bank, pass a KYC check (Know Your Customer, identity verification), provide income documents, and wait a week for a decision. The bank sets whatever interest rate it considers appropriate. Want to trade stocks? You open an account with a broker, again KYC, again waiting. Want to earn on savings? The bank offers 2% per year, keeping an 8% margin for itself.\n\nIn all these scenarios, the bank or broker is a gatekeeper. It decides who gets access, on what terms, and for what reward. People without a credit history, without residence in the right country, without sufficient income are cut off from basic financial services. According to the World Bank, 1.4 billion adults in the world do not have a bank account.\n\n## Uniswap, Aave, Compound: how it works\n\nDeFi replaces the gatekeeper with mathematics.\n\nUniswap is a decentralized exchange. On a traditional exchange, there is an order book: buyers and sellers place orders, and the exchange matches them. On Uniswap there is no order book and no operating company. Instead, there is a liquidity pool: users lock pairs of tokens in a smart contract and receive a share of fees. When you want to exchange one token for another, the smart contract automatically calculates the price by algorithm and executes the swap. No KYC. No approval. No working hours.\n\nAave is a lending protocol. You can lock tokens as collateral and receive a loan in another token. Or, conversely, provide tokens to a pool and earn interest. Rates are determined automatically by supply and demand, not by a bank. The process takes minutes, works 24/7, and is available from anywhere in the world with internet access.\n\nCompound works on a similar principle: you provide assets, and they automatically work and generate income. No “put money on deposit at 2% per year.” Rates change in real time depending on market demand.\n\nThese protocols have no offices, do not hire employees to process applications, and do not carry the regulatory overhead of traditional banks. So part of this saving returns to users as higher rates for lenders and lower rates for borrowers.\n\nDon and Alex Tapscott in “Blockchain Revolution” call this the “internet of finance”: just as the internet democratized access to information, DeFi democratizes access to financial services. A resident of Nigeria gets the same tools as a hedge fund in New York.\n\n> DeFi is not only convenience. It is a political statement: financial services as an open protocol available to everyone, not a privilege of clients of certain institutions.\n\nThe risks are real: smart contracts contain bugs, protocols get hacked, markets are volatile, the regulatory environment is unstable. DeFi is not a replacement for traditional finance in every situation. But the principle is revolutionary. And it works.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["DeFi", "smart contracts", "finance", "blockchain"], "x": 287.9, "y": 657.1, "angDeg": 135.0}, {"id": "identity", "sceneIndex": 6, "type": "privacy", "shortTitle": "Identity", "era": "Web3", "lensWeight": {"chronology": 2, "trust": 2, "sovereignty": 5, "programmability": 3, "access": 2}, "title": "Digital identity: the sovereign “self” in Web3", "insight": "In Web2, identity belongs to the platform and can be deleted. In Web3, ENS, NFT and on-chain reputation form a sovereign digital person that is mathematically impossible to confiscate.", "thesis": "In Web2, identity belongs to the platform and can be deleted. In Web3, ENS, NFT and on-chain reputation form a sovereign digital person that is mathematically impossible to confiscate.", "body": "## The identity problem in Web2\n\nRemember Baudrillard from the previous chapter: on social networks, people build simulacra of themselves, images that replace reality. An Instagram version of life, more beautiful and happier than the original. But this simulacrum has another problem that Baudrillard could not have foreseen: it belongs to the platform.\n\nInstagram can delete your account with a million followers at any moment, without explanation. Twitter can ban you. TikTok can block you. Everything you built for years, followers, reputation, history, is stored on their servers and belongs to them.\n\nChris Dixon, in “Why Decentralization Matters,” described this as the key problem of Web2 platforms: they go through a predictable cycle. First they attract users and developers with generous terms. Then, after gaining critical mass, they change the rules in their own favor. Developers who built on Facebook in 2007 discovered by 2012 that the platform had become a competitor. Creators who built an audience on Twitter discovered by 2022 that moderation policy had changed without warning.\n\nThe problem is not malicious intent. The problem is architectural: your identity is stored on someone else's server.\n\n## ENS, NFT avatars and on-chain reputation\n\nWeb3 offers another model: sovereign digital identity.\n\nENS, Ethereum Name Service, is a naming system for blockchain. Instead of an address like “0x742d35Cc6634C0532...” you buy the name “luminara.eth” and link it to your wallet. It works like a domain on the internet, only without the possibility of taking it away. No company that could block your name. No server that could be switched off. As long as you pay for renewal, it is yours. And it moves between platforms: one name, one address, everywhere.\n\nNFT avatars became the first mass expression of Web3 identity. CryptoPunks, 10,000 pixel characters launched in 2017, became a cultural phenomenon. Bored Ape Yacht Club created a community: the owner of a Bored Ape received access to private events, IP rights to their character, and belonging to a specific culture. These are not just pictures. They are membership cards, proofs of belonging, ways to signal values.\n\nBut the most interesting part is what comes next. On-chain reputation is a profile that automatically reflects your history on blockchain. Which protocols you used, which votes you participated in, which projects you supported, how reliable you proved to be as a participant in transactions. This reputation cannot be faked: it is recorded in an immutable ledger and verified mathematically. And it belongs to you, not to a platform.\n\nPseudonymous identity in Web3 adds another dimension. Satoshi Nakamoto changed the world while remaining anonymous. In Web3, you can build a meaningful reputation under a wallet name without revealing your real name. Your actions on blockchain are your identity. Not a biography. Not a resume. Not photographs. Actions.\n\n> In Web2, your identity is what the platform decided about you. In Web3, it is what you did, recorded in an immutable ledger. A simulacrum for an audience versus a sovereign digital person.\n\nThis is not tomorrow, and not for everyone already today. But the direction is clear: the internet is moving toward a model where identity belongs to the person, not the platform. And TON is one of the main contenders to make this accessible to a billion Telegram users.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["identity", "self-custody", "NFT", "Web3"], "x": 200.0, "y": 445.0, "angDeg": 180.0}, {"id": "ton", "sceneIndex": 7, "type": "power", "shortTitle": "TON", "era": "→billion", "lensWeight": {"chronology": 4, "trust": 2, "sovereignty": 2, "programmability": 3, "access": 5}, "title": "TON: a blockchain for a billion", "insight": "TON is designed for a billion users through Telegram: infinite sharding, instant transactions, built into the messenger. Adoption through existing infrastructure, not persuasion.", "thesis": "TON is designed for a billion users through Telegram: infinite sharding, instant transactions, built into the messenger. Adoption through existing infrastructure, not persuasion.", "body": "## The scale problem Ethereum did not solve\n\nBy 2017, Ethereum had proved the concept: smart contracts work, decentralized applications are possible. But a new problem appeared: scale.\n\nEthereum in its base version processes about 15 transactions per second. For comparison: Visa processes an average of 1,700 transactions per second, and during peak periods, up to 24,000. When a popular application appeared on the Ethereum network, for example the game CryptoKitties in 2017, the network was literally overloaded. Users waited for hours, and fees rose to tens of dollars for a single transaction. A blockchain for everyone turned out to be too slow for everyone.\n\nIn addition, using Ethereum was technically difficult. You had to install a wallet. Buy ETH specifically to pay fees. Figure out interfaces designed by programmers for programmers. For the average Telegram user, the barrier was too high.\n\n## TON: architecture designed for scale\n\nIn 2018-2019, the Durov brothers, Pavel and Nikolai, worked on TON: The Open Network. Nikolai Durov is one of the strongest mathematicians and programmers of his generation, the creator of algorithms for VKontakte and Telegram. He designed TON from scratch with a specific goal in mind: the system had to work for a billion users.\n\nThe TON Whitepaper describes several key technical decisions that distinguish it from Bitcoin and Ethereum.\n\nInfinite sharding. The main problem of blockchain scaling: the more transactions there are, the slower the network works, because every node has to process everything. TON solves this through automatic sharding: the network divides into parallel chains (shards) as load grows, like a road that automatically adds lanes during rush hour. In theory, this allows scaling without losing speed.\n\nInstant transactions. In Bitcoin, a transaction is confirmed in 10-60 minutes. In Ethereum, in several minutes. In TON, the mechanism of optimistic confirmations allows transactions to be processed in seconds. For a payment service, this is fundamental.\n\nBuilt-in services. In Bitcoin and Ethereum, DNS (the domain name system), file storage and other services are external add-ons. In TON, they are built into the protocol. This simplifies application development and reduces dependence on external services.\n\n## Telegram as the entry point\n\nBut the most important thing about TON is the context. It is not just another blockchain competing with Ethereum. It is a financial layer for Telegram, a messenger with 950 million users.\n\nThe strategy is fundamentally different from competitors. Bitcoin and Ethereum built an ecosystem from scratch: attract users, persuade them to install a wallet, explain what blockchain is. TON is embedded into existing infrastructure: you already have Telegram, you already have contacts, you already have the habit of using the app every day. Just add a wallet, and everything you need for basic crypto transactions is already here.\n\nJared Larnie, in the essay \"Own the Internet\", describes a future where users own part of platforms through tokens. TON is moving exactly in this direction: Telegram users are potential participants in the TON economy, not just consumers of the service.\n\nTON's path was not easy: the original project was blocked by the SEC in 2020. The Durovs shut the project down. But the community continued development under the name TON Foundation. By 2024, TON had become one of the fastest-growing blockchains, with active development of DeFi, the NFT ecosystem and Mini Apps inside Telegram.\n\n> TON solves not just the technical problem of scale. It solves the problem of adoption: how to make blockchain accessible to people who have never heard of blockchain, because it is built into the app they already use.\n\nThis is the next frontier: not persuading people to move to new technologies, but embedding new technologies into their existing life. Invisibly. Without barriers. Without lectures about private keys.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["TON", "Telegram", "blockchain", "scalability"], "x": 287.9, "y": 232.9, "angDeg": 225.0}], "edges": [{"from": "intermediary", "to": "nakamoto", "label": "the problem was solved without an intermediary", "lenses": ["chronology", "trust"]}, {"from": "nakamoto", "to": "buterin", "label": "from ledger to computer", "lenses": ["chronology", "programmability"]}, {"from": "buterin", "to": "defi", "label": "smart contracts replace banks", "lenses": ["programmability", "access"]}, {"from": "nakamoto", "to": "keys", "label": "sovereignty requires keys", "lenses": ["trust", "sovereignty"]}, {"from": "keys", "to": "wallets", "label": "the keys were hidden in a wallet", "lenses": ["sovereignty", "access"]}, {"from": "wallets", "to": "ton", "label": "send crypto like a message", "lenses": ["access", "chronology"]}, {"from": "keys", "to": "identity", "label": "the sovereign “self” is inalienable", "lenses": ["sovereignty"]}, {"from": "buterin", "to": "identity", "label": "identity is programmable", "lenses": ["programmability", "sovereignty"]}, {"from": "defi", "to": "ton", "label": "access for 1.4 billion without a bank", "lenses": ["access", "economy"]}, {"from": "intermediary", "to": "defi", "label": "finance without institutions", "lenses": ["trust", "programmability"]}, {"from": "wallets", "to": "defi", "label": "the wallet is the entrance to DeFi", "lenses": ["access", "programmability"]}]}, "uk": {"chapter": {"key": "web3", "title": "Блокчейн", "lede": "Довіра без посередника — математикою, а не владою. Від проблеми подвійної витрати до TON.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=web3", "centralIdea": "Довіра без посередника — математикою, не владою", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Хронологія", "accent": "#7dd3fc", "description": "Від проблеми посередника через Накамото й Бутеріна до TON."}, {"id": "trust", "label": "Довіра", "accent": "#fbbf24", "description": "Подвійна витрата й розподілений реєстр: довіра без банку."}, {"id": "sovereignty", "label": "Суверенність", "accent": "#c084fc", "description": "Самостійне зберігання, «не твої ключі» і суверенна цифрова ідентичність."}, {"id": "programmability", "label": "Програмованість", "accent": "#34d399", "description": "Бутерін і смарт-контракти: блокчейн як універсальний компʼютер і DeFi."}, {"id": "access", "label": "Доступ", "accent": "#f87171", "description": "Гаманці й TON: блокчейн для мільярда через наявну інфраструктуру."}], "nodes": [{"id": "intermediary", "sceneIndex": 0, "type": "power", "shortTitle": "Посередник", "era": "проблема", "lensWeight": {"chronology": 4, "trust": 5, "sovereignty": 2, "programmability": 1, "access": 2}, "title": "Проблема посередника: чому нам потрібен банк", "insight": "Посередник існує тому, що цифровий файл можна скопіювати — банк стежить, щоб одні й ті самі гроші не витратили двічі. blockchain розв'язує цю проблему математично, без посередника.", "thesis": "Посередник існує тому, що цифровий файл можна скопіювати — банк стежить, щоб одні й ті самі гроші не витратили двічі. blockchain розв'язує цю проблему математично, без посередника.", "body": "## Просте питання з неочевидною відповіддю\n\nУяви, що ти хочеш надіслати гроші другу в іншу країну. Здавалося б — у цифрову епоху це має бути просто. Відкриваєш застосунок, вводиш суму, натискаєш кнопку. Але за цією видимою простотою — складна система посередників.\n\nТи не можеш просто «надіслати файл із грошима». Бо цифровий файл можна скопіювати. Якби в тебе був «цифровий долар» у вигляді файлу — ти міг би надіслати його одночасно двадцятьом людям, залишивши оригінал собі. Це називається «проблема подвійної витрати» — і саме тому ми не можемо передавати гроші напряму через інтернет, як передаємо текст чи фотографію.\n\nТому потрібен банк. Банк веде централізований реєстр: у тебе є сто доларів. Ти надсилаєш другу п'ятдесят. Банк записує: у тебе тепер п'ятдесят, у друга — плюс п'ятдесят. Банк контролює, щоб одні й ті самі гроші не були витрачені двічі. Це і є його головна функція.\n\nПосередник довіри. Ти довіряєш банку, друг довіряє банку — і завдяки цьому ви довіряєте одне одному. Уся фінансова система — це мережа таких посередників: банки, платіжні системи, біржі, нотаріуси, регулятори. Вони існують тому, що незнайомі люди не довіряють одне одному напряму.\n\n## Ціна посередника\n\nЦя система працювала століттями. Але в неї є фундаментальна проблема: посередник має владу. І цю владу він може використовувати не лише у твоїх інтересах.\n\nБанк може заморозити твій рахунок — на вимогу держави, через підозру в порушенні правил, через технічний збій. Платіжна система може відмовити в транзакції — тому що отримувач у «небажаному» списку. Уряд може конфіскувати активи — як це сталося на Кіпрі у 2013 році, коли банки заморозили депозити й частково їх списали. Біржа може закритися, не видавши гроші клієнтам — як FTX у 2022 році.\n\nПосередник, якому ти довіряєш сьогодні, може використати свою владу проти тебе завтра. Не тому, що він зловмисний — а тому, що має мотиви, які не збігаються з твоїми.\n\nЕрік Г'юз сформулював цю проблему в «Маніфесті шифропанка» ще у 1993 році: приватність у відкритому суспільстві потребує анонімної системи транзакцій. Не системи, де посередник обіцяє зберігати таємницю — а системи, де математично неможливо її порушити. Г'юз описав технічне завдання. Рішення з'явилося через п'ятнадцять років.\n\n> Посередник довіри — це не лиходій. Це архітектурна необхідність у світі без криптографії. blockchain прибирає цю необхідність — замінюючи довіру до людини математичною гарантією.\n\nЗрозуміти цю заміну — ключ до розуміння всього, що сталося далі. Якщо довіру можна виразити математично — не потрібні ні банк, ні нотаріус, ні регулятор. Потрібен лише code.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%
