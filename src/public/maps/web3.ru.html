, échange, revenus sur les actifs, sans KYC, sans approbation, 24/7, depuis n'importe où dans le monde. 1,4 milliard de personnes sans compte bancaire y ont accès.", "body": "## Qu'est-ce que DeFi et pourquoi en a-t-on besoin\n\nDeFi signifie Decentralized Finance. C'est un ensemble de services financiers qui fonctionnent sur blockchain via des smart contracts, sans banques, courtiers ni autres intermédiaires financiers.\n\nPour comprendre ce qu'il y a de révolutionnaire ici, il faut se rappeler comment fonctionne la finance traditionnelle. Tu veux obtenir un crédit ? Tu vas à la banque, tu passes un contrôle KYC (Know Your Customer, vérification d'identité), tu fournis des justificatifs de revenus et tu attends une semaine la décision. La banque fixe le taux qu'elle juge approprié. Tu veux trader des actions ? Tu ouvres un compte chez un courtier, encore KYC, encore de l'attente. Tu veux faire fructifier ton épargne ? La banque propose 2 % par an et garde 8 % de marge pour elle.\n\nDans tous ces cas, la banque ou le courtier joue le rôle de gardien. Il décide qui a accès, à quelles conditions et pour quelle rémunération. Les personnes sans historique de crédit, sans résidence dans le bon pays, sans revenus suffisants sont coupées des services financiers de base. Selon la Banque mondiale, 1,4 milliard d'adultes dans le monde n'ont pas de compte bancaire.\n\n## Uniswap, Aave, Compound : comment ça marche\n\nDeFi remplace le gardien par les mathématiques.\n\nUniswap est un exchange décentralisé. Sur un exchange traditionnel, il existe un carnet d'ordres : acheteurs et vendeurs placent des ordres, et l'exchange les fait correspondre. Sur Uniswap, il n'y a ni carnet d'ordres ni société opératrice. À la place, il y a un pool de liquidité : les utilisateurs bloquent des paires de tokens dans un smart contract et reçoivent une part des frais. Quand tu veux échanger un token contre un autre, le smart contract calcule automatiquement le prix selon un algorithme et exécute l'échange. Pas de KYC. Pas d'approbation. Pas d'horaires d'ouverture.\n\nAave est un protocole de prêt. Tu peux bloquer des tokens en garantie et recevoir un prêt dans un autre token. Ou, à l'inverse, fournir des tokens à un pool et percevoir des intérêts. Les taux sont déterminés automatiquement par l'offre et la demande, pas par une banque. Le processus prend quelques minutes, fonctionne 24/7 et est accessible de n'importe où dans le monde avec une connexion internet.\n\nCompound fonctionne sur un principe similaire : tu fournis des actifs et ils travaillent automatiquement en générant des revenus. Pas de « déposer de l'argent à 2 % par an ». Les taux changent en temps réel selon la demande du marché.\n\nCes protocoles n'ont pas de bureaux, n'embauchent pas d'employés pour traiter les demandes et ne supportent pas la regulatory overhead des banques traditionnelles. Une partie de ces économies revient donc aux utilisateurs sous forme de taux plus élevés pour les prêteurs et plus bas pour les emprunteurs.\n\nDon et Alex Tapscott, dans « Blockchain Revolution », appellent cela « l'internet de la finance » : tout comme internet a démocratisé l'accès à l'information, DeFi démocratise l'accès aux services financiers. Un habitant du Nigeria obtient les mêmes outils qu'un hedge fund à New York.\n\n> DeFi, ce n'est pas seulement la commodité. C'est un message politique : les services financiers comme protocole ouvert, accessible à tous, et non comme privilège réservé aux clients de certaines institutions.\n\nLes risques sont réels : les smart contracts contiennent des bugs, les protocoles se font pirater, les marchés sont volatils et l'environnement réglementaire est instable. DeFi ne remplace pas la finance traditionnelle dans tous les cas. Mais le principe est révolutionnaire. Et il fonctionne.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["DeFi", "smart contracts", "finance", "blockchain"], "x": 287.9, "y": 657.1, "angDeg": 135.0}, {"id": "identity", "sceneIndex": 6, "type": "privacy", "shortTitle": "Identité", "era": "Web3", "lensWeight": {"chronology": 2, "trust": 2, "sovereignty": 5, "programmability": 3, "access": 2}, "title": "Identité numérique: le « soi » souverain dans Web3", "insight": "Dans Web2, l’identité appartient à la plateforme et peut être supprimée. Dans Web3, ENS, les NFT et la réputation on-chain forment une personne numérique souveraine qu’il est mathématiquement impossible de confisquer.", "thesis": "Dans Web2, l’identité appartient à la plateforme et peut être supprimée. Dans Web3, ENS, les NFT et la réputation on-chain forment une personne numérique souveraine qu’il est mathématiquement impossible de confisquer.", "body": "## Le problème de l’identité dans Web2\n\nSouviens-toi de Baudrillard dans le chapitre précédent: sur les réseaux sociaux, les gens construisent des simulacres d’eux-mêmes, des images qui remplacent la réalité. Une version Instagram de la vie, plus belle et plus heureuse que l’originale. Mais ce simulacre a un autre problème que Baudrillard n’avait pas pu prévoir: il appartient à la plateforme.\n\nInstagram peut supprimer ton compte d’un million d’abonnés à tout moment, sans explication. Twitter peut te bannir. TikTok peut te bloquer. Tout ce que tu as construit pendant des années, abonnés, réputation, histoire, est stocké sur leurs serveurs et leur appartient.\n\nChris Dixon, dans “Why Decentralization Matters”, a décrit cela comme le problème central des plateformes Web2: elles suivent un cycle prévisible. D’abord, elles attirent les utilisateurs et les développeurs avec des conditions généreuses. Puis, une fois la masse critique atteinte, elles changent les règles en leur faveur. Les développeurs qui construisaient sur Facebook en 2007 ont découvert en 2012 que la plateforme était devenue un concurrent. Les créateurs qui avaient bâti une audience sur Twitter ont découvert en 2022 que la politique de modération avait changé sans préavis.\n\nLe problème n’est pas une intention malveillante. Le problème est architectural: ton identité est stockée sur le serveur de quelqu’un d’autre.\n\n## ENS, avatars NFT et réputation on-chain\n\nWeb3 propose un autre modèle: une identité numérique souveraine.\n\nENS, Ethereum Name Service, est un système de nommage pour la blockchain. Au lieu d’une adresse comme “0x742d35Cc6634C0532...”, tu achètes le nom “luminara.eth” et tu le relies à ton portefeuille. Cela fonctionne comme un domaine sur internet, sauf qu’on ne peut pas te le retirer. Aucune entreprise ne peut bloquer ton nom. Aucun serveur ne peut être éteint. Tant que tu paies le renouvellement, il t’appartient. Et il se déplace entre les plateformes: un nom, une adresse, partout.\n\nLes avatars NFT sont devenus la première expression massive de l’identité Web3. CryptoPunks, 10 000 personnages pixélisés lancés en 2017, sont devenus un phénomène culturel. Bored Ape Yacht Club a créé une communauté: le propriétaire d’un Bored Ape obtenait l’accès à des événements privés, des droits de propriété intellectuelle sur son personnage, et l’appartenance à une culture spécifique. Ce ne sont pas juste des images. Ce sont des cartes de membre, des preuves d’appartenance, des façons de signaler des valeurs.\n\nMais le plus intéressant, c’est la suite. La réputation on-chain est un profil qui reflète automatiquement ton historique sur la blockchain. Les protocoles que tu as utilisés, les votes auxquels tu as participé, les projets que tu as soutenus, le niveau de fiabilité que tu as montré comme participant aux transactions. Cette réputation ne peut pas être falsifiée: elle est inscrite dans un registre immuable et vérifiée mathématiquement. Et elle t’appartient, pas à une plateforme.\n\nL’identité pseudonyme dans Web3 ajoute une autre dimension. Satoshi Nakamoto a changé le monde tout en restant anonyme. Dans Web3, tu peux construire une réputation significative sous le nom d’un portefeuille sans révéler ton vrai nom. Tes actions sur la blockchain sont ton identité. Pas une biographie. Pas un CV. Pas des photos. Des actions.\n\n> Dans Web2, ton identité est ce que la plateforme a décidé à ton sujet. Dans Web3, c’est ce que tu as fait, inscrit dans un registre immuable. Un simulacre pour un public face à une personne numérique souveraine.\n\nCe n’est pas pour demain, ni pour tout le monde aujourd’hui. Mais la direction est claire: internet évolue vers un modèle où l’identité appartient à la personne, pas à la plateforme. Et TON est l’un des principaux candidats pour rendre cela accessible à un milliard d’utilisateurs de Telegram.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["identité", "auto-conservation", "NFT", "Web3"], "x": 200.0, "y": 445.0, "angDeg": 180.0}, {"id": "ton", "sceneIndex": 7, "type": "power", "shortTitle": "TON", "era": "→milliard", "lensWeight": {"chronology": 4, "trust": 2, "sovereignty": 2, "programmability": 3, "access": 5}, "title": "TON : une blockchain pour un milliard", "insight": "TON est conçu pour un milliard d'utilisateurs via Telegram : sharding infini, transactions instantanées, intégration dans le messager. L'adoption passe par l'infrastructure existante, pas par la persuasion.", "thesis": "TON est conçu pour un milliard d'utilisateurs via Telegram : sharding infini, transactions instantanées, intégration dans le messager. L'adoption passe par l'infrastructure existante, pas par la persuasion.", "body": "## Le problème d'échelle qu'Ethereum n'a pas résolu\n\nEn 2017, Ethereum avait prouvé le concept : les smart contracts fonctionnent, les applications décentralisées sont possibles. Mais un nouveau problème est apparu : l'échelle.\n\nEthereum, dans sa version de base, traite environ 15 transactions par seconde. À titre de comparaison, Visa traite en moyenne 1 700 transactions par seconde, et lors des pics, jusqu'à 24 000. Lorsqu'une application populaire apparaissait sur le réseau Ethereum, par exemple le jeu CryptoKitties en 2017, le réseau était littéralement saturé. Les utilisateurs attendaient des heures, et les frais grimpaient à des dizaines de dollars pour une seule transaction. Une blockchain pour tous s'est révélée trop lente pour tous.\n\nEn outre, utiliser Ethereum était techniquement difficile. Il fallait installer un wallet. Acheter de l'ETH spécialement pour payer les frais. Comprendre des interfaces conçues par des programmeurs pour des programmeurs. Pour l'utilisateur moyen de Telegram, la barrière était trop élevée.\n\n## TON : une architecture conçue pour l'échelle\n\nEntre 2018 et 2019, les frères Durov, Pavel et Nikolai, ont travaillé sur TON: The Open Network. Nikolai Durov est l'un des mathématiciens et programmeurs les plus brillants de sa génération, créateur des algorithmes de VKontakte et de Telegram. Il a conçu TON de zéro avec un objectif précis : le système devait fonctionner pour un milliard d'utilisateurs.\n\nLe TON Whitepaper décrit plusieurs décisions techniques clés qui le distinguent de Bitcoin et Ethereum.\n\nSharding infini. Le principal problème de la mise à l'échelle d'une blockchain : plus il y a de transactions, plus le réseau fonctionne lentement, parce que chaque nœud doit tout traiter. TON résout cela grâce au sharding automatique : le réseau se divise en chaînes parallèles (shards) à mesure que la charge augmente, comme une route qui ajoute automatiquement des voies aux heures de pointe. En théorie, cela permet de monter en échelle sans perdre de vitesse.\n\nTransactions instantanées. Dans Bitcoin, une transaction est confirmée en 10 à 60 minutes. Dans Ethereum, en quelques minutes. Dans TON, le mécanisme des confirmations optimistes permet de traiter les transactions en quelques secondes. Pour un service de paiement, c'est fondamental.\n\nServices intégrés. Dans Bitcoin et Ethereum, le DNS (le système de noms de domaine), le stockage de fichiers et d'autres services sont des ajouts externes. Dans TON, ils sont intégrés au protocole. Cela simplifie le développement des applications et réduit la dépendance aux services externes.\n\n## Telegram comme point d'entrée\n\nMais le plus important dans TON, c'est le contexte. Ce n'est pas juste une autre blockchain qui concurrence Ethereum. C'est une couche financière pour Telegram, un messager avec 950 millions d'utilisateurs.\n\nLa stratégie est fondamentalement différente de celle des concurrents. Bitcoin et Ethereum ont construit un écosystème à partir de zéro : attirer des utilisateurs, les convaincre d'installer un wallet, expliquer ce qu'est une blockchain. TON s'insère dans l'infrastructure existante : tu as déjà Telegram, tu as déjà tes contacts, tu as déjà l'habitude d'utiliser l'application tous les jours. Ajoute simplement un wallet, et tout ce qu'il te faut pour les transactions crypto de base est déjà là.\n\nJared Larnie, dans l'essai « Own the Internet », décrit un avenir où les utilisateurs possèdent une partie des plateformes grâce aux tokens. TON va exactement dans cette direction : les utilisateurs de Telegram sont des participants potentiels de l'économie TON, et pas seulement des consommateurs du service.\n\nLe parcours de TON n'a pas été simple : le projet initial a été bloqué par la SEC en 2020. Les Durov ont fermé le projet. Mais la communauté a poursuivi le développement sous le nom de TON Foundation. En 2024, TON était devenu l'une des blockchains à la croissance la plus rapide, avec un développement actif de DeFi, de l'écosystème NFT et des Mini Apps dans Telegram.\n\n> TON ne résout pas seulement le problème technique de l'échelle. Il résout le problème d'adoption : comment rendre la blockchain accessible à des personnes qui n'en ont jamais entendu parler, parce qu'elle est intégrée à l'application qu'elles utilisent déjà.\n\nC'est cela, la prochaine frontière : non pas convaincre les gens d'adopter de nouvelles technologies, mais intégrer les nouvelles technologies dans leur vie existante. Sans qu'on s'en aperçoive. Sans barrières. Sans cours sur les clés privées.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D  է պատճենել։ Եթե քեզ մոտ լիներ ֆայլի ձևով «թվային դոլար», կարող էիր այն միաժամանակ ուղարկել քսան մարդու՝ բնօրինակը քեզ մոտ պահելով։ Սա կոչվում է «կրկնակի ծախսման խնդիր», և հենց դրա համար էլ մենք չենք կարող փողը անմիջապես ինտերնետով փոխանցել այնպես, ինչպես փոխանցում ենք տեքստը կամ լուսանկարը։\n\nԱհա թե ինչու բանկ է պետք։ Բանկը վարում է կենտրոնացված գրանցամատյան. քեզ մոտ կա հարյուր դոլար։ Դու ընկերոջդ ուղարկում ես հիսուն։ Բանկը գրանցում է՝ հիմա քեզ մոտ հիսուն է, ընկերոջդ մոտ՝ ևս հիսուն։ Բանկը վերահսկում է, որ նույն գումարը երկու անգամ չծախսվի։ Դա էլ նրա գլխավոր գործառույթն է։\n\nՎստահության միջնորդ։ Դու վստահում ես բանկին, ընկերոջդ էլ է բանկին վստահում, և դրա շնորհիվ դուք միմյանց վստահում եք։ Ամբողջ ֆինանսական համակարգը նման միջնորդների ցանց է՝ բանկեր, վճարային համակարգեր, բորսաներ, նոտարներ, կարգավորողներ։ Դրանք գոյություն ունեն, որովհետև անծանոթ մարդիկ անմիջապես միմյանց չեն վստահում։\n\n## Միջնորդի գինը\n\nԱյս համակարգը դարեր շարունակ աշխատել է։ Բայց այն ունի հիմնարար խնդիր՝ միջնորդն ունի իշխանություն։ Եվ այդ իշխանությունը նա կարող է օգտագործել ոչ միայն քո շահերի համար։\n\nԲանկը կարող է սառեցնել քո հաշիվը՝ պետության պահանջով, կանոնների խախտման կասկածի պատճառով կամ տեխնիկական խափանման հետևանքով։ Վճարային համակարգը կարող է մերժել գործարքը՝ որովհետև ստացողը «անցանկալի» ցուցակում է։ Կառավարությունը կարող է բռնագրավել ակտիվները՝ ինչպես Կիպրոսում 2013 թվականին, երբ բանկերը սառեցրին ավանդները և դրանց մի մասն էլ գրեցին։ Բորսան կարող է փակվել՝ հաճախորդներին գումարը չվերադարձնելով՝ ինչպես FTX-ը 2022 թվականին։\n\nԱյսօր քեզ վստահելի թվացող միջնորդը վաղը կարող է իր իշխանությունն օգտագործել քո դեմ։ Ոչ թե որովհետև չարամիտ է, այլ որովհետև ունի այնպիսի շարժառիթներ, որոնք չեն համընկնում քո շարժառիթների հետ։\n\nEric Hughes-ը այս խնդիրը ձևակերպել էր դեռ 1993 թվականին՝ «A Cypherpunk's Manifesto»-ում. բաց հասարակությունում գաղտնիությունը պահանջում է անանուն գործարքների համակարգ։ Ոչ թե համակարգ, որտեղ միջնորդը խոստանում է գաղտնիք պահել, այլ համակարգ, որտեղ այն խախտելն մաթեմատիկորեն անհնար է։ Hughes-ը նկարագրեց տեխնիկական առաջադրանքը։ Լուծումը հայտնվեց տասնհինգ տարի անց։\n\n> Վստահության միջնորդը չարագործ չէ։ Դա ճարտարապետական անհրաժեշտություն է մի աշխարհում, որտեղ չկա կրիպտոգրաֆիա։ blockchain-ը վերացնում է այդ անհրաժեշտությունը՝ մարդու հանդեպ վստահությունը փոխարինելով մաթեմատիկական երաշխիքով։\n\nԱյս փոխարինումը հասկանալը այն ամենը հասկանալու բանալին է, ինչ տեղի ունեցավ հետո։ Եթե վստահությունը կարելի է արտահայտել մաթեմատիկորեն, ապա ոչ բանկ է պետք, ոչ նոտար, ոչ էլ կարգավորող։ Պետք է միայն code։", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B ատիկորեն անհնար է կեղծել։ Ինը էջ փոխեցին ֆինանսները։", "body": "## 2008 թվականի հոկտեմբեր. համաշխարհային ճգնաժամ և անանուն մանիֆեստ\n\n2008 թվականի հոկտեմբեր։ Համաշխարհային ֆինանսական ճգնաժամի ամենաթեժ փուլը։ Lehman Brothers-ը հենց նոր է սնանկացել։ Կառավարությունները հարկատուների փողերով շտապ փրկում են բանկերը։ Ֆինանսական համակարգի նկատմամբ վստահությունը պատմական նվազագույնի վրա է։\n\nՀենց այդ պահին կրիպտոգրաֆների փոքր համայնքի փոստային ցուցակ է գալիս մի նամակ։ Ուղարկողը Սատոշի Նակամոտո անունը օգտագործող ինչ-որ մեկն է։ Ոչ մի կապակցում, ոչ մի հաստատություն, ոչ մի իրական անուն։ Նամակը պարունակում է հղում մի փաստաթղթի՝ \"Bitcoin: A Peer-to-Peer Electronic Cash System\"։ Ինը էջ։\n\nՍա Էրիկ Հյուզի հարցի պատասխանն էր՝ մաթեմատիկայի վրա կառուցված անանուն գործարքային համակարգ։ Նակամոտոն առաջարկեց կրկնակի ծախսման խնդրի լուծում՝ առանց կենտրոնական միջնորդի։\n\nՏրամաբանությունը նրբագեղ է։ Մեկ բանկի փոխարեն, որ վարում է ռեեստրը, թող այն միաժամանակ վարեն հազարավոր մասնակիցներ։ Յուրաքանչյուր գործարք փոխանցվում է ցանցի բոլոր մասնակիցներին։ Նրանք գործարքները հավաքում են բլոկների մեջ, և յուրաքանչյուր բլոկ մաթեմատիկորեն կապվում է նախորդի հետ՝ այստեղից էլ \"blockchain\", blockchain։ Պատմությունը փոխել հնարավոր չէ. դրա համար պետք է ամբողջ blockchain-ը վերահաշվել ավելի արագ, քան հազարավոր մասնակիցներ նոր բլոկներ են ավելացնում։ Դա պահանջում է ավելի շատ հաշվարկային հզորություն, քան մնացած ամբողջ ցանցի միասին վերցրածը։\n\n## Երեք հատկություն, որոնք նախկինում երբեք միասին չէին եղել\n\nԱնդրեաս Անտոնոպուլոսը *Mastering Bitcoin*-ում բացատրում է. Bitcoin-ի հեղափոխականությունը ոչ թե յուրաքանչյուր առանձին տարրում է. բոլոր բաղադրիչներն արդեն գոյություն ունեին։ Հեղափոխականը դրանց համադրությունն է, որը ստեղծում է երեք հատկություն, որոնք նախկինում երբեք միաժամանակ չեն եղել։\n\nԱպակենտրոնացում։ Չկա միակ սերվեր, չկա ձախողման կամ վերահսկման միակ կետ։ Չկա Bitcoin-ի CEO, որին կարելի է ձերբակալել։ Չկա Bitcoin-ի սերվեր, որ կարելի է անջատել։ Ցանցը աշխատում է, քանի դեռ առնվազն մեկ հանգույց գործում է։\n\nԹափանցիկություն։ Բոլոր գործարքները տեսանելի են բոլորին։ Պատմությունը անփոփոխ է։ Կարող ես ստուգել Bitcoin ցանցում երբևէ տեղի ունեցած ցանկացած գործարք՝ սկսած 2009 թվականի հունվարի առաջին բլոկից։\n\nԱռանց թույլտվության։ Ոչ ոք չի կարող արգելել քեզ մասնակցել ցանցին։ KYC անցնելու կարիք չկա, բանկի թույլտվություն պետք չէ, որևէ կոնկրետ երկրում գրանցված լինելու կարիք չկա։ Դրամապանակը մի քանի վայրկյանում անվճար է ստեղծվում։\n\nՊոլ Վինյա և Մայքլ Քեյսին *The Truth Machine*-ում ճշգրիտ նկարագրել են էությունը. blockchain-ը վստահության մեքենա է։ Տեխնոլոգիա, որը թույլ է տալիս երկու անծանոթների գործարք կնքել առանց երաշխավոր-միջնորդի։ Դա հնչում է որպես տեխնիկական մանրուք։ Բայց հետևանքները հսկայական են. այն ամենը, ինչը այսօր պահանջում է բանկ, նոտար, կարգավորող կամ հարթակ, կարող է հնարավորորեն արվել ուղղակիորեն՝ մաթեմատիկայի միջոցով։\n\nԱրժե կանգ առնել Նակամոտոյի ինքնության վրա, կամ դրա բացակայության վրա։ Նա ստեղծեց մի տեխնոլոգիա, որը 2024 թվականին կառավարում էր հարյուրավոր միլիարդավոր դոլարների արժողությամբ ակտիվներ, և երբեք չբացահայտեց իր անունը։ Ոմանք կարծում են, որ դա մեկ մարդ էր։ Մյուսները՝ որ խումբ։ Որոշ հետազոտողներ կարծում են, որ Նակամոտոն վաղուց մահացել է։ Մենք չգիտենք։ Եվ հենց դա ինքնին մանիֆեստ է. մի գաղափար կարող է փոխել աշխարհը՝ առանց անուն ու կենսագրություն ունեցող հեղինակի։\n\n> Նակամոտոն լուծեց մի խնդիր, որի վրա կրիպտոգրաֆները տասնամյակներ էին աշխատել՝ թվային փող առանց կենտրոնական միջնորդի։ Ինը էջ։ Անանուն։ Ֆինանսական ճգնաժամի ամենաթեժ պահին։ Սա XXI դարի ամենակարևոր փաստաթղթերից մեկն է։\n\nBitcoin-ի առաջին բլոկը՝ \"գենեզիս բլոկը\" - արդյունահանվեց 2009 թվականի հունվարի 3-ին։ Իր տվյալների մեջ Նակամոտոն ներառեց այդ օրվա Times թերթի վերնագիրը՝ \"Chancellor on brink of second bailout for banks\"։ Կանցլերը՝ բանկերի երկրորդ փրկության շեմին։ Սա պատահական չէր։ Սա քաղաքական հայտարարություն էր.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD 1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["Bitcoin", "բլոկչեյն", "պատմություն", "ապակենտրոնացում"], "x": 712.1, "y": 232.9, "angDeg": -45.0}, {"id": "buterin", "sceneIndex": 2, "type": "technology", "shortTitle": "Բուտերին", "era": "2013→2015", "lensWeight": {"chronology": 4, "trust": 2, "sovereignty": 2, "programmability": 5, "access": 2}, "title": "Բուտերին. blockchain-ը որպես համակարգիչ", "insight": "19 տարեկանում Բուտերինը blockchain-ը մասնագիտացված մատյանից վերածեց համընդհանուր համակարգչի։ Smart contractները code-ով գրված պայմանավորվածություններ են, որոնք ավտոմատ կատարվում են առանց միջնորդի։", "thesis": "19 տարեկանում Բուտերինը blockchain-ը մասնագիտացված մատյանից վերածեց համընդհանուր համակարգչի։ Smart contractները code-ով գրված պայմանավորվածություններ են, որոնք ավտոմատ կատարվում են առանց միջնորդի։", "body": "## 19 տարեկան, white paper և հաջորդ հարցը\n\nBitcoin-ը լուծեց կոնկրետ մի խնդիր՝ բանկից անկախ թվային փողը։ Դա հսկայական ձեռքբերում էր։ Բայց արդեն 2013 թվականին պարզ էր, որ blockchain տեխնոլոգիան կարող է ավելին անել, եթե ազատվի Bitcoin-ի սահմանափակումներից։\n\nԱյդ հարցը հասկացել էր 19-ամյա կանադա-ռուս ծրագրավորող Վիտալիկ Բուտերինը։ Նա պարզ հարց տվեց. իսկ եթե blockchain-ը ոչ միայն կարողանա պահել գործարքների մասին տեղեկությունը, այլ նաև կատարել ցանկացած ծրագիր՞\n\nBitcoin-ը մասնագիտացված blockchain է։ Այն կարող է անել մեկ բան՝ Bitcoin-ը փոխանցել մեկ հասցեից մյուսը։ Դա հզոր է, բայց սահմանափակ։ Բուտերինը առաջարկեց ստեղծել ծրագրավորվող blockchain՝ համընդհանուր ապակենտրոնացված համակարգիչ, որի վրա կարելի է գործարկել ցանկացած ծրագիր։\n\nՆա Ethereum White Paper-ը գրել է 2013 թվականին՝ առանց դիպլոմի, ինստիտուցիոնալ աջակցության և ներդրողների։ Պարզապես white paper ինտերնետում։ Գաղափարն այնքան համոզիչ էր, որ գրավեց հարյուրավոր մշակողների։ Ethereum-ը գործարկվեց 2015 թվականին և 2020-ականներին դարձավ Bitcoin-ից հետո շուկայական կապիտալիզացիայով երկրորդ crypto ցանցը։\n\n## Smart contractներ. պայմանավորվածություններ, որոնք չեն կարող խախտվել\n\nEthereum-ի կենտրոնական նորարարությունը smart contractներն են։ Սրանք ծրագրեր են, որոնք պահվում են blockchain-ում և ավտոմատ կերպով կատարվում են, երբ տեղի են ունենում նախապես սահմանված պայմանները։ \"Smart\"՝ որովհետև դրանք ինքնուրույն են կատարվում։ \"Contractներ\"՝ որովհետև նկարագրում են կողմերի միջև պայմանավորվածությունները։\n\nՆախ պատկերացրու, թե ինչպես է աշխատում սովորական contract-ը։ Դու վարձում ես բնակարան։ Դու և սեփականատերը պայմանագիր եք ստորագրում։ Այնտեղ գրված է. «Վարձակալը յուրաքանչյուր ամսվա առաջին օրը վճարում է։ Ուշացման դեպքում՝ տուգանք»։ Բայց դա պարզապես թուղթ է։ Որպեսզի contract-ը գործի, պետք է կատարման ապահովման համակարգ՝ դատարաններ, իրավաբաններ, դատական կատարողներ։ Դա դանդաղ է, թանկ է և պահանջում է վստահություն այդ ինստիտուտների նկատմամբ։\n\nSmart contract-ը այլ կերպ է աշխատում։ Նույն պայմանները՝ բայց code-ում գրված։ Յուրաքանչյուր ամսվա առաջին օրը smart contract-ը ավտոմատ փոխանցում է վարձավճարը վարձակալի հասցեից սեփականատիրոջ հասցեին։ Վճարում չկա՝ չկա նաև բնակարան մուտք գործելու հնարավորություն խելացի կողպեքով, որի բանալիներն էլ են contract-ում։ Պայմանները կատարվում են ավտոմատ, առանց դատարանի և առանց իրավաբանի։ Code-ը օրենք է։\n\nԻրական օրինակ. դու ուզում ես անծանոթից թվային ակտիվ գնել։ Նախկինում պետք էր միջնորդ, որին երկուսդ էլ վստահեք՝ escrow ծառայություն, exchange։ Smart contract-ի դեպքում՝ քո գումարը արգելափակվում է contract-ում, դու ստանում ես ակտիվը, և contract-ը ավտոմատ փոխանցում է գումարը վաճառողին։ Եթե ակտիվը չես ստացել՝ գումարը վերադարձվում է քեզ։ Ավտոմատ։ Մաթեմատիկորեն։ Առանց միջնորդի։\n\nԴա բացեց հնարավորություններ, որոնք գիտաֆանտաստիկա էին թվում՝ ապակենտրոնացված exchange-ներ, որտեղ ոչ ոք չի վերահսկում առևտուրը։ Բանկերից անկախ վարկավորում։ Կենտրոնական հաշվիչի առանց քվեարկություն։ CEO և գրասենյակ չունեցող կազմակերպություններ։\n\n> 19 տարեկանում Բուտերինը ֆինանսների համար արեց այն, ինչ Բերներս-Լին արեց տեղեկատվության համար 1991 թվականին. ստեղծեց բաց protocol, որի վրա յուրաքանչյուրը կարող է կառուցել։ Եվ, ինչպես Բերներս-Լին, հրաժարվեց դրա նկատմամբ մենաշնորհից։\n\n2024 թվականին Ethereum-ում DeFi smart contractներում տասնյակ միլիարդավոր դոլարների ակտիվներ էին արգելափակված։ Հազարավոր հավելվածներ աշխատում են դրա վրա։ Այս ամենը 19-ամյա ծրագրավորողի մեկ հարցի հետևանքն է. իսկ եթե blockchain-ը կարող է անել ոչ միայն փողը՞", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0% քնապահում", "insight": "Not your keys - not your coins. Ակտիվները բորսայում պահելը նշանակում է, որ բորսան է դրանց տերը։ Self-custody-ը, երբ private key-ը քո մոտ է, ֆինանսական ինքնիշխանության միակ իրական ձևն է։", "thesis": "Not your keys - not your coins. Ակտիվները բորսայում պահելը նշանակում է, որ բորսան է դրանց տերը։ Self-custody-ը, երբ private key-ը քո մոտ է, ֆինանսական ինքնիշխանության միակ իրական ձևն է։", "body": "## FTX, Mt. Gox և այն դասը, որը ստիպված եղանք կրկնել\n\n2022 թվականի նոյեմբեր։ FTX-ը աշխարհի խոշորագույն կրիպտոբորսաներից մեկն էր, որի արժեքը գնահատվում էր 32 միլիարդ դոլար։ Նրա հիմնադիր Սեմ Բենքման-Ֆրիդը հայտնվում է Forbes-ի և Time-ի շապիկներին, ելույթ է ունենում ԱՄՆ Կոնգրեսում, միլիոններ է նվիրաբերում քաղաքական արշավներին։ Ամեն ինչ վստահելի է թվում։\n\nՀետո մի քանի օրում բորսան փլուզվեց։ Պարզվեց, որ հաճախորդների միջոցներն օգտագործվել են ռիսկային խաղադրույքների համար։ Միլիոնավոր մարդիկ կորցրին իրենց ակտիվներին հասանելիությունը։ Բենքման-Ֆրիդը ձերբակալվեց և դատապարտվեց։\n\nՍա առաջին դեպքը չէր։ 2014 թվականին կոտրեցին Mt. Gox-ը՝ այն ժամանակ աշխարհի ամենամեծ բորսան, որի միջոցով անցնում էր Bitcoin-ի բոլոր գործարքների 70%-ը։ 850 000 bitcoin անհետացավ։ 2019 թվականին մահացավ QuadrigaCX բորսայի հիմնադիրը՝ գաղտնաբառերը իմացող միակ մարդը։ Հաճախորդների 190 միլիոն դոլարի միջոցները ընդմիշտ արգելափակվեցին։\n\nԱմեն անգամ pattern-ը նույնն է. մարդիկ ակտիվները պահում էին բորսայում՝ վստահելով նրան։ Բորսան միջնորդ էր՝ նույնքան, որքան բանկը։ Եվ բանկի նման, այն նույնպես կարող էր այդ իշխանությունը օգտագործել նրանց դեմ։\n\nԿրիպտոհամայնքում վաղուց կա մի արտահայտություն, որը դարձել է աքսիոմա. \"Not your keys - not your coins\". Քո բանալիները չկան - քո մետաղադրամները չկան։\n\n## Ի՞նչ է private key-ը և ինչու է դա կարևոր\n\nBlockchain-ում ակտիվները վերահսկվում են private key-ով։ Դա նշանների երկար շղթա է՝ մի տեսակ շատ բարդ գաղտնաբառ, որն մաթեմատիկորեն կապված է wallet-ի հասցեի հետ։ Ով ունի private key-ը, վերահսկում է այդ հասցեի վրա եղած ամեն ինչ։ Առանց դրա մուտք չկա։\n\nԵրբ ակտիվները պահում ես բորսայում, private key-ը բորսայի մոտ է։ Էկրանին տեսնում ես մնացորդ, բայց դա բորսայի խոստումն է, ոչ թե մաթեմատիկական երաշխիք։ Բորսան կարող է սառեցնել դուրսբերումները։ Կարող է սնանկանալ։ Կարող է պարզվել, որ խարդախ է։\n\nSelf-custody - ինքնապահում - նշանակում է՝ private key-ը քո մոտ է։ Ոչ մի ընկերություն, ոչ մի կարգավորող մարմին, ոչ մի հաքեր, ով կոտրել է ուրիշի սերվերը, չի կարող հասնել քո ակտիվներին առանց քո բանալիի։ Միայն դու։\n\nՍա տեխնիկական է հնչում, բայց ֆինանսական ինքնիշխանության հիմնարար սկզբունք է։ Պատմության մեջ առաջին անգամ սովորական մարդը կարող է զգալի արժեքներ պահել առանց միջնորդի՝ երաշխիքով, որը տալիս է մաթեմատիկան, ոչ թե պետությունը կամ կորպորացիան։\n\nՊահպանման մի քանի եղանակ կա։ 12 կամ 24 բառից seed phrase-ը private key-ի մարդու համար ընթեռնելի տարբերակն է։ Եթե այն գրես թղթի վրա և պահես ապահով վայրում, ակտիվները անվտանգ են, նույնիսկ եթե բոլոր սարքերդ այրվեն։ Hardware wallet-ները՝ Ledger, Trezor, private key-ը պահում են ինտերնետից մեկուսացված ֆիզիկական սարքի վրա։ Նույնիսկ եթե քո համակարգիչը վիրուսով վարակվի, key-ը հասանելի չէ։ Software wallet-ները՝ MetaMask, Rabby Wallet, Tonkeeper՝ ավելի հարմար են, բայց key-երը պահում են ինտերնետին միացած սարքի վրա, ինչն ավելի մեծ զգուշություն է պահանջում։\n\n> \"Not your keys - not your coins\"-ը պարանոյա չէ։ Դա մաթեմատիկական փաստ է։ FTX-ը, Mt. Gox-ը, QuadrigaCX-ը բացառություններ չեն։ Դրանք միջնորդի մոտ արժեքներ պահելու կանխատեսելի հետևանքներն են։\n\nԿաստոդիալ և ոչ կաստոդիալ պահպանման տարբերությունը հասկանալը տեխնիկական մանրուք չէ։ Դա Web3-ի առաջին և ամենակարևոր գործնական դասն է։ Բորսայում կրիպտոարժույթ ունենալը նման է ուրիշի պահարանում ոսկի պահելուն։ Հարմար է։ Մինչև պարզվի, որ պահարան չկա։", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапс : "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["ինքնապահպանում", "դրամապանակ", "անվտանգություն", "բլոկչեյն"], "x": 712.1, "y": 657.1, "angDeg": 45.0}, {"id": "wallets", "sceneIndex": 4, "type": "media", "shortTitle": "Դրամապանակներ", "era": "2009→2024", "lensWeight": {"chronology": 4, "trust": 2, "sovereignty": 3, "programmability": 2, "access": 5}, "title": "Դրամապանակների էվոլյուցիան՝ տեքստային ֆայլից մինչև Telegram", "insight": "Դրամապանակները 2009 թվականի տեքստային ֆայլից հասան մինչև 2024 թվականի Telegram-ի կոճակը։ Երբ կրիպտո ուղարկելը նույնքան հեշտ է դառնում, որքան հաղորդագրություն ուղարկելը, ընդունման մասշտաբը կտրուկ փոխվում է։", "thesis": "Դրամապանակները 2009 թվականի տեքստային ֆայլից հասան մինչև 2024 թվականի Telegram-ի կոճակը։ Երբ կրիպտո ուղարկելը նույնքան հեշտ է դառնում, որքան հաղորդագրություն ուղարկելը, ընդունման մասշտաբը կտրուկ փոխվում է։", "body": "## «Միայն տեխնիկականների համար»ից դեպի «բոլորի համար» ճանապարհը\n\nԿրիպտոդրամապանակների պատմությունը մուտքի արգելքի աստիճանական նվազման պատմություն է։ Մաթեմատիկոսների և ծրագրավորողների համար նախատեսված գործիքից մինչև քո արդեն օգտագործած մեսենջերի ներսում գտնվող կոճակը։\n\nBitcoin-ի առաջին օգտատերերը՝ 2009-2011 թվականներին, անձնական բանալիները բառացիորեն պահում էին կոշտ սկավառակի տեքստային ֆայլերում։ Ոչ մի ինտերֆեյս։ Ոչ մի հուշում։ Դու պարզապես աշխատում էիր հրամանի տողում և հույս ունեիր, որ ֆայլը չես կորցնի։ Շատերը կորցնում էին։\n\nԱմենահայտնի պատմությունը Ուելսից ծրագրավորող James Howells-ի մասին է։ 2013 թվականին նա տան մեծ մաքրման ժամանակ պատահաբար դեն նետեց 8000 bitcoin-ով կոշտ սկավառակ։ Այսօրվա գներով դա հարյուրավոր միլիոնավոր դոլարներ են։ Սկավառակը դեռևս գտնվում է Newport-ի քաղաքային աղբավայրում։ Howells-ը տարիներ շարունակ փորձում է թույլտվություն ստանալ այն փորելու համար, բայց իշխանությունները մերժում են՝ բնապահպանական պատճառներով։\n\nՍա պարզապես հետաքրքրություն առաջացնող պատմություն չէ։ Սա ցույց է տալիս, թե ինչպիսին էր վաղ Web3-ը՝ տեխնիկապես հեղափոխական, բայց գործնականում անհասանելի մեծամասնության համար։\n\n## Ծրագրային դրամապանակներ. հարմարության առաջին հեղափոխությունը\n\nMetaMask-ը, 2016 թվականին գործարկված բրաուզերի ընդլայնումը, դարձավ առաջին դրամապանակը, որը սովորական մարդը կարող էր օգտագործել առանց տեխնիկական կրթության։ Դու տեղադրում ես ընդլայնումը Chrome-ում, սեղմում «Ստեղծել դրամապանակ», ստանում 12 բառից բաղկացած վերականգնման արտահայտություն, գրում այն, հաստատում և վերջ։ Ամբողջ գործընթացը տևում է երեք րոպե։\n\nՎերականգնման արտահայտությունը քո անձնական բանալու մարդուն ընթեռնելի տարբերակն է։ Տասներկու սովորական բառեր՝ օրինակ, «river cloud magic forest apple sunset...» Այդ տասներկու բառերը մաթեմատիկորեն կապված են քո դրամապանակի հետ։ Դրանք գրիր թղթի վրա, պահիր վստահելի տեղում, և քո ակտիվները անվտանգ կլինեն նույնիսկ եթե համակարգիչդ այրվի, հեռախոսդ կոտրվի կամ MetaMask-ը որպես ընկերություն փակվի։ Վերականգնման արտահայտությունը միշտ աշխատող պահուստային պատճեն է։\n\nMetaMask-ը միլիոնավոր մարդկանց համար բացեց Ethereum-ի հասանելիությունը։ Դրանից հետո հայտնվեցին մյուսները՝ Trust Wallet-ը բջջային սարքերի համար, Phantom-ը Solana-ի համար, Rabby Wallet-ը՝ DeFi-ի համար հարմար ինտերֆեյսով։ Այն ցույց է տալիս գործարքի սիմուլյացիան մինչև ստորագրելը, ինչը վճռորոշ է անվտանգության համար մի աշխարհում, որտեղ խաբեբաները մշտապես փնտրում են օգտատերերին մոլորեցնելու ուղիներ։\n\n## TON և Telegram. դրամապանակը մեսենջերի ներսում\n\nTonkeeper-ը և Telegram Wallet-ը կատարեցին հաջորդ քայլը, որը հետադարձ հայացքով միայն ակնհայտ էր թվում. ինչո՞ւ օգտատերից պահանջել առանձին հավելված տեղադրել, եթե կարելի է դրամապանակը ներկառուցել այն հավելվածի մեջ, որն արդեն ամեն օր օգտագործում է։\n\nTelegram Wallet-ը հենց Telegram-ի ներսում գտնվող դրամապանակ է։ Եթե ուզում ես ընկերոջդ TON ուղարկել, ուղարկում ես այնպես, ինչպես հաղորդագրություն ես ուղարկում։ Բացում ես չաթը, սեղմում «կցել», ընտրում «Transfer»։ Հասցեներ, անձնական բանալիներ, վերականգնման արտահայտություններ՝ այս ամենը աշխատում է կուլիսներում։ Դրսից դա պարզապես «մեսենջերում գումար ուղարկել» է։\n\nՍա ընդունման բոլորովին այլ մակարդակ է։ Ոչ թե «տեղադրեք կրիպտոդրամապանակ», այլ «սեղմեք արդեն ձեր ունեցած հավելվածի կոճակը»։ Ահա թե ինչպես միլիարդավոր սովորական մարդիկ կարող են առաջին անգամ փոխազդել blockchain-ի հետ՝ նույնիսկ չգիտակցելով, որ դա են անում։\n\nԿաստոդիալ և ոչ կաստոդիալ դրամապանակի տարբերությունը շարունակում է կարևոր մնալ։ Telegram Wallet-ը իր հիմնական տարբերակում կաստոդիալ է. բանալիները պահվում են Telegram-ի սերվերներում։ Դա ավելի հարմար է, բայց կրկնում է բանկի տրամաբանությունը։ Tonkeeper-ը ոչ կաստոդիալ է. բանալիները քեզ են պատկանում։ Դա ավելի բարդ է, բայց տալիս է իրական սեփականություն։ Սկզբի համար՝ Telegram Wallet։ Լուրջ գումարների համար՝ Tonkeeper կամ ապարատային դրամապանակ։\n\n> 2009 թվականի հրամանի տողից մինչև 2024 թվականի Telegram-ի կոճակը հասնելը արգելքի զրոյի հասցնելու պատմություն է։ Երբ կրիպտոարժույթ ուղարկելը նույնքան հեշտ է դառնում, որքան հաղորդագրություն ուղարկելը, ընդունման մասշտաբը կտրուկ փոխվում է։\n\nLedger-ը և Trezor-ը ապարատային դրամապանակների ստանդարտը շարունակում են մնալ լուրջ գումարներ պահելու համար։ Անձնական բանալին պահվում է ինտերնետից մեկուսացված ֆիզիկական սարքում։ Նույնիսկ եթե քո համակարգիչը վարակված է keylogger վիրուսով, հարձակվողը բանալին չի ստանա։ Մուտք գործելու համար պետք է ֆիզիկապես սեղմել սարքի կոճակը։", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт —  "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["դրամապանակ", "ինքնապահպանում", "Telegram", "TON"], "x": 500.0, "y": 745.0, "angDeg": 90.0}, {"id": "defi", "sceneIndex": 5, "type": "economy", "shortTitle": "DeFi", "era": "2020→", "lensWeight": {"chronology": 3, "trust": 3, "sovereignty": 3, "programmability": 5, "access": 4}, "title": "DeFi․ ֆինանսներ առանց ֆինանսական ինստիտուտների", "insight": "DeFi-ն բանկերին ու բրոքերներին փոխարինում է smart contract-ներով՝ վարկեր, փոխանակում, ակտիվներից եկամուտ՝ առանց KYC-ի, առանց հաստատման, 24/7, աշխարհի ցանկացած կետից։ Բանկային հաշիվ չունեցող 1.4 միլիարդ մարդ հասանելիություն է ստանում։", "thesis": "DeFi-ն բանկերին ու բրոքերներին փոխարինում է smart contract-ներով՝ վարկեր, փոխանակում, ակտիվներից եկամուտ՝ առանց KYC-ի, առանց հաստատման, 24/7, աշխարհի ցանկացած կետից։ Բանկային հաշիվ չունեցող 1.4 միլիարդ մարդ հասանելիություն է ստանում։", "body": "## Ի՞նչ է DeFi-ն և ինչու է այն անհրաժեշտ\n\nDeFi-ն՝ Decentralized Finance, ապակենտրոնացված ֆինանսներ է։ Սա ֆինանսական ծառայությունների հավաքածու է, որը blockchain-ում աշխատում է smart contract-ների միջոցով՝ առանց բանկերի, բրոքերների և այլ ֆինանսական միջնորդների։\n\nՈրպեսզի հասկանանք, թե այստեղ ինչն է հեղափոխական, պետք է հիշել, թե ինչպես են աշխատում ավանդական ֆինանսները։ Վարկ ուզո՞ւմ ես՝ գնում ես բանկ, անցնում KYC ստուգում (Know Your Customer — ինքնության վավերացում), ներկայացնում եկամուտների մասին փաստաթղթեր, շաբաթը սպասում որոշման։ Բանկը սահմանում է այն տոկոսադրույքը, որը ճիշտ է համարում։ Բաժնետոմսերով առևտո՞ւր անել ես ուզում՝ բացում ես հաշիվ բրոքերի մոտ, նորից KYC, նորից սպասում։ Խնայողություններից եկամուտ ստանա՞լ ես ուզում՝ բանկը առաջարկում է տարեկան 2%, իսկ 8% մարժան պահում է իր մոտ։\n\nԱյս բոլոր սցենարներում բանկը կամ բրոքերը դարպասապահ է։ Նա է որոշում՝ ով ստանա հասանելիություն, ինչ պայմաններով և ինչ վարձատրության դիմաց։ Վարկային պատմություն չունեցող, ճիշտ երկրում բնակության գրանցում չունեցող կամ բավարար եկամուտ չունեցող մարդիկ կտրվում են հիմնական ֆինանսական ծառայություններից։ Համաշխարհային բանկի տվյալներով՝ աշխարհում 1.4 միլիարդ չափահաս մարդ բանկային հաշիվ չունի։\n\n## Uniswap, Aave, Compound. ինչպես է դա աշխատում\n\nDeFi-ն դարպասապահին փոխարինում է մաթեմատիկայով։\n\nUniswap-ը ապակենտրոնացված exchange է։ Ավանդական exchange-ում կա պատվերների գիրք՝ գնորդներն ու վաճառողները տեղադրում են order-ներ, իսկ exchange-ը դրանք համադրում է։ Uniswap-ում պատվերների գիրք չկա և օպերատոր ընկերություն էլ չկա։ Փոխարենը կա իրացվելիության pool. օգտատերերը smart contract-ում արգելափակում են token-ների զույգեր և ստանում միջնորդավճարների բաժին։ Երբ ուզում ես մեկ token-ը փոխանակել մյուսի հետ, smart contract-ը ավտոմատ հաշվարկում է գինը ալգորիթմով և կատարում փոխանակումը։ KYC չկա։ Հաստատում չկա։ Աշխատանքային ժամեր չկան։\n\nAave-ը վարկավորման protocol է։ Կարող ես token-ները արգելափակել որպես գրավ և վարկ ստանալ այլ token-ով։ Կամ հակառակը՝ token-ներ տրամադրել pool-ին և տոկոս ստանալ։ Տոկոսադրույքները ավտոմատ որոշվում են պահանջարկով և առաջարկով, ոչ թե բանկի կողմից։ Գործընթացը տևում է րոպեներ, աշխատում է 24/7 և հասանելի է աշխարհի ցանկացած կետից՝ ինտերնետով։\n\nCompound-ը աշխատում է նմանատիպ սկզբունքով. տրամադրում ես ակտիվներ՝ դրանք ավտոմատ աշխատում են և եկամուտ բերում։ Ոչ մի «ավանդ դնել տարեկան 2%»-ի տակ։ Տոկոսադրույքները իրական ժամանակում փոխվում են՝ կախված շուկայական պահանջարկից։\n\nԱյս protocol-ները գրասենյակներ չունեն, դիմումների մշակման համար աշխատակիցներ չեն վարձում և չեն կրում ավանդական բանկերի regulatory overhead-ը։ Այդ խնայողության մի մասը վերադառնում է օգտատերերին՝ ավելի բարձր տոկոսադրույքների տեսքով վարկատուների համար և ավելի ցածր տոկոսադրույքների տեսքով փոխառուների համար։\n\nDon և Alex Tapscott-ները «Blockchain Revolution»-ում սա կոչում են «ֆինանսների ինտերնետ». ինչպես ինտերնետը ժողովրդավարացրեց տեղեկատվության հասանելիությունը, DeFi-ն ժողովրդավարացնում է ֆինանսական ծառայությունների հասանելիությունը։ Նիգերիայում ապրող մարդը ստանում է նույն գործիքները, ինչ New York-ի hedge fund-ը։\n\n> DeFi-ն ոչ միայն հարմարավետություն է։ Սա քաղաքական հայտարարություն է. ֆինանսական ծառայությունները որպես բաց protocol, որը հասանելի է բոլորին, ոչ թե որոշ ինստիտուտների հաճախորդների արտոնություն։\n\nՌիսկերն իրական են. smart contract-ներում վրիպակներ կան, protocol-ները կոտրում են, շուկաները փոփոխական են, կարգավորող միջավայրը՝ անկայուն։ DeFi-ն բոլոր դեպքերում ավանդական ֆինանսների փոխարինող չէ։ Բայց սկզբունքը հեղափոխական է։ Եվ այն աշխատում է.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A կանում է հարթակին և կարող է ջնջվել։ Web3-ում ENS-ը, NFT-ները և on-chain հեղինակությունը կազմում են ինքնիշխան թվային անձ, որը մաթեմատիկորեն անհնար է բռնագրավել։", "thesis": "Web2-ում ինքնությունը պատկանում է հարթակին և կարող է ջնջվել։ Web3-ում ENS-ը, NFT-ները և on-chain հեղինակությունը կազմում են ինքնիշխան թվային անձ, որը մաթեմատիկորեն անհնար է բռնագրավել։", "body": "## Web2-ում ինքնության խնդիրը\n\nՀիշիր նախորդ գլխից Բոդրիարին. սոցիալական ցանցերում մարդիկ կառուցում են իրենց սիմուլյակրները՝ պատկերներ, որոնք փոխարինում են իրականությանը։ Կյանքի Instagram-տարբերակը՝ ավելի գեղեցիկ ու ավելի երջանիկ, քան բնօրինակը։ Բայց այդ սիմուլյակրն ունի ևս մեկ խնդիր, որը Բոդրիարը չէր կարող կանխատեսել. այն պատկանում է հարթակին։\n\nInstagram-ը կարող է ցանկացած պահին ջնջել քո միլիոն հետևորդ ունեցող հաշիվը՝ առանց բացատրության։ Twitter-ը կարող է արգելափակել քեզ։ TikTok-ը կարող է փակել մուտքդ։ Այն ամենը, ինչ տարիներով կառուցել ես՝ հետևորդներ, հեղինակություն, պատմություն, պահվում է նրանց սերվերներում և պատկանում է նրանց։\n\nChris Dixon-ը «Why Decentralization Matters»-ում սա նկարագրել է որպես Web2 հարթակների հիմնական խնդիր. դրանք անցնում են կանխատեսելի ցիկլով։ Սկզբում դրանք օգտատերերին ու մշակողներին գրավում են առատաձեռն պայմաններով։ Հետո, երբ հավաքում են կրիտիկական զանգված, փոխում են կանոնները իրենց օգտին։ Մշակողները, որոնք 2007-ին կառուցում էին Facebook-ի վրա, մինչև 2012-ը պարզեցին, որ հարթակը դարձել է մրցակից։ Ստեղծողները, որոնք Twitter-ում կառուցում էին լսարան, մինչև 2022-ը պարզեցին, որ մոդերացիայի քաղաքականությունը փոխվել է առանց նախազգուշացման։\n\nԽնդիրը չար մտադրությունը չէ։ Խնդիրը ճարտարապետական է. քո ինքնությունը պահվում է ուրիշի սերվերում։\n\n## ENS, NFT ավատարներ և on-chain հեղինակություն\n\nWeb3-ը առաջարկում է այլ մոդել՝ ինքնիշխան թվային ինքնություն։\n\nENS-ը՝ Ethereum Name Service-ը, անվանման համակարգ է blockchain-ի համար։ «0x742d35Cc6634C0532...» նման հասցեի փոխարեն դու գնում ես «luminara.eth» անունը և կապում այն քո wallet-ի հետ։ Դա աշխատում է ինչպես domain-ը ինտերնետում, միայն առանց այն խլելու հնարավորության։ Չկա որևէ ընկերություն, որը կարող է արգելափակել քո անունը։ Չկա որևէ սերվեր, որը կարող է անջատվել։ Քանի դեռ վճարում ես երկարաձգման համար, այն քոնն է։ Եվ այն տեղափոխվում է հարթակների միջև. մեկ անուն, մեկ հասցե, ամենուր։\n\nNFT ավատարները դարձան Web3 ինքնության առաջին զանգվածային արտահայտությունը։ CryptoPunks-ը՝ 2017-ին գործարկված 10 000 պիքսելային կերպարներ, դարձավ մշակութային ֆենոմեն։ Bored Ape Yacht Club-ը ստեղծեց համայնք. Bored Ape-ի սեփականատերը ստանում էր փակ միջոցառումներին հասանելիություն, իր կերպարի IP իրավունքներ և պատկանելություն որոշակի մշակույթի։ Սրանք պարզապես նկարներ չեն։ Սրանք անդամակցության քարտեր են, պատկանելության ապացույցներ, արժեքներ ազդարարելու միջոցներ։\n\nԲայց ամենահետաքրքիրն այն է, թե ինչ կլինի հետո։ On-chain հեղինակությունը պրոֆիլ է, որը ավտոմատ կերպով արտացոլում է քո պատմությունը blockchain-ում։ Որ պրոտոկոլներն ես օգտագործել, որ քվեարկություններին ես մասնակցել, որ նախագծերն ես աջակցել, որքան վստահելի ես եղել գործարքների մասնակցի դերում։ Այս հեղինակությունը հնարավոր չէ կեղծել. այն գրանցված է անփոփոխ ռեեստրում և մաթեմատիկորեն վավերացվում է։ Եվ այն պատկանում է քեզ, ոչ թե հարթակին։\n\nWeb3-ում կեղծանունային ինքնությունը ևս մեկ չափում է ավելացնում։ Satoshi Nakamoto-ն փոխեց աշխարհը՝ մնալով անանուն։ Web3-ում դու կարող ես կառուցել նշանակալի հեղինակություն wallet-ի անունով՝ առանց քո իրական անունը բացելու։ Քո գործողությունները blockchain-ում հենց քո ինքնությունն են։ Ոչ կենսագրություն։ Ոչ ինքնակենսագրական։ Ոչ լուսանկարներ։ Գործողություններ։\n\n> Web2-ում քո ինքնությունը այն է, ինչ հարթակը որոշել է քո մասին։ Web3-ում՝ այն, ինչ դու արել ես, գրանցված անփոփոխ ռեեստրում։ Լսարանի համար նախատեսված սիմուլյակրը՝ ինքնիշխան թվային անձի դեմ։\n\nՍա ոչ թե վաղվա, և ոչ էլ արդեն այսօր բոլորի համար է։ Բայց ուղղությունը պարզ է. ինտերնետը շարժվում է դեպի մոդել, որտեղ ինքնությունը պատկանում է մարդուն, ոչ թե հարթակին։ Եվ TON-ը գլխավոր թեկնածուներից մեկն է դա հասանելի դարձնելու Telegram-ի մեկ միլիարդ օգտատիրոջ համար.", "sources": [{"title": "Ан 20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["ինքնություն", "ինքնապահպանում", "NFT", "Web3"], "x": 200.0, "y": 445.0, "angDeg": 180.0}, {"id": "ton", "sceneIndex": 7, "type": "power", "shortTitle": "TON", "era": "→միլիարդ", "lensWeight": {"chronology": 4, "trust": 2, "sovereignty": 2, "programmability": 3, "access": 5}, "title": "TON․ մեկ միլիարդի համար նախատեսված բլոկչեյն", "insight": "TON-ը նախագծված է մեկ միլիարդ օգտատիրոջ համար՝ Telegram-ի միջոցով. անսահման շարդավորում, անմիջական գործարքներ, մեսենջերի մեջ ներկառուցվածություն։ Adoption-ը՝ ոչ թե համոզման, այլ գոյություն ունեցող ենթակառուցվածքի միջոցով։", "thesis": "TON-ը նախագծված է մեկ միլիարդ օգտատիրոջ համար՝ Telegram-ի միջոցով. անսահման շարդավորում, անմիջական գործարքներ, մեսենջերի մեջ ներկառուցվածություն։ Adoption-ը՝ ոչ թե համոզման, այլ գոյություն ունեցող ենթակառուցվածքի միջոցով։", "body": "## Ethereum-ի չլուծած մասշտաբայնության խնդիրը\n\n2017 թվականին Ethereum-ը ապացուցեց գաղափարը. smart contract-ները աշխատում են, դեցենտրալիզացված հավելվածները հնարավոր են։ Բայց նոր խնդիր առաջացավ՝ մասշտաբը։\n\nEthereum-ը իր բազային տարբերակում մշակում է մոտ 15 գործարք վայրկյանում։ Համեմատության համար՝ Visa-ն միջինում մշակում է 1700 գործարք վայրկյանում, իսկ պիկ ժամերին՝ մինչև 24 000։ Երբ Ethereum ցանցում հայտնվում էր հանրահայտ հավելված, օրինակ՝ 2017 թվականի CryptoKitties խաղը, ցանցը բառացիորեն գերբեռնվում էր։ Օգտատերերը ժամերով էին սպասում, իսկ միջնորդավճարները մեկ գործարքի համար աճում էին մինչև տասնյակ դոլարներ։ Բոլորի համար նախատեսված blockchain-ը բոլորի համար չափազանց դանդաղ դուրս եկավ։\n\nԲացի այդ, Ethereum-ից օգտվելը տեխնիկապես դժվար էր։ Պետք էր տեղադրել wallet։ ETH գնել հատուկ՝ միջնորդավճարները վճարելու համար։ Հասկանալ միջերեսները, որոնք ծրագրավորողները նախագծել էին ծրագրավորողների համար։ Telegram-ի միջին օգտատիրոջ համար դա չափազանց բարձր արգելք էր։\n\n## TON՝ մասշտաբի համար նախագծված ճարտարապետություն\n\n2018-2019 թվականներին Դուրով եղբայրները՝ Պավելն ու Նիկոլայը, աշխատում էին TON: The Open Network-ի վրա։ Նիկոլայ Դուրովը իր սերնդի ամենաուժեղ մաթեմատիկոսներից և ծրագրավորողներից մեկն է, VKontakte-ի և Telegram-ի ալգորիթմների ստեղծողը։ Նա TON-ը նախագծեց զրոյից՝ հստակ նպատակով. համակարգը պետք է աշխատեր մեկ միլիարդ օգտատիրոջ համար։\n\nTON Whitepaper-ը նկարագրում է մի քանի հիմնական տեխնիկական լուծումներ, որոնք այն տարբերում են Bitcoin-ից և Ethereum-ից։\n\nԱնսահման շարդավորում. Բլոկչեյնի մասշտաբայնության հիմնական խնդիրը սա է. որքան շատ գործարքներ կան, այնքան դանդաղ է աշխատում ցանցը, որովհետև յուրաքանչյուր հանգույց պետք է մշակի ամեն ինչ։ TON-ը սա լուծում է ավտոմատ շարդավորման միջոցով. բեռի աճին զուգընթաց ցանցը բաժանվում է զուգահեռ շղթաների (շարդերի)՝ ինչպես ճանապարհը, որը ծանր ժամերին ինքնաբերաբար ավելացնում է գծեր։ Տեսականորեն դա թույլ է տալիս մասշտաբել՝ առանց արագությունը կորցնելու։\n\nԱնմիջական գործարքներ. Bitcoin-ում գործարքը հաստատվում է 10-60 րոպեում։ Ethereum-ում՝ մի քանի րոպեում։ TON-ում optimistic confirmations մեխանիզմը թույլ է տալիս գործարքները մշակել վայրկյանների ընթացքում։ Վճարային ծառայության համար սա հիմնարար է։\n\nՆերկառուցված ծառայություններ. Bitcoin-ում և Ethereum-ում DNS-ը (դոմենային անունների համակարգը), ֆայլերի պահպանումը և այլ ծառայությունները արտաքին հավելումներ են։ TON-ում դրանք ներառված են protocol-ի մեջ։ Դա հեշտացնում է հավելվածների մշակումը և նվազեցնում է կախվածությունը արտաքին ծառայություններից։\n\n## Telegram-ը որպես մուտքի կետ\n\nԲայց TON-ի ամենակարևոր բանը համատեքստն է։ Սա պարզապես Ethereum-ի հետ մրցող հերթական blockchain-ը չէ։ Սա Telegram-ի ֆինանսական շերտն է՝ 950 միլիոն օգտատեր ունեցող մեսենջերի համար։\n\nՌազմավարությունը սկզբունքորեն տարբերվում է մրցակիցներից։ Bitcoin-ը և Ethereum-ը էկոհամակարգը կառուցեցին զրոյից. գրավիր օգտատերերին, համոզիր նրանց տեղադրել wallet, բացատրի՛ր, թե ինչ է blockchain-ը։ TON-ը ներդրվում է գոյություն ունեցող ենթակառուցվածքի մեջ. դու արդեն ունես Telegram, դու արդեն ունես կոնտակտներ, դու արդեն ունես ամեն օր հավելվածն օգտագործելու սովորություն։ Պարզապես ավելացրու wallet-ը, և բազային crypto գործարքների համար անհրաժեշտ ամեն ինչ արդեն այստեղ է։\n\nJared Larnie-ն «Own the Internet» էսսեում նկարագրում է ապագա, որտեղ օգտատերերը tokens-ի միջոցով տիրապետում են պլատֆորմների մի մասին։ TON-ը շարժվում է հենց այդ ուղղությամբ. Telegram-ի օգտատերերը TON տնտեսության պոտենցիալ մասնակիցներն են, ոչ թե պարզապես ծառայության սպառողները։\n\nTON-ի ճանապարհը հեշտ չէր. սկզբնական նախագիծը SEC-ը 2020 թվականին արգելափակեց։ Դուրովները փակեցին նախագիծը։ Բայց համայնքը շարունակեց զարգացումը TON Foundation անունով։ 2024 թվականին TON-ը դարձավ ամենաարագ աճող blockchain-ներից մեկը՝ Telegram-ի ներսում ակտիվ զարգացող DeFi-ի, NFT էկոհամակարգի և Mini Apps-ի հետ։\n\n> TON-ը լուծում է ոչ միայն մասշտաբի տեխնիկական խնդիրը։ Այն լուծում է adoption-ի խնդիրը. ինչպես blockchain-ը հասանելի դարձնել մարդկանց, որոնք երբեք չեն լսել blockchain-ի մասին, որովհետև այն ներառված է արդեն իրենց օգտագործած հավելվածի մեջ։\n\nՍա է հաջորդ սահմանագիծը. ոչ թե մարդկանց համոզել անցնել նոր տեխնոլոգիաների, այլ նոր տեխնոլոգիաները ներդնել նրանց արդեն գոյություն ունեցող կյանքում։ Աննկատ։ Առանց արգելքների։ Առանց private key-երի մասին դասերի։", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D const LANGS = ["ru", "en", "uk", "kk", "uz", "es", "fr", "hy"];
const LANG_LABELS = {"ru": "RU", "en": "EN", "uk": "UK", "kk": "KK", "uz": "UZ", "es": "ES", "fr": "FR", "hy": "HY"};
let CURRENT_LANG = 'ru';
function pickLang(l){ return LANGS.indexOf(l)>=0 ? l : 'ru'; }
function applyLang(l){
  l = pickLang(l); CURRENT_LANG = l;
  const src = CHAPTER_I18N[l];
  // подменяем содержимое рабочего CHAPTER_DATA
  CHAPTER_DATA.chapter.title = src.chapter.title;
  CHAPTER_DATA.chapter.lede = src.chapter.lede;
  CHAPTER_DATA.chapter.centralIdea = src.chapter.centralIdea;
  CHAPTER_DATA.lenses.forEach((ls,i)=>{ ls.label=src.lenses[i].label; ls.description=src.lenses[i].description; });
  CHAPTER_DATA.nodes.forEach((n,i)=>{ const s=src.nodes[i];
    n.shortTitle=s.shortTitle; n.era=s.era; n.title=s.title; n.insight=s.insight;
    n.thesis=s.thesis; n.body=s.body; n.tags=s.tags; });
  CHAPTER_DATA.edges.forEach((e,i)=>{ e.label=src.edges[i].label; });
  // UI-строки
  const _U = UI_I18N[l] || UI_I18N.ru; const _R = UI_I18N.ru || {};
  const U = {}; Object.keys(_R).forEach(k=>{ U[k] = (_U[k] && String(_U[k]).trim()) ? _U[k] : _R[k]; });
  document.documentElement.lang = l;
  const t=document.getElementById('app-title'); if(t) t.textContent=src.chapter.title;
  const ld=document.querySelector('.chapter-lede'); if(ld) ld.textContent=src.chapter.lede;
  document.querySelectorAll('[data-ui]').forEach(el=>{ const k=el.getAttribute('data-ui'); if(U[k]) el.textContent=U[k]; });
  // локализованный typeLabel + перестройка линз (иначе останутся на языке сборки)
  window.__UI_LOC = U;
  try{ buildLenses(); setLens(state.lens); }catch(e){}
  // перерисовать карту/деталь/прогресс
  try{ renderAll(); }catch(e){}
  // отметить активную кнопку языка
  document.querySelectorAll('.lang-btn').forEach(b=>b.setAttribute('aria-pressed', b.getAttribute('data-lang')===l ? 'true':'false'));
}
function buildLangSwitcher(){
  const rail=document.querySelector('.rail'); if(!rail) return;
  const wrap=document.createElement('div'); wrap.className='lang-switch';
  LANGS.forEach(l=>{ const b=document.createElement('button'); b.className='lang-btn'; b.type='button';
    b.setAttribute('data-lang',l); b.textContent=LANG_LABELS[l];
    b.addEventListener('click',()=>applyLang(l)); wrap.appendChild(b); });
  rail.insertBefore(wrap, rail.firstChild);
}


window.addEventListener("message",function(ev){try{var d=ev.data||{};if(d.lang){applyLang(d.lang);}}catch(e){}});
async function boot(){buildLangSwitcher();var _q=new URLSearchParams(location.search).get("lang");var _h=(location.hash.match(/[?&]lang=([a-z]{2})/)||[])[1];var _lp=_q||_h;if(_lp)CURRENT_LANG=pickLang(_lp);buildLenses();setLens(state.lens);applyLang(CURRENT_LANG);}
document.addEventListener("DOMContentLoaded",()=>{try{boot();}catch(e){renderEmptyState("Ошибка инициализации: "+e.message);}});
</script>
