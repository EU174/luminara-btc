ы бір мезетте жиырма адамға жіберіп, түпнұсқасын өзіңде қалдыра алар едің. Бұл «қосарлы жұмсау проблемасы» деп аталады — және ақшаны интернет арқылы мәтін немесе фотосурет сияқты тікелей бере алмауымыздың себебі де осы.\n\nСондықтан банк керек. Банк орталықтандырылған тізілім жүргізеді: сенде жүз доллар бар. Сен досыңа елу жібересің. Банк жазады: енді сенде елу, досыңда — плюс елу. Банк бір ақшаның екі рет жұмсалмауын бақылайды. Оның басты функциясы да осы.\n\nСенім делдалы. Сен банкке сенесің, досың банкке сенеді — соның арқасында екеуің бір-біріңе сенесіңдер. Бүкіл қаржы жүйесі осындай делдалдар желісі: банктер, төлем жүйелері, биржалар, нотариустар, реттеушілер. Олар бейтаныс адамдар бір-біріне тікелей сенбейтіндіктен бар.\n\n## Делдалдың бағасы\n\nБұл жүйе ғасырлар бойы жұмыс істеді. Бірақ оның іргелі проблемасы бар: делдалдың билігі бар. Және ол бұл билікті тек сенің мүддең үшін ғана қолданбауы мүмкін.\n\nБанк сенің шотыңды бұғаттай алады — мемлекеттің талабы бойынша, ережені бұзды деген күдікпен, техникалық ақау салдарынан. Төлем жүйесі транзакциядан бас тарта алады — өйткені алушы «қалаусыз» тізімде. Үкімет активтерді тәркілей алады — 2013 жылы Кипрде банктер депозиттерді бұғаттап, олардың бір бөлігін есептен шығарғандағыдай. Биржа клиенттерге ақшасын бермей жабылып қалуы мүмкін — 2022 жылғы FTX сияқты.\n\nБүгін сенетін делдал ертең өз билігін саған қарсы қолдануы мүмкін. Зұлым болғандықтан емес — оның сенің мүддеңмен сәйкес келмейтін мотивтері бар болғандықтан.\n\nЭрик Хьюз бұл проблеманы 1993 жылы-ақ «Шифропанк манифесінде» тұжырымдаған: ашық қоғамдағы құпиялылық анонимді транзакциялар жүйесін қажет етеді. Делдал құпияны сақтауға уәде беретін жүйені емес — оны бұзу математикалық тұрғыдан мүмкін емес жүйені. Хьюз техникалық тапсырманы сипаттады. Шешім он бес жылдан кейін пайда болды.\n\n> Сенім делдалы — жауыз емес. Бұл криптографиясыз әлемдегі архитектуралық қажеттілік. blockchain бұл қажеттілікті алып тастайды — адамға деген сенімді математикалық кепілдікпен алмастырады.\n\nБұл алмастыруды түсіну — кейін болғанның бәрін түсінудің кілті. Егер сенімді математикалық түрде білдіруге болса, банк те, нотариус та, реттеуші де қажет емес. Тек code керек.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["блокчейн", "сенім", "орталықсыздандыру", "қаржы"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "nakamoto", "sceneIndex": 1, "type": "technology", "shortTitle": "Накамото", "era": "2008", "lensWeight": {"chronology": 5, "trust": 5, "sovereignty": 3, "programmability": 2, "access": 2}, "title": "Накамото: әлемді өзгерткен тоғыз бет", "insight": "2008 жылы Накамото қосарланған жұмсау мәселесін делдалсыз шешті: мыңдаған қатысушыдағы үлестірілген реестр, оны математикалық тұрғыдан қолдан жасау мүмкін емес. Тоғыз бет қаржыны өзгертті.", "thesis": "2008 жылы Накамото қосарланған жұмсау мәселесін делдалсыз шешті: мыңдаған қатысушыдағы үлестірілген реестр, оны математикалық тұрғыдан қолдан жасау мүмкін емес. Тоғыз бет қаржыны өзгертті.", "body": "## 2008 жылғы қазан: әлемдік дағдарыс және анонимді манифест\n\n2008 жылғы қазан. Әлемдік қаржы дағдарысының қызған шағы. Lehman Brothers жаңа ғана банкрот болды. Үкіметтер банктерді салық төлеушілердің ақшасымен шұғыл құтқарып жатыр. Қаржы жүйесіне деген сенім тарихи минимумда.\n\nДәл осы сәтте криптографтардың шағын қауымдастығының тарату тізіміне хат келеді. Жіберуші - Сатоши Накамото деген атпен жүрген біреу. Ешқандай аффилиация, ешқандай институт, ешқандай шын есім жоқ. Хатта құжатқа сілтеме бар: \"Bitcoin: A Peer-to-Peer Electronic Cash System\". Тоғыз бет.\n\nБұл Эрик Хьюздің сұрағына жауап еді - математикаға құрылған анонимді транзакциялар жүйесі. Накамото қосарланған жұмсау мәселесін орталық делдалсыз шешуді ұсынды.\n\nЛогикасы әсем. Бір банк реестр жүргізгеннің орнына, реестрді мыңдаған қатысушы бір уақытта жүргізсін. Әр транзакция желінің барлық қатысушысына таратылады. Олар транзакцияларды блоктарға жинайды, ал әр блок алдыңғысымен математикалық түрде байланысқан - осыдан \"блок-тізбек\", blockchain. Тарихты өзгерту мүмкін емес: ол үшін бүкіл blockchain-ді мыңдаған қатысушы жаңа блоктар қосқаннан жылдамырақ қайта есептеу керек болар еді. Бұл бүкіл қалған желінің жиынтық қуатынан да көп есептеу қуатын талап етеді.\n\n## Бұрын бірге болмаған үш қасиет\n\nАндреас Антонопулос *Mastering Bitcoin* кітабында түсіндіреді: Bitcoin-нің революциялығы әрбір жеке элементінде емес - барлық компоненттер бұрыннан бар еді. Революциялығы - олардың бұрын бір уақытта болмаған үш қасиетті тудыратын комбинациясында.\n\nДецентрализация. Біртұтас сервер жоқ, істен шығудың немесе бақылаудың біртұтас нүктесі жоқ. Қамауға алуға болатын Bitcoin CEO-сы жоқ. Өшіріп тастауға болатын Bitcoin сервері жоқ. Кемінде бір түйін жұмыс істеп тұрса, желі жұмыс істейді.\n\nАшықтық. Барлық транзакциялар бәріне көрінеді. Тарих өзгермейді. Bitcoin желісінде қашан болса да болған кез келген транзакцияны тексере аласың - 2009 жылғы қаңтардағы алғашқы блоктан бастап.\n\nРұқсатсыздық. Ешкім саған желіге қатысуға тыйым сала алмайды. KYC-тен өтудің қажеті жоқ, банк рұқсаты керек емес, белгілі бір елде тіркеу керек емес. Әмиян бірнеше секундта тегін жасалады.\n\nПол Винья мен Майкл Кейси *The Truth Machine* кітабында мәнін дәл сипаттады: blockchain - бұл сенім машинасы. Екі бейтаныс адамға кепілгер-делдалсыз мәміле жасауға мүмкіндік беретін технология. Бұл техникалық деталь сияқты естіледі. Бірақ салдары орасан: бүгін банк, нотариус, реттеуші немесе платформа талап ететіннің бәрін әлеуетті түрде тікелей, математика арқылы жасауға болады.\n\nНакамотоның тұлғасына - немесе оның жоқтығына - тоқталған жөн. Ол 2024 жылға қарай жүздеген миллиард долларлық активтерді басқаратын технология жасады және өз есімін ешқашан ашпады. Біреулер оны бір адам деп ойлайды. Басқалар - топ деп санайды. Кейбір зерттеушілер Накамото әлдеқашан қайтыс болған деп есептейді. Біз білмейміз. Мұның өзі - манифест: идея аты-жөні мен түйіндемесі бар авторсыз-ақ әлемді өзгерте алады.\n\n> Накамото криптографтар ондаған жыл бойы жұмыс істеген міндетті шешті: орталық делдалсыз цифрлық ақша. Тоғыз бет. Аноним. Қаржы дағдарысының қызған шағында. Бұл XXI ғасырдың ең маңызды құжаттарының бірі.\n\nBitcoin-нің алғашқы блогы - \"генезис блогы\" - 2009 жылғы 3 қаңтарда өндірілді. Оның деректеріне Накамото сол күнгі Times газетінің тақырыбын енгізді: \"Chancellor on brink of second bailout for banks\". Канцлер банктерді екінші рет құтқару алдында тұр. Бұл кездейсоқ емес еді. Бұл саяси мәлімдеме болды.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["Bitcoin", "блокчейн", "тарих", "орталықсыздандыру"], "x": 712.1, "y": 232.9, "angDeg": -45.0}, {"id": "buterin", "sceneIndex": 2, "type": "technology", "shortTitle": "Бутерин", "era": "2013→2015", "lensWeight": {"chronology": 4, "trust": 2, "sovereignty": 2, "programmability": 5, "access": 2}, "title": "Бутерин: blockchain компьютер ретінде", "insight": "Бутерин 19 жасында blockchain-ді мамандандырылған реестрден әмбебап компьютерге айналдырды. Смарт-контракттар - code түріндегі, делдалсыз автоматты түрде орындалатын келісімдер.", "thesis": "Бутерин 19 жасында blockchain-ді мамандандырылған реестрден әмбебап компьютерге айналдырды. Смарт-контракттар - code түріндегі, делдалсыз автоматты түрде орындалатын келісімдер.", "body": "## 19 жас, white paper және келесі сұрақ\n\nBitcoin нақты бір міндетті шешті: банксіз цифрлық ақша. Бұл орасан жетістік. Бірақ 2013 жылға қарай blockchain-технология бұдан да көбірек нәрсе істей алатыны айқын болды - егер оны Bitcoin шектеулерінен босатса.\n\nМұны 19 жастағы канадалық-ресейлік бағдарламашы Виталик Бутерин түсінді. Ол қарапайым сұрақ қойды: ал егер blockchain транзакциялар туралы ақпаратты сақтап қана қоймай, еркін бағдарламаларды да орындай алса ше?\n\nBitcoin - мамандандырылған blockchain. Ол бір нәрсені істей алады: Bitcoin-ді бір адрестен екінші адреске беру. Бұл қуатты, бірақ шектеулі. Бутерин бағдарламаланатын blockchain - кез келген бағдарламаны іске қосуға болатын әмбебап децентрализацияланған компьютер жасауды ұсынды.\n\nОл Ethereum White Paper-ді 2013 жылы дипломсыз да, институционалдық қолдаусыз да, инвесторларсыз да жазды. Интернеттегі жай ғана white paper. Идеяның нанымды болғаны сонша, жүздеген әзірлеушіні тартты. Ethereum 2015 жылы іске қосылды - ал 2020-жылдарға қарай Bitcoin-нен кейінгі капитализациясы бойынша екінші криптожеліге айналды.\n\n## Смарт-контракттар: бұзуға болмайтын келісімдер\n\nEthereum-ның орталық инновациясы - смарт-контракттар. Бұл blockchain-де сақталатын және алдын ала белгіленген шарттар орындалғанда автоматты түрде іске қосылатын бағдарламалар. \"Смарт\" - өйткені олар өздері орындалады. \"Контракттар\" - өйткені тараптар арасындағы келісімдерді сипаттайды.\n\nАлдымен кәдімгі контракт қалай жұмыс істейтінін елестет. Сен пәтер жалдайсың. Сен және үй иесі шартқа қол қоясыңдар. Онда былай жазылған: \"Жалға алушы әр айдың бірінші күні төлейді. Кешіксе - айыппұл\". Бірақ бұл жай ғана қағаз. Контракт жұмыс істеуі үшін орындауға мәжбүрлеу жүйесі керек: соттар, заңгерлер, сот орындаушылары. Бұл баяу, қымбат және осы институттарға сенім талап етеді.\n\nСмарт-контракт басқаша жұмыс істейді. Сол шарттар - бірақ code түрінде жазылған. Әр айдың бірінші күні смарт-контракт жалдау ақысын жалға алушының адресінен үй иесінің адресіне автоматты түрде аударады. Төлем жоқ - кілттері де контрактта тұрған ақылды құлып арқылы пәтерге кіру жоқ. Шарттар автоматты түрде, сотсыз және заңгерсіз орындалады. Code - бұл заң.\n\nШынайы өмірден мысал: сен бейтаныс адамнан цифрлық актив сатып алғың келеді. Бұрын екеуің де сенетін делдал керек еді: эскроу-сервис, биржа. Смарт-контрактпен: сенің ақшаң контрактта бұғатталады, сен активті аласың, контракт ақшаны сатушыға автоматты түрде аударады. Егер активті алмасаң - ақша саған қайтарылады. Автоматты түрде. Математикалық түрде. Делдалсыз.\n\nБұл фантастика сияқты көрінген мүмкіндіктерді ашты: сауданы ешкім бақыламайтын децентрализацияланған биржалар. Банксіз несие беру. Орталық санауышсыз дауыс беру. CEO-сы және кеңсесі жоқ ұйымдар.\n\n> Бутерин 19 жасында қаржы үшін Бернерс-Ли 1991 жылы ақпарат үшін жасағанды істеді: әркім құра алатын ашық протокол жасады. Және Бернерс-Ли сияқты, оған монополиядан бас тартты.\n\n2024 жылға қарай Ethereum-да DeFi смарт-контракттарында ондаған миллиард долларлық активтер бұғатталды. Мыңдаған қолданба оның базасында жұмыс істейді. Мұның бәрі 19 жастағы бағдарламашының бір сұрағының салдары: ал егер blockchain ақша ғана емес, басқа да нәрсе істей алса ше?", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["Ethereum", "смарт-келісімшарттар", "блокчейн", "DeFi"], "x": 800.0, "y": 445.0, "angDeg": 0.0}, {"id": "keys", "sceneIndex": 3, "type": "privacy", "shortTitle": "Not your keys", "era": "қағида", "lensWeight": {"chronology": 2, "trust": 3, "sovereignty": 5, "programmability": 1, "access": 3}, "title": "Not your keys - not your coins: self-custody", "insight": "Not your keys - not your coins: активтерді биржада сақтау оларды биржа иеленеді дегенді білдіреді. Self-custody - приват кілт сенде болғанда - жалғыз шынайы қаржылық егемендік.", "thesis": "Not your keys - not your coins: активтерді биржада сақтау оларды биржа иеленеді дегенді білдіреді. Self-custody - приват кілт сенде болғанда - жалғыз шынайы қаржылық егемендік.", "body": "## FTX, Mt. Gox және қайталауға тура келген сабақ\n\n2022 жылғы қараша. FTX - әлемдегі ең ірі криптобиржалардың бірі, 32 миллиард долларға бағаланған. Оның негізін қалаушы Сэм Бэнкман-Фрид Forbes және Time мұқабаларына шығады, АҚШ Конгресінде сөйлейді, саяси науқандарға миллиондаған доллар береді. Бәрі салмақты көрінеді.\n\nСодан кейін бірнеше күн ішінде биржа құлады. Клиенттердің қаражаты тәуекелді ставкаларға пайдаланылғаны анықталды. Миллиондаған адам өз активтеріне қол жеткізе алмай қалды. Бэнкман-Фрид тұтқындалып, сотталды.\n\nБұл бірінші рет емес. 2014 жылы Mt. Gox бұзылды - ол кезде әлемдегі ең ірі биржа, бүкіл Bitcoin транзакцияларының 70%-ы сол арқылы өтетін. 850 000 биткоин жоғалып кетті. 2019 жылы QuadrigaCX биржасының негізін қалаушы қайтыс болды - парольдерді білетін жалғыз адам сол еді. Клиенттердің 190 миллион доллар қаражаты мәңгіге бұғатталып қалды.\n\nӘр жолы паттерн бір: адамдар активтерін биржада сақтап, оған сенді. Биржа делдал болды - дәл банк сияқты. Және дәл банк сияқты, ол бұл билікті оларға қарсы пайдалана алды.\n\nКриптоқауымдастықта әлдеқашан аксиомаға айналған сөз бар: \"Not your keys - not your coins\". Кілтің сенікі болмаса - монетаң да сенікі емес.\n\n## Приват кілт деген не және бұл неге маңызды\n\nBlockchain-де активтер приват кілтпен бақыланады. Бұл символдардың ұзын қатары - әмиян адресімен математикалық байланысқан өте күрделі пароль сияқты нәрсе. Приват кілті бар адам сол адрестегі барлық нәрсені бақылайды. Онсыз қол жеткізу жоқ.\n\nАктивтерді биржада ұстасаң, приват кілт биржада болады. Сен экранда балансты көресің, бірақ бұл биржаның уәдесі, математикалық кепілдік емес. Биржа шығарып алуды тоқтата алады. Банкрот болуы мүмкін. Алаяқ болып шығуы мүмкін.\n\nSelf-custody - дербес сақтау - мынаны білдіреді: приват кілт сенде. Ешбір компания, ешбір реттеуші, бөтен серверді бұзған ешбір хакер сенің кілтіңсіз активтеріңе жете алмайды. Тек сен.\n\nБұл техникалық сияқты естіледі, бірақ бұл қаржылық егемендіктің іргелі принципі. Тарихта алғаш рет қарапайым адам елеулі құндылықтарды делдалсыз сақтай алады - мемлекет немесе корпорация емес, математика беретін кепілдікпен.\n\nСақтаудың бірнеше әдісі бар. 12 немесе 24 сөзден тұратын seed-фраза - приват кілттің адам оқи алатын нұсқасы. Қағазға жазып, сенімді жерге жасырсаң, барлық құрылғың өртеніп кетсе де активтер қауіпсіз болады. Аппараттық әмияндар - Ledger, Trezor - приват кілтті интернеттен оқшауланған физикалық құрылғыда сақтайды. Компьютерің вирус жұқтырса да, кілт қолжетімсіз. Бағдарламалық әмияндар - MetaMask, Rabby Wallet, Tonkeeper - ыңғайлырақ, бірақ кілттерді интернетке қосылған құрылғыда сақтайды, сондықтан көбірек сақтық керек.\n\n> \"Not your keys - not your coins\" - бұл паранойя емес. Бұл математикалық факт. FTX, Mt. Gox, QuadrigaCX - ерекшелік емес. Олар құндылықтарды делдалда сақтаудың болжамды салдары.\n\nКастодиалдық және кастодиалдық емес сақтаудың айырмасын түсіну - техникалық деталь емес. Бұл Web3-тің алғашқы әрі ең маңызды практикалық сабағы. Криптовалютаға биржада иелік ету - алтынды бөтен сейфте сақтаумен бірдей. Ыңғайлы. Сейфтің жоқ екені анықталғанға дейін.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["өзіндік сақтау", "әмиян", "қауіпсіздік", "блокчейн"], "x": 712.1, "y": 657.1, "angDeg": 45.0}, {"id": "wallets", "sceneIndex": 4, "type": "media", "shortTitle": "Әмияндар", "era": "2009→2024", "lensWeight": {"chronology": 4, "trust": 2, "sovereignty": 3, "programmability": 2, "access": 5}, "title": "Әмияндардың эволюциясы: мәтіндік файлдан Telegram-ға дейін", "insight": "Әмияндар 2009 жылғы мәтіндік файлдан 2024 жылғы Telegram ішіндегі батырмаға дейін жетті. Крипто жіберу хабарлама жібергендей оңай болғанда, adoption ауқымы түбегейлі өзгереді.", "thesis": "Әмияндар 2009 жылғы мәтіндік файлдан 2024 жылғы Telegram ішіндегі батырмаға дейін жетті. Крипто жіберу хабарлама жібергендей оңай болғанда, adoption ауқымы түбегейлі өзгереді.", "body": "## «Тек технарларға» арналғаннан «бәріне» арналғанға дейінгі жол\n\nКриптоәмияндар тарихы — кіру кедергісінің біртіндеп төмендеу тарихы. Математиктер мен бағдарламашыларға арналған құралдан өзің онсыз да пайдаланып жүрген мессенджердегі батырмаға дейін.\n\nBitcoin-нің алғашқы пайдаланушылары — 2009-2011 жылдары — жеке кілттерін қатқыл дискідегі мәтіндік файлдарда тікелей сақтайтын. Ешқандай интерфейс жоқ. Ешқандай нұсқау жоқ. Сен жай ғана командалық жолмен жұмыс істеп, файлды жоғалтпауға үміттенетінсің. Көп адам жоғалтты.\n\nЕң белгілі оқиға — Уэльстен шыққан бағдарламашы Джеймс Хоуэллс туралы. 2013 жылы ол үйді толық жинау кезінде ішінде 8000 биткоин бар қатқыл дискіні байқамай лақтырып жіберді. Қазіргі бағамен бұл жүздеген миллион доллар. Диск әлі күнге дейін Ньюпорттағы қалалық қоқыс полигонында жатыр. Хоуэллс оны қазуға рұқсат алу үшін жылдар бойы әрекет етіп келеді, бірақ билік экологиялық себептермен бас тартады.\n\nБұл жай қызық оқиға емес. Бұл ерте Web3 қандай болғанын көрсетеді: техникалық тұрғыдан революциялық, бірақ көпшілік үшін іс жүзінде қолжетімсіз.\n\n## Бағдарламалық әмияндар: ыңғайлылықтың алғашқы революциясы\n\nMetaMask — 2016 жылы іске қосылған браузер кеңейтімі — техникалық білімі жоқ қарапайым адам пайдалана алатын алғашқы әмиян болды. Chrome-ға кеңейтімді орнатасың, «Әмиян жасау» батырмасын басасың, 12 сөзден тұратын seed-фраза аласың, оны жазып қоясың, растайсың — дайын. Бүкіл процесс үш минут алады.\n\nSeed-фраза — жеке кілтіңнің адам оқи алатын нұсқасы. Он екі қарапайым сөз: мысалы, «river cloud magic forest apple sunset...» Осы он екі сөз әмияныңмен математикалық түрде байланысқан. Қағазға жазып, сенімді жерге жасырсаң, компьютер жанып кетсе де, телефон бұзылса да, MetaMask компания ретінде жабылса да, активтерің қауіпсіз болады. Seed-фраза — әрқашан жұмыс істейтін резервтік көшірме.\n\nMetaMask миллиондаған адамға Ethereum-ға қолжетімділік ашты. Одан кейін басқалары пайда болды: мобильді құрылғыларға арналған Trust Wallet, Solana үшін Phantom, DeFi-ге арналған ыңғайлы интерфейсі бар Rabby Wallet — ол транзакцияға қол қойылғанға дейін оның симуляциясын көрсетеді, ал алаяқтар пайдаланушыларды алдаудың жолдарын үнемі іздейтін әлемде бұл қауіпсіздік үшін аса маңызды.\n\n## TON және Telegram: мессенджер ішіндегі әмиян\n\nTonkeeper мен Telegram Wallet кейін ғана айқын көрінген келесі қадам жасады: пайдаланушыдан бөлек қосымша орнатуды неге талап ету керек, егер әмиянды ол күн сайын пайдаланып жүрген қосымшаның ішіне енгізуге болса?\n\nTelegram Wallet — Telegram-ның дәл ішіндегі әмиян. Егер досыңа TON жібергің келсе, оны хабарлама жібергендей жібересің. Чатты ашасың, «бекіту» түймесін басасың, «Transfer» таңдайсың. Мекенжайлар, жеке кілттер, seed-фразалар — мұның бәрі ішкі жағында жұмыс істейді. Сыртынан бұл жай ғана «мессенджерде ақша жіберу».\n\nБұл adoption-ның мүлде басқа деңгейі. «Криптоәмиян орнатыңыз» емес, «өзіңізде бар қосымшадағы батырманы басыңыз». Дәл осылай миллиардтаған қарапайым адам блокчейнмен алғаш рет өздері мұны жасап жатқанын аңғармай-ақ әрекеттесе алады.\n\nКастодиалды және кастодиалды емес әмиян арасындағы айырмашылық маңызды болып қала береді. Telegram Wallet базалық нұсқада кастодиалды: кілттер Telegram серверлерінде сақталады. Бұл ыңғайлырақ, бірақ банк логикасын қайталайды. Tonkeeper — кастодиалды емес: кілттер өзіңде. Бұл күрделірек, бірақ шынайы меншік береді. Бастау үшін — Telegram Wallet. Ірі сомалар үшін — Tonkeeper немесе аппараттық әмиян.\n\n> 2009 жылғы командалық жолдан 2024 жылғы Telegram ішіндегі батырмаға дейінгі жол — кедергіні нөлге дейін төмендету тарихы. Криптовалюта жіберу хабарлама жібергендей оңай болғанда, adoption ауқымы түбегейлі өзгереді.\n\nАппараттық әмияндар — Ledger және Trezor — ірі сомаларды сақтаудың стандарты болып қала береді. Жеке кілт интернеттен оқшауланған физикалық құрылғыда сақталады. Компьютерің keylogger вирусымен зақымданса да, қаскүнем кілтті ала алмайды. Кіру үшін құрылғыдағы батырманы физикалық түрде басу керек.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["әмиян", "өзіндік сақтау", "Telegram", "TON"], "x": 500.0, "y": 745.0, "angDeg": 90.0}, {"id": "defi", "sceneIndex": 5, "type": "economy", "shortTitle": "DeFi", "era": "2020→", "lensWeight": {"chronology": 3, "trust": 3, "sovereignty": 3, "programmability": 5, "access": 4}, "title": "DeFi: қаржы институттарынсыз қаржы", "insight": "DeFi банктер мен брокерлерді смарт-контракттармен алмастырады: несиелер, айырбас, активтерден табыс — KYC-сіз, мақұлдаусыз, 24/7, әлемнің кез келген нүктесінен. Банктік шоты жоқ 1,4 млрд адам қолжетімділік алады.", "thesis": "DeFi банктер мен брокерлерді смарт-контракттармен алмастырады: несиелер, айырбас, активтерден табыс — KYC-сіз, мақұлдаусыз, 24/7, әлемнің кез келген нүктесінен. Банктік шоты жоқ 1,4 млрд адам қолжетімділік алады.", "body": "## DeFi деген не және ол не үшін керек\n\nDeFi — Decentralized Finance, орталықсыздандырылған қаржы. Бұл блокчейнде смарт-контракттар арқылы жұмыс істейтін қаржылық сервистер жиынтығы — банктерсіз, брокерлерсіз және басқа қаржылық делдалдарсыз.\n\nМұндағы революциялық нәрсені түсіну үшін дәстүрлі қаржы қалай жұмыс істейтінін еске түсіру керек. Несие алғың келе ме — банкке барасың, KYC-тексеруден өтесің (Know Your Customer — тұлғаны верификациялау), табыс туралы құжаттарды бересің, шешімді бір апта күтесің. Банк өзі дұрыс деп санаған пайыздық мөлшерлемені қояды. Акциялармен сауда жасағың келе ме — брокерден шот ашасың, тағы KYC, тағы күту. Жинақтан табыс тапқың келе ме — банк жылына 2% ұсынады да, 8% маржаны өзіне қалдырады.\n\nОсы сценарийлердің бәрінде банк немесе брокер — қақпашы. Ол кімге қолжетімділік беруді, қандай шартпен беруді, қандай сыйақы үшін беруді шешеді. Кредиттік тарихы жоқ, қажетті елде тіркеуі жоқ, жеткілікті табысы жоқ адамдар базалық қаржылық сервистерден тыс қалады. Дүниежүзілік банктің дерегі бойынша, әлемде 1,4 миллиард ересек адамның банктік шоты жоқ.\n\n## Uniswap, Aave, Compound: бұл қалай жұмыс істейді\n\nDeFi қақпашыны математикамен алмастырады.\n\nUniswap — орталықсыздандырылған биржа. Дәстүрлі биржада өтінімдер кітабы бар: сатып алушылар мен сатушылар ордер қояды, биржа оларды сәйкестендіреді. Uniswap-та өтінімдер кітабы да, оператор компания да жоқ. Оның орнына өтімділік пулы бар: пайдаланушылар токен жұптарын смарт-контрактта бұғаттап, комиссиялардан үлес алады. Бір токенді басқа токенге айырбастағың келгенде, смарт-контракт бағаны алгоритм бойынша автоматты түрде есептеп, айырбастауды орындайды. KYC жоқ. Мақұлдау жоқ. Жұмыс уақыты жоқ.\n\nAave — кредиттеу протоколы. Сен токендерді кепіл ретінде бұғаттап, басқа токенмен несие ала аласың. Немесе керісінше, токендерді пулға беріп, пайыз аласың. Мөлшерлемелерді банк емес, сұраныс пен ұсыныс автоматты түрде анықтайды. Процесс бірнеше минут алады, 24/7 жұмыс істейді, интернеті бар әлемнің кез келген нүктесінен қолжетімді.\n\nCompound ұқсас қағидамен жұмыс істейді: активтерді бересің — олар автоматты түрде жұмыс істеп, табыс әкеледі. «Жылына 2% депозитке салу» деген жоқ. Мөлшерлемелер нарықтық сұранысқа байланысты нақты уақытта өзгереді.\n\nБұл протоколдардың кеңселері жоқ, өтінімдерді өңдейтін қызметкерлер жалдамайды, дәстүрлі банктердің regulatory overhead шығындарын көтермейді. Сондықтан осы үнемнің бір бөлігі пайдаланушыларға кредиторлар үшін жоғарырақ мөлшерлеме және қарыз алушылар үшін төменірек мөлшерлеме түрінде қайтады.\n\nДон және Алекс Тапскотттар «Blockchain Revolution» кітабында мұны «қаржылық интернет» деп атайды: интернет ақпаратқа қолжетімділікті демократияландырғаны сияқты, DeFi қаржылық сервистерге қолжетімділікті демократияландырады. Нигерия тұрғыны Нью-Йорктегі хедж-қормен бірдей құралдар алады.\n\n> DeFi — тек ыңғайлылық емес. Бұл саяси мәлімдеме: қаржылық қызметтер белгілі бір институттардың клиенттеріне берілетін артықшылық емес, баршаға қолжетімді ашық протокол ретінде.\n\nТәуекелдер нақты: смарт-контракттарда багтар болады, протоколдар бұзылады, нарықтар құбылмалы, реттеушілік орта тұрақсыз. DeFi өмірдің барлық жағдайы үшін дәстүрлі қаржының орнына келетін нәрсе емес. Бірақ қағида революциялық. Және ол жұмыс істейді.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0% келісімшарттар", "қаржы", "блокчейн"], "x": 287.9, "y": 657.1, "angDeg": 135.0}, {"id": "identity", "sceneIndex": 6, "type": "privacy", "shortTitle": "Сәйкестік", "era": "Web3", "lensWeight": {"chronology": 2, "trust": 2, "sovereignty": 5, "programmability": 3, "access": 2}, "title": "Цифрлық идентичтік: Web3-тегі егемен «мен»", "insight": "Web2-де идентичтік платформаға тиесілі және өшірілуі мүмкін. Web3-те ENS, NFT, on-chain бедел — математикалық тұрғыдан тәркілеу мүмкін емес егемен цифрлық тұлға.", "thesis": "Web2-де идентичтік платформаға тиесілі және өшірілуі мүмкін. Web3-те ENS, NFT, on-chain бедел — математикалық тұрғыдан тәркілеу мүмкін емес егемен цифрлық тұлға.", "body": "## Web2-дегі идентичтік мәселесі\n\nАлдыңғы тараудағы Бодрийярды есіңе түсір: әлеуметтік желілерде адамдар өздерінің симулякрларын — шындықтың орнын басатын бейнелерді құрады. Өмірдің Instagram-нұсқасы түпнұсқадан әдемірек әрі бақыттырақ. Бірақ бұл симулякрдың Бодрийяр болжай алмаған тағы бір мәселесі бар: ол платформаға тиесілі.\n\nInstagram миллион жазылушысы бар аккаунтыңды кез келген сәтте, түсіндірмесіз өшіре алады. Twitter бан қоя алады. TikTok бұғаттай алады. Сен жылдар бойы құрғанның бәрі — жазылушылар, бедел, тарих — олардың серверлерінде сақталады және соларға тиесілі.\n\nКрис Диксон «Why Decentralization Matters» еңбегінде мұны Web2 платформаларының негізгі мәселесі ретінде сипаттады: олар болжамды циклден өтеді. Алдымен пайдаланушылар мен әзірлеушілерді жомарт шарттармен тартады. Содан кейін, критикалық масса жинаған соң, ережелерді өз пайдасына өзгертеді. 2007 жылы Facebook-та құрған әзірлеушілер 2012 жылға қарай платформаның бәсекелеске айналғанын байқады. Twitter-де аудитория құрған авторлар 2022 жылға қарай модерация саясаты ескертусіз өзгергенін көрді.\n\nМәселе жаман ниетте емес. Мәселе архитектуралық: сенің идентичтігің бөтен серверде сақталады.\n\n## ENS, NFT-аватарлар және on-chain бедел\n\nWeb3 басқа модель ұсынады — егемен цифрлық идентичтік.\n\nENS — Ethereum Name Service — блокчейнге арналған атаулар жүйесі. «0x742d35Cc6634C0532...» сияқты мекенжайдың орнына сен «luminara.eth» атауын сатып алып, оны әмияныңа байланыстырасың. Бұл интернеттегі домен сияқты жұмыс істейді, тек оны тартып алу мүмкіндігі жоқ. Атыңды бұғаттай алатын компания жоқ. Өшіріп тастай алатын сервер жоқ. Ұзарту ақысын төлеп тұрсаң, ол сенікі. Және ол платформалар арасында көшеді: бір атау, бір мекенжай, барлық жерде.\n\nNFT-аватарлар Web3-идентичтіктің алғашқы жаппай көрінісі болды. CryptoPunks — 2017 жылы іске қосылған 10 000 пиксельдік кейіпкер — мәдени феноменге айналды. Bored Ape Yacht Club қауымдастық құрды: Bored Ape иесі жабық іс-шараларға қолжетімділік, өз кейіпкеріне IP-құқықтар, белгілі бір мәдениетке тиесілік алды. Бұл жай суреттер емес. Бұл мүшелік билеттер, тиесіліліктің дәлелдері, құндылықтарды білдіру тәсілдері.\n\nБірақ ең қызығы — алда не болатыны. On-chain бедел — блокчейндегі тарихыңды автоматты түрде көрсететін профиль. Қандай протоколдарды пайдаландың, қандай дауыс берулерге қатыстың, қандай жобаларды қолдадың, мәмілелерге қатысушы ретінде қаншалықты сенімді болдың. Бұл беделді қолдан жасау мүмкін емес — ол өзгермейтін реестрге жазылған және математикалық түрде верификацияланады. Және ол платформаға емес, саған тиесілі.\n\nWeb3-тегі псевдонимдік идентичтік тағы бір өлшем қосады. Сатоши Накамото аноним болып қала отырып, әлемді өзгертті. Web3-те сен шын атыңды ашпай-ақ, әмиян атауымен мәнді бедел құра аласың. Блокчейндегі әрекеттерің — сенің идентичтігіңнің өзі. Өмірбаян емес. Резюме емес. Фотосуреттер емес. Әрекеттер.\n\n> Web2-де сенің идентичтігің — платформа сен туралы шешкен нәрсе. Web3-те — өзгермейтін реестрге жазылған сен жасаған әрекеттер. Аудиторияға арналған симулякр егемен цифрлық тұлғаға қарсы.\n\nБұл ертең емес және бүгіннің өзінде бәріне арналған емес. Бірақ бағыт анық: интернет идентичтік платформаға емес, адамға тиесілі болатын модельге қарай жылжып келеді. Ал TON — мұны Telegram-ның миллиард пайдаланушысы үшін қолжетімді етудің басты үміткерлерінің бірі.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["бірегейлік", "өзіндік сақтау", "NFT", "Web3"], "x": 200.0, "y": 445.0, "angDeg": 180.0}, {"id": "ton", "sceneIndex": 7, "type": "power", "shortTitle": "TON", "era": "→миллиард", "lensWeight": {"chronology": 4, "trust": 2, "sovereignty": 2, "programmability": 3, "access": 5}, "title": "TON: миллиардқа арналған блокчейн", "insight": "TON Telegram арқылы миллиард пайдаланушыға арнап жобаланған: шексіз шардтау, лездік транзакциялар, мессенджерге кіріктірілу. Adoption сендіру арқылы емес, бар инфрақұрылым арқылы.", "thesis": "TON Telegram арқылы миллиард пайдаланушыға арнап жобаланған: шексіз шардтау, лездік транзакциялар, мессенджерге кіріктірілу. Adoption сендіру арқылы емес, бар инфрақұрылым арқылы.", "body": "## Ethereum шешпеген масштаб мәселесі\n\n2017 жылға қарай Ethereum тұжырымдаманы дәлелдеді: smart contract жұмыс істейді, децентрализденген қолданбалар мүмкін. Бірақ жаңа мәселе пайда болды — масштаб.\n\nEthereum базалық нұсқасында секундына шамамен 15 транзакция өңдейді. Салыстыру үшін: Visa орта есеппен секундына 1700 транзакция өңдейді, ал ең жоғары кезеңдерде — 24 000-ға дейін. Ethereum желісінде танымал қолданба пайда болғанда — мысалы, 2017 жылғы CryptoKitties ойыны — желі тура мағынасында шамадан тыс жүктелді. Пайдаланушылар сағаттап күтті, ал комиссиялар бір транзакция үшін ондаған долларға дейін өсті. Баршаға арналған блокчейн барша үшін тым баяу болып шықты.\n\nСонымен қатар, Ethereum пайдалану техникалық тұрғыдан күрделі болды. Әмиян орнату керек. Комиссия төлеу үшін арнайы ETH сатып алу керек. Бағдарламашылар бағдарламашыларға арнап жобалаған интерфейстерді түсіну керек. Telegram-ның орташа пайдаланушысы үшін бұл тым жоғары кедергі.\n\n## TON: масштабқа арнап жобаланған архитектура\n\n2018-2019 жылдары ағайынды Дуровтар — Павел мен Николай — TON: The Open Network жобасымен жұмыс істеді. Николай Дуров — өз буынындағы ең мықты математиктер мен бағдарламашылардың бірі, ВКонтакте және Telegram алгоритмдерінің жасаушысы. Ол TON-ды нөлден бастап, нақты мақсатты көздеп жобалады: жүйе миллиард пайдаланушы үшін жұмыс істеуі керек.\n\nTON Whitepaper оны Bitcoin мен Ethereum-нан ажырататын бірнеше негізгі техникалық шешімді сипаттайды.\n\nШексіз шардтау. Блокчейнді масштабтаудың негізгі мәселесі: транзакция көбейген сайын желі баяулайды, өйткені әрбір түйін бәрін өңдеуі керек. TON мұны автоматты шардтау арқылы шешеді: жүктеме өскен сайын желі параллель тізбектерге (шардтарға) бөлінеді — қарбалас уақытта жолдың жолақтарды автоматты түрде қосқаны сияқты. Теориялық тұрғыдан бұл жылдамдықты жоғалтпай масштабталуға мүмкіндік береді.\n\nЛездік транзакциялар. Bitcoin-де транзакция 10-60 минутта расталады. Ethereum-да — бірнеше минутта. TON-да оптимистік растаулар механизмі транзакцияларды секундтар ішінде өңдеуге мүмкіндік береді. Төлем сервисі үшін бұл принципті маңызды.\n\nКіріктірілген сервистер. Bitcoin мен Ethereum-да DNS (домендік атаулар жүйесі), файл сақтау және басқа сервистер — сыртқы қондырмалар. TON-да олар протоколға кіріктірілген. Бұл қолданба әзірлеуді жеңілдетеді және сыртқы сервистерге тәуелділікті азайтады.\n\n## Telegram кіру нүктесі ретінде\n\nБірақ TON-дағы ең маңызды нәрсе — контекст. Бұл Ethereum-мен бәсекелесетін кезекті блокчейн ғана емес. Бұл 950 миллион пайдаланушысы бар мессенджер Telegram үшін қаржылық қабат.\n\nСтратегия бәсекелестерден түбегейлі өзгеше. Bitcoin мен Ethereum экожүйені нөлден құрды: пайдаланушыларды тарту, оларды әмиян орнатуға көндіру, блокчейннің не екенін түсіндіру. TON бар инфрақұрылымға кіріктіріледі: сенде Telegram бар, сенде контактілер бар, сенде қолданбаны күн сайын пайдалану әдеті бар. Тек әмиян қос — базалық криптотранзакциялар үшін қажет нәрсенің бәрі осында.\n\nДжаред Ларни «Own the Internet» эссесінде пайдаланушылар токендер арқылы платформалардың бір бөлігіне иелік ететін болашақты сипаттайды. TON дәл осы бағытта қозғалып келеді: Telegram пайдаланушылары — сервистің жай тұтынушылары емес, TON-экономиканың әлеуетті қатысушылары.\n\nTON жолы оңай болған жоқ: бастапқы жобаны SEC 2020 жылы бұғаттады. Дуровтар жобаны жапты. Бірақ қауымдастық TON Foundation атауымен дамытуды жалғастырды. 2024 жылға қарай TON ең жылдам өсіп жатқан блокчейндердің біріне айналды — Telegram ішіндегі DeFi, NFT-экожүйе және Mini Apps белсенді дамыды.\n\n> TON масштабтың жай ғана техникалық міндетін шешпейді. Ол adoption міндетін шешеді: блокчейн туралы ешқашан естімеген адамдарға блокчейнді қалай қолжетімді етуге болады — өйткені ол олар қазірдің өзінде пайдаланып жүрген қолданбаға кіріктірілген.\n\nКелесі шеп осы: адамдарды жаңа технологияларға көшуге көндіру емес, жаңа технологияларды олардың бар өміріне кіріктіру. Байқатпай. Кедергісіз. Жеке кілттер туралы дәрістерсіз.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20
