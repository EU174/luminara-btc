0A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["Ethereum", "contratos inteligentes", "blockchain", "DeFi"], "x": 800.0, "y": 445.0, "angDeg": 0.0}, {"id": "keys", "sceneIndex": 3, "type": "privacy", "shortTitle": "Not your keys", "era": "principio", "lensWeight": {"chronology": 2, "trust": 3, "sovereignty": 5, "programmability": 1, "access": 3}, "title": "No tus claves - no tus monedas: autocustodia", "insight": "Not your keys - not your coins: guardar activos en una bolsa significa que la bolsa los posee. La autocustodia - cuando la clave privada está contigo - es la única verdadera soberanía financiera.", "thesis": "Not your keys - not your coins: guardar activos en una bolsa significa que la bolsa los posee. La autocustodia - cuando la clave privada está contigo - es la única verdadera soberanía financiera.", "body": "## FTX, Mt. Gox y la lección que hubo que repetir\n\nNoviembre de 2022. FTX es una de las mayores bolsas de criptomonedas del mundo, valorada en 32 mil millones de dólares. Su fundador Sam Bankman-Fried aparece en las portadas de Forbes y Time, habla en el Congreso de EE. UU., dona millones a campañas políticas. Todo parece sólido.\n\nLuego, en cuestión de días, la bolsa se derrumbó. Se descubrió que los fondos de los clientes se usaban para apuestas arriesgadas. Millones de personas perdieron acceso a sus activos. Bankman-Fried fue arrestado y condenado.\n\nNo era la primera vez. En 2014, hackearon Mt. Gox, entonces la mayor bolsa del mundo, por la que pasaba el 70% de todas las transacciones de Bitcoin. Desaparecieron 850,000 bitcoins. En 2019 murió el fundador de la bolsa QuadrigaCX, la única persona que conocía las contraseñas. 190 millones de dólares de fondos de clientes quedaron encerrados para siempre.\n\nCada vez el patrón es el mismo: la gente guardaba activos en una bolsa, confiando en ella. La bolsa era un intermediario, exactamente igual que un banco. E igual que un banco, podía usar ese poder contra ellos.\n\nDesde hace tiempo, en la comunidad cripto existe una frase que se volvió axioma: \"Not your keys - not your coins\". No son tus claves - no son tus monedas.\n\n## Qué es una clave privada y por qué importa\n\nEn blockchain, los activos están controlados por una clave privada. Es una larga cadena de caracteres, algo así como una contraseña muy compleja, vinculada matemáticamente a una dirección de wallet. Quien tiene la clave privada controla todo en esa dirección. Sin ella, no hay acceso.\n\nCuando mantienes activos en una bolsa, la clave privada la tiene la bolsa. Ves un saldo en la pantalla, pero es la promesa de la bolsa, no una garantía matemática. La bolsa puede congelar los retiros. Puede quebrar. Puede resultar fraudulenta.\n\nSelf-custody - custodia propia - significa: la clave privada la tienes tú. Ninguna empresa, ningún regulador, ningún hacker que haya vulnerado el servidor de otra persona puede llegar a tus activos sin tu clave. Solo tú.\n\nEsto suena técnico, pero es un principio fundamental de la soberanía financiera. Por primera vez en la historia, una persona común puede guardar valores significativos sin intermediario, con una garantía que da la matemática y no el Estado ni una corporación.\n\nHay varios métodos de almacenamiento. Una seed phrase de 12 o 24 palabras es la versión legible por humanos de la clave privada. Si la escribes en papel y la guardas en un lugar seguro, los activos están a salvo incluso si todos tus dispositivos se queman. Las wallets de hardware - Ledger, Trezor - almacenan la clave privada en un dispositivo físico aislado de Internet. Incluso si tu computadora se infecta con un virus, la clave sigue inaccesible. Las wallets de software - MetaMask, Rabby Wallet, Tonkeeper - son más cómodas, pero guardan las claves en un dispositivo conectado a Internet, lo que exige más cuidado.\n\n> \"Not your keys - not your coins\" no es paranoia. Es un hecho matemático. FTX, Mt. Gox, QuadrigaCX no son excepciones. Son consecuencias previsibles de guardar valor con un intermediario.\n\nEntender la diferencia entre custodia y autocustodia no es un detalle técnico. Es la primera y más importante lección práctica de Web3. Tener criptomonedas en una bolsa es como guardar oro en la caja fuerte de otra persona. Cómodo. Hasta que resulta que no hay caja fuerte.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["autocustodia", "billetera", "seguridad", "blockchain"], "x": 712.1, "y": 657.1, "angDeg": 45.0}, {"id": "wallets", "sceneIndex": 4, "type": "media", "shortTitle": "Billeteras", "era": "2009→2024", "lensWeight": {"chronology": 4, "trust": 2, "sovereignty": 3, "programmability": 2, "access": 5}, "title": "La evolución de las billeteras: de un archivo de texto a Telegram", "insight": "Las billeteras recorrieron el camino de un archivo de texto en 2009 a un botón en Telegram en 2024. Cuando enviar cripto se vuelve tan simple como enviar un mensaje, la escala de la adopción cambia de forma radical.", "thesis": "Las billeteras recorrieron el camino de un archivo de texto en 2009 a un botón en Telegram en 2024. Cuando enviar cripto se vuelve tan simple como enviar un mensaje, la escala de la adopción cambia de forma radical.", "body": "## El camino de «solo para técnicos» a «para todos»\n\nLa historia de las billeteras cripto es la historia de reducir gradualmente la barrera de entrada. De una herramienta para matemáticos y programadores a un botón dentro del mensajero que ya usas.\n\nLos primeros usuarios de Bitcoin, entre 2009 y 2011, guardaban las claves privadas literalmente en archivos de texto en un disco duro. Sin interfaz. Sin indicaciones. Simplemente trabajabas con la línea de comandos y esperabas no perder el archivo. Muchos lo perdieron.\n\nLa historia más conocida es la del programador James Howells, de Gales. En 2013, durante una limpieza general de su casa, tiró por error un disco duro con 8000 bitcoins. A los precios actuales, eso son cientos de millones de dólares. El disco sigue en un vertedero municipal en Newport. Howells lleva años intentando conseguir permiso para excavar allí, pero las autoridades se lo niegan por motivos ambientales.\n\nEsto no es una curiosidad. Es una ilustración de cómo era el Web3 temprano: técnicamente revolucionario, pero prácticamente inaccesible para la mayoría de la gente.\n\n## Las billeteras de software: la primera revolución de la comodidad\n\nMetaMask, una extensión del navegador lanzada en 2016, se convirtió en la primera billetera que una persona normal podía usar sin educación técnica. Instalas la extensión en Chrome, haces clic en «Crear billetera», recibes una frase semilla de 12 palabras, la anotas, la confirmas y listo. Todo el proceso toma tres minutos.\n\nUna frase semilla es la versión legible para humanos de tu clave privada. Doce palabras comunes: por ejemplo, «river cloud magic forest apple sunset...» Esas doce palabras están vinculadas matemáticamente a tu billetera. Escríbelas en papel, guárdalas en un lugar seguro y tus activos estarán protegidos incluso si tu computadora se quema, el teléfono se rompe o MetaMask deja de existir como empresa. Una frase semilla es una copia de seguridad que siempre funciona.\n\nMetaMask abrió el acceso a Ethereum a millones de personas. Luego llegaron otros: Trust Wallet para dispositivos móviles, Phantom para Solana, Rabby Wallet con una interfaz cómoda para DeFi. Muestra una simulación de la transacción antes de firmarla, algo crítico para la seguridad en un mundo en el que los estafadores buscan constantemente formas de engañar a los usuarios.\n\n## TON y Telegram: una billetera dentro del mensajero\n\nTonkeeper y Telegram Wallet dieron el siguiente paso, uno que solo parecía obvio a posteriori: ¿por qué exigirle al usuario que instale una app aparte si puedes integrar la billetera en la aplicación que ya usa todos los días?\n\nTelegram Wallet es una billetera directamente dentro de Telegram. Si quieres enviar TON a un amigo, lo envías igual que envías un mensaje. Abres un chat, tocas «adjuntar», eliges «Transfer». Direcciones, claves privadas, frases semilla: todo eso funciona por debajo. Por fuera, es simplemente «enviar dinero en un mensajero».\n\nEse es un nivel de adopción fundamentalmente distinto. No «instala una billetera cripto», sino «pulsa un botón en la app que ya tienes». Así es como miles de millones de personas normales pueden interactuar con blockchain por primera vez sin darse cuenta de que lo están haciendo.\n\nLa diferencia entre una billetera custodial y una no custodial sigue siendo importante. Telegram Wallet, en su versión básica, es custodial: las claves se almacenan en los servidores de Telegram. Es más cómodo, pero reproduce la lógica de un banco. Tonkeeper es no custodial: las claves son tuyas. Es más complejo, pero da propiedad real. Para empezar, usa Telegram Wallet. Para montos serios, usa Tonkeeper o una billetera de hardware.\n\n> El camino de la línea de comandos en 2009 a un botón en Telegram en 2024 es la historia de reducir la barrera a cero. Cuando enviar criptomonedas se vuelve tan simple como enviar un mensaje, la escala de la adopción cambia de forma radical.\n\nLas billeteras de hardware, Ledger y Trezor, siguen siendo el estándar para guardar cantidades importantes. La clave privada se almacena en un dispositivo físico aislado de internet. Incluso si tu computadora está infectada con un virus keylogger, un atacante no obtendrá la clave. Para entrar, tienes que pulsar físicamente un botón en el dispositivo.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["billetera", "autocustodia", "Telegram", "TON"], "x": 500.0, "y": 745.0, "angDeg": 90.0}, {"id": "defi", "sceneIndex": 5, "type": "economy", "shortTitle": "DeFi", "era": "2020→", "lensWeight": {"chronology": 3, "trust": 3, "sovereignty": 3, "programmability": 5, "access": 4}, "title": "DeFi: finanzas sin instituciones financieras", "insight": "DeFi reemplaza a bancos y corredores con smart contracts: préstamos, intercambio, ingresos sobre activos, sin KYC, sin aprobación, 24/7, desde cualquier parte del mundo. 1.4 mil millones de personas sin cuenta bancaria obtienen acceso.", "thesis": "DeFi reemplaza a bancos y corredores con smart contracts: préstamos, intercambio, ingresos sobre activos, sin KYC, sin aprobación, 24/7, desde cualquier parte del mundo. 1.4 mil millones de personas sin cuenta bancaria obtienen acceso.", "body": "## Qué es DeFi y por qué se necesita\n\nDeFi significa Decentralized Finance. Es un conjunto de servicios financieros que funcionan en blockchain a través de smart contracts, sin bancos, corredores ni otros intermediarios financieros.\n\nPara entender qué tiene de revolucionario, hay que recordar cómo funciona la finanza tradicional. ¿Quieres pedir un crédito? Vas al banco, pasas una verificación KYC (Know Your Customer, verificación de identidad), presentas documentos de ingresos y esperas una semana a que te respondan. El banco fija la tasa de interés que considera adecuada. ¿Quieres operar con acciones? Abres una cuenta en un corredor, otra vez KYC, otra vez espera. ¿Quieres ganar sobre tus ahorros? El banco ofrece 2% al año y se queda con un margen de 8%.\n\nEn todos esos escenarios, el banco o el corredor es el guardián de acceso. Decide quién entra, en qué condiciones y a cambio de qué recompensa. Las personas sin historial crediticio, sin residencia en el país correcto o sin ingresos suficientes quedan fuera de los servicios financieros básicos. Según el Banco Mundial, 1.4 mil millones de adultos en el mundo no tienen cuenta bancaria.\n\n## Uniswap, Aave, Compound: cómo funciona\n\nDeFi reemplaza al guardián con matemáticas.\n\nUniswap es un exchange descentralizado. En un exchange tradicional hay un libro de órdenes: compradores y vendedores colocan órdenes y el exchange las empareja. En Uniswap no hay libro de órdenes ni empresa operadora. En su lugar, hay un pool de liquidez: los usuarios bloquean pares de tokens en un smart contract y reciben una parte de las comisiones. Cuando quieres cambiar un token por otro, el smart contract calcula automáticamente el precio con un algoritmo y ejecuta el intercambio. Sin KYC. Sin aprobación. Sin horarios de oficina.\n\nAave es un protocolo de préstamos. Puedes bloquear tokens como garantía y recibir un préstamo en otro token. O, al contrario, aportar tokens a un pool y ganar intereses. Las tasas se determinan automáticamente por la oferta y la demanda, no por un banco. El proceso toma minutos, funciona 24/7 y está disponible desde cualquier parte del mundo con acceso a internet.\n\nCompound funciona con un principio similar: aportas activos y ellos trabajan automáticamente y generan ingresos. Nada de “dejar dinero en depósito al 2% anual”. Las tasas cambian en tiempo real según la demanda del mercado.\n\nEstos protocolos no tienen oficinas, no contratan empleados para procesar solicitudes y no cargan con la regulatory overhead de los bancos tradicionales. Por eso parte de ese ahorro vuelve a los usuarios en forma de tasas más altas para los prestamistas y más bajas para los prestatarios.\n\nDon y Alex Tapscott, en “Blockchain Revolution”, lo llaman el “internet de las finanzas”: así como internet democratizó el acceso a la información, DeFi democratiza el acceso a los servicios financieros. Una persona en Nigeria obtiene las mismas herramientas que un fondo de cobertura en Nueva York.\n\n> DeFi no es solo comodidad. Es una declaración política: los servicios financieros como un protocolo abierto, disponible para todos, y no como un privilegio de los clientes de ciertas instituciones.\n\nLos riesgos son reales: los smart contracts tienen fallos, los protocolos son atacados, los mercados son volátiles y el entorno regulatorio es inestable. DeFi no reemplaza a la finanza tradicional en todos los casos. Pero el principio es revolucionario. Y funciona.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["DeFi", "contratos inteligentes", "finanzas", "blockchain"], "x": 287.9, "y": 657.1, "angDeg": 135.0}, {"id": "identity", "sceneIndex": 6, "type": "privacy", "shortTitle": "Identidad", "era": "Web3", "lensWeight": {"chronology": 2, "trust": 2, "sovereignty": 5, "programmability": 3, "access": 2}, "title": "Identidad digital: el “yo” soberano en Web3", "insight": "En Web2, la identidad le pertenece a la plataforma y puede borrarse. En Web3, ENS, NFT y la reputación on-chain forman una persona digital soberana que matemáticamente no se puede confiscar.", "thesis": "En Web2, la identidad le pertenece a la plataforma y puede borrarse. En Web3, ENS, NFT y la reputación on-chain forman una persona digital soberana que matemáticamente no se puede confiscar.", "body": "## El problema de la identidad en Web2\n\nRecuerda a Baudrillard del capítulo anterior: en las redes sociales, las personas construyen simulacros de sí mismas, imágenes que reemplazan la realidad. Una versión de la vida en Instagram, más bonita y más feliz que la original. Pero este simulacro tiene otro problema que Baudrillard no pudo prever: le pertenece a la plataforma.\n\nInstagram puede borrar tu cuenta con un millón de seguidores en cualquier momento, sin explicación. Twitter puede bloquearte. TikTok puede restringirte. Todo lo que construiste durante años, seguidores, reputación, historia, queda almacenado en sus servidores y les pertenece.\n\nChris Dixon, en “Why Decentralization Matters”, describió esto como el problema clave de las plataformas Web2: pasan por un ciclo predecible. Primero atraen usuarios y desarrolladores con condiciones generosas. Luego, al ganar masa crítica, cambian las reglas a su favor. Los desarrolladores que construían sobre Facebook en 2007 descubrieron para 2012 que la plataforma se había vuelto competidora. Los creadores que formaron audiencia en Twitter descubrieron para 2022 que la política de moderación había cambiado sin aviso.\n\nEl problema no es la mala intención. El problema es arquitectónico: tu identidad se guarda en el servidor de otra persona.\n\n## ENS, avatares NFT y reputación on-chain\n\nWeb3 propone otro modelo: identidad digital soberana.\n\nENS, Ethereum Name Service, es un sistema de nombres para blockchain. En lugar de una dirección como “0x742d35Cc6634C0532...”, compras el nombre “luminara.eth” y lo vinculas a tu billetera. Funciona como un dominio en internet, solo que sin posibilidad de que te lo quiten. No hay ninguna empresa que pueda bloquear tu nombre. Ningún servidor que puedan apagar. Mientras pagues la renovación, es tuyo. Y se mueve entre plataformas: un nombre, una dirección, en todas partes.\n\nLos avatares NFT se convirtieron en la primera expresión masiva de la identidad Web3. CryptoPunks, 10 000 personajes pixelados lanzados en 2017, se volvieron un fenómeno cultural. Bored Ape Yacht Club creó una comunidad: el dueño de un Bored Ape obtenía acceso a eventos privados, derechos de propiedad intelectual sobre su personaje y pertenencia a una cultura específica. No son solo imágenes. Son tarjetas de membresía, pruebas de pertenencia, formas de señalar valores.\n\nPero lo más interesante es lo que viene después. La reputación on-chain es un perfil que refleja automáticamente tu historia en blockchain. Qué protocolos usaste, en qué votaciones participaste, qué proyectos apoyaste, qué tan confiable resultaste como participante en transacciones. Esta reputación no se puede falsificar: queda registrada en un libro mayor inmutable y se verifica matemáticamente. Y te pertenece a ti, no a una plataforma.\n\nLa identidad seudónima en Web3 agrega otra dimensión. Satoshi Nakamoto cambió el mundo sin dejar de ser anónimo. En Web3, puedes construir una reputación valiosa con el nombre de una billetera sin revelar tu nombre real. Tus acciones en blockchain son tu identidad. No una biografía. No un currículum. No fotografías. Acciones.\n\n> En Web2, tu identidad es lo que la plataforma decidió sobre ti. En Web3, es lo que hiciste, registrado en un libro mayor inmutable. Un simulacro para una audiencia frente a una persona digital soberana.\n\nEsto no es para mañana, ni para todos hoy. Pero la dirección es clara: internet se mueve hacia un modelo en el que la identidad pertenece a la persona, no a la plataforma. Y TON es uno de los principales candidatos para hacer esto accesible a mil millones de usuarios de Telegram.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["identidad", "autocustodia", "NFT", "Web3"], "x": 200.0, "y": 445.0, "angDeg": 180.0}, {"id": "ton", "sceneIndex": 7, "type": "power", "shortTitle": "TON", "era": "→mil millones", "lensWeight": {"chronology": 4, "trust": 2, "sovereignty": 2, "programmability": 3, "access": 5}, "title": "TON: una blockchain para mil millones", "insight": "TON está diseñado para mil millones de usuarios a través de Telegram: sharding infinito, transacciones instantáneas e integración dentro del mensajero. La adopción ocurre gracias a la infraestructura existente, no a la persuasión.", "thesis": "TON está diseñado para mil millones de usuarios a través de Telegram: sharding infinito, transacciones instantáneas e integración dentro del mensajero. La adopción ocurre gracias a la infraestructura existente, no a la persuasión.", "body": "## El problema de escala que Ethereum no resolvió\n\nPara 2017, Ethereum había demostrado el concepto: los smart contracts funcionan, las aplicaciones descentralizadas son posibles. Pero apareció un problema nuevo: la escala.\n\nEthereum en su versión básica procesa unas 15 transacciones por segundo. Para comparar: Visa procesa en promedio 1,700 transacciones por segundo, y en los períodos de pico, hasta 24,000. Cuando apareció una aplicación popular en la red Ethereum, por ejemplo el juego CryptoKitties en 2017, la red literalmente se saturó. Los usuarios esperaban horas y las comisiones subieron hasta decenas de dólares por una sola transacción. Una blockchain para todos resultó demasiado lenta para todos.\n\nAdemás, usar Ethereum era técnicamente difícil. Había que instalar una wallet. Comprar ETH específicamente para pagar comisiones. Entender interfaces diseñadas por programadores para programadores. Para el usuario promedio de Telegram, la barrera era demasiado alta.\n\n## TON: una arquitectura diseñada para escalar\n\nEntre 2018 y 2019, los hermanos Durov, Pavel y Nikolai, trabajaron en TON: The Open Network. Nikolai Durov es uno de los matemáticos y programadores más fuertes de su generación, creador de los algoritmos de VKontakte y Telegram. Diseñó TON desde cero con un objetivo concreto: el sistema debía funcionar para mil millones de usuarios.\n\nEl TON Whitepaper describe varias decisiones técnicas clave que lo distinguen de Bitcoin y Ethereum.\n\nSharding infinito. El principal problema de la escalabilidad de una blockchain: cuanto más transacciones hay, más lenta funciona la red, porque cada nodo debe procesarlo todo. TON resuelve esto con sharding automático: la red se divide en cadenas paralelas (shards) a medida que crece la carga, como una carretera que agrega carriles automáticamente en hora pico. En teoría, esto permite escalar sin perder velocidad.\n\nTransacciones instantáneas. En Bitcoin, una transacción se confirma en 10-60 minutos. En Ethereum, en varios minutos. En TON, el mecanismo de confirmaciones optimistas permite procesar transacciones en segundos. Para un servicio de pagos, esto es fundamental.\n\nServicios integrados. En Bitcoin y Ethereum, DNS (el sistema de nombres de dominio), el almacenamiento de archivos y otros servicios son complementos externos. En TON, están integrados en el protocolo. Esto simplifica el desarrollo de aplicaciones y reduce la dependencia de servicios externos.\n\n## Telegram como punto de entrada\n\nPero lo más importante de TON es el contexto. No es solo otra blockchain que compite con Ethereum. Es una capa financiera para Telegram, un mensajero con 950 millones de usuarios.\n\nLa estrategia es fundamentalmente distinta a la de los competidores. Bitcoin y Ethereum construyeron un ecosistema desde cero: atraer usuarios, convencerlos de instalar una wallet, explicar qué es una blockchain. TON se integra en la infraestructura existente: ya tienes Telegram, ya tienes contactos, ya tienes el hábito de usar la aplicación todos los días. Solo agrega una wallet, y todo lo que necesitas para las transacciones cripto básicas ya está aquí.\n\nJared Larnie, en el ensayo «Own the Internet», describe un futuro en el que los usuarios poseen una parte de las plataformas a través de tokens. TON avanza exactamente en esa dirección: los usuarios de Telegram son participantes potenciales de la economía de TON, no solo consumidores del servicio.\n\nEl camino de TON no fue fácil: el proyecto original fue bloqueado por la SEC en 2020. Los Durov cerraron el proyecto. Pero la comunidad continuó el desarrollo bajo el nombre de TON Foundation. Para 2024, TON se había convertido en una de las blockchains de crecimiento más rápido, con desarrollo activo de DeFi, del ecosistema NFT y de Mini Apps dentro de Telegram.\n\n> TON no resuelve solo el problema técnico de la escala. Resuelve el problema de adoption: cómo hacer que blockchain sea accesible para personas que nunca han oído hablar de blockchain, porque está integrada en la aplicación que ya usan.\n\nEste es el siguiente frente: no convencer a las personas de cambiarse a nuevas tecnologías, sino integrar nuevas tecnologías en su vida existente. Sin que se note. Sin barreras. Sin clases sobre claves privadas.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["TON", "Telegram", "blockchain", "escalabilidad"], "x": 287.9, "y": 232.9, "angDeg": 225.0}], "edges": [{"from": "intermediary", "to": "nakamoto", "label": "el problema se resolvió sin intermediario", "lenses": ["chronology", "trust"]}, {"from": "nakamoto", "to": "buterin", "label": "del registro a la computadora", "lenses": ["chronology", "programmability"]}, {"from": "buterin", "to": "defi", "label": "los smart contracts sustituyen a los bancos", "lenses": ["programmability", "access"]}, {"from": "nakamoto", "to": "keys", "label": "la soberanía requiere claves", "lenses": ["trust", "sovereignty"]}, {"from": "keys", "to": "wallets", "label": "las claves se escondieron en la billetera", "lenses": ["sovereignty", "access"]}, {"from": "wallets", "to": "ton", "label": "enviar cripto como un mensaje", "lenses": ["access", "chronology"]}, {"from": "keys", "to": "identity", "label": "el “yo” soberano es inalienable", "lenses": ["sovereignty"]}, {"from": "buterin", "to": "identity", "label": "la identidad es programable", "lenses": ["programmability", "sovereignty"]}, {"from": "defi", "to": "ton", "label": "acceso para 1,4 mil millones sin banco", "lenses": ["access", "economy"]}, {"from": "intermediary", "to": "defi", "label": "finanzas sin instituciones", "lenses": ["trust", "programmability"]}, {"from": "wallets", "to": "defi", "label": "la billetera es la entrada a DeFi", "lenses": ["access", "programmability"]}]}, "fr": {"chapter": {"key": "web3", "title": "Blockchain", "lede": "La confiance sans intermédiaire, par les mathématiques et non par le pouvoir. Du problème de la double dépense à TON.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=web3", "centralIdea": "La confiance sans intermédiaire, par les mathématiques, pas par le pouvoir", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "chronology", "label": "Chronologie", "accent": "#7dd3fc", "description": "Du problème de l’intermédiaire, via Nakamoto et Buterin, jusqu’à TON."}, {"id": "trust", "label": "Confiance", "accent": "#fbbf24", "description": "Double dépense et registre distribué : la confiance sans banque."}, {"id": "sovereignty", "label": "Souveraineté", "accent": "#c084fc", "description": "Self-custody, « not your keys » et identité numérique souveraine."}, {"id": "programmability", "label": "Programmabilité", "accent": "#34d399", "description": "Buterin et les smart contracts : la blockchain comme ordinateur universel et DeFi."}, {"id": "access", "label": "Accès", "accent": "#f87171", "description": "Portefeuilles et TON : la blockchain pour un milliard de personnes via l’infrastructure existante."}], "nodes": [{"id": "intermediary", "sceneIndex": 0, "type": "power", "shortTitle": "Intermédiaire", "era": "problème", "lensWeight": {"chronology": 4, "trust": 5, "sovereignty": 2, "programmability": 1, "access": 2}, "title": "Le problème de l'intermédiaire : pourquoi nous avons besoin d'une banque", "insight": "L'intermédiaire existe parce qu'un fichier numérique peut être copié : la banque veille à ce que les mêmes fonds ne soient pas dépensés deux fois. blockchain résout ce problème mathématiquement, sans intermédiaire.", "thesis": "L'intermédiaire existe parce qu'un fichier numérique peut être copié : la banque veille à ce que les mêmes fonds ne soient pas dépensés deux fois. blockchain résout ce problème mathématiquement, sans intermédiaire.", "body": "## Une question simple avec une réponse pas si évidente\n\nImagine que tu veux envoyer de l'argent à un ami dans un autre pays. On pourrait croire qu'à l'ère numérique, cela devrait être simple. Tu ouvres une application, tu saisis le montant, tu appuies sur un bouton. Mais derrière cette apparente simplicité se cache un système complexe d'intermédiaires.\n\nTu ne peux pas simplement « envoyer un fichier avec de l'argent ». Parce qu'un fichier numérique peut être copié. Si tu avais un « dollar numérique » sous forme de fichier, tu pourrais l'envoyer à vingt personnes en même temps tout en gardant l'original pour toi. C'est ce qu'on appelle le « problème de la double dépense » et c'est précisément pour cela que nous ne pouvons pas transférer de l'argent directement sur Internet comme nous transférons du texte ou une photo.\n\nC'est pourquoi une banque est nécessaire. Une banque tient un registre centralisé : tu as cent dollars. Tu en envoies cinquante à un ami. La banque enregistre : il te reste cinquante, ton ami a cinquante de plus. La banque veille à ce que les mêmes fonds ne soient pas dépensés deux fois. C'est sa fonction principale.\n\nUn intermédiaire de confiance. Tu fais confiance à la banque, ton ami fait confiance à la banque, et grâce à cela vous vous faites confiance. Tout le système financier est un réseau de tels intermédiaires : banques, systèmes de paiement, bourses, notaires, régulateurs. Ils existent parce que des inconnus ne se font pas confiance directement.\n\n## Le prix de l'intermédiaire\n\nCe système a fonctionné pendant des siècles. Mais il a un problème fondamental : l'intermédiaire détient du pouvoir. Et il peut utiliser ce pouvoir pas seulement dans ton intérêt.\n\nUne banque peut geler ton compte, à la demande de l'État, en cas de soupçon de violation des règles, ou à cause d'une panne technique. Un système de paiement peut refuser une transaction parce que le destinataire figure sur une liste « indésirable ». Un gouvernement peut confisquer des actifs, comme cela s'est produit à Chypre en 2013, lorsque les banques ont gelé les dépôts et en ont partiellement réduit la valeur. Une plateforme d'échange peut fermer sans verser l'argent aux clients, comme FTX en 2022.\n\nL'intermédiaire en qui tu as confiance aujourd'hui peut utiliser son pouvoir contre toi demain. Non pas parce qu'il est malveillant, mais parce qu'il a des motivations qui ne coïncident pas avec les tiennes.\n\nEric Hughes a formulé ce problème dans *A Cypherpunk's Manifesto* dès 1993 : dans une société ouverte, la vie privée exige un système de transactions anonymes. Pas un système où l'intermédiaire promet de garder le secret, mais un système où il est mathématiquement impossible de le violer. Hughes a décrit le cahier des charges technique. La solution est apparue quinze ans plus tard.\n\n> Un intermédiaire de confiance n'est pas un méchant. C'est une nécessité architecturale dans un monde sans cryptographie. blockchain supprime cette nécessité en remplaçant la confiance en une personne par une garantie mathématique.\n\nComprendre ce remplacement est la clé pour comprendre tout ce qui s'est passé ensuite. Si la confiance peut s'exprimer mathématiquement, alors ni banque, ni notaire, ni régulateur ne sont nécessaires. Il ne faut que du code.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["blockchain", "confiance", "décentralisation", "finance"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "nakamoto", "sceneIndex": 1, "type": "technology", "shortTitle": "Nakamoto", "era": "2008", "lensWeight": {"chronology": 5, "trust": 5, "sovereignty": 3, "programmability": 2, "access": 2}, "title": "Nakamoto : neuf pages qui ont changé le monde", "insight": "En 2008, Nakamoto a résolu le problème de la double dépense sans intermédiaire : un registre distribué entre des milliers de participants, mathématiquement impossible à falsifier. Neuf pages ont changé la finance.", "thesis": "En 2008, Nakamoto a résolu le problème de la double dépense sans intermédiaire : un registre distribué entre des milliers de participants, mathématiquement impossible à falsifier. Neuf pages ont changé la finance.", "body": "## Octobre 2008 : une crise mondiale et un manifeste anonyme\n\nOctobre 2008. En pleine crise financière mondiale. Lehman Brothers vient de faire faillite. Les gouvernements renflouent en urgence les banques avec l'argent des contribuables. La confiance dans le système financier est à son plus bas niveau historique.\n\nÀ ce moment précis, un courriel arrive sur la liste de diffusion d'une petite communauté de cryptographes. L'expéditeur est quelqu'un qui utilise le nom de Satoshi Nakamoto. Aucune affiliation, aucune institution, aucun vrai nom. Le courriel contient un lien vers un document : \"Bitcoin: A Peer-to-Peer Electronic Cash System\". Neuf pages.\n\nC'était une réponse à la question d'Eric Hughes : un système de transactions anonyme fondé sur les mathématiques. Nakamoto proposait une solution au problème de la double dépense sans intermédiaire central.\n\nLa logique est élégante. Au lieu qu'une seule banque tienne le registre, faisons en sorte que des milliers de participants le tiennent en même temps. Chaque transaction est diffusée à tous les participants du réseau. Ils regroupent les transactions en blocs, et chaque bloc est relié mathématiquement au précédent - d'où \"block-chain\", blockchain. Modifier l'histoire est impossible : pour y parvenir, il faudrait recalculer toute la blockchain plus vite que des milliers de participants n'ajoutent de nouveaux blocs. Cela exige davantage de puissance de calcul que le reste du réseau réuni.\n\n## Trois propriétés qui n'avaient jamais existé ensemble auparavant\n\nAndreas Antonopoulos explique dans *Mastering Bitcoin* : le caractère révolutionnaire de Bitcoin ne réside pas dans chaque élément pris séparément - tous les composants existaient déjà. Ce qui est révolutionnaire, c'est leur combinaison, qui crée trois propriétés qui n'avaient jamais existé en même temps auparavant.\n\nDécentralisation. Il n'y a pas de serveur unique, pas de point unique de défaillance ni de contrôle. Il n'existe pas de PDG de Bitcoin qu'on puisse arrêter. Il n'existe pas de serveur Bitcoin qu'on puisse éteindre. Le réseau fonctionne tant qu'au moins un nœud est en marche.\n\nTransparence. Toutes les transactions sont visibles par tous. L'historique est immuable. Vous pouvez vérifier n'importe quelle transaction ayant jamais eu lieu sur le réseau Bitcoin, en commençant par le premier bloc de janvier 2009.\n\nSans autorisation. Personne ne peut vous interdire de participer au réseau. Vous n'avez pas besoin de passer le KYC, vous n'avez pas besoin de l'autorisation d'une banque, vous n'avez pas besoin d'être enregistré dans un pays précis. Un portefeuille est créé gratuitement en quelques secondes.\n\nPaul Vigna et Michael Casey ont décrit l'essentiel avec précision dans *The Truth Machine* : blockchain est une machine de confiance. Une technologie qui permet à deux inconnus de conclure un accord sans intermédiaire garant. Cela ressemble à un détail technique. Mais les conséquences sont énormes : tout ce qui, aujourd'hui, nécessite une banque, un notaire, un régulateur ou une plateforme peut potentiellement se faire directement, par les mathématiques.\n\nIl vaut la peine de s'arrêter sur l'identité de Nakamoto - ou son absence. Il a créé une technologie qui, en 2024, gérait des actifs d'une valeur de centaines de milliards de dollars, et n'a jamais révélé son nom. Certains pensent qu'il s'agissait d'une seule personne. D'autres, d'un groupe. Certains chercheurs estiment que Nakamoto est mort depuis longtemps. Nous ne le savons pas. Et cela, en soi, est un manifeste : une idée peut changer le monde sans auteur avec un nom et un CV.\n\n> Nakamoto a résolu un problème sur lequel les cryptographes travaillaient depuis des décennies : de la monnaie numérique sans intermédiaire central. Neuf pages. Anonyme. En pleine crise financière. C'est l'un des documents les plus importants du XXIe siècle.\n\nLe premier bloc de Bitcoin - le \"bloc genesis\" - a été miné le 3 janvier 2009. Dans ses données, Nakamoto a inclus le titre du Times de ce jour-là : \"Chancellor on brink of second bailout for banks\". Le chancelier au bord d'un deuxième sauvetage des banques. Ce n'était pas un hasard. C'était une déclaration politique.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["Bitcoin", "blockchain", "histoire", "décentralisation"], "x": 712.1, "y": 232.9, "angDeg": -45.0}, {"id": "buterin", "sceneIndex": 2, "type": "technology", "shortTitle": "Buterin", "era": "2013→2015", "lensWeight": {"chronology": 4, "trust": 2, "sovereignty": 2, "programmability": 5, "access": 2}, "title": "Buterin : la blockchain comme ordinateur", "insight": "À 19 ans, Buterin a transformé blockchain d'un registre spécialisé en ordinateur universel. Les smart contracts sont des accords en code qui s'exécutent automatiquement sans intermédiaire.", "thesis": "À 19 ans, Buterin a transformé blockchain d'un registre spécialisé en ordinateur universel. Les smart contracts sont des accords en code qui s'exécutent automatiquement sans intermédiaire.", "body": "## 19 ans, un white paper et la question suivante\n\nBitcoin a résolu un problème précis : de l'argent numérique sans banque. C'est une énorme avancée. Mais dès 2013, il devenait évident que la technologie blockchain pouvait faire davantage, si on la libérait des limites de Bitcoin.\n\nC'est ce qu'a compris Vitalik Buterin, un programmeur canado-russe de 19 ans. Il a posé une question simple : et si blockchain pouvait non seulement stocker des informations sur les transactions, mais aussi exécuter des programmes arbitraires ?\n\nBitcoin est une blockchain spécialisée. Elle sait faire une seule chose : transférer du Bitcoin d'une adresse à une autre. C'est puissant, mais limité. Buterin a proposé de créer une blockchain programmable : un ordinateur décentralisé universel sur lequel n'importe quel programme pourrait s'exécuter.\n\nIl a rédigé le Ethereum White Paper en 2013, sans diplôme, sans soutien institutionnel ni investisseurs. Juste un white paper sur Internet. L'idée était si convaincante qu'elle a attiré des centaines de développeurs. Ethereum a été lancé en 2015 et, dans les années 2020, est devenu le deuxième réseau crypto par capitalisation après Bitcoin.\n\n## Les smart contracts : des accords qu'on ne peut pas rompre\n\nL'innovation centrale d'Ethereum, ce sont les smart contracts. Ce sont des programmes stockés dans blockchain et exécutés automatiquement lorsque des conditions prédéfinies se réalisent. \"Smart\" parce qu'ils s'exécutent d'eux-mêmes. \"Contracts\" parce qu'ils décrivent des accords entre parties.\n\nD'abord, imagine comment fonctionne un contrat ordinaire. Tu loues un appartement. Toi et le propriétaire signez un accord. Il dit : \"Le locataire paie le premier jour de chaque mois. En cas de retard, il y a une pénalité.\" Mais ce n'est que du papier. Pour que le contrat fonctionne, il faut un système d'exécution : tribunaux, avocats, huissiers. C'est lent, coûteux et cela exige de faire confiance à ces institutions.\n\nUn smart contract fonctionne autrement. Les mêmes conditions, mais écrites en code. Le premier jour de chaque mois, le smart contract transfère automatiquement le loyer de l'adresse du locataire vers l'adresse du propriétaire. Pas de paiement, pas d'accès à l'appartement via la serrure intelligente, dont les clés sont elles aussi dans le contrat. Les conditions s'exécutent automatiquement, sans tribunal ni avocat. Le code fait loi.\n\nExemple concret : tu veux acheter un actif numérique à un inconnu. Avant, il fallait un intermédiaire en qui vous aviez tous les deux confiance : un service d'escrow, une plateforme d'échange. Avec un smart contract : ton argent est bloqué dans le contrat, tu reçois l'actif, et le contrat transfère automatiquement l'argent au vendeur. Si tu ne reçois pas l'actif, l'argent te revient. Automatiquement. Mathématiquement. Sans intermédiaire.\n\nCela a ouvert des possibilités qui semblaient relever de la science-fiction : des exchanges décentralisés où personne ne contrôle les échanges. Du crédit sans banque. Du vote sans compteur central. Des organisations sans CEO ni bureau.\n\n> À 19 ans, Buterin a fait pour la finance ce que Berners-Lee a fait pour l'information en 1991 : il a créé un protocole ouvert sur lequel chacun peut construire. Et, comme Berners-Lee, il a refusé d'en avoir le monopole.\n\nEn 2024, des dizaines de milliards de dollars d'actifs étaient bloqués dans des smart contracts DeFi sur Ethereum. Des milliers d'applications fonctionnent sur sa base. Tout cela découle d'une seule question posée par un programmeur de 19 ans : et si blockchain pouvait faire plus que de l'argent ?", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["Ethereum", "smart contracts", "blockchain", "DeFi"], "x": 800.0, "y": 445.0, "angDeg": 0.0}, {"id": "keys", "sceneIndex": 3, "type": "privacy", "shortTitle": "Not your keys", "era": "principe", "lensWeight": {"chronology": 2, "trust": 3, "sovereignty": 5, "programmability": 1, "access": 3}, "title": "Pas vos clés - pas vos coins : garde autonome", "insight": "Not your keys - not your coins : stocker des actifs sur une plateforme signifie que la plateforme en est propriétaire. La self-custody - quand la clé privée est chez vous - est la seule vraie souveraineté financière.", "thesis": "Not your keys - not your coins : stocker des actifs sur une plateforme signifie que la plateforme en est propriétaire. La self-custody - quand la clé privée est chez vous - est la seule vraie souveraineté financière.", "body": "## FTX, Mt. Gox et la leçon qu'il a fallu répéter\n\nNovembre 2022. FTX est l'une des plus grandes plateformes d'échange de crypto au monde, valorisée à 32 milliards de dollars. Son fondateur Sam Bankman-Fried apparaît en couverture de Forbes et de Time, prend la parole au Congrès américain, donne des millions à des campagnes politiques. Tout semble solide.\n\nPuis, en quelques jours, la plateforme s'est effondrée. Il s'est avéré que les fonds des clients avaient servi à des paris risqués. Des millions de personnes ont perdu l'accès à leurs actifs. Bankman-Fried a été arrêté puis condamné.\n\nCe n'était pas la première fois. En 2014, Mt. Gox a été piratée, alors la plus grande plateforme d'échange du monde, par laquelle transitait 70 % de toutes les transactions Bitcoin. 850 000 bitcoins ont disparu. En 2019, le fondateur de QuadrigaCX est mort, la seule personne à connaître les mots de passe. 190 millions de dollars de fonds clients sont restés verrouillés pour toujours.\n\nÀ chaque fois, le schéma est le même : des gens stockaient leurs actifs sur une plateforme en lui faisant confiance. La plateforme était un intermédiaire, exactement comme une banque. Et, exactement comme une banque, elle pouvait utiliser ce pouvoir contre eux.\n\nDans la communauté crypto, une formule ancienne est devenue un axiome : \"Not your keys - not your coins\". Pas tes clés - pas tes coins.\n\n## Qu'est-ce qu'une clé privée et pourquoi c'est important\n\nDans la blockchain, les actifs sont contrôlés par une clé privée. C'est une longue suite de caractères, une sorte de mot de passe très complexe, lié mathématiquement à une adresse de wallet. Celui qui possède la clé privée contrôle tout ce qui se trouve à cette adresse. Sans elle, aucun accès.\n\nQuand vous laissez vos actifs sur une plateforme, c'est la plateforme qui détient la clé privée. Vous voyez un solde à l'écran, mais ce n'est qu'une promesse de la plateforme, pas une garantie mathématique. La plateforme peut bloquer les retraits. Elle peut faire faillite. Elle peut se révéler frauduleuse.\n\nSelf-custody - la garde autonome - signifie : la clé privée est chez vous. Aucune entreprise, aucun régulateur, aucun hacker ayant compromis le serveur d'autrui ne peut atteindre vos actifs sans votre clé. Vous seul.\n\nCela semble technique, mais c'est un principe fondamental de la souveraineté financière. Pour la première fois dans l'histoire, une personne ordinaire peut conserver des valeurs importantes sans intermédiaire, avec une garantie fournie par les mathématiques, et non par un État ou une entreprise.\n\nIl existe plusieurs méthodes de stockage. Une seed phrase de 12 ou 24 mots est la version lisible de la clé privée. Écrivez-la sur papier et cachez-la dans un endroit sûr : les actifs restent en sécurité même si tous vos appareils brûlent. Les wallets matériels - Ledger, Trezor - stockent la clé privée sur un appareil physique isolé d'Internet. Même si votre ordinateur est infecté par un virus, la clé reste inaccessible. Les wallets logiciels - MetaMask, Rabby Wallet, Tonkeeper - sont plus pratiques, mais ils stockent les clés sur un appareil connecté à Internet, ce qui exige davantage de prudence.\n\n> \"Not your keys - not your coins\" n'est pas de la paranoïa. C'est un fait mathématique. FTX, Mt. Gox, QuadrigaCX ne sont pas des exceptions. Ce sont des conséquences prévisibles du stockage de valeur chez un intermédiaire.\n\nComprendre la différence entre garde custodiale et non custodiale n'est pas un détail technique. C'est la première et la plus importante leçon pratique de Web3. Détenir des cryptomonnaies sur une plateforme, c'est comme garder de l'or dans le coffre-fort de quelqu'un d'autre. Pratique. Jusqu'à ce qu'on découvre qu'il n'y a pas de coffre-fort.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["auto-conservation", "portefeuille", "sécurité", "blockchain"], "x": 712.1, "y": 657.1, "angDeg": 45.0}, {"id": "wallets", "sceneIndex": 4, "type": "media", "shortTitle": "Portefeuilles", "era": "2009→2024", "lensWeight": {"chronology": 4, "trust": 2, "sovereignty": 3, "programmability": 2, "access": 5}, "title": "L’évolution des portefeuilles : d’un fichier texte à Telegram", "insight": "Les portefeuilles sont passés d’un fichier texte en 2009 à un bouton dans Telegram en 2024. Quand envoyer de la crypto devient aussi simple qu’envoyer un message, l’échelle de l’adoption change radicalement.", "thesis": "Les portefeuilles sont passés d’un fichier texte en 2009 à un bouton dans Telegram en 2024. Quand envoyer de la crypto devient aussi simple qu’envoyer un message, l’échelle de l’adoption change radicalement.", "body": "## Le parcours de « réservé aux techniciens » à « pour tout le monde »\n\nL’histoire des portefeuilles crypto, c’est l’histoire de la baisse progressive de la barrière à l’entrée. D’un outil pour mathématiciens et programmeurs à un bouton à l’intérieur du messager que tu utilises déjà.\n\nLes premiers utilisateurs de Bitcoin, entre 2009 et 2011, stockaient littéralement leurs clés privées dans des fichiers texte sur un disque dur. Aucune interface. Aucun guide. Tu travaillais simplement en ligne de commande et tu espérais ne pas perdre le fichier. Beaucoup l’ont perdu.\n\nL’histoire la plus connue est celle du programmeur James Howells, du pays de Galles. En 2013, pendant un grand ménage, il a accidentellement jeté un disque dur contenant 8000 bitcoins. Aux prix actuels, cela représente des centaines de millions de dollars. Le disque repose toujours dans une décharge municipale à Newport. Howells essaie depuis des années d’obtenir l’autorisation de le déterrer, mais les autorités refusent pour des raisons environnementales.\n\nCe n’est pas une curiosité. C’est une illustration de ce qu’était le Web3 au début : techniquement révolutionnaire, mais pratiquement inaccessible à la plupart des gens.\n\n## Les portefeuilles logiciels : la première révolution du confort\n\nMetaMask, une extension de navigateur lancée en 2016, est devenue le premier portefeuille qu’une personne ordinaire pouvait utiliser sans formation technique. Tu installes l’extension dans Chrome, tu cliques sur « Créer un portefeuille », tu reçois une phrase de récupération de 12 mots, tu la notes, tu la confirmes, et c’est terminé. Toute la procédure prend trois minutes.\n\nUne phrase de récupération est la version lisible par un humain de ta clé privée. Douze mots ordinaires : par exemple, « river cloud magic forest apple sunset... » Ces douze mots sont liés mathématiquement à ton portefeuille. Note-les sur papier, cache-les dans un endroit sûr, et tes actifs seront protégés même si ton ordinateur brûle, si ton téléphone casse ou si MetaMask cesse d’exister en tant qu’entreprise. Une phrase de récupération est une sauvegarde qui fonctionne toujours.\n\nMetaMask a ouvert l’accès à Ethereum à des millions de personnes. D’autres ont suivi : Trust Wallet pour les appareils mobiles, Phantom pour Solana, Rabby Wallet avec une interface pratique pour DeFi. Il affiche une simulation de transaction avant la signature, ce qui est crucial pour la sécurité dans un monde où les escrocs cherchent constamment des moyens de tromper les utilisateurs.\n\n## TON et Telegram : un portefeuille à l’intérieur du messager\n\nTonkeeper et Telegram Wallet ont franchi l’étape suivante, qui n’a semblé évidente qu’après coup : pourquoi demander à l’utilisateur d’installer une application séparée si l’on peut intégrer le portefeuille dans l’application qu’il utilise déjà tous les jours ?\n\nTelegram Wallet est un portefeuille directement à l’intérieur de Telegram. Si tu veux envoyer TON à un ami, tu l’envoies comme tu envoies un message. Tu ouvres une discussion, tu appuies sur « joindre », tu choisis « Transfer ». Adresses, clés privées, phrases de récupération : tout cela fonctionne en coulisses. De l’extérieur, ce n’est que « envoyer de l’argent dans un messager ».\n\nC’est un niveau d’adoption fondamentalement différent. Pas « installe un portefeuille crypto », mais « appuie sur un bouton dans l’application que tu as déjà ». C’est ainsi que des milliards de personnes ordinaires peuvent interagir avec la blockchain pour la première fois sans réaliser qu’elles le font.\n\nLa différence entre un portefeuille custodial et un portefeuille non custodial reste importante. Telegram Wallet, dans sa version de base, est custodial : les clés sont stockées sur les serveurs de Telegram. C’est plus pratique, mais cela reproduit la logique d’une banque. Tonkeeper est non custodial : les clés t’appartiennent. C’est plus complexe, mais cela donne une vraie propriété. Pour commencer, utilise Telegram Wallet. Pour des montants importants, utilise Tonkeeper ou un portefeuille matériel.\n\n> Le chemin de la ligne de commande en 2009 à un bouton dans Telegram en 2024, c’est l’histoire d’une barrière réduite à zéro. Quand envoyer des cryptomonnaies devient aussi simple qu’envoyer un message, l’échelle de l’adoption change radicalement.\n\nLes portefeuilles matériels, Ledger et Trezor, restent la norme pour stocker des sommes importantes. La clé privée est stockée sur un appareil physique isolé d’internet. Même si ton ordinateur est infecté par un virus keylogger, un attaquant n’obtiendra pas la clé. Pour valider, tu dois appuyer physiquement sur un bouton de l’appareil.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["portefeuille", "auto-conservation", "Telegram", "TON"], "x": 500.0, "y": 745.0, "angDeg": 90.0}, {"id": "defi", "sceneIndex": 5, "type": "economy", "shortTitle": "DeFi", "era": "2020→", "lensWeight": {"chronology": 3, "trust": 3, "sovereignty": 3, "programmability": 5, "access": 4}, "title": "DeFi : la finance sans institutions financières", "insight": "DeFi remplace les banques et les courtiers par des smart contracts : prêts, échange, revenus sur les actifs, sans KYC, sans approbation, 24/7, depuis n'importe où dans le monde. 1,4 milliard de personnes sans compte bancaire y ont accès.", "thesis": "DeFi remplace les banques et les courtiers par des smart contracts : prêts
