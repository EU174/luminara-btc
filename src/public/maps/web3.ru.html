 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "nakamoto", "sceneIndex": 1, "type": "technology", "shortTitle": "Накамото", "era": "2008", "lensWeight": {"chronology": 5, "trust": 5, "sovereignty": 3, "programmability": 2, "access": 2}, "title": "Накамото: дев'ять сторінок, що змінили світ", "insight": "У 2008-му Накамото розв'язав проблему подвійної витрати без посередника: розподілений реєстр у тисяч учасників, який математично неможливо підробити. Дев'ять сторінок змінили фінанси.", "thesis": "У 2008-му Накамото розв'язав проблему подвійної витрати без посередника: розподілений реєстр у тисяч учасників, який математично неможливо підробити. Дев'ять сторінок змінили фінанси.", "body": "## Жовтень 2008 року: світова криза й анонімний маніфест\n\nЖовтень 2008 року. Розпал світової фінансової кризи. Lehman Brothers щойно збанкрутував. Уряди терміново рятують банки грошима платників податків. Довіра до фінансової системи на історичному мінімумі.\n\nСаме в цей момент у розсилку невеликої спільноти криптографів приходить лист. Відправник - хтось під іменем Сатоші Накамото. Жодної афіліації, жодного інституту, жодного справжнього імені. Лист містить посилання на документ: \"Bitcoin: A Peer-to-Peer Electronic Cash System\". Дев'ять сторінок.\n\nЦе була відповідь на питання Еріка Г'юза - анонімна система транзакцій, побудована на математиці. Накамото запропонував розв'язання проблеми подвійної витрати без центрального посередника.\n\nЛогіка елегантна. Замість того щоб один банк вів реєстр, нехай реєстр ведуть тисячі учасників одночасно. Кожна транзакція транслюється всім учасникам мережі. Вони збирають транзакції в блоки, і кожен блок математично пов'язаний із попереднім - звідси \"блок-ланцюг\", blockchain. Змінити історію неможливо: для цього треба було б перерахувати весь blockchain швидше, ніж тисячі учасників додають нові блоки. Це потребує більшої обчислювальної потужності, ніж уся решта мережі разом узята.\n\n## Три властивості, яких раніше не існувало разом\n\nАндреас Антонопулос у *Mastering Bitcoin* пояснює: революційність Bitcoin не в кожному окремому елементі - усі компоненти існували раніше. Революційність у їхній комбінації, яка створює три властивості, що раніше не існували одночасно.\n\nДецентралізація. Немає єдиного сервера, немає єдиної точки відмови чи контролю. Немає CEO Bitcoin, якого можна заарештувати. Немає сервера Bitcoin, який можна вимкнути. Мережа працює, доки працює хоча б один вузол.\n\nПрозорість. Усі транзакції видимі всім. Історія незмінна. Ти можеш перевірити будь-яку транзакцію, що будь-коли відбулася в мережі Bitcoin, - починаючи з першого блоку в січні 2009 року.\n\nВідсутність дозволу. Ніхто не може заборонити тобі брати участь у мережі. Не потрібно проходити KYC, не потрібен дозвіл банку, не потрібна прописка в певній країні. Гаманець створюється безкоштовно за секунди.\n\nПол Вінья і Майкл Кейсі у *The Truth Machine* точно описали суть: blockchain - це машина довіри. Технологія, яка дозволяє двом незнайомим людям укласти угоду без посередника-гаранта. Це звучить як технічна деталь. Але наслідки величезні: усе, що сьогодні потребує банку, нотаріуса, регулятора або платформи, потенційно можна зробити напряму, через математику.\n\nВарто зупинитися на особистості Накамото - або її відсутності. Він створив технологію, яка до 2024 року керувала активами на сотні мільярдів доларів, - і ніколи не розкрив свого імені. Дехто думає, що це одна людина. Інші - що група. Деякі дослідники вважають, що Накамото давно помер. Ми не знаємо. І це саме по собі маніфест: ідея може змінити світ без автора з іменем і резюме.\n\n> Накамото розв'язав задачу, над якою криптографи працювали десятиліттями: цифрові гроші без центрального посередника. Дев'ять сторінок. Анонім. У розпал фінансової кризи. Це один із найважливіших документів XXI століття.\n\nПерший блок Bitcoin - \"блок генезису\" - був видобутий 3 січня 2009 року. У його дані Накамото включив заголовок газети Times того дня: \"Chancellor on brink of second bailout for banks\". Канцлер на порозі другого порятунку банків. Це було не випадково. Це була політична заява.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["Bitcoin", "блокчейн", "історія", "децентралізація"], "x": 712.1, "y": 232.9, "angDeg": -45.0}, {"id": "buterin", "sceneIndex": 2, "type": "technology", "shortTitle": "Бутерін", "era": "2013→2015", "lensWeight": {"chronology": 4, "trust": 2, "sovereignty": 2, "programmability": 5, "access": 2}, "title": "Бутерін: блокчейн як комп'ютер", "insight": "Бутерін у 19 років перетворив blockchain зі спеціалізованого реєстру на універсальний комп'ютер. Смарт-контракти - угоди в code, які виконуються автоматично без посередника.", "thesis": "Бутерін у 19 років перетворив blockchain зі спеціалізованого реєстру на універсальний комп'ютер. Смарт-контракти - угоди в code, які виконуються автоматично без посередника.", "body": "## 19 років, біла книга й наступне питання\n\nBitcoin розв'язав конкретну задачу: цифрові гроші без банку. Це величезне досягнення. Але вже до 2013 року стало очевидно, що blockchain-технологія може зробити щось більше - якщо звільнити її від обмежень Bitcoin.\n\nЦе зрозумів 19-річний канадсько-російський програміст Віталік Бутерін. Він поставив просте питання: а що, якщо blockchain може не лише зберігати інформацію про транзакції, а й виконувати довільні програми?\n\nBitcoin - це спеціалізований blockchain. Він уміє робити одне: передавати Bitcoin з однієї адреси на іншу. Це потужно, але обмежено. Бутерін запропонував створити програмований blockchain - універсальний децентралізований комп'ютер, на якому можна запустити будь-яку програму.\n\nВін написав Ethereum White Paper у 2013 році, не маючи ні диплома, ні інституційної підтримки, ні інвесторів. Просто біла книга в інтернеті. Ідея була настільки переконливою, що привернула сотні розробників. Ethereum запустився у 2015 році - і до 2020-х став другою за капіталізацією криптомережею після Bitcoin.\n\n## Смарт-контракти: угоди, які не можна порушити\n\nЦентральна інновація Ethereum - смарт-контракти. Це програми, що зберігаються в blockchain і виконуються автоматично при настанні заздалегідь визначених умов. \"Смарт\" - тому що вони виконуються самі. \"Контракти\" - тому що вони описують угоди між сторонами.\n\nПередусім уяви, як працює звичайний контракт. Ти орендуєш квартиру. Ви з власником підписуєте договір. У ньому написано: \"Орендар платить першого числа кожного місяця. За прострочення - штраф\". Але це просто папір. Щоб договір працював, потрібна система примусу до виконання: суди, юристи, судові виконавці. Це повільно, дорого і потребує довіри до цих інститутів.\n\nСмарт-контракт працює інакше. Ті самі умови - але записані в code. Першого числа кожного місяця смарт-контракт автоматично переказує орендну плату з адреси орендаря на адресу власника. Немає оплати - немає доступу до квартири через розумний замок, ключі від якого теж у контракті. Умови виконуються автоматично, без суду й без юриста. Code - це закон.\n\nПриклад із реального світу: ти хочеш купити цифровий актив у незнайомця. Раніше потрібен посередник, якому довіряєте обоє: ескроу-сервіс, біржа. Зі смарт-контрактом: твої гроші блокуються в контракті, ти отримуєш актив, контракт автоматично переказує гроші продавцю. Якщо ти не отримав актив - гроші повертаються тобі. Автоматично. Математично. Без посередника.\n\nЦе відкрило можливості, які здавалися фантастикою: децентралізовані біржі, де ніхто не контролює торги. Кредитування без банків. Голосування без центрального лічильника. Організації без CEO й офісу.\n\n> Бутерін у 19 років зробив для фінансів те, що Бернерс-Лі зробив для інформації у 1991-му: створив відкритий протокол, на якому кожен може будувати. І, як Бернерс-Лі, відмовився від монополії на нього.\n\nДо 2024 року на Ethereum у смарт-контрактах DeFi було заблоковано активів на десятки мільярдів доларів. Тисячі застосунків працюють на його базі. Усе це - наслідок одного питання 19-річного програміста: а що, якщо blockchain може робити не тільки гроші?", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["Ethereum", "смарт-контракти", "блокчейн", "DeFi"], "x": 800.0, "y": 445.0, "angDeg": 0.0}, {"id": "keys", "sceneIndex": 3, "type": "privacy", "shortTitle": "Not your keys", "era": "принцип", "lensWeight": {"chronology": 2, "trust": 3, "sovereignty": 5, "programmability": 1, "access": 3}, "title": "Not your keys - not your coins: self-custody", "insight": "Not your keys - not your coins: зберігання активів на біржі означає, що біржа ними володіє. Self-custody - приватний ключ у тебе - це єдина справжня фінансова суверенність.", "thesis": "Not your keys - not your coins: зберігання активів на біржі означає, що біржа ними володіє. Self-custody - приватний ключ у тебе - це єдина справжня фінансова суверенність.", "body": "## FTX, Mt. Gox і урок, який довелося повторити\n\nЛистопад 2022 року. FTX - одна з найбільших криптобірж світу, оцінена у 32 мільярди доларів. Її засновник Сем Бенкман-Фрід з'являється на обкладинках Forbes і Time, виступає в Конгресі США, жертвує мільйони на політичні кампанії. Усе виглядає солідно.\n\nПотім за кілька днів біржа рухнула. З'ясувалося, що кошти клієнтів використовували для ризикованих ставок. Мільйони людей втратили доступ до своїх активів. Бенкман-Фріда заарештували й засудили.\n\nЦе не вперше. У 2014 році зламали Mt. Gox - тоді найбільшу біржу у світі, через яку проходило 70% усіх транзакцій Bitcoin. 850 000 біткоїнів зникли. У 2019 році помер засновник біржі QuadrigaCX - єдина людина, яка знала паролі. 190 мільйонів доларів клієнтських коштів виявилися замкненими назавжди.\n\nЩоразу патерн один: люди зберігали активи на біржі, довіряючи їй. Біржа була посередником - точно так само, як банк. І точно так само, як банк, вона могла використати цю владу проти них.\n\nУ криптоспільноті давно існує фраза, що стала аксіомою: \"Not your keys - not your coins\". Не твої ключі - не твої монети.\n\n## Що таке приватний ключ і чому це важливо\n\nУ blockchain активи контролюються приватним ключем. Це довгий рядок символів - щось на кшталт дуже складного пароля, математично пов'язаного з адресою гаманця. Той, у кого є приватний ключ, контролює все на цій адресі. Без нього доступу немає.\n\nКоли ти тримаєш активи на біржі - приватний ключ у біржі. Ти бачиш баланс на екрані, але це обіцянка біржі, а не математична гарантія. Біржа може заморозити виведення. Може збанкрутувати. Може виявитися шахрайською.\n\nSelf-custody - самостійне зберігання - означає: приватний ключ у тебе. Жодна компанія, жоден регулятор, жоден хакер, який зламав чужий сервер, не може дістатися до твоїх активів без твого ключа. Тільки ти.\n\nЦе звучить технічно - але це фундаментальний принцип фінансового суверенітету. Вперше в історії звичайна людина може зберігати значні цінності без посередника - з гарантією, яку дає математика, а не держава чи корпорація.\n\nМетодів зберігання кілька. Seed-фраза з 12 або 24 слів - людиночитна версія приватного ключа. Запишеш на папері й сховаєш у надійному місці - активи в безпеці, навіть якщо всі твої пристрої згорять. Апаратні гаманці - Ledger, Trezor - зберігають приватний ключ на фізичному пристрої, ізольованому від інтернету. Навіть якщо твій комп'ютер заражений вірусом - ключ недоступний. Програмні гаманці - MetaMask, Rabby Wallet, Tonkeeper - зручніші, але зберігають ключі на пристрої з інтернетом, що потребує більшої обережності.\n\n> \"Not your keys - not your coins\" - це не параноя. Це математичний факт. FTX, Mt. Gox, QuadrigaCX - це не винятки. Це передбачувані наслідки зберігання цінностей у посередника.\n\nРозуміння різниці між кастодіальним і некастодіальним зберіганням - це не технічна деталь. Це перший і найважливіший практичний урок Web3. Володіти криптовалютою на біржі - це як зберігати золото в чужому сейфі. Зручно. Доки не виявиться, що сейфа немає.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["самостійне зберігання", "гаманець", "безпека", "блокчейн"], "x": 712.1, "y": 657.1, "angDeg": 45.0}, {"id": "wallets", "sceneIndex": 4, "type": "media", "shortTitle": "Гаманці", "era": "2009→2024", "lensWeight": {"chronology": 4, "trust": 2, "sovereignty": 3, "programmability": 2, "access": 5}, "title": "Еволюція гаманців: від текстового файла до Telegram", "insight": "Гаманці пройшли шлях від текстового файла у 2009-му до кнопки в Telegram у 2024-му. Коли надіслати крипту так само просто, як повідомлення, масштаб adoption змінюється кардинально.", "thesis": "Гаманці пройшли шлях від текстового файла у 2009-му до кнопки в Telegram у 2024-му. Коли надіслати крипту так само просто, як повідомлення, масштаб adoption змінюється кардинально.", "body": "## Шлях від «лише для технарів» до «для всіх»\n\nІсторія криптогаманців — це історія поступового зниження бар'єра входу. Від інструмента для математиків і програмістів до кнопки в месенджері, яким ти вже користуєшся.\n\nПерші користувачі Bitcoin — 2009-2011 роки — зберігали приватні ключі буквально в текстових файлах на жорсткому диску. Жодного інтерфейсу. Жодних підказок. Ти просто працював із командним рядком і сподівався не втратити файл. Багато хто втрачав.\n\nНайвідоміша історія — програміст Джеймс Гауеллс з Уельсу. У 2013 році він випадково викинув жорсткий диск із 8000 біткоїнами під час генерального прибирання. За поточними цінами це сотні мільйонів доларів. Диск досі лежить на міському звалищі в Ньюпорті. Гауеллс роками намагається отримати дозвіл на його розкопування, але влада відмовляє з екологічних міркувань.\n\nЦе не курйоз. Це ілюстрація того, яким був ранній Web3: технічно революційним, але практично недоступним для більшості людей.\n\n## Програмні гаманці: перша революція зручності\n\nMetaMask — розширення для браузера, запущене у 2016 році, — став першим гаманцем, яким нормальна людина могла користуватися без технічної освіти. Ти встановлюєш розширення в Chrome, натискаєш «Створити гаманець», отримуєш seed-фразу з 12 слів, записуєш її, підтверджуєш — готово. Увесь процес займає три хвилини.\n\nSeed-фраза — це людиночитна версія твого приватного ключа. Дванадцять звичайних слів: наприклад, «river cloud magic forest apple sunset...» Ці дванадцять слів математично пов'язані з твоїм гаманцем. Запишеш на папері, сховаєш у надійному місці — твої активи в безпеці, навіть якщо комп'ютер згорить, телефон зламається, MetaMask закриється як компанія. Seed-фраза — це резервна копія, яка працює завжди.\n\nMetaMask відкрив доступ до Ethereum для мільйонів людей. Після нього з'явилися інші: Trust Wallet для мобільних пристроїв, Phantom для Solana, Rabby Wallet зі зручним інтерфейсом для DeFi — він показує симуляцію транзакції до її підписання, що критично важливо для безпеки у світі, де шахраї постійно шукають способи ошукати користувачів.\n\n## TON і Telegram: гаманець усередині месенджера\n\nTonkeeper і Telegram Wallet зробили наступний крок, який здавався очевидним лише заднім числом: навіщо вимагати від користувача встановлювати окремий застосунок, якщо можна вбудувати гаманець у застосунок, яким він уже користується щодня?\n\nTelegram Wallet — це гаманець прямо всередині Telegram. Якщо ти хочеш надіслати TON другу, ти надсилаєш його так само, як надсилаєш повідомлення. Відкриваєш чат, натискаєш «прикріпити», вибираєш «Transfer». Адреси, приватні ключі, seed-фрази — усе це працює під капотом. Ззовні це просто «надіслати гроші в месенджері».\n\nЦе принципово інший рівень adoption. Не «встановіть криптогаманець», а «натисніть кнопку в застосунку, який у вас уже є». Саме так мільярди звичайних людей можуть уперше взаємодіяти з блокчейном, не усвідомлюючи, що вони це роблять.\n\nРізниця між кастодіальним і некастодіальним гаманцем залишається важливою. Telegram Wallet у базовому варіанті — кастодіальний: ключі зберігаються на серверах Telegram. Це зручніше, але відтворює логіку банку. Tonkeeper — некастодіальний: ключі в тебе. Це складніше, але дає справжню власність. Для початку роботи — Telegram Wallet. Для серйозних сум — Tonkeeper або апаратний гаманець.\n\n> Шлях від командного рядка у 2009-му до кнопки в Telegram у 2024-му — це історія зниження бар'єра до нуля. Коли надіслати криптовалюту так само просто, як надіслати повідомлення, масштаб adoption змінюється кардинально.\n\nАпаратні гаманці — Ledger і Trezor — залишаються стандартом для зберігання серйозних сум. Приватний ключ зберігається на фізичному пристрої, ізольованому від інтернету. Навіть якщо твій комп'ютер заражений вірусом-кейлогером, зловмисник не отримає ключ. Для входу потрібно фізично натиснути кнопку на пристрої.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["гаманець", "самостійне зберігання", "Telegram", "TON"], "x": 500.0, "y": 745.0, "angDeg": 90.0}, {"id": "defi", "sceneIndex": 5, "type": "economy", "shortTitle": "DeFi", "era": "2020→", "lensWeight": {"chronology": 3, "trust": 3, "sovereignty": 3, "programmability": 5, "access": 4}, "title": "DeFi: фінанси без фінансових інститутів", "insight": "DeFi замінює банки й брокерів смарт-контрактами: кредити, обмін, дохід на активи — без KYC, без схвалення, 24/7, з будь-якої точки світу. 1,4 млрд людей без банківського рахунку отримують доступ.", "thesis": "DeFi замінює банки й брокерів смарт-контрактами: кредити, обмін, дохід на активи — без KYC, без схвалення, 24/7, з будь-якої точки світу. 1,4 млрд людей без банківського рахунку отримують доступ.", "body": "## Що таке DeFi і навіщо він потрібен\n\nDeFi — Decentralized Finance, децентралізовані фінанси. Це набір фінансових сервісів, що працюють на блокчейні через смарт-контракти — без банків, брокерів та інших фінансових посередників.\n\nЩоб зрозуміти, що тут революційного, потрібно згадати, як працюють традиційні фінанси. Хочеш отримати кредит — ідеш у банк, проходиш KYC-перевірку (Know Your Customer — верифікацію особи), надаєш документи про доходи, чекаєш тиждень на рішення. Банк встановлює процентну ставку, яку вважає потрібною. Хочеш торгувати акціями — відкриваєш рахунок у брокера, знову KYC, знову очікування. Хочеш заробити на заощадженнях — банк пропонує 2% річних, залишаючи собі маржу від 8%.\n\nУ всіх цих сценаріях банк або брокер — привратник. Він вирішує, кому дати доступ, на яких умовах, за яку винагороду. Люди без кредитної історії, без прописки в потрібній країні, без достатнього доходу відрізані від базових фінансових сервісів. За даними Світового банку, 1,4 мільярда дорослих людей у світі не мають банківського рахунку.\n\n## Uniswap, Aave, Compound: як це працює\n\nDeFi замінює привратника математикою.\n\nUniswap — децентралізована біржа. На традиційній біржі є книга заявок: покупці й продавці виставляють ордери, біржа їх зводить. На Uniswap немає книги заявок і немає компанії-оператора. Натомість є пул ліквідності: користувачі блокують пари токенів у смарт-контракті, отримуючи частку від комісій. Коли ти хочеш обміняти один токен на інший, смарт-контракт автоматично розраховує ціну за алгоритмом і проводить обмін. Жодного KYC. Жодного схвалення. Жодних робочих годин.\n\nAave — протокол кредитування. Ти можеш заблокувати токени як заставу й отримати кредит в іншому токені. Або, навпаки, надати токени в пул і отримувати відсотки. Ставки автоматично визначаються попитом і пропозицією — не банком. Процес займає хвилини, працює 24/7, доступний з будь-якої точки світу з інтернетом.\n\nCompound працює за схожим принципом: надаєш активи — вони автоматично працюють і приносять дохід. Жодного «покласти на депозит під 2% річних». Ставки змінюються в реальному часі залежно від ринкового попиту.\n\nЦі протоколи не мають офісів, не наймають співробітників для обробки заявок, не несуть regulatory overhead традиційних банків. Тому частина цієї економії повертається користувачам у вигляді вищих ставок для кредиторів і нижчих — для позичальників.\n\nДон і Алекс Тапскотти в «Blockchain Revolution» називають це «фінансовим інтернетом»: як інтернет демократизував доступ до інформації, DeFi демократизує доступ до фінансових сервісів. Житель Нігерії отримує ті самі інструменти, що й хедж-фонд у Нью-Йорку.\n\n> DeFi — це не лише зручність. Це політична заява: фінансові послуги як відкритий протокол, доступний усім, а не привілей клієнтів певних інститутів.\n\nРизики реальні: смарт-контракти містять баги, протоколи зламують, ринки волатильні, регуляторне середовище нестабільне. DeFi — не заміна традиційним фінансам для всіх життєвих випадків. Але принцип революційний. І він працює.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["DeFi", "смарт-контракти", "фінанси", "блокчейн"], "x": 287.9, "y": 657.1, "angDeg": 135.0}, {"id": "identity", "sceneIndex": 6, "type": "privacy", "shortTitle": "Ідентичність", "era": "Web3", "lensWeight": {"chronology": 2, "trust": 2, "sovereignty": 5, "programmability": 3, "access": 2}, "title": "Цифрова ідентичність: суверенне «я» у Web3", "insight": "У Web2 ідентичність належить платформі й може бути видалена. У Web3 — ENS, NFT, on-chain репутація — це суверенна цифрова особистість, яку математично неможливо конфіскувати.", "thesis": "У Web2 ідентичність належить платформі й може бути видалена. У Web3 — ENS, NFT, on-chain репутація — це суверенна цифрова особистість, яку математично неможливо конфіскувати.", "body": "## Проблема ідентичності у Web2\n\nЗгадай Бодріяра з попереднього розділу: у соцмережах люди будують симулякри себе — образи, які замінюють реальність. Instagram-версія життя, красивіша й щасливіша за оригінал. Але в цього симулякра є ще одна проблема, яку Бодріяр не міг передбачити: він належить платформі.\n\nInstagram може видалити твій акаунт із мільйоном підписників — у будь-який момент, без пояснень. Twitter може забанити. TikTok може заблокувати. Усе, що ти будував роками — підписники, репутація, історія — зберігається на їхніх серверах і належить їм.\n\nКріс Діксон у «Why Decentralization Matters» описав це як ключову проблему платформ Web2: вони проходять передбачуваний цикл. Спочатку приваблюють користувачів і розробників щедрими умовами. Потім, набравши критичну масу, змінюють правила на свою користь. Розробники, які будували на Facebook у 2007-му, до 2012-го виявили, що платформа стала конкурентом. Творці, які будували аудиторію в Twitter, до 2022-го виявили, що політика модерації змінилася без попередження.\n\nПроблема не в злому умислі. Проблема архітектурна: твоя ідентичність зберігається на чужому сервері.\n\n## ENS, NFT-аватари й on-chain репутація\n\nWeb3 пропонує іншу модель — суверенну цифрову ідентичність.\n\nENS — Ethereum Name Service — це система імен для блокчейну. Замість адреси на кшталт «0x742d35Cc6634C0532...» ти купуєш ім'я «luminara.eth» і прив'язуєш його до свого гаманця. Це працює як домен в інтернеті — тільки без можливості відібрати. Жодної компанії, яка могла б заблокувати твоє ім'я. Жодного сервера, який можна було б вимкнути. Поки ти платиш за продовження — воно твоє. І воно переноситься між платформами: одне ім'я, одна адреса, всюди.\n\nNFT-аватари стали першим масовим проявом Web3-ідентичності. CryptoPunks — 10 000 піксельних персонажів, запущених у 2017 році, — стали культурним феноменом. Bored Ape Yacht Club створив спільноту: власник Bored Ape отримував доступ до закритих заходів, IP-права на свого персонажа, належність до певної культури. Це не просто картинки. Це членські квитки, докази належності, способи сигналізувати про цінності.\n\nАле найцікавіше — те, що буде далі. On-chain репутація — це профіль, який автоматично відображає твою історію в блокчейні. Які протоколи ти використовував, у яких голосуваннях брав участь, які проєкти підтримував, наскільки надійним виявився як учасник угод. Цю репутацію неможливо підробити — вона записана в незмінний реєстр і верифікується математично. І вона належить тобі, а не платформі.\n\nПсевдонімна ідентичність у Web3 додає ще один вимір. Сатоші Накамото змінив світ, залишаючись анонімом. У Web3 ти можеш будувати значущу репутацію під іменем гаманця, не розкриваючи справжнього імені. Твої дії в блокчейні — це і є твоя ідентичність. Не біографія. Не резюме. Не фотографії. Дії.\n\n> У Web2 твоя ідентичність — це те, що про тебе вирішила платформа. У Web3 — це те, що ти зробив, записане в незмінний реєстр. Симулякр для аудиторії проти суверенної цифрової особистості.\n\nЦе не завтра і не для всіх уже сьогодні. Але напрям очевидний: інтернет рухається до моделі, де ідентичність належить людині, а не платформі. І TON — один із головних претендентів на те, щоб зробити це доступним для мільярда користувачів Telegram.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%BE%D0%BD%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%2C%20%D0%90%D0%BB%D0%B5%D0%BA%D1%81%20%D0%A2%D0%B0%D0%BF%D1%81%D0%BA%D0%BE%D1%82%D1%82%20%E2%80%94%20Blockchain%20Revolution%20%282016%29", "linkType": "gbooks"}, {"title": "Пол Виньи, Майкл Кейси — The Truth Machine (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9F%D0%BE%D0%BB%20%D0%92%D0%B8%D0%BD%D1%8C%D0%B8%2C%20%D0%9C%D0%B0%D0%B9%D0%BA%D0%BB%20%D0%9A%D0%B5%D0%B9%D1%81%D0%B8%20%E2%80%94%20The%20Truth%20Machine%20%282018%29", "linkType": "gbooks"}, {"title": "Сатоши Накамото — Bitcoin: A Peer-to-Peer Electronic Cash System (2008)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A1%D0%B0%D1%82%D0%BE%D1%88%D0%B8%20%D0%9D%D0%B0%D0%BA%D0%B0%D0%BC%D0%BE%D1%82%D0%BE%20%E2%80%94%20Bitcoin%3A%20A%20Peer-to-Peer%20Electronic%20Cash%20System%20%282008%29", "linkType": "gbooks"}, {"title": "Виталик Бутерин — Ethereum White Paper (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D1%82%D0%B0%D0%BB%D0%B8%D0%BA%20%D0%91%D1%83%D1%82%D0%B5%D1%80%D0%B8%D0%BD%20%E2%80%94%20Ethereum%20White%20Paper%20%282013%29", "linkType": "gbooks"}, {"title": "Эрик Хьюз — A Cypherpunk's Manifesto (1993)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D1%80%D0%B8%D0%BA%20%D0%A5%D1%8C%D1%8E%D0%B7%20%E2%80%94%20A%20Cypherpunk%27s%20Manifesto%20%281993%29", "linkType": "gbooks"}, {"title": "Николай Дуров — TON Blockchain Whitepaper (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B9%20%D0%94%D1%83%D1%80%D0%BE%D0%B2%20%E2%80%94%20TON%20Blockchain%20Whitepaper%20%282019%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Why Decentralization Matters (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Why%20Decentralization%20Matters%20%282018%29", "linkType": "gbooks"}, {"title": "Джаред Ларни — Own the Internet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["ідентичність", "самостійне зберігання", "NFT", "Web3"], "x": 200.0, "y": 445.0, "angDeg": 180.0}, {"id": "ton", "sceneIndex": 7, "type": "power", "shortTitle": "TON", "era": "→мільярд", "lensWeight": {"chronology": 4, "trust": 2, "sovereignty": 2, "programmability": 3, "access": 5}, "title": "TON: блокчейн для мільярда", "insight": "TON спроєктований для мільярда користувачів через Telegram: нескінченне шардування, миттєві транзакції, вбудованість у месенджер. Adoption через наявну інфраструктуру, а не переконання.", "thesis": "TON спроєктований для мільярда користувачів через Telegram: нескінченне шардування, миттєві транзакції, вбудованість у месенджер. Adoption через наявну інфраструктуру, а не переконання.", "body": "## Проблема масштабу, яку не вирішив Ethereum\n\nДо 2017 року Ethereum довів концепцію: смарт-контракти працюють, децентралізовані застосунки можливі. Але з'явилася нова проблема — масштаб.\n\nEthereum у базовій версії обробляє близько 15 транзакцій на секунду. Для порівняння: Visa обробляє в середньому 1700 транзакцій на секунду, а в пікові періоди — до 24 000. Коли в мережі Ethereum з'являвся популярний застосунок — наприклад, гра CryptoKitties у 2017 році — мережа буквально перевантажувалася. Користувачі чекали годинами, а комісії зростали до десятків доларів за одну транзакцію. Блокчейн для всіх виявився занадто повільним для всіх.\n\nКрім того, користуватися Ethereum було технічно складно. Потрібно встановити гаманець. Купити ETH спеціально для оплати комісій. Розібратися в інтерфейсах, які проєктувалися програмістами для програмістів. Для пересічного користувача Telegram — занадто високий поріг.\n\n## TON: архітектура, спроєктована для масштабу\n\nУ 2018-2019 роках брати Дурови — Павло і Микола — працювали над TON: The Open Network. Микола Дуров — один із найсильніших математиків і програмістів свого покоління, творець алгоритмів ВКонтакте і Telegram. Він спроєктував TON з нуля, маючи на увазі конкретну мету: система має працювати для мільярда користувачів.\n\nTON Whitepaper описує кілька ключових технічних рішень, які відрізняють його від Bitcoin і Ethereum.\n\nНескінченне шардування. Головна проблема масштабування блокчейну: що більше транзакцій, то повільніше працює мережа, бо кожен вузол має обробляти все. TON вирішує це через автоматичне шардування: мережа ділиться на паралельні ланцюжки (шарди) у міру зростання навантаження — як дорога, що автоматично додає смуги в годину пік. Теоретично це дає змогу масштабуватися без втрати швидкості.\n\nМиттєві транзакції. У Bitcoin транзакція підтверджується за 10-60 хвилин. В Ethereum — за кілька хвилин. У TON механізм оптимістичних підтверджень дає змогу обробляти транзакції за секунди. Для платіжного сервісу це принципово.\n\nВбудовані сервіси. У Bitcoin і Ethereum DNS (система доменних імен), сховище файлів та інші сервіси — зовнішні надбудови. У TON вони вбудовані в протокол. Це спрощує розробку застосунків і знижує залежність від зовнішніх сервісів.\n\n## Telegram як точка входу\n\nАле найважливіше в TON — контекст. Це не просто ще один блокчейн, що конкурує з Ethereum. Це фінансовий шар для Telegram — месенджера з 950 мільйонами користувачів.\n\nСтратегія принципово відрізняється від конкурентів. Bitcoin і Ethereum будували екосистему з нуля: залучи користувачів, переконай їх встановити гаманець, поясни, що таке блокчейн. TON вбудовується в наявну інфраструктуру: у тебе вже є Telegram, у тебе вже є контакти, у тебе вже є звичка користуватися застосунком щодня. Просто додай гаманець — і все, що тобі потрібно для базових криптотранзакцій, уже тут.\n\nДжаред Ларні в есе «Own the Internet» описує майбутнє, де користувачі володіють частиною платформ через токени. TON рухається саме в цьому напрямку: користувачі Telegram — потенційні учасники TON-економіки, а не просто споживачі сервісу.\n\nШлях TON був непростим: початковий проєкт заблокувала SEC у 2020 році. Дурови закрили проєкт. Але спільнота продовжила розвиток під назвою TON Foundation. До 2024 року TON став одним із блокчейнів, що зростають найшвидше, — з активним розвитком DeFi, NFT-екосистеми і Mini Apps усередині Telegram.\n\n> TON вирішує не просто технічне завдання масштабу. Він вирішує завдання adoption: як зробити блокчейн доступним для людей, які ніколи не чули про блокчейн, — тому що він вбудований у застосунок, яким вони вже користуються.\n\nЦе і є наступний фронтир: не переконувати людей переходити на нові технології, а вбудовувати нові технології в їхнє наявне життя. Непомітно. Без бар'єрів. Без лекцій про приватні ключі.", "sources": [{"title": "Андреас Антонопулос — Mastering Bitcoin (2014)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BD%D0%B4%D1%80%D0%B5%D0%B0%D1%81%20%D0%90%D0%BD%D1%82%D0%BE%D0%BD%D0%BE%D0%BF%D1%83%D0%BB%D0%BE%D1%81%20%E2%80%94%20Mastering%20Bitcoin%20%282014%29", "linkType": "gbooks"}, {"title": "Дон Тапскотт, Алекс Тапскотт — Blockchain Revolution (2016) rnet (2021)", "url": "https://www.google.com/search?tbm=bks&q=%D0%94%D0%B6%D0%B0%D1%80%D0%B5%D0%B4%20%D0%9B%D0%B0%D1%80%D0%BD%D0%B8%20%E2%80%94%20Own%20the%20Internet%20%282021%29", "linkType": "gbooks"}, {"title": "Бен Мезрич — Bitcoin Billionaires (2019)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B5%D0%BD%20%D0%9C%D0%B5%D0%B7%D1%80%D0%B8%D1%87%20%E2%80%94%20Bitcoin%20Billionaires%20%282019%29", "linkType": "gbooks"}], "tags": ["TON", "Telegram", "блокчейн", "масштабованість"], "x": 287.9, "y": 232.9, "angDeg": 225.0}], "edges": [{"from": "intermediary", "to": "nakamoto", "label": "проблему вирішили без посередника", "lenses": ["chronology", "trust"]}, {"from": "nakamoto", "to": "buterin", "label": "від реєстру до компʼютера", "lenses": ["chronology", "programmability"]}, {"from": "buterin", "to": "defi", "label": "смарт-контракти замінюють банки", "lenses": ["programmability", "access"]}, {"from": "nakamoto", "to": "keys", "label": "суверенність потребує ключів", "lenses": ["trust", "sovereignty"]}, {"from": "keys", "to": "wallets", "label": "ключі сховали в гаманець", "lenses": ["sovereignty", "access"]}, {"from": "wallets", "to": "ton", "label": "надіслати крипту як повідомлення", "lenses": ["access", "chronology"]}, {"from": "keys", "to": "identity", "label": "суверенне «я» невідчужуване", "lenses": ["sovereignty"]}, {"from": "buterin", "to": "identity", "label": "особистість програмована", "lenses": ["programmability", "sovereignty"]}, {"from": "defi", "to": "ton", "label": "доступ для 1,4 млрд без банку", "lenses": ["access", "economy"]}, {"from": "intermediary", "to": "defi", "label": "фінанси без інститутів", "lenses": ["trust", "programmability"]}, {"from": "wallets", "to": "defi", "label": "гаманець — вхід у DeFi", "lenses": ["access", "programmability"]}]}, "kk": {"chapter": {"key": "web3", "title": "Блокчейн", "lede": "Делдалсыз сенім — билікпен емес, математикамен. Қосарлы жұмсау мәселесінен TON-ға дейін.", "sourceUrl": "https://lumina
