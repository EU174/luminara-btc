<!doctype html>
<html lang="hy">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Մինչ ինտերնետը · Luminara</title><style>
:root{
  --paper:#f6f3ec; --paper2:#efe9dd; --ink:#1c2230; --ink2:#4a5468; --muted:#8a8172;
  --rule:#d9cfbc; --rule2:#e7dfce; --gold:#b7791f; --center:#1c2230;
  --power:#c0392b; --technology:#1f7a5a; --media:#b7791f; --privacy:#6b4fa0; --economy:#a04a7a;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
  --shadow:0 1px 0 rgba(0,0,0,.04),0 10px 30px rgba(60,50,30,.10);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1100px 620px at 50% -8%, #fbf8f1 0%, var(--paper) 60%),var(--paper);
  color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.app-shell{display:grid;grid-template-columns:288px minmax(0,1fr) 340px;gap:20px;padding:22px;min-height:100vh}
.control-rail,.detail-panel{background:linear-gradient(180deg,#fffdf8,var(--paper2));
  border:1px solid var(--rule);border-radius:14px;padding:20px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:16px;min-height:0}
.detail-panel{overflow:auto}
.eyebrow{margin:0;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
#app-title{margin:0;font-family:var(--serif);font-size:30px;line-height:1.05;letter-spacing:-.01em}
.chapter-lede{margin:0;color:var(--ink2);font-size:14px;font-family:var(--serif);font-style:italic;line-height:1.5}
.rail-rule{height:1px;background:linear-gradient(90deg,var(--rule),transparent);margin:2px 0}
.section-h{margin:0;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lens-group{display:flex;flex-wrap:wrap;gap:7px}
.lens-btn{cursor:pointer;border:1px solid var(--rule);background:#fffdf7;color:var(--ink2);
  padding:6px 11px;border-radius:8px;font-size:12.5px;transition:.15s;display:inline-flex;gap:7px;align-items:center;font-weight:500}
.lens-btn:hover{border-color:var(--muted);color:var(--ink)}
.lens-btn[aria-pressed="true"]{border-color:var(--dot);color:var(--ink);background:#fff;box-shadow:0 0 0 1px var(--dot) inset}
.lens-dot{width:9px;height:9px;border-radius:50%;background:var(--dot);display:inline-block}
.lens-desc{margin:0;color:var(--ink2);font-size:12.5px;min-height:3.2em;line-height:1.5;font-family:var(--serif)}
.progress-box{font-size:11.5px;color:var(--muted)}
.progress-bar{height:5px;border-radius:5px;background:var(--rule2);overflow:hidden;margin-top:6px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),#d6a94e);width:0;transition:width .35s}
.node-list{display:flex;flex-direction:column;gap:2px;overflow:auto}
.node-list button{text-align:left;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--ink2);
  padding:8px 9px;border-radius:9px;font-size:13px;display:flex;gap:10px;align-items:baseline;transition:.12s;font-family:var(--serif)}
.node-list button:hover{background:#fffdf6;border-color:var(--rule)}
.node-list button[aria-current="true"]{background:#fff;border-color:var(--dot);color:var(--ink)}
.node-idx{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11px;min-width:16px;font-family:var(--sans)}

.map-stage{position:relative;background:radial-gradient(680px 680px at 50% 46%, #fffdf8 0%, #f4efe4 72%, #efe7d7 100%);
  border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;min-height:600px;display:flex}
.system-map{width:100%;height:100%;display:block}

.ring{fill:none;stroke:var(--rule2);stroke-width:1}
.ring-tick{stroke:var(--rule);stroke-width:1}
.era-label{fill:var(--muted);font-size:10.5px;font-family:var(--sans);font-weight:600;letter-spacing:.03em}

.edge path{fill:none;stroke:var(--rule);stroke-width:1.4;transition:stroke .25s, opacity .25s;opacity:.5;
  stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .9s ease forwards}
.edge.active path{stroke:var(--dot,#b7791f);stroke-width:2;opacity:.92;marker-end:url(#arrow-active)}
@keyframes draw{to{stroke-dashoffset:0}}
.edge-label{fill:var(--muted);font-size:10px;opacity:0;transition:.2s;font-family:var(--sans)}
.edge.active .edge-label{opacity:.9}

.center-halo{fill:#fff;opacity:.6;transform-origin:center;transform-box:fill-box;animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.4;r:74}50%{opacity:.75;r:86}}
.center-ring{fill:none;stroke:var(--dot,#b7791f);stroke-width:2;opacity:.5;transition:stroke .3s}
.center-disc{fill:var(--center);stroke:#000;stroke-opacity:.06}
.center-t1{fill:#fff;font-family:var(--serif);font-size:15px;font-weight:600;text-anchor:middle}
.center-t2{fill:#e9c986;font-family:var(--sans);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;text-anchor:middle}
.spoke{stroke:var(--rule);stroke-width:1;stroke-dasharray:2 4;opacity:.45}

.node{cursor:pointer;opacity:0;animation:pop .5s ease forwards;animation-delay:var(--delay,0s)}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.node{transform-origin:var(--ox) var(--oy);transform-box:view-box}
.node .halo{fill:var(--dot);opacity:.10;transition:.2s}
.node .disc{fill:#fffdf8;stroke:var(--dot);stroke-width:2;transition:.2s;filter:drop-shadow(0 3px 6px rgba(60,50,30,.12))}
.node:hover .disc{stroke-width:2.6}
.node .num{fill:var(--dot);font-family:var(--serif);font-size:15px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.node .cap{fill:var(--ink);font-family:var(--serif);font-size:13px;font-weight:600}
.node .kicker{fill:var(--muted);font-family:var(--sans);font-size:9px;letter-spacing:.1em;text-transform:uppercase}
.node .era{fill:var(--dot);font-family:var(--sans);font-size:9.5px;font-weight:700}
.node.selected .disc{stroke-width:3;fill:#fff}
.node.selected .halo{opacity:.22}
.node.dim{opacity:.32}

.detail-empty{color:var(--ink2);font-size:13.5px;font-family:var(--serif);line-height:1.6}
.detail-kicker{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dot);margin:0;font-weight:600}
.detail-title{margin:5px 0 0;font-family:var(--serif);font-size:21px;line-height:1.15}
.detail-thesis{margin:0;color:var(--ink);font-size:14.5px;font-family:var(--serif);line-height:1.55}
.detail-insight{margin:0;padding:11px 13px;border-left:3px solid var(--dot);background:#fffdf6;border-radius:0 8px 8px 0;font-size:13.5px;font-family:var(--serif);font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11px;color:var(--ink2);background:#fffdf6;border:1px solid var(--rule);border-radius:999px;padding:3px 10px}
.related h4,.sources-block h4{margin:8px 0 5px;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.related-list{display:flex;flex-direction:column;gap:3px}
.related-list button{cursor:pointer;text-align:left;background:#fffdf6;border:1px solid var(--rule);color:var(--ink2);border-radius:8px;padding:7px 9px;font-size:12.5px;font-family:var(--serif)}
.related-list button:hover{border-color:var(--dot);color:var(--ink)}
.sources-block ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.sources-block li{font-size:11.5px;color:var(--ink2);line-height:1.4}
.sources-block a{color:var(--gold);text-decoration:none;border-bottom:1px solid var(--rule)}
.panel-actions{display:flex;gap:8px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.btn{cursor:pointer;border-radius:9px;padding:9px 13px;font-size:13px;border:1px solid var(--rule);background:#fffdf7;color:var(--ink);font-weight:500}
.btn.primary{background:var(--center);color:#fff;border-color:var(--center)}
.btn:hover{filter:brightness(.98)}.btn.primary:hover{filter:brightness(1.15)}
.empty-state{margin:auto;text-align:center;padding:30px;color:var(--ink2);max-width:420px;font-family:var(--serif)}
.empty-state a{color:var(--gold)}

.scene-dialog{border:1px solid var(--rule);background:linear-gradient(180deg,#fffdf8,var(--paper2));
  border-radius:16px;max-width:680px;width:calc(100vw - 40px);padding:0;box-shadow:0 30px 80px rgba(40,30,10,.3)}
.scene-dialog::backdrop{background:rgba(40,32,18,.34);backdrop-filter:blur(2px)}
.dialog-inner{padding:26px 30px}
.dialog-inner h3{margin:2px 0 0;font-family:var(--serif);font-size:26px;line-height:1.12}
.dialog-close{position:absolute;top:14px;right:18px;cursor:pointer;background:transparent;border:none;color:var(--muted);font-size:24px;line-height:1}
.dialog-body{margin:14px 0;color:var(--ink);font-size:15.5px;line-height:1.72;font-family:var(--serif)}
.dialog-body h2{font-size:17px;font-family:var(--serif);margin:18px 0 6px}
.dialog-body p{margin:0 0 12px}
.arpa-wrap{margin-top:14px;border:1px solid var(--rule);border-radius:12px;padding:16px;background:#fffdf6}
.arpa-wrap h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600}
.arpa-svg{width:100%;height:160px;display:block;background:#faf6ec;border-radius:8px;border:1px solid var(--rule2)}
.arpa-note{margin:9px 0 0;color:var(--ink2);font-size:12px;min-height:1.4em;font-family:var(--serif)}
.arpa-net line{stroke:var(--rule);stroke-width:2}
.arpa-net .path-active{stroke:var(--technology);stroke-width:3}
.arpa-net circle.host{fill:#fffdf8;stroke:var(--muted);stroke-width:2}
.arpa-net circle.down{fill:#f6e3e0;stroke:var(--power);stroke-width:2}
.arpa-net .packet{fill:var(--gold)}
.arpa-net text{fill:var(--ink2);font-size:11px;text-anchor:middle;font-family:var(--serif)}

@media (prefers-reduced-motion: reduce){
  .node,.edge path,.center-halo{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}
}
@media (max-width:1060px){
  .app-shell{grid-template-columns:1fr}
  .map-stage{min-height:64vh;order:-1}
  .control-rail{order:0}.detail-panel{order:2}
}
@media (max-width:560px){
  .app-shell{padding:12px;gap:12px}
  #app-title{font-size:24px}
  .map-stage{min-height:72vh}
}
</style>

ած հենց այսպես։ Եվ ինչու դա խնդիր է։\n\nԸնդամենը յոթանասուն տարի առաջ Կիևից Նյու Յորք հաղորդագրություն ուղարկելը փող էր արժեում, օրեր էր տևում և վերահսկվում էր նրանց կողմից, ովքեր ունեին սարքավորումներ՝ պետությունների, հեռագրային ընկերությունների, թերթերի խմբագրությունների։ Տեղեկատվությունը սակավություն էր՝ ճիշտ այնպես, ինչպես նավթը կամ հացահատիկը։ Եվ ինչպես ցանկացած սակավություն, այն իշխանություն էր։ Նա, ով վերահսկում էր տեղեկատվության փոխանցումը, վերահսկում էր իրականությունը։\n\nՊատկերացրու XX դարի կեսերի տպարան։ Հսկայական մետաղական մեքենաներ, կապարե տառեր, ներկի ու յուղի հոտ։ Մի գաղափարը մեկ միլիոն մարդու հասցնելու համար պետք էր ֆիզիկապես տպել թերթի մեկ միլիոն օրինակ, բեռնել դրանք բեռնատարների վրա և տարածել երկրի ողջ կրպակներով։ Յուրաքանչյուր օրինակ փող էր արժեում։ Առաքման յուրաքանչյուր կիլոմետր փող էր արժեում։ Տպաքանակում մեկ տառասխալ՝ փողը դեն է նետված, հեղինակությունը՝ վնասված։ Դա հսկայական, ծանր, դանդաղ մեխանիզմ էր։\n\nՌադիոն և հեռուստատեսությունը հեղափոխություն էին թվում՝ ազդանշանը տարածվում է լույսի արագությամբ, բեռնատարներ պետք չեն։ Բայց դրանցում կար հիմնարար սահմանափակում՝ մեկ հաղորդիչ, միլիոնավոր ընդունիչներ։ Միայն նա կարող էր խոսել, ով ուներ աշտարակը։ Մնացած ողջ մարդկությունը լսում էր։ Հնարավոր չէր լսափողը վերցնել ու պատասխանել։ Հնարավոր չէր առարկել։ Հնարավոր չէր ավելացնել քո սեփական ձայնը։\n\nԱհա թե ինչպիսին էր տեղեկատվության աշխարհը մինչև ինտերնետը՝ կենտրոնացված, թանկ, միակողմանի։ Մի քանի աղբյուրներ հաղորդում էին շատերին։ Տեղեկատվությունը հոսում էր խիստ վերևից ներքև՝ սարքավորում ունեցողներից դեպի նրանց, ովքեր չունեին։ Սա ոչ թե պատահականություն էր, ոչ էլ չար մտադրություն՝ դա այդ ժամանակի տեխնոլոգիաների ֆիզիկական իրականությունն էր։\n\n> Տեղեկատվությունը պարզապես ռեսուրս չէր՝ այն իշխանության ճարտարապետությունն էր։ Ով տնօրինում էր փոխանցման ալիքը, նա էլ տնօրինում էր իրականությունը։\n\nՀենց այդ պատճառով առաջին մարդիկ, ովքեր հասկացան, որ այդ ճարտարապետությունը կարելի է փոխել, հասկացան հեղափոխական մի բան։ Ոչ միայն, որ «տվյալները կարելի է ավելի արագ փոխանցել»։ Այլ որ «տեղեկատվության նկատմամբ իշխանության հենց կառուցվածքը կարելի է կոտրել»։ Եվ նրանք սկսեցին աշխատել դրա վրա՝ առաջին բրաուզերի հայտնվելուց շատ առաջ։", "tags": ["իշխանություն", "պակաս", "մեդիա"], "lensWeight": {"chronology": 5, "power": 5, "technology": 1, "media": 4, "privacy": 1}, "angDeg": -90.0, "sources": [{"title": "Կլոդ Շեննոն — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Վաննևար Բուշ — As We May Think (1945)", "url": ""}, {"title": "Դանիել Բել — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Էլվին Թոֆլեր — The Third Wave (1980)", "url": ""}, {"title": "Մարշալ Մաքլուհան — Understanding Media (1964)", "url": ""}, {"title": "Նիկոլաս Նեգրոպոնտե — Being Digital (1995)", "url": ""}, {"title": "Դուգլաս Ռաշկոֆ — Media Virus! (1994)", "url": ""}, {"title": "Սթյուարտ Բրենդ — Information Wants to Be Free (1984)", "url": ""}, {"title": "Էրիկ Հյուզ — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Մանուել Կաստելս — The Information Age (1996–1998)", "url": ""}], "era": "մինչ 1948"}, {"id": "shannon", "sceneIndex": 1, "x": 692.8, "y": 215.2, "type": "technology", "title": "Շենոն. տեղեկատվությունը դարձավ ֆիզիկա", "shortTitle": "Շեննոն", "insight": "Շենոնը ցույց տվեց, որ տեղեկատվությունը կարելի է չափել ու փոխանցել որպես ֆիզիկական մեծություն. դա հիմք դրեց ամբողջ թվային աշխարհի մաթեմատիկական կառույցին։", "body": "## Մտքը չափած մարդը\n\n1948 թվականին ամերիկացի մաթեմատիկոս Քլոդ Շենոնը հրապարակեց չոր տեխնիկական վերնագրով մի աշխատանք՝ «Կապի մաթեմատիկական տեսություն»։ Այն ժամանակ քչերն էին այն կարդում։ Հիմա էլ քչերն են կարդում։ Բայց այն աշխարհը փոխեց ավելի շատ, քան այն գրքերի մեծ մասը, որոնք բոլորը կարդում են։\n\nՇենոնը ապացուցեց թվում էր անհնար մի բան. ցանկացած հաղորդագրություն — բառ, ձայն, պատկեր, թիվ, բառերով նկարագրված հոտ — կարելի է ճշգրտորեն չափել, սեղմել և փոխանցել ցանկացած կապի ալիքով։ Չափման միավորը նա կոչեց «բիթ»՝ binary digit-ից՝ երկուական թվանշան։ Զրո կամ մեկ։ Ազդանշան կա կամ չկա։ Տեղեկատվության ամբողջ տիեզերքը զրոների ու մեկերի համադրություններ են։\n\nՇենոնից առաջ տեղեկատվությունը մշուշոտ ու սուբյեկտիվ բան էր։ Որոշ բառեր «ավելի կարևոր» էին, քան մյուսները։ Որոշ պատկերներ «ավելի բովանդակալից» էին։ Որոշ հաղորդագրություններ «ավելի հարուստ» էին։ Շենոնից հետո տեղեկատվությունը դարձավ ֆիզիկական մեծություն՝ նույնքան իրական ու չափելի, որքան զանգվածը կամ ջերմաստիճանը։ Աշխարհը դադարեց բաժանվել միայն նյութի ու էներգիայի։ Հայտնվեց երրորդը՝ տեղեկատվությունը։ Եվ այդ երրորդը ոչ պակաս հիմնարար դուրս եկավ, քան առաջին երկուսը։\n\n## Մոմի բոցը օվկիանոսի միջով\n\nՈրպեսզի հասկանաս, թե ինչ արեց Շենոնը, պատկերացրու այս խնդիրը՝ մոմի բոցը Կիևից Տոկիո փոխանցել։ Կարելի է հենց մոմը տեղափոխել, բայց դա դանդաղ է, թանկ, և բոցը ճանապարհին կմարի։ Դա նյութի փոխանցում է, և այն սահմանափակված է ֆիզիկական օրենքներով։\n\nԲայց կարելի է նկարագրել բոցը՝ նրա գույնը, բարձրությունը, ջերմաստիճանը, ձևը, մոմի քիմիական բաղադրությունը։ Այդ նկարագրությունը լույսի արագությամբ ուղարկել լարով։ Եվ Տոկիոյում մեկ ուրիշ մարդ կվառի հենց նույն բոցը։ Դա տեղեկատվության փոխանցում է, և այն չի ճանաչում ֆիզիկական սահմանափակումներ։\n\nՇենոնը ցույց տվեց, որ այս երկրորդ մեթոդը կարելի է դարձնել բացարձակ ճշգրիտ, հուսալի և մասշտաբավորվող։ Որ ցանկացած ազդանշան կարելի է կոդավորել բիթերի մեջ, փոխանցել առանց աղավաղման և մյուս կողմում վերականգնել։ Ամբողջ թվային աշխարհը հենց դրա վրա է կանգնած՝ էլեկտրոնային փոստից մինչև 4K streaming, հաղորդագրությունների հավելվածներից մինչև blockchain։\n\nԱմեն անգամ, երբ Telegram-ում հաղորդագրություն ես ուղարկում, աշխատում է Շենոնը։ Ամեն անգամ, երբ blockchain-ում գործարքը փոխանցվում է ցանցի հանգույցների միջև, աշխատում է Շենոնը։ Նա ստեղծեց մաթեմատիկական հիմքը, որի վրա կառուցված է ամբողջ թվային աշխարհը։\n\n> Շենոնը ինտերնետը չի հորինել։ Նա ապացուցեց, որ ինտերնետը հնարավոր է՝ որ տեղեկատվությունը կարելի է փոխանցել ճշգրիտ, ինչպես ֆիզիկական մեծություն։\n\nՊարադոքսն այն է, որ ինքը՝ Շենոնը, աշխատում էր Bell Laboratories-ում՝ աշխարհի ամենամեծ հեռախոսային մենաշնորհում։ Նրա հայտնագործությունն ի վերջո կործանեց իր գործատուի մենաշնորհը։ Երբ տեղեկատվությունը կարելի է փոխանցել ցանկացած ալիքով, նշանակում է, որ ոչ մի ալիք չի կարող հավերժ մենաշնորհատեր մնալ։", "tags": ["ազդանշան", "կոդավորում", "չափում"], "lensWeight": {"chronology": 4, "power": 2, "technology": 5, "media": 2, "privacy": 2}, "angDeg": -50.0, "sources": [{"title": "Կլոդ Շեննոն — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Վաննևար Բուշ — As We May Think (1945)", "url": ""}, {"title": "Դանիել Բել — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Էլվին Թոֆլեր — The Third Wave (1980)", "url": ""}, {"title": "Մարշալ Մաքլուհան — Understanding Media (1964)", "url": ""}, {"title": "Նիկոլաս Նեգրոպոնտե — Being Digital (1995)", "url": ""}, {"title": "Դուգլաս Ռաշկոֆ — Media Virus! (1994)", "url": ""}, {"title": "Սթյուարտ Բրենդ — Information Wants to Be Free (1984)", "url": ""}, {"title": "Էրիկ Հյուզ — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Մանուել Կաստելս — The Information Age (1996–1998)", "url": ""}], "era": "1948"}, {"id": "memex", "sceneIndex": 2, "x": 795.4, "y": 392.9, "type": "media", "title": "Բուշի Memex-ը. ժամանակից առաջ ընկած երազանք", "shortTitle": "Memex", "insight": "1945 թվականին Վաննևար Բուշը նկարագրեց հիպերտեքստը և փոխկապակցված գիտելիքը՝ Web-ից 46 տարի առաջ։ Ճիշտ գաղափարները չեն մահանում, դրանք սպասում են իրենց տեխնոլոգիաներին։", "body": "## Հիպերտեքստը՝ ինտերնետից քառասուն տարի առաջ\n\nԴեռ 1945 թվականին՝ առաջին լիարժեք համակարգչի հայտնվելուց երկու տարի առաջ և World Wide Web-ից քառասունվեց տարի առաջ, ամերիկացի գիտնական Վանևար Բուշը գրեց «As We May Think» վերնագրով էսսեն։ Այն հրապարակվեց The Atlantic-ում՝ ոչ թե գիտական ամսագրում, այլ լայն լսարանի համար նախատեսված զանգվածային պարբերականում։ Բուշը ցանկանում էր, որ իրեն կարդան բոլորը, ոչ միայն գիտնական գործընկերները։\n\nՆա նկարագրեց մի սարք, որը կոչեց «memex»՝ memory extender-ից, հիշողության ընդլայնիչ։ Դա մարդկության բոլոր գիտելիքների անձնական գրադարանն էր, որտեղ ցանկացած փաստաթուղթ իր իմաստով կապվում է ցանկացած այլ փաստաթղթի հետ։ Դու կարդում ես Նապոլեոնի մասին հոդված, և մեկ շարժումով անցնում ես նրա արշավների քարտեզին։ Քարտեզից՝ նրա գեներալների նամակներին։ Նամակներից՝ XX դարի ռազմական պատմաբանների կողմից նրա մարտավարության վերլուծությանը։ Դու չես որոնում այբբենական կատալոգում, չես թերթում դարակները, այլ հետևում ես մտքի շղթային՝ ինչպես հենց միտքն է հետևում։\n\nՍա հիպերտեքստ էր։ Այն բառից քառասուն տարի առաջ, մինչև որ այն պաշտոնապես կմտածվեր։ Քառասունվեց տարի առաջ, մինչև Թիմ Բերներս-Լին այս գաղափարը իրականացներ World Wide Web-ի տեսքով։\n\n## Ինչու երազանքը մնաց գրասեղանի դարակում\n\nԲուշը ապագան տեսնում էր լիովին պարզ․ գիտելիքը պետք է կապակցված լինի, հասանելի լինի բոլորին և պատկանի բոլորին։ Միայն մեկ խնդիր կար՝ տեխնոլոգիաները դեռ գոյություն չունեին։ 1945 թվականին համակարգիչները զբաղեցնում էին ամբողջ սենյակներ, արժեին ինչպես ինքնաթիռներ և կարող էին միայն հաշվարկել։ Չկային էկրաններ, չկային մկներ, չկային ցանցեր։ Բուշը սարքը նկարագրեց միկրոֆիլմերի և մեխանիկական լծակների լեզվով, որովհետև դա էր միակ բանը, որը նա ուներ որպես համեմատություն։\n\nՆրա երազանքը գրասեղանի դարակում մնաց գրեթե կես դար։ Բայց այն չմոռացվեց։ Այն կարդում էին, մեջբերում էին, ձեռքից ձեռք փոխանցում։ Թեդ Նելսոնը 1965 թվականին հորինեց «hypertext» բառը՝ ուղղակիորեն ոգեշնչվելով Բուշից։ Դուգլաս Էնգելբարտը ստեղծեց համակարգչային մկնիկը և հիպերտեքստային փաստաթղթերի համակարգը՝ նույնպես Բուշի ազդեցության ներքո։\n\nԵրբ Թիմ Բերներս-Լին 1989 թվականին CERN-ում գրում էր Web ստեղծելու իր առաջարկը, նա ուղիղ հղում էր անում Բուշի էսսեին որպես սկզբնական գաղափարի։ Հրապարակումից քառասունչորս տարի անց երազանքը վերջապես ստացավ իրականացման գործիքները։\n\nԱյս պատմությունը կարևոր է ոչ թե որպես պատմական հետաքրքրություն։ Այն ցույց է տալիս մի հիմնարար բան․ ճիշտ գաղափարը չի մահանում։ Այն սպասում է իր պահին։ Երբեմն՝ տասնամյակներ շարունակ։ Այսօր մենք ապրում ենք նման մի պահ՝ ապակենտրոնացված ինտերնետի գաղափարները, որտեղ օգտատերերը տիրապետում են իրենց տվյալներին, գոյություն ունեին շատ առաջ՝ blockchain-ից։ Տեխնոլոգիաները պարզապես վերջապես հասան տեսլականին։\n\n> Բուշը նկարագրել էր World Wide Web-ը դրա ստեղծումից քառասունվեց տարի առաջ։ Ոչ թե որովհետև նա մարգարե էր, այլ որովհետև հասկանում էր, թե մարդկային միտքը ինչ է ուզում գիտելիքի գործիքներից։\n\nՊարադոքսալ է, բայց 1945 թվականին Բուշը մտածում էր գաղափարների միջև կապերի մասին, իսկ արդյունքում մենք ստացանք ինտերնետ, որտեղ մարդկանց միջև կապերը ավելի կարևոր եղան, քան գաղափարների միջև կապերը։ Սա կարևոր տարբերություն է, և մենք կվերադառնանք դրան հաջորդ գլուխներում.", "tags": ["հիպերտեքստ", "գիտելիք", "ասոցիացիաներ"], "lensWeight": {"chronology": 4, "power": 2, "technology": 4, "media": 5, "privacy": 1}, "angDeg": -10.0, "sources": [{"title": "Կլոդ Շեննոն — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Վաննևար Բուշ — As We May Think (1945)", "url": ""}, {"title": "Դանիել Բել — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Էլվին Թոֆլեր — The Third Wave (1980)", "url": ""}, {"title": "Մարշալ Մաքլուհան — Understanding Media (1964)", "url": ""}, {"title": "Նիկոլաս Նեգրոպոնտե — Being Digital (1995)", "url": ""}, {"title": "Դուգլաս Ռաշկոֆ — Media Virus! (1994)", "url": ""}, {"title": "Սթյուարտ Բրենդ — Information Wants to Be Free (1984)", "url": ""}, {"title": "Էրիկ Հյուզ — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Մանուել Կաստելս — The Information Age (1996–1998)", "url": ""}], "era": "1945"}, {"id": "arpanet", "sceneIndex": 3, "x": 759.8, "y": 595.0, "type": "technology", "title": "ARPANET: ինտերնետը ծնվեց վախից", "shortTitle": "ARPANET", "insight": "ARPANET-ը ստեղծվեց որպես ռազմական կապի համակարգ՝ առանց միակ խափանման կետի, և հենց այդ ապակենտրոնացված ճարտարապետությունն էլ դարձավ ողջ ինտերնետի հիմքը։", "body": "## Աշխարհի ճարտարապետությունը փոխած արբանյակը\n\nԻնտերնետի պատմությունը չի սկսվում ո՛չ Սիլիկոնյան հովտում, ո՛չ էլ համալսարանական լսարաններում։ Այն սկսվում է Պենտագոնում, սառը պատերազմի ամենաթեժ պահին, սուր աշխարհաքաղաքական վախի պայմաններում։\n\n1957 թվականի հոկտեմբերի 4-ին Խորհրդային Միությունը արձակեց Երկրի առաջին արհեստական արբանյակը։ 58 սանտիմետր տրամագծով, 83 կիլոգրամ քաշով փոքր մետաղական գունդը սլանում էր Երկրի վրայով ու ազդանշաններ արձակում, և ամբողջ աշխարհը դա լսում էր։ Ամերիկյան զինվորականների համար սա ոչ միայն մրցակցի տեխնոլոգիական հաղթանակն էր։ Սա ահազանգ էր. թշնամին վերահսկում է ուղեծիրը։ Եթե նրանք կարող են արբանյակ արձակել, կարող են նաև միջուկային մարտագլխիկով հրթիռ արձակել և հասնել մոլորակի ցանկացած կետի։\n\nՄեկ տարի անց ԱՄՆ-ը ստեղծեց DARPA-ն՝ Պաշտպանության առաջատար հետազոտական նախագծերի գործակալությունը։ Նրա առաջ կանգնած էր մեկ խնդիր՝ ստեղծել ռազմական կապի համակարգ, որը մեկ հարվածով հնարավոր չի լինի ոչնչացնել։ Սովորական հեռախոսային ցանցերը աղետալիորեն խոցելի էին. որտեղ կա կենտրոնական հեռախոսակայան, այնտեղ կա նաև խափանման կետ։ Պենտագոնի վրա ընկած մեկ ռումբ, և կապը ամբողջ բանակի հետ կորչում է։\n\n## Առանց կենտրոնի ցանցը՝ գաղափար, որ փոխեց ամեն ինչ\n\nDARPA-ի ինժեներները մտածեցին սկզբունքորեն այլ լուծում։ Իսկ եթե կենտրոնը ընդհանրապես հեռացնենք։ Ցանցի յուրաքանչյուր հանգույցը դարձնենք հավասարազոր։ Եթե մեկը խափանվում է, հաղորդագրությունը ավտոմատ գտնում է այլ երթուղի։ Ինչպես ջուրը խողովակներում. եթե մեկ խողովակ փակված է, ջուրը շրջանցող ճանապարհ է գտնում։\n\nԱյդ գաղափարը կոչվեց ARPANET։ 1969 թվականին այն առաջին անգամ աշխատեց. չորս համալսարաններ՝ UCLA, Stanford, UC Santa Barbara և Utah, տվյալներ փոխանակեցին հեռախոսագծով։ Առաջին հաղորդագրությունը, որը փորձում էին ուղարկել, \"login\" բառն էր։ Համակարգը խափանվեց \"o\" տառից հետո։ Պրոտո-ինտերնետով փոխանցված առաջին բառը \"lo\"-ն էր, որը անգլերենում նշանակում է «տես»։ Պատահական պոեզիա։\n\nԱյդ ժամանակ ոչ ոք չէր մտածում, որ սա կդառնա գլոբալ քաղաքացիական ինտերնետի հիմքը։ Զինվորականները ցանկանում էին հուսալի կապ՝ միջուկային պատերազմի դեպքում։ Նրանք ստեղծեցին ավելի մեծ մի բան՝ ճարտարապետություն, որտեղ իշխանությունը կառուցվածքայինորեն չի կարող կենտրոնանալ մեկ կետում։ Բաշխված ցանցը իր բնույթով դիմացկուն է կենտրոնացմանը։\n\nԳոնե այդպես էր մտածված։ Իրականությունը ավելի բարդ դուրս եկավ, և այդ մասին կխոսենք հաջորդ գլուխներում։\n\n> Ինտերնետը ստեղծվել է որպես ռազմական կապի համակարգ, որը դիմացկուն էր միջուկային հարվածին։ Ի վերջո այն դիմացկուն դուրս եկավ իշխանության ցանկացած կենտրոնացման նկատմամբ, և դա դարձավ նրա գլխավոր քաղաքական հատկությունը։\n\n1974 թվականին Վինթոն Սերֆը և Ռոբերտ Քանը լուծեցին հաջորդ խնդիրը. տարբեր համակարգիչներ տարբեր լեզուներով էին խոսում։ Stanford-ի ցանցը չէր հասկանում MIT-ի ցանցը։ Նրանք ստեղծեցին TCP/IP-ը՝ ունիվերսալ պրոտոկոլ, տվյալների փոխանցման համար ցանկացած ցանցերի միջև ընդհանուր լեզու։ Տվյալները բաժանվում են փոքր փաթեթների, յուրաքանչյուրն իր ճանապարհն է գտնում, իսկ մյուս ծայրում կրկին հավաքվում են։ Կարծես նամակը մասերի բաժանեիր, յուրաքանչյուր մասը ուղարկեիր առանձին սուրհանդակով, և դրանք, միևնույն է, հասցեատիրոջ մոտ ճիշտ հերթով նորից հավաքվեին։ Այս նույն պրոտոկոլն այսօր էլ ինտերնետի հիմքն է՝ ստեղծումից հիսուն տարի անց։", "tags": ["փաթեթներ", "DARPA", "TCP/IP", "ապակենտրոնացում"], "lensWeight": {"chronology": 5, "power": 5, "technology": 5, "media": 2, "privacy": 3}, "angDeg": 30.0, "sources": [{"title": "Կլոդ Շեննոն — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Վաննևար Բուշ — As We May Think (1945)", "url": ""}, {"title": "Դանիել Բել — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Էլվին Թոֆլեր — The Third Wave (1980)", "url": ""}, {"title": "Մարշալ Մաքլուհան — Understanding Media (1964)", "url": ""}, {"title": "Նիկոլաս Նեգրոպոնտե — Being Digital (1995)", "url": ""}, {"title": "Դուգլաս Ռաշկոֆ — Media Virus! (1994)", "url": ""}, {"title": "Սթյուարտ Բրենդ — Information Wants to Be Free (1984)", "url": ""}, {"title": "Էրիկ Հյուզ — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Մանուել Կաստելս — The Information Age (1996–1998)", "url": ""}], "era": "1969"}, {"id": "open-web", "sceneIndex": 4, "x": 602.6, "y": 726.9, "type": "technology", "title": "Բերներս-Լի. ամեն ինչ անվճար տալու որոշումը", "shortTitle": "Բաց Web", "insight": "Բերներս-Լին Web-ը անվճար տվեց ոչ թե ալտրուիզմից, այլ որովհետև հասկացավ, որ միայն բաց պրոտոկոլը կարող է գլոբալ դառնալ։", "body": "## «Մշուշոտ, բայց հետաքրքիր» նշումով հայտը\n\n1989 թվականին երիտասարդ բրիտանացի ծրագրավորող Թիմ Բերներս-Լին աշխատում էր CERN-ում՝ Ժնևի Եվրոպական միջուկային հետազոտությունների կենտրոնում։ Դա աշխարհի ամենամեծ գիտական ինստիտուտն է. տասնյակ երկրներից հազարավոր գիտնականներ աշխատում են նույն փորձերի վրա, բայց շարունակ կորցնում են փաստաթղթերը, մոռանում են համատեքստը, ամիսներ են ծախսում հասկանալու համար, թե ինչ է արվել իրենցից առաջ։\n\nԲերներս-Լին ղեկավարությանը ներքին հայտ գրեց։ Էությունն էր՝ ստեղծել համակարգ, որտեղ բոլոր փաստաթղթերը հղումներով կապված կլինեն և հասանելի կլինեն ցանցի ցանկացած համակարգչից։ Նրա ղեկավարը՝ Մայք Սենդալը, լուսանցքում գրեց երեք բառ. «Մշուշոտ, բայց հետաքրքիր»։ Սա աշխարհի վրա ազդեցություն թողած գյուտի ամենահամեստ կարծիքն էր։\n\nԵրեք տարվա ընթացքում Բերներս-Լին ստեղծեց երեք բան, որոնց վրա հիմնված է ամբողջ ժամանակակից ինտերնետը՝ HTML-ը՝ փաստաթղթերի նշագրման լեզուն, HTTP-ը՝ դրանց փոխանցման պրոտոկոլը, և URL-ը՝ հասցեավորման համակարգը։ Դրանք միասին ձևավորեցին World Wide Web-ը։ Փաստաթղթերը պահվում են սերվերներում, ունեն հասցեներ, կապված են հղումներով և բացվում են բրաուզեր ծրագրով։ Պարզ, նրբագեղ, ունիվերսալ։\n\n## Դարաշրջանը որոշած որոշումը\n\nԲայց առանցքային որոշումը տեխնիկական չէր։ Այն էթիկական էր։\n\nԲերներս-Լին կարող էր իր գյուտը արտոնագրել։ CERN-ի իրավաբանները դա առաջարկում էին։ Եթե յուրաքանչյուր կայք HTTP-ի օգտագործման համար ռոյալթի վճարեր, Բերներս-Լին կդառնար մոլորակի ամենահարուստ մարդը։ Փոխարենը նա պնդեց, որ տեխնոլոգիան մարդկությանը տրվի անվճար՝ առանց սահմանափակումների, առանց լիցենզիաների, առանց պայմանների։\n\n«Եթե Web-ը արտոնագրված լիներ կամ գտնվեր մեկ ընկերության վերահսկողության տակ, այն չէր գոյանա», — հետագայում բացատրեց նա։ Սա ալտրուիզմ չէր ալտրուիզմի համար։ Սա ռազմավարություն էր. միայն առանց արգելքների ցանցը կարող էր աճել մինչև գլոբալ մասշտաբ։ Միայն եթե յուրաքանչյուրը կարող է առանց թույլտվության կայք ստեղծել, ցանցը դառնում է իսկապես բաց։\n\n1993 թվականին ԱՄՆ Ազգային սուպերհաշվարկային կիրառությունների կենտրոնի ուսանողները թողարկեցին Mosaic բրաուզերը՝ առաջինը, որը նույն էկրանին միասին ցույց էր տալիս տեքստը և պատկերները։ Մինչ այդ ինտերնետը տեքստի աշխարհ էր։ Mosaic-ը այն տեսողական դարձրեց։ Եվ հասկանալի՝ սովորական մարդու համար, որը երբեք ծրագրավորում չէր սովորել։\n\nՆույն տարում վեբ-կայքերի թիվը անցավ հինգ հարյուրը։ Հիմա դա ծիծաղելի է հնչում, բայց այն ժամանակ դա պայթյուն էր։ Երկու տարի անց դրանք արդեն երկու հարյուր հազար էին։ Մրցավազքը սկսվել էր։\n\n> Բերներս-Լին Web-ը անվճար տվեց և այդպիսով այն գլոբալ դարձրեց։ Եթե նա այն արտոնագրեր, մենք մինչև հիմա ռոյալթի կվճարեինք յուրաքանչյուր հղման համար։\n\nԲերներս-Լիի մասին այս պատմությունը պարզապես կենսագրական փաստ չէ։ Դա ցանցերի բնույթի մասին դաս է. բաց պրոտոկոլները ավելի արագ են աճում, քան փակերը, որովհետև յուրաքանչյուր ոք կարող է դրանց վրա կառուցել։ Այդ պատճառով Ethereum բլոկչեյնը բաց է։ Այդ պատճառով TON-ը բաց պրոտոկոլ է։ 1991 թվականին Բերներս-Լին դրեց մի սկզբունք, որը մինչև այսօր որոշում է, թե որ տեխնոլոգիաներն են հաղթում.", "tags": ["Web", "պրոտոկոլ", "բացություն"], "lensWeight": {"chronology": 5, "power": 4, "technology": 5, "media": 4, "privacy": 2}, "angDeg": 70.0, "sources": [{"title": "Կլոդ Շեննոն — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Վաննևար Բուշ — As We May Think (1945)", "url": ""}, {"title": "Դանիել Բել — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Էլվին Թոֆլեր — The Third Wave (1980)", "url": ""}, {"title": "Մարշալ Մաքլուհան — Understanding Media (1964)", "url": ""}, {"title": "Նիկոլաս Նեգրոպոնտե — Being Digital (1995)", "url": ""}, {"title": "Դուգլաս Ռաշկոֆ — Media Virus! (1994)", "url": ""}, {"title": "Սթյուարտ Բրենդ — Information Wants to Be Free (1984)", "url": ""}, {"title": "Էրիկ Հյուզ — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Մանուել Կաստելս — The Information Age (1996–1998)", "url": ""}], "era": "1991"}, {"id": "atoms-to-bits", "sceneIndex": 5, "x": 397.4, "y": 726.9, "type": "economy", "title": "Ատոմներից դեպի բիթեր. տնտեսական տրամաբանության փոփոխություն", "shortTitle": "Ատոմներ → բիթեր", "insight": "«Ատոմներից դեպի բիթեր» անցումը պարզապես տեխնոլոգիա չէ. դա տնտեսական տրամաբանության փոփոխություն է՝ նույնի մասշտաբից դեպի յուրաքանչյուր փոխազդեցության եզակիություն։", "body": "## Թոֆլերը դա տեսավ 1980-ին\n\nԵրբ 1980 թվականին Էլվին Թոֆլերը հրապարակում էր «Երրորդ ալիքը», անձնական համակարգիչները գրեթե գոյություն չունեին։ Ինտերնետ չկար։ Բջջային հեռախոսներ չկային։ Եվ այնուամենայնիվ նա նկարագրեց տնտեսական վերափոխություն, որը լիովին բացվեց միայն քառասուն տարի անց։\n\nԹոֆլերը նկարագրեց մարդկային քաղաքակրթության երեք դարաշրջան։ Առաջին ալիքը ագրարային էր՝ հողն ու բերքը որպես հիմնական արժեք։ Երկրորդ ալիքը արդյունաբերական էր՝ փոխակրիչ, ստանդարտացում, զանգվածային արտադրություն։ Գործարանը արտադրում է հազար միանման սառնարան, և դա արդյունավետ է հենց այն պատճառով, որ դրանք միանման են։ Որքան շատ են արտադրանքի միավորները, այնքան ցածր է յուրաքանչյուրի ինքնարժեքը։ Մասշտաբը արդյունաբերական տնտեսության հաղթանակն է։\n\nԵրրորդ ալիքը տեղեկատվական է։ Եվ այստեղ տրամաբանությունը շրջվում է գլխիվայր։ Տեղեկատվական տնտեսությունում պատճենումը անվճար է։ Մի ծրագիր կարող է միաժամանակ այլ կերպ վարվել մեկ միլիարդ օգտատերերի հետ, և դա ոչ թե սխալ է, այլ նրա գլխավոր առավելությունը։ Արժեքը ստեղծվում է ոչ թե նույնի կրկնօրինակմամբ, այլ յուրաքանչյուր փոխազդեցության եզակիությամբ։\n\n## Նիկոլաս Նեգրոպոնտե և ամենապարզ բանաձևը\n\n1995 թվականին MIT Media Lab-ի տնօրեն Նիկոլաս Նեգրոպոնտեն դա ձևակերպեց մի արտահայտությամբ, որը դարձավ հայտնի. «ատոմներից դեպի բիթեր»։\n\nԱտոմները ֆիզիկական աշխարհն են։ Սառնարան արտադրելու համար պետք են մետաղ, պլաստիկ, էլեկտրոնիկա, աշխատուժ, գործարան։ Այն գնորդին հասցնելու համար պետք են բեռնատար, պահեստ, խանութ։ Յուրաքանչյուր պատճեն փող է արժենում։ Տպաքանակը սահմանափակվում է ռեսուրսներով։ Եթե ուզում ես վաճառել մեկ միլիոն սառնարան, պետք է արտադրես մեկ միլիոն սառնարան։\n\nԲիթերը թվային աշխարհն են։ Ծրագիր ստեղծելու համար պետք է մեկ մշակող և մեկ համակարգիչ։ Այն մեկ միլիարդ օգտատերերին հասցնելու համար պետք է սերվեր և ինտերնետ կապ։ Պատճենումը գործնականում անվճար է։ Հասցնելը՝ ակնթարթային։ Տպաքանակը՝ անսահման։ Եթե ուզում ես վաճառել ծրագրի մեկ միլիարդ պատճեն, պետք չէ մեկ միլիարդ ծրագիր արտադրել։ Մեկ պատճենը կրկնօրինակվում է մեկ միլիարդ անգամ։\n\nՍա պարզապես տեխնոլոգիական տարբերություն չէ։ Դա հիմնարար տնտեսական տրամաբանության փոփոխություն է։ XX դարի ամբողջ տնտեսությունը կառուցված էր ատոմների տրամաբանության վրա՝ սակավություն, մասշտաբ, ստանդարտացում։ XXI դարի տնտեսությունը կառուցվում է բիթերի տրամաբանության վրա՝ առատություն, անհատականացում, ցանցային էֆեկտներ։\n\n> Արդյունաբերական տնտեսությունը գումար էր վաստակում նույնի մասշտաբից։ Տեղեկատվական տնտեսությունը գումար է վաստակում յուրաքանչյուր փոխազդեցության եզակիությունից։ Սրանք հակադիր տրամաբանություններ են։\n\nԵրբ հասկանում ես այս տարբերությունը, ժամանակակից աշխարհի շատ բաներ սկսում են բացատրվել։ Ինչո՞ւ է Google-ը անվճար։ Որովհետև որոնման արդյունքների պատճենումը ոչինչ չի արժենում, իսկ դրամայնացումը գալիս է գովազդից։ Ինչո՞ւ է Spotify-ը երաժիշտներին գրոշներ վճարում։ Որովհետև մեկ ստրիմի սահմանային արժեքը մոտենում է զրոյի։ Ինչո՞ւ են կրիպտոարժույթները ընդհանրապես հնարավոր։ Որովհետև թվային ակտիվները կարելի է փոխանցել առանց ֆիզիկական կրիչի։ Այս ամենը մեկ սկզբունքի հետևանքներ են, որը Նեգրոպոնտեն ձևակերպեց երեք բառով։", "tags": ["տնտեսություն", "բիթեր", "մասշտաբ"], "lensWeight": {"chronology": 4, "power": 4, "technology": 3, "media": 3, "privacy": 1}, "angDeg": 110.0, "sources": [{"title": "Կլոդ Շեննոն — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Վաննևար Բուշ — As We May Think (1945)", "url": ""}, {"title": "Դանիել Բել — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Էլվին Թոֆլեր — The Third Wave (1980)", "url": ""}, {"title": "Մարշալ Մաքլուհան — Understanding Media (1964)", "url": ""}, {"title": "Նիկոլաս Նեգրոպոնտե — Being Digital (1995)", "url": ""}, {"title": "Դուգլաս Ռաշկոֆ — Media Virus! (1994)", "url": ""}, {"title": "Սթյուարտ Բրենդ — Information Wants to Be Free (1984)", "url": ""}, {"title": "Էրիկ Հյուզ — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Մանուել Կաստելս — The Information Age (1996–1998)", "url": ""}], "era": "1995"}, {"id": "media-effects", "sceneIndex": 6, "x": 240.2, "y": 595.0, "type": "media", "title": "ՄաքԼուհենը և Ռաշքոֆի վիրուսները․ մեդիան փոխում է մեզ", "shortTitle": "Մեդիա", "insight": "ՄաքԼուհանն ու Ռաշքոֆը հասկացան, որ կարևորն ինֆորմացիան չէ, այլ այն միջավայրը, որով այն փոխանցվում է։ Մեդիան մեզ փոխում է բովանդակությունից անկախ՝ մի կառուցվածքի միջոցով, որը մենք չենք նկատում։", "body": "## Մեդիան ավելի կարևոր է, քան հաղորդագրությունը\n\nՄարշալ ՄաքԼուհանը անհարմար մտածող էր։ 1964 թվականին նա գրեց մի արտահայտություն, որը սկզբում անիմաստություն համարեցին, հետո՝ փոխաբերություն, և միայն ավելի ուշ հասկացան որպես իրականության ճշգրիտ տեխնիկական նկարագրություն․ «Մեդիան ինքն է հաղորդագրությունը»։\n\nԻ՞նչ էր նա նկատի ունենում։ Երբ 1950-ականներին զանգվածային հեռուստատեսությունը հայտնվեց, բոլորը վիճում էին բովանդակության շուրջ՝ լավ ծրագրե՞ր, թե՞ վատ, կրթակա՞ն, թե՞ ժամանցային, քարոզչությո՞ւն, թե՞ արվեստ։ ՄաքԼուհանն ասում էր՝ դա երկրորդական հարց է։ Հեռուստատեսությունն ինքը՝ որպես միջավայր, որպես տեխնոլոգիա, որպես ընկալման եղանակ, արդեն փոխել էր հասարակությունը՝ անկախ նրանից, թե ինչ էին հենց ցույց տալիս։\n\nՀեռուստացույցը պատմության մեջ առաջին անգամ համաժամեցրեց միլիոնավոր մարդկանց՝ նույն նորությունները, նույն պահին, նույն բառերով՝ երկրի բոլոր տներում միաժամանակ։ Այն ստեղծեց այն, ինչ ՄաքԼուհանն անվանեց «գլոբալ գյուղ»՝ մի աշխարհ, որտեղ բոլորը նույն իրադարձությունը միաժամանակ են ապրում։ Հեռուստատեսությունից առաջ տարբեր քաղաքների մարդիկ ապրում էին տարբեր տեղեկատվական իրականություններում։ Հետո՝ մեկում։\n\n## Ռաշքոֆի կենսաբանական փոխաբերությունը\n\n1994 թվականին ամերիկացի մեդիա տեսաբան Դուգլաս Ռաշքոֆը ՄաքԼուհանի գաղափարին ավելացրեց կենսաբանական փոխաբերություն, և այն նույնիսկ ավելի ճշգրիտ դուրս եկավ։ *Media Virus!* գրքում նա նկարագրեց այն մեխանիզմը, որը այսօր անվանում են վարակիչ բովանդակություն՝ YouTube-ից տասը տարի, TikTok-ից քսան տարի առաջ։\n\nԳաղափարները տարածվում են վիրուսների նման։ Ոչ թե որովհետև դրանք ճշմարիտ են։ Ոչ թե որովհետև դրանք օգտակար են։ Այլ որովհետև դրանք հարվածում են լսարանի հոգեբանական խոցելիությանը՝ այն բանին, ինչը մարդկանց ստիպում է դրանք փոխանցել առաջ՝ վախ, վրդովմունք, ոգևորություն, ճանաչում, զայրույթ, քնքշություն։ Զգացումը գաղափարի կրկնապատկման մեխանիզմն է։\n\nՌաշքոֆը ցույց տվեց, որ ուժեղ զգացում առաջացնող բովանդակությունը տարածվում է՝ անկախ իր ճշմարտացիությունից կամ օգտակարությունից։ Սենսացիոն լուրը ավելի արագ է տարածվում, քան ճշմարիտը։ Վախեցնող պատմությունը՝ ավելի արագ, քան ձանձրալիը։ Սա ոչ պատահականություն է, ոչ էլ մանիպուլյացիա՝ դա մեդիա միջավայրի կառուցվածքային առանձնահատկություն է։ Վիրուսը տանտիրոջը չի ընտրում «լավ մարդ է, թե վատ» չափանիշով։ Այն ընտրում է «խոցելի է, թե ոչ» չափանիշով։\n\nTikTok-ի ալգորիթմներից շատ առաջ, որոնք հենց դրա համար են օպտիմիզացված, Ռաշքոֆը նկարագրել էր այն սկզբունքը, որի վրա դրանք կառուցված են։ Ալգորիթմը վարակիչությունը չի ստեղծել։ Այն պարզապես սովորել է այն ուժեղացնել։\n\n> ՄաքԼուհանը զգուշացնում էր․ կարևոր է ոչ թե հաղորդումը, այլ հեռուստացույցը։ Ռաշքոֆը ճշտում էր․ կարևոր է ոչ թե գաղափարը, այլ այն զգացումը, որ այն առաջացնում է։ Միասին նրանք նկարագրեցին ժամանակակից սոցիալական ցանցերի ճարտարապետությունը՝ դրանց հայտնվելուց երեսուն տարի առաջ։\n\nԵրբ հայտնվեց ինտերնետը, առաջին հարցը կրկին բովանդակության մասին էր՝ ինչ էին մարդիկ այնտեղ կարդալու և դիտելու։ ՄաքԼուհանը կասեր՝ սխալ հարց է։ Ճիշտ հարցը սա է՝ ի՞նչ է անում մարդուն այն միջավայրը, որի ներսում նա օրեցօր ավելի ու ավելի շատ ժամանակ է անցկացնում։ Այդ հարցը դարձավ վճռորոշ, երբ հայտնվեցին սոցիալական ցանցերը։ Ցավոք, այն շատ ուշ տրվեց։", "tags": ["մեդիա", "վարքագիծ", "ընկալում"], "lensWeight": {"chronology": 3, "power": 3, "technology": 1, "media": 5, "privacy": 2}, "angDeg": 150.0, "sources": [{"title": "Կլոդ Շեննոն — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Վաննևար Բուշ — As We May Think (1945)", "url": ""}, {"title": "Դանիել Բել — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Էլվին Թոֆլեր — The Third Wave (1980)", "url": ""}, {"title": "Մարշալ Մաքլուհան — Understanding Media (1964)", "url": ""}, {"title": "Նիկոլաս Նեգրոպոնտե — Being Digital (1995)", "url": ""}, {"title": "Դուգլաս Ռաշկոֆ — Media Virus! (1994)", "url": ""}, {"title": "Սթյուարտ Բրենդ — Information Wants to Be Free (1984)", "url": ""}, {"title": "Էրիկ Հյուզ — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Մանուել Կաստելս — The Information Age (1996–1998)", "url": ""}], "era": "1964–1990-ական"}, {"id": "cypherpunks", "sceneIndex": 7, "x": 204.6, "y": 392.9, "type": "privacy", "title": "Հյուզը և շիֆրոպանկերը. գաղտնիությունը մաթեմատիկա է", "shortTitle": "Շիֆրոպանկեր", "insight": "1993 թվականին Հյուզը կանխատեսեց գաղտնիության ճգնաժամը և պահանջեց մաթեմատիկական պաշտպանություն․ նրա մանիֆեստը դարձավ Bitcoin-ի և ողջ Web3-ի գաղափարական հիմքը։", "body": "## Նախապես զգուշացրած ձայնը\n\n1993 թվականին, երբ մարդկանց մեծ մասը առաջին անգամ լսում էր «ինտերնետ» բառը, մաթեմատիկոս և կրիպտոգրաֆ Էրիկ Հյուզը երեք էջանոց մի փաստաթուղթ գրեց։ Այն կոչվում էր «A Cypherpunk's Manifesto» և հրապարակվել էր կրիպտոգրաֆիայով զբաղվող, հանրային ցանցի ի հայտ գալու հետևանքների մասին մտածող մարդկանց փոքր համայնքի փոստային ցուցակում։\n\nԱյդ ժամանակ ինտերնետը միայն նոր-նոր էր հասանելի դառնում սովորական մարդկանց։ Առաջին բրաուզերները նոր էին հայտնվել։ Ցանցում գաղտնիության մասին դեռ ոչ ոք չէր մտածում - մարդիկ պարզապես ուրախանում էին նոր հնարավորություններով․ կարելի էր նամակագրել մոլորակի մյուս ծայրի մարդկանց հետ։ Կարելի էր նորությունները կարդալ իրական ժամանակում։ Կարելի էր գտնել ցանկացած տեղեկատվություն։\n\nՀյուզը այլ կերպ էր մտածում։ Նրա փաստարկը պարզ ու պողպատե էր․ բաց ինտերնետը նշանակում է, որ ցանցում քո յուրաքանչյուր գործողությունը պոտենցիալ տեսանելի է բոլորին - մատակարարներին, պետություններին, կորպորացիաներին։ Սա պատահական խոցելիություն չէ։ Սա համակարգի ճարտարապետական հատկանիշ է, որը՝ դիտավորյալ, թե ոչ, ստեղծվել է հենց այսպես։ Եվ այդ պայմաններում գաղտնիությունը պաշտպանելու միակ ճանապարհը մատակարարներից ու պետություններից թույլտվություն խնդրելը չէ, այլ մաթեմատիկան օգտագործելը։ Կրիպտոգրաֆիան։ Այն մաթեմատիկան, որը ոչ մի օրենք չի կարող կոտրել։\n\n## Մի մարգարեություն, որ բառացիորեն իրականություն դարձավ\n\nՀյուզը 1993-ին գրել էր․ «Բաց հասարակությունում գաղտնիությունը պահանջում է անանուն գործարքային համակարգեր»։ Դա գիտաֆանտաստիկա էր թվում։ Ընթերցողների մեծ մասը ուսերն էր թոթվում․ «Ես թաքցնելու ոչինչ չունեմ»։ Սովորական մարդուն ինչու՞ էին պետք անանուն գործարքներ։\n\nԵրեսուն տարի անց մենք ապրում ենք մի աշխարհում, որտեղ կորպորացիաները օգտատերերի մասին ավելի շատ գիտեն, քան նրանց մտերիմները։ Որտեղ տվյալների արտահոսքերը դարձել են ամենօրյա լուրեր։ Որտեղ քարտով արված յուրաքանչյուր գնում, յուրաքանչյուր որոնման հարցում, միացված հեռախոսով կատարված յուրաքանչյուր տեղաշարժ գրանցվում ու պահվում է։ Հյուզը պարանոյիկ չէր։ Նա պարզապես մի քանի քայլ առաջ էր մտածում։\n\nՇիֆրոպանկերը՝ 1990-ականների սկզբին այս գաղափարի շուրջ համախմբված փոքր համայնքը, ի վերջո դարձան Bitcoin-ի գաղափարական հիմքը։ Սատոշի Նակամոտոն 2008 թվականին Bitcoin-ի նկարագրությունը հրապարակեց հենց շիֆրոպանկերի փոստային ցուցակում։ Դա Հյուզի հարցին ուղիղ պատասխան էր․ ահա ձեր անանուն գործարքային համակարգը, կառուցված ոչ թե միջնորդի հանդեպ վստահության, այլ մաթեմատիկայի վրա։\n\nՍտյուարտ Բրենդը դեռ 1984 թվականին արտաբերեց այն արտահայտությունը, որը դարձավ բաց ինտերնետի մանիֆեստը․ «Տեղեկատվությունը ցանկանում է ազատ լինել»։ Նա նկատի ուներ տեղեկատվության բնույթը․ պատճենահանվելիս այն չի նվազում, ուստի արհեստական խոչընդոտները հակասում են դրա բնույթին։ Հյուզը սա լրացրեց մյուս կողմից․ գաղտնիություն չունեցող տեղեկատվական ազատությունը ազատություն չէ, այլ թափանցիկություն այն մարդկանց համար, ովքեր դիտում են։\n\n> Բրենդն ասաց․ տեղեկատվությունը ցանկանում է ազատ լինել։ Հյուզը պատասխանեց․ իսկ գաղտնիությունը ցանկանում է պաշտպանված լինել մաթեմատիկայով։ Միասին նրանք նկարագրեցին թվային ազատության երկու բևեռները։\n\nԱյս երկու սկզբունքները՝ բացությունը և գաղտնիությունը, ինչ-որ իմաստով հակասում են միմյանց։ Եվ դրանց միջև եղած լարվածությունը մինչև այսօր որոշում է հիմնական վեճերը այն մասին, թե ինչպիսին պետք է լինի ինտերնետը։ Ինչպե՞ս գիտելիքը հասանելի դարձնել բոլորին՝ միաժամանակ պաշտպանելով յուրաքանչյուրի անձնական տվյալները։ Այս հարցը դեռ լուծված չէ։ Եվ հենց դա է փորձում լուծել Web3-ն.", "tags": ["կրիպտոգրաֆիա", "գաղտնիություն", "դիտարկում"], "lensWeight": {"chronology": 3, "power": 4, "technology": 4, "media": 2, "privacy": 5}, "angDeg": 190.0, "sources": [{"title": "Կլոդ Շեննոն — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Վաննևար Բուշ — As We May Think (1945)", "url": ""}, {"title": "Դանիել Բել — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Էլվին Թոֆլեր — The Third Wave (1980)", "url": ""}, {"title": "Մարշալ Մաքլուհան — Understanding Media (1964)", "url": ""}, {"title": "Նիկոլաս Նեգրոպոնտե — Being Digital (1995)", "url": ""}, {"title": "Դուգլաս Ռաշկոֆ — Media Virus! (1994)", "url": ""}, {"title": "Սթյուարտ Բրենդ — Information Wants to Be Free (1984)", "url": ""}, {"title": "Էրիկ Հյուզ — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Մանուել Կաստելս — The Information Age (1996–1998)", "url": ""}], "era": "1993"}, {"id": "castells", "sceneIndex": 8, "x": 307.2, "y": 215.2, "type": "power", "title": "Կաստելս. իշխանությունը տեղափոխվեց հոսքերի կողմը", "shortTitle": "Հոսքեր", "insight": "Կաստելսը ցույց տվեց, որ իշխանությունը տեղերի վերահսկողությունից տեղափոխվեց տվյալների և ուշադրության հոսքերի վերահսկողության կողմը, և դա այն դարձրեց անտեսանելի ու դժվար վիճարկելի։", "body": "## Աննկատ մնացած հեղափոխությունը\n\n1990-ականների կեսերին իսպանացի սոցիոլոգ Մանուել Կաստելսը դիտարկում էր մի փոխակերպում, որ տեղի էր ունենում բոլորի աչքի առաջ, և այդ մասին, ինչը մարդկանց մեծ մասը չէր նկատում, գրեց եռահատոր աշխատություն։ Տեղեկատվական հեղափոխությունն արդեն տեղի էր ունեցել։ Պարզապես մարդիկ այն սխալ տեղում էին փնտրում։\n\nՆրանք սպասում էին թռչող մեքենաների ու խոհանոցում աշխատող ռոբոտների։ Սպասում էին 1960-ականների գիտահանրամատչելի ամսագրերի խոստացած ֆանտաստիկ ապագային։ Բայց հեղափոխությունը տեղի էր ունենում բանկերի սերվերային սրահներում, գլոբալ կորպորացիաների լոգիստիկ կենտրոններում, մայրցամաքների միջև ֆինանսական հոսքերում։ 1990-ականներին փողն արդեն դադարել էր լինել ֆիզիկական. այն դարձել էր սերվերների միջև տվյալների հոսք։ Արտադրությունը դադարել էր լինել տեղական. այն դարձել էր մատակարարների գլոբալ ցանց, որտեղ դիզայնը արվում է Կալիֆոռնիայում, մասերը արտադրվում են Չինաստանում, հավաքումը կատարվում է Վիետնամում, իսկ վաճառքը՝ ամենուր։ Իշխանությունն այլևս տարածքով չէր չափվում։\n\n## Տեղերի տարածք ընդդեմ հոսքերի տարածքի\n\nԿաստելսը ներմուծեց մի տարբերություն, որը օգնում է հասկանալ ժամանակակից աշխարհը։ Հին իշխանությունը վերահսկում էր «տեղերի տարածքը»՝ գործարաններ, նավահանգիստներ, սահմաններ, տարածքներ։ Ֆիզիկական կետեր, որոնք կարելի է զբաղեցնել, պաշտպանել, պահել։ Նոր իշխանությունը վերահսկում է «հոսքերի տարածքը»՝ տվյալներ, կապիտալ, ուշադրություն, տեղեկատվություն։\n\nՍրանք իշխանության սկզբունքորեն տարբեր տեսակներ են։ Տարածքային իշխանությունը կարելի է տեսնել քարտեզի վրա՝ ահա սահմանը, ահա բանակը, ահա ամրոցը։ Հոսքերի վրա իշխանությունն անտեսանելի է։ Որտե՞ղ է գտնվում Google-ի իշխանությունը։ Ոչ մի տեղում և ամենուր միաժամանակ։ Որտե՞ղ է գտնվում Facebook-ի իշխանությունը։ Այն ալգորիթմում, որը որոշում է, թե ինչ են տեսնում միլիարդավոր մարդիկ։ Որտե՞ղ է գտնվում Bitcoin-ի իշխանությունը։ Տարածված ցանցում, որը ֆիզիկական տեղակայություն չունի։\n\nԿաստելսը ցույց տվեց. ով վերահսկում է հոսքերը, նա էլ վերահսկում է աշխարհը։ Եվ այդ դիտարկումը սարսափեցնող ճշգրիտ դուրս եկավ։ Հինգ-վեց տեխնոլոգիական ընկերություն վերահսկում են մոլորակի տեղեկատվական հոսքերի մեծ մասը։ Նրանք տարածքներ չունեն։ Նրանք տիրապետում են ալգորիթմների, որոնք որոշում են, թե մարդիկ ինչ են տեսնում, կարդում, գնում և ինչին են հավատում։\n\nԴանիել Բելը դեռ 1973 թվականին կանխատեսել էր հետինդուստրիալ հասարակության անցումը, որտեղ գլխավոր ռեսուրսը տեղեկատվությունն է, իսկ գլխավոր ինստիտուտները ոչ թե գործարաններն են, այլ համալսարաններն ու հետազոտական լաբորատորիաները։ 1990-ականներին Կաստելսը տեսավ, որ դա արդեն տեղի է ունեցել, բայց տեղեկատվության վրա իշխանությունը կենտրոնացել էր համալսարաններից բոլորովին այլ տեղում։\n\n> Հին իշխանությունը վերահսկում էր տեղերը։ Նոր իշխանությունը վերահսկում է հոսքերը։ Իսկ հոսքերը շատ ավելի դժվար է վիճարկել, քան տարածքը։\n\nՍա է ամբողջ դասընթացով անցնող հիմնարար հարցը. ինչպե՞ս է կառուցված իշխանությունը մի աշխարհում, որտեղ տեղեկատվությունն է գլխավոր ռեսուրսը։ Ո՞վ է այն վերահսկում։ Ինչպե՞ս է այն կենտրոնանում։ Եվ ի՞նչ է տեղի ունենում, երբ մի քանի կորպորացիաներ գրավում են մոլորակի տեղեկատվական հոսքերի մեծ մասի վերահսկողությունը։ Հաջորդ գլուխները հենց դրա մասին են.", "tags": ["հոսքեր", "հասարակություն", "իշխանություն"], "lensWeight": {"chronology": 4, "power": 5, "technology": 2, "media": 4, "privacy": 3}, "angDeg": 230.0, "sources": [{"title": "Կլոդ Շեննոն — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Վաննևար Բուշ — As We May Think (1945)", "url": ""}, {"title": "Դանիել Բել — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Էլվին Թոֆլեր — The Third Wave (1980)", "url": ""}, {"title": "Մարշալ Մաքլուհան — Understanding Media (1964)", "url": ""}, {"title": "Նիկոլաս Նեգրոպոնտե — Being Digital (1995)", "url": ""}, {"title": "Դուգլաս Ռաշկոֆ — Media Virus! (1994)", "url": ""}, {"title": "Սթյուարտ Բրենդ — Information Wants to Be Free (1984)", "url": ""}, {"title": "Էրիկ Հյուզ — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Մանուել Կաստելս — The Information Age (1996–1998)", "url": ""}], "era": "1996"}], "edges": [{"from": "scarcity", "to": "shannon", "label": "սակավությունից չափմանը", "lenses": ["chronology", "technology"]}, {"from": "shannon", "to": "arpanet", "label": "ազդանշանը դառնում է ցանց", "lenses": ["chronology", "technology"]}, {"from": "memex", "to": "open-web", "label": "հիպերտեքստը դառնում է Web", "lenses": ["chronology", "media", "technology"]}, {"from": "arpanet", "to": "open-web", "label": "կայունություն և բացություն", "lenses": ["chronology", "power", "technology"]}, {"fro   <section class="control-rail">
    <div><p class="eyebrow">Luminara · Հիմունքներ</p><h1 id="app-title">Մինչ ինտերնետը</h1></div>
    <p class="chapter-lede">Ինչպես է տեղեկատվությունը դառնում իշխանություն՝ պակասից ու ազդանշաններից մինչև ցանցային հասարակություն։</p>
    <div class="rail-rule"></div>
    <div><p class="section-h">Մեկնաբանման ոսպնյակներ</p><div class="lens-group" style="margin-top:9px"></div><p class="lens-desc" style="margin-top:9px"></p></div>
    <div class="rail-rule"></div>
    <div class="progress-box"></div>
    <div><p class="section-h">Գլխի տեսարաններ</p><nav class="node-list" style="margin-top:6px"></nav></div>
  </section>
  <section class="map-stage">
    <svg class="system-map" viewBox="0 0 1000 890" role="img" preserveAspectRatio="xMidYMid meet"><title id="map-title">Մինչ ինտերնետը</title><desc id="map-desc">Տեղեկատվությունը դառնում է իշխանություն</desc></svg>
    <div class="empty-state" hidden></div>
  </section>
  <aside class="detail-panel"></aside>
</main>
<dialog class="scene-dialog"></dialog>
<script>
const state={lens:"chronology",selected:null,visited:new Set(),entered:false};
const byId=id=>CHAPTER_DATA.nodes.find(n=>n.id===id);
const SVGNS="http://www.w3.org/2000/svg";
const el=(t,a)=>{const e=document.createElementNS(SVGNS,t);for(const k in(a||{}))e.setAttribute(k,a[k]);return e;};
function typeColor(t){return{power:"#c0392b",technology:"#1f7a5a",media:"#b7791f",privacy:"#6b4fa0",economy:"#a04a7a"}[t]||"#b7791f";}
function typeLabel(t){const u=CHAPTER_DATA.ui;return{power:u.typePower,technology:u.typeTechnology,media:u.typeMedia,privacy:u.typePrivacy,economy:u.typeEconomy}[t]||"";}
function lensById(id){return CHAPTER_DATA.lenses.find(l=>l.id===id);}
function edgeActive(e){return e.lenses.includes(state.lens);}
function nodeWeight(n){return(n.lensWeight&&n.lensWeight[state.lens])||0;}
const CX=CHAPTER_DATA.chapter.centerX||500, CY=CHAPTER_DATA.chapter.centerY||445, RING=CHAPTER_DATA.chapter.ring||300;

function buildLenses(){
  const w=document.querySelector(".lens-group");w.innerHTML="";
  CHAPTER_DATA.lenses.forEach(l=>{const b=document.createElement("button");b.className="lens-btn";b.type="button";
    b.setAttribute("aria-pressed",String(l.id===state.lens));b.style.setProperty("--dot",l.accent);
    b.innerHTML=`<span class="lens-dot"></span>${l.label}`;b.addEventListener("click",()=>setLens(l.id));w.appendChild(b);});
}
function setLens(id){state.lens=id;const l=lensById(id);
  const d=document.querySelector(".lens-desc");if(d)d.textContent=l?l.description:"";
  document.querySelectorAll(".lens-btn").forEach((b,i)=>b.setAttribute("aria-pressed",String(CHAPTER_DATA.lenses[i].id===id)));
  renderAll();}

function curve(a,b){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;const dx=mx-CX,dy=my-CY,len=Math.hypot(dx,dy)||1;const bow=26;
  return `M ${a.x} ${a.y} Q ${mx+(dx/len)*bow} ${my+(dy/len)*bow} ${b.x} ${b.y}`;}

function defs(){
  const d=el("defs");
  const mk=(id,color)=>{const m=el("marker",{id,viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"});
    const p=el("path",{d:"M0 0 L10 5 L0 10 z",fill:color});m.appendChild(p);return m;};
  d.appendChild(mk("arrow-active", lensById(state.lens)?lensById(state.lens).accent:"#b7791f"));
  return d;
}

function renderMap(){
  const svg=document.querySelector(".system-map");if(!svg)return;
  [...svg.querySelectorAll("defs,g,.ring,.ring-tick,.era-label,.spoke")].forEach(n=>n.remove());
  svg.appendChild(defs());
  // rings
  const gDeco=el("g",{});
  [RING*0.55,RING].forEach(r=>gDeco.appendChild(el("circle",{class:"ring",cx:CX,cy:CY,r})));
  svg.appendChild(gDeco);
  // spokes + chronology era labels around outer ring
  const gSpoke=el("g",{});
  CHAPTER_DATA.nodes.forEach(n=>{
    gSpoke.appendChild(el("line",{class:"spoke",x1:CX,y1:CY,x2:n.x,y2:n.y}));
  });
  svg.appendChild(gSpoke);

  // edges (with directional arrows on active)
  const gE=el("g",{});
  CHAPTER_DATA.edges.forEach(e=>{const a=byId(e.from),b=byId(e.to);if(!a||!b)return;
    const active=edgeActive(e);const g=el("g",{class:"edge"+(active?" active":"")});
    if(active)g.style.setProperty("--dot",lensById(state.lens).accent);
    const d=curve(a,b);const p=el("path",{d});
    // approximate length for draw animation
    const len=Math.round(Math.hypot(b.x-a.x,b.y-a.y)*1.15);
    p.style.setProperty("--len",len);
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const lb=el("text",{class:"edge-label",x:mx,y:my-5,"text-anchor":"middle"});lb.textContent=e.label;
    g.appendChild(p);g.appendChild(lb);gE.appendChild(g);});
  svg.appendChild(gE);

  // center (breathing, lens-tinted ring)
  const gC=el("g",{});
  gC.style.setProperty("--dot", lensById(state.lens)?lensById(state.lens).accent:"#b7791f");
  gC.appendChild(el("circle",{class:"center-halo",cx:CX,cy:CY,r:78}));
  gC.appendChild(el("circle",{class:"center-ring",cx:CX,cy:CY,r:72}));
  gC.appendChild(el("circle",{class:"center-disc",cx:CX,cy:CY,r:66}));
  const t2=el("text",{class:"center-t2",x:CX,y:CY-20});t2.textContent=CHAPTER_DATA.ui.centerLabel;gC.appendChild(t2);
  wrapText(gC,CHAPTER_DATA.chapter.centralIdea,CX,CY+2,120,"center-t1",17);
  svg.appendChild(gC);

  // nodes with smart outward labels + era
  const gN=el("g",{});
  CHAPTER_DATA.nodes.forEach((n,i)=>{
    const g=el("g",{class:"node"+(state.selected===n.id?" selected":""),tabindex:"0",role:"button","aria-label":`${n.sceneIndex+1}. ${n.title} (${n.era||""})`});
    g.style.setProperty("--dot",typeColor(n.type));
    g.style.setProperty("--ox",n.x+"px");g.style.setProperty("--oy",n.y+"px");
    if(!state.entered) g.style.setProperty("--delay",(0.15+i*0.06)+"s"); else g.style.animation="none",g.style.opacity="1";
    if(state.selected){const linked=CHAPTER_DATA.edges.some(e=>(e.from===state.selected&&e.to===n.id)||(e.to===state.selected&&e.from===n.id));
      if(n.id!==state.selected&&!linked)g.classList.add("dim");}
    else if(nodeWeight(n)<=1){g.classList.add("dim");}
    g.appendChild(el("circle",{class:"halo",cx:n.x,cy:n.y,r:34}));
    g.appendChild(el("circle",{class:"disc",cx:n.x,cy:n.y,r:26}));
    const num=el("text",{class:"num",x:n.x,y:n.y});num.textContent=String(n.sceneIndex+1);g.appendChild(num);

    // smart label placement: outward along the radius from center
    const dx=n.x-CX,dy=n.y-CY,len=Math.hypot(dx,dy)||1;
    const ux=dx/len,uy=dy/len;
    const lx=n.x+ux*40, ly=n.y+uy*40;
    // anchor by horizontal side
    const anchor = ux>0.25?"start":(ux<-0.25?"end":"middle");
    const era=el("text",{class:"era",x:lx,y:ly-13,"text-anchor":anchor});era.textContent=n.era||"";g.appendChild(era);
    const kick=el("text",{class:"kicker",x:lx,y:ly-1,"text-anchor":anchor});kick.textContent=typeLabel(n.type);g.appendChild(kick);
    wrapTextAnchored(g,n.shortTitle,lx,ly+13,150,"cap",13,anchor);

    g.addEventListener("click",()=>selectNode(n.id));
    g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();selectNode(n.id);}});
    gN.appendChild(g);
  });
  svg.appendChild(gN);
  state.entered=true;
}
function wrapText(parent,text,x,y,maxw,cls,fs){wrapTextAnchored(parent,text,x,y,maxw,cls,fs,"middle");}
function wrapTextAnchored(parent,text,x,y,maxw,cls,fs,anchor){
  const words=String(text).split(/\s+/);const lines=[];let line="";
  const approx=s=>s.length*(fs*0.56);
  words.forEach(w=>{const t=line?line+" "+w:w;if(approx(t)>maxw&&line){lines.push(line);line=w;}else line=t;});
  if(line)lines.push(line);const total=(lines.length-1)*(fs+2);
  lines.forEach((ln,i)=>{const t=el("text",{class:cls,x,y:y-total/2+i*(fs+2),"text-anchor":anchor});t.textContent=ln;parent.appendChild(t);});
}

function renderNodeList(){const nav=document.querySelector(".node-list");if(!nav)return;nav.innerHTML="";
  CHAPTER_DATA.nodes.slice().sort((a,b)=>a.sceneIndex-b.sceneIndex).forEach(n=>{
    const b=document.createElement("button");b.type="button";b.setAttribute("aria-current",String(state.selected===n.id));b.style.setProperty("--dot",typeColor(n.type));
    b.innerHTML=`<span class="node-idx">${String(n.sceneIndex+1).padStart(2,"0")}</span><span>${n.shortTitle}</span>`;
    b.addEventListener("click",()=>selectNode(n.id));nav.appendChild(b);});}
function renderProgress(){const box=document.querySelector(".progress-box");if(!box)return;
  const total=CHAPTER_DATA.nodes.length,seen=state.visited.size;
  box.innerHTML=`${CHAPTER_DATA.ui.progress} ${seen} ${CHAPTER_DATA.ui.progressOf} ${total}<div class="progress-bar"><div class="progress-fill" style="width:${Math.round(seen/total*100)}%"></div></div>`;}
function firstSentence(txt){return String(txt).replace(/^##[^\n]*\n+/,"").split(/(?<=[.!?])\s/)[0]||"";}
function renderDetail(){const p=document.querySelector(".detail-panel");if(!p)return;
  if(!state.selected){p.innerHTML=`<p class="eyebrow">${CHAPTER_DATA.ui.detailLabel}</p><p class="detail-empty">${CHAPTER_DATA.ui.detailEmpty}</p>`;return;}
  const n=byId(state.selected);const c=typeColor(n.type);
  const related=CHAPTER_DATA.edges.filter(e=>e.from===n.id||e.to===n.id).map(e=>({node:byId(e.from===n.id?e.to:e.from),label:e.label})).filter(x=>x.node);
  const srcs=(n.sources||[]).slice(0,10);
  p.innerHTML=`<p class="detail-kicker" style="--dot:${c}">${CHAPTER_DATA.ui.scene} ${n.sceneIndex+1} · ${typeLabel(n.type)}${n.era?" · "+n.era:""}</p>
    <h3 class="detail-title">${n.title}</h3>
    <p class="detail-thesis">${firstSentence(n.body)}</p>
    <p class="detail-insight" style="--dot:${c}">${n.insight}</p>
    <div class="chips">${(n.tags||[]).map(t=>`<span class="chip">${t}</span>`).join("")}</div>
    <div class="related"><h4>${CHAPTER_DATA.ui.related}</h4><div class="related-list">
      ${related.map(r=>`<button type="button" data-go="${r.node.id}">${r.node.shortTitle} · <span style="color:var(--muted)">${r.label}</span></button>`).join("")}</div></div>
    ${srcs.length?`<div class="sources-block"><h4>${CHAPTER_DATA.ui.sources} (${srcs.length})</h4><ol>${srcs.map(s=>`<li>${s.url?`<a href="${s.url}" target="_blank" rel="noreferrer">${s.title}</a>`:s.title}</li>`).join("")}</ol></div>`:""}
    <div class="panel-actions"><button class="btn primary" type="button" data-full="${n.id}">${CHAPTER_DATA.ui.readScene}</button>
      ${n.id==="arpanet"?'<button class="btn" type="button" data-arpa="1">${CHAPTER_DATA.ui.arpaDemo}</button>':""}</div>`;
  p.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>selectNode(b.getAttribute("data-go"))));
  p.querySelector("[data-full]").addEventListener("click",()=>renderFullScene(n.id));
  const ad=p.querySelector("[data-arpa]");if(ad)ad.addEventListener("click",()=>renderFullScene("arpanet",true));}
function selectNode(id){state.selected=id;state.visited.add(id);renderAll();}

function mdToHtml(md){return String(md).split(/\n{2,}/).map(b=>{b=b.trim();if(!b)return"";
  if(b.startsWith("## "))return`<h2>${b.slice(3)}</h2>`;return`<p>${b.replace(/\*([^*]+)\*/g,"<em>$1</em>")}</p>`;}).join("");}
function renderFullScene(id,openArpa){const n=byId(id);if(!n)return;const dlg=document.querySelector(".scene-dialog");const isArpa=n.id==="arpanet";const c=typeColor(n.type);const srcs=(n.sources||[]);
  dlg.innerHTML=`<div class="dialog-inner"><button class="dialog-close" aria-label="${CHAPTER_DATA.ui.close}" type="button">×</button>
    <p class="detail-kicker" style="--dot:${c}">${CHAPTER_DATA.ui.scene} ${n.sceneIndex+1} · ${typeLabel(n.type)}${n.era?" · "+n.era:""}</p>
    <h3>${n.title}</h3><div class="dialog-body">${mdToHtml(n.body)}</div>
    <p class="detail-insight" style="--dot:${c}">${n.insight}</p>${isArpa?arpaMarkup():""}
    ${srcs.length?`<div class="sources-block"><h4>${CHAPTER_DATA.ui.sources}</h4><ol>${srcs.map(s=>`<li>${s.url?`<a href="${s.url}" target="_blank" rel="noreferrer">${s.title}</a>`:s.title}</li>`).join("")}</ol></div>`:""}
    <div class="panel-actions"><a class="btn" href="${CHAPTER_DATA.chapter.sourceUrl}" target="_blank" rel="noreferrer">${CHAPTER_DATA.ui.openInLuminara}</a>
      <button class="btn primary" type="button" data-close>${CHAPTER_DATA.ui.close}</button></div></div>`;
  const close=()=>dlg.close();dlg.querySelector(".dialog-close").addEventListener("click",close);dlg.querySelector("[data-close]").addEventListener("click",close);
  if(typeof dlg.showModal==="function")dlg.showModal();else dlg.setAttribute("open","");
  if(isArpa){wireArpanet(dlg);if(openArpa)setTimeout(()=>runArpanetPacketDemo(dlg),300);}}
function arpaMarkup(){return `<div class="arpa-wrap"><h4>${CHAPTER_DATA.ui.arpaTitle}</h4>
  <svg class="arpa-svg arpa-net" viewBox="0 0 460 160" role="img" aria-label="${CHAPTER_DATA.ui.arpaAria}"></svg>
  <p class="arpa-note">${CHAPTER_DATA.ui.arpaNote}</p>
  <div class="panel-actions"><button class="btn primary" type="button" data-send>${CHAPTER_DATA.ui.arpaSend}</button>
    <button class="btn" type="button" data-fail>${CHAPTER_DATA.ui.arpaFail}</button><button class="btn" type="button" data-reset>${CHAPTER_DATA.ui.arpaReset}</button></div></div>`;}
const ARPA={hosts:{A:{x:40,y:80,label:"A"},B:{x:170,y:38,label:"B"},C:{x:170,y:122,label:"C"},D:{x:300,y:80,label:"D"},E:{x:420,y:80,label:"E"}},
  links:[["A","B"],["A","C"],["B","D"],["C","D"],["D","E"]],down:new Set(),
  route(){const P=[["A","B","D","E"],["A","C","D","E"]];for(const p of P)if(p.every(h=>!this.down.has(h)))return p;return null;}};
function drawArpa(svg){svg.innerHTML="";const mk=(t,a)=>{const e=document.createElementNS(SVGNS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  ARPA.links.forEach(([f,t])=>{const A=ARPA.hosts[f],B=ARPA.hosts[t];svg.appendChild(mk("line",{x1:A.x,y1:A.y,x2:B.x,y2:B.y}));});
  Object.entries(ARPA.hosts).forEach(([id,h])=>{svg.appendChild(mk("circle",{cx:h.x,cy:h.y,r:16,class:ARPA.down.has(id)?"down":"host"}));const t=mk("text",{x:h.x,y:h.y+4});t.textContent=h.label;svg.appendChild(t);});}
function wireArpanet(dlg){const svg=dlg.querySelector(".arpa-net");ARPA.down=new Set();drawArpa(svg);
  dlg.querySelector("[data-send]").addEventListener("click",()=>runArpanetPacketDemo(dlg));
  dlg.querySelector("[data-fail]").addEventListener("click",()=>{ARPA.down.add("B");drawArpa(svg);dlg.querySelector(".arpa-note").textContent=(CHAPTER_DATA.ui.arpaFailNote||"Node B down; routes via C.");});
  dlg.querySelector("[data-reset]").addEventListener("click",()=>{ARPA.down=new Set();drawArpa(svg);dlg.querySelector(".arpa-note").textContent=(CHAPTER_DATA.ui.arpaResetNote||"Network restored.");});}
function runArpanetPacketDemo(dlg){dlg=dlg||document.querySelector(".scene-dialog");const svg=dlg.querySelector(".arpa-net");if(!svg)return;drawArpa(svg);
  const path=ARPA.route();const note=dlg.querySelector(".arpa-note");if(!path){if(note)note.textContent=CHAPTER_DATA.ui.arpaNoRoute;return;}
  for(let i=0;i<path.length-1;i++){const A=ARPA.hosts[path[i]],B=ARPA.hosts[path[i+1]];
    [...svg.querySelectorAll("line")].forEach(ln=>{const s=(+ln.getAttribute("x1")===A.x&&+ln.getAttribute("y1")===A.y&&+ln.getAttribute("x2")===B.x&&+ln.getAttribute("y2")===B.y)||(+ln.getAttribute("x1")===B.x&&+ln.getAttribute("y1")===B.y&&+ln.getAttribute("x2")===A.x&&+ln.getAttribute("y2")===A.y);if(s)ln.classList.add("path-active");});}
  if(note)note.textContent=CHAPTER_DATA.ui.arpaRouting+": "+path.join(" → ");
  const pkt=document.createElementNS(SVGNS,"circle");pkt.setAttribute("r","5");pkt.setAttribute("class","packet");svg.appendChild(pkt);
  let seg=0,t=0;function step(){if(seg>=path.length-1){pkt.remove();if(note)note.textContent+="  ✓ "+CHAPTER_DATA.ui.arpaDelivered;return;}
    const A=ARPA.hosts[path[seg]],B=ARPA.hosts[path[seg+1]];t+=0.04;pkt.setAttribute("cx",A.x+(B.x-A.x)*t);pkt.setAttribute("cy",A.y+(B.y-A.y)*t);if(t>=1){t=0;seg++;}requestAnimationFrame(step);}
  requestAnimationFrame(step);}
function renderAll(){renderMap();renderNodeList();renderDetail();renderProgress();}
async function boot(){buildLenses();setLens(state.lens);}
document.addEventListener("DOMContentLoaded",()=>{try{boot();}catch(e){renderEmptyState(CHAPTER_DATA.ui.initError+": "+e.message);}});
</script>
</body></html>
