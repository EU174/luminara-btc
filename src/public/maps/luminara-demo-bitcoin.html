<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренажёр безопасности Bitcoin-кошелька · Luminara</title>
<style>
:root{
  --bg:oklch(11% .026 285);--surface:oklch(15% .032 285);--surface-2:oklch(18% .041 285);
  --line:oklch(29% .04 285);--line-strong:oklch(43% .06 285);--text:oklch(96% .007 285);
  --mid:oklch(80% .014 285);--muted:oklch(62% .029 285);--accent:oklch(72% .261 295);
  --good:oklch(78% .17 155);--warn:oklch(80% .17 82);--bad:oklch(68% .2 20);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
[data-theme="light"]{
  --bg:oklch(98% .006 285);--surface:oklch(96% .009 285);--surface-2:oklch(92% .014 285);
  --line:oklch(82% .017 285);--line-strong:oklch(68% .03 285);--text:oklch(22% .043 285);
  --mid:oklch(40% .036 285);--muted:oklch(55% .041 285);--accent:oklch(55% .319 295);
  --good:oklch(48% .16 155);--warn:oklch(54% .16 82);--bad:oklch(49% .2 20);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px;background:var(--bg);color:var(--text);font-family:var(--sans);}
button{font:inherit}
.trainer{width:min(820px,100%);margin:0 auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.head{padding:20px 22px 16px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.head-top{display:flex;align-items:center;justify-content:space-between;gap:14px}
.head-controls{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.eyebrow{font-size:11px;line-height:1.2;letter-spacing:.11em;text-transform:uppercase;color:var(--accent);font-weight:600}
.theme-toggle{display:grid;place-items:center;width:30px;height:30px;padding:0;border:1px solid var(--line-strong);border-radius:50%;background:transparent;color:var(--text);font-size:16px;line-height:1;cursor:pointer}
.theme-toggle:hover{border-color:var(--accent);color:var(--accent);background:color-mix(in oklch,var(--accent) 8%,transparent)}
.palette-switch{display:flex;align-items:center;gap:4px}
.palette-swatch{width:17px;height:17px;padding:0;border:2px solid transparent;border-radius:50%;cursor:pointer;transition:transform .14s,border-color .14s;box-shadow:0 0 0 1px color-mix(in oklch,var(--bg) 65%,transparent)}
.palette-swatch:hover{transform:scale(1.14)}
.palette-swatch.active{border-color:var(--text)}
.palette-swatch[data-palette="violet"]{background:oklch(72% .26 295)}
.palette-swatch[data-palette="cobalt"]{background:oklch(72% .26 250)}
.palette-swatch[data-palette="ember"]{background:oklch(78% .23 60)}
.palette-swatch[data-palette="forest"]{background:oklch(76% .23 165)}
.palette-swatch[data-palette="crimson"]{background:oklch(68% .27 15)}
.title-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font:500 24px/1.2 var(--serif);margin:0;letter-spacing:0}
.counter{font-size:12px;color:var(--muted);white-space:nowrap}
.notice{margin:0;color:var(--mid);font:400 14px/1.45 var(--serif)}
.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.progress-item{min-width:0;display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}
.progress-index{display:grid;place-items:center;width:20px;height:20px;flex:0 0 20px;border:1px solid var(--line-strong);border-radius:50%;font-size:11px}
.progress-item.active{color:var(--text)}
.progress-item.active .progress-index{border-color:var(--accent);color:var(--accent)}
.progress-item.done{color:var(--good)}
.progress-item.done .progress-index{border-color:var(--good);background:color-mix(in oklch,var(--good) 12%,transparent)}
.stage{padding:22px;min-height:426px;display:flex;flex-direction:column}
.stage-kicker{font-size:12px;color:var(--accent);margin-bottom:8px}
h2{margin:0;font:500 22px/1.2 var(--serif);letter-spacing:0}
.prompt{margin:10px 0 18px;max-width:68ch;color:var(--mid);font:400 16px/1.48 var(--serif)}
.choice-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice,.order-choice{min-height:58px;text-align:left;padding:12px 14px;border:1px solid var(--line-strong);border-radius:7px;background:transparent;color:var(--text);cursor:pointer;transition:border-color .14s,background .14s,transform .14s}
.choice:hover,.order-choice:hover{border-color:var(--accent);background:color-mix(in oklch,var(--accent) 7%,transparent)}
.choice:focus-visible,.order-choice:focus-visible,.next:focus-visible,.restart:focus-visible,.theme-toggle:focus-visible,.palette-swatch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.choice[data-state="bad"],.order-choice[data-state="bad"]{border-color:var(--bad);background:color-mix(in oklch,var(--bad) 10%,transparent)}
.choice[data-state="good"],.order-choice[data-state="good"]{border-color:var(--good);background:color-mix(in oklch,var(--good) 10%,transparent)}
.choice:disabled,.order-choice:disabled{cursor:default;opacity:.8}
.feedback{min-height:48px;margin:16px 0 0;padding:11px 13px;border-left:3px solid var(--line-strong);background:var(--surface-2);color:var(--mid);font-size:14px;line-height:1.42}
.feedback.good{border-left-color:var(--good);color:var(--text)}
.feedback.bad{border-left-color:var(--bad);color:var(--text)}
.next,.restart{align-self:flex-start;margin-top:14px;padding:9px 14px;border:1px solid var(--accent);border-radius:7px;background:var(--accent);color:var(--bg);font-weight:600;cursor:pointer}
[data-theme="light"] .next,[data-theme="light"] .restart{color:white}
.address-compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:-2px 0 16px}
.address-box{padding:11px 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2)}
.address-label{display:block;margin-bottom:7px;color:var(--muted);font-size:11px;letter-spacing:.07em;text-transform:uppercase}
code{display:block;color:var(--text);font:500 12px/1.5 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;overflow-wrap:anywhere}
.address-diff{color:var(--warn);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.address-note{margin:-7px 0 16px;color:var(--muted);font-size:12px}
.order-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px}
.order-path{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.order-path li{min-height:45px;display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:7px;color:var(--muted);font-size:13px}
.order-path li.filled{border-color:color-mix(in oklch,var(--good) 70%,var(--line));color:var(--text);background:color-mix(in oklch,var(--good) 8%,transparent)}
.order-no{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1px solid currentColor;font-size:10px;flex:0 0 20px}
.order-bank{display:grid;gap:7px}
.order-choice{min-height:45px;font-size:13px}
.result{display:grid;gap:14px;align-content:start;max-width:600px}
.result-mark{display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--good);border-radius:50%;color:var(--good);font-size:22px}
.result p{margin:0;color:var(--mid);font:400 16px/1.48 var(--serif)}
.result-list{margin:0;padding-left:19px;color:var(--mid);font-size:14px;line-height:1.6}
@media (max-width:620px){
  body{padding:12px}.head,.stage{padding:17px}.progress{padding:12px 17px;grid-template-columns:1fr 1fr}.progress-item{font-size:11px}.choice-list,.address-compare,.order-layout{grid-template-columns:1fr}.stage{min-height:500px}h1{font-size:22px}.head-top{align-items:flex-start}
}
</style>
</head>

    <div class="head-top">
      <div class="eyebrow" data-s="eyebrow">Live демо · Bitcoin</div>
      <div class="head-controls">
        <div class="palette-switch" role="group" data-palette-switch>
          <button class="palette-swatch" type="button" data-palette="violet"></button>
          <button class="palette-swatch" type="button" data-palette="cobalt"></button>
          <button class="palette-swatch" type="button" data-palette="ember"></button>
          <button class="palette-swatch" type="button" data-palette="forest"></button>
          <button class="palette-swatch" type="button" data-palette="crimson"></button>
        </div>
        <button class="theme-toggle" type="button" data-theme-toggle></button>
      </div>
    </div>
    <div class="title-row">
      <h1 id="demo-title" data-s="title">Тренажёр безопасности Bitcoin-кошелька</h1>

    </div>

</main>

function fill(str,vars){return String(str||"").replace(/\{(\w+)\}/g,function(_,k){return vars&&vars[k]!=null?vars[k]:"";});}
function words(key){return dict()[key]||I18N.en[key]||"";}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,function(ch){return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[ch];});}
function uiLabels(){return CONTROL_LABELS[window.__LANG]||CONTROL_LABELS.en;}
function currentTheme(){return document.documentElement.getAttribute("data-theme")==="light"?"light":"dark";}
function renderControls(){
  var labels=uiLabels(),theme=currentTheme();
  paletteSwitch.setAttribute("aria-label",labels.palette);
  paletteSwitch.querySelectorAll("[data-palette]").forEach(function(button){
    var palette=button.getAttribute("data-palette"),label=labels[palette];
    button.classList.toggle("active",activePalette===palette);
    button.setAttribute("aria-label",label);
    button.setAttribute("title",label);
    button.setAttribute("aria-pressed",activePalette===palette?"true":"false");
  });
  themeToggle.textContent=theme==="dark"?"☼":"◐";
  themeToggle.setAttribute("aria-label",theme==="dark"?labels.light:labels.dark);
  themeToggle.setAttribute("title",theme==="dark"?labels.light:labels.dark);
  themeToggle.setAttribute("aria-pressed",theme==="dark"?"true":"false");
}
function setTheme(theme){
  if(theme!=="light"&&theme!=="dark")return;
  document.documentElement.setAttribute("data-theme",theme);
  if(activePalette)document.documentElement.style.setProperty("--accent",PALETTES[activePalette][theme]);
  renderControls();
}
function setPalette(palette){
  if(!PALETTES[palette])return;
  activePalette=palette;
  document.documentElement.style.setProperty("--accent",PALETTES[palette][currentTheme()]);
  renderControls();
}
function shuffle(items){
  var shuffled=items.slice();
  for(var index=shuffled.length-1;index>0;index-=1){
    var nextIndex=Math.floor(Math.random()*(index+1)),value=shuffled[index];
    shuffled[index]=shuffled[nextIndex];shuffled[nextIndex]=value;
  }
  return shuffled;
}
function scatterOrderItems(){
  var all=dict().order.items.map(function(item){return item[0];});
  for(var attempt=0;attempt<32;attempt+=1){
    var candidate=shuffle(all),safePositions=orderExpected.map(function(id){return candidate.indexOf(id);}).sort(function(a,b){return a-b;});
    var allSafeTogether=safePositions.every(function(position,index){return index===0||position===safePositions[index-1]+1;});
    if(!allSafeTogether)return candidate;
  }
  return shuffle(all);
}
function startRound(){
  current=0;protectedChoices=0;orderPicked=[];
  choiceOrders={
    backup:shuffle(dict().backup.choices.map(function(choice){return choice[0];})),
    address:shuffle(dict().address.choices.map(function(choice){return choice[0];})),
    message:shuffle(dict().message.choices.map(function(choice){return choice[0];}))
  };
  orderBankOrder=scatterOrderItems();
}
function orderedChoices(key,item){
  return (choiceOrders[key]||item.choices.map(function(choice){return choice[0];})).map(function(id){
    return item.choices.find(function(choice){return choice[0]===id;});
  });
}
function setStatic(){
  document.querySelectorAll("[data-s]").forEach(function(el){var value=words(el.getAttribute("data-s"));if(value)el.textContent=value;});
  document.title=words("title")+" · Luminara";
  renderControls();
}
function renderProgress(){
  var labels=[dict().backup.title,dict().address.title,dict().message.title,dict().order.title];
  progress.innerHTML=labels.map(function(label,index){
    var state=index<current?" done":index===current?" active":"";
    return '<div class="progress-item'+state+'"><span class="progress-index">'+(index<current?"✓":index+1)+'</span><span>'+escapeHtml(label)+'</span></div>';
  }).join("");
  counter.textContent=fill(words("protected"),{n:protectedChoices});
}
function feedback(text,tone){
  var el=stage.querySelector("[data-feedback]");
  if(!el)return;
  el.className="feedback "+(tone||"");
  el.textContent=text;
}
function advance(){current+=1;protectedChoices+=1;render();}
function renderChoiceStep(key){
  var item=dict()[key];
  var correct=key==="backup"?"offline":key==="address"?"full":"official";
  var address=key==="address"?'<div class="address-compare"><div class="address-box"><span class="address-label">'+escapeHtml(item.expected)+'</span><code>bc1q8cp7 7x6nm 53p4a jg9<span class="address-diff">d</span>8 w4q</code></div><div class="address-box"><span class="address-label">'+escapeHtml(item.clipboard)+'</span><code>bc1q8cp7 7x6nm 53p4a jg9<span class="address-diff">b</span>8 w4q</code></div></div><p class="address-note">'+escapeHtml(item.note)+'</p>':"";
  stage.innerHTML='<div class="stage-kicker">'+escapeHtml(fill(words("step"),{n:current+1}))+'</div><h2>'+escapeHtml(item.title)+'</h2><p class="prompt">'+escapeHtml(item.prompt)+'</p>'+address+'<div class="choice-list">'+orderedChoices(key,item).map(function(choice){return '<button class="choice" type="button" data-choice="'+choice[0]+'">'+escapeHtml(choice[1])+'</button>';}).join("")+'</div><div class="feedback" data-feedback>'+escapeHtml(key==="address"?item.note:"")+'</div>';
  stage.querySelectorAll("[data-choice]").forEach(function(button){button.addEventListener("click",function(){
    var id=button.getAttribute("data-choice");
    if(id===correct){
      button.dataset.state="good";
      stage.querySelectorAll("[data-choice]").forEach(function(choice){choice.disabled=true;});
      feedback(item.good,"good");
      var next=document.createElement("button");next.type="button";next.className="next";next.dataset.next="";next.textContent=current===2?words("next"):words("continue");next.addEventListener("click",advance);stage.appendChild(next);
    }else{
      button.dataset.state="bad";
      feedback(item.bad,"bad");
    }
  });});
}
function orderItem(id){return dict().order.items.find(function(item){return item[0]===id;});}
function renderOrder(){
  var item=dict().order;
  var placed=orderPicked.map(function(id){return orderItem(id);});
  var list=orderExpected.map(function(id,index){var picked=placed[index];return '<li class="'+(picked?"filled":"")+'"><span class="order-no">'+(index+1)+'</span><span>'+escapeHtml(picked?picked[1]:"…")+'</span></li>';}).join("");
  stage.innerHTML='<div class="stage-kicker">'+escapeHtml(fill(words("step"),{n:4}))+'</div><h2>'+escapeHtml(item.title)+'</h2><p class="prompt">'+escapeHtml(item.prompt)+'</p><div class="order-layout"><div><div class="address-label">'+escapeHtml(item.path)+'</div><ol class="order-path" data-path>'+list+'</ol></div><div><div class="address-label">'+escapeHtml(item.bank)+'</div><div class="order-bank">'+orderBankOrder.map(function(id){var choice=orderItem(id),used=orderPicked.indexOf(choice[0])>=0;return '<button class="order-choice" type="button" data-order="'+choice[0]+'" '+(used?"disabled data-state=\"good\"":"")+'>'+escapeHtml(choice[1])+'</button>';}).join("")+'</div></div></div><div class="feedback" data-feedback>'+escapeHtml(item.choose)+'</div>';
  stage.querySelectorAll("[data-order]").forEach(function(button){button.addEventListener("click",function(){
    var id=button.getAttribute("data-order"),expected=orderExpected[orderPicked.length];
    if(id===expected){
      orderPicked.push(id);renderOrder();
      var message=orderPicked.length===orderExpected.length?item.complete:item.good;
      feedback(message,"good");
      if(orderPicked.length===orderExpected.length){
        var finish=document.createElement("button");finish.type="button";finish.className="next";finish.dataset.finish="";finish.textContent=words("continue");finish.addEventListener("click",function(){current=4;protectedChoices=4;render();});stage.appendChild(finish);
      }
    }else{button.dataset.state="bad";feedback(item.bad,"bad");}
  });});
}
function renderResult(){
  var item=dict().result;
  stage.innerHTML='<div class="result"><div class="result-mark" aria-hidden="true">✓</div><h2>'+escapeHtml(item.title)+'</h2><p>'+escapeHtml(item.body)+'</p><ul class="result-list">'+item.items.map(function(text){return '<li>'+escapeHtml(text)+'</li>';}).join("")+'</ul><button type="button" class="restart" data-restart>'+escapeHtml(words("restart"))+'</button></div>';
  stage.querySelector("[data-restart]").addEventListener("click",function(){startRound();render();});
}
function render(){setStatic();renderProgress();if(current===0)renderChoiceStep("backup");else if(current===1)renderChoiceStep("address");else if(current===2)renderChoiceStep("message");else if(current===3)renderOrder();else renderResult();}
function applyLang(lang){
  if(LANGS.indexOf(lang)<0)lang="ru";
  window.__LANG=lang;document.documentElement.lang=lang;render();
}
window.addEventListener("message",function(event){
  try{
    if(event.source!==window.parent||event.origin!==window.location.origin)return;
    var data=event.data;
    if(!data||typeof data!=="object"||data.type!=="luminara:demo-style")return;
    if(data.theme==="light"||data.theme==="dark")setTheme(data.theme);
    if(typeof data.accent==="string"&&data.accent){activePalette="";document.documentElement.style.setProperty("--accent",data.accent);renderControls();}
    if(typeof data.lang==="string")applyLang(data.lang);
  }catch(e){}
});
themeToggle.addEventListener("click",function(){setTheme(currentTheme()==="dark"?"light":"dark");});
paletteSwitch.querySelectorAll("[data-palette]").forEach(function(button){button.addEventListener("click",function(){setPalette(button.getAttribute("data-palette"));});});
startRound();
applyLang(window.__LANG||"ru");
</script>
</body>
</html>
