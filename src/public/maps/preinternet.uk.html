<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>До інтернету · Luminara</title><style>
:root{
  --paper:#f6f3ec; --paper2:#efe9dd; --ink:#1c2230; --ink2:#4a5468; --muted:#8a8172;
  --rule:#d9cfbc; --rule2:#e7dfce; --gold:#b7791f; --center:#1c2230;
  --power:#c0392b; --technology:#1f7a5a; --media:#b7791f; --privacy:#6b4fa0; --economy:#a04a7a;

  --shadow:0 1px 0 rgba(0,0,0,.04),0 10px 30px rgba(60,50,30,.10);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1100px 620px at 50% -8%, #fbf8f1 0%, var(--paper) 60%),var(--paper);
  color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.app-shell{display:grid;grid-template-columns:288px minmax(0,1fr) 340px;gap:20px;padding:22px;min-height:100vh}

  border:1px solid var(--rule);border-radius:14px;padding:20px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:16px;min-height:0}

.eyebrow{margin:0;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
#app-title{margin:0;font-family:var(--serif);font-size:30px;line-height:1.05;letter-spacing:-.01em}
.chapter-lede{margin:0;color:var(--ink2);font-size:14px;font-family:var(--serif);font-style:italic;line-height:1.5}
.rail-rule{height:1px;background:linear-gradient(90deg,var(--rule),transparent);margin:2px 0}
.section-h{margin:0;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lens-group{display:flex;flex-wrap:wrap;gap:7px}
.lens-btn{cursor:pointer;border:1px solid var(--rule);background:#fffdf7;color:var(--ink2);
  padding:6px 11px;border-radius:8px;font-size:12.5px;transition:.15s;display:inline-flex;gap:7px;align-items:center;font-weight:500}
.lens-btn:hover{border-color:var(--muted);color:var(--ink)}
.lens-btn[aria-pressed="true"]{border-color:var(--dot);color:var(--ink);background:#fff;box-shadow:0 0 0 1px var(--dot) inset}
.lens-dot{width:9px;height:9px;border-radius:50%;background:var(--dot);display:inline-block}
.lens-desc{margin:0;color:var(--ink2);font-size:12.5px;min-height:3.2em;line-height:1.5;font-family:var(--serif)}
.progress-box{font-size:11.5px;color:var(--muted)}
.progress-bar{height:5px;border-radius:5px;background:var(--rule2);overflow:hidden;margin-top:6px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),#d6a94e);width:0;transition:width .35s}
.node-list{display:flex;flex-direction:column;gap:2px;overflow:auto}
.node-list button{text-align:left;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--ink2);
  padding:8px 9px;border-radius:9px;font-size:13px;display:flex;gap:10px;align-items:baseline;transition:.12s;font-family:var(--serif)}
.node-list button:hover{background:#fffdf6;border-color:var(--rule)}
.node-list button[aria-current="true"]{background:#fff;border-color:var(--dot);color:var(--ink)}
.node-idx{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11px;min-width:16px;font-family:var(--sans)}

.map-stage{position:relative;background:radial-gradient(680px 680px at 50% 46%, #fffdf8 0%, #f4efe4 72%, #efe7d7 100%);
  border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;min-height:600px;display:flex}
.system-map{width:100%;height:100%;display:block}

.ring{fill:none;stroke:var(--rule2);stroke-width:1}
.ring-tick{stroke:var(--rule);stroke-width:1}
.era-label{fill:var(--muted);font-size:10.5px;font-family:var(--sans);font-weight:600;letter-spacing:.03em}

.edge path{fill:none;stroke:var(--rule);stroke-width:1.4;transition:stroke .25s, opacity .25s;opacity:.5;
  stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .9s ease forwards}
.edge.active path{stroke:var(--dot,#b7791f);stroke-width:2;opacity:.92;marker-end:url(#arrow-active)}
@keyframes draw{to{stroke-dashoffset:0}}
.edge-label{fill:var(--muted);font-size:10px;opacity:0;transition:.2s;font-family:var(--sans)}
.edge.active .edge-label{opacity:.9}

.center-halo{fill:#fff;opacity:.6;transform-origin:center;transform-box:fill-box;animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.4;r:74}50%{opacity:.75;r:86}}
.center-ring{fill:none;stroke:var(--dot,#b7791f);stroke-width:2;opacity:.5;transition:stroke .3s}
.center-disc{fill:var(--center);stroke:#000;stroke-opacity:.06}
.center-t1{fill:#fff;font-family:var(--serif);font-size:15px;font-weight:600;text-anchor:middle}
.center-t2{fill:#e9c986;font-family:var(--sans);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;text-anchor:middle}

.node{cursor:pointer;opacity:0;animation:pop .5s ease forwards;animation-delay:var(--delay,0s)}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.node{transform-origin:var(--ox) var(--oy);transform-box:view-box}
.node .halo{fill:var(--dot);opacity:.10;transition:.2s}
.node .disc{fill:#fffdf8;stroke:var(--dot);stroke-width:2;transition:.2s;filter:drop-shadow(0 3px 6px rgba(60,50,30,.12))}
.node:hover .disc{stroke-width:2.6}
.node .num{fill:var(--dot);font-family:var(--serif);font-size:15px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.node .cap{fill:var(--ink);font-family:var(--serif);font-size:13px;font-weight:600}
.node .kicker{fill:var(--muted);font-family:var(--sans);font-size:9px;letter-spacing:.1em;text-transform:uppercase}
.node .era{fill:var(--dot);font-family:var(--sans);font-size:9.5px;font-weight:700}
.node.selected .disc{stroke-width:3;fill:#fff}
.node.selected .halo{opacity:.22}
.node.dim{opacity:.32}

.detail-empty{color:var(--ink2);font-size:13.5px;font-family:var(--serif);line-height:1.6}
.detail-kicker{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dot);margin:0;font-weight:600}
.detail-title{margin:5px 0 0;font-family:var(--serif);font-size:21px;line-height:1.15}
.detail-thesis{margin:0;color:var(--ink);font-size:14.5px;font-family:var(--serif);line-height:1.55}
.detail-insight{margin:0;padding:11px 13px;border-left:3px solid var(--dot);background:#fffdf6;border-radius:0 8px 8px 0;font-size:13.5px;font-family:var(--serif);font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11px;color:var(--ink2);background:#fffdf6;border:1px solid var(--rule);border-radius:999px;padding:3px 10px}
.related h4,.sources-block h4{margin:8px 0 5px;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.related-list{display:flex;flex-direction:column;gap:3px}
.related-list button{cursor:pointer;text-align:left;background:#fffdf6;border:1px solid var(--rule);color:var(--ink2);border-radius:8px;padding:7px 9px;font-size:12.5px;font-family:var(--serif)}
.related-list button:hover{border-color:var(--dot);color:var(--ink)}
.sources-block ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.sources-block li{font-size:11.5px;color:var(--ink2);line-height:1.4}
.sources-block a{color:var(--gold);text-decoration:none;border-bottom:1px solid var(--rule)}
.panel-actions{display:flex;gap:8px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.btn{cursor:pointer;border-radius:9px;padding:9px 13px;font-size:13px;border:1px solid var(--rule);background:#fffdf7;color:var(--ink);font-weight:500}
.btn.primary{background:var(--center);color:#fff;border-color:var(--center)}
.btn:hover{filter:brightness(.98)}.btn.primary:hover{filter:brightness(1.15)}
.empty-state{margin:auto;text-align:center;padding:30px;color:var(--ink2);max-width:420px;font-family:var(--serif)}
.empty-state a{color:var(--gold)}

.scene-dialog{border:1px solid var(--rule);background:linear-gradient(180deg,#fffdf8,var(--paper2));
  border-radius:16px;max-width:680px;width:calc(100vw - 40px);padding:0;box-shadow:0 30px 80px rgba(40,30,10,.3)}
.scene-dialog::backdrop{background:rgba(40,32,18,.34);backdrop-filter:blur(2px)}
.dialog-inner{padding:26px 30px}
.dialog-inner h3{margin:2px 0 0;font-family:var(--serif);font-size:26px;line-height:1.12}
.dialog-close{position:absolute;top:14px;right:18px;cursor:pointer;background:transparent;border:none;color:var(--muted);font-size:24px;line-height:1}
.dialog-body{margin:14px 0;color:var(--ink);font-size:15.5px;line-height:1.72;font-family:var(--serif)}
.dialog-body h2{font-size:17px;font-family:var(--serif);margin:18px 0 6px}
.dialog-body p{margin:0 0 12px}
.arpa-wrap{margin-top:14px;border:1px solid var(--rule);border-radius:12px;padding:16px;background:#fffdf6}
.arpa-wrap h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600}
.arpa-svg{width:100%;height:160px;display:block;background:#faf6ec;border-radius:8px;border:1px solid var(--rule2)}
.arpa-note{margin:9px 0 0;color:var(--ink2);font-size:12px;min-height:1.4em;font-family:var(--serif)}
.arpa-net line{stroke:var(--rule);stroke-width:2}
.arpa-net .path-active{stroke:var(--technology);stroke-width:3}
.arpa-net circle.host{fill:#fffdf8;stroke:var(--muted);stroke-width:2}
.arpa-net circle.down{fill:#f6e3e0;stroke:var(--power);stroke-width:2}

<script>
const CHAPTER_DATA = {"chapter": {"key": "preinternet", "title": "До інтернету", "sourceUrl": "https://luminara.tech/#/scene?s=3&c=preinternet", "centralIdea": "Інформація стає владою", "centerX": 500, "centerY": 445, "ring": 300, "lede": "Як інформація стає владою — від дефіциту й сигналів до мережевого суспільства.", "lang": "uk"}, "lenses": [{"id": "chronology", "label": "Хронологія", "accent": "#7dd3fc", "description": "Порядок подій і перехід від дефіциту інформації до потоків даних."}, {"id": "power", "label": "Влада", "accent": "#f87171", "description": "Хто контролює інформацію: інституції, протоколи, мережі чи платформи."}, {"id": "technology", "label": "Технології", "accent": "#34d399", "description": "Винаходи й протоколи: сигнал, гіпертекст, пакети, TCP/IP, Web."}, {"id": "media", "label": "Медіа", "accent": "#fbbf24", "description": "Як середовище передавання змінює сприйняття, поведінку й організацію суспільства."}, {"id": "privacy", "label": "Приватність", "accent": "#c084fc", "description": "Криптографія як захист від спостереження й контролю."}], "nodes": [{"id": "scarcity", "sceneIndex": 0, "x": 500.0, "y": 145.0, "type": "power", "title": "Інформація як дефіцит", "shortTitle": "Дефіцит", "insight": "До інтернету інформація була фізично дорогою й централізованою — це робило її інструментом влади тих, у кого було обладнання.", "body": "## Світ, де слова коштували грошей\n\nТи читаєш це на екрані. Десь у дата-центрі сервер надіслав тобі цей текст за мілісекунди — і це не коштувало тобі нічого. Це здається само собою зрозумілим, як електрика чи водопровід. Але так було не завжди. І розуміння того, як було «до», — це не історична цікавість, а ключ до розуміння того, чому сучасний інтернет влаштований саме так. І чому це проблема.\n\nУсього сімдесят років тому передати повідомлення з Києва до Нью-Йорка коштувало грошей, займало дні й контролювалося тими, у кого було обладнання: державами, телеграфними компаніями, редакціями газет. Інформація була дефіцитом — точно таким самим, як нафта чи зерно. І як будь-який дефіцит, вона була владою. Той, хто контролював передавання інформації, контролював реальність.\n\nУяви собі друкарню середини XX століття. Величезні металеві машини, свинцеві літери, запах фарби й мастила. Щоб донести одну ідею до мільйона людей, потрібно було фізично надрукувати мільйон примірників газети, завантажити їх у вантажівки, розвезти по кіосках по всій країні. Кожна копія коштувала грошей. Кожен кілометр доставки коштував грошей. Друкарська помилка в накладі — гроші викинуті, репутація підірвана. Це був величезний, важкий, повільний механізм.\n\nРадіо й телебачення здавалися революцією — сигнал поширюється зі швидкістю світла, жодних вантажівок. Але в них було принципове обмеження: один передавач, мільйони приймачів. Говорити міг тільки той, у кого була вежа. Усе інше людство — слухало. Підняти слухавку й відповісти було не можна. Заперечити — не можна. Додати своє — не можна.\n\nТак виглядав інформаційний світ до інтернету: централізований, дорогий, односпрямований. Кілька джерел мовили на багатьох. Інформація текла строго згори вниз — від тих, у кого є обладнання, до тих, у кого його немає. Це не випадковість і не злий умисел — це була фізична реальність технологій того часу.\n\n> Інформація була не просто ресурсом — вона була архітектурою влади. Хто володів каналом передавання, той володів реальністю.\n\nСаме тому перші люди, які зрозуміли, що цю архітектуру можна змінити, зрозуміли щось революційне. Не просто «можна передавати дані швидше». А «сама структура влади над інформацією може бути зламана». І вони почали працювати над цим — задовго до того, як з'явився перший браузер.", "tags": ["влада", "дефіцит", "медіа"], "lensWeight": {"chronology": 5, "power": 5, "technology": 1, "media": 4, "privacy": 1}, "angDeg": -90.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Ваннівар Буш — As We May Think (1945)", "url": ""}, {"title": "Деніел Белл — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Елвін Тоффлер — The Third Wave (1980)", "url": ""}, {"title": "Маршалл Маклюен — Understanding Media (1964)", "url": ""}, {"title": "Ніколас Негропонте — Being Digital (1995)", "url": ""}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": ""}, {"title": "Стюарт Бренд — Information Wants to Be Free (1984)", "url": ""}, {"title": "Ерік Г'юз — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Мануель Кастельс — The Information Age (1996–1998)", "url": ""}], "era": "до 1948"}, {"id": "shannon", "sceneIndex": 1, "x": 692.8, "y": 215.2, "type": "technology", "title": "Шеннон: інформація стала фізикою", "shortTitle": "Шеннон", "insight": "Шеннон довів, що інформацію можна вимірювати й передавати як фізичну величину — це заклало математичний фундамент усього цифрового світу.", "body": "## Людина, яка виміряла думку\n\nУ 1948 році американський математик Клод Шеннон опублікував роботу із сухою технічною назвою «Математична теорія комунікації». Тоді її мало хто читав. Зараз її теж мало хто читає. Але вона змінила світ більше, ніж більшість книжок, які читають усі.\n\nШеннон довів те, що здавалося неможливим: будь-яке повідомлення — слово, звук, образ, число, запах, описаний словами — можна точно виміряти, стиснути й передати будь-яким каналом зв'язку. Він назвав одиницю вимірювання «біт» — від binary digit, двійкова цифра. Нуль або одиниця. Є сигнал або немає. Увесь всесвіт інформації — це комбінації нулів і одиниць.\n\nДо Шеннона інформація була чимось туманним і суб'єктивним. Одні слова «важливіші» за інші. Одні образи «змістовніші». Одні повідомлення «багатші». Після Шеннона інформація стала фізичною величиною, такою ж реальною й вимірюваною, як маса чи температура. Світ перестав ділитися тільки на матерію й енергію. З'явилося третє — інформація. І це третє виявилося не менш фундаментальним, ніж перші два.\n\n## Полум'я свічки через океан\n\nЩоб зрозуміти, що зробив Шеннон, уяви таке завдання: передати полум'я свічки з Києва до Токіо. Можна везти саму свічку — але це повільно, дорого, і полум'я згасне в дорозі. Це передавання матерії, і воно обмежене фізичними законами.\n\nАле можна описати полум'я: його колір, висоту, температуру, форму, хімічний склад воску. Передати цей опис зі швидкістю світла дротом. І інша людина в Токіо запалить точно таке саме полум'я. Це передавання інформації — і воно не знає фізичних обмежень.\n\nШеннон показав, що цей другий спосіб можна зробити абсолютно точним, надійним і масштабованим. Що будь-який сигнал можна закодувати в біти, передати без спотворень і відновити з іншого боку. Саме на цьому стоїть увесь цифровий світ: від електронної пошти до стримінгу 4K, від месенджерів до блокчейну.\n\nЩоразу, коли ти надсилаєш повідомлення в Telegram, — працює Шеннон. Щоразу, коли транзакція в блокчейні передається між вузлами мережі, — працює Шеннон. Він створив математичний фундамент, на якому побудоване все цифрове.\n\n> Шеннон не винайшов інтернет. Він довів, що інтернет можливий — що інформацію можна передавати точно, як фізичну величину.\n\nПарадокс у тому, що сам Шеннон працював у Bell Laboratories — найбільшій телефонній монополії світу. Його відкриття зрештою зруйнувало монополію його роботодавця. Коли інформацію можна передавати будь-яким каналом — отже, жоден канал не може бути монополістом назавжди.", "tags": ["сигнал", "кодування", "вимірювання"], "lensWeight": {"chronology": 4, "power": 2, "technology": 5, "media": 2, "privacy": 2}, "angDeg": -50.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Ваннівар Буш — As We May Think (1945)", "url": ""}, {"title": "Деніел Белл — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Елвін Тоффлер — The Third Wave (1980)", "url": ""}, {"title": "Маршалл Маклюен — Understanding Media (1964)", "url": ""}, {"title": "Ніколас Негропонте — Being Digital (1995)", "url": ""}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": ""}, {"title": "Стюарт Бренд — Information Wants to Be Free (1984)", "url": ""}, {"title": "Ерік Г'юз — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Мануель Кастельс — The Information Age (1996–1998)", "url": ""}], "era": "1948"}, {"id": "memex", "sceneIndex": 2, "x": 795.4, "y": 392.9, "type": "media", "title": "Мемекс Буша: мрія, що випередила час", "shortTitle": "Memex", "insight": "У 1945 році Ванневар Буш описав гіпертекст і пов'язані знання — за 46 років до Web. Правильні ідеї не вмирають, вони чекають своїх технологій.", "body": "## Гіпертекст за сорок років до інтернету\n\nЩе в 1945 році — за два роки до появи першого повноцінного комп'ютера і за сорок шість років до World Wide Web — американський учений Ванневар Буш написав есе з назвою «Як ми можемо мислити». Опубліковане воно було в The Atlantic — не в науковому журналі, а в масовому виданні для широкої аудиторії. Буш хотів, щоб його прочитали всі, а не лише колеги-науковці.\n\nВін описав пристрій, який назвав «мемекс» — від memory extender, розширювач пам'яті. Це була особиста бібліотека всіх знань людства, де будь-який документ пов'язаний із будь-яким іншим за змістом. Читаєш статтю про Наполеона — і одним рухом переходиш до карти його походів. Від карти — до листів його генералів. Від листів — до аналізу його тактики військовими істориками XX століття. Не шукаєш у каталозі за алфавітом, не гортаєш полиці — а йдеш ланцюжком думки, як іде сама думка.\n\nЦе був гіпертекст. За сорок років до того, як це слово придумають офіційно. За сорок шість років до того, як Тім Бернерс-Лі реалізує цю ідею у вигляді World Wide Web.\n\n## Чому мрія пролежала в шухляді столу\n\nБуш бачив майбутнє абсолютно ясно: знання мають бути пов'язані, доступні кожному й належати всім. Проблема була одна — технологій ще не існувало. У 1945 році комп'ютери займали цілі кімнати, коштували як літаки й могли тільки рахувати. Жодних дисплеїв, жодних мишей, жодних мереж. Буш описав пристрій у термінах мікрофільмів і механічних важелів — бо це було все, що він мав для аналогії.\n\nЙого мрія пролежала в шухляді столу майже пів століття. Але вона не була забута. Її читали, цитували, передавали з рук у руки. Тед Нельсон у 1965 році придумав слово «гіпертекст» — безпосередньо надихнувшись Бушем. Дуглас Енгельбарт створив комп'ютерну мишу й систему гіпертекстових документів — теж під впливом Буша.\n\nКоли Тім Бернерс-Лі у 1989 році писав свою заявку на створення Web у CERN, він прямо посилався на есе Буша як на вихідну ідею. Через сорок чотири роки після публікації мрія нарешті отримала інструменти для реалізації.\n\nЦя історія важлива не як історичний курйоз. Вона показує дещо принципове: правильна ідея не вмирає. Вона чекає свого моменту. Іноді — десятиліттями. Сьогодні ми переживаємо схожий момент: ідеї децентралізованого інтернету, де користувачі володіють своїми даними, існували задовго до блокчейну. Технології просто нарешті наздогнали бачення.\n\n> Буш описав World Wide Web за сорок шість років до його винайдення. Не тому, що був пророком — а тому, що зрозумів, чого людський розум хоче від інструментів знання.\n\nПарадоксально, але Буш у 1945 році думав про зв'язки між ідеями — а ми зрештою отримали інтернет, де зв'язки між людьми виявилися важливішими, ніж зв'язки між ідеями. Це важлива відмінність, до якої ми повернемося в наступних главах.", "tags": ["гіпертекст", "знання", "асоціації"], "lensWeight": {"chronology": 4, "power": 2, "technology": 4, "media": 5, "privacy": 1}, "angDeg": -10.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Ваннівар Буш — As We May Think (1945)", "url": ""}, {"title": "Деніел Белл — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Елвін Тоффлер — The Third Wave (1980)", "url": ""}, {"title": "Маршалл Маклюен — Understanding Media (1964)", "url": ""}, {"title": "Ніколас Негропонте — Being Digital (1995)", "url": ""}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": ""}, {"title": "Стюарт Бренд — Information Wants to Be Free (1984)", "url": ""}, {"title": "Ерік Г'юз — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Мануель Кастельс — The Information Age (1996–1998)", "url": ""}], "era": "1945"}, {"id": "arpanet", "sceneIndex": 3, "x": 759.8, "y": 595.0, "type": "technology", "title": "ARPANET: інтернет народився зі страху", "shortTitle": "ARPANET", "insight": "ARPANET створювався як військова система зв'язку без єдиної точки відмови — і саме ця децентралізована архітектура стала фундаментом усього інтернету.", "body": "## Супутник, який змінив архітектуру світу\n\nІсторія інтернету починається не в Кремнієвій долині й не в університетських аудиторіях. Вона починається в Пентагоні, у розпал холодної війни, у момент гострого геополітичного страху.\n\n4 жовтня 1957 року Радянський Союз запустив перший штучний супутник Землі. Маленька металева куля діаметром 58 сантиметрів, вагою 83 кілограми, летіла над Землею і пищала — і весь світ її чув. Для американських військових це був не просто технологічний тріумф конкурента. Це був сигнал тривоги: ворог контролює орбіту. Якщо вони можуть запустити супутник, вони можуть запустити ракету з ядерною боєголовкою — і дістати будь-яку точку планети.\n\nЧерез рік США створили DARPA — Агентство передових дослідницьких проєктів. Перед ним стояло завдання: створити систему військового зв'язку, яку неможливо знищити одним ударом. Традиційні телефонні мережі були катастрофічно вразливі: є центральна телефонна станція — є точка відмови. Одна бомба на Пентагон — і зв'язок з усією армією втрачено.\n\n## Мережа без центру — ідея, що змінила все\n\nІнженери DARPA придумали принципово інше рішення. А що як прибрати центр узагалі? Зробити кожен вузол мережі рівноправним. Якщо один виходить з ладу — повідомлення автоматично знаходить інший маршрут. Як вода в трубах: якщо одну трубу перекрито, вода знаходить обхідний шлях.\n\nЦю ідею назвали ARPANET. У 1969 році вона вперше запрацювала: чотири університети — UCLA, Стенфорд, UC Санта-Барбара та Юта — обмінялися даними телефонною лінією. Перше повідомлення, яке намагалися передати, було слово \"login\". Система впала після літери \"o\". Першим словом, переданим протоінтернетом, стало \"lo\" — що англійською означає \"дивись\". Випадкова поезія.\n\nТоді ніхто не думав, що це стане фундаментом глобального цивільного інтернету. Військові хотіли надійний зв'язок на випадок ядерної війни. Вони створили щось більше — архітектуру, у якій влада структурно не може зосередитися в одній точці. Розподілена мережа за своєю природою стійка до централізації.\n\nПринаймні так це задумувалося. Реальність виявилася складнішою — і про це ми поговоримо в наступних главах.\n\n> Інтернет створювався як військова система зв'язку, стійка до ядерного удару. У підсумку він виявився стійким до будь-якої централізації влади — і це стало його головною політичною властивістю.\n\nУ 1974 році Вінтон Серф і Роберт Кан розв'язали наступну проблему: різні комп'ютери говорили різними мовами. Мережа Стенфорда не розуміла мережу MIT. Вони створили TCP/IP — універсальний протокол, єдину мову для передавання даних між будь-якими мережами. Дані розбиваються на маленькі пакети, кожен знаходить свій шлях, на іншому кінці збирається назад. Наче ти розрізав лист на частини, відправив кожну окремим кур'єром — і вони все одно зібралися в правильному порядку в отримувача. Саме цей протокол лежить в основі інтернету сьогодні — через п'ятдесят років після створення.", "tags": ["пакети", "DARPA", "TCP/IP", "децентралізація"], "lensWeight": {"chronology": 5, "power": 5, "technology": 5, "media": 2, "privacy": 3}, "angDeg": 30.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Ваннівар Буш — As We May Think (1945)", "url": ""}, {"title": "Деніел Белл — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Елвін Тоффлер — The Third Wave (1980)", "url": ""}, {"title": "Маршалл Маклюен — Understanding Media (1964)", "url": ""}, {"title": "Ніколас Негропонте — Being Digital (1995)", "url": ""}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": ""}, {"title": "Стюарт Бренд — Information Wants to Be Free (1984)", "url": ""}, {"title": "Ерік Г'юз — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Мануель Кастельс — The Information Age (1996–1998)", "url": ""}], "era": "1969"}, {"id": "open-web", "sceneIndex": 4, "x": 602.6, "y": 726.9, "type": "technology", "title": "Бернерс-Лі: рішення віддати все безкоштовно", "shortTitle": "Відкритий Web", "insight": "Бернерс-Лі віддав Web безкоштовно — не з альтруїзму, а тому що зрозумів: лише відкритий протокол може стати глобальним.", "body": "## Заявка з позначкою \"туманно, але цікаво\"\n\nУ 1989 році молодий британський програміст Тім Бернерс-Лі працював у CERN — Європейському центрі ядерних досліджень у Женеві. Це найбільший у світі науковий інститут: тисячі вчених із десятків країн працюють над одними експериментами, але постійно гублять документи, забувають контекст, витрачають місяці на те, щоб розібратися в тому, що вже було зроблено до них.\n\nБернерс-Лі написав внутрішню заявку для керівництва. Суть: створити систему, де всі документи пов'язані посиланнями й доступні з будь-якого комп'ютера в мережі. Його начальник Майк Сендалл написав на полях три слова: \"Туманно, але цікаво\". Це була найскромніша рецензія на винахід, який змінить світ.\n\nЗа три роки Бернерс-Лі створив три речі, на яких тримається весь сучасний інтернет: HTML — мову розмітки документів, HTTP — протокол їх передавання, і URL — систему адресації. Разом вони утворили World Wide Web. Документи зберігаються на серверах, мають адреси, пов'язані посиланнями й відкриваються через програму-браузер. Просто, елегантно, універсально.\n\n## Рішення, яке визначило епоху\n\nАле ключове рішення було не технічним. Воно було етичним.\n\nБернерс-Лі міг запатентувати свій винахід. Юристи CERN це пропонували. Якби кожен сайт платив роялті за використання HTTP, Бернерс-Лі став би найбагатшою людиною планети. Натомість він наполіг на тому, щоб віддати технологію людству безкоштовно — без обмежень, без ліцензій, без умов.\n\n\"Якби Web був запатентований або перебував під контролем однієї компанії, його б не існувало\", — пояснив він пізніше. Це не був альтруїзм заради альтруїзму. Це була стратегія: тільки без бар'єрів мережа могла вирости до глобального масштабу. Тільки якщо будь-хто може створити сайт без дозволу — мережа стане по-справжньому відкритою.\n\nУ 1993 році студенти Національного центру суперкомп'ютерних застосунків США випустили браузер Mosaic — перший, який показував текст і картинки разом на одному екрані. До цього інтернет був світом тексту. Mosaic зробив його візуальним. І зрозумілим для звичайної людини, яка ніколи не вчилася програмуванню.\n\nТого ж року кількість веб-сайтів перевалила за п'ятсот. Зараз це звучить смішно, але тоді це був вибух. Через два роки їх було вже двісті тисяч. Перегони почалися.\n\n> Бернерс-Лі віддав Web безкоштовно — і тим самим зробив його глобальним. Якби він його запатентував, ми б досі платили роялті за кожне посилання.\n\nЦя історія про Бернерса-Лі — не просто біографічний факт. Це урок про природу мереж: відкриті протоколи ростуть швидше за закриті, бо будь-хто може на них будувати. Саме тому блокчейн Ethereum відкритий. Саме тому TON — відкритий протокол. Бернерс-Лі у 1991 році заклав принцип, який досі визначає, які технології перемагають.", "tags": ["Web", "протокол", "відкритість"], "lensWeight": {"chronology": 5, "power": 4, "technology": 5, "media": 4, "privacy": 2}, "angDeg": 70.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Ваннівар Буш — As We May Think (1945)", "url": ""}, {"title": "Деніел Белл — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Елвін Тоффлер — The Third Wave (1980)", "url": ""}, {"title": "Маршалл Маклюен — Understanding Media (1964)", "url": ""}, {"title": "Ніколас Негропонте — Being Digital (1995)", "url": ""}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": ""}, {"title": "Стюарт Бренд — Information Wants to Be Free (1984)", "url": ""}, {"title": "Ерік Г'юз — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Мануель Кастельс — The Information Age (1996–1998)", "url": ""}], "era": "1991"}, {"id": "atoms-to-bits", "sceneIndex": 5, "x": 397.4, "y": 726.9, "type": "economy", "title": "Від атомів до бітів: зміна економічної логіки", "shortTitle": "Атоми → біти", "insight": "Перехід \"від атомів до бітів\" — це не просто технологія, а зміна економічної логіки: від масштабу однакового до унікальності кожної взаємодії.", "body": "## Тоффлер бачив це у 1980-му\n\nКоли у 1980 році Елвін Тоффлер публікував \"Третю хвилю\", персональних комп'ютерів майже не існувало. Інтернету не було. Мобільних телефонів не було. І все ж він описав економічну трансформацію, яка повністю розгорнулася лише через сорок років.\n\nТоффлер описав три епохи людської цивілізації. Перша хвиля — аграрна: земля й урожай як головна цінність. Друга хвиля — промислова: конвеєр, стандартизація, тираж. Завод виробляє тисячу однакових холодильників — це ефективно саме тому, що вони однакові. Що більше одиниць продукту, то нижча собівартість кожної. Масштаб — це перемога індустріальної економіки.\n\nТретя хвиля — інформаційна. І тут логіка перевертається з ніг на голову. В інформаційній економіці копіювання безкоштовне. Одна програма може поводитися по-різному з мільярдом користувачів одночасно — і це не баг, а головна перевага. Цінність створюється не через тиражування однакового, а через унікальність кожної взаємодії.\n\n## Ніколас Негропонте і найпростіша формула\n\nУ 1995 році директор MIT Media Lab Ніколас Негропонте сформулював це однією фразою, що стала крилатою: \"від атомів до бітів\".\n\nАтоми — це фізичний світ. Щоб виробити холодильник, потрібні метал, пластик, електроніка, робочі руки, завод. Щоб доставити його покупцеві — вантажівка, склад, магазин. Кожна копія коштує грошей. Тираж обмежений ресурсами. Якщо ти хочеш продати мільйон холодильників — тобі потрібно виробити мільйон холодильників.\n\nБіти — це цифровий світ. Щоб створити програму, потрібен один розробник і один комп'ютер. Щоб доставити її мільярду користувачів — потрібен сервер та інтернет-з'єднання. Копіювання практично безкоштовне. Доставка миттєва. Тираж нескінченний. Якщо ти хочеш продати мільярд копій програми — тобі не потрібно виробляти мільярд програм. Одна копія реплікується мільярд разів.\n\nЦе не просто технологічна відмінність. Це зміна фундаментальної економічної логіки. Уся економіка XX століття була побудована на логіці атомів: дефіцит, масштаб, стандартизація. Економіка XXI століття будується на логіці бітів: достаток, персоналізація, мережеві ефекти.\n\n> Індустріальна економіка заробляла на масштабі однакового. Інформаційна економіка заробляє на унікальності кожної взаємодії. Це протилежні логіки.\n\nКоли розумієш цю відмінність — багато що в сучасному світі починає пояснюватися. Чому Google безкоштовний? Тому що копіювання пошукової видачі нічого не коштує — монетизація йде через рекламу. Чому Spotify платить музикантам копійки? Тому що гранична вартість одного стриму прямує до нуля. Чому криптовалюти взагалі можливі? Тому що цифрові активи можна передавати без фізичного носія. Усе це наслідки одного принципу, який Негропонте сформулював трьома словами.", "tags": ["економіка", "біти", "масштаб"], "lensWeight": {"chronology": 4, "power": 4, "technology": 3, "media": 3, "privacy": 1}, "angDeg": 110.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Ваннівар Буш — As We May Think (1945)", "url": ""}, {"title": "Деніел Белл — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Елвін Тоффлер — The Third Wave (1980)", "url": ""}, {"title": "Маршалл Маклюен — Understanding Media (1964)", "url": ""}, {"title": "Ніколас Негропонте — Being Digital (1995)", "url": ""}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": ""}, {"title": "Стюарт Бренд — Information Wants to Be Free (1984)", "url": ""}, {"title": "Ерік Г'юз — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Мануель Кастельс — The Information Age (1996–1998)", "url": ""}], "era": "1995"}, {"id": "media-effects", "sceneIndex": 6, "x": 240.2, "y": 595.0, "type": "media", "title": "Маклюен і віруси Рашкоффа: медіа змінюють нас", "shortTitle": "Медіа", "insight": "Маклюен і Рашкофф зрозуміли: важлива не інформація, а середовище її передавання. Медіа змінюють нас незалежно від змісту - через структуру, яку ми не помічаємо.", "body": "## Засіб передавання важливіший за повідомлення\n\nМаршалл Маклюен був незручним мислителем. У 1964 році він написав фразу, яку спочатку вважали нісенітницею, потім - метафорою, і лише згодом - точним технічним описом реальності: «Засіб передавання і є повідомлення».\n\nЩо він мав на увазі? Коли в 1950-х з'явилося масове телебачення, усі сперечалися про зміст: добрі програми чи погані, освітні чи розважальні, пропаганда чи мистецтво. Маклюен сказав: це другорядне питання. Саме телебачення - як середовище, як технологія, як спосіб сприйняття - вже змінило суспільство, незалежно від того, що саме показують.\n\nТелевізор уперше в історії синхронізував мільйони людей: ті самі новини в той самий час тими самими словами - в усіх домівках країни одночасно. Він створив те, що Маклюен назвав «глобальним селом» - світ, де всі одночасно переживають одну й ту саму подію. До телебачення люди в різних містах жили в різних інформаційних реальностях. Після нього - в одній.\n\n## Біологічна метафора Рашкоффа\n\nУ 1994 році американський теоретик медіа Дуглас Рашкофф додав до ідеї Маклюена біологічну метафору, яка виявилася ще точнішою. У книжці *Media Virus!* він описав механізм, який сьогодні називають вірусним контентом, - за десять років до YouTube і за двадцять до TikTok.\n\nІдеї поширюються як віруси. Не тому, що вони правдиві. Не тому, що вони корисні. А тому, що потрапляють у психологічну вразливість аудиторії - у те, що змушує людей передавати їх далі: страх, обурення, захват, упізнавання, гнів, розчулення. Емоція - це механізм реплікації ідеї.\n\nРашкофф показав: контент, який викликає сильну емоцію, поширюється незалежно від своєї правдивості чи корисності. Скандальна новина розлітається швидше за правдиву. Страшна історія - швидше за нудну. Це не випадковість і не маніпуляція - це архітектурна особливість медіасередовища. Вірус не обирає носія за критерієм «добра людина чи погана». Він обирає за критерієм «вразливий чи ні».\n\nЗадовго до алгоритмів TikTok, оптимізованих саме під це, Рашкофф описав принцип, на якому вони побудовані. Алгоритм не створив вірусність. Він просто навчився її посилювати.\n\n> Маклюен попереджав: важлива не програма, а телевізор. Рашкофф уточнив: важлива не ідея, а емоція, яку вона викликає. Разом вони описали архітектуру сучасних соціальних мереж за тридцять років до їх появи.\n\nКоли з'явився інтернет, перше питання знову було про зміст: що люди там читатимуть і дивитимуться? Маклюен сказав би: неправильне питання. Правильне - що робить із людиною саме середовище, у якому вона проводить дедалі більше часу? Це питання стало критично важливим, коли з'явилися соціальні мережі. На жаль, його поставили занадто пізно.", "tags": ["медіа", "поведінка", "сприйняття"], "lensWeight": {"chronology": 3, "power": 3, "technology": 1, "media": 5, "privacy": 2}, "angDeg": 150.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Ваннівар Буш — As We May Think (1945)", "url": ""}, {"title": "Деніел Белл — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Елвін Тоффлер — The Third Wave (1980)", "url": ""}, {"title": "Маршалл Маклюен — Understanding Media (1964)", "url": ""}, {"title": "Ніколас Негропонте — Being Digital (1995)", "url": ""}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": ""}, {"title": "Стюарт Бренд — Information Wants to Be Free (1984)", "url": ""}, {"title": "Ерік Г'юз — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Мануель Кастельс — The Information Age (1996–1998)", "url": ""}], "era": "1964–1990-ті"}, {"id": "cypherpunks", "sceneIndex": 7, "x": 204.6, "y": 392.9, "type": "privacy", "title": "Г'юз і шифропанки: приватність - це математика", "shortTitle": "Шифропанки", "insight": "Г'юз у 1993 році передбачив кризу приватності й вимагав математичного захисту - його маніфест став ідеологічним фундаментом Bitcoin і всього Web3.", "body": "## Голос, який попереджав заздалегідь\n\nУ 1993 році, коли більшість людей уперше почули слово «інтернет», математик і криптограф Ерік Г'юз написав документ на три сторінки. Він називався «Маніфест шифропанка» і був опублікований у розсилці невеликої спільноти людей, які займалися криптографією й думали про наслідки появи публічної мережі.\n\nТоді інтернет лише ставав доступним звичайним людям. Перші браузери тільки з'явилися. Про приватність у мережі ще ніхто не думав - люди просто раділи новим можливостям: можна листуватися з людьми на іншому кінці планети! Можна читати новини в реальному часі! Можна знайти будь-яку інформацію!\n\nГ'юз думав інакше. Його аргумент був простим і залізним: відкритий інтернет означає, що кожна твоя дія в мережі потенційно видима всім - провайдерам, державам, корпораціям. Це не випадкова вразливість. Це архітектурна особливість системи, яку, навмисно чи ні, створили саме такою. І єдиний спосіб захистити приватність у таких умовах - не просити дозволу в провайдерів і держав, а використовувати математику. Криптографію. Математику, яку не може зламати жоден закон.\n\n## Пророцтво, яке збулося буквально\n\nГ'юз написав у 1993 році: «Приватність у відкритому суспільстві потребує анонімної системи транзакцій». Це звучало як фантастика. Більшість читачів знизували плечима: «Мені нічого приховувати». Навіщо анонімні транзакції звичайній людині?\n\nЧерез тридцять років ми живемо у світі, де корпорації знають про користувачів більше, ніж їхні близькі. Де витоки даних стали щоденними новинами. Де кожна покупка карткою, кожен пошуковий запит, кожне переміщення з увімкненим телефоном записується і зберігається. Г'юз не був параноїком. Він просто думав на кілька ходів уперед.\n\nШифропанки - невелика спільнота, що зібралася навколо цієї ідеї на початку 1990-х, - зрештою заклали ідеологічний фундамент для Bitcoin. Сатоші Накамото у 2008 році опублікував опис Bitcoin саме в розсилці шифропанків. Це була пряма відповідь на питання Г'юза: ось ваша анонімна система транзакцій, побудована на математиці, а не на довірі до посередника.\n\nСтюарт Бренд ще у 1984 році вимовив фразу, що стала маніфестом відкритого інтернету: «Інформація хоче бути вільною». Він мав на увазі природу інформації - вона не зменшується під час копіювання, тому штучні бар'єри суперечать її природі. Г'юз доповнив це з іншого боку: свобода інформації без приватності - це не свобода, а прозорість для тих, хто спостерігає.\n\n> Бренд сказав: інформація хоче бути вільною. Г'юз відповів: а приватність хоче бути захищеною математикою. Разом вони описали два полюси цифрової свободи.\n\nЦі два принципи - відкритість і приватність - у певному сенсі суперечать один одному. І напруга між ними досі визначає головні суперечки про те, яким має бути інтернет. Як зробити знання доступними всім - і водночас захистити особисті дані кожного? Це питання ще не розв'язане. І саме його намагається розв'язати Web3.", "tags": ["криптографія", "приватність", "спостереження"], "lensWeight": {"chronology": 3, "power": 4, "technology": 4, "media": 2, "privacy": 5}, "angDeg": 190.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Ваннівар Буш — As We May Think (1945)", "url": ""}, {"title": "Деніел Белл — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Елвін Тоффлер — The Third Wave (1980)", "url": ""}, {"title": "Маршалл Маклюен — Understanding Media (1964)", "url": ""}, {"title": "Ніколас Негропонте — Being Digital (1995)", "url": ""}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": ""}, {"title": "Стюарт Бренд — Information Wants to Be Free (1984)", "url": ""}, {"title": "Ерік Г'юз — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Мануель Кастельс — The Information Age (1996–1998)", "url": ""}], "era": "1993"}, {"id": "castells", "sceneIndex": 8, "x": 307.2, "y": 215.2, "type": "power", "title": "Кастельс: влада перейшла до потоків", "shortTitle": "Потоки", "insight": "Кастельс показав: влада перейшла від контролю над місцями до контролю над потоками даних і уваги - і це зробило її невидимою та майже неоспорюваною.", "body": "## Революція, якої не помітили\n\nДо середини 1990-х іспанський соціолог Мануель Кастельс спостерігав трансформацію, що відбувалася в усіх на очах, - і написав тритомну працю про те, чого більшість людей не помічала. Інформаційна революція вже відбулася. Просто люди шукали її не там.\n\nВони чекали на літаючі машини й роботів на кухні. Чекали фантастичного майбутнього з науково-популярних журналів 1960-х. А революція відбувалася в банківських серверних залах, у логістичних центрах глобальних корпорацій, у фінансових потоках між континентами. До 1990-х гроші вже перестали бути фізичними - вони стали потоками даних між серверами. Виробництво перестало бути локальним - воно стало глобальною мережею постачальників, де дизайн створюють у Каліфорнії, деталі виробляють у Китаї, збирають у В'єтнамі, а продають усюди. Влада перестала вимірюватися територією.\n\n## Простір місць проти простору потоків\n\nКастельс запровадив розрізнення, яке допомагає зрозуміти сучасний світ. Стара влада контролювала «простір місць»: заводи, порти, кордони, території. Фізичні точки, які можна зайняти, захистити, утримати. Нова влада контролює «простір потоків»: дані, капітал, увагу, інформацію.\n\nЦе принципово різні види влади. Територіальну владу можна побачити на мапі - ось кордон, ось армія, ось замок. Влада над потоками невидима. Де розташована влада Google? Ніде й усюди одночасно. Де розташована влада Facebook? В алгоритмі, який визначає, що бачать мільярди людей. Де розташована влада Bitcoin? У розподіленій мережі, яка не має фізичного місцезнаходження.\n\nКастельс показав: хто керує потоками, той керує світом. І це спостереження виявилося лякаюче точним. П'ять-шість технологічних компаній контролюють більшу частину інформаційних потоків планети. Вони не володіють територіями. Вони володіють алгоритмами, що визначають, що люди бачать, читають, купують і в що вірять.\n\nДеніел Белл ще у 1973 році передбачив перехід до постіндустріального суспільства, де головний ресурс - інформація, а головні інститути - не заводи, а університети й дослідницькі лабораторії. Кастельс у 1990-х побачив, що це сталося, - але влада над інформацією сконцентрувалася зовсім не в університетах.\n\n> Стара влада контролювала місця. Нова влада контролює потоки. А потоки значно складніше оскаржити, ніж територію.\n\nЦе і є фундаментальне питання, що проходить через увесь курс: як влаштована влада у світі, де інформація - головний ресурс? Хто її контролює? Як вона концентрується? І що відбувається, коли кілька корпорацій захоплюють контроль над більшою частиною інформаційних потоків планети? Наступні глави - про це.", "tags": ["потоки", "суспільство", "влада"], "lensWeight": {"chronology": 4, "power": 5, "technology": 2, "media": 4, "privacy": 3}, "angDeg": 230.0, "sources": [{"title": "Клод Шеннон — A Mathematical Theory of Communication (1948)", "url": ""}, {"title": "Ваннівар Буш — As We May Think (1945)", "url": ""}, {"title": "Деніел Белл — The Coming of Post-Industrial Society (1973)", "url": ""}, {"title": "Елвін Тоффлер — The Third Wave (1980)", "url": ""}, {"title": "Маршалл Маклюен — Understanding Media (1964)", "url": ""}, {"title": "Ніколас Негропонте — Being Digital (1995)", "url": ""}, {"title": "Дуглас Рашкофф — Media Virus! (1994)", "url": ""}, {"title": "Стюарт Бренд — Information Wants to Be Free (1984)", "url": ""}, {"title": "Ерік Г'юз — A Cypherpunk's Manifesto (1993)", "url": ""}, {"title": "Мануель Кастельс — The Information Age (1996–1998)", "url": ""}], "era": "1996"}], "edges": [{"from": "scarcity", "to": "shannon", "label": "від дефіциту до вимірювання", "lenses": ["chronology", "technology"]}, {"from": "shannon", "to": "arpanet", "label": "сигнал стає мережею", "lenses": ["chronology", "technology"]}, {"from": "memex", "to": "open-web", "label": "гіпертекст стає Web", "lenses": ["chronology", "media", "technology"]}, {"from": "arpanet", "to": "open-web", "label": "стійкість плюс відкритість", "lenses": ["chronology", "power", "technology"]}, {"from": "open-web", "to": "atoms-to-bits", "label": "відкритість пришвидшує копіювання", "lenses": ["power", "technology"]}, {"from": "atoms-to-bits", "to": "castells", "label": "економіка перетворюється на потоки", "lenses": ["power", "media"]}, {"from": "media-effects", "to": "castells", "label": "медіа формують мережеве суспільство", "lenses": ["media", "power"]}, {"from": "arpanet", "to": "cypherpunks", "label": "мережа потребує захисту", "lenses": ["privacy", "technology", "power"]}, {"from": "cypherpunks", "to": "castells", "label": "приватність усередині потоків", "lenses": ["privacy", "power"]}, {"from": "scarcity", "to": "castells", "label": "від контролю доступу до контролю потоків", "lenses": ["power"]}], "ui": {"eyebrow": "Luminara · Основи", "sectionLenses": "Лінзи інтерпретації", "sectionScenes": "Сцени розділу", "detailLabel": "Деталь", "detailEmpty": "Обери вузол на карті — тут з’являться теза, інсайт, джерела й пов’язані ідеї. Лінзи вгорі змінюють, що підсвічується, і перефарбовують центр.", "related": "Пов’язані ідеї", "sources": "Джерела", "readScene": "Читати сцену", "centerLabel": "Центральна ідея", "progress": "Вивчено", "progressOf": "із", "openInLuminara": "Відкрити в Luminara", "close": "Закрити", "arpaTitle": "Міні-демо · маршрутизація пакета", "arpaNote": "Натисни «Надіслати пакет». Потім «Вимкнути вузол» — пакет знайде інший маршрут. У цьому й полягає мережа без єдиної точки відмови.", "arpaSend": "Надіслати пакет", "arpaFail": "Вимкнути вузол", "arpaReset": "Скинути", "arpaDemo": "ARPANET-демо", "typePower": "Влада", "typeTechnology": "Технології", "typeMedia": "Медіа", "typePrivacy": "Приватність", "typeEconomy": "Економіка", "chapterTitle": "До інтернету", "scene": "Сцена", "arpaRouting": "Пакет іде", "arpaNoRoute": "Маршрут недоступний: надто багато вузлів вимкнено.", "arpaDelivered": "доставлено", "arpaAria": "Перемаршрутизація пакета ARPANET", "initError": "Помилка ініціалізації"}};
function renderEmptyState(reason){const empty=document.querySelector(".empty-state"),svg=document.querySelector(".system-map");if(!empty||!svg)return;empty.hidden=false;svg.setAttribute("hidden","");empty.innerHTML=`<p>${reason}</p><a href="${CHAPTER_DATA.chapter.sourceUrl}" target="_blank" rel="noreferrer">Luminara</a>`;}
</script></head>
<body>
<main class="app-shell">
  <section class="control-rail">
    <div><p class="eyebrow">Luminara · Основи</p><h1 id="app-title">До інтернету</h1></div>
    <p class="chapter-lede">Як інформація стає владою — від дефіциту й сигналів до мережевого суспільства.</p>
    <div class="rail-rule"></div>
    <div><p class="section-h">Лінзи інтерпретації</p><div class="lens-group" style="margin-top:9px"></div><p class="lens-desc" style="margin-top:9px"></p></div>
    <div class="rail-rule"></div>
    <div class="progress-box"></div>
    <div><p class="section-h">Сцени розділу</p><nav class="node-list" style="margin-top:6px"></nav></div>
  </section>
  <section class="map-stage">
    <svg class="system-map" viewBox="0 0 1000 890" role="img" preserveAspectRatio="xMidYMid meet"><title id="map-title">До інтернету</title><desc id="map-desc">Інформація стає владою</desc></svg>
    <div class="empty-state" hidden></div>
  </section>
  <aside class="detail-panel"></aside>
</main>
<dialog class="scene-dialog"></dialog>
<script>
const state={lens:"chronology",selected:null,visited:new Set(),entered:false};
const byId=id=>CHAPTER_DATA.nodes.find(n=>n.id===id);
const SVGNS="http://www.w3.org/2000/svg";
const el=(t,a)=>{const e=document.createElementNS(SVGNS,t);for(const k in(a||{}))e.setAttribute(k,a[k]);return e;};
function typeColor(t){return{power:"#c0392b",technology:"#1f7a5a",media:"#b7791f",privacy:"#6b4fa0",economy:"#a04a7a"}[t]||"#b7791f";}
function typeLabel(t){const u=CHAPTER_DATA.ui;return{power:u.typePower,technology:u.typeTechnology,media:u.typeMedia,privacy:u.typePrivacy,economy:u.typeEconomy}[t]||"";}
function lensById(id){return CHAPTER_DATA.lenses.find(l=>l.id===id);}
function edgeActive(e){return e.lenses.includes(state.lens);}
function nodeWeight(n){return(n.lensWeight&&n.lensWeight[state.lens])||0;}
const CX=CHAPTER_DATA.chapter.centerX||500, CY=CHAPTER_DATA.chapter.centerY||445, RING=CHAPTER_DATA.chapter.ring||300;

function buildLenses(){
  const w=document.querySelector(".lens-group");w.innerHTML="";
  CHAPTER_DATA.lenses.forEach(l=>{const b=document.createElement("button");b.className="lens-btn";b.type="button";
    b.setAttribute("aria-pressed",String(l.id===state.lens));b.style.setProperty("--dot",l.accent);
    b.innerHTML=`<span class="lens-dot"></span>${l.label}`;b.addEventListener("click",()=>setLens(l.id));w.appendChild(b);});
}
function setLens(id){state.lens=id;const l=lensById(id);
  const d=document.querySelector(".lens-desc");if(d)d.textContent=l?l.description:"";
  document.querySelectorAll(".lens-btn").forEach((b,i)=>b.setAttribute("aria-pressed",String(CHAPTER_DATA.lenses[i].id===id)));
  renderAll();}

function curve(a,b){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;const dx=mx-CX,dy=my-CY,len=Math.hypot(dx,dy)||1;const bow=26;
  return `M ${a.x} ${a.y} Q ${mx+(dx/len)*bow} ${my+(dy/len)*bow} ${b.x} ${b.y}`;}

function defs(){
  const d=el("defs");
  const mk=(id,color)=>{const m=el("marker",{id,viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"});
    const p=el("path",{d:"M0 0 L10 5 L0 10 z",fill:color});m.appendChild(p);return m;};
  d.appendChild(mk("arrow-active", lensById(state.lens)?lensById(state.lens).accent:"#b7791f"));
  return d;
}

function renderMap(){
  const svg=document.querySelector(".system-map");if(!svg)return;
  [...svg.querySelectorAll("defs,g,.ring,.ring-tick,.era-label,.spoke")].forEach(n=>n.remove());
  svg.appendChild(defs());
  // rings
  const gDeco=el("g",{});
  [RING*0.55,RING].forEach(r=>gDeco.appendChild(el("circle",{class:"ring",cx:CX,cy:CY,r})));
  svg.appendChild(gDeco);
  // spokes + chronology era labels around outer ring
  const gSpoke=el("g",{});
  CHAPTER_DATA.nodes.forEach(n=>{
    gSpoke.appendChild(el("line",{class:"spoke",x1:CX,y1:CY,x2:n.x,y2:n.y}));
  });
  svg.appendChild(gSpoke);

  // edges (with directional arrows on active)
  const gE=el("g",{});
  CHAPTER_DATA.edges.forEach(e=>{const a=byId(e.from),b=byId(e.to);if(!a||!b)return;
    const active=edgeActive(e);const g=el("g",{class:"edge"+(active?" active":"")});
    if(active)g.style.setProperty("--dot",lensById(state.lens).accent);
    const d=curve(a,b);const p=el("path",{d});
    // approximate length for draw animation
    const len=Math.round(Math.hypot(b.x-a.x,b.y-a.y)*1.15);
    p.style.setProperty("--len",len);
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const lb=el("text",{class:"edge-label",x:mx,y:my-5,"text-anchor":"middle"});lb.textContent=e.label;
    g.appendChild(p);g.appendChild(lb);gE.appendChild(g);});
  svg.appendChild(gE);

  // center (breathing, lens-tinted ring)
  const gC=el("g",{});
  gC.style.setProperty("--dot", lensById(state.lens)?lensById(state.lens).accent:"#b7791f");
  gC.appendChild(el("circle",{class:"center-halo",cx:CX,cy:CY,r:78}));
  gC.appendChild(el("circle",{class:"center-ring",cx:CX,cy:CY,r:72}));
  gC.appendChild(el("circle",{class:"center-disc",cx:CX,cy:CY,r:66}));
  const t2=el("text",{class:"center-t2",x:CX,y:CY-20});t2.textContent=CHAPTER_DATA.ui.centerLabel;gC.appendChild(t2);
  wrapText(gC,CHAPTER_DATA.chapter.centralIdea,CX,CY+2,120,"center-t1",17);
  svg.appendChild(gC);

  // nodes with smart outward labels + era
  const gN=el("g",{});
  CHAPTER_DATA.nodes.forEach((n,i)=>{
    const g=el("g",{class:"node"+(state.selected===n.id?" selected":""),tabindex:"0",role:"button","aria-label":`${n.sceneIndex+1}. ${n.title} (${n.era||""})`});
    g.style.setProperty("--dot",typeColor(n.type));
    g.style.setProperty("--ox",n.x+"px");g.style.setProperty("--oy",n.y+"px");
    if(!state.entered) g.style.setProperty("--delay",(0.15+i*0.06)+"s"); else g.style.animation="none",g.style.opacity="1";
    if(state.selected){const linked=CHAPTER_DATA.edges.some(e=>(e.from===state.selected&&e.to===n.id)||(e.to===state.selected&&e.from===n.id));
      if(n.id!==state.selected&&!linked)g.classList.add("dim");}
    else if(nodeWeight(n)<=1){g.classList.add("dim");}
    g.appendChild(el("circle",{class:"halo",cx:n.x,cy:n.y,r:34}));
    g.appendChild(el("circle",{class:"disc",cx:n.x,cy:n.y,r:26}));
    const num=el("text",{class:"num",x:n.x,y:n.y});num.textContent=String(n.sceneIndex+1);g.appendChild(num);

    // smart label placement: outward along the radius from center
    const dx=n.x-CX,dy=n.y-CY,len=Math.hypot(dx,dy)||1;
    const ux=dx/len,uy=dy/len;
    const lx=n.x+ux*40, ly=n.y+uy*40;
    // anchor by horizontal side
    const anchor = ux>0.25?"start":(ux<-0.25?"end":"middle");
    const era=el("text",{class:"era",x:lx,y:ly-13,"text-anchor":anchor});era.textContent=n.era||"";g.appendChild(era);
    const kick=el("text",{class:"kicker",x:lx,y:ly-1,"text-anchor":anchor});kick.textContent=typeLabel(n.type);g.appendChild(kick);
    wrapTextAnchored(g,n.shortTitle,lx,ly+13,150,"cap",13,anchor);

    g.addEventListener("click",()=>selectNode(n.id));
    g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();selectNode(n.id);}});
    gN.appendChild(g);
  });
  svg.appendChild(gN);
  state.entered=true;
}
function wrapText(parent,text,x,y,maxw,cls,fs){wrapTextAnchored(parent,text,x,y,maxw,cls,fs,"middle");}
function wrapTextAnchored(parent,text,x,y,maxw,cls,fs,anchor){
  const words=String(text).split(/\s+/);const lines=[];let line="";
  const approx=s=>s.length*(fs*0.56);
  words.forEach(w=>{const t=line?line+" "+w:w;if(approx(t)>maxw&&line){lines.push(line);line=w;}else line=t;});
  if(line)lines.push(line);const total=(lines.length-1)*(fs+2);
  lines.forEach((ln,i)=>{const t=el("text",{class:cls,x,y:y-total/2+i*(fs+2),"text-anchor":anchor});t.textContent=ln;parent.appendChild(t);});
}

function renderNodeList(){const nav=document.querySelector(".node-list");if(!nav)return;nav.innerHTML="";
  CHAPTER_DATA.nodes.slice().sort((a,b)=>a.sceneIndex-b.sceneIndex).forEach(n=>{
    const b=document.createElement("button");b.type="button";b.setAttribute("aria-current",String(state.selected===n.id));b.style.setProperty("--dot",typeColor(n.type));
    b.innerHTML=`<span class="node-idx">${String(n.sceneIndex+1).padStart(2,"0")}</span><span>${n.shortTitle}</span>`;
    b.addEventListener("click",()=>selectNode(n.id));nav.appendChild(b);});}
function renderProgress(){const box=document.querySelector(".progress-box");if(!box)return;
  const total=CHAPTER_DATA.nodes.length,seen=state.visited.size;
  box.innerHTML=`${CHAPTER_DATA.ui.progress} ${seen} ${CHAPTER_DATA.ui.progressOf} ${total}<div class="progress-bar"><div class="progress-fill" style="width:${Math.round(seen/total*100)}%"></div></div>`;}
function firstSentence(txt){return String(txt).replace(/^##[^\n]*\n+/,"").split(/(?<=[.!?])\s/)[0]||"";}
function renderDetail(){const p=document.querySelector(".detail-panel");if(!p)return;
  if(!state.selected){p.innerHTML=`<p class="eyebrow">${CHAPTER_DATA.ui.detailLabel}</p><p class="detail-empty">${CHAPTER_DATA.ui.detailEmpty}</p>`;return;}
  const n=byId(state.selected);const c=typeColor(n.type);
  const related=CHAPTER_DATA.edges.filter(e=>e.from===n.id||e.to===n.id).map(e=>({node:byId(e.from===n.id?e.to:e.from),label:e.label})).filter(x=>x.node);
  const srcs=(n.sources||[]).slice(0,10);
  p.innerHTML=`<p class="detail-kicker" style="--dot:${c}">${CHAPTER_DATA.ui.scene} ${n.sceneIndex+1} · ${typeLabel(n.type)}${n.era?" · "+n.era:""}</p>
    <h3 class="detail-title">${n.title}</h3>
    <p class="detail-thesis">${firstSentence(n.body)}</p>
    <p class="detail-insight" style="--dot:${c}">${n.insight}</p>
    <div class="chips">${(n.tags||[]).map(t=>`<span class="chip">${t}</span>`).join("")}</div>
    <div class="related"><h4>${CHAPTER_DATA.ui.related}</h4><div class="related-list">
      ${related.map(r=>`<button type="button" data-go="${r.node.id}">${r.node.shortTitle} · <span style="color:var(--muted)">${r.label}</span></button>`).join("")}</div></div>
    ${srcs.length?`<div class="sources-block"><h4>${CHAPTER_DATA.ui.sources} (${srcs.length})</h4><ol>${srcs.map(s=>`<li>${s.url?`<a href="${s.url}" target="_blank" rel="noreferrer">${s.title}</a>`:s.title}</li>`).join("")}</ol></div>`:""}
    <div class="panel-actions"><button class="btn primary" type="button" data-full="${n.id}">${CHAPTER_DATA.ui.readScene}</button>
      ${n.id==="arpanet"?'<button class="btn" type="button" data-arpa="1">${CHAPTER_DATA.ui.arpaDemo}</button>':""}</div>`;
  p.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>selectNode(b.getAttribute("data-go"))));
  p.querySelector("[data-full]").addEventListener("click",()=>renderFullScene(n.id));
  const ad=p.querySelector("[data-arpa]");if(ad)ad.addEventListener("click",()=>renderFullScene("arpanet",true));}
function selectNode(id){state.selected=id;state.visited.add(id);renderAll();}

function mdToHtml(md){return String(md).split(/\n{2,}/).map(b=>{b=b.trim();if(!b)return"";
  if(b.startsWith("## "))return`<h2>${b.slice(3)}</h2>`;return`<p>${b.replace(/\*([^*]+)\*/g,"<em>$1</em>")}</p>`;}).join("");}
function renderFullScene(id,openArpa){const n=byId(id);if(!n)return;const dlg=document.querySelector(".scene-dialog");const isArpa=n.id==="arpanet";const c=typeColor(n.type);const srcs=(n.sources||[]);
  dlg.innerHTML=`<div class="dialog-inner"><button class="dialog-close" aria-label="${CHAPTER_DATA.ui.close}" type="button">×</button>
    <p class="detail-kicker" style="--dot:${c}">${CHAPTER_DATA.ui.scene} ${n.sceneIndex+1} · ${typeLabel(n.type)}${n.era?" · "+n.era:""}</p>
    <h3>${n.title}</h3><div class="dialog-body">${mdToHtml(n.body)}</div>
    <p class="detail-insight" style="--dot:${c}">${n.insight}</p>${isArpa?arpaMarkup():""}
    ${srcs.length?`<div class="sources-block"><h4>${CHAPTER_DATA.ui.sources}</h4><ol>${srcs.map(s=>`<li>${s.url?`<a href="${s.url}" target="_blank" rel="noreferrer">${s.title}</a>`:s.title}</li>`).join("")}</ol></div>`:""}
    <div class="panel-actions"><a class="btn" href="${CHAPTER_DATA.chapter.sourceUrl}" target="_blank" rel="noreferrer">${CHAPTER_DATA.ui.openInLuminara}</a>
      <button class="btn primary" type="button" data-close>${CHAPTER_DATA.ui.close}</button></div></div>`;
  const close=()=>dlg.close();dlg.querySelector(".dialog-close").addEventListener("click",close);dlg.querySelector("[data-close]").addEventListener("click",close);
  if(typeof dlg.showModal==="function")dlg.showModal();else dlg.setAttribute("open","");
  if(isArpa){wireArpanet(dlg);if(openArpa)setTimeout(()=>runArpanetPacketDemo(dlg),300);}}
function arpaMarkup(){return `<div class="arpa-wrap"><h4>${CHAPTER_DATA.ui.arpaTitle}</h4>
  <svg class="arpa-svg arpa-net" viewBox="0 0 460 160" role="img" aria-label="${CHAPTER_DATA.ui.arpaAria}"></svg>
  <p class="arpa-note">${CHAPTER_DATA.ui.arpaNote}</p>
  <div class="panel-actions"><button class="btn primary" type="button" data-send>${CHAPTER_DATA.ui.arpaSend}</button>
    <button class="btn" type="button" data-fail>${CHAPTER_DATA.ui.arpaFail}</button><button class="btn" type="button" data-reset>${CHAPTER_DATA.ui.arpaReset}</button></div></div>`;}
const ARPA={hosts:{A:{x:40,y:80,label:"A"},B:{x:170,y:38,label:"B"},C:{x:170,y:122,label:"C"},D:{x:300,y:80,label:"D"},E:{x:420,y:80,label:"E"}},
  links:[["A","B"],["A","C"],["B","D"],["C","D"],["D","E"]],down:new Set(),
  route(){const P=[["A","B","D","E"],["A","C","D","E"]];for(const p of P)if(p.every(h=>!this.down.has(h)))return p;return null;}};
function drawArpa(svg){svg.innerHTML="";const mk=(t,a)=>{const e=document.createElementNS(SVGNS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  ARPA.links.forEach(([f,t])=>{const A=ARPA.hosts[f],B=ARPA.hosts[t];svg.appendChild(mk("line",{x1:A.x,y1:A.y,x2:B.x,y2:B.y}));});
  Object.entries(ARPA.hosts).forEach(([id,h])=>{svg.appendChild(mk("circle",{cx:h.x,cy:h.y,r:16,class:ARPA.down.has(id)?"down":"host"}));const t=mk("text",{x:h.x,y:h.y+4});t.textContent=h.label;svg.appendChild(t);});}
function wireArpanet(dlg){const svg=dlg.querySelector(".arpa-net");ARPA.down=new Set();drawArpa(svg);
  dlg.querySelector("[data-send]").addEventListener("click",()=>runArpanetPacketDemo(dlg));
  dlg.querySelector("[data-fail]").addEventListener("click",()=>{ARPA.down.add("B");drawArpa(svg);dlg.querySelector(".arpa-note").textContent=(CHAPTER_DATA.ui.arpaFailNote||"Node B down; routes via C.");});
  dlg.querySelector("[data-reset]").addEventListener("click",()=>{ARPA.down=new Set();drawArpa(svg);dlg.querySelector(".arpa-note").textContent=(CHAPTER_DATA.ui.arpaResetNote||"Network restored.");});}
function runArpanetPacketDemo(dlg){dlg=dlg||document.querySelector(".scene-dialog");const svg=dlg.querySelector(".arpa-net");if(!svg)return;drawArpa(svg);
  const path=ARPA.route();const note=dlg.querySelector(".arpa-note");if(!path){if(note)note.textContent=CHAPTER_DATA.ui.arpaNoRoute;return;}
  for(let i=0;i<path.length-1;i++){const A=ARPA.hosts[path[i]],B=ARPA.hosts[path[i+1]];
    [...svg.querySelectorAll("line")].forEach(ln=>{const s=(+ln.getAttribute("x1")===A.x&&+ln.getAttribute("y1")===A.y&&+ln.getAttribute("x2")===B.x&&+ln.getAttribute("y2")===B.y)||(+ln.getAttribute("x1")===B.x&&+ln.getAttribute("y1")===B.y&&+ln.getAttribute("x2")===A.x&&+ln.getAttribute("y2")===A.y);if(s)ln.classList.add("path-active");});}
  if(note)note.textContent=CHAPTER_DATA.ui.arpaRouting+": "+path.join(" → ");
  const pkt=document.createElementNS(SVGNS,"circle");pkt.setAttribute("r","5");pkt.setAttribute("class","packet");svg.appendChild(pkt);
  let seg=0,t=0;function step(){if(seg>=path.length-1){pkt.remove();if(note)note.textContent+="  ✓ "+CHAPTER_DATA.ui.arpaDelivered;return;}
    const A=ARPA.hosts[path[seg]],B=ARPA.hosts[path[seg+1]];t+=0.04;pkt.setAttribute("cx",A.x+(B.x-A.x)*t);pkt.setAttribute("cy",A.y+(B.y-A.y)*t);if(t>=1){t=0;seg++;}requestAnimationFrame(step);}
  requestAnimationFrame(step);}
function renderAll(){renderMap();renderNodeList();renderDetail();renderProgress();}
async function boot(){buildLenses();setLens(state.lens);}
document.addEventListener("DOMContentLoaded",()=>{try{boot();}catch(e){renderEmptyState(CHAPTER_DATA.ui.initError+": "+e.message);}});
</script>
</body></html>
