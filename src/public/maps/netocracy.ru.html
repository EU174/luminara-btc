"luminara", "label": "құзырет арқылы шығу", "lenses": ["class", "competence"]}]}, "uz": {"chapter": {"key": "netocracy", "title": "Netokratiya", "lede": "Hokimiyat arxitekturani tushunadiganlarda. Kirish toʻsigʻi pul emas, tushunish.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=netocracy", "centralIdea": "Hokimiyat arxitekturani tushunadiganlarda", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "diagnosis", "label": "Tashxis", "accent": "#7dd3fc", "description": "Toffler: uchinchi toʻlqin hokimiyat tarqalishini emas, uning yangi jamlanishini berdi."}, {"id": "class", "label": "Sinf", "accent": "#f87171", "description": "Netokrat va konsyumatariat: besh belgi va ishtirok illyuziyasi."}, {"id": "competence", "label": "Kompetensiya", "accent": "#34d399", "description": "Uch daraja: arxitekturani tushunish → eʼtiborni boshqarish → infratuzilma."}, {"id": "exit", "label": "Chiqish", "accent": "#c084fc", "description": "Srinivasan: tarmoq davlatlari va parallel tizimlar keyingi siljish sifatida."}, {"id": "ethics", "label": "Etika", "accent": "#fbbf24", "description": "Frankl: soʻnggi erkinlik — munosabatni tanlash. Etikasiz tushunish boʻsh."}], "nodes": [{"id": "toffler", "sceneIndex": 0, "type": "power", "shortTitle": "Toffler", "era": "1980", "lensWeight": {"diagnosis": 5, "class": 3, "competence": 1, "exit": 2, "ethics": 1}, "title": "Toffler haq edi — lekin oxirigacha emas", "insight": "Toffler uchinchi to'lqinni to'g'ri topdi, ammo oqibat borasida adashdi: axborotning markazlashmaganlashuvi hokimiyatning markazlashmaganlashuvini emas, uning yangi konsentratsiya turini yaratdi — ko'rinmas va shu sababli xavfliroq.", "thesis": "Toffler uchinchi to'lqinni to'g'ri topdi, ammo oqibat borasida adashdi: axborotning markazlashmaganlashuvi hokimiyatning markazlashmaganlashuvini emas, uning yangi konsentratsiya turini yaratdi — ko'rinmas va shu sababli xavfliroq.", "body": "## Halqa yopildi\n\nBiz bu kursni Tofflerdan boshlagan edik. Unga qaytaylik — u nimani to'g'ri topganini, nimani topa olmaganini va bu nega muhimligini tushunish uchun.\n\n1980-yilda Alvin Toffler \"Uchinchi to'lqin\"ni yozdi — industrial dunyoning muqarrar transformatsiyasi haqidagi kitob. Uning bashoratlari o'z davri uchun jasur edi. Ishlab chiqarish personallashtiriladi — hamma uchun standart tovarlar davri tugaydi. Ishlab chiqaruvchi va iste'molchi o'rtasidagi chegara yo'qoladi — prosumer, bir vaqtning o'zida yaratadigan va iste'mol qiladigan odam paydo bo'ladi. An'anaviy iyerarxiyalar — korporatsiyalar, davlatlar, kasaba uyushmalari — yangi tarmoq tuzilmalari tomonidan buziladi.\n\nBularning hammasi amalga oshdi. Netflix algoritmi kontentni individual tanlaydi. YouTube foydalanuvchisi bir vaqtning o'zida tomosha qiladi va yaratadi. Ikki kishilik startup korporatsiya bilan raqobatlasha oladi. Anonim dasturchi milliardlab qiymatga ega protokol yaratadi — va bu 2020-yillar haqiqati.\n\nAmmo Toffler oqibat borasida prinsipial xatoga yo'l qo'ydi. U axborotning markazlashmaganlashuvi hokimiyatning markazlashmaganlashuviga olib keladi deb o'yladi. Mantiq temirdek ko'rinardi: agar bilim endi elita monopoliyasi bo'lmasa, hokimiyat ham monopoliya bo'lishdan to'xtaydi.\n\nBunday bo'lmadi.\n\n## Shaklan markazlashmaganlashuv, mohiyatan konsentratsiya\n\nHokimiyat markazlashmaganlashdi — lekin Toffler o'ylagandek emas. U davlatlardan korporatsiyalarga o'tdi. Korporatsiyalardan platformalarga. Platformalardan esa algoritmlar va e'tiborni boshqara oladiganlarga o'tdi.\n\nBeshta texnologiya kompaniyasi har kuni milliardlab odam ko'radigan narsalarning katta qismini nazorat qiladi. Bir nechta algoritm qaysi g'oyalar tarqalishini, qaysilari ko'rinmay qolishini belgilaydi. Bu shaklan markazlashmaganlashuv — Kremlda hech kim o'tirib, nimani efirga uzatishni hal qilmayapti. Va mohiyatan konsentratsiya — algoritmlarning bir nechta me'mori sayyoraning axborot realligini belgilaydi.\n\nToffler prosumer-ni ham bashorat qilgan — bir vaqtning o'zida ishlab chiqaradigan va iste'mol qiladigan odamni. Bu borada ham u haq edi. Ammo bu farq yangi sinfiy yoriqqa aylanishini oldindan ko'ra olmadi. Ayrimlar tarmoqlarda qiymat yaratadi va uni qaytarib oladi: tokenlar orqali, ta'sir orqali, daromad orqali. Boshqalar esa tarmoqlarda qiymat yaratadi va ishtirok illyuziyasidan boshqa hech narsa olmaydi.\n\nManuel Castells bu mantiqni akademik aniqlik bilan tasdiqladi: tarmoq jamiyatida hokimiyat — kommunikatsiya ustidan hokimiyatdir. Tarmoqlar orqali qaysi xabarlar o'tishini, qanday kontekstda, qanday vazn bilan o'tishini kim nazorat qilsa, jamoaviy ongni o'sha shakllantiradi. Bu sovetcha turdagi propaganda emas. Bu e'tibor arxitekturasi. Algoritm nima o'ylashni aytmaydi. U qaysi fikrlarni eng ko'p uchratishingizni hal qiladi.\n\n> Toffler 1980-yilda uchinchi to'lqinni aniq bashorat qildi. Ammo oqibat borasida adashdi: axborotning markazlashmaganlashuvi hokimiyatning markazlashmaganlashuviga olib kelmadi. U konsentratsiyaning yangi turini yaratdi — ko'rinmas va shu sababli xavfliroq.\n\nBu xato muhim. Chunki aynan uni tuzatish — Web3-ning markaziy vazifasi. Shunchaki texnologik markazlashmaganlashuv emas. Hokimiyatning real markazlashmaganlashuvi: ochiq protokollar orqali, aktivlarga egalik qilish orqali, code ichidagi shaffof qoidalar orqali.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1%80%D0%BE%D0%BA%20%D0%B4%D0%BB%D1%8F%20XXI%20%D0%B2%D0%B5%D0%BA%D0%B0%20%282018%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман, Дэвид Лайон — Liquid Surveillance (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netokratiya", "hokimiyat", "tarix", "tarmoqlar"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "netocrat", "sceneIndex": 1, "type": "media", "shortTitle": "Netokrat", "era": "2000", "lensWeight": {"diagnosis": 3, "class": 5, "competence": 4, "exit": 2, "ethics": 1}, "title": "Bard va Soderqvist: netokrat anatomiyasi", "insight": "Bard va Soderqvist netokratni besh xususiyat orqali tasvirladi: e'tibor kapitali, tarmoq identifikatsiyasi, kuratorlik, aloqalar arxitekturasi, ma'nolar yaratish. Kirish to‘sig‘i — pul emas, tushunish.", "thesis": "Bard va Soderqvist netokratni besh xususiyat orqali tasvirladi: e'tibor kapitali, tarmoq identifikatsiyasi, kuratorlik, aloqalar arxitekturasi, ma'nolar yaratish. Kirish to‘sig‘i — pul emas, tushunish.", "body": "## Juda erta yozilgan kitob\n\n2000-yilda Alexander Bard va Jan Soderqvist “Netocracy”ni nashr qildi. Vaqt nihoyatda noqulay edi: internet pufagi endigina yorilgan, minglab kompaniyalar bankrot bo‘lgan, “yangi iqtisodiyot”dan umumiy hafsala pir bo‘lish avjiga chiqqan edi. Hech kim tarmoq davrining yangi elitalari haqida eshitishni istamasdi. Kitob deyarli e'tiborsiz qoldi.\n\nYigirma besh yil o‘tib, u biz yashayotgan dunyoning aniq xaritasi kabi o‘qiladi.\n\nBard va Soderqvistning markaziy tezisi shunday: har bir iqtisodiy tizim o‘z hukmron sinfini yaratadi. Feodalizm aristokratiyani — yerga egalik qilganlarni yaratdi. Sanoat kapitalizmi burjuaziyani — kapital, zavodlar, banklarga egalik qilganlarni yaratdi. Axborot davri netokratiyani — e'tiborga egalik qiladigan va tarmoqlarni boshqarishni biladiganlarni yaratadi.\n\nBu metafora ham, sotsiologik abstraksiya ham emas. Bu ayni paytda ishlayotgan aniq hokimiyat mexanizmining tavsifi.\n\n## Netokratning besh xususiyati\n\nBard va Soderqvist netokratni bir qator xususiyatlar orqali tasvirlaydi — ularning har biri sanoat davrida qadrlangan narsalarga zid turadi.\n\n**E'tibor kapitali.** Netokratning asosiy resursi pul ham emas, bilimning o‘zi ham emas. Bu e'tiborni boshqarish qobiliyati: o‘zinikini ham, boshqalarnikini ham. Axborot mo‘l-ko‘l dunyoda tanqis narsa kontent emas, e'tibordir. Netokrat uni jamlashni, yo‘naltirishni va monetizatsiya qilishni biladi. U millionlarning e'tibori hozir qayerda ekanini — va uni kerakli narsaga qanday jalb qilishni biladi.\n\n**Tarmoq identifikatsiyasi.** Netokrat maqomni institutlar orqali emas, tarmoqlar orqali quradi. Uning qiymati kompaniyadagi lavozim, diplom yoki unvonlar bilan emas — aloqalarining sifati, hamjamiyatlardagi obro‘si, axborot oqimlariga ta'siri bilan belgilanadi. U internetda anonim bo‘lishi — va salmoqli CVga ega yirik korporatsiya direktoridan ko‘ra ko‘proq real hokimiyatga ega bo‘lishi mumkin.\n\n**Iste'molchi emas, kurator.** Axborot cheksiz ko‘p bo‘lgan dunyoda muhim narsani tanlay oladigan va shovqinni filtrlab tashlay oladigan kishi ulkan hokimiyatga ega bo‘ladi. Netokrat axborotni shunchaki iste'mol qilmaydi — uni saralaydi, talqin qiladi va tarqatadi. Uning ishi ham shu: o‘z auditoriyasi uchun ishonchli filtr bo‘lish.\n\n**Aloqalar arxitekturasi.** Netokrat tushunadi: tarmoqning qiymati uning ishtirokchilariga bog‘liq. U munosabatlarga strategik investitsiya qiladi — eski ma'nodagi oddiy “networking” bilan cheklanmay, aloqalar arxitekturasini quradi. Kerakli odamlarga kerakli paytda kirish imkoniyati har qanday boshqa resursdan muhimroq. Bu sinizm emas — dunyo aslida qanday ishlashini tushunish.\n\n**Ma'nolar yaratuvchisi.** Faktlar hamma uchun ochiq bo‘lgan dunyoda hokimiyat faktlarga kontekst beradigan kishiga tegishli. Ular nimani anglatishini tushuntiradigan kishiga. Boshqalar voqelikni ko‘radigan ramkani shakllantiradigan kishiga. Netokrat shunchaki xabarchi emas. U narrativlar yaratadi.\n\nCastells buni tasdiqlaydi: tarixda kommunikatsiyani nazorat qilgan tomon doimo g‘alaba qilgan. O‘rta asrlarda Cherkov — savodxonlik va qo‘lyozmalar orqali. Burjuaziya — bosma stanok orqali. Sanoat elitalari — ommaviy axborot vositalari orqali. Endi netokratlar algoritmlar, protokollar va markazlashmagan tarmoqlarni o‘zlashtirmoqda. Vositalar o‘zgaradi — mantiq bitta.\n\n> Netokrat albatta boy yoki mashhur odam bo‘lishi shart emas. Bu tarmoqlar qanday ishlashini tushunadigan va ularda strategik harakat qila oladigan odam. E'tibor kapitali, tarmoq identifikatsiyasi, ma'nolar yaratish — uning haqiqiy aktivlari shular.\n\nMuhim: Bard va Soderqvist ta'kidlaydi — netokratiya kelib chiqish bo‘yicha yopiq klub emas. Bu ochiq sinf, unga kirish to‘sig‘i pul yoki tug‘ma aloqalar bilan emas, tushunish bilan belgilanadi. Bu aristokratiya va burjuaziyadan prinsipial farqidir.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netokratiya", "hokimiyat", "identiklik", "tarmoqlar"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "consumtariat", "sceneIndex": 2, "type": "privacy", "shortTitle": "Konsyumatariat", "era": "ishtirok illyuziyasi", "lensWeight": {"diagnosis": 3, "class": 5, "competence": 3, "exit": 1, "ethics": 2}, "title": "Konsyumatariat: ishtirok illyuziyasi", "insight": "Konsyumatariat — tarmoqlarda qiymat ishlab chiqarib, buni tushunmaydiganlar. Layklar va izohlar orqali ishtirok illyuziyasi — ushlab turishning arxitekturaviy mexanizmi. Anglash — chiqish yoʻlidagi birinchi qadam.", "thesis": "Konsyumatariat — tarmoqlarda qiymat ishlab chiqarib, buni tushunmaydiganlar. Layklar va izohlar orqali ishtirok illyuziyasi — ushlab turishning arxitekturaviy mexanizmi. Anglash — chiqish yoʻlidagi birinchi qadam.", "body": "## Koʻrish qiyinroq boʻlgan yangi tengsizlik\n\nBard va Söderqvist ogohlantirgan: axborot inqilobi hammaga avtomatik ravishda ozodlik bermaydi. U tengsizlikning yangi turini yaratadi — mulkiy tengsizlikdan koʻra ilgʻash qiyinroq, shuning uchun xavfliroq.\n\nKonsyumatariat iqtisodiy maʼnodagi oddiy “isteʼmolchilar” emas. Bular tarmoqlarda faol ishtirok etadigan, kontent yaratadigan, platformalar bilan oʻzaro aloqaga kirishadigan odamlar — va shu bilan birga aslida nima boʻlayotganini tushunmaydi. Ular oʻzini koʻngil ochyapmiz yoki muloqot qilyapmiz deb oʻylaydi. Aslida esa boshqalar uchun qiymat ishlab chiqaradi.\n\nMexanizmni qadamma-qadam tahlil qil. Facebook foydalanuvchisi surat joylaydi. U vaqtini (qayta tiklanmaydigan resurs), ijodiy energiyasini, shaxsiy maʼlumotlarini sarflaydi. Facebook kontent oladi (u boshqa foydalanuvchilarni jalb qiladi), uning xatti-harakati haqidagi maʼlumotlarni oladi (reklama beruvchilar uchun qimmatli xomashyo), reklama inventarini oladi (eʼtiborni monetizatsiya qilish). Foydalanuvchi layklar oladi — yaʼni Skinner boʻyicha oʻzgaruvchan mustahkamlash, bu uni qaytib kelishga va yanada koʻproq ishlab chiqarishga majbur qiladi.\n\nBu bitimda netokrat kim? Facebook — u arxitekturani tushunadi va uni oʻz manfaatlari yoʻlida quradi. Konsyumatariat kim? Foydalanuvchi — u shartlarni tushunmasdan ishtirok etadi.\n\nBoshqa misolga qarang. TikTok foydalanuvchisi kuniga 90 daqiqa video tomosha qiladi. TikTok oladi: uning afzalliklari haqidagi maʼlumotlar (aniq psixologik profil), reklama daromadi (eʼtiborni monetizatsiya qilish), algoritmni oʻqitish uchun signallar (u aqlliroq va aniqroq boʻlib boradi). Foydalanuvchi oladi: koʻngilocharlik va oʻzgaruvchan mustahkamlashdan keladigan dofamin portlashlari. Bu yerda kim kim uchun ishlayapti?\n\n## Soxta ishtirok tuzogʻi\n\nBard va Söderqvist tasvirlagan eng makkor mexanizm — ishtirok illyuziyasi. Aynan shu narsa konsyumatariatni oʻz holatini anglamagan holda tizim ichida ushlab turadi.\n\nKonsyumatariat oʻzini faol ishtirokchi deb his qiladi. U layklar bilan ovoz beradi — taʼsir hissi. U izohlar yozadi — ovozim bor degan hissiyot. U kontent ulashadi — ahamiyat hissi. Unga oʻz axborot makonida boʻlayotgan narsalarga taʼsir qilayotgandek tuyuladi. Aslida u maʼlumotlar yaratadi, netokratlar — algoritm yaratuvchilari, platforma egalari — shu maʼlumotlar asosida u ertaga nimani koʻrishi haqida haqiqiy qarorlarni qabul qiladi.\n\nBu fitna emas. Bu arxitektura. Platformalar haqiqiy huquqlarni minimal darajada qoldirib, ishtirok hissini maksimal qilish uchun loyihalangan. Siz profilingizga “egasiz” — lekin platforma uni ogohlantirmasdan oʻchirib yuborishi mumkin. Siz kontent “yaratasiz” — lekin uni kim koʻrishini algoritm hal qiladi. Siz doʻstlaringiz bilan “muloqot qilasiz” — lekin ular haqida nimani bilishingizni va axborotni qaysi tartibda olishingizni platforma nazorat qiladi.\n\nMichel Foucault panoptikonni tasvirlagan — mahbuslar ayni paytda kuzatilayotgan-kuzatilmayotganini bilmaydigan ideal qamoqxona. Natijada ular oʻzini doim kuzatilayotgandek tutadi. Oʻzini-oʻzi senzura qilish ichki mexanizmga aylanadi. Bauman va Lyon “Liquid Surveillance” asarida koʻrsatgan: zamonaviy kuzatuv ham xuddi shunday ishlaydi — faqat ixtiyoriy ravishda. Har bir qadamingizni kuzatadigan ilovalarni oʻrnatishga sizni hech kim majburlamaydi. Buni oʻzingiz qilasiz. Chunki qulay. Chunki hamma shunday qiladi. Chunki aks holda ijtimoiy hayotdan chetda qolasiz.\n\nZuboff buni “behavioral surplus” deb atagan: odamlar tarmoqdagi harakatlari bilan yaratadigan qiymat platformalar tomonidan olib qoʻyiladi va sotiladi. Konsyumatariat shu ortiqchani ishlab chiqaradi — bu tizimdagi oʻzining asosiy funksiyasi ekanini anglamagan holda.\n\n> Konsyumatariat — “internetdan foydalanishni bilmaydiganlar” emas. Bu internetdan uning arxitekturasini tushunmasdan foydalanadiganlar. Ishtirok illyuziyasi — sizdan foydalanadigan tizimda ushlab turishning eng samarali mexanizmi.\n\nBu mexanizmni tushunish — konsyumatariatdan chiqish yoʻlidagi birinchi qadam. Platformalardan voz kechish emas, balki ularga munosabatni oʻzgartirish. “Men servisdan foydalanaman”dan “men bu servis uchun nima bilan toʻlayotganimni va bunga arziydimi-yoʻqmi tushunaman”ga oʻtish.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D 20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netokratiya", "diqqat", "platformalar", "hokimiyat"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "levels", "sceneIndex": 3, "type": "technology", "shortTitle": "Uch daraja", "era": "kompetensiya", "lensWeight": {"diagnosis": 1, "class": 3, "competence": 5, "exit": 3, "ethics": 2}, "title": "Netokratik kompetensiyaning uch darajasi", "insight": "Netokratiyaning uch darajasi: arxitekturani tushunish → e'tiborni boshqarish → infratuzilma yaratish. Netokratiya — ochiq sinf. Kirish to'sig'i — pul yoki kelib chiqish emas, tushunish.", "thesis": "Netokratiyaning uch darajasi: arxitekturani tushunish → e'tiborni boshqarish → infratuzilma yaratish. Netokratiya — ochiq sinf. Kirish to'sig'i — pul yoki kelib chiqish emas, tushunish.", "body": "## Netokratiya — ochiq sinf\n\nKompetensiya darajalarini tasvirlashdan oldin Bard va Zoderkvist aytgan prinsipial bir fikrni takrorlash muhim: netokratiya kelib chiqish bo'yicha yopiq klub emas.\n\nAristokratiya qonga qurilgan edi: to'g'ri oilada tug'ilish kerak edi. Burjuaziya kapitalga qurilgan edi: uni meros qilib olish yoki jamg'arish kerak edi. Netokratiya tushunishga quriladi. Tushunishni esa egallash mumkin.\n\nMoskvadagi professorning o'g'li tarmoqlarni tushunmay, ularni shunchaki iste'mol qilsa, konsyumatariat bo'lib ulg'ayishi mumkin. Kichik shahardan chiqqan, formal ta'limi bo'lmagan odam esa tarmoqlar qanday ishlashini atrofidagilardan oldin tushunsa, netokratga aylanishi mumkin.\n\nBu ta'lim haqidagi suhbatni tubdan o'zgartiradi. Harari *XXI asr uchun 21 saboq* asarida XXI asrda aynan nimani tushunish kerakligini ifodalagan: faktlarni emas — ularni soniyalar ichida topish mumkin. Bilim qanday yaratilishini tushunish kerak. Muayyan narrativlarni kim va nima uchun yaratadi. Algoritmlar reallikni qanday shakllantiradi. Manipulyatsiyani axborotdan qanday ajratish mumkin. Netokrat savodxonligi degani shu.\n\n## Birinchi daraja: arxitekturani tushunish\n\nBu poydevor. Sen tarmoqlar qanday ishlashini bilasan — texnik ma'noda emas, iqtisodiy va hokimiyat ma'nosida.\n\nSen tarmoq effektlarini va ular nega monopoliyalar yaratishini tushunasan. Platformalar nega \"bepul\" ekanini va evaziga nima olishini bilasan. Algoritmlarni sehr sifatida emas, aniq metrikalarni optimallashtirish sifatida tushunasan — va har bir platforma qaysi metrikalarni optimallashtirishini bilasan. Aktivlarni kastodial va nokastodial saqlash o'rtasidagi farqni bilasan. Smart contract nima ekanini va bu hokimiyat munosabatlarini nega o'zgartirishini tushunasan.\n\nBu daraja zarur, lekin yetarli emas. Harakatsiz tushunish hech narsani o'zgartirmaydi. Ammo tushunishsiz har qanday harakat ko'r-ko'rona bo'ladi.\n\nAytgancha: sen hozirgina senga shu birinchi darajani bergan kursni yakunlading. Shannon va axborot matematikasidan tokenomika va DAO-gacha. Bu tasodif emas — bu kurs arxitekturasi.\n\n## Ikkinchi daraja: e'tiborni boshqarish\n\nBu ko'nikma darajasi — tushunish harakatga aylangan payt.\n\nO'z e'tiboringni boshqarish: sen algoritmlarga sening o'rningga nima muhimligini hal qilishga yo'l qo'ymaysan. Vaqtni nimaga sarflashni ongli ravishda tanlaysan — bu asosiy qayta tiklanmaydigan resurs. Platforma o'zgaruvchan mustahkamlash orqali seni manipulyatsiya qilishga urinayotganini tushunasan va bu halqadan chiqa olasan.\n\nBoshqalarning e'tiborini boshqarish: sen tarqaladigan ma'nolarni yaratishni bilasan. G'oyalar atrofida hamjamiyatlar qurishni bilasan. Odamlar keyinga uzatishni xohlaydigan narrativlarni shakllantira olasan. Bu manipulyatsiya emas — bu ko'pchilik odamlar ko'tarilmaydigan darajadagi kommunikatsiya.\n\nBu darajada sen auditoriyalar qura olasan, hamjamiyatlarga ta'sir o'tkaza olasan, o'z bilim va aloqalaringni bevosita monetizatsiya qila olasan — platforma algoritmi orqali emas.\n\n## Uchinchi daraja: infratuzilma yaratish\n\nBu arxitektor darajasi. Sen mavjud tarmoqlardan shunchaki foydalanmaysan — yangilarini qurasan.\n\nIshtirokchilar manfaatlarini muvozanatlashtiradigan protokollar yaratasan va stimullarni loyihalaysan. Ishtirokchilarni faqat foydalanuvchi emas, hammulkdorga aylantiradigan DAO va tokenomika qurasan. Umumiy identiklik va iqtisodiyotga ega hamjamiyatlar yaratasan — u yerda mansublik real qiymatga ega.\n\nBu darajada sen o'zing qoidalar manbaiga aylanasan. Sen birovning qoidalari bo'yicha o'ynamaysan — boshqalar harakat qiladigan muhitni loyihalaysan.\n\nKo'pchilik odamlar hech qachon birinchi darajadan yuqoriga ko'tarilmaydi — qodir emasligi uchun emas. Balki bu zinaning mavjudligini bilmagani uchun. Endi sen bilasan.\n\n> Netokratik kompetensiyaning uch darajasi: arxitekturani tushunish → e'tiborni boshqarish → infratuzilma yaratish. Birinchi darajadagi ko'pchilik ikkinchi va uchinchi daraja haqida bilmaydi. Sen hozirgina bilding.\n\nChris Dixon *Read Write Own* asarida internetning uch davrini fe'llar orqali tasvirlagan: o'qish (Web1), yozish (Web2), egalik qilish (Web3). Netokratiyaning uch darajasi ham shu. Ko'pchilik o'qiydi. Kamroq odam yozadi. Sanoqlilar egalik qiladi. Egalik davriga ochilgan oyna aynan hozir ochiq.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1% uvga ega tarmoq hamjamiyatlarini yaratishdir. Netokratlar parallel tizimlar quradi.", "body": "## Netokratik mantiqning eng radikal versiyasi\n\nBalaji Srinivasan — serial tadbirkor, Coinbase sobiq CTOsi, texnologiya dunyosidagi eng provokatsion mutafakkirlardan biri. 2022 yilda u «The Network State» kitobini nashr qildi. Bu kitob netokratik mantiqning eng radikal versiyasini taklif qiladi: keyingi siyosiy siljish mavjud davlatlarni isloh qilish emas, yangilarini yaratishdir.\n\nBu ilmiy fantastikadek eshitiladi. Srinivasan taʼkidlaydi: bu tarixiy pretsedentlarga asoslangan ratsional prognoz.\n\nUning dalili quyidagi mantiqqa quriladi. Davlatlar abadiy tuzilmalar emas. Ular tarix davomida paydo bo‘lgan va yo‘qolgan. Yangi davlatlarning paydo bo‘lishi esa deyarli hech qachon bitta qolip bo‘yicha kechmagan: inqilob -> eʼlon qilish -> tan olinishi. Ko‘pincha bu — rasmiy siyosiy shakllanishdan ancha oldin identiklik, iqtisodiyot va hamjamiyatni bosqichma-bosqich qurishdir.\n\nIsroil davlat sifatida 1948 yilda paydo bo‘lgan emas — u bundan o‘nlab yillar oldin umumiy identiklik va umumiy loyiha atrofidagi hamjamiyat sifatida qurilgan. Singapur bugungi holiga Li Kuan Yu maʼlum turdagi odamlarni jalb qilgan va boshqalarni chetlatgan rag‘batlar tizimini yaratgani uchun keldi. Har qanday mamlakat — avvalo umumiy qoidalar, identiklik va iqtisodiyotga ega koordinatsiya qurilmasidir.\n\n## Tarmoq davlati qanday ko‘rinadi\n\nSrinivasan aniq qadamlar ketma-ketligini tasvirlaydi.\n\nAvval — umumiy qadriyatlarga ega onlayn hamjamiyat. Twitterdagi shunchaki obunachilar emas. Hayot qanday tashkil etilishi kerakligi haqidagi haqiqiy umumiy eʼtiqodlar birlashtirgan odamlar guruhi: taʼlimga, sog‘liqqa, ishga, boshqaruvga munosabat.\n\nKeyin — umumiy iqtisodiyot. Tokenlar, DAO, hamjamiyat ichida qiymat almashish bo‘yicha o‘zaro kelishuvlar. Hamjamiyat aʼzolari bir-biri bilan savdo qilishni afzal ko‘ra boshlaydi.\n\nKeyin — jismoniy anklavlar. Hamjamiyat aʼzolari yonma-yon yashay boshlaydi — avval tajriba sifatida, keyin turmush tarzi sifatida. Ularni majburlashgani uchun emas, bu hayot sifatini oshirgani uchun: yon-atrofda qadriyatlari yaqin odamlar bo‘ladi.\n\nKeyin — diplomatik tan olinishi. Hamjamiyat yetarli hajm va taʼsirga erishganda, davlatlar u bilan siyosiy subyekt sifatida munosabat qila boshlaydi.\n\nBu reja emas — model. Ayrim elementlar allaqachon mavjud: o‘z iqtisodiyotiga ega kripto hamjamiyatlar, jismoniy uchrashuvlar uchun call-to-action, umumiy qadriyatlar va identiklik.\n\nTimothy Snyder «The Road to Unfreedom»da shu tanganing boshqa tomoni haqida ogohlantiradi: avtoritar rejimlar ham tarmoq hokimiyatini o‘zlashtirib oldi. Senzura orqali emas — dezinformatsiya, eʼtiborni manipulyatsiya qilish, haqiqat va yolg‘on ajralmay qoladigan axborot xaosini yaratish orqali. Netokratiya — neytral vosita. U ikki tomonga ham ishlaydi.\n\n> Srinivasan netokratik mantiqning keyingi darajasini taklif qiladi: tarmoqlarni shunchaki tushunish va ulardan foydalanish emas, balki ularning asosida yangi siyosiy tuzilmalar qurish. Netokratlar mavjud tizimlarning isloh qilinishini kutmaydi. Ular parallel tizimlar quradi.\n\nBu albatta yangi davlat yaratishni anglatmaydi. Aksariyat netokratlar uchun bu shuni anglatadi: shunchaki auditoriyalar emas, haqiqiy identiklik va iqtisodiyotga ega hamjamiyatlar qurish. O‘z aloqalaring infratuzilmasini platformalardan ijaraga olmay, unga egalik qilish.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%8 0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netokratiya", "boshqaruv", "hamjamiyat", "tarmoqlar"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "frankl", "sceneIndex": 5, "type": "privacy", "shortTitle": "Frankl", "era": "soʻnggi tanlov", "lensWeight": {"diagnosis": 1, "class": 1, "competence": 2, "exit": 2, "ethics": 5}, "title": "Frankl va oxirgi tanlov", "insight": "Frankl: oxirgi erkinlik — vaziyatlarga munosabatni tanlash. Sen raqamli davr sharoitlarini tanlamagansan. Lekin ular bilan nima qilishni sen tanlaysan. Etikasiz tushunish — maqsadsiz vosita.", "thesis": "Frankl: oxirgi erkinlik — vaziyatlarga munosabatni tanlash. Sen raqamli davr sharoitlarini tanlamagansan. Lekin ular bilan nima qilishni sen tanlaysan. Etikasiz tushunish — maqsadsiz vosita.", "body": "## Konslagerdan chiqqan faylasuf\n\nViktor Frankl — avstriyalik psixiatr. 1942 yilda u natsistlarning konsentratsion lagerlariga deportatsiya qilindi. Auschwitz, Dachau va boshqa lagerlardan o‘tdi. Xotinidan, ota-onasidan, akasidan ayrildi. Tasvirini jismoniy reaksiya sezmasdan o‘qish qiyin bo‘lgan sharoitlarda uch yil yashadi.\n\n1945 yilda ozodlikka chiqqach, u to‘qqiz kun ichida «Man's Search for Meaning» kitobini yozdi. Bu XX asrning eng taʼsirli kitoblaridan biriga va sen tanlamagan tizimlar sharoitida inson bo‘lish nimani anglatishini tushunish uchun eng muhim kitoblardan biriga aylandi.\n\nFranklning tasavvur qilishning o‘zi qiyin bo‘lgan sharoitlarda qilgan asosiy kuzatuvi shunday: insondan oxirgi erkinlikni tortib olib bo‘lmaydi. Boshqa hamma narsani olish mumkin — jismoniy erkinlikni, mulkni, yaqinlarni, boshqalar ko‘zidagi qadr-qimmatni. Lekin vaziyatlarga munosabatingni tanlash erkinligini olib bo‘lmaydi. Har qanday sharoitda stimul va reaksiya orasida makon qoladi. Va shu makonda — inson qadr-qimmati bor.\n\n## Frankl nega bu yerda\n\nInternet va netokratiya haqidagi kursning final bobida konslagerdan chiqqan faylasuf nega kerak?\n\nChunki bu butun kurs sen tanlamagan sharoitlar haqida edi.\n\nSen smartfonlar va algoritmlar davrida tug‘ilishni tanlamagansan. Sening ongli roziligingsiz vaqtingni monetizatsiya qiladigan eʼtibor iqtisodiyotini tanlamagansan. Skinnerning o‘zgaruvchan mustahkamlashi orqali loyihalangan ijtimoiy tarmoqlar arxitekturasini tanlamagansan. Hokimiyatning bir nechta platformalar qo‘lida jamlanishini tanlamagansan.\n\nSen bu sharoitlarni tanlamagansan. Lekin bu bilim bilan nima qilishni sen tanlaysan.\n\nFrankl boshqa kontekst haqida yozgan — taqqoslab bo‘lmaydigan darajada shafqatsiz kontekst haqida. Ammo uning prinsipi universal: vaziyat sharoitlarni belgilaydi, inson esa sharoitlarga javobni belgilaydi. Seni konsyumtariat yoki netokrat qiladigan narsa sharoitlar emas. Buni sening tanloving qiladi.\n\n## Masʼuliyatsiz erkinlik — erkinlik emas\n\nBu kontekstda Franklning yana bir muhim o‘lchami bor.\n\nU shunday yozgan: masʼuliyatsiz erkinlik — o‘zboshimchalik. Haqiqiy erkinlik — tanlovlaring oqibatlari uchun masʼuliyat bilan bog‘langan erkinlikdir.\n\nTimothy Snyder ogohlantirgan: ayni netokratik mantiq — tarmoqlarni tushunish, eʼtiborni boshqarish, narrativlar yaratish — demokratiyani yemirish, dezinformatsiya tarqatish, odamlarni keng miqyosda manipulyatsiya qilish uchun ishlatilishi mumkin. Avtoritar rejimlar buni tushundi va foydalanmoqda.\n\nO‘z tizimlarining oqibatlarini tushunmasdan, etik kompassiz tizimlar quradigan netokrat Web2 platformalarida biz tanqid qilgan o‘sha muammolarni qayta ishlab chiqaradi. Faqat tezroq, chunki u arxitekturani yaxshiroq tushunadi. Va kattaroq miqyosda.\n\nTushunish — vosita. Har qanday vosita kabi, uning o‘z etikasi yo‘q. Bolg‘adan qurish uchun ham, buzish uchun ham foydalanish mumkin. Tarmoqlar arxitekturasini bilish imkoniyatlarni tenglashtiradigan ochiq tizimlar yaratish uchun ham, yanada murakkab manipulyatsiya tizimlarini yaratish uchun ham ishlatilishi mumkin.\n\nFrankl lagerda odamlarning ikki turini ham kuzatgan: noinsoniy sharoitlarda qadr-qimmatini saqlab, boshqalarga yordam berganlarni ham, xuddi shu sharoitlarda xiyonat qilib, zaiflardan foydalanganlarni ham. Sharoitlar bir xil edi. Tanlovlar — har xil.\n\n> Frankl shunday ifodalagan: insonning oxirgi erkinligi — vaziyatlarga munosabatini tanlash. Sen raqamli davr sharoitlarini tanlamagansan. Lekin ular bilan nima qilishni sen tanlaysan. Va qanday qilishni ham.\n\nBu kursning final mulohazasi. Texnik emas. Iqtisodiy emas. Insoniy. Netokratiya — ochiq sinf, kirish to‘sig‘i — tushunish. Ammo etikasisiz tushunish — maqsadsiz vosita. Nima qurishing — faqat o‘zingga bog‘liq.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%2 иксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netokratiya", "falsafa", "etika", "erkinlik"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "luminara", "sceneIndex": 6, "type": "power", "shortTitle": "Keyin nima?", "era": "→harakat", "lensWeight": {"diagnosis": 2, "class": 3, "competence": 5, "exit": 4, "ethics": 4}, "title": "Luminara: oxirigacha o‘qiding. Keyin nima?", "insight": "Sen netokratik kompetensiyaning birinchi darajasini yakunlading — arxitekturani tushunish. Ikkinchi daraja: eʼtiborni boshqarish. Uchinchi: infratuzilma yaratish. Keyingi kurs — harakat qilishni tanlaydiganlar uchun.", "thesis": "Sen netokratik kompetensiyaning birinchi darajasini yakunlading — arxitekturani tushunish. Ikkinchi daraja: eʼtiborni boshqarish. Uchinchi: infratuzilma yaratish. Keyingi kurs — harakat qilishni tanlaydiganlar uchun.", "body": "## Bu kursning yashirin maqsadi\n\nBu kurs «Yangi internet asoslari» deb nomlangan edi. Sakkiz bob. Shannon matematikasidan Nakamoto blockchainigacha. Ilk forumlardan TikTokgacha. Erkin bilim orzusidan kuzatuv kapitalizmigacha — va undan Web3 qurayotgan yangi arxitekturagacha.\n\nAmmo kursning yashirin maqsadi bor edi, endi uni ochiq aytish mumkin.\n\nBiz internet qanday ishlashini shunchaki tushuntirmadik. Biz seni tanlovga tayyorladik.\n\nKonsyumtariat va netokratiya o‘rtasidagi tanlovga. Tarmoqlarda yashab, ularning arxitekturasini tushunmaydiganlar bilan tushunib, ongli harakat qiladiganlar o‘rtasidagi tanlovga. Platformalar uchun qiymat ishlab chiqarib, ishtirok illyuziyasidan boshqa hech narsa olmaydiganlar bilan platformalar quradigan, ulardagi o‘z ulushini boshqaradigan yoki hech bo‘lmaganda «bepul» servislar uchun nima bilan to‘layotganini tushunadiganlar o‘rtasidagi tanlovga.\n\n## Bu kursdan nima olding\n\nBard va Zoderqvist netokratik kompetensiyaning birinchi darajasini arxitekturani tushunish deb taʼriflagan. Sen undan o‘tding.\n\nSen axborot nega hokimiyatning asosiy resursiga aylanganini tushunasan — Shannondan Castellsga qadar. Web1 ochiq internetni qanday yaratganini va nega uning ochiqligi foydalanuvchilarga qarshi ishlatilganini bilasan. Eʼtibor iqtisodiyoti va kuzatuv kapitalizmi mexanikasini tushunasan — Simondan Zuboffgacha. Algoritmlar filter pufaklarini qanday yaratishini va jamiyatni qanday qutblashtirishini ko‘rasan — va bu yovuz niyat emas, jalb qilishga optimallashtirishning arxitekturaviy oqibati ekanini tushunasan. Web 3.0 va Web3 o‘rtasidagi farqni bilasan. Private key nima ekanini va nima uchun «not your keys — not your coins» muhimligini tushunasan. Smart contractlar, DeFi va DAO qanday ishlashini bilasan. Netokratiya va konsyumtariat nima ekanini — va hozir qaysi darajada turganingni tushunasan.\n\nBu birinchi daraja. Zarur. Ammo yetarli emas.\n\n## Keyingi qadam\n\nChris Dixon internetning uch davrini tasvirlagan: o‘qish, yozish, egalik qilish. Sen bu davrlar haqidagi kursni o‘qiding. Endi keyingi feʼlga o‘tish vaqti.\n\nNetokratik kompetensiyaning ikkinchi darajasi — eʼtiborni boshqarish. Maʼnolar yaratish, hamjamiyatlar qurish, bilim va aloqalarni bevosita monetizatsiya qilish qobiliyati. O‘z eʼtiboringni algoritmlarga topshirmasdan, uni ongli yo‘naltirish qobiliyati.\n\nUchinchi daraja — infratuzilma yaratish. Protokollar, tokenomika, DAO, raqamli identiklik. Qoidalarni o‘zing belgilaydigan tizimlar arxitekturasi.\n\nLuminara keyingi kurslarni aynan shu uchun qurmoqda. Sen «kriptani tushunishing» uchun emas, abstrakt maʼnoda emas. Balki ikkinchi va uchinchi darajada harakat qila olishing uchun. Aniq vositalarni tushunish. Ulardan foydalanish. Ularning asosida qurish.\n\nBard va Zoderqvist yozgan: netokratiya — ochiq sinf. Kirish to‘sig‘i — tushunish. Va ko‘pchilikdan uzoqroq o‘rganishga bo‘lgan istak.\n\nSen bepul kursni oxirigacha o‘qib chiqding. Bu allaqachon signal — ko‘pchilik oxirigacha yetib bormaydi. Ko‘pchilik o‘qimasdan skroll qiladi. Ko‘pchilik isteʼmol qiladi — va savol bermaydi.\n\nSen savol berasan.\n\n> Frankl yozgan: har qanday vaziyatda insonda oxirgi erkinlik bor — ularga munosabatini tanlash. Sen raqamli davr sharoitlarini tanlamagansan. Lekin ular bilan nima qilishni sen tanlaysan. Keyingi kurs — harakat qilishni tanlaydiganlar uchun.\n\nLuminara-ga xush kelibsan.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0% %D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netokratiya", "Luminara", "Web3", "taʼlim"], "x": 265.5, "y": 258.0, "angDeg": 218.6}], "edges": [{"from": "toffler", "to": "netocrat", "label": "yangi jamlanish oʼz sinfini topdi", "lenses": ["diagnosis", "class"]}, {"from": "netocrat", "to": "consumtariat", "label": "sinf qarama-qarshisi bilan belgilanadi", "lenses": ["class"]}, {"from": "consumtariat", "to": "levels", "label": "anglash — chiqish sari birinchi qadam", "lenses": ["class", "competence"]}, {"from": "netocrat", "to": "levels", "label": "kirish toʼsigʼi — tushunish", "lenses": ["class", "competence"]}, {"from": "levels", "to": "srinivasan", "label": "infratuzilma davlatlar quradi", "lenses": ["competence", "exit"]}, {"from": "srinivasan", "to": "luminara", "label": "parallel tizimlar allaqachon qurilmoqda", "lenses": ["exit", "competence"]}, {"from": "levels", "to": "frankl", "label": "tushunish tanlovni talab qiladi", "lenses": ["competence", "ethics"]}, {"from": "frankl", "to": "luminara", "label": "etikasiz tushunish — maqsadsiz vosita", "lenses": ["ethics"]}, {"from": "toffler", "to": "frankl", "label": "shartlarni sen tanlamading — javobni tanlaysan", "lenses": ["diagnosis", "ethics"]}, {"from": "consumtariat", "to": "luminara", "label": "kompetensiya orqali chiqish", "lenses": ["class", "competence"]}]}, "es": {"chapter": {"key": "netocracy", "title": "Netocracia", "lede": "El poder está en quienes entienden la arquitectura. La barrera de entrada es entender, no el dinero.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=netocracy", "centralIdea": "El poder está en quienes entienden la arquitectura", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "diagnosis", "label": "Diagnóstico", "accent": "#7dd3fc", "description": "Toffler: la tercera ola no trajo dispersión del poder, sino una nueva concentración."}, {"id": "class", "label": "Clase", "accent": "#f87171", "description": "Netócrata contra consumtariado: cinco rasgos y la ilusión de participar."}, {"id": "competence", "label": "Competencia", "accent": "#34d399", "description": "Tres niveles: entender la arquitectura → gestionar la atención → infraestructura."}, {"id": "exit", "label": "Salida", "accent": "#c084fc", "description": "Srinivasan: estados en red y sistemas paralelos como el siguiente cambio."}, {"id": "ethics", "label": "Ética", "accent": "#fbbf24", "description": "Frankl: la última libertad es elegir la actitud. Entender sin ética está vacío."}], "nodes": [{"id": "toffler", "sceneIndex": 0, "type": "power", "shortTitle": "Toffler", "era": "1980", "lensWeight": {"diagnosis": 5, "class": 3, "competence": 1, "exit": 2, "ethics": 1}, "title": "Toffler tenía razón, pero no del todo", "insight": "Toffler acertó con la tercera ola, pero se equivocó en la consecuencia: la descentralización de la información no creó una descentralización del poder, sino un nuevo tipo de concentración, invisible y por eso más peligrosa.", "thesis": "Toffler acertó con la tercera ola, pero se equivocó en la consecuencia: la descentralización de la información no creó una descentralización del poder, sino un nuevo tipo de concentración, invisible y por eso más peligrosa.", "body": "## El ciclo se cerró\n\nEmpezamos este curso con Toffler. Volvamos a él para entender qué acertó, qué no, y por qué importa.\n\nEn 1980, Alvin Toffler escribió \"La tercera ola\", un libro sobre la transformación inevitable del mundo industrial. Sus predicciones fueron audaces para su época. La producción se volvería personalizada: el fin de la era de los bienes estándar para todos. La frontera entre productor y consumidor se desdibujaría: aparecería el prosumer, la persona que crea y consume al mismo tiempo. Las jerarquías tradicionales —corporaciones, Estados, sindicatos— serían derribadas por nuevas estructuras de red.\n\nTodo eso se cumplió. El algoritmo de Netflix elige contenido de forma individual. Un usuario de YouTube mira y crea al mismo tiempo. Una startup de dos personas puede competir con una corporación. Un desarrollador anónimo crea un protocolo valorado en miles de millones, y esa es la realidad de la década de 2020.\n\nPero Toffler cometió un error fundamental en la consecuencia. Pensó que la descentralización de la información llevaría a la descentralización del poder. La lógica parecía de hierro: si el conocimiento ya no era monopolio de la élite, el poder también dejaría de serlo.\n\nEso no ocurrió.\n\n## Descentralización en la forma, concentración en el fondo\n\nEl poder se descentralizó, pero no como Toffler pensaba. Pasó de los Estados a las corporaciones. De las corporaciones a las plataformas. De las plataformas a quienes saben gestionar algoritmos y atención.\n\nCinco empresas tecnológicas controlan gran parte de lo que ven miles de millones de personas cada día. Unos pocos algoritmos determinan qué ideas se difunden y cuáles permanecen invisibles. Esta es descentralización en la forma: nadie está sentado en el Kremlin decidiendo qué emitir. Y concentración en el fondo: unos pocos arquitectos de algoritmos definen la realidad informativa del planeta.\n\nToffler también predijo el prosumer, la persona que produce y consume al mismo tiempo. También acertó ahí. Pero no previó que esa distinción se convertiría en una nueva fractura de clase. Que unos producirían valor en las redes y lo recuperarían: mediante tokens, influencia e ingresos. Y que otros producirían valor en las redes y no recibirían nada salvo la ilusión de participar.\n\nManuel Castells confirmó esta lógica con precisión académica: en una sociedad en red, el poder es poder sobre la comunicación. Quien controla qué mensajes pasan por las redes, en qué contexto y con qué peso, modela la conciencia colectiva. Esto no es propaganda al estilo soviético. Es arquitectura de la atención. El algoritmo no te dice qué pensar. Decide qué ideas encontrarás con más frecuencia.\n\n> Toffler predijo con precisión la tercera ola en 1980. Pero se equivocó en la consecuencia: la descentralización de la información no llevó a la descentralización del poder. Creó un nuevo tipo de concentración, invisible y por eso más peligroso.\n\nEste error importa. Porque corregirlo es la tarea central de Web3. No solo descentralización tecnológica. Descentralización real del poder: mediante protocolos abiertos, propiedad de activos y reglas transparentes en el code.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B
