enses": ["class", "competence"]}, {"from": "levels", "to": "srinivasan", "label": "la infraestructura construye estados", "lenses": ["competence", "exit"]}, {"from": "srinivasan", "to": "luminara", "label": "los sistemas paralelos ya se están construyendo", "lenses": ["exit", "competence"]}, {"from": "levels", "to": "frankl", "label": "entender exige elegir", "lenses": ["competence", "ethics"]}, {"from": "frankl", "to": "luminara", "label": "entender sin ética es una herramienta sin propósito", "lenses": ["ethics"]}, {"from": "toffler", "to": "frankl", "label": "no elegiste las condiciones; eliges la respuesta", "lenses": ["diagnosis", "ethics"]}, {"from": "consumtariat", "to": "luminara", "label": "salida mediante competencia", "lenses": ["class", "competence"]}]}, "fr": {"chapter": {"key": "netocracy", "title": "Netocratie", "lede": "Le pouvoir appartient à ceux qui comprennent l’architecture. La barrière d’entrée est la compréhension, pas l’argent.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=netocracy", "centralIdea": "Le pouvoir appartient à ceux qui comprennent l’architecture", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "diagnosis", "label": "Diagnostic", "accent": "#7dd3fc", "description": "Toffler : la troisième vague n’a pas dispersé le pouvoir, elle l’a concentré autrement."}, {"id": "class", "label": "Classe", "accent": "#f87171", "description": "Netocrate contre consumtariat : cinq caractéristiques et l’illusion de participation."}, {"id": "competence", "label": "Compétence", "accent": "#34d399", "description": "Trois niveaux : comprendre l’architecture → gérer l’attention → l’infrastructure."}, {"id": "exit", "label": "Sortie", "accent": "#c084fc", "description": "Srinivasan : États-réseaux et systèmes parallèles comme prochain basculement."}, {"id": "ethics", "label": "Éthique", "accent": "#fbbf24", "description": "Frankl : la dernière liberté est le choix de l’attitude. Comprendre sans éthique est vide."}], "nodes": [{"id": "toffler", "sceneIndex": 0, "type": "power", "shortTitle": "Toffler", "era": "1980", "lensWeight": {"diagnosis": 5, "class": 3, "competence": 1, "exit": 2, "ethics": 1}, "title": "Toffler avait raison, mais pas complètement", "insight": "Toffler a bien vu la troisième vague, mais s'est trompé sur la conséquence : la décentralisation de l'information n'a pas créé une décentralisation du pouvoir, mais un nouveau type de concentration, invisible et donc plus dangereux.", "thesis": "Toffler a bien vu la troisième vague, mais s'est trompé sur la conséquence : la décentralisation de l'information n'a pas créé une décentralisation du pouvoir, mais un nouveau type de concentration, invisible et donc plus dangereux.", "body": "## La boucle est bouclée\n\nNous avons commencé ce cours avec Toffler. Revenons à lui pour comprendre ce qu'il a vu juste, ce qu'il a manqué, et pourquoi cela compte.\n\nEn 1980, Alvin Toffler a écrit « La troisième vague », un livre sur la transformation inévitable du monde industriel. Ses prédictions étaient audacieuses pour l'époque. La production deviendrait personnalisée : la fin de l'ère des biens standard pour tout le monde. La frontière entre producteur et consommateur s'effacerait : le prosumer apparaîtrait, la personne qui crée et consomme en même temps. Les hiérarchies traditionnelles — les entreprises, les États, les syndicats — seraient détruites par de nouvelles structures en réseau.\n\nTout cela s'est réalisé. L'algorithme de Netflix choisit le contenu individuellement. Un utilisateur de YouTube regarde et crée en même temps. Une startup de deux personnes peut concurrencer une entreprise. Un développeur anonyme crée un protocole qui vaut des milliards, et c'est la réalité des années 2020.\n\nMais Toffler s'est trompé sur une conséquence fondamentale. Il pensait que la décentralisation de l'information mènerait à la décentralisation du pouvoir. La logique semblait imparable : si le savoir n'était plus le monopole de l'élite, le pouvoir cesserait lui aussi d'être un monopole.\n\nCela ne s'est pas produit.\n\n## Décentralisation en apparence, concentration en substance\n\nLe pouvoir s'est décentralisé, mais pas comme Toffler l'imaginait. Il est passé des États aux entreprises. Des entreprises aux plateformes. Des plateformes à ceux qui savent gérer les algorithmes et l'attention.\n\nCinq entreprises technologiques contrôlent la majeure partie de ce que voient chaque jour des milliards de personnes. Quelques algorithmes décident quelles idées se diffusent et lesquelles restent invisibles. C'est une décentralisation en apparence : personne n'est assis au Kremlin en train de décider quoi diffuser. Et une concentration en substance : quelques architectes d'algorithmes définissent la réalité informationnelle de la planète.\n\nToffler a aussi prédit le prosumer, la personne qui produit et consomme en même temps. Il avait raison là aussi. Mais il n'a pas vu que cette distinction deviendrait une nouvelle ligne de fracture sociale. Que certains produiraient de la valeur dans les réseaux et la récupéreraient : par des tokens, par de l'influence, par du revenu. Tandis que d'autres produiraient de la valeur dans les réseaux et ne recevraient rien, sinon l'illusion de participer.\n\nManuel Castells a confirmé cette logique avec une précision universitaire : dans une société en réseau, le pouvoir, c'est le pouvoir sur la communication. Celui qui contrôle quels messages passent par les réseaux, dans quel contexte, avec quel poids, façonne la conscience collective. Ce n'est pas de la propagande à la soviétique. C'est l'architecture de l'attention. L'algorithme ne vous dit pas quoi penser. Il décide quelles idées vous croiserez le plus souvent.\n\n> Toffler a correctement prédit la troisième vague en 1980. Mais il s'est trompé sur la conséquence : la décentralisation de l'information n'a pas conduit à la décentralisation du pouvoir. Elle a créé un nouveau type de concentration, invisible et donc plus dangereux.\n\nCette erreur compte. Parce que la corriger est la tâche centrale de Web3. Pas seulement une décentralisation technologique. Une véritable décentralisation du pouvoir : grâce à des protocoles ouverts, à la propriété des actifs et à des règles transparentes dans le code.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1%80%D0%BE%D0%BA%20%D0%B4%D0%BB%D1%8F%20XXI%20%D0%B2%D0%B5%D0%BA%D0%B0%20%282018%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман, Дэвид Лайон — Liquid Surveillance (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netocratie", "pouvoir", "histoire", "réseaux"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "netocrat", "sceneIndex": 1, "type": "media", "shortTitle": "Netocrate", "era": "2000", "lensWeight": {"diagnosis": 3, "class": 5, "competence": 4, "exit": 2, "ethics": 1}, "title": "Bard et Soderqvist : l'anatomie d'un netocrate", "insight": "Bard et Soderqvist ont décrit le netocrate à travers cinq caractéristiques: capital attentionnel, identité en réseau, curatelle, architecture des liens et création de sens. La barrière d'entrée est la compréhension, pas l'argent.", "thesis": "Bard et Soderqvist ont décrit le netocrate à travers cinq caractéristiques: capital attentionnel, identité en réseau, curatelle, architecture des liens et création de sens. La barrière d'entrée est la compréhension, pas l'argent.", "body": "## Un livre écrit trop tôt\n\nEn 2000, Alexander Bard et Jan Soderqvist ont publié Netocracy. Le timing était catastrophique : la bulle internet venait d'éclater, des milliers d'entreprises avaient fait faillite, et la désillusion générale envers la \"nouvelle économie\" avait atteint son paroxysme. Personne ne voulait entendre parler de nouvelles élites de l'ère des réseaux. Le livre a pratiquement été ignoré.\n\nVingt-cinq ans plus tard, il se lit comme une carte exacte du monde dans lequel nous vivons.\n\nLa thèse centrale de Bard et Soderqvist est la suivante : chaque système économique produit sa propre classe dirigeante. Le féodalisme a produit l'aristocratie, ceux qui possédaient la terre. Le capitalisme industriel a produit la bourgeoisie, ceux qui possédaient le capital, les usines, les banques. L'ère de l'information produit la netocratie, ceux qui possèdent l'attention et savent gérer les réseaux.\n\nCe n'est ni une métaphore ni une abstraction sociologique. C'est la description d'un mécanisme de pouvoir concret, à l'œuvre ici et maintenant.\n\n## Cinq caractéristiques du netocrate\n\nBard et Soderqvist décrivent le netocrate à travers un ensemble de caractéristiques, et chacune d'elles contraste avec ce qui était valorisé à l'ère industrielle.\n\n**Capital attentionnel.** La ressource principale du netocrate n'est ni l'argent, ni le savoir en soi. C'est la capacité à gérer l'attention: la sienne et celle des autres. Dans un monde d'abondance informationnelle, la ressource rare n'est pas le contenu mais l'attention. Un netocrate sait la concentrer, la diriger et la monétiser. Il sait où se trouve l'attention de millions de personnes à l'instant présent, et comment l'orienter vers ce qui compte.\n\n**Identité en réseau.** Un netocrate construit son statut par les réseaux, et non par les institutions. Sa valeur n'est pas déterminée par un poste dans une entreprise, ni par un diplôme, ni par des titres, mais par la qualité de ses liens, sa réputation dans les communautés et son influence sur les flux d'information. Il peut être anonyme sur internet et avoir plus de pouvoir réel que le directeur d'une grande entreprise au CV impressionnant.\n\n**Curateur, pas consommateur.** Dans un monde où l'information est infinie, celui qui sait choisir ce qui compte et filtrer le bruit détient un pouvoir immense. Le netocrate ne se contente pas de consommer l'information: il la sélectionne, l'interprète et la diffuse. C'est son travail: être un filtre fiable pour son audience.\n\n**Architecture des liens.** Le netocrate comprend que la valeur d'un réseau dépend de ses participants. Il investit dans les relations de manière stratégique, en construisant une architecture de liens plutôt qu'en se contentant de \"networker\" au sens ancien. Avoir accès aux bonnes personnes au bon moment compte plus que n'importe quelle autre ressource. Ce n'est pas du cynisme, c'est comprendre comment le monde fonctionne réellement.\n\n**Créateur de sens.** Dans un monde où les faits sont accessibles à tous, le pouvoir appartient à celui qui donne du contexte aux faits. À celui qui explique ce qu'ils signifient. À celui qui façonne le cadre à travers lequel les autres voient la réalité. Le netocrate n'est pas seulement un informateur. Il crée des récits.\n\nCastells le confirme: tout au long de l'histoire, a toujours gagné celui qui contrôlait la communication. L'Église au Moyen Âge, par l'alphabétisation et les manuscrits. La bourgeoisie, par l'imprimerie. Les élites industrielles, par les médias de masse. Maintenant, les netocrates maîtrisent les algorithmes, les protocoles et les réseaux décentralisés. Les outils changent, la logique reste la même.\n\n> Un netocrate n'est pas nécessairement une personne riche ou célèbre. C'est quelqu'un qui comprend comment fonctionnent les réseaux et sait y agir stratégiquement. Capital attentionnel, identité en réseau, création de sens: voilà ses véritables actifs.\n\nImportant: Bard et Soderqvist soulignent que la netocratie n'est pas un club fermé par l'origine. C'est une classe ouverte, dont la barrière d'entrée est définie par la compréhension, et non par l'argent ou les liens de naissance. C'est sa différence fondamentale avec l'aristocratie et la bourgeoisie.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1%80%D0%BE%D0%BA%20%D0%B4%D0%BB%D1%8F%20XXI%20%D0%B2%D0%B5%D0%BA%D0%B0%20%282018%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман, Дэвид Лайон — Liquid Surveillance (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netocratie", "pouvoir", "identité", "réseaux"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "consumtariat", "sceneIndex": 2, "type": "privacy", "shortTitle": "Consumtariat", "era": "illusion de participation", "lensWeight": {"diagnosis": 3, "class": 5, "competence": 3, "exit": 1, "ethics": 2}, "title": "Le consumtariat : l'illusion de participer", "insight": "Le consumtariat produit de la valeur dans les réseaux sans en avoir conscience. L'illusion de participation à travers les likes et les commentaires est un mécanisme architectural de rétention. La prise de conscience est le premier pas pour en sortir.", "thesis": "Le consumtariat produit de la valeur dans les réseaux sans en avoir conscience. L'illusion de participation à travers les likes et les commentaires est un mécanisme architectural de rétention. La prise de conscience est le premier pas pour en sortir.", "body": "## Une nouvelle inégalité plus difficile à voir\n\nBard et Söderqvist avertissaient que la révolution de l'information ne libère pas automatiquement tout le monde. Elle crée un nouveau type d'inégalité, plus insaisissable que l'inégalité patrimoniale et donc plus dangereuse.\n\nLe consumtariat ne désigne pas simplement des « consommateurs » au sens économique. Ce sont des personnes qui participent activement aux réseaux, créent du contenu, interagissent avec les plateformes, tout en ne comprenant pas ce qui se passe réellement. Elles pensent se divertir ou communiquer. En réalité, elles produisent de la valeur pour d'autres.\n\nDécomposons le mécanisme étape par étape. Un utilisateur de Facebook publie une photo. Il y consacre du temps, une ressource non renouvelable, de l'énergie créative et des données personnelles. Facebook reçoit du contenu, qui attire d'autres utilisateurs; des données sur son comportement, une matière première précieuse pour les annonceurs; et de l'inventaire publicitaire, c'est-à-dire la monétisation de l'attention. L'utilisateur reçoit des likes, autrement dit un renforcement variable au sens de Skinner, qui l'incite à revenir et à produire encore davantage.\n\nQui est le netocrate dans cette transaction ? Facebook, parce qu'il comprend l'architecture et la construit selon ses propres intérêts. Qui est le consumtariat ? L'utilisateur, qui participe sans comprendre les conditions.\n\nPrenons un autre exemple. Un utilisateur de TikTok regarde des vidéos pendant 90 minutes par jour. TikTok obtient des données sur ses préférences, un profil psychologique précis; des revenus publicitaires, donc la monétisation de l'attention; et des signaux pour entraîner l'algorithme, qui devient plus intelligent et plus précis. L'utilisateur reçoit du divertissement et des pics de dopamine liés au renforcement variable. Qui travaille pour qui ici ?\n\n## Le piège de la pseudo-participation\n\nLe mécanisme le plus insidieux décrit par Bard et Söderqvist est l'illusion de participation. C'est ce qui maintient le consumtariat dans le système sans qu'il prenne conscience de sa place.\n\nLe consumtariat se sent comme un participant actif. Il vote avec des likes, ce qui donne un sentiment d'influence. Il écrit des commentaires, ce qui donne une impression de voix. Il partage du contenu, ce qui donne un sentiment d'importance. Il a l'impression d'influencer ce qui se passe dans son espace informationnel. En réalité, il crée des données sur lesquelles les netocrates, créateurs d'algorithmes et propriétaires de plateformes, prennent les vraies décisions concernant ce qu'il verra demain.\n\nCe n'est pas un complot. C'est une architecture. Les plateformes sont conçues pour maximiser le sentiment de participation tout en minimisant les droits réels. Vous « possédez » votre profil, mais la plateforme peut le supprimer sans avertissement. Vous « créez » du contenu, mais l'algorithme décide qui le verra. Vous « communiquez » avec vos amis, mais la plateforme contrôle ce que vous savez d'eux et dans quel ordre vous recevez l'information.\n\nMichel Foucault a décrit le panoptique, une prison idéale où les détenus ne savent pas s'ils sont observés à cet instant précis. Ils se comportent alors comme s'ils l'étaient en permanence. L'autocensure devient intégrée. Bauman et Lyon ont montré dans « Liquid Surveillance » que la surveillance moderne fonctionne de la même manière, mais volontairement. Personne ne vous force à installer des applications qui suivent chacun de vos pas. Vous le faites vous-même. Parce que c'est pratique. Parce que tout le monde le fait. Parce que sinon, on sort de la vie sociale.\n\nZuboff a appelé cela le « surplus comportemental » : la valeur que les gens créent par leurs actions en ligne est extraite par les plateformes puis vendue. Le consumtariat produit ce surplus sans comprendre que c'est là sa fonction principale dans le système.\n\n> Le consumtariat n'est pas celui qui « ne sait pas utiliser internet ». C'est celui qui l'utilise sans comprendre son architecture. L'illusion de participation est le mécanisme le plus efficace pour maintenir les gens dans un système qui les utilise.\n\nComprendre ce mécanisme est la première étape pour sortir du consumtariat. Il ne s'agit pas de rejeter les plateformes, mais de changer de rapport à elles. Passer de « j'utilise un service » à « je comprends ce que je paie pour ce service et si cela en vaut la peine ».", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1%80%D0%BE%D0%BA%20%D0%B4%D0%BB%D1%8F%20XXI%20%D0%B2%D0%B5%D0%BA%D0%B0%20%282018%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман, Дэвид Лайон — Liquid Surveillance (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netocratie", "attention", "plateformes", "pouvoir"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "levels", "sceneIndex": 3, "type": "technology", "shortTitle": "Trois niveaux", "era": "compétence", "lensWeight": {"diagnosis": 1, "class": 3, "competence": 5, "exit": 3, "ethics": 2}, "title": "Trois niveaux de compétence netocratique", "insight": "Trois niveaux de netocratie : comprendre l’architecture → gérer l’attention → créer l’infrastructure. La netocratie est une classe ouverte. La barrière d’entrée est la compréhension, pas l’argent ni l’origine.", "thesis": "Trois niveaux de netocratie : comprendre l’architecture → gérer l’attention → créer l’infrastructure. La netocratie est une classe ouverte. La barrière d’entrée est la compréhension, pas l’argent ni l’origine.", "body": "## La netocratie est une classe ouverte\n\nAvant de décrire les niveaux de compétence, il est important de rappeler un point fondamental de Bard et Soderqvist : la netocratie n’est pas un club fermé par l’origine.\n\nL’aristocratie reposait sur le sang : il fallait naître dans la bonne famille. La bourgeoisie reposait sur le capital : il fallait l’hériter ou l’accumuler. La netocratie repose sur la compréhension. Et la compréhension s’acquiert.\n\nLe fils d’un professeur de Moscou peut devenir membre du consumtariat s’il consomme simplement les réseaux sans les comprendre. Une personne d’une petite ville, sans formation officielle, peut devenir netocrate si elle comprend comment fonctionnent les réseaux avant son entourage.\n\nCela change radicalement la conversation sur l’éducation. Harari, dans *21 leçons pour le XXIe siècle*, a formulé ce qu’il faut précisément comprendre au XXIe siècle : pas des faits, puisqu’on peut les trouver en quelques secondes. Il faut comprendre comment le savoir se crée. Qui crée tel ou tel récit, et pourquoi. Comment les algorithmes façonnent la réalité. Comment distinguer la manipulation de l’information. Voilà l’alphabétisation du netocrate.\n\n## Premier niveau : comprendre l’architecture\n\nC’est la base. Tu sais comment fonctionnent les réseaux, non pas au sens technique, mais au sens économique et au sens du pouvoir.\n\nTu comprends les effets de réseau et pourquoi ils créent des monopoles. Tu sais pourquoi les plateformes sont \"gratuites\" et ce qu’elles prennent en échange. Tu comprends les algorithmes non comme de la magie, mais comme l’optimisation de métriques précises, et tu sais quelles métriques chaque plateforme optimise. Tu connais la différence entre la garde et la non-garde des actifs. Tu comprends ce qu’est un smart contract et pourquoi cela modifie les rapports de pouvoir.\n\nCe niveau est nécessaire, mais pas suffisant. Comprendre sans agir ne change rien. Mais agir sans comprendre, c’est agir à l’aveugle.\n\nAu passage : tu viens d’achever un cours qui t’a donné ce premier niveau. De Shannon et des mathématiques de l’information à la tokenomics et aux DAO. Ce n’est pas un hasard ; c’est l’architecture du cours.\n\n## Deuxième niveau : gérer l’attention\n\nC’est le niveau de la compétence, quand la compréhension devient action.\n\nGérer ta propre attention : tu ne laisses pas les algorithmes décider à ta place de ce qui compte. Tu choisis consciemment où consacrer ton temps, car c’est la principale ressource non renouvelable. Tu comprends quand une plateforme tente de te manipuler par renforcement variable, et tu peux sortir de cette boucle.\n\nGérer l’attention des autres : tu sais créer des significations qui se diffusent. Construire des communautés autour d’idées. Façonner des récits que les gens ont envie de transmettre. Ce n’est pas de la manipulation, c’est une communication à un niveau que la plupart des gens n’atteignent jamais.\n\nÀ ce niveau, tu peux déjà construire des audiences, influencer des communautés et monétiser directement tes connaissances et tes liens, sans passer par l’algorithme d’une plateforme.\n\n## Troisième niveau : créer l’infrastructure\n\nC’est le niveau de l’architecte. Tu n’utilises pas seulement les réseaux existants ; tu en construis de nouveaux.\n\nTu crées des protocoles et tu conçois des incitations qui alignent les intérêts des participants. Tu construis des DAO et une tokenomics qui font des participants des copropriétaires, et pas seulement des utilisateurs. Tu crées des communautés dotées d’une identité et d’une économie communes, où l’appartenance a une valeur réelle.\n\nÀ ce niveau, tu deviens toi-même une source de règles. Tu ne joues pas selon les règles d’autrui ; tu conçois l’environnement dans lequel les autres agiront.\n\nLa plupart des gens ne dépassent jamais le premier niveau, et non parce qu’ils en seraient incapables. Mais parce qu’ils ignorent que cet escalier existe. Maintenant, tu le sais.\n\n> Trois niveaux de compétence netocratique : comprendre l’architecture → gérer l’attention → créer l’infrastructure. La plupart des gens au premier niveau ne connaissent pas le deuxième ni le troisième. Tu viens de l’apprendre.\n\nChris Dixon, dans *Read Write Own*, a décrit les trois ères d’internet à travers des verbes : lire (Web1), écrire (Web2), posséder (Web3). Ce sont les trois niveaux de la netocratie. La plupart lisent. Moins écrivent. Quelques-uns possèdent. La fenêtre vers l’ère de la propriété est ouverte en ce moment même.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1%80%D0%BE%D0%BA%20%D0%B4%D0%BB%D1%8F%20XXI%20%D0%B2%D0%B5%D0%BA%D0%B0%20%282018%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман, Дэвид Лайон — Liquid Surveillance (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netocratie", "éducation", "pouvoir", "Web3"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "srinivasan", "sceneIndex": 4, "type": "economy", "shortTitle": "Srinivasan", "era": "2022", "lensWeight": {"diagnosis": 2, "class": 2, "competence": 3, "exit": 5, "ethics": 2}, "title": "Srinivasan : les États en réseau", "insight": "Srinivasan : le prochain basculement politique n'est pas la réforme des États, mais la création de communautés en réseau dotées d'une identité, d'une économie et d'une gouvernance communes. Les netocrates construisent des systèmes parallèles.", "thesis": "Srinivasan : le prochain basculement politique n'est pas la réforme des États, mais la création de communautés en réseau dotées d'une identité, d'une économie et d'une gouvernance communes. Les netocrates construisent des systèmes parallèles.", "body": "## La version la plus radicale de la logique netocratique\n\nBalaji Srinivasan est un entrepreneur en série, ancien CTO de Coinbase, et l'un des penseurs les plus provocateurs du monde technologique. En 2022, il a publié le livre *The Network State*, qui propose la version la plus radicale de la logique netocratique : le prochain basculement politique n'est pas la réforme des États existants, mais la création de nouveaux États.\n\nCela ressemble à de la science-fiction. Srinivasan insiste : c'est une prévision rationnelle fondée sur des précédents historiques.\n\nSon argument repose sur cette logique. Les États ne sont pas des formations éternelles. Ils sont apparus et ont disparu tout au long de l'histoire. Et l'émergence de nouveaux États n'a presque jamais suivi un seul schéma : révolution -> proclamation -> reconnaissance. Le plus souvent, il s'agissait d'une construction progressive de l'identité, de l'économie et de la communauté bien avant la formalisation politique.\n\nIsraël en tant qu'État n'est pas né en 1948 ; il avait été construit pendant des décennies auparavant comme une communauté dotée d'une identité partagée et d'un projet commun. Singapour est devenue ce qu'elle est parce que Lee Kuan Yew a créé un système d'incitations qui a attiré un certain type de personnes et en a éloigné d'autres. Tout pays est avant tout un dispositif de coordination avec des règles, une identité et une économie communes.\n\n## À quoi ressemble un État en réseau\n\nSrinivasan décrit une séquence concrète d'étapes.\n\nD'abord, une communauté en ligne avec des valeurs communes. Pas seulement des abonnés sur Twitter. Un groupe de personnes uni par de vraies convictions communes sur la manière dont la vie doit être organisée : rapport à l'éducation, à la santé, au travail et à la gouvernance.\n\nEnsuite, une économie commune. Tokens, DAO, accords mutuels sur l'échange de valeur au sein de la communauté. Les membres de la communauté commencent à préférer commercer entre eux.\n\nEnsuite, des enclaves physiques. Les membres de la communauté commencent à vivre les uns près des autres, d'abord comme expérience, puis comme mode de vie. Non pas parce qu'on les y force, mais parce que cela améliore leur qualité de vie : des personnes aux valeurs proches sont à proximité.\n\nEnsuite, la reconnaissance diplomatique. Lorsque la communauté atteint une taille et une influence suffisantes, les États commencent à interagir avec elle comme avec un acteur politique.\n\nCe n'est pas un plan, c'est un modèle. Certains éléments existent déjà : des communautés crypto avec leur propre économie, des appels à l'action pour des rencontres physiques, des valeurs et une identité communes.\n\nTimothy Snyder, dans *La route de la servitude*, met en garde contre l'autre face de la même pièce : les régimes autoritaires ont eux aussi maîtrisé le pouvoir en réseau. Non par la censure, mais par la désinformation, la manipulation de l'attention et la création d'un chaos informationnel dans lequel le vrai et le faux deviennent indiscernables. La netocratie est un outil neutre. Elle fonctionne dans les deux sens.\n\n> Srinivasan propose le niveau suivant de la logique netocratique : non seulement comprendre et utiliser les réseaux, mais construire de nouvelles formations politiques sur leur base. Les netocrates n'attendent pas la réforme des systèmes existants. Ils construisent des systèmes parallèles.\n\nCela ne signifie pas nécessairement créer un nouvel État. Pour la plupart des netocrates, cela veut dire construire des communautés avec une identité et une économie réelles, et non de simples audiences. Posséder l'infrastructure de ses liens au lieu de la louer aux plateformes.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1%80%D0%BE%D0%BA%20%D0%B4%D0%BB%D1%8F%20XXI%20%D0%B2%D0%B5%D0%BA%D0%B0%20%282018%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман, Дэвид Лайон — Liquid Surveillance (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netocratie", "gouvernance", "communauté", "réseaux"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "frankl", "sceneIndex": 5, "type": "privacy", "shortTitle": "Frankl", "era": "dernier choix", "lensWeight": {"diagnosis": 1, "class": 1, "competence": 2, "exit": 2, "ethics": 5}, "title": "Frankl et le choix final", "insight": "Frankl: la liberté ultime est le choix de son attitude face aux circonstances. Tu n'as pas choisi les conditions de l'ère numérique. Mais tu choisis ce que tu en fais. Comprendre sans éthique est un outil sans finalité.", "thesis": "Frankl: la liberté ultime est le choix de son attitude face aux circonstances. Tu n'as pas choisi les conditions de l'ère numérique. Mais tu choisis ce que tu en fais. Comprendre sans éthique est un outil sans finalité.", "body": "## Le philosophe du camp de concentration\n\nViktor Frankl était un psychiatre autrichien. En 1942, il fut déporté dans les camps de concentration nazis. Il passa par Auschwitz, Dachau et d'autres camps. Il perdit sa femme, ses parents et son frère. Il vécut trois ans dans des conditions dont la description est difficile à lire sans réaction physique.\n\nAprès sa libération en 1945, il écrivit en neuf jours *Man's Search for Meaning*. Le livre est devenu l'un des plus influents du XXe siècle, et l'un des plus importants pour comprendre ce que signifie être humain au sein de systèmes que l'on n'a pas choisis.\n\nL'observation centrale de Frankl, formulée dans des conditions presque impossibles à imaginer: on ne peut pas ôter à une personne sa dernière liberté. Tout le reste peut être arraché - la liberté physique, les biens, les proches, la dignité aux yeux des autres. Mais on ne peut pas retirer la liberté de choisir son attitude face aux circonstances. Dans n'importe quelle situation, il reste un espace entre le stimulus et la réponse. Et dans cet espace se trouve la dignité humaine.\n\n## Pourquoi Frankl est ici\n\nPourquoi un philosophe d'un camp de concentration apparaît-il dans le chapitre final d'un cours sur Internet et la netocratie ?\n\nParce que tout ce cours portait sur des conditions que tu n'as pas choisies.\n\nTu n'as pas choisi de naître à l'ère des smartphones et des algorithmes. Tu n'as pas choisi l'économie de l'attention, qui monétise ton temps sans ton consentement conscient. Tu n'as pas choisi l'architecture des réseaux sociaux, conçue grâce au renforcement variable de Skinner. Tu n'as pas choisi la concentration du pouvoir entre les mains de quelques plateformes.\n\nTu n'as pas choisi ces conditions. Mais tu choisis ce que tu fais de ce savoir.\n\nFrankl écrivait à propos d'un autre contexte, incomparablement plus brutal. Mais son principe est universel: la situation définit les circonstances; la personne définit la réponse à ces circonstances. Ce ne sont pas les conditions qui font de toi un consommariat ou un netocrate. C'est ton choix.\n\n## La liberté sans responsabilité n'est pas la liberté\n\nIl y a une autre dimension de Frankl, importante dans ce contexte.\n\nIl écrivait: la liberté sans responsabilité, c'est l'arbitraire. La vraie liberté est une liberté liée à la responsabilité des conséquences de tes choix.\n\nTimothy Snyder a averti que cette même logique netocratique - comprendre les réseaux, gérer l'attention, créer des récits - peut servir à détruire la démocratie, à diffuser la désinformation et à manipuler les gens à grande échelle. Les régimes autoritaires l'ont compris et l'utilisent.\n\nUn netocrate qui construit des systèmes sans en comprendre les conséquences, sans boussole éthique, reproduit les mêmes problèmes que nous avons critiqués dans les plateformes Web2. Simplement plus vite, parce qu'il comprend mieux l'architecture. Et à plus grande échelle.\n\nComprendre est un outil. Comme tout outil, il n'a pas d'éthique propre. Un marteau peut servir à construire ou à détruire. La connaissance de l'architecture des réseaux peut servir à créer des systèmes ouverts qui rééquilibrent les chances, ou à créer des systèmes de manipulation plus sophistiqués.\n\nDans le camp, Frankl a observé les deux types de personnes: celles qui, dans des conditions inhumaines, ont préservé leur dignité et aidé les autres, et celles qui, dans les mêmes conditions, ont trahi et exploité les faibles. Les conditions étaient les mêmes. Les choix, différents.\n\n> Frankl l'a formulé ainsi: la dernière liberté de l'être humain est de choisir son attitude face aux circonstances. Tu n'as pas choisi les conditions de l'ère numérique. Mais tu choisis ce que tu en fais. Et comment.\n\nC'est la réflexion finale du cours. Pas technique. Pas économique. Humaine. La netocratie est une classe ouverte; la barrière d'entrée est la compréhension. Mais la compréhension sans éthique est un outil sans finalité. Ce que tu construis dépend seulement de toi.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1%80%D0%BE%D0%BA%20%D0%B4%D0%BB%D1%8F%20XXI%20%D0%B2%D0%B5%D0%BA%D0%B0%20%282018%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман, Дэвид Лайон — Liquid Surveillance (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netocratie", "philosophie", "éthique", "liberté"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "luminara", "sceneIndex": 6, "type": "power", "shortTitle": "Et maintenant ?", "era": "→action", "lensWeight": {"diagnosis": 2, "class": 3, "competence": 5, "exit": 4, "ethics": 4}, "title": "Luminara : tu as fini de lire. Et maintenant ?", "insight": "Tu as terminé le premier niveau de compétence netocratique : comprendre l'architecture. Le deuxième niveau : la gestion de l'attention. Le troisième : la création d'infrastructure. Le prochain cours est pour celles et ceux qui choisissent d'agir.", "thesis": "Tu as terminé le premier niveau de compétence netocratique : comprendre l'architecture. Le deuxième niveau : la gestion de l'attention. Le troisième : la création d'infrastructure. Le prochain cours est pour celles et ceux qui choisissent d'agir.", "body": "## Le but caché de ce cours\n\nCe cours s'appelait « Fondements du nouvel internet ». Huit chapitres. Des mathématiques de Shannon à la blockchain de Nakamoto. Des premiers forums à TikTok. Du rêve d'un savoir libre au capitalisme de surveillance, puis à la nouvelle architecture que construit Web3.\n\nMais le cours avait un but caché, que l'on peut désormais nommer clairement.\n\nNous n'expliquions pas seulement comment fonctionne internet. Nous te préparions à un choix.\n\nUn choix entre le consommariat et la netocratie. Entre ceux qui vivent dans les réseaux sans comprendre leur architecture, et ceux qui la comprennent et agissent en connaissance de cause. Entre ceux qui produisent de la valeur pour les plateformes sans rien recevoir d'autre que l'illusion de participer, et ceux qui construisent des plateformes, gèrent leur part dedans ou comprennent au moins ce qu'ils paient pour des services \"gratuits\".\n\n## Ce que tu as tiré de ce cours\n\nBard et Zoderkvist ont décrit le premier niveau de compétence netocratique comme la compréhension de l'architecture. Tu l'as franchi.\n\nTu comprends pourquoi l'information est devenue la principale ressource du pouvoir, de Shannon à Castells. Tu sais comment Web1 a créé un internet ouvert et pourquoi cette ouverture a été utilisée contre les utilisateurs. Tu comprends la mécanique de l'économie de l'attention et du capitalisme de surveillance, de Simon à Zuboff. Tu vois comment les algorithmes créent des bulles de filtres et polarisent la société, et pourquoi ce n'est pas une intention malveillante mais une conséquence architecturale de l'optimisation de l'engagement. Tu connais la différence entre Web 3.0 et Web3. Tu comprends ce qu'est une clé privée et pourquoi \"not your keys — not your coins\". Tu sais comment fonctionnent les smart contracts, la DeFi et les DAO. Tu comprends ce que sont la netocratie et le consommariat, et à quel niveau tu te trouves maintenant.\n\nC'est le premier niveau. Nécessaire. Mais insuffisant.\n\n## L'étape suivante\n\nChris Dixon a décrit trois époques d'internet : lire, écrire, posséder. Tu as lu un cours sur ces époques. Maintenant, il est temps de passer au verbe suivant.\n\nLe deuxième niveau de compétence netocratique est la gestion de l'attention. La capacité à créer du sens, à construire des communautés et à monétiser directement le savoir et les liens. La capacité à ne pas remettre ton attention aux algorithmes, mais à la diriger consciemment.\n\nLe troisième niveau est la création d'infrastructure. Protocoles, tokenomics, DAO, identité numérique. L'architecture de systèmes dans lesquels c'est toi qui fixes les règles.\n\nLuminara construit les prochains cours précisément pour cela. Pas pour que tu « comprennes la crypto » dans un sens abstrait. Mais pour que tu puisses agir aux deuxième et troisième niveaux. Comprendre des outils concrets. Les utiliser. Construire sur leur base.\n\nBard et Zoderkvist ont écrit : la netocratie est une classe ouverte. La barrière d'entrée, c'est la compréhension. Et l'envie d'apprendre plus loin que la plupart.\n\nTu as terminé le cours gratuit jusqu'au bout. C'est déjà un signal : la plupart n'y arrivent pas. La plupart font défiler sans lire. La plupart consomment, sans poser de questions.\n\nToi, tu en poses.\n\n> Frankl a écrit : quelles que soient les circonstances, l'être humain conserve une dernière liberté, celle de choisir son attitude à leur égard. Tu n'as pas choisi les conditions de l'ère numérique. Mais tu choisis ce que tu en fais. Le prochain cours est pour ceux qui choisissent d'agir.\n\nBienvenue chez Luminara.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0% իշտ կանխատեսեց երրորդ ալիքը, բայց սխալվեց հետևության մեջ. տեղեկատվության ապակենտրոնացումը ոչ թե իշխանության ապակենտրոնացում ստեղծեց, այլ դրա կենտրոնացման նոր տեսակ՝ անտեսանելի և այդ պատճառով ավելի վտանգավոր։", "thesis": "Թոֆլերը ճիշտ կանխատեսեց երրորդ ալիքը, բայց սխալվեց հետևության մեջ. տեղեկատվության ապակենտրոնացումը ոչ թե իշխանության ապակենտրոնացում ստեղծեց, այլ դրա կենտրոնացման նոր տեսակ՝ անտեսանելի և այդ պատճառով ավելի վտանգավոր։", "body": "## Օղակը փակվեց\n\nՄենք այս դասընթացը սկսեցինք Թոֆլերից։ Վերադառնանք նրան՝ հասկանալու համար, թե ինչն էր նա ճիշտ գուշակել, ինչն էր սխալ, և ինչու է դա կարևոր։\n\n1980 թվականին Էլվին Թոֆլերը գրեց «Երրորդ ալիք»-ը՝ գիրք արդյունաբերական աշխարհի անխուսափելի փոխակերպման մասին։ Նրա կանխատեսումները իրենց ժամանակի համար համարձակ էին։ Արտադրությունը կդառնա անհատականացված՝ բոլորի համար ստանդարտ ապրանքների դարաշրջանի ավարտը։ Արտադրողի ու սպառողի միջև սահմանը կջնջվի՝ կհայտնվի prosumer-ը՝ մարդ, ով միաժամանակ ստեղծում է և սպառում։ Ավանդական հիերարխիաները՝ կորպորացիաները, պետությունները, արհմիությունները, կքանդվեն նոր ցանցային կառուցվածքների կողմից։\n\nԱյս ամենը իրականություն դարձավ։ Netflix-ի ալգորիթմը բովանդակությունը ընտրում է անհատապես։ YouTube-ի օգտատերը միաժամանակ դիտում է և ստեղծում։ Երկու հոգուց բաղկացած startup-ը կարող է մրցել կորպորացիայի հետ։ Անանուն մշակողը ստեղծում է միլիարդների արժողությամբ պրոտոկոլ, և դա 2020-ականների իրականությունն է։\n\nԲայց Թոֆլերը սկզբունքային սխալ արեց հետևության մեջ։ Նա կարծում էր, որ տեղեկատվության ապակենտրոնացումը կհանգեցնի իշխանության ապակենտրոնացմանը։ Տրամաբանությունը երկաթե էր թվում. եթե գիտելիքն այլևս էլիտայի մենաշնորհը չէ, իշխանությունն էլ կդադարի մենաշնորհ լինելուց։\n\nԴա տեղի չունեցավ։\n\n## Ձևով ապակենտրոնացում, էությամբ կենտրոնացում\n\nԻշխանությունը ապակենտրոնացավ, բայց ոչ այնպես, ինչպես կարծում էր Թոֆլերը։ Այն պետություններից անցավ կորպորացիաներին։ Կորպորացիաներից՝ պլատֆորմներին։ Պլատֆորմներից՝ նրանց, ովքեր գիտեն, թե ինչպես կառավարել ալգորիթմներն ու ուշադրությունը։\n\nՀինգ տեխնոլոգիական ընկերություն վերահսկում է այն բանի մեծ մասը, ինչ ամեն օր տեսնում են միլիարդավոր մարդիկ։ Մի քանի ալգորիթմ որոշում են, թե որ գաղափարներն են տարածվում, իսկ որոնք մնում են անտեսանելի։ Սա ձևով ապակենտրոնացում է՝ ոչ ոք Կրեմլում նստած չի որոշում, թե ինչ հեռարձակել։ Իսկ էությամբ կենտրոնացում է՝ ալգորիթմների մի քանի ճարտարապետներ են սահմանում մոլորակի տեղեկատվական իրականությունը։\n\nԹոֆլերը նաև կանխատեսեց prosumer-ին՝ մարդուն, ով միաժամանակ արտադրում է և սպառում։ Այստեղ էլ նա ճիշտ էր։ Բայց չտեսավ, որ այդ տարբերությունը կդառնա նոր դասային ճեղքվածք։ Որ ոմանք ցանցերում արժեք կստեղծեն և կստանան այն հետ՝ token-ների, ազդեցության, եկամտի միջոցով։ Իսկ մյուսները ցանցերում արժեք կստեղծեն և ոչինչ չեն ստանա, բացի մասնակցության պատրանքից։\n\nՄանուել Կաստելսը այս տրամաբանությունը հաստատեց ակադեմիական ճշգրտությամբ. ցանցային հասարակությունում իշխանությունը հաղորդակցության նկատմամբ իշխանությունն է։ Ով վերահսկում է, թե որ հաղորդագրություններն են անցնում ցանցերով, ինչ համատեքստում, ինչ քաշով, նա էլ ձևավորում է հավաքական գիտակցությունը։ Սա խորհրդային ոճի քարոզչություն չէ։ Սա ուշադրության ճարտարապետությունն է։ Ալգորիթմը չի ասում, թե ինչ մտածել։ Այն որոշում է, թե որ մտքերին ավելի հաճախ կբախվես։\n\n> Թոֆլերը 1980 թվականին ճշգրիտ կանխատեսեց երրորդ ալիքը։ Բայց սխալվեց հետևության մեջ. տեղեկատվության ապակենտրոնացումը իշխանության ապակենտրոնացման չբերեց։ Այն ստեղծեց կենտրոնացման նոր տեսակ՝ անտեսանելի և այդ պատճառով ավելի վտանգավոր։\n\nԱյս սխալը կարևոր է։ Որովհետև հենց դրա շտկումն է Web3-ի կենտրոնական խնդիրը։ Ոչ միայն տեխնոլոգիական ապակենտրոնացում։ Իշխանության իրական ապակենտրոնացում՝ բաց պրոտոկոլների, ակտիվների սեփականության և code-ում թափանցիկ կանոնների միջոցով։", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0% ն» նկատմամբ համընդհանուր հիասթափությունը հասել էր գագաթնակետին։ Ոչ ոք չէր ուզում լսել ցանցային դարաշրջանի նոր էլիտաների մասին։ Գիրքը գրեթե անտեսվեց։\n\nՔսանհինգ տարի անց այն կարդացվում է որպես այն աշխարհի ճշգրիտ քարտեզը, որտեղ մենք ապրում ենք։\n\nԲարդի և Զոդերկվիստի գլխավոր թեզը սա է․ յուրաքանչյուր տնտեսական համակարգ ծնում է իր իշխող դասը։ Ֆեոդալիզմը ծնեց արիստոկրատիան՝ նրանց, ովքեր տիրապետում էին հողին։ Արդյունաբերական կապիտալիզմը ծնեց բուրժուազիան՝ նրանց, ովքեր տիրապետում էին կապիտալին, գործարաններին, բանկերին։ Տեղեկատվական դարաշրջանը ծնում է նետոկրատիան՝ նրանց, ովքեր տիրապետում են ուշադրությանը և գիտեն, թե ինչպես կառավարել ցանցերը։\n\nՍա ոչ թե մետաֆորա է և ոչ էլ սոցիոլոգիական աբստրակցիա։ Սա կոնկրետ իշխանության մեխանիզմի նկարագրություն է, որը գործում է հենց հիմա։\n\n## Նետոկրատի հինգ հատկանիշները\n\nԲարդն ու Զոդերկվիստը նետոկրատին նկարագրում են մի շարք հատկանիշների միջոցով, և դրանցից յուրաքանչյուրը հակադրվում է այն արժեքներին, որոնք կարևոր էին արդյունաբերական դարաշրջանում։\n\n**Ուշադրության կապիտալ։** Նետոկրատի գլխավոր ռեսուրսը ոչ թե փողն է և ոչ էլ գիտելիքը՝ ինքնին։ Դա ուշադրությունը կառավարելու ունակությունն է՝ սեփականը և ուրիշներինը։ Տեղեկատվական առատության աշխարհում սակավ ռեսուրսը ոչ թե բովանդակությունն է, այլ ուշադրությունը։ Նետոկրատը գիտի, թե ինչպես կենտրոնացնել այն, ուղղել և դրամայնացնել։ Նա գիտի, թե հիմա որտեղ է միլիոնավոր մարդկանց ուշադրությունը և ինչպես այն ուղղել դեպի կարևորն ու անհրաժեշտը։\n\n**Ցանցային ինքնություն։** Նետոկրատը կարգավիճակ է կառուցում ցանցերի միջոցով, ոչ թե ինստիտուտների։ Նրա արժեքը չի որոշվում ընկերությունում ունեցած պաշտոնով, ոչ դիպլոմով, ոչ տիտղոսներով, այլ իր կապերի որակով, համայնքներում ունեցած հեղինակությամբ և տեղեկատվական հոսքերի վրա ունեցած ազդեցությամբ։ Նա կարող է անանուն լինել ինտերնետում և միևնույն ժամանակ ունենալ ավելի մեծ իրական իշխանություն, քան մեծ կորպորացիայի տպավորիչ CV ունեցող տնօրենը։\n\n**Կուրատոր, ոչ թե սպառող։** Աշխարհում, որտեղ տեղեկատվությունն անսահման է, այն մարդը, ով կարողանում է ընտրել կարևորը և զտել աղմուկը, հսկայական իշխանություն ունի։ Նետոկրատը պարզապես տեղեկատվություն չի սպառում, նա այն ընտրում է, մեկնաբանում և տարածում։ Սա էլ նրա աշխատանքն է՝ լինել իր լսարանի համար վստահելի զտիչ։\n\n**Կապերի ճարտարապետություն։** Նետոկրատը հասկանում է, որ ցանցի արժեքը կախված է նրա մասնակիցներից։ Նա ռազմավարորեն է ներդրում անում հարաբերությունների մեջ՝ կառուցելով կապերի ճարտարապետություն, ոչ թե պարզապես «networking» անելով հին իմաստով։ Ճիշտ մարդկանց ճիշտ պահին հասանելի լինելը ավելի կարևոր է, քան ցանկացած այլ ռեսուրս։ Սա ցինիզմ չէ՝ դա աշխարհի իրական աշխատանքի ըմբռնումն է։\n\n**Իմաստների ստեղծող։** Աշխարհում, որտեղ փաստերը հանրամատչելի են, իշխանությունը պատկանում է նրան, ով փաստերին տալիս է համատեքստ։ Նրան, ով բացատրում է, թե դրանք ինչ են նշանակում։ Նրան, ով ձևավորում է այն շրջանակը, որով մյուսները տեսնում են իրականությունը։ Նետոկրատը պարզապես տեղեկատու չէ։ Նա ստեղծում է նարատիվներ։\n\nԿաստելսը դա հաստատում է․ պատմության ընթացքում միշտ հաղթել է նա, ով վերահսկել է հաղորդակցությունը։ Միջնադարում՝ Եկեղեցին՝ գրագիտության և ձեռագրերի միջոցով։ Բուրժուազիան՝ տպագրական մամուլի միջոցով։ Արդյունաբերական էլիտաները՝ զանգվածային մեդիայի միջոցով։ Հիմա նետոկրատները յուրացնում են ալգորիթմները, պրոտոկոլները և ապակենտրոնացված ցանցերը։ Գործիքները փոխվում են, տրամաբանությունը մնում է նույնը։\n\n> Նետոկրատը պարտադիր չէ հարուստ կամ հայտնի մարդ լինի։ Դա այն մարդն է, ով հասկանում է, թե ինչպես են աշխատում ցանցերը, և գիտի՝ ինչպես գործել դրանց մեջ ռազմավարորեն։ Ուշադրության կապիտալը, ցանցային ինքնությունը, իմաստների ստեղծումը՝ ահա նրա իրական ակտիվները։\n\nԿարևոր է․ Բարդն ու Զոդերկվիստը ընդգծում են՝ նետոկրատիան ծագմամբ փակ ակումբ չէ։ Դա բաց դաս է, որի մուտքի արգելքը որոշվում է հասկացողությամբ, ոչ թե փողերով կամ ծննդյան կապերով։ Սա նրա հիմնարար տարբերությունն է արիստոկրատիայից և բուրժուազիայից։", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD ոխությունը բոլորին ավտոմատ չի ազատագրում։ Այն ստեղծում է անհավասարության նոր տեսակ՝ ավելի դժվար նկատելի, քան սեփականության անհավասարությունը, և հետևաբար ավելի վտանգավոր։\n\nՍպառողների դասը պարզապես տնտեսական իմաստով «սպառողներ» չեն։ Սրանք մարդիկ են, ովքեր ակտիվ մասնակցում են ցանցերին, բովանդակություն են ստեղծում, փոխազդում են հարթակների հետ և միևնույն ժամանակ չեն հասկանում, թե իրականում ինչ է տեղի ունենում։ Նրանք կարծում են, թե զվարճանում կամ շփվում են։ Իրականում՝ արժեք են ստեղծում ուրիշների համար։\n\nՔանդենք մեխանիզմը քայլ առ քայլ։ Facebook-ի օգտատերը լուսանկար է հրապարակում։ Նա ծախսում է ժամանակ՝ չվերականգնվող ռեսուրս, ստեղծագործական էներգիա և անձնական տվյալներ։ Facebook-ը ստանում է բովանդակություն, որը գրավում է այլ օգտատերերի, նրա վարքի մասին տվյալներ՝ գովազդատուների համար արժեքավոր հումք, և գովազդային գույքագրում՝ ուշադրության դրամայնացում։ Օգտատերը ստանում է լայքեր, այսինքն՝ Սքինների իմաստով փոփոխական խրախուսում, որը նրան ստիպում է վերադառնալ և էլ ավելի արտադրել։\n\nՈ՞վ է այս գործարքի նետոկրատը։ Facebook-ը, որովհետև այն հասկանում է ճարտարապետությունը և կառուցում է այն իր շահերի համար։ Ո՞վ է սպառողների դասը։ Օգտատերը, որը մասնակցում է՝ պայմանները չհասկանալով։\n\nՆայիր մեկ այլ օրինակ։ TikTok-ի օգտատերը օրական 90 րոպե տեսանյութ է դիտում։ TikTok-ը ստանում է նրա նախասիրությունների մասին տվյալներ՝ ճշգրիտ հոգեբանական պրոֆիլ, գովազդային եկամուտ՝ ուշադրության դրամայնացում, և ազդակներ՝ ալգորիթմը մարզելու համար, որը դառնում է ավելի խելացի ու ավելի ճշգրիտ։ Օգտատերը ստանում է զվարճանք և դոֆամինային ալիքներ՝ փոփոխական խրախուսումից։ Այստեղ ո՞վ է ում համար աշխատում։\n\n## Կեղծ մասնակցության թակարդը\n\nԲարդի և Զոդերկվիստի նկարագրած ամենախորամանկ մեխանիզմը մասնակցության պատրանքն է։ Ահա թե ինչն է սպառողների դասին պահում համակարգի ներսում՝ առանց իր դիրքը գիտակցելու։\n\nՍպառողների դասը իրեն ակտիվ մասնակից է զգում։ Նա լայքերով քվեարկում է՝ ազդեցության զգացում։ Նա մեկնաբանություններ է գրում՝ ձայն ունենալու զգացում։ Նա բովանդակություն է տարածում՝ նշանակալի լինելու զգացում։ Նրան թվում է, թե ազդում է այն ամենի վրա, ինչ տեղի է ունենում իր տեղեկատվական տարածքում։ Իրականում նա տվյալներ է ստեղծում, որոնց հիման վրա նետոկրատները՝ ալգորիթմների ստեղծողները, հարթակների տերերը, իրական որոշումներ են կայացնում այն մասին, թե նա ինչ է տեսնելու վաղը։\n\nՍա դավադրություն չէ։ Սա ճարտարապետություն է։ Հարթակները նախագծված են այնպես, որ առավելագույնի հասցնեն մասնակցության զգացումը՝ նվազագույնի հասցնելով իրական իրավունքները։ Դու «տիրապետում» ես քո պրոֆիլին, բայց հարթակը կարող է ջնջել այն առանց նախազգուշացման։ Դու «ստեղծում» ես բովանդակություն, բայց ալգորիթմը որոշում է, թե ով այն կտեսնի։ Դու «շփվում» ես ընկերներիդ հետ, բայց հարթակը վերահսկում է, թե ինչ գիտես նրանց մասին և ինչ հերթականությամբ ես ստանում տեղեկությունը։\n\nՄիշել Ֆուկոն նկարագրել է պանոպտիկոնը՝ իդեալական բանտ, որտեղ կալանավորները չեն իմանում՝ արդյոք հենց հիմա իրենց դիտում են։ Արդյունքում նրանք իրենց պահում են այնպես, կարծես մշտապես են հսկվում։ Ինքնագրաքննությունը դառնում է ներառված մեխանիզմ։ Բաումանն ու Լայոնը «Liquid Surveillance»-ում ցույց տվեցին, որ ժամանակակից հսկողությունն էլ նույն կերպ է աշխատում՝ միայն կամավոր։ Ոչ ոք քեզ չի ստիպում տեղադրել հավելվածներ, որոնք հետևում են քո յուրաքանչյուր քայլին։ Դու դա անում ես ինքդ։ Որովհետև հարմար է։ Որովհետև բոլորը դա անում են։ Որովհետև հակառակ դեպքում դուրս ես մնում սոցիալական կյանքից։\n\nԶուբոֆն այս ամենը կոչեց «վարքագծային ավելցուկ»․ այն արժեքը, որ մարդիկ ստեղծում են իրենց առցանց գործողություններով, հարթակները վերցնում են և վաճառում։ Սպառողների դասը արտադրում է այդ ավելցուկը՝ առանց գիտակցելու, որ հենց դա է համակարգում իր հիմնական գործառույթը։\n\n> Սպառողների դասը նրանք չեն, ովքեր «չգիտեն օգտվել ինտերնետից»։ Դա նրանք են, ովքեր օգտվում են նրանից՝ առանց հասկանալու նրա ճարտարապետությունը։ Մասնակցության պատրանքը ամենաարդյունավետ մեխանիզմն է այն համակարգում մարդկանց պահելու համար, որը նրանց օգտագործում է։\n\nԱյս մեխանիզմը հասկանալը սպառողների դասից դուրս գալու առաջին քայլն է։ Ոչ թե հարթակներից հրաժարվելը, այլ դրանց նկատմամբ վերաբերմունքը փոխելը։ «Ես օգտվում եմ ծառայ երեք մակարդակ՝ ճարտարապետության ըմբռնում → ուշադրության կառավարում → ենթակառուցվածքի ստեղծում։ Նետոկրատիան բաց դաս է։ Մուտքի արգելքը ըմբռնումն է, ոչ թե փողը կամ ծագումը։", "body": "## Նետոկրատիան բաց դաս է\n\nՆախքան կարողության մակարդակները նկարագրելը, կարևոր է կրկնել Բարդի և Զոդերկվիստի հիմնական միտքը. նետոկրատիան ծագմամբ փակ ակումբ չէ։\n\nԱզնվականությունը կառուցված էր արյան վրա. պետք էր ծնվել ճիշտ ընտանիքում։ Բուրժուազիան կառուցված էր կապիտալի վրա. պետք էր այն ժառանգել կամ կուտակել։ Նետոկրատիան կառուցվում է ըմբռնման վրա։ Իսկ ըմբռնումը կարելի է ձեռք բերել։\n\nՄոսկվայից պրոֆեսորի որդին կարող է դառնալ կոնսյումտարիատի մաս, եթե պարզապես սպառում է ցանցերը՝ առանց դրանք հասկանալու։ Փոքր քաղաքից, առանց ձևական կրթության մարդը կարող է դառնալ նետոկրատ, եթե հասկանա, թե ինչպես են աշխատում ցանցերը իր շրջապատից առաջ։\n\nՍա հիմնովին փոխում է կրթության մասին խոսակցությունը։ Հարարին *21 դաս XXI դարի համար*-ում ձևակերպել է, թե XXI դարում կոնկրետ ինչն է պետք հասկանալ. ոչ թե փաստերը, որովհետև դրանք կարելի է գտնել վայրկյանների ընթացքում։ Պետք է հասկանալ, թե ինչպես է ստեղծվում գիտելիքը։ Ով է ստեղծում այս կամ այն նարատիվները և ինչու։ Ինչպես են ալգորիթմները ձևավորում իրականությունը։ Ինչպես տարբերել մանիպուլյացիան տեղեկատվությունից։ Սա է նետոկրատի գրագիտությունը։\n\n## Առաջին մակարդակ. ճարտարապետության ըմբռնում\n\nՍա հիմքն է։ Դու գիտես, թե ինչպես են աշխատում ցանցերը՝ ոչ թե տեխնիկական, այլ տնտեսական և իշխանական իմաստով։\n\nԴու հասկանում ես ցանցային էֆեկտները և ինչու են դրանք մոնոպոլիաներ ստեղծում։ Գիտես, թե ինչու են հարթակները \"անվճար\" և ինչ են վերցնում դրա փոխարեն։ Ալգորիթմները հասկանում ես ոչ թե որպես կախարդանք, այլ որպես կոնկրետ չափորոշիչների օպտիմալացում, և գիտես, թե որ հարթակն ինչ չափորոշիչ է օպտիմալացնում։ Գիտես ակտիվների custodial և ոչ custodial պահման տարբերությունը։ Հասկանում ես, թե ինչ է smart contract-ը և ինչու է դա փոխում իշխանության հարաբերությունները։\n\nԱյս մակարդակը անհրաժեշտ է, բայց բավարար չէ։ Գործողություն չունեցող ըմբռնումը ոչինչ չի փոխում։ Բայց առանց ըմբռնման՝ ցանկացած գործողություն կույր է։\n\nԻ դեպ՝ դու հենց նոր ավարտեցիր այն դասընթացը, որը քեզ տվեց այս առաջին մակարդակը։ Շենոնից և տեղեկատվության մաթեմատիկայից մինչև tokenomics և DAO։ Սա պատահականություն չէ՝ սա դասընթացի ճարտարապետությունն է։\n\n## Երկրորդ մակարդակ. ուշադրության կառավարում\n\nՍա հմտության մակարդակն է, երբ ըմբռնումը դառնում է գործողություն։\n\nՔո սեփական ուշադրության կառավարում. դու չես թողնում, որ ալգորիթմները քո փոխարեն որոշեն, թե ինչն է կարևոր։ Դու գիտակցաբար ընտրում ես, թե որտեղ ծախսել ժամանակդ, որովհետև դա գլխավոր չվերականգնվող ռեսուրսն է։ Դու հասկանում ես, երբ հարթակը փորձում է քեզ մանիպուլյացիայի ենթարկել փոփոխական խրախուսման միջոցով, և կարող ես դուրս գալ այդ օղակից։\n\nՈւրիշների ուշադրության կառավարում. դու կարող ես ստեղծել տարածվող իմաստներ։ Կառուցել համայնքներ գաղափարների շուրջ։ Ձևավորել նարատիվներ, որոնք մարդիկ ուզում են փոխանցել առաջ։ Սա մանիպուլյացիա չէ. սա հաղորդակցություն է այնպիսի մակարդակում, որի վրա մարդկանց մեծ մասը երբեք չի բարձրանում։\n\nԱյս մակարդակում դու արդեն կարող ես կառուցել լսարաններ, ազդեցություն ունենալ համայնքների վրա և քո գիտելիքն ու կապերը ուղղակիորեն մոնետիզացնել՝ ոչ թե հարթակի ալգորիթմի միջոցով։\n\n## Երրորդ մակարդակ. ենթակառուցվածքի ստեղծում\n\nՍա ճարտարապետի մակարդակն է։ Դու ոչ միայն օգտագործում ես գոյություն ունեցող ցանցերը, այլև կառուցում ես նորը։\n\nԴու ստեղծում ես արձանագրություններ և նախագծում ես խթաններ, որոնք հավասարեցնում են մասնակիցների շահերը։ Դու կառուցում ես DAO և tokenomics, որոնք մասնակիցներին դարձնում են համասեփականատերեր, ոչ թե պարզապես օգտվողներ։ Դու ստեղծում ես ընդհանուր ինքնությամբ և տնտեսությամբ համայնքներ, որտեղ պատկանելությունն իրական արժեք ունի։\n\nԱյս մակարդակում դու ինքդ դառնում ես կանոնների աղբյուր։ Դու չես խաղում ուրիշների կանոններով. դու նախագծում ես միջավայրը, որտեղ մյուսները կգործեն։\n\nՄարդկանց մեծ մասը երբեք չի բարձրանում առաջին մակարդակից վերև, և ոչ թե այն պատճառով, որ անընդունակ է։ Այլ որովհետև չգիտի, որ այդ սանդուղքը գոյություն ունի։ Հիմա դու գիտես։\n\n> Նետոկրատական կարողության երեք մակարդակ՝ ճարտարապետության ըմբռնում → ուշադրության կառավարում → ենթակառուցվածքի ստեղծում։ Առաջին մակարդակում գտնվող մարդկանց մեծ մասը չգիտի երկրորդի և երրորդի մասին։ Դու հենց նոր իմացար։\n\nՔրիս Դիքսոնը *Read Write Own*-ում նկարագրել է ինտերնետի երեք դարաշրջանները բայերով՝ կարդալ (Web1), գրել (Web2), տիրել (Web3)։ Սա էլ հենց նետոկրատիայի երեք մակարդակներն են։ Մեծ մասը կարդում է։ Ավելի քիչ մարդիկ են գրում։ Քչերն են տիրում։ Տիրապետման դարաշրջանի դուռը հենց հիմա բաց է։", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20 {"diagnosis": 2, "class": 2, "competence": 3, "exit": 5, "ethics": 2}, "title": "Շրինիվասան․ ցանցային պետություններ", "insight": "Շրինիվասան․ հաջորդ քաղաքական տեղաշարժը պետությունների բարեփոխումը չէ, այլ ընդհանուր ինքնությամբ, տնտեսությամբ և կառավարմամբ ցանցային համայնքների ստեղծումը։ Նետոկրատները կառուցում են զուգահեռ համակարգեր։", "thesis": "Շրինիվասան․ հաջորդ քաղաքական տեղաշարժը պետությունների բարեփոխումը չէ, այլ ընդհանուր ինքնությամբ, տնտեսությամբ և կառավարմամբ ցանցային համայնքների ստեղծումը։ Նետոկրատները կառուցում են զուգահեռ համակարգեր։", "body": "## Նետոկրատական տրամաբանության ամենառադիկալ տարբերակը\n\nԲալաջի Շրինիվասանը սերիական ձեռնարկատեր է, Coinbase-ի նախկին CTO-ն, տեխնոլոգիական աշխարհի ամենապահունչ մտածողներից մեկը։ 2022 թվականին նա հրապարակեց *The Network State* գիրքը, որը առաջարկում է նետոկրատական տրամաբանության ամենառադիկալ տարբերակը. հաջորդ քաղաքական տեղաշարժը գործող պետությունների բարեփոխումը չէ, այլ նորերի ստեղծումը։\n\nՍա գիտաֆանտաստիկայի նման է հնչում։ Շրինիվասանը պնդում է՝ դա պատմական նախադեպերի վրա հիմնված ռացիոնալ կանխատեսում է։\n\nՆրա փաստարկը կառուցվում է հետևյալ տրամաբանության վրա։ Պետությունները հավերժական կազմավորումներ չեն։ Դրանք պատմության ընթացքում հայտնվել ու անհետացել են։ Եվ նոր պետությունների առաջացումը գրեթե երբեք չի հետևել մեկ միասնական սխեմայի. հեղափոխություն -> հռչակում -> ճանաչում։ Ավելի հաճախ դա եղել է ինքնության, տնտեսության և համայնքի աստիճանական կառուցում՝ շատ ավելի վաղ, քան ձևական քաղաքական ձևավորումը։\n\nԻսրայելը որպես պետություն չի առաջացել 1948 թվականին. դրանից տասնամյակներ առաջ այն կառուցվում էր որպես համայնք՝ ընդհանուր ինքնությամբ և ընդհանուր նախագծով։ Սինգապուրը դարձավ այն, ինչ կա, որովհետև Լի Քուան Յուն ստեղծեց խթանների համակարգ, որը գրավեց որոշակի տեսակի մարդկանց և հեռացրեց մյուսներին։ Ցանկացած երկիր առաջին հերթին համակարգման մեխանիզմ է՝ ընդհանուր կանոններով, ինքնությամբ և տնտեսությամբ։\n\n## Ինչպիսի տեսք ունի ցանցային պետությունը\n\nՇրինիվասանը նկարագրում է քայլերի կոնկրետ հաջորդականություն։\n\nՍկզբում՝ առցանց համայնք՝ ընդհանուր արժեքներով։ Twitter-ի պարզապես հետևորդներ չեն։ Մարդկանց խումբ, որը միավորված է կյանքի կազմակերպման մասին իրական ընդհանուր համոզմունքներով՝ կրթության, առողջության, աշխատանքի և կառավարման նկատմամբ վերաբերմունքով։\n\nՀետո՝ ընդհանուր տնտեսություն։ Թոքեններ, DAO, արժեքի փոխանակման փոխադարձ համաձայնություններ համայնքի ներսում։ Համայնքի անդամները սկսում են նախընտրել առևտուր անել միմյանց հետ։\n\nՀետո՝ ֆիզիկական անկլավներ։ Համայնքի անդամները սկսում են ապրել իրար մոտ՝ սկզբում որպես փորձարկում, հետո՝ որպես ապրելակերպ։ Ոչ թե որովհետև նրանց ստիպում են, այլ որովհետև դա բարձրացնում է կյանքի որակը. մոտակայքում են նման արժեքներ ունեցող մարդիկ։\n\nՀետո՝ դիվանագիտական ճանաչում։ Երբ համայնքը հասնում է բավարար չափի և ազդեցության, պետությունները սկսում են դրա հետ փոխազդել որպես քաղաքական սուբյեկտի հետ։\n\nՍա ծրագիր չէ՝ մոդել է։ Որոշ տարրեր արդեն գոյություն ունեն. սեփական տնտեսությամբ կրիպտո համայնքներ, ֆիզիկական հանդիպումների համար գործողության կոչեր, ընդհանուր արժեքներ և ինքնություն։\n\nԹիմոթի Սնայդերը *The Road to Unfreedom*-ում զգուշացնում է նույն մետաղադրամի մյուս կողմի մասին. ավտորիտար ռեժիմները նույնպես յուրացրել են ցանցային իշխանությունը։ Ոչ թե գրաքննության միջոցով, այլ ապատեղեկատվության, ուշադրության մանիպուլյացիայի և տեղեկատվական քաոսի ստեղծման միջոցով, որտեղ ճշմարտությունն ու սուտը դառնում են անտարբերելի։ Նետոկրատիան չեզոք գործիք է։ Այն աշխատում է երկու ուղղությամբ էլ։\n\n> Շրինիվասանը առաջարկում է նետոկրատական տրամաբանության հաջորդ մակարդակը. ոչ միայն հասկանալ և օգտագործել ցանցերը, այլ դրանց հիման վրա կառուցել նոր քաղաքական կազմավորումներ։ Նետոկրատները չեն սպասում գործող համակարգերի բարեփոխմանը։ Նրանք կառուցում են զուգահեռ համակարգեր։\n\nՍա պարտադիր չէ, որ նշանակի նոր պետության ստեղծում։ Նետոկրատների մեծ մասի համար դա նշանակում է կառուցել իրական ինքնությամբ և տնտեսությամբ համայնքներ, ոչ թե պարզապես լսարաններ։ Տիրապետել քո կապերի ենթակառուցվածքին՝ այն հարթակներից վարձակալելու փոխարեն։", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "
