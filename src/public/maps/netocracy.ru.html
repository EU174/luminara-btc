t": {"diagnosis": 3, "class": 5, "competence": 4, "exit": 2, "ethics": 1}, "title": "Bard y Soderqvist: la anatomía de un netócrata", "insight": "Bard y Soderqvist describieron al netócrata a través de cinco rasgos: capital atencional, identidad en red, curaduría, arquitectura de conexiones y creación de significados. La barrera de entrada es la comprensión, no el dinero.", "thesis": "Bard y Soderqvist describieron al netócrata a través de cinco rasgos: capital atencional, identidad en red, curaduría, arquitectura de conexiones y creación de significados. La barrera de entrada es la comprensión, no el dinero.", "body": "## Un libro escrito demasiado pronto\n\nEn 2000, Alexander Bard y Jan Soderqvist publicaron Netocracy. El momento fue desastrosamente malo: la burbuja de internet acababa de estallar, miles de empresas habían quebrado y la desilusión general con la \"nueva economía\" había llegado a su punto máximo. Nadie quería oír hablar de nuevas élites de la era de las redes. El libro quedó prácticamente ignorado.\n\nVeinticinco años después, se lee como un mapa exacto del mundo en el que vivimos.\n\nLa tesis central de Bard y Soderqvist es esta: todo sistema económico produce su propia clase dirigente. El feudalismo produjo a la aristocracia, a quienes poseían la tierra. El capitalismo industrial produjo a la burguesía, a quienes poseían capital, fábricas y bancos. La era de la información produce la netocracia, a quienes poseen la atención y saben cómo gestionar redes.\n\nEsto no es una metáfora ni una abstracción sociológica. Es la descripción de un mecanismo concreto de poder que está funcionando ahora mismo.\n\n## Cinco características del netócrata\n\nBard y Soderqvist describen al netócrata mediante un conjunto de características, y cada una de ellas contrasta con lo que se valoraba en la era industrial.\n\n**Capital atencional.** El recurso principal del netócrata no es el dinero, ni el conocimiento en sí mismo. Es la capacidad de gestionar la atención: la propia y la de los demás. En un mundo de abundancia de información, lo escaso no es el contenido sino la atención. Un netócrata sabe concentrarla, dirigirla y monetizarla. Sabe dónde está ahora la atención de millones de personas, y cómo atraerla hacia lo que importa.\n\n**Identidad en red.** Un netócrata construye estatus a través de redes, no de instituciones. Su valor no lo determina un puesto en una empresa, ni un diploma, ni títulos, sino la calidad de sus vínculos, su reputación en las comunidades y su influencia sobre los flujos de información. Puede ser anónimo en internet y aun así tener más poder real que el director de una gran corporación con un CV impresionante.\n\n**Curador, no consumidor.** En un mundo donde la información es infinita, quien sabe elegir lo importante y filtrar el ruido tiene un poder enorme. El netócrata no se limita a consumir información: la selecciona, la interpreta y la distribuye. Ese es su trabajo: ser un filtro confiable para su audiencia.\n\n**Arquitectura de conexiones.** El netócrata entiende que el valor de una red depende de sus participantes. Invierte en las relaciones de forma estratégica, construyendo una arquitectura de conexiones y no solo \"haciendo networking\" en el sentido antiguo. Tener acceso a las personas adecuadas en el momento adecuado importa más que cualquier otro recurso. No es cinismo, sino entender cómo funciona realmente el mundo.\n\n**Creador de significados.** En un mundo donde los hechos están al alcance de todos, el poder pertenece a quien les da contexto. A quien explica qué significan. A quien moldea el marco a través del cual los demás ven la realidad. El netócrata no es solo un informante. Crea narrativas.\n\nCastells lo confirma: a lo largo de la historia, siempre ganó quien controló la comunicación. La Iglesia en la Edad Media, a través de la alfabetización y los manuscritos. La burguesía, a través de la imprenta. Las élites industriales, a través de los medios masivos. Ahora los netócratas dominan algoritmos, protocolos y redes descentralizadas. Cambian las herramientas, pero la lógica es la misma.\n\n> Un netócrata no es necesariamente una persona rica o famosa. Es alguien que entiende cómo funcionan las redes y sabe cómo actuar en ellas de forma estratégica. Capital atencional, identidad en red, creación de significados: esos son sus verdaderos activos.\n\nImportante: Bard y Soderqvist subrayan que la netocracia no es un club cerrado por origen. Es una clase abierta, cuya barrera de entrada la define la comprensión, no el dinero ni los vínculos de nacimiento. Esa es su diferencia fundamental con la aristocracia y la burguesía.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1%80%D0%BE%D0%BA%20%D0%B4%D0%BB%D1%8F%20XXI%20%D0%B2%D0%B5%D0%BA%D0%B0%20%282018%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман, Дэвид Лайон — Liquid Surveillance (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netocracia", "poder", "identidad", "redes"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "consumtariat", "sceneIndex": 2, "type": "privacy", "shortTitle": "Consumtariado", "era": "ilusión de participación", "lensWeight": {"diagnosis": 3, "class": 5, "competence": 3, "exit": 1, "ethics": 2}, "title": "El consumtariado: la ilusión de participar", "insight": "El consumtariado produce valor en las redes sin entenderlo. La ilusión de participación a través de likes y comentarios es un mecanismo arquitectónico de retención. Tomar conciencia es el primer paso para salir.", "thesis": "El consumtariado produce valor en las redes sin entenderlo. La ilusión de participación a través de likes y comentarios es un mecanismo arquitectónico de retención. Tomar conciencia es el primer paso para salir.", "body": "## Una nueva desigualdad que cuesta más ver\n\nBard y Söderqvist advirtieron que la revolución de la información no libera automáticamente a todo el mundo. Crea un nuevo tipo de desigualdad, más difícil de detectar que la patrimonial y, por eso, más peligrosa.\n\nEl consumtariado no son simplemente “consumidores” en sentido económico. Son personas que participan activamente en redes, crean contenido, interactúan con plataformas y, al mismo tiempo, no entienden lo que realmente está pasando. Creen que se están entreteniendo o comunicando. En realidad, están produciendo valor para otros.\n\nDescompongamos el mecanismo paso a paso. Un usuario de Facebook publica una foto. Dedica tiempo, un recurso no renovable, energía creativa y datos personales. Facebook recibe contenido, que atrae a otros usuarios; datos sobre su comportamiento, una materia prima valiosa para los anunciantes; e inventario publicitario, es decir, monetización de la atención. El usuario recibe likes, o sea, refuerzo variable en el sentido de Skinner, que lo hace volver y producir todavía más.\n\n¿Quién es el netócrata en esta operación? Facebook, porque entiende la arquitectura y la construye según sus propios intereses. ¿Quién es el consumtariado? El usuario, que participa sin entender las condiciones.\n\nMira otro ejemplo. Un usuario de TikTok ve videos durante 90 minutos al día. TikTok obtiene datos sobre sus preferencias, un perfil psicológico preciso; ingresos publicitarios, es decir, monetización de la atención; y señales para entrenar el algoritmo, que se vuelve más inteligente y más preciso. El usuario recibe entretenimiento y picos de dopamina derivados del refuerzo variable. ¿Quién trabaja para quién aquí?\n\n## La trampa de la pseudo-participación\n\nEl mecanismo más insidioso descrito por Bard y Söderqvist es la ilusión de participación. Eso es lo que mantiene al consumtariado dentro del sistema sin que tome conciencia de su lugar en él.\n\nEl consumtariado se siente como un participante activo. Vota con likes: sensación de influencia. Escribe comentarios: sensación de tener voz. Comparte contenido: sensación de importancia. Le parece que influye en lo que ocurre en su espacio informativo. En realidad, genera datos sobre los cuales los netócratas, los creadores de algoritmos y dueños de plataformas, toman las decisiones reales sobre lo que verá mañana.\n\nNo es una conspiración. Es arquitectura. Las plataformas están diseñadas para maximizar la sensación de participación y minimizar los derechos reales. “Posees” tu perfil, pero la plataforma puede eliminarlo sin aviso. “Creas” contenido, pero el algoritmo decide quién lo verá. “Te comunicas” con tus amigos, pero la plataforma controla lo que sabes de ellos y en qué orden recibes la información.\n\nMichel Foucault describió el panóptico, una prisión ideal en la que los presos no saben si los están observando en ese mismo momento. Como resultado, se comportan como si los vigilaran todo el tiempo. La autocensura se vuelve parte del sistema. Bauman y Lyon mostraron en “Liquid Surveillance” que la vigilancia moderna funciona igual, solo que de manera voluntaria. Nadie te obliga a instalar aplicaciones que rastrean cada paso. Lo haces tú mismo. Porque es cómodo. Porque todo el mundo lo hace. Porque, de lo contrario, quedas fuera de la vida social.\n\nZuboff llamó a esto “excedente conductual”: el valor que las personas generan con sus acciones en línea es extraído por las plataformas y vendido. El consumtariado produce ese excedente sin darse cuenta de que esa es su función principal en el sistema.\n\n> El consumtariado no es quien “no sabe usar internet”. Es quien lo usa sin entender su arquitectura. La ilusión de participación es el mecanismo más eficaz para mantener a las personas dentro de un sistema que las usa.\n\nEntender este mecanismo es el primer paso para salir del consumtariado. No se trata de abandonar las plataformas, sino de cambiar la relación con ellas. Pasar de “uso un servicio” a “entiendo con qué pago por este servicio y si realmente vale la pena”.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1%80%D0%BE%D0%BA%20%D0%B4%D0%BB%D1%8F%20XXI%20%D0%B2%D0%B5%D0%BA%D0%B0%20%282018%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман, Дэвид Лайон — Liquid Surveillance (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netocracia", "atención", "plataformas", "poder"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "levels", "sceneIndex": 3, "type": "technology", "shortTitle": "Tres niveles", "era": "competencia", "lensWeight": {"diagnosis": 1, "class": 3, "competence": 5, "exit": 3, "ethics": 2}, "title": "Tres niveles de competencia netocrática", "insight": "Tres niveles de netocracia: entender la arquitectura → gestionar la atención → crear infraestructura. La netocracia es una clase abierta. La barrera de entrada es la comprensión, no el dinero ni el origen.", "thesis": "Tres niveles de netocracia: entender la arquitectura → gestionar la atención → crear infraestructura. La netocracia es una clase abierta. La barrera de entrada es la comprensión, no el dinero ni el origen.", "body": "## La netocracia es una clase abierta\n\nAntes de describir los niveles de competencia, es importante repetir un punto fundamental de Bard y Soderqvist: la netocracia no es un club cerrado por origen.\n\nLa aristocracia se construyó sobre la sangre: había que nacer en la familia correcta. La burguesía se construyó sobre el capital: había que heredarlo o acumularlo. La netocracia se construye sobre la comprensión. Y la comprensión se puede adquirir.\n\nEl hijo de un profesor de Moscú puede convertirse en parte del consumtariado si simplemente consume redes sin entenderlas. Una persona de una ciudad pequeña, sin educación formal, puede convertirse en netócrata si entiende cómo funcionan las redes antes que quienes la rodean.\n\nEsto cambia de manera fundamental la conversación sobre la educación. Harari, en *21 lecciones para el siglo XXI*, formuló qué es exactamente lo que hay que entender en el siglo XXI: no los hechos, porque se pueden encontrar en segundos. Hay que entender cómo se crea el conocimiento. Quién crea determinados relatos, y por qué. Cómo los algoritmos moldean la realidad. Cómo distinguir la manipulación de la información. Esa es la alfabetización de un netócrata.\n\n## Primer nivel: entender la arquitectura\n\nEsta es la base. Sabes cómo funcionan las redes, no en un sentido técnico, sino en un sentido económico y de poder.\n\nEntiendes los efectos de red y por qué crean monopolios. Sabes por qué las plataformas son \"gratis\" y qué toman a cambio. Entiendes los algoritmos no como magia, sino como la optimización de métricas concretas, y sabes qué métricas optimiza cada plataforma. Conoces la diferencia entre la custodia y la autocustodia de activos. Entiendes qué es un smart contract y por qué cambia las relaciones de poder.\n\nEste nivel es necesario, pero no suficiente. Entender sin actuar no cambia nada. Pero actuar sin entender es actuar a ciegas.\n\nPor cierto: acabas de completar un curso que te dio este primer nivel. Desde Shannon y las matemáticas de la información hasta la tokenómica y DAO. No es una casualidad; es la arquitectura del curso.\n\n## Segundo nivel: gestionar la atención\n\nEste es el nivel de la habilidad, cuando la comprensión se convierte en acción.\n\nGestionar tu propia atención: no dejas que los algoritmos decidan por ti qué importa. Eliges conscientemente en qué gastar tu tiempo, porque es el principal recurso no renovable. Entiendes cuándo una plataforma intenta manipularte mediante refuerzo variable, y puedes salir de ese bucle.\n\nGestionar la atención de otras personas: sabes crear significados que se difunden. Construir comunidades alrededor de ideas. Dar forma a relatos que la gente quiere transmitir. Eso no es manipulación, es comunicación a un nivel al que la mayoría nunca llega.\n\nEn este nivel ya puedes crear audiencias, influir en comunidades y monetizar directamente tus conocimientos y tus vínculos, no a través del algoritmo de una plataforma.\n\n## Tercer nivel: crear infraestructura\n\nEste es el nivel del arquitecto. No solo usas redes existentes, sino que construyes nuevas.\n\nCreas protocolos y diseñas incentivos que alinean los intereses de los participantes. Construyes DAO y tokenómica que convierten a los participantes en copropietarios, no solo en usuarios. Creas comunidades con una identidad y una economía compartidas, donde pertenecer tiene un valor real.\n\nEn este nivel, tú mismo te conviertes en fuente de reglas. No juegas con las reglas de otros; diseñas el entorno en el que actuarán los demás.\n\nLa mayoría de las personas nunca supera el primer nivel, y no porque no sea capaz. Sino porque no sabe que esa escalera existe. Ahora lo sabes.\n\n> Tres niveles de competencia netocrática: entender la arquitectura → gestionar la atención → crear infraestructura. La mayoría de las personas en el primer nivel no conoce el segundo ni el tercero. Acabas de enterarte.\n\nChris Dixon, en *Read Write Own*, describió las tres eras de internet mediante verbos: leer (Web1), escribir (Web2), poseer (Web3). Esos son los tres niveles de la netocracia. La mayoría lee. Menos personas escriben. Unas pocas poseen. La ventana hacia la era de la propiedad está abierta ahora mismo.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1%80%D0%BE%D0%BA%20%D0%B4%D0%BB%D1%8F%20XXI%20%D0%B2%D0%B5%D0%BA%D0%B0%20%282018%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман, Дэвид Лайон — Liquid Surveillance (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netocracia", "educación", "poder", "Web3"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "srinivasan", "sceneIndex": 4, "type": "economy", "shortTitle": "Srinivasan", "era": "2022", "lensWeight": {"diagnosis": 2, "class": 2, "competence": 3, "exit": 5, "ethics": 2}, "title": "Srinivasan: estados en red", "insight": "Srinivasan: el siguiente cambio político no es reformar los estados, sino crear comunidades en red con identidad, economía y gobernanza compartidas. Los netócratas construyen sistemas paralelos.", "thesis": "Srinivasan: el siguiente cambio político no es reformar los estados, sino crear comunidades en red con identidad, economía y gobernanza compartidas. Los netócratas construyen sistemas paralelos.", "body": "## La versión más radical de la lógica netocrática\n\nBalaji Srinivasan es un emprendedor en serie, ex CTO de Coinbase y uno de los pensadores más provocadores del mundo tecnológico. En 2022 publicó el libro *The Network State*, que propone la versión más radical de la lógica netocrática: el siguiente cambio político no es reformar los estados existentes, sino crear otros nuevos.\n\nSuena a ciencia ficción. Srinivasan insiste: es un pronóstico racional basado en precedentes históricos.\n\nSu argumento se apoya en esta lógica. Los estados no son formaciones eternas. Han aparecido y desaparecido a lo largo de la historia. Y el surgimiento de nuevos estados casi nunca siguió un solo patrón: revolución -> proclamación -> reconocimiento. Más a menudo, fue la construcción gradual de identidad, economía y comunidad mucho antes de la formalización política.\n\nIsrael como estado no surgió en 1948; se había construido durante décadas antes como una comunidad con una identidad compartida y un proyecto común. Singapur se convirtió en lo que es porque Lee Kuan Yew creó un sistema de incentivos que atrajo a cierto tipo de personas y alejó a otras. Cualquier país es, ante todo, un dispositivo de coordinación con reglas, identidad y economía compartidas.\n\n## Cómo se ve un estado en red\n\nSrinivasan describe una secuencia concreta de pasos.\n\nPrimero, una comunidad en línea con valores compartidos. No solo seguidores en Twitter. Un grupo de personas unido por creencias compartidas reales sobre cómo debe organizarse la vida: la relación con la educación, la salud, el trabajo y la gobernanza.\n\nLuego, una economía compartida. Tokens, DAO, acuerdos mutuos para intercambiar valor dentro de la comunidad. Los miembros de la comunidad empiezan a preferir comerciar entre sí.\n\nLuego, enclaves físicos. Los miembros de la comunidad comienzan a vivir cerca unos de otros, primero como experimento y luego como forma de vida. No porque los obliguen, sino porque mejora su calidad de vida: hay personas con valores afines cerca.\n\nLuego, reconocimiento diplomático. Cuando la comunidad alcanza suficiente tamaño e influencia, los estados comienzan a interactuar con ella como actor político.\n\nNo es un plan; es un modelo. Algunos elementos ya existen: comunidades cripto con su propia economía, llamadas a la acción para encuentros presenciales, valores e identidad compartidos.\n\nTimothy Snyder, en *El camino hacia la no libertad*, advierte sobre la otra cara de la misma moneda: los regímenes autoritarios también han dominado el poder en red. No mediante censura, sino mediante desinformación, manipulación de la atención y la creación de un caos informativo en el que la verdad y la falsedad se vuelven indistinguibles. La netocracia es una herramienta neutral. Funciona en ambas direcciones.\n\n> Srinivasan propone el siguiente nivel de la lógica netocrática: no solo entender y usar redes, sino construir nuevas formaciones políticas sobre su base. Los netócratas no esperan a que se reformen los sistemas existentes. Construyen sistemas paralelos.\n\nEsto no significa necesariamente crear un nuevo estado. Para la mayoría de los netócratas, significa construir comunidades con identidad y economía reales, no solo audiencias. Poseer la infraestructura de tus vínculos en lugar de alquilarla a plataformas.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1%80%D0%BE%D0%BA%20%D0%B4%D0%BB%D1%8F%20XXI%20%D0%B2%D0%B5%D0%BA%D0%B0%20%282018%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман, Дэвид Лайон — Liquid Surveillance (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netocracia", "gobernanza", "comunidad", "redes"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "frankl", "sceneIndex": 5, "type": "privacy", "shortTitle": "Frankl", "era": "elección final", "lensWeight": {"diagnosis": 1, "class": 1, "competence": 2, "exit": 2, "ethics": 5}, "title": "Frankl y la elección final", "insight": "Frankl: la libertad final es la elección de la actitud ante las circunstancias. No elegiste las condiciones de la era digital. Pero sí eliges qué hacer con ellas. Entender sin ética es una herramienta sin propósito.", "thesis": "Frankl: la libertad final es la elección de la actitud ante las circunstancias. No elegiste las condiciones de la era digital. Pero sí eliges qué hacer con ellas. Entender sin ética es una herramienta sin propósito.", "body": "## El filósofo del campo de concentración\n\nViktor Frankl era un psiquiatra austriaco. En 1942 fue deportado a campos de concentración nazis. Pasó por Auschwitz, Dachau y otros campos. Perdió a su esposa, a sus padres y a su hermano. Pasó tres años en condiciones cuya descripción cuesta leer sin una reacción física.\n\nAl ser liberado en 1945, escribió en nueve días el libro *El hombre en busca de sentido*. Se convirtió en uno de los libros más influyentes del siglo XX y en uno de los más importantes para entender qué significa ser humano dentro de sistemas que no elegiste.\n\nLa observación clave de Frankl, hecha en condiciones que cuesta incluso imaginar: a una persona no se le puede arrebatar la última libertad. Todo lo demás sí se puede: la libertad física, las posesiones, los seres queridos, la dignidad a los ojos de otros. Pero no se puede arrebatar la libertad de elegir la propia actitud ante las circunstancias. En cualquier situación queda un espacio entre el estímulo y la respuesta. Y en ese espacio está la dignidad humana.\n\n## Por qué Frankl está aquí\n\n¿Por qué un filósofo de un campo de concentración aparece en el capítulo final de un curso sobre internet y netocracia?\n\nPorque todo este curso trataba sobre condiciones que no elegiste.\n\nNo elegiste nacer en la era de los teléfonos inteligentes y los algoritmos. No elegiste la economía de la atención, que monetiza tu tiempo sin tu consentimiento consciente. No elegiste la arquitectura de las redes sociales, diseñada mediante el refuerzo variable de Skinner. No elegiste la concentración del poder en manos de unas pocas plataformas.\n\nNo elegiste estas condiciones. Pero sí eliges qué hacer con este conocimiento.\n\nFrankl escribió sobre otro contexto, incomparablemente más brutal. Pero su principio es universal: la situación define las circunstancias; la persona define la respuesta a esas circunstancias. No son las condiciones las que te convierten en consumtariado o en netócrata. Lo hace tu elección.\n\n## La libertad sin responsabilidad no es libertad\n\nHay otra dimensión de Frankl que importa en este contexto.\n\nEscribió: la libertad sin responsabilidad es arbitrariedad. La libertad verdadera es la libertad unida a la responsabilidad por las consecuencias de tus elecciones.\n\nTimothy Snyder advirtió que esa misma lógica netocrática - entender redes, gestionar la atención, crear narrativas - puede usarse para destruir la democracia, difundir desinformación y manipular a las personas a gran escala. Los regímenes autoritarios lo entendieron y lo usan.\n\nUn netócrata que construye sistemas sin entender sus consecuencias, sin una brújula ética, reproduce los mismos problemas que criticamos en las plataformas Web2. Solo que más rápido, porque entiende mejor la arquitectura. Y a mayor escala.\n\nEntender es una herramienta. Como cualquier herramienta, no tiene ética propia. Un martillo puede servir para construir o para destruir. El conocimiento de la arquitectura de las redes puede servir para crear sistemas abiertos que nivelen oportunidades, o para crear sistemas de manipulación más sofisticados.\n\nEn el campo, Frankl observó ambos tipos de personas: las que, en condiciones inhumanas, conservaron la dignidad y ayudaron a otros, y las que, en esas mismas condiciones, traicionaron y explotaron a los débiles. Las condiciones eran las mismas. Las elecciones, distintas.\n\n> Frankl lo formuló así: la última libertad del ser humano es elegir la actitud ante las circunstancias. Tú no elegiste las condiciones de la era digital. Pero sí eliges qué hacer con ellas. Y cómo.\n\nEsta es la reflexión final del curso. No es técnica. No es económica. Es humana. La netocracia es una clase abierta; la barrera de entrada es el entendimiento. Pero el entendimiento sin ética es una herramienta sin propósito. Lo que construyas depende solo de ti.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1%80%D0%BE%D0%BA%20%D0%B4%D0%BB%D1%8F%20XXI%20%D0%B2%D0%B5%D0%BA%D0%B0%20%282018%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман, Дэвид Лайон — Liquid Surveillance (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netocracia", "filosofía", "ética", "libertad"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "luminara", "sceneIndex": 6, "type": "power", "shortTitle": "¿Qué sigue?", "era": "→acción", "lensWeight": {"diagnosis": 2, "class": 3, "competence": 5, "exit": 4, "ethics": 4}, "title": "Luminara: terminaste de leer. ¿Qué sigue?", "insight": "Has completado el primer nivel de competencia netocrática: comprender la arquitectura. El segundo nivel: gestión de la atención. El tercero: creación de infraestructura. El próximo curso es para quienes eligen actuar.", "thesis": "Has completado el primer nivel de competencia netocrática: comprender la arquitectura. El segundo nivel: gestión de la atención. El tercero: creación de infraestructura. El próximo curso es para quienes eligen actuar.", "body": "## El objetivo oculto de este curso\n\nEste curso se llamaba «Fundamentos del nuevo internet». Ocho capítulos. Desde las matemáticas de Shannon hasta la blockchain de Nakamoto. Desde los primeros foros hasta TikTok. Del sueño de un conocimiento libre al capitalismo de vigilancia, y de ahí a la nueva arquitectura que construye Web3.\n\nPero el curso tenía un objetivo oculto, que ahora puede decirse de forma directa.\n\nNo solo estábamos explicando cómo funciona internet. Te estábamos preparando para una elección.\n\nUna elección entre el consumtariat y la netocracia. Entre quienes viven en redes sin entender su arquitectura, y quienes la entienden y actúan con conciencia. Entre quienes producen valor para las plataformas sin recibir nada más que la ilusión de participar, y quienes construyen plataformas, gestionan su parte en ellas o al menos entienden qué pagan por los servicios \"gratis\".\n\n## Lo que obtuviste de este curso\n\nBard y Zoderkvist describieron el primer nivel de competencia netocrática como comprender la arquitectura. Tú ya lo superaste.\n\nEntiendes por qué la información se convirtió en el principal recurso de poder, desde Shannon y Castells. Sabes cómo Web1 creó un internet abierto y por qué esa apertura se usó contra los usuarios. Comprendes la mecánica de la economía de la atención y del capitalismo de vigilancia, desde Simon hasta Zuboff. Ves cómo los algoritmos crean burbujas de filtro y polarizan a la sociedad, y por qué esto no es mala intención sino una consecuencia arquitectónica de optimizar el engagement. Sabes la diferencia entre Web 3.0 y Web3. Entiendes qué es una clave privada y por qué \"not your keys — not your coins\". Sabes cómo funcionan los contratos inteligentes, DeFi y DAO. Entiendes qué son la netocracia y el consumtariat, y en qué nivel estás ahora.\n\nEste es el primer nivel. Necesario. Pero insuficiente.\n\n## El siguiente paso\n\nChris Dixon describió tres eras de internet: leer, escribir, poseer. Leíste un curso sobre esas eras. Ahora es el momento de pasar al siguiente verbo.\n\nEl segundo nivel de competencia netocrática es la gestión de la atención. La capacidad de crear significados, construir comunidades y monetizar directamente el conocimiento y las conexiones. La capacidad de no entregar tu atención a los algoritmos, sino dirigirla de forma consciente.\n\nEl tercer nivel es la creación de infraestructura. Protocolos, tokenómica, DAO, identidad digital. La arquitectura de sistemas en los que tú mismo estableces las reglas.\n\nLuminara está construyendo los siguientes cursos precisamente para eso. No para que \"entiendas las criptos\" en un sentido abstracto. Sino para que puedas actuar en el segundo y tercer nivel. Entender herramientas concretas. Usarlas. Construir sobre su base.\n\nBard y Zoderkvist escribieron: la netocracia es una clase abierta. La barrera de entrada es la comprensión. Y el deseo de seguir aprendiendo más allá de la mayoría.\n\nLlegaste hasta el final del curso gratis. Eso ya es una señal: la mayoría no llega. La mayoría hace scroll sin leer. La mayoría consume y no hace preguntas.\n\nTú las haces.\n\n> Frankl escribió: en cualquier circunstancia, una persona conserva la última libertad: elegir su actitud frente a ellas. Tú no elegiste las condiciones de la era digital. Pero eliges qué hacer con ellas. El siguiente curso es para quienes eligen actuar.\n\nBienvenido a Luminara.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%
