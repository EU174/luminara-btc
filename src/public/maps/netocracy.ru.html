 հասկանալը նպատակ չունեցող գործիք է։", "body": "## Համակենտրոնացման ճամբարից դուրս եկած փիլիսոփան\n\nՎիկտոր Ֆրանկլը ավստրիացի հոգեբույժ էր։ 1942 թվականին նրան արտաքսեցին նացիստական համակենտրոնացման ճամբարներ։ Նա անցավ Օսվենցիմով, Դախաուով և այլ ճամբարներով։ Կորցրեց կնոջը, ծնողներին, եղբորը։ Երեք տարի անցկացրեց պայմաններում, որոնց նկարագրությունը դժվար է կարդալ առանց ֆիզիկական արձագանքի։\n\n1945 թվականին ազատ արձակվելուց հետո նա ինը օրում գրեց *Man's Search for Meaning* գիրքը։ Այն դարձավ XX դարի ամենաազդեցիկ գրքերից մեկը և ամենակարևորներից մեկը՝ հասկանալու համար, թե ինչ է նշանակում մարդ լինել այնպիսի համակարգերի ներսում, որոնք դու չես ընտրել։\n\nՖրանկլի հիմնական դիտարկումը, արված պայմաններում, որոնք նույնիսկ պատկերացնելն է դժվար. մարդուց չի կարելի խլել վերջին ազատությունը։ Մնացած ամեն ինչ կարելի է վերցնել՝ ֆիզիկական ազատությունը, ունեցվածքը, հարազատներին, ուրիշների աչքում ունեցած արժանապատվությունը։ Բայց չի կարելի խլել սեփական վերաբերմունքը պայմանների նկատմամբ ընտրելու ազատությունը։ Ցանկացած պայմաններում մնում է տարածք ազդակին և արձագանքին միջև։ Եվ հենց այդ տարածքում է մարդկային արժանապատվությունը։\n\n## Ինչու է Ֆրանկլը այստեղ\n\nԻնչո՞ւ է համակենտրոնացման ճամբարից դուրս եկած փիլիսոփան հայտնվում ինտերնետի և նետոկրատիայի մասին դասընթացի վերջին գլխում։\n\nՈրովհետև այս ամբողջ դասընթացը այն պայմանների մասին էր, որոնք դու չես ընտրել։\n\nԴու չես ընտրել ծնվել սմարթֆոնների և ալգորիթմների դարաշրջանում։ Չես ընտրել ուշադրության տնտեսությունը, որը քո ժամանակը մոնետիզացնում է առանց քո գիտակցված համաձայնության։ Չես ընտրել սոցիալական ցանցերի ճարտարապետությունը, որը նախագծված է Սքինների փոփոխական ամրապնդման միջոցով։ Չես ընտրել իշխանության կենտրոնացումը մի քանի հարթակների ձեռքում։\n\nԴու չես ընտրել այս պայմանները։ Բայց ընտրում ես, թե ինչ անել այս գիտելիքի հետ։\n\nՖրանկլը գրում էր այլ՝ անհամեմատ ավելի դաժան համատեքստի մասին։ Բայց նրա սկզբունքը համընդհանուր է. իրավիճակը սահմանում է հանգամանքները, մարդը՝ դրանց պատասխանը։ Քեզ կոնսյումտարիատի կամ նետոկրատի չի դարձնում պայմանը։ Դրանք դարձնում է քո ընտրությունը։\n\n## Պատասխանատվություն չունեցող ազատությունը ազատություն չէ\n\nՖրանկլի ևս մեկ շերտ կա, որը կարևոր է այս համատեքստում։\n\nՆա գրում էր. պատասխանատվություն չունեցող ազատությունը կամայականություն է։ Իրական ազատությունը ազատությունն է, որը կապված է քո ընտրությունների հետևանքների պատասխանատվության հետ։\n\nՏիմոթի Սնայդերը զգուշացնում էր. նույն նետոկրատական տրամաբանությունը՝ ցանցերը հասկանալը, ուշադրությունը կառավարելը, նարատիվներ ստեղծելը, կարող է օգտագործվել ժողովրդավարությունը քանդելու, ապատեղեկատվություն տարածելու, մարդկանց մասշտաբային մանիպուլյացիայի համար։ Ավտորիտար ռեժիմները դա հասկացան և օգտագործում են։\n\nՆետոկրատը, որը կառուցում է համակարգեր՝ առանց դրանց հետևանքները հասկանալու, առանց էթիկական կողմնացույցի, կրկնում է նույն խնդիրները, որոնք մենք քննադատում էինք Web2 հարթակներում։ Միայն ավելի արագ, որովհետև ավելի լավ է հասկանում ճարտարապետությունը։ Եվ ավելի մեծ մասշտաբով։\n\nՀասկանալը գործիք է։ Ինչպես ցանկացած գործիք, այն ինքնուրույն էթիկա չունի։ Մուրճը կարելի է օգտագործել կառուցելու կամ կործանելու համար։ Ցանցերի ճարտարապետության իմացությունը կարելի է օգտագործել հնարավորությունները հավասարեցնող բաց համակարգեր ստեղծելու համար, կամ ավելի նուրբ մանիպուլյացիայի համակարգեր ստեղծելու համար։\n\nՖրանկլը ճամբարում դիտում էր մարդկանց երկու տեսակ էլ՝ նրանց, ովքեր անմարդկային պայմաններում պահպանում էին արժանապատվությունը և օգնում մյուսներին, և նրանց, ովքեր նույն պայմաններում դավաճանում էին ու շահագործում թույլերին։ Պայմանները նույնն էին։ Ընտրությունները՝ տարբեր։\n\n> Ֆրանկլը դա ձևակերպեց այսպես. մարդու վերջին ազատությունը պայմանների նկատմամբ սեփական վերաբերմունքն ընտրելն է։ Դու չես ընտրել թվային դարաշրջանի պայմանները։ Բայց ընտրում ես, թե ինչ անել դրանց հետ։ Եվ ինչպես։\n\nՍա դասընթացի վերջնական մտորումն է։ Ոչ տեխնիկական։ Ոչ տնտեսական։ Մարդկային։ Նետոկրատիան բաց դաս է, մուտքի արգելքը՝ հասկանալը։ Բայց էթիկա չունեցող հասկանալը նպատակ չունեցող գործիք է։ Այն, ինչ կկառուցես, կախված է միայն քեզանից.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетокра մը։ Երրորդը՝ ենթակառուցվածքի ստեղծումը։ Հաջորդ դասընթացը նրանց համար է, ովքեր ընտրում են գործել։", "body": "## Այս դասընթացի թաքնված նպատակը\n\nԱյս դասընթացը կոչվում էր «Նոր ինտերնետի հիմունքները»։ Ութ գլուխ։ Շենոնի մաթեմատիկայից մինչև Նակամոտոյի բլոկչեյնը։ Առաջին ֆորումներից մինչև TikTok։ Ազատ գիտելիքի երազանքից մինչև հսկողության կապիտալիզմը, և այնտեղից դեպի նոր ճարտարապետությունը, որը կառուցում է Web3-ը։\n\nԲայց դասընթացն ուներ թաքնված նպատակ, որը հիմա կարելի է ուղիղ ասել։\n\nՄենք պարզապես չէինք բացատրում, թե ինչպես է աշխատում ինտերնետը։ Մենք քեզ պատրաստում էինք ընտրության։\n\nԸնտրության՝ կոնսյումտարիատի և նետոկրատիայի միջև։ Միջև նրանց, ովքեր ապրում են ցանցերում՝ առանց հասկանալու դրանց ճարտարապետությունը, և նրանց, ովքեր հասկանում են ու գիտակցաբար են գործում։ Միջև նրանց, ովքեր արժեք են արտադրում հարթակների համար՝ չստանալով ոչինչ, բացի մասնակցության պատրանքից, և նրանց, ովքեր հարթակներ են կառուցում, տնօրինում դրանց մեջ իրենց բաժինը կամ գոնե հասկանում են, թե ինչով են վճարում «անվճար» ծառայությունների համար։\n\n## Ինչ ստացար այս դասընթացից\n\nԲարդը և Զոդերկվիստը նետոկրատական կարողության առաջին մակարդակը նկարագրել են որպես ճարտարապետության ըմբռնում։ Դու անցար այն։\n\nԴու հասկանում ես, թե ինչու տեղեկատվությունը դարձավ իշխանության գլխավոր ռեսուրսը՝ Շենոնից և Կաստելսից սկսած։ Գիտես, թե ինչպես Web1-ը ստեղծեց բաց ինտերնետը և ինչու այդ բացությունը օգտագործվեց օգտատերերի դեմ։ Հասկանում ես ուշադրության տնտեսության և հսկողության կապիտալիզմի մեխանիկան՝ Սայմոնից մինչև Զուբոֆ։ Տեսնում ես, թե ինչպես են ալգորիթմները ստեղծում ֆիլտրային պղպջակներ և բևեռացնում հասարակությունը, և ինչու սա չար մտադրություն չէ, այլ ներգրավվածության օպտիմալացման ճարտարապետական հետևանք է։ Գիտես Web 3.0-ի և Web3-ի տարբերությունը։ Հասկանում ես, թե ինչ է մասնավոր բանալին և ինչու «not your keys — not your coins»։ Գիտես, թե ինչպես են աշխատում smart contract-ները, DeFi-ն ու DAO-ն։ Հասկանում ես, թե ինչ են նետոկրատիան և կոնսյումտարիատը, և հիմա որ մակարդակում ես գտնվում։\n\nՍա առաջին մակարդակն է։ Անհրաժեշտ։ Բայց ոչ բավարար։\n\n## Հաջորդ քայլը\n\nՔրիս Դիքսոնը նկարագրել է ինտերնետի երեք էպոխաները՝ կարդալ, գրել, տիրել։ Դու կարդացիր այս էպոխաների մասին դասընթացը։ Հիմա ժամանակն է անցնել հաջորդ բային։\n\nՆետոկրատական կարողության երկրորդ մակարդակը ուշադրության կառավարումն է։ Իմաստներ ստեղծելու, համայնքներ կառուցելու, գիտելիքն ու կապերը ուղղակիորեն մոնետիզացնելու կարողությունը։ Քո ուշադրությունը ալգորիթմներին չզիջելու, այլ այն գիտակցաբար ուղղորդելու կարողությունը։\n\nԵրրորդ մակարդակը ենթակառուցվածք ստեղծելն է։ Պրոտոկոլներ, տոքենոմիկա, DAO, թվային ինքնություն։ Համակարգերի ճարտարապետություն, որոնցում կանոնները դու ես սահմանում։\n\nLuminara-ն հենց դրա համար է կառուցում հաջորդ դասընթացները։ Ոչ թե նրա համար, որ դու «կրիպտոն հասկանաս» վերացական իմաստով։ Այլ նրա համար, որ կարողանաս գործել երկրորդ և երրորդ մակարդակներում։ Հասկանալ կոնկրետ գործիքները։ Օգտագործել դրանք։ Կառուցել դրանց հիմքի վրա։\n\nԲարդը և Զոդերկվիստը գրել են. նետոկրատիան բաց դաս է։ Մուտքի արգելքը՝ ըմբռնումը։ Եվ մեծամասնությունից ավելի հեռուն սովորելու ցանկությունը։\n\nԴու ավարտեցիր անվճար դասընթացը մինչև վերջ։ Դա արդեն ազդանշան է. մեծամասնությունը չի հասնում այդտեղ։ Մեծամասնությունը սքրոլ է անում՝ առանց կարդալու։ Մեծամասնությունը սպառում է և հարցեր չի տալիս։\n\nԴու հարցեր ես տալիս։\n\n> Ֆրանկլը գրել է. ցանկացած հանգամանքներում մարդն ունի վերջին ազատությունը՝ իր վերաբերմունքը դրանց նկատմամբ ընտրելու ազատությունը։ Դու չես ընտրել թվային դարաշրջանի պայմանները։ Բայց ընտրում ես, թե ինչ անել դրանց հետ։ Հաջորդ դասընթացը նրանց համար է, ովքեր ընտրում են գործել։\n\nԲարի գալուստ Luminara.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)",   CHAPTER_DATA.nodes.forEach((n,i)=>{ const s=src.nodes[i];
    n.shortTitle=s.shortTitle; n.era=s.era; n.title=s.title; n.insight=s.insight;
    n.thesis=s.thesis; n.body=s.body; n.tags=s.tags; });
  CHAPTER_DATA.edges.forEach((e,i)=>{ e.label=src.edges[i].label; });
  // UI-строки
  const _U = UI_I18N[l] || UI_I18N.ru; const _R = UI_I18N.ru || {};
  const U = {}; Object.keys(_R).forEach(k=>{ U[k] = (_U[k] && String(_U[k]).trim()) ? _U[k] : _R[k]; });
  document.documentElement.lang = l;
  const t=document.getElementById('app-title'); if(t) t.textContent=src.chapter.title;
  const ld=document.querySelector('.chapter-lede'); if(ld) ld.textContent=src.chapter.lede;
  document.querySelectorAll('[data-ui]').forEach(el=>{ const k=el.getAttribute('data-ui'); if(U[k]) el.textContent=U[k]; });
  // локализованный typeLabel + перестройка линз (иначе останутся на языке сборки)
  window.__UI_LOC = U;
  try{ buildLenses(); setLens(state.lens); }catch(e){}
  // перерисовать карту/деталь/прогресс
  try{ renderAll(); }catch(e){}
  // отметить активную кнопку языка
  document.querySelectorAll('.lang-btn').forEach(b=>b.setAttribute('aria-pressed', b.getAttribute('data-lang')===l ? 'true':'false'));
}
function buildLangSwitcher(){
  const rail=document.querySelector('.rail'); if(!rail) return;
  const wrap=document.createElement('div'); wrap.className='lang-switch';
  LANGS.forEach(l=>{ const b=document.createElement('button'); b.className='lang-btn'; b.type='button';
    b.setAttribute('data-lang',l); b.textContent=LANG_LABELS[l];
    b.addEventListener('click',()=>applyLang(l)); wrap.appendChild(b); });
  rail.insertBefore(wrap, rail.firstChild);
}


window.addEventListener("message",function(ev){try{var d=ev.data||{};if(d.lang){applyLang(d.lang);}}catch(e){}});
async function boot(){buildLangSwitcher();var _q=new URLSearchParams(location.search).get("lang");var _h=(location.hash.match(/[?&]lang=([a-z]{2})/)||[])[1];var _lp=_q||_h;if(_lp)CURRENT_LANG=pickLang(_lp);buildLenses();setLens(state.lens);applyLang(CURRENT_LANG);}
document.addEventListener("DOMContentLoaded",()=>{try{boot();}catch(e){renderEmptyState("Ошибка инициализации: "+e.message);}});
</script>
