1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netocracy", "power", "history", "networks"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "netocrat", "sceneIndex": 1, "type": "media", "shortTitle": "Нетократ", "era": "2000", "lensWeight": {"diagnosis": 3, "class": 5, "competence": 4, "exit": 2, "ethics": 1}, "title": "Бард и Зодерквист: анатомия нетократа", "insight": "Бард и Зодерквист описали нетократа через пять характеристик: аттенциальный капитал, сетевая идентичность, кураторство, архитектура связей, создание смыслов. Барьер входа — понимание, а не деньги.", "thesis": "Бард и Зодерквист описали нетократа через пять характеристик: аттенциальный капитал, сетевая идентичность, кураторство, архитектура связей, создание смыслов. Барьер входа — понимание, а не деньги.", "body": "## Книга, написанная слишком рано\n\nВ 2000 году Александр Бард и Ян Зодерквист опубликовали «Нетократию». Момент был катастрофически неудачным: интернет-пузырь только что лопнул, тысячи компаний обанкротились, всеобщее разочарование в «новой экономике» достигло пика. Никто не хотел слышать о новых элитах сетевой эпохи. Книгу практически проигнорировали.\n\nЧерез двадцать пять лет она читается как точная карта мира, в котором мы живём.\n\nЦентральный тезис Барда и Зодерквиста: каждая экономическая система порождает свой правящий класс. Феодализм породил аристократию — тех, кто владел землёй. Промышленный капитализм породил буржуазию — тех, кто владел капиталом, заводами, банками. Информационная эпоха порождает нетократию — тех, кто владеет вниманием и умеет управлять сетями.\n\nЭто не метафора и не социологическая абстракция. Это описание конкретного механизма власти, который работает прямо сейчас.\n\n## Пять характеристик нетократа\n\nБард и Зодерквист описывают нетократа через набор характеристик — и каждая из них контрастирует с тем, что ценилось в индустриальную эпоху.\n\n**Аттенциальный капитал.** Главный ресурс нетократа — не деньги и не знания сами по себе. Это способность управлять вниманием: своим и чужим. В мире информационного изобилия дефицитен не контент, а внимание. Нетократ умеет его концентрировать, направлять и монетизировать. Он знает, где сейчас находится внимание миллионов — и как его привлечь к нужному.\n\n**Сетевая идентичность.** Нетократ строит статус через сети, а не через институты. Его ценность определяется не должностью в компании, не дипломом, не регалиями — а качеством его связей, репутацией в сообществах, влиянием на информационные потоки. Он может быть анонимом в интернете — и обладать большей реальной властью, чем директор крупной корпорации с солидным CV.\n\n**Куратор, а не потребитель.** В мире, где информации бесконечно много, тот, кто умеет выбирать важное и отфильтровывать шум, обладает огромной властью. Нетократ не просто потребляет информацию — он её отбирает, интерпретирует и распространяет. Это и есть его работа: быть надёжным фильтром для своей аудитории.\n\n**Архитектура связей.** Нетократ понимает: ценность сети зависит от её участников. Он инвестирует в отношения стратегически — строит архитектуру связей, а не просто «нетворкает» в старом смысле. Доступ к нужным людям в нужный момент важнее любого другого ресурса. Это не цинизм — это понимание того, как на самом деле работает мир.\n\n**Создатель смыслов.** В мире, где факты общедоступны, власть принадлежит тому, кто даёт факты в контексте. Кто объясняет, что они значат. Кто формирует рамку, через которую другие видят реальность. Нетократ — не просто информатор. Он создаёт нарративы.\n\nКастельс подтверждает: в истории всегда побеждал тот, кто контролировал коммуникацию. Церковь в средние века — через грамотность и рукописи. Буржуазия — через печатный станок. Индустриальные элиты — через массовые СМИ. Теперь нетократы осваивают алгоритмы, протоколы и децентрализованные сети. Инструменты меняются — логика одна.\n\n> Нетократ — это не обязательно богатый или известный человек. Это человек, который понимает, как работают сети, и умеет в них действовать стратегически. Аттенциальный капитал, сетевая идентичность, создание смыслов — вот его настоящие активы.\n\nВажно: Бард и Зодерквист подчёркивают — нетократия не закрытый клуб по происхождению. Это открытый класс, барьер входа в который определяется пониманием, а не деньгами или связями по рождению. Это принципиальное отличие от аристократии и буржуазии.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%  1, "ethics": 2}, "title": "Консьюмтариат: иллюзия участия", "insight": "Консьюмтариат — это те, кто производит ценность в сетях, не понимая этого. Иллюзия участия через лайки и комментарии — архитектурный механизм удержания. Осознание — первый шаг к выходу.", "thesis": "Консьюмтариат — это те, кто производит ценность в сетях, не понимая этого. Иллюзия участия через лайки и комментарии — архитектурный механизм удержания. Осознание — первый шаг к выходу.", "body": "## Новое неравенство, которое труднее увидеть\n\nБард и Зодерквист предупреждали: информационная революция не освобождает всех автоматически. Она создаёт новый тип неравенства — более трудноуловимый, чем имущественное, и потому более опасный.\n\nКонсьюмтариат — это не просто «потребители» в экономическом смысле. Это люди, которые активно участвуют в сетях, создают контент, взаимодействуют с платформами — и при этом не понимают, что происходит на самом деле. Они думают, что развлекаются или общаются. На самом деле — производят ценность для других.\n\nРазбери механизм по шагам. Пользователь Facebook публикует фотографию. Он тратит время (невозобновляемый ресурс), творческую энергию, личные данные. Facebook получает контент (который привлекает других пользователей), данные о его поведении (ценное сырьё для рекламодателей), рекламный инвентарь (монетизация внимания). Пользователь получает лайки — то есть переменное подкрепление по Скиннеру, которое заставляет его возвращаться и производить ещё больше.\n\nКто в этой сделке нетократ? Facebook — он понимает архитектуру и выстраивает её в своих интересах. Кто консьюмтариат? Пользователь — он участвует, не понимая условий.\n\nПосмотри на другой пример. Пользователь TikTok смотрит видео по 90 минут в день. TikTok получает: данные о его предпочтениях (точный психологический профиль), рекламный доход (монетизация внимания), сигналы для обучения алгоритма (который становится умнее и точнее). Пользователь получает: развлечение и дофаминовые всплески от переменного подкрепления. Кто здесь работает на кого?\n\n## Ловушка псевдоучастия\n\nСамый коварный механизм, описанный Бардом и Зодерквистом, — иллюзия участия. Это то, что удерживает консьюмтариат в системе без осознания своего положения.\n\nКонсьюмтариат чувствует себя активным участником. Он голосует лайками — ощущение влияния. Он пишет комментарии — ощущение голоса. Он делится контентом — ощущение значимости. Ему кажется, что он влияет на то, что происходит в его информационном пространстве. В действительности он создаёт данные, на основе которых нетократы — создатели алгоритмов, владельцы платформ — принимают реальные решения о том, что он увидит завтра.\n\nЭто не заговор. Это архитектура. Платформы спроектированы максимизировать ощущение участия при минимальных реальных правах. Ты «владеешь» профилем — но платформа может удалить его без предупреждения. Ты «создаёшь» контент — но алгоритм решает, кто его увидит. Ты «общаешься» с друзьями — но платформа контролирует, что ты о них знаешь и в каком порядке получаешь информацию.\n\nМишель Фуко описал паноптикум — идеальную тюрьму, где заключённые не знают, наблюдают ли за ними прямо сейчас. В результате они ведут себя так, будто наблюдают постоянно. Самоцензура становится встроенной. Бауман и Лайон в «Liquid Surveillance» показали: современный надзор работает так же — только добровольно. Никто не заставляет тебя устанавливать приложения, которые отслеживают каждый шаг. Ты делаешь это сам. Потому что удобно. Потому что все так делают. Потому что иначе выпадаешь из социальной жизни.\n\nЗубофф называла это «поведенческими излишками»: ценность, которую люди создают своими действиями в сети, изымается платформами и продаётся. Консьюмтариат производит эти излишки — не осознавая, что это и есть его главная функция в системе.\n\n> Консьюмтариат — это не те, кто «не умеет пользоваться интернетом». Это те, кто пользуется им, не понимая его архитектуры. Иллюзия участия — самый эффективный механизм удержания в системе, которая тебя использует.\n\nПонимание этого механизма — первый шаг к выходу из консьюмтариата. Не отказ от платформ — а изменение отношения к ним. От «я пользуюсь сервисом» к «я понимаю, чем я плачу за этот сервис и стоит ли оно того».", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1%80%D0%BE%D0%BA%20%D0%B4%D0%BB%D1%8F%20XXI%20%D0%B2%D0%B5%D0%BA%D0%B0%20%282018%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман, Дэвид Лайон — Liquid Surveillance (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netocracy", "attention", "platforms", "power"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "levels", "sceneIndex": 3, "type": "technology", "shortTitle": "Три уровня", "era": "компетенция", "lensWeight": {"diagnosis": 1, "class": 3, "competence": 5, "exit": 3, "ethics": 2}, "title": "Три уровня нетократической компетенции", "insight": "Три уровня нетократии: понимание архитектуры → управление вниманием → создание инфраструктуры. Нетократия — открытый класс. Барьер входа — понимание, а не деньги или происхождение.", "thesis": "Три уровня нетократии: понимание архитектуры → управление вниманием → создание инфраструктуры. Нетократия — открытый класс. Барьер входа — понимание, а не деньги или происхождение.", "body": "## Нетократия — открытый класс\n\nПрежде чем описывать уровни компетенции — важно повторить принципиальный момент из Барда и Зодерквиста: нетократия не является закрытым клубом по происхождению.\n\nАристократия строилась на крови: нужно было родиться в правильной семье. Буржуазия строилась на капитале: нужно было унаследовать или накопить. Нетократия строится на понимании. А понимание — приобретаемо.\n\nСын профессора из Москвы может вырасти консьюмтариатом — если просто потребляет сети, не понимая их. Человек из маленького города, не имеющий формального образования, может стать нетократом — если поймёт, как работают сети, раньше окружающих.\n\nЭто принципиально меняет разговор об образовании. Харари в «21 уроке для XXI века» сформулировал, что именно нужно понимать в XXI веке: не факты — их можно найти за секунды. Нужно понимать, как создаётся знание. Кто и зачем создаёт те или иные нарративы. Как алгоритмы формируют реальность. Как отличить манипуляцию от информации. Это и есть грамотность нетократа.\n\n## Первый уровень: понимание архитектуры\n\nЭто фундамент. Ты знаешь, как работают сети — не в техническом смысле, а в экономическом и властном.\n\nТы понимаешь сетевые эффекты и почему они создают монополии. Знаешь, почему платформы «бесплатны» и что они берут взамен. Понимаешь алгоритмы не как волшебство, а как оптимизацию конкретных метрик — и знаешь, какие метрики оптимизирует каждая платформа. Знаешь разницу между кастодиальным и некастодиальным хранением активов. Понимаешь, что такое смарт-контракт и почему это меняет отношения власти.\n\nЭтот уровень — необходимый, но недостаточный. Понимание без действия не меняет ничего. Но без понимания — любое действие вслепую.\n\nКстати: ты только что завершил курс, который дал тебе этот первый уровень. От Шеннона и математики информации до токеномики и DAO. Это не случайность — это архитектура курса.\n\n## Второй уровень: управление вниманием\n\nЭто уровень навыка — когда понимание становится действием.\n\nУправление своим вниманием: ты не позволяешь алгоритмам решать за тебя, что важно. Ты осознанно выбираешь, на что тратить время — это главный невозобновляемый ресурс. Ты понимаешь, когда платформа пытается манипулировать тобой через переменное подкрепление, и можешь выйти из этой петли.\n\nУправление чужим вниманием: ты умеешь создавать смыслы, которые распространяются. Строить сообщества вокруг идей. Формировать нарративы, которые люди хотят передавать дальше. Это не манипуляция — это коммуникация на уровне, на который большинство людей не поднимается.\n\nНа этом уровне ты уже можешь строить аудитории, влиять на сообщества, монетизировать свои знания и связи напрямую — не через алгоритм платформы.\n\n## Третий уровень: создание инфраструктуры\n\nЭто уровень архитектора. Ты не просто используешь существующие сети — ты строишь новые.\n\nСоздаёшь протоколы и проектируешь стимулы, которые выравнивают интересы участников. Строишь DAO и токеномику, которая делает участников совладельцами, а не только пользователями. Создаёшь сообщества с общей идентичностью и экономикой — где принадлежность имеет реальную ценность.\n\nНа этом уровне ты сам становишься источником правил. Ты не играешь по чужим правилам — ты проектируешь среду, в которой другие будут действовать.\n\nБольшинство людей никогда не поднимаются выше первого уровня — и не потому что не способны. А потому что не знают о существовании этой лестницы. Теперь ты знаешь.\n\n> Три уровня нетократической компетенции: понимание архитектуры → управление вниманием → создание инфраструктуры. Большинство людей на первом не знают о втором и третьем. Ты только что узнал.\n\nКрис Диксон в «Read Write Own» описал три эпохи интернета через глаголы: читать (Web1), писать (Web2), владеть (Web3). Это и есть три уровня нетократии. Большинство читают. Меньше — пишут. Единицы — владеют. Окно в эпоху владения открыто прямо сейчас.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bk
