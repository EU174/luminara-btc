<style>
:root{

  --accent: oklch(72% 0.261 295); --accent-2: oklch(82% 0.174 205); --accent-3: oklch(80% 0.189 85); --accent-4: oklch(78% 0.203 155);

  --glass: oklch(11% 0.026 285 / 0.7); --scrim: oklch(0% 0 0 / 0.6);

  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
}
[data-theme="light"]{
  --bg: oklch(98% 0.006 285); --bg-surface: oklch(96% 0.009 285); --bg-elev: oklch(93.5% 0.012 285);
  --bg-card: oklch(97% 0.007 285); --bg-tint: oklch(91% 0.014 285);
  --line: oklch(82% 0.017 285); --line-soft: oklch(88% 0.014 285); --line-strong: oklch(70% 0.026 285);
  --text: oklch(22% 0.043 285); --text-mid: oklch(40% 0.036 285); --text-muted: oklch(55% 0.041 285); --text-dim: oklch(68% 0.032 285);
  --accent: oklch(55% 0.319 295); --accent-2: oklch(55% 0.232 205); --accent-3: oklch(62% 0.232 60); --accent-4: oklch(55% 0.232 155);
  --power: oklch(58% 0.261 10); --technology: oklch(52% 0.232 155); --media: oklch(58% 0.200 90);
  --privacy: oklch(48% 0.290 290); --economy: oklch(54% 0.220 320);
  --glass: oklch(98% 0.006 285 / 0.85); --scrim: oklch(100% 0 0 / 0.6);

}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
.stars,.stars2{position:fixed;inset:0;pointer-events:none;z-index:0}
.stars{background-image:radial-gradient(1px 1px at 20% 30%,var(--star),transparent),radial-gradient(1px 1px at 70% 60%,var(--star),transparent),radial-gradient(1.5px 1.5px at 40% 80%,var(--star),transparent),radial-gradient(1px 1px at 85% 20%,var(--star),transparent),radial-gradient(1px 1px at 55% 45%,var(--star),transparent),radial-gradient(1px 1px at 10% 70%,var(--star),transparent);background-repeat:repeat;background-size:600px 600px;opacity:.7;animation:drift 120s linear infinite}
.stars2{background-image:radial-gradient(1px 1px at 30% 50%,var(--star),transparent),radial-gradient(1px 1px at 80% 40%,var(--star),transparent),radial-gradient(1px 1px at 60% 75%,var(--star),transparent);background-repeat:repeat;background-size:400px 400px;opacity:.45;animation:drift 80s linear infinite reverse}
@keyframes drift{to{background-position:600px 600px}}
[data-theme="light"] .stars,[data-theme="light"] .stars2{opacity:.25}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 700px at 50% 42%,var(--neb1),transparent 70%),radial-gradient(1200px 900px at 80% 10%,var(--neb2),transparent 60%)}

.app-shell{position:relative;z-index:1;display:grid;grid-template-columns:300px minmax(0,1fr) 340px;height:100vh;width:100vw}
.rail,.detail-panel{background:var(--glass);backdrop-filter:blur(10px);padding:22px;display:flex;flex-direction:column;gap:16px;overflow:auto}
.rail{border-right:1px solid var(--line)}
.detail-panel{border-left:1px solid var(--line);gap:14px}
.eyebrow{margin:0;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:600}
#app-title{margin:2px 0 0;font-family:var(--serif);font-size:29px;line-height:1.05;letter-spacing:-.01em;color:var(--text)}
.chapter-lede{margin:0;color:var(--text-mid);font-size:15.5px;font-family:var(--serif);font-style:italic;line-height:1.5}
.rail-rule{height:1px;background:linear-gradient(90deg,var(--line),transparent);margin:2px 0}
.section-h{margin:0;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted);font-weight:600}
.lens-group{display:flex;flex-wrap:wrap;gap:7px}
.lens-btn{cursor:pointer;border:1px solid var(--line);background:var(--bg-surface);color:var(--text-mid);padding:6px 11px;border-radius:999px;font-size:14.5px;transition:.15s;display:inline-flex;gap:7px;align-items:center;font-weight:500}
.lens-btn:hover{border-color:var(--dot);color:var(--text)}
.lens-btn[aria-pressed="true"]{border-color:var(--dot);color:var(--text);background:var(--bg-elev);box-shadow:0 0 12px -3px var(--dot),0 0 0 1px var(--dot) inset}
.lens-dot{width:9px;height:9px;border-radius:50%;background:var(--dot);box-shadow:0 0 8px var(--dot)}
.lens-desc{margin:0;color:var(--text-mid);font-size:14px;min-height:3.4em;line-height:1.5;font-family:var(--serif)}
.progress-box{font-size:13px;color:var(--text-muted)}
.progress-bar{height:5px;border-radius:5px;background:var(--bg-tint);overflow:hidden;margin-top:6px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:0;transition:width .35s;box-shadow:0 0 10px var(--accent)}
.node-list{display:flex;flex-direction:column;gap:2px;overflow:auto}
.node-list button{text-align:left;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--text-mid);padding:8px 9px;border-radius:9px;font-size:15px;display:flex;gap:10px;align-items:baseline;transition:.12s;font-family:var(--serif)}
.node-list button:hover{background:var(--bg-surface)}
.node-list button[aria-current="true"]{background:var(--bg-elev);color:var(--text);box-shadow:0 0 0 1px var(--dot) inset}
.node-idx{color:var(--text-muted);font-variant-numeric:tabular-nums;font-size:12.5px;min-width:16px;font-family:var(--sans)}

.map-stage{position:relative;overflow:hidden;display:flex}
.system-map{width:100%;display:block}
.ring{fill:none;stroke:var(--line-soft);stroke-width:1;opacity:.6}
.spoke{stroke:var(--line-soft);stroke-width:1;opacity:.5}
.edge path{fill:none;stroke:var(--text-dim);stroke-width:1.3;transition:.25s;opacity:.45;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1s ease forwards}
.edge.active path{stroke:var(--dot,var(--accent));stroke-width:2;opacity:.95;filter:drop-shadow(0 0 5px var(--dot));marker-end:url(#arrow-active)}
@keyframes draw{to{stroke-dashoffset:0}}
.edge-label{fill:var(--text-mid);font-size:15px;opacity:0;transition:.2s;font-family:var(--sans)}
.edge.active .edge-label{opacity:.9}
.sun-glow{fill:var(--accent);opacity:.16;filter:blur(6px);animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.12;r:96}50%{opacity:.26;r:112}}
.sun-core{fill:url(#sunGrad)}
.sun-ring{fill:none;stroke:var(--accent);stroke-width:1.5;opacity:.55}
.sun-t1{fill:var(--sun-ink);font-family:var(--serif);font-size:21px;font-weight:600;text-anchor:middle}
.sun-t2{fill:var(--accent);font-family:var(--sans);font-size:13px;letter-spacing:.22em;text-transform:uppercase;text-anchor:middle}
.node{cursor:pointer;opacity:0;animation:pop .5s ease forwards;animation-delay:var(--delay,0s)}
@keyframes pop{from{opacity:0}to{opacity:1}}
.planet-glow{fill:var(--dot);opacity:.20;filter:blur(3px);transition:.2s}
.planet{stroke:var(--dot);stroke-width:1.5;transition:.2s}
.node:hover .planet{stroke-width:2.4;filter:drop-shadow(0 0 8px var(--dot))}
.node .num{fill:var(--text);font-family:var(--serif);font-size:18px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.node .cap{fill:var(--text);font-family:var(--serif);font-size:19px;font-weight:600}
.node .kicker{fill:var(--text-muted);font-family:var(--sans);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.node .era{fill:var(--dot);font-family:var(--sans);font-size:14px;font-weight:700}
.node.selected .planet{stroke-width:2.6;filter:drop-shadow(0 0 12px var(--dot))}
.node.selected .planet-glow{opacity:.4}
.node.dim{opacity:.34}
.detail-empty{color:var(--text-mid);font-size:15px;font-family:var(--serif);line-height:1.6}
.detail-kicker{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dot);margin:0;font-weight:600}
.detail-title{margin:5px 0 0;font-family:var(--serif);font-size:25px;line-height:1.15;color:var(--text)}
.detail-thesis{margin:0;color:var(--text);font-size:16.5px;font-family:var(--serif);line-height:1.55}
.detail-insight{margin:0;padding:11px 13px;border-left:3px solid var(--dot);background:var(--bg-surface);border-radius:0 8px 8px 0;font-size:15.5px;font-family:var(--serif);font-style:italic;color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;color:var(--text-mid);background:var(--bg-surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.related h4,.sources-block h4{margin:8px 0 5px;font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.14em;font-weight:600}
.related-list{display:flex;flex-direction:column;gap:3px}
.related-list button{cursor:pointer;text-align:left;background:var(--bg-surface);border:1px solid var(--line);color:var(--text-mid);border-radius:8px;padding:7px 9px;font-size:14.5px;font-family:var(--serif)}
.related-list button:hover{border-color:var(--dot);color:var(--text)}
.sources-block ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.sources-block li{font-size:13.5px;color:var(--text-mid);line-height:1.4}
.sources-block a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--line-strong)}
.sources-block a:hover{border-bottom-color:var(--accent)}
.src-type{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-left:4px}
.panel-actions{display:flex;gap:8px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.btn{cursor:pointer;border-radius:9px;padding:9px 13px;font-size:13px;border:1px solid var(--line);background:var(--bg-surface);color:var(--text);font-weight:500}
.btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff}
[data-theme="light"] .btn.primary{color:#fff}
.btn:hover{filter:brightness(1.12)}
.empty-state{margin:auto;text-align:center;padding:30px;color:var(--text-mid);max-width:420px;font-family:var(--serif)}
.empty-state a{color:var(--accent)}
.scene-dialog{border:1px solid var(--line);background:var(--bg-card);color:var(--text);border-radius:16px;max-width:720px;width:calc(100vw - 40px);padding:0;box-shadow:0 30px 90px var(--scrim)}
.scene-dialog::backdrop{background:var(--scrim);backdrop-filter:blur(3px)}
.dialog-inner{padding:28px 32px}
.dialog-inner h3{margin:2px 0 0;font-family:var(--serif);font-size:26px;line-height:1.12;color:var(--text)}
.dialog-close{position:absolute;top:14px;right:18px;cursor:pointer;background:transparent;border:none;color:var(--text-muted);font-size:24px}
.dialog-body{margin:14px 0;color:var(--text);font-size:15.5px;line-height:1.72;font-family:var(--serif)}
.dialog-body h2{font-size:17px;font-family:var(--serif);margin:18px 0 6px;color:var(--text)}
.dialog-body p{margin:0 0 12px}
.map-stage{position:relative;overflow:hidden;display:flex;flex-direction:column}
.system-map{flex:1 1 auto;min-height:0}
/* --- DEMO-BLOCK-TOP: акцентный демо-баннер НАД картой (в потоке, без наложения) --- */
@media(max-width:1100px){}
@media (prefers-reduced-motion: reduce){.node,.edge path,.sun-glow,.stars,.stars2{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}
@media (max-width:1100px){
  html,body{overflow:auto}
  .app-shell{grid-template-columns:1fr;height:auto}
  .map-stage{height:70vh;order:-1;border-bottom:1px solid var(--line)}
  .rail{border-right:none;border-bottom:1px solid var(--line)}
  .detail-panel{border-left:none;border-top:1px solid var(--line)}
}

.lang-switch{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 14px}
.lang-btn{font-size:11px;font-weight:600;padding:3px 7px;border-radius:7px;cursor:pointer;
  border:1px solid var(--line);background:var(--bg-surface);color:var(--text-muted);font-family:var(--sans)}
.lang-btn[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.lang-btn:hover{color:var(--text)}
</style>
<script>
const CHAPTER_DATA = {"chapter": {"key": "netocracy", "title": "Нетократия", "lede": "Власть у тех, кто понимает архитектуру. Барьер входа — понимание, а не деньги.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=netocracy", "centralIdea": "Власть у тех, кто понимает архитектуру", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "diagnosis", "label": "Диагноз", "accent": "#7dd3fc", "description": "Тоффлер: третья волна дала не рассеяние власти, а новую её концентрацию."}, {"id": "class", "label": "Класс", "accent": "#f87171", "description": "Нетократ против консьюмтариата: пять характеристик и иллюзия участия."}, {"id": "competence", "label": "Компетенция", "accent": "#34d399", "description": "Три уровня: понимание архитектуры → управление вниманием → инфраструктура."}, {"id": "exit", "label": "Выход", "accent": "#c084fc", "description": "Шринивасан: сетевые государства и параллельные системы как следующий сдвиг."}, {"id": "ethics", "label": "Этика", "accent": "#fbbf24", "description": "Франкл: последняя свобода — выбор отношения. Понимание без этики пусто."}], "nodes": [{"id": "toffler", "sceneIndex": 0, "type": "power", "shortTitle": "Тоффлер", "era": "1980", "lensWeight": {"diagnosis": 5, "class": 3, "competence": 1, "exit": 2, "ethics": 1}, "title": "Тоффлер был прав — но не до конца", "insight": "Тоффлер угадал третью волну, но ошибся в следствии: децентрализация информации создала не децентрализацию власти, а новый тип её концентрации — невидимый и потому более опасный.", "thesis": "Тоффлер угадал третью волну, но ошибся в следствии: децентрализация информации создала не децентрализацию власти, а новый тип её концентрации — невидимый и потому более опасный.", "body": "## Петля замкнулась\n\nМы начали этот курс с Тоффлера. Вернёмся к нему — чтобы понять, что он угадал, что нет, и почему это важно.\n\nВ 1980 году Элвин Тоффлер написал «Третью волну» — книгу о неизбежной трансформации индустриального мира. Его предсказания были смелыми для своего времени. Производство станет персонализированным — конец эпохи стандартных товаров для всех. Граница между производителем и потребителем сотрётся — появится prosumer, тот, кто одновременно создаёт и потребляет. Традиционные иерархии — корпорации, государства, профсоюзы — будут разрушены новыми сетевыми структурами.\n\nВсё это сбылось. Алгоритм Netflix подбирает контент индивидуально. Пользователь YouTube одновременно смотрит и создаёт. Стартап из двух человек может конкурировать с корпорацией. Анонимный разработчик создаёт протокол стоимостью в миллиарды — и это реальность 2020-х.\n\nНо Тоффлер допустил принципиальную ошибку в следствии. Он думал, что децентрализация информации приведёт к децентрализации власти. Логика казалась железной: если знание больше не монополия элиты — власть тоже перестанет быть монополией.\n\nЭтого не произошло.\n\n## Децентрализация по форме, концентрация по существу\n\nВласть децентрализовалась — но не так, как думал Тоффлер. Она перешла от государств к корпорациям. От корпораций к платформам. От платформ — к тем, кто умеет управлять алгоритмами и вниманием.\n\nПять технологических компаний контролируют большую часть того, что видят миллиарды людей каждый день. Несколько алгоритмов определяют, какие идеи распространяются, а какие остаются невидимыми. Это децентрализация по форме — никто не сидит в Кремле и не решает, что транслировать. И концентрация по существу — несколько архитекторов алгоритмов определяют информационную реальность планеты.\n\nТоффлер также предсказал prosumer — человека, который одновременно производит и потребляет. Он был прав и в этом. Но не предвидел, что это различие станет новым классовым разломом. Что одни будут производить ценность в сетях — и получать её обратно: через токены, через влияние, через доход. А другие будут производить ценность в сетях — и не получать ничего, кроме иллюзии участия.\n\nМануэль Кастельс подтвердил эту логику с академической точностью: в сетевом обществе власть — это власть над коммуникацией. Кто контролирует, какие сообщения проходят через сети, в каком контексте, с каким весом — тот формирует коллективное сознание. Это не пропаганда советского типа. Это архитектура внимания. Алгоритм не говорит, что думать. Он решает, какие мысли ты встретишь чаще всего.\n\n> Тоффлер в 1980-м предсказал третью волну точно. Но ошибся в следствии: децентрализация информации не привела к децентрализации власти. Она создала новый тип концентрации — невидимый и потому более опасный.\n\nЭта ошибка важна. Потому что именно её исправление — центральная задача Web3. Не просто технологическая децентрализация. Реальная децентрализация власти: через открытые протоколы, через владение активами, через прозрачные правила в коде.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4% %D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netocracy", "power", "history", "networks"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "netocrat", "sceneIndex": 1, "type": "media", "shortTitle": "Нетократ", "era": "2000", "lensWeight": {"diagnosis": 3, "class": 5, "competence": 4, "exit": 2, "ethics": 1}, "title": "Бард и Зодерквист: анатомия нетократа", "insight": "Бард и Зодерквист описали нетократа через пять характеристик: аттенциальный капитал, сетевая идентичность, кураторство, архитектура связей, создание смыслов. Барьер входа — понимание, а не деньги.", "thesis": "Бард и Зодерквист описали нетократа через пять характеристик: аттенциальный капитал, сетевая идентичность, кураторство, архитектура связей, создание смыслов. Барьер входа — понимание, а не деньги.", "body": "## Книга, написанная слишком рано\n\nВ 2000 году Александр Бард и Ян Зодерквист опубликовали «Нетократию». Момент был катастрофически неудачным: интернет-пузырь только что лопнул, тысячи компаний обанкротились, всеобщее разочарование в «новой экономике» достигло пика. Никто не хотел слышать о новых элитах сетевой эпохи. Книгу практически проигнорировали.\n\nЧерез двадцать пять лет она читается как точная карта мира, в котором мы живём.\n\nЦентральный тезис Барда и Зодерквиста: каждая экономическая система порождает свой правящий класс. Феодализм породил аристократию — тех, кто владел землёй. Промышленный капитализм породил буржуазию — тех, кто владел капиталом, заводами, банками. Информационная эпоха порождает нетократию — тех, кто владеет вниманием и умеет управлять сетями.\n\nЭто не метафора и не социологическая абстракция. Это описание конкретного механизма власти, который работает прямо сейчас.\n\n## Пять характеристик нетократа\n\nБард и Зодерквист описывают нетократа через набор характеристик — и каждая из них контрастирует с тем, что ценилось в индустриальную эпоху.\n\n**Аттенциальный капитал.** Главный ресурс нетократа — не деньги и не знания сами по себе. Это способность управлять вниманием: своим и чужим. В мире информационного изобилия дефицитен не контент, а внимание. Нетократ умеет его концентрировать, направлять и монетизировать. Он знает, где сейчас находится внимание миллионов — и как его привлечь к нужному.\n\n**Сетевая идентичность.** Нетократ строит статус через сети, а не через институты. Его ценность определяется не должностью в компании, не дипломом, не регалиями — а качеством его связей, репутацией в сообществах, влиянием на информационные потоки. Он может быть анонимом в интернете — и обладать большей реальной властью, чем директор крупной корпорации с солидным CV.\n\n**Куратор, а не потребитель.** В мире, где информации бесконечно много, тот, кто умеет выбирать важное и отфильтровывать шум, обладает огромной властью. Нетократ не просто потребляет информацию — он её отбирает, интерпретирует и распространяет. Это и есть его работа: быть надёжным фильтром для своей аудитории.\n\n**Архитектура связей.** Нетократ понимает: ценность сети зависит от её участников. Он инвестирует в отношения стратегически — строит архитектуру связей, а не просто «нетворкает» в старом смысле. Доступ к нужным людям в нужный момент важнее любого другого ресурса. Это не цинизм — это понимание того, как на самом деле работает мир.\n\n**Создатель смыслов.** В мире, где факты общедоступны, власть принадлежит тому, кто даёт факты в контексте. Кто объясняет, что они значат. Кто формирует рамку, через которую другие видят реальность. Нетократ — не просто информатор. Он создаёт нарративы.\n\nКастельс подтверждает: в истории всегда побеждал тот, кто контролировал коммуникацию. Церковь в средние века — через грамотность и рукописи. Буржуазия — через печатный станок. Индустриальные элиты — через массовые СМИ. Теперь нетократы осваивают алгоритмы, протоколы и децентрализованные сети. Инструменты меняются — логика одна.\n\n> Нетократ — это не обязательно богатый или известный человек. Это человек, который понимает, как работают сети, и умеет в них действовать стратегически. Аттенциальный капитал, сетевая идентичность, создание смыслов — вот его настоящие активы.\n\nВажно: Бард и Зодерквист подчёркивают — нетократия не закрытый клуб по происхождению. Это открытый класс, барьер входа в который определяется пониманием, а не деньгами или связями по рождению. Это принципиальное отличие от аристократии и буржуазии.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1%80%D0%BE%D0%BA%20%D0%B4%D0%BB%D1%8F%20XXI%20%D0%B2%D0%B5%D0%BA%D0%B0%20%282018%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман, Дэвид Лайон — Liquid Surveillance (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netocracy", "power", "identity", "networks"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "consumtariat", "sceneIndex": 2, "type": "privacy", "shortTitle": "Консьюмтариат", "era": "иллюзия участия", "lensWeight": {"diagnosis": 3, "class": 5, "competence": 3, "exit": 1, "ethics": 2}, "title": "Консьюмтариат: иллюзия участия", "insight": "Консьюмтариат — это те, кто производит ценность в сетях, не понимая этого. Иллюзия участия через лайки и комментарии — архитектурный механизм удержания. Осознание — первый шаг к выходу.", "thesis": "Консьюмтариат — это те, кто производит ценность в сетях, не понимая этого. Иллюзия участия через лайки и комментарии — архитектурный механизм удержания. Осознание — первый шаг к выходу.", "body": "## Новое неравенство, которое труднее увидеть\n\nБард и Зодерквист предупреждали: информационная революция не освобождает всех автоматически. Она создаёт новый тип неравенства — более трудноуловимый, чем имущественное, и потому более опасный.\n\nКонсьюмтариат — это не просто «потребители» в экономическом смысле. Это люди, которые активно участвуют в сетях, создают контент, взаимодействуют с платформами — и при этом не понимают, что происходит на самом деле. Они думают, что развлекаются или общаются. На самом деле — производят ценность для других.\n\nРазбери механизм по шагам. Пользователь Facebook публикует фотографию. Он тратит время (невозобновляемый ресурс), творческую энергию, личные данные. Facebook получает контент (который привлекает других пользователей), данные о его поведении (ценное сырьё для рекламодателей), рекламный инвентарь (монетизация внимания). Пользователь получает лайки — то есть переменное подкрепление по Скиннеру, которое заставляет его возвращаться и производить ещё больше.\n\nКто в этой сделке нетократ? Facebook — он понимает архитектуру и выстраивает её в своих интересах. Кто консьюмтариат? Пользователь — он участвует, не понимая условий.\n\nПосмотри на другой пример. Пользователь TikTok смотрит видео по 90 минут в день. TikTok получает: данные о его предпочтениях (точный психологический профиль), рекламный доход (монетизация внимания), сигналы для обучения алгоритма (который становится умнее и точнее). Пользователь получает: развлечение и дофаминовые всплески от переменного подкрепления. Кто здесь работает на кого?\n\n## Ловушка псевдоучастия\n\nСамый коварный механизм, описанный Бардом и Зодерквистом, — иллюзия участия. Это то, что удерживает консьюмтариат в системе без осознания своего положения.\n\nКонсьюмтариат чувствует себя активным участником. Он голосует лайками — ощущение влияния. Он пишет комментарии — ощущение голоса. Он делится контентом — ощущение значимости. Ему кажется, что он влияет на то, что происходит в его информационном пространстве. В действительности он создаёт данные, на основе которых нетократы — создатели алгоритмов, владельцы платформ — принимают реальные решения о том, что он увидит завтра.\n\nЭто не заговор. Это архитектура. Платформы спроектированы максимизировать ощущение участия при минимальных реальных правах. Ты «владеешь» профилем — но платформа может удалить его без предупреждения. Ты «создаёшь» контент — но алгоритм решает, кто его увидит. Ты «общаешься» с друзьями — но платформа контролирует, что ты о них знаешь и в каком порядке получаешь информацию.\n\nМишель Фуко описал паноптикум — идеальную тюрьму, где заключённые не знают, наблюдают ли за ними прямо сейчас. В результате они ведут себя так, будто наблюдают постоянно. Самоцензура становится встроенной. Бауман и Лайон в «Liquid Surveillance» показали: современный надзор работает так же — только добровольно. Никто не заставляет тебя устанавливать приложения, которые отслеживают каждый шаг. Ты делаешь это сам. Потому что удобно. Потому что все так делают. Потому что иначе выпадаешь из социальной жизни.\n\nЗубофф называла это «поведенческими излишками»: ценность, которую люди создают своими действиями в сети, изымается платформами и продаётся. Консьюмтариат производит эти излишки — не осознавая, что это и есть его главная функция в системе.\n\n> Консьюмтариат — это не те, кто «не умеет пользоваться интернетом». Это те, кто пользуется им, не понимая его архитектуры. Иллюзия участия — самый эффективный механизм удержания в системе, которая тебя использует.\n\nПонимание этого механизма — первый шаг к выходу из консьюмтариата. Не отказ от платформ — а изменение отношения к ним. От «я пользуюсь сервисом» к «я понимаю, чем я плачу за этот сервис и стоит ли оно того».", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1%80%D0%BE%D0%BA%20%D0%B4%D0%BB%D1%8F%20XXI%20%D0%B2%D0%B5%D0%BA%D0%B0%20%282018%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман, Дэвид Лайон — Liquid Surveillance (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netocracy", "attention", "platforms", "power"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "levels", "sceneIndex": 3, "type": "technology", "shortTitle": "Три уровня", "era": "компетенция", "lensWeight": {"diagnosis": 1, "class": 3, "competence": 5, "exit": 3, "ethics": 2}, "title": "Три уровня нетократической компетенции", "insight": "Три уровня нетократии: понимание архитектуры → управление вниманием → создание инфраструктуры. Нетократия — открытый класс. Барьер входа — понимание, а не деньги или происхождение.", "thesis": "Три уровня нетократии: понимание архитектуры → управление вниманием → создание инфраструктуры. Нетократия — открытый класс. Барьер входа — понимание, а не деньги или происхождение.", "body": "## Нетократия — открытый класс\n\nПрежде чем описывать уровни компетенции — важно повторить принципиальный момент из Барда и Зодерквиста: нетократия не является закрытым клубом по происхождению.\n\nАристократия строилась на крови: нужно было родиться в правильной семье. Буржуазия строилась на капитале: нужно было унаследовать или накопить. Нетократия строится на понимании. А понимание — приобретаемо.\n\nСын профессора из Москвы может вырасти консьюмтариатом — если просто потребляет сети, не понимая их. Человек из маленького города, не имеющий формального образования, может стать нетократом — если поймёт, как работают сети, раньше окружающих.\n\nЭто принципиально меняет разговор об образовании. Харари в «21 уроке для XXI века» сформулировал, что именно нужно понимать в XXI веке: не факты — их можно найти за секунды. Нужно понимать, как создаётся знание. Кто и зачем создаёт те или иные нарративы. Как алгоритмы формируют реальность. Как отличить манипуляцию от информации. Это и есть грамотность нетократа.\n\n## Первый уровень: понимание архитектуры\n\nЭто фундамент. Ты знаешь, как работают сети — не в техническом смысле, а в экономическом и властном.\n\nТы понимаешь сетевые эффекты и почему они создают монополии. Знаешь, почему платформы «бесплатны» и что они берут взамен. Понимаешь алгоритмы не как волшебство, а как оптимизацию конкретных метрик — и знаешь, какие метрики оптимизирует каждая платформа. Знаешь разницу между кастодиальным и некастодиальным хранением активов. Понимаешь, что такое смарт-контракт и почему это меняет отношения власти.\n\nЭтот уровень — необходимый, но недостаточный. Понимание без действия не меняет ничего. Но без понимания — любое действие вслепую.\n\nКстати: ты только что завершил курс, который дал тебе этот первый уровень. От Шеннона и математики информации до токеномики и DAO. Это не случайность — это архитектура курса.\n\n## Второй уровень: управление вниманием\n\nЭто уровень навыка — когда понимание становится действием.\n\nУправление своим вниманием: ты не позволяешь алгоритмам решать за тебя, что важно. Ты осознанно выбираешь, на что тратить время — это главный невозобновляемый ресурс. Ты понимаешь, когда платформа пытается манипулировать тобой через переменное подкрепление, и можешь выйти из этой петли.\n\nУправление чужим вниманием: ты умеешь создавать смыслы, которые распространяются. Строить сообщества вокруг идей. Формировать нарративы, которые люди хотят передавать дальше. Это не манипуляция — это коммуникация на уровне, на который большинство людей не поднимается.\n\nНа этом уровне ты уже можешь строить аудитории, влиять на сообщества, монетизировать свои знания и связи напрямую — не через алгоритм платформы.\n\n## Третий уровень: создание инфраструктуры\n\nЭто уровень архитектора. Ты не просто используешь существующие сети — ты строишь новые.\n\nСоздаёшь протоколы и проектируешь стимулы, которые выравнивают интересы участников. Строишь DAO и токеномику, которая делает участников совладельцами, а не только пользователями. Создаёшь сообщества с общей идентичностью и экономикой — где принадлежность имеет реальную ценность.\n\nНа этом уровне ты сам становишься источником правил. Ты не играешь по чужим правилам — ты проектируешь среду, в которой другие будут действовать.\n\nБольшинство людей никогда не поднимаются выше первого уровня — и не потому что не способны. А потому что не знают о существовании этой лестницы. Теперь ты знаешь.\n\n> Три уровня нетократической компетенции: понимание архитектуры → управление вниманием → создание инфраструктуры. Большинство людей на первом не знают о втором и третьем. Ты только что узнал.\n\nКрис Диксон в «Read Write Own» описал три эпохи интернета через глаголы: читать (Web1), писать (Web2), владеть (Web3). Это и есть три уровня нетократии. Большинство читают. Меньше — пишут. Единицы — владеют. Окно в эпоху владения открыто прямо сейчас.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1%80%D0%BE%D0%BA%20%D0%B4%D0%BB%D1%8F%20XXI%20%D0%B2%D0%B5%D0%BA%D0%B0%20%282018%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман, Дэвид Лайон — Liquid Surveillance (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netocracy", "education", "power", "web3"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "srinivasan", "sceneIndex": 4, "type": "economy", "shortTitle": "Шринивасан", "era": "2022", "lensWeight": {"diagnosis": 2, "class": 2, "competence": 3, "exit": 5, "ethics": 2}, "title": "Шринивасан: сетевые государства", "insight": "Шринивасан: следующий политический сдвиг — не реформа государств, а создание сетевых сообществ с общей идентичностью, экономикой и управлением. Нетократы строят параллельные системы.", "thesis": "Шринивасан: следующий политический сдвиг — не реформа государств, а создание сетевых сообществ с общей идентичностью, экономикой и управлением. Нетократы строят параллельные системы.", "body": "## Самая радикальная версия нетократической логики\n\nБаладжи Шринивасан — серийный предприниматель, бывший CTO Coinbase, один из самых провокационных мыслителей в технологическом мире. В 2022 году он опубликовал книгу «The Network State», которая предлагает самую радикальную версию нетократической логики: следующий политический сдвиг — это не реформа существующих государств, а создание новых.\n\nЭто звучит как научная фантастика. Шринивасан настаивает: это рациональный прогноз, основанный на исторических прецедентах.\n\nЕго аргумент строится на следующей логике. Государства — не вечные образования. Они возникали и исчезали на протяжении всей истории. И возникновение новых государств почти никогда не происходило по одному шаблону: революция → провозглашение → признание. Чаще — постепенное строительство идентичности, экономики и сообщества задолго до формального политического оформления.\n\nИзраиль как государство возник не в 1948 году — он строился как сообщество с общей идентичностью и общим проектом десятилетиями до этого. Сингапур стал тем, чем является, потому что Ли Куан Ю создал систему стимулов, привлёкшую определённый тип людей и оттолкнувшую других. Любая страна — это прежде всего координационное устройство с общими правилами, идентичностью и экономикой.\n\n## Как выглядит сетевое государство\n\nШринивасан описывает конкретную последовательность шагов.\n\nСначала — онлайн-сообщество с общими ценностями. Не просто подписчики в Twitter. Группа людей, объединённых реальными общими убеждениями о том, как должна быть устроена жизнь: отношение к образованию, к здоровью, к работе, к управлению.\n\nПотом — общая экономика. Токены, DAO, взаимные соглашения об обмене ценностью внутри сообщества. Члены сообщества начинают предпочитать торговать друг с другом.\n\nПотом — физические анклавы. Члены сообщества начинают жить рядом — сначала как эксперимент, потом как образ жизни. Не потому что их заставляют — а потому что это повышает качество жизни: рядом люди с близкими ценностями.\n\nПотом — дипломатическое признание. Когда сообщество достигает достаточного размера и влияния — государства начинают взаимодействовать с ним как с политическим субъектом.\n\nЭто не план — это модель. Некоторые элементы уже существуют: крипто-сообщества с собственной экономикой, колл-ту-экшн для физических встреч, общие ценности и идентичность.\n\nТимоти Снайдер в «Дороге к несвободе» предупреждает о другой стороне той же монеты: авторитарные режимы тоже освоили сетевую власть. Не через цензуру — через дезинформацию, манипуляцию вниманием, создание информационного хаоса, в котором правда и ложь становятся неразличимыми. Нетократия — нейтральный инструмент. Он работает в обе стороны.\n\n> Шринивасан предлагает следующий уровень нетократической логики: не просто понимать и использовать сети — но строить новые политические образования на их основе. Нетократы не ждут реформы существующих систем. Они строят параллельные.\n\nЭто не обязательно означает создание нового государства. Для большинства нетократов это означает: строить сообщества с реальной идентичностью и экономикой, а не просто аудитории. Владеть инфраструктурой своих связей, а не арендовать её у платформ.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1%80%D0%BE%D0%BA%20%D0%B4%D0%BB%D1%8F%20XXI%20%D0%B2%D0%B5%D0%BA%D0%B0%20%282018%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман, Дэвид Лайон — Liquid Surveillance (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netocracy", "governance", "community", "networks"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "frankl", "sceneIndex": 5, "type": "privacy", "shortTitle": "Франкл", "era": "последний выбор", "lensWeight": {"diagnosis": 1, "class": 1, "competence": 2, "exit": 2, "ethics": 5}, "title": "Франкл и последний выбор", "insight": "Франкл: последняя свобода — выбор отношения к обстоятельствам. Ты не выбирал условия цифровой эпохи. Но ты выбираешь, что с ними делать. Понимание без этики — инструмент без цели.", "thesis": "Франкл: последняя свобода — выбор отношения к обстоятельствам. Ты не выбирал условия цифровой эпохи. Но ты выбираешь, что с ними делать. Понимание без этики — инструмент без цели.", "body": "## Философ из концентрационного лагеря\n\nВиктор Франкл — австрийский психиатр. В 1942 году он был депортирован в нацистские концентрационные лагеря. Прошёл через Освенцим, Дахау, другие лагеря. Потерял жену, родителей, брата. Провёл три года в условиях, описание которых трудно читать без физической реакции.\n\nВыйдя на свободу в 1945 году, он за девять дней написал книгу «Человек в поисках смысла». Это стало одной из самых влиятельных книг XX века — и одной из самых важных для понимания того, что значит быть человеком в условиях систем, которые ты не выбирал.\n\nКлючевое наблюдение Франкла, сделанное в условиях, которые сложно даже вообразить: у человека нельзя отнять последнюю свободу. Всё остальное можно — физическую свободу, имущество, близких, достоинство в глазах других. Но нельзя отнять свободу выбирать своё отношение к обстоятельствам. В любых условиях остаётся пространство между стимулом и реакцией. И в этом пространстве — человеческое достоинство.\n\n## Почему Франкл здесь\n\nЗачем философ из концентрационного лагеря в финальной главе курса об интернете и нетократии?\n\nПотому что весь этот курс был о условиях, которые ты не выбирал.\n\nТы не выбирал родиться в эпоху смартфонов и алгоритмов. Не выбирал экономику внимания, которая монетизирует твоё время без твоего сознательного согласия. Не выбирал архитектуру социальных сетей, спроектированную через переменное подкрепление Скиннера. Не выбирал концентрацию власти в руках нескольких платформ.\n\nТы не выбирал эти условия. Но ты выбираешь, что делать с этим знанием.\n\nФранкл писал о другом контексте — несравнимо более жестоком. Но его принцип универсален: ситуация определяет обстоятельства, человек определяет ответ на обстоятельства. Не условия делают тебя консьюмтариатом или нетократом. Твой выбор — делает.\n\n## Свобода без ответственности — не свобода\n\nЕсть ещё одно измерение Франкла, важное в этом контексте.\n\nОн писал: свобода без ответственности — это произвол. Настоящая свобода — это свобода, сопряжённая с ответственностью за последствия твоих выборов.\n\nТимоти Снайдер предупреждал: та же нетократическая логика — понимание сетей, управление вниманием, создание нарративов — может использоваться для разрушения демократии, для дезинформации, для манипуляции людьми в масштабе. Авторитарные режимы это поняли и используют.\n\nНетократ, который строит системы без понимания их последствий — без этического компаса — воспроизводит те же проблемы, которые мы критиковали в платформах Web2. Только быстрее, потому что понимает архитектуру лучше. И в большем масштабе.\n\nПонимание — это инструмент. Как любой инструмент, он не имеет собственной этики. Молоток можно использовать для строительства или для разрушения. Знание архитектуры сетей можно использовать для создания открытых систем, выравнивающих возможности — или для создания более изощрённых систем манипуляции.\n\nФранкл в лагере наблюдал оба типа людей: тех, кто в нечеловеческих условиях сохранял достоинство и помогал другим, и тех, кто в тех же условиях предавал и использовал слабых. Условия были одинаковые. Выборы — разные.\n\n> Франкл сформулировал: последняя свобода человека — выбор отношения к обстоятельствам. Ты не выбирал условия цифровой эпохи. Но ты выбираешь, что с ними делать. И как.\n\nЭто финальное соображение курса. Не техническое. Не экономическое. Человеческое. Нетократия — это открытый класс, барьер входа — понимание. Но понимание без этики — это инструмент без цели. Что ты строишь — зависит только от тебя.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1%80%D0%BE%D0%BA%20%D0%B4%D0%BB%D1%8F%20XXI%20%D0%B2%D0%B5%D0%BA%D0%B0%20%282018%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман, Дэвид Лайон — Liquid Surveillance (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netocracy", "philosophy", "ethics", "freedom"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "luminara", "sceneIndex": 6, "type": "power", "shortTitle": "Что дальше?", "era": "→действие", "lensWeight": {"diagnosis": 2, "class": 3, "competence": 5, "exit": 4, "ethics": 4}, "title": "Luminara: ты дочитал. Что дальше?", "insight": "Ты завершил первый уровень нетократической компетенции — понимание архитектуры. Второй уровень: управление вниманием. Третий: создание инфраструктуры. Следующий курс — для тех, кто выбирает действовать.", "thesis": "Ты завершил первый уровень нетократической компетенции — понимание архитектуры. Второй уровень: управление вниманием. Третий: создание инфраструктуры. Следующий курс — для тех, кто выбирает действовать.", "body": "## Скрытая цель этого курса\n\nЭтот курс назывался «Основания нового интернета». Восемь глав. От математики Шеннона до блокчейна Накамото. От первых форумов до TikTok. От мечты о свободном знании до капитализма слежки — и от него к новой архитектуре, которую строит Web3.\n\nНо у курса была скрытая цель, которую теперь можно назвать прямо.\n\nМы не просто объясняли, как работает интернет. Мы готовили тебя к выбору.\n\nВыбору между консьюмтариатом и нетократией. Между теми, кто живёт в сетях, не понимая их архитектуры, — и теми, кто понимает и действует осознанно. Между теми, кто производит ценность для платформ, не получая ничего, кроме иллюзии участия, — и теми, кто строит платформы, управляет своей долей в них или хотя бы понимает, чем платит за «бесплатные» сервисы.\n\n## Что ты получил из этого курса\n\nБард и Зодерквист описали первый уровень нетократической компетенции как понимание архитектуры. Ты его прошёл.\n\nТы понимаешь, почему информация стала главным ресурсом власти — от Шеннона и Кастельса. Знаешь, как Web1 создал открытый интернет и почему его открытость была использована против пользователей. Понимаешь механику экономики внимания и капитализма слежки — от Саймона до Зубофф. Видишь, как алгоритмы создают фильтровые пузыри и поляризуют общество — и почему это не злой умысел, а архитектурное следствие оптимизации на вовлечение. Знаешь разницу между Web 3.0 и Web3. Понимаешь, что такое приватный ключ и почему «not your keys — not your coins». Знаешь, как работают смарт-контракты, DeFi и DAO. Понимаешь, что такое нетократия и консьюмтариат — и на каком уровне ты находишься сейчас.\n\nЭто первый уровень. Необходимый. Но недостаточный.\n\n## Следующий шаг\n\nКрис Диксон описал три эпохи интернета: читать, писать, владеть. Ты прочитал курс об этих эпохах. Теперь — момент перейти к следующему глаголу.\n\nВторой уровень нетократической компетенции — управление вниманием. Умение создавать смыслы, строить сообщества, монетизировать знания и связи напрямую. Умение не отдавать своё внимание алгоритмам, а направлять его осознанно.\n\nТретий уровень — создание инфраструктуры. Протоколы, токеномика, DAO, цифровая идентичность. Архитектура систем, в которых ты сам устанавливаешь правила.\n\nLuminara строит следующие курсы именно для этого. Не для того, чтобы ты «понимал крипту» в абстрактном смысле. А для того, чтобы ты мог действовать на втором и третьем уровне. Понимать конкретные инструменты. Использовать их. Строить на их основе.\n\nБард и Зодерквист писали: нетократия — открытый класс. Барьер входа — понимание. И желание учиться дальше, чем большинство.\n\nТы дочитал до конца бесплатного курса. Это уже сигнал — большинство не доходят. Большинство скроллят, не читая. Большинство потребляют — и не задают вопросов.\n\nТы задаёшь.\n\n> Франкл написал: в любых обстоятельствах у человека есть последняя свобода — выбор отношения к ним. Ты не выбирал условия цифровой эпохи. Но ты выбираешь, что с ними делать. Следующий курс — для тех, кто выбирает действовать.\n\nДобро пожаловать в Luminara.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1%80%D0%BE%D0%BA%20%D0%B4%D0%BB%D1%8F%20XXI%20%D0%B2%D0%B5%D0%BA%D0%B0%20%282018%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман, Дэвид Лайон — Liquid Surveillance (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netocracy", "luminara", "web3", "education"], "x": 265.5, "y": 258.0, "angDeg": 218.6}], "edges": [{"from": "toffler", "to": "netocrat", "label": "новая концентрация нашла класс", "lenses": ["diagnosis", "class"]}, {"from": "netocrat", "to": "consumtariat", "label": "класс определяется противоположностью", "lenses": ["class"]}, {"from": "consumtariat", "to": "levels", "label": "осознание — первый шаг к выходу", "lenses": ["class", "competence"]}, {"from": "netocrat", "to": "levels", "label": "барьер входа — понимание", "lenses": ["class", "competence"]}, {"from": "levels", "to": "srinivasan", "label": "инфраструктура строит государства", "lenses": ["competence", "exit"]}, {"from": "srinivasan", "to": "luminara", "label": "параллельные системы уже строят", "lenses": ["exit", "competence"]}, {"from": "levels", "to": "frankl", "label": "понимание требует выбора", "lenses": ["competence", "ethics"]}, {"from": "frankl", "to": "luminara", "label": "понимание без этики — инструмент без цели", "lenses": ["ethics"]}, {"from": "toffler", "to": "frankl", "label": "ты не выбирал условия — выбираешь ответ", "lenses": ["diagnosis", "ethics"]}, {"from": "consumtariat", "to": "luminara", "label": "выход через компетенцию", "lenses": ["class", "competence"]}]};;
function renderEmptyState(reason){const empty=document.querySelector(".empty-state"),svg=document.querySelector(".system-map");
  if(!empty||!svg)return;empty.hidden=false;svg.setAttribute("hidden","");
  empty.innerHTML=`<p>${reason}</p><a href="${CHAPTER_DATA.chapter.sourceUrl}" target="_blank" rel="noreferrer">Luminara</a>`;}
</script>

<body>
<div class="stars"></div><div class="stars2"></div>
<main class="app-shell">
  <section class="rail">
    <div><p class="eyebrow">Luminara · Atlas</p><h1 id="app-title">Нетократия</h1></div>
    <p class="chapter-lede">Власть у тех, кто понимает архитектуру. Барьер входа — понимание, а не деньги.</p>
    <div class="rail-rule"></div>
    <div><p class="section-h" data-ui="section_lenses">Линзы интерпретации</p><div class="lens-group" style="margin-top:9px"></div><p class="lens-desc" style="margin-top:9px"></p></div>
    <div class="rail-rule"></div>
    <div class="progress-box"></div>
    <div><p class="section-h" data-ui="section_scenes">Сцены главы</p><nav class="node-list" style="margin-top:6px"></nav></div>
  </section>
  <section class="map-stage">
    <svg class="system-map" viewBox="0 0 1120 940" role="img" preserveAspectRatio="xMidYMid meet">
      <title>До интернета</title><desc>Информация становится властью</desc>
    </svg>
    <div class="empty-state" hidden></div>
  </section>
  <aside class="detail-panel"></aside>
</main>
<dialog class="scene-dialog"></dialog>
<script>
// --- theme from URL (?theme=light|dark & ?accent=oklch/hex) — mirrors app ---
(function(){
  try{
    var p=new URLSearchParams(location.search);
    var theme=p.get("theme"); var accent=p.get("accent");
    if(theme==="light") document.documentElement.setAttribute("data-theme","light");
    else if(theme==="dark") document.documentElement.removeAttribute("data-theme");
    if(accent){ document.documentElement.style.setProperty("--accent", decodeURIComponent(accent)); }
    // sun ink: readable on core
    document.documentElement.style.setProperty("--sun-ink", theme==="light" ? "#fff" : "#fff");
  }catch(e){}
})();
// live updates from parent (optional): postMessage {theme, accent}
window.addEventListener("message",function(ev){
  var m=ev.data||{};
  if(m.theme==="light") document.documentElement.setAttribute("data-theme","light");
  if(m.theme==="dark") document.documentElement.removeAttribute("data-theme");
  if(m.accent) document.documentElement.style.setProperty("--accent", m.accent);
  if(typeof renderAll==="function") renderAll();
});

const state={lens:"chronology",selected:null,visited:new Set(),entered:false};
const byId=id=>CHAPTER_DATA.nodes.find(n=>n.id===id);
const SVGNS="http://www.w3.org/2000/svg";
const el=(t,a)=>{const e=document.createElementNS(SVGNS,t);for(const k in(a||{}))e.setAttribute(k,a[k]);return e;};
function typeColor(t){return{power:"var(--power)",technology:"var(--technology)",media:"var(--media)",privacy:"var(--privacy)",economy:"var(--economy)"}[t]||"var(--accent)";}
function typeLabel(t){var U=window.__UI_LOC||{};var k="type_"+t;if(U[k])return U[k];return{power:"Власть",technology:"Технологии",media:"Медиа",privacy:"Приватность",economy:"Экономика"}[t]||"Идея";}
function lensById(id){return CHAPTER_DATA.lenses.find(l=>l.id===id);}
function edgeActive(e){return e.lenses.includes(state.lens);}
function nodeWeight(n){return(n.lensWeight&&n.lensWeight[state.lens])||0;}
const CX=CHAPTER_DATA.chapter.centerX||500, CY=CHAPTER_DATA.chapter.centerY||445, RING=CHAPTER_DATA.chapter.ring||300;

function buildLenses(){
  const w=document.querySelector(".lens-group");w.innerHTML="";
  CHAPTER_DATA.lenses.forEach(l=>{const b=document.createElement("button");b.className="lens-btn";b.type="button";
    b.setAttribute("aria-pressed",String(l.id===state.lens));b.style.setProperty("--dot",l.accent);
    b.innerHTML=`<span class="lens-dot"></span>${l.label}`;b.addEventListener("click",()=>setLens(l.id));w.appendChild(b);});
}
function setLens(id){state.lens=id;const l=lensById(id);
  const d=document.querySelector(".lens-desc");if(d)d.textContent=l?l.description:"";
  document.querySelectorAll(".lens-btn").forEach((b,i)=>b.setAttribute("aria-pressed",String(CHAPTER_DATA.lenses[i].id===id)));
  renderAll();}

function curve(a,b){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;const dx=mx-CX,dy=my-CY,len=Math.hypot(dx,dy)||1;const bow=26;
  return `M ${a.x} ${a.y} Q ${mx+(dx/len)*bow} ${my+(dy/len)*bow} ${b.x} ${b.y}`;}

function defs(){
  const d=el("defs");
  const mk=(id,color)=>{color=lensById(state.lens)?lensById(state.lens).accent:"#888";const m=el("marker",{id,viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"});
    const p=el("path",{d:"M0 0 L10 5 L0 10 z",fill:color});m.appendChild(p);return m;};
  d.appendChild(mk("arrow-active", "var(--dot-fallback)"));
  var sg=el("radialGradient",{id:"sunGrad",cx:"50%",cy:"42%",r:"60%"});
  var css=getComputedStyle(document.documentElement);
  sg.appendChild(el("stop",{offset:"0%","stop-color":css.getPropertyValue("--bg-elev")||"#20264a"}));
  sg.appendChild(el("stop",{offset:"100%","stop-color":css.getPropertyValue("--bg")||"#0c1230"}));
  d.appendChild(sg);
  return d;
}

function renderMap(){
  const svg=document.querySelector(".system-map");if(!svg)return;
  [...svg.querySelectorAll("defs,g,.ring,.ring-tick,.era-label,.spoke")].forEach(n=>n.remove());
  svg.appendChild(defs());
  // rings
  const gDeco=el("g",{});
  [RING*0.55,RING].forEach(r=>gDeco.appendChild(el("circle",{class:"ring",cx:CX,cy:CY,r})));
  svg.appendChild(gDeco);
  // spokes + chronology era labels around outer ring
  const gSpoke=el("g",{});
  CHAPTER_DATA.nodes.forEach(n=>{
    gSpoke.appendChild(el("line",{class:"spoke",x1:CX,y1:CY,x2:n.x,y2:n.y}));
  });
  svg.appendChild(gSpoke);

  // edges (with directional arrows on active)
  const gE=el("g",{});
  CHAPTER_DATA.edges.forEach(e=>{const a=byId(e.from),b=byId(e.to);if(!a||!b)return;
    const active=edgeActive(e);const g=el("g",{class:"edge"+(active?" active":"")});
    if(active)g.style.setProperty("--dot",lensById(state.lens).accent);
    const d=curve(a,b);const p=el("path",{d});
    // approximate length for draw animation
    const len=Math.round(Math.hypot(b.x-a.x,b.y-a.y)*1.15);
    p.style.setProperty("--len",len);
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const lb=el("text",{class:"edge-label",x:mx,y:my-5,"text-anchor":"middle"});lb.textContent=e.label;
    g.appendChild(p);g.appendChild(lb);gE.appendChild(g);});
  svg.appendChild(gE);

  // center (breathing, lens-tinted ring)
  const gC=el("g",{});
  gC.style.setProperty("--dot", lensById(state.lens)?lensById(state.lens).accent:"#b7791f");
  gC.appendChild(el("circle",{class:"sun-glow",cx:CX,cy:CY,r:100}));
  gC.appendChild(el("circle",{class:"sun-ring",cx:CX,cy:CY,r:82}));
  gC.appendChild(el("circle",{class:"sun-core",cx:CX,cy:CY,r:70}));/*no sublabel*/
  
  wrapText(gC,CHAPTER_DATA.chapter.centralIdea,CX,CY+2,120,"sun-t1",17);
  svg.appendChild(gC);

  // nodes with smart outward labels + era
  const gN=el("g",{});
  CHAPTER_DATA.nodes.forEach((n,i)=>{
    const g=el("g",{class:"node"+(state.selected===n.id?" selected":""),tabindex:"0",role:"button","aria-label":`${n.sceneIndex+1}. ${n.title} (${n.era||""})`});
    g.style.setProperty("--dot",typeColor(n.type));
    g.style.setProperty("--ox",n.x+"px");g.style.setProperty("--oy",n.y+"px");
    if(!state.entered) g.style.setProperty("--delay",(0.15+i*0.06)+"s"); else g.style.animation="none",g.style.opacity="1";
    if(state.selected){const linked=CHAPTER_DATA.edges.some(e=>(e.from===state.selected&&e.to===n.id)||(e.to===state.selected&&e.from===n.id));
      if(n.id!==state.selected&&!linked)g.classList.add("dim");}
    else if(nodeWeight(n)<=1){g.classList.add("dim");}
    g.appendChild(el("circle",{class:"planet-glow",cx:n.x,cy:n.y,r:34}));
    var pl=el("circle",{class:"planet",cx:n.x,cy:n.y,r:26});pl.style.fill="color-mix(in oklch, "+typeColor(n.type)+" 20%, var(--bg-elev))";g.appendChild(pl);
    const num=el("text",{class:"num",x:n.x,y:n.y});num.textContent=String(n.sceneIndex+1);g.appendChild(num);

    // smart label placement: outward along the radius from center
    const dx=n.x-CX,dy=n.y-CY,len=Math.hypot(dx,dy)||1;
    const ux=dx/len,uy=dy/len;
    const lx=n.x+ux*46, ly=n.y+uy*46;
    // anchor by horizontal side
    const anchor = ux>0.25?"start":(ux<-0.25?"end":"middle");
    const era=el("text",{class:"era",x:lx,y:ly-30,"text-anchor":anchor});era.textContent=n.era||"";g.appendChild(era);
    const kick=el("text",{class:"kicker",x:lx,y:ly-14,"text-anchor":anchor});kick.textContent=typeLabel(n.type);g.appendChild(kick);
    wrapTextAnchored(g,n.shortTitle,lx,ly+20,180,"cap",18,anchor);

    g.addEventListener("click",()=>selectNode(n.id));
    g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();selectNode(n.id);}});
    gN.appendChild(g);
  });
  svg.appendChild(gN);
  state.entered=true;
}
function wrapText(parent,text,x,y,maxw,cls,fs){wrapTextAnchored(parent,text,x,y,maxw,cls,fs,"middle");}
function wrapTextAnchored(parent,text,x,y,maxw,cls,fs,anchor){
  const words=String(text).split(/\s+/);const lines=[];let line="";
  const approx=s=>s.length*(fs*0.56);
  words.forEach(w=>{const t=line?line+" "+w:w;if(approx(t)>maxw&&line){lines.push(line);line=w;}else line=t;});
  if(line)lines.push(line);const total=(lines.length-1)*(fs+2);
  lines.forEach((ln,i)=>{const t=el("text",{class:cls,x,y:y-total/2+i*(fs+2),"text-anchor":anchor});t.textContent=ln;parent.appendChild(t);});
}

const CHAPTER_I18N = {"ru": {"chapter": {"key": "netocracy", "title": "Нетократия", "lede": "Власть у тех, кто понимает архитектуру. Барьер входа — понимание, а не деньги.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=netocracy", "centralIdea": "Власть у тех, кто понимает архитектуру", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "diagnosis", "label": "Диагноз", "accent": "#7dd3fc", "description": "Тоффлер: третья волна дала не рассеяние власти, а новую её концентрацию."}, {"id": "class", "label": "Класс", "accent": "#f87171", "description": "Нетократ против консьюмтариата: пять характеристик и иллюзия участия."}, {"id": "competence", "label": "Компетенция", "accent": "#34d399", "description": "Три уровня: понимание архитектуры → управление вниманием → инфраструктура."}, {"id": "exit", "label": "Выход", "accent": "#c084fc", "description": "Шринивасан: сетевые государства и параллельные системы как следующий сдвиг."}, {"id": "ethics", "label": "Этика", "accent": "#fbbf24", "description": "Франкл: последняя свобода — выбор отношения. Понимание без этики пусто."}], "nodes": [{"id": "toffler", "sceneIndex": 0, "type": "power", "shortTitle": "Тоффлер", "era": "1980", "lensWeight": {"diagnosis": 5, "class": 3, "competence": 1, "exit": 2, "ethics": 1}, "title": "Тоффлер был прав — но не до конца", "insight": "Тоффлер угадал третью волну, но ошибся в следствии: децентрализация информации создала не децентрализацию власти, а новый тип её концентрации — невидимый и потому более опасный.", "thesis": "Тоффлер угадал третью волну, но ошибся в следствии: децентрализация информации создала не децентрализацию власти, а новый тип её концентрации — невидимый и потому более опасный.", "body": "## Петля замкнулась\n\nМы начали этот курс с Тоффлера. Вернёмся к нему — чтобы понять, что он угадал, что нет, и почему это важно.\n\nВ 1980 году Элвин Тоффлер написал «Третью волну» — книгу о неизбежной трансформации индустриального мира. Его предсказания были смелыми для своего времени. Производство станет персонализированным — конец эпохи стандартных товаров для всех. Граница между производителем и потребителем сотрётся — появится prosumer, тот, кто одновременно создаёт и потребляет. Традиционные иерархии — корпорации, государства, профсоюзы — будут разрушены новыми сетевыми структурами.\n\nВсё это сбылось. Алгоритм Netflix подбирает контент индивидуально. Пользователь YouTube одновременно смотрит и создаёт. Стартап из двух человек может конкурировать с корпорацией. Анонимный разработчик создаёт протокол стоимостью в миллиарды — и это реальность 2020-х.\n\nНо Тоффлер допустил принципиальную ошибку в следствии. Он думал, что децентрализация информации приведёт к децентрализации власти. Логика казалась железной: если знание больше не монополия элиты — власть тоже перестанет быть монополией.\n\nЭтого не произошло.\n\n## Децентрализация по форме, концентрация по существу\n\nВласть децентрализовалась — но не так, как думал Тоффлер. Она перешла от государств к корпорациям. От корпораций к платформам. От платформ — к тем, кто умеет управлять алгоритмами и вниманием.\n\nПять технологических компаний контролируют большую часть того, что видят миллиарды людей каждый день. Несколько алгоритмов определяют, какие идеи распространяются, а какие остаются невидимыми. Это децентрализация по форме — никто не сидит в Кремле и не решает, что транслировать. И концентрация по существу — несколько архитекторов алгоритмов определяют информационную реальность планеты.\n\nТоффлер также предсказал prosumer — человека, который одновременно производит и потребляет. Он был прав и в этом. Но не предвидел, что это различие станет новым классовым разломом. Что одни будут производить ценность в сетях — и получать её обратно: через токены, через влияние, через доход. А другие будут производить ценность в сетях — и не получать ничего, кроме иллюзии участия.\n\nМануэль Кастельс подтвердил эту логику с академической точностью: в сетевом обществе власть — это власть над коммуникацией. Кто контролирует, какие сообщения проходят через сети, в каком контексте, с каким весом — тот формирует коллективное сознание. Это не пропаганда советского типа. Это архитектура внимания. Алгоритм не говорит, что думать. Он решает, какие мысли ты встретишь чаще всего.\n\n> Тоффлер в 1980-м предсказал третью волну точно. Но ошибся в следствии: децентрализация информации не привела к децентрализации власти. Она создала новый тип концентрации — невидимый и потому более опасный.\n\nЭта ошибка важна. Потому что именно её исправление — центральная задача Web3. Не просто технологическая децентрализация. Реальная децентрализация власти: через открытые протоколы, через владение активами, через прозрачные правила в коде.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0
