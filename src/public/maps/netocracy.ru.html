лікували «Нетократію». Момент був катастрофічно невдалим: інтернет-бульбашка щойно луснула, тисячі компаній збанкрутували, загальне розчарування в «новій економіці» досягло піку. Ніхто не хотів чути про нові еліти мережевої епохи. Книгу практично проігнорували.\n\nЧерез двадцять п'ять років вона читається як точна карта світу, в якому ми живемо.\n\nЦентральна теза Барда і Зодерквіста: кожна економічна система породжує свій правлячий клас. Феодалізм породив аристократію — тих, хто володів землею. Промисловий капіталізм породив буржуазію — тих, хто володів капіталом, заводами, банками. Інформаційна епоха породжує нетократію — тих, хто володіє увагою і вміє керувати мережами.\n\nЦе не метафора і не соціологічна абстракція. Це опис конкретного механізму влади, який працює просто зараз.\n\n## П'ять характеристик нетократа\n\nБард і Зодерквіст описують нетократа через набір характеристик — і кожна з них контрастує з тим, що цінувалося в індустріальну епоху.\n\n**Атенційний капітал.** Головний ресурс нетократа — не гроші і не знання самі по собі. Це здатність керувати увагою: своєю і чужою. У світі інформаційного достатку дефіцитний не контент, а увага. Нетократ уміє її концентрувати, спрямовувати й монетизувати. Він знає, де зараз перебуває увага мільйонів — і як привернути її до потрібного.\n\n**Мережева ідентичність.** Нетократ будує статус через мережі, а не через інститути. Його цінність визначається не посадою в компанії, не дипломом, не регаліями — а якістю його зв'язків, репутацією в спільнотах, впливом на інформаційні потоки. Він може бути анонімом в інтернеті — і мати більшу реальну владу, ніж директор великої корпорації з солідним CV.\n\n**Куратор, а не споживач.** У світі, де інформації безкінечно багато, той, хто вміє обирати важливе й відфільтровувати шум, має величезну владу. Нетократ не просто споживає інформацію — він її відбирає, інтерпретує і поширює. Це і є його робота: бути надійним фільтром для своєї аудиторії.\n\n**Архітектура зв'язків.** Нетократ розуміє: цінність мережі залежить від її учасників. Він інвестує у відносини стратегічно — будує архітектуру зв'язків, а не просто «нетворкає» у старому сенсі. Доступ до потрібних людей у потрібний момент важливіший за будь-який інший ресурс. Це не цинізм — це розуміння того, як насправді працює світ.\n\n**Творець сенсів.** У світі, де факти загальнодоступні, влада належить тому, хто дає фактам контекст. Хто пояснює, що вони означають. Хто формує рамку, через яку інші бачать реальність. Нетократ — не просто інформатор. Він створює наративи.\n\nКастельс підтверджує: в історії завжди перемагав той, хто контролював комунікацію. Церква в середні віки — через грамотність і рукописи. Буржуазія — через друкарський верстат. Індустріальні еліти — через масові медіа. Тепер нетократи опановують алгоритми, протоколи й децентралізовані мережі. Інструменти змінюються — логіка одна.\n\n> Нетократ — це не обов'язково багата чи відома людина. Це людина, яка розуміє, як працюють мережі, і вміє діяти в них стратегічно. Атенційний капітал, мережева ідентичність, створення сенсів — ось його справжні активи.\n\nВажливо: Бард і Зодерквіст підкреслюють — нетократія не є закритим клубом за походженням. Це відкритий клас, бар'єр входу до якого визначається розумінням, а не грошима чи зв'язками від народження. Це принципова відмінність від аристократії та буржуазії.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81 %8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["нетократія", "влада", "ідентичність", "мережі"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "consumtariat", "sceneIndex": 2, "type": "privacy", "shortTitle": "Консьюмтаріат", "era": "ілюзія участі", "lensWeight": {"diagnosis": 3, "class": 5, "competence": 3, "exit": 1, "ethics": 2}, "title": "Консьюмтаріат: ілюзія участі", "insight": "Консьюмтаріат — це ті, хто виробляє цінність у мережах, не розуміючи цього. Ілюзія участі через лайки й коментарі — архітектурний механізм утримання. Усвідомлення — перший крок до виходу.", "thesis": "Консьюмтаріат — це ті, хто виробляє цінність у мережах, не розуміючи цього. Ілюзія участі через лайки й коментарі — архітектурний механізм утримання. Усвідомлення — перший крок до виходу.", "body": "## Нова нерівність, яку важче побачити\n\nБард і Зодерквіст попереджали: інформаційна революція не звільняє всіх автоматично. Вона створює новий тип нерівності — більш невловимий, ніж майнова, а тому небезпечніший.\n\nКонсьюмтаріат — це не просто «споживачі» в економічному сенсі. Це люди, які активно беруть участь у мережах, створюють контент, взаємодіють із платформами — і водночас не розуміють, що відбувається насправді. Вони думають, що розважаються або спілкуються. Насправді — виробляють цінність для інших.\n\nРозбери механізм крок за кроком. Користувач Facebook публікує фотографію. Він витрачає час (невідновлюваний ресурс), творчу енергію, особисті дані. Facebook отримує контент (який приваблює інших користувачів), дані про його поведінку (цінну сировину для рекламодавців), рекламний інвентар (монетизацію уваги). Користувач отримує лайки — тобто змінне підкріплення за Скіннером, яке змушує його повертатися й виробляти ще більше.\n\nХто в цій угоді нетократ? Facebook — він розуміє архітектуру й вибудовує її у своїх інтересах. Хто консьюмтаріат? Користувач — він бере участь, не розуміючи умов.\n\nПодивися на інший приклад. Користувач TikTok дивиться відео по 90 хвилин на день. TikTok отримує: дані про його вподобання (точний психологічний профіль), рекламний дохід (монетизацію уваги), сигнали для навчання алгоритму (який стає розумнішим і точнішим). Користувач отримує: розвагу й дофамінові сплески від змінного підкріплення. Хто тут працює на кого?\n\n## Пастка псевдоучасті\n\nНайпідступніший механізм, описаний Бардом і Зодерквістом, — ілюзія участі. Це те, що утримує консьюмтаріат у системі без усвідомлення свого становища.\n\nКонсьюмтаріат відчуває себе активним учасником. Він голосує лайками — відчуття впливу. Він пише коментарі — відчуття голосу. Він ділиться контентом — відчуття значущості. Йому здається, що він впливає на те, що відбувається в його інформаційному просторі. Насправді він створює дані, на основі яких нетократи — творці алгоритмів, власники платформ — ухвалюють реальні рішення про те, що він побачить завтра.\n\nЦе не змова. Це архітектура. Платформи спроєктовані так, щоб максимізувати відчуття участі за мінімальних реальних прав. Ти «володієш» профілем — але платформа може видалити його без попередження. Ти «створюєш» контент — але алгоритм вирішує, хто його побачить. Ти «спілкуєшся» з друзями — але платформа контролює, що ти про них знаєш і в якому порядку отримуєш інформацію.\n\nМішель Фуко описав паноптикум — ідеальну в'язницю, де ув'язнені не знають, чи спостерігають за ними просто зараз. У результаті вони поводяться так, ніби за ними спостерігають постійно. Самоцензура стає вбудованою. Бауман і Лайон у “Liquid Surveillance” показали: сучасний нагляд працює так само — тільки добровільно. Ніхто не змушує тебе встановлювати застосунки, які відстежують кожен крок. Ти робиш це сам. Бо зручно. Бо всі так роблять. Бо інакше випадаєш із соціального життя.\n\nЗубофф називала це «поведінковими надлишками»: цінність, яку люди створюють своїми діями в мережі, вилучається платформами й продається. Консьюмтаріат виробляє ці надлишки — не усвідомлюючи, що це і є його головна функція в системі.\n\n> Консьюмтаріат — це не ті, хто «не вміє користуватися інтернетом». Це ті, хто користується ним, не розуміючи його архітектури. Ілюзія участі — найефективніший механізм утримання в системі, яка тебе використовує.\n\nРозуміння цього механізму — перший крок до виходу з консьюмтаріату. Не відмова від платформ — а зміна ставлення до них. Від «я користуюся сервісом» до «я розумію, чим я плачу за цей сервіс і чи варте воно того».", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94 — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["нетократія", "увага", "платформи", "влада"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "levels", "sceneIndex": 3, "type": "technology", "shortTitle": "Три рівні", "era": "компетенція", "lensWeight": {"diagnosis": 1, "class": 3, "competence": 5, "exit": 3, "ethics": 2}, "title": "Три рівні нетократичної компетентності", "insight": "Три рівні нетократії: розуміння архітектури → управління увагою → створення інфраструктури. Нетократія — відкритий клас. Бар'єр входу — розуміння, а не гроші чи походження.", "thesis": "Три рівні нетократії: розуміння архітектури → управління увагою → створення інфраструктури. Нетократія — відкритий клас. Бар'єр входу — розуміння, а не гроші чи походження.", "body": "## Нетократія — відкритий клас\n\nПерш ніж описувати рівні компетентності, важливо повторити принциповий момент із Барда й Зодерквіста: нетократія не є закритим клубом за походженням.\n\nАристократія будувалася на крові: треба було народитися в правильній родині. Буржуазія будувалася на капіталі: його треба було успадкувати або накопичити. Нетократія будується на розумінні. А розуміння можна здобути.\n\nСин професора з Москви може вирости консьюмтаріатом, якщо просто споживає мережі, не розуміючи їх. Людина з маленького міста, без формальної освіти, може стати нетократом, якщо зрозуміє, як працюють мережі, раніше за оточення.\n\nЦе принципово змінює розмову про освіту. Харарі у *21 уроці для XXI століття* сформулював, що саме потрібно розуміти у XXI столітті: не факти — їх можна знайти за секунди. Потрібно розуміти, як створюється знання. Хто і навіщо створює ті чи інші наративи. Як алгоритми формують реальність. Як відрізнити маніпуляцію від інформації. Це і є грамотність нетократа.\n\n## Перший рівень: розуміння архітектури\n\nЦе фундамент. Ти знаєш, як працюють мережі — не в технічному сенсі, а в економічному й владному.\n\nТи розумієш мережеві ефекти й чому вони створюють монополії. Знаєш, чому платформи \"безплатні\" і що вони беруть натомість. Розумієш алгоритми не як магію, а як оптимізацію конкретних метрик — і знаєш, які метрики оптимізує кожна платформа. Знаєш різницю між кастодіальним і некастодіальним зберіганням активів. Розумієш, що таке smart contract і чому це змінює відносини влади.\n\nЦей рівень необхідний, але недостатній. Розуміння без дії нічого не змінює. Але без розуміння будь-яка дія є сліпою.\n\nДо речі: ти щойно завершив курс, який дав тобі цей перший рівень. Від Шеннона й математики інформації до токеноміки та DAO. Це не випадковість — це архітектура курсу.\n\n## Другий рівень: управління увагою\n\nЦе рівень навички — коли розуміння стає дією.\n\nУправління власною увагою: ти не дозволяєш алгоритмам вирішувати за тебе, що важливо. Ти свідомо обираєш, на що витрачати час — це головний невідновлюваний ресурс. Ти розумієш, коли платформа намагається маніпулювати тобою через змінне підкріплення, і можеш вийти з цієї петлі.\n\nУправління чужою увагою: ти вмієш створювати сенси, які поширюються. Будувати спільноти навколо ідей. Формувати наративи, які люди хочуть передавати далі. Це не маніпуляція — це комунікація на рівні, до якого більшість людей не піднімається.\n\nНа цьому рівні ти вже можеш будувати аудиторії, впливати на спільноти, монетизувати свої знання та зв'язки напряму — не через алгоритм платформи.\n\n## Третій рівень: створення інфраструктури\n\nЦе рівень архітектора. Ти не просто використовуєш наявні мережі — ти будуєш нові.\n\nСтворюєш протоколи й проєктуєш стимули, які вирівнюють інтереси учасників. Будуєш DAO і токеноміку, яка робить учасників співвласниками, а не лише користувачами. Створюєш спільноти зі спільною ідентичністю та економікою — де належність має реальну цінність.\n\nНа цьому рівні ти сам стаєш джерелом правил. Ти не граєш за чужими правилами — ти проєктуєш середовище, у якому діятимуть інші.\n\nБільшість людей ніколи не піднімається вище першого рівня — і не тому, що не здатна. А тому, що не знає про існування цих сходів. Тепер ти знаєш.\n\n> Три рівні нетократичної компетентності: розуміння архітектури → управління увагою → створення інфраструктури. Більшість людей на першому рівні не знає про другий і третій. Ти щойно дізнався.\n\nКріс Діксон у *Read Write Own* описав три епохи інтернету через дієслова: читати (Web1), писати (Web2), володіти (Web3). Це і є три рівні нетократії. Більшість читає. Менше — пишуть. Одиниці — володіють. Вікно в епоху володіння відкрите просто зараз.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB 0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["нетократія", "освіта", "влада", "Web3"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "srinivasan", "sceneIndex": 4, "type": "economy", "shortTitle": "Шрінівасан", "era": "2022", "lensWeight": {"diagnosis": 2, "class": 2, "competence": 3, "exit": 5, "ethics": 2}, "title": "Шрінівасан: мережеві держави", "insight": "Шрінівасан: наступний політичний зсув — не реформа держав, а створення мережевих спільнот зі спільною ідентичністю, економікою та управлінням. Нетократи будують паралельні системи.", "thesis": "Шрінівасан: наступний політичний зсув — не реформа держав, а створення мережевих спільнот зі спільною ідентичністю, економікою та управлінням. Нетократи будують паралельні системи.", "body": "## Найрадикальніша версія нетократичної логіки\n\nБаладжі Шрінівасан — серійний підприємець, колишній CTO Coinbase, один із найпровокативніших мислителів у технологічному світі. У 2022 році він опублікував книжку «The Network State», яка пропонує найрадикальнішу версію нетократичної логіки: наступний політичний зсув — це не реформа наявних держав, а створення нових.\n\nЦе звучить як наукова фантастика. Шрінівасан наполягає: це раціональний прогноз, заснований на історичних прецедентах.\n\nЙого аргумент будується на такій логіці. Держави — не вічні утворення. Вони виникали й зникали протягом усієї історії. І виникнення нових держав майже ніколи не відбувалося за одним шаблоном: революція -> проголошення -> визнання. Частіше — поступове будівництво ідентичності, економіки й спільноти задовго до формального політичного оформлення.\n\nІзраїль як держава виник не в 1948 році — він десятиліттями до цього будувався як спільнота зі спільною ідентичністю та спільним проєктом. Сінгапур став тим, чим є, тому що Лі Куан Ю створив систему стимулів, яка привабила певний тип людей і відштовхнула інших. Будь-яка країна — це передусім координаційний механізм зі спільними правилами, ідентичністю та економікою.\n\n## Як виглядає мережева держава\n\nШрінівасан описує конкретну послідовність кроків.\n\nСпочатку — онлайн-спільнота зі спільними цінностями. Не просто підписники у Twitter. Група людей, об'єднаних реальними спільними переконаннями про те, як має бути влаштоване життя: ставлення до освіти, до здоров'я, до роботи, до управління.\n\nПотім — спільна економіка. Токени, DAO, взаємні угоди про обмін цінністю всередині спільноти. Члени спільноти починають віддавати перевагу торгівлі одне з одним.\n\nПотім — фізичні анклави. Члени спільноти починають жити поруч — спочатку як експеримент, потім як спосіб життя. Не тому, що їх змушують, а тому, що це підвищує якість життя: поруч люди з близькими цінностями.\n\nПотім — дипломатичне визнання. Коли спільнота досягає достатнього розміру й впливу, держави починають взаємодіяти з нею як із політичним суб'єктом.\n\nЦе не план — це модель. Деякі елементи вже існують: криптоспільноти з власною економікою, кол-ту-екшн для фізичних зустрічей, спільні цінності та ідентичність.\n\nТімоті Снайдер у «Дорозі до несвободи» попереджає про інший бік тієї самої медалі: авторитарні режими також опанували мережеву владу. Не через цензуру — через дезінформацію, маніпуляцію увагою, створення інформаційного хаосу, у якому правда й брехня стають нерозрізненними. Нетократія — нейтральний інструмент. Він працює в обидва боки.\n\n> Шрінівасан пропонує наступний рівень нетократичної логіки: не просто розуміти й використовувати мережі — а будувати на їхній основі нові політичні утворення. Нетократи не чекають реформи наявних систем. Вони будують паралельні.\n\nЦе не обов'язково означає створення нової держави. Для більшості нетократів це означає: будувати спільноти з реальною ідентичністю та економікою, а не просто аудиторії. Володіти інфраструктурою своїх зв'язків, а не орендувати її у платформ.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5 )", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["нетократія", "управління", "спільнота", "мережі"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "frankl", "sceneIndex": 5, "type": "privacy", "shortTitle": "Франкл", "era": "останній вибір", "lensWeight": {"diagnosis": 1, "class": 1, "competence": 2, "exit": 2, "ethics": 5}, "title": "Франкл і останній вибір", "insight": "Франкл: остання свобода — вибір ставлення до обставин. Ти не обирав умови цифрової епохи. Але ти вибираєш, що з ними робити. Розуміння без етики — інструмент без мети.", "thesis": "Франкл: остання свобода — вибір ставлення до обставин. Ти не обирав умови цифрової епохи. Але ти вибираєш, що з ними робити. Розуміння без етики — інструмент без мети.", "body": "## Філософ із концентраційного табору\n\nВіктор Франкл — австрійський психіатр. У 1942 році його депортували до нацистських концентраційних таборів. Він пройшов через Освенцим, Дахау, інші табори. Втратив дружину, батьків, брата. Провів три роки в умовах, опис яких важко читати без фізичної реакції.\n\nВийшовши на свободу в 1945 році, він за дев'ять днів написав книжку «Людина в пошуках справжнього сенсу». Вона стала однією з найвпливовіших книжок XX століття — і однією з найважливіших для розуміння того, що означає бути людиною в умовах систем, які ти не обирав.\n\nКлючове спостереження Франкла, зроблене в умовах, які складно навіть уявити: у людини не можна забрати останню свободу. Усе інше можна — фізичну свободу, майно, близьких, гідність в очах інших. Але не можна забрати свободу вибирати своє ставлення до обставин. За будь-яких умов залишається простір між стимулом і реакцією. І в цьому просторі — людська гідність.\n\n## Чому Франкл тут\n\nНавіщо філософ із концентраційного табору у фінальному розділі курсу про інтернет і нетократію?\n\nТому що весь цей курс був про умови, які ти не обирав.\n\nТи не обирав народитися в епоху смартфонів і алгоритмів. Не обирав економіку уваги, яка монетизує твій час без твоєї свідомої згоди. Не обирав архітектуру соцмереж, спроєктовану через змінне підкріплення Скіннера. Не обирав концентрацію влади в руках кількох платформ.\n\nТи не обирав ці умови. Але ти вибираєш, що робити з цим знанням.\n\nФранкл писав про інший контекст — незрівнянно жорстокіший. Але його принцип універсальний: ситуація визначає обставини, людина визначає відповідь на обставини. Не умови роблять тебе консьюмтаріатом або нетократом. Твій вибір — робить.\n\n## Свобода без відповідальності — не свобода\n\nЄ ще один вимір Франкла, важливий у цьому контексті.\n\nВін писав: свобода без відповідальності — це свавілля. Справжня свобода — це свобода, поєднана з відповідальністю за наслідки твоїх виборів.\n\nТімоті Снайдер попереджав: та сама нетократична логіка — розуміння мереж, управління увагою, створення наративів — може використовуватися для руйнування демократії, для дезінформації, для масштабної маніпуляції людьми. Авторитарні режими це зрозуміли й використовують.\n\nНетократ, який будує системи без розуміння їхніх наслідків — без етичного компаса — відтворює ті самі проблеми, які ми критикували в платформах Web2. Тільки швидше, бо краще розуміє архітектуру. І в більшому масштабі.\n\nРозуміння — це інструмент. Як будь-який інструмент, він не має власної етики. Молоток можна використати для будівництва або для руйнування. Знання архітектури мереж можна використати для створення відкритих систем, що вирівнюють можливості, — або для створення витонченіших систем маніпуляції.\n\nФранкл у таборі спостерігав обидва типи людей: тих, хто в нелюдських умовах зберігав гідність і допомагав іншим, і тих, хто в тих самих умовах зраджував і використовував слабких. Умови були однакові. Вибори — різні.\n\n> Франкл сформулював: остання свобода людини — вибір ставлення до обставин. Ти не обирав умови цифрової епохи. Але ти вибираєш, що з ними робити. І як.\n\nЦе фінальна думка курсу. Не технічна. Не економічна. Людська. Нетократія — це відкритий клас, бар'єр входу — розуміння. Але розуміння без етики — це інструмент без мети. Що ти будуєш — залежить тільки від тебе.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1%80%D0%BE%D0%BA%20%D0%B4%D0%BB%D1%8F%20XXI%20%D0%B2%D0%B5%D0%BA%D0%B0%20%282018%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман, Дэвид Лайон — Liquid Surveillance (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["нетократія", "філософія", "етика", "свобода"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "luminara", "sceneIndex": 6, "type": "power", "shortTitle": "Що далі?", "era": "→дія", "lensWeight": {"diagnosis": 2, "class": 3, "competence": 5, "exit": 4, "ethics": 4}, "title": "Luminara: ти дочитав. Що далі?", "insight": "Ти завершив перший рівень нетократичної компетентності — розуміння архітектури. Другий рівень: управління увагою. Третій: створення інфраструктури. Наступний курс — для тих, хто вибирає діяти.", "thesis": "Ти завершив перший рівень нетократичної компетентності — розуміння архітектури. Другий рівень: управління увагою. Третій: створення інфраструктури. Наступний курс — для тих, хто вибирає діяти.", "body": "## Прихована мета цього курсу\n\nЦей курс називався «Основания нового интернета». Вісім розділів. Від математики Шеннона до блокчейна Накамото. Від перших форумів до TikTok. Від мрії про вільне знання до капіталізму стеження — і від нього до нової архітектури, яку будує Web3.\n\nАле в курсу була прихована мета, яку тепер можна назвати прямо.\n\nМи не просто пояснювали, як працює інтернет. Ми готували тебе до вибору.\n\nВибору між консьюмтаріатом і нетократією. Між тими, хто живе в мережах, не розуміючи їхньої архітектури, — і тими, хто розуміє та діє усвідомлено. Між тими, хто виробляє цінність для платформ, не отримуючи нічого, крім ілюзії участі, — і тими, хто будує платформи, керує своєю часткою в них або хоча б розуміє, чим платить за «безкоштовні» сервіси.\n\n## Що ти отримав із цього курсу\n\nБард і Зодерквіст описали перший рівень нетократичної компетентності як розуміння архітектури. Ти його пройшов.\n\nТи розумієш, чому інформація стала головним ресурсом влади — від Шеннона й Кастельса. Знаєш, як Web1 створив відкритий інтернет і чому його відкритість була використана проти користувачів. Розумієш механіку економіки уваги та капіталізму стеження — від Саймона до Зубофф. Бачиш, як алгоритми створюють фільтрові бульбашки й поляризують суспільство — і чому це не злий умисел, а архітектурний наслідок оптимізації на залучення. Знаєш різницю між Web 3.0 і Web3. Розумієш, що таке приватний ключ і чому «not your keys — not your coins». Знаєш, як працюють смарт-контракти, DeFi і DAO. Розумієш, що таке нетократія і консьюмтаріат — і на якому рівні ти перебуваєш зараз.\n\nЦе перший рівень. Необхідний. Але недостатній.\n\n## Наступний крок\n\nКріс Діксон описав три епохи інтернету: читати, писати, володіти. Ти прочитав курс про ці епохи. Тепер — момент перейти до наступного дієслова.\n\nДругий рівень нетократичної компетентності — управління увагою. Уміння створювати сенси, будувати спільноти, монетизувати знання й зв'язки напряму. Уміння не віддавати свою увагу алгоритмам, а спрямовувати її усвідомлено.\n\nТретій рівень — створення інфраструктури. Протоколи, токеноміка, DAO, цифрова ідентичність. Архітектура систем, у яких ти сам встановлюєш правила.\n\nLuminara будує наступні курси саме для цього. Не для того, щоб ти «розумів крипту» в абстрактному сенсі. А для того, щоб ти міг діяти на другому й третьому рівні. Розуміти конкретні інструменти. Використовувати їх. Будувати на їхній основі.\n\nБард і Зодерквіст писали: нетократія — відкритий клас. Бар'єр входу — розуміння. І бажання вчитися далі, ніж більшість.\n\nТи дочитав безкоштовний курс до кінця. Це вже сигнал — більшість не доходить. Більшість скролить, не читаючи. Більшість споживає — і не ставить запитань.\n\nТи ставиш.\n\n> Франкл написав: за будь-яких обставин у людини є остання свобода — вибір ставлення до них. Ти не обирав умови цифрової епохи. Але ти вибираєш, що з ними робити. Наступний курс — для тих, хто вибирає діяти.\n\nЛаскаво просимо до Luminara.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1%80%D0%BE%D0%BA%20%D0%B4%D0%BB%D1%8F%20XXI%20%D0%B2%D0%B5%D0%BA%D0%B0%20%282018%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман, Дэвид Лайон — Liquid Surveillance (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["нетократія", "Luminara", "Web3", "освіта"], "x": 265.5, "y": 258.0, "angDeg": 218.6}], "edges": [{"from": "toffler", "to": "netocrat", "label": "нова концентрація знайшла свій клас", "lenses": ["diagnosis", "class"]}, {"from": "netocrat", "to": "consumtariat", "label": "клас визначається протилежністю", "lenses": ["class"]}, {"from": "consumtariat", "to": "levels", "label": "усвідомлення — перший крок до виходу", "lenses": ["class", "competence"]}, {"from": "netocrat", "to": "levels", "label": "барʼєр входу — розуміння", "lenses": ["class", "competence"]}, {"from": "levels", "to": "srinivasan", "label": "інфраструктура будує держави", "lenses": ["competence", "exit"]}, {"from": "srinivasan", "to": "luminara", "label": "паралельні системи вже будують", "lenses": ["exit", "competence"]}, {"from": "levels", "to": "frankl", "label": "розуміння вимагає вибору", "lenses": ["competence", "ethics"]}, {"from": "frankl", "to": "luminara", "label": "розуміння без етики — інструмент без мети", "lenses": ["ethics"]}, {"from": "toffler", "to": "frankl", "label": "ти не обирав умов — обираєш відповідь", "lenses": ["diagnosis", "ethics"]}, {"from": "consumtariat", "to": "luminara", "label": "вихід через компетенцію", "lenses": ["class", "competence"]}]}, "kk": {"chapter": {"key": "netocracy", "title": "Нетократия", "lede": "Билік архитектураны түсінетіндердің қолында. Кіру кедергісі — ақша емес, түсіну.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=netocracy", "centralIdea": "Билік архитектураны түсінетіндерде", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "diagnosis", "label": "Диагноз", "accent": "#7dd3fc", "description": "Тоффлер: үшінші толқын биліктің таралуын емес, оның жаңа шоғырлануын әкелді."}, {"id": "class", "label": "Тап", "accent": "#f87171", "description": "Нетократ пен консьюмтариат: бес сипат және қатысу иллюзиясы."}, {"id": "competence", "label": "Құзырет", "accent": "#34d399", "description": "Үш деңгей: архитектураны түсіну → назарды басқару → инфрақұрылым."}, {"id": "exit", "label": "Шығу", "accent": "#c084fc", "description": "Шринивасан: желілік мемлекеттер және параллель жүйелер келесі ауысым ретінде."}, {"id": "ethics", "label": "Этика", "accent": "#fbbf24", "description": "Франкл: соңғы еркіндік — көзқарасты таңдау. Этикасыз түсіну бос."}], "nodes": [{"id": "toffler", "sceneIndex": 0, "type": "power", "shortTitle": "Тоффлер", "era": "1980", "lensWeight": {"diagnosis": 5, "class": 3, "competence": 1, "exit": 2, "ethics": 1}, "title": "Тоффлер дұрыс айтты — бірақ толық емес", "insight": "Тоффлер үшінші толқынды дәл болжады, бірақ салдарында қателесті: ақпараттың орталықсыздануы биліктің орталықсыздануын емес, оның жаңа шоғырлану түрін жасады — көзге көрінбейтін, сондықтан қауіптірек.", "thesis": "Тоффлер үшінші толқынды дәл болжады, бірақ салдарында қателесті: ақпараттың орталықсыздануы биліктің орталықсыздануын емес, оның жаңа шоғырлану түрін жасады — көзге көрінбейтін, сондықтан қауіптірек.", "body": "## Ілмек тұйықталды\n\nБіз бұл курсты Тоффлерден бастадық. Оған қайта оралайық — оның нені дәл болжағанын, нені болжай алмағанын және мұның неге маңызды екенін түсіну үшін.\n\n1980 жылы Элвин Тоффлер «Үшінші толқын» кітабын жазды — индустриялық әлемнің сөзсіз трансформациясы туралы кітап. Оның болжамдары өз уақыты үшін батыл еді. Өндіріс дербестендіріледі — бәріне арналған стандартты тауарлар дәуірі аяқталады. Өндіруші мен тұтынушы арасындағы шекара өшеді — prosumer пайда болады, бір уақытта жасайтын да, тұтынатын да адам. Дәстүрлі иерархиялар — корпорациялар, мемлекеттер, кәсіподақтар — жаңа желілік құрылымдар арқылы бұзылады.\n\nМұның бәрі орындалды. Netflix алгоритмі контентті жеке таңдайды. YouTube пайдаланушысы бір уақытта көреді және жасайды. Екі адамнан тұратын стартап корпорациямен бәсекелесе алады. Анонимді әзірлеуші миллиардтаған құны бар протокол жасайды — бұл 2020-жылдардың шындығы.\n\nБірақ Тоффлер салдарында принципті қате жіберді. Ол ақпараттың орталықсыздануы биліктің орталықсыздануына әкеледі деп ойлады. Логика темірдей көрінді: егер білім енді элитаның монополиясы болмаса — билік те монополия болудан қалады.\n\nОлай болған жоқ.\n\n## Формасы бойынша орталықсыздану, мәні бойынша шоғырлану\n\nБилік орталықсызданды — бірақ Тоффлер ойлағандай емес. Ол мемлекеттерден корпорацияларға өтті. Корпорациялардан платформаларға өтті. Платформалардан — алгоритмдер мен назарды басқара алатындарға өтті.\n\nБес технологиялық компания күн сайын миллиардтаған адам көретін нәрсенің басым бөлігін бақылайды. Бірнеше алгоритм қай идеялар таралатынын, қайсысы көрінбей қалатынын анықтайды. Бұл формасы бойынша орталықсыздану — Кремльде отырып, нені тарату керегін шешіп жатқан ешкім жоқ. Ал мәні бойынша шоғырлану — алгоритмдердің бірнеше сәулетшісі планетаның ақпараттық шындығын анықтайды.\n\nТоффлер prosumer-ді де болжады — бір уақытта өндіретін және тұтынатын адамды. Мұнда да ол дұрыс айтты. Бірақ бұл айырмашылық жаңа таптық жарыққа айналатынын болжай алмады. Біреулер желілерде құндылық жасап, оны қайта алады: токендер арқылы, ықпал арқылы, табыс арқылы. Ал басқалар желілерде құндылық жасап, қатысу елесінен басқа ештеңе алмайды.\n\nМануэль Кастельс бұл логиканы академиялық дәлдікпен растады: желілік қоғамда билік — коммуникация үстіндегі билік. Желілер арқылы қандай хабарлар өтетінін, қандай контексте, қандай салмақпен өтетінін кім бақылайды — сол ұжымдық сананы қалыптастырады. Бұл совет үлгісіндегі пропаганда емес. Бұл назар архитектурасы. Алгоритм не ойлау керегін айтпайды. Ол сен қай ойларды ең жиі кездестіретініңді шешеді.\n\n> Тоффлер 1980 жылы үшінші толқынды дәл болжады. Бірақ салдарында қателесті: ақпараттың орталықсыздануы биліктің орталықсыздануына әкелмеді. Ол шоғырланудың жаңа түрін жасады — көзге көрінбейтін, сондықтан қауіптірек.\n\nБұл қате маңызды. Өйткені оны түзету — Web3-тің орталық міндеті. Жай ғана технологиялық орталықсыздану емес. Биліктің нақты орталықсыздануы: ашық протоколдар арқылы, активтерге иелік ету арқылы, code ішіндегі ашық ережелер арқылы.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Ма қалды.\n\nЖиырма бес жылдан кейін ол біз өмір сүріп жатқан әлемнің дәл картасындай оқылады.\n\nБард пен Зодерквистің негізгі тезисі: әрбір экономикалық жүйе өзінің билеуші табын туғызады. Феодализм аристократияны — жерге иелік еткендерді туғызды. Өнеркәсіптік капитализм буржуазияны — капиталға, зауыттарға, банктерге иелік еткендерді туғызды. Ақпараттық дәуір нетократияны — назарға иелік ететін және желілерді басқаруды білетіндерді туғызады.\n\nБұл метафора да, әлеуметтанулық абстракция да емес. Бұл дәл қазір жұмыс істеп тұрған нақты билік механизмінің сипаттамасы.\n\n## Нетократтың бес сипаттамасы\n\nБард пен Зодерквист нетократты бірқатар сипаттама арқылы түсіндіреді — олардың әрқайсысы индустриялық дәуірде бағаланған нәрселерге қарама-қарсы.\n\n**Назар капиталы.** Нетократтың басты ресурсы — ақша да емес, білімнің өзі де емес. Бұл назарды басқару қабілеті: өзінікін де, өзгенікін де. Ақпарат мол әлемде тапшы нәрсе контент емес, назар. Нетократ оны шоғырландыруды, бағыттауды және монетизациялауды біледі. Ол қазір миллиондардың назары қайда екенін — әрі оны қажет нәрсеге қалай аудару керегін біледі.\n\n**Желілік бірегейлік.** Нетократ мәртебені институттар арқылы емес, желілер арқылы құрады. Оның құндылығы компаниядағы лауазыммен де, дипломмен де, атақ-даңқпен де емес — байланыстарының сапасымен, қауымдастықтардағы беделімен, ақпарат ағындарына ықпалымен анықталады. Ол интернетте аноним болуы мүмкін — әрі салмақты CV-і бар ірі корпорация директорынан да көбірек нақты билікке ие болуы мүмкін.\n\n**Тұтынушы емес, куратор.** Ақпарат шексіз көп әлемде маңыздыны таңдап, шуды сүзгіден өткізе алатын адам орасан билікке ие. Нетократ ақпаратты жай ғана тұтынбайды — оны іріктейді, түсіндіреді және таратады. Оның жұмысы да осы: өз аудиториясы үшін сенімді сүзгі болу.\n\n**Байланыстар архитектурасы.** Нетократ түсінеді: желінің құндылығы оның қатысушыларына байланысты. Ол қатынастарға стратегиялық түрде инвестиция салады — ескі мағынадағы жай ғана «нетворкингпен» айналыспай, байланыстар архитектурасын құрады. Қажетті адамдарға қажетті сәтте қол жеткізу кез келген басқа ресурстан маңыздырақ. Бұл цинизм емес — әлемнің шын мәнінде қалай жұмыс істейтінін түсіну.\n\n**Мағыналар жасаушы.** Фактілер жалпыға қолжетімді әлемде билік фактілерге контекст беретін адамға тиесілі. Олардың нені білдіретінін түсіндіретін адамға. Басқалар шындықты көретін рамканы қалыптастыратын адамға. Нетократ — жай ғана ақпарат беруші емес. Ол нарративтер жасайды.\n\nКастельс мұны растайды: тарихта коммуникацияны бақылаған адам әрдайым жеңіске жеткен. Орта ғасырдағы Шіркеу — сауаттылық пен қолжазбалар арқылы. Буржуазия — баспа станогы арқылы. Индустриялық элиталар — бұқаралық ақпарат құралдары арқылы. Енді нетократтар алгоритмдерді, протоколдарды және орталықсыздандырылған желілерді меңгеріп жатыр. Құралдар өзгереді — логика бір.\n\n> Нетократ — міндетті түрде бай немесе танымал адам емес. Бұл желілердің қалай жұмыс істейтінін түсінетін және олардың ішінде стратегиялық әрекет ете алатын адам. Назар капиталы, желілік бірегейлік, мағыналар жасау — оның нағыз активтері осылар.\n\nМаңыздысы: Бард пен Зодерквист нетократияның шығу тегіне қарай жабық клуб емес екенін атап өтеді. Бұл ашық тап, оған кіру кедергісі ақша немесе туа біткен байланыстармен емес, түсінікпен анықталады. Бұл оның аристократия мен буржуазиядан түбегейлі айырмашылығы.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D 0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["нетократия", "билік", "бірегейлік", "желілер"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "consumtariat", "sceneIndex": 2, "type": "privacy", "shortTitle": "Консьюмтариат", "era": "қатысу иллюзиясы", "lensWeight": {"diagnosis": 3, "class": 5, "competence": 3, "exit": 1, "ethics": 2}, "title": "Консьюмтариат: қатысу елесі", "insight": "Консьюмтариат — желілерде құндылық өндіріп, мұны түсінбейтіндер. Лайктар мен пікірлер арқылы берілетін қатысу елесі — ұстап тұрудың архитектуралық механизмі. Түсіну — шығудың алғашқы қадамы.", "thesis": "Консьюмтариат — желілерде құндылық өндіріп, мұны түсінбейтіндер. Лайктар мен пікірлер арқылы берілетін қатысу елесі — ұстап тұрудың архитектуралық механизмі. Түсіну — шығудың алғашқы қадамы.", "body": "## Көру қиынырақ жаңа теңсіздік\n\nБард пен Зодерквист ескерткен: ақпараттық революция бәрін автоматты түрде азат етпейді. Ол теңсіздіктің жаңа түрін жасайды — мүліктік теңсіздікке қарағанда байқалуы қиынырақ, сондықтан қауіптірек.\n\nКонсьюмтариат — экономикалық мағынадағы жай ғана «тұтынушылар» емес. Бұл желілерге белсенді қатысатын, контент жасайтын, платформалармен өзара әрекеттесетін адамдар — бірақ сонымен бірге шын мәнінде не болып жатқанын түсінбейді. Олар көңіл көтеріп немесе сөйлесіп отырмыз деп ойлайды. Шын мәнінде — басқалар үшін құндылық өндіріп отыр.\n\nМеханизмді қадам-қадамымен талда. Facebook пайдаланушысы фотосурет жариялайды. Ол уақытын (қалпына келмейтін ресурс), шығармашылық энергиясын, жеке деректерін жұмсайды. Facebook контент алады (ол басқа пайдаланушыларды тартады), оның мінез-құлқы туралы деректер алады (жарнама берушілер үшін құнды шикізат), жарнамалық инвентарь алады (назарды монетизациялау). Пайдаланушы лайк алады — яғни Скиннер бойынша ауыспалы нығайту, ол оны қайта оралып, одан да көп өндіруге мәжбүр етеді.\n\nБұл мәміледе нетократ кім? Facebook — ол архитектураны түсінеді және оны өз мүддесіне сай құрады. Консьюмтариат кім? Пайдаланушы — ол шарттарды түсінбей қатысады.\n\nБасқа мысалға қара. TikTok пайдаланушысы күніне 90 минут видео көреді. TikTok мыналарды алады: оның қалаулары туралы деректер (дәл психологиялық профиль), жарнамалық табыс (назарды монетизациялау), алгоритмді оқытуға арналған сигналдар (ол барған сайын ақылдырақ әрі дәлірек болады). Пайдаланушы мыналарды алады: ойын-сауық және ауыспалы нығайтудан болатын дофаминдік серпілістер. Мұнда кім кімге жұмыс істеп жатыр?\n\n## Жалған қатысудың тұзағы\n\nБард пен Зодерквист сипаттаған ең зымиян механизм — қатысу елесі. Бұл консьюмтариатты өз жағдайын сезіндірмей жүйеде ұстап тұратын нәрсе.\n\nКонсьюмтариат өзін белсенді қатысушы сезінеді. Ол лайкпен дауыс береді — ықпал ету сезімі. Ол пікір жазады — дауысым бар деген сезім. Ол контентпен бөліседі — маңыздылық сезімі. Оған өзінің ақпараттық кеңістігінде болып жатқанға әсер етіп жатқандай көрінеді. Шын мәнінде ол деректер жасайды, ал сол деректердің негізінде нетократтар — алгоритм жасаушылар, платформа иелері — ертең оның не көретіні туралы нақты шешімдер қабылдайды.\n\nБұл қастандық емес. Бұл архитектура. Платформалар нақты құқықтарды барынша азайтып, қатысу сезімін барынша күшейтуге жобаланған. Сен профильге «иесің» — бірақ платформа оны ескертусіз өшіре алады. Сен контент «жасайсың» — бірақ оны кім көретінін алгоритм шешеді. Сен достарыңмен «сөйлесесің» — бірақ олар туралы не білетініңді және ақпаратты қандай ретпен алатыныңды платформа бақылайды.\n\nМишель Фуко паноптикумды сипаттады — тұтқындар дәл қазір өздерін бақылап отырғанын білмейтін мінсіз түрме. Соның нәтижесінде олар өздерін үнемі бақылауда тұрғандай ұстайды. Өзін-өзі цензуралау жүйеге кіріктіріледі. Бауман мен Лайон “Liquid Surveillance” еңбегінде көрсетті: қазіргі қадағалау да дәл солай жұмыс істейді — тек ерікті түрде. Әр қадамыңды бақылайтын қолданбаларды орнатуға сені ешкім мәжбүрлемейді. Мұны өзің істейсің. Өйткені ыңғайлы. Өйткені бәрі солай істейді. Өйткені әйтпесе әлеуметтік өмірден шеттеп қаласың.\n\nЗубофф мұны «мінез-құлықтық артықтар» деп атады: адамдар желідегі әрекеттерімен жасайтын құндылықты платформалар иемденіп, сатады. Консьюмтариат осы артықтарды өндіреді — бұл жүйедегі өзінің басты функциясы екенін түсінбестен.\n\n> Консьюмтариат — «интернетті қолдана алмайтындар» емес. Бұл интернетті оның архитектурасын түсінбей қолданатындар. Қатысу елесі — сені пайдаланатын жүйеде ұстап тұрудың ең тиімді механизмі.\n\nБұл механизмді түсіну — консьюмтариаттан шығудың алғашқы қадамы. Платформалардан бас тарту емес — оларға деген қатынасты өзгерту. «Мен сервисті қолданамын» дегеннен «мен бұл сервис үшін немен төлейтінімді және соған тұра ма, соны түсінемін» дегенге көшу.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["нетократия", "назар", "платформалар", "билік"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "levels", "sceneIndex": 3, "type": "technology", "shortTitle": "Үш деңгей", "era": "құзырет", "lensWeight": {"diagnosis": 1, "class": 3, "competence": 5, "exit": 3, "ethics": 2}, "title": "Нетократиялық құзыреттіліктің үш деңгейі", "insight": "Нетократияның үш деңгейі: архитектураны түсіну → назарды басқару → инфрақұрылым жасау. Нетократия — ашық тап. Кіру кедергісі — ақша немесе шығу тегі емес, түсінік.", "thesis": "Нетократияның үш деңгейі: архитектураны түсіну → назарды басқару → инфрақұрылым жасау. Нетократия — ашық тап. Кіру кедергісі — ақша немесе шығу тегі емес, түсінік.", "body": "## Нетократия — ашық тап\n\nҚұзыреттілік деңгейлерін сипаттамас бұрын, Бард пен Зодерквист айтқан принципті бір ойды қайталау маңызды: нетократия шығу тегіне қарай жабық клуб емес.\n\nАристократия қанға құрылды: дұрыс отбасында туу керек еді. Буржуазия капиталға құрылды: оны мұраға алу немесе жинау керек еді. Нетократия түсінікке құрылады. Ал түсінікті иеленуге болады.\n\nМәскеудегі профессордың ұлы желілерді түсінбей, жай ғана тұтынса, консьюмтариат болып өсуі мүмкін. Шағын қаладан шыққан, формалды білімі жоқ адам айналасындағылардан бұрын желілердің қалай жұмыс істейтінін түсінсе, нетократ бола алады.\n\nБұл білім туралы әңгімені түбегейлі өзгертеді. Харари *XXI ғасырға арналған 21 сабақта* XXI ғасырда нақты нені түсіну керек екенін тұжырымдады: фактілерді емес — оларды бірнеше секундта табуға болады. Білім қалай жасалатынын түсіну керек. Қандай нарративтерді кім және не үшін жасайды. Алгоритмдер шындықты қалай қалыптастырады. Манипуляцияны ақпараттан қалай ажыратуға болады. Нетократтың сауаттылығы деген осы.\n\n## Бірінші деңгей: архитектураны түсіну\n\nБұл — іргетас. Сен желілердің қалай жұмыс істейтінін білесің — техникалық мағынада емес, экономикалық және билік тұрғысынан.\n\nСен желілік әсерлерді және олардың неге монополия тудыратынын түсінесің. Платформалар неге \"тегін\" екенін және оның орнына не алатынын білесің. Алгоритмдерді сиқыр ретінде емес, нақты метрикаларды оңтайландыру ретінде түсінесің — әрі әр платформа қандай метрикаларды оңтайландыратынын білесің. Активтерді кастодиалды және кастодиалды емес сақтау арасындағы айырманы білесің. Smart contract деген не екенін және оның билік қатынастарын неге өзгертетінін түсінесің.\n\nБұл деңгей қажет, бірақ жеткіліксіз. Әрекетсіз түсінік ештеңені өзгертпейді. Бірақ түсініксіз кез келген әрекет — соқыр әрекет.\n\nАйтпақшы: сен жаңа ғана өзіңе осы бірінші деңгейді берген курсты аяқтадың. Шеннон мен ақпарат математикасынан токеномика мен DAO-ға дейін. Бұл кездейсоқ емес — бұл курстың архитектурасы.\n\n## Екінші деңгей: назарды басқару\n\nБұл — дағды деңгейі, түсінік әрекетке айналатын сәт.\n\nӨз назарыңды басқару: сен алгоритмдерге ненің маңызды екенін өзің үшін шешуге жол бермейсің. Уақытты неге жұмсауды саналы түрде таңдайсың — бұл басты қалпына келмейтін ресурс. Платформа ауыспалы бекіту арқылы сені манипуляциялауға тырысқанда, оны түсінесің және сол тұйықтан шыға аласың.\n\nБасқалардың назарын басқару: сен таралатын мағыналарды жасай аласың. Идеялар төңірегінде қауымдастықтар құра аласың. Адамдар әрі қарай жеткізгісі келетін нарративтерді қалыптастыра аласың. Бұл манипуляция емес — бұл адамдардың көпшілігі көтеріле бермейтін деңгейдегі коммуникация.\n\nБұл деңгейде сен аудиториялар құрып, қауымдастықтарға ықпал етіп, өз білімің мен байланыстарыңды тікелей монетизациялай аласың — платформа алгоритмі арқылы емес.\n\n## Үшінші деңгей: инфрақұрылым жасау\n\nБұл — архитектор деңгейі. Сен бар желілерді жай ғана пайдаланбайсың — жаңаларын құрасың.\n\nҚатысушылардың мүдделерін теңестіретін протоколдар жасап, ынталандыруларды жобалайсың. Қатысушыларды тек пайдаланушы емес, ортақ иеленуші ететін DAO мен токеномика құрасың. Ортақ бірегейлігі мен экономикасы бар қауымдастықтар жасайсың — онда тиесілі болудың нақты құндылығы бар.\n\nБұл деңгейде сен өзің ережелердің қайнарына айналасың. Сен бөтен ережемен ойнамайсың — басқалар әрекет ететін ортаны жобалайсың.\n\nАдамдардың көпшілігі ешқашан бірінші деңгейден жоғары көтерілмейді — қабілетсіз болғандықтан емес. Олар мұндай баспалдақтың бар екенін білмегендіктен. Енді сен білесің.\n\n> Нетократиялық құзыреттіліктің үш деңгейі: архитектураны түсіну → назарды басқару → инфрақұрылым жасау. Бірінші деңгейдегі адамдардың көпшілігі екінші және үшінші деңгей туралы білмейді. Сен жаңа ғана білдің.\n\nКрис Диксон *Read Write Own* кітабында интернеттің үш дәуірін етістіктер арқылы сипаттады: оқу (Web1), жазу (Web2), иелену (Web3). Нетократияның үш деңгейі де осы. Көпшілік оқиды. Азырақ бөлігі жазады. Бірен-сараны иеленеді. Иелену дәуіріне ашылған терезе дәл қазір ашық.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE %BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["нетократия", "білім", "билік", "Web3"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "srinivasan", "sceneIndex": 4, "type": "economy", "shortTitle": "Шринивасан", "era": "2022", "lensWeight": {"diagnosis": 2, "class": 2, "competence": 3, "exit": 5, "ethics": 2}, "title": "Шринивасан: желілік мемлекеттер", "insight": "Шринивасан: келесі саяси ығысу — мемлекеттерді реформалау емес, ортақ сәйкестігі, экономикасы және басқаруы бар желілік қауымдастықтар құру. Нетократтар параллель жүйелер құрады.", "thesis": "Шринивасан: келесі саяси ығысу — мемлекеттерді реформалау емес, ортақ сәйкестігі, экономикасы және басқаруы бар желілік қауымдастықтар құру. Нетократтар параллель жүйелер құрады.", "body": "## Нетократиялық логиканың ең радикалды нұсқасы\n\nБаладжи Шринивасан — сериялық кәсіпкер, Coinbase-тің бұрынғы CTO-сы, технология әлеміндегі ең арандатушы ойшылдардың бірі. 2022 жылы ол «The Network State» кітабын жариялады. Бұл кітап нетократиялық логиканың ең радикалды нұсқасын ұсынады: келесі саяси ығысу — қазіргі мемлекеттерді реформалау емес, жаңаларын құру.\n\nБұл ғылыми фантастика сияқты естіледі. Шринивасанның айтуынша, бұл — тарихи прецеденттерге негізделген рационалды болжам.\n\nОның дәлелі мына логикаға құрылады. Мемлекеттер — мәңгілік құрылымдар емес. Олар бүкіл тарих бойы пайда болып, жоғалып отырған. Ал жаңа мемлекеттердің пайда болуы бір ғана үлгімен: революция -> жариялау -> мойындау түрінде өте сирек жүрген. Көбіне бұл — формалды саяси рәсімделуден әлдеқайда бұрын сәйкестікті, экономиканы және қауымдастықты біртіндеп құру.\n\nИзраиль мемлекет ретінде 1948 жылы ғана пайда болған жоқ — ол оған дейін ондаған жыл бойы ортақ сәйкестігі мен ортақ жобасы бар қауымдастық ретінде құрылды. Сингапур қазіргі қалпына Ли Куан Ю белгілі бір типтегі адамдарды тартып, басқаларын ығыстырған ынталандыру жүйесін құрғандықтан келді. Кез келген ел — ең алдымен ортақ ережелері, сәйкестігі және экономикасы бар үйлестіру құрылғысы.\n\n## Желілік мемлекет қандай болады\n\nШринивасан нақты қадамдар тізбегін сипаттайды.\n\nАлдымен — ортақ құндылықтары бар онлайн-қауымдастық. Twitter-дегі жай ғана жазылушылар емес. Өмір қалай құрылуы керек деген нақты ортақ сенімдер біріктірген адамдар тобы: білімге, денсаулыққа, жұмысқа, басқаруға көзқарас.\n\nСодан кейін — ортақ экономика. Токендер, DAO, қауымдастық ішіндегі құндылық алмасу туралы өзара келісімдер. Қауымдастық мүшелері бір-бірімен сауда жасауды артық көре бастайды.\n\nСодан кейін — физикалық анклавтар. Қауымдастық мүшелері қатар өмір сүре бастайды: алдымен эксперимент ретінде, кейін өмір салты ретінде. Оларды біреу мәжбүрлегендіктен емес, бұл өмір сапасын арттыратындықтан: жақын маңда құндылықтары ұқсас адамдар болады.\n\nСодан кейін — дипломатиялық мойындау. Қауымдастық жеткілікті көлем мен ықпалға жеткенде, мемлекеттер онымен саяси субъект ретінде әрекеттесе бастайды.\n\nБұл жоспар емес — модель. Кейбір элементтер қазірдің өзінде бар: өз экономикасы бар крипто-қауымдастықтар, физикалық кездесулерге арналған колл-ту-экшн, ортақ құндылықтар мен сәйкестік.\n\nТимоти Снайдер «Еркіндікке апарар жолда» сол медальдің екінші жағы туралы ескертеді: авторитарлық режимдер де желілік билікті меңгеріп алды. Цензура арқылы емес — дезинформация, назарды манипуляциялау, ақиқат пен жалған ажыратылмай қалатын ақпараттық хаос жасау арқылы. Нетократия — бейтарап құрал. Ол екі бағытта да жұмыс істейді.\n\n> Шринивасан нетократиялық логиканың келесі деңгейін ұсынады: желілерді жай түсініп, пайдалану ғана емес — олардың негізінде жаңа саяси құрылымдар құру. Нетократтар қазіргі жүйелердің реформасын күтпейді. Олар параллель жүйелерді құрады.\n\nБұл міндетті түрде жаңа мемлекет құру дегенді білдірмейді. Нетократтардың көпшілігі үшін бұл: жай аудитория емес, нақты сәйкестігі мен экономикасы бар қауымдастықтар құру. Өз байланыстарыңның инфрақұрылымын платформалардан жалға алмай, оған өзің иелік ету.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "type": "privacy", "shortTitle": "Франкл", "era": "соңғы таңдау", "lensWeight": {"diagnosis": 1, "class": 1, "competence": 2, "exit": 2, "ethics": 5}, "title": "Франкл және соңғы таңдау", "insight": "Франкл: соңғы еркіндік — жағдайларға деген қатынасты таңдау. Сен цифрлық дәуірдің жағдайларын таңдаған жоқсың. Бірақ олармен не істеуді сен таңдайсың. Этикасыз түсіну — мақсаты жоқ құрал.", "thesis": "Франкл: соңғы еркіндік — жағдайларға деген қатынасты таңдау. Сен цифрлық дәуірдің жағдайларын таңдаған жоқсың. Бірақ олармен не істеуді сен таңдайсың. Этикасыз түсіну — мақсаты жоқ құрал.", "body": "## Концентрациялық лагерьден шыққан философ\n\nВиктор Франкл — австриялық психиатр. 1942 жылы ол нацистік концентрациялық лагерьлерге жер аударылды. Освенцимнен, Дахаудан және басқа лагерьлерден өтті. Әйелінен, ата-анасынан, бауырынан айырылды. Сипаттамасын физикалық реакциясыз оқу қиын жағдайларда үш жыл өткізді.\n\n1945 жылы бостандыққа шыққаннан кейін ол тоғыз күнде «Адамның мән іздеуі» кітабын жазды. Бұл XX ғасырдың ең ықпалды кітаптарының біріне және өзің таңдамаған жүйелер жағдайында адам болу нені білдіретінін түсінудегі ең маңызды кітаптардың біріне айналды.\n\nФранклдың елестетудің өзі қиын жағдайларда жасаған негізгі байқауы: адамнан соңғы еркіндікті тартып алуға болмайды. Қалғанының бәрін алуға болады — физикалық еркіндікті, мүлікті, жақындарды, басқалардың көзіндегі қадір-қасиетті. Бірақ жағдайларға деген өз қатынасыңды таңдау еркіндігін тартып алуға болмайды. Кез келген жағдайда стимул мен реакцияның арасында кеңістік қалады. Сол кеңістікте — адамдық қадір-қасиет.\n\n## Франкл неге осында\n\nИнтернет пен нетократия туралы курстың соңғы тарауында концентрациялық лагерьден шыққан философ не үшін керек?\n\nӨйткені осы курстың бәрі сен таңдамаған жағдайлар туралы болды.\n\nСен смартфондар мен алгоритмдер дәуірінде дүниеге келуді таңдаған жоқсың. Сенің саналы келісіміңсіз уақытыңды монетизациялайтын назар экономикасын таңдаған жоқсың. Скиннердің айнымалы күшейтуі арқылы жобаланған әлеуметтік желілер архитектурасын таңдаған жоқсың. Биліктің бірнеше платформаның қолында шоғырлануын таңдаған жоқсың.\n\nСен бұл жағдайларды таңдаған жоқсың. Бірақ осы біліммен не істеуді сен таңдайсың.\n\nФранкл басқа контекст туралы жазды — салыстыруға келмейтіндей қатыгез контекст туралы. Бірақ оның қағидасы әмбебап: жағдай мән-жайды анықтайды, адам мән-жайға жауапты анықтайды. Сені консьюмтариат немесе нетократ ететін жағдайлар емес. Оны сенің таңдауың жасайды.\n\n## Жауапкершіліксіз еркіндік — еркіндік емес\n\nБұл контексте Франклдың тағы бір маңызды қыры бар.\n\nОл былай жазды: жауапкершіліксіз еркіндік — өз бетімен кету. Нағыз еркіндік — таңдауларыңның салдары үшін жауапкершілікпен байланысқан еркіндік.\n\nТимоти Снайдер ескерткен: дәл сол нетократиялық логика — желілерді түсіну, назарды басқару, нарративтер құру — демократияны қирату, дезинформация тарату, адамдарды үлкен ауқымда манипуляциялау үшін қолданылуы мүмкін. Авторитарлық режимдер мұны түсінді және пайдаланып отыр.\n\nӨз жүйелерінің салдарын түсінбей, этикалық компассыз жүйе құратын нетократ Web2 платформаларында біз сынаған сол проблемаларды қайта өндіреді. Тек жылдамырақ, өйткені архитектураны жақсырақ түсінеді. Және үлкенірек ауқымда.\n\nТүсіну — құрал. Кез келген құрал сияқты, оның өз этикасы жоқ. Балғамен құрылыс салуға да, қиратуға да болады. Желілер архитектурасын білуді мүмкіндіктерді теңестіретін ашық жүйелер құруға да, әлдеқайда күрделі манипуляция жүйелерін жасауға да қолдануға болады.\n\nФранкл лагерьде адамдардың екі түрін де көрді: адам төзгісіз жағдайда қадір-қасиетін сақтап, басқаларға көмектескендерді де, сол жағдайда сатқындық жасап, әлсіздерді пайдаланғандарды да. Жағдайлар бірдей болды. Таңдаулар — әртүрлі.\n\n> Франкл былай тұжырымдады: адамның соңғы еркіндігі — жағдайларға деген қатынасын таңдау. Сен цифрлық дәуірдің жағдайларын таңдаған жоқсың. Бірақ олармен не істеуді сен таңдайсың. Және қалай істеуді де.\n\nБұл — курстың соңғы ойы. Техникалық емес. Экономикалық емес. Адами. Нетократия — ашық класс, кіру кедергісі — түсіну. Бірақ этикасыз түсіну — мақсаты жоқ құрал. Сен не құратының — тек өзіңе байланысты.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0% ындарға арналған.", "thesis": "Сен нетократиялық құзыреттіліктің бірінші деңгейін аяқтадың — архитектураны түсіну. Екінші деңгей: назарды басқару. Үшінші: инфрақұрылым жасау. Келесі курс — әрекет етуді таңдайтындарға арналған.", "body": "## Бұл курстың жасырын мақсаты\n\nБұл курс «Жаңа интернеттің негіздері» деп аталды. Сегіз тарау. Шеннон математикасынан Накамото блокчейніне дейін. Алғашқы форумдардан TikTok-қа дейін. Еркін білім туралы арманнан қадағалау капитализміне дейін — және одан Web3 құрып жатқан жаңа архитектураға дейін.\n\nБірақ курстың жасырын мақсаты болды, оны енді ашық айтуға болады.\n\nБіз интернеттің қалай жұмыс істейтінін жай ғана түсіндірген жоқпыз. Біз сені таңдауға дайындадық.\n\nКонсьюмтариат пен нетократия арасындағы таңдау. Желілерде өмір сүріп, олардың архитектурасын түсінбейтіндер мен түсініп, саналы әрекет ететіндер арасындағы таңдау. Платформалар үшін құндылық өндіріп, қатысу иллюзиясынан басқа ештеңе алмайтындар мен платформалар құратын, олардағы өз үлесін басқаратын немесе кем дегенде «тегін» сервистер үшін немен төлейтінін түсінетіндер арасындағы таңдау.\n\n## Бұл курстан не алдың\n\nБард пен Зодерквист нетократиялық құзыреттіліктің бірінші деңгейін архитектураны түсіну деп сипаттады. Сен оны өттің.\n\nСен ақпараттың неге биліктің басты ресурсына айналғанын түсінесің — Шеннон мен Кастельстен бастап. Web1 ашық интернетті қалай құрғанын және оның ашықтығы неге пайдаланушыларға қарсы қолданылғанын білесің. Назар экономикасы мен қадағалау капитализмінің механизмін түсінесің — Саймоннан Зубоффқа дейін. Алгоритмдер фильтр көпіршіктерін қалай жасап, қоғамды қалай поляризациялайтынын көресің — әрі бұл зұлым ниет емес, қатысуды арттыруға оңтайландырудың архитектуралық салдары екенін түсінесің. Web 3.0 мен Web3 арасындағы айырмашылықты білесің. Приват кілттің не екенін және «not your keys — not your coins» неге маңызды екенін түсінесің. Смарт-контракттар, DeFi және DAO қалай жұмыс істейтінін білесің. Нетократия мен консьюмтариаттың не екенін және қазір қай деңгейде тұрғаныңды түсінесің.\n\nБұл — бірінші деңгей. Қажетті. Бірақ жеткіліксіз.\n\n## Келесі қадам\n\nКрис Диксон интернеттің үш дәуірін сипаттады: оқу, жазу, иелену. Сен осы дәуірлер туралы курсты оқып шықтың. Енді келесі етістікке өтетін сәт келді.\n\nНетократиялық құзыреттіліктің екінші деңгейі — назарды басқару. Мағыналар жасау, қауымдастықтар құру, білім мен байланыстарды тікелей монетизациялау қабілеті. Өз назарыңды алгоритмдерге бермей, оны саналы түрде бағыттай алу қабілеті.\n\nҮшінші деңгей — инфрақұрылым жасау. Протоколдар, токеномика, DAO, цифрлық сәйкестік. Ережелерді өзің орнататын жүйелердің архитектурасы.\n\nLuminara келесі курстарды дәл осы үшін құрып жатыр. Сен «криптаны түсінуің» үшін ғана емес, абстракт мағынада емес. Екінші және үшінші деңгейде әрекет ете алуың үшін. Нақты құралдарды түсіну. Оларды пайдалану. Олардың негізінде құру.\n\nБард пен Зодерквист былай жазды: нетократия — ашық класс. Кіру кедергісі — түсіну. Және көпшіліктен әрі қарай үйренуге деген ниет.\n\nСен тегін курсты соңына дейін оқып шықтың. Бұл қазірдің өзінде белгі — көпшілік соңына жетпейді. Көпшілік оқымай скролл жасайды. Көпшілік тұтынады — және сұрақ қоймайды.\n\nСен сұрақ қоясың.\n\n> Франкл былай жазды: кез келген жағдайда адамда соңғы еркіндік бар — оған деген қатынасын таңдау. Сен цифрлық дәуірдің жағдайларын таңдаған жоқсың. Бірақ олармен не істеуді сен таңдайсың. Келесі курс — әрекет етуді таңдайтындарға арналған.\n\nLuminara-ға қош келдің.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0
