is": "Шринивасан: следующий политический сдвиг — не реформа государств, а создание сетевых сообществ с общей идентичностью, экономикой и управлением. Нетократы строят параллельные системы.", "body": "## Самая радикальная версия нетократической логики\n\nБаладжи Шринивасан — серийный предприниматель, бывший CTO Coinbase, один из самых провокационных мыслителей в технологическом мире. В 2022 году он опубликовал книгу «The Network State», которая предлагает самую радикальную версию нетократической логики: следующий политический сдвиг — это не реформа существующих государств, а создание новых.\n\nЭто звучит как научная фантастика. Шринивасан настаивает: это рациональный прогноз, основанный на исторических прецедентах.\n\nЕго аргумент строится на следующей логике. Государства — не вечные образования. Они возникали и исчезали на протяжении всей истории. И возникновение новых государств почти никогда не происходило по одному шаблону: революция → провозглашение → признание. Чаще — постепенное строительство идентичности, экономики и сообщества задолго до формального политического оформления.\n\nИзраиль как государство возник не в 1948 году — он строился как сообщество с общей идентичностью и общим проектом десятилетиями до этого. Сингапур стал тем, чем является, потому что Ли Куан Ю создал систему стимулов, привлёкшую определённый тип людей и оттолкнувшую других. Любая страна — это прежде всего координационное устройство с общими правилами, идентичностью и экономикой.\n\n## Как выглядит сетевое государство\n\nШринивасан описывает конкретную последовательность шагов.\n\nСначала — онлайн-сообщество с общими ценностями. Не просто подписчики в Twitter. Группа людей, объединённых реальными общими убеждениями о том, как должна быть устроена жизнь: отношение к образованию, к здоровью, к работе, к управлению.\n\nПотом — общая экономика. Токены, DAO, взаимные соглашения об обмене ценностью внутри сообщества. Члены сообщества начинают предпочитать торговать друг с другом.\n\nПотом — физические анклавы. Члены сообщества начинают жить рядом — сначала как эксперимент, потом как образ жизни. Не потому что их заставляют — а потому что это повышает качество жизни: рядом люди с близкими ценностями.\n\nПотом — дипломатическое признание. Когда сообщество достигает достаточного размера и влияния — государства начинают взаимодействовать с ним как с политическим субъектом.\n\nЭто не план — это модель. Некоторые элементы уже существуют: крипто-сообщества с собственной экономикой, колл-ту-экшн для физических встреч, общие ценности и идентичность.\n\nТимоти Снайдер в «Дороге к несвободе» предупреждает о другой стороне той же монеты: авторитарные режимы тоже освоили сетевую власть. Не через цензуру — через дезинформацию, манипуляцию вниманием, создание информационного хаоса, в котором правда и ложь становятся неразличимыми. Нетократия — нейтральный инструмент. Он работает в обе стороны.\n\n> Шринивасан предлагает следующий уровень нетократической логики: не просто понимать и использовать сети — но строить новые политические образования на их основе. Нетократы не ждут реформы существующих систем. Они строят параллельные.\n\nЭто не обязательно означает создание нового государства. Для большинства нетократов это означает: строить сообщества с реальной идентичностью и экономикой, а не просто аудитории. Владеть инфраструктурой своих связей, а не арендовать её у платформ.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1%80%D0%BE%D0%BA%20%D0%B4%D0%BB%D1%8F%20XXI%20%D0%B2%D0%B5%D0%BA%D0%B0%20%282018%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман, Дэвид Лайон — Liquid Surveillance (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netocracy", "governance", "community", "networks"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "frankl", "sceneIndex": 5, "type": "privacy", "shortTitle": "Франкл", "era": "последний выбор", "lensWeight": {"diagnosis": 1, "class": 1, "competence": 2, "exit": 2, "ethics": 5}, "title": "Франкл и последний выбор", "insight": "Франкл: последняя свобода — выбор отношения к обстоятельствам. Ты не выбирал условия цифровой эпохи. Но ты выбираешь, что с ними делать. Понимание без этики — инструмент без цели.", "thesis": "Франкл: последняя свобода — выбор отношения к обстоятельствам. Ты не выбирал условия цифровой эпохи. Но ты выбираешь, что с ними делать. Понимание без этики — инструмент без цели.", "body": "## Философ из концентрационного лагеря\n\nВиктор Франкл — австрийский психиатр. В 1942 году он был депортирован в нацистские концентрационные лагеря. Прошёл через Освенцим, Дахау, другие лагеря. Потерял жену, родителей, брата. Провёл три года в условиях, описание которых трудно читать без физической реакции.\n\nВыйдя на свободу в 1945 году, он за девять дней написал книгу «Человек в поисках смысла». Это стало одной из самых влиятельных книг XX века — и одной из самых важных для понимания того, что значит быть человеком в условиях систем, которые ты не выбирал.\n\nКлючевое наблюдение Франкла, сделанное в условиях, которые сложно даже вообразить: у человека нельзя отнять последнюю свободу. Всё остальное можно — физическую свободу, имущество, близких, достоинство в глазах других. Но нельзя отнять свободу выбирать своё отношение к обстоятельствам. В любых условиях остаётся пространство между стимулом и реакцией. И в этом пространстве — человеческое достоинство.\n\n## Почему Франкл здесь\n\nЗачем философ из концентрационного лагеря в финальной главе курса об интернете и нетократии?\n\nПотому что весь этот курс был о условиях, которые ты не выбирал.\n\nТы не выбирал родиться в эпоху смартфонов и алгоритмов. Не выбирал экономику внимания, которая монетизирует твоё время без твоего сознательного согласия. Не выбирал архитектуру социальных сетей, спроектированную через переменное подкрепление Скиннера. Не выбирал концентрацию власти в руках нескольких платформ.\n\nТы не выбирал эти условия. Но ты выбираешь, что делать с этим знанием.\n\nФранкл писал о другом контексте — несравнимо более жестоком. Но его принцип универсален: ситуация определяет обстоятельства, человек определяет ответ на обстоятельства. Не условия делают тебя консьюмтариатом или нетократом. Твой выбор — делает.\n\n## Свобода без ответственности — не свобода\n\nЕсть ещё одно измерение Франкла, важное в этом контексте.\n\nОн писал: свобода без ответственности — это произвол. Настоящая свобода — это свобода, сопряжённая с ответственностью за последствия твоих выборов.\n\nТимоти Снайдер предупреждал: та же нетократическая логика — понимание сетей, управление вниманием, создание нарративов — может использоваться для разрушения демократии, для дезинформации, для манипуляции людьми в масштабе. Авторитарные режимы это поняли и используют.\n\nНетократ, который строит системы без понимания их последствий — без этического компаса — воспроизводит те же проблемы, которые мы критиковали в платформах Web2. Только быстрее, потому что понимает архитектуру лучше. И в большем масштабе.\n\nПонимание — это инструмент. Как любой инструмент, он не имеет собственной этики. Молоток можно использовать для строительства или для разрушения. Знание архитектуры сетей можно использовать для создания открытых систем, выравнивающих возможности — или для создания более изощрённых систем манипуляции.\n\nФранкл в лагере наблюдал оба типа людей: тех, кто в нечеловеческих условиях сохранял достоинство и помогал другим, и тех, кто в тех же условиях предавал и использовал слабых. Условия были одинаковые. Выборы — разные.\n\n> Франкл сформулировал: последняя свобода человека — выбор отношения к обстоятельствам. Ты не выбирал условия цифровой эпохи. Но ты выбираешь, что с ними делать. И как.\n\nЭто финальное соображение курса. Не техническое. Не экономическое. Человеческое. Нетократия — это открытый класс, барьер входа — понимание. Но понимание без этики — это инструмент без цели. Что ты строишь — зависит только от тебя.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1%80%D0%BE%D0%BA%20%D0%B4%D0%BB%D1%8F%20XXI%20%D0%B2%D0%B5%D0%BA%D0%B0%20%282018%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман, Дэвид Лайон — Liquid Surveillance (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netocracy", "philosophy", "ethics", "freedom"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "luminara", "sceneIndex": 6, "type": "power", "shortTitle": "Что дальше?", "era": "→действие", "lensWeight": {"diagnosis": 2, "class": 3, "competence": 5, "exit": 4, "ethics": 4}, "title": "Luminara: ты дочитал. Что дальше?", "insight": "Ты завершил первый уровень нетократической компетенции — понимание архитектуры. Второй уровень: управление вниманием. Третий: создание инфраструктуры. Следующий курс — для тех, кто выбирает действовать.", "thesis": "Ты завершил первый уровень нетократической компетенции — понимание архитектуры. Второй уровень: управление вниманием. Третий: создание инфраструктуры. Следующий курс — для тех, кто выбирает действовать.", "body": "## Скрытая цель этого курса\n\nЭтот курс назывался «Основания нового интернета». Восемь глав. От математики Шеннона до блокчейна Накамото. От первых форумов до TikTok. От мечты о свободном знании до капитализма слежки — и от него к новой архитектуре, которую строит Web3.\n\nНо у курса была скрытая цель, которую теперь можно назвать прямо.\n\nМы не просто объясняли, как работает интернет. Мы готовили тебя к выбору.\n\nВыбору между консьюмтариатом и нетократией. Между теми, кто живёт в сетях, не понимая их архитектуры, — и теми, кто понимает и действует осознанно. Между теми, кто производит ценность для платформ, не получая ничего, кроме иллюзии участия, — и теми, кто строит платформы, управляет своей долей в них или хотя бы понимает, чем платит за «бесплатные» сервисы.\n\n## Что ты получил из этого курса\n\nБард и Зодерквист описали первый уровень нетократической компетенции как понимание архитектуры. Ты его прошёл.\n\nТы понимаешь, почему информация стала главным ресурсом власти — от Шеннона и Кастельса. Знаешь, как Web1 создал открытый интернет и почему его открытость была использована против пользователей. Понимаешь механику экономики внимания и капитализма слежки — от Саймона до Зубофф. Видишь, как алгоритмы создают фильтровые пузыри и поляризуют общество — и почему это не злой умысел, а архитектурное следствие оптимизации на вовлечение. Знаешь разницу между Web 3.0 и Web3. Понимаешь, что такое приватный ключ и почему «not your keys — not your coins». Знаешь, как работают смарт-контракты, DeFi и DAO. Понимаешь, что такое нетократия и консьюмтариат — и на каком уровне ты находишься сейчас.\n\nЭто первый уровень. Необходимый. Но недостаточный.\n\n## Следующий шаг\n\nКрис Диксон описал три эпохи интернета: читать, писать, владеть. Ты прочитал курс об этих эпохах. Теперь — момент перейти к следующему глаголу.\n\nВторой уровень нетократической компетенции — управление вниманием. Умение создавать смыслы, строить сообщества, монетизировать знания и связи напрямую. Умение не отдавать своё внимание алгоритмам, а направлять его осознанно.\n\nТретий уровень — создание инфраструктуры. Протоколы, токеномика, DAO, цифровая идентичность. Архитектура систем, в которых ты сам устанавливаешь правила.\n\nLuminara строит следующие курсы именно для этого. Не для того, чтобы ты «понимал крипту» в абстрактном смысле. А для того, чтобы ты мог действовать на втором и третьем уровне. Понимать конкретные инструменты. Использовать их. Строить на их основе.\n\nБард и Зодерквист писали: нетократия — открытый класс. Барьер входа — понимание. И желание учиться дальше, чем большинство.\n\nТы дочитал до конца бесплатного курса. Это уже сигнал — большинство не доходят. Большинство скроллят, не читая. Большинство потребляют — и не задают вопросов.\n\nТы задаёшь.\n\n> Франкл написал: в любых обстоятельствах у человека есть последняя свобода — выбор отношения к ним. Ты не выбирал условия цифровой эпохи. Но ты выбираешь, что с ними делать. Следующий курс — для тех, кто выбирает действовать.\n\nДобро пожаловать в Luminara.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1%80%D0%BE%D0%BA%20%D0%B4%D0%BB%D1%8F%20XXI%20%D0%B2%D0%B5%D0%BA%D0%B0%20%282018%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман, Дэвид Лайон — Liquid Surveillance (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netocracy", "luminara", "web3", "education"], "x": 265.5, "y": 258.0, "angDeg": 218.6}], "edges": [{"from": "toffler", "to": "netocrat", "label": "новая концентрация нашла класс", "lenses": ["diagnosis", "class"]}, {"from": "netocrat", "to": "consumtariat", "label": "класс определяется противоположностью", "lenses": ["class"]}, {"from": "consumtariat", "to": "levels", "label": "осознание — первый шаг к выходу", "lenses": ["class", "competence"]}, {"from": "netocrat", "to": "levels", "label": "барьер входа — понимание", "lenses": ["class", "competence"]}, {"from": "levels", "to": "srinivasan", "label": "инфраструктура строит государства", "lenses": ["competence", "exit"]}, {"from": "srinivasan", "to": "luminara", "label": "параллельные системы уже строят", "lenses": ["exit", "competence"]}, {"from": "levels", "to": "frankl", "label": "понимание требует выбора", "lenses": ["competence", "ethics"]}, {"from": "frankl", "to": "luminara", "label": "понимание без этики — инструмент без цели", "lenses": ["ethics"]}, {"from": "toffler", "to": "frankl", "label": "ты не выбирал условия — выбираешь ответ", "lenses": ["diagnosis", "ethics"]}, {"from": "consumtariat", "to": "luminara", "label": "выход через компетенцию", "lenses": ["class", "competence"]}]}, "en": {"chapter": {"key": "netocracy", "title": "Netocracy", "lede": "Power belongs to those who understand the architecture. The barrier to entry is understanding, not money.", "sourceUrl": "https://luminara.tech/#/scene?s=0&c=netocracy", "centralIdea": "Power belongs to those who understand the architecture", "centerX": 500, "centerY": 445, "ring": 300, "demoTop": "pending"}, "lenses": [{"id": "diagnosis", "label": "Diagnosis", "accent": "#7dd3fc", "description": "Toffler: the third wave brought not a dispersal of power, but a new concentration of it."}, {"id": "class", "label": "Class", "accent": "#f87171", "description": "Netocrat versus consumtariat: five traits and the illusion of participation."}, {"id": "competence", "label": "Competence", "accent": "#34d399", "description": "Three levels: understanding architecture → managing attention → infrastructure."}, {"id": "exit", "label": "Exit", "accent": "#c084fc", "description": "Srinivasan: network states and parallel systems as the next shift."}, {"id": "ethics", "label": "Ethics", "accent": "#fbbf24", "description": "Frankl: the last freedom is choosing one’s attitude. Understanding without ethics is empty."}], "nodes": [{"id": "toffler", "sceneIndex": 0, "type": "power", "shortTitle": "Toffler", "era": "1980", "lensWeight": {"diagnosis": 5, "class": 3, "competence": 1, "exit": 2, "ethics": 1}, "title": "Toffler was right, but not completely", "insight": "Toffler guessed the third wave correctly, but was wrong about the consequence: decentralization of information created not decentralization of power, but a new type of its concentration, invisible and therefore more dangerous.", "thesis": "Toffler guessed the third wave correctly, but was wrong about the consequence: decentralization of information created not decentralization of power, but a new type of its concentration, invisible and therefore more dangerous.", "body": "## The loop has closed\n\nWe began this course with Toffler. Let us return to him to understand what he guessed correctly, what he did not, and why it matters.\n\nIn 1980, Alvin Toffler wrote \"The Third Wave,\" a book about the inevitable transformation of the industrial world. His predictions were bold for their time. Production would become personalized: the end of the era of standard goods for everyone. The boundary between producer and consumer would blur: the prosumer would appear, the person who creates and consumes at the same time. Traditional hierarchies, corporations, states, trade unions, would be destroyed by new network structures.\n\nAll of this came true. The Netflix algorithm selects content individually. A YouTube user watches and creates at the same time. A two-person startup can compete with a corporation. An anonymous developer creates a protocol worth billions, and this is the reality of the 2020s.\n\nBut Toffler made a fundamental mistake in the consequence. He thought that decentralization of information would lead to decentralization of power. The logic seemed ironclad: if knowledge was no longer the elite's monopoly, power would also stop being a monopoly.\n\nThat did not happen.\n\n## Decentralization in form, concentration in substance\n\nPower decentralized, but not in the way Toffler thought. It moved from states to corporations. From corporations to platforms. From platforms to those who know how to manage algorithms and attention.\n\nFive technology companies control most of what billions of people see every day. A few algorithms determine which ideas spread and which remain invisible. This is decentralization in form: nobody is sitting in the Kremlin deciding what to broadcast. And concentration in substance: a few architects of algorithms define the planet's informational reality.\n\nToffler also predicted the prosumer: a person who produces and consumes at the same time. He was right about that too. But he did not foresee that this distinction would become a new class divide. That some people would produce value in networks and receive it back: through tokens, through influence, through income. While others would produce value in networks and receive nothing except the illusion of participation.\n\nManuel Castells confirmed this logic with academic precision: in a network society, power is power over communication. Whoever controls which messages pass through networks, in what context, with what weight, shapes collective consciousness. This is not Soviet-style propaganda. It is the architecture of attention. The algorithm does not tell you what to think. It decides which thoughts you encounter most often.\n\n> Toffler accurately predicted the third wave in 1980. But he was wrong about the consequence: decentralization of information did not lead to decentralization of power. It created a new type of concentration: invisible, and therefore more dangerous.\n\nThis mistake matters. Because correcting it is the central task of Web3. Not just technological decentralization. Real decentralization of power: through open protocols, through ownership of assets, through transparent rules in code.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1%80%D0%BE%D0%BA%20%D0%B4%D0%BB%D1%8F%20XXI%20%D0%B2%D0%B5%D0%BA%D0%B0%20%282018%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман, Дэвид Лайон — Liquid Surveillance (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netocracy", "power", "history", "networks"], "x": 500.0, "y": 145.0, "angDeg": -90.0}, {"id": "netocrat", "sceneIndex": 1, "type": "media", "shortTitle": "Netocrat", "era": "2000", "lensWeight": {"diagnosis": 3, "class": 5, "competence": 4, "exit": 2, "ethics": 1}, "title": "Bard and Soderqvist: the anatomy of a netocrat", "insight": "Bard and Soderqvist described the netocrat through five characteristics: attentional capital, network identity, curatorship, architecture of connections, and the creation of meanings. The barrier to entry is understanding, not money.", "thesis": "Bard and Soderqvist described the netocrat through five characteristics: attentional capital, network identity, curatorship, architecture of connections, and the creation of meanings. The barrier to entry is understanding, not money.", "body": "## A book written too early\n\nIn 2000, Alexander Bard and Jan Soderqvist published Netocracy. The timing was disastrously bad: the internet bubble had just burst, thousands of companies had gone bankrupt, and broad disillusionment with the \"new economy\" had reached its peak. No one wanted to hear about new elites of the network age. The book was practically ignored.\n\nTwenty-five years later, it reads like an accurate map of the world we live in.\n\nBard and Soderqvist's central thesis is this: every economic system produces its own ruling class. Feudalism produced the aristocracy — those who owned land. Industrial capitalism produced the bourgeoisie — those who owned capital, factories, banks. The information age produces netocracy — those who own attention and know how to manage networks.\n\nThis is not a metaphor or a sociological abstraction. It is a description of a concrete mechanism of power that is working right now.\n\n## Five characteristics of the netocrat\n\nBard and Soderqvist describe the netocrat through a set of characteristics — and each of them contrasts with what was valued in the industrial age.\n\n**Attentional capital.** The netocrat's main resource is not money, and not knowledge in itself. It is the ability to manage attention: one's own and other people's. In a world of information abundance, the scarce resource is not content but attention. A netocrat knows how to concentrate it, direct it and monetize it. He knows where the attention of millions is right now — and how to draw it toward what matters.\n\n**Network identity.** A netocrat builds status through networks, not through institutions. His value is determined not by a position in a company, not by a diploma, not by titles — but by the quality of his connections, his reputation in communities, and his influence over information flows. He may be anonymous on the internet — and have more real power than the director of a major corporation with an impressive CV.\n\n**A curator, not a consumer.** In a world where information is infinite, the person who can choose what matters and filter out noise holds enormous power. A netocrat does not simply consume information — he selects it, interprets it and distributes it. This is his work: to be a reliable filter for his audience.\n\n**Architecture of connections.** A netocrat understands that the value of a network depends on its participants. He invests in relationships strategically — building an architecture of connections, not merely \"networking\" in the old sense. Access to the right people at the right moment matters more than any other resource. This is not cynicism — it is an understanding of how the world actually works.\n\n**Creator of meanings.** In a world where facts are publicly available, power belongs to the person who gives facts context. The one who explains what they mean. The one who shapes the frame through which others see reality. A netocrat is not simply an informant. He creates narratives.\n\nCastells confirms it: throughout history, the winner has always been the one who controlled communication. The Church in the Middle Ages — through literacy and manuscripts. The bourgeoisie — through the printing press. Industrial elites — through mass media. Now netocrats are mastering algorithms, protocols and decentralized networks. The tools change — the logic is the same.\n\n> A netocrat is not necessarily a rich or famous person. It is someone who understands how networks work and knows how to act in them strategically. Attentional capital, network identity, the creation of meanings — these are his real assets.\n\nImportant: Bard and Soderqvist emphasize that netocracy is not a closed club by origin. It is an open class, whose barrier to entry is defined by understanding, not by money or connections at birth. This is its fundamental difference from the aristocracy and the bourgeoisie.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1%80%D0%BE%D0%BA%20%D0%B4%D0%BB%D1%8F%20XXI%20%D0%B2%D0%B5%D0%BA%D0%B0%20%282018%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман, Дэвид Лайон — Liquid Surveillance (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netocracy", "power", "identity", "networks"], "x": 734.5, "y": 258.0, "angDeg": -38.6}, {"id": "consumtariat", "sceneIndex": 2, "type": "privacy", "shortTitle": "Consumtariat", "era": "illusion of participation", "lensWeight": {"diagnosis": 3, "class": 5, "competence": 3, "exit": 1, "ethics": 2}, "title": "The Consumtariat: the illusion of participation", "insight": "The consumtariat are those who produce value in networks without understanding it. The illusion of participation through likes and comments is an architectural mechanism of retention. Awareness is the first step out.", "thesis": "The consumtariat are those who produce value in networks without understanding it. The illusion of participation through likes and comments is an architectural mechanism of retention. Awareness is the first step out.", "body": "## A new inequality that is harder to see\n\nBard and Söderqvist warned that the information revolution does not automatically liberate everyone. It creates a new kind of inequality — more elusive than property inequality, and therefore more dangerous.\n\nThe consumtariat is not simply “consumers” in the economic sense. These are people who actively participate in networks, create content, interact with platforms — and at the same time do not understand what is really happening. They think they are being entertained or communicating. In reality, they are producing value for others.\n\nBreak the mechanism down step by step. A Facebook user posts a photo. He spends time (a non-renewable resource), creative energy, personal data. Facebook receives content (which attracts other users), data about his behavior (valuable raw material for advertisers), advertising inventory (the monetization of attention). The user receives likes — that is, variable reinforcement in Skinner's sense, which makes him come back and produce even more.\n\nWho is the netocrat in this transaction? Facebook — it understands the architecture and builds it in its own interests. Who is the consumtariat? The user — he participates without understanding the terms.\n\nLook at another example. A TikTok user watches videos for 90 minutes a day. TikTok receives: data about his preferences (an accurate psychological profile), advertising revenue (the monetization of attention), signals for training the algorithm (which becomes smarter and more precise). The user receives: entertainment and dopamine spikes from variable reinforcement. Who is working for whom here?\n\n## The trap of pseudo-participation\n\nThe most insidious mechanism described by Bard and Söderqvist is the illusion of participation. This is what keeps the consumtariat inside the system without awareness of its position.\n\nThe consumtariat feels like an active participant. It votes with likes — a sense of influence. It writes comments — a sense of voice. It shares content — a sense of significance. It seems to people that they influence what happens in their information space. In reality, they create data on the basis of which netocrats — the creators of algorithms, the owners of platforms — make the real decisions about what they will see tomorrow.\n\nThis is not a conspiracy. It is architecture. Platforms are designed to maximize the feeling of participation while minimizing real rights. You “own” your profile — but the platform can delete it without warning. You “create” content — but the algorithm decides who will see it. You “communicate” with friends — but the platform controls what you know about them and in what order you receive the information.\n\nMichel Foucault described the panopticon — an ideal prison where inmates do not know whether they are being watched right now. As a result, they behave as if they are being watched constantly. Self-censorship becomes built in. Bauman and Lyon showed in “Liquid Surveillance” that modern surveillance works the same way — only voluntarily. No one forces you to install apps that track every step. You do it yourself. Because it is convenient. Because everyone does it. Because otherwise you fall out of social life.\n\nZuboff called this “behavioral surplus”: the value people create through their actions online is extracted by platforms and sold. The consumtariat produces this surplus — without realizing that this is its main function in the system.\n\n> The consumtariat is not those who “do not know how to use the internet.” It is those who use it without understanding its architecture. The illusion of participation is the most effective mechanism for keeping people in a system that uses them.\n\nUnderstanding this mechanism is the first step toward leaving the consumtariat. Not rejecting platforms, but changing one's relationship to them. From “I use a service” to “I understand what I pay for this service with, and whether it is worth it.”", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1%80%D0%BE%D0%BA%20%D0%B4%D0%BB%D1%8F%20XXI%20%D0%B2%D0%B5%D0%BA%D0%B0%20%282018%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман, Дэвид Лайон — Liquid Surveillance (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netocracy", "attention", "platforms", "power"], "x": 792.5, "y": 511.8, "angDeg": 12.9}, {"id": "levels", "sceneIndex": 3, "type": "technology", "shortTitle": "Three levels", "era": "competence", "lensWeight": {"diagnosis": 1, "class": 3, "competence": 5, "exit": 3, "ethics": 2}, "title": "Three levels of netocratic competence", "insight": "Three levels of netocracy: understanding architecture → managing attention → creating infrastructure. Netocracy is an open class. The barrier to entry is understanding, not money or origin.", "thesis": "Three levels of netocracy: understanding architecture → managing attention → creating infrastructure. Netocracy is an open class. The barrier to entry is understanding, not money or origin.", "body": "## Netocracy is an open class\n\nBefore describing the levels of competence, it is important to repeat a fundamental point from Bard and Soderqvist: netocracy is not a closed club by origin.\n\nAristocracy was built on blood: you had to be born into the right family. The bourgeoisie was built on capital: you had to inherit or accumulate it. Netocracy is built on understanding. And understanding can be acquired.\n\nThe son of a professor from Moscow can grow into the consumtariat if he simply consumes networks without understanding them. A person from a small town, with no formal education, can become a netocrat if they understand how networks work before the people around them do.\n\nThis fundamentally changes the conversation about education. Harari, in *21 Lessons for the 21st Century*, formulated what exactly must be understood in the 21st century: not facts, which can be found in seconds. You need to understand how knowledge is created. Who creates particular narratives, and why. How algorithms shape reality. How to distinguish manipulation from information. This is the literacy of a netocrat.\n\n## Level one: understanding architecture\n\nThis is the foundation. You know how networks work, not in a technical sense, but in an economic and power sense.\n\nYou understand network effects and why they create monopolies. You know why platforms are \"free\" and what they take in return. You understand algorithms not as magic, but as the optimization of specific metrics, and you know which metrics each platform optimizes. You know the difference between custodial and non-custodial storage of assets. You understand what a smart contract is and why it changes power relations.\n\nThis level is necessary, but not sufficient. Understanding without action changes nothing. But without understanding, every action is blind.\n\nBy the way: you have just completed a course that gave you this first level. From Shannon and the mathematics of information to tokenomics and DAO. This is not an accident; it is the architecture of the course.\n\n## Level two: managing attention\n\nThis is the level of skill, when understanding becomes action.\n\nManaging your own attention: you do not let algorithms decide for you what matters. You consciously choose what to spend time on, because it is the main non-renewable resource. You understand when a platform is trying to manipulate you through variable reinforcement, and you can step out of that loop.\n\nManaging other people's attention: you know how to create meanings that spread. To build communities around ideas. To shape narratives that people want to pass on. This is not manipulation; it is communication at a level most people never reach.\n\nAt this level, you can already build audiences, influence communities, and monetize your knowledge and connections directly, not through a platform's algorithm.\n\n## Level three: creating infrastructure\n\nThis is the architect's level. You do not just use existing networks; you build new ones.\n\nYou create protocols and design incentives that align participants' interests. You build DAO and tokenomics that make participants co-owners, not just users. You create communities with a shared identity and economy, where belonging has real value.\n\nAt this level, you yourself become a source of rules. You do not play by someone else's rules; you design the environment in which others will act.\n\nMost people never rise above the first level, and not because they are incapable. But because they do not know this ladder exists. Now you know.\n\n> Three levels of netocratic competence: understanding architecture → managing attention → creating infrastructure. Most people at the first level do not know about the second and third. You have just found out.\n\nChris Dixon, in *Read Write Own*, described the three eras of the internet through verbs: read (Web1), write (Web2), own (Web3). These are the three levels of netocracy. Most read. Fewer write. A few own. The window into the era of ownership is open right now.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1%80%D0%BE%D0%BA%20%D0%B4%D0%BB%D1%8F%20XXI%20%D0%B2%D0%B5%D0%BA%D0%B0%20%282018%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман, Дэвид Лайон — Liquid Surveillance (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netocracy", "education", "power", "Web3"], "x": 630.2, "y": 715.3, "angDeg": 64.3}, {"id": "srinivasan", "sceneIndex": 4, "type": "economy", "shortTitle": "Srinivasan", "era": "2022", "lensWeight": {"diagnosis": 2, "class": 2, "competence": 3, "exit": 5, "ethics": 2}, "title": "Srinivasan: network states", "insight": "Srinivasan: the next political shift is not the reform of states, but the creation of network communities with shared identity, economy and governance. Netocrats build parallel systems.", "thesis": "Srinivasan: the next political shift is not the reform of states, but the creation of network communities with shared identity, economy and governance. Netocrats build parallel systems.", "body": "## The most radical version of netocratic logic\n\nBalaji Srinivasan is a serial entrepreneur, former CTO of Coinbase, and one of the most provocative thinkers in the technology world. In 2022, he published the book *The Network State*, which offers the most radical version of netocratic logic: the next political shift is not the reform of existing states, but the creation of new ones.\n\nIt sounds like science fiction. Srinivasan insists: it is a rational forecast based on historical precedents.\n\nHis argument follows this logic. States are not eternal formations. They have appeared and disappeared throughout history. And the emergence of new states almost never followed a single pattern: revolution -> proclamation -> recognition. More often, it was the gradual building of identity, economy and community long before formal political status.\n\nIsrael as a state did not emerge in 1948; it had been built for decades before that as a community with a shared identity and a shared project. Singapore became what it is because Lee Kuan Yew created a system of incentives that attracted a certain type of people and pushed others away. Any country is first of all a coordination device with shared rules, identity and economy.\n\n## What a network state looks like\n\nSrinivasan describes a concrete sequence of steps.\n\nFirst, an online community with shared values. Not just followers on Twitter. A group of people united by real shared beliefs about how life should be organized: attitudes toward education, health, work and governance.\n\nThen, a shared economy. Tokens, DAO, mutual agreements about exchanging value inside the community. Members of the community begin to prefer trading with one another.\n\nThen, physical enclaves. Members of the community begin to live near one another, first as an experiment, then as a way of life. Not because they are forced to, but because it improves their quality of life: people with similar values are nearby.\n\nThen, diplomatic recognition. When the community reaches sufficient size and influence, states begin to interact with it as a political actor.\n\nThis is not a plan; it is a model. Some elements already exist: crypto communities with their own economy, calls to action for physical meetups, shared values and identity.\n\nTimothy Snyder, in *The Road to Unfreedom*, warns about the other side of the same coin: authoritarian regimes have also mastered network power. Not through censorship, but through disinformation, manipulation of attention, and the creation of information chaos in which truth and falsehood become indistinguishable. Netocracy is a neutral tool. It works both ways.\n\n> Srinivasan proposes the next level of netocratic logic: not just understanding and using networks, but building new political formations on their basis. Netocrats do not wait for existing systems to be reformed. They build parallel ones.\n\nThis does not necessarily mean creating a new state. For most netocrats, it means building communities with real identity and economy, not just audiences. Owning the infrastructure of your connections instead of renting it from platforms.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1%80%D0%BE%D0%BA%20%D0%B4%D0%BB%D1%8F%20XXI%20%D0%B2%D0%B5%D0%BA%D0%B0%20%282018%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман, Дэвид Лайон — Liquid Surveillance (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netocracy", "governance", "community", "networks"], "x": 369.8, "y": 715.3, "angDeg": 115.7}, {"id": "frankl", "sceneIndex": 5, "type": "privacy", "shortTitle": "Frankl", "era": "final choice", "lensWeight": {"diagnosis": 1, "class": 1, "competence": 2, "exit": 2, "ethics": 5}, "title": "Frankl and the final choice", "insight": "Frankl: the final freedom is the choice of one's attitude toward circumstances. You did not choose the conditions of the digital age. But you choose what to do with them. Understanding without ethics is a tool without a purpose.", "thesis": "Frankl: the final freedom is the choice of one's attitude toward circumstances. You did not choose the conditions of the digital age. But you choose what to do with them. Understanding without ethics is a tool without a purpose.", "body": "## The philosopher from the concentration camp\n\nViktor Frankl was an Austrian psychiatrist. In 1942, he was deported to Nazi concentration camps. He passed through Auschwitz, Dachau and other camps. He lost his wife, parents and brother. He spent three years in conditions that are hard to read about without a physical reaction.\n\nAfter being liberated in 1945, he wrote *Man's Search for Meaning* in nine days. It became one of the most influential books of the twentieth century, and one of the most important for understanding what it means to be human inside systems you did not choose.\n\nFrankl's key observation, made in conditions that are difficult even to imagine: a person's final freedom cannot be taken away. Everything else can be: physical freedom, property, loved ones, dignity in the eyes of others. But the freedom to choose one's attitude toward circumstances cannot be taken away. In any conditions, there remains a space between stimulus and response. And in that space lies human dignity.\n\n## Why Frankl is here\n\nWhy is a philosopher from a concentration camp in the final chapter of a course about the internet and netocracy?\n\nBecause this entire course has been about conditions you did not choose.\n\nYou did not choose to be born in the age of smartphones and algorithms. You did not choose the attention economy that monetizes your time without your conscious consent. You did not choose the architecture of social networks designed through Skinner's variable reinforcement. You did not choose the concentration of power in the hands of a few platforms.\n\nYou did not choose these conditions. But you choose what to do with this knowledge.\n\nFrankl wrote about a different context, one incomparably more brutal. But his principle is universal: the situation defines the circumstances; the person defines the response to the circumstances. Conditions do not make you part of the consumtariat or a netocrat. Your choice does.\n\n## Freedom without responsibility is not freedom\n\nThere is another dimension of Frankl that matters in this context.\n\nHe wrote: freedom without responsibility is arbitrariness. True freedom is freedom joined with responsibility for the consequences of your choices.\n\nTimothy Snyder warned that the same netocratic logic — understanding networks, managing attention, creating narratives — can be used to destroy democracy, spread disinformation, and manipulate people at scale. Authoritarian regimes understood this and use it.\n\nA netocrat who builds systems without understanding their consequences, without an ethical compass, reproduces the same problems we criticized in Web2 platforms. Only faster, because they understand the architecture better. And at a larger scale.\n\nUnderstanding is a tool. Like any tool, it has no ethics of its own. A hammer can be used to build or to destroy. Knowledge of network architecture can be used to create open systems that level opportunities, or to create more sophisticated systems of manipulation.\n\nIn the camp, Frankl observed both types of people: those who preserved dignity and helped others in inhuman conditions, and those who, in the same conditions, betrayed and exploited the weak. The conditions were the same. The choices were different.\n\n> Frankl formulated it this way: the final human freedom is the choice of one's attitude toward circumstances. You did not choose the conditions of the digital age. But you choose what to do with them. And how.\n\nThis is the course's final thought. Not technical. Not economic. Human. Netocracy is an open class; the barrier to entry is understanding. But understanding without ethics is a tool without a purpose. What you build depends only on you.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B8%D1%88%D0%B5%D0%BB%D1%8C%20%D0%A4%D1%83%D0%BA%D0%BE%20%E2%80%94%20%D0%94%D0%B8%D1%81%D1%86%D0%B8%D0%BF%D0%BB%D0%B8%D0%BD%D0%B0%20%D0%B8%20%D0%BD%D0%B0%D0%BA%D0%B0%D0%B7%D0%B0%D0%BD%D0%B8%D0%B5%20%281975%29", "linkType": "gbooks"}, {"title": "Юваль Ной Харари — 21 урок для XXI века (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AE%D0%B2%D0%B0%D0%BB%D1%8C%20%D0%9D%D0%BE%D0%B9%20%D0%A5%D0%B0%D1%80%D0%B0%D1%80%D0%B8%20%E2%80%94%2021%20%D1%83%D1%80%D0%BE%D0%BA%20%D0%B4%D0%BB%D1%8F%20XXI%20%D0%B2%D0%B5%D0%BA%D0%B0%20%282018%29", "linkType": "gbooks"}, {"title": "Зигмунт Бауман, Дэвид Лайон — Liquid Surveillance (2013)", "url": "https://www.google.com/search?tbm=bks&q=%D0%97%D0%B8%D0%B3%D0%BC%D1%83%D0%BD%D1%82%20%D0%91%D0%B0%D1%83%D0%BC%D0%B0%D0%BD%2C%20%D0%94%D1%8D%D0%B2%D0%B8%D0%B4%20%D0%9B%D0%B0%D0%B9%D0%BE%D0%BD%20%E2%80%94%20Liquid%20Surveillance%20%282013%29", "linkType": "gbooks"}, {"title": "Элвин Тоффлер — Третья волна (1980)", "url": "https://www.google.com/search?tbm=bks&q=%D0%AD%D0%BB%D0%B2%D0%B8%D0%BD%20%D0%A2%D0%BE%D1%84%D1%84%D0%BB%D0%B5%D1%80%20%E2%80%94%20%D0%A2%D1%80%D0%B5%D1%82%D1%8C%D1%8F%20%D0%B2%D0%BE%D0%BB%D0%BD%D0%B0%20%281980%29", "linkType": "gbooks"}, {"title": "Крис Диксон — Read Write Own (2024)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9A%D1%80%D0%B8%D1%81%20%D0%94%D0%B8%D0%BA%D1%81%D0%BE%D0%BD%20%E2%80%94%20Read%20Write%20Own%20%282024%29", "linkType": "gbooks"}, {"title": "Виктор Франкл — Человек в поисках смысла (1946)", "url": "https://www.google.com/search?tbm=bks&q=%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80%20%D0%A4%D1%80%D0%B0%D0%BD%D0%BA%D0%BB%20%E2%80%94%20%D0%A7%D0%B5%D0%BB%D0%BE%D0%B2%D0%B5%D0%BA%20%D0%B2%20%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%B0%D1%85%20%D1%81%D0%BC%D1%8B%D1%81%D0%BB%D0%B0%20%281946%29", "linkType": "gbooks"}], "tags": ["netocracy", "philosophy", "ethics", "freedom"], "x": 207.5, "y": 511.8, "angDeg": 167.1}, {"id": "luminara", "sceneIndex": 6, "type": "power", "shortTitle": "What next?", "era": "→action", "lensWeight": {"diagnosis": 2, "class": 3, "competence": 5, "exit": 4, "ethics": 4}, "title": "Luminara: you finished reading. What's next?", "insight": "You have completed the first level of netocratic competence: understanding architecture. The second level: attention management. The third: creating infrastructure. The next course is for those who choose to act.", "thesis": "You have completed the first level of netocratic competence: understanding architecture. The second level: attention management. The third: creating infrastructure. The next course is for those who choose to act.", "body": "## The hidden goal of this course\n\nThis course was called *Foundations of the New Internet*. Eight chapters. From Shannon's mathematics to Nakamoto's blockchain. From the first forums to TikTok. From the dream of free knowledge to surveillance capitalism, and from it to the new architecture Web3 is building.\n\nBut the course had a hidden goal, which can now be named directly.\n\nWe were not just explaining how the internet works. We were preparing you for a choice.\n\nA choice between the consumtariat and netocracy. Between those who live in networks without understanding their architecture, and those who understand and act consciously. Between those who produce value for platforms while receiving nothing except the illusion of participation, and those who build platforms, manage their share in them, or at least understand what they pay for \"free\" services.\n\n## What you received from this course\n\nBard and Soderqvist described the first level of netocratic competence as understanding architecture. You have passed it.\n\nYou understand why information became the main resource of power, from Shannon and Castells. You know how Web1 created the open internet and why its openness was used against users. You understand the mechanics of the attention economy and surveillance capitalism, from Simon to Zuboff. You see how algorithms create filter bubbles and polarize society, and why this is not malicious intent but an architectural consequence of optimization for engagement. You know the difference between Web 3.0 and Web3. You understand what a private key is and why \"not your keys — not your coins\". You know how smart contracts, DeFi and DAO work. You understand what netocracy and the consumtariat are, and what level you are at now.\n\nThis is the first level. Necessary. But not sufficient.\n\n## The next step\n\nChris Dixon described three eras of the internet: read, write, own. You have read a course about these eras. Now it is time to move to the next verb.\n\nThe second level of netocratic competence is attention management. The ability to create meanings, build communities, and monetize knowledge and connections directly. The ability not to hand your attention over to algorithms, but to direct it consciously.\n\nThe third level is creating infrastructure. Protocols, tokenomics, DAO, digital identity. The architecture of systems in which you set the rules yourself.\n\nLuminara is building the next courses precisely for this. Not so that you \"understand crypto\" in the abstract. But so that you can act at the second and third levels. Understand concrete tools. Use them. Build on their basis.\n\nBard and Soderqvist wrote: netocracy is an open class. The barrier to entry is understanding. And the desire to keep learning further than most people.\n\nYou have finished the free course to the end. That is already a signal: most people do not get there. Most scroll without reading. Most consume and do not ask questions.\n\nYou ask them.\n\n> Frankl wrote: in any circumstances, a person has the final freedom — the choice of one's attitude toward them. You did not choose the conditions of the digital age. But you choose what to do with them. The next course is for those who choose to act.\n\nWelcome to Luminara.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%20%D0%91%D0%B0%D1%80%D0%B4%2C%20%D0%AF%D0%BD%20%D0%97%D0%BE%D0%B4%D0%B5%D1%80%D0%BA%D0%B2%D0%B8%D1%81%D1%82%20%E2%80%94%20%D0%9D%D0%B5%D1%82%D0%BE%D0%BA%D1%80%D0%B0%D1%82%D0%B8%D1%8F%20%282000%29", "linkType": "gbooks"}, {"title": "Мануэль Кастельс — Власть коммуникации (2009)", "url": "https://www.google.com/search?tbm=bks&q=%D0%9C%D0%B0%D0%BD%D1%83%D1%8D%D0%BB%D1%8C%20%D0%9A%D0%B0%D1%81%D1%82%D0%B5%D0%BB%D1%8C%D1%81%20%E2%80%94%20%D0%92%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BA%D0%BE%D0%BC%D0%BC%D1%83%D0%BD%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D0%B8%20%282009%29", "linkType": "gbooks"}, {"title": "Тимоти Снайдер — Дорога к несвободе (2018)", "url": "https://www.google.com/search?tbm=bks&q=%D0%A2%D0%B8%D0%BC%D0%BE%D1%82%D0%B8%20%D0%A1%D0%BD%D0%B0%D0%B9%D0%B4%D0%B5%D1%80%20%E2%80%94%20%D0%94%D0%BE%D1%80%D0%BE%D0%B3%D0%B0%20%D0%BA%20%D0%BD%D0%B5%D1%81%D0%B2%D0%BE%D0%B1%D0%BE%D0%B4%D0%B5%20%282018%29", "linkType": "gbooks"}, {"title": "Баладжи Шринивасан — The Network State (2022)", "url": "https://www.google.com/search?tbm=bks&q=%D0%91%D0%B0%D0%BB%D0%B0%D0%B4%D0%B6%D0%B8%20%D0%A8%D1%80%D0%B8%D0%BD%D0%B8%D0%B2%D0%B0%D1%81%D0%B0%D0%BD%20%E2%80%94%20The%20Network%20State%20%282022%29", "linkType": "gbooks"}, {"title": "Мишель Фуко — Дисциплина и наказание (1975 "}, {"id": "exit", "label": "Вихід", "accent": "#c084fc", "description": "Шрінівасан: мережеві держави й паралельні системи як наступний зсув."}, {"id": "ethics", "label": "Етика", "accent": "#fbbf24", "description": "Франкл: остання свобода — вибір ставлення. Розуміння без етики порожнє."}], "nodes": [{"id": "toffler", "sceneIndex": 0, "type": "power", "shortTitle": "Тоффлер", "era": "1980", "lensWeight": {"diagnosis": 5, "class": 3, "competence": 1, "exit": 2, "ethics": 1}, "title": "Тоффлер мав рацію — але не до кінця", "insight": "Тоффлер вгадав третю хвилю, але помилився у висновку: децентралізація інформації створила не децентралізацію влади, а новий тип її концентрації — невидимий і тому небезпечніший.", "thesis": "Тоффлер вгадав третю хвилю, але помилився у висновку: децентралізація інформації створила не децентралізацію влади, а новий тип її концентрації — невидимий і тому небезпечніший.", "body": "## Петля замкнулася\n\nМи почали цей курс із Тоффлера. Повернімося до нього — щоб зрозуміти, що він вгадав, що ні, і чому це важливо.\n\nУ 1980 році Елвін Тоффлер написав «Третю хвилю» — книжку про неминучу трансформацію індустріального світу. Його передбачення були сміливими для свого часу. Виробництво стане персоналізованим — кінець епохи стандартних товарів для всіх. Межа між виробником і споживачем зітреться — з’явиться prosumer, той, хто одночасно створює і споживає. Традиційні ієрархії — корпорації, держави, профспілки — будуть зруйновані новими мережевими структурами.\n\nУсе це справдилося. Алгоритм Netflix добирає контент індивідуально. Користувач YouTube одночасно дивиться і створює. Стартап із двох людей може конкурувати з корпорацією. Анонімний розробник створює протокол вартістю в мільярди — і це реальність 2020-х.\n\nАле Тоффлер припустився принципової помилки у висновку. Він думав, що децентралізація інформації приведе до децентралізації влади. Логіка здавалася залізною: якщо знання більше не є монополією еліти — влада теж перестане бути монополією.\n\nЦього не сталося.\n\n## Децентралізація за формою, концентрація за суттю\n\nВлада децентралізувалася — але не так, як думав Тоффлер. Вона перейшла від держав до корпорацій. Від корпорацій до платформ. Від платформ — до тих, хто вміє управляти алгоритмами й увагою.\n\nП’ять технологічних компаній контролюють більшу частину того, що бачать мільярди людей щодня. Кілька алгоритмів визначають, які ідеї поширюються, а які залишаються невидимими. Це децентралізація за формою — ніхто не сидить у Кремлі й не вирішує, що транслювати. І концентрація за суттю — кілька архітекторів алгоритмів визначають інформаційну реальність планети.\n\nТоффлер також передбачив prosumer — людину, яка одночасно виробляє і споживає. Він мав рацію і тут. Але не передбачив, що ця відмінність стане новим класовим розломом. Що одні вироблятимуть цінність у мережах — і отримуватимуть її назад: через токени, через вплив, через дохід. А інші вироблятимуть цінність у мережах — і не отримуватимуть нічого, крім ілюзії участі.\n\nМануель Кастельс підтвердив цю логіку з академічною точністю: у мережевому суспільстві влада — це влада над комунікацією. Хто контролює, які повідомлення проходять через мережі, у якому контексті, з якою вагою — той формує колективну свідомість. Це не пропаганда радянського типу. Це архітектура уваги. Алгоритм не говорить, що думати. Він вирішує, які думки ти зустрічатимеш найчастіше.\n\n> Тоффлер у 1980-му точно передбачив третю хвилю. Але помилився у висновку: децентралізація інформації не привела до децентралізації влади. Вона створила новий тип концентрації — невидимий і тому небезпечніший.\n\nЦя помилка важлива. Тому що саме її виправлення — центральне завдання Web3. Не просто технологічна децентралізація. Реальна децентралізація влади: через відкриті протоколи, через володіння активами, через прозорі правила в code.", "sources": [{"title": "Александр Бард, Ян Зодерквист — Нетократия (2000)", "url": "https://www.google.com/search?tbm=bks&q=%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D
